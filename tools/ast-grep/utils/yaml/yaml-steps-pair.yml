# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: yaml-steps-pair
language: yamllang
utils:
    job-map:
        kind: &map block_mapping, flow_mapping
        inside:
            kind: &node block_node, flow_node
            inside:
                kind: block_mapping_pair, flow_pair
                inside:
                    kind: *map
                    inside:
                        kind: *node
                        inside: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?jobs["'']?$'}, value: {kind: *node}}}, inside: &root-map {kind: 'document > :is(block_node, flow_node) > :is(block_mapping, flow_mapping)'}}
    composite-map:
        kind: *map
        inside: {kind: *node, inside: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?runs["'']?$'}, value: {kind: *node}}}, inside: *root-map}}
        has: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?using["'']?$'}, value: {has: {regex: '^["'']?(?i-u:composite)["'']?$'}}}}}
rule:
    matches: {yaml-resolved-pair: {key: {regex: '^["'']?steps["'']?$'}, value: {kind: *node}}}
    inside: {any: [{matches: job-map}, {matches: composite-map}]}
