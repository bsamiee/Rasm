# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-self-assigning-upsert
language: sql
severity: error
rule:
    kind: upsert_clause
    all:
        - has: {field: assignment, kind: set_assignment}
        - inside:
            kind: insert_statement
            any:
                - has: {field: alias, pattern: $TABLE}
                - all: [{not: {has: {field: alias, pattern: $_}}}, {has: {field: target, has: {field: name, pattern: $TABLE}}}]
        - not:
            has:
                kind: set_assignment
                not:
                    all:
                        - has: {field: column, pattern: $COLUMN}
                        - has:
                            field: value
                            kind: column_reference
                            all:
                                - has: {field: name, pattern: $COLUMN}
                                - any: [{not: {has: {field: table, pattern: $_}}}, {has: {field: table, pattern: $TABLE}}]
message: 'Upsert rewrites each conflicting row with current values'
note: 'Use `on conflict (<key>) do nothing returning <columns>` and select existing rows in one transaction'
