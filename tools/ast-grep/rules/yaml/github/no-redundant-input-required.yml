# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-redundant-input-required
language: yaml
severity: error
files:
    - .github/workflows/*.{yml,yaml}
    - .github/actions/**/action.{yml,yaml}
utils:
    inputs:
        kind: block_mapping_pair, flow_pair
        has:
            field: key
            regex: ^(inputs|"inputs"|'inputs')$
        any:
            - inside:
                matches: yaml-document-mapping
                has:
                    kind: block_mapping_pair, flow_pair
                    has:
                        field: key
                        regex: ^(runs|"runs"|'runs')$
            - inside:
                kind: block_mapping, flow_mapping
                inside:
                    kind: block_node, flow_node
                    inside:
                        kind: block_mapping_pair, flow_pair
                        has:
                            field: key
                            regex: ^(workflow_dispatch|workflow_call|"workflow_dispatch"|"workflow_call"|'workflow_dispatch'|'workflow_call')$
                        inside:
                            kind: block_mapping, flow_mapping
                            inside:
                                kind: block_node, flow_node
                                inside:
                                    kind: block_mapping_pair, flow_pair
                                    has:
                                        field: key
                                        regex: ^(on|"on"|'on')$
                                    inside:
                                        matches: yaml-document-mapping
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - matches: yaml-removable-member
        - has:
            field: key
            pattern: $KEY
            regex: ^(required|"required"|'required')$
        - has:
            field: value
            regex: ^(false|False|FALSE)$
        - inside:
            kind: block_mapping, flow_mapping
            inside:
                kind: block_node, flow_node
                inside:
                    kind: block_mapping_pair, flow_pair
                    inside:
                        kind: block_mapping, flow_mapping
                        inside:
                            kind: block_node, flow_node
                            inside:
                                matches: inputs
labels:
    KEY:
        style: primary
fix:
    template: ''
    expandEnd:
        regex: ^,$
message: 'Optional inputs already default to required: false'
note: Remove the repeated required flag, keeping the input's description, type, and default
