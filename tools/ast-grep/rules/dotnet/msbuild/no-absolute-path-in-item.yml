# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-absolute-path-in-item
language: xml
severity: error
rule:
    matches:
        msbuild-metadata:
            name: {regex: "^(Include|Exclude|Update|Remove|Project|Path|HintPath|SourceFiles|DestinationFiles|DestinationFolder|Directories|Files|File|Inputs|Outputs|WorkingDirectory)$"}
            value: {regex: '^["'']?([A-Za-z]:[\\/]|~[\\/]|/[A-Za-z0-9_.-])'}
    not: {matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}}
message: Item path is absolute and resolves on the machine that wrote it alone
note: 'Compose the path, `$([MSBuild]::NormalizePath(''$(MSBuildThisFileDirectory)'', ''<segment>''))`'
