# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-conversion-factor-literal
language: rust
severity: error
rule:
    kind: float_literal
    pattern: $FACTOR
    matches: rust-conversion-factor
message: '`$FACTOR` spells a unit conversion factor'
note: 'Hold the value as a uom quantity, `uom::si::f64::{Length, Mass, Force, Pressure, ThermodynamicTemperature}` built with `new::<foot>`, `new::<inch>`, `new::<mile>`, `new::<pound>`, `new::<pound_force>`, `new::<psi>`, or `new::<degree_celsius>` and read with `get::<unit>`, the dimension checks every conversion at compile time. Degree and radian factors belong to `no-angle-conversion-by-hand`'
