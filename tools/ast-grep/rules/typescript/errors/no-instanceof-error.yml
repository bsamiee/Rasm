# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores:
    - apps/web/portfolio/**
    - libs/typescript/creative-cloud/indesign/**
    - libs/typescript/creative-cloud/uxp/**
    - libs/typescript/web/hosting/**
    - libs/typescript/web/media/**
    - libs/typescript/web/ui/**
    - plugins/function-hooks/hooks/**
rule:
    any:
        - pattern: $VALUE instanceof $ERROR
        - pattern: $ERROR.prototype.isPrototypeOf($VALUE)
        - pattern: $OBJECT.prototype.isPrototypeOf.call($ERROR.prototype, $VALUE)
constraints:
    ERROR: {regex: '(^|\.)Error$', matches: typescript-global-member}
    OBJECT: {regex: '(^|\.)Object$', matches: typescript-global-member}
message: 'Error test on `$VALUE` walks `$ERROR.prototype` chain of the running realm alone'
note: 'Call `Error.isError(<value>)`'
