# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    library-code:
        matches: {csharp-owner-member: {type: {regex: '^ErrorCodes$'}, member: {regex: ^}}}
    coded-owner:
        any:
            - kind: primary_constructor_base_type
              has: {field: type, regex: 'Expected|Exceptional', matches: languageext-error-subtype}
              inside: {kind: base_list, inside: {matches: languageext-error-record}}
            - kind: constructor_initializer
              has: {regex: '^base$'}
              inside: {kind: constructor_declaration, inside: {kind: declaration_list, inside: {matches: languageext-error-record}}}
            - kind: object_creation_expression
              has: {field: type, regex: 'Expected|Exceptional', matches: languageext-error-subtype}
    error-new:
        kind: invocation_expression
        all:
            - has: {field: function, regex: 'New'}
            - matches: {csharp-owner-call: {type: {regex: '^Error$'}, member: {regex: '^New$'}}}
    code-argument:
        kind: argument
        all:
            - inside: {kind: argument_list, inside: {matches: coded-owner}}
            - any:
                - all:
                    - nthChild: {position: 2, ofRule: {kind: argument}}
                    - matches: csharp-positional-argument
                - has: {field: name, regex: '^code$'}
            - not: {has: {any: [{pattern: '0'}, {matches: library-code}]}}
    numbered-code:
        kind: argument
        all:
            - has:
                any:
                    - kind: integer_literal
                    - kind: cast_expression
                      has: {field: type, regex: '^int$'}
            - inside:
                kind: argument_list
                all:
                    - inside: {matches: error-new}
                    - has: {kind: argument, nthChild: {position: 2, ofRule: {kind: argument}}}
            - nthChild: {position: 1, ofRule: {kind: argument}}
            - matches: csharp-positional-argument
    code-cast:
        kind: cast_expression
        all:
            - has: {field: type, regex: '^int$'}
            - has: {field: value, kind: member_access_expression, has: {field: expression, pattern: {context: 'class $CODE;', selector: identifier}}}
            - inside: {any: [{matches: code-argument}, {matches: numbered-code}]}
rule:
    any:
        - kind: argument
          all:
            - inside: {kind: argument_list, inside: {any: [{matches: coded-owner}, {matches: error-new}]}}
            - pattern: {context: 'f($CODE);', selector: argument}
            - any:
                - matches: code-argument
                - matches: numbered-code
        - kind: enum_declaration
          all:
            - has: {field: name, pattern: {context: 'class $CODE;', selector: identifier}}
            - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: code-cast}}
message: '`$CODE` supplies a custom error code'
note: 'Pass code `0` and branch on the package error `Reason`, `Error.New(<message>)` where no consumer branches, `ErrorCodes` for LanguageExt failures'
