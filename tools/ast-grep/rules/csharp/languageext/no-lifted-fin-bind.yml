# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    relift:
        any:
            - pattern: {context: 'class C { object F() => $IO.lift($VALUE); }', selector: invocation_expression, strictness: cst}
            - pattern: {context: 'class C { object F() => $IO.lift<$_TYPE>($VALUE); }', selector: invocation_expression, strictness: cst}
            - pattern: {context: 'class C { object F() => $IO.lift(() => $VALUE); }', selector: invocation_expression, strictness: cst}
            - pattern: {context: 'class C { object F() => $IO.lift<$_TYPE>(() => $VALUE); }', selector: invocation_expression, strictness: cst}
    lift-group:
        matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^lift$'}}}
    pure-group:
        matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^pure$'}}}
    fail-group:
        matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^fail$'}}}
    returned:
        any:
            - matches: relift
            - matches: case-relift
            - kind: block
              matches: csharp-single-return
              has: {kind: return_statement, has: {any: [{matches: relift}, {matches: case-relift}]}}
    succ-arm:
        any:
            - matches: pure-group
            - matches:
                csharp-unary-callback:
                    parameter: {pattern: $SUCC}
                    body: {pattern: {context: 'class C { object F() => IO.pure($SUCC); }', selector: invocation_expression, strictness: cst}}
    fail-arm:
        any:
            - matches: fail-group
            - matches:
                csharp-unary-callback:
                    parameter: {pattern: $FAILED}
                    body: {kind: invocation_expression, all: [{has: {field: function, matches: fail-group}}, {has: {field: arguments, has: {kind: argument, pattern: {context: 'f($FAILED);', selector: argument}}, not: {has: {kind: argument, nthChild: 2}}}}]}
    case-relift:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: expression, pattern: $VALUE}}, {has: {field: name, regex: '^Match$'}}]}
            - has:
                field: arguments
                all:
                    - has: {kind: argument, any: [{all: [{has: {field: name, regex: '^Succ$'}}, {has: {matches: succ-arm}}]}, {all: [{nthChild: 1}, {matches: csharp-positional-argument}, {has: {matches: succ-arm}}]}]}
                    - has: {kind: argument, any: [{all: [{has: {field: name, regex: '^Fail$'}}, {has: {matches: fail-arm}}]}, {all: [{nthChild: 2}, {matches: csharp-positional-argument}, {has: {matches: fail-arm}}]}]}
                    - not: {has: {kind: argument, nthChild: 3}}
    relay:
        kind: identifier
        all:
            - pattern: {context: 'class $RELAY;', selector: identifier}
            - inside:
                kind: compilation_unit
                stopBy: end
                has:
                    stopBy: end
                    kind: method_declaration, local_function_statement
                    all:
                        - has: {field: name, pattern: {context: 'class $RELAY;', selector: identifier}}
                        - not: {has: {field: type_parameters, kind: type_parameter_list}}
                        - has:
                            field: parameters
                            has:
                                kind: parameter
                                has: {field: name, pattern: {context: 'class $VALUE;', selector: identifier}}
                                not: {has: {kind: 'modifier, attribute_list'}}
                            not: {has: {kind: parameter, nthChild: 2}}
                        - has:
                            field: body
                            any:
                                - kind: arrow_expression_clause
                                  has: {any: [{matches: relift}, {matches: case-relift}]}
                                - kind: block
                                  matches: returned
    lifted-source:
        pattern: {context: 'class C { object F() => from $VALUE in $IO.lift<$FIN>($_THUNK) select 0; }', selector: from_clause, strictness: cst}
    relift-clause:
        kind: from_clause
        all:
            - has: {field: name, pattern: {context: 'class $X;', selector: identifier}}
            - has: {kind: invocation_expression, matches: relift}
    fin-type:
        any:
            - matches: {csharp-generic-type: {name: {regex: '^Fin$'}, list: {kind: type_argument_list}}}
            - matches: {csharp-generic-type: {name: {regex: '^Either$'}, list: {has: {nthChild: 1, matches: {csharp-type-name: {name: {regex: '^Error$'}}}}}}}
    lifted-fin:
        kind: invocation_expression
        has:
            field: function
            kind: member_access_expression
            all:
                - has: {field: expression, matches: {csharp-type-name: {name: {regex: '^IO$'}}}}
                - has: {field: name, kind: generic_name, all: [{has: {kind: identifier, regex: '^lift$'}}, {has: {kind: type_argument_list, has: {nthChild: 1, matches: fin-type}}}]}
    lifted-local:
        kind: identifier
        pattern: {context: 'class $LIFTED;', selector: identifier}
        inside:
            stopBy: end
            kind: block
            has:
                kind: local_declaration_statement
                has: {kind: variable_declaration, has: {kind: variable_declarator, all: [{has: {field: name, pattern: {context: 'class $LIFTED;', selector: identifier}}}, {has: {matches: lifted-fin}}]}}
    held-receiver:
        any:
            - matches: lifted-fin
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^As$'}}, {has: {field: expression, matches: lifted-fin}}]}
                - matches: csharp-argumentless-call
            - matches: lifted-local
    held-bind:
        kind: argument
        any:
            - has: {matches: relay}
            - all:
                - has: {kind: member_access_expression, matches: lift-group}
                - inside: {kind: argument_list, inside: {kind: invocation_expression, has: {field: function, has: {field: expression, matches: lifted-local}}}}
            - all:
                - matches: {csharp-unary-callback: {parameter: {pattern: $VALUE}, body: {matches: returned}}}
                - inside: {kind: argument_list, inside: {kind: invocation_expression, has: {field: function, has: {field: expression, matches: lifted-local}}}}
rule:
    any:
        - kind: invocation_expression
          all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Bind$'}}, {has: {field: expression, matches: held-receiver}}]}
            - has: {field: arguments, not: {has: {kind: argument, nthChild: 2}}}
            - not: {not: {has: {field: arguments, has: {kind: argument, matches: held-bind}}}}
        - all:
            - has: {field: function, regex: 'Bind$'}
            - any:
                - pattern:
                    context: 'class C { object F() => $IO.lift<$FIN>($_THUNK).Bind($BIND); }'
                    selector: invocation_expression
                    strictness: cst
                - pattern:
                    context: 'class C { object F() => $IO.lift<$FIN>($_THUNK).As().Bind($BIND); }'
                    selector: invocation_expression
                    strictness: cst
        - kind: query_expression
          all:
            - has: {kind: from_clause, nthChild: 1, matches: lifted-source}
            - has: {kind: from_clause, nthChild: 2, matches: relift-clause}
            - has: {kind: select_clause, nthChild: 3, has: {pattern: $X}}
            - not: {has: {nthChild: 4}}
        - kind: from_clause
          all:
            - matches: lifted-source
            - precedes:
                matches: relift-clause
                not: {precedes: {stopBy: end, has: {stopBy: end, kind: identifier, pattern: {context: 'class $VALUE;', selector: identifier}}}}
            - not:
                all:
                    - nthChild: 1
                    - inside: {kind: query_expression, not: {has: {nthChild: 4}}, has: {kind: select_clause, nthChild: 3, has: {pattern: $X}}}
constraints:
    IO: {matches: {csharp-type-name: {name: {regex: '^IO$'}}}}
    FIN: {matches: fin-type}
    BIND:
        any:
            - kind: argument
              has: {kind: member_access_expression, matches: lift-group}
            - matches:
                csharp-unary-callback:
                    parameter: {pattern: $VALUE}
                    body: {matches: returned}
message: '`IO.lift` of a `Fin` or `Either` result binds `IO.lift` again to unwrap it'
note: 'Call `IO.lift<A>(<thunk>)` with the thunk returning `Fin<A>` or `Either<Error, A>`'
