# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-reader-tsx
language: tsxlang
severity: error
utils:
    literal:
        any:
            - kind: string, number, true, false, null
            - kind: undefined
              matches: typescript-global-reference
            - kind: template_string
              not: {has: {kind: template_substitution}}
            - kind: unary_expression, binary_expression
              not: {has: {pattern: $_, not: {matches: literal}}}
            - kind: as_expression, satisfies_expression, parenthesized_expression
              has: {nthChild: 1, matches: literal}
    reference:
        kind: identifier, shorthand_property_identifier
        pattern: $NAME
        not:
            any:
                - inside: {kind: 'variable_declarator, function_declaration', field: name}
                - inside: {kind: import_statement, stopBy: end}
        matches: {typescript-local-binding: {owner: {kind: program}}}
    holds-reference:
        any: [{matches: reference}, {has: {stopBy: end, matches: reference}}]
    entry:
        any:
            - has: {field: name, pattern: $ENTRY}
            - inside: {kind: variable_declarator, stopBy: end, has: {field: name, pattern: $ENTRY}}
        inside:
            kind: program
            stopBy: end
            has:
                kind: 'expression_statement, if_statement, for_statement, for_in_statement, while_statement, try_statement, switch_statement'
                has: {stopBy: {matches: typescript-function-boundary}, kind: identifier, pattern: $ENTRY}
    reader:
        pattern: $READER
        all:
            - matches: typescript-function-boundary
            - not: {inside: {stopBy: end, matches: typescript-function-boundary}}
            - any: [{pattern: $UNIT, inside: {kind: program}}, {inside: {stopBy: end, pattern: $UNIT, inside: {kind: program}}}]
            - not: {has: {field: name, pattern: $NAME}}
            - not: {inside: {kind: variable_declarator, stopBy: end, has: {field: name, pattern: $NAME}}}
            - not: {matches: entry}
    outside-reader:
        not: {inside: {stopBy: end, all: [{matches: typescript-function-boundary}, {pattern: $READER}, {any: [{pattern: $UNIT, inside: {kind: program}}, {inside: {stopBy: end, pattern: $UNIT, inside: {kind: program}}}]}]}}
    holder:
        pattern: $HOLDER
        any:
            - kind: variable_declarator
              inside: {matches: typescript-module-constant}
            - kind: public_field_definition
              not: {inside: {stopBy: end, matches: typescript-function-boundary}}
    level:
        any: [{matches: typescript-control-flow}, {matches: typescript-function-boundary}]
rule:
    all:
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - has: {field: value, matches: literal}
            - inside: {kind: lexical_declaration, all: [{has: {field: kind, regex: '^const$'}}, {inside: {kind: program}}]}
        - any:
            - inside:
                kind: program
                stopBy: end
                all:
                    - has: {stopBy: end, matches: reference, inside: {stopBy: end, matches: reader}}
                    - not: {has: {stopBy: end, all: [{matches: reference}, {any: [{matches: outside-reader}, {inside: {stopBy: &body {kind: statement_block, inside: {matches: typescript-function-boundary}}, matches: level, inside: {stopBy: *body, matches: level}}}]}]}}
            - all:
                - not: {has: {field: value, any: [{kind: number}, {has: {stopBy: end, kind: number}}]}}
                - inside:
                    kind: program
                    stopBy: end
                    all:
                        - has: {stopBy: end, all: [{matches: reference}, {not: {inside: {stopBy: end, matches: typescript-function-boundary}}}, {inside: {stopBy: end, matches: holder}}]}
                        - not: {has: {stopBy: end, all: [{matches: reference}, {not: {inside: {stopBy: end, matches: holder}}}]}}
                        - not: {has: {stopBy: end, matches: holder, has: {stopBy: end, matches: holds-reference, precedes: {stopBy: end, matches: holds-reference}}}}
message: '`$NAME` has one reader'
note: 'Move the literal into its consuming function or field initializer'
labels:
    READER: {style: secondary, message: Only reader}
    HOLDER: {style: secondary, message: Only reader}
