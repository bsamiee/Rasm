id: msbuild-group
language: xml
role: item
symbolType: object
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        has: {kind: Name, regex: "^(PropertyGroup|ItemGroup)$"}
    inside:
        kind: element
        inside: {kind: document}
        has:
            kind: STag
            has: {kind: Name, regex: "^Project$"}
        stopBy:
            not:
                any:
                    - kind: content
                    - kind: element
                      has:
                        kind: STag
                        has: {kind: Name, regex: "^(Choose|When|Otherwise)$"}
transform:
    LABELED: {replace: {source: $TAG, replace: '^<(\w+)(?:[\s\S]*\sLabel=["'']([^"'']*)["''])?[\s\S]*$', by: '$1 $2'}}
    LINE: {replace: {source: $LABELED, replace: '\s*\n\s*', by: ' '}}
    NAME: {replace: {source: $LINE, replace: '\s+$', by: ''}}
name: $NAME
signature: $TAG
isExported: false
