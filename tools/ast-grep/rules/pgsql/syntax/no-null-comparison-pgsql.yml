# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pgsql
severity: error
rule:
    kind: a_expr
    pattern: $COMPARISON
    has: {field: operator, regex: '^(=|<>|!=)$'}
    any:
        - has: {field: left, matches: pgsql-null}
        - has: {field: right, matches: pgsql-null}
message: '`$COMPARISON` yields NULL for every row, a filter keeps none of them'
note: 'Test absence with `is null` or `is not null`, and pair two nullable operands with `is not distinct from`'
