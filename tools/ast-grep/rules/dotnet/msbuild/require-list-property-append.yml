# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-list-property-append
language: xml
severity: error
rule:
    # The name and the text regex hold one list of the semicolon-valued properties, an XML name binds no metavariable
    matches: {msbuild-property: {name: {regex: '^(NoWarn|(MSBuild)?Warnings(As|NotAs)(Errors|Messages)|DefineConstants|DefaultItemExcludes|InterceptorsNamespaces|InterceptorsPreviewNamespaces)$'}}}
    # No text opens with the property's own value, an empty element and a whitespace value drop the list the same way
    not: {has: {kind: content, has: {kind: CharData, regex: '^\s*\$\((NoWarn|(MSBuild)?Warnings(As|NotAs)(Errors|Messages)|DefineConstants|DefaultItemExcludes|InterceptorsNamespaces|InterceptorsPreviewNamespaces)[).]'}}}
message: The list-valued property assignment omits the property's own value and drops every entry the SDK and earlier files added
note: Start the value with $(Name);
