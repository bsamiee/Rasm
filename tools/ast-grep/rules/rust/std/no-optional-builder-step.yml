# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-optional-builder-step
language: rustlang
severity: error
rule:
    any:
        - kind: match_expression
          any:
            - pattern: 'match $OPTION { Some($ITEM) => $BUILDER.$STEP($$$ARGS), None => $BUILDER, }'
            - pattern: 'match $OPTION { None => $BUILDER, Some($ITEM) => $BUILDER.$STEP($$$ARGS), }'
        - kind: if_expression
          pattern: 'if let Some($ITEM) = $OPTION { $BUILDER.$STEP($$$ARGS) } else { $BUILDER }'
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^fold$'}}
            - has:
                field: arguments
                all:
                    - has:
                        nthChild: 2
                        kind: closure_expression
                        any:
                            - pattern: '|$BUILDER, $ITEM| $BUILDER.$STEP($ITEM)'
                            - pattern: '|$BUILDER, $ITEM| $BUILDER.$STEP($ITEM.$CONVERT())'
                    - not: {has: {nthChild: 3}}
constraints:
    BUILDER: {kind: identifier}
    ITEM: {kind: identifier}
message: '`$BUILDER` takes `.$STEP` by hand through a decision or closure over `$ITEM`'
note: 'Fold items with `<Builder>::<step>`, mapping item conversions before the fold'
