id: csharp-import
language: csharplang
role: item
symbolType: module
utils:
    failed: {has: {stopBy: end, kind: ERROR}}
    named: {pattern: $NAME}
rule:
    any:
        - {kind: using_directive, pattern: $DECLARATION, all: [{not: {matches: failed}}, {has: {matches: named, nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}}}]}
        - {kind: extern_alias_directive, pattern: $DECLARATION, all: [{not: {matches: failed}}, {has: {field: name, matches: named}}]}
        - {kind: file_based_directive, pattern: $DECLARATION, has: {field: kind, regex: 'sdk|package|project|ref'}, all: [{has: {field: name, matches: named}}]}
        - kind: alias_qualified_name, generic_name, identifier, qualified_name
          matches: named
          all:
            - any: [{inside: {kind: using_directive, matches: failed, pattern: $DECLARATION}, nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, ERROR'}}}}, {inside: {kind: extern_alias_directive, field: name, matches: failed, pattern: $DECLARATION}}]
            - not: {matches: failed}
rewriters:
    - {id: broken, rule: {kind: ERROR}, fix: "\n"}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    CLEAN: {replace: {source: $NAME, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*', by: ''}}
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*|#(?:if|endif)[^\n]*', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
    HEADER: rewrite($DECLARATION, rewriters=[broken, trivia])
name: $CLEAN
signature: $SIGNATURE
isImport: true
isExported: false
---
id: csharp-file-property
language: csharplang
role: item
symbolType: property
rule:
    kind: file_based_directive
    has: {field: kind, regex: property}
    all: [{has: {field: name, pattern: {context: '#:property $NAME=x', selector: directive_name}}}]
name: $NAME
isExported: false
---
id: csharp-file-selection
language: csharplang
role: item
symbolType: file
rule:
    kind: file_based_directive
    has: {field: kind, regex: 'include|exclude'}
    all: [{has: {field: name, pattern: {context: '#:include $NAME', selector: directive_name}}}]
name: $NAME
isImport: {has: {field: kind, regex: include}}
isExported: false
---
id: csharp-attribute
language: csharplang
role: item
symbolType: property
rule: {kind: attribute, has: {field: name, pattern: $NAME}, all: [{inside: {kind: global_attribute, has: {regex: '^(?:assembly|module)$', pattern: $$TARGET}}}, {pattern: $ATTRIBUTE}]}
transform:
    CLEAN: {replace: {source: $ATTRIBUTE, replace: '[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: '[$TARGET: $CLEAN]'
isExported: false
---
id: csharp-section
language: csharplang
role: item
symbolType: namespace
rule: {kind: comment, regex: '^// --- \[[0-9A-Z_]+\](?: -+)?$', pattern: $DIVIDER, not: {inside: {kind: ERROR}}}
transform:
    LABEL: {replace: {source: $DIVIDER, replace: '^// --- \[([0-9A-Z_]+)\].*', by: '${1}'}}
    SIGNATURE: {replace: {source: $DIVIDER, replace: ' -+$', by: ' ---'}}
name: $LABEL
signature: $SIGNATURE
isExported: false
---
id: csharp-namespace
language: csharplang
role: item
symbolType: namespace
rule:
    kind: alias_qualified_name, generic_name, identifier, qualified_name
    pattern: $NAME
    inside: {kind: 'namespace_declaration, file_scoped_namespace_declaration', field: name}
transform:
    CLEAN: {replace: {source: $NAME, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*', by: ''}}
name: $CLEAN
signature: namespace $CLEAN
isExported: false
---
id: csharp-interface
language: csharplang
role: item
symbolType: interface
utils:
    enclosing: {kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    tooling: {kind: attribute, has: {field: name, regex: '(?:^|[.:])(?:Debugger.+|StackTraceHidden|ExcludeFromCodeCoverage|(?:Unconditional)?SuppressMessage|EditorBrowsable|StringSyntax)(?:Attribute)?$'}}
    public: {any: [{has: {kind: modifier, regex: 'public|protected', stopBy: {not: {kind: preproc_if}}}, not: {has: {kind: modifier, regex: private, stopBy: {not: {kind: preproc_if}}}}}, {has: {kind: explicit_interface_specifier}}, {inside: {stopBy: {matches: enclosing}, kind: interface_declaration}, not: {has: {kind: modifier, regex: 'private|internal', stopBy: {not: {kind: preproc_if}}}}}]}
    visible: {matches: public, not: {inside: {stopBy: end, matches: enclosing, not: {matches: public}}}}
    plain: {not: {has: {stopBy: {kind: 'declaration_list, enum_member_declaration_list'}, any: [{kind: 'attribute_list, preproc_if_in_attribute_list, preproc_if, argument, ERROR, comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, {kind: parameter, has: {regex: '^=$'}}]}}, pattern: $PLAIN}
rule:
    kind: interface_declaration
    has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}
    all: [{any: [{matches: plain}, {pattern: $DECLARATION}]}]
rewriters:
    - {id: broken, rule: {kind: ERROR}, fix: "\n"}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
    - {id: body, rule: {kind: 'declaration_list, enum_member_declaration_list', inside: {field: body, matches: enclosing}}, fix: ''}
    - {id: arguments, rule: {kind: argument_list, has: {kind: argument}, inside: {kind: 'base_list, primary_constructor_base_type, constructor_initializer'}}, fix: '(…)'}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {kind: attribute, matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: branch, rule: {kind: 'preproc_else, preproc_elif'}, fix: ''}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body, arguments, tool-list, tool, attributed, branch, broken, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*|#(?:if|endif)[^\n]*', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
    PLAIN_LINES: {replace: {source: $PLAIN, replace: '(?s)[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*(?:\{|=>|;[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*$).*|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*', by: "\n "}}
    PLAIN_SIGNATURE: {replace: {source: $PLAIN_LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $NAME
signature: $PLAIN_SIGNATURE$SIGNATURE
isExported: {matches: visible}
---
