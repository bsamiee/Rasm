# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-test-scope
language: rust
utils:
    marked:
        follows:
            stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}
            kind: attribute_item
            matches: marker
    marker:
        any:
            - regex: '^#\[\s*cfg\s*\(.*\b(test|doctest)\b'
              not: {regex: '^#\[\s*cfg\s*\(\s*not\s*\(\s*test\b'}
            - regex: '^#\[\s*(\w+::)*\w*(test|bench|quickcheck|proptest)\w*\s*(\(|\]|$)'
rule:
    inside:
        stopBy: end
        kind: 'mod_item, function_item, impl_item, const_item, static_item'
        matches: marked
