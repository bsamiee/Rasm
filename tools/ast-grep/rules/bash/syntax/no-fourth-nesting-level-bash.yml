# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-bash
language: bashlang
severity: error
rule:
    kind: &control 'if_statement, for_statement, c_style_for_statement, while_statement, case_statement'
    pattern: $CONTROL
    inside:
        kind: *control
        stopBy: &boundary {any: [{kind: *control}, {kind: function_definition}]}
        inside:
            kind: *control
            stopBy: *boundary
            inside:
                kind: *control
                stopBy: *boundary
                not: {inside: {kind: *control, stopBy: {kind: function_definition}}}
transform:
    HEAD: {replace: {source: $CONTROL, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level'
note: Rebuild nested decisions and loops as a `case`, an `&&` or `||` guard, or a pipeline over their inputs
