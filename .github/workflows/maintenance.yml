name: Maintenance

on:
    schedule:
        - cron: "0 9 * * 0"
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    container:
        runs-on: [self-hosted, container]
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
