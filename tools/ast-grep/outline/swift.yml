    FOLDED: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package)$'}}}
---
id: swift-object
language: swiftlang
role: item
symbolType: object
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: source_file}
    all:
        - has: {field: declaration_kind, regex: '^(actor|extension)$'}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: type-body
      rule: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', field: body}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [type-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - &exported {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package)$'}}}
        - all:
              - has: {field: declaration_kind, regex: '^extension$'}
              - has: {field: body, has: *exported}
---
id: swift-protocol
language: swiftlang
role: item
symbolType: interface
rule:
    kind: protocol_declaration
    pattern: $DECLARATION
    inside: {kind: source_file}
    has: {field: name, pattern: $NAME}
rewriters:
    - id: type-body
      rule: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', field: body}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [type-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package)$'}}}
---
id: swift-function
language: swiftlang
role: item
symbolType: function
rule:
    kind: 'function_declaration, macro_declaration'
    pattern: $DECLARATION
    inside: {kind: source_file}
    any:
        - has: {field: name, pattern: $$NAME}
        - has: {kind: simple_identifier, pattern: $NAME}
rewriters:
    - id: function-body
      rule: {kind: 'function_body, macro_definition', inside: {kind: 'function_declaration, macro_declaration, init_declaration, deinit_declaration'}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '([(\[<])[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*|,?[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*([)\]>])|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package)$'}}}
---
id: swift-global-variable
language: swiftlang
role: item
symbolType: property
rule:
    kind: property_declaration
    inside: {kind: source_file}
    has: {kind: value_binding_pattern, pattern: $BINDING}
    all:
        - any:
              - has: {kind: modifiers, pattern: $MODIFIERS}
              - not: {has: {kind: modifiers}}
        - any:
              - has: {field: name, has: {field: bound_identifier, pattern: $NAME}}
                not: {has: {kind: pattern, follows: {kind: pattern, stopBy: end}}}
                any:
                    - has: {kind: type_annotation, pattern: $TYPE}
                    - not: {has: {kind: type_annotation}}
              - pattern: $GROUP
        - any:
              - has: {kind: computed_property, pattern: $ACCESSOR_BODY, has: {kind: 'computed_getter, computed_setter, computed_modify, computed_init'}}
              - has: {kind: computed_property, pattern: $IMPLICIT_BODY}
              - not: {has: {kind: computed_property}}
rewriters:
    - id: binding
      rule: {kind: pattern, pattern: $BOUND, inside: {kind: property_declaration}}
      fix:
          template: $BOUND
          expandStart: {regex: '', not: {follows: {regex: ''}}, stopBy: {regex: '^,$'}}
          expandEnd: {any: [{precedes: {regex: '^,$'}}, {regex: '', not: {precedes: {regex: ''}}}], stopBy: {regex: '^,$'}}
    - id: accessor-statements
      rule: {kind: statements, inside: {kind: 'computed_getter, computed_setter, computed_modify, computed_init'}}
      fix: ''
transform:
    PREFIX: {replace: {source: $MODIFIERS, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*|\z', by: ' '}}
    NAMES: {rewrite: {source: $GROUP, rewriters: [binding]}}
    GROUP_NAME: {replace: {source: $NAMES, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
    STRIPPED: {rewrite: {source: $ACCESSOR_BODY, rewriters: [accessor-statements]}}
    ACCESSORS: {replace: {source: $STRIPPED, replace: '\A(\{)|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\{[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\}[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' $1'}}
    IMPLICIT: {replace: {source: $IMPLICIT_BODY, replace: '(?s)^.*$', by: ' { get }'}}
name: $NAME$GROUP_NAME
signature: $PREFIX$BINDING $NAME$GROUP_NAME$TYPE$ACCESSORS$IMPLICIT
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package)$'}}}
---
id: swift-operator
language: swiftlang
role: item
symbolType: operator
rule:
    inside: {kind: source_file}
    any:
        - kind: operator_declaration
          has: {pattern: $$NAME, follows: {regex: '^operator$'}}
        - kind: precedence_group_declaration
          has: {kind: simple_identifier, pattern: $NAME}
name: $NAME
---
id: swift-macro-expansion
language: swiftlang
role: item
symbolType: event
rule:
    pattern: $DECLARATION
    inside: {kind: source_file}
    any:
        - kind: macro_invocation
          has: {kind: simple_identifier, pattern: $NAME}
        - kind: call_expression
          has: {kind: macro_invocation, has: {kind: simple_identifier, pattern: $NAME}}
        - kind: diagnostic
          pattern: $DIAGNOSTIC
rewriters:
    - id: closure
      rule: {kind: lambda_literal, inside: {kind: call_suffix, inside: {kind: 'macro_invocation, call_expression'}}}
      fix: '{ ... }'
transform:
    DIAGNOSTIC_NAME: {replace: {source: $DIAGNOSTIC, replace: '^#([A-Za-z]+)(?s:.*)$', by: '$1'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [closure]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
name: $NAME$DIAGNOSTIC_NAME
signature: $SIGNATURE
isExported: false
---
id: swift-member-struct
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol]
symbolType: struct
utils:
    owned:
        inside:
            kind: 'class_body, enum_class_body, protocol_body'
            inside:
                kind: 'class_declaration, protocol_declaration'
                any:
                    - inside: {kind: source_file}
                    - inside: {kind: 'class_body, enum_class_body'}
                      has: {field: name, pattern: $OWNER}
    private: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}}
    local:
        any:
            - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
            - not:
                  any:
                      - matches: private
                      - inside: {kind: class_body, inside: {kind: class_declaration, all: [{has: {field: declaration_kind, regex: '^extension$'}}, {matches: private}]}}
    visible:
        all:
            - matches: local
            - not: {inside: {kind: 'class_declaration, protocol_declaration', inside: {kind: 'class_body, enum_class_body'}, not: {matches: local}, stopBy: end}}
rule:
    any:
        - kind: type_identifier
          pattern: $NAME
          inside:
              kind: class_declaration
              field: name
              pattern: $DECLARATION
              matches: owned
              has: {field: declaration_kind, regex: '^struct$'}
        - kind: typealias_declaration
          pattern: $DECLARATION
          matches: owned
          has: {field: name, pattern: $NAME}
rewriters:
    - id: qualified-name
      rule: {kind: type_identifier, inside: {kind: 'class_declaration, protocol_declaration, typealias_declaration, associatedtype_declaration', field: name, inside: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', inside: {kind: 'class_body, enum_class_body'}}}}}
      fix: $OWNER.$NAME
    - id: type-body
      rule: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', field: body}}
      fix: ''
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '^(.+)$', by: '$1.'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [qualified-name, type-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic:
    any:
        - kind: typealias_declaration
          matches: visible
        - inside: {kind: class_declaration, field: name, matches: visible}
