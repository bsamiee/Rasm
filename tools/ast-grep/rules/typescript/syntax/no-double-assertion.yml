# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-double-assertion
language: tsx
severity: error
utils:
    wide-assertion:
        any:
            - kind: as_expression
              has: {kind: predefined_type, regex: "^(unknown|never|object)$"}
            - kind: as_expression
              has: {kind: object_type, not: {has: {pattern: $_, not: {kind: comment}}}}
            - kind: parenthesized_expression
              has: {matches: wide-assertion}
rule:
    pattern: $VALUE as $TYPE
constraints:
    VALUE: {matches: wide-assertion}
message: 'The intermediate assertion bypasses compatibility with `$TYPE` without validating the value, the form of `Schema.decodeUnknownSync(schema)(value)` at the boundary or the typed constructor'
labels:
    TYPE: {style: primary, message: The type the assertion claims}
