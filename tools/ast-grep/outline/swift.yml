    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {inside: {kind: class_declaration, field: name, matches: exposed, not: {inside: {stopBy: end, any: [{kind: statements}, {kind: 'class_declaration, protocol_declaration', not: {any: [{matches: exposed}, {has: {field: declaration_kind, regex: extension}, not: {has: {kind: modifiers, has: {kind: visibility_modifier}}}}]}}]}}}}
