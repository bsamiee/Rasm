# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discard-pattern-test
language: csharp
severity: error
utils:
    discard-var:
        kind: declaration_pattern
        all:
            - has: {field: type, kind: implicit_type}
            - has: {kind: discard}
    holds-discard-var:
        any:
            - matches: discard-var
            - kind: parenthesized_pattern
              has: {matches: holds-discard-var}
            - kind: and_pattern
              any: [{has: {field: left, matches: holds-discard-var}}, {has: {field: right, matches: holds-discard-var}}]
rule:
    kind: is_pattern_expression
    all:
        - has: {field: expression, pattern: $VALUE}
        - has: {field: pattern, pattern: $PATTERN, matches: holds-discard-var}
message: '`$VALUE is $PATTERN` holds a `var _` pattern every value matches'
note: 'Test the shape its branch reads (`not null`, type, property, relational pattern), or delete a test every value passes'
