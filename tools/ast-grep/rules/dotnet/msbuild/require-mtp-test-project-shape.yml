# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-mtp-test-project-shape
language: xml
severity: error
files: ['**/*.csproj']
rule:
    kind: document
    pattern: _DOC
    has: {matches: {msbuild-package-reference: {id: {regex: '(?i)^["'']xunit\.v3\.mtp-v2["'']$'}}}, stopBy: end}
    any:
        - not: {has: {matches: {msbuild-property-value: {name: {regex: '^OutputType$'}, text: {regex: '(?i)^\s*Exe\s*$'}}}, stopBy: end}}
        - not: {has: {matches: {msbuild-package-reference: {id: {regex: '(?i)^["'']coverlet\.MTP["'']$'}}}, stopBy: end}}
transform:
    SHAPED: rewrite($DOC, rewriters=[exe, group, coverage])
fix: $SHAPED
rewriters:
    - id: exe
      rule:
        kind: CharData
        inside: {kind: content, inside: {matches: {msbuild-property: {name: {regex: '^OutputType$'}}}}}
        not: {regex: '(?i)^\s*Exe\s*$'}
      fix: Exe
    - id: group
      rule:
        kind: STag
        pattern: _TAG
        inside: {kind: element, inside: {kind: document}}
        not: {inside: {kind: document, stopBy: end, has: {matches: {msbuild-property: {name: {regex: '^OutputType$'}}}, stopBy: end}}}
      fix: $TAG<PropertyGroup><OutputType>Exe</OutputType></PropertyGroup>
    - id: coverage
      rule:
        pattern: _REF
        matches: {msbuild-package-reference: {id: {regex: '(?i)^["'']xunit\.v3\.mtp-v2["'']$'}}}
        not: {inside: {kind: document, stopBy: end, has: {matches: {msbuild-package-reference: {id: {regex: '(?i)^["'']coverlet\.MTP["'']$'}}}, stopBy: end}}}
      fix: <PackageReference Include="coverlet.MTP" />$REF
message: The test project references xunit.v3.mtp-v2 without OutputType Exe or the coverlet.MTP reference
note: Declare <OutputType>Exe</OutputType> and reference coverlet.MTP, the testing platform host is an executable that collects coverage
