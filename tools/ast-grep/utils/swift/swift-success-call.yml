# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-success-call
language: swiftlang
rule:
    kind: call_expression
    has:
        nthChild: 1
        any:
            - kind: prefix_expression
              regex: '^\.success$'
              inside: {kind: call_expression, matches: swift-result-context}
            - kind: navigation_expression
              any:
                - regex: '^Swift(\.|::)Result\.success$'
                - all:
                    - has: {field: suffix, regex: '^\.success$'}
                    - has: {field: target, matches: swift-result-type}
