# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    constructor-call:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Queue$'}, member: {regex: '^(bounded|dropping|make|sliding|unbounded)$'}}}}
    queue-value:
        any:
            - matches: constructor-call
            - kind: 'yield_expression, await_expression'
              has: {matches: constructor-call}
            - kind: yield_expression
              has:
                kind: call_expression
                all:
                    - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^all$'}}}}
                    - has: {field: arguments, has: {nthChild: {position: 1, ofRule: &argument {not: {kind: comment}}}, kind: 'array, object', has: {any: [{matches: constructor-call}, {kind: pair, has: {field: value, matches: constructor-call}}]}}}
    queue-offer:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Queue$'}, member: {regex: '^(offer|offerAll)$'}}}}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *argument}, pattern: $QUEUE}}
    offer-call:
        kind: call_expression
        any:
            - all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Queue$'}, member: {regex: '^(offerAllUnsafe|offerUnsafe)$'}}}}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *argument}, pattern: $QUEUE}}
            - all:
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *argument}, matches: queue-offer}}
                - has: {field: function, matches: {effect-runner: {name: {regex: '^run'}}}}
    queue-declarator:
        kind: variable_declarator
        all:
            - has: {field: value, matches: queue-value}
            - inside:
                kind: lexical_declaration
                inside:
                    kind: statement_block
                    has:
                        stopBy: end
                        matches: typescript-function-boundary
                        has: {stopBy: end, matches: offer-call}
rule:
    kind: 'identifier, shorthand_property_identifier_pattern'
    pattern: $QUEUE
    inside:
        kind: 'variable_declarator, array_pattern, object_pattern, pair_pattern'
        any:
            - kind: variable_declarator
              all: [{has: {field: name, pattern: $QUEUE}}, {matches: queue-declarator}]
            - kind: 'array_pattern, object_pattern'
              inside: {kind: variable_declarator, field: name, matches: queue-declarator}
            - kind: pair_pattern
              inside: {kind: object_pattern, inside: {kind: variable_declarator, field: name, matches: queue-declarator}}
message: 'Callback feeds `$QUEUE` outside the effect that built it'
note: 'Build through `Stream.callback`; fork a consumer with `Effect.forkScoped({ startImmediately: true })` before reading registration'
