syntax = "proto3";

package rasm.contracts.availability.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "rasm/contracts/compute/v1/control.proto";

message CommandVerdictWire {
  message Gated {
    string reason = 1 [(buf.validate.field).string.min_len = 1];
  }
  message Withheld {
    rasm.contracts.compute.v1.DegradationLevel level = 1 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
    string reason = 2 [(buf.validate.field).string.min_len = 1];
  }
  oneof verdict {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty available = 1;
    Gated gated = 2;
    Withheld withheld = 3;
  }
}

// `commands` is keyed by capability descriptor, an open registry; it carries only the rows deviating from the
// level's own access posture, so a descriptor absent from the map reads the posture the level implies.
message CommandAvailability {
  rasm.contracts.compute.v1.DegradationLevel level = 1 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  map<string, CommandVerdictWire> commands = 2 [(buf.validate.field).map = {
    max_pairs: 65536
    keys: {
      string: {min_len: 1}
    }
  }];
  google.protobuf.Timestamp since = 3 [(buf.validate.field).required = true];
}
