id: require-private-normalized-property
valid:
    - |
      <PropertyGroup><_RhinoAppDir Condition="'$(RhinoAppPath)' != ''">$([MSBuild]::NormalizeDirectory('$(RhinoAppPath)'))</_RhinoAppDir>
        </PropertyGroup>
    - |
      <PropertyGroup><LibsRoot>$([MSBuild]::NormalizeDirectory('$(RepoRoot)', 'libs'))</LibsRoot></PropertyGroup>
    - |
      <PropertyGroup><_NuGetPackageRoot>$([MSBuild]::EnsureTrailingSlash('$(NuGetPackageRoot)'))</_NuGetPackageRoot></PropertyGroup>
    - |
      <Project TreatAsLocalProperty="ToolRoot"><PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory('$(ToolRoot)'))</ToolRoot></PropertyGroup></Project>
    - |
      <Project TreatAsLocalProperty="Other;$(LocalProperties)"><PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory('$(ToolRoot)'))</ToolRoot></PropertyGroup></Project>
    - |
      <PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory('$(ToolRoot)', 'bin'))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><_ToolRoot>$([MSBuild]::NormalizePath('$(ToolRoot)'))</_ToolRoot></PropertyGroup>
invalid:
    - |
      <PropertyGroup><RhinoAppPath>$([MSBuild]::NormalizeDirectory('$(RhinoAppPath)'))</RhinoAppPath></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory('$(ToolRoot)'))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><RepoRoot>$([MSBuild]::NormalizeDirectory('$(MSBuildThisFileDirectory)'))</RepoRoot></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot>$([System.IO.Path]::GetFullPath('$(ToolRoot)'))</ToolRoot></PropertyGroup>
    - |
      <Project TreatAsLocalProperty="  "><PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory('$(ToolRoot)'))</ToolRoot></PropertyGroup></Project>
    - |
      <Project ToolsVersion="Current"><PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory('$(ToolRoot)'))</ToolRoot></PropertyGroup></Project>
    - |
      <PropertyGroup><ToolRoot>$([MSBuild]::EnsureTrailingSlash('$(ToolRoot)'))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot>$([MSBuild]::NormalizePath('$(ToolRoot)'))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot>$([System.IO.Path]::TrimEndingDirectorySeparator('$(ToolRoot)'))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory( '$(ToolRoot)' ))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot>$([MSBuild]::NormalizeDirectory($(ToolRoot)))</ToolRoot></PropertyGroup>
    - |
      <PropertyGroup><ToolRoot Condition="'$(ToolRoot)' != ''">$([MSBuild]::NormalizeDirectory('$(ToolRoot)'))</ToolRoot></PropertyGroup>
