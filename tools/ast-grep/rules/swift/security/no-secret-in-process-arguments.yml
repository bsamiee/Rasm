# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-secret-in-process-arguments
language: swift
severity: error
rule:
    all:
        - matches: {swift-security-argument: {subcommand: {regex: '^"add-generic-password"$', pattern: $COMMAND}}}
        - has: {kind: line_string_literal, regex: '^"-(w|p|X)"$', pattern: $FLAG}
message: '`$FLAG` exposes the secret of `$COMMAND` in argv to `ps` under the same uid'
note: 'Pass `["-i"]` as argv and write `add-generic-password -U -a <account> -s <service> -X <hex>` on stdin'
