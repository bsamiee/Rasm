# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-float-bits-hash
language: rust
severity: error
utils:
    bits:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^to_bits$'}}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - all:
                - has: {field: function, regex: '^((::)?(std|core)::)?(primitive::)?f(16|32|64|128)::to_bits$'}
                - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
    float-struct:
        kind: struct_item
        all:
            - has: {field: name, pattern: $TYPE}
            - has: {field: body, has: {stopBy: end, kind: primitive_type, regex: '^f(16|32|64|128)$'}}
    impl-target:
        any: [{kind: type_identifier, pattern: $TYPE}, {kind: generic_type, has: {field: type, pattern: $TYPE}}]
    float-order:
        kind: call_expression
        any:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^total_cmp$'}}
            - has: {field: function, regex: '^((::)?(std|core)::)?f(16|32|64|128)::total_cmp$'}
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^(unwrap|expect|unwrap_or|unwrap_or_else)$'}}
                - has: {field: function, has: {field: value, kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^partial_cmp$'}}}}
rule:
    pattern: $SITE
    any:
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, all: [{has: {field: value, matches: bits}}, {has: {field: field, regex: '^hash$'}}]}
            - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^((::)?(std|core)::)?(hash::)?Hash::hash$'}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: bits}, {kind: reference_expression, has: {field: value, matches: bits}}]}}
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^write_(u|i)(16|32|64|128)$'}}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: bits}, {kind: type_cast_expression, has: {field: value, matches: bits}}]}}
        - kind: impl_item
          all:
            - has: {field: trait, regex: '^((::)?(std|core)::)?(cmp::)?Eq$'}
            - has: {field: type, matches: impl-target}
            - has: {field: body, not: {has: {pattern: $_}}}
            - inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: float-struct}}
        - matches: float-order
          inside:
            kind: impl_item
            stopBy: {kind: 'impl_item, closure_expression'}
            all:
                - has: {field: trait, regex: '^((::)?(std|core)::)?(cmp::)?Ord$'}
                - has: {field: type, matches: impl-target}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: float-struct}}
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\s*\{?\s*\n.*$', by: ''}}
message: '`$HEAD` treats a float as a total order or a hash key by hand'
note: 'Type the field `ordered_float::OrderedFloat<f64>` or `NotNan<f64>` and derive `PartialEq`, `Eq`, `PartialOrd`, `Ord`, and `Hash`'
