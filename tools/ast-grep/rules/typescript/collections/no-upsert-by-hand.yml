# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-upsert-by-hand
language: tsx
severity: error
ignores:
    - apps/creative-cloud/indesign/galley/**
    - libs/typescript/creative-cloud/indesign/**
    - libs/typescript/creative-cloud/uxp/**
    - plugins/function-hooks/**
utils:
    absent:
        kind: unary_expression
        all:
            - has: {field: operator, regex: '^!$'}
            - has:
                field: argument
                kind: call_expression
                pattern: $MAP.has($KEY)
                has: {field: function, has: {field: object, matches: {typescript-collection-receiver: {collection: {regex: '^(Map|WeakMap)$'}}}}}
rule:
    kind: if_statement
    all:
        - has: {field: condition, has: {matches: absent}}
        - not: {has: {field: alternative, kind: else_clause}}
        - has:
            field: consequence
            any:
                - kind: expression_statement
                - kind: statement_block
                  has: {kind: expression_statement}
                  not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
            has: {stopBy: {kind: call_expression}, kind: call_expression, pattern: '$MAP.set($KEY, $VALUE)'}
fix: $MAP.getOrInsertComputed($KEY, () => $VALUE);
message: '`$MAP.set` inserts under `$KEY` behind its own membership test'
note: '`<map>.getOrInsertComputed(<key>, () => <value>)` returns the present value or inserts the computed one in one lookup, and `<map>.getOrInsert(<key>, <value>)` takes a value whose evaluation costs nothing'
