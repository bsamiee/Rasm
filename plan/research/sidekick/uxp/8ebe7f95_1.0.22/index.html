<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sidekick</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: var(--spectrum-global-dimension-size-150, 12px);
      background: var(--spectrum-alias-background-color-default, transparent);
      color: var(--spectrum-alias-text-color, inherit);
      font-family: adobe-clean, "Adobe Clean", ui-sans-serif, sans-serif;
      font-size: var(--spectrum-alias-font-size-default, 14px);
    }

    /* Force re-render when theme changes */
    body.theme-update {
      opacity: 0.9999;
    }

    .container {
      display: flex;
      flex-direction: column;
    }

    .container > * + * {
      margin-top: var(--spectrum-global-dimension-size-150, 12px);
    }

    .status-container {
      display: flex;
      align-items: center;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: none;
      margin-right: var(--spectrum-global-dimension-size-100, 8px);
    }

    .status-icon svg {
      width: 100%;
      height: 100%;
    }

    /* Theme-aware colors using UXP media queries */
    @media (prefers-color-scheme: dark), (prefers-color-scheme: darkest) {
      .status-icon svg path {
        fill: #FFFFFF;
      }
      .status-text,
      .connecting-dots,
      a.help-link {
        color: #FFFFFF;
      }
      .description,
      .activity,
      .version {
        color: #B3B3B3;
      }
      .activity .status-icon svg path {
        fill: #B3B3B3;
      }
    }

    @media (prefers-color-scheme: light), (prefers-color-scheme: lightest) {
      .status-icon svg path {
        fill: #323232;
      }
      .status-text,
      .connecting-dots,
      a.help-link {
        color: #323232;
      }
      .description,
      .activity,
      .version {
        color: #6E6E6E;
      }
      .activity .status-icon svg path {
        fill: #6E6E6E;
      }
    }

    /* Show appropriate icon based on state */
    .connected .icon-connected,
    .disconnected .icon-disconnected,
    .connecting .icon-disconnected,
    .error .icon-error {
      display: block;
    }

    .status-text {
      font-size: var(--spectrum-global-dimension-font-size-75, 12px);
      color: var(--spectrum-alias-text-color, inherit);
    }

    .description {
      font-size: var(--spectrum-global-dimension-font-size-75, 12px);
      color: var(--spectrum-alias-text-color-secondary, #6e6e6e);
    }

    a.help-link {
      display: none;
      font-size: var(--spectrum-global-dimension-font-size-75, 12px);
      text-decoration: underline;
      cursor: pointer;
      margin-top: var(--spectrum-global-dimension-size-150, 12px);
    }
    a.help-link:hover {
      text-decoration: none;
    }

    /* Activity section */
    .activity {
      display: none;
      align-items: flex-start;
      font-size: var(--spectrum-global-dimension-font-size-75, 12px);
      color: var(--spectrum-alias-text-color, inherit);
    }

    .activity.visible {
      display: flex;
    }

    .activity .status-icon {
      display: block;
    }

    /* Spinning animation for activity icon */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .activity.running .status-icon svg {
      animation: spin 1s linear infinite;
    }

    /* Animated dots after "Connecting" — signals that we're actively
       trying without adding extra UI weight. UXP doesn't support CSS
       animations, so the dots are driven by a setInterval in index.ts.
       The fixed width prevents text reflow as dots come and go. */
    .connecting-dots {
      display: none;
      width: 1.2em;
      text-align: left;
    }
    .connecting .connecting-dots {
      display: inline-block;
    }

    .activity-text {
      line-height: 1.4;
    }

    .activity-text p {
      margin: 0;
    }

    .activity-text p + p {
      margin-top: var(--spectrum-global-dimension-size-100, 8px);
    }

    .activity-text strong {
      font-weight: var(--spectrum-global-font-weight-bold, 700);
    }

    .activity-text em {
      font-style: italic;
    }

    .activity-text code {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      background-color: var(--spectrum-alias-background-color-tertiary, rgba(128, 128, 128, 0.2));
      padding: 1px 4px;
      border-radius: 2px;
    }

    .activity-text ul,
    .activity-text ol {
      margin: var(--spectrum-global-dimension-size-50, 4px) 0;
      padding-left: var(--spectrum-global-dimension-size-200, 16px);
    }

    .activity-text li {
      margin: 2px 0;
    }

    /* Version display - inherits color from theme like description */
    .version {
      position: fixed;
      bottom: var(--spectrum-global-dimension-size-100, 8px);
      left: var(--spectrum-global-dimension-size-100, 8px);
      right: var(--spectrum-global-dimension-size-100, 8px);
      padding-right: var(--spectrum-global-dimension-size-100, 8px);
      text-align: right;
      font-size: 10px;
      color: var(--spectrum-alias-text-color-secondary, #6e6e6e);
    }

  </style>
</head>
