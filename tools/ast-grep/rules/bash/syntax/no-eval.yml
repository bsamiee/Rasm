# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# Report only, "${cmd[@]}" in place of eval "$cmd" runs the string as one word, the probe fails with printf %s hi: command not found
id: no-eval
language: bash
severity: error
ignores: ["**/*.json"]
rule:
    kind: command
    pattern: $CMD
    any:
        - has: {field: name, regex: '^(\\|["''])?eval["'']?$'} # The name bare, quoted, or behind a backslash
        # Only execution options may precede the target; command -v/-V perform lookup.
        - has:
            kind: word, string, raw_string
            regex: '^["'']?eval["'']?$'
            follows:
                any:
                    - kind: command_name
                      regex: '^(builtin|command)$'
                    - kind: word
                      regex: '^-p$'
                      follows: {kind: command_name, regex: '^command$'}
                stopBy: {not: {kind: word, regex: '^--$'}}
        # A shell run over a string built at run time parses it the same way, a literal program after -c is a script
        - all:
            - has: {field: name, regex: '^(bash|sh)$'}
            - has: {matches: bash-expanding-word, follows: {kind: word, regex: '^-[a-zA-Z]*c[a-zA-Z]*$', follows: {kind: command_name, stopBy: {not: {kind: word, regex: '^-[a-zA-Z]+$'}}}}} # -c alone or joined, -ec, -xc, -lc
message: '`$CMD` parses its arguments as shell code a second time'
note: Build the command in an array, `cmd=(<word> ...)` then `"${cmd[@]}"`, read a name through `${!name}`, and pass a value to `bash -c` as `$1`
