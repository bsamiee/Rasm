# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: syntax-empty-string
language: tsx
rule:
    any:
        - kind: string
          not: {has: {kind: string_fragment}}
        - kind: template_string
          not: {has: {kind: 'string_fragment, template_substitution'}}
