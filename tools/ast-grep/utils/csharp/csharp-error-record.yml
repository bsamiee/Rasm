# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-error-record
language: csharp
utils:
    error-base:
        regex: '^(global::)?(LanguageExt\.(Common\.)?)?(Expected|Exceptional|Error)$'
    base-name:
        any:
            - {kind: identifier, pattern: $BASE}
            - {kind: qualified_name, has: {field: name, pattern: $BASE}}
            - {kind: generic_name, has: {kind: identifier, nthChild: 1, pattern: $BASE}}
rule:
    kind: 'record_declaration'
    has:
        kind: base_list
        has:
            nthChild: 1
            any:
                - {kind: 'identifier, qualified_name', matches: error-base}
                - {kind: primary_constructor_base_type, has: {field: type, matches: error-base}}
                - {kind: primary_constructor_base_type, has: {kind: argument_list, has: {kind: argument, has: {kind: invocation_expression, has: {field: function, regex: '^ErrorOps\.Code\s*<'}}}}}
                - all:
                    - any: [{matches: base-name}, {kind: primary_constructor_base_type, has: {field: type, matches: base-name}}]
                    - inside: {kind: compilation_unit, stopBy: end, has: {stopBy: end, kind: record_declaration, all: [{has: {field: name, pattern: $BASE}}, {matches: csharp-error-record}]}}
