    - 'import { Effect } from "effect"; const response = Effect.tryPromise({ try: () => fetch(url), catch: (cause) => new LoadError({ cause }) });'
    - import { Effect } from "effect"; const response = Effect.promise(() => globalThis.fetch(url));
    - const rows = client.fetch(url);
    - const run = fetch;
    - function load(fetch) { return fetch(url); }
    - const fetch = client.load; fetch(url);
    - import { fetch } from "client"; fetch(url);
    - function load(window) { return window.fetch(url); }
    - import { Effect as E } from "effect"; E.promise(() => fetch(url));
    - 'import * as E from "effect/Effect"; E.tryPromise({ try: () => fetch(url), catch: mapError });'
    - 'import { Effect } from "effect"; Effect.tryPromise({ async try() { return fetch(url); }, catch: mapError });'
