# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Expression that suspends the function holding it, an await or a yield itself or one below it above the nearest nested function
id: syntax-suspension
language: tsx
rule:
    any:
        - kind: await_expression
        - kind: yield_expression
        - pattern: $_
          not: {matches: syntax-function-boundary}
          has: {stopBy: {matches: syntax-function-boundary}, any: [{kind: await_expression}, {kind: yield_expression}]}
