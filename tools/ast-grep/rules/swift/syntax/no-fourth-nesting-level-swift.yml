# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-swift
language: swiftlang
severity: error
utils:
    boundary: {any: [{matches: swift-nesting-level}, {matches: swift-declaration-scope}]}
rule:
    matches: swift-nesting-level
    pattern: $SCOPE
    not: {inside: {kind: ERROR, stopBy: end}}
    inside:
        matches: swift-nesting-level
        stopBy: {matches: boundary}
        inside:
            matches: swift-nesting-level
            stopBy: {matches: boundary}
            inside:
                matches: swift-nesting-level
                stopBy: {matches: boundary}
                not: {inside: {matches: swift-nesting-level, stopBy: {matches: swift-declaration-scope}}}
transform:
    HEAD: {replace: {source: $SCOPE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level'
note: 'Rebuild nested decisions, loops, or closures as one `switch` or a collection transform over their inputs'
labels:
    SCOPE: {style: primary, message: Fourth nesting level}
