id: no-join-of-collected-binding
valid:
    - |
      fn names(xs: &[String]) -> (String, usize) {
          let parts: Vec<String> = xs.iter().cloned().collect();
          (parts.join(", "), parts.len())
      }
    - |
      fn names(xs: &[String]) -> String {
          let parts: Vec<String> = xs.iter().cloned().collect();
          parts.join("")
      }
    - |
      fn names(xs: &[String]) -> String {
          xs.iter().map(|x| x.to_uppercase()).join(", ")
      }
invalid:
    - |
      fn names(xs: &[String]) -> String {
          let parts: Vec<String> = xs.iter().map(|x| x.to_uppercase()).collect();
          parts.join(", ")
      }
    - |
      fn names(xs: &[String]) -> String {
          let parts = xs.iter().map(|x| x.trim()).collect::<Vec<_>>();
          parts.join("\n")
      }
