# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discarded-write-value
language: python
severity: error
utils:
    parameter-read:
        kind: identifier
        pattern: $DISCARDED
        not:
            any:
                - inside: {kind: attribute, field: attribute}
                - inside: {kind: keyword_argument, field: name}
    unread:
        not: {has: {field: body, any: [{matches: parameter-read}, {has: {stopBy: end, matches: parameter-read}}]}}
    discarding-lambda:
        kind: lambda
        all:
            - has: {field: parameters, has: {nthChild: 1, matches: {python-parameter: {name: {pattern: $DISCARDED}}}}}
            - matches: unread
    discarding-function:
        kind: function_definition
        all:
            - has: {field: name, pattern: $FN}
            - has: {field: parameters, has: {nthChild: {position: 1, reverse: true}, matches: {python-parameter: {name: {pattern: $DISCARDED}}}}}
            - matches: unread
    named-write:
        any:
            - kind: identifier
              pattern: $FN
            - kind: attribute
              all:
                - has: {field: object, regex: '^(self|cls)$'}
                - has: {field: attribute, pattern: $FN}
        inside: {kind: module, stopBy: end, has: {stopBy: end, matches: discarding-function}}
    discarding-write:
        any:
            - matches: discarding-lambda
            - matches: named-write
            - kind: call
              all:
                - has: {field: function, matches: functools-partial-callee}
                - has: {field: arguments, has: {nthChild: 1, matches: named-write}}
    write-argument:
        kind: keyword_argument
        all:
            - has: {field: name, regex: '^write$'}
            - has: {field: value, pattern: $WRITE}
    target-argument:
        kind: keyword_argument
        all:
            - has: {field: name, regex: '^target$'}
            - has: {field: value, pattern: $TARGET}
    one-parameter-lambda:
        kind: lambda
        has: {field: parameters, not: {has: {nthChild: 2}}}
rule:
    kind: call
    all:
        - has: {field: arguments, has: {matches: target-argument}}
        - has: {field: arguments, has: {matches: write-argument, has: {field: value, matches: discarding-write}}}
        - any:
            - pattern: $RESTATED
              all:
                - has: {field: arguments, has: {matches: target-argument, has: {field: value, regex: '^(-?[\w.]+|"[^"\\{}]*"|''[^''\\{}]*'')$'}}}
                - has: {field: arguments, has: {matches: write-argument, has: {field: value, matches: one-parameter-lambda, has: {field: body, pattern: $SETTER($TARGET), has: {field: function, regex: '^[A-Za-z_][\w.]*$'}}}}}
            - pattern: $ACTION
              all:
                - has: {field: function, regex: '^Row$'}
                - has: {field: arguments, has: {matches: write-argument, has: {field: value, matches: one-parameter-lambda}}}
                - inside: {kind: module, stopBy: end, has: {kind: import_from_statement, has: {field: name, regex: '^Action$'}}}
            - pattern: $UNFIXED
rewriters:
    - id: setter-write
      rule: {matches: write-argument}
      fix: write=$SETTER
    - id: action-callee
      rule: {kind: identifier, regex: '^Row$', inside: {kind: call, field: function, pattern: $ACTION}}
      fix: Action
    - id: action-write
      rule: {matches: write-argument, has: {field: value, has: {field: body, pattern: $BODY}}}
      fix: 'act=lambda: $BODY'
transform:
    WRITTEN: {rewrite: {source: $RESTATED, rewriters: [setter-write]}}
    ACTED: {rewrite: {source: $ACTION, rewriters: [action-callee, action-write]}}
fix: $WRITTEN$ACTED$UNFIXED
message: '`$WRITE` discards the target its row passes it'
note: 'Use the setter receiving the value (`write=<setter>`), or `Action(act=<step>)` for a step reaching the state without the value, `target` states once what the row writes'
