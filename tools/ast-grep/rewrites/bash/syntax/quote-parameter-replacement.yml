# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: quote-parameter-replacement
language: bash
severity: off
ignores: ["**/*.json"]
rule:
    kind: simple_expansion, expansion
    pattern: $VALUE
    matches: {bash-parameter: {name: {any: [{kind: variable_name}, {kind: subscript}]}}}
    any:
        - follows: {regex: "^/$"}
          inside: {kind: expansion}
        - inside:
            kind: concatenation
            follows: {regex: "^/$"}
            inside: {kind: expansion}
labels: {VALUE: {style: primary}}
fix: '"$VALUE"'
message: "Quote `$VALUE` as literal replacement text"
note: "Select replacements that insert data. With patsub_replacement enabled, unquoted ampersands from a value insert the matched text. Keep variables intentionally supplying replacement syntax unquoted. Literal ampersands outside the quoted value retain their match behavior"
