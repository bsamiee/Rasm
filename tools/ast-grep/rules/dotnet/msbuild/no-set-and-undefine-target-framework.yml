# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-set-and-undefine-target-framework
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^ProjectReference$'}}}
        - matches: {msbuild-metadata: {name: {regex: '^SetTargetFramework$'}, value: {matches: msbuild-value}}}
        - matches: {msbuild-metadata: {name: {regex: '^UndefineProperties$'}, value: {matches: msbuild-value}}}
message: The ProjectReference both sets and undefines the TargetFramework global property
note: >-
    Write SkipGetTargetFrameworkProperties="true" with one of UndefineProperties="TargetFramework" or SetTargetFramework on an incompatible
    reference
