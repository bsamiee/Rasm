id: guard-return-to-ternary
valid:
    # Yield as the condition binds outside the conditional expression
    - 'function* pick() { if (yield 1) return 2; return 3; }'
    # Comments attached to discarded syntax must remain intact
    - 'function pick(held) { if (/* reason */ held) return 1; return 2; }'
    - 'function pick(held) { if (held) return /* reason */ 1; return 2; }'
    - 'function pick(held) { if (held) { return /* reason */ 1; } return 2; }'
    - 'function pick(held) { if (held) return 1; return /* reason */ 2; }'
    - 'function pick(held) { if /* reason */ (held) return 1; return 2; }'
    # The ternary the rewrite writes
    - 'const pick = (held) => { return held ? 1 : 2; };'
    # Valueless return in the guard, no arm
    - 'const stop = (held) => { if (held) { return; } return 2; };'
    # Valueless return after the guard, no arm
    - 'const stop = (held) => { if (held) { return 1; } return; };'
    # Comment inside the guard block, the join drops it
    - |
      const pick = (held) => {
          if (held) {
              // The short path
              return 1;
          }
          return 2;
      };
    # Comment between the guard and the return, the join drops it
    - |
      const pick = (held) => {
          if (held) {
              return 1;
          }
          // The long path
          return 2;
      };
    # Else clause, no guard
    - 'const pick = (held) => { if (held) { return 1; } else { return 2; } return 3; };'
    # Second statement in the guard block
    - 'const pick = (held) => { if (held) { log(held); return 1; } return 2; };'
    # Statement other than a return after the guard
    - 'const pick = (held) => { if (held) { return 1; } log(held); return 2; };'
    # Comma expression as the condition binds looser than the ternary
    - 'const pick = (held, other) => { if (held, other) { return 1; } return 2; };'
    # Assignment as the guard value
    - 'const pick = (held) => { if (held) { return seen = 1; } return 2; };'
    # Comma expression as the final value
    - 'const pick = (held) => { if (held) { return 1; } return other, 2; };'
    # Assignment as a bare guard value
    - 'const pick = (held) => { if (held) return seen = 1; return 2; };'
    # Compound assignment as the guard value
    - 'const pick = (held) => { if (held) { return seen += 1; } return 2; };'
    # Ternary as the condition, the template nests it as the alternate of the outer ternary
    - 'const pick = (held, other, third) => { if (held ? other : third) { return 1; } return 2; };'
    # A nested return does not make its owning call a return statement
    - 'function pick(held) { if (held) { run(() => { return 1; }); } return 2; }'
    # No neighboring return to combine with the guard
    - 'function pick(held) { if (held) return 1; }'
    # A guard with no returning consequence
    - 'function pick(held) { if (held) { log(held); } return 2; }'
invalid:
    # The instance, a block guard before the final return
    - |
      const verdict = (sustained, noisy) => {
          if (noisy) {
              return 'noisy';
          }
          return 'pass';
      };
    # Bare return as the guard body
    - "const verdict = (noisy) => { if (noisy) return 'noisy'; return 'pass'; };"
    # Object literal in the guard arm, a ternary arm needs no parentheses around it
    - 'const target = (app) => { if (app) { return { root, entry }; } return { root }; };'
    # Comparison as the condition
    - "const parity = (value) => { if (value % 2 === 0) { return 'even'; } return 'odd'; };"
    # Chain of guards, the last guard rewrites on the first pass and the first guard on the next
    - |
      const verdict = (sustained, noisy) => {
          if (sustained) {
              return 'regression';
          }
          if (noisy) {
              return 'noisy';
          }
          return 'pass';
      };
    # Await in an arm
    - 'const report = async (held) => { if (held) { return await load(); } return none; };'
    # Arrow function as the guard arm, its body ends at the colon
    - 'const pick = (held) => { if (held) { return (value) => value; } return other; };'
    # Cast as the condition, as binds tighter than the ternary
    - 'const pick = (held) => { if (held as boolean) { return 1; } return 2; };'
    # Comments within retained expressions survive
    - 'function pick(held) { if (test(/* reason */ held)) return load(/* first */); return load(/* second */); }'
