# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-error-message-template
language: csharp
severity: error
utils:
    message-base:
        matches: {csharp-type-name: {name: {regex: '^(Expected|Exceptional)$'}}}
    message-arguments:
        kind: argument_list
        any:
            - inside:
                kind: primary_constructor_base_type
                has: {field: type, matches: message-base}
            - inside:
                kind: constructor_initializer
                has: {regex: '^base$'}
                inside: {kind: constructor_declaration, inside: {kind: declaration_list, inside: {matches: languageext-error-record}}}
            - inside:
                kind: object_creation_expression
                has: {field: type, matches: message-base}
            - inside:
                kind: invocation_expression
                has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Error$'}, member: {regex: '^New$'}}}}
rule:
    kind: string_literal, verbatim_string_literal, raw_string_literal
    pattern: $TEXT
    regex: '\{[A-Za-z_]\w*\}'
    inside: {kind: argument, inside: {matches: message-arguments}}
message: '`$TEXT` holds a `{Name}` placeholder no code fills, the error prints it verbatim'
note: Interpolate the message at construction (`$"{Member} refused the call"`), through `string.Create(CultureInfo.InvariantCulture, $"...")` where a number formats
