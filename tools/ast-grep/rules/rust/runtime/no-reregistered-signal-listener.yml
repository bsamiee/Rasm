# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    listener-name:
        kind: 'identifier, scoped_identifier'
        regex: '^((::)?tokio::)?(signal::)?((unix|windows)::)?ctrl_(c|break|close|logoff|shutdown)$|^((::)?tokio::)?(signal::)?unix::signal$'
    imported-signal:
        pattern: signal
        matches: {rust-imported-name: {source: {has: {field: argument, regex: '^(::)?tokio::signal::unix(::|$)'}}, name: {regex: '^signal$'}}}
    registration:
        any:
            - kind: call_expression
              has: {field: function, any: [{matches: listener-name}, {matches: imported-signal}]}
            - kind: identifier
              regex: '^(signal|ctrl_(c|break|close|logoff|shutdown))$'
              any:
                - regex: '^ctrl_'
                - follows: {regex: '^::$', follows: {pattern: unix}}
                - matches: imported-signal
              inside: {kind: token_tree}
              precedes: {kind: token_tree, regex: '^\('}
    repeating-call:
        kind: call_expression
        has: {field: function, regex: '(^|::)(repeat_with|unfold|try_unfold)$'}
rule:
    all:
        - any:
            - matches: repeating-call
              has: {field: arguments, has: {matches: listener-name}}
            - matches: registration
              inside:
                stopBy: {kind: function_item}
                any:
                    - kind: 'loop_expression, while_expression'
                    - kind: block
                      inside: {kind: for_expression, field: body}
                    - kind: closure_expression
                      inside: {kind: arguments, inside: {matches: repeating-call}}
        - pattern: $SITE
message: '`$SITE` registers a signal listener on each repetition'
note: 'Register one listener before the loop and await `recv()` or `tokio_stream::wrappers::SignalStream`, or pin one `ctrl_c()` for a single signal'
