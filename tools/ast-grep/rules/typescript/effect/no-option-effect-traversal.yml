# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    to-array:
        any:
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^toArray$'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Array$'}, member: {regex: '^fromOption$'}}}
    array-call:
        kind: call_expression
        has: {field: function, matches: to-array}
    each:
        kind: call_expression
        has: {field: function, pattern: $EACH, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^forEach$'}}}}
rule:
    kind: call_expression
    all:
        - matches: each
        - any:
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, matches: array-call, pattern: $ARRAY}}
            - nthChild: {position: 1, ofRule: *code}
              inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: array-call, pattern: $ARRAY}}]}}}
            - nthChild: {position: 2, ofRule: *code}
              inside: {kind: arguments, has: {nthChild: {position: 1, ofRule: *code}, matches: array-call, pattern: $ARRAY}, inside: {kind: call_expression, has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}}}
            - follows: {matches: to-array, pattern: $ARRAY, stopBy: {not: {any: [{regex: '^,$'}, {kind: comment}]}}}
              inside: {kind: arguments}
message: '`$EACH` traverses `$ARRAY`, an `Option` made a list of one element or none'
note: 'Call `Effect.transposeOption(Option.map(<option>, <f>))` to keep the `Option`'
