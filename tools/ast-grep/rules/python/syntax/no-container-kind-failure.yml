# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-container-kind-failure
language: python
severity: error
utils:
    container-kind:
        regex: '^(tuple|list)$'
    failure-tuple:
        kind: generic_type
        all:
            - has: {kind: identifier, regex: '^tuple$'}
            - has:
                kind: type_parameter
                all:
                    - has: {kind: type, nthChild: 1, regex: '^\w*(Fault|Error|Failure)$'}
                    - has: {kind: type, nthChild: 2, has: {kind: ellipsis}}
                    - not: {has: {kind: type, nthChild: 3}}
    sequence-arm:
        kind: type
        has:
            any:
                - kind: generic_type
                  has: {kind: identifier, regex: '^(list|tuple|Sequence|MutableSequence)$'}
                  not: {matches: failure-tuple}
                - {kind: identifier, regex: '^(list|tuple|Sequence|MutableSequence)$'}
    failure-module:
        inside: {kind: module, stopBy: end, has: {stopBy: end, matches: failure-tuple}}
    result-match:
        inside:
            kind: match_statement
            stopBy: {kind: match_statement}
            has: {field: subject, any: [{kind: call}, {has: {kind: call, stopBy: end}}]}
rule:
    pattern: $SHAPE
    any:
        - kind: union_type
          all:
            - not: {inside: {kind: union_type}}
            - has: {stopBy: {kind: 'type_parameter, subscript'}, kind: type, has: {matches: failure-tuple}}
            - has: {stopBy: {kind: 'type_parameter, subscript'}, matches: sequence-arm}
        - kind: call
          all:
            - has: {field: function, regex: '^isinstance$'}
            - has: {field: arguments, has: {nthChild: 2, matches: container-kind}}
            - matches: failure-module
        - kind: case_pattern
          all:
            - any:
                - has: {kind: list_pattern, not: {has: {kind: case_pattern}}}
                - has: {kind: class_pattern, has: {kind: dotted_name, matches: container-kind}}
            - matches: failure-module
            - matches: result-match
message: '`$SHAPE` tells failure from success by container kind'
note: 'Use a frozen `Faults` record over the non-empty error tuple as the failure arm and select it with `case Faults():`, a nominal failure type leaves every container kind to success'
