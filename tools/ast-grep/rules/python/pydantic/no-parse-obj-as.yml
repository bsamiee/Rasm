# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-obj-as
language: python
severity: error
rule:
    matches: {python-module-member: {module: {regex: '^pydantic((\.deprecated)?\.tools)?$'}, name: {regex: "^parse_obj_as$", pattern: $NAME}}}
message: "`$NAME` validates through a deprecated TypeAdapter wrapper"
note: Validate with `TypeAdapter(<type>).validate_python(<value>)` and reuse the adapter, the rewrite `parse-obj-as-to-type-adapter` applies it
