# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-event-mutation
language: tsx
severity: error
files:
    - '**/.claude/plugins/**'
utils:
    event-member:
        kind: member_expression, subscript_expression
        has: {field: object, any: [{pattern: $E}, {matches: event-member}]}
    writing-callee:
        regex: ^(Object\.(assign|defineProperty|defineProperties|setPrototypeOf)|Reflect\.(set|defineProperty|deleteProperty|setPrototypeOf))$
    write:
        any:
            - {kind: assignment_expression}
            - {kind: augmented_assignment_expression}
            - {kind: update_expression}
            - {kind: unary_expression, has: {field: operator, regex: ^delete$}}
            - {kind: call_expression, has: {field: function, matches: writing-callee}}
            - {matches: mutating-array-call}
            - {kind: for_in_statement}
    rebinding-scope:
        any:
            - matches: syntax-function-boundary
              all:
                - any:
                    - {has: {field: parameters, has: {has: {field: pattern, matches: event-binding}}}}
                    - {has: {field: parameter, kind: identifier, pattern: $E}}
                - {not: {matches: claude-code-hook}}
            - {kind: catch_clause, has: {field: parameter, matches: event-binding}}
            - {kind: for_in_statement, has: {field: left, matches: event-binding}}
            - kind: for_statement
              has: {field: initializer, has: {kind: variable_declarator, has: {field: name, matches: event-binding}}}
            - kind: statement_block
              has:
                kind: lexical_declaration, variable_declaration
                has: {kind: variable_declarator, has: {field: name, matches: event-binding}}
    mutating-array-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: property, regex: ^(push|pop|shift|unshift|splice|sort|reverse|fill|copyWithin)$}
    event-binding:
        any:
            - {kind: 'identifier, shorthand_property_identifier_pattern', pattern: $E}
            - kind: object_pattern, array_pattern, rest_pattern
              has: {matches: event-binding}
            - {kind: pair_pattern, has: {field: value, matches: event-binding}}
            - kind: assignment_pattern, object_assignment_pattern
              has: {field: left, matches: event-binding}
    rebinding-statement:
        kind: expression_statement
        has:
            any:
                - {kind: assignment_expression}
                - {kind: augmented_assignment_expression, has: {field: operator, regex: '^&&=$'}}
            has: {field: left, kind: identifier, pattern: $E}
    rebound-before:
        follows: {stopBy: end, matches: rebinding-statement}
rule:
    all:
        - {matches: write}
        - inside:
            stopBy: end
            matches: claude-code-hook
            has: {field: parameters, has: {nthChild: 2, has: {pattern: $E}}}
        - not:
            any:
                - {matches: rebound-before}
                - {inside: {stopBy: {matches: claude-code-hook}, matches: rebound-before}}
        - any:
            - kind: assignment_expression, augmented_assignment_expression
              has:
                field: left
                any:
                    - {matches: event-member}
                    - kind: array_pattern, object_pattern
                      has:
                        stopBy: end
                        matches: event-member
                        not: {inside: {stopBy: end, kind: assignment_pattern, field: right}}
            - {kind: update_expression, has: {field: argument, matches: event-member}}
            - {kind: unary_expression, has: {field: argument, matches: event-member}}
            - kind: call_expression
              all:
                - {has: {field: function, matches: writing-callee}}
                - {has: {field: arguments, has: {nthChild: 1, any: [{pattern: $E}, {matches: event-member}]}}}
            - {matches: mutating-array-call, has: {field: function, has: {field: object, matches: event-member}}}
            - {kind: for_in_statement, has: {field: left, matches: event-member}}
        - {not: {inside: {stopBy: end, matches: rebinding-scope}}}
    pattern: $MATCH
message: The hook writes to the frozen event `$E`
note: 'Pass a copy to the chain, `next({ ...e, field: value })`, and read `e` alone'
labels: {MATCH: {style: primary}}
