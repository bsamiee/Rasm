# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-variant-enum
language: rust
severity: error
rule:
    kind: enum_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, all: [{has: {kind: enum_variant}}, {not: {has: {kind: enum_variant, nthChild: {position: 2, ofRule: {kind: enum_variant}}}}}]}
        - not: {matches: {rust-attributed: {attribute: {regex: '^#\[\s*(serde\b|repr\b|derive\s*\([^)]*\b(ValueEnum|EnumString)\b)'}}}}
        - not: {has: {field: body, has: {kind: attribute_item, regex: '^#\[\s*serde\b'}}}
message: '`$NAME` declares one variant'
note: 'Declare the variant''s payload as a struct named for the variant, moving a thiserror variant''s `#[error(..)]` onto the struct'
