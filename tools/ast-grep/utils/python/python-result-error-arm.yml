# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
# Error arm returning the error it bound, `case Result(tag="error", error=<e>): return Error(<e>)` in either keyword order and spelling
id: python-result-error-arm
language: python
utils:
    # Class pattern over the Result union, plain or module-qualified, the caller pins one spelling across the arms
    result-pattern:
        kind: class_pattern
        has: {kind: dotted_name, regex: '^([A-Za-z_]\w*\.)*Result$'}
    # The error keyword binding a name, the context form because a keyword pattern parses under a case alone
    error-keyword:
        kind: keyword_pattern
        pattern:
            context: |
                match _:
                    case Result(error=$E): pass
            selector: keyword_pattern
rule:
    kind: case_clause
    all:
        - has:
            kind: case_pattern
            has:
                matches: result-pattern
                all:
                    - has: {kind: case_pattern, has: {matches: error-keyword}}
                    # Every sub-pattern is the error tag or the error keyword, another keyword or a positional stays
                    - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']error["'']$|error\s*=)'}}}}
        - not: {has: {field: guard, kind: if_clause}} # Guarded arms select on more than the tag
        - has:
            field: consequence
            kind: block
            all:
                # One return of the bound name through the module function or the static method, a mapped error stays
                - has:
                    kind: return_statement
                    has:
                        kind: call
                        all:
                            - has: {field: function, regex: '^(Result\.)?Error$'}
                            - has: {field: arguments, has: {kind: identifier, pattern: $E}, not: {has: {nthChild: 2}}}
                - not: {has: {nthChild: 2}}
