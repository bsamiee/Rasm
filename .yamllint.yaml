extends: default

ignore-from-file: .gitignore

yaml-files: ["*.yaml", "*.yml", "!pnpm-lock.yaml"]

rules:
    line-length: disable
    indentation: disable
    document-start: disable
    truthy:
        allowed-values: ["true", "false", "off"]
        check-keys: false
    comments:
        min-spaces-from-content: 1
