id: no-logging-call
valid:
    - |
      from logging import getLogger
      def emit(getLogger):
          getLogger().info("event")
    - |
      from logging import getLogger
      for getLogger in factories:
          getLogger().info("event")
    - |
      def unrelated():
          from logging import getLogger
      def emit():
          getLogger().info("event")
    # The corrected form, structlog configured once and its logger called
    - |
      import structlog

      structlog.configure(processors=[structlog.processors.JSONRenderer()])
      _log = structlog.get_logger(__name__)
      _log.info("staged", path=str(path))
    # Level constant of the module
    - |
      import logging

      level = logging.INFO
    # The handler type of the module, the structlog stdlib integration reads it
    - |
      from logging import Handler
    # Attribute named like the member on another object
    - |
      log.info("staged")
    # Root logger access and handlers configure the ProcessorFormatter transport
    - |
      import logging
      import structlog
      handler = logging.StreamHandler()
      handler.setFormatter(structlog.stdlib.ProcessorFormatter(processors=[structlog.processors.JSONRenderer()]))
      logging.basicConfig(handlers=[handler])
      logging.getLogger().setLevel(logging.INFO)
    - "from logging import basicConfig, getLogger"
    # A nested import supplies no alias to another function
    - |
      def setup():
          import logging as lg
      def emit(lg):
          lg.info("event")
