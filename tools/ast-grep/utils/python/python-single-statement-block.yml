# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-single-statement-block
language: pythonlang
rule:
    kind: block
    not:
        has:
            all:
                - &statement {pattern: $_, not: {matches: python-docstring-or-comment}}
                - follows: {stopBy: end, all: [*statement]}
