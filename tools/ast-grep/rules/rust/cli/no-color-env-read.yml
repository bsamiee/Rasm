# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-color-env-read
language: rust
severity: error
rule:
    kind: string_literal
    pattern: $NAME
    regex: '^"(NO_COLOR|CLICOLOR|CLICOLOR_FORCE)"$'
    inside: {kind: token_tree, inside: {kind: attribute}}
    follows: {regex: '^=$', follows: {regex: '^env$'}}
message: '`$NAME` reads a color setting the terminal stream reads itself'
note: 'Write through `anstream::stdout()` or `stderr()`, both streams read `NO_COLOR`, `CLICOLOR`, and `CLICOLOR_FORCE` beside terminal state. Set an explicit choice through `anstream::ColorChoice::write_global`'
