# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    any:
        - { pattern: runMain, not: { inside: { kind: import_specifier } }, inside: { kind: program, stopBy: end, matches: { typescript-module-importer: { module: { regex: '^@effect/platform-[a-z]+(/|$)' } } } } }
        - { kind: property_identifier, regex: '^runMain$', inside: { kind: member_expression, field: property } }
    not:
        any:
            - inside:
                  stopBy: end
                  field: consequence
                  kind: if_statement
                  has: { field: condition, kind: parenthesized_expression, has: { pattern: import.meta.main } }
                  inside: { kind: program }
            - inside:
                  stopBy: end
                  kind: expression_statement
                  inside: { kind: program, not: { has: { kind: export_statement } } }
message: '`runMain` runs outside a program entry point'
note: 'Call `runMain` in a top-level statement of a module exporting nothing, or inside a top-level `if (import.meta.main)` block'
