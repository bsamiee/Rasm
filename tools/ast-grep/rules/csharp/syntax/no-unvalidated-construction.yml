# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unvalidated-construction
language: csharp
severity: error
utils:
    callee:
        any:
            - kind: member_access_expression
              has: {field: name, pattern: $CALLEE}
            - kind: identifier, generic_name
              pattern: $CALLEE
    flags-type:
        regex: '^(global::)?(System\.)?(Reflection\.)?BindingFlags$'
    non-public-member:
        kind: member_access_expression
        regex: '^(global::)?(System\.)?(Reflection\.)?BindingFlags\.NonPublic$'
    non-public-flag:
        has:
            stopBy: end
            any:
                - matches: non-public-member
                - kind: cast_expression
                  all:
                    - has: {field: type, matches: flags-type}
                    - has: {field: value, kind: integer_literal}
                - kind: identifier
                  pattern: $FLAGS
                  inside:
                    kind: compilation_unit
                    stopBy: end
                    has:
                        stopBy: end
                        kind: variable_declarator
                        all:
                            - has: {field: name, pattern: $FLAGS}
                            - has: {stopBy: end, matches: non-public-member}
rule:
    any:
        - kind: invocation_expression
          has:
            field: function
            matches: callee
            regex: '(^|\.)Get(Safe)?UninitializedObject$'
        - kind: invocation_expression
          all:
            - has:
                field: function
                matches: callee
                all:
                    - has: {field: expression, regex: '^(global::)?(System\.)?Activator$'}
                    - has: {field: name, regex: '^CreateInstance$'}
            - has:
                field: arguments
                any:
                    - has: {kind: argument, nthChild: 2, has: {kind: boolean_literal, regex: '^true$'}}
                    - has: {kind: argument, all: [{has: {field: name, regex: '^nonPublic$'}}, {has: {kind: boolean_literal, regex: '^true$'}}]}
                    - matches: non-public-flag
        - kind: invocation_expression
          all:
            - has: {field: function, matches: callee, has: {field: name, regex: '^GetConstructors?$'}}
            - has: {field: arguments, matches: non-public-flag}
        - kind: member_access_expression
          has: {field: name, pattern: $CALLEE, regex: '^DeclaredConstructors$'}
        - kind: method_declaration
          all:
            - has: {field: name, pattern: $CALLEE}
            - has:
                kind: attribute_list
                has:
                    kind: attribute
                    all:
                        - has: {field: name, regex: '^((global::)?System\.Runtime\.CompilerServices\.)?UnsafeAccessor(Attribute)?$'}
                        - has: {stopBy: end, kind: attribute_argument, nthChild: 1, regex: '(^|\.)UnsafeAccessorKind\.Constructor$'}
        - kind: invocation_expression
          has:
            field: function
            kind: member_access_expression
            all:
                - has:
                    field: name
                    kind: generic_name
                    pattern: $CALLEE
                    has:
                        kind: type_argument_list
                        not:
                            has:
                                nthChild: {position: 1, reverse: true}
                                any:
                                    - kind: predefined_type
                                    - kind: identifier, qualified_name, generic_name
                                      regex: |-
                                        (?x)^(global::)?(
                                            (System\.)?(Half|U?Int128)
                                            |(System\.Runtime\.InteropServices\.)?NFloat
                                            |(System\.Numerics\.)?(Vector[234]|Plane|Quaternion|Matrix3x2|Matrix4x4|Complex|Vector<.+>)
                                            |(System\.Runtime\.Intrinsics\.)?Vector(64|128|256|512)<.+>
                                            |(SixLabors\.ImageSharp\.PixelFormats\.)?(
                                                (A|Abgr|Argb|Bgr|Bgra|L|La|Rg|Rgb|Rgba)\d+P?
                                                |(Normalized)?(Byte|Short)[24]P?
                                                |Half(Single|Vector[24]P?)
                                                |RgbaHalfP?
                                                |RgbaVector
                                            )
                                        )$
                                    - kind: identifier
                                      pattern: $PARAMETER
                                      inside:
                                        stopBy: end
                                        has:
                                            kind: type_parameter_constraints_clause
                                            all:
                                                - has: {kind: identifier, pattern: $PARAMETER}
                                                - has:
                                                    kind: type_parameter_constraint
                                                    has: {field: type, regex: '^(global::)?((System\.Numerics\.)?I(BinaryInteger|(Binary)?FloatingPointIeee754)|(SixLabors\.ImageSharp\.PixelFormats\.)?IPixel)<'}
                - any:
                    - all:
                        - has: {field: expression, regex: '^(global::)?(System\.)?(Runtime\.CompilerServices\.)?Unsafe$'}
                        - has: {field: name, regex: '^(As|BitCast|Read|ReadUnaligned)<'}
                    - all:
                        - has: {field: expression, regex: '^(global::)?(System\.)?(Runtime\.InteropServices\.)?MemoryMarshal$'}
                        - has: {field: name, regex: '^(Cast|AsRef|Read|TryRead)<'}
message: '`$CALLEE` bypasses its type''s public constructors and factories'
note: Use a declared factory or public constructor, each runs the checks its type states
