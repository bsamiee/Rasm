# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    attribute-run:
        kind: 'attribute_item, line_comment, block_comment'
    from-attribute:
        kind: attribute_item
        regex: '^#\[\p{White_Space}*from\p{White_Space}*\]$'
    source-attribute:
        kind: attribute_item
        regex: '^#\[\p{White_Space}*source\p{White_Space}*\]$'
    redundant-source:
        matches: source-attribute
        any:
            - follows: {stopBy: {not: {matches: attribute-run}}, matches: from-attribute}
            - precedes: {stopBy: {not: {matches: attribute-run}}, matches: from-attribute}
            - precedes: {stopBy: {not: {matches: attribute-run}}, kind: field_declaration, has: {field: name, regex: '^source$'}}
rule:
    matches: redundant-source
fix: ''
message: '`#[source]` restates the source thiserror reads from `#[from]` or a field named `source`'
note: 'Delete the `#[source]` attribute'
