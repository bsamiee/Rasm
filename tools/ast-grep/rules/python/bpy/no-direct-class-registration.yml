# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
utils:
    registering:
        any:
            - kind: attribute
              all:
                  - has: { field: attribute, regex: '^register_class$' }
                  - has: { field: object, matches: { python-submodule: { parent: { regex: '^bpy$' }, child: { regex: '^utils$' } } } }
            - kind: identifier
              regex: '^register_class$'
              matches: { python-imported-name: { module: { regex: '^bpy\.utils$' }, name: { regex: '^register_class$' } } }
    annotated-class:
        kind: class_definition
        all:
            - has: { field: name, pattern: $CLASS }
            - has:
                  field: body
                  has:
                      kind: expression_statement
                      has:
                          kind: assignment
                          has: { field: type, has: { stopBy: end, any: [{ kind: generic_type, has: { nthChild: 1, regex: '^(typing(_extensions)?\.)?Annotated$' } }, { kind: subscript, has: { field: value, regex: '^(typing(_extensions)?\.)?Annotated$' } }] } }
rule:
    kind: call
    all:
        - has:
              field: function
              pattern: $CALLEE
              any:
                  - matches: registering
                  - kind: parenthesized_expression
                    matches: { python-unparenthesized: { value: { matches: registering } } }
        - has: { field: arguments, has: { kind: identifier, nthChild: { position: 1, ofRule: { not: { kind: comment } } }, pattern: $CLASS } }
        - inside: { kind: module, stopBy: end, has: { stopBy: end, matches: annotated-class } }
message: '`$CALLEE($CLASS)` registers `Annotated` property declarations, which Blender skips without an error'
note: 'Annotate each property with its `bpy.props` call, Blender reads `__annotations__` values as property definitions'
