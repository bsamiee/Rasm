# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: 'call_expression, binary_expression'
    pattern: $FACTOR
    matches: rust-duration-scaling
message: '`$FACTOR` converts a duration unit by a literal factor'
note: 'Call the count''s unit `Duration` constructor, or `as_millis_f64()` (`#![feature(duration_millis_float)]`) for `as_secs_f64() * 1000.0`'
