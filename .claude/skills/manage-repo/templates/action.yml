# Composite action of the steps jobs share, inputs in and a step output out
name: <Name>
description: <purpose>

inputs:
    <input>:
        description: <purpose>
        default: <value> # Inputs with a default are optional, a required flag restates it

outputs:
    <output>:
        description: <purpose>
        value: ${{ steps.<step>.outputs.<output> }} # Composite outputs map a step output

runs:
    using: composite
    steps:
        - uses: <owner>/<action>@v<major> # Dependabot moves the major tag
          with:
            <option>: <value>
        - id: <step>
          run: printf '<output>=%s\n' "$INPUT" >>"$GITHUB_OUTPUT" # The expression reaches the script through env
          shell: bash # Every run step declares its shell, the workflow defaults reach no composite step
          env:
            INPUT: ${{ inputs.<input> }}
