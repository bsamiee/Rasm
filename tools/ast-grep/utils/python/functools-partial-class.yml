# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: functools-partial-class
language: python
rule:
    any:
        - matches: functools-partial-callee
        - kind: identifier
          pattern: $BASE
          inside: {kind: module, stopBy: end, has: {kind: class_definition, stopBy: {kind: 'function_definition, class_definition'}, all: [{has: {field: name, pattern: $BASE}}, {has: {field: superclasses, has: {matches: functools-partial-class}}}]}}
