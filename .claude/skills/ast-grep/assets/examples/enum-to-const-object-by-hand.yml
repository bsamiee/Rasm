# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: enum-to-const-object-by-hand
language: typescript
severity: error
ignores: ['*.d.ts'] # A declaration file describes an enum another package emits
rule:
    kind: enum_declaration
    any: # The variants the guards of enum-to-const-object refuse, the residual keeps the scan red and states the manual correction
        - has: {field: body, has: {kind: property_identifier}} # Valueless member
        - inside: {kind: export_statement} # Exported member, the API break is repaired by hand
        - inside: {kind: ambient_declaration, stopBy: end} # declare enum, or an enum inside a declare namespace
        - regex: '^const' # const enum
message: Enum declares constants through emit-bearing syntax and its variant refuses the mechanical fold
note: >-
    Fold by hand into an `as const` object with its value union, assign each valueless member a value,
    keep the export on the object and its type, and drop `declare` and the `const` modifier
