# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-collected-windows
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - pattern: $R.collect::<Vec<$_>>().windows($N)
constraints:
    N: {kind: integer_literal}
message: '`$R` collects into a `Vec` only to read windows of `$N` items'
note: 'Call `<iterator>.map_windows(|window: &[_; <n>]| <value>)` (`#![feature(iter_map_windows)]`) when the output borrows nothing from the window'
