name: Release

on:
    workflow_dispatch: {}

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

defaults:
    run:
        shell: bash

env:
    DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
    version:
        runs-on: xcode-27
        timeout-minutes: 30
        permissions:
            contents: write
        outputs:
            commit: ${{ steps.released.outputs.commit }}
            projects: ${{ steps.released.outputs.projects }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0
            - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install
            - run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
            - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - id: released
              run: |
                  git tag --list | sort > "${RUNNER_TEMP}/before"
                  nx release --skip-publish
                  git tag --list | sort > "${RUNNER_TEMP}/after"
                  projects=$(comm -13 "${RUNNER_TEMP}/before" "${RUNNER_TEMP}/after" | sed 's/@[^@]*$//' | paste -sd, -)
                  commit=$(git rev-parse HEAD)
                  printf 'commit=%s\nprojects=%s\n' "${commit}" "${projects}" >> "${GITHUB_OUTPUT}"
              env:
                  GH_TOKEN: ${{ github.token }}

    build:
        needs: version
        if: needs.version.outputs.projects != ''
        strategy:
            matrix:
                include: &platforms
                    - runner: ubuntu-26.04
                      exclude: tag:os:darwin,tag:os:win32,tag:host:blender,tag:host:unreal
                    - runner: xcode-27
                      exclude: "*,!tag:os:darwin"
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
        env:
            UV_LOCKED: "true"
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.commit }}
                  persist-credentials: false
            - &tools
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install
            - &core
              if: matrix.runner == 'xcode-27'
              run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
            - &selected
              id: selected
              run: projects=$(nx show projects --projects="${RELEASED}" --exclude="${EXCLUDE}" --sep=,) && printf 'projects=%s\n' "${projects}" >> "${GITHUB_OUTPUT}"
              env:
                  RELEASED: ${{ needs.version.outputs.projects }}
                  EXCLUDE: ${{ matrix.exclude }}
            - if: matrix.runner == 'xcode-27' && steps.selected.outputs.projects != ''
              uses: mcneel/setup-rhino3d@b3faf87453962c0742ab2a5e72d3494505f660df # v3.0.0
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  release-version: wip
            - if: steps.selected.outputs.projects != ''
              run: nx run-many --targets=build --configuration=release --projects="${PROJECTS}"
              env:
                  PROJECTS: ${{ steps.selected.outputs.projects }}
            - run: git diff --exit-code -- '*Cargo.lock' '*Package.resolved'
            - if: steps.selected.outputs.projects != ''
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-${{ matrix.runner }}
                  path: |
                      .artifacts/
                      **/dist/
                      !**/node_modules/
                  if-no-files-found: error

    publish:
        needs: [version, build]
        strategy:
            matrix:
                include: *platforms
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        environment: release
        permissions:
            contents: write
            id-token: write
            packages: write
        steps:
            - *checkout
            - *tools
            - run: pnpm install
            - *core
            - *selected
            - if: steps.selected.outputs.projects != ''
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-${{ matrix.runner }}
            - if: steps.selected.outputs.projects != ''
              id: nuget
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              with:
                  user: ${{ secrets.NUGET_USER }}
            - if: steps.selected.outputs.projects != ''
              run: nx release publish --projects="${PROJECTS}" --excludeTaskDependencies
              env:
                  PROJECTS: ${{ steps.selected.outputs.projects }}
                  GH_TOKEN: ${{ github.token }}
                  NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
