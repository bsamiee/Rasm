# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-test-support"
edition.workspace = true
description       = "Test fixtures kept after a failed test: sessions and stores of the store service, SQLite files, folders, and drivers of started server containers"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[test]]
name = "suite"
path = "suite/main.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
tokio                  = { workspace = true }
futures                = { workspace = true }
arc-swap               = { workspace = true }
thiserror              = { workspace = true }
derive_more            = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
serde_path_to_error    = { workspace = true }
oci-spec               = { workspace = true }
jiff                   = { workspace = true }
uuid                   = { workspace = true }
http                   = { workspace = true }
aws-sdk-s3             = { workspace = true }
tonic                  = { workspace = true }
object_store           = { workspace = true }
clap                   = { workspace = true }
clickhouse             = { workspace = true }
redis                  = { workspace = true }
sqlx                   = { workspace = true, features = ["postgres", "sqlite-bundled", "sqlite-load-extension"] }
libsqlite3-sys         = { workspace = true }
sqlite-vec             = { workspace = true }
rdkafka                = { workspace = true }
assert_fs              = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }
rasm-store-proto       = { workspace = true }

[dev-dependencies]
backon = { workspace = true }
claims = { workspace = true }
blake3 = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
