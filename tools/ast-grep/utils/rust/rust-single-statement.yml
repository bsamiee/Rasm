# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-single-statement
language: rustlang
arguments: [first]
rule:
    kind: block
    all:
        - not: {has: {matches: rust-statement, follows: {stopBy: end, matches: rust-statement}}}
        - has: {all: [{matches: rust-statement}, {matches: first}]}
