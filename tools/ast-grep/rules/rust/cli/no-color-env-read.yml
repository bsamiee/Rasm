# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: 'string_literal, raw_string_literal'
    regex: '^r?#*"(NO_COLOR|CLICOLOR|CLICOLOR_FORCE|COLORTERM|TERM)"#*$'
    follows: {regex: '^=$', follows: {regex: '^env$'}}
    inside: {kind: token_tree, stopBy: {kind: attribute}, inside: {kind: attribute}}
    pattern: $NAME
message: '`$NAME` names a color variable `anstream` or `anstyle_query` reads'
note: 'Delete the `env` key and write through `anstream`, `anstyle_query::truecolor()` for RGB, `colorchoice_clap::Color::write_global()` for `--color`'
