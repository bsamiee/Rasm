# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: sql
severity: error
utils:
    null-test:
        any:
            - kind: is_expression
              all:
                - has: {field: left, pattern: $VALUE}
                - has: {field: right, kind: null_literal}
                - any: [{not: {has: {regex: '(?i-u)^distinct$'}}}, {has: {regex: '(?i-u)^not$'}}]
            - kind: is_null_expression
              all:
                - has: {field: operand, pattern: $VALUE}
                - has: {field: operator, regex: '(?i-u)^isnull$'}
    not-null-test:
        any:
            - kind: is_expression
              all:
                - has: {field: left, pattern: $VALUE}
                - any:
                    - has: {field: right, kind: unary_expression, all: [{has: {field: operator, regex: '(?i-u)^not$'}}, {has: {field: operand, kind: null_literal}}]}
                    - all: [{has: {field: right, kind: null_literal}}, {has: {regex: '(?i-u)^distinct$'}}, {not: {has: {regex: '(?i-u)^not$'}}}]
            - kind: is_null_expression
              all:
                - has: {field: operand, pattern: $VALUE}
                - not: {has: {field: operator, regex: '(?i-u)^isnull$'}}
    equality-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^==?$'}
            - any:
                - has: {field: left, pattern: $VALUE}
                - has: {field: right, pattern: $VALUE}
    searched-case:
        kind: case_expression
        not: {has: {field: subject, pattern: $_}}
    inner-choice:
        any:
            - matches: searched-case
            - matches: sql-iif-call
              has: {field: arguments, has: {nthChild: &second {position: 2, ofRule: &named {not: {kind: 'line_comment, block_comment'}}}}}
            - kind: parenthesized_expression
              has: {matches: inner-choice}
rule:
    any:
        - any:
              - all:
                  - pattern: {context: 'select case when $_ then $_ else $_ end', selector: case_expression}
                  - any:
                      - all: [{has: {field: when, matches: null-test}}, {has: {field: else, pattern: $VALUE}}]
                      - all: [{has: {field: when, matches: not-null-test}}, {has: {field: then, pattern: $VALUE}}]
              - all:
                  - matches: sql-iif-call
                  - has:
                      field: arguments
                      all:
                          - not: {has: {nthChild: &fourth {position: 4, ofRule: *named}}}
                          - any:
                              - all: [{has: {nthChild: &first {position: 1, ofRule: *named}, matches: null-test}}, {has: {nthChild: &third {position: 3, ofRule: *named}, pattern: $VALUE}}]
                              - all: [{has: {nthChild: *first, matches: not-null-test}}, {has: {nthChild: *second, pattern: $VALUE}}, {has: {nthChild: *third}}]
        - all:
            - pattern: {context: 'select case when $_ then $_ else $VALUE end', selector: case_expression}
            - has: {field: then, kind: null_literal}
            - has: {field: when, matches: equality-test}
        - all:
            - pattern: {context: 'select case $VALUE when $_ then $_ else $VALUE end', selector: case_expression}
            - has: {field: then, kind: null_literal}
        - all:
            - matches: sql-iif-call
            - has: {field: arguments, all: [{not: {has: {nthChild: *fourth}}}, {has: {nthChild: *third, pattern: $VALUE}}, {has: {nthChild: *second, kind: null_literal}}, {has: {nthChild: *first, matches: equality-test}}]}
        - any:
              - {matches: searched-case, has: {field: else, matches: inner-choice}}
              - matches: sql-iif-call
                has:
                    field: arguments
                    has:
                        matches: inner-choice
                        all:
                            - not: {precedes: {stopBy: end, not: {kind: 'line_comment, block_comment'}}}
                            - nthChild: {position: '2n+3', ofRule: *named}
message: 'Conditional branches repeat expression text or nest another choice'
note: 'Use `coalesce`, `nullif`, searched `case`, or variadic `iif` while preserving evaluation and collation'
