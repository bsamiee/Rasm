id: require-write-lines-overwrite
valid:
    # The overwrite form that keeps the timestamp for the incremental check
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite="true" WriteOnlyWhenDifferent="true" />
    # Another file task takes no Overwrite
    - |
      <Touch Files="$(IntermediateOutputPath)stamp.txt" AlwaysCreate="true" />
    # Single-quoted values
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite='true' WriteOnlyWhenDifferent='true' />
invalid:
    # No Overwrite, two lines after two builds
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" />
    # Overwrite set to false appends as well
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite="false" />
    # Overwrite alone rewrites the file and moves its timestamp on every build
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite="true" />
    # WriteOnlyWhenDifferent alone appends, two lines after two builds
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" WriteOnlyWhenDifferent="true" />
    # Overwrite false beside WriteOnlyWhenDifferent appends
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite="false" WriteOnlyWhenDifferent="true" />
    # WriteOnlyWhenDifferent false beside Overwrite rewrites the file on every build
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite="true" WriteOnlyWhenDifferent="false" />
    # Single-quoted Overwrite alone, the fix writes both attributes in double quotes
    - |
      <WriteLinesToFile File="$(IntermediateOutputPath)version.txt" Lines="$(Version)" Overwrite='true' />
