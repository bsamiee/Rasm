# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-serialized-text-search-tsx
language: tsx
severity: error
files: ['tests/typescript/**']
utils:
    serialized-text:
        regex: '^(textContent|innerText|innerHTML|outerHTML)$'
        pattern: $FIELD
rule:
    kind: call_expression
    has:
        field: function
        kind: member_expression
        all:
            - has: {field: property, regex: '^(includes|startsWith|endsWith|indexOf|lastIndexOf|match|matchAll|search)$'}
            - has:
                field: object
                any:
                    - {kind: identifier, matches: serialized-text}
                    - {kind: member_expression, has: {field: property, matches: serialized-text}}
message: 'Substring search over serialized `$FIELD`'
note: 'Assert the parsed value: a role and name locator, `toHaveTextContent`, a computed style, or a CSSOM rule'
