# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unsubscriptable-class-py313
language: python
severity: error
files:
    - .claude/skills/use-blender/scripts/*.py
    - .claude/skills/use-rhino/scripts/{canvas,document,file3dm,records}.py
    - tools/interface/{roles,report,units,render,aliases,frame}.py
    - tools/interface/rhino/{window,markup}.py
    - tools/interface/blender/rows.py
    - tools/interface/*/script/**
    - tools/interface/blender/extension/**
rule:
    pattern: $G
    matches:
        python-evaluated-subscript:
            value:
                any:
                    - matches: {python-builtin-name: {name: {regex: '^(classmethod|memoryview|slice|staticmethod)$'}}}
                    - matches: {python-member-use: {module: {regex: '^abc$'}, name: {regex: '^(abstractclassmethod|abstractstaticmethod)$'}}}
                    - matches: {python-member-use: {module: {regex: '^ctypes$'}, name: {regex: '^py_object$'}}}
                    - matches: {python-member-use: {module: {regex: '^sqlite3(\.dbapi2)?$'}, name: {regex: '^Binary$'}}}
                    - matches: {python-member-use: {module: {regex: '^types$'}, name: {regex: '^UnionType$'}}}
message: '`$G` defines no `__class_getitem__` on Python 3.13 and its subscript raises `TypeError` at evaluation'
note: 'Use the `|` union of the arguments for `types.UnionType`, the `collections.abc` protocol the value satisfies (`Callable`, `Sequence`), or the class unsubscripted where its type parameters have defaults, each evaluates on Python 3.13'
