            - not: {inside: {kind: program, stopBy: end, has: {kind: 'method_declaration, field_declaration'}}}
rule: {kind: 'field_declaration, constant_declaration', pattern: $DECLARATION}
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        inside: {kind: 'field_declaration, constant_declaration'}
        has: {field: name, pattern: $DECLARED}
      fix: $DECLARED
    - id: declarator
      rule:
        kind: variable_declarator
        inside: {kind: 'field_declaration, constant_declaration'}
        has: {field: name, pattern: $DECLARED}
        any:
            - has: {field: dimensions, pattern: $DIMENSIONS}
            - pattern: $_
      fix: $DECLARED$DIMENSIONS
transform:
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [name], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[declarator])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}])+$', by: ''}}
