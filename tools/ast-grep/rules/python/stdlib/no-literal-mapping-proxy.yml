# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
ignores: ['{apps/blender,libs/python/blender,libs/python/data/records}/**', 'eng/python/rasm_eng/_{probe,session,streams}.py']
rule:
    kind: call
    all:
        - has:
            field: arguments
            kind: argument_list
            has:
                all: [{nthChild: {position: 1, ofRule: &argument {not: {kind: comment}}}}, {nthChild: {position: 1, reverse: true, ofRule: *argument}}]
                any:
                    - kind: dictionary, dictionary_comprehension
                    - kind: keyword_argument
                      all: [{has: {field: name, pattern: mapping}}, {has: {field: value, kind: 'dictionary, dictionary_comprehension'}}]
        - has: {field: function, matches: {python-member-use: {module: {regex: '^types$'}, name: {regex: '^MappingProxyType$'}}}}
        - pattern: $CALL
message: '`$CALL` wraps a literal mapping in a view on Python 3.15'
note: 'Write `frozendict(<mapping>)`'
