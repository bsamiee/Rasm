# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-telemetry"
version.workspace    = true
edition.workspace    = true
description          = "Process telemetry under OpenTelemetry conventions"
repository.workspace = true
license.workspace    = true
keywords             = ["tracing", "opentelemetry", "otlp", "logging"]
categories           = ["development-tools::debugging"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
nonempty-collections               = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
json-subscriber                    = { workspace = true }
log                                = { workspace = true }
opentelemetry                      = { workspace = true }
opentelemetry-appender-tracing     = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
opentelemetry-resource-detectors   = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
tracing                            = { workspace = true }
tracing-log                        = { workspace = true }
tracing-opentelemetry              = { workspace = true }
tracing-subscriber                 = { workspace = true }
clap                               = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
