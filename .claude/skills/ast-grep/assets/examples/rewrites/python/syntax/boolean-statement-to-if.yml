# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: boolean-statement-to-if
language: python
severity: off # On demand, ast-grep scan --filter '^boolean-statement-to-if$' --error=boolean-statement-to-if -U <paths>
rule:
    kind: expression_statement
    pattern: $STMT
    has: # The operator as the statement's value, reached through parentheses alone, a call or a name holding it stops the walk
        kind: boolean_operator
        stopBy: {not: {kind: parenthesized_expression}}
        has: {field: right, any: [{kind: call}, {kind: await}]} # The right operand is the effect, a name there is ruff useless-expression
constraints:
    STMT: {not: {regex: '\n'}} # Statement on one line, the parenthesized multi-line form re-indents the effect past the if
rewriters:
    - id: and-statement # The and form runs the effect when the test holds, the template re-indents its body by the match's column
      rule: {kind: boolean_operator, pattern: $TEST and $EFFECT}
      fix: |-
          if $TEST:
              $EFFECT
    - id: or-boolean-statement # Rewriters hold their own constraints, the boolean test takes parentheses and precedes the plain form
      rule: {kind: boolean_operator, pattern: $TEST or $EFFECT}
      constraints: {TEST: {kind: boolean_operator}}
      fix: |-
          if not ($TEST):
              $EFFECT
    - id: or-statement
      rule: {kind: boolean_operator, pattern: $TEST or $EFFECT}
      fix: |-
          if not $TEST:
              $EFFECT
transform:
    OUT: rewrite($STMT, rewriters=[and-statement, or-boolean-statement, or-statement], joinBy='') # joinBy drops the parentheses around the operator
fix: $OUT
message: Boolean operator as a statement runs its right operand for an effect and drops the value
note: Write the `if` statement, `if <test>:` for `and` and `if not <test>:` for `or`, with the effect in its body
