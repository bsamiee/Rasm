name: Feature
description: Propose capability for product or library
labels: [enhancement]
body:
    - type: input
      id: product
      attributes:
        label: Product
        description: App or library folder under apps/ or libs/
        placeholder: libs/typescript/web/ui
      validations:
        required: true
    - type: textarea
      id: problem
      attributes:
        label: Problem
        description: Task product cannot do, with workaround in use
      validations:
        required: true
    - type: textarea
      id: proposal
      attributes:
        label: Proposal
        description: Behavior solving problem, with host APIs or packages it uses
