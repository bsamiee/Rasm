# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-yield-generator
language: tsx
severity: error
utils:
    # Body holding one yield alone, returned, discarded, or bound and returned, a comment counts as a statement and keeps the generator
    one-yield-body:
        kind: statement_block
        any:
            - all:
                  - has: {kind: return_statement, has: {kind: yield_expression}}
                  - not: {has: {nthChild: 2}}
            - all:
                  - has: {kind: expression_statement, has: {kind: yield_expression}}
                  - not: {has: {nthChild: 2}}
            # The declaration and the return are the two statements, the count guard pins their positions
            - all:
                  - has:
                        kind: lexical_declaration
                        has: {kind: variable_declarator, all: [{has: {field: name, pattern: $HELD}}, {has: {field: value, kind: yield_expression}}]}
                  - has: {kind: return_statement, has: {kind: identifier, pattern: $HELD}}
                  - not: {has: {nthChild: 3}}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, pattern: $M.gen}
        - has: {field: arguments, has: {kind: generator_function, has: {field: body, matches: one-yield-body}}}
        # Either exports no asVoid, its discarded yield keeps the generator
        - not: {pattern: 'Either.gen(function* () { yield* $_; })'}
        # The overload binding this reads the receiver inside the body, the yielded effect outside it reads another this
        - not: {has: {field: arguments, has: {nthChild: 2}}}
constraints:
    M: {regex: '^(Effect|Micro|STM|Option|Either)$'}
rewriters:
    # The yielded effect is the generator's answer
    - id: returned
      rule: {pattern: '$_.gen(function* () { return yield* $E; })'}
      fix: $E
    - id: bound
      rule: {pattern: '$_.gen(function* () { const $X = yield* $E; return $X; })'}
      fix: $E
    # A discarded yield answers void through asVoid
    - id: discarded
      rule: {pattern: '$M.gen(function* () { yield* $E; })'}
      fix: $M.asVoid($E)
transform:
    YIELDED: rewrite($CALL, rewriters=[returned, bound, discarded])
fix: $YIELDED
message: The generator yields one effect and answers it, the effect itself
note: >-
    Use the effect the generator yields, `load(path)` for `Effect.gen(function* () { return yield* load(path); })`,
    and `Effect.asVoid(effect)` for a discarded yield, a generator holds two or more dependent yields
