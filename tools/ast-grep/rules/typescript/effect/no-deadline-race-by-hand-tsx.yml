# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-deadline-race-by-hand-tsx
language: tsx
severity: error
utils:
    sleep-call:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^sleep$'}}}}
    sleep-branch:
        any:
            - matches: sleep-call
            - kind: call_expression
              any:
                - has: {field: function, kind: member_expression, has: {field: object, matches: sleep-call}}
                - has: {field: arguments, has: {nthChild: 1, matches: sleep-call}}
rule:
    kind: call_expression
    pattern: $RACE
    all:
        - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^race$'}}}}
        - has: {field: arguments, has: {matches: sleep-branch}}
transform:
    HEAD: {replace: {source: $RACE, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$HEAD` races its source against `Effect.sleep` to compose a deadline fallback by hand'
note: 'Call `Effect.timeoutOrElse({ duration, orElse })`, or `Effect.timeoutOption` for `Option.none()` in place of `TimeoutError`'
