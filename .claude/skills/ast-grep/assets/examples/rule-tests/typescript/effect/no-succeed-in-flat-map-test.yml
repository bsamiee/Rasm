id: no-succeed-in-flat-map
valid:
    # The map
    - 'const next = Effect.map(work, (value) => value + 1);'
    # The as
    - 'const next = Effect.as(work, 1);'
    # Bind into an operation
    - 'const next = Effect.flatMap(work, (value) => load(value));'
    # Bind into another constructor of the module, Effect.sync runs a thunk
    - 'const next = Effect.flatMap(work, (value) => Effect.sync(() => report(value)));'
    # Bind into a constructor of another carrier, the callback answers no lifted value of the same module
    - 'const next = Effect.flatMap(work, (value) => Option.some(value));'
    # Block body with a statement before the return
    - 'const next = Effect.flatMap(work, (value) => { report(value); return Effect.succeed(value + 1); });'
    # Point-free constructor as the callback, the identity bind is deleted by hand
    - 'const next = work.pipe(Effect.flatMap(Effect.succeed));'
    # Bind on a module outside the carrier set
    - 'const next = Item.flatMap(item, (value) => Item.succeed(value + 1));'
    # Member outside the bind set
    - 'const next = Effect.tap(work, (value) => Effect.succeed(value + 1));'
    # Lifted value nested inside the answered operation
    - 'const next = Effect.flatMap(work, (value) => Effect.zipRight(log(value), Effect.succeed(value)));'
    # Layer bind, Layer.succeed builds a context from a tag and a value and the callback lifts no plain value
    - 'const next = Layer.flatMap(layer, () => Layer.succeed(Service, value));'
invalid:
    # The instance, a bind with a callback that lifts the mapped value
    - 'const next = Effect.flatMap(work, (value) => Effect.succeed(value + 1));'
    # Data-last as a pipe step
    - 'const next = work.pipe(Effect.flatMap((value) => Effect.succeed(value + 1)));'
    # Thunk callback, the value ignores the input
    - 'const next = Effect.flatMap(work, () => Effect.succeed(1));'
    # Data-last thunk
    - 'const next = work.pipe(Effect.flatMap(() => Effect.succeed(1)));'
    # andThen spelling
    - 'const next = Effect.andThen(work, (value) => Effect.succeed(value + 1));'
    # Block body with the one return
    - 'const next = Effect.flatMap(work, (value) => { return Effect.succeed(value + 1); });'
    # Function expression callback
    - 'const next = Effect.flatMap(work, function (value) { return Effect.succeed(value + 1); });'
    # Micro sibling
    - 'const next = Micro.flatMap(work, (value) => Micro.succeed(value + 1));'
    # STM sibling
    - 'const next = STM.flatMap(transaction, (value) => STM.succeed(value + 1));'
    # Stream sibling
    - 'const next = Stream.flatMap(stream, (value) => Stream.succeed(value + 1));'
    # Channel sibling
    - 'const next = Channel.flatMap(channel, (value) => Channel.succeed(value + 1));'
    # Sink sibling
    - 'const next = Sink.flatMap(sink, (value) => Sink.succeed(value + 1));'
    # Exit sibling
    - 'const next = Exit.flatMap(exit, (value) => Exit.succeed(value + 1));'
    # Option sibling, the lift is some
    - 'const next = Option.flatMap(found, (value) => Option.some(value + 1));'
    # Either sibling, the lift is right and the thunk keeps a map
    - 'const next = Either.flatMap(decoded, () => Either.right(1));'
    # Either data-last thunk keeps the map
    - 'const next = decoded.pipe(Either.flatMap(() => Either.right(1)));'
    # Thunk with a block body, the as
    - 'const next = Effect.flatMap(work, () => { return Effect.succeed(1); });'
    # Thunk as a function expression, the as
    - 'const next = Effect.flatMap(work, function () { return Effect.succeed(1); });'
    # Data-last thunk with a block body
    - 'const next = work.pipe(Effect.flatMap(() => { return Effect.succeed(1); }));'
    # Data-last thunk as a function expression
    - 'const next = work.pipe(Effect.flatMap(function () { return Effect.succeed(1); }));'
    # Option andThen with a thunk, the as
    - 'const next = Option.andThen(found, () => Option.some(1));'
    # Typed parameter in the callback
    - 'const next = Effect.flatMap(work, (value: number) => Effect.succeed(value + 1));'
    # Object literal as the lifted value
    - 'const next = Effect.flatMap(work, (value) => Effect.succeed({ value }));'
