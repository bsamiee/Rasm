# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parameter-discard
language: python
severity: error
utils:
    target:
        inside:
            kind: assignment
            field: left
            stopBy: {not: {kind: 'pattern_list, tuple_pattern, list_pattern'}}
    throwaway:
        any:
            - kind: identifier
              regex: '^_\w*$'
              pattern: $T
              not:
                inside:
                    kind: function_definition
                    stopBy: {kind: 'function_definition, lambda'}
                    has: {field: body, has: {stopBy: end, kind: identifier, pattern: $T, not: {matches: target}}}
            - kind: pattern_list, tuple_pattern, list_pattern
              not: {has: {pattern: $_, not: {matches: throwaway}}}
    read:
        kind: identifier
        pattern: $Q
        not:
            any:
                - inside: {kind: attribute, field: attribute}
                - inside: {kind: keyword_argument, field: name}
                - inside:
                    stopBy: {not: {kind: 'expression_list, tuple, list, parenthesized_expression'}}
                    any:
                        - kind: delete_statement
                        - kind: assignment
                          has: {field: left, matches: throwaway}
    unread-parameter:
        kind: identifier
        all:
            - not: {regex: '^_$'}
            - pattern: $Q
            - inside:
                kind: function_definition
                stopBy: {kind: 'function_definition, lambda'}
                all:
                    - has: {field: parameters, has: {matches: {python-parameter: {name: {pattern: $Q}}}}}
                    - not: {has: {field: body, has: {stopBy: end, matches: read}}}
    discarded:
        any:
            - matches: unread-parameter
            - kind: expression_list, tuple, list, parenthesized_expression
              has: {pattern: $_}
              not: {has: {pattern: $_, not: {matches: discarded}}}
    removable-successor:
        pattern: $NEXT
        not: {matches: python-multiline-string}
    removable-predecessor:
        pattern: $PREV
        not: {matches: python-multiline-string}
        precedes: {not: {precedes: {pattern: $_}}}
rule:
    all:
        - any:
            - kind: expression_statement
              has:
                kind: assignment
                all:
                    - has: {field: left, matches: throwaway}
                    - has: {field: right, matches: discarded, pattern: $P}
            - kind: delete_statement
              has: {matches: discarded, pattern: $P}
        - any:
            - precedes: {matches: removable-successor}
            - follows: {matches: removable-predecessor}
            - pattern: $UNFIXED
fix:
    template: $NEXT$PREV$UNFIXED
    expandStart: {matches: removable-predecessor}
    expandEnd: {matches: removable-successor}
message: 'Statement discards unread parameter `$P`'
note: 'Delete the statement, parameter, and call arguments, mark an override `@typing.override`, or rename a host callback parameter `_<name>`'
