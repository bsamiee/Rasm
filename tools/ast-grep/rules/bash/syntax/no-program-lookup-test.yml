# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
utils:
    lookup:
        kind: command
        all:
            - matches: bash-program-lookup
            - has: {kind: 'word, string, raw_string, simple_expansion, expansion, concatenation', nthChild: {position: 1, reverse: true}, not: {regex: '^-'}, pattern: $PROGRAM}
    statement:
        any:
            - matches: lookup
            - {kind: redirected_statement, has: {field: body, matches: lookup}}
    output:
        any:
            - kind: command_substitution
              has: {matches: statement}
              not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
            - kind: string
              has: {matches: output, follows: {regex: '^"$'}, precedes: {regex: '^"$'}}
    assignment:
        kind: variable_assignment
        has: {field: value, matches: output}
    status-read:
        any:
            - inside: {kind: 'list, negated_command'}
            - inside: {kind: 'if_statement, while_statement', field: condition}
            - {nthChild: 1, inside: {kind: elif_clause}}
            - precedes: {stopBy: {not: {regex: '^;$'}}, has: {kind: special_variable_name, regex: '^\?$', stopBy: end}}
    emptiness-test:
        matches: output
        any:
            - inside: {kind: test_command}
            - inside: {kind: unary_expression, has: {field: operator, regex: '^-[nz]$'}}
            - inside: {kind: binary_expression, all: [{has: {field: operator, regex: '^(==?|!=)$'}}, {has: {field: right, regex: '^(""|'''')$'}}]}
rule:
    any:
        - {any: [{matches: statement}, {matches: assignment}], matches: status-read}
        - {matches: emptiness-test}
message: '`$PROGRAM` lookup controls a status or emptiness check'
note: Declare required programs as dependencies and call them directly
