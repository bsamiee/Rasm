# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-method-class
language: python
severity: error
utils:
    init: {kind: function_definition, has: {field: name, regex: '^__init__$'}}
    static-method:
        kind: decorated_definition
        has: {kind: decorator, regex: '^@staticmethod$'}
        not: {has: {kind: function_definition, has: {field: name, regex: '^__.*__$'}}}
rule:
    kind: class_definition
    all:
        - has: {field: name, pattern: $NAME}
        - not: {inside: {kind: decorated_definition}}
        - not: {has: {kind: identifier, regex: '^__class__$', stopBy: end}}
        - not: {has: {field: superclasses, kind: argument_list}}
        - has:
            field: body
            any:
                - all:
                    - has: {kind: function_definition, not: {has: {field: name, regex: '^__.*__$'}}}
                    - not: {has: {nthChild: {position: 2, ofRule: {not: {any: [{matches: python-inert-statement}, {matches: init}]}}}}}
                - all:
                    - has: {matches: static-method}
                    - not: {has: {not: {any: [{matches: python-inert-statement}, {matches: static-method}]}}}
message: '`$NAME` holds one instance method or only static methods, the form of a function, a `msgspec.Struct` holding the state with the operation as its method, or a dict of the values'
labels:
    NAME: {style: primary, message: Class with one method}
