id: msbuild-task-parameter
language: xml
role: member
parentRuleIds: [msbuild-using-task]
symbolType: property
utils:
    project-task:
        kind: element
        has: {kind: STag, has: {kind: Name, regex: '^UsingTask$'}}
        inside:
            kind: content
            inside:
                kind: element
                inside: {kind: document}
                has: {kind: STag, has: {kind: Name, regex: '^Project$'}}
    task-parameters:
        kind: element
        has: {kind: STag, has: {kind: Name, regex: '^ParameterGroup$'}}
        inside: {kind: content, inside: {matches: project-task}}
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _HEADER
        has: {kind: Name, pattern: _NAME}
    inside: {kind: content, inside: {matches: task-parameters}}
name: $NAME
signature: $HEADER
isPublic: true
