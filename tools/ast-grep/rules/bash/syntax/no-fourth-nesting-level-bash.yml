# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-bash
language: bash
severity: error
utils:
    control: {kind: 'if_statement, for_statement, c_style_for_statement, while_statement, case_statement'}
    boundary: {any: [{matches: control}, {kind: function_definition}]}
rule:
    matches: control
    pattern: $CONTROL
    inside:
        matches: control
        stopBy: {matches: boundary}
        inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                stopBy: {matches: boundary}
                not: {inside: {matches: control, stopBy: {kind: function_definition}}}
transform:
    HEAD: {replace: {source: $CONTROL, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level'
note: Fold inner levels into one `case` over combined conditions or an upstream filter pipeline
