# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-throwing-mapper-conversion
language: csharp
severity: error
utils:
    source-root:
        any:
            - kind: identifier
              pattern: $SOURCE
            - kind: identifier
              pattern: $ELEMENT
              any:
                - inside:
                    stopBy: end
                    kind: lambda_expression
                    all:
                        - has:
                            field: parameters
                            any:
                                - kind: implicit_parameter
                                  pattern: $ELEMENT
                                - has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $ELEMENT}}
                        - inside:
                            kind: argument
                            inside:
                                kind: argument_list
                                inside:
                                    kind: invocation_expression
                                    has: {field: function, kind: member_access_expression, has: {field: expression, matches: source-path}}
                - inside:
                    stopBy: end
                    kind: query_expression
                    has:
                        kind: from_clause
                        all:
                            - has: {field: name, pattern: $ELEMENT}
                            - has: {nthChild: {position: 1, reverse: true}, matches: source-path}
            - kind: identifier
              pattern: $LOCAL
              inside:
                stopBy: end
                kind: method_declaration
                has:
                    stopBy: end
                    kind: variable_declarator
                    all:
                        - has: {field: name, pattern: $LOCAL}
                        - has: {nthChild: 2, matches: source-path}
    source-path:
        any:
            - matches: source-root
            - kind: member_access_expression
              has: {field: expression, matches: source-path}
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, has: {field: expression, matches: source-path}}
            - kind: conditional_access_expression
              all:
                - has: {field: condition, matches: source-path}
                - has: {kind: member_binding_expression}
            - kind: postfix_unary_expression, parenthesized_expression
              has: {matches: source-path}
    source-argument:
        kind: argument
        has: {nthChild: {position: 1, reverse: true}, matches: source-path}
    key-source:
        any:
            - kind: identifier
              pattern: $SOURCE
            - kind: invocation_expression
              has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: expression, matches: key-source}
                    - has: {field: name, regex: '^(Trim|TrimStart|TrimEnd|ToUpper|ToUpperInvariant|ToLower|ToLowerInvariant|Normalize|Replace|Substring)$'}
            - kind: postfix_unary_expression, parenthesized_expression
              has: {matches: key-source}
    source-parameter:
        inside:
            stopBy: end
            kind: method_declaration
            all:
                - matches: csharp-mapping-method
                - has: {field: parameters, has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $SOURCE}}}
    key-parameter:
        inside:
            stopBy: end
            kind: method_declaration
            has:
                field: parameters
                has:
                    kind: parameter
                    all:
                        - has: {field: name, pattern: $SOURCE}
                        - has: {field: type, regex: '^(string|bool|(System\.)?(Guid|DateTime|DateTimeOffset|DateOnly|TimeOnly|TimeSpan|Uri))\??$'}
    helper-conversion:
        inside:
            kind: compilation_unit
            stopBy: end
            has:
                stopBy: end
                kind: method_declaration, local_function_statement
                all:
                    - has: {field: name, pattern: $HELPER}
                    - not: {matches: csharp-mapping-method}
                    - has:
                        stopBy: end
                        any:
                            - kind: invocation_expression
                              has: {field: function, matches: csharp-throwing-factory}
                            - kind: member_access_expression
                              matches: csharp-throwing-factory
                              inside: {kind: argument}
rule:
    kind: invocation_expression, member_access_expression, cast_expression
    all:
        - matches: source-parameter
        - any:
            - kind: invocation_expression
              all:
                - has: {field: function, matches: csharp-throwing-factory, pattern: $CONVERSION}
                - has: {field: arguments, has: {matches: source-argument}}
            - kind: member_access_expression
              all:
                - matches: csharp-throwing-factory
                - pattern: $CONVERSION
                - inside:
                    kind: argument
                    inside:
                        kind: argument_list
                        inside:
                            kind: invocation_expression
                            has: {field: function, kind: member_access_expression, has: {field: expression, matches: source-path}}
            - kind: cast_expression
              all:
                - pattern: $CONVERSION
                - has: {field: type, kind: 'identifier, generic_name, qualified_name', not: {regex: '^(global::)?([\w.]+\.)?I[A-Z]\w*(<.+>)?$'}}
                - has: {field: value, matches: key-source}
                - matches: key-parameter
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    pattern: $CONVERSION
                    any:
                        - kind: identifier
                          pattern: $HELPER
                        - kind: member_access_expression
                          has: {field: name, kind: identifier, pattern: $HELPER}
                - has: {field: arguments, has: {matches: source-argument}}
                - matches: helper-conversion
message: "Mapping method converts `$SOURCE` through `$CONVERSION` and throws on rejected input"
note: Validate into the target type through its `Fin`-returning factory before mapping
