# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm"
version         = "0.1.0"
requires-python = ">=3.15"
dependencies    = []

# --- [DEPENDENCY_GROUPS] ----------------------------------------------------------------

[dependency-groups]
dev                   = [
    # --- [CHECKERS]

    "mypy",                                                                       # Type checker owning `exhaustive-match`, the `disallow_any_*` flags, `no-any-return`, unreachable code, and unused `type: ignore` comments
    "pydantic",                                                                   # mypy plugin typing each pydantic model, whose replace signature holds explicit `Any` without it
    "rasm-refurb",                                                                # Refurb checks over mypy types Ruff lacks, loaded by refurb as a plugin
    "refurb",                                                                     # FURB checks Ruff lacks, over a mypy build
    "ruff",                                                                       # Linter and formatter of every project
    "ty",                                                                         # Type checker of every project
    "vulture",                                                                    # Private functions, classes, methods, and attributes nothing reads
    "yamllint",                                                                   # YAML linter of every YAML file

    # --- [STUBS]

    "brotli-stubs",
    "pandas-stubs",
    "scipy-stubs",
    "types-geopandas",
    "types-grpcio",
    "types-lxml",
    "types-openpyxl",
    "types-protobuf",
    "types-psutil",
    "types-pyphen",
    "types-reportlab",
    "types-shapely",
]
test                  = [
    "hypothesis",                                                                 # Property-based tests
    "pytest",                                                                     # Test collection, assertions, and fixtures
    "pytest-cov",                                                                 # Coverage collection
    "pytest-randomly",                                                            # Random test order and seeds
    "pytest-socket",                                                              # Block unrequested network connections
    "pytest-timeout",                                                             # Per-test deadline
    "rasm-testing[hosting,sqlite]",                                               # SQLite and hosted server fixtures, each loaded by pytest as a plugin
    "testcontainers",                                                             # Disposable service containers a test starts, stops, and restarts, with Postgres, ClickHouse, Valkey, MinIO, and Kafka modules in one distribution
]
core                  = [
    "beartype",                                                                   # Runtime type checks over annotations
    "pydantic-settings",                                                          # Settings models read from environment and files
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",                           # AppKit, Foundation, and CoreFoundation for apps and main run loop
    "xxhash",                                                                     # Content identity hashes matching C# System.IO.Hashing
]
security              = [
    "azure-identity",                                                             # DefaultAzureCredential chain for Azure Key Vault secrets
    "azure-keyvault-secrets",                                                     # Azure Key Vault secret store
    "cryptography",                                                               # AES-GCM envelopes and key wrap for per-subject crypto-shredding
    "google-cloud-secret-manager",                                                # Google Cloud Secret Manager secret store
    "google-crc32c",                                                              # CRC32C integrity check for Google Cloud secret payloads
    "hvac",                                                                       # HashiCorp Vault secret store
    "keyring",                                                                    # OS keychain credential store
]
observability         = [
    "opentelemetry-api",                                                          # Trace, metric, and context API
    "opentelemetry-exporter-otlp-proto-grpc",                                     # OTLP gRPC exporter beside proto-http default
    "opentelemetry-exporter-otlp-proto-http",                                     # OTLP HTTP exporter, default transport
    "opentelemetry-instrumentation-asgi",                                         # ASGI server spans and W3C context extraction per Connect request
    "opentelemetry-instrumentation-asyncio",                                      # Trace context across coroutines, `to_thread` calls, and futures
    "opentelemetry-instrumentation-botocore",                                     # botocore request spans for S3 calls through boto3
    "opentelemetry-instrumentation-confluent-kafka",                              # confluent-kafka producer and consumer spans with trace context in message headers
    "opentelemetry-instrumentation-dbapi",                                        # PEP 249 spans for uninstrumented drivers (duckdb, ADBC DBAPI)
    "opentelemetry-instrumentation-httpx",                                        # `HTTPX2ClientInstrumentor` client spans with W3C trace context
    "opentelemetry-instrumentation-jinja2",                                       # Jinja template-render spans
    "opentelemetry-instrumentation-psycopg",                                      # psycopg 3 DBAPI spans
    "opentelemetry-instrumentation-redis",                                        # redis-py command spans against Valkey
    "opentelemetry-instrumentation-sqlite3",                                      # sqlite3 DBAPI spans
    "opentelemetry-instrumentation-system-metrics",                               # Host and process gauges over psutil
    "opentelemetry-instrumentation-threading",                                    # Cross-thread trace-context propagation
    "opentelemetry-instrumentation-urllib3",                                      # urllib3 request spans under clickhouse-connect queries
    "opentelemetry-processor-baggage",                                            # Baggage entries copied to span attributes for tenant dimension
    "opentelemetry-resource-detector-containerid",                                # container.id resource detector
    "opentelemetry-sdk",                                                          # Tracer provider, span processors, and in-memory span exporter
    "opentelemetry-semantic-conventions",                                         # Schema URL for telemetry
    "pyroscope-io",                                                               # Profiling agent feeding pyroscope-otel span-link exporter
    "pyroscope-otel",                                                             # Continuous-profiling span links beside OTLP exporters
]
execution             = [
    "apscheduler",                                                                # Cron, interval, and date triggers
    "cloudpickle",                                                                # Kernel and closure transfer to processes and subinterpreters
    "loky",                                                                       # Reusable process pool with worker restart
    "pebble",                                                                     # Worker kill at a terminal deadline and per-worker task recycling
    "tblib",                                                                      # Picklable tracebacks for worker exceptions across processes
    "wasmtime",                                                                   # In-process WASM guest sandbox for workers
    "watchfiles",                                                                 # File-change watching over Rust notify backend
]
parsing               = [
    "jinja2",                                                                     # Report templating for visual and document outputs
    "lark",                                                                       # Parser generator for CESQL filter, IDS, and selector grammars
    "lxml",                                                                       # XML processing
    "ruamel-yaml",                                                                # Round-trip YAML with comments and layout kept
]
data-exchange         = [
    "asyncssh",                                                                   # SSH and SFTP client for remote workers
    "boto3",                                                                      # AWS SDK S3 client, the one Python S3 client an OpenTelemetry instrumentation patches
    "brotli",                                                                     # Brotli compression
    "cloudevents",                                                                # CloudEvents attribute validation and protocol bindings
    "confluent-kafka[avro,json,protobuf,schemaregistry]<4",                       # Kafka client over librdkafka with Schema Registry serdes, built against Pixi `librdkafka` where no cp315 wheel exists, the Rust-core 4.x prerelease under the same name omits serializers, an sdist, and Windows wheels
    "connectrpc",                                                                 # Connect, gRPC, and gRPC-Web ASGI services and typed clients
    "detools",                                                                    # Binary-delta engine
    "fastavro",                                                                   # Avro codec and .avsc validation
    "fsspec",                                                                     # Filesystem resolution shared with UPath and blocking-read offload
    "hishel[httpx2]",                                                             # RFC 9111 cache over httpx2 transports with a SQLite store
    "hypercorn",                                                                  # HTTP/2 and h2c ASGI server for gRPC streams on TCP and UNIX binds
    "jsonschema",                                                                 # Document validation against fetched JSON Schemas
    "lz4",                                                                        # LZ4 compression
    "obspec-utils",                                                               # Multi-store ObjectStoreRegistry companion to obstore
    "obstore",                                                                    # Object-store backend
    "paho-mqtt",                                                                  # MQTT client for telemetry and edge-device transport
    "protobuf",                                                                   # google-protobuf runtime under Substrait and ONNX IR
    "protobuf-py",                                                                # Buf runtime for generated `_pb.py` codecs and descriptors
    "protovalidate",                                                              # Descriptor rules checked at transport and document producers
    "py7zr",                                                                      # 7z archive read and write
    "python-dateutil",                                                            # RFC 3339 isoparse for CloudEvents bindings and format readers
    "pyzmq",                                                                      # ZeroMQ sockets over the bundled libzmq
    "standardwebhooks",                                                           # Standard Webhooks signing and signature verification
    "stream-unzip",                                                               # Bounded-memory streaming unzip inverse for stream-zip
    "stream-zip",                                                                 # Bounded-memory streaming zip with ZIP64 and AES-256
    "universal-pathlib",                                                          # UPath storage_options and protocol resolution over fsspec registry
    "zlib-ng",                                                                    # Accelerated zlib and gzip compression
    "zstandard",                                                                  # Zstandard compression
]
mathematics           = [
    "array-api-compat",                                                           # Array API standard namespaces over each array library
    "array-api-extra",                                                            # Supplemental array API functions
    "clarabel",                                                                   # Clarabel conic solver, a cvxpy backend
    "cvxpy",                                                                      # Disciplined convex optimization
    "diffrax",                                                                    # JAX differential-equation solvers
    "equinox",                                                                    # JAX PyTree modules
    "findiff",                                                                    # Finite-difference operators for solvers and sensitivity
    "gmsh; sys_platform != 'linux' or platform_machine != 'aarch64'",             # Unstructured meshes with physical groups for scikit-fem and meshio, no linux aarch64 wheel or sdist
    "highspy",                                                                    # HiGHS LP, MIP, and QP solver, a cvxpy backend
    "jax",                                                                        # Autodiff and XLA-compiled array programs
    "jaxtyping",                                                                  # Array and PyTree shape and dtype contracts that import no jax
    "lineax",                                                                     # JAX linear solvers
    "mpmath",                                                                     # Arbitrary-precision real and complex math
    "optax",                                                                      # First-order JAX optimizers for optimistix
    "optimistix",                                                                 # JAX nonlinear solvers and adjoint VJP
    "pint",                                                                       # Unit registry and quantity arithmetic
    "python-flint",                                                               # Arb interval numerics
    "pywavelets",                                                                 # Discrete and continuous wavelet transforms
    "quadax",                                                                     # JAX adaptive quadrature
    "scikit-fem",                                                                 # FEM assembly
    "scs",                                                                        # SCS operator-splitting conic solver, a cvxpy backend
    "sectionproperties",                                                          # Cross-section property solver
    "sympy>=1.14.0",                                                              # Symbolic expressions beside python-flint and mpmath ground domains, uv takes 1.14.0rc1 or 1.12 for a newer mpmath, both lacking the `mpmath<1.4` bound their `mpmath.libmp.bitcount` import needs
    "uncertainties",                                                              # First-order error propagation with correlated values
]
statistics            = [
    "arviz",                                                                      # Bayesian diagnostics
    "blackjax",                                                                   # JAX NUTS/HMC samplers
    "numpyro",                                                                    # JAX NUTS sampler
    "nutpie",                                                                     # Rust NUTS sampler for PyMC
    "onnx",                                                                       # Model graph IR
    "pyDOE3",                                                                     # Classical design-of-experiments matrices
    "pymc>=5.28.1",                                                               # Probabilistic programming, older releases need undeclared arviz<1
    "salib",                                                                      # Global sensitivity analysis
    "scikit-learn",                                                               # Classical ML and ONNX export
    "skl2onnx",                                                                   # sklearn-to-ONNX converter
