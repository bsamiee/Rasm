# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unawaited-engine-condition
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    pattern: $CALL
    matches: claude-code-engine-condition
    # The nearest function is async, a call in a synchronous function belongs to no-unawaited-engine-condition-by-hand
    inside: {matches: syntax-function-boundary, stopBy: {matches: syntax-function-boundary}, has: {regex: '^async$'}}
rewriters:
    # Bare await where the call is the whole condition, parentheses beside an operator
    - id: bare-await
      rule:
          pattern: $C
          any:
              - inside:
                    kind: parenthesized_expression
                    inside: {field: condition, any: [{kind: if_statement}, {kind: while_statement}, {kind: do_statement}]}
              - inside: {kind: for_statement, field: condition}
              - inside: {kind: ternary_expression, field: condition}
              # The one argument slot the condition util admits is Boolean, its parentheses hold the await
              - inside: {kind: arguments}
      fix: await $C
    - id: wrapped-await
      rule: {pattern: $C}
      fix: (await $C)
transform:
    AWAITED: rewrite($CALL, rewriters=[bare-await, wrapped-await])
fix: $AWAITED
message: The engine call answers a Promise and the condition reads the Promise, a truthy and defined value
note: Await the call before the condition reads it, `if (await $.fs.exists(path))`, `(await $.store.get(key)) !== undefined`
