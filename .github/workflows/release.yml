name: Release

on:
    workflow_dispatch:
        inputs:
            specifier:
                description: Version or semver keyword the selected projects move to, as alpha to stable, empty reads commits after each project's last tag
                type: string
            projects:
                description: Projects the release selects in nx release --projects form, empty selects every release project
                type: string
            dry-run:
                description: Previews each project's version, tag, and GitHub release, changes nothing and skips attach and publish
                type: boolean
                default: true
            publish:
                description: Publishes every package to its registry or store after the release
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    release:
        name: Release
        runs-on: xcode-27
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
            id-token: write
        outputs:
            commit: ${{ steps.released.outputs.commit }}
            engines: ${{ steps.unreal.outputs.engines }}
        env:
            GH_TOKEN: &github ${{ github.token }}
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
            DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
            ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
            ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
            ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest-stable
            - &tools
              uses: $/.github/actions/tools
            - uses: $/.github/actions/signing
            - run: nx build @rasm/nx-apple-darwin-arm64
            - run: nx release ${SPECIFIER:+"${SPECIFIER}"} ${PROJECTS:+--projects="${PROJECTS}"} --skip-publish --dry-run=${{ inputs.dry-run }}
              env:
                  SPECIFIER: ${{ inputs.specifier }}
                  PROJECTS: ${{ inputs.projects }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            - id: released
              run: |-
                  commit="$(git rev-parse HEAD)"
                  printf "commit=%s\n" "${commit}" >> "${GITHUB_OUTPUT}"
            - id: unreal
              uses: $/.github/actions/unreal
            - if: ${{ !inputs.dry-run }}
              run: nx run-many --targets=attach --configuration=release --exclude='tag:host:unreal'
            - id: google
              if: &publishing ${{ inputs.publish && !inputs.dry-run }}
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
                  token_format: access_token
                  access_token_scopes: https://www.googleapis.com/auth/chromewebstore
                  create_credentials_file: false
                  export_environment_variables: false
            - if: *publishing
              run: nx release publish
              env:
                  PNPM_CONFIG__AUTH: '{"https://registry.npmjs.org":{"@":{"authToken":"${NODE_AUTH_TOKEN}"}}}'
                  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
                  UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
                  BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
                  CHROME_WEB_STORE_TOKEN: ${{ steps.google.outputs.access_token }}
                  CHROME_WEB_STORE_PUBLISHER: ${{ vars.CHROME_WEB_STORE_PUBLISHER }}
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
                  SPARKLE_FEED_BUCKET: ${{ vars.SPARKLE_FEED_BUCKET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    unreal:
        name: Unreal Engine ${{ matrix.engine }}
        needs: release
        if: ${{ !inputs.dry-run && needs.release.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.release.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            GH_TOKEN: *github
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: 'false'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release.outputs.commit }}
                  fetch-depth: 0
                  clean: false
            - *tools
            - run: nx run-many --targets=attach --configuration=release --exclude='*,!tag:host:unreal'
