id: numeric-test-to-arithmetic-command
valid:
    - '[[ $a == b || $c -gt 2 ]]'
    - '[[ -n $a && $a -eq 1 ]]'
    - '[ "$a" -eq 1 ]'
    - '[[ $(wc -l < f) -ne 0 ]]'
    - '[[ "a$x" -eq 1 ]]'
    - '[[ ${a:-} -eq 1 ]]'
    - '[[ ! $a -eq 1 ]]'
    - '[[ ${arr[@]} -eq 1 ]]'
    - (( a == 3 ))
    - '[[ $a =~ ^[0-9]+$ ]]'
    - '[[ $a -nt $b ]]'
invalid:
    - '[[ $a -eq 3 ]]'
    - '[[ $a -ne 3 && $a -lt 4 && $a -le 5 && $a -gt 1 && $a -ge 2 ]]'
    - '[[ "$b" -lt ${c} ]]'
    - '[[ ${arr[1]} -ne ${#arr[@]} || count -ge $((x + 1)) ]]'
    - '[[ $? -eq 0 ]]'
    - '[[ $1 -eq 1 ]]'
    - '[[ "${10}" -ge 2 ]]'
    - '[[ $a -eq -1 ]]'
    - '[[ ($a -gt 1) && $b -eq 0 ]]'
    - '[[ ! ($a -eq 1) ]]'
    - |
      if [[ $i -le 9 ]]; then
          :
      fi
    - while [[ $i -lt 3 ]]; do :; done
