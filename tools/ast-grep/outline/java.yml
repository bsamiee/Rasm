id: java-member-constant
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum, java-method]
symbolType: constant
utils:
    owner:
        inside:
            kind: class_body, interface_body, annotation_type_body, enum_body_declarations
            not: {inside: {kind: object_creation_expression}}
            inside:
                kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant
                stopBy: end
                any: [{inside: {kind: program}}, {has: {field: name, pattern: $OWNER}}]
    exposed:
        any:
            - has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}
            - inside: {kind: 'interface_body, annotation_type_body'}
              not: {has: {kind: modifiers, has: {pattern: private}}}
    public:
        matches: exposed
        not:
            any:
                - inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', stopBy: end, not: {matches: exposed}}
                - inside: {kind: program, stopBy: end, has: {kind: 'method_declaration, field_declaration'}}
rule:
    kind: field_declaration, constant_declaration
    pattern: $DECLARATION
    any:
        - kind: constant_declaration
        - has: {kind: modifiers, all: [{has: {pattern: static}}, {has: {pattern: final}}]}
    matches: owner
rewriters:
    - id: name
      rule: {kind: variable_declarator, inside: {kind: 'field_declaration, constant_declaration'}, has: {field: name, pattern: $DECLARED}}
      fix: $DECLARED
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [name], joinBy: ', '}}
    LINE: {replace: {source: $DECLARATION, replace: '(?:;|[\t-\r ])+$|[\t-\r ]*\n[\t-\r ]*', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $QUALIFIER$NAMES
signature: $SIGNATURE
isPublic: {matches: public}
---
id: java-member-field
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum, java-method]
symbolType: field
utils:
    owner:
        inside:
            kind: class_body, interface_body, annotation_type_body, enum_body_declarations
            not: {inside: {kind: object_creation_expression}}
            inside:
                kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant
                stopBy: end
                any: [{inside: {kind: program}}, {has: {field: name, pattern: $OWNER}}]
    exposed:
        any:
            - has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}
            - inside: {kind: 'interface_body, annotation_type_body'}
              not: {has: {kind: modifiers, has: {pattern: private}}}
    public:
        matches: exposed
        not:
            any:
                - inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', stopBy: end, not: {matches: exposed}}
                - inside: {kind: program, stopBy: end, has: {kind: 'method_declaration, field_declaration'}}
rule:
    kind: field_declaration
    pattern: $DECLARATION
    matches: owner
rewriters:
    - id: name
      rule: {kind: variable_declarator, inside: {kind: field_declaration}, has: {field: name, pattern: $DECLARED}}
      fix: $DECLARED
    - id: declarator
      rule:
        kind: variable_declarator
        inside: {kind: field_declaration}
        has: {field: name, pattern: $DECLARED}
        any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: variable_declarator}]
      fix: $DECLARED$DIMENSIONS
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [name], joinBy: ', '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [declarator]}}
    LINE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r ])+$|[\t-\r ]*\n[\t-\r ]*', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $QUALIFIER$NAMES
signature: $SIGNATURE
isPublic: {matches: public}
