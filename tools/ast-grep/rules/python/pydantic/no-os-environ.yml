# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-os-environ
language: python
severity: error
rule:
    matches: {python-module-member: {module: {regex: '^os$'}, name: {regex: '^(environ|environb|getenv|getenvb)$', pattern: $NAME}}}
message: '`os.$NAME` reads the process environment as untyped text'
note: Declare the variables on `class Settings(BaseSettings)` with typed fields and read `Settings()` once at startup
