syntax = "proto3";

package rasm.contracts.cad;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "rasm/contracts/cad/types.proto";
import "rasm/contracts/spatial/vector.proto";

// --- [PRIMITIVES] -----------------------------------------------------------------------

message BoxOp {
  reserved "x", "y", "z";

  double x_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double y_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double z_m = 3 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  rasm.contracts.spatial.Frame3 frame = 4 [(buf.validate.field).required = true];
}

// Rectangular face on the frame's XY plane at its origin and a smaller parallel face at height z; the window form
// places that top face by its own extents in the frame's XZ coordinates.
message WedgeWindow {
  option (buf.validate.message).cel = {
    id: "wedge_window.extent"
    message: "the top face window must have positive extent"
    expression: "this.x_max_m > this.x_min_m && this.z_max_m > this.z_min_m"
  };

  double x_min_m = 1 [(buf.validate.field).double.finite = true];
  double z_min_m = 2 [(buf.validate.field).double.finite = true];
  double x_max_m = 3 [(buf.validate.field).double.finite = true];
  double z_max_m = 4 [(buf.validate.field).double.finite = true];
}

message WedgeOp {
  double x_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double y_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double z_m = 3 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  oneof taper {
    option (buf.validate.oneof).required = true;

    double ridge_m = 4 [(buf.validate.field).double = {
      finite: true
      gte: 0
    }];
    WedgeWindow window = 5;
  }
  rasm.contracts.spatial.Frame3 frame = 6 [(buf.validate.field).required = true];
}

// Latitude band from the equator in radians and a longitude sweep from the frame's X axis; the full sphere is
// (-pi/2, pi/2, 2pi) and an absent bound on the operation elects it.
message SphereBounds {
  option (buf.validate.message).cel = {
    id: "sphere_bounds.latitude"
    message: "latitude bounds must ascend"
    expression: "this.latitude_high_rad > this.latitude_low_rad"
  };

  double latitude_low_rad = 1 [(buf.validate.field).double = {
    finite: true
    gte: -1.5707963267948966
    lte: 1.5707963267948966
  }];
  double latitude_high_rad = 2 [(buf.validate.field).double = {
    finite: true
    gte: -1.5707963267948966
    lte: 1.5707963267948966
  }];
  double longitude_rad = 3 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lte: 6.283185307179586
  }];
}

message SphereOp {
  reserved 2;
  reserved "radius", "center";

  double radius_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  rasm.contracts.spatial.Frame3 frame = 3 [(buf.validate.field).required = true];
  SphereBounds bounds = 4;
}

message CylinderOp {
  reserved 3;
  reserved "radius", "height", "axis";

  double radius_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double height_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  rasm.contracts.spatial.Frame3 frame = 4 [(buf.validate.field).required = true];
  // Angular sweep about the frame's Z axis from its X axis; absent elects the full revolution.
  optional double sweep_rad = 5 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lte: 6.283185307179586
  }];
}

message ConeOp {
  reserved 4;
  reserved "base_radius", "top_radius", "height", "axis";

  double base_radius_m = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  double top_radius_m = 2 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  double height_m = 3 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  rasm.contracts.spatial.Frame3 frame = 5 [(buf.validate.field).required = true];
  optional double sweep_rad = 6 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lte: 6.283185307179586
  }];

  option (buf.validate.message).cel = {
    id: "cone_op.radius"
    message: "at least one cone radius must be positive"
    expression: "this.base_radius_m > 0.0 || this.top_radius_m > 0.0"
  };
}

// Tube parameter bounds in radians and the sweep about the frame's Z axis; the full torus is (0, 2pi, 2pi).
message TorusBounds {
  option (buf.validate.message).cel = {
    id: "torus_bounds.tube"
    message: "tube bounds must ascend and span at most one revolution"
    expression: "this.tube_high_rad > this.tube_low_rad && this.tube_high_rad - this.tube_low_rad <= 6.283185307179586"
  };

  double tube_low_rad = 1 [(buf.validate.field).double = {
    finite: true
    gte: -6.283185307179586
    lte: 6.283185307179586
  }];
  double tube_high_rad = 2 [(buf.validate.field).double = {
    finite: true
    gte: -6.283185307179586
    lte: 6.283185307179586
  }];
  double sweep_rad = 3 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lte: 6.283185307179586
  }];
}

message TorusOp {
  reserved 3;
  reserved "major_radius", "minor_radius", "axis";

  double major_radius_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double minor_radius_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  rasm.contracts.spatial.Frame3 frame = 4 [(buf.validate.field).required = true];
  TorusBounds bounds = 5;

  option (buf.validate.message).cel = {
    id: "torus_op.radius"
    message: "minor radius must be smaller than major radius"
    expression: "this.minor_radius_m < this.major_radius_m"
  };
}

// --- [SET_ALGEBRA] ----------------------------------------------------------------------

message BooleanInputs {
  repeated SealedBody operands = 1 [(buf.validate.field).repeated.min_items = 2];
  double fuzzy_m = 2 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

// --- [GENERATIVE] -----------------------------------------------------------------------

// Arc rounds every convex corner; intersection extends the neighbouring edges to their meet and refuses where no meet exists.
enum OffsetJoin {
  OFFSET_JOIN_UNSPECIFIED = 0;
  OFFSET_JOIN_ARC = 1;
  OFFSET_JOIN_INTERSECTION = 2;
}

// `distance_m` moves the outer loop outward when positive; holes move by `hole_m` when stated and by the negated
// outer distance otherwise, so an unstated hole keeps the wall thickness the outer offset implies.
message ProfileOffset {
  double distance_m = 1 [(buf.validate.field).double = {
    finite: true
    not_in: [0]
  }];
  OffsetJoin join = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional double hole_m = 3 [(buf.validate.field).double = {
    finite: true
    not_in: [0]
  }];
}

message PlacedProfile {
  Profile profile = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Frame3 frame = 2 [(buf.validate.field).required = true];
  ProfileOffset offset = 3;
}

message ExtrudeOp {
  PlacedProfile section = 1 [(buf.validate.field).required = true];
  double distance_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  rasm.contracts.spatial.UnitDirection3 direction = 3 [(buf.validate.field).required = true];
}

message RevolveOp {
  PlacedProfile section = 1 [(buf.validate.field).required = true];
  double angle_rad = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lte: 6.283185307179586
  }];
  rasm.contracts.spatial.Axis3 axis = 3 [(buf.validate.field).required = true];
}

message LoftSection {
  ProfileRegion region = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Frame3 frame = 2 [(buf.validate.field).required = true];
}

message LoftTrack {
  option (buf.validate.message).cel = {
    id: "loft_track.hole_correspondence"
    message: "every loft section must carry the same number of index-corresponding holes"
    expression: "this.sections.all(section, section.region.holes.size() == this.sections[0].region.holes.size())"
  };

  repeated LoftSection sections = 1 [(buf.validate.field).repeated.min_items = 2];
}

enum LoftStyle {
  LOFT_STYLE_UNSPECIFIED = 0;
  LOFT_STYLE_RULED = 1;
  LOFT_STYLE_SMOOTH = 2;
}

message LoftOp {
  repeated LoftTrack tracks = 1 [(buf.validate.field).repeated.min_items = 1];
  LoftStyle style = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ThickOp {
  PlacedProfile section = 1 [(buf.validate.field).required = true];
  double distance_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double thickness_m = 3 [(buf.validate.field).double = {
    finite: true
    not_in: [0]
  }];
  reserved 4;
  reserved "join";

  rasm.contracts.spatial.UnitDirection3 direction = 5 [(buf.validate.field).required = true];
  OffsetJoin wall_join = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// The profile origin is the spine start. The provider fixes corrected-Frenet transport, transformed transitions,
// no contact, and section correction; those kernel controls are not public wire vocabulary.
message SweepOp {
  option (buf.validate.message).cel = {
    id: "sweep_op.origin"
    message: "section frame origin must equal the spine start"
    expression:
      "this.section.frame.origin.x_m == this.spine.start.x_m && "
      "this.section.frame.origin.y_m == this.spine.start.y_m && "
      "this.section.frame.origin.z_m == this.spine.start.z_m"
  };

  PlacedProfile section = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Curve3 spine = 2 [(buf.validate.field).required = true];
}

// --- [REWRITES] -------------------------------------------------------------------------

// Maps the source frame onto the target frame, then scales uniformly about the target origin.
message TransformOp {
  SealedBody source = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Frame3 source_frame = 2 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Frame3 target_frame = 3 [(buf.validate.field).required = true];
  double uniform_scale = 4 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

message RadiusRun {
  double start_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double end_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

message RadiusKnot {
  double at = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double radius_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

// Radius law over the normalized edge parameter: distinct knots spanning 0 to 1, ordered by the provider at admission.
message RadiusLaw {
  option (buf.validate.message).cel = {
    id: "radius_law.knots"
    message: "knots must open at 0, close at 1, and ascend"
    expression:
      "this.knots.exists(knot, knot.at == 0.0) && this.knots.exists(knot, knot.at == 1.0) && "
      "this.knots.all(knot, this.knots.filter(other, other.at == knot.at).size() == 1)"
  };

  repeated RadiusKnot knots = 1 [(buf.validate.field).repeated.min_items = 2];
}

message FilletOp {
  reserved 2;
  reserved "radius_m";

  SealedBody source = 1 [(buf.validate.field).required = true];
  Selection edges = 3 [(buf.validate.field).required = true];
  oneof radius {
    option (buf.validate.oneof).required = true;

    double constant_m = 4 [(buf.validate.field).double = {
      finite: true
      gt: 0
    }];
    RadiusRun run = 5;
    RadiusLaw law = 6;
  }
}

// Two distances measured on the referenced face and its neighbour; `face` is a face ordinal every selected edge bounds.
message ChamferSkew {
  double first_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double second_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  uint32 face = 3;
}

message ChamferAngle {
  double distance_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double angle_rad = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lt: 1.5707963267948966
  }];
  uint32 face = 3;
}

message ChamferOp {
  reserved 2;
  reserved "distance_m";

  SealedBody source = 1 [(buf.validate.field).required = true];
  Selection edges = 3 [(buf.validate.field).required = true];
  oneof form {
    option (buf.validate.oneof).required = true;

    double symmetric_m = 4 [(buf.validate.field).double = {
      finite: true
      gt: 0
    }];
    ChamferSkew skew = 5;
    ChamferAngle angled = 6;
  }
}

// Hollows the body by removing the named faces and offsetting the rest; a negative thickness walls inward.
message ShellOp {
  SealedBody source = 1 [(buf.validate.field).required = true];
  Indices faces = 2 [(buf.validate.field).required = true];
  double thickness_m = 3 [(buf.validate.field).double = {
    finite: true
    not_in: [0]
  }];
  OffsetJoin join = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Whether a drafted face pulls its tangent-continuous neighbours along or stops at its own boundary.
enum DraftPropagation {
  DRAFT_PROPAGATION_UNSPECIFIED = 0;
  DRAFT_PROPAGATION_STOP = 1;
  DRAFT_PROPAGATION_TANGENT = 2;
}

// Tilts the named faces by `angle_rad` about their intersection with the neutral plane, the frame's XY plane, along `pull`.
message DraftOp {
  SealedBody source = 1 [(buf.validate.field).required = true];
  Indices faces = 2 [(buf.validate.field).required = true];
  rasm.contracts.spatial.UnitDirection3 pull = 3 [(buf.validate.field).required = true];
  double angle_rad = 4 [(buf.validate.field).double = {
    finite: true
    gt: -1.5707963267948966
    lt: 1.5707963267948966
    not_in: [0]
  }];
  rasm.contracts.spatial.Frame3 neutral = 5 [(buf.validate.field).required = true];
  DraftPropagation propagation = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Offsets every face of the body along its normal; positive grows the body.
message OffsetOp {
  SealedBody source = 1 [(buf.validate.field).required = true];
  double offset_m = 2 [(buf.validate.field).double = {
    finite: true
    not_in: [0]
  }];
  OffsetJoin join = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Removes the named feature faces and re-closes the body over its neighbours.
message DefeatureOp {
  SealedBody source = 1 [(buf.validate.field).required = true];
  Indices faces = 2 [(buf.validate.field).required = true];
}

// --- [HEALING] --------------------------------------------------------------------------

message SewStep {
  double tolerance_m = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

// Shape repair under one working precision and the tolerance ceiling it may inflate up to.
message FixStep {
  option (buf.validate.message).cel = {
    id: "fix_step.tolerance"
    message: "the tolerance ceiling must not sit below the working precision"
    expression: "this.max_tolerance_m >= this.precision_m"
  };

  double precision_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  double max_tolerance_m = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

// Merges edges shorter than the precision into their neighbours; the provider refuses a precision at or above the body's least edge.
message SmallEdgesStep {
  double precision_m = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

message HealStep {
  oneof step {
    option (buf.validate.oneof).required = true;

    SewStep sew = 1;
    google.protobuf.Empty unify = 2;
    FixStep fix = 3;
    SmallEdgesStep small_edges = 4;
  }
}

message HealOp {
  SealedBody source = 1 [(buf.validate.field).required = true];
  repeated HealStep steps = 2 [(buf.validate.field).repeated.min_items = 1];
}

// --- [SERVICE] --------------------------------------------------------------------------

message ExecuteRequest {
  reserved 17;
  reserved "sew";

  oneof operation {
    option (buf.validate.oneof).required = true;

    BoxOp box = 1;
    SphereOp sphere = 2;
    CylinderOp cylinder = 3;
    ConeOp cone = 4;
    TorusOp torus = 5;
    BooleanInputs fuse = 6;
    BooleanInputs cut = 7;
    BooleanInputs common = 8;
    BooleanInputs section = 9;
    BooleanInputs split = 10;
    ExtrudeOp extrude = 11;
    RevolveOp revolve = 12;
    LoftOp loft = 13;
    ThickOp thick = 14;
    FilletOp fillet = 15;
    ChamferOp chamfer = 16;
    SealedBody nurbs = 18;
    SweepOp sweep = 19;
    TransformOp transform = 20;
    HealOp heal = 21;
    ShellOp shell = 22;
    DraftOp draft = 23;
    OffsetOp offset = 24;
    DefeatureOp defeature = 25;
    WedgeOp wedge = 26;
  }
  Emission output = 30 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// `correspondence` rides every operation whose kernel answers history and `healing` rides the heal arm alone.
message ExecuteResponse {
  reserved 2;
  reserved "shape", "step";

  BrepKernelReceipt receipt = 1 [(buf.validate.field).required = true];
  SealedBody body = 3 [(buf.validate.field).required = true];
  Correspondence correspondence = 4;
  HealingReceipt healing = 5;
}
