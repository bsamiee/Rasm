id: no-machine-path-in-case
valid:
    - |
      id: <id>
      invalid:
          # Import from one machine
          - |
            <Import Project="/Users/someone/checkout/libs/Item/Item.csproj" />
    - |
      id: <id>
      invalid:
          # Hint path with a drive letter
          - |
            <Reference Include="Item" HintPath="C:\tools\Item\Item.dll" />
    - |
      id: <id>
      invalid:
          # Reference into the user's package cache
          - "<Reference Include=\"Item\" HintPath=\"~/.nuget/packages/item/1.0.0/lib/Item.dll\" />"
    - |
      id: <id>
      valid:
          # Relative project reference
          - '<ProjectReference Include="../../libs/Item/Item.csproj" />'
    - |
      id: <id>
      valid:
          # A package id
          - '<PackageReference Include="Rasm.Item" />'
    - |
      id: <id>
      valid:
          # Read at /Volumes/Work/Rasm
          - Item
    - |
      id: <id>
      valid:
          # A documentation link
          - "https://example.com/Users/someone/Item"
    - |
      id: <id>
      valid:
          # A repository link
          - "https://github.com/someone/Rasm/blob/main/Item.props"
    - |
      id: <id>
      valid:
          # A project under a repository directory
          - libs/dotnet/Rasm/Item.csproj
    - |
      id: <id>
      valid:
          # A storage route
          - storage/Volumes/Item
    - |
      id: <id>
      valid:
          # A root of another name
          - /VolumesBackup/Item
invalid:
    - |
      id: <id>
      invalid:
          # Solution project path from one checkout
          - |
            <Project Path="/Volumes/Work/Rasm/libs/Item/Item.csproj" />
    - |
      id: <id>
      invalid:
          # Import from one machine
          - "<Import Project=\"/Users/someone/Rasm/eng/Item.props\" />"
    - |
      id: <id>
      invalid:
          # Import from one machine
          - C:\Users\someone\Rasm\eng\Item.props
    - |
      id: <id>
      invalid:
          # Import from one machine
          - '/home/someone/Rasm/eng/Item.props'
    - |
      id: <id>
      valid:
          # A path read by a script
          - |-
            path=/Volumes/Work/Item
    - |
      id: <id>
      invalid:
          # Import from one machine
          - c:/Users/someone/Rasm/eng/Item.props
    - |
      id: <id>
      invalid:
          # Solution project path from one machine
          - "<Project Path=\"/Volumes/Work/Item.csproj\" />"
