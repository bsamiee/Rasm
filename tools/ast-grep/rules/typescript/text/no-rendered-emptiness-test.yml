# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    rendering:
        kind: call_expression
        has: {field: function, kind: member_expression, has: {field: property, regex: '^(format|join)$'}}
    rendered:
        any:
            - matches: rendering
            - matches: {typescript-constant-value: {value: {matches: rendering}}}
rule:
    kind: binary_expression
    pattern: $TEST
    all:
        - has: {field: operator, regex: '^[!=]==?$'}
        - any:
            - all: [{has: {field: right, regex: '^(''''|""|``)$'}}, {has: {field: left, matches: rendered}}]
            - all: [{has: {field: left, regex: '^(''''|""|``)$'}}, {has: {field: right, matches: rendered}}]
message: '`$TEST` decides emptiness on rendered text'
note: 'Test the collection before rendering it, `Array.isReadonlyArrayEmpty(<items>)`'
