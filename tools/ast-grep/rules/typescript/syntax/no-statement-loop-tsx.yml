# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-tsx
language: tsx
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
          not: {has: {regex: '^await$'}}
        - kind: for_statement, while_statement, do_statement
message: Loop iterates by statement
note: 'Call `Array.map(<list>, <f>)` for a value per element, `Array.reduce(<list>, <initial>, <f>)` to fold elements into one value, `Array.unfold(<state>, <step>)` for values while a state advances, `Effect.forEach(<list>, <f>)` for an effect per element, `Effect.whileLoop` for an effect per state step, or `<list>.forEach(<f>)` for a host effect per element outside the runtime'
labels:
    LOOP: {style: primary}
