# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "foundry"
version         = "0.0.0"
description     = "Command line over the typography pipeline: source, build, check, approve, run and publish a declared font set"
requires-python = ">=3.15"

dependencies = [
    # --- [CORE]
    "expression", # Results each command returns
    "msgspec",    # JSON encoding of command results

    # --- [COMMANDS]
    "cyclopts",   # Command parser from typed signatures
    "sysexits",   # Portable process exit codes

    # --- [LIBRARY]
    "typography", # Font set pipeline every command runs
]

[project.scripts]
foundry = "foundry.app:app"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# --- [HATCH] ----------------------------------------------------------------------------

[tool.hatch.build]
dev-mode-dirs = [".."] # Editable installs expose the folder holding the import root

[tool.hatch.build.targets.wheel]
include = ["**"]
exclude = ["/pyproject.toml"]

[tool.hatch.build.targets.wheel.sources]
"" = "foundry"

# --- [UV] -------------------------------------------------------------------------------

[tool.uv.sources]
typography = { path = "../../libs/python/typography", editable = true }

# --- [FAWLTYDEPS] -----------------------------------------------------------------------

[tool.fawltydeps]
base_dir = "."
