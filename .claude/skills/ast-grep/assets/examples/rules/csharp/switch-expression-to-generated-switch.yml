# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/csharp_rule.json
id: switch-expression-to-generated-switch
language: csharp
severity: error
rule:
    all:
        - pattern:
            context: 'class C { object M() => $SUBJECT switch { $$$ARMS }; }'
            selector: switch_expression
        - has:
            kind: switch_expression_arm
            has:
                kind: declaration_pattern
        - not: {has: {kind: comment}} # Comment among the arms, the join keeps rewritten arms alone and drops it
        - not: # Fires when every arm is a plain qualified pattern, guards, discards, and list patterns refuse the fix
            has:
                kind: switch_expression_arm
                any:
                    - has: {kind: when_clause}
                    - not:
                        has:
                            kind: declaration_pattern
                            has:
                                kind: qualified_name
constraints:
    SUBJECT: # Primary expressions, a compound one (await, cast, binary, conditional) rebinds under member access
        any: # conditional_access_expression stays out, `x?.Y.Switch()` returns null where the switch throws and changes the type
            - {kind: identifier}
            - {kind: member_access_expression}
            - {kind: invocation_expression}
            - {kind: element_access_expression}
            - {kind: parenthesized_expression}
rewriters:
    - id: arm-to-named-argument
      rule:
        pattern:
            context: 'class C { object M() => s switch { $QUAL.$CASE $BIND => $BODY }; }'
            selector: switch_expression_arm
      transform:
        ARG:
            convert: {source: $CASE, toCase: camelCase}
      fix: '$ARG: static $BIND => $BODY'
transform:
    ARGS:
        rewrite:
            rewriters: [arm-to-named-argument]
            source: $$$ARMS
            joinBy: ', '
fix: $SUBJECT.Switch($ARGS)
message: Language `switch` over a generated union forfeits compile-time totality
note: Dispatch through the generated total `Switch`, each arm becomes its camelCase named argument with a `static` lambda
