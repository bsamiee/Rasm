# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-dirname-substitution-by-hand
language: bash
severity: error
rule:
    kind: command_substitution
    pattern: $SUB
    has:
        kind: command
        all:
            - has: {field: name, regex: '^(dirname|basename)$', pattern: $CMD}
            # The forms no-dirname-substitution rewrites, one parameter argument read whole, stay out
            - not:
                  all:
                      - has: {field: argument, matches: {bash-parameter: {name: {any: [{kind: variable_name}, {kind: subscript}]}}}}
                      - not: {has: {nthChild: 3}}
message: '`$SUB` forks a process for a path the shell derives by expansion'
note: Bind the path once, then `${<name>%/*}` for the directory, `${<name>##*/}` for the base name, and a second `${<base>%<suffix>}` for a stripped suffix
