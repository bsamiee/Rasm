# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Arm shapes the match rewrites refuse, a carrier or an empty container a lift owns, a nested branch Match dispatches, or a suspension
id: effect-refused-arm
language: tsx
rule:
    any:
        - pattern: Option.some($_)
        - pattern: Option.none()
        - pattern: Effect.succeed($_)
        - pattern: Effect.fail($_)
        - pattern: Effect.void
        - {kind: array, not: {has: {pattern: $_}}}
        - {kind: object, not: {has: {pattern: $_}}}
        - {kind: ternary_expression}
        - {kind: parenthesized_expression, has: {matches: effect-refused-arm}}
        # Await and yield suspend the function that holds them, an arrow body holds neither
        - matches: syntax-suspension
