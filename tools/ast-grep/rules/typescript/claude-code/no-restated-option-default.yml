# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-restated-option-default
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    pattern: $BRANCH
    any:
        - kind: binary_expression
          all:
              - has: {field: left, matches: claude-code-option-member, pattern: $OPTION}
              - any:
                    # Default beside the option, the manifest holds the default and the host fills it before the module loads
                    - has: {field: operator, regex: '^(\?\?|\|\|)$'}
                    # Boolean compared against a boolean literal, the narrowed option is the boolean
                    - all:
                          - has: {field: operator, regex: '^(===|!==)$'}
                          - has: {field: right, any: [{kind: 'true'}, {kind: 'false'}]}
        # The option as its own consequent, the alternative is the default the manifest holds
        - kind: ternary_expression
          all:
              - has: {field: condition, matches: claude-code-option-member, pattern: $OPTION}
              - has: {field: consequence, pattern: $OPTION}
        # The negated option as the condition, the option as its own alternative
        - pattern: '!$OPTION ? $_ : $OPTION'
          has: {field: condition, has: {field: argument, matches: claude-code-option-member}}
rewriters:
    - id: option-value
      rule:
          any:
              - pattern: '$O ?? $_'
              - pattern: '$O || $_'
              - pattern: '$O ? $O : $_'
              - pattern: '!$O ? $_ : $O'
              - pattern: '$O === true'
              - pattern: '$O !== false'
      fix: $O
    - id: option-negated
      rule: {any: [{pattern: '$O === false'}, {pattern: '$O !== true'}]}
      fix: '!$O'
transform:
    VALUE: rewrite($BRANCH, rewriters=[option-value, option-negated])
fix: $VALUE
message: '`$OPTION` is read with a default or a boolean comparison the manifest and `options(raw)` settle'
note: Read the option as `options(raw)` narrowed it, `options.key`, the manifest declares its type and default
