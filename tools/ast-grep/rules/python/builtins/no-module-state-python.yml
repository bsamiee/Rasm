# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-module-state-python
language: python
severity: error
utils:
    builtin-container:
        kind: identifier
        regex: '^(dict|list|set|bytearray)$'
        matches: {python-builtin-name: {name: {regex: '^(dict|list|set|bytearray)$'}}}
    library-container:
        all:
            - inside: {stopBy: end, kind: module, has: {kind: 'import_statement, import_from_statement', regex: '\b(collections|weakref|array|queue|types)\b'}}
            - any:
                - matches: {python-member-use: {module: {regex: '^collections$'}, name: {regex: '^(defaultdict|deque|OrderedDict|Counter|ChainMap|UserDict|UserList)$'}}}
                - matches: {python-member-use: {module: {regex: '^weakref$'}, name: {regex: '^(WeakSet|WeakKeyDictionary|WeakValueDictionary)$'}}}
                - matches: {python-member-use: {module: {regex: '^array$'}, name: {regex: '^array$'}}}
                - matches: {python-member-use: {module: {regex: '^queue$'}, name: {regex: '^(Queue|LifoQueue|PriorityQueue|SimpleQueue)$'}}}
                - matches: {python-member-use: {module: {regex: '^types$'}, name: {regex: '^SimpleNamespace$'}}}
    container-factory:
        any:
            - matches: builtin-container
            - matches: library-container
            - kind: attribute
              all:
                - has: {field: object, matches: {python-builtin-name: {name: {regex: '^dict$'}}}}
                - has: {field: attribute, regex: '^fromkeys$'}
    mutable-container:
        any:
            - kind: dictionary, list, set, dictionary_comprehension, list_comprehension, set_comprehension
            - kind: call
              has: {field: function, matches: container-factory}
            - kind: parenthesized_expression
              has: {matches: mutable-container}
            - kind: conditional_expression
              all:
                - has: {nthChild: 1, matches: mutable-container}
                - has: {nthChild: 3, matches: mutable-container}
            - kind: binary_operator
              all:
                - has: {field: operator, regex: '^[+*|]$'}
                - has: {matches: mutable-container}
    module-statement:
        kind: expression_statement
        not: {inside: {stopBy: end, kind: 'function_definition, lambda, class_definition'}}
    stored:
        any:
            - all:
                - has: {field: left, kind: identifier}
                - has: {field: right, matches: mutable-container}
            - all:
                - has: {field: left, kind: 'pattern_list, tuple_pattern, list_pattern'}
                - has: {field: right, kind: expression_list, has: {matches: mutable-container}}
            - has: {field: right, kind: assignment, matches: stored}
rule:
    kind: assignment
    all:
        - inside: {matches: module-statement}
        - has: {field: left, kind: 'identifier, pattern_list, tuple_pattern, list_pattern', pattern: $NAME}
        - matches: stored
constraints:
    NAME: {not: {regex: '^__all__$'}}
message: 'Module-level `$NAME` is a mutable container every function can write'
note: 'Use an immutable value with changing state passed as an argument, shared mutable state couples every function that writes it'
