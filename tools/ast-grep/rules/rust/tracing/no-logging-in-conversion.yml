# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-logging-in-conversion
language: rust
severity: error
files: ['libs/rust/**', 'tools/bridge/**']
rule:
    all:
        - any:
            - kind: macro_invocation
              has: {field: macro, pattern: $LOG, regex: '^(::)?(tracing::)?((trace|debug|info|warn|error)(_span)?|event|span)$'}
            - kind: attribute_item
              has: {kind: attribute, has: {nthChild: 1, pattern: $LOG, regex: '^(::)?(tracing::)?instrument$'}}
        - inside:
            stopBy: end
            kind: impl_item
            has: {field: trait, regex: '(?s)^((::)?(std|core|alloc)::)?((convert|str|fmt|borrow)::)?(From|Into|TryFrom|FromStr|AsRef|AsMut|Borrow|BorrowMut|Display|Debug)(<.*)?$'}
        - not:
            inside:
                kind: source_file
                stopBy: end
                has:
                    stopBy: end
                    any:
                        - kind: macro_definition
                          has: {field: name, pattern: $LOG}
                        - kind: use_declaration
                          regex: '^use\s+(crate|self|super)\b'
                          has: {stopBy: end, kind: identifier, pattern: $LOG}
message: '`$LOG` emits telemetry inside a conversion or formatting impl'
note: 'Return the conversion result alone and log at the calling boundary, a conversion reads its argument and writes its return value, the boundary call site is the author''s and takes no template'
