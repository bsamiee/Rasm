    cf>@cloudflare/build-output-utils: 'catalog:'
    cloudevents>uuid: 14.0.3 # `cloudevents` 10.0.0 names `uuid` 8, a release line npm marks unsupported
    '@axe-core/playwright>playwright-core:peer': '>=1.0.0' # Declared `>= 1.0.0`, pnpm's prerelease peer check reads a spaced operator as an exact version
    tree-sitter: '-'     # Node bindings the grammar packages name as peers, the build compiles their C sources alone
    tree-sitter-cli: '-' # The CLI comes from mise, pinned in `.config/mise.lock`

# --- [UPDATE] ---------------------------------------------------------------------------

# `nx upgrade rasm` runs `pnpm update --recursive --latest`: each row moves to tag `latest`, a row already ahead of it (a prerelease) stays, Nx rows included
update:
