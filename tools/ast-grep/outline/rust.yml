id: rust-impl
language: rustlang
role: item
symbolType: object
rule:
    kind: impl_item
    pattern: $DECLARATION
    not: {has: {field: trait, pattern: $_}}
    has: {field: type, any: [{kind: 'type_identifier, primitive_type', pattern: $NAME}, {has: {stopBy: end, kind: 'type_identifier, primitive_type', pattern: $NAME}}, {pattern: $NAME}]}
rewriters: [{id: impl-body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [impl-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: rust-trait-impl
language: rustlang
role: item
symbolType: object
rule:
    kind: impl_item
    pattern: $DECLARATION
    all:
        - has: {field: trait, any: [{kind: type_identifier, pattern: $TRAIT}, {has: {stopBy: end, kind: type_identifier, pattern: $TRAIT}}, {pattern: $TRAIT}]}
        - has: {field: type, any: [{kind: 'type_identifier, primitive_type', pattern: $NAME}, {has: {stopBy: end, kind: 'type_identifier, primitive_type', pattern: $NAME}}, {pattern: $NAME}]}
rewriters: [{id: impl-body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [impl-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $TRAIT for $NAME
signature: $SIGNATURE
isExported: true
---
id: rust-const
language: rustlang
role: item
symbolType: constant
rule:
    kind: const_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: value
      rule:
          kind: 'array_expression, assignment_expression, async_block, await_expression, binary_expression, block, boolean_literal, break_expression, call_expression, char_literal, closure_expression, compound_assignment_expr, const_block, continue_expression, field_expression, float_literal, for_expression, gen_block, generic_function, identifier, if_expression, index_expression, integer_literal, loop_expression, macro_invocation, match_expression, metavariable, parenthesized_expression, range_expression, raw_string_literal, reference_expression, return_expression, scoped_identifier, self, string_literal, struct_expression, try_block, try_expression, tuple_expression, type_cast_expression, unary_expression, unit_expression, unsafe_block, while_expression, yield_expression'
          inside: {kind: 'const_item, static_item', field: value}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\p{White_Space}*(?:=\p{White_Space}*)?;$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
