# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-npm-command
language: bash
severity: error
files:
    - .github/**
    - .claude/**/*.json
    - '**/*.sh'
    - package.json
    - '**/project.json'
    - nx.json
rule:
    kind: command
    has: {matches: {bash-invoked-name: {name: {matches: package-manager, pattern: $NAME}, runner: {regex: '^(?:\S+/)?(command|env|exec|sudo|time)$'}}}}
message: '`$NAME` runs npm or npx where pnpm is the repository package manager'
note: Use pnpm for package operations and pnpm exec for an installed tool, and read each npm option against its pnpm counterpart
utils:
    package-manager:
        kind: command_name, word, string, raw_string
        regex: ^((?:[^\s\x22\x27]+/)?(?:npm|npx)(?:\.cmd)?|"(?:[^\x22]+/)?(?:npm|npx)(?:\.cmd)?"|'(?:[^\x27]+/)?(?:npm|npx)(?:\.cmd)?')$
