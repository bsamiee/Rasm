syntax = "proto3";

package rasm.contracts.bim.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "rasm/contracts/element/v1/graph.proto";
import "rasm/contracts/element/v1/value.proto";

enum DeltaShape {
  DELTA_SHAPE_UNSPECIFIED = 0;
  DELTA_SHAPE_REPLACE = 1;
  DELTA_SHAPE_INDEX = 2;
  DELTA_SHAPE_KEY = 3;
  DELTA_SHAPE_ADDED = 4;
  DELTA_SHAPE_REMOVED = 5;
  DELTA_SHAPE_UNKNOWN = 6;
}

// --- [DIFF] -----------------------------------------------------------------------------

message DeltaValueWire {
  oneof value {
    option (buf.validate.oneof).required = true;

    rasm.contracts.element.v1.MeasureValueWire measure = 1;
    bytes address = 2;
    string label = 3;
    google.protobuf.Empty absent = 4;
  }
}

// `DeltaValueWire` owns the one spelling of an absent side through its `absent` arm, so both ends are present
// on the wire; a bare message field would fork absence and drop the arm rule the required oneof carries.
message AspectDeltaWire {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  DeltaShape shape = 2 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  DeltaValueWire before = 3 [(buf.validate.field).required = true];
  DeltaValueWire after = 4 [(buf.validate.field).required = true];
}

// One shape serves the added and removed arms; the arm is the discriminant.
message DiffEndWire {
  string global_id = 1 [(buf.validate.field).string = {
    len: 22
    pattern: "^[0-9A-Za-z_$]{22}$"
  }];
  rasm.contracts.element.v1.ClassificationWire classification = 2;
  string predefined = 3;
  bytes content = 4 [(buf.validate.field).bytes.len = 16];
}

// Modified carries both currencies: a content edit that also relocates the element is one
// change, and dropping its placement axis loses the evidence the version merge weighs.
message DiffModifiedWire {
  string global_id = 1 [(buf.validate.field).string = {
    len: 22
    pattern: "^[0-9A-Za-z_$]{22}$"
  }];
  bytes baseline_content = 2 [(buf.validate.field).bytes.len = 16];
  bytes revision_content = 3 [(buf.validate.field).bytes.len = 16];
  bytes baseline_placement = 4 [(buf.validate.field).bytes.len = 16];
  bytes revision_placement = 5 [(buf.validate.field).bytes.len = 16];
  repeated AspectDeltaWire deltas = 6 [(buf.validate.field).repeated.max_items = 65536];
}

// A pose is absent where the node declares no placement: a moved verdict also arises from
// a re-hashed representation under an absent frame, so absence is never a zero frame.
message DiffMovedWire {
  string global_id = 1 [(buf.validate.field).string = {
    len: 22
    pattern: "^[0-9A-Za-z_$]{22}$"
  }];
  bytes baseline_placement = 2 [(buf.validate.field).bytes.len = 16];
  bytes revision_placement = 3 [(buf.validate.field).bytes.len = 16];
  optional rasm.contracts.element.v1.PlacementWire baseline_pose = 4;
  optional rasm.contracts.element.v1.PlacementWire revision_pose = 5;
}

// One shape serves split and merged: the id is the source of a split and the survivor of
// a merge, and the counterpart set is the other side of the same correspondence.
message DiffRegroupWire {
  string global_id = 1 [(buf.validate.field).string = {
    len: 22
    pattern: "^[0-9A-Za-z_$]{22}$"
  }];
  bytes content = 2 [(buf.validate.field).bytes.len = 16];
  repeated string counterparts = 3 [
    (buf.validate.field).repeated.min_items = 2,
    (buf.validate.field).repeated.max_items = 65536,
    (buf.validate.field).repeated.items.string = {
      len: 22
      pattern: "^[0-9A-Za-z_$]{22}$"
    }
  ];
}

message ElementChangeWire {
  oneof kind {
    option (buf.validate.oneof).required = true;

    DiffEndWire added = 1;
    DiffEndWire removed = 2;
    DiffModifiedWire modified = 3;
    DiffMovedWire moved = 4;
    DiffRegroupWire split = 5;
    DiffRegroupWire merged = 6;
  }
}

message ModelDiffWire {
  bytes baseline = 1 [(buf.validate.field).bytes.len = 16];
  bytes revision = 2 [(buf.validate.field).bytes.len = 16];
  repeated ElementChangeWire changes = 3 [(buf.validate.field).repeated.max_items = 65536];
  uint32 unchanged_count = 4;
}
