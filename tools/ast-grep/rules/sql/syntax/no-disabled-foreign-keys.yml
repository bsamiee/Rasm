# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-disabled-foreign-keys
language: sql
severity: error
rule:
    kind: pragma_statement
    pattern: _PRAGMA
    all:
        - has: {field: name, regex: '(?i)^"?foreign_keys"?$'}
        - has: {field: value, regex: '(?i)^[''"]?(off|no|false|0)[''"]?$'}
message: '`$PRAGMA` disables foreign key enforcement only outside a transaction, D1, and Durable Objects'
note: 'Open the rebuild with `pragma defer_foreign_keys = on` and point rebuilt children at their rebuilt parent''s temporary name'
