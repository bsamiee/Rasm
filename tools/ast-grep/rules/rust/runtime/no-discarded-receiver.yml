# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    channel-path:
        kind: scoped_identifier
        all:
            - pattern: $MODULE::channel
            - regex: '(^|::)(broadcast|watch)::channel$'
    channel-call:
        kind: call_expression
        has:
            field: function
            any:
                - matches: channel-path
                - kind: generic_function
                  has: {field: function, matches: channel-path}
    unread-receiver:
        any:
            - not: {has: {nthChild: 2, kind: identifier}}
            - all:
                - has: {nthChild: 2, kind: identifier, pattern: $RECEIVER}
                - not: {inside: {kind: function_item, stopBy: {kind: function_item}, has: {stopBy: end, kind: identifier, pattern: $RECEIVER, not: {inside: {kind: tuple_pattern}}}}}
    tuple-binding:
        kind: let_declaration
        all:
            - has: {field: value, matches: channel-call}
            - has: {field: pattern, kind: tuple_pattern, all: [{regex: '^\(\p{White_Space}*(mut\p{White_Space}+)?\p{XID_Continue}+\p{White_Space}*,\p{White_Space}*_\p{XID_Continue}*\p{White_Space}*,?\p{White_Space}*\)$'}, {matches: unread-receiver}]}
            - any:
                - has: {field: type, kind: tuple_type}
                - not: {has: {field: type, pattern: $_}}
    sender-field:
        kind: field_expression
        all:
            - has: {field: field, regex: '^0$'}
            - has: {field: value, matches: channel-call}
rule:
    any:
        - matches: tuple-binding
        - matches: sender-field
message: '`$MODULE::channel` builds a receiver that no code reads'
note: 'Construct `<module>::Sender::new`, `subscribe` per consumer, and replace watch `send` with `send_replace`'
