# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-inner-error-parameter
language: csharp
severity: error
rule:
    kind: parameter
    all:
        - has: {field: name, regex: '^Inner$', pattern: $NAME}
        - inside: {kind: parameter_list, inside: {kind: record_declaration, matches: csharp-error-record, has: {field: name, pattern: $RECORD}}}
message: '`$RECORD` names its cause `$NAME`, colliding with the base `Inner` property (CS8866 where the types differ)'
note: 'Name the cause parameter `Cause` and pass it to the base, `record <name>(..., Error Cause) : Expected($"...", 0, Cause)`'
