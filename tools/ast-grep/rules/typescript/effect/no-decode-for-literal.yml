# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-decode-for-literal
language: tsxlang
severity: error
utils:
    codec:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, pattern: $FN, regex: '^(decode|encode)(Unknown)?(Sync|Exit|Option|Result|Effect|Promise)$'}
                - has: {field: object, pattern: $M, matches: {effect-module: {name: {regex: '\bSchema$'}}}}
    literal-argument:
        kind: arguments
        has: {nthChild: 1, matches: typescript-literal-expression}
rule:
    any:
        - kind: call_expression
          all:
            - has: {field: function, matches: codec}
            - has: {field: arguments, matches: literal-argument}
        - kind: call_expression
          all:
            - has: {field: function, kind: identifier}
            - has: {field: arguments, has: {nthChild: 2, matches: codec}}
            - has: {field: function, matches: effect-pipe-function}
            - has: {field: arguments, matches: literal-argument}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $CODEC}
            - has: {field: value, matches: codec}
            - inside:
                kind: 'program, statement_block'
                stopBy: {kind: 'program, statement_block'}
                has: {stopBy: end, kind: call_expression, all: [{has: {field: function, kind: identifier, pattern: $CODEC}}, {has: {field: arguments, matches: literal-argument}}]}
message: '`$M.$FN` runs a codec over a literal'
note: 'Call `<schema>.make`, `makeOption`, or `makeEffect` with a `Type` value; write an encode as its `Encoded` literal'
