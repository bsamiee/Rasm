# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: text-coined-word
language: python
rule:
    any:
        - regex: |-
            (?x)(^[_\#$]?|_)(?i:admission|admit|admits|admitted|backbone|beacon|bespoke|blanket|blessed|building_?blocks|canon|census|charter
            |closed_?family|custodian|custody|doctrine|estate|fabric|fan_?out_?degree|feature_?parity|furnished|ghost|guardrail|hard_?won|harmless
            |host_?free|in_?flight|inert|island|ladder|laddered|lamp|materialize|materialized|mint|minted|peers_?on|phantom|pluggable
            |posture|pristine|probe|probed|probes|probing|publication_?quality|rasm|realm|rides|roster|ruling|rung|rungs|seat|seated|settle|settled
            |shim|ship|shipped|shipping|sibling_?variant|strata|stratum|substrate|toolkit|travels|twin|twins|unrecord|unstock|verb|verbs
            |vocabulary_?table|weave|wired|wiring)(_|$|[0-9]|[A-Z]([a-z0-9_]|$))
        - regex: |-
            (?x)(^T|[a-z0-9])(Admission|Admit|Admits|Admitted|Backbone|Beacon|Bespoke|Blanket|Blessed|BuildingBlocks|Canon|Census|Charter
            |ClosedFamily|Custodian|Custody|Doctrine|Estate|Fabric|FanOutDegree|FeatureParity|Furnished|Ghost|Guardrail|HardWon|Harmless
            |HostFree|InFlight|Inert|Island|Ladder|Laddered|Lamp|Materialize|Materialized|Mint|Minted|PeersOn|Phantom|Pluggable
            |Posture|Pristine|Probe|Probed|Probes|Probing|PublicationQuality|Rasm|Realm|Rides|Roster|Ruling|Rung|Rungs|Seat|Seated|Settle|Settled
            |Shim|Ship|Shipped|Shipping|SiblingVariant|Strata|Stratum|Substrate|Toolkit|Travels|Twin|Twins|Unrecord|Unstock|Verb|Verbs
            |VocabularyTable|Weave|Wired|Wiring)([A-Z0-9_]|$)
