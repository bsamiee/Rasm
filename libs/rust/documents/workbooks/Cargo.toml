# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-workbooks"
version.workspace = true
edition.workspace = true
description       = "Spreadsheet workbooks read and written as XLS, XLSX, XLSB, and ODS"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
