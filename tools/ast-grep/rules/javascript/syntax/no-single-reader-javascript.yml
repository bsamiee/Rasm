# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-reader-javascript
language: javascript
severity: error
utils:
    boundary:
        kind: arrow_function, function_expression, function_declaration, generator_function, generator_function_declaration, method_definition
    literal:
        any:
            - kind: string, number, true, false, null, undefined, identifier, arrow_function, function_expression
            - kind: member_expression
              not: {has: {stopBy: end, kind: call_expression}}
            - kind: template_string
              not: {has: {kind: template_substitution}}
            - kind: unary_expression, binary_expression, parenthesized_expression, array
              not: {has: {pattern: $_, not: {matches: literal}}}
            - kind: object
              not:
                has:
                    pattern: $_
                    not:
                        kind: pair
                        all:
                            - has: {field: key, any: [{kind: 'property_identifier, string, number'}, {kind: computed_property_name, has: {kind: string}}]}
                            - has: {field: value, matches: literal}
            - kind: new_expression
              all:
                - has: {field: constructor, regex: '^(Set|Map)$'}
                - not: {has: {field: arguments, has: {pattern: $_, not: {matches: literal}}}}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^Object\.freeze$'}
                - not: {has: {field: arguments, has: {pattern: $_, not: {matches: literal}}}}
    reference:
        kind: identifier, shorthand_property_identifier
        pattern: $NAME
        not: {inside: {kind: 'variable_declarator, function_declaration', field: name}}
    entry:
        any:
            - has: {field: name, pattern: $ENTRY}
            - inside: {kind: variable_declarator, stopBy: end, has: {field: name, pattern: $ENTRY}}
        inside:
            kind: program
            stopBy: end
            has:
                kind: 'expression_statement, if_statement, for_statement, for_in_statement, while_statement, try_statement, switch_statement'
                has: {stopBy: end, kind: identifier, pattern: $ENTRY, not: {inside: {stopBy: end, matches: boundary}}}
    reader:
        pattern: $READER
        all:
            - matches: boundary
            - not: {inside: {stopBy: end, matches: boundary}}
            - not: {has: {field: name, pattern: $NAME}}
            - not: {inside: {kind: variable_declarator, stopBy: end, has: {field: name, pattern: $NAME}}}
            - not: {matches: entry}
    read:
        kind: identifier, shorthand_property_identifier
        pattern: $NAME
        matches: reference
    constant-reader:
        kind: variable_declarator
        pattern: $HOLDER
        inside: {kind: lexical_declaration, inside: {kind: program}}
    holds-reference:
        any:
            - matches: reference
            - has: {stopBy: end, matches: reference}
    later-reference:
        matches: reference
        any:
            - follows: {stopBy: end, matches: holds-reference}
            - inside: {stopBy: end, follows: {stopBy: end, matches: holds-reference}}
    component:
        has: {stopBy: end, kind: 'jsx_element, jsx_self_closing_element'}
    level:
        any:
            - matches: boundary
            - kind: for_statement, for_in_statement, while_statement, do_statement, switch_statement
            - kind: if_statement
              not: {inside: {kind: else_clause}}
            - kind: ternary_expression
              not: {inside: {kind: ternary_expression, field: alternative, stopBy: {not: {kind: parenthesized_expression}}}}
    nests-twice:
        any:
            - {kind: function_declaration, has: {field: body, has: {stopBy: end, matches: level, has: {stopBy: end, matches: level}}}}
            - {kind: variable_declarator, has: {field: value, has: {stopBy: end, matches: level, has: {stopBy: end, matches: level}}}}
    nests-thrice:
        any:
            - {kind: function_declaration, has: {field: body, has: {stopBy: end, matches: level, has: {stopBy: end, matches: level, has: {stopBy: end, matches: level}}}}}
            - {kind: variable_declarator, has: {field: value, has: {stopBy: end, matches: level, has: {stopBy: end, matches: level, has: {stopBy: end, matches: level}}}}}
rule:
    all:
        - any:
            - kind: variable_declarator
              all:
                - has: {field: name, kind: identifier, pattern: $NAME}
                - has: {field: value, matches: literal, not: {matches: component}}
                - inside: {kind: lexical_declaration, all: [{has: {field: kind, regex: '^const$'}}, {inside: {kind: program}}]}
            - kind: function_declaration
              all:
                - has: {field: name, pattern: $NAME}
                - not: {matches: component}
                - inside: {kind: program}
        - any:
            - all:
                - not: {matches: nests-twice}
                - inside:
                    kind: program
                    stopBy: end
                    all:
                        - has: {stopBy: end, matches: read, inside: {stopBy: end, matches: reader}}
                        - not: {has: {stopBy: end, matches: reference, not: {inside: {stopBy: end, all: [{matches: boundary}, {pattern: $READER}]}}}}
            - all:
                - not: {matches: nests-thrice}
                - inside:
                    kind: program
                    stopBy: end
                    all:
                        - has: {stopBy: end, matches: read, not: {inside: {stopBy: end, matches: boundary}}, inside: {stopBy: end, matches: constant-reader}}
                        - not: {has: {stopBy: end, matches: reference, not: {inside: {stopBy: end, all: [{kind: variable_declarator}, {pattern: $HOLDER}]}}}}
                        - not: {has: {stopBy: end, all: [{kind: variable_declarator}, {pattern: $HOLDER}, {has: {stopBy: end, matches: later-reference}}]}}
message: '`$NAME` has one reader'
note: 'Move the declaration into its reader as a local where its name states a fact, else inline it'
labels:
    READER: {style: secondary, message: Only reader}
    HOLDER: {style: secondary, message: Only reader}
