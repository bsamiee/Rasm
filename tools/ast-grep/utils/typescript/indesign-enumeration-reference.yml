# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: indesign-enumeration-reference
language: tsxlang
utils:
    module-reference:
        matches: {typescript-module-reference: {source: {regex: &source '^(adobe:)?indesign$'}}}
rule:
    any:
        - matches: {typescript-import-reference: {source: {regex: *source}, exported: {regex: '^[A-Z]'}}}
        - kind: identifier
          pattern: $ENUMERATION
          all:
            - inside:
                kind: statement_block, program
                stopBy: end
                pattern: $OWNER
                has:
                    kind: lexical_declaration, variable_declaration
                    has:
                        kind: variable_declarator
                        all:
                            - has:
                                field: name
                                kind: object_pattern
                                has:
                                    any:
                                        - kind: shorthand_property_identifier_pattern
                                          pattern: $ENUMERATION
                                          regex: '^[A-Z]'
                                        - kind: pair_pattern
                                          all:
                                            - has:
                                                field: key
                                                any:
                                                    - kind: property_identifier
                                                      regex: '^[A-Z]'
                                                    - kind: string
                                                      not: {has: {kind: escape_sequence}}
                                                      has: {kind: string_fragment, regex: '^[A-Z]'}
                                            - has: {field: value, kind: identifier, pattern: $ENUMERATION}
                            - has: {field: value, matches: module-reference}
            - matches: {typescript-local-binding: {owner: {pattern: $OWNER}}}
