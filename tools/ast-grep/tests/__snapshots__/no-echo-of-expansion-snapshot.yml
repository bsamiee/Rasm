id: no-echo-of-expansion
snapshots:
  echo "$#":
    fixed: printf '%s\n' "$#"
    labels:
    - source: echo "$#"
      style: primary
      start: 0
      end: 9
    - source: '"$#"'
      style: secondary
      start: 5
      end: 9
  echo "$((1 + 2))":
    fixed: printf '%s\n' "$((1 + 2))"
    labels:
    - source: echo "$((1 + 2))"
      style: primary
      start: 0
      end: 17
    - source: '"$((1 + 2))"'
      style: secondary
      start: 5
      end: 17
  echo "$(cmd)":
    fixed: printf '%s\n' "$(cmd)"
    labels:
    - source: echo "$(cmd)"
      style: primary
      start: 0
      end: 13
    - source: '"$(cmd)"'
      style: secondary
      start: 5
      end: 13
  echo "$a" -n:
    fixed: printf '%s %s\n' "$a" -n
    labels:
    - source: echo "$a" -n
      style: primary
      start: 0
      end: 12
    - source: '"$a"'
      style: secondary
      start: 5
      end: 9
  echo "$x" >&2:
    fixed: printf '%s\n' "$x" >&2
    labels:
    - source: echo "$x"
      style: primary
      start: 0
      end: 9
    - source: '"$x"'
      style: secondary
      start: 5
      end: 9
  echo "$x"y:
    fixed: printf '%s\n' "$x"y
    labels:
    - source: echo "$x"y
      style: primary
      start: 0
      end: 10
    - source: '"$x"y'
      style: secondary
      start: 5
      end: 10
  echo "${#arr[@]}":
    fixed: printf '%s\n' "${#arr[@]}"
    labels:
    - source: echo "${#arr[@]}"
      style: primary
      start: 0
      end: 17
    - source: '"${#arr[@]}"'
      style: secondary
      start: 5
      end: 17
  echo "${arr[0]}":
    fixed: printf '%s\n' "${arr[0]}"
    labels:
    - source: echo "${arr[0]}"
      style: primary
      start: 0
      end: 16
    - source: '"${arr[0]}"'
      style: secondary
      start: 5
      end: 16
  echo "${x:-none}":
    fixed: printf '%s\n' "${x:-none}"
