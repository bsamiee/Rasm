# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-traceback-print
language: python
severity: error
# Report-only, the probed fix `print_exc()` to `logger.exception()` fails, `TypeError: exception() missing 1 required positional argument: 'event'`
rule:
    matches: {python-module-member: {module: {regex: "^traceback$"}, name: {regex: "^print_(exc|exception|stack|last|tb)$", pattern: $NAME}}}
message: "`traceback.$NAME` writes the traceback to stderr, outside the structured pipeline"
note: Log the active exception with `logger.exception(<event>)`, `exc_info=<exception>` outside its handler, or the stack with `stack_info=True`
