transform:
    NAME: {rewrite: {source: $KEY, rewriters: [bare, part], joinBy: .}}
name: $BARE$NAME
signature: $BARE$NAME = …
---
id: toml-array
language: toml
role: item
symbolType: array
rule:
    kind: pair
    inside: {kind: 'document, ERROR'}
    all: [{has: {kind: array, any: [{not: {has: {pattern: $_}}, pattern: $EMPTY}, {kind: array}]}}, {has: {kind: 'bare_key, quoted_key, dotted_key', any: [{regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}, {pattern: $KEY}]}}]
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART}
transform:
    NAME: {rewrite: {source: $KEY, rewriters: [bare, part], joinBy: .}}
    CLOSED: {replace: {source: $EMPTY, replace: '(?s).+', by: '[]'}}
    VALUE: {replace: {source: $CLOSED, replace: '^$', by: '[…]'}}
name: $BARE$NAME
signature: $BARE$NAME = $VALUE
---
id: toml-inline-table
language: toml
role: item
symbolType: object
rule:
    kind: pair
    inside: {kind: 'document, ERROR'}
    all: [{has: {kind: inline_table, any: [{not: {has: {pattern: $_}}, pattern: $EMPTY}, {kind: inline_table}]}}, {has: {kind: 'bare_key, quoted_key, dotted_key', any: [{regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}, {pattern: $KEY}]}}]
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART}
transform:
    NAME: {rewrite: {source: $KEY, rewriters: [bare, part], joinBy: .}}
    CLOSED: {replace: {source: $EMPTY, replace: '(?s).+', by: '{}'}}
    VALUE: {replace: {source: $CLOSED, replace: '^$', by: '{…}'}}
name: $BARE$NAME
signature: $BARE$NAME = $VALUE
---
id: toml-member-error
language: toml
role: member
parentRuleIds: [toml-table, toml-table-element, toml-array, toml-inline-table]
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {kind: pair, stopBy: end}}}
        - {kind: 'bare_key, quoted_key, comment', all: [{inside: {kind: ERROR}}, {nthChild: {position: 1, ofRule: {kind: 'bare_key, quoted_key, comment'}}}]}
        - {kind: 'array, inline_table, bare_key, boolean, float, integer, local_date, local_date_time, local_time, offset_date_time', any: [{regex: '^$'}, {has: {regex: '^$'}}]}
