# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-zip-method
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - pattern: $A.into_iter().zip($B)
constraints:
    A: {kind: 'identifier, field_expression, self'}
fix: iter::zip($A, $B)
message: '`$A` converts into an iterator only to zip `$B` onto it'
note: 'Call `iter::zip(<first>, <second>)` with `core::iter` imported, `iter::zip` takes both operands as `IntoIterator` and pairs them in order'
