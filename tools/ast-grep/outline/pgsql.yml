id: pgsql-import
language: pgsql
role: item
symbolType: module
isImport: true
isExported: false
rule:
    all:
        - any:
              - kind: CreateExtensionStmt, ImportForeignSchemaStmt
                has: {kind: 'ColId, substitution', pattern: $NAME}
              - kind: LoadStmt
                has: {field: file_name, pattern: $NAME}
        - pattern: $DECLARATION
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: value
      rule: {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NonReservedWord', inside: {kind: 'generic_option_elem, create_extension_opt_item'}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-schema
language: pgsql
role: item
symbolType: namespace
isExported: false
rule:
    all:
        - any:
              - kind: CreateSchemaStmt
                pattern: $DECLARATION
                not: {has: {kind: OptSchemaEltList}}
                has: {kind: 'ColId, RoleSpec', pattern: $NAME}
              - kind: ColId, RoleSpec
                pattern: $NAME
                inside: {kind: CreateSchemaStmt, pattern: $DECLARATION, has: {kind: OptSchemaEltList}}
                not: {follows: {kind: ColId, stopBy: end}}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - id: body
      rule: {kind: 'OptSchemaEltList, comment'}
      fix: ' '
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-enum
language: pgsql
role: item
symbolType: enum
isExported: false
rule:
    kind: DefineStmt
    pattern: $DECLARATION
    all:
        - has: {regex: '(?i-u)^enum$'}
        - has: {kind: any_name, pattern: $NAME}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - {id: body, rule: {kind: enum_val_list}, fix: …}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-error
language: pgsql
role: item
symbolType: 'null'
rule:
    any:
        - kind: ERROR
          not:
              has:
                  stopBy: end
                  kind: AlterCollationStmt, AlterCompositeTypeStmt, AlterDatabaseSetStmt, AlterDatabaseStmt, AlterDefaultPrivilegesStmt, AlterDomainStmt, AlterEnumStmt, AlterEventTrigStmt, AlterExtensionContentsStmt, AlterExtensionStmt, AlterFdwStmt, AlterForeignServerStmt, AlterFunctionStmt, AlterGroupStmt, AlterObjectDependsStmt, AlterObjectSchemaStmt, AlterOpFamilyStmt, AlterOperatorStmt, AlterOwnerStmt, AlterPolicyStmt, AlterPublicationStmt, AlterRoleSetStmt, AlterRoleStmt, AlterSeqStmt, AlterStatsStmt, AlterSubscriptionStmt, AlterSystemStmt, AlterTSConfigurationStmt, AlterTSDictionaryStmt, AlterTableStmt, AlterTblSpcStmt, AlterTypeStmt, AlterUserMappingStmt, AnalyzeStmt, CallStmt, CheckPointStmt, ClosePortalStmt, CommentStmt, ConstraintsSetStmt, CopyStmt, CreateAmStmt, CreateAsStmt, CreateAssertionStmt, CreateCastStmt, CreateConversionStmt, CreateDomainStmt, CreateEventTrigStmt, CreateExtensionStmt, CreateFdwStmt, CreateForeignServerStmt, CreateForeignTableStmt, CreateFunctionStmt, CreateGroupStmt, CreateMatViewStmt, CreateOpClassStmt, CreateOpFamilyStmt, CreatePLangStmt, CreatePolicyStmt, CreatePublicationStmt, CreateRoleStmt, CreateSchemaStmt, CreateSeqStmt, CreateStatsStmt, CreateStmt, CreateSubscriptionStmt, CreateTableSpaceStmt, CreateTransformStmt, CreateTrigStmt, CreateUserMappingStmt, CreateUserStmt, CreatedbStmt, DeallocateStmt, DeclareCursorStmt, DefineStmt, DeleteStmt, DiscardStmt, DoStmt, DropCastStmt, DropOpClassStmt, DropOpFamilyStmt, DropOwnedStmt, DropRoleStmt, DropStmt, DropSubscriptionStmt, DropTableSpaceStmt, DropTransformStmt, DropUserMappingStmt, DropdbStmt, ExecuteStmt, ExplainStmt, FetchStmt, GrantRoleStmt, GrantStmt, ImportForeignSchemaStmt, IndexStmt, InsertStmt, ListenStmt, LoadStmt, LockStmt, MergeStmt, NotifyStmt, PrepareStmt, ReassignOwnedStmt, RefreshMatViewStmt, ReindexStmt, RemoveAggrStmt, RemoveFuncStmt, RemoveOperStmt, RenameStmt, RepackStmt, RevokeRoleStmt, RevokeStmt, RuleStmt, SecLabelStmt, TransactionStmt, TransactionStmtLegacy, TruncateStmt, UnlistenStmt, UpdateStmt, VacuumStmt, VariableResetStmt, VariableSetStmt, VariableShowStmt, ViewStmt, WaitStmt, select_no_parens, select_with_parens, columnDef, ColConstraint, TableConstraint, common_table_expr, window_definition, alter_table_cmd, alter_ts_configuration_cmd
        - all:
              - any: [{kind: 'identifier, comment'}, {pattern: ')'}, {pattern: ']'}]
              - inside: {kind: ERROR, stopBy: {kind: 'ERROR, source_file'}}
              - not: {follows: {stopBy: end, pattern: $_, not: {matches: row}}}
              - not: {inside: {stopBy: {kind: ERROR}, not: {kind: ERROR}, follows: {stopBy: end, pattern: $_, not: {matches: row}}}}
        - {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}
