id: no-small-builder
valid:
    - |
      #[bon::builder]
      fn connect(host: &str, port: u16, timeout: u64) -> Connection {
          open(host, port, timeout)
      }
    - |
      #[inline]
      fn connect(host: &str) -> Connection {
          open(host)
      }
invalid:
    - |
      #[bon::builder]
      fn connect(host: &str, port: u16) -> Connection {
          open(host, port)
      }
    - |
      #[builder(on(String, into))]
      fn greet(name: String) -> String {
          name
      }
