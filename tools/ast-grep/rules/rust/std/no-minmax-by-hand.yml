# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-minmax-by-hand
language: rust
severity: error
rule:
    kind: if_expression
    all:
        - any:
            - pattern: 'if $A <= $B { ($A, $B) } else { ($B, $A) }'
            - pattern: 'if $A < $B { ($A, $B) } else { ($B, $A) }'
            - pattern: 'if $A >= $B { ($B, $A) } else { ($A, $B) }'
            - pattern: 'if $A > $B { ($B, $A) } else { ($A, $B) }'
message: '`if` orders `$A` and `$B` into a pair by hand'
note: 'Call `cmp::minmax(<a>, <b>)` (`#![feature(cmp_minmax)]`) or `cmp::minmax_by(<a>, <b>, <float>::total_cmp)` and read the `[min, max]` array'
