# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsx
severity: error
utils:
    sorting:
        matches: { effect-module-member: { module: { regex: '(?-u:\b)Array$' }, member: { regex: '^(sort|sortWith|sortBy)$' } } }
    listed:
        any:
            - kind: array
              all:
                  - has: { nthChild: { position: 1, ofRule: &code { not: { kind: 'comment, html_comment' } } }, kind: spread_element, has: { pattern: $LIST } }
                  - not: { has: { nthChild: { position: 2, ofRule: *code } } }
            - pattern: $LIST
    sorted:
        kind: call_expression
        any:
            - all:
                  - has: { field: function, pattern: $SORT, matches: sorting }
                  - has: { field: arguments, has: { nthChild: { position: 1, ofRule: *code }, matches: listed } }
            - all:
                  - has: { field: function, kind: call_expression, has: { field: function, pattern: $SORT, matches: sorting } }
                  - has: { field: arguments, has: { nthChild: { position: 1, ofRule: *code }, matches: listed } }
            - has: { field: function, kind: member_expression, pattern: $SORT, all: [{ has: { field: property, regex: '^(sort|toSorted)$' } }, { has: { field: object, matches: listed } }] }
    end:
        matches: { effect-module-member: { module: { regex: '(?-u:\b)Array$' }, member: { regex: '^(head|headNonEmpty|last|lastNonEmpty|take|takeRight)$' } } }
rule:
    any:
        - kind: call_expression
          all:
              - has: { field: function, matches: end }
              - any:
                    - has: { field: arguments, all: [{ has: { nthChild: { position: 1, ofRule: *code }, matches: sorted } }, { not: { has: { nthChild: { position: 2, ofRule: *code } } } }] }
                    - has: { field: arguments, all: [{ has: { nthChild: { position: 1, ofRule: *code }, matches: sorted } }, { has: { nthChild: { position: 2, ofRule: *code }, regex: '^1$' } }, { not: { has: { nthChild: { position: 3, ofRule: *code } } } }] }
              - not: { all: [{ has: { field: function, has: { field: property, regex: '^take' } } }, { not: { has: { field: arguments, has: { nthChild: { position: 2, ofRule: *code } } } } }] }
        - kind: member_expression
          all:
              - matches: end
              - not: { has: { field: property, regex: '^take' } }
              - inside: { kind: arguments }
              - follows: { stopBy: { not: { regex: '^,$' } }, kind: call_expression, has: { field: function, pattern: $SORT, matches: sorting }, not: { has: { field: arguments, has: { nthChild: { position: 2, ofRule: *code } } } } }
        - kind: subscript_expression
          all:
              - has: { field: object, matches: sorted }
              - has: { field: index, any: [{ regex: '^0$' }, { kind: binary_expression, pattern: $LIST.length - 1 }] }
        - kind: call_expression
          all:
              - has: { field: function, kind: member_expression, all: [{ has: { field: property, regex: '^at$' } }, { has: { field: object, matches: sorted } }] }
              - has:
                    {
                        field: arguments,
                        all: [{ has: { nthChild: { position: 1, ofRule: *code }, any: [{ regex: '^0$' }, { kind: unary_expression, regex: '^-[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*1$' }] } }, { not: { has: { nthChild: { position: 2, ofRule: *code } } } }],
                    }
message: '`$SORT` sorts a whole list to read one extremum'
note: 'Read the extremum in one pass: `Array.min(<list>, <order>)` or `Array.max` on a list `Array.isReadonlyArrayNonEmpty` narrows, `Math.min` or `Math.max` over numbers'
