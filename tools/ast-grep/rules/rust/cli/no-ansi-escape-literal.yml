# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-ansi-escape-literal
language: rust
severity: error
utils:
    escape-code:
        kind: integer_literal
        regex: '^(27|0x1[bB]|0o33|0b0*11011)(_?(u8|u32))?$'
rule:
    pattern: $ESCAPE
    not: {matches: rust-macro-argument}
    any:
        - kind: 'string_literal, raw_string_literal'
          any:
            - regex: '(\\(x1[bB]|u\{0*1[bB]\})|\x1b)\\*\['
            - regex: '^b?"(\\x1[bB]|\\u\{0*1[bB]\}|\x1b)"$'
        - kind: char_literal
          regex: '^b?''(\\x1[bB]|\\u\{0*1[bB]\}|\x1b)''$'
        - kind: type_cast_expression
          all:
            - has: {field: value, matches: escape-code}
            - has: {field: type, regex: '^char$'}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^((::)?(std|core)::)?(char::)?(char::)?(from_u32|from_u32_unchecked)$|^((::)?(std|core)::(primitive::)?)?char::from$'}
            - has: {field: arguments, has: {nthChild: 1, matches: escape-code}}
message: '`$ESCAPE` spells an ANSI escape character by hand'
note: 'Write an `anstyle::Style` as `{style}<text>{style:#}` to `anstream`, move or erase through `crossterm`, strip through `anstream::adapter::strip_str`'
