# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-props-condition-on-later-value
language: xml
severity: error
files: ['**/*.props']
utils:
    property-scope:
        any:
            - matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}
            - all:
                - matches: {msbuild-element: {name: {regex: '^[A-Za-z]'}}}
                - inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}}}
rule:
    kind: Attribute
    pattern: _CONDITION
    all:
        - has: {kind: Name, regex: '^Condition$'}
        - has: {kind: AttValue, regex: '\$\((TargetFramework|TargetFrameworkIdentifier|TargetFrameworkVersion|TargetPlatformIdentifier|OutputType|TargetExt|TargetPath|TargetDir|OutDir|OutputPath|IntermediateOutputPath|ProjectAssetsFile)\b'}
        - inside: {matches: msbuild-tag, inside: {matches: property-scope}}
        - not: {inside: {stopBy: end, matches: {msbuild-element: {name: {regex: '^Target$'}}}}}
message: '`$CONDITION` reads a value the project body or SDK assigns after this props file evaluates'
note: Move the condition to `Directory.Build.targets`, or key it on `$(MSBuildProjectName)` or the project directory
