# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-separator-after-directory-property
language: xml
severity: error
rule:
    pattern: _VALUE
    matches: msbuild-path-value
    regex: '\$\(MSBuildThisFileDirectory(NoRoot)?\)[\\/]'
transform:
    JOINED:
        replace:
            source: $VALUE
            replace: '(\$\(MSBuildThisFileDirectory(?:NoRoot)?\))[\\/]+'
            by: '$1'
fix: $JOINED
message: 'The separator follows a reserved property that ends with one, the form of the segment concatenated directly after the property'
