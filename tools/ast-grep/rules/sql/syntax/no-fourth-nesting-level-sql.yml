# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-sql
language: sql
severity: error
rule:
    pattern: $SCOPE
    any:
        - any: &query
            - kind: cte_definition
            - kind: select_clause
              inside: {kind: 'table_or_subquery, subquery_expression, exists_expression, in_subquery_expression'}
          inside:
            any: *query
            stopBy: &query-boundary {any: *query}
            inside:
                any: *query
                stopBy: *query-boundary
                inside:
                    any: *query
                    stopBy: *query-boundary
                    not: {inside: {any: *query, stopBy: *query-boundary}}
        - all: &choice
            - any: [{kind: case_expression}, {matches: sql-iif-call}]
            - not:
                any:
                    - inside: {kind: case_expression, field: else, stopBy: {not: {kind: parenthesized_expression}}}
                    - all: &tail
                        - inside: {kind: normal_function_arguments, inside: {matches: sql-iif-call}}
                        - not: {precedes: {stopBy: end, not: {kind: &comments 'line_comment, block_comment'}}}
                        - nthChild: {position: '2n+3', ofRule: {not: {kind: *comments}}}
                    - inside:
                        kind: parenthesized_expression
                        stopBy: {not: {kind: parenthesized_expression}}
                        all: *tail
          inside:
            all: *choice
            stopBy: &boundary {any: [{all: *choice}, {kind: &scope 'select_statement, select_clause, cte_definition'}]}
            inside:
                all: *choice
                stopBy: *boundary
                inside:
                    all: *choice
                    stopBy: *boundary
                    not: {inside: {all: *choice, stopBy: {kind: *scope}}}
transform:
    HEAD: {replace: {source: $SCOPE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level of its statement'
note: Move the inner query into a CTE or join, and nested choices into one searched `case`
