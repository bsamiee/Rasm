# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    rpc-member:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Rpc$'}, member: {regex: '^(make|custom)$'}}}
    custom-call:
        kind: call_expression
        has: {field: function, matches: rpc-member, has: {field: property, regex: '^custom$'}}
    rpc-constructor:
        any:
            - matches: rpc-member
              has: {field: property, regex: '^make$'}
            - matches: custom-call
            - kind: identifier
              pattern: $CONSTRUCTOR
              inside:
                kind: program
                stopBy: end
                has:
                    stopBy: end
                    kind: variable_declarator
                    all:
                        - has: {field: name, pattern: $CONSTRUCTOR}
                        - has: {field: value, matches: custom-call}
    rpc-value:
        kind: call_expression
        has:
            field: function
            any:
                - matches: rpc-constructor
                - {kind: member_expression, has: {field: object, matches: rpc-value}}
rule:
    kind: call_expression
    pattern: $STRUCT
    all:
        - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^Struct$'}}}}
        - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: object}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
        - any:
            - inside:
                kind: pair
                field: value
                has: {field: key, regex: '^payload$'}
                inside:
                    kind: object
                    nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}
                    inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, matches: rpc-constructor}}}
            - nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}
              inside:
                kind: arguments
                not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
                inside:
                    kind: call_expression
                    has:
                        field: function
                        kind: member_expression
                        all:
                            - has: {field: property, regex: '^setPayload$'}
                            - has: {field: object, matches: rpc-value}
message: '`$STRUCT` wraps payload fields `Rpc` wraps in `Schema.Struct` itself'
note: 'Pass the fields object as payload without `Schema.Struct`'
