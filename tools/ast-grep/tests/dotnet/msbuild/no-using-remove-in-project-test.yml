id: no-using-remove-in-project
valid:
    - |
      <ItemGroup><Using Include="Rhino.Geometry" /></ItemGroup>
    - |
      <ItemGroup>
        <Using Include="Thinktecture" Condition="'@(PackageReference->WithMetadataValue('Identity', 'Thinktecture.Runtime.Extensions'))' != ''" />
      </ItemGroup>
    - |
      <ItemGroup><Compile Remove="Generated/**" /></ItemGroup>
    - |
      <ItemGroup><Using Update="Item" Alias="Alias" /></ItemGroup>
    - |
      <ItemGroup><Using Include="Item" Static="true" /></ItemGroup>
invalid:
    - |
      <ItemGroup Label="Kernel-Free Usings"><Using Remove="Item.Analysis" /></ItemGroup>
    - |
      <ItemGroup><Using Remove="Item.Domain"></Using></ItemGroup>
    - |
      <ItemGroup><Using Remove='Item' /></ItemGroup>
    - |
      <Target Name="Trim"><ItemGroup><Using Remove="Item" /></ItemGroup></Target>
