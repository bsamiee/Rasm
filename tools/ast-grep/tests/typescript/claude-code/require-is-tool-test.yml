id: require-is-tool
valid:
    - |
      const _isBash = isTool('Bash');
    - |
      const isTool = <T extends ToolName>(tool: T): ((e: ToolCallInput) => e is Named<T>) => (e: ToolCallInput): e is Named<T> => e.tool === tool;
    - |
      const _isWritten = (e: ToolCallInput): e is Written => e.tool === 'Edit' || e.tool === 'Write';
    - |
      const row = TOOLS.find((row) => row.tool === 'WebFetch');
    - |
      const _isAnswer = (e: TurnCompleteInput): e is Answered => e.reason === 'answer';
    - |
      const _isOther = (e: ToolCallInput): e is Other => e.tool !== 'Bash';
    - |
      const _isBash = (e: ToolCallInput): e is Bash => { log(e); return e.tool === 'Bash'; };
    - |
      const _isOther = (e: ToolCallInput): e is Other => e['kind'] === 'Bash';
    - |
      const _isOther = (e: ToolCallInput): e is Other => e.kind === 'Bash';
    - |
      const _isBashRow = (row: ToolRow): row is BashRow => row.tool === 'Bash';
    - |
      const _isBashRun = (e: ToolCallInput & Run): e is BashRun => e.tool === 'Bash';
    - |
      const _hasCommand = (e: ToolCallInput): e is Commanded => (e.tool === 'Bash' || e.tool === 'Monitor') && typeof e.command === 'string';
    - 'const isBash = (e: ToolCallInput, other = effect()): e is Bash => e.tool === "Bash";'
    - 'const isBash = (e: ToolCallInput): e is Bash => /* retain */ e.tool === "Bash";'
    - 'const isBash = (e: ToolCallInput = input): e is Bash => e.tool === "Bash";'
    - 'const isBash = (e: ToolCallInput): e is Bash => e.tool /* retain */ === "Bash";'
    - 'const rule = when(isBash, bashRule); function isBash(e: ToolCallInput): e is Bash { return e.tool === "Bash"; }'
    - 'const rule = when(isBash, bashRule); log(rule); function isBash(e: ToolCallInput): e is Bash { return e.tool === "Bash"; }'
invalid:
    - 'function isBash(e: ToolCallInput): e is Bash { return e.tool === "Bash"; }'
    - 'export function isEdit(e: ToolCallInput): e is Edit { return e.tool === "Edit"; }'
    - 'function isBash(e: ToolCallInput): e is Bash { return e.tool === "Bash"; } const rule = when(isBash, bashRule);'
    - 'const rule = when(isEdit, editRule); function isBash(e: ToolCallInput): e is Bash { return e.tool === "Bash"; }'
    - |
      const _isBash = (e: ToolCallInput): e is Bash => e.tool === 'Bash';
    - |
      const _isEdit = (e: ToolCallInput): e is Edit => e.tool === "Edit";
    - |
      const rule = when((e: ToolCallInput): e is Edit => e.tool === 'Edit', editRule);
    - |
      const _isWrite = (input: ToolCallInput): input is Written => input.tool === 'Write';
    - |
      const _isBash = function (e: ToolCallInput): e is Bash { return e.tool === 'Bash'; };
    - |
      const _isEdit = (e: ToolCallInput): e is Edit => { return e.tool === 'Edit'; };
    - |
      const _isWrite = (e: ToolCallInput): e is Written => e['tool'] === 'Write';
    - |
      const _isBash = (): ((e: ToolCallInput) => e is Bash) => (e: ToolCallInput): e is Bash => e.tool === 'Bash';
    - |
      const held = fromNullable(input).match({ some: (e: ToolCallInput): e is Bash => e.tool === 'Bash', none: () => false });
    - |
      const _isBash = (e: ToolCallInput): e is Bash => (e.tool === 'Bash');
    - |
      const _isBash = (e: ToolCallInput): e is Bash => 'Bash' === e.tool;
