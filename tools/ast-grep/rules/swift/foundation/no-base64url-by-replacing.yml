# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-base64url-by-replacing
language: swiftlang
severity: error
rule:
    kind: call_expression
    any:
        - pattern: '$DATA.base64EncodedString().replacing("+", with: "-")'
        - pattern: '$DATA.base64EncodedString().replacing("/", with: "_")'
message: 'Text replacement converts `$DATA.base64EncodedString()` to the URL alphabet'
note: 'Call `<data>.base64EncodedString(options: .base64URLAlphabet)`, with `.omitPaddingCharacter` for a stripped `=`'
