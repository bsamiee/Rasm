# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-typography"
version         = "0.1.0"
description     = "Font engineering over bytes and design records with fontTools, ufo2ft, HarfBuzz and skia-pathops: face import, Perso-Arabic rules as data, compilation, and requirement checks"
license         = "MIT"
authors         = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers     = ["Intended Audience :: Developers", "Operating System :: OS Independent", "Private :: Do Not Upload", "Topic :: Multimedia :: Graphics", "Topic :: Text Processing :: Fonts", "Typing :: Typed"]
requires-python = ">=3.15"

dependencies = [
    # --- [CORE]

    "expression>=6.0.1",       # Results, options, and collections of every module
    "msgspec>=0.22.0",         # Records, tagged unions, field bounds, and JSON codecs, `frozendict` fields from 0.22.0
    "rasm-records",            # Fault results and atomic writes every typography module answers in

    # --- [FONTS]

    "fonttools[woff]>=4.68.0", # Font tables, feature AST, pens, WOFF2, and Unicode scripts and blocks
    "ufo2ft>=3.11.0",          # UFO to TrueType compile with its mark, cursive, kern and GDEF writers and filters
    "ufoLib2>=0.19.1",         # UFO source object model the compile reads

    # --- [UNICODE]

    "httpx2>=2.16.0",          # Download of the pinned `ArabicShaping.txt`

    # --- [GEOMETRY]

    "numpy>=2.5.5",            # `float64` degree angles scipy's `cosdg` and `sindg` take
    "scipy>=1.18.1",           # Scalar optimization over glyph outlines, Python 3.15 from 1.18.1
    "shapely>=2.2.0",          # Planar topology and outline geometry, Python 3.15 from 2.2.0
    "skia-pathops>=0.9.2",     # Path booleans, simplify and stroke over glyph outlines

    # --- [SHAPING]

    "uharfbuzz>=0.57.0",       # HarfBuzz shaping with the `ot` and `coretext` shapers and glyph drawing

    # --- [HINTING]

    "ttfautohint-py>=0.6.1",   # TrueType hinting where a face's genre asks for it, `epoch` from 0.6.1
]

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/libs/python/graphics/typography"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
