# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-geometry-format-text
language: rust
severity: error
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $TEXT
    all:
        - matches: rust-geometry-format-text
        - not: {inside: {stopBy: end, matches: rust-injected-source}}
message: '`$TEXT` spells geometry interchange text by hand'
note: 'Read and write the shape through its format crate (`geojson`, `geozero` for WKT, `kurbo::BezPath::to_svg`, `stl_io`, `tobj`, `ply_rs_bw`)'
