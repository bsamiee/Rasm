# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-relifted-option
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
utils:
    match-cases:
        kind: object
        inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, kind: member_expression, has: {field: property, regex: ^match$}}
    none-arm:
        any:
            - kind: pair
              all:
                - {has: {field: key, regex: ^none$}}
                - {has: {field: value, any: [{pattern: () => none()}, {pattern: () => none<$_>()}, {pattern: none}]}}
            - kind: shorthand_property_identifier
              pattern: {context: 'const cases = { none }', selector: shorthand_property_identifier}
    empty-arm:
        kind: pair
        all:
            - {has: {field: key, pattern: {context: 'const cases = { none: 0 }', selector: property_identifier}}}
            - {has: {field: value, pattern: '() => []'}}
    option-operation:
        kind: variable_declarator, function_declaration
        has: {field: name, regex: ^(map|flatMap|getOrElse|toArray|liftPredicate)$}
    option-typed-match:
        matches: match-cases
        inside:
            kind: arguments
            inside: {kind: call_expression, has: {field: type_arguments, pattern: {context: match<Option<$_>>(), selector: type_arguments}}}
    option-answer:
        kind: arrow_function
        has: {field: body, kind: call_expression, has: {field: function, kind: identifier, regex: ^(some|none|fromNullable)$}}
    identity-arm:
        any:
            - {pattern: ($X) => $X}
            - {pattern: '($X: $_) => $X'}
            - {pattern: '($X) => { return $X; }'}
            - {pattern: '($X: $_) => { return $X; }'}
    one-element-arm:
        kind: arrow_function
        has:
            field: body
            kind: array
            all:
                - {has: {pattern: $_, not: {kind: spread_element}}}
                - {not: {has: {nthChild: 2}}}
rule:
    kind: pair
    all:
        - {has: {field: key, regex: ^some$}}
        - {inside: {matches: match-cases}}
        - any:
            - all:
                - {inside: {matches: match-cases, has: {matches: none-arm}}}
                - any: [{inside: {matches: option-typed-match}}, {has: {field: value, matches: option-answer}}]
            - {has: {field: value, matches: identity-arm}}
            - all:
                - {has: {field: value, matches: one-element-arm}}
                - {inside: {matches: match-cases, has: {matches: empty-arm}}}
        - not:
            inside: {stopBy: {kind: 'variable_declarator, function_declaration'}, matches: option-operation}
    pattern: $MATCH
message: The case record rebuilds an Option operation `composition/option.ts` exports
note: Call the exported operation over the option, `map(f)(option)`, `flatMap(f)(option)`, `getOrElse(fallback)(option)`, or `toArray(option)`
labels: {MATCH: {style: primary}}
