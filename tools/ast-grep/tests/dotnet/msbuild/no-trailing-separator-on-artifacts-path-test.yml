id: no-trailing-separator-on-artifacts-path
valid:
    - '<ProjectExtensions><ArtifactsPath>artifacts/</ArtifactsPath></ProjectExtensions>'
    - '<PropertyGroup><ArtifactsPath>artifacts/NormalizeDirectory(cache)</ArtifactsPath></PropertyGroup>'
    - '<PropertyGroup><ArtifactsPath>/</ArtifactsPath></PropertyGroup>'
    - '<PropertyGroup><ArtifactsPath>C:/</ArtifactsPath></PropertyGroup>'
    - "<PropertyGroup><ArtifactsPath>$([MSBuild]::NormalizeDirectory('/'))</ArtifactsPath></PropertyGroup>"
    - '<PropertyGroup><ArtifactsPath>artifacts/<!-- retain -->cache</ArtifactsPath></PropertyGroup>'
    - |
      <PropertyGroup><ArtifactsPath>$([MSBuild]::NormalizePath('$(RepoRoot)', '.artifacts', 'dotnet'))</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$(NativeArtifactsRoot)msbuild</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><LibsRoot>$([MSBuild]::NormalizeDirectory('$(RepoRoot)', 'libs'))</LibsRoot></PropertyGroup>
    - |
      <PropertyGroup><PackageOutputPath>$(ArtifactsPath)/package/</PackageOutputPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$(RepoRoot)artifacts</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$([System.IO.Path]::TrimEndingDirectorySeparator('$(RepoRoot)artifacts/'))</ArtifactsPath></PropertyGroup>
invalid:
    - |
      <PropertyGroup><ArtifactsPath>$(RepoRoot).artifacts/dotnet/</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$([MSBuild]::NormalizeDirectory('$(RepoRoot)', '.artifacts', 'dotnet'))</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$([MSBuild]::EnsureTrailingSlash('$(ArtifactsRoot)'))</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$([MSBuild]::NormalizeDirectory('$(RepoRoot)', 'artifacts/'))</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$(RepoRoot)artifacts\</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$([MSBuild]::NormalizePath('$(RepoRoot)', 'artifacts/'))</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup>
        <ArtifactsPath>
          $(RepoRoot)artifacts/
        </ArtifactsPath>
      </PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath Label="NormalizeDirectory(cache)">$([MSBuild]::NormalizeDirectory('artifacts/NormalizeDirectory(cache)'))</ArtifactsPath></PropertyGroup>
    - '<PropertyGroup><ArtifactsPath>artifacts/NormalizeDirectory(cache)/</ArtifactsPath></PropertyGroup>'
    - '<PropertyGroup><ArtifactsPath>artifacts///</ArtifactsPath></PropertyGroup>'
    - |
      <PropertyGroup><ArtifactsPath>$(RepoRoot)/</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath Condition="'$(ArtifactsPath)' == ''">$(RepoRoot)artifacts/</ArtifactsPath></PropertyGroup>
