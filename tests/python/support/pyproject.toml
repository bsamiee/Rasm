# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-testing"
version         = "0.0.0"
description     = "Fixtures for pytest, each behind an extra: a private SQLite database and HTTP servers a test hosts on a loopback port"
classifiers     = ["Framework :: Pytest", "Private :: Do Not Upload", "Typing :: Typed"]
requires-python = ">=3.13"

dependencies = [
    "expression",    # Outcome a test step settles
    "pytest",        # Fixtures, report hooks, stash keys, and report sections
    "pytest-socket", # `enable_socket` marker a plugin adds to each test reaching a server
    "rasm-records",  # Fault results and their report text
]

[project.optional-dependencies]
hosting = [
    "anyio",      # Event loop thread a test hosts servers on, and its clock on each received request
    "hypercorn",  # HTTP/1.1 and h2c server answering from a function of the test on a loopback port
    "msgspec",    # Request and answer records of a hosted server
]
sqlite  = [
    "sqlite-vec", # `vec0` extension loaded into each SQLite database
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table
