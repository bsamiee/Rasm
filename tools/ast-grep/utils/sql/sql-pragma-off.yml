# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: sql-pragma-off
language: sql
rule:
    kind: pragma_statement
    has:
        field: value
        not: {kind: substitution}
        any:
            - not: {regex: '(?i-u)^["''`\[]?(?:on|yes|true)["''`\]]?$|^["''`\[]?(?:0*[1-9]|0[Xx]0*[1-9A-Fa-f])'}
            - follows: {regex: '^-$'}
