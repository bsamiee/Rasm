id: no-unquoted-condition-operand
valid:
    # Both operands quoted
    - |
      <Optimize Condition="'$(TargetFramework)' == 'net10.0'">true</Optimize>
    # The empty-default guard
    - |
      <TargetFramework Condition="'$(TargetFramework)' == ''">net10.0</TargetFramework>
    # Boolean functions stand alone without an operator
    - |
      <HostUi Condition="$(_HostTokens.Contains(';ui;')) or '$(HostPlatform)' == 'true'">true</HostUi>
    # Exists and a negated Exists on an item metadata reference
    - |
      <_Missing Include="@(Reference->'%(HintPath)')" Condition="'%(Reference.HintPath)' != '' and !Exists('%(Reference.HintPath)')" />
invalid:
    # Both operands unquoted, the literal splits at the dot with MSB4092
    - |
      <Optimize Condition="$(TargetFramework) == net10.0">true</Optimize>
    # An unquoted property on the left of a quoted literal
    - |
      <PropertyGroup Condition="$(OutputType) == 'Exe'"><SelfContained>false</SelfContained></PropertyGroup>
    # An unquoted literal on the right of an inequality
    - |
      <Compile Include="Extra.cs" Condition="'$(Configuration)' != Release" />
