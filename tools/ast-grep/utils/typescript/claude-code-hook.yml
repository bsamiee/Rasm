# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: claude-code-hook
language: tsx
rule:
    kind: arrow_function, function_expression, function_declaration
    any:
        - {inside: {kind: arguments, inside: {matches: claude-code-registration}}}
        - all:
            - any:
                - {inside: {kind: variable_declarator, has: {field: name, pattern: $HOOK}}}
                - {kind: function_declaration, has: {field: name, pattern: $HOOK}}
            - inside:
                stopBy: {kind: statement_block}
                kind: program, statement_block
                has:
                    stopBy: {matches: syntax-function-boundary}
                    matches: claude-code-registration
                    has: {field: arguments, has: {kind: identifier, pattern: $HOOK}}
