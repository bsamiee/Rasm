# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: <rule-id>
language: <language>
severity: error
rule:
    pattern: <code capturing $$$ITEMS>
rewriters:
    - id: <rewriter-id> # Ordered sequence: per node the first matching rewriter wins
      rule: {pattern: $ITEM, kind: <kind>}
      transform:
        <LOCAL>: <op>($ITEM, <key>=<value>) # Vars, transform, and utils stay inside the rewriter
      fix: <per-item template referencing $ITEM and $LOCAL>
transform:
    <OUT>:
        rewrite:
            source: $$$ITEMS # Rewriters apply to the capture's descendants, outer nodes first, without overlap
            rewriters: [<rewriter-id>]
            joinBy: '<sep>' # Joins the rewritten items and drops unmatched members, absent it splices them back in place
fix: <template referencing $OUT>
message: <one line naming the violation>
note: <the exact repair, the shape to produce>
---
id: <deletion-rule-id>
language: <language>
severity: error
rule: <rule>
fix:
    template: '' # Empty template deletes the matched node
    expandEnd: {regex: '<separator>'} # Consumes exactly one following sibling matching the rule, expandStart the preceding one
message: <why>
note: <repair>
