# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-event-subscription-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    event:
        any:
            - kind: identifier
              pattern: $EVENT
            - kind: member_access_expression
              has: {field: name, pattern: $EVENT}
    handler-lambda:
        kind: lambda_expression
        has: {field: parameters, any: [{kind: implicit_parameter, pattern: $P}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $P}}}]}
    action:
        all:
            - any:
                - inside: {field: body, matches: handler-lambda}
                - inside: {kind: expression_statement, inside: {kind: block, inside: {field: body, matches: handler-lambda}}}
            - has: {field: right, pattern: $P}
rule:
    kind: assignment_expression
    all:
        - has: {field: operator, regex: '^\+=$'}
        - has: {field: left, matches: event}
        - not: {matches: action}
        - not:
            has:
                field: right
                kind: lambda_expression
                has:
                    field: body
                    not:
                        any:
                            - kind: block
                            - kind: invocation_expression
                            - kind: assignment_expression
                            - kind: await_expression
                            - kind: object_creation_expression
                            - kind: conditional_access_expression
                            - kind: prefix_unary_expression
                            - kind: postfix_unary_expression
        - any:
            - inside:
                stopBy: end
                kind: compilation_unit
                has:
                    stopBy: end
                    kind: assignment_expression
                    all:
                        - has: {field: operator, regex: '^-=$'}
                        - has: {field: left, matches: event}
                        - not: {matches: action}
            - all:
                - has: {field: left, kind: member_access_expression, not: {has: {field: expression, regex: '^(this|base)$'}}}
                - has: {field: right, kind: 'lambda_expression, anonymous_method_expression'}
message: '`+=` attaches a handler to `$EVENT` of another object by hand'
note: Use `Subscriptions.Attach<THandler>(h => <source>.<event> += h, h => <source>.<event> -= h, <handler>)` with the handler `Callbacks.Handler` builds at its site, and dispose the `IDisposable` it answers to detach
