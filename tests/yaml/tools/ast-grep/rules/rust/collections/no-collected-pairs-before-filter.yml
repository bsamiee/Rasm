id: no-collected-pairs-before-filter
valid:
    - |
      fn pairs(xs: &[u32]) -> Vec<(u32, u32)> {
          xs.iter().copied().tuple_combinations().filter(|(a, b)| a < b).collect::<Vec<_>>()
      }
    - |
      fn large(xs: &[u32]) -> usize {
          xs.iter().collect::<Vec<_>>().into_iter().filter(|x| **x > 1).count()
      }
    - |
      fn pairs(xs: &[u32]) -> Vec<(u32, u32)> {
          xs.iter().copied().tuple_combinations().collect::<Vec<_>>().par_iter().filter(|(a, b)| a < b).copied().collect()
      }
invalid:
    - |
      fn pairs(xs: &[u32]) -> Vec<(u32, u32)> {
          xs.iter().copied().tuple_combinations().collect::<Vec<_>>().into_iter().filter(|(a, b)| a < b).collect()
      }
    - |
      fn grid(xs: &[u32], ys: &[u32]) -> Vec<(u32, u32)> {
          iproduct!(xs, ys).collect::<Vec<_>>().iter().filter_map(|(a, b)| (a < b).then_some((**a, **b))).collect()
      }
