id: no-alternate-spelling
valid:
    - SELECT a FROM t LIMIT 10 OFFSET 5;
    - SELECT * FROM a JOIN b ON a.id = b.id;
    - BEGIN;
    - BEGIN TRANSACTION;
    - SELECT count(1) FROM t;
    - SELECT a FROM t;
    - CREATE TEMP TABLE t (a);
    - SELECT count(*) FROM t;
    - SELECT count(a) FROM t;
    - SELECT count(DISTINCT 1) FROM t;
    - SELECT a FROM t WHERE a IS NOT b;
    - SELECT a FROM t WHERE a = b AND a <> c;
    - SELECT a FROM t WHERE a IS NULL;
    - SELECT group_concat(a, ',') FROM t;
invalid:
    - SELECT a FROM t LIMIT 5, 10;
    - SELECT * FROM a INNER JOIN b ON a.id = b.id;
    - BEGIN /* deferred */ TRANSACTION;
    - SELECT ALL a FROM t;
    - CREATE TEMPORARY TABLE t (a);
    - SELECT count() FROM t;
    - SELECT count('row') FROM t;
    - SELECT a FROM t WHERE a IS DISTINCT FROM NULL;
    - SELECT a FROM t WHERE a == b;
    - SELECT a FROM t WHERE a != b;
    - SELECT a FROM t WHERE a ISNULL;
    - SELECT group_concat(a) FROM t;
