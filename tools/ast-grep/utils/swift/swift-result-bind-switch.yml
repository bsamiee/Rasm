# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-result-bind-switch
language: swiftlang
rule:
    kind: switch_statement
    all:
        - has: {field: expr, matches: swift-result-value}
        - not: {has: {kind: switch_entry, nthChild: {position: 3, ofRule: {kind: switch_entry}}}}
        - has:
            kind: switch_entry
            all:
                - has: {kind: switch_pattern, regex: '^(let[\t-\r ]+)?\.success(?-u:\b)'}
                - not: {has: {kind: switch_pattern, nthChild: {position: 2, ofRule: {kind: switch_pattern}}}}
                - not:
                    has:
                        kind: statements
                        has:
                            all:
                                - &statement {pattern: $_, not: {kind: 'comment, multiline_comment'}}
                                - not: {follows: {stopBy: end, all: [*statement]}}
                                - matches: swift-failure-value
        - has:
            kind: switch_entry
            all:
                - has: {kind: switch_pattern, regex: '^(let[\t-\r ]+)?\.failure(?-u:\b)'}
                - has:
                    kind: statements
                    all:
                        - not:
                            has:
                                all:
                                    - *statement
                                    - follows: {stopBy: end, all: [*statement]}
                        - has: {all: [*statement, {matches: swift-failure-value}]}
