# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observation-ignored-read-by-observed
language: swiftlang
severity: error
utils:
    ignored: {kind: attribute, regex: '^@ObservationIgnored$'}
    named:
        has:
            field: name
            any:
                - pattern: $TYPE
                - has: {kind: type_identifier, pattern: $TYPE}
    reader:
        any:
            - kind: property_declaration
            - kind: subscript_declaration
        all:
            - has:
                kind: computed_property
                has:
                    kind: simple_identifier
                    stopBy: end
                    pattern: $NAME
                    not:
                        inside:
                            kind: navigation_suffix
                            inside: {kind: navigation_expression, not: {has: {field: target, kind: self_expression}}}
            - not: {has: {stopBy: end, pattern: 'access(keyPath: \.$NAME)'}}
rule:
    kind: property_declaration
    all:
        - pattern: $DECL
        - has: {kind: modifiers, has: {matches: ignored}}
        - has: {kind: value_binding_pattern, regex: '^var$'}
        - has: {field: name, pattern: $NAME}
        - not:
            has:
                kind: modifiers
                has:
                    any:
                        - kind: property_behavior_modifier
                        - {kind: attribute, has: {kind: user_type, regex: '^[A-Z]', not: {regex: '^(ObservationIgnored|\w*Actor)$'}}}
        - inside:
            kind: class_body
            inside:
                kind: class_declaration
                matches: named
                inside:
                    kind: source_file
                    stopBy: end
                    has:
                        kind: class_declaration
                        stopBy: end
                        all:
                            - matches: named
                            - has: {field: body, has: {matches: reader}}
transform:
    TRACKED: {replace: {source: $DECL, replace: '@ObservationIgnored\s+', by: ''}}
fix: $TRACKED
message: '`@ObservationIgnored` hides changes to `$NAME` from observers of a computed member that reads it'
note: 'Delete `@ObservationIgnored`'
