# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-receiver-dispatch-switch
language: swift
severity: error
utils:
    first-entry:
        kind: switch_entry
        nthChild: {position: 1, ofRule: {kind: switch_entry}}
    wrapper:
        kind: 'try_expression, await_expression, control_transfer_statement'
    chained:
        kind: call_expression
        all:
            - has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, has: {field: suffix, pattern: $N}}}
            - has: {kind: call_suffix, pattern: $B}
    receiver-call:
        any:
            - {matches: wrapper, has: {matches: receiver-call}}
            - {matches: chained, has: {nthChild: 1, has: {field: target, matches: receiver-call}}}
            - pattern: $R.$M($$$A)
    member-call:
        any:
            - {matches: wrapper, has: {matches: member-call}}
            - {matches: chained, has: {nthChild: 1, has: {field: target, matches: member-call}}}
            - pattern: $_.$M($$$A)
    receiver-body:
        kind: statements
        all:
            - has: {nthChild: 1, matches: receiver-call}
            - not: {has: {nthChild: 2}}
    member-body:
        kind: statements
        all:
            - has: {nthChild: 1, matches: member-call}
            - not: {has: {nthChild: 2}}
rule:
    kind: switch_statement
    all:
        - has: {matches: first-entry, has: {matches: receiver-body}}
        - not: {has: {kind: switch_entry, not: {has: {matches: member-body}}}}
        - has: {kind: switch_entry, not: {has: {pattern: $R, stopBy: end}}}
constraints:
    R: {kind: simple_identifier}
message: 'Every arm calls `$M` with the same arguments on a different receiver'
note: 'Conform the receivers to one protocol with a requirement returning the result type every arm produces, choose the receiver once, and call `<member>` on it, an `async let` pair becomes a task group over the cases applying results in case order'
