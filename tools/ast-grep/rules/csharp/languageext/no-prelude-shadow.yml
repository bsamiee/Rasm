# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-prelude-shadow
language: csharp
severity: error
rule:
    pattern: $NAME
    regex: '^(unit|unitIO|unitEff|None|identity)$'
    any:
        - kind: implicit_parameter
        - kind: identifier
          any:
            - inside: {kind: 'variable_declarator, property_declaration, parameter, from_clause, join_clause, join_into_clause, declaration_pattern, declaration_expression, local_function_statement', field: name}
            - inside: {kind: let_clause}
            - inside: {kind: foreach_statement, field: left}
message: 'Declaration `$NAME` hides `Prelude` member `$NAME`'
note: Use a name that states what the value holds, the `Prelude` member stays reachable at every use
