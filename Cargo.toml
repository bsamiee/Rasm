reqwest-tracing = { version = "0.7.1", default-features = false } # Client request spans with semantic-convention attributes
# --- [RPC]
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "stdio", "tokio", "tracing"] } # Language Server Protocol clients and servers as tower services
buffa = { version = "0.9.2", default-features = false, features = ["std", "json", "fast-utf8"] } # Protobuf messages with editions, views, and canonical JSON
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-child-process", "transport-streamable-http-server"] } # MCP sessions over child-process stdio and Streamable HTTP
buffa-types = { version = "0.9.2", default-features = false, features = ["std", "json", "jiff"] } # Protobuf well-known types with JSON mapping and jiff conversion
connectrpc = { version = "0.9.1", default-features = false, features = ["server", "client", "client-tls", "axum", "json", "gzip", "zstd"] } # Connect, gRPC, and gRPC-Web services and clients
protovalidate-buffa = { version = "0.7.2", default-features = false, features = ["connect", "json"] } # Protovalidate rules compiled into message validation
# --- [TRANSFER]
