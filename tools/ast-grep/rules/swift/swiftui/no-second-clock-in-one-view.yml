# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-second-clock-in-one-view
language: swift
severity: error
utils:
    timeline:
        any:
            - pattern: 'TimelineView($$$_) { $$$_ }'
            - pattern: TimelineView($$$_)
    clock:
        any:
            - matches: timeline
            - pattern: Timer.publish($$$_)
            - pattern: 'Text($_, style: $_)'
              regex: 'style:\s*\.(relative|offset|timer)\s*\)$'
            - kind: call_expression
              has: {nthChild: 1, kind: simple_identifier, regex: '^(Text|ProgressView)$'}
              regex: '^(Text|ProgressView)\(timerInterval:'
            - kind: call_expression
              has: {nthChild: 1, kind: simple_identifier, regex: '^Text$'}
              regex: '^Text\(\.(currentDate|durationOffset|dateRange)\b'
rule:
    matches: swift-view-builder
    all:
        - has:
            stopBy: {kind: 'function_declaration, property_declaration'}
            matches: timeline
            pattern: $FIRST
        - has:
            stopBy: {kind: 'function_declaration, property_declaration'}
            matches: clock
            pattern: $SECOND
            not:
                any:
                    - pattern: $FIRST
                    - inside:
                        stopBy: end
                        kind: switch_entry
                        not: {has: {stopBy: end, pattern: $FIRST}}
                        inside: {kind: switch_statement, has: {kind: switch_entry, has: {stopBy: end, pattern: $FIRST}}}
                    - inside:
                        stopBy: end
                        kind: statements
                        not: {has: {stopBy: end, pattern: $FIRST}}
                        inside: {kind: if_statement, stopBy: {not: {kind: if_statement}}, has: {stopBy: end, pattern: $FIRST}}
message: '`$SECOND` runs a second clock beside `TimelineView` in one view'
note: 'Pass `context.date` of the one `TimelineView` down to every text and subview it renders, clocks in `if` or `switch` arms that never render together stay apart'
labels:
    SECOND: {style: primary}
