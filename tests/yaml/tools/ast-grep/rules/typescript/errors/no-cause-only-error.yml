id: no-cause-only-error
valid:
    - |
      import { Data } from "effect";
      export class FetchError extends Data.TaggedError("FetchError")<{ readonly cause: unknown }> {}
    - |
      import { Data, Effect } from "effect";
      class FetchError extends Data.TaggedError("FetchError")<{ readonly cause: unknown }> {}
      const handled = Effect.catchTag(load, "FetchError", () => Effect.succeed(0));
    - |
      import { Data } from "effect";
      class FetchError extends Data.TaggedError("FetchError")<{ readonly cause: unknown; readonly url: string }> {}
invalid:
    - |
      import { Data } from "effect";
      class FetchError extends Data.TaggedError("FetchError")<{ readonly cause: unknown }> {}
    - |
      import { Data, Effect } from "effect";
      class FetchError extends Data.TaggedError("FetchError")<{ readonly cause: unknown }> {}
      const load = Effect.tryPromise({ try: () => fetch(url), catch: (cause) => new FetchError({ cause }) });
