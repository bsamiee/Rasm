# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-run-python-script
language: python
severity: error
files: ['**/rhino/**']
rule:
    kind: string
    pattern: $MACRO
    has: {kind: string_content, regex: '(?i)(^|[\s!=''"]|\\[nrt])[_-]*runpythonscript($|[\s''"(]|\\[nrt])'}
    not:
        any:
            - inside: {matches: python-docstring-or-comment}
            - inside: {kind: comparison_operator, stopBy: {not: {kind: 'tuple, list, set'}}}
            - inside: {kind: case_pattern, stopBy: end}
message: '`$MACRO` runs Python on IronPython 2 through `_-RunPythonScript`'
note: 'Run it on the shared CPython through `_-ScriptEditor _Run "<file>"`, or `_-ScriptEditor _Run (<source>)` with `#! python3` as the first source line, RhinoCode resolving inline source by its `#!` line alone'
