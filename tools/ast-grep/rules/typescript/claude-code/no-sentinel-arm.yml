# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sentinel-arm
language: tsx
severity: error
files:
    - '**/.claude/plugins/**'
ignores:
    - '**/*.spec.ts'
utils:
    blank:
        any:
            - {kind: string, not: {has: {kind: 'string_fragment, escape_sequence'}}}
            - {kind: template_string, not: {has: {kind: 'string_fragment, template_substitution, escape_sequence'}}}
            - {kind: 'null'}
    valued-pair:
        kind: pair
        all:
            - {has: {field: key, pattern: $KEY}}
            - {has: {field: value, kind: 'string, template_string', not: {matches: blank}}}
    arm:
        any:
            - {kind: ternary_expression, has: {stopBy: end, matches: valued-pair}}
            - matches: syntax-function-boundary
              has: {stopBy: {matches: syntax-function-boundary}, kind: return_statement, has: {stopBy: end, matches: valued-pair}}
rule:
    kind: pair
    all:
        - {has: {field: key, pattern: $KEY}}
        - {has: {field: value, pattern: $SENTINEL, matches: blank}}
        - {inside: {kind: object}}
        - {inside: {stopBy: {matches: syntax-function-boundary}, matches: arm}}
    pattern: $MATCH
message: '`$KEY: $SENTINEL` stands for absence beside an arm that answers a value'
note: Answer `undefined` from the arm that has no value, and read it through `?.`, `??`, or a ternary
labels: {MATCH: {style: primary}}
