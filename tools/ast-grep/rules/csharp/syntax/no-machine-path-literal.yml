# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-machine-path-literal
language: csharp
severity: error
rule:
    kind: 'string_literal, verbatim_string_literal, raw_string_literal, interpolated_string_expression'
    all:
        - pattern: $PATH
        - regex: '(^[$@]*"+|[\s=])(/(Applications|Users|home|Volumes|opt|Library)(/|"|$)|/usr/local/|[A-Za-z]:\\{1,2}(Program Files|Users|ProgramData)(\\|"|$))'
message: '`$PATH` names a location in one machine''s install, user, or volume folders'
note: Read the location at run time from its owner (host API, bundle id lookup, package resolver, special folder) or take it as a parameter
