id: pipeline-reader-to-process-substitution
valid:
    - read -r line < <(producer)
    - mapfile -t lines < <(producer)
    - while IFS= read -r line; do count=1; done < <(producer)
    - while IFS= read -r line; do count=1; done <<<"$output"
    - producer | sort | head -n 1
    - producer | { read -r a; read -r b; printf "%s" "$a$b"; }
    - producer | while read -r line; do printf "%s" "$line"; done | sort
    - '! producer | read -r value'
    - time producer | read -r value
    - time -p producer | read -r value
    - producer | read -r value <<<"$fallback"
    - producer | runner read -r value
    - producer | builtin printf '%s\n' done
    - producer | for x in a; do read -r y; done
invalid:
    - producer | read -r value
    - producer | IFS= read -r value
    - producer | mapfile -t values
    - producer | readarray -t values
    - producer | while IFS= read -r line; do count=1; done
    - producer | until read -r line; do count=1; done
    - producer | while true; do read -r line || break; count=1; done
    - first x | second y | read -r value
    - producer 2>&1 | read -r value
    - producer |& read -r value
    - producer | read -r value 2>/dev/null
    - if producer | read -r value; then consume "$value"; fi
    - printf "%s" "$(first | second)" | read -r value
    - printf '%s' 'text | read -r field' | read -r value
    - output=$(producer | read -r value; printf "%s" "$value")
    - shopt -s lastpipe; producer | read -r value
    - producer | builtin read -r value
    - producer | command mapfile -t values
    - producer | read -r value <&3
    - producer | while read -r line; do count=1; done > out
    - producer | command -p -- read -r value
