# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-qualified-path-guard
language: csharplang
severity: error
files: ['**/rhino/**']
utils:
    io-call:
        kind: invocation_expression
        matches: {csharp-owner-call: {type: {regex: '^IO$'}, member: {regex: '^(lift|liftAsync|pure|fail)$'}}}
    effect:
        any:
            - matches: io-call
            - kind: invocation_expression
              matches: {csharp-named-call: {name: {regex: '^(when|unless)$'}}}
            - kind: conditional_expression
              any:
                - has: {field: consequence, matches: io-call}
                - has: {field: alternative, matches: io-call}
            - kind: query_expression
              has: {stopBy: end, matches: io-call}
    check:
        kind: invocation_expression
        all:
            - pattern: $CHECK($PATH)
            - matches: {csharp-owner-call: {type: {regex: '^Path$'}, member: {regex: '^(IsPathFullyQualified|IsPathRooted)$'}}}
    affirmed:
        any:
            - matches: check
            - kind: parenthesized_expression
              has: {matches: affirmed}
            - kind: is_pattern_expression
              all: [{has: {field: expression, matches: check}}, {has: {field: pattern, regex: '^true$'}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^==$'}}, {has: {field: left, matches: check}}, {has: {field: right, regex: '^true$'}}]
    held-declaration:
        any:
            - kind: variable_declarator
              all: [{has: {field: name, pattern: $FLAG}}, {has: {nthChild: {position: 1, reverse: true}, matches: affirmed}}]
            - kind: let_clause
              all: [{has: {kind: identifier, nthChild: 1, pattern: $FLAG}}, {has: {nthChild: {position: 1, reverse: true}, matches: affirmed}}]
    held:
        kind: identifier
        pattern: $FLAG
        inside:
            stopBy: end
            kind: method_declaration, constructor_declaration, local_function_statement, lambda_expression, anonymous_method_expression, operator_declaration, accessor_declaration, block, arrow_expression_clause, switch_section, query_expression
            has: {stopBy: {kind: 'lambda_expression, anonymous_method_expression, local_function_statement, block'}, matches: held-declaration}
    truthy:
        any:
            - matches: affirmed
            - matches: held
    falsy:
        any:
            - kind: prefix_unary_expression
              regex: '^!'
              has: {nthChild: 1, matches: truthy}
            - kind: is_pattern_expression
              all: [{has: {field: expression, matches: truthy}}, {has: {field: pattern, regex: '^false$'}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^==$'}}, {has: {field: left, matches: truthy}}, {has: {field: right, regex: '^false$'}}]
            - kind: parenthesized_expression
              has: {matches: falsy}
    failure:
        any:
            - kind: invocation_expression
              has: {field: function, any: [{matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^fail$'}}}}, {matches: {csharp-owner-member: {type: {regex: '^Fin$'}, member: {regex: '^Fail$'}}}}, {matches: {csharp-type-name: {name: {regex: '^FinFail$'}}}}]}
            - kind: parenthesized_expression
              has: {matches: failure}
    requires:
        any:
            - kind: invocation_expression
              all:
                - has: {field: function, any: [{kind: member_access_expression, has: {field: name, regex: '^Unless$'}}, {matches: {csharp-type-name: {name: {regex: '^(unless|guard)$'}}}}]}
                - has: {field: arguments, has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, matches: truthy}}}
            - kind: invocation_expression
              all:
                - matches: {csharp-named-call: {name: {regex: '^(when|guardnot)$'}}}
                - has: {field: arguments, has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, matches: falsy}}}
            - kind: conditional_expression
              any:
                - all: [{has: {field: condition, matches: truthy}}, {has: {field: alternative, matches: failure}}]
                - all: [{has: {field: condition, matches: falsy}}, {has: {field: consequence, matches: failure}}]
rule:
    kind: invocation_expression, conditional_expression
    all:
        - matches: requires
        - any:
            - matches: effect
            - inside: {stopBy: end, matches: effect}
message: "`$CHECK($PATH)` requires a qualified path inside an effect"
note: 'Bind `<path>` validation into a path value object as a step'
