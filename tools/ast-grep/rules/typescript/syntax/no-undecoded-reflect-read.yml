# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-undecoded-reflect-read
language: tsx
severity: error
utils:
    entry:
        any:
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(decode(Unknown)?(Effect|Exit|Option|Promise|Result|Sync)|is|asserts)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Schema|SchemaParser)$'}}}}
            - kind: identifier
              matches: {typescript-import-reference: {source: {regex: '^effect/(Schema|SchemaParser)$'}, exported: {regex: '^(decode(Unknown)?(Effect|Exit|Option|Promise|Result|Sync)|is|asserts)$'}}}
    decoder:
        any:
            - kind: call_expression
              has: {field: function, matches: entry}
            - kind: identifier
              pattern: $DECODER
              inside:
                kind: program
                stopBy: end
                has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $DECODER}}, {has: {field: value, matches: decoder}}]}
    piped:
        nthChild: {position: 1, ofRule: {not: {kind: comment}}}
        inside:
            kind: arguments
            inside:
                kind: call_expression
                all:
                    - has: {field: function, regex: '^(Function\.)?pipe$'}
                    - has: {field: arguments, has: {stopBy: end, matches: decoder}}
    refinement:
        matches: {effect-module-member: {module: {regex: '^Predicate$'}, member: {regex: '^is[A-Z]\w*$', not: {regex: '^(isTruthy|isUnknown|isNot\w+)$'}}}}
    decoded:
        any:
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, any: [{matches: decoder}, {matches: entry}, {matches: refinement}]}}}
            - nthChild: {position: 1, ofRule: {not: {kind: comment}}}
              inside:
                kind: arguments
                inside:
                    kind: call_expression
                    all:
                        - has: {field: function, matches: {effect-module-member: {module: {regex: '^Option$'}, member: {regex: '^liftPredicate$'}}}}
                        - has: {field: arguments, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, matches: refinement}}
            - matches: piped
            - inside: {stopBy: end, matches: piped}
            - inside:
                kind: member_expression
                field: object
                stopBy: end
                has: {field: property, regex: '^pipe$'}
                inside: {kind: call_expression, field: function, has: {field: arguments, has: {stopBy: end, matches: decoder}}}
rule:
    kind: call_expression
    pattern: $READ
    all:
        - has: {field: function, regex: '^((globalThis|window|self)\.)?Reflect\.get$', matches: typescript-global-reference}
        - has:
            field: arguments
            has:
                nthChild: {position: 2, ofRule: {not: {kind: comment}}}
                pattern: $KEY
                any:
                    - kind: string
                    - kind: template_string
                      not: {has: {kind: template_substitution}}
                    - kind: identifier
                      inside:
                        kind: program
                        stopBy: end
                        has:
                            stopBy: end
                            kind: variable_declarator
                            all:
                                - has: {field: name, pattern: $KEY}
                                - has: {field: value, kind: 'string, template_string', not: {has: {kind: template_substitution}}}
        - not:
            any:
                - matches: decoded
                - inside:
                    kind: variable_declarator
                    field: value
                    all:
                        - has: {field: type, has: {kind: predefined_type, regex: '^unknown$'}}
                        - has: {field: name, kind: identifier, pattern: $VALUE}
                        - inside: {kind: program, stopBy: end, has: {stopBy: end, kind: identifier, pattern: $VALUE, matches: decoded}}
message: '`$READ` reads `$KEY` as `any` with no decode'
note: 'Read a member the typings declare as `<owner>.<member>`, after a `constructorName` match narrows a subclass, and decode or refine a member they omit where it is read, `Schema.decodeUnknownOption(<schema>)(Reflect.get(<owner>, <name>))` or `Option.liftPredicate(Reflect.get(<owner>, <name>), Predicate.is<Type>)`'
