# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-destination-folder-over-glob
language: xml
severity: error
rule:
    all:
        # Copy and Move take the same source and destination parameters
        - matches: {msbuild-element: {name: {regex: '^(Copy|Move)$'}}}
        # A literal recursive glob in a parameter, SourceFiles is the one list parameter and a literal batches no %(RecursiveDir)
        - matches: {msbuild-metadata: {name: {kind: Name}, value: {regex: '\*\*'}}}
message: >-
    Copy or Move over a literal recursive glob keeps no tree, DestinationFolder writes every file into one directory and files with one name
    overwrite each other
note: Put the files in an item and transform it with %(RecursiveDir) into DestinationFiles
