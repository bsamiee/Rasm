id: no-recursive-read-dir
valid:
    - |
      fn list(dir: &Path) -> std::io::Result<Vec<PathBuf>> {
          let mut out = Vec::new();
          for entry in std::fs::read_dir(dir)? {
              out.push(entry?.path());
          }
          Ok(out)
      }
    - |
      fn walk(root: &Path) -> Vec<PathBuf> {
          ignore::WalkBuilder::new(root).standard_filters(false).build().filter_map(Result::ok).map(|e| e.into_path()).collect()
      }
invalid:
    - |
      fn walk(dir: &Path, out: &mut Vec<PathBuf>) -> std::io::Result<()> {
          for entry in std::fs::read_dir(dir)? {
              let path = entry?.path();
              if path.is_dir() {
                  walk(&path, out)?;
              } else {
                  out.push(path);
              }
          }
          Ok(())
      }
    - |
      fn walk(root: PathBuf) -> std::io::Result<Vec<PathBuf>> {
          let mut queue = vec![root];
          let mut files = Vec::new();
          while let Some(dir) = queue.pop() {
              for entry in fs::read_dir(&dir)? {
                  let path = entry?.path();
                  if path.is_dir() {
                      queue.push(path);
                  } else {
                      files.push(path);
                  }
              }
          }
          Ok(files)
      }
