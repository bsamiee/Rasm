# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-package-validation-error
language: csharp
severity: error
rule:
    pattern: $FORM
    any:
        - kind: generic_name
          regex: '^ValidationError(Attribute)?\s*<'
          inside: {kind: attribute, field: name}
        - kind: generic_name
          regex: '^IValidationError\s*<'
          inside: {kind: base_list}
        - kind: generic_name
          regex: '^IsType\s*<\s*ValidationError\s*>$'
          inside: {kind: member_access_expression, field: name}
        - kind: member_access_expression
          matches: {csharp-owner-member: {type: {regex: '^(Conversions|Lookup)$'}, member: {regex: '^Validated$'}}}
message: '`$FORM` routes validation through a package error in place of Thinktecture''s `ValidationError` and `Admission`'
note: Hooks assign `new ValidationError("<failed rule>")` or `Admission.Refusal(value, MinValue, MaxValue)`, conversions call `<type>.Validated(<raw>)` or `Admission.Validated<T, TKey>(<raw>)`, and consumers test `error.HasCode(ErrorCodes.ValidationFailed)`
