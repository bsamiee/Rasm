# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-variant-test-method
language: rust
severity: error
utils:
    self-value:
        regex: '^(\*|&)?\s*self$'
    variant-test:
        any:
            - kind: macro_invocation
              all:
                - matches: {rust-std-macro: {name: {regex: '^matches$'}}}
                - has: {kind: token_tree, regex: '^\(\s*\*?\s*self\s*,\s*\w+::\w+\s*(\(\s*(\.\.|_)\s*\)|\{\s*\.\.\s*\})?\s*,?\s*\)$'}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^==$'}
                - any:
                    - all: [{has: {field: left, matches: self-value}}, {has: {field: right, regex: '^&?\s*\w+::\w+$'}}]
                    - all: [{has: {field: right, matches: self-value}}, {has: {field: left, regex: '^&?\s*\w+::\w+$'}}]
    test-body:
        matches: {rust-single-statement: {first: {any: [{matches: variant-test}, {kind: expression_statement, has: {matches: variant-test}}]}}}
rule:
    kind: function_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: parameters, regex: '^\(\s*&?\s*self\s*\)$'}
        - has: {field: return_type, regex: '^bool$'}
        - has: {field: body, matches: test-body}
        - inside: {kind: declaration_list, inside: {kind: impl_item, all: [{not: {has: {field: trait, pattern: $_}}}, {has: {field: type, kind: type_identifier, pattern: $T}}]}}
        - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $T}}}
message: '`$NAME` tests one variant of `$T` by hand'
note: 'Delete the method, derive `derive_more::IsVariant` on its enum, and call `is_<variant>()` at each use'
