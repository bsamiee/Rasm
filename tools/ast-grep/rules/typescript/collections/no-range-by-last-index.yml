# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsx
severity: error
rule:
    kind: call_expression
    all:
        - pattern: '$RANGE(0, $N - 1)'
        - has: { field: function, matches: { effect-module-member: { module: { regex: '(?-u:\b)Array$' }, member: { regex: '^range$' } } } }
message: '`$RANGE(0, $N - 1)` returns `[0]` when `$N` is 0, call `globalThis.Array.from({ length: $N }, (_, index) => <value>)` for a sequence that can be empty'
