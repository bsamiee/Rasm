# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-socket-module
language: python
severity: error
# Report-only, the probed fix `create_connection` to `await anyio.connect_tcp` fails, `SocketStream has no attribute sendall`
rule:
    kind: call
    pattern: $CALL
    has:
        field: function
        any:
            - matches: {python-module-member: {module: {regex: '^socket$'}, name: {regex: '^(socket|create_connection|create_server)$'}}}
            - matches: {python-imported-name: {module: {regex: '^socket$'}, name: {regex: '^(socket|create_connection|create_server)$'}}}
message: '`$CALL` opens a socket outside anyio'
note: Connect through `anyio.connect_tcp(<host>, <port>)` or serve through `anyio.create_tcp_listener(local_port=<port>)`
