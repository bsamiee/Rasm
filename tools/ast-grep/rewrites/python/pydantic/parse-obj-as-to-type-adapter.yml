# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: parse-obj-as-to-type-adapter
language: python
severity: off
utils:
    adapter-import:
        inside:
            kind: module, function_definition
            stopBy: end
            has:
                stopBy: {kind: "function_definition, class_definition, lambda"}
                kind: import_from_statement
                all:
                    - has: {field: module_name, regex: "^pydantic$"}
                    - has:
                        any:
                            - kind: dotted_name
                              regex: "^TypeAdapter$"
                              pattern: $ADAPTER
                            - kind: aliased_import
                              all:
                                - has: {field: name, regex: "^TypeAdapter$"}
                                - has: {field: alias, pattern: $ADAPTER}
rule:
    kind: call
    pattern: $CALL
    any:
        - all:
            - any:
                - pattern: $MODULE.parse_obj_as(type_=$TYPE, obj=$VALUE)
                - pattern: $MODULE.parse_obj_as($TYPE, obj=$VALUE)
                - pattern: $MODULE.parse_obj_as($TYPE, $VALUE)
            - has:
                field: function
                matches:
                    python-module-member:
                        module: {regex: "^pydantic$"}
                        name: {pattern: $_}
        - all:
            - any:
                - pattern: $NAME(type_=$TYPE, obj=$VALUE)
                - pattern: $NAME($TYPE, obj=$VALUE)
                - pattern: $NAME($TYPE, $VALUE)
            - has: {field: function, kind: identifier, matches: {python-imported-name: {module: {regex: "^pydantic$"}, name: {regex: "^parse_obj_as$"}}}}
            - matches: adapter-import
    not: {has: {field: arguments, has: {kind: comment}}}
constraints:
    VALUE: {not: {kind: "keyword_argument, list_splat, dictionary_splat"}}
transform:
    HEAD: {replace: {source: $MODULE, replace: "(?s)^(.+)$", by: "$1.TypeAdapter"}}
    ADAPTER_NAME: {replace: {source: $ADAPTER, replace: "^(.+)$", by: "$1"}}
fix: "$HEAD$ADAPTER_NAME($TYPE).validate_python($VALUE)"
message: "`parse_obj_as` forwards to TypeAdapter validation"
note: The fix builds the adapter before the input evaluates and resolves forward references in the caller's namespace, reuse it where validation repeats
labels: {CALL: {style: primary, message: Validation call}}
