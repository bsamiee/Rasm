# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observable-object
language: swiftlang
severity: error
rule:
    pattern: $SITE
    any:
        - kind: inheritance_specifier
          regex: '^(Combine\.)?ObservableObject$'
        - kind: attribute
          regex: '^@(Combine\.)?Published$'
message: '`$SITE` publishes model changes through Combine `ObservableObject` in place of Observation'
note: 'Declare the model `@Observable final class <Model>` with plain stored properties, `@ObservationIgnored` on state no view reads, and read `$<property>` publishers through `Observations { <model>.<property> }`'
