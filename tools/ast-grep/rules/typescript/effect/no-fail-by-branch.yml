# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fail-by-branch
language: tsx
severity: error
utils:
    # An arm that fails the effect, as an arrow or as the constructor passed point-free
    fail-arm:
        any:
            - kind: arrow_function
              has: {field: body, any: [{pattern: Effect.fail($_)}, {pattern: Effect.failCause($_)}]}
            - pattern: Effect.fail
            - pattern: Effect.failCause
    # An arm that passes a value through, or nothing
    pass-arm:
        any:
            - kind: arrow_function
              has: {field: body, any: [{pattern: Effect.void}, {pattern: Effect.succeed($_)}]}
            - pattern: Effect.succeed
rule:
    any:
        - matches: effect-two-arm-branch
        # The effect's own effect-returning match, an arm that fails beside an arm that succeeds is Effect.mapError
        - pattern: Effect.matchEffect($$$)
    has:
        field: arguments
        has:
            kind: object
            all:
                - has: {kind: pair, has: {field: value, matches: fail-arm}}
                - has: {kind: pair, has: {field: value, matches: pass-arm}}
message: The branch fails in one arm and passes the value through in the other
note: >-
    Guard a boolean with `Effect.filterOrFail(effect, predicate, () => error)`, `Effect.succeed(value)` when the inspected
    value is a local, an Option, Either, or Exit is an Effect already, and `Effect.mapError(effect, () => error)` renames its failure
