# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-first-by-filter-slice
language: tsx
severity: error
rule:
    pattern: $FIRST
    any:
        - pattern: $L.$SCAN($P)[0]
        - pattern: $L.$SCAN($P).at(0)
constraints:
    SCAN: {regex: '^(filter|flatMap)$'}
rewriters:
    - id: find
      rule:
        any:
            - pattern: $L.filter($P)[0]
            - pattern: $L.filter($P).at(0)
      fix: $L.find($P)
transform:
    FOUND: rewrite($FIRST, rewriters=[find])
fix: $FOUND
message: '`$L.$SCAN` scans the whole list for its first match'
note: '`$L.find($P)` stops at the first match, `Array.findFirst` takes the `Option` mapper of a `flatMap`, `fromNullable` lifts the result into `Option` or an `undefined` test decides it'
