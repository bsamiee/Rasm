# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-record-rebuild-by-fields
language: python
severity: error
utils:
    struct-field:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has: {field: left, kind: identifier}
                - has: {field: type, kind: type, not: {regex: '^(typing\.)?ClassVar\b'}}
    struct-class:
        kind: class_definition
        all:
            - has: {field: name, pattern: $C}
            - any:
                - has: {field: superclasses, has: {regex: '^(msgspec\.)?Struct$'}}
                - inside: {kind: decorated_definition, has: {kind: decorator, regex: '^@((attrs?\.)?(frozen|define|mutable|s|attrs)|(dataclasses\.)?dataclass)\b'}}
            - has: {field: body, has: {matches: struct-field}}
    frozen-struct:
        matches: struct-class
        any:
            - has: {field: superclasses, has: {kind: keyword_argument, regex: '^frozen\s*=\s*True$'}}
            - inside: {kind: decorated_definition, has: {kind: decorator, regex: '^@(attrs?\.)?frozen\b|\bfrozen\s*=\s*True\b'}}
    first-field:
        matches: struct-field
        has: {kind: assignment, has: {field: left, pattern: $FIRST}}
        not: {follows: {stopBy: end, matches: struct-field}}
    next-field:
        matches: struct-field
        has: {kind: assignment, has: {field: left, pattern: $PREVIOUS}}
        precedes: {stopBy: {not: {kind: comment}}, matches: struct-field, has: {kind: assignment, has: {field: left, pattern: $NEXT}}}
    typed-record:
        matches: {python-typed-parameter: {type: {pattern: $C}}}
    built-record:
        matches: {python-assigned-name: {value: {kind: call, has: {field: function, pattern: $C}}}}
    record:
        kind: identifier
        pattern: $X
        any:
            - regex: '^self$'
              inside: {kind: class_definition, stopBy: end, has: {field: name, pattern: $C}}
            - matches: typed-record
            - matches: built-record
            - inside:
                kind: module, function_definition
                stopBy: end
                has:
                    stopBy: {kind: "function_definition, class_definition, lambda"}
                    kind: assignment
                    all:
                        - has: {field: left, pattern: $X}
                        - has: {field: type, pattern: $C}
    field-read:
        kind: attribute
        has: {field: object, matches: record}
    uncovered-field:
        all:
            - matches: struct-field
            - has: {kind: assignment, has: {field: left, pattern: $F}}
            - not:
                inside:
                    kind: module
                    stopBy: end
                    has:
                        stopBy: end
                        pattern: $CALL
                        has: {field: arguments, has: {any: [{pattern: $X.$F}, {kind: keyword_argument, has: {field: name, pattern: $F}}]}}
    complete:
        all:
            - not: {has: {kind: comment, stopBy: end}}
            - not: {has: {field: arguments, has: {pattern: $_, not: {any: [{kind: keyword_argument}, {pattern: $X.$_}]}}}}
            - any:
                - has: {field: arguments, has: {nthChild: 1, kind: keyword_argument}}
                - all:
                    - has: {field: arguments, has: {nthChild: 1, pattern: $X.$FIRST}}
                    - inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: struct-class, has: {field: body, has: {matches: first-field}}}}
            - not:
                has:
                    field: arguments
                    has:
                        all:
                            - pattern: $X.$PREVIOUS
                            - precedes: {stopBy: {pattern: $_}, pattern: $X.$NEXT}
                            - not: {inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: struct-class, has: {field: body, has: {matches: next-field}}}}}
            - not: {inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: struct-class, has: {field: body, has: {matches: uncovered-field}}}}}
    fields:
        any:
            - kind: call
              all:
                - has: {field: function, regex: '^((dataclasses|attrs?|msgspec\.structs)\.)?asdict$|^vars$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: record}}, {not: {has: {nthChild: 2}}}]}
            - kind: attribute
              all: [{has: {field: object, matches: record}}, {has: {field: attribute, regex: '^__dict__$'}}]
    merged:
        kind: argument_list
        all:
            - has:
                nthChild: 1
                kind: dictionary_splat
                has:
                    any:
                        - kind: dictionary
                          has: {nthChild: 1, kind: dictionary_splat, has: {matches: fields}}
                        - kind: binary_operator
                          all: [{has: {field: left, matches: fields}}, {has: {field: operator, regex: '^\|$'}}]
                        - kind: parenthesized_expression
                          has: {kind: binary_operator, all: [{has: {field: left, matches: fields}}, {has: {field: operator, regex: '^\|$'}}]}
            - not: {has: {nthChild: 2}}
    spread:
        kind: argument_list
        all:
            - has: {nthChild: 1, kind: dictionary_splat, has: {matches: fields}}
            - not: {has: {nthChild: 2, kind: 'list_splat, dictionary_splat'}}
            - not: {has: {pattern: $_, not: {any: [{kind: 'keyword_argument, comment'}, {kind: dictionary_splat, nthChild: 1}]}}}
    rebuilt:
        any:
            - all:
                - has: {field: arguments, kind: argument_list, has: {any: [{matches: field-read}, {kind: keyword_argument, has: {field: value, matches: field-read}}]}}
                - not: {has: {field: arguments, has: {kind: 'list_splat, dictionary_splat'}}}
                - matches: complete
            - has: {field: arguments, matches: spread}
    unchanged:
        not: {has: {field: arguments, has: {kind: keyword_argument, not: {all: [{has: {field: name, pattern: $K}}, {has: {field: value, pattern: $X.$K}}]}}}}
    replace-function:
        kind: import_from_statement
        all:
            - has: {field: module_name, regex: '^copy$'}
            - any:
                - has: {kind: dotted_name, regex: '^replace$', has: {kind: identifier, pattern: $REPLACE}}
                - has: {kind: aliased_import, all: [{has: {field: name, regex: '^replace$'}}, {has: {field: alias, pattern: $REPLACE}}]}
    replace-shadowed:
        inside:
            kind: module, function_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
            stopBy: end
            has:
                stopBy: {kind: 'function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
                matches: {python-binding: {name: {pattern: $REPLACE}}}
    copy-shadowed:
        inside:
            kind: module, function_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
            stopBy: end
            has:
                stopBy: {kind: 'function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
                matches: {python-binding: {name: {pattern: $COPY}}}
    copy-module:
        matches: {python-module-import: {module: {regex: '^copy$'}, binding: {pattern: $COPY}}}
rule:
    kind: call
    pattern: $CALL
    all:
        - has: {field: function, kind: identifier, pattern: $C}
        - inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: struct-class}}
        - any:
            - all:
                - matches: rebuilt
                - matches: unchanged
                - inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: frozen-struct}}
                - has: {field: arguments, has: {stopBy: end, kind: identifier, all: [{pattern: $X}, {pattern: $SAME}]}}
            - all:
                - matches: rebuilt
                - inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: replace-function}}
                - not: {matches: replace-shadowed}
                - has: {field: arguments, pattern: $CHANGED, has: {stopBy: end, kind: identifier, all: [{pattern: $X}, {pattern: $RECORD}]}}
            - all:
                - matches: rebuilt
                - inside: {kind: module, stopBy: end, has: {stopBy: {not: {kind: decorated_definition}}, matches: copy-module}}
                - not: {matches: copy-shadowed}
                - has: {field: arguments, pattern: $CHANGED, has: {stopBy: end, kind: identifier, all: [{pattern: $X}, {pattern: $RECORD}]}}
            - {any: [{matches: rebuilt}, {has: {field: arguments, matches: merged}}], pattern: $UNFIXED}
rewriters:
    - id: changed-keyword
      rule:
        kind: keyword_argument
        pattern: $KEYWORD
        not: {all: [{has: {field: name, pattern: $K}}, {has: {field: value, pattern: $X.$K}}]}
      fix: $KEYWORD
transform:
    KEPT: rewrite($CHANGED, rewriters=[changed-keyword], joinBy=', ')
    CHANGES: {replace: {source: $KEPT, replace: '(?s)^(.+)$', by: ', $1'}}
    MODULE_CALLEE: {replace: {source: $COPY, replace: '^(.+)$', by: '$1.replace'}}
    OPEN: {replace: {source: $RECORD, replace: '^(.+)$', by: '($1'}}
    CLOSE: {replace: {source: $RECORD, replace: '^.+$', by: ')'}}
fix: $SAME$REPLACE$MODULE_CALLEE$OPEN$CHANGES$CLOSE$UNFIXED
message: '`$C(...)` rebuilds `$X` by spelling or spreading its fields, `copy.replace(<record>, <field>=<value>)` or the record itself states the change alone'
note: '`copy.replace` copies each field it is not given'
