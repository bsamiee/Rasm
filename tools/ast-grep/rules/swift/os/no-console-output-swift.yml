# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
files: ['libs/swift/**']
rule:
    all: [{ pattern: $OUT }, { matches: swift-console-write }, { not: { matches: swift-log-handler-body } }]
message: '`$OUT` writes to a standard stream from a library'
note: 'Take a writer from the caller, as `ApplicationServer.serve(writing:)` does, and log diagnostics through `Logger`'
