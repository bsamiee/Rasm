# Report only, the HttpClient.get effect in place of fetch fails at the consumer with TS2339 Property 'json' does not exist on 'Effect'
id: no-fetch-outside-boundary
language: tsx
severity: error
ignores: [.claude/plugins/**, '**/*.config.ts', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
rule:
    all:
        - {kind: call_expression}
        - has:
            field: function
            any:
                - {matches: syntax-global-reference, regex: ^fetch$}
                - kind: member_expression
                  all:
                    - has: {field: object, matches: syntax-global-reference, regex: ^(globalThis|window|self)$}
                    - has: {field: property, regex: ^fetch$}
        - not:
            inside:
                stopBy: {matches: syntax-function-boundary}
                matches: effect-promise-boundary
message: The platform fetch runs outside the boundary and answers an untyped promise
note: Take `HttpClient` from the context for typed errors, retries, and spans, and run a platform fetch inside `Effect.tryPromise` at the boundary
