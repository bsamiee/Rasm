# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-imported-name
language: rust
arguments: [root, item]
utils:
    leaf-parent:
        any:
            - kind: use_list
            - {kind: use_declaration, has: {field: argument, pattern: $LEAF}}
    binding:
        any:
            - kind: use_as_clause
              all:
                - has: {field: alias, pattern: $NAME}
                - has: {field: path, any: [{kind: identifier, matches: item}, {kind: scoped_identifier, has: {field: name, matches: item}}]}
            - kind: identifier
              pattern: $LEAF
              all: [{pattern: $NAME}, {matches: item}, {inside: {matches: leaf-parent}}]
            - kind: scoped_identifier
              pattern: $LEAF
              all:
                - has: {field: name, pattern: $NAME, matches: item}
                - inside: {matches: leaf-parent}
            - kind: self
              inside:
                kind: use_list
                inside:
                    kind: scoped_use_list
                    has: {field: path, any: [{kind: identifier, pattern: $NAME, matches: item}, {kind: scoped_identifier, has: {field: name, pattern: $NAME, matches: item}}]}
    head:
        any:
            - {kind: identifier, matches: root}
            - has:
                stopBy: {not: {kind: 'scoped_identifier, scoped_use_list, use_as_clause'}}
                nthChild: 1
                kind: 'identifier, crate, self, super'
                matches: root
    import:
        kind: use_declaration
        all:
            - has: {field: argument, matches: head}
            - has: {field: argument, any: [{matches: binding}, {has: {stopBy: end, matches: binding}}]}
    shadowed:
        inside:
            stopBy: end
            any:
                - kind: function_item, closure_expression
                  has: {field: parameters, has: {any: [{pattern: $NAME}, {kind: parameter, has: {field: pattern, pattern: $NAME}}]}}
                - kind: block
                  has: {kind: let_declaration, has: {field: pattern, pattern: $NAME}}
rule:
    kind: identifier, type_identifier
    pattern: $NAME
    all:
        - not: {inside: {kind: 'scoped_identifier, scoped_type_identifier', field: name}}
        - not: {inside: {kind: use_declaration, stopBy: end}}
        - inside: {kind: 'source_file, declaration_list, block', stopBy: {kind: mod_item}, has: {matches: import}}
        - not: {matches: shadowed}
