# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-source-chain-successors
language: rust
severity: error
utils:
    source-step:
        any:
            - kind: closure_expression
              all:
                - has: {field: parameters, has: {any: [{kind: identifier, pattern: $X}, {kind: reference_pattern, has: {kind: identifier, pattern: $X}}]}}
                - has: {field: body, any: [{pattern: $X.source()}, {pattern: (*$X).source()}, {pattern: 'Error::source($X)'}, {pattern: 'Error::source(*$X)'}]}
            - kind: scoped_identifier
              regex: '^((::)?(std|core)::error::)?Error::source$'
rule:
    kind: call_expression
    all:
        - has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?successors$'}
        - has: {field: arguments, all: [{has: {nthChild: 1, pattern: Some($E)}}, {has: {nthChild: 2, matches: source-step}}, {not: {has: {nthChild: 3}}}]}
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
transform:
    RECEIVER: {replace: {source: $E, replace: '^([&*][\s\S]*|[\s\S]*\sas\s[\s\S]*)$', by: '($1)'}}
fix: $RECEIVER.sources()
message: '`iter::successors` walks the source chain of `$E` by hand'
note: 'Call `<error>.sources()` (`#![feature(error_iter)]`), `sources` yields the error and each `source()` in turn'
