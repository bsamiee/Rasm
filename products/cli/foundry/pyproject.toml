# --- [PROJECT] --------------------------------------------------------------------------

[project]
name              = "rasm-foundry"
version           = "0.1.0"
description       = "Command-line release of Persian and Arabic font faces: builds a declared set from its originals with rasm-typography, then checks, approves, and publishes it"
readme            = "README.md"
license           = "MIT"
license-files     = ["LICENSE"]
authors           = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers       = ["Environment :: Console", "Intended Audience :: Developers", "Operating System :: OS Independent", "Private :: Do Not Upload", "Topic :: Text Processing :: Fonts"]
requires-python   = ">=3.15"
import-names      = ["rasm.foundry"]
import-namespaces = ["rasm"]

dependencies = [
    # --- [CORE]

    "anyio>=4.16.0",             # Worker processes running each face of a set in parallel
    "expression>=6.0.1",         # Results and options of every module
    "msgspec>=0.22.0",           # Declaration, report, and stamp records with TOML and JSON codecs, `frozendict` fields from 0.22.0
    "packaging>=26.4",           # Requirement markers the installed dependency closure walks, each evaluated against its requester's whole extras set from 26.4
    "rasm-records",              # Fault results, record files, and atomic writes
    "rasm-typography",           # Face construction, compilation, shaping approvals, and requirement checks

    # --- [COMMANDS]

    "cyclopts>=5.5.1",           # App, commands, and variable source of the `foundry` script
    "rasm-cli",                  # Process settings, results as JSON lines, fault exit statuses, and each invocation inside the telemetry scope

    # --- [CHECKS]

    "fonttools>=4.68.0",         # UFO reader of an ornament face's mapped code points
    "opentype-sanitizer>=9.2.0", # OTS acceptance of a built binary
    "ufoLib2>=0.19.1",           # Width classes a declared face table names and the UFO source a family alignment rewrites
]

[project.scripts]
foundry = "rasm.foundry._cli:app.meta"

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/products/cli/foundry"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rasm.foundry"
module-root = ""
