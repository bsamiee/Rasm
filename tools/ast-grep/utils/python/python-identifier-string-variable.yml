# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-identifier-string-variable
language: python
utils:
    names:
        kind: 'tuple, list, set'
        has: {matches: python-identifier-string}
        not: {has: {pattern: $_, not: {any: [{matches: python-identifier-string}, {kind: comment}]}}}
    table:
        any:
            - matches: names
            - matches: {python-assigned-name: {value: {matches: names}}}
            - matches: {python-class-attribute: {value: {matches: names}}}
    parameter:
        any:
            - {kind: identifier, pattern: $PARAMETER}
            - {kind: typed_parameter, has: {kind: identifier, nthChild: 1, pattern: $PARAMETER}}
            - {kind: 'default_parameter, typed_default_parameter', has: {field: name, pattern: $PARAMETER}}
    callee:
        any: [{kind: identifier, pattern: $FUNCTION}, {kind: attribute, has: {field: attribute, pattern: $FUNCTION}}]
    method:
        inside:
            kind: block
            stopBy: {not: {kind: decorated_definition}}
            inside: {kind: class_definition, field: body}
    bound-parameter:
        kind: identifier
        pattern: $PARAMETER
        inside:
            kind: 'function_definition, lambda'
            stopBy: end
            all:
                - any:
                    - has: {field: name, pattern: $FUNCTION}
                    - inside: {kind: assignment, field: right, has: {field: left, pattern: $FUNCTION}}
                - any:
                    - has: {field: parameters, has: {kind: 'default_parameter, typed_default_parameter', all: [{has: {field: name, pattern: $PARAMETER}}, {has: {field: value, matches: python-identifier-string}}]}}
                    - all:
                        - has: {field: parameters, has: {matches: parameter}}
                        - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, matches: callee}}, {has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, pattern: $PARAMETER}}, {has: {field: value, matches: python-identifier-string}}]}}}]}}
                    - all:
                        - not: {matches: method}
                        - any:
                            - all:
                                - has: {field: parameters, has: {nthChild: 1, matches: parameter}}
                                - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: identifier, pattern: $FUNCTION}}, {has: {field: arguments, has: {nthChild: 1, matches: python-identifier-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 2, matches: parameter}}
                                - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: identifier, pattern: $FUNCTION}}, {has: {field: arguments, has: {nthChild: 2, matches: python-identifier-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 3, matches: parameter}}
                                - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: identifier, pattern: $FUNCTION}}, {has: {field: arguments, has: {nthChild: 3, matches: python-identifier-string}}}]}}
                    - all:
                        - matches: method
                        - any:
                            - all:
                                - has: {field: parameters, has: {nthChild: 2, matches: parameter}}
                                - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: attribute, has: {field: attribute, pattern: $FUNCTION}}}, {has: {field: arguments, has: {nthChild: 1, matches: python-identifier-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 3, matches: parameter}}
                                - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: attribute, has: {field: attribute, pattern: $FUNCTION}}}, {has: {field: arguments, has: {nthChild: 2, matches: python-identifier-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 4, matches: parameter}}
                                - inside: {kind: module, stopBy: end, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: attribute, has: {field: attribute, pattern: $FUNCTION}}}, {has: {field: arguments, has: {nthChild: 3, matches: python-identifier-string}}}]}}
rule:
    any:
        - matches: {python-assigned-name: {value: {matches: python-identifier-string}}}
        - matches: {python-class-attribute: {value: {matches: python-identifier-string}}}
        - matches: bound-parameter
        - kind: identifier
          pattern: $KEY
          any:
            - inside:
                kind: 'list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'
                stopBy: end
                has: {kind: for_in_clause, all: [{has: {field: left, kind: identifier, pattern: $KEY}}, {has: {field: right, matches: table}}]}
            - inside:
                kind: for_statement
                stopBy: end
                all: [{has: {field: left, kind: identifier, pattern: $KEY}}, {has: {field: right, matches: table}}]
