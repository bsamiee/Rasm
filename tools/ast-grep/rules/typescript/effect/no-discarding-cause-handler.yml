# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discarding-cause-handler
language: tsx
severity: error
utils:
    # The constant every carrier lifts, its void member or a succeed call
    lifted-constant:
        any:
            - matches: void-constant
            - kind: call_expression
              has: {field: function, regex: '^(Effect|Micro|STM|Stream|Layer|Channel|Sink)\.succeed$'}
    void-constant:
        kind: member_expression
        regex: '^(Effect|Micro|STM|Stream|Layer|Channel|Sink)\.void$'
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, pattern: $HANDLER}
        - any:
              # Cause and defect handlers on every carrier, and the failure handlers on the carriers without orElseSucceed
              - all:
                    - has:
                          field: function
                          regex: '^(Effect|Micro|Stream|Layer|Channel)\.(catchAllCause|catchAllDefect)$|^(Layer|Channel)\.catchAll$'
                    - has: {field: arguments, has: {matches: {effect-constant-handler: {answer: {matches: lifted-constant}}}}}
              # Void handler on a carrier with orElseSucceed, the success value stays beside the void and Effect.ignore drops it,
              # the sibling no-discarding-catch-all fixes the handler that lifts a value
              - all:
                    - has: {field: function, regex: '^(Effect|Micro|STM|Stream)\.catchAll$'}
                    - has: {field: arguments, has: {matches: {effect-constant-handler: {answer: {matches: void-constant}}}}}
message: The handler receives every failure, cause, or defect through `$HANDLER` and discards it
note: >-
    Recover a named failure by its tag with `Effect.catchTag` or `Effect.catchTags`, log a cause with `Effect.tapErrorCause` before an intentional
    discard, and state the discard as `Effect.ignore` or `Effect.ignoreLogged` where the success is void
