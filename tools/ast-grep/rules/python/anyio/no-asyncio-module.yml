# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-asyncio-module
language: python
severity: error
rule:
    pattern: $USE
    matches: {python-module-use: {module: {regex: '^asyncio(\.[\w.]+)?$'}}}
message: '`$USE` calls asyncio directly'
note: 'Use `anyio.run(<main>)`, `anyio.create_task_group()`, `anyio.sleep(<delay>)`, `anyio.Event`, `anyio.Lock`, and `anyio.Semaphore`'
