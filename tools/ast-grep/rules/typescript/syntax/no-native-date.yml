# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-date
language: tsx
severity: error
rule:
    kind: call_expression
    pattern: $DATE
    has: {field: function, regex: '^((globalThis|window|self)\.)?Date\.(parse|UTC)$', matches: typescript-global-reference}
message: '`$DATE` accepts invalid input with no failure case'
note: '`DateTime.make(input)` returns `Option.none()` for invalid input, native `Date.parse` and `Date.UTC` return `NaN` as a value'
