# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-undivided-declaration-python
language: python
severity: error
rule:
    kind: expression_statement, type_alias_statement, assert_statement, delete_statement, raise_statement, pass_statement, global_statement, if_statement, for_statement, while_statement, try_statement, with_statement, match_statement, function_definition, class_definition, decorated_definition
    inside: {kind: module}
    pattern: $STATEMENT
    not:
        any:
            - matches: python-preamble-statement
            - follows: {stopBy: end, matches: text-section-divider}
transform:
    HEAD: {replace: {source: $STATEMENT, replace: '(?s)\n.*$', by: ''}}
message: Statement `$HEAD` sits above every section divider
note: 'Place the statement under a `# --- [<SECTION>] ` divider dashed to column 90, the module docstring, imports, `TYPE_CHECKING` blocks, and conditional imports alone precede the first divider'
