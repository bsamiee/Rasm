id: typescript-import
language: tsxlang
role: item
symbolType: module
rule:
    kind: import_statement
    pattern: $DECLARATION
    any:
        - has: {field: source, pattern: $NAME}
        - has: {kind: import_require_clause, has: {field: source, pattern: $NAME}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: false

---
id: typescript-import-alias
language: tsxlang
role: item
symbolType: module
rule:
    kind: import_alias
    pattern: $DECLARATION
    has: {kind: identifier, nthChild: 1, pattern: $NAME}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: {inside: {kind: export_statement}}

---
id: typescript-export-from
language: tsxlang
role: item
symbolType: module
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {field: source, pattern: $NAME}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE

---
id: typescript-export-list
language: tsxlang
role: item
symbolType: module
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {kind: export_clause}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;?\s*$', by: ''}}
name: exports
signature: $SIGNATURE

---
id: typescript-export-namespace
language: tsxlang
role: item
symbolType: namespace
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {regex: '^namespace$', not: {pattern: $_}}
    all:
        - has: {kind: identifier, pattern: $NAME}
        - not: {has: {field: source, pattern: $_}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE

---
id: typescript-default-class
language: tsxlang
role: item
symbolType: class
utils:
    class-value:
        any:
            - kind: class
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: class-value}
    declaration-scope:
        any:
            - kind: program
            - kind: statement_block
              inside:
                any:
                    - kind: internal_module, module
                    - kind: ambient_declaration
                      has: {regex: '^global$', not: {pattern: $_}}
    class-owner:
        any:
            - kind: class_declaration, abstract_class_declaration
              inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
            - kind: class
              any:
                  - inside:
                        kind: variable_declarator
                        field: value
                        stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}
                        inside:
                            kind: lexical_declaration, variable_declaration, using_declaration
                            inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
                  - inside:
                        kind: export_statement
                        field: value
                        stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}
                        inside: {kind: program}
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {field: value, matches: class-value}
    all:
        - has: {regex: '^default$'}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {matches: class-owner}}
      fix: ''
    - id: nested
      rule: {kind: class_body}
      fix: '{…}'
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, nested]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: default
signature: $SIGNATURE

---
id: typescript-default-function
language: tsxlang
role: item
symbolType: function
utils:
    effect-root-binding:
        any:
            - kind: identifier, undefined, shorthand_property_identifier_pattern
              pattern: $OUTLINE_EFFECT_ROOT
            - kind: object_pattern, array_pattern, rest_pattern
              has: {matches: effect-root-binding}
            - kind: assignment_pattern, object_assignment_pattern
              has: {field: left, matches: effect-root-binding}
            - kind: pair_pattern
              has: {field: value, matches: effect-root-binding}
    effect-namespace-root:
        any:
            - kind: identifier
              pattern: $OUTLINE_EFFECT_ROOT
            - kind: nested_identifier, member_expression
              has: {field: object, matches: effect-namespace-root}
    effect-root-declaration:
        any:
            - kind: lexical_declaration, variable_declaration, using_declaration
              has: {kind: variable_declarator, has: {field: name, matches: effect-root-binding}}
            - kind: function_declaration, generator_function_declaration, class_declaration, abstract_class_declaration, enum_declaration
              has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
            - kind: internal_module, module
              has: {field: name, matches: effect-namespace-root}
            - kind: expression_statement
              has: {matches: effect-root-declaration}
            - kind: export_statement, ambient_declaration
              has: {matches: effect-root-declaration}
            - kind: import_alias
              has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_EFFECT_ROOT}
            - kind: import_statement
              has: {kind: import_require_clause, has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_EFFECT_ROOT}}
    effect-root:
        kind: identifier
        pattern: $OUTLINE_EFFECT_ROOT
        not:
            inside:
                kind: statement_block
                stopBy: end
                has: {matches: effect-root-declaration}
    effect-namespace-import:
        kind: import_clause
        has: {kind: namespace_import, has: {kind: identifier, pattern: $OUTLINE_EFFECT_ROOT}}
    effect-import:
        kind: import_statement
        all:
            - not: {has: {regex: '^type$', not: {kind: identifier}}}
            - any:
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                    - has:
                        kind: import_clause
                        has:
                            kind: named_imports
                            has:
                                kind: import_specifier
                                all:
                                    - has:
                                        field: name
                                        any:
                                            - regex: '^Effect$'
                                            - kind: string
                                              not: {has: {kind: escape_sequence}}
                                              has: {kind: string_fragment, regex: '^Effect$'}
                                    - any:
                                        - has: {field: alias, pattern: $OUTLINE_EFFECT_ROOT}
                                        - has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
                                          not: {has: {field: alias, pattern: $_}}
                                    - not: {has: {regex: '^type$', not: {kind: identifier}}}
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Effect$'}}
                    - has: {matches: effect-namespace-import}
    effect-module:
        any:
            - kind: identifier
              all:
                  - matches: effect-root
                  - inside: {kind: program, stopBy: end, has: {matches: effect-import}}
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^Effect$'}
                  - has: {field: object, matches: effect-root}
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                                - has: {matches: effect-namespace-import}
    effect-function:
        any:
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^fn(Untraced)?$'}
                  - has: {field: object, matches: effect-module}
            - kind: identifier
              all:
                  - matches: effect-root
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Effect$'}}
                                - has:
                                    kind: import_clause
                                    has:
                                        kind: named_imports
                                        has:
                                            kind: import_specifier
                                            all:
                                                - has:
                                                    field: name
                                                    any:
                                                        - regex: '^fn(Untraced)?$'
                                                        - kind: string
                                                          not: {has: {kind: escape_sequence}}
                                                          has: {kind: string_fragment, regex: '^fn(Untraced)?$'}
                                                - any:
                                                    - has: {field: alias, pattern: $OUTLINE_EFFECT_ROOT}
                                                    - has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
                                                      not: {has: {field: alias, pattern: $_}}
                                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
    function-value:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              has:
                field: function
                any:
                    - matches: effect-function
                    - kind: call_expression
                      has: {field: function, matches: effect-function}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: function-value}
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {field: value, matches: function-value}
    all:
        - has: {regex: '^default$'}
rewriters:
    - id: body
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body, inside: {kind: export_statement, field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}}}}
      fix: ''
    - id: nested
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: arrow
      rule: {kind: statement_block, inside: {kind: arrow_function, field: body}}
      fix: '{…}'
    - id: expression
      rule: {pattern: $_, not: {kind: statement_block}, inside: {kind: arrow_function, field: body}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, nested, arrow, expression]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: default
signature: $SIGNATURE

---
id: typescript-default-value
language: tsxlang
role: item
symbolType: constant
utils:
    function-or-class:
        any:
            - kind: arrow_function, function_expression, generator_function, class
            - kind: call_expression
              has:
                field: function
                any:
                    - matches: effect-function
                    - kind: call_expression
                      has: {field: function, matches: effect-function}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: function-or-class}
    effect-root-binding:
        any:
            - kind: identifier, undefined, shorthand_property_identifier_pattern
              pattern: $OUTLINE_EFFECT_ROOT
            - kind: object_pattern, array_pattern, rest_pattern
              has: {matches: effect-root-binding}
            - kind: assignment_pattern, object_assignment_pattern
              has: {field: left, matches: effect-root-binding}
            - kind: pair_pattern
              has: {field: value, matches: effect-root-binding}
    effect-namespace-root:
        any:
            - kind: identifier
              pattern: $OUTLINE_EFFECT_ROOT
            - kind: nested_identifier, member_expression
              has: {field: object, matches: effect-namespace-root}
    effect-root-declaration:
        any:
            - kind: lexical_declaration, variable_declaration, using_declaration
              has: {kind: variable_declarator, has: {field: name, matches: effect-root-binding}}
            - kind: function_declaration, generator_function_declaration, class_declaration, abstract_class_declaration, enum_declaration
              has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
            - kind: internal_module, module
              has: {field: name, matches: effect-namespace-root}
            - kind: expression_statement
              has: {matches: effect-root-declaration}
            - kind: export_statement, ambient_declaration
              has: {matches: effect-root-declaration}
            - kind: import_alias
              has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_EFFECT_ROOT}
            - kind: import_statement
              has: {kind: import_require_clause, has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_EFFECT_ROOT}}
    effect-root:
        kind: identifier
        pattern: $OUTLINE_EFFECT_ROOT
        not:
            inside:
                kind: statement_block
                stopBy: end
                has: {matches: effect-root-declaration}
    effect-namespace-import:
        kind: import_clause
        has: {kind: namespace_import, has: {kind: identifier, pattern: $OUTLINE_EFFECT_ROOT}}
    effect-import:
        kind: import_statement
        all:
            - not: {has: {regex: '^type$', not: {kind: identifier}}}
            - any:
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                    - has:
                        kind: import_clause
                        has:
                            kind: named_imports
                            has:
                                kind: import_specifier
                                all:
                                    - has:
                                        field: name
                                        any:
                                            - regex: '^Effect$'
                                            - kind: string
                                              not: {has: {kind: escape_sequence}}
                                              has: {kind: string_fragment, regex: '^Effect$'}
                                    - any:
                                        - has: {field: alias, pattern: $OUTLINE_EFFECT_ROOT}
                                        - has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
                                          not: {has: {field: alias, pattern: $_}}
                                    - not: {has: {regex: '^type$', not: {kind: identifier}}}
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Effect$'}}
                    - has: {matches: effect-namespace-import}
    effect-module:
        any:
            - kind: identifier
              all:
                  - matches: effect-root
                  - inside: {kind: program, stopBy: end, has: {matches: effect-import}}
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^Effect$'}
                  - has: {field: object, matches: effect-root}
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                                - has: {matches: effect-namespace-import}
    effect-function:
        any:
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^fn(Untraced)?$'}
                  - has: {field: object, matches: effect-module}
            - kind: identifier
              all:
                  - matches: effect-root
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Effect$'}}
                                - has:
                                    kind: import_clause
                                    has:
                                        kind: named_imports
                                        has:
                                            kind: import_specifier
                                            all:
                                                - has:
                                                    field: name
                                                    any:
                                                        - regex: '^fn(Untraced)?$'
                                                        - kind: string
                                                          not: {has: {kind: escape_sequence}}
                                                          has: {kind: string_fragment, regex: '^fn(Untraced)?$'}
                                                - any:
                                                    - has: {field: alias, pattern: $OUTLINE_EFFECT_ROOT}
                                                    - has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
                                                      not: {has: {field: alias, pattern: $_}}
                                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {regex: '^default$'}
    not:
        any:
            - has: {field: declaration, pattern: $_}
            - has: {field: value, matches: function-or-class}
rewriters:
    - id: object
      rule: {kind: object}
      fix: '{…}'
    - id: array
      rule: {kind: array}
      fix: '[…]'
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [object, array]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: default
signature: $SIGNATURE

---
id: typescript-export-assignment
language: tsxlang
role: item
symbolType: module
rule:
    kind: export_statement
    pattern: $DECLARATION
    has: {regex: '^=$'}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;?\s*$', by: ''}}
name: exports
signature: $SIGNATURE

---
id: typescript-module
language: tsxlang
role: item
symbolType: module
rule:
    kind: internal_module, module
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside:
        any:
            - kind: program
            - kind: statement_block
              inside:
                  any:
                      - kind: internal_module, module
                      - kind: ambient_declaration
                        has: {regex: '^global$', not: {pattern: $_}}
        stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}
rewriters:
    - id: body
      rule: {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration'}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - inside:
            kind: ambient_declaration
            stopBy: {not: {kind: 'object_pattern, array_pattern, rest_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, variable_declarator, lexical_declaration, variable_declaration, using_declaration, statement_block, internal_module, module, expression_statement'}}
        - inside:
            kind: export_statement, ambient_declaration
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, expression_statement'}}
        - inside:
            kind: program
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, expression_statement, export_statement, ambient_declaration'}}
            has:
                kind: export_statement
                not: {has: {field: source, pattern: $_}}
                any:
                    - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                    - has: {kind: identifier, pattern: $NAME}
                      any:
                          - has: {regex: '^default$'}
                          - has: {regex: '^=$'}

---
id: typescript-global
language: tsxlang
role: item
symbolType: namespace
rule:
    kind: ambient_declaration
    pattern: $DECLARATION
    has: {regex: '^global$', not: {pattern: $_}}
rewriters:
    - id: body
      rule: {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration'}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: global
signature: $SIGNATURE

---
id: typescript-class
language: tsxlang
role: item
symbolType: class
utils:
    declaration-scope:
        any:
            - kind: program
            - kind: statement_block
              inside:
                any:
                    - kind: internal_module, module
                    - kind: ambient_declaration
                      has: {regex: '^global$', not: {pattern: $_}}
    class-owner:
        any:
            - kind: class_declaration, abstract_class_declaration
              inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
            - kind: class
              any:
                  - inside:
                        kind: variable_declarator
                        field: value
                        stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}
                        inside:
                            kind: lexical_declaration, variable_declaration, using_declaration
                            inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
                  - inside:
                        kind: export_statement
                        field: value
                        stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}
                        inside: {kind: program}
rule:
    pattern: $DECLARATION
    any:
        - kind: export_statement
          has:
              field: declaration
              kind: class_declaration, abstract_class_declaration
              matches: class-owner
              has: {field: name, pattern: $NAME}
        - kind: class_declaration, abstract_class_declaration
          matches: class-owner
          has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {matches: class-owner}}
      fix: ''
    - id: nested
      rule: {kind: class_body}
      fix: '{…}'
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, nested]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - inside:
            kind: ambient_declaration
            stopBy: {not: {kind: 'object_pattern, array_pattern, rest_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, variable_declarator, lexical_declaration, variable_declaration, using_declaration, statement_block, internal_module, module, expression_statement'}}
        - kind: export_statement
        - inside:
            kind: export_statement, ambient_declaration
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration'}}
        - inside:
            kind: program
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, export_statement, ambient_declaration'}}
            has:
                kind: export_statement
                not: {has: {field: source, pattern: $_}}
                any:
                    - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                    - has: {kind: identifier, pattern: $NAME}
                      any:
                          - has: {regex: '^default$'}
                          - has: {regex: '^=$'}

---
id: typescript-function-declaration
language: tsxlang
role: item
symbolType: function
utils:
    declaration-scope:
        any:
            - kind: program
            - kind: statement_block
              inside:
                  any:
                      - kind: internal_module, module
                      - kind: ambient_declaration
                        has: {regex: '^global$', not: {pattern: $_}}
rule:
    kind: function_declaration, generator_function_declaration, function_signature
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside:
        any:
            - kind: program
            - kind: statement_block
              inside:
                  any:
                      - kind: internal_module, module
                      - kind: ambient_declaration
                        has: {regex: '^global$', not: {pattern: $_}}
        stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
rewriters:
    - id: body
      rule:
          kind: statement_block
          inside:
              kind: function_declaration, generator_function_declaration
              field: body
              inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
      fix: ''
    - id: nested-class
      rule: {kind: class_body}
      fix: '{…}'
    - id: nested-function
      rule: {kind: statement_block, inside: {kind: 'function_declaration, generator_function_declaration, function_expression, generator_function, arrow_function', field: body}}
      fix: '{…}'
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, nested-class, nested-function]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - inside:
            kind: ambient_declaration
            stopBy: {not: {kind: 'object_pattern, array_pattern, rest_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, variable_declarator, lexical_declaration, variable_declaration, using_declaration, statement_block, internal_module, module, expression_statement'}}
        - inside:
            kind: export_statement, ambient_declaration
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration'}}
        - inside:
            kind: program
