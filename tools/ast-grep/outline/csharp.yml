id: csharp-member-property
language: csharplang
role: member
symbolType: property
parentRuleIds: [csharp-class, csharp-struct, csharp-interface]
rule:
    kind: property_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: value
      rule: {pattern: $_, inside: {kind: property_declaration, field: value}}
      fix: {template: '', expandStart: {regex: '^=$', stopBy: end}}
    - id: body
      rule: {kind: block, inside: {kind: accessor_declaration, field: body}}
      fix: ';'
    - id: arrow
      rule: {kind: arrow_expression_clause, inside: {kind: accessor_declaration, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[value, body, arrow])
    SIGNATURE: {replace: {source: $HEADER, replace: '[;\s]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: modifier, regex: '^public$'}
        - inside: {kind: interface_declaration, stopBy: {kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration'}}
          not: {has: {kind: modifier, regex: '^(private|protected|internal)$'}}
---
id: csharp-member-field
language: csharplang
role: member
symbolType: field
parentRuleIds: [csharp-class, csharp-struct, csharp-interface]
rule:
    kind: field_declaration
    pattern: $DECLARATION
    has: {kind: variable_declaration, pattern: $VARIABLES}
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        has: {field: name, pattern: $NAME}
      fix: $NAME
    - id: initializer
      rule:
        pattern: $_
        inside:
            kind: variable_declarator
            inside:
                kind: variable_declaration
                inside:
                    kind: field_declaration
                    not: {has: {kind: modifier, regex: '^const$'}}
        follows: {regex: '^=$', stopBy: end}
      fix: {template: '', expandStart: {regex: '^=$', stopBy: end}}
transform:
    NAMES: {rewrite: {source: $VARIABLES, rewriters: [name], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[initializer])
    SIGNATURE: {replace: {source: $HEADER, replace: '[;\s]+$', by: ''}}
name: $NAMES
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: modifier, regex: '^public$'}
        - inside: {kind: interface_declaration, stopBy: {kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration'}}
          not: {has: {kind: modifier, regex: '^(private|protected|internal)$'}}
