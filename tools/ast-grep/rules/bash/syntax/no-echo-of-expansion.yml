# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-echo-of-expansion
language: bash
severity: error
ignores: ["**/*.json"]
utils:
    numeric-word:
        any:
            - kind: arithmetic_expansion
            - kind: simple_expansion
              regex: '^\$[?#$!]$'
            - matches: {bash-parameter: {name: {kind: variable_name, regex: '^(RANDOM|SRANDOM|SECONDS|UID|EUID|PPID|BASHPID|LINENO|SHLVL|OPTIND|HISTCMD|BASH_SUBSHELL|EPOCHSECONDS|EPOCHREALTIME)$'}}}
            - kind: expansion
              has:
                field: operator
                regex: '^#$'
                precedes: {kind: 'variable_name, subscript, special_variable_name'}
            - kind: string
              has: {matches: numeric-word}
              not: {has: {matches: bash-expanding-word, not: {matches: numeric-word}}}
rule:
    kind: command
    all:
        - has: {matches: {bash-invoked-name: {name: {regex: '^(\\|["''])?echo["'']?$'}, runner: {regex: '^(builtin|command|time)$'}}}}
        - has: {matches: bash-expanding-word, not: {matches: numeric-word}}
message: echo interprets expanded data as options or escape sequences
note: Print expanded data through printf with a literal format, `%s` for text and `%b` for escapes, with the separator chosen explicitly
