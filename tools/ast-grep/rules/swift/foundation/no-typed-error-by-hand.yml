# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-typed-error-by-hand
language: swift
severity: error
rule:
    kind: call_expression
    any:
        - pattern: 'NSError(domain: $DOMAIN, $$$)'
        - pattern: 'Foundation.NSError(domain: $DOMAIN, $$$)'
constraints:
    DOMAIN: {regex: '^("?)(NSCocoaErrorDomain|NSPOSIXErrorDomain|NSURLErrorDomain|NSMachErrorDomain)("?)$|^(CocoaError|POSIXError|URLError|MachError)\.errorDomain$'}
message: '`NSError` spells an error of domain `$DOMAIN` with an integer code'
note: 'Construct `CocoaError(.<code>)`, `POSIXError(.<code>)`, `URLError(.<code>)`, or `MachError(.<code>)`, with `userInfo:` for the entries the error holds'
