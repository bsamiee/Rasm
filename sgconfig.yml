# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/project.json
ruleDirs:
    - tools/ast-grep/rules
utilDirs:
    - tools/ast-grep/utils
languageGlobs:
    tsx: ["*.ts"]
    xml: ["NuGet.config"]
customLanguages:
    xml:
        libraryPath: .cache/ast-grep/xml.so
        extensions: [xml, csproj, props, targets, slnx]
        expandoChar: _
        outlineRules: tools/ast-grep/outline/msbuild.yml
    sql:
        libraryPath: .cache/ast-grep/sql.so
        languageSymbol: tree_sitter_sqlite3
        extensions: [sql]
        expandoChar: _
        outlineRules: tools/ast-grep/outline/sql.yml
    swiftlang:
        libraryPath: .cache/ast-grep/swift.so
        languageSymbol: tree_sitter_swift
        extensions: [swift]
        expandoChar: µ
        outlineRules: tools/ast-grep/outline/swift.yml
languageInjections:
    - hostLanguage: rust
      rule:
        kind: token_tree
        pattern: $CONTENT
        regex: '^[(\[]'
        any:
            - inside: {kind: macro_invocation}
            - follows: {regex: '^!$', follows: {kind: identifier}}
        not: {matches: test-scope}
      utils:
        test-attribute:
            kind: attribute_item
            any:
                - regex: '^#\[\s*cfg\s*\(.*\b(test|doctest)\b'
                  not: {regex: '^#\[\s*cfg\s*\(\s*not\s*\(\s*test\b'}
                - regex: '^#\[\s*(\w+::)*\w*(test|bench|quickcheck|proptest)\w*\s*(\(|\]|$)'
        test-scope:
            inside:
                stopBy: end
                kind: 'mod_item, function_item, impl_item, const_item, static_item'
                follows: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, kind: attribute_item, matches: test-attribute}
      injected: rust
    - hostLanguage: tsx
      rule:
        kind: string_fragment
        pattern: $CONTENT
        regex: '(?i)^\s*(?:(?:alter|analyze|attach|begin|commit|create|delete|detach|drop|end|explain|insert|pragma|reindex|release|replace|rollback|savepoint|select|update|vacuum|values)\b\s*\S|with\s+(?:recursive\b|\w+(?:\s*\([^)]*\))?\s+as\s*\())'
        not: {regex: '^\s*[A-Z][a-z]'}
        inside: {kind: 'string, template_string', not: {has: {kind: 'escape_sequence, template_substitution'}}}
      injected: sql
    - hostLanguage: yaml
      rule:
        kind: block_mapping_pair, flow_pair
        all:
            - has: {field: key, regex: '^(run|"run"|''run'')$'}
            - has:
                field: value
                any:
                    - {kind: flow_node, has: {kind: plain_scalar, pattern: $CONTENT, not: {regex: '[\r\n]'}}}
                    - {kind: block_node, has: {kind: block_scalar, pattern: $CONTENT, regex: '^\|'}}
      injected: bash
