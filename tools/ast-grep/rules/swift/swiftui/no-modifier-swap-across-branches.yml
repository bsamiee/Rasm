# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-modifier-swap-across-branches
language: swift
severity: error
rule:
    pattern: 'if $C { $V.$M($$$A) } else { $V.$M($$$B) }'
    not:
        pattern: 'if $C { $E } else { $E }'
    inside: {matches: swift-view-builder, stopBy: end}
message: '`$V.$M` with different arguments per branch of `if $C` rebuilds the view identity at every change of `$C`'
note: 'Keep one `$V` and pass the state through `.tint`, `.disabled`, `Toggle(...).toggleStyle(.button)`, or a ternary argument where both arguments share one type'
