# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-promise
language: tsx
severity: error
ignores: ['.claude/plugins/**', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts', '**/*.config.ts']
rule:
    not:
        any:
            - inside: {matches: effect-promise-boundary, stopBy: {matches: syntax-function-boundary}}
            - inside: {matches: nx-version-actions-method, stopBy: {matches: syntax-function-boundary}}
    any:
        - kind: new_expression
          has: {field: constructor, pattern: $NAME, regex: '^(globalThis\.)?Promise$', matches: syntax-global-reference}
        - kind: call_expression
          has: {field: function, pattern: $NAME, regex: '^(globalThis\.)?Promise\.(all|allSettled|any|race|resolve|reject|withResolvers|try)$', matches: syntax-global-reference}
message: '`$NAME` builds a promise where the effect is the composed value'
note: Compose effects and adapt the promise at the host boundary, keeping settlement order, rejection identity, concurrency, and cancellation
