# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-wrapped-mapping-result
language: csharp
severity: error
utils:
    option:
        has: {kind: identifier, nthChild: 1, regex: '^Option$'}
    wrapper-type:
        kind: generic_name
        has:
            kind: identifier
            nthChild: 1
            pattern: $WRAPPER
            regex: '^((Option|Fin|Either|Validation|Try|Reader|State|Writer|Identity)T?|IO|Eff|These|ChronicleT|RWST|Free|K)$'
        any:
            - inside:
                field: returns
                stopBy: end
                kind: method_declaration
                matches: csharp-mapping-method
              not:
                all:
                    - matches: option
                    - inside:
                        field: returns
                        stopBy: end
                        kind: method_declaration
                        not: {has: {kind: modifier, regex: '^partial$'}}
            - not: {matches: option}
              inside:
                kind: parameter
                stopBy: end
                inside:
                    kind: parameter_list
                    inside: {kind: method_declaration, matches: csharp-mapping-method}
    option-parameter:
        kind: identifier
        pattern: $HELD
        inside: {stopBy: end, kind: method_declaration, has: {field: parameters, has: {kind: parameter, all: [{has: {field: name, pattern: $HELD}}, {has: {field: type, matches: option}}]}}}
    unwrap-callee:
        kind: member_access_expression
        has: {field: name, regex: '^(Throw\w*|ValueUnsafe|Run(Unsafe)?(Async)?)$'}
        not:
            all:
                - has: {field: name, regex: '^ValueUnsafe$'}
                - has: {field: expression, matches: option-parameter}
    type-test-arm:
        kind: switch_expression_arm
        not: {has: {kind: when_clause}}
        has:
            nthChild: 1
            any:
                - kind: declaration_pattern, type_pattern
                - kind: constant_pattern
                  has: {kind: 'identifier, generic_name, null_literal'}
    type-switch-default:
        kind: throw_expression
        has: {kind: object_creation_expression, has: {field: type, regex: '^((global::)?System\.(Diagnostics\.)?)?UnreachableException$'}}
        inside:
            kind: switch_expression_arm
            has: {kind: discard, nthChild: 1}
            inside:
                kind: switch_expression
                not: {has: {kind: switch_expression_arm, not: {any: [{has: {kind: discard, nthChild: 1}}, {matches: type-test-arm}]}}}
    failure:
        kind: throw_expression, throw_statement
        not: {matches: type-switch-default}
    mapping-body:
        inside: {field: body, stopBy: end, kind: method_declaration, matches: csharp-mapping-method}
    unwrap:
        any:
            - kind: invocation_expression
              has:
                field: function
                matches: unwrap-callee
                has: {field: name, pattern: $WRAPPER}
            - matches: failure
              pattern: $WRAPPER
            - kind: cast_expression
              pattern: $WRAPPER
              has:
                field: value
                any:
                    - matches: option-parameter
                    - kind: invocation_expression
                      has: {field: function, regex: '(^|\.)From(<.+>)?$'}
            - pattern: $WRAPPER
              matches:
                csharp-file-method-call:
                    declaration:
                        not: {matches: csharp-mapping-method}
                        has:
                            stopBy: end
                            any:
                                - matches: failure
                                - kind: invocation_expression
                                  has: {field: function, matches: unwrap-callee}
rule:
    any:
        - matches: wrapper-type
        - kind: invocation_expression, throw_expression, throw_statement, cast_expression
          all:
            - matches: mapping-body
            - matches: unwrap
message: "Mapping method builds or unwraps a `$WRAPPER` result the boundary owns"
note: Declare mappings over success types, each call applies its mapping through `Map`, `Bind`, or a traversal
