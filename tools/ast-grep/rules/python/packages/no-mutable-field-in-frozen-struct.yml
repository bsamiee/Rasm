# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
utils:
    mutable-owner:
        any:
            - matches: {python-builtin-name: {name: {regex: '^(dict|list|set|bytearray)$'}}}
            - matches: {python-member-use: {module: {regex: '^collections$'}, name: {regex: '^(defaultdict|deque|OrderedDict|Counter|ChainMap)$'}}}
            - matches: {python-member-use: {module: {regex: '^(typing|collections\.abc)$'}, name: {regex: '^Mutable(Mapping|Sequence|Set)$'}}}
            - matches: {python-member-use: {module: {regex: '^typing$'}, name: {regex: '^(Dict|List|Set|DefaultDict|Deque|OrderedDict|Counter|ChainMap)$'}}}
    mutable-type:
        any:
            - matches: mutable-owner
            - kind: generic_type
              has: {nthChild: 1, matches: mutable-owner}
            - kind: subscript
              has: {field: value, matches: mutable-owner}
            - kind: parenthesized_expression
              has: {matches: mutable-type}
            - kind: binary_operator
              all:
                - has: {field: operator, regex: '^\|$'}
                - has: {matches: mutable-type}
rule:
    kind: assignment
    pattern: $FIELD
    all:
        - has: {field: type, has: {matches: mutable-type}}
        - not:
            all:
                - has: {field: type, regex: '^["'']?list\[(collections\.abc\.|typing\.)?Callable\['}
                - not: {has: {field: right, pattern: $_RIGHT}}
        - inside:
            kind: expression_statement
            inside:
                kind: block
                inside:
                    matches: {msgspec-struct-frozen-option: {value: {kind: 'true'}}}
message: '`$FIELD` holds a mutable container in a frozen struct'
note: 'Annotate `tuple`, `frozenset`, or `Mapping`, hold mutable state in a slotted class owning release'
