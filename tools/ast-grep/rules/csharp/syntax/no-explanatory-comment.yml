# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-explanatory-comment
language: csharp
severity: error
rule:
    kind: comment
    not:
        any:
            - matches: csharp-divider-comment
            - regex: '^///'
            - regex: '^(//|/\*)\s*(ast-grep-ignore|<auto-generated|lang\s*=|language\s*=)'
message: Comment states a fact outside a section divider, a family divider, or a tool directive
note: Delete the comment, a fact code cannot show goes into a name
