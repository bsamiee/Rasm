                        |mapBoth|mapError|match|orElse|tap|transposeMapOption)$
        - matches: {effect-module-member: {module: {regex: '\bRpcClient$'}, member: {regex: '^(withHeaders)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bSchedule$'}
