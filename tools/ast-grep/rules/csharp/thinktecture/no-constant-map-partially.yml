# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-constant-map-partially
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: invocation_expression
    pattern: $MAP
    all:
        - has: {field: function, any: [{kind: identifier, regex: '^MapPartially$'}, {kind: member_access_expression, has: {field: name, regex: '^MapPartially$'}}]}
        - has: {field: arguments, has: {kind: argument, has: {field: name, regex: '^@?default$'}}}
        - not: {has: {field: arguments, has: {kind: argument, has: {kind: 'lambda_expression, anonymous_method_expression'}}}}
message: '`$MAP` reads a per-case fact through `MapPartially` with a default'
note: 'Declare the fact as an abstract or `static virtual` member on union base that each case overrides'
