# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    conversion:
        regex: '^(String|Number|Boolean|BigInt|encodeURIComponent|decodeURIComponent)$'
    string-member:
        regex: '^(trim|toLowerCase|toUpperCase|capitalize|uncapitalize|snakeToCamel|camelToSnake)$'
    string-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)String$'}}}
    identity:
        any:
            - {kind: identifier, matches: {typescript-import-reference: {source: {regex: '^effect(/Function)?$'}, exported: {regex: '^identity$'}}}}
            - {kind: member_expression, matches: {effect-module-member: {module: {regex: '(?-u:\b)Function$'}, member: {regex: '^identity$'}}}}
    getter-transform:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)SchemaGetter$'}, member: {regex: '^transform$'}}}
    transformation-transform:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)SchemaTransformation$'}, member: {regex: '^transform$'}}}
    getter-position:
        any:
            - inside:
                kind: arguments
                inside: {kind: call_expression, has: {field: function, matches: getter-transform}}
            - inside:
                kind: pair
                field: value
                has: {field: key, regex: '^(decode|encode)$'}
                inside:
                    kind: object
                    inside:
                        kind: arguments
                        inside: {kind: call_expression, has: {field: function, matches: transformation-transform}}
rule:
    kind: identifier, member_expression, arrow_function
    pattern: $FN
    all:
        - any:
            - {kind: identifier, any: [{matches: conversion}, {pattern: identity}]}
            - {kind: member_expression, has: {field: property, any: [{matches: conversion}, {matches: string-member}, {regex: '^identity$'}]}}
            - kind: arrow_function
        - matches: getter-position
        - any:
            - {kind: identifier, pattern: $NAME, all: [{matches: conversion}, {matches: typescript-global-reference}]}
            - {kind: member_expression, pattern: globalThis.$NAME, has: {field: property, matches: conversion}}
            - kind: member_expression
              pattern: $MODULE.$NAME
              all: [{has: {field: object, matches: string-module}}, {has: {field: property, matches: string-member}}]
            - {matches: identity, pattern: $IDENTITY}
            - matches: {typescript-unary-function: {parameter: {pattern: $P}, result: {kind: identifier, all: [{pattern: $P}, {pattern: $IDENTITY}]}}}
            - matches:
                typescript-unary-function:
                    parameter: {pattern: $P}
                    result:
                        any:
                            - {kind: call_expression, pattern: $NAME($P), has: {field: function, kind: identifier, all: [{matches: conversion}, {matches: typescript-global-reference}]}}
                            - {kind: call_expression, pattern: globalThis.$NAME($P), has: {field: function, has: {field: property, matches: conversion}}}
                            - {kind: new_expression, pattern: new $NAME($P), has: {field: constructor, regex: '^Date$'}}
                            - {kind: call_expression, pattern: $P.$NAME(), has: {field: function, has: {field: property, regex: '^(toString|trim|toLowerCase|toUpperCase)$'}}}
                            - kind: call_expression
                              pattern: $MODULE.$NAME($P)
                              has: {field: function, all: [{has: {field: object, matches: string-module}}, {has: {field: property, matches: string-member}}]}
            - matches: {typescript-constant-function: {result: {matches: typescript-literal-expression, pattern: $CONSTANT}}}
              not: {matches: effect-union-member-encode}
transform:
    STRING: {replace: {source: $NAME, replace: '^toString$', by: String}}
    CONVERSION: {replace: {source: $STRING, replace: '^(en|de)codeURIComponent$', by: '${1}codeUriComponent'}}
    PASSTHROUGH: {replace: {source: $IDENTITY, replace: '(?s)^.*$', by: passthrough}}
    SUCCEED: {replace: {source: $CONSTANT, replace: '(?s)^.*$', by: succeed}}
message: '`$FN` restates `SchemaGetter.$CONVERSION$PASSTHROUGH$SUCCEED`'
note: 'Pass `SchemaGetter.<member>` in a `{ decode, encode }` pair in place of `SchemaTransformation.transform`, `succeed` fills an absent key'
