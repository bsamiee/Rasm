---
id: typescript-namespace-function
language: tsxlang
role: member
parentRuleIds: [typescript-namespace]
symbolType: function
utils:
    scope:
        kind: statement_block
        any:
            - inside:
                kind: internal_module, module
                field: body
                any:
                    - has: {field: name, pattern: $OWNER}
                      inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}
                    - pattern: $_
            - inside: {kind: ambient_declaration}
    effect-function:
        any:
            - kind: identifier
              regex: '^fn(?:Untraced)?$'
            - kind: member_expression
              has: {field: property, regex: '^fn(?:Untraced)?$'}
    callable:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              has:
                field: function
                any:
                    - matches: effect-function
                    - kind: call_expression
                      has: {field: function, matches: effect-function}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: 1, matches: callable}
    exposed:
        any:
            - inside: {kind: 'export_statement, ambient_declaration', stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration'}}}
            - inside: {kind: ambient_declaration, stopBy: end}
rule:
    pattern: $DECLARATION
    any:
        - kind: function_declaration, generator_function_declaration, function_signature
          inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
          has: {field: name, pattern: $NAME}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - has: {field: value, matches: callable}
            - inside:
                kind: lexical_declaration, variable_declaration, using_declaration
                any:
                    - has: {field: kind, pattern: $$KIND}
                    - has: {regex: '^var$', pattern: $$KIND}
                inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
rewriters:
    - id: body
      rule: {kind: statement_block, inside: {kind: 'function_declaration, generator_function_declaration', field: body}}
      fix: ''
    - id: block
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $ARROW_PARAMETERS}}, {has: {field: parameter, pattern: $ARROW_PARAMETERS}}]
            - any: [{has: {field: type_parameters, pattern: $ARROW_GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $ARROW_RETURN}}, {kind: arrow_function}]
            - any: [{has: {regex: '^async$', pattern: $$ARROW_ASYNC}}, {kind: arrow_function}]
      transform:
        ARROW_MODIFIER: {replace: {source: $ARROW_ASYNC, replace: '^(.+)$', by: '$1 '}}
      fix: $ARROW_MODIFIER$ARROW_GENERICS$ARROW_PARAMETERS$ARROW_RETURN => …
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    USING: {replace: {source: $KIND, replace: '^await$', by: 'await using'}}
    PREFIX: {replace: {source: $USING, replace: '^(.+)$', by: '$1 '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, block, object, arrow]}}
    TRIMMED: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
name: $QUALIFIER$NAME
signature: $PREFIX$TRIMMED
isPublic: {matches: exposed}
