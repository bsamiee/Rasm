# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-untyped-error
language: tsx
severity: error
utils:
    native-error:
        any:
            - kind: new_expression
              has: {field: constructor, matches: typescript-global-reference, regex: '^(globalThis\.)?(Error|TypeError|RangeError|SyntaxError|ReferenceError|EvalError|URIError|AggregateError)$'}
            - kind: as_expression, satisfies_expression, parenthesized_expression
              has: {matches: native-error}
    effect-channel:
        kind: member_expression
        has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Exit)$'}}}}
    untagged-error:
        any:
            - kind: string, number, true, false, null, undefined, regex
            - kind: unary_expression
              regex: '^[+-]'
              has: {field: argument, kind: number}
            - kind: template_string
            - kind: as_expression, satisfies_expression, parenthesized_expression
              has: {matches: untagged-error}
            - matches: native-error
            - kind: new_expression
              all:
                - has: {field: constructor, matches: {effect-module-member: {module: {regex: '\bCause$'}, member: {regex: '^UnknownError$'}}}}
                - has: {field: arguments, has: {nthChild: 1, kind: undefined}}
            - kind: call_expression
              has: {field: function, regex: '^(String|JSON\.stringify)$', matches: typescript-global-reference}
            - matches: text-object
            - any:
                - kind: new_expression
                  has: {field: 'constructor', not: {matches: typescript-package-reference}}
                - kind: call_expression
                  has: {field: function, not: {matches: typescript-package-reference}}
              has: {field: arguments, has: {matches: text-object}}
    text-object:
        kind: object
        has:
            kind: pair
            all:
                - has: {field: key, regex: '^(message|cause|detail|description|text)$'}
                - has: {field: value, kind: 'string, template_string'}
    untagged-thunk:
        kind: arrow_function, function_expression, method_definition
        has:
            field: body
            any:
                - matches: untagged-error
                  pattern: $ERROR
                - kind: statement_block
                  has:
                    kind: return_statement
                    has: {matches: untagged-error, pattern: $ERROR}
                    stopBy: {matches: typescript-function-boundary}
    strict-constructor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^fail$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Sink|Exit|Cause|Deferred|Request|Result)$'}}}}
    lazy-constructor:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^failSync$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Sink|Deferred)$'}}}}
            - all:
                - has: {field: property, regex: '^mapError$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Sink|Exit|Result)$'}}}}
            - all:
                - has: {field: property, regex: '^fromOption$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Result)$'}}}}
    filter-constructor:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^filterOrFail$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\bEffect$'}}}}
            - all:
                - has: {field: property, regex: '^(filterOrFail|liftPredicate)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\bResult$'}}}}
    options-callee:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^(try|tryPromise)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\bEffect$'}}}}
            - all:
                - has: {field: property, regex: '^try$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\bResult$'}}}}
            - all:
                - has: {field: property, regex: '^mapBoth$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Exit|Stream|Result)$'}}}}
    failure-member:
        any:
            - kind: pair
              all:
                - has: {field: key, regex: '^(catch|onFailure)$'}
                - has: {field: value, matches: untagged-thunk}
            - kind: method_definition
              has: {field: name, regex: '^(catch|onFailure)$'}
              matches: untagged-thunk
rule:
    kind: call_expression
    not: {all: [{has: {field: function, matches: effect-channel}}, {has: {stopBy: end, pattern: $ERROR, matches: native-error}}]}
    any:
        - all:
            - has: {field: function, pattern: $FAIL, matches: strict-constructor}
            - has: {field: arguments, has: {matches: untagged-error, pattern: $ERROR}}
        - all:
            - has: {field: function, pattern: $FAIL, matches: lazy-constructor}
            - has: {field: arguments, has: {matches: untagged-thunk}}
        - all:
            - has: {field: function, pattern: $FAIL, matches: filter-constructor}
            - has:
                field: arguments
                all:
                    - has: {matches: untagged-thunk, nthChild: {position: 1, reverse: true}}
                    - any:
                        - has: {nthChild: 3}
                        - has: {nthChild: 1, kind: 'arrow_function, function_expression'}
                        - has: {nthChild: {position: 1, reverse: true}, has: {field: body, kind: new_expression}}
        - all:
            - has: {field: function, pattern: $FAIL, matches: options-callee}
            - has: {field: arguments, has: {kind: object, has: {matches: failure-member}}}
message: '`$FAIL` fails with `$ERROR`, a value no `_tag` match reads'
note: 'Fail with a tagged error of typed fields holding the foreign value as `cause`, or keep the error `Effect.tryPromise` or `Effect.fromOption` types'
