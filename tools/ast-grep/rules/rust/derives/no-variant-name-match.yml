# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-variant-name-match
language: rust
severity: error
utils:
    constant-arm:
        kind: match_arm
        has: {field: value, kind: 'integer_literal, float_literal, boolean_literal, char_literal, scoped_identifier, call_expression, unary_expression', not: {has: {stopBy: end, kind: string_literal}}}
    self-table:
        kind: match_expression
        all:
            - has: {field: value, regex: '^\*?\s*self$'}
            - has: {field: body, not: {has: {kind: match_arm, not: {matches: constant-arm}}}}
    constant-table:
        kind: function_item
        has: {field: body, kind: block, has: {any: [{matches: self-table}, {kind: expression_statement, has: {matches: self-table}}]}}
rule:
    kind: match_expression
    all:
        - inside: {kind: function_item, stopBy: {kind: 'function_item, closure_expression'}, has: {field: name, pattern: $METHOD}}
        - inside: {kind: impl_item, stopBy: end, has: {field: type, pattern: $T}}
        - matches: rust-variant-name-match
        - not: {inside: {kind: impl_item, stopBy: end, has: {field: body, has: {matches: constant-table}}}}
message: '`$METHOD` of `$T` spells one string literal per variant'
note: 'Derive `strum::IntoStaticStr` with `#[strum(serialize = "<text>")]` or `derive_more::Display` with `#[display("<text>")]` per variant'
