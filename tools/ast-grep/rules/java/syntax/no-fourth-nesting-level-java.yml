# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-java
language: java
severity: error
utils:
    function:
        kind: method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, lambda_expression
    nested-function:
        any:
            - kind: lambda_expression
            - matches: function
              inside: {matches: function, stopBy: end}
    fourth-function:
        matches: nested-function
        inside:
            matches: nested-function
            stopBy: end
            inside:
                matches: nested-function
                stopBy: end
                inside: {matches: nested-function, stopBy: end}
    control:
        any:
            - kind: for_statement, enhanced_for_statement, while_statement, do_statement, switch_expression, try_statement, try_with_resources_statement, synchronized_statement
            - kind: if_statement
              not: {inside: {kind: if_statement, field: alternative}}
            - kind: ternary_expression
              not: {inside: {kind: ternary_expression, field: alternative, stopBy: {not: {kind: parenthesized_expression}}}}
    boundary: {any: [{matches: control}, {matches: function}]}
rule:
    pattern: $SCOPE
    any:
        - matches: fourth-function
          not: {inside: {matches: fourth-function, stopBy: end}}
        - matches: control
          inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                stopBy: {matches: boundary}
                inside:
                    matches: control
                    stopBy: {matches: boundary}
                    not: {inside: {matches: control, stopBy: {matches: function}}}
transform:
    LINE: {replace: {source: $SCOPE, replace: '\s*\n[\s\S]*$', by: ''}}
message: Lambda or control nesting reaches a fourth level at `$LINE`
note: Flatten the fourth level with a guard clause, one `switch` over combined cases, or an upstream stream operation (`filter`, `flatMap`, `findFirst`, `anyMatch`)
labels:
    SCOPE: {style: primary}
