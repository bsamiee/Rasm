# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-pydantic-validator
language: python
severity: error
# Report-only, the probed fix `validator` to `field_validator` fails, `TypeError: 'ValidationInfo' object is not subscriptable`
rule:
    any:
        - matches: {python-module-member: {module: {regex: '^pydantic$'}, name: {regex: "^(validator|root_validator|validate_arguments)$", pattern: $NAME}}}
        - matches: {python-module-member: {module: {regex: '^pydantic\.deprecated\.class_validators$'}, name: {regex: "^(validator|root_validator)$", pattern: $NAME}}}
        - matches: {python-module-member: {module: {regex: '^pydantic\.deprecated\.decorator$'}, name: {regex: "^validate_arguments$", pattern: $NAME}}}
message: "`$NAME` uses a deprecated Pydantic validator decorator"
note: Decorate with `field_validator(<field>, mode=<stage>)` or `model_validator(mode=<stage>)`, and validate arguments with `validate_call`
