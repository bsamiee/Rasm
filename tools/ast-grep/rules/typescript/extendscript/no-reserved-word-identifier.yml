# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-reserved-word-identifier
language: tsx
severity: error
files: ['apps/creative-cloud/illustrator-scripts/*.ts']
rule:
    kind: identifier
    regex: '^(abstract|boolean|byte|char|class|const|debugger|double|enum|export|extends|final|float|goto|implements|import|int|interface|long|native|package|private|protected|public|short|static|super|synchronized|throws|transient|volatile)$'
message: 'Illustrator source names an ES3 future reserved word as an identifier'
note: 'ExtendScript answers `Error 9: Illegal use of reserved word` on the built `.jsx`, the binding takes another name'
