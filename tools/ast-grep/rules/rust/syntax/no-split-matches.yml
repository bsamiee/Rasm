# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-split-matches
language: rust
severity: error
utils:
    call:
        kind: macro_invocation
        all:
            - has: {field: macro, regex: '^matches$'}
            - any:
                - pattern: matches!($X, $$$_)
                - pattern: matches!($X.$F, $$$_)
                - pattern: matches!(*$X, $$$_)
    negated-call:
        kind: unary_expression
        regex: '^!'
        has: {matches: call}
    chain:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\|\|?$'}
            - has: {field: right, matches: call}
            - has: {field: left, any: [{matches: call}, {matches: chain}]}
    negated-chain:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^&&?$'}
            - has: {field: right, matches: negated-call}
            - has: {field: left, any: [{matches: negated-call}, {matches: negated-chain}]}
rule:
    kind: binary_expression
    pattern: $CHAIN
    all:
        - any:
            - matches: chain
              not: {inside: {matches: chain}}
            - matches: negated-chain
              pattern: $NEGATED
              not: {inside: {matches: negated-chain}}
        - has: {field: right, pattern: $LAST}
        - not: {has: {stopBy: end, kind: macro_invocation, has: {kind: token_tree, has: {regex: '^if$'}}}}
        - not: {matches: rust-commented}
rewriters:
    - id: field-subject
      rule: {pattern: 'matches!($_X.$_F, $$$P)'}
      fix: $$$P
    - id: deref-subject
      rule: {pattern: 'matches!(*$_X, $$$P)'}
      fix: $$$P
    - id: plain-subject
      rule: {pattern: 'matches!($_X, $$$P)'}
      fix: $$$P
transform:
    OPEN: {replace: {source: $LAST, replace: '^(!?)\s*matches!\s*\(\s*([\s\S]*?)\s*,[\s\S]*$', by: '${1}matches!(${2}'}}
    PATTERNS: {rewrite: {source: $CHAIN, rewriters: [field-subject, deref-subject, plain-subject], joinBy: ' | '}}
fix: '$OPEN, $PATTERNS)'
message: 'Repeated `matches!` over one subject split one pattern test'
note: 'Join the patterns in one `matches!(<subject>, <a> | <b>)`, negated as `!matches!(<subject>, <a> | <b>)`, one test names every accepted shape and evaluates the subject once, a guarded arm (`<a> if <test>`) keeps its own test'
