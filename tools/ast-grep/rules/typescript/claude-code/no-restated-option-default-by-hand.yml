# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-restated-option-default-by-hand
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    any:
        # Typeof test over the option, the host validated the type against userConfig before the module loaded
        - kind: unary_expression
          all:
              - has: {field: operator, regex: '^typeof$'}
              - has: {field: argument, matches: claude-code-option-member, pattern: $OPTION}
        # Nullable check over the option, the manifest default fills the option before the module loads
        - matches: syntax-nullable-check
          has: {field: left, matches: claude-code-option-member, pattern: $OPTION}
        # Fallback call over the option and one literal, named as one, the manifest's default makes the fallback unreachable
        - kind: call_expression
          all:
              - has: {field: function, regex: '(?i)(option|default|fallback|orelse)'}
              - has:
                    field: arguments
                    all:
                        - has: {matches: claude-code-option-member, pattern: $OPTION}
                        - has: {matches: syntax-literal-value}
                        - not: {has: {nthChild: 3}}
        # Presence lifted into an Option, or the type coerced by a constructor, the manifest default and the host's type check settle both
        - kind: call_expression
          all:
              - has: {field: function, regex: '^(fromNullable|Boolean|String|Number)$'}
              - has: {field: arguments, has: {matches: claude-code-option-member, pattern: $OPTION}}
        # Double negation over the option, the boolean coerced by hand
        - pattern: '!!$OPTION'
          has: {field: argument, has: {field: argument, matches: claude-code-option-member}}
        # Presence of the option through in, a hasOwn call, or a hasOwnProperty method, the manifest fills every option before the module loads
        - pattern: $OPTION in $OBJECT
          has: {field: right, matches: claude-code-options-object}
        # The two-argument presence calls, the pattern pins the positions and the object re-matches the first argument
        - kind: call_expression
          all:
              - pattern: $_($OBJECT, $OPTION)
              - has: {field: function, regex: '^(Object\.hasOwn|Reflect\.has|Object\.prototype\.hasOwnProperty\.call)$'}
              - has: {field: arguments, has: {pattern: $OBJECT, matches: claude-code-options-object}}
        - kind: call_expression
          all:
              - pattern: $OBJECT.$_($OPTION)
              - has:
                    field: function
                    all:
                        - has: {field: object, matches: claude-code-options-object}
                        - has: {field: property, regex: '^(hasOwnProperty|propertyIsEnumerable)$'}
        # Destructuring default over the option, shorthand or under a renamed key, the pattern's right side is the manifest's default
        - kind: object_assignment_pattern
          all:
              - has: {field: left, pattern: $OPTION}
              - matches: options-destructuring
        - kind: pair_pattern
          all:
              - has: {field: key, pattern: $OPTION}
              - has: {field: value, kind: assignment_pattern}
              - matches: options-destructuring
utils:
    # Member of an object pattern that destructures the options object, a local or a parameter typed Options
    options-destructuring:
        inside:
            kind: object_pattern
            inside:
                any:
                    - kind: variable_declarator
                      has: {field: value, matches: claude-code-options-object}
                    - kind: required_parameter
                      has: {field: type, kind: type_annotation, has: {kind: type_identifier, regex: '^Options$'}}
message: '`$OPTION` is tested for its type or presence, coerced, defaulted in a pattern, or passed through a fallback, the manifest settles each'
note: Read the option as `options(raw)` narrowed it, `options.key`, and delete the type test, the nullable check, the default, or the fallback call
