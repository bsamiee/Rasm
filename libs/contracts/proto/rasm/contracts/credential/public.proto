syntax = "proto3";

package rasm.contracts.credential;

import "buf/validate/validate.proto";

// The item and count ceilings keep the ordered DER payload below the TLS certificate_list 2^24-byte bound.
message CertificateChain {
  repeated bytes certificates = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    items: {
      bytes: {
        min_len: 1
        max_len: 262143
      }
    }
  }];
}

// Public credential material only; a private-key arm is structurally absent.
message CredentialPublicWire {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  oneof material {
    option (buf.validate.oneof).required = true;

    CertificateChain certificate_chain = 2;
    bytes spki_der = 3 [(buf.validate.field).bytes = {
      min_len: 1
      max_len: 16777215
    }];
  }
}
