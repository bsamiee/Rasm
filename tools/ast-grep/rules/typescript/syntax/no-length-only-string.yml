# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-length-only-string
language: tsxlang
severity: error
utils:
    length-read:
        inside: {kind: member_expression, field: object, has: {field: property, regex: '^length$'}}
rule:
    kind: variable_declarator
    pattern: $DECLARATOR
    all:
        - has: {field: value, kind: 'string, template_string', not: {has: {kind: template_substitution}}}
        - has: {field: name, kind: identifier, pattern: $NAME}
        - inside: {matches: typescript-module-constant}
        - inside:
            kind: program
            stopBy: end
            all:
                - has: {stopBy: end, kind: identifier, pattern: $NAME, matches: length-read}
                - not: {has: {stopBy: end, kind: 'identifier, shorthand_property_identifier', pattern: $NAME, not: {any: [{inside: {kind: variable_declarator, field: name}}, {matches: length-read}]}}}
message: '`$NAME` is read only as `$NAME.length`'
note: 'Declare the count as a number named for the fact it states'
