# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-spawn-flags-overwrite
language: swiftlang
severity: error
rule:
    kind: call_expression
    pattern: $SITE
    all:
        - has: {nthChild: 1, regex: '^posix_spawnattr_setflags$'}
        - not: {has: {stopBy: end, regex: '^POSIX_SPAWN_(SETSID|SETPGROUP)$'}}
        - inside:
            stopBy: end
            kind: lambda_literal
            all:
                - inside: {stopBy: end, kind: assignment, has: {field: target, regex: '\.preSpawnProcessConfigurator$'}}
                - not: {has: {stopBy: end, kind: call_expression, has: {nthChild: 1, regex: '^posix_spawnattr_getflags$'}}}
message: '`$SITE` replaces the spawn flags swift-subprocess set before its configurator runs'
note: 'Read the current flags with `posix_spawnattr_getflags` and set them OR''d with the new flag, Subprocess sets `POSIX_SPAWN_CLOEXEC_DEFAULT` and its signal flags first, and a plain set lets the child inherit every open descriptor'
