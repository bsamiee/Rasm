# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: call_expression
    all:
        - has:
            field: arguments
            all:
                - has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: arrow_function, has: {field: parameters, not: {has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}}}}}
                - has: {nthChild: {position: 3, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: arrow_function, has: {field: parameters, not: {has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}}}}}
                - not: {has: {nthChild: {position: 4, ofRule: {not: {kind: 'comment, html_comment'}}}}}
        - has: {field: function, pattern: $ACQUIRE, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^acquireUseRelease$'}}}}
message: '`$ACQUIRE` holds no resource, its use and release read nothing the acquire returns'
note: 'Sequence `Effect.andThen(<acquire>, Effect.ensuring(<use>, <release>))`'
