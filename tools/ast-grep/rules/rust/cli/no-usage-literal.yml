# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $USAGE
    not: {matches: rust-macro-argument}
    any:
        - regex: '(^[br]*#*"|\\n|\n)\p{Pattern_White_Space}*(?i:usage)\p{Pattern_White_Space}*(:|\\n|\n)'
        - regex: '(^[br]*#*"|\\n|\n)\p{Pattern_White_Space}*-[A-Za-z0-9],\p{Pattern_White_Space}+--[a-z][\p{XID_Continue}-]*'
message: '`$USAGE` spells command-line help text by hand'
note: 'Derive `clap::Parser` on the command with `#[command(about = <text>)]` and `#[arg(help = <text>)]` per argument'
