# --- [LINKER] ---------------------------------------------------------------------------

# Kept on purpose, do not remove: wild (https://github.com/wild-linker/wild) replaces Apple ld once
# its Mach-O backend links this workspace. Through 0.11.0 it lacks thread-local storage (#2071),
# which Rust std uses on macOS, dylib output (#2161), which the Dylint cdylib needs, and debug info
# (#2068), which `profile.dev` line tables need. Target rustflags replace `build.rustflags`, so the
# row repeats them.
# [target.aarch64-apple-darwin]
# rustflags = ["-Zunstable-options", "--jobs-frontend=8", "-Clink-arg=--ld-path=wild"]

[target.'cfg(target_env = "musl")']
linker = "rust-lld" # Toolchain linker over CRT objects and musl bundled with Rust std, which no host C compiler holds

# --- [BUILD] ----------------------------------------------------------------------------

[build]
target-dir = ".artifacts/rust"
build-dir  = ".cache/rust"
rustflags  = ["-Zunstable-options", "--jobs-frontend=8"]

# --- [ENV] ------------------------------------------------------------------------------

[env]
AR_aarch64_unknown_linux_musl = "cargo-zigbuild zig ar"
AR_x86_64_unknown_linux_musl  = "cargo-zigbuild zig ar"
CC_aarch64_unknown_linux_musl = "cargo-zigbuild zig cc -- -fno-sanitize=all -target aarch64-linux-musl" # Subcommand drops Rust's triple, which cc-rs appends as `--target` and zig refuses, and Rust links hold no runtime for UBSan, which zig adds to unoptimized C
CC_x86_64_unknown_linux_musl  = "cargo-zigbuild zig cc -- -fno-sanitize=all -target x86_64-linux-musl"
CLIPPY_CONF_DIR               = { value = ".config", relative = true }
DYLINT_RUSTFLAGS              = "-Zflatten-format-args=no"

# --- [RESOLVER] -------------------------------------------------------------------------

[resolver]
feature-unification = "workspace"

# --- [UNSTABLE] -------------------------------------------------------------------------

[unstable]
feature-unification = true
git                 = "shallow-deps"
