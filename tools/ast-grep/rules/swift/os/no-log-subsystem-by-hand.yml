# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-log-subsystem-by-hand
language: swiftlang
severity: error
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, pattern: $TYPE, regex: '^(os\.)?(Logger|OSLog|OSSignposter)(\.init)?$'}
        - has:
            kind: call_suffix
            has:
                kind: value_arguments
                any:
                    - not: {has: {kind: value_argument}}
                    - has: {kind: value_argument, has: {field: name, regex: '^subsystem$'}}
message: '`$TYPE` spells a subsystem at the call site or logs under the empty default'
note: 'Construct `Logger(for: <Owner>.self)` from `CurrentProcess` in place of `OSLog`, and `OSSignposter(logger:)` over it'
