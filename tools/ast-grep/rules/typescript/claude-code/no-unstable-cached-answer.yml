# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unstable-cached-answer
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    # Hook with an answer the engine caches for the session and drops through $.ui.invalidate alone
    cached-hook:
        matches: {claude-code-hook: {event: {kind: string, regex: "^['\"](prompt\\.section|prompt\\.context|tool\\.describe)['\"]$"}}}
    # Read with an answer that changes between calls, a literal date and Date.parse or Date.UTC over literals stay stable
    unstable-read:
        any:
            # The host clock and random source, the shape no-ambient-read reports outside the plugin, the environment holds for the session
            - matches: syntax-ambient-read
            # $.clock.now, $.session.turnCount, and $.session.messages, the engine members with an answer that moves within a session
            - matches: {claude-code-engine-call: {noun: {pattern: $_}}}
              has: {field: function, has: {field: property, regex: '^(now|turnCount|messages)$'}}
            # $.agent.list grows with every spawn, $.tool.list changes at registration alone
            - matches: {claude-code-engine-call: {noun: {regex: '^agent$'}}}
              has: {field: function, has: {field: property, regex: '^list$'}}
rule:
    matches: unstable-read
    # Any depth, a closure inside the hook runs in the same answer
    inside: {stopBy: end, matches: cached-hook}
message: The cached answer reads a value that changes within the session and each change spends the prompt cache
note: Read the changing value in the event that changes it, and call `$.ui.invalidate('<event>')` from there
