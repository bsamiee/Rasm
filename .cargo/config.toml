# --- [BUILD] ----------------------------------------------------------------------------

[build]
target-dir  = ".artifacts/rust"
build-dir   = "{cargo-cache-home}/build/{workspace-path-hash}"
warnings    = "deny"
rustflags   = ["-Zunstable-options", "--jobs-frontend=4"]
fingerprint = "content"

# --- [RESOLVER] -------------------------------------------------------------------------

[resolver]
feature-unification = "workspace"

# --- [UNSTABLE] -------------------------------------------------------------------------

[unstable]
checksum-freshness  = true
feature-unification = true
fine-grain-locking  = true
git                 = "shallow-deps"
