id: no-suspended-generator
valid:
    - 'import { Effect } from "effect"; Effect.suspend(() => Effect.gen(function* named() { return named; }));'
    - 'import { Effect } from "effect"; Effect.suspend<number | string>(() => Effect.gen(function* () { return 1; }));'
    - 'import { Effect } from "effect"; Effect.suspend((): Effect.Effect<number | string> => Effect.gen(function* () { return 1; }));'
    - 'import { Effect } from "effect"; Effect.suspend(async () => Effect.gen(function* () { return yield* read(); }));'
    - 'import { Effect } from "effect"; Effect.suspend(() => /* keep */ Effect.gen(function* () { return yield* read(); }));'
    - 'import { Effect } from "effect"; Effect.suspend(() => Effect.gen(function* () { return yield* read(); }) /* after */);'
    - 'import { Effect } from "effect"; function f(Effect: Other) { return Effect.suspend(() => Effect.gen(function* () { return yield* read(); })); }'
    - 'import { Effect } from "effect"; const program = Effect.gen(function* () { return yield* read(); });'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => makeEffect());'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => { record(); return Effect.gen(function* () { return yield* read(); }); });'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(makeGenerator()));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(receiver(), function* () { return this.value; }));'
    - 'import { Effect } from "another"; const program = Effect.suspend(() => Effect.gen(function* () { return yield* read(); }));'
    - 'import { Either } from "effect"; const program = Either.suspend(() => Either.gen(function* () { return 1; }));'
    - 'import { Effect } from "effect"; const program = Effect.suspend((flag) => Effect.gen(function* () { return flag; }));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => { return Effect.gen(function* () { return 1; }); report(); });'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => makeEffect().pipe(Effect.map(render)));'
invalid:
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(function* () { const one = yield* read(); return yield* write(one); }));'
    - 'import { Effect as E } from "effect"; const program = E.suspend(() => E.gen(function* () { return yield* read(); }));'
    - 'import * as E from "effect/Effect"; const program = E.suspend(() => E.gen(function* () { return yield* read(); }));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(function* () { /* step */ return yield* read(); }));'
    - 'import { Micro } from "effect"; const program = Micro.suspend(() => Micro.gen(function* () { return yield* read(); }));'
    - 'import { STM } from "effect"; const program = STM.suspend(() => STM.gen(function* () { return yield* read(); }));'
    - 'import { STM as Effect } from "effect"; Effect.suspend(() => Effect.gen(function* () { return 1; }));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => { return Effect.gen(function* () { return yield* read(); }); });'
    - 'import { Effect } from "effect"; const program = Effect.suspend(function () { return Effect.gen(function* () { return yield* read(); }); });'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => (Effect.gen(function* () { return yield* read(); })));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(function* () { return yield* read(); }).pipe(Effect.map(render)));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => { return Effect.gen(function* () { return 1; }).pipe(Effect.orDie); });'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(function* () { return 1; }).pipe(Effect.map(render)).pipe(Effect.orDie));'
    - 'import { Effect } from "effect"; const program = Effect.suspend(() => Effect.gen(function* () { return 1; }).pipe(/* keep */ Effect.orDie));'
