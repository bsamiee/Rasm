id: sql-table
language: sql
role: item
symbolType: struct
isExported: false
rule:
    kind: create_table_statement, create_virtual_table_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule:
        any:
            - kind: column_definition, table_constraint, vtab_module_arg, select_clause, line_comment, block_comment, host_comment
            - {regex: '^[(),]$', inside: {kind: 'create_table_statement, create_virtual_table_statement'}}
            - {regex: '(?i)^as$', inside: {kind: create_table_statement}}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-table-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table]
rule:
    kind: column_definition
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment, host_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-table-constraint
language: sql
role: member
symbolType: key
parentRuleIds: [sql-table]
rule:
    kind: table_constraint
    pattern: $DECLARATION
    any:
        - has: {field: name, pattern: $NAME}
        - pattern: $UNNAMED
rewriters:
    - id: target
      rule:
        any:
            - kind: line_comment, block_comment, host_comment
            - {regex: '.', inside: {kind: table_constraint}, follows: {regex: '^\)$', stopBy: end}}
      fix: ' '
    - id: trivia
      rule: {kind: 'line_comment, block_comment, host_comment'}
      fix: ' '
transform:
    LABEL: {rewrite: {source: $UNNAMED, rewriters: [target]}}
    FOLDED: {replace: {source: $LABEL, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    KIND: {replace: {source: $FOLDED, replace: ' (\()| $', by: '$1'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $NAME$KIND
signature: $SIGNATURE
---
id: sql-table-argument
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table]
rule:
    kind: vtab_module_arg
    pattern: $ARGUMENT
transform:
    NAME: {replace: {source: $ARGUMENT, replace: '^[\t\n\f\r \x{FEFF}]+|[\t\n\f\r \x{FEFF}]+$', by: ''}}
name: $NAME
---
id: sql-view
language: sql
role: item
symbolType: interface
isExported: false
rule:
    kind: create_view_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule:
        any:
            - kind: line_comment, block_comment, host_comment
            - {kind: select_clause, inside: {kind: create_view_statement, field: body}}
            - {regex: '(?i)^as$', inside: {kind: create_view_statement}}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-view-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-view]
rule:
    any:
        - kind: identifier, quoted_identifier, string_literal, substitution
          pattern: $NAME
          inside: {kind: create_view_statement}
        - kind: expression_result_column
          any:
            - has: {field: alias, pattern: $NAME}
            - has: {field: expression, kind: column_reference, has: {field: name, pattern: $NAME}}
          inside:
            kind: result_column_list
            inside:
                kind: select_clause
                field: columns
                inside: {kind: create_view_statement, field: body, not: {has: {field: column, kind: 'identifier, quoted_identifier, string_literal, substitution'}}}
name: $NAME
signature: $NAME
---
id: sql-index
language: sql
role: item
symbolType: key
isExported: false
rule:
    kind: create_index_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment, host_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-trigger
language: sql
role: item
symbolType: event
isExported: false
rule:
    kind: create_trigger_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule:
        any:
            - kind: line_comment, block_comment, host_comment
            - {kind: 'select_statement, insert_statement, update_statement, delete_statement', inside: {kind: create_trigger_statement}}
            - {kind: substitution, inside: {kind: create_trigger_statement}, follows: {regex: '(?i)^begin$', stopBy: end}}
            - {regex: '(?i)^(begin|end|;)$', inside: {kind: create_trigger_statement}}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-trigger-statement
language: sql
role: member
symbolType: operator
parentRuleIds: [sql-trigger]
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement
    pattern: $DECLARATION
    inside: {kind: create_trigger_statement}
    any:
        - has: {field: target, pattern: $SUBJECT}
        - has: {field: from, has: {field: source, has: {kind: qualified_table_name, pattern: $SUBJECT}}}
        - has: {kind: select_clause, has: {field: from, has: {field: source, has: {kind: qualified_table_name, pattern: $SUBJECT}}}}
        - has: {field: columns, pattern: $SUBJECT}
        - has: {kind: select_clause, has: {field: columns, pattern: $SUBJECT}}
rewriters:
    - id: clause
      rule:
        any:
            - kind: where_clause, order_by_clause, limit_clause, returning_clause, upsert_clause, with_clause, window_clause, group_by_clause, values_clause, line_comment, block_comment, host_comment
            - kind: set_assignment
            - {kind: 'select_clause, values_clause, default_values_clause, substitution', inside: {kind: insert_statement, field: source}}
            - {regex: '(?i)^(set|,)$', inside: {kind: update_statement}}
      fix: ' '
transform:
    NAME: {replace: {source: $SUBJECT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [clause]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-statement
language: sql
role: item
symbolType: operator
isExported: false
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement, pragma_statement, alter_table_statement, drop_table_statement, drop_view_statement, drop_index_statement, drop_trigger_statement, analyze_statement, reindex_statement, vacuum_statement, attach_statement, detach_statement, savepoint_statement, release_statement
    pattern: $DECLARATION
    any:
        - has: {field: target, pattern: $SUBJECT}
        - has: {field: name, pattern: $SUBJECT}
        - has: {field: schema, pattern: $SUBJECT}
        - has: {field: from, has: {field: source, has: {kind: qualified_table_name, pattern: $SUBJECT}}}
        - has: {kind: select_clause, has: {field: from, has: {field: source, has: {kind: qualified_table_name, pattern: $SUBJECT}}}}
        - has: {field: columns, pattern: $SUBJECT}
        - has: {kind: select_clause, has: {field: columns, pattern: $SUBJECT}}
rewriters:
    - id: clause
      rule:
        any:
            - kind: where_clause, order_by_clause, limit_clause, returning_clause, upsert_clause, with_clause, window_clause, group_by_clause, values_clause, line_comment, block_comment, host_comment
            - kind: set_assignment
            - {kind: 'select_clause, values_clause, default_values_clause, substitution', inside: {kind: insert_statement, field: source}}
            - {regex: '(?i)^(set|,)$', inside: {kind: update_statement}}
      fix: ' '
transform:
    NAME: {replace: {source: $SUBJECT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [clause]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-member-query
language: sql
role: member
symbolType: variable
parentRuleIds: [sql-table, sql-view, sql-statement]
rule:
    any:
        - kind: cte_definition, named_window
          pattern: $DECLARATION
          has: {field: name, pattern: $NAME}
        - kind: table_or_subquery
          pattern: $DECLARATION
          all: [{has: {kind: select_clause}}, {has: {field: alias, pattern: $NAME}}]
rewriters:
    - id: body
      utils:
        query: {any: [{kind: select_clause, inside: {kind: table_or_subquery}}, {kind: 'select_clause, substitution', inside: {kind: cte_definition, field: body}}]}
      rule:
        any:
            - matches: query
            - kind: line_comment, block_comment, host_comment
            - {regex: '^\($', precedes: {matches: query}}
            - {regex: '^\)$', follows: {matches: query}}
            - {regex: '(?i)^as$', inside: {kind: table_or_subquery}}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
