# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    exited-zero:
        regex: '^(Subprocess\.)?TerminationStatus\.exited\(\p{White_Space}*0\p{White_Space}*\)$'
    plain-operand:
        kind: 'simple_identifier, navigation_expression, call_expression'
rule:
    pattern: $SITE
    any:
        - kind: equality_expression
          all:
            - has: {matches: exited-zero}
            - has: {matches: plain-operand, not: {matches: exited-zero}}
        - kind: infix_expression
          all:
            - has: {field: op, regex: '^!=$'}
            - has: {matches: exited-zero}
            - has: {matches: plain-operand, not: {matches: exited-zero}}
        - kind: 'if_statement, guard_statement'
          regex: '^(if|guard)\p{White_Space}+case\p{White_Space}+(Subprocess\.)?TerminationStatus\.exited\(\p{White_Space}*0\p{White_Space}*\)\p{White_Space}*='
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` tests a `TerminationStatus` for exit code 0 by pattern'
note: 'Read `<status>.isSuccess`, or compare `<optional>?.isSuccess` with `true`'
