rules:
    unpinned-uses:
        config:
            policies:
                # Tags Dependabot moves, ref-pin accepts any tag, branch, or SHA and refuses a docker:// image with no tag alone
                "*": ref-pin
    dependabot-cooldown:
        # Release-age delays are refused, the newest release is the target
        disable: true
    self-repository:
        # actionlint 1.7.12 rejects the `$/` form of a local uses reference
        disable: true
