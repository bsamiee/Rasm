# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-repeated-docstring
language: python
severity: error
utils:
    # Function with a docstring text that unifies with the reported one, at the node or under it, a class or a decorator holds one
    same-docstring:
        any:
            - kind: function_definition
              has: {field: body, has: {matches: python-docstring, has: {kind: string, pattern: $DOC}}}
            - has: {stopBy: end, kind: function_definition, has: {field: body, has: {matches: python-docstring, has: {kind: string, pattern: $DOC}}}}
rule:
    kind: function_definition
    all:
        - has: {field: body, has: {matches: python-docstring, has: {kind: string, pattern: $DOC}}}
        - any: # The earlier function sits among the earlier siblings of the def or of an ancestor, an earlier class holds a method
              - follows: {stopBy: end, matches: same-docstring}
              - inside: {stopBy: end, follows: {stopBy: end, matches: same-docstring}}
message: Docstring repeats the docstring of an earlier function in the module, one text for two behaviors
note: Write one comment before the group of functions that share the behavior, or one docstring per distinct behavior
