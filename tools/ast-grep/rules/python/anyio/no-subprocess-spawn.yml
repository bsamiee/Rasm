# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-subprocess-spawn
language: python
severity: error
rule:
    pattern: $USE
    any:
        - matches:
            python-module-member:
                module: {regex: "^subprocess$"}
                name: {regex: "^(Popen|run|call|check_call|check_output|getoutput|getstatusoutput)$"}
        - matches: {python-module-member: {module: {regex: "^os$"}, name: {regex: "^(system|popen|spawn[lv]p?e?|posix_spawnp?)$"}}}
message: "`$USE` starts a child process outside anyio"
note: Await `anyio.run_process(<args>)` for a finished process, or open `anyio.open_process(<args>)` under `async with` for a running one
