# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-cross-product-by-hand
language: rust
severity: error
rule:
    kind: 'binary_expression, call_expression'
    pattern: $SITE
    matches: rust-cross-product
message: '`$SITE` computes cross product components by hand'
note: 'Hold 2D vectors as `glam::DVec2` and call `a.perp_dot(b)`, or as `kurbo::Vec2` and call `a.cross(b)`. Hold 3D vectors as `glam::DVec3` or `nalgebra::Vector3<f64>` and call `a.cross(b)`. Polygon areas summing 2D terms are `geo::Area::unsigned_area` or `signed_area` of a `geo::Polygon`'
