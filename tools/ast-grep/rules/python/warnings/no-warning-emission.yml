# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-warning-emission
language: python
severity: error
rule:
    pattern: $USE
    any:
        - matches: {python-module-member: {module: {regex: '^warnings$'}, name: {regex: '^(warn|warn_explicit|deprecated)$'}}}
        - matches: {python-module-member: {module: {regex: '^typing_extensions$'}, name: {regex: '^deprecated$'}}}
message: '`$USE` emits a warning or declares a deprecated API, the form of a returned `Result` for an expected failure and a deletion for a replaced API'
