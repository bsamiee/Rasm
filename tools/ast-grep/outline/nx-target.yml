id: nx-target
language: json
role: item
symbolType: function
utils:
    document-object:
        kind: document > object
    targets-pair:
        kind: pair
        has: {field: key, regex: '^"(targets|targetDefaults)"$'}
        any:
            - inside: {matches: document-object}
            - inside: {kind: object, inside: {kind: pair, has: {field: key, regex: '^"nx"$'}, inside: {matches: document-object}}}
    target-pair:
        kind: pair
        inside: {kind: object, inside: {matches: targets-pair}}
    target-object:
        kind: object
        any:
            - inside: {matches: target-pair}
            - inside: {kind: array, inside: {matches: target-pair}}
rule:
    matches: target-pair
    pattern: $TARGET
    all:
        - has: {field: key, pattern: $KEY}
        - has: {field: value, kind: 'object, array'}
rewriters:
    - id: command
      rule:
        kind: pair
        all:
            - has: {field: key, regex: '^"(command|executor)"$'}
            - has: {field: value, pattern: $VALUE}
        inside: {matches: target-object}
      transform:
        TEXT: {replace: {source: $VALUE, replace: '^"([^"]*)"$', by: '$1'}}
      fix: $TEXT
    - id: depends
      rule:
        kind: pair
        all:
            - has: {field: key, regex: '^"dependsOn"$'}
            - has: {field: value, pattern: $VALUE}
        inside: {matches: target-object}
      transform:
        LIST: {replace: {source: $VALUE, replace: '\s*\n\s*', by: ' '}}
      fix: 'dependsOn $LIST'
transform:
    NAME: {replace: {source: $KEY, replace: '^"([^"]*)"$', by: '$1'}}
    SIGNATURE: {rewrite: {source: $TARGET, rewriters: [command, depends], joinBy: ', '}}
name: $NAME
signature: $SIGNATURE
isExported: true
