# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-enum-property-item-annotation
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
rule:
    pattern: $ITEM
    matches: {python-member-use: {module: {regex: '^bpy\.types$'}, name: {regex: '^EnumPropertyItem$'}}}
    inside:
        kind: type
        stopBy: end
        any:
            - inside: {kind: assignment, field: type}
            - inside: {kind: function_definition, field: return_type}
message: 'Declared `$ITEM` value outlives the `enum_items` iteration that frees dynamic enum items'
note: 'Hold `<item>.identifier`'
