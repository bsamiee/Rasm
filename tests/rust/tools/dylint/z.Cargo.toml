# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-lints-tests"
edition.workspace = true

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]

[lib]
path = "lib.rs"
test = false

# --- [EXAMPLE]

[[example]]
name = "assertions_outside_tests"
path = "tests/expansions/assertions_outside_tests.rs"

[[example]]
name       = "duplicate_trait_constant_exported"
crate-type = ["lib"]

[[example]]
name = "interior_mutable_static"
path = "tests/expansions/interior_mutable_static.rs"

[[example]]
name       = "macro_alias_exported"
crate-type = ["lib"]

[[example]]
name = "macro_matching"
path = "tests/expansions/macro_matching.rs"

[[example]]
name       = "manual_path_is_empty_no_std"
crate-type = ["lib"]

[[example]]
name       = "manual_reference_impl_exported"
crate-type = ["lib"]

[[example]]
name       = "manual_upcast_exported"
crate-type = ["lib"]

[[example]]
name       = "needless_reference_field_exported"
crate-type = ["lib"]

[[example]]
name       = "single_reader_exported"
crate-type = ["lib"]

[[example]]
name       = "untyped_error_exported"
crate-type = ["lib"]

# --- [TEST]

[[test]]
name = "expansions"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dev-dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
rayon                              = { workspace = true }
anyhow                             = { workspace = true }
nonempty-collections               = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
strum                              = { workspace = true }
indexmap                           = { workspace = true }
itertools                          = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
uuid                               = { workspace = true }
fs-err                             = { workspace = true, features = ["tokio"] }
rmcp                               = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
tracing                            = { workspace = true }
clap                               = { workspace = true }
nuts-rs                            = { workspace = true }
cargo_metadata                     = { workspace = true }
insta                              = { workspace = true, features = ["glob"] }
rasm-lints                         = { workspace = true }
rasm-lints-auxiliary               = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
