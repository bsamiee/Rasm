# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-fixed-sleep
language: python
severity: error
utils:
    # Argument list with a literal or a module-level name first, the wait no condition drives, nthChild counts named nodes
    fixed-delay:
        kind: argument_list
        has:
            nthChild: 1 # The delay is the first argument, and the value asyncio.sleep returns after it is no delay
            pattern: $DELAY # The capture a local util binds reaches the caller's message
            any:
                - kind: integer
                - kind: float
                # Name an assignment at the module root binds, a parameter or a local is computed where it is read
                - kind: identifier
                  inside:
                      kind: module
                      stopBy: end
                      has: {kind: expression_statement, has: {kind: assignment, has: {field: left, pattern: $DELAY}}}
            # Zero yields to the scheduler and stands for no wait
            not: {any: [{kind: integer, regex: '^0+$'}, {kind: float, regex: '^0*\.0*$'}]}
rule: # Both arms call utils/python/python-module-member.yml with each argument a rule
    pattern: $USE
    any:
        # Every use of time.sleep, the wait that blocks the thread whatever its argument
        - matches: {python-module-member: {module: {regex: '^time$'}, name: {regex: '^sleep$'}}}
        # The awaited sleep of anyio or asyncio over a fixed delay, the callee read through the module or its alias
        - kind: call
          all:
              - has: {field: function, matches: {python-module-member: {module: {regex: '^(anyio|asyncio)$'}, name: {regex: '^sleep$'}}}}
              - has: {field: arguments, matches: fixed-delay}
message: '`$USE` waits a fixed time in place of the condition it stands for'
note: >-
    Wait through the package primitive that names the condition, `await event.wait()`, `await process.wait()`, or a deadline
    under `anyio.fail_after(<seconds>)`, and a delay a value computes takes `await anyio.sleep(<delay>)`
