# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-serialized-suite-without-time-limit
language: swiftlang
severity: error
files: ['tests/swift/**']
rule:
    kind: attribute
    pattern: $SUITE
    all:
        - has: {kind: user_type, regex: '^Suite$'}
        - has: {kind: prefix_expression, has: {field: target, regex: '^serialized$'}}
        - not: {has: {kind: call_expression, regex: '^\.timeLimit\('}}
message: '`$SUITE` serializes its tests with no time limit, one hung test holds every later test'
note: 'Add `.timeLimit(.minutes(<n>))` beside `.serialized`, its cancellation tears down child processes and trait-scoped fixtures'
