# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unquoted-replacement
language: bashlang
severity: error
rule:
    kind: simple_expansion, expansion, command_substitution
    matches: bash-string-expansion
    any:
        - follows: {regex: '^/$'}
          inside: {kind: expansion}
        - inside:
            kind: concatenation
            follows: {regex: '^/$'}
            inside: {kind: expansion}
message: Unquoted replacement data treats `&` as matched text under `patsub_replacement`
note: Quote replacement data while preserving existing literal quoting
