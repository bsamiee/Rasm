# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-entity-escape-by-hand
language: rust
severity: error
rule:
    kind: 'call_expression, match_expression'
    pattern: $ESCAPE
    matches: rust-entity-escape
message: '`$ESCAPE` maps markup characters to entities by hand'
note: 'Call `quick_xml::escape::escape` (all five predefined entities), `partial_escape` (`&`, `<`, `>`), or `minimal_escape` (`&`, `<`) to write text, and `quick_xml::escape::unescape` to read text and numeric references'
