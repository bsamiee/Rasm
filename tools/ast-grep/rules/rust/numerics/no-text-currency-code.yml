# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-text-currency-code
language: rust
severity: error
utils:
    currency-name:
        regex: '(?i)(^|_)(currency(_(code|iso))?|ccy|iso_4217)$'
    text:
        any:
            - {kind: type_identifier, regex: '^(String|SmolStr|CompactString|ArrayString)$'}
            - {kind: reference_type, has: {field: type, kind: primitive_type, regex: '^str$'}}
            - {kind: array_type, has: {field: element, kind: primitive_type, regex: '^(u8|char)$'}}
            - kind: generic_type
              has: {field: type_arguments, has: {any: [{kind: primitive_type, regex: '^str$'}, {matches: text}]}}
    text-type:
        any: [{matches: text}, {kind: reference_type, has: {field: type, matches: text}}]
rule:
    pattern: $DECLARATION
    any:
        - kind: 'field_declaration, parameter, let_declaration, const_item, static_item'
          all:
            - any: [{has: {field: name, matches: currency-name}}, {has: {field: pattern, kind: identifier, matches: currency-name}}]
            - has: {field: type, matches: text-type}
            - not: {inside: {kind: parameters, inside: {matches: rust-trait-or-extern-function}}}
            - not: {matches: rust-text-decoder}
        - kind: identifier
          matches: currency-name
          inside:
            kind: function_item
            field: name
            all:
                - has: {field: return_type, matches: text-type}
                - not: {matches: rust-trait-or-extern-function}
message: '`$DECLARATION` holds an ISO 4217 currency code as text'
note: 'Type the code as `iso_currency::Currency`, validated at the boundary through `Currency::from_code`, `FromStr`, or its serde impls'
