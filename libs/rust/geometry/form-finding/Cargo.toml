# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-form-finding"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["form-finding", "force-density", "structures"]
categories           = ["mathematics", "science", "simulation"]
description          = "Form finding of tension and compression nets: force density, dynamic relaxation, and inverse form finding"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
faer                 = { workspace = true }
nalgebra             = { workspace = true }
petgraph             = { workspace = true }
rasm-stats           = { workspace = true }
rasm-optimization    = { workspace = true, features = ["nonlinear"], optional = true }

# --- [FEATURES] -------------------------------------------------------------------------

[features]
default = ["inverse"]
inverse = ["dep:rasm-optimization"]

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
