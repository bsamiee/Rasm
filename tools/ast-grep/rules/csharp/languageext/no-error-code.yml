# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-error-code
language: csharp
severity: error
utils:
    coded-base:
        matches: {csharp-type-name: {name: {regex: '^(Expected|Exceptional)$'}}}
    coded-arguments:
        kind: argument_list
        any:
            - inside:
                kind: primary_constructor_base_type
                has: {field: type, matches: coded-base}
                inside: {kind: base_list, inside: {matches: csharp-error-record}}
            - inside:
                kind: constructor_initializer
                has: {regex: '^base$'}
                inside: {kind: constructor_declaration, inside: {kind: declaration_list, inside: {matches: csharp-error-record}}}
            - inside:
                kind: object_creation_expression
                has: {field: type, matches: coded-base}
    code-argument:
        kind: argument
        inside: {matches: coded-arguments}
        any:
            - all:
                - nthChild: 2
                - not: {has: {field: name, pattern: $_}}
            - has: {field: name, regex: '^code$'}
        not: {has: {kind: integer_literal, regex: '^0$'}}
    numbered-code:
        kind: argument
        nthChild: 1
        not: {has: {field: name, pattern: $_}}
        has:
            any:
                - kind: integer_literal
                - kind: cast_expression
                  has: {field: type, regex: '^int$'}
        inside:
            kind: argument_list
            has: {kind: argument, nthChild: 2}
            inside: {kind: invocation_expression, has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Error$'}, member: {regex: '^New$'}}}}}
    code-cast:
        kind: cast_expression
        all:
            - has: {field: type, regex: '^int$'}
            - has: {field: value, kind: member_access_expression, has: {field: expression, pattern: $CODE}}
            - inside: {any: [{matches: code-argument}, {matches: numbered-code}]}
    code-reader:
        kind: member_access_expression
        has: {field: name, regex: '^Code$'}
rule:
    not: {inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: code-reader}}}
    any:
        - kind: argument
          pattern: $CODE
          any:
            - matches: code-argument
            - matches: numbered-code
        - kind: enum_declaration
          all:
            - has: {field: name, pattern: $CODE}
            - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: code-cast}}
message: '`$CODE` numbers an error, LanguageExt''s code-based `Is`, `Catch`, and `HasCode` then match every error sharing the number'
note: A file reading `.Code` keeps its numbers for that consumer (an exit code), elsewhere pass code `0` to `Expected`, call `Error.New(<message>)` for a failure with no type, keep `ErrorCodes.ValidationFailed` for a rejected input, and delete the code enum, consumers branch on a record's type
