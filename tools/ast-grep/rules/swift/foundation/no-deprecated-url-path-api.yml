# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-deprecated-url-path-api
language: swift
severity: error
utils:
    scope:
        kind: 'function_declaration, init_declaration, lambda_literal, computed_property, class_body'
    string-binding:
        kind: 'property_declaration, parameter'
        regex: '\bNSString\b'
        has: {stopBy: end, kind: simple_identifier, pattern: $BASE}
    components-binding:
        kind: 'property_declaration, parameter'
        regex: '\bURLComponents\b'
        has: {stopBy: end, kind: simple_identifier, pattern: $RECEIVER}
rule:
    pattern: $SITE
    any:
        - kind: call_expression
          any:
            - pattern: '$INIT(fileURLWithPath: $P)'
            - pattern: '$INIT(fileURLWithPath: $P, relativeTo: $B)'
            - pattern: '$INIT(fileURLWithPath: $Q, isDirectory: $D)'
            - pattern: '$INIT(fileURLWithPath: $Q, isDirectory: $D, relativeTo: $B)'
        - kind: call_expression
          any:
            - pattern: '$BASE.appendingPathComponent($P)'
            - pattern: '$BASE.appendingPathComponent($Q, isDirectory: $D)'
          not: {inside: {stopBy: end, matches: scope, has: {stopBy: end, matches: string-binding}}}
        - kind: call_expression
          any:
            - pattern: '$TARGET.appendPathComponent($P)'
            - pattern: '$TARGET.appendPathComponent($Q, isDirectory: $D)'
        - kind: navigation_expression
          pattern: $READ
          all:
            - has: {field: suffix, has: {field: suffix, regex: '^(host|user|password|query|fragment)$'}}
            - has: {field: target, pattern: $RECEIVER, not: {any: [{kind: key_path_expression}, {kind: simple_identifier, regex: '^[A-Z]'}, {regex: '(?i)components$'}]}}
            - not: {inside: {kind: call_expression}}
            - not: {inside: {stopBy: end, matches: scope, has: {stopBy: end, matches: components-binding}}}
constraints:
    INIT: {regex: '^((Foundation\.)?URL(\.init)?|\.init)$'}
    BASE: {not: {regex: '\bNSString\b'}}
transform:
    OPEN_INIT: {replace: {source: $INIT, replace: '^(.+)$', by: '$1(filePath: '}}
    OPEN_APPENDING: {replace: {source: $BASE, replace: '(?s)^(.*)$', by: '$1.appending(path: '}}
    OPEN_APPEND: {replace: {source: $TARGET, replace: '(?s)^(.*)$', by: '$1.append(path: '}}
    INFERRED: {replace: {source: $P, replace: '(?s)^(.+)$', by: '$1, directoryHint: .checkFileSystem'}}
    GROUPED: {replace: {source: $D, replace: '(?s)^(.* \? .* : .*)$', by: '($1)'}}
    TERNARY: {replace: {source: $GROUPED, replace: '(?s)^(.+)$', by: ', directoryHint: $1 ? .isDirectory : .notDirectory'}}
    DIRECTORY: {replace: {source: $TERNARY, replace: '^, directoryHint: true \? \.isDirectory : \.notDirectory$', by: ', directoryHint: .isDirectory'}}
    HINT: {replace: {source: $DIRECTORY, replace: '^, directoryHint: false \? \.isDirectory : \.notDirectory$', by: ', directoryHint: .notDirectory'}}
    RELATIVE: {replace: {source: $B, replace: '(?s)^(.+)$', by: ', relativeTo: $1'}}
    CLOSE_INFERRED: {replace: {source: $P, replace: '(?s)^.+$', by: ')'}}
    CLOSE_HINTED: {replace: {source: $Q, replace: '(?s)^.+$', by: ')'}}
    DECODED: {replace: {source: $READ, replace: '(?s)^(.*)\.(host|user)$', by: '$1.$2(percentEncoded: false)'}}
    READ_FIX: {replace: {source: $DECODED, replace: '(?s)^(.*)\.(password|query|fragment)$', by: '$1.$2()'}}
fix: '$OPEN_INIT$OPEN_APPENDING$OPEN_APPEND$INFERRED$Q$HINT$RELATIVE$CLOSE_INFERRED$CLOSE_HINTED$READ_FIX'
message: '`$SITE` reads or builds a URL through a member the SDK deprecates for its `filePath:`, `path:`, or `percentEncoded:` form'
note: 'Call `URL(filePath:)`, `appending(path:)`, or `append(path:)` with `directoryHint:` (`.checkFileSystem` without `isDirectory:`, `.isDirectory` for `true`, `.notDirectory` for `false`, a ternary for a `Bool` expression), and read `host(percentEncoded: false)`, `user(percentEncoded: false)`, `password()`, `query()`, or `fragment()`, each equal to its property'
