# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-conditional-removal
language: rust
severity: error
rule:
    kind: if_expression
    all:
        - pattern: 'if $R.$PEEK().is_some_and($P) { $R.$TAKE() } else { None }'
        - any:
            - pattern: 'if $_R.as_ref().is_some_and($_P) { $_R.take() } else { None }'
            - pattern: 'if $_R.last().is_some_and($_P) { $_R.pop() } else { None }'
            - pattern: 'if $_R.back().is_some_and($_P) { $_R.pop_back() } else { None }'
            - pattern: 'if $_R.front().is_some_and($_P) { $_R.pop_front() } else { None }'
transform:
    METHOD: {replace: {source: $TAKE, replace: '^([\s\S]+)$', by: '${1}_if'}}
fix: $R.$METHOD($P)
message: '`$R.$TAKE()` runs under a test of the same element through `$PEEK`'
note: 'Call `<option>.take_if(<predicate>)`, `<vec>.pop_if(<predicate>)`, `<deque>.pop_back_if`, or `pop_front_if`, each passes the element to the predicate as `&mut T`'
