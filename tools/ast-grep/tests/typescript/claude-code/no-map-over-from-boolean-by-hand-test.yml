id: no-map-over-from-boolean-by-hand
valid:
    # The lift with its type
    - 'const rest = toArray(liftPredicate<Leaf>(() => guarded.includes(basename(word.text)))(leaf.slice(index)));'
    # Thunk over a template string, the sibling no-map-over-from-boolean fixes it
    - 'const lines = toArray(map(() => `${openCount} open findings`)(fromBoolean(openCount > 0)));'
    # Thunk over a cast, the sibling fixes it
    - 'const rest = toArray(map(() => leaf.slice(index) as Leaf)(fromBoolean(guarded.includes(basename(word.text)))));'
    # The definition of liftPredicate in option.ts
    - |
      const liftPredicate =
          <A>(predicate: (value: A) => boolean): ((value: A) => Option<A>) =>
          (value: A): Option<A> =>
              map(() => value)(fromBoolean(predicate(value)));
    # The definition as a function declaration
    - |
      function liftPredicate(predicate, value) {
          return map(() => value)(fromBoolean(predicate(value)));
      }
    # Map over an Option other than the boolean one
    - 'const names = map((row: Row) => row.name)(fromNullable(row));'
    # Map with a parameter reads the boolean
    - 'const lines = toArray(map((held) => String(held))(fromBoolean(openCount > 0)));'
    # Thunk over a signed number, the sibling fixes it
    - 'const step = toArray(map(() => -1)(fromBoolean(descending)));'
    # Thunk over a string cast to a type, the sibling fixes it
    - 'const line = toArray(map(() => text as string)(fromBoolean(held)));'
    # Thunk with a return type over a call, the return type names the type and the sibling fixes it
    - 'const rest = toArray(map((): Leaf => leaf.slice(index))(fromBoolean(held)));'
    # Thunk over a double cast, no-double-assertion reports it
    - 'const rest = toArray(map(() => leaf as unknown as Leaf)(fromBoolean(held)));'
invalid:
    # Thunk over an as const cast, const is no type argument and the site declares the literal type
    - 'const modes = toArray(map(() => true as const)(fromBoolean(refresh)));'
    # The instance, a thunk over a call
    - 'const rest = toArray(map(() => leaf.slice(index))(fromBoolean(guarded.includes(basename(word.text)))));'
    # Thunk over a local call
    - "const sentinel = toArray(map(() => _sentinel(head))(fromBoolean(argv.slice(1).some((word) => word.text === '-s'))));"
    # Thunk over a member read
    - 'const reason = toArray(map(() => _REQUIREMENT[family.requires].reason)(fromBoolean(!holds)));'
    # Thunk over a slice under a compound condition
    - "const rest = toArray(map(() => words.slice(index + 1))(fromBoolean((index === 0 || words[index - 1] === '--') && basename(word) === 'git')));"
    # Named thunk passed point-free
    - 'const lines = toArray(map(line)(fromBoolean(openCount > 0)));'
    # Two-call form inside a function declaration nested in liftPredicate, the declaration stops the walk as a binding does
    - |
      const liftPredicate = (predicate) => {
          function inner(value) {
              return map(() => value)(fromBoolean(predicate(value)));
          }
          return inner;
      };
    # Two-call form inside a binding nested in liftPredicate, the walk stops at the nearest binding
    - |
      const liftPredicate = (predicate) => {
          const inner = (value) => map(() => value)(fromBoolean(predicate(value)));
          return inner;
      };
    # Member passed point-free as the thunk
    - 'const lines = toArray(map(rows.line)(fromBoolean(openCount > 0)));'
    # Thunk over a boolean literal, no type the syntax names as a type argument
    - 'const held = toArray(map(() => true)(fromBoolean(refresh)));'
    # Two-call form in an expression statement, no binding stops the walk
    - 'run(map(() => leaf.slice(index))(fromBoolean(held)));'
    # Thunk with a block body
    - 'const rest = toArray(map(() => { return leaf.slice(index); })(fromBoolean(held)));'
    # Thunk over a satisfies expression, satisfies is no cast
    - 'const rest = toArray(map(() => leaf satisfies Leaf)(fromBoolean(held)));'
    # Thunk over a non-null assertion, no type the syntax names
    - 'const rest = toArray(map(() => found!)(fromBoolean(held)));'
    # Thunk passed through a call, the value sits in the callee
    - 'const lines = toArray(map(line(count))(fromBoolean(openCount > 0)));'
