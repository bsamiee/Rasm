# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-strict-mode
language: bash
severity: error
ignores: ["**/*.json"]
files: ['**/*.sh']
utils:
    option-setup:
        kind: command
        regex: '^set(?:\s+(?:["'']?-[abefhkmnptuvxBCEHPT]+["'']?|["'']?-[abefhkmnoptuvxBCEHPT]*o[abefhkmnoptuvxBCEHPT]*["'']?\s+["'']?[a-z][a-z-]*["'']?))+\s*$'
rule:
    kind: program
    pattern: $SCRIPT
    not:
        all:
            - has: {matches: option-setup, regex: '\s+["'']?-[abefhkmnoptuvxBCEHPT]*e|\s+["'']?errexit["'']?(?:\s|$)'}
            - has: {matches: option-setup, regex: '\s+["'']?-[abefhkmnoptuvxBCEHPT]*u|\s+["'']?nounset["'']?(?:\s|$)'}
            - has: {matches: option-setup, regex: '\s+["'']?-[abefhkmnoptuvxBCEHPT]*o[abefhkmnoptuvxBCEHPT]*["'']?\s+["'']?pipefail["'']?(?:\s|$)'}
transform:
    STRICT: {replace: {source: $SCRIPT, replace: '^(#![^\n]*\n)?', by: "${1}set -euo pipefail\n"}}
fix: $STRICT
message: The script sets no file-level errexit, nounset, and pipefail options
note: Establish the options with a top-level literal set command, `set -euo pipefail`, because functions share options unless `local -` saves them
