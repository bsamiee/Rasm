# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-property-lens-new
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: invocation_expression
    any:
        - pattern: Lens<$RECORD, $TYPE>.New(static $A => $A.$PROPERTY, static $V => $B => $B with { $PROPERTY = $V })
        - pattern: Lens<$RECORD, $TYPE>.New($A => $A.$PROPERTY, $V => $B => $B with { $PROPERTY = $V })
message: '`Lens<$RECORD, $TYPE>.New` restates property `$PROPERTY` of `$RECORD`'
note: 'Annotate the record parameter with `[Field]` under `[StateRecord]` and read its generated lens'
