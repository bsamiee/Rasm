# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-collected-windows-or-chunks
language: rustlang
severity: error
utils:
    collected:
        kind: field_expression
        all:
            - has: {field: field, regex: '^(windows|chunks|chunks_exact|as_chunks|into_chunks)$'}
            - has: {field: value, pattern: '$R.collect::<Vec<$_>>()'}
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: function, matches: collected}
            - has: {field: arguments, all: [{has: {nthChild: 1, kind: integer_literal}}, {not: {has: {nthChild: 2}}}]}
        - all:
            - has: {field: function, kind: generic_function, has: {field: function, matches: collected}}
            - has: {field: arguments, not: {has: {nthChild: 1}}}
message: '`$R` collects into a `Vec` only to read its windows or chunks'
note: 'Use `map_windows(|window: &[_; N]| ..)` or `array_chunks::<N>()` when outputs borrow nothing from the source slice'
