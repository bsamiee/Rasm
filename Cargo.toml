# --- [CARGO_FEATURES] -------------------------------------------------------------------

cargo-features = ["trim-paths"]

# --- [WORKSPACE] ------------------------------------------------------------------------

[workspace]
resolver = "3"
members  = ["libs/rust/*", "tools/bridge", "tools/dylint/*"]

# --- [PACKAGE] --------------------------------------------------------------------------

[workspace.package]
edition = "2024"

# --- [METADATA] -------------------------------------------------------------------------

[workspace.metadata.dylint]
libraries = [{ path = "tools/dylint/*" }]

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[workspace.dependencies]
# --- [RUNTIME]
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] } # Future joins and stream combinators with ordered results
pin-project-lite = { version = "0.2.17", default-features = false } # Pinned fields of hand-written futures and tower response types without unsafe
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "signal", "process", "net", "sync"] } # Async runtime every service, client, and store driver runs on
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] } # Cancellation tokens, task trackers, and drop guards that scope service lifetimes
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync", "time"] } # Stream adapters over tokio channels, watches, and intervals
# --- [CONCURRENCY]
arc-swap = { version = "1.9.2", default-features = false } # Read-mostly snapshots replaced whole while readers keep their copy
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "unmanaged", "rt_tokio_1"] } # Async pools of reusable connections and handles
papaya = { version = "0.2.5", default-features = false, features = ["fast-barrier"] } # Concurrent maps that read without a lock across await points
parking_lot = { version = "0.12.5", default-features = false } # Synchronous locks without poisoning that return guards without unwrap
rayon = { version = "1.12.0", default-features = false }  # Data parallelism over independent CPU-bound work
# --- [CACHES]
foyer = { version = "0.22.6", default-features = false, features = ["runtime-tokio", "tracing", "serde"] } # Hybrid memory and disk caches holding results larger than memory
moka = { version = "0.12.16", default-features = false, features = ["future", "sync"] } # Bounded caches with per-entry expiry and coalesced async loads
# --- [SYSTEM]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "process-session", "kill-on-drop", "job-object", "creation-flags", "tracing"] } # Child processes in groups and job objects that die with their owner
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] } # Typed POSIX calls returning errno values where std stops
sd-notify = { version = "0.5.0", default-features = false } # Readiness and watchdog signals to systemd
velopack = { version = "1.2.161", default-features = false } # Product installation and in-place updates
windows-service = { version = "0.8.1", default-features = false } # Windows service control lifetime
wasmtime = { version = "50.0.0-rc.1", default-features = false, features = ["std", "runtime", "cranelift", "async", "component-model", "pooling-allocator", "parallel-compilation"] } # In-process WebAssembly sandbox around untrusted guest code
# --- [ERRORS]
annotate-snippets = { version = "0.12.16", default-features = false, features = ["std"] } # Grammar errors rendered over source spans
nonempty-collections = { version = "1.4.0", default-features = false, features = ["serde"] } # Non-empty vectors, sets, and maps that hold accumulated errors
thiserror = { version = "2.0.21", default-features = false } # Error enums that consumers match by variant
validated = { version = "1.0.0", default-features = false } # Applicative validation accumulating every independent error
# --- [DERIVES]
auto_impl = { version = "1.4.0", default-features = false } # Capability traits implemented for references, Arc, and Box from one impl
bon = { version = "3.10.2", default-features = false, features = ["std"] } # Compile-time-checked builders on structs, functions, and methods
derive-where = { version = "1.7.0", default-features = false } # Derives on generic and phantom-typed records without spurious bounds
derive_more = { version = "2.1.1", default-features = false, features = ["std", "from", "into", "try_from", "display", "deref", "constructor", "is_variant"] } # Conversion, display, and constructor derives on invariant-free newtypes
dynosaur = { version = "0.3.1", default-features = false } # Dynamic dispatch over async capability traits swapped at composition
o2o = { version = "0.5.5", default-features = false }     # Field mappings between domain records and contract records
strum = { version = "0.28.0", default-features = false, features = ["std", "derive"] } # Enum name tables, iteration, and discriminant enums
trait-variant = { version = "0.1.3", default-features = false } # Send variants of async capability traits
# --- [COLLECTIONS]
cardinality-estimator = { version = "1.0.3", default-features = false, features = ["with_serde"] } # HyperLogLog distinct counts that merge across shards
enum-map = { version = "3.1.0", default-features = false, features = ["derive", "serde"] } # Total maps holding one value per enum variant
fastbloom = { version = "0.17.0", default-features = false, features = ["std"] } # Bloom filters that precheck membership
fst = { version = "0.4.7", default-features = false, features = ["levenshtein"] } # Finite-state sets and maps with prefix, range, and fuzzy queries
imbl = { version = "7.0.2", default-features = false, features = ["serde"] } # Persistent vectors and maps shared across tasks by structural sharing
indexmap = { version = "2.14.2", default-features = false, features = ["std", "serde"] } # Insertion-ordered maps and sets that keep iteration and output deterministic
itertools = { version = "0.15.0", default-features = false, features = ["use_std"] } # Partitioned results, grouping, windows, and merges over iterators
roaring = { version = "0.11.5", default-features = false, features = ["std"] } # Compressed integer sets with set algebra
rust-lapper = { version = "2.0.0-beta.1", default-features = false } # Interval overlap and stabbing queries
slotmap = { version = "1.1.1", default-features = false, features = ["std"] } # Generational-index arenas holding graph and scene nodes
smallvec = { version = "2.0.0-beta.2", default-features = false, features = ["std", "serde"] } # Inline small vectors that spill to the heap
tdigests = { version = "1.0.1", default-features = false } # Mergeable quantile estimates over streams
# --- [CRDT]
loro = { version = "1.16.2", default-features = false }   # Loro documents with text, list, map, and tree history
yrs = { version = "0.28.0", default-features = false }    # Yjs documents with state vectors and update exchange
# --- [SERIALIZATION]
binrw = { version = "0.15.2", default-features = false, features = ["std"] } # Binary formats read and written from one declaration
csv = { version = "1.4.0", default-features = false }     # CSV rows decoded into typed records
data-encoding = { version = "2.11.1", default-features = false, features = ["std"] } # Base64, base32, and hex codecs
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] } # Derived encode and decode of records and tagged unions
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] } # YAML codec without unsafe libyaml
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] } # Typed TOML decode and encode
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display", "serde"] } # TOML edits that keep comments and layout
yaml-edit = { version = "0.3.2", default-features = false } # YAML edits that keep comments and layout
bytes = { version = "1.12.1", default-features = false, features = ["std", "serde"] } # Shared immutable byte buffers
cbor4ii = { version = "1.2.3", default-features = false, features = ["serde1", "use_std"] } # CBOR codec
plist = { version = "1.10.1", default-features = false, features = ["serde"] } # XML and binary property lists
rmp-serde = { version = "1.3.1", default-features = false } # MessagePack codec
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value", "float_roundtrip"] } # JSON codec with values and raw passthrough
serde_path_to_error = { version = "0.1.20", default-features = false } # Boundary decode errors that name the failing field path
apache-avro = { version = "0.22.0", default-features = false, features = ["derive", "zstandard", "snappy"] } # Avro schemas, binary encoding, and container files
jsonptr = { version = "0.8.2", default-features = false, features = ["std", "serde", "json", "resolve", "assign", "delete"] } # JSON Pointer resolution with typed failures
serde_with = { version = "3.24.0", default-features = false, features = ["std", "macros", "base64", "hex", "jiff_0_2", "schemars_1"] } # Field codecs declared on records that schema derivation reads
json-patch = { version = "4.2.0", default-features = false, features = ["diff"] } # JSON Patch apply and diff over JSON values
# --- [SCHEMA]
jsonschema = { version = "0.58.6", default-features = false, features = ["resolve-file", "resolve-async", "tls-aws-lc-rs"] } # Runtime validation of documents against JSON Schema
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive", "jiff02", "uuid1", "indexmap2", "url2", "semver1", "bytes1"] } # JSON Schema derived from record types
# --- [NEWTYPES]
bounded-integer = { version = "0.6.2", default-features = false, features = ["std", "serde1", "schemars1"] } # Ranged integers with bounds that reach the derived schema
nutype = { version = "0.8.0", default-features = false, features = ["std", "serde", "regex"] } # Validated newtypes with a generated error enum per type
ordered-float = { version = "5.5.0", default-features = false, features = ["std", "serde"] } # NaN-free floats usable as ordered keys
# --- [TIME]
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "perf-inline"] } # Instants, zoned date-times, spans, and the zone database
croner = { version = "4.0.1", default-features = false, features = ["jiff"] } # Cron expressions evaluated against passed-in instants
# --- [IDENTIFIERS]
semver = { version = "1.0.28", default-features = false, features = ["std", "serde"] } # Semantic version and requirement parsing
uuid = { version = "1.28.0", default-features = false, features = ["std", "v7", "serde"] } # Creation-ordered identifiers
newtype-uuid = { version = "1.4.0", default-features = false, features = ["std", "v7", "serde"] } # Identifiers typed by the entity kind they name
# --- [HASHING]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] } # Content-addressed keys
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] } # CRC-32 and CRC-64 checksums across catalogued polynomials
xxhash-rust = { version = "0.8.19", default-features = false, features = ["std", "xxh3", "xxh64"] } # XXH3 and XXH64 content identity hashes
# --- [TEXT]
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] } # Many-literal search in one pass
bytesize = { version = "2.7.0", default-features = false, features = ["std", "serde"] } # Byte sizes parsed and displayed in binary and decimal units
encoding_rs = { version = "0.8.42", default-features = false, features = ["alloc"] } # Legacy text encodings decoded and encoded
frizbee = { version = "0.13.0", default-features = false, features = ["std"] } # Typo-tolerant ranking of completion candidates
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "full"] } # Language-aware hyphenation
icu = { version = "2.3.1", default-features = false, features = ["compiled_data"] } # Segmentation, collation, properties, and plural rules from Unicode data
ropey = { version = "2.0.0-beta.1", default-features = false, features = ["metric_lines_lf_cr", "metric_utf16", "simd"] } # Editable text buffers with UTF-16 position conversion
strsim = { version = "0.11.1", default-features = false } # Edit-distance and similarity metrics
unicode-bidi = { version = "0.3.18", default-features = false, features = ["std", "hardcoded-data"] } # Bidirectional reordering before shaping
unicode-width = { version = "0.2.2", default-features = false, features = ["cjk"] } # Display width of wide, combining, and emoji text
# --- [PARSING]
chumsky = { version = "0.13.0", default-features = false, features = ["std", "stacker", "pratt"] } # Parser combinators that recover and collect every error
ec4rs = { version = "2.0.0-rc.1", default-features = false, features = ["ec4rs_glob"] } # EditorConfig properties resolved per path
nmea = { version = "0.8.0", default-features = false, features = ["std", "all-sentences"] } # NMEA 0183 sentences
oxc = { version = "0.154.0", default-features = false, features = ["ast_visit", "semantic", "codegen", "regular_expression"] } # JavaScript and TypeScript parsing, analysis, and printing
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] } # Unicode patterns with linear-time matching
sqlparser = { version = "0.63.0", default-features = false, features = ["std", "visitor", "recursive-protection"] } # SQL text parsed into dialect ASTs
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] } # Syntax definitions looked up by name, alias, and extension
tree-sitter-sequel = { version = "0.3.11", default-features = false } # SQL grammar
tree-sitter-xml = { version = "0.7.0", default-features = false } # XML and DTD grammar
winnow = { version = "1.0.4", default-features = false, features = ["std", "ascii", "binary"] } # Parser combinators with caller-defined error types
cel = { version = "0.15.0", default-features = false, features = ["regex", "json"] } # Common Expression Language policies
tree-sitter = { version = "0.27.1", default-features = false, features = ["std"] } # Incremental parsing runtime that loads grammar crates
ast-grep-core = { version = "0.50.0", default-features = false, features = ["tree-sitter"] } # Structural search and rewrite over syntax trees
ast-grep-language = { version = "0.50.0", default-features = false, features = ["builtin-parser"] } # Built-in grammars of structural search
# --- [MARKUP]
ammonia = { version = "4.2.3", default-features = false } # Allow-list sanitization of untrusted HTML
comrak = { version = "0.56.0", default-features = false } # CommonMark and GFM parsed into an AST
htmd = { version = "0.5.5", default-features = false }    # HTML converted to Markdown
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["visitor", "into_owned"] } # CSS parsing, transformation, and minification
minijinja = { version = "3.0.0", default-features = false, features = ["builtins", "macros", "multi_template", "std_collections", "serde", "json", "loop_controls", "urlencode"] } # Jinja templates rendering reports and generated documents
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize", "encoding"] } # Streaming XML read and write with serde mapping
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] } # Read-only XML trees with source positions that locate validation errors
scraper = { version = "0.27.0", default-features = false, features = ["errors"] } # HTML parsing with CSS selectors
xot = { version = "0.31.2", default-features = false }    # Mutable XML trees with namespaces and parent access
# --- [FILES]
camino = { version = "1.2.6", default-features = false, features = ["serde1"] } # UTF-8 paths as a construction invariant
dunce = { version = "1.0.5", default-features = false }   # Canonical Windows paths without the verbatim prefix
etcetera = { version = "0.11.0", default-features = false } # Configuration, data, and cache directories under native or XDG conventions
file-format = { version = "0.29.0", default-features = false, features = ["reader-zip", "reader-xml", "reader-pdf", "reader-cfb", "reader-ebml", "reader-exe", "reader-mp4", "reader-rm", "reader-sqlite3", "reader-txt"] } # Format detection from leading bytes and container contents
fs-err = { version = "3.3.2", default-features = false, features = ["tokio"] } # File calls with errors that name the path
globset = { version = "0.4.20", default-features = false } # One path matched against many globs in one pass
notify = { version = "9.0.0-rc.5", default-features = false, features = ["macos_fsevent", "tokio"] } # File system change events
tempfile = { version = "3.27.0", default-features = false, features = ["getrandom"] } # Temporary files and atomic writes that keep occupied destinations
cap-std = { version = "4.0.3", default-features = false, features = ["fs_utf8"] } # Directory capabilities opened at the boundary and passed in
ignore = { version = "0.4.33", default-features = false } # Gitignore-aware parallel directory walks
notify-debouncer-full = { version = "0.8.0-rc.2", default-features = false, features = ["macos_fsevent", "tokio"] } # Debounced, rename-aware change batches
# --- [COMPRESSION]
async-compression = { version = "0.4.50", default-features = false, features = ["tokio", "gzip", "zlib", "zstd", "brotli", "lz4", "xz", "bzip2"] } # Compression over async byte streams
brotli = { version = "9.0.0", default-features = false, features = ["std"] } # Brotli streams
bzip2 = { version = "0.6.1" }                             # bzip2 streams
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] } # Deflate, zlib, and gzip streams
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode", "checked-decode"] } # LZ4 block and frame codecs
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["std", "xz", "lzip", "encoder", "optimization"] } # XZ, LZMA, and LZIP streams
snap = { version = "1.1.2", default-features = false }    # Snappy frames
tar = { version = "0.4.46", default-features = false }    # Tar archives
zstd = { version = "0.14.2", default-features = false, features = ["zdict_builder", "zstdmt"] } # Zstandard frames with dictionaries
qbsdiff = { version = "1.4.4", default-features = false } # Binary deltas between file versions
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["compress", "util", "aes256", "bzip2", "zstd", "ppmd"] } # 7z archives
zip = { version = "9.0.3", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs", "zstd", "bzip2", "lzma", "jiff-02"] } # ZIP archives with ZIP64 and AES
# --- [CRYPTOGRAPHY]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] } # Password hashing in PHC strings
