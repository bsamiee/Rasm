# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    sql-text:
        kind: 'string_literal, raw_string_literal'
        any:
            - regex: |-
                (?x)^r?\#*"\p{White_Space}*(
                    SELECT\p{White_Space}|INSERT\p{White_Space}+(OR\p{White_Space}+\p{XID_Continue}+\p{White_Space}+)?INTO\p{White_Space}|REPLACE\p{White_Space}+INTO\p{White_Space}|UPDATE\p{White_Space}+\P{White_Space}+\p{White_Space}+SET\p{White_Space}|DELETE\p{White_Space}+FROM\p{White_Space}|WITH\p{White_Space}+(RECURSIVE\p{White_Space}+)?\P{White_Space}+\p{White_Space}+AS\p{White_Space}
                    |CREATE\p{White_Space}+(UNIQUE\p{White_Space}+)?(TABLE|INDEX|VIEW)\p{White_Space}|ALTER\p{White_Space}+TABLE\p{White_Space}|DROP\p{White_Space}+(TABLE|INDEX|VIEW)\p{White_Space}|PRAGMA\p{White_Space}
                    |select\p{White_Space}[^"]*(?-u:\b)from\p{White_Space}|insert\p{White_Space}+(or\p{White_Space}+\p{XID_Continue}+\p{White_Space}+)?into\p{White_Space}|update\p{White_Space}+\P{White_Space}+\p{White_Space}+set\p{White_Space}|delete\p{White_Space}+from\p{White_Space}|with\p{White_Space}+(recursive\p{White_Space}+)?\P{White_Space}+\p{White_Space}+as\p{White_Space}*\(
                )
            - regex: '(?-u:\b)(WHERE|AND|OR|SET|VALUES|IN|LIKE|HAVING)(?-u:\b)[^"]*''\{[^{}]*\}'''
    sql-head:
        any:
            - matches: sql-text
            - kind: call_expression
              any:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(to_owned|to_string|into)$'}}, {has: {field: value, matches: sql-text}}]}
                - all: [{has: {field: function, regex: '^((::)?(std|alloc)::)?(string::)?String::from$'}}, {has: {field: arguments, has: {nthChild: 1, matches: sql-text}}}]
rule:
    pattern: $SQL
    any:
        - kind: macro_invocation
          all:
            - matches: {rust-std-macro: {name: {regex: '^(format|format_args|write|writeln)$'}}}
            - has: {kind: token_tree, has: {all: [{matches: sql-text}, {regex: '(^|[^{])\{[A-Za-z0-9_:}]'}]}}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\+$'}
            - has: {field: left, matches: sql-head}
        - kind: compound_assignment_expr
          all:
            - has: {field: operator, regex: '^\+=$'}
            - has: {field: right, matches: sql-text}
        - kind: call_expression
          any:
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^push_str$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: sql-text}}
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(concat|join)$'}}, {has: {field: value, kind: array_expression, has: {nthChild: 1, matches: sql-text}}}]}
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^replacen?$'}}, {has: {field: value, matches: sql-text}}]}
message: '`$SQL` interpolates values into SQL text'
note: 'Bind each value through `sqlx::query!` for a fixed statement, `sea_query` for a varying one, `sqlx::QueryBuilder::push_bind` for a value list'
