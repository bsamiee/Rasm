            - regex: '(?i)^(?:[^`]*`[^`]*`)*[^`]*\brather\b(?:\s*$|\s*[^\sa-z]|\s+(?:[^t\s]|t[^h\s]|th[^a\s]|tha[^n\s]|than\w))'
            - regex: '(?i)^(?:[^`]*`[^`]*`)*[^`]*\bmay\b(?:\s*$|\s*[^\sa-z]|\s+(?:[^h\s]|h[^a\s]|ha[^v\s]|hav[^e\s]|have\w))'
