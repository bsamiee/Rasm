# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-catch-all-predicate
language: csharp
severity: error
utils:
    catch-all:
        kind: argument
        any:
            - matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}
            - has: {matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}}
    released-failure:
        all:
            - any:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Catch|CatchIO)(\s*<.+>)?$'}}
                - all:
                    - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\.)?@catch(\s*<.+>)?$'}
                    - inside: {kind: binary_expression, field: right, has: {field: operator, regex: '^\|$'}}
            - has: {field: arguments, has: {kind: argument, nthChild: {position: 2, ofRule: {kind: argument}}, has: {matches: csharp-release-handler}}}
            - not:
                all:
                    - has: {field: function, kind: member_access_expression, has: {field: expression, pattern: $EFFECT}}
                    - matches: {csharp-failure-owner: {effect: {pattern: $EFFECT}}}
rule:
    kind: invocation_expression
    all:
        - any:
            - has: {field: function, kind: member_access_expression, has: {field: name, pattern: $NAME, regex: '^Catch(IO)?(\s*<.+>)?$'}}
            - has: {field: function, pattern: $NAME, regex: '^((global::)?(LanguageExt\.)?Prelude\.)?@catch(\s*<.+>)?$'}
        - has: {field: arguments, has: {kind: argument, nthChild: {position: 2, ofRule: {kind: argument}}}, not: {has: {kind: argument, nthChild: {position: 3, ofRule: {kind: argument}}}}}
        - has:
            field: arguments
            has:
                kind: argument
                any:
                    - has: {field: name, regex: '^[Pp]redicate$'}
                    - all:
                        - nthChild: {position: 1, ofRule: {kind: argument}}
                        - not: {has: {field: name, pattern: $_}}
                matches: catch-all
        - not: {matches: released-failure}
message: '`$NAME` takes a predicate that accepts every error'
note: Use `IfFail(<handler>)` on an `IO`, `Catch(<handler>)` or `CatchIO(<handler>)` on another `Fallible` type, or `@catch(<handler>)`
