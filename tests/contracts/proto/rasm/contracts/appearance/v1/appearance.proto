syntax = "proto3";

package rasm.contracts.appearance.v1;

import "buf/validate/validate.proto";
import "rasm/contracts/artifact/v1/artifact.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

// The OpenPBR channel roster in its frozen order; the order IS the set-key preimage order.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_BASE_WEIGHT = 1;
  ROLE_BASE_COLOR = 2;
  ROLE_BASE_METALNESS = 3;
  ROLE_BASE_DIFFUSE_ROUGHNESS = 4;
  ROLE_BASE_SPECULAR_TINT = 5;
  ROLE_SPECULAR_WEIGHT = 6;
  ROLE_SPECULAR_COLOR = 7;
  ROLE_SPECULAR_ROUGHNESS = 8;
  ROLE_SPECULAR_ROUGHNESS_ANISOTROPY = 9;
  ROLE_SPECULAR_ROUGHNESS_ANISOTROPY_ROTATION = 10;
  ROLE_SPECULAR_IOR = 11;
  ROLE_TRANSMISSION_WEIGHT = 12;
  ROLE_TRANSMISSION_ROUGHNESS = 13;
  ROLE_SUBSURFACE_WEIGHT = 14;
  ROLE_SUBSURFACE_RADIUS = 15;
  ROLE_COAT_WEIGHT = 16;
  ROLE_COAT_COLOR = 17;
  ROLE_COAT_ROUGHNESS = 18;
  ROLE_COAT_IOR = 19;
  ROLE_FUZZ_WEIGHT = 20;
  ROLE_FUZZ_COLOR = 21;
  ROLE_FUZZ_ROUGHNESS = 22;
  ROLE_THIN_FILM_WEIGHT = 23;
  ROLE_THIN_FILM_THICKNESS = 24;
  ROLE_THIN_FILM_IOR = 25;
  ROLE_EMISSION_COLOR = 26;
  ROLE_EMISSION_LUMINANCE = 27;
  ROLE_GEOMETRY_OPACITY = 28;
  ROLE_GEOMETRY_NORMAL = 29;
  ROLE_GEOMETRY_COAT_NORMAL = 30;
  ROLE_GEOMETRY_TANGENT = 31;
  ROLE_GEOMETRY_COAT_TANGENT = 32;
  ROLE_HEIGHT = 33;
  ROLE_OCCLUSION = 34;
  ROLE_CURVATURE = 35;
}

enum Transfer {
  TRANSFER_UNSPECIFIED = 0;
  TRANSFER_LINEAR = 1;
  TRANSFER_SRGB = 2;
  TRANSFER_RAW = 3;
  TRANSFER_PQ = 4;
  TRANSFER_HLG = 5;
}

enum NormalConvention {
  NORMAL_CONVENTION_UNSPECIFIED = 0;
  NORMAL_CONVENTION_GL = 1;
  NORMAL_CONVENTION_DX = 2;
}

enum AlphaMode {
  ALPHA_MODE_UNSPECIFIED = 0;
  ALPHA_MODE_STRAIGHT = 1;
  ALPHA_MODE_ASSOCIATED = 2;
  ALPHA_MODE_NONE = 3;
}

// `ktx2` is the one self-pyramiding container.
enum Container {
  CONTAINER_UNSPECIFIED = 0;
  CONTAINER_PNG16 = 1;
  CONTAINER_TIFF16 = 2;
  CONTAINER_TIFF_F32 = 3;
  CONTAINER_WEBP = 4;
  CONTAINER_QOI = 5;
  CONTAINER_EXR = 6;
  CONTAINER_EXR_DEEP = 7;
  CONTAINER_HDR = 8;
  CONTAINER_KTX2 = 9;
  CONTAINER_JXL = 10;
  CONTAINER_JXL_F16 = 11;
  CONTAINER_AVIF12 = 12;
}

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_ORM = 1;
  PACK_MRA = 2;
}

enum PlaneFormat {
  PLANE_FORMAT_UNSPECIFIED = 0;
  PLANE_FORMAT_R8 = 1;
  PLANE_FORMAT_R16 = 2;
  PLANE_FORMAT_R16F = 3;
  PLANE_FORMAT_R32F = 4;
  PLANE_FORMAT_RG8 = 5;
  PLANE_FORMAT_RG16 = 6;
  PLANE_FORMAT_RG16F = 7;
  PLANE_FORMAT_RG32F = 8;
  PLANE_FORMAT_RGBA8 = 9;
  PLANE_FORMAT_RGBA16 = 10;
  PLANE_FORMAT_RGBA16F = 11;
  PLANE_FORMAT_RGBA32F = 12;
}

enum MipPolicy {
  MIP_POLICY_UNSPECIFIED = 0;
  MIP_POLICY_BOX = 1;
  MIP_POLICY_KAISER = 2;
  MIP_POLICY_NORMAL_RENORMALIZE = 3;
  MIP_POLICY_ROUGHNESS_VARIANCE = 4;
  MIP_POLICY_NONE = 5;
}

// `uastc`, `etc1s`, and `none` are the three classes a transcoding consumer reads; `raw_bcn` and `astc` are desktop
// payloads and never appear on a manifest-borne row.
enum KtxPayload {
  KTX_PAYLOAD_UNSPECIFIED = 0;
  KTX_PAYLOAD_RAW_BCN = 1;
  KTX_PAYLOAD_UASTC = 2;
  KTX_PAYLOAD_ETC1S = 3;
  KTX_PAYLOAD_ASTC = 4;
  KTX_PAYLOAD_NONE = 5;
}

enum BlockFormat {
  BLOCK_FORMAT_UNSPECIFIED = 0;
  BLOCK_FORMAT_BC1 = 1;
  BLOCK_FORMAT_BC2 = 2;
  BLOCK_FORMAT_BC3 = 3;
  BLOCK_FORMAT_BC4 = 4;
  BLOCK_FORMAT_BC5 = 5;
  BLOCK_FORMAT_BC6H = 6;
  BLOCK_FORMAT_BC7 = 7;
  BLOCK_FORMAT_NONE = 8;
}

enum LayerLaw {
  LAYER_LAW_UNSPECIFIED = 0;
  LAYER_LAW_NONE = 1;
  LAYER_LAW_CUBE_FACES = 2;
  LAYER_LAW_ARRAY = 3;
  LAYER_LAW_VOLUME = 4;
  LAYER_LAW_FRAMES = 5;
}

enum LicenseClass {
  LICENSE_CLASS_UNSPECIFIED = 0;
  LICENSE_CLASS_PERMISSIVE = 1;
  LICENSE_CLASS_COPYLEFT = 2;
  LICENSE_CLASS_OPEN_RAIL = 3;
  LICENSE_CLASS_RESEARCH = 4;
  LICENSE_CLASS_BLOCKED = 5;
}

enum Udim {
  UDIM_UNSPECIFIED = 0;
  UDIM_NONE = 1;
  UDIM_MARI = 2;
}

// The plane's own declared primaries as a data-format-descriptor key a consumer checks a container against.
enum Primaries {
  PRIMARIES_UNSPECIFIED = 0;
  PRIMARIES_NONE = 1;
  PRIMARIES_BT709 = 2;
  PRIMARIES_SRGB = 3;
  PRIMARIES_BT601_EBU = 4;
  PRIMARIES_BT601_SMPTE = 5;
  PRIMARIES_BT2020 = 6;
  PRIMARIES_CIEXYZ = 7;
  PRIMARIES_ACES = 8;
  PRIMARIES_ACESCG = 9;
  PRIMARIES_NTSC1953 = 10;
  PRIMARIES_PAL525 = 11;
  PRIMARIES_DISPLAYP3 = 12;
  PRIMARIES_ADOBERGB = 13;
}

enum Depth {
  DEPTH_UNSPECIFIED = 0;
  DEPTH_U8 = 1;
  DEPTH_U16 = 2;
  DEPTH_F16 = 3;
  DEPTH_F32 = 4;
}

enum Tool {
  TOOL_UNSPECIFIED = 0;
  TOOL_KTX = 1;
  TOOL_IMAGECODECS = 2;
  TOOL_PYVIPS = 3;
  TOOL_OPENEXR = 4;
}

// --- [PLANES] -----------------------------------------------------------------------------

// ONE stored plane file and its canonical artifact identity.
message PlaneRef {
  reserved 2, 3;
  reserved "digest", "byte_length";

  string file = 1 [(buf.validate.field).string.min_len = 1];
  rasm.contracts.artifact.v1.ArtifactRef artifact = 4 [(buf.validate.field).required = true];
}

// One plane row of a set. `levels` is level-ordered: ONE entry for a self-pyramiding container whatever `mips`
// declares, one per level otherwise. A baked row carries `transfer`, `alpha_mode`, `mip_policy`, and
// `block_format`; an ingested row carries `primaries`, `depth`, and the producing `tool` with its probed version,
// since one set legitimately mixes two encode legs.
message Plane {
  option (buf.validate.message).cel = {
    id: "plane.levels"
    message: "levels carries one entry for a self-pyramiding container, else one per mip"
    expression: "this.container == 9 ? this.levels.size() == 1 : uint(this.levels.size()) == this.mips"
  };

  Role role = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  PlaneFormat format = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Container container = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 channels = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4
  }];
  uint32 mips = 5 [(buf.validate.field).uint32.gte = 1];
  KtxPayload ktx_payload = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated PlaneRef levels = 7 [(buf.validate.field).repeated.min_items = 1];
  optional Transfer transfer = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional AlphaMode alpha_mode = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional MipPolicy mip_policy = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional BlockFormat block_format = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional Primaries primaries = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional Depth depth = 13 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional Tool tool = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string tool_version = 15;
}

// `present` names the channel roles the pack carries in the pack's own slot order.
message PackRow {
  Pack pack = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated Role present = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 35
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  PlaneFormat format = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Container container = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 mips = 5 [(buf.validate.field).uint32.gte = 1];
  repeated PlaneRef levels = 6 [(buf.validate.field).repeated.min_items = 1];
}
