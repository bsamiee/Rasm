id: no-run-in-effect-callback
valid:
    # Two runs beside each other, the second inside a callback a devkit function owns
    - 'const source = runtime.runSync(Effect.cached(localSource)); return createNodesFromFiles((file) => runtime.runPromise(node(source, files, file)), files, options, context);'
    # A run from a callback a package outside effect owns, the foreign call sits between the run and the combinator
    - 'const stack = yield* Effect.tryPromise({ try: () => LocalWorkspace.createOrSelectStack({ program: () => Runtime.runPromise(fiberRuntime)(program(adopt)) }, workspace), catch: (cause) => new StackError({ cause }) });'
    # A run inside an output callback the foreign API owns
    - 'const result = yield* Effect.tryPromise({ try: () => stack.up({ onOutput: (line) => runtime.runSync(Console.log(line)) }) });'
    # The entry point runs once
    - 'NodeRuntime.runMain(Command.run(cli, { name: "cli", version: "" })(process.argv).pipe(Effect.provide(NodeContext.layer)));'
    # A test runs the effect inside a callback the test framework owns
    - 'it("decodes", () => { expect(Effect.runSync(decode(config))).toEqual(expected); });'
invalid:
    # A run inside a map callback, the callback returns the effect and the combinator is flatMap
    - 'const decoded = Effect.runSync(Effect.map(load(), (config) => Effect.runSync(decode(config))));'
    # A run inside a promise thunk, the effect is yielded in place
    - 'const job = Effect.promise(() => Runtime.runPromise(fiberRuntime)(job));'
    # A fiber runtime run inside the entry run's generator
    - 'NodeRuntime.runMain(Effect.gen(function* () { const fiberRuntime = yield* Effect.runtime(); yield* Effect.promise(() => Runtime.runPromise(fiberRuntime)(job)); }));'
    # A run as the argument of a run
    - 'const value = Effect.runSync(Effect.succeed(Effect.runSync(inner)));'
    # A run inside the exit callback a run owns, the report composes through Effect.onExit before the run
    - 'runtime.runCallback(program, { onExit: (exit) => runtime.runSync(report(exit)) });'
    # A run inside an Array combinator callback, the traversal is Effect.forEach
    - 'const rows = Array.map(files, (file) => runtime.runSync(read(file)));'
