# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-future-annotations
language: python
severity: error
rule:
    kind: future_import_statement
    pattern: $IMPORT
    has: {kind: 'aliased_import, dotted_name', regex: '^annotations\b'}
message: '`$IMPORT` stores annotations as strings'
note: 'Use annotations without the `annotations` future import, Python 3.14 and later defer annotation evaluation by default and an earlier target quotes each forward reference the import deferred'
