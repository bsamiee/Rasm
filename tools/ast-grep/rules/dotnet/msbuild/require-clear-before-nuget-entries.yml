# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-clear-before-nuget-entries
language: xml
severity: error
files: ['NuGet.config']
rule:
    pattern: _SECTION
    matches: {msbuild-element: {name: {regex: '^(packageSources|disabledPackageSources|packageSourceMapping)$'}}}
    not: {has: {kind: content, has: {matches: {msbuild-element: {name: {regex: '^clear$'}}}, nthChild: {position: 1, ofRule: {kind: element}}}}}
transform:
    CLEARED: rewrite($SECTION, rewriters=[open-section, start-section, remove-clear])
fix: $CLEARED
rewriters:
    - id: open-section
      rule:
        kind: EmptyElemTag
        pattern: _TAG
        has: {kind: Name, pattern: _NAME}
        inside: {pattern: _SECTION}
      transform:
        OPEN: replace($TAG, replace='\s*/>$', by='>')
      fix: $OPEN<clear /></$NAME>
    - id: start-section
      rule:
        kind: STag
        pattern: _TAG
        inside: {pattern: _SECTION}
      fix: $TAG<clear />
    - id: remove-clear
      rule:
        matches: {msbuild-element: {name: {regex: '^clear$'}}}
        inside: {kind: content, inside: {pattern: _SECTION}}
      fix: ''
message: The section opens without <clear />, and a user or machine config adds its own entries to the restore
note: Put <clear /> before the first entry
