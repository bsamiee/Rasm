# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-dependency"
version.workspace    = true
edition.workspace    = true
description          = "Acyclic evaluation graphs with checked connections, topological order and layers, invalidation, cycle tearing, and critical path schedules"
repository.workspace = true
license.workspace    = true
keywords             = ["dependency-graph", "topological-sort", "invalidation", "critical-path", "scheduling"]
categories           = ["algorithms", "data-structures"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
thiserror            = { workspace = true }
derive_more          = { workspace = true }
enum-map             = { workspace = true }
itertools            = { workspace = true }
nonempty-collections = { workspace = true }
petgraph             = { workspace = true }
rustworkx-core       = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
