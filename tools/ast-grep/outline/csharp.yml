id: csharp-interface
language: csharplang
role: item
symbolType: interface
utils:
    enclosing: {kind: 'class_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    public:
        any:
            - has: {kind: modifier, regex: '^(?:public|protected)$'}
              not: {has: {kind: modifier, regex: '^private$'}}
            - inside: {stopBy: {matches: enclosing}, kind: interface_declaration}
              not: {has: {kind: modifier, regex: '^(?:private|internal)$'}}
rule:
    kind: interface_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: declaration_list, inside: {kind: interface_declaration, field: body}}
      fix: ''
    - id: arguments
      rule: {kind: argument_list, regex: "\n", inside: {kind: 'base_list, primary_constructor_base_type'}}
      fix: '(…)'
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body, arguments, trivia])
    NEWLINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    TRIMMED: {replace: {source: $NEWLINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported:
    all:
        - matches: public
        - not: {inside: {stopBy: end, matches: enclosing, not: {matches: public}}}
