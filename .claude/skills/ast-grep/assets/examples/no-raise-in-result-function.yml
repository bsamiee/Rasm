# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-raise-in-result-function
language: python
severity: error
rule:
    kind: raise_statement
    all:
        - not: {regex: '^raise$'} # Bare re-raise propagating cancellation alone is legal
        - inside:
            kind: function_definition
            stopBy:
                kind: function_definition # Nearest enclosing def, a raise inside a nested closure belongs to the closure
            has:
                field: return_type
                regex: '^"?(Result|Option)\[' # The quote arm reaches stringized annotations
message: Result-returning function raises in its own body
note: >-
    Return `Error(<fault>)` in the declared result type, or move the raise into the closure a boundary converter wraps,
    or waive a true boundary with `ast-grep-ignore`
