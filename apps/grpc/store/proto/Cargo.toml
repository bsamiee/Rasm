# --- [PACKAGE] --------------------------------------------------------------------------

# --- [IDENTITY]

[package]
name              = "rasm-store-proto"
edition.workspace = true
description       = "gRPC contract of the store service as generated messages, client, server, and descriptor set"

# --- [PROTOBUF]

[package.metadata.protobuf]
files    = ["proto/rasm/store/store.proto"]
includes = ["proto"]

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
prost       = { workspace = true }
tonic       = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
build-rs          = { workspace = true }
fs-err            = { workspace = true }
protox            = { workspace = true }
toml              = { workspace = true }
tonic-prost-build = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

# --- [RUST]

[lints.rust]
rust_2018_idioms      = { level = "deny", priority = -1 } # Workspace group, kept
unused_qualifications = "allow"                           # Generated code writes `std::result::Result`, `tonic::codegen::Service`, and `std::marker::Send` paths in full
warnings              = { level = "deny", priority = -1 } # Workspace group, kept

# --- [CLIPPY]

[lints.clippy]
all      = { level = "deny", priority = -1 } # Workspace group, kept
cargo    = { level = "deny", priority = -1 } # Workspace group, kept
nursery  = { level = "deny", priority = -1 } # Workspace group, kept
pedantic = { level = "deny", priority = -1 } # Workspace group, kept

# --- [GENERATED]

allow_attributes                = "allow" # Generated server writes `#[allow(non_camel_case_types)]` on each method service type
allow_attributes_without_reason = "allow" # Generated `#[allow]` attributes hold no `reason`
clone_on_ref_ptr                = "allow" # Generated server clones its `Arc` handler as `self.inner.clone()`
default_trait_access            = "allow" # Generated server sets compression encodings through `Default::default()`
disallowed_macros               = "allow" # Generated server trait takes `#[async_trait]`, the form tonic's router dispatches through
disallowed_types                = "allow" # Generated server names `std::convert::Infallible` as its `Service::Error`
doc_markdown                    = "allow" # Generated server docs name `StoreServiceServer` and `HoldSession` without backticks
excessive_nesting               = "allow" # Generated server nests one `Service` impl per rpc inside `call`
inline_modules                  = "allow" # Generated client and server sit in inline `pub mod` blocks of one included file
min_ident_chars                 = "allow" # Generated client binds `e` in each `map_err` closure
missing_const_for_fn            = "allow" # Generated server builders are plain `fn`
std_instead_of_core             = "allow" # Generated code names `std::result::Result`, `std::marker::Send`, and `std::sync::Arc`

# --- [ALLOWED]

missing_errors_doc      = "allow" # Workspace row, kept
multiple_crate_versions = "allow" # Workspace row, kept
too_many_lines          = "allow" # Workspace row, kept
