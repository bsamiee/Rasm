id: toml-member-array
language: toml
role: member
parentRuleIds: [toml-table, toml-table-element, toml-array, toml-inline-table]
symbolType: array
rule:
    any:
        - kind: pair
          inside: {kind: 'table, table_array_element, inline_table'}
          all: [{has: {kind: array, not: {matches: tabled}, any: [{not: {has: {pattern: $_}}, pattern: $EMPTY}, {kind: array}]}}, {any: [{inside: {kind: 'table, table_array_element'}, has: {kind: 'bare_key, dotted_key', regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}}, {has: {kind: 'bare_key, quoted_key, dotted_key', pattern: $KEY}}]}]
        - kind: 'bare_key, quoted_key, dotted_key'
          any: [{regex: '^[0-9A-Za-z_.-]+$', inside: {kind: pair, inside: {kind: 'table, table_array_element'}}, pattern: $BARE}, {pattern: $KEY}]
          inside: {kind: pair, inside: {kind: 'table, table_array_element, inline_table'}, has: {kind: array, matches: tabled}}
utils:
    tabled: {has: {stopBy: {not: {kind: array}}, any: [{kind: ERROR}, {regex: '^$'}, {kind: inline_table, has: {kind: 'pair, ERROR'}}]}}
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART.}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART.}
    - id: lineage
      rule:
        kind: 'bare_key, quoted_key, dotted_key'
        pattern: $SEGMENT
        any: [{inside: {kind: pair, inside: {kind: inline_table, inside: {kind: pair, stopBy: {not: {kind: array}}, inside: {kind: 'table, table_array_element, inline_table'}, has: {kind: 'bare_key, quoted_key, dotted_key', pattern: $UP}}}}}, {kind: 'bare_key, quoted_key, dotted_key'}]
      transform:
