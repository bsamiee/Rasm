# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-trait-of-assoc-item-test
language: rust
severity: error
files: [tools/dylint/**]
rule:
    kind: call_expression
    pattern: $CALL
    matches: rust-trait-of-assoc-test
message: '`$CALL` reads the trait declaring a method only to test it as a diagnostic or lang item'
note: 'Call `MaybeDef::opt_parent(cx)` on the method and test the result with `is_diag_item`, `is_lang_item`, or `opt_diag_name`'
