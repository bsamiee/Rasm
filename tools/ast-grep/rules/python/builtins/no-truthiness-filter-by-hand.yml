# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-truthiness-filter-by-hand
language: python
severity: error
utils:
    bool-call:
        kind: call
        has: {field: function, matches: {python-builtin-name: {name: {regex: '^bool$'}}}}
    truth-test:
        any:
            - {kind: identifier, pattern: $X}
            - {matches: bool-call, pattern: bool($X)}
    truth-comprehension:
        kind: 'generator_expression, list_comprehension, set_comprehension'
        all:
            - has: {field: body, kind: identifier, pattern: $X}
            - has:
                kind: for_in_clause
                nthChild: 2
                all:
                    - has: {field: left, kind: identifier, pattern: $X}
                    - has: {field: right, pattern: $ITER, not: {kind: expression_list}}
                not: {has: {regex: '^async$'}}
            - has: {kind: if_clause, nthChild: 3, has: {matches: truth-test}}
            - not: {has: {nthChild: 4}}
    truth-predicate:
        any:
            - matches: {python-builtin-name: {name: {regex: '^bool$'}}}
            - matches: {python-member-use: {module: {regex: '^operator$'}, name: {regex: '^truth$'}}}
            - kind: lambda
              any:
                - pattern: 'lambda $P: $P'
                - {pattern: 'lambda $P: bool($P)', has: {field: body, matches: bool-call}}
    predicate-filter:
        kind: call
        all:
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^filter$'}}}}
            - has:
                field: arguments
                kind: argument_list
                all:
                    - has: {nthChild: 1, matches: truth-predicate}
                    - has: {nthChild: 2, pattern: $ITER, not: {kind: 'keyword_argument, list_splat, dictionary_splat'}}
                not: {has: {nthChild: 3}}
rule:
    pattern: $M
    any:
        - matches: truth-comprehension
        - matches: predicate-filter
rewriters:
    - id: sole-argument
      rule: {kind: generator_expression, inside: {kind: call, field: arguments}}
      fix: (filter(None, $ITER))
    - id: iterator
      rule: {kind: 'generator_expression, call'}
      fix: filter(None, $ITER)
    - id: list
      rule: {kind: list_comprehension}
      fix: list(filter(None, $ITER))
    - id: set
      rule: {kind: set_comprehension}
      fix: set(filter(None, $ITER))
transform:
    OUT: rewrite($M, rewriters=[sole-argument, iterator, list, set])
fix: $OUT
message: '`$M` keeps the truthy elements of `$ITER` by hand'
note: 'Use `filter(None, <iterable>)`, inside `list(...)` or `set(...)` in place of a list or set comprehension, `filter` owns the truth test the comprehension spells with a loop name'
