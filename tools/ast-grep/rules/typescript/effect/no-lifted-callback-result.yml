# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    succeed-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)(Effect|Stream|Channel|Sink|Result)$'}}}
    option-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)Option$'}}}
    constant-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)(Effect|Option)$'}}}
    lifted-body:
        kind: call_expression, member_expression
        any:
            - has: {field: function, pattern: $M.succeed, has: {field: object, matches: succeed-module}}
            - has: {field: function, pattern: $M.some, has: {field: object, matches: option-module}}
            - pattern: $M.void
              has: {field: object, matches: constant-module}
    void-callback:
        kind: arrow_function, function_expression
        has:
            field: body
            any:
                - pattern: $M.void
                - kind: statement_block
                  has: {kind: return_statement, has: {pattern: $M.void}}
    lifting-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: '^async$'}}
        has:
            field: body
            any:
                - matches: lifted-body
                - kind: parenthesized_expression
                  has: {matches: lifted-body}
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: lifted-body}}
                  not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
    lifted-value:
        matches: lifted-body
        not: {pattern: $_.void}
    point-free-lift:
        kind: member_expression
        any:
            - pattern: $M.succeed
              has: {field: object, matches: succeed-module}
            - pattern: $M.some
              has: {field: object, matches: option-module}
    recovered:
        kind: call_expression
        any: [{pattern: $M.$LIFT($_V)}, {pattern: $M.$LIFT<$$$_>($_V)}]
        not: {has: {field: arguments, has: {kind: spread_element}}}
    recovering-handler:
        kind: arrow_function, function_expression
        all:
            - not: {has: {regex: '^async$'}}
            - not: {has: {field: return_type, kind: type_annotation}}
            - not: {has: {field: parameters, has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}
            - has:
                field: body
                any:
                    - matches: recovered
                    - kind: parenthesized_expression
                      has: {matches: recovered}
                    - kind: statement_block
                      has: {kind: return_statement, has: {matches: recovered}}
                      not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
    succeeded:
        kind: call_expression
        has: {field: function, kind: member_expression, has: {field: property, regex: '^succeed$'}}
    succeeding-handler:
        kind: arrow_function, function_expression
        all:
            - any: [{has: {field: parameter, kind: identifier}}, {has: {field: parameters, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: required_parameter}}}]
            - has:
                field: body
                any:
                    - matches: succeeded
                    - kind: parenthesized_expression
                      has: {matches: succeeded}
                    - kind: statement_block
                      has: {kind: return_statement, has: {matches: succeeded}}
rule:
    kind: call_expression
    pattern: $CALL
    any:
        - all:
            - has: {field: function, pattern: $M.$F, has: {field: property, regex: '^(flatMap|andThen)$'}}
            - has:
                field: arguments
                has:
                    nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, html_comment'}}}
                    any:
                        - matches: lifting-callback
                        - matches: point-free-lift
                        - matches: lifted-value
                          has: {field: function, has: {field: object, matches: constant-module}}
                          inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, has: {field: property, regex: '^andThen$'}}}}
            - not:
                all:
                    - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^flatMap$'}}}}
                    - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: lifting-callback, not: {matches: void-callback}}}
        - all:
            - has: {field: function, kind: member_expression, pattern: $M.$F, has: {field: property, regex: '^catch$'}}
            - not: {has: {field: type_arguments, kind: type_arguments}}
            - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: recovering-handler}}
            - any:
                - has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Stream$'}}}}}
                - all:
                    - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: succeeding-handler}}
                    - has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}}
            - not: {has: {kind: comment, stopBy: end}}
constraints:
    LIFT: {regex: '^(succeed|fail)$'}
message: '`$M.$F` callback lifts its result back into `$M`'
note: 'Use `map`, `as` for constants, or `asVoid`; replace `catch` with `orElseSucceed` for success or `mapError` for failure'
labels: {CALL: {style: primary}}
