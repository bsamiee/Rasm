# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-same-name-enum-mapping-rust
language: rust
severity: error
utils:
    nested-pattern:
        kind: 'tuple_struct_pattern, struct_pattern, tuple_pattern, slice_pattern, range_pattern, or_pattern, ref_pattern, mut_pattern, remaining_field_pattern, captured_pattern, reference_pattern, integer_literal, string_literal, boolean_literal, negative_literal, char_literal, float_literal'
    variant-form:
        any:
            - {kind: 'identifier, type_identifier', regex: '^[A-Z]'}
            - kind: 'scoped_identifier, scoped_type_identifier'
            - kind: 'tuple_struct_pattern, struct_pattern'
              not: {has: {stopBy: end, matches: nested-pattern}}
    variant-name:
        any:
            - {kind: 'identifier, type_identifier', pattern: $V}
            - {kind: 'scoped_identifier, scoped_type_identifier', has: {field: name, pattern: $V}}
            - {kind: 'tuple_struct_pattern, struct_pattern', has: {field: type, matches: variant-name}}
    own-variant:
        kind: 'scoped_identifier, scoped_type_identifier'
        all:
            - has: {field: path, any: [{regex: '^Self$'}, {pattern: $B}]}
            - has: {field: name, pattern: $V}
    mirrored-value:
        any:
            - matches: own-variant
            - kind: call_expression
              all:
                - has: {field: function, matches: own-variant}
                - has: {field: arguments, not: {has: {pattern: $_, not: {kind: identifier}}}}
            - kind: struct_expression
              all:
                - has: {field: name, matches: own-variant}
                - has: {field: body, not: {has: {pattern: $_, not: {kind: shorthand_field_initializer}}}}
            - kind: block
              all:
                - has: {nthChild: 1, matches: mirrored-value}
                - not: {has: {nthChild: 2}}
    non-mirrored-arm:
        kind: match_arm
        any:
            - has: {field: pattern, has: {field: condition, pattern: $_}}
            - has: {field: pattern, not: {has: {nthChild: 1, matches: variant-form}}}
            - all:
                - has: {field: pattern, has: {nthChild: 1, matches: variant-name}}
                - not: {has: {field: value, matches: mirrored-value}}
rule:
    kind: impl_item
    all:
        - has: {field: trait, kind: generic_type, all: [{has: {field: type, regex: '^((std|core)::)?(convert::)?From$'}}, {has: {field: type_arguments, has: {nthChild: 1, pattern: $A}}}]}
        - has: {field: type, pattern: $B}
        - has:
            field: body
            has:
                kind: function_item
                all:
                    - has: {field: name, regex: '^from$'}
                    - has:
                        field: body
                        has:
                            stopBy: end
                            kind: match_expression
                            pattern: $MATCH
                            has:
                                field: body
                                all:
                                    - not: {has: {kind: match_arm, matches: non-mirrored-arm}}
                                    - has: {kind: match_arm}
message: '`$MATCH` maps each variant of `$A` to the same-named variant of `$B`'
note: 'Use `$A` at each site, or derive `$B` and its mapping once through `strum::EnumDiscriminants` or an `o2o` attribute where a second enum must exist, an arm per variant restates the variant list by hand'
