# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-blender"
version         = "0.1.0"
requires-python = "==3.13.*"
dependencies    = []

# --- [DEPENDENCY_GROUPS] ----------------------------------------------------------------

[dependency-groups]
dev = [
    "fake-bpy-module-latest", # Stubs for bpy, bmesh, mathutils, and gpu
    "mypy",                   # Type checker of facts only mypy plugins check
    "pydantic",               # `pydantic.mypy` plugin the root mypy configuration loads
    "ruff",                   # Linter and formatter hk runs from this root's environment
    "scipy-stubs",
    "ty",                     # Type checker of every member
    "types-networkx",
    "types-opencolorio",      # Stubs for PyOpenColorIO
]

# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
python-preference       = "only-managed"
environments            = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
prerelease              = "allow"
constraint-dependencies = [
    "attrs==25.3.0",
    "autopep8==2.3.1",
    "cattrs==25.1.1",
    "certifi==2025.4.26",
    "charset-normalizer==3.4.1",
    "Cython==3.0.11",
    "docutils==0.22.4",
    "idna==3.10",
    "numpy==2.3.4",
    "opencolorio==2.5.0",
    "openimageio==3.1.16.0",
    "packaging==25.0",
    "pip==26.0.1",
    "pycodestyle==2.13.0",
    "pyproject-metadata==0.9.1",
    "requests==2.32.3",
    "setuptools==80.9.0",
    "tomli_w==1.2.0",
    "typing_extensions==4.14.1",
    "urllib3==2.4.0",
    "zstandard==0.25.0",
]                                                                # Versions the installed Blender bundles

[tool.uv.workspace]
members = ["bpy", "imaging", "rendering"]

[tool.uv.sources]
rasm-bpy       = { workspace = true }
rasm-imaging   = { workspace = true }
rasm-records   = { workspace = "../../.." }
rasm-rendering = { workspace = true }

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml"

# --- [TY] -------------------------------------------------------------------------------

[tool.ty]
environment = { python-platform = "all" }                              # ty merges no parent table and takes `requires-python` from the table holder, so each 3.13 root states its own
rules       = { all = "error", unused-type-ignore-comment = "ignore" } # mypy `unused-ignore` owns unused `type: ignore` comments
