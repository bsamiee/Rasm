# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-mismatched-span-name
language: tsx
severity: error
rule:
    kind: string
    pattern: $SPAN
    nthChild: 1
    all:
        - inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^fn$'}}
                inside:
                    kind: call_expression
                    field: function
                    any:
                        - inside: {kind: variable_declarator, field: value, has: {field: name, kind: identifier, pattern: $NAME}}
                        - inside: {kind: public_field_definition, field: value, has: {field: name, kind: property_identifier, pattern: $NAME}}
                        - inside: {kind: pair, field: value, has: {field: key, kind: property_identifier, pattern: $NAME}}
        - not: {has: {kind: string_fragment, pattern: $NAME}}
fix: "'$NAME'"
message: '`Effect.fn($SPAN)` names the span of `$NAME` with another name'
note: 'Name the span after its binding, `const <name> = Effect.fn(''<name>'')(...)`, traces and stack frames then identify its function'
