# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-throw-on-absent-result
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    any:
        - kind: binary_expression
          pattern: $CALL ?? throw new $EXCEPTION($$$MESSAGE)
          all:
            - has: {field: left, kind: invocation_expression}
            - not: {has: {field: right, has: {kind: object_creation_expression, has: {field: type, regex: '^(UnreachableException|XunitException)$'}}}}
            - not: {inside: {stopBy: end, kind: field_declaration}}
        - kind: invocation_expression
          pattern: $CALL.ThrowIfFail()
          all:
            - has:
                field: function
                has:
                    field: expression
                    kind: invocation_expression
                    has:
                        field: function
                        any:
                            - matches: {csharp-owner-member: {type: {regex: '^Refused$'}, member: {regex: '^UnlessFound$'}}}
                            - kind: member_access_expression
                              has: {field: name, regex: '^ToFin$'}
            - not: {inside: {stopBy: end, matches: languageext-io-lift}}
message: '`$CALL` throws for an absent result'
note: 'Lift absence into the result through `Optional(<call>).ToFin(<error>)` inside a `Fin` or `IO` chain'
