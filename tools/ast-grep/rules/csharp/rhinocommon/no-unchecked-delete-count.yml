# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unchecked-delete-count
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    sequence-type:
        regex: '^((global::)?(LanguageExt\.|System\.Collections\.Generic\.)?(Seq|Lst|Arr|Iterable|IEnumerable|IReadOnlyList|IReadOnlyCollection|IList|ICollection|List|HashSet)\s*<|.*\[\]$)'
    sequence:
        any:
            - kind: 'collection_expression, array_creation_expression, implicit_array_creation_expression'
            - kind: invocation_expression
              has: {field: function, regex: '(^|\.)\s*(toSeq|Seq|Map|Select|Filter|Where|Choose|ToArray|ToList|Strict)(\s*<.+>)?$'}
            - matches: {csharp-declared-type: {type: {matches: sequence-type}}}
    compared:
        inside:
            kind: argument
            nthChild: 2
            inside:
                kind: argument_list
                inside: {kind: invocation_expression, has: {field: function, regex: '^((global::)?Rasm\.Rhino\.Document\.)?CountMismatch\s*\.\s*Unless$'}}
rule:
    kind: invocation_expression
    all:
        - has:
            field: function
            kind: member_access_expression
            all:
                - has: {field: name, regex: '^Delete$'}
                - has: {field: expression, kind: member_access_expression, has: {field: name, pattern: $TABLE, regex: '^(Objects|Layers|SectionStyles|Markups|HatchPatterns)$'}}
        - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: sequence, pattern: $ITEMS}}}
        - not: {matches: compared}
message: '`$TABLE.Delete` returns a count that no comparison with `$ITEMS` checks'
note: Use `CountMismatch.Unless(<items>.Count, <delete call>, nameof(<table type>.Delete))`, `Delete` returns how many items it deleted
