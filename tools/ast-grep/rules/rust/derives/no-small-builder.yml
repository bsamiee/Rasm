# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-small-builder
language: rust
severity: error
rule:
    kind: function_item
    all:
        - has: {field: name, pattern: $NAME}
        - not: {has: {field: parameters, has: {kind: parameter, nthChild: {position: 3, ofRule: {kind: parameter}}}}}
        - matches: {rust-attributed: {attribute: {kind: attribute_item, regex: '^#\[\s*((::)?bon\s*::\s*)?builder\b', pattern: $DERIVE}}}
labels:
    NAME: {style: primary, message: 'Takes at most two arguments'}
    DERIVE: {style: secondary, message: 'Generates a builder'}
message: '`$DERIVE` generates a builder for `$NAME` with at most two arguments'
note: 'Delete the builder attribute and call `<function>(<a>, <b>)`'
