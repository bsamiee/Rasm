id: no-caught-assignment
valid:
    - |
      try:
          record.value = value
      except ValueError:
          pass
    - |
      for record in records:
          try:
              record.value = value
          except ValueError:
              continue
    - |
      try:
          record.value = value
      except Exception:
          record.value = None
    - |
      try:
          record.value = value
      except:
          record.value = None
    - |
      try:
          record.value = value
      except ValueError as error:
          raise Fault(cause=error) from error
invalid:
    - |
      try:
          record.value = value
      except ValueError:
          record.value = None
    - |
      def stored(record, value):
          try:
              record.value = value
          except (TypeError, ValueError):
              return None
          return record
    - |
      try:
          setattr(record, "value", value)
      except AttributeError:
          record.value = None
