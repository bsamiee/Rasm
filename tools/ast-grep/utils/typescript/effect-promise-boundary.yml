# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-promise-boundary
language: tsx
utils:
    promise-module:
        matches:
            effect-module-reference:
                module: {regex: '^(effect/)?(Effect|Micro)$'}
    stream-module:
        matches:
            effect-module-reference:
                module: {regex: '^(effect/)?Stream$'}
    promise-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: object, matches: promise-module}
                - any:
                    - has: {field: property, regex: ^(promise|tryPromise)$}
                    - all:
                        - has: {field: property, regex: ^tryMapPromise$}
                        - has:
                            field: object
                            matches:
                                effect-module-reference:
                                    module: {regex: '^(effect/)?Effect$'}
rule:
    any:
        - kind: arrow_function, function_expression
          any:
            - inside:
                stopBy:
                    not: {matches: syntax-expression-wrapper}
                kind: arguments
                inside:
                    matches: promise-call
                    has:
                        field: function
                        has: {field: property, regex: ^(promise|tryPromise)$}
            - inside:
                stopBy:
                    not: {matches: syntax-expression-wrapper}
                kind: pair
                field: value
                has: {field: key, regex: ^(try|"try"|'try')$}
                inside:
                    kind: object
                    inside:
                        kind: arguments
                        inside: {matches: promise-call}
        - kind: method_definition
          has: {field: name, regex: ^(try|"try"|'try')$}
          inside:
            kind: object
            inside:
                kind: arguments
                inside: {matches: promise-call}
        - matches: syntax-function-boundary
          inside:
            matches: effect-promise-boundary
            stopBy: {matches: syntax-function-boundary}
        - kind: generator_function
          inside:
            kind: parenthesized_expression
            inside:
                kind: call_expression
                field: function
                inside:
                    kind: arguments
                    inside:
                        kind: call_expression
                        has:
                            field: function
                            kind: member_expression
                            all:
                                - has: {field: object, matches: stream-module}
                                - has: {field: property, regex: ^fromAsyncIterable$}
