# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-zipped-equality-by-hand
language: rust
severity: error
utils:
    lengths:
        kind: binary_expression
        pattern: $LA.len() == $LB.len()
rule:
    kind: binary_expression
    all:
        - has: {field: operator, regex: '^&&$'}
        - has:
            field: right
            any:
                - pattern: 'iter::zip($A, $B).all(|($X, $Y)| $L == $R)'
                - pattern: '$A.iter().zip($B).all(|($X, $Y)| $L == $R)'
                - pattern: '$A.into_iter().zip($B).all(|($X, $Y)| $L == $R)'
        - has:
            field: left
            any:
                - matches: lengths
                - {kind: binary_expression, has: {field: right, matches: lengths}}
message: '`$A` and `$B` compare their lengths and then each pair by hand'
note: 'Compare `<left> == <right>` for slices, or `<left>.map(..).eq(<right>.map(..))` through `Iterator::eq` for mapped values'
