# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discard-pattern-test
language: csharp
severity: error
utils:
    unused-var:
        any:
            - kind: declaration_pattern
              all:
                - has: {field: type, kind: implicit_type}
                - has: {kind: discard}
            - kind: parenthesized_pattern
              has: {matches: unused-var}
rule:
    kind: is_pattern_expression
    all:
        - has: {field: expression, pattern: $VALUE}
        - has: {field: pattern, pattern: $PATTERN, matches: unused-var}
message: '`$VALUE is $PATTERN` tests a pattern every value matches'
note: Map the returned host answer into a result, a `var _` pattern matches every value and reads none
