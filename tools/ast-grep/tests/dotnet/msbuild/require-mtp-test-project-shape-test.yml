id: require-mtp-test-project-shape
valid:
    # The test project form, an executable with coverage collection
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType></PropertyGroup><ItemGroup Label="Test Dependencies"><PackageReference Include="coverlet.MTP" /><PackageReference Include="CsCheck" /><PackageReference Include="xunit.v3.mtp-v2" /></ItemGroup></Project>
    # A library project references no test framework and owes no test shape
    - |
      <Project Sdk="Microsoft.NET.Sdk"><ItemGroup><PackageReference Include="PureHDF" /></ItemGroup></Project>
    # The references in the start-tag form
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType></PropertyGroup><ItemGroup><PackageReference Include="coverlet.MTP"></PackageReference><PackageReference Include="xunit.v3.mtp-v2"></PackageReference></ItemGroup></Project>
invalid:
    # The framework without the executable output type
    - |
      <Project Sdk="Microsoft.NET.Sdk"><ItemGroup><PackageReference Include="coverlet.MTP" /><PackageReference Include="xunit.v3.mtp-v2" /></ItemGroup></Project>
    # The framework without coverage collection
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType></PropertyGroup><ItemGroup><PackageReference Include="xunit.v3.mtp-v2" /></ItemGroup></Project>
    # A library output type beside the framework
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Library</OutputType></PropertyGroup><ItemGroup><PackageReference Include="coverlet.MTP" /><PackageReference Include="xunit.v3.mtp-v2" /></ItemGroup></Project>
