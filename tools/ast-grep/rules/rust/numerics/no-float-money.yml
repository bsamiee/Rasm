# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-float-money
language: rust
severity: error
utils:
    money-name:
        regex: '(?i)^(account_)?balances?$|(^|_)(prices?|subtotals?|tax(es)?|fees?|payments?|refunds?|discounts?|revenues?|salar(y|ies)|wages?|money|amount_(usd|eur|gbp|jpy|chf|cad|aud)|\w+_(usd|eur|gbp|jpy|chf|cad|aud|dollars|euros))$'
    float:
        kind: primitive_type
        regex: '^f(32|64)$'
    float-type:
        any: [{matches: float}, {has: {stopBy: end, matches: float}}]
rule:
    pattern: $DECLARATION
    any:
        - kind: 'const_item, static_item, field_declaration, parameter, let_declaration'
          all:
            - any: [{has: {field: name, matches: money-name}}, {has: {field: pattern, kind: identifier, matches: money-name}}]
            - has: {field: type, matches: float-type}
            - not: {inside: {kind: parameters, inside: {matches: rust-trait-or-extern-function}}}
        - kind: identifier
          matches: money-name
          inside:
            kind: function_item
            field: name
            all:
                - has: {field: return_type, matches: float-type}
                - not: {matches: rust-trait-or-extern-function}
message: '`$DECLARATION` holds money as a binary float'
note: 'Type the amount as `rust_decimal::Decimal` and round through `round_dp_with_strategy(<places>, RoundingStrategy::<strategy>)`'
