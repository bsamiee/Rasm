utils:
    exposed: {any: [{has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}}, {inside: {kind: 'interface_body, annotation_type_body'}, not: {has: {kind: modifiers, has: {pattern: private}}}}]}
    open: {not: {inside: {stopBy: end, any: [{kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', not: {matches: exposed}}, {kind: 'program, ERROR', has: {kind: 'method_declaration, field_declaration'}}]}}}
    public: {all: [{matches: exposed}, {matches: open}]}
    form:
        all:
            - has: {any: [{pattern: class}, {pattern: record}], pattern: $$KEYWORD}
            - any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: &kinds 'class_declaration, record_declaration'}]
            - any: [{has: {field: type_parameters, pattern: $TYPES}}, {kind: *kinds}]
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {kind: *kinds}]
            - any: [{has: {field: superclass, pattern: $SUPERCLASS}}, {kind: *kinds}]
            - any: [{has: {field: interfaces, pattern: $INTERFACES}}, {kind: *kinds}]
            - any: [{has: {field: permits, pattern: $PERMITS}}, {kind: *kinds}]
    constant: {any: [{kind: constant_declaration}, {has: {kind: modifiers, all: [{has: {pattern: static}}, {has: {pattern: final}}]}}]}
    variable: {not: {has: {kind: modifiers, all: [{has: {pattern: static}}, {has: {pattern: final}}]}}}
    owner: {inside: {kind: 'class_body, interface_body, annotation_type_body, enum_body_declarations', not: {inside: {kind: object_creation_expression}}, inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant', stopBy: end, any: [{inside: {kind: 'program, ERROR'}}, {has: {field: name, pattern: {context: 'class $OWNER {}', selector: identifier}}}]}}}
    local:
        inside:
            stopBy: {kind: 'method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration > variable_declarator, constant_declaration > variable_declarator, enum_constant, class_body, interface_body, annotation_type_body, enum_body_declarations'}
            kind: method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration > variable_declarator, constant_declaration > variable_declarator, enum_constant
            not: {any: [{inside: {kind: class_body, inside: {kind: object_creation_expression}}}, {inside: {kind: field_declaration, inside: {kind: class_body, inside: {kind: object_creation_expression}}}}]}
            any:
                - inside: {kind: 'program, ERROR'}
                - inside: {kind: field_declaration, inside: {kind: 'program, ERROR'}}
                - has: {field: name, pattern: {context: 'class $OWNER {}', selector: identifier}}
                - has: {pattern: $$OWNER, not: {kind: block}}
    placed:
        inside:
            stopBy: end
            kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration > variable_declarator, constant_declaration > variable_declarator
            any:
                - inside: {kind: 'program, ERROR'}
                - inside: {kind: field_declaration, inside: {kind: 'program, ERROR'}}
                - has: {field: name, pattern: {context: 'class $UP {}', selector: identifier}}
                - has: {pattern: $$UP, not: {kind: block}}
    plain: {all: [{any: [{not: {regex: 'class|interface|enum|record'}}, {not: {has: {stopBy: {kind: class_body}, kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration'}}}]}, {not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}}]}
rewriters:
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: "\n"}
    - {id: tool, rule: {kind: annotation, has: {field: name, regex: 'SuppressWarnings'}}, fix: ''}
    - {id: value, rule: {kind: annotation_argument_list}, fix: '(…)'}
    - id: header
      rule: {kind: identifier, inside: {field: name, matches: form}}
      transform:
        M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
        T: rewrite($TYPES, rewriters=[comment, tool, value])
        P: rewrite($PARAMETERS, rewriters=[comment, tool, value])
        S: rewrite($SUPERCLASS, rewriters=[comment, tool, value])
        I: rewrite($INTERFACES, rewriters=[comment, tool, value])
        R: rewrite($PERMITS, rewriters=[comment, tool, value])
      fix: "$M\n$KEYWORD $NAME$T$P\n$S\n$I\n$R"
    - id: element
      rule: {kind: identifier, inside: {kind: annotation_type_element_declaration, field: name, matches: form, any: [{has: {field: value, pattern: $VALUE}}, {kind: annotation_type_element_declaration}]}}
      transform:
        M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
        Y: rewrite($TYPE, rewriters=[comment, tool, value])
        D: {replace: {source: $VALUE, replace: '(?s).+', by: ' default …'}}
      fix: "$M\n$Y $NAME()$DIMENSIONS$D"
    - id: lineage
      rule: {pattern: $$SELF, any: [{inside: {matches: placed}}, {regex: ''}]}
      transform:
        ABOVE: rewrite($UP, rewriters=[lineage])
      fix: $ABOVE$SELF.
transform:
    HEADER: rewrite($NAME, rewriters=[header])
    LINES: replace($HEADER, replace='[\t-\r ]+', by="\n ")
    SIGNATURE: replace($LINES, replace='^\n |\n $|([(\[<]|[^.]\.)\n |\n ([)\]>.,;])|\n', by='$1$2')
    NAME: replace($SIGNATURE, replace='^.* ', by='')
    LINEAGE: rewrite($OWNER, rewriters=[lineage])
    PATH: replace($LINEAGE, replace='\{', by='{}')
variants:
    interface:
        utils:
            form:
                all:
                    - has: {any: [{pattern: interface}, {pattern: '@interface'}], pattern: $$KEYWORD}
                    - any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: &kinds 'interface_declaration, annotation_type_declaration'}]
                    - any: [{has: {field: type_parameters, pattern: $TYPES}}, {kind: *kinds}]
                    - any: [{has: {kind: extends_interfaces, pattern: $EXTENDS}}, {kind: *kinds}]
                    - any: [{has: {field: permits, pattern: $PERMITS}}, {kind: *kinds}]
        rewriters:
            - id: header
              rule: {kind: identifier, inside: {field: name, matches: form}}
              transform:
                M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
                T: rewrite($TYPES, rewriters=[comment, tool, value])
                E: rewrite($EXTENDS, rewriters=[comment, tool, value])
                R: rewrite($PERMITS, rewriters=[comment, tool, value])
              fix: "$M\n$KEYWORD $NAME$T\n$E\n$R"
    enum:
        utils:
            form:
                all:
                    - any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: enum_declaration}]
                    - any: [{has: {field: interfaces, pattern: $INTERFACES}}, {kind: enum_declaration}]
        rewriters:
            - id: header
              rule: {kind: identifier, inside: {field: name, matches: form}}
              transform:
                M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
                I: rewrite($INTERFACES, rewriters=[comment, tool, value])
              fix: "$M\nenum $NAME\n$I"
    method:
        utils:
            form:
                all:
                    - any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: &kinds 'method_declaration, annotation_type_element_declaration'}]
                    - any: [{has: {field: type_parameters, pattern: $TYPES}}, {kind: *kinds}]
                    - any: [{has: {kind: 'annotation, marker_annotation', pattern: $ANNOTATION}}, {kind: *kinds}]
                    - any: [{has: {field: type, pattern: $TYPE}}, {kind: *kinds}]
                    - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {kind: *kinds}]
                    - any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: *kinds}]
                    - any: [{has: {kind: throws, pattern: $THROWS}}, {kind: *kinds}]
        rewriters:
            - id: header
              rule: {kind: identifier, inside: {field: name, matches: form}}
              transform:
                M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
                T: rewrite($TYPES, rewriters=[comment, tool, value])
                A: rewrite($ANNOTATION, rewriters=[comment, tool, value])
                Y: rewrite($TYPE, rewriters=[comment, tool, value])
                P: rewrite($PARAMETERS, rewriters=[comment, tool, value])
                H: rewrite($THROWS, rewriters=[comment, tool, value])
              fix: "$M\n$T\n$A\n$Y $NAME$P$DIMENSIONS\n$H"
        transform:
            HEADER: rewrite($NAME, rewriters=[element, header])
    constant:
        rewriters:
            - id: header
              rule:
                kind: identifier
                inside:
                    kind: variable_declarator
                    field: name
                    any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: variable_declarator}]
                    inside: {has: {field: type, pattern: $TYPE}, any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: 'field_declaration, constant_declaration'}]}
              transform:
                M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
                Y: rewrite($TYPE, rewriters=[comment, tool, value])
              fix: "$M\n$Y $NAME$DIMENSIONS"
    field:
        rewriters:
            - id: header
              rule:
                kind: identifier
                inside:
                    kind: variable_declarator
                    field: name
                    any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: variable_declarator}]
                    inside: {has: {field: type, pattern: $TYPE}, any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: field_declaration}]}
              transform:
                M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
                Y: rewrite($TYPE, rewriters=[comment, tool, value])
              fix: "$M\n$Y $NAME$DIMENSIONS"
    declaration:
        transform:
            HEADER: rewrite($DECLARATION, rewriters=[comment, tool, value])
    directive:
        transform:
            HEADER: rewrite($DECLARATION, rewriters=[comment])
    statement:
        transform:
            LINES: replace($HEADER, replace='(?:;|[\t-\r ])+$|[\t-\r ]+', by="\n ")
