id: msbuild-project
language: xml
role: item
symbolType: module
rule:
    kind: STag, EmptyElemTag
    pattern: _TAG
    has: {kind: Name, regex: '^Project$'}
    inside: {kind: element, inside: {kind: document}}
transform:
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
    HEADER: {replace: {source: $LINE, replace: '^<[^\s/>]+\s*/?>$', by: ''}}
name: Project
signature: $HEADER
isExported: false

---
id: msbuild-import
language: xml
role: item
symbolType: module
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        all:
            - has: {kind: Name, regex: '^Import$'}
            - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^Project$'}}, {has: {kind: AttValue, pattern: _PATH}}]}
    inside: {kind: content, stopBy: {not: {any: [{kind: content}, {kind: element, has: {kind: STag, has: {kind: Name, regex: '^ImportGroup$'}}}]}}, inside: {kind: element, inside: {kind: document}}}
transform:
    NAME: substring($PATH, startChar=1, endChar=-1)
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
name: $NAME
signature: $LINE
isImport: true
isExported: false

---
id: msbuild-using-task
language: xml
role: item
symbolType: class
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        all:
            - has: {kind: Name, regex: '^UsingTask$'}
            - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^TaskName$'}}, {has: {kind: AttValue, pattern: _TASK}}]}
    inside: {kind: content, inside: {kind: element, inside: {kind: document}}}
transform:
    NAME: substring($TASK, startChar=1, endChar=-1)
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
name: $NAME
signature: $LINE
isExported: false

---
id: msbuild-group
language: xml
role: item
symbolType: object
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        has: {kind: Name, regex: '^(PropertyGroup|ItemGroup)$'}
    inside:
        kind: content
        stopBy: {not: {any: [{kind: content}, {kind: element, has: {kind: STag, has: {kind: Name, regex: '^(Choose|When|Otherwise)$'}}}]}}
        inside: {kind: element, inside: {kind: document}}
transform:
    LABELED: {replace: {source: $TAG, replace: '^<(\w+)(?:[\s\S]*\sLabel=["'']([^"'']*)["''])?[\s\S]*$', by: '$1 $2'}}
    NAME: {replace: {source: $LABELED, replace: '\s+$', by: ''}}
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
    HEADER: {replace: {source: $LINE, replace: '^<[^\s/>]+\s*/?>$', by: ''}}
name: $NAME
signature: $HEADER
isExported: false

---
id: msbuild-target
language: xml
role: item
symbolType: function
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        all:
            - has: {kind: Name, regex: '^Target$'}
            - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^Name$'}}, {has: {kind: AttValue, pattern: _VALUE}}]}
    inside: {kind: content, inside: {kind: element, inside: {kind: document}}}
transform:
    NAME: substring($VALUE, startChar=1, endChar=-1)
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
name: $NAME
signature: $LINE
isExported: false

---
id: msbuild-property
language: xml
role: member
parentRuleIds: [msbuild-group]
symbolType: property
rule:
    kind: element
    pattern: _PROPERTY
    has: {kind: 'STag, EmptyElemTag', has: {kind: Name, pattern: _NAME}}
    inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, regex: '^PropertyGroup$'}}}}
transform:
    LINE: {replace: {source: $PROPERTY, replace: '\s*\n\s*', by: ' '}}
name: $NAME
signature: $LINE

---
id: msbuild-item
language: xml
role: member
parentRuleIds: [msbuild-group]
symbolType: variable
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        all:
            - has: {kind: Name, pattern: _NAME}
            - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^(Include|Update|Remove)$'}}, {has: {kind: AttValue, pattern: _VALUE}}]}
    inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, regex: '^ItemGroup$'}}}}
transform:
    SPEC: substring($VALUE, startChar=1, endChar=-1)
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
name: '$NAME $SPEC'
signature: $LINE

---
id: msbuild-target-group
language: xml
role: member
parentRuleIds: [msbuild-target]
symbolType: object
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        has: {kind: Name, regex: '^(PropertyGroup|ItemGroup)$'}
    inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, regex: '^Target$'}}}}
transform:
    LABELED: {replace: {source: $TAG, replace: '^<(\w+)(?:[\s\S]*\sLabel=["'']([^"'']*)["''])?[\s\S]*$', by: '$1 $2'}}
    NAME: {replace: {source: $LABELED, replace: '\s+$', by: ''}}
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
    HEADER: {replace: {source: $LINE, replace: '^<[^\s/>]+\s*/?>$', by: ''}}
name: $NAME
signature: $HEADER

---
id: msbuild-task
language: xml
role: member
parentRuleIds: [msbuild-target]
symbolType: method
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        has: {kind: Name, pattern: _NAME, not: {regex: '^(PropertyGroup|ItemGroup)$'}}
    inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, regex: '^Target$'}}}}
transform:
    LINE: {replace: {source: $TAG, replace: '\s*\n\s*', by: ' '}}
    HEADER: {replace: {source: $LINE, replace: '^<[^\s/>]+\s*/?>$', by: ''}}
name: $NAME
signature: $HEADER
