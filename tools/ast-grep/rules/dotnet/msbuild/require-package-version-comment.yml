# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-package-version-comment
language: xml
severity: error
files: ['Directory.Packages.props']
utils:
    trailing-comment:
        kind: element
        any:
            - precedes: {kind: Comment, regex: '^<!--[^\r\n]*-->$', not: {regex: '^<!--\s*-->$'}}
            - precedes: {kind: CharData, regex: '^[ \t]+$', precedes: {kind: Comment, regex: '^<!--[^\r\n]*-->$', not: {regex: '^<!--\s*-->$'}}}
rule:
    matches: {msbuild-element: {name: {regex: '^(PackageVersion|GlobalPackageReference)$'}}}
    not: {matches: trailing-comment}
message: The central package version row has no trailing one-line comment naming the package's purpose
note: Add <!-- purpose --> after the row on its line
