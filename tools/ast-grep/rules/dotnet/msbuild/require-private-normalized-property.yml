# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-normalized-property
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^[A-Za-z]'}}}
        - inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}}}
        - not: {inside: {matches: {msbuild-element: {name: {regex: '^ProjectExtensions$'}}}, stopBy: end}}
        - has:
            kind: content
            has:
                kind: CharData
                regex: "^\\s*\\$\\((\\[MSBuild\\]::(NormalizeDirectory|NormalizePath|EnsureTrailingSlash)|\\[System\\.IO\\.Path\\]::(GetFullPath|TrimEndingDirectorySeparator))\\(\\s*'?\\$\\([A-Za-z_][A-Za-z0-9_]*\\)'?\\s*\\)\\)\\s*$"
                not: {regex: '\(\s*''?\$\(MSBuild[A-Za-z0-9_]*\)'}
        - not:
            inside:
                kind: element
                stopBy: end
                has:
                    matches: msbuild-tag
                    has: {matches: {msbuild-attribute: {name: {regex: '^TreatAsLocalProperty$'}, value: {regex: '[^"''\s]'}}}}
message: Global property of the same name skips a public property's self-normalizing assignment
note: Assign the normalized value to a private property
