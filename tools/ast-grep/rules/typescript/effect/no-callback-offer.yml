# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-callback-offer
language: tsx
severity: error
utils:
    queue-module:
        matches: {syntax-import-reference: {source: {regex: '^effect(/Queue)?$'}, exported: {regex: '^Queue$'}}}
    constructor-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(make|unbounded|bounded|dropping|sliding)$'}
                - has: {field: object, matches: queue-module}
    queue-offer:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, matches: queue-module}}, {has: {field: property, regex: '^(offer|offerAll)$'}}]}
            - has: {field: arguments, has: {nthChild: 1, pattern: $QUEUE}}
    offer-call:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: object, matches: queue-module}}, {has: {field: property, regex: '^(offerUnsafe|offerAllUnsafe)$'}}]}
                - has: {field: arguments, has: {nthChild: 1, pattern: $QUEUE}}
            - all:
                - has:
                    field: function
                    kind: member_expression
                    all:
                        - has: {field: object, matches: effect-effect-module}
                        - has: {field: property, regex: '^(runFork|runSync|runPromise|runCallback)$'}
                - has: {field: arguments, has: {nthChild: 1, matches: queue-offer}}
rule:
    kind: variable_declarator
    all:
        - has: {field: name, kind: identifier, pattern: $QUEUE}
        - has: {field: value, any: [{matches: constructor-call}, {kind: yield_expression, has: {matches: constructor-call}}, {kind: await_expression, has: {matches: constructor-call}}]}
        - inside:
            kind: lexical_declaration
            inside:
                kind: statement_block
                has:
                    stopBy: end
                    matches: syntax-function-boundary
                    has: {stopBy: end, matches: offer-call}
message: 'Callback feeds `$QUEUE` outside the effect that built it'
note: '`Stream.callback((queue) => <registration>)` builds its queue and runs `<registration>` in the stream `Scope`, one release closes both'
