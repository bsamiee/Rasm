# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    properties-key:
        any:
            - kind: property_identifier
              regex: '^properties$'
            - kind: string, template_string
              regex: '^.properties.$'
    record:
        kind: object
        has: {kind: 'pair, shorthand_property_identifier, spread_element'}
rule:
    all:
        - any:
            - kind: assignment_expression
              has:
                field: left
                any:
                    - {kind: member_expression, has: {field: property, matches: properties-key}}
                    - {kind: subscript_expression, has: {field: index, matches: properties-key}}
            - kind: call_expression
              all:
                - has:
                    field: function
                    kind: member_expression
                    any:
                        - all: [{has: {field: property, regex: '^(set|defineProperty)$'}}, {has: {field: object, regex: '(^|\.)Reflect$', matches: typescript-global-member}}]
                        - all: [{has: {field: property, regex: '^defineProperty$'}}, {has: {field: object, regex: '(^|\.)Object$', matches: typescript-global-member}}]
                - has: {field: arguments, has: {nthChild: {position: 2, ofRule: &code {not: {kind: 'comment, html_comment'}}}, matches: properties-key}}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^assign$'}}, {has: {field: object, regex: '(^|\.)Object$', matches: typescript-global-member}}]}
                - has:
                    field: arguments
                    has:
                        kind: object
                        not: {nthChild: {position: 1, ofRule: *code}}
                        has:
                            any:
                                - {kind: pair, has: {field: key, matches: properties-key}}
                                - {kind: shorthand_property_identifier, regex: '^properties$'}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^add$'}, not: {has: {field: object, regex: '(^|\.)documents$'}}}
                - has: {field: arguments, has: {any: [{matches: record}, {matches: {typescript-constant-value: {value: {matches: record}}}}]}}
                - has:
                    field: function
                    has:
                        field: object
                        not:
                            any:
                                - matches: effect-namespace
                                - matches: {typescript-collection-receiver: {collection: {regex: '^(Weak)?Set$'}}}
        - inside: {kind: program, stopBy: end, matches: {typescript-module-importer: {module: {regex: '^(adobe:)?indesign$'}}}}
        - pattern: $WRITE
transform:
    HEAD: {replace: {source: $WRITE, replace: '(?s)^([^(=]+?)[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*[(=].*$', by: '$1'}}
message: '`$HEAD` sets keys from a record and drops each refused key with no error'
note: 'Pass required `add` arguments, then apply one-key `Object.assign` calls through `Effect.validate`, restoring temporary writes through `Effect.acquireRelease`'
