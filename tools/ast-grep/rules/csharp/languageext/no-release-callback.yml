# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
utils:
    disposable:
        matches: {csharp-type-name: {name: {regex: '^IDisposable$'}}}
    unit-type:
        matches: {csharp-type-name: {name: {regex: '^Unit$'}}}
rule:
    kind: generic_name
    pattern: $TYPE
    any:
        - all:
            - has: {kind: identifier, regex: '^Action$'}
            - has: {kind: type_argument_list, has: {nthChild: 1, matches: disposable}, not: {has: {nthChild: 2}}}
        - all:
            - has: {kind: identifier, regex: '^Func$'}
            - has:
                kind: type_argument_list
                all:
                    - has: {nthChild: 1, matches: disposable}
                    - has:
                        nthChild: 2
                        any:
                            - matches: unit-type
                            - matches: {csharp-generic-type: {name: {regex: '^IO$'}, list: {has: {nthChild: 1, matches: unit-type}}}}
                    - not: {has: {nthChild: 3}}
message: '`$TYPE` passes a release callback'
note: 'Acquire through `use` and release at the owning operation''s `Bracket`, lifetime-long acquisitions run on owner''s `EnvIO`'
