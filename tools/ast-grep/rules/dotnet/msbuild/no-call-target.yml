# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-call-target
language: xml
severity: error
rule:
    pattern: _TARGET
    matches: {msbuild-element: {name: {regex: '^Target$'}}}
    has: {kind: content, has: {matches: {msbuild-element: {name: {regex: '^CallTarget$'}}}}}
transform:
    MOVED:
        replace:
            source: $TARGET
            replace: '(?s)^<Target\b(?P<attrs>[^<]*?)>(?P<ws>\s*)<CallTarget\s+Targets\s*=\s*["''](?P<t>[^"'']*)["'']\s*/>\s*'
            by: '<Target${attrs}@@${t}@@>${ws}'
    APPENDED:
        replace:
            source: $MOVED
            replace: '(?s)^(<Target\b[^<]*?\bDependsOnTargets\s*=\s*")([^"]*)("[^@<]*)@@([^@]*)@@'
            by: '${1}${2};${4}${3}'
    ATTACHED: {replace: {source: $APPENDED, replace: '@@([^@]*)@@', by: ' DependsOnTargets="${1}"'}}
fix: $ATTACHED
message: 'CallTarget runs the target in a new scope, the form of the dependency named in DependsOnTargets'
note: 'Properties and items of the called target reach the caller after the calling target finishes'
