# --- [UV] -------------------------------------------------------------------------------

[tool.uv.sources]
connectrpc = { url = "https://github.com/connectrpc/connect-py/archive/be6c9335e7dbcd1ccdda66e4d19d33a87210dd0d.tar.gz" }  # Published Connect pins protobuf-py 0.1.1, the upstream archive holds the runtime and generator pair on protobuf-py 0.3
protoc-gen-connectrpc = { url = "https://github.com/connectrpc/connect-py/archive/be6c9335e7dbcd1ccdda66e4d19d33a87210dd0d.tar.gz", subdirectory = "protoc-gen-connectrpc" }

[tool.uv] # mise installs the interpreter, uv never downloads one, and the lock solves the four platforms alone and fails when one lacks a wheel
default-groups = "all"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
prerelease = "allow"
cache-dir = ".cache/uv"
python-preference = "only-system"

[tool.uv.extra-build-variables] # opencolorio reads CMAKE_ARGS from the environment, OCIO_BUILD_APPS=OFF skips app helpers broken under the macOS 26 SDK
opencolorio = { CMAKE_ARGS = "-DOCIO_BUILD_APPS=OFF" }

[tool.uv.extra-build-dependencies] # rhino3dm publishes no wheel and its setup.py needs a cmake executable in the build environment
rhino3dm = ["cmake"]

[[tool.uv.dependency-metadata]] # colour-cxf 0.1.1 declares Requires-Python <3.14, corrected metadata removes the bound and keeps the runtime dependencies
name = "colour-cxf"
version = "0.1.1"
requires-python = ">=3.10"
requires-dist = ["typing-extensions<5,>=4", "xsdata>25.4"]

[[tool.uv.dependency-metadata]] # colour-science 0.4.7 declares Requires-Python <3.15, corrected metadata removes the bound and keeps the dependency set
name = "colour-science"
version = "0.4.7"
requires-python = ">=3.11"
requires-dist = [
    "numpy<3,>=2.0.0",
    "biblib-simple; extra == 'docs'",
    "pydata-sphinx-theme; extra == 'docs'",
    "restructuredtext-lint; extra == 'docs'",
    "sphinx; extra == 'docs'",
    "sphinxcontrib-bibtex; extra == 'docs'",
    "trimesh<5,>=4; extra == 'meshing'",
    "imageio<3,>=2; extra == 'optional'",
    "matplotlib>=3.9; extra == 'optional'",
    "networkx<4,>=3.3; extra == 'optional'",
    "opencolorio<3,>=2; python_version < '3.14' and extra == 'optional'",
    "openimageio<4,>=3; extra == 'optional'",
    "pandas<3,>=2.2; extra == 'optional'",
    "pydot<4,>=3; extra == 'optional'",
    "scipy<2,>=1.13.0; extra == 'optional'",
    "tqdm<5,>=4; extra == 'optional'",
    "xxhash<4,>=3; extra == 'optional'",
]
provides-extras = ["docs", "meshing", "optional"]

[[tool.uv.dependency-metadata]] # pytensor 2.35.1 predates the numba requirement, corrected metadata removes its Requires-Python <3.14 bound
name = "pytensor"
version = "2.35.1"
requires-python = ">=3.11"
requires-dist = [
    "setuptools>=59.0.0",
    "scipy<2,>=1",
    "numpy>=2.0",
    "filelock>=3.15",
    "etuples",
    "logical-unification",
    "miniKanren",
    "cons",
    "jax; extra == 'jax'",
    "jaxlib; extra == 'jax'",
    "numba>=0.57; extra == 'numba'",
    "llvmlite; extra == 'numba'",
]
provides-extras = ["jax", "numba"]

[[tool.uv.dependency-metadata]] # Substrait 0.31.0 declares Requires-Python <3.15 on a pure-Python wheel, corrected metadata removes it
name = "substrait"
version = "0.31.0"
requires-python = ">=3.10"
requires-dist = [
    "protobuf<7,>=5",
    "substrait-protobuf==0.99.0",
    "substrait-extensions==0.99.0",
    "substrait-antlr==0.99.0; extra == 'extensions'",
    "pyyaml; extra == 'extensions'",
    "sqloxide; extra == 'sql'",
    "deepdiff; extra == 'sql'",
]
provides-extras = ["extensions", "sql"]

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
cache-dir = ".cache/ruff"
preview = true
line-length = 150
target-version = "py315"
src = [".", "libs/python"]  # Import roots, a package under libs/python imports by its directory name

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- [FORMATTER]
    "missing-trailing-comma",                     # ruff format sets trailing commas
    "single-line-implicit-string-concatenation",  # ruff format joins implicit string concatenation
    # --- [MATCH_DISPATCH]
    "unnecessary-assign",                         # Named intermediates keep flow pipelines readable
    "superfluous-else-return",                    # Explicit match statements keep exhaustive cases visible
    "superfluous-else-raise",                     # Explicit error cases keep Result handling visible
    "if-else-block-instead-of-if-exp",            # Match statements dispatch, ternaries stay out
    "if-with-same-arms",                          # Use match/case for explicit dispatch
    # --- [DENSITY]
    "too-many-return-statements",                 # Exhaustive matches over closed tagged unions return from each case
    "too-many-branches",                          # Exhaustive dispatch needs one branch per case
    "too-many-locals",                            # Dispatch functions hold many local values
    "too-many-statements",                        # Exhaustive dispatch exceeds the statement limit
    "too-many-boolean-expressions",               # Dispatch predicates exceed the generic expression limit
    # --- [ERROR_RAISING]
    "raw-string-in-exception",                    # Exception constructors receive literal messages directly
    "f-string-in-exception",                      # Exception constructors receive formatted context directly
    "raise-vanilla-args",                         # Exception constructors include descriptive messages
    "raise-within-try",                           # `@safe` boundary adapters raise inside the guarded call
    "error-instead-of-exception",                 # Structlog `.error()` is valid outside exception handlers
    # --- [TYPE_RESOLUTION]
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    # --- [DOCSTRINGS]
    "docstring-extraneous-exception",             # Raises sections document propagated helper exceptions, DOC501 still requires direct raises
    # --- [SEMANTIC_ORDER]
    "unsorted-dunder-all",                        # Public API order follows domain semantics
    "unsorted-dunder-slots",                      # Slot order follows domain semantics
    # --- [WORKFLOW]
    "missing-todo-link",                          # TODO notes need no link
    "line-contains-todo",                         # TODO comments are accepted source markers
    "implicit-namespace-package",                 # Monorepo packages are implicit namespaces
    "missing-copyright-notice",                   # The root LICENSE holds the copyright notice
    # --- [SECTION_DIVIDERS]
    "commented-out-code",                         # `# --- [LABEL]` subsection dividers mark source sections
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"**/.claude/**" = [
    "banned-api",
    "boolean-type-hint-positional-argument",
    "complex-structure",
    "hardcoded-password-string",
    "literal-membership",
    "os-getcwd",
    "shebang-not-executable",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/**" = [
    "assert",
    "pytest-composite-assertion",
    "magic-value-comparison",
    "too-many-arguments",
    "unused-function-argument",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "private-member-access",
    "import-private-name",
]  # Tests import private names of the support package
"**/conftest.py" = ["module-import-not-at-top-of-file"]
"tests/python/support/runtime.py" = ["module-import-not-at-top-of-file"]  # Hypothesis environment configuration must precede imports

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "beartype.BeartypeConf",
    "msgspec.Meta",
    "msgspec.field",
    "pydantic.ConfigDict",
    "pydantic.Field",
    "pydantic.PrivateAttr",
    "stamina.retry",
]

[tool.ruff.lint.flake8-builtins]
ignorelist = [
    "format",
    "hash",
    "id",
    "input",
    "list",
    "quit",
    "type",
]  # A handler's name is the CLI subcommand the registry dispatches on

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"dask.array" = "da"
"dask.dataframe" = "dd"
"scipy" = "sp"
"sympy" = "sym"
"xarray" = "xr"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"
raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError", "pydantic.ValidationError"]

[tool.ruff.lint.flake8-self]
extend-ignore-names = ["_validate", "_disc", "_check", "_value_"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
require-lazy = [ # Modules loaded through lazy-import proxies, TID254 rejects their eager imports, and license-isolation bans stay in banned-api
    "adbc_driver_flightsql",
    "adbc_driver_snowflake",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "xarray",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"concurrent.futures.ProcessPoolExecutor".msg = "Use anyio.to_process.run_sync(), structured concurrency with cancellation"
"concurrent.futures.ThreadPoolExecutor".msg = "Use anyio.to_thread.run_sync() with CapacityLimiter, structured concurrency"
"abc.ABC".msg = "Use typing.Protocol, structural subtyping"
"abc.abstractmethod".msg = "Use typing.Protocol, structural subtyping replaces nominal"
"asyncio".msg = "Use anyio, it has equivalents for run, sleep, gather, Lock, Event, Semaphore, and Queue"
"collections.namedtuple".msg = "Use pydantic BaseModel(frozen=True) or msgspec.Struct(frozen=True), namedtuple lacks runtime validation"
"contextlib.suppress".msg = "Use Result values or a marked boundary adapter, suppress hides fallibility"
"http.client".msg = "Use httpx behind a validated adapter, direct stdlib HTTP bypasses timeout, retry, and observability policy"
"json.dump".msg = "Use Path.write_bytes(msgspec.json.encode(obj)), C-accelerated, struct-aware serialization"
"json.dumps".msg = "Use msgspec.json.encode(), C-accelerated with gc=False struct support"
"json.JSONDecoder".msg = "Use msgspec.json.Decoder(type=T), schema-validated, zero-copy deserialization"
"json.JSONEncoder".msg = "Use msgspec.json.Encoder(enc_hook=fn), custom serialization through a hook"
"json.load".msg = "Use msgspec.json.decode(Path.read_bytes(), type=T), schema-validated, zero-copy"
"json.loads".msg = "Use msgspec.json.decode(buf, type=T), schema-validated, zero-copy deserialization"
"logging.basicConfig".msg = "Use structlog with OpenTelemetry, which configures the logging pipeline"
"logging.critical".msg = "Use structlog.get_logger().critical(), stdlib root logger bypasses structured pipeline"
"logging.debug".msg = "Use structlog.get_logger().debug(), stdlib root logger bypasses structured pipeline"
"logging.error".msg = "Use structlog.get_logger().error(), stdlib root logger bypasses structured pipeline"
"logging.exception".msg = "Use structlog.get_logger().exception(), stdlib root logger bypasses structured pipeline"
"logging.getLogger".msg = "Use structlog.get_logger(), stdlib logging bypasses structured pipeline"
"logging.info".msg = "Use structlog.get_logger().info(), stdlib root logger bypasses structured pipeline"
"logging.warning".msg = "Use structlog.get_logger().warning(), stdlib root logger bypasses structured pipeline"
"os.environ".msg = "Use pydantic-settings BaseSettings, validated typed configuration"
"os.getenv".msg = "Use pydantic-settings BaseSettings, validated typed configuration at startup"
"pydantic.validator".msg = "Use @field_validator or @model_validator, pydantic.validator is the deprecated 1.x API"
"requests".msg = "Use httpx behind a typed adapter, the approved transport API"
"returns".msg = "Use expression.Result / expression.Option, the approved Result library"
"returns.maybe".msg = "Use expression.Result / expression.Option, the approved Result library"
"returns.result".msg = "Use expression.Result / expression.Option, the approved Result library"
"socket.create_connection".msg = "Use anyio networking or httpx adapters with explicit deadlines, direct sockets bypass boundary policy"
"socket.create_server".msg = "Use anyio networking with explicit lifecycle ownership, direct sockets bypass boundary policy"
"socket.socket".msg = "Use anyio networking or a marked boundary adapter, raw sockets bypass deadline and observability policy"
"subprocess.call".msg = "Use anyio.run_process(), async, cancellation-aware, structured concurrency"
"subprocess.check_call".msg = "Use anyio.run_process(), async, cancellation-aware, structured concurrency"
"subprocess.check_output".msg = "Use anyio.run_process(), async, cancellation-aware, structured concurrency"
"subprocess.Popen".msg = "Use anyio.open_process(), async process handle with structured teardown"
"subprocess.run".msg = "Use anyio.run_process(), async, cancellation-aware, structured concurrency"
"time.sleep".msg = "Use anyio.sleep(), time.sleep blocks the event loop thread"
"traceback.print_exc".msg = "Use structlog.get_logger().exception(), traceback.print_exc leaks to stderr"
"typing.Any".msg = "Use precise type parameters or object at validated boundaries, Any requires explicit boundary justification"
"typing.ParamSpec".msg = "Use PEP 695 decorator parameters (**P)"
"typing.TypeAlias".msg = "Use PEP 695 type aliases (`type Name = ...`)"
"typing.TypeGuard".msg = "Use TypeIs, it narrows both branches"
"typing.TypeVar".msg = "Use PEP 695 type parameters"
"typing.TypeVarTuple".msg = "Use PEP 695 variadic type parameters"
"typing.cast".msg = "Use TypeGuard/TypeIs, validated adapters, or pattern narrowing, cast erases checker evidence"
"typing.NamedTuple".msg = "Use pydantic BaseModel(frozen=True) or msgspec.Struct(frozen=True), NamedTuple lacks runtime validation"
"typing.no_type_check".msg = "Use a typed boundary adapter or refine the signature, static type checking is mandatory"
"typing.Optional".msg = "Use Result or Option for fallibility and T | None for non-fallible absence"
"typing_extensions.Any".msg = "Use precise type parameters or object at validated boundaries, Any requires explicit boundary justification"
"typing_extensions.cast".msg = "Use TypeGuard/TypeIs, validated adapters, or pattern narrowing, cast erases checker evidence"
"typing_extensions.deprecated".msg = "Refactor the API, the workspace has no deprecation markers"
"typing_extensions.Optional".msg = "Use Result or Option for fallibility and T | None for non-fallible absence"
"typing_extensions.ParamSpec".msg = "Use PEP 695 decorator parameters (**P)"
"typing_extensions.TypeAlias".msg = "Use PEP 695 type aliases (`type Name = ...`)"
"typing_extensions.TypeGuard".msg = "Use TypeIs, it narrows both branches"
"typing_extensions.TypeVar".msg = "Use PEP 695 type parameters"
"typing_extensions.TypeVarTuple".msg = "Use PEP 695 variadic type parameters"
"urllib.request".msg = "Use httpx behind a typed adapter, direct urllib imports bypass transport policy"
"urllib3".msg = "Use httpx behind a typed adapter, urllib3 stays a transitive dependency"
"warnings.catch_warnings".msg = "Refactor the path, the workspace has no deprecation or workaround warnings"
"warnings.deprecated".msg = "Refactor the API, the workspace has no deprecation markers"
"warnings.filterwarnings".msg = "Remove the deprecated path, warnings stay unfiltered"
"warnings.simplefilter".msg = "Remove the deprecated path, warnings stay unfiltered"
"warnings.warn".msg = "Refactor the path, the workspace has no deprecation or workaround warnings"
"warnings.warn_explicit".msg = "Refactor the path, the workspace has no deprecation or workaround warnings"

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = ["typing", "typing_extensions"]
runtime-evaluated-base-classes = ["msgspec.Struct", "pydantic.BaseModel", "pydantic.RootModel", "pydantic_settings.BaseSettings"]
runtime-evaluated-decorators = [
    "beartype.beartype",
    "pydantic.computed_field",
    "pydantic.field_validator",
    "pydantic.model_validator",
    "pydantic.validate_call",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["rasm"]
order-by-type = false
split-on-trailing-comma = false  # Matches skip-magic-trailing-comma in ruff format

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator", "pydantic.model_validator"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-line-length = 300  # E501 ceiling for prose lines, the formatter wraps code at `line-length`

[tool.ruff.lint.pydocstyle]
ignore-var-parameters = true
convention = "google"
ignore-decorators = ["typing.overload", "typing.override"]
property-decorators = ["pydantic.computed_field"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true  # Private helpers keep one-line docstrings without Returns or Raises sections, pydoclint has no visibility filter

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__get_pydantic_core_schema__", "__get_pydantic_json_schema__"]
allow-magic-value-types = ["str", "bytes", "int"]
max-args = 8
max-nested-blocks = 4
max-public-methods = 10

# --- [TY] -------------------------------------------------------------------------------

[tool.ty.environment]
python-platform = "all"
root = [".", "libs/python"]  # Import roots, the pythonpath rows of the pytest table

[tool.ty.analysis]
respect-type-ignore-comments = false  # mypy keeps `type: ignore`, ty reads `ty: ignore` alone

[tool.ty.rules] # Every rule is an error, the three ignored rules reject `Any` and `Unknown` that the expression and Hypothesis signatures produce
all = "error"
dynamic-function-decorator-return = "ignore"
unsound-assignment = "ignore"
unsound-return-statement = "ignore"

# --- [MYPY] -----------------------------------------------------------------------------

[tool.mypy]
files = ["eng", "tests"]
mypy_path = ["libs/python"]
cache_dir = ".cache/mypy"
strict = true
pretty = true
warn_unreachable = true
explicit_package_bases = true
exclude_gitignore = true
disallow_any_explicit = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
disable_error_code = ["prop-decorator"]  # mypy cannot model pydantic computed_field over @property, ty checks the same construct

[tool.pydantic-mypy] # The generated pydantic __init__ holds Any unless both init options are set, which disallow_any_explicit then rejects
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]] # tests/** passes under ty, the overrides isolate mypy limitations around TypeForm, sentinels, Callable, match, and constructor narrowing
module = "tests.*"
disallow_any_explicit = false
disallow_any_unimported = false
warn_unreachable = false
disable_error_code = ["func-returns-value", "attr-defined", "type-arg", "override", "arg-type"]

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*", "honeybee_energy.*", "s3fs"]  # fsspec, honeybee-energy, and s3fs have no py.typed and no stub package
ignore_missing_imports = true

# --- [PYTEST] ---------------------------------------------------------------------------

[tool.pytest] # pytest-benchmark disables itself under pytest-xdist, -n stays out of addopts and the benchmark configuration passes -m benchmark
strict = true
cache_dir = ".cache/pytest"
testpaths = ["tests"]
pythonpath = [".", "libs/python"]  # Repository modules resolve from the root, a package under libs/python imports by its directory name
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
collect_imported_tests = false
empty_parameter_set_mark = "fail_at_collect"
addopts = [
    "-p",
    "tests.python.support.runtime",  # Test-support plugin for Hypothesis profiles, OpenTelemetry fixtures, and automatic markers
    "-p",
    "no:zarr",                       # zarr and pointblank register pytest plugins for their own suites, loading them imports both at startup
    "-p",
    "no:pointblank",
    "-x",
    "--tb=short",
    "--import-mode=importlib",
    "-m",
    "not benchmark",
    "--disable-socket",
    "--allow-unix-socket",
    "--benchmark-storage=file://.artifacts/python/benchmarks",
    "--benchmark-autosave",          # Saves benchmark history only when benchmarks run
]
filterwarnings = [
    "error",
    "ignore:Not saving anything:pytest_benchmark.logger.PytestBenchmarkWarning",  # Autosave no-op in sessions with deselected benchmarks
]
timeout = "30"  # pytest-timeout registers the option as a string, pytest 9 TOML mode rejects a native int
required_plugins = [
    "anyio",
    "hypothesis",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-timeout",
    "pytest-xdist",
]
markers = [
    "benchmark: benchmark measurement tests",
    "network: tests that need real INET sockets (loopback servers or outbound connections)",
    "property: property-based tests",
    "subprocess: tests that spawn the real CLI in a child interpreter",
]

# --- [COVERAGE] -------------------------------------------------------------------------

[tool.coverage.run]
branch = true
relative_files = true  # Subprocess coverage combines through relative repository paths
data_file = ".artifacts/python/coverage/data/.coverage"  # The root coverage target combines the per-project files beside it
source = ["eng/scripts", "libs/python", "tests/python/support"]  # --cov without a value measures these trees
patch = ["subprocess"]  # Child processes measure themselves into parallel data files the reporting commands combine

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "assert_never\\(", "\\.\\.\\.$", "if __name__ == .__main__.:"]

[tool.coverage.xml]
output = ".artifacts/python/coverage/coverage.xml"

[tool.coverage.lcov]
output = ".artifacts/python/coverage/coverage.lcov"
