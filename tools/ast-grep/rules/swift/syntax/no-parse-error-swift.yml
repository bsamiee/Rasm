# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-swift
language: swiftlang
severity: error
rule:
    any:
        - kind: ERROR
          not: &nested {inside: {kind: ERROR, stopBy: end}}
        - kind: source_file
          has: {stopBy: end, all: [{regex: '^$'}, {pattern: $$MISSING}, {not: *nested}]}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: Fix invalid syntax or update ast-grep
