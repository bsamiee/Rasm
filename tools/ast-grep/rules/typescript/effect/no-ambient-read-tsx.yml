# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    service:
        any:
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Clock$'}, member: {regex: '^Clock$'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Random$'}, member: {regex: '^Random$'}}}
    service-type:
        any:
            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Clock$'}, member: {regex: '^Clock$'}}}
            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Random$'}, member: {regex: '^Random$'}}}
    service-key:
        any:
            - matches: service
            - kind: identifier
              matches: {typescript-import-reference: {source: {regex: '^effect/(Clock|Random)$'}, exported: {regex: '^(Clock|Random)$'}}}
    service-implementation:
        pattern: $_
        any:
            - inside: {kind: arguments}
              follows: {stopBy: end, matches: service-key}
            - inside:
                kind: arguments
                inside: {kind: call_expression, has: {field: function, kind: call_expression, has: {field: arguments, has: {matches: service-key}}}}
            - inside:
                kind: variable_declarator
                field: value
                has: {field: type, has: {stopBy: end, matches: service-type}}
    host-member:
        regex: '^(getRandomValues|hrtime|randomBytes|randomFill|randomFillSync|randomInt|randomUUID|randomUUIDv7|uptime)$'
    imported:
        any: [{kind: member_expression}, {kind: identifier, matches: host-member}]
        matches: {typescript-import-reference: {source: {regex: '^(node:)?(crypto|os|process)$'}, exported: {matches: host-member}}}
    ambient-reference:
        any:
            - matches: typescript-global-reference
              regex: '^((globalThis|window|self)\.)?(Date\.now|Temporal\.Now\.[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+|Math\.random|crypto\.(randomUUID|getRandomValues)|performance\.(now|timeOrigin)|process\.hrtime(\.bigint)?|process\.uptime)$'
            - matches: imported
            - kind: member_expression
              all:
                - has: {field: property, regex: '^bigint$'}
                - has: {field: object, matches: imported}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(now|timeOrigin)$'}
                - has: {field: object, matches: {typescript-import-reference: {source: {regex: '^(node:)?perf_hooks$'}, exported: {regex: '^performance$'}}}}
rule:
    pattern: $READ
    any:
        - matches: ambient-reference
          not:
            any:
                - inside: {kind: member_expression, field: object}
                - inside: {kind: import_specifier}
                - all:
                    - regex: '^((globalThis|window|self)\.)?(Date\.now|Math\.random|crypto\.randomUUID)$'
                    - inside: {kind: call_expression, field: function}
        - kind: call_expression
          has: {field: function, regex: '^((globalThis|window|self)\.)?Date$', matches: typescript-global-reference}
        - kind: import_specifier
          all:
            - has: {field: alias, kind: identifier}
            - has: {field: name, matches: host-member}
            - inside: {kind: import_statement, stopBy: end, has: {field: source, regex: '^.(node:)?(crypto|os|process).$'}}
    not: {inside: {matches: service-implementation, stopBy: end}}
message: '`$READ` reads host time or randomness as an ambient value'
note: 'Read time from `Clock` or `DateTime.now` and randomness from `Random`, or take the value as a parameter'
labels:
    READ: {style: primary}
