# --- [BOOTSTRAP] ------------------------------------------------------------------------

# --- [FILES]

[bootstrap.files."/etc/apt/apt.conf.d/53unattended-upgrades-runner"]
content = '''
Unattended-Upgrade::Automatic-Reboot "false";
'''

[bootstrap.files."/etc/needrestart/conf.d/actions_runner_services.conf"]
content = '''
$nrconf{override_rc}{qr(^actions\.runner\..+\.service$)} = 0;
'''

[bootstrap.files."/etc/systemd/system/reboot-when-idle.service"]
content = """
[Unit]
Description=Reboot after updates when no runner of this machine is running a job
ConditionPathExists=/run/reboot-required
[Service]
Type=oneshot
ExecStart=/bin/bash -c 'pgrep -x Runner.Worker >/dev/null || exec systemctl reboot; echo "Reboot deferred, a Runner.Worker job is running"'
"""
notify  = ["reboot-when-idle.timer"]

[bootstrap.files."/etc/systemd/system/reboot-when-idle.timer"]
content = """
[Unit]
Description=Hourly check for updates that require a reboot
[Timer]
OnCalendar=hourly
[Install]
WantedBy=timers.target
"""
notify  = ["reboot-when-idle.timer"]

# --- [GROUPS]

[bootstrap.groups.docker]
system = true

[bootstrap.groups.runner]
# --- [PACKAGES]

[bootstrap.packages]
"apt:jq" = "latest"

# --- [SERVICES]

[bootstrap.services]
"reboot-when-idle.timer" = {}

# --- [USERS]

[bootstrap.users.runner]
create_home = true
group       = "runner"
groups      = ["docker"]
shell       = "/bin/bash"
uid         = 1000
