# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    result:
        kind: generic_type
        has: {field: type, regex: '(^|::)Result$'}
    option:
        kind: generic_type
        has: {field: type, regex: '^(((std|core)::)?option::)?Option$'}
    nested:
        any:
            - matches: result
              has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: result}}
            - matches: result
              has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: option, has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: result}}}}
            - matches: option
              has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: result, has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: option}}}}
rule:
    kind: generic_type
    all:
        - any: [{matches: nested}, {has: {stopBy: end, matches: nested}}]
        - any:
            - inside: {kind: 'function_item, function_signature_item, closure_expression', field: return_type}
            - inside: {kind: 'parameter, field_declaration, type_item, let_declaration', field: type}
        - not: {inside: {stopBy: end, matches: rust-trait-impl-or-extern-function}}
        - pattern: $TYPE
message: '`$TYPE` nests `Result` in `Result` or between two `Option` layers'
note: 'Flatten the type into one `Result<<value>, <error>>` with an error variant per cause, or an enum with a variant per outcome'
