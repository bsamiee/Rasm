# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
files: ['**/main.ts', '**/main.tsx']
ignores: ['tests/**']
rule:
    kind: export_statement
    all:
        - inside: {kind: program}
        - not: {regex: '^export[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+default(?-u:\b)'}
message: 'Program root exports a value'
note: 'Move the value into a module beside `main.ts` and import it there, `main.ts` holding composition and run'
