# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-suffix-variant
language: tsx
severity: error
rule:
    pattern: $NAME
    any:
        # Name of a binding, function, method, signature, object member, or assigned member, a callee's member name belongs to its package
        - {kind: identifier, inside: {kind: variable_declarator, field: name}}
        - {kind: identifier, inside: {kind: function_declaration, field: name}}
        - {kind: property_identifier, inside: {any: [{kind: method_definition}, {kind: public_field_definition}], field: name}}
        - {kind: private_property_identifier, inside: {any: [{kind: method_definition}, {kind: public_field_definition}], field: name}}
        - {kind: property_identifier, inside: {any: [{kind: method_signature}, {kind: abstract_method_signature}, {kind: property_signature}], field: name}}
        - {kind: property_identifier, inside: {kind: pair, field: key}}
        - {kind: property_identifier, inside: {kind: member_expression, field: property, inside: {kind: assignment_expression, field: left}}}
constraints:
    # Many, All, and ByIds suffixes, and a verb over a By clause with or without a noun between, the grammar of one operation split by its input
    NAME:
        regex: "^#?(\\w+(Many|All|ByIds)|(get|list|find|fetch|load|read|put|delete|remove|update|count|search|select|query|resolve|lookup|filter|\
            save|insert|upsert|create|set)([A-Z]\\w*)?By[A-Z]\\w*)$"
message: '`$NAME` is a variant of one operation named by its suffix'
note: Collapse the variants into one function that discriminates on the shape of its input, and a data-first and data-last pair is one `Function.dual`
labels:
    NAME: {style: primary, message: The variant name}
