# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    valued-return:
        kind: return_expression
        has: {pattern: $_}
    early-return:
        matches: {rust-single-statement: {first: {any: [{matches: valued-return}, {kind: expression_statement, has: {matches: valued-return}}]}}}
    tail:
        nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'line_comment, block_comment'}}}
        not: {kind: 'expression_statement, let_declaration, empty_statement, line_comment, block_comment, function_item, use_declaration, const_item, static_item, macro_invocation'}
    guard:
        kind: if_expression
        all:
            - not: {has: {field: alternative, pattern: $_}}
            - has: {field: consequence, matches: early-return}
    plain-condition:
        kind: if_expression
        has: {field: condition, not: {kind: 'let_condition, let_chain'}}
    some-early:
        kind: if_expression
        has: {field: consequence, has: {stopBy: end, matches: valued-return, has: {pattern: 'Some($X)'}}}
    none-early:
        kind: if_expression
        has: {field: consequence, has: {stopBy: end, matches: valued-return, has: {pattern: None}}}
    value-early:
        kind: if_expression
        has: {field: consequence, has: {stopBy: end, matches: valued-return, has: {pattern: $_}}}
    borrowed:
        kind: identifier
        any:
            - inside: {stopBy: end, kind: 'function_item, closure_expression', has: {field: parameters, has: {kind: parameter, all: [{has: {field: pattern, pattern: $R}}, {has: {field: type, kind: reference_type}}]}}}
            - inside: {stopBy: end, kind: block, has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $R}}, {any: [{has: {field: type, kind: reference_type}}, {has: {field: value, kind: reference_expression}}]}]}}
    subject:
        not: {any: [{kind: 'reference_expression, unary_expression'}, {matches: borrowed}]}
    plain-arm:
        kind: match_pattern
        not: {has: {field: condition, pattern: $_}}
    converted:
        any:
            - pattern: $E.into()
            - pattern: Into::into($E)
            - pattern: From::from($E)
    mapped-error:
        all:
            - not: {pattern: $E}
            - not: {matches: converted}
            - has: {stopBy: end, pattern: $E}
    closure-safe:
        not:
            any:
                - matches: rust-diverging
                - kind: 'await_expression, try_expression'
                - has: {stopBy: {matches: rust-return-boundary}, kind: 'await_expression, break_expression, continue_expression, return_expression, become_expression'}
                - has: {stopBy: {matches: rust-try-boundary}, kind: 'try_expression, yeet_expression'}
    returned-error:
        kind: return_expression
        has: {kind: call_expression, all: [{has: {field: function, regex: '^Err$'}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $RET, matches: mapped-error}}}]}
    ok-binding:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^(\p{XID_Continue}+::)*Ok$'}
            - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $V}
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
    err-binding:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^(\p{XID_Continue}+::)*Err$'}
            - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $E}
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
    ok-arm:
        kind: match_arm
        has: {field: pattern, matches: plain-arm, has: {matches: ok-binding}}
    err-arm:
        kind: match_arm
        has: {field: pattern, matches: plain-arm, has: {matches: err-binding}}
    two-arms:
        kind: match_block
        all:
            - has: {matches: ok-arm}
            - has: {matches: err-arm}
            - not: {has: {kind: match_arm, nthChild: {position: 3, ofRule: {kind: match_arm}}}}
    ok-wrap:
        kind: call_expression
        all:
            - has: {field: function, regex: '^Ok$'}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $A}}
    err-wrap:
        kind: call_expression
        all:
            - has: {field: function, regex: '^Err$'}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $B}}
    mapping-match:
        kind: match_expression
        all:
            - has: {field: value, pattern: $R, matches: subject}
            - has: {field: body, matches: two-arms}
            - not: {matches: rust-const-context}
    err-guard:
        kind: expression_statement
        all:
            - inside: {kind: block, inside: {kind: 'function_item, closure_expression'}}
            - has:
                kind: if_expression
                all:
                    - not: {has: {field: alternative, pattern: $_}}
                    - has: {field: condition, kind: let_condition, all: [{has: {field: pattern, matches: err-binding}}, {has: {field: value, pattern: $R, matches: subject}}]}
                    - has: {field: consequence, kind: block, all: [{has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, any: [{matches: returned-error}, {kind: expression_statement, has: {matches: returned-error}}]}}, {not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}}]}
            - not: {matches: rust-const-context}
            - not: {precedes: {stopBy: end, any: [{kind: identifier, pattern: $R}, {has: {stopBy: end, kind: identifier, pattern: $R}}]}}
rule:
    all:
        - any:
            - matches: err-guard
            - all:
                - matches: mapping-match
                - has:
                    field: body
                    any:
                        - all:
                            - has: {matches: ok-arm, has: {field: value, kind: identifier, pattern: $V}}
                            - has: {matches: err-arm, has: {field: value, matches: returned-error}}
                        - all:
                            - has: {matches: ok-arm, has: {field: value, matches: ok-wrap, has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, not: {pattern: $V}, has: {stopBy: end, pattern: $V}}}}}
                            - has: {matches: err-arm, has: {field: value, matches: err-wrap, has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: mapped-error}}}}
                        - all:
                            - has: {matches: ok-arm, has: {field: value, matches: ok-wrap, has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, not: {pattern: $V}, has: {stopBy: end, pattern: $V}}}}}
                            - has: {matches: err-arm, has: {field: value, kind: call_expression, all: [{has: {field: function, regex: '^Err$'}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $E}}}]}}
                        - all:
                            - has: {matches: ok-arm, has: {field: value, kind: call_expression, all: [{has: {field: function, regex: '^Ok$'}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $V}}}]}}
                            - has: {matches: err-arm, has: {field: value, matches: err-wrap, has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: mapped-error}}}}
            - kind: expression_statement
              all:
                - inside: {kind: block, inside: {kind: 'function_item, closure_expression'}}
                - not: {all: [{nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}}, {inside: {kind: block, inside: {kind: closure_expression, field: body}}}]}
                - has: {matches: guard}
                - any:
                    - all:
                        - has: {matches: some-early}
                        - precedes: {matches: tail, pattern: None}
                        - has: {matches: plain-condition}
                        - not: {matches: rust-const-context}
                    - all:
                        - has: {matches: none-early}
                        - precedes: {matches: tail, pattern: 'Some($X)'}
                        - has: {matches: plain-condition}
                        - not: {matches: rust-const-context}
                    - all:
                        - has: {matches: value-early}
                        - precedes: {matches: tail}
        - any:
            - has: {field: value, pattern: $SUBJECT}
            - has: {kind: if_expression, has: {field: condition, any: [{kind: let_condition, has: {field: value, pattern: $SUBJECT}}, {pattern: $SUBJECT}]}}
constraints:
    A: {matches: closure-safe}
    B: {matches: closure-safe}
    RET: {matches: closure-safe}
    X: {matches: closure-safe}
message: '`if` or `match` over `$SUBJECT` selects a result through an early `return` or a restated case'
note: 'Use `then_some`, `then`, `if`, `map`, or `map_err`; apply `?` to continuing steps and return terminal result chains directly'
