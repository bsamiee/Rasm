# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-echo-of-expansion
language: bash
severity: error
utils:
    expansion:
        kind: simple_expansion, expansion, command_substitution, arithmetic_expansion
        not: {regex: '\$\{?@|\[@\]|@\}'}
    data:
        any:
            - kind: string
              pattern: $QUOTED
              has: {matches: expansion}
              not: {has: {any: [{kind: string_content}, {kind: 'simple_expansion, expansion', regex: '\$\{?@|\[@\]|@\}'}]}}
            - matches: expansion
              pattern: $BARE
rule:
    kind: command
    all:
        - has: {field: name, regex: '^echo$'}
        - has: {pattern: $TEXT, matches: data, nthChild: {position: 1, reverse: true}}
        - not: {has: {not: {any: [{kind: command_name}, {kind: word, regex: '^-[neE]+$'}, {pattern: $TEXT}]}}}
        - not: {has: {kind: word, nthChild: {position: 2, ofRule: {kind: word}}}}
        - any:
            - has: {kind: word, pattern: $ESCAPING, regex: '^-[neE]*en*$'}
            - has: {field: name, pattern: $LITERAL}
        - any:
            - has: {kind: word, regex: 'n'}
            - has: {field: name, pattern: $LINE}
transform:
    ESCAPES: {replace: {source: $ESCAPING, replace: '^.+$', by: '%b'}}
    TEXT_ONLY: {replace: {source: $LITERAL, replace: '^.+$', by: '%s'}}
    NEWLINE: {replace: {source: $LINE, replace: '^.+$', by: '\n'}}
    WRAPPED: {replace: {source: $BARE, replace: '^.+$', by: '"$0"'}}
fix: printf '$ESCAPES$TEXT_ONLY$NEWLINE' $QUOTED$WRAPPED
message: '`echo` parses `$TEXT` as options when its value matches `-[neE]+`'
note: Print through a literal format, `printf '%s\n' "$<value>"`
