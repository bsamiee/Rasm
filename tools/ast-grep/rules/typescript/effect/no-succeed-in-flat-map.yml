# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-succeed-in-flat-map
language: tsx
severity: error
utils:
    lifted-body:
        kind: call_expression, member_expression
        any:
            - has:
                field: function
                pattern: $M.succeed
                has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?(Effect|Micro|STM|Stream|Channel|Sink|Exit)$"}}}}
            - has:
                field: function
                pattern: $M.some
                has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?Option$"}}}}
            - has:
                field: function
                pattern: $M.right
                has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?Either$"}}}}
            - pattern: $M.void
              has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?(Effect|Micro|STM|Channel|Exit|Option)$"}}}}
    void-callback:
        kind: arrow_function, function_expression
        has:
            field: body
            any:
                - pattern: $M.void
                - kind: statement_block
                  has: {kind: return_statement, has: {pattern: $M.void}}
    lifting-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: "^async$"}}
        has:
            field: body
            any:
                - matches: lifted-body
                - kind: parenthesized_expression
                  has: {matches: lifted-body}
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: lifted-body}}
                  not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    lifted-value:
        matches: lifted-body
        not: {pattern: $_.void}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, pattern: $M.$F}
        - has:
            field: arguments
            has:
                nthChild: {position: 1, reverse: true}
                any:
                    - matches: lifting-callback
                    - matches: lifted-value
                      inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, has: {field: property, regex: '^andThen$'}}}}
constraints:
    F: {regex: "^(flatMap|andThen)$"}
rewriters:
    - id: as-first
      rule:
        any: [{pattern: '$M.andThen($SELF, $H)'}, {pattern: '$M.andThen<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, matches: lifted-value}}
      transform:
        VALUE: rewrite($H, rewriters=[unlift-object, unlift])
      fix: $M.as($SELF, $VALUE)
    - id: as-last
      rule:
        any: [{pattern: $M.andThen($H)}, {pattern: $M.andThen<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, matches: lifted-value}}
      transform:
        VALUE: rewrite($H, rewriters=[unlift-object, unlift])
      fix: $M.as($VALUE)
    - id: return-type
      rule: {kind: type_annotation, inside: {matches: lifting-callback, field: return_type}}
      fix: ''
    - id: unlift-object
      rule:
        matches: lifted-body
        any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]
        has: {field: arguments, has: {kind: object}}
      fix: ($V)
    - id: unlift
      rule:
        matches: lifted-body
        any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]
      fix: $V
    - id: void-first
      rule:
        any: [{pattern: '$M.$_($SELF, $H)'}, {pattern: '$M.$_<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, matches: void-callback, not: {has: {kind: comment, stopBy: end}}}}
      fix: $M.asVoid($SELF)
    - id: void-last
      rule:
        any: [{pattern: $M.$_($H)}, {pattern: $M.$_<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, matches: void-callback, not: {has: {kind: comment, stopBy: end}}}}
      fix: $M.asVoid
    - id: map-first
      rule:
        any: [{pattern: '$M.$_($SELF, $H)'}, {pattern: '$M.$_<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, not: {matches: void-callback}}}
      transform:
        BODY: rewrite($H, rewriters=[return-type, unlift-object, unlift])
      fix: $M.map($SELF, $BODY)
    - id: map-last
      rule:
        any: [{pattern: $M.$_($H)}, {pattern: $M.$_<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, not: {matches: void-callback}}}
      transform:
        BODY: rewrite($H, rewriters=[return-type, unlift-object, unlift])
      fix: $M.map($BODY)
transform:
    MAPPED: rewrite($CALL, rewriters=[as-first, as-last, void-first, void-last, map-first, map-last])
fix: $MAPPED
message: The bind callback only lifts its result back into the same carrier
note: Map the value through the carrier's map, or asVoid for a discarded result, keeping the callback's evaluation time and allocations
labels: {CALL: {style: primary}}
