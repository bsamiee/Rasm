# --- [ADVISORIES] -----------------------------------------------------------------------

[advisories]
unmaintained = "workspace"

# --- [BANS] -----------------------------------------------------------------------------

[bans]
allow-wildcard-paths   = true
multiple-versions      = "allow"              # Duplicates are older releases upstream crates pin, each workspace dependency resolves to one version
wildcards              = "deny"
workspace-dependencies = { unused = "allow" } # Members name catalog crates through `workspace = true` alone, the catalog keeps rows no member uses yet

# --- [LICENSES] -------------------------------------------------------------------------

[licenses]
allow      = ["0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Zlib", "bzip2-1.0.6"]
clarify    = [
    { crate = "pcd-rs", expression = "MIT", license-files = [{ path = "LICENSE", hash = 0x97d30def }] },
    { crate = "sprs-ldl", expression = "LGPL-2.1-or-later", license-files = [{ path = "LICENSE-LGPL", hash = 0x45f0f5a1 }] },
]
exceptions = [{ crate = "sprs-ldl", allow = ["LGPL-2.1-or-later"] }]
private    = { ignore = true }

# --- [SOURCES] --------------------------------------------------------------------------

[sources]
allow-org = { github = ["jondo2010", "MathNya", "rust-lang", "typst"] }
