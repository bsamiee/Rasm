# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
rule:
    kind: call
    pattern: $CALL
    all:
        - has: {field: arguments, has: {kind: keyword_argument, has: {field: name, pattern: type}}}
        - has: {field: function, matches: {python-member-use: {module: {regex: '^msgspec\.toml$'}, name: {regex: '^decode$'}}}}
        - any:
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, has: {stopBy: end, kind: string_content, regex: '^pyproject\.toml$'}}}
            - inside:
                kind: 'return_statement, expression_statement'
                stopBy: {kind: 'function_definition, class_definition, module'}
                has: {stopBy: end, kind: string_content, regex: '^pyproject\.toml$'}
message: '`$CALL` decodes `pyproject.toml` into a schema'
note: 'Decode with no `type=` and index the key path, `msgspec.toml.decode(<bytes>)["<table>"]["<key>"]`'
