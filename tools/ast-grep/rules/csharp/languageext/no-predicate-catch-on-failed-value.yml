# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-predicate-catch-on-failed-value
language: csharp
severity: error
utils:
    fin-type:
        regex: '^((global::)?LanguageExt\.)?(Fin\s*<.+>|Either\s*<\s*((global::)?LanguageExt\.(Common\.)?)?Error\s*,.+>)$'
    fin-name:
        kind: identifier
        pattern: $VALUE
        inside:
            stopBy: end
            kind: 'method_declaration, local_function_statement, lambda_expression, constructor_declaration, property_declaration'
            has:
                stopBy: end
                any:
                    - kind: parameter
                      all: [{has: {field: type, matches: fin-type}}, {has: {field: name, pattern: $VALUE}}]
                    - kind: variable_declaration
                      all: [{has: {field: type, matches: fin-type}}, {has: {kind: variable_declarator, has: {field: name, pattern: $VALUE}}}]
    evaluated:
        kind: invocation_expression
        any:
            - all:
                - has: {field: function, regex: '^(global::)?(LanguageExt\.)?IO\.lift(\s*<.+>)?$'}
                - has:
                    field: arguments
                    all:
                        - not: {has: {kind: argument, nthChild: 2}}
                        - has:
                            kind: argument
                            has:
                                nthChild: {position: 1, reverse: true}
                                any:
                                    - matches: fin-name
                                    - kind: 'invocation_expression, conditional_expression, switch_expression, object_creation_expression'
            - has: {field: function, regex: '^(global::)?(LanguageExt\.)?IO\.fail(\s*<.+>)?$'}
    arm:
        any:
            - matches: failed-value
            - kind: lambda_expression
              has: {field: body, matches: failed-value}
            - kind: lambda_expression
              has: {field: body, kind: block, has: {stopBy: {kind: 'lambda_expression, anonymous_method_expression, local_function_statement'}, kind: return_statement, has: {matches: failed-value}}}
    failed-value:
        any:
            - matches: evaluated
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Bind|Select|SelectMany|MapFail|As)(\s*<.+>)?$'}}, {has: {field: expression, matches: failed-value}}]}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Switch|Match|Map)(\s*<.+>)?$'}}
                - has: {field: arguments, has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, matches: arm}}}
            - kind: parenthesized_expression
              has: {matches: failed-value}
            - kind: conditional_expression
              any: [{has: {field: consequence, matches: failed-value}}, {has: {field: alternative, matches: failed-value}}]
            - kind: switch_expression
              has: {kind: switch_expression_arm, has: {nthChild: {position: 1, reverse: true}, matches: failed-value}}
            - kind: identifier
              pattern: $HELD
              inside:
                stopBy: end
                kind: block
                has: {kind: local_declaration_statement, has: {kind: variable_declaration, has: {kind: variable_declarator, all: [{has: {field: name, pattern: $HELD}}, {has: {nthChild: 2, matches: failed-value}}]}}}
            - kind: identifier
              pattern: $RELAYED
              inside:
                stopBy: end
                kind: block
                has: {kind: local_declaration_statement, has: {kind: variable_declaration, has: {kind: variable_declarator, all: [{has: {field: name, pattern: $RELAYED}}, {has: {nthChild: 2, matches: failed-value}}]}}}
    called:
        kind: invocation_expression
        has:
            field: function
            any:
                - kind: identifier
                  pattern: $METHOD
                - kind: generic_name
                  has: {kind: identifier, pattern: $METHOD}
                - kind: member_access_expression
                  has: {field: name, any: [{kind: identifier, pattern: $METHOD}, {kind: generic_name, has: {kind: identifier, pattern: $METHOD}}]}
    passed:
        kind: argument
        all:
            - not: {has: {field: name, kind: identifier}}
            - has: {nthChild: {position: 1, reverse: true}, matches: failed-value}
    parameter-relay:
        kind: identifier
        pattern: $PARAM
        inside:
            stopBy: end
            kind: 'method_declaration, local_function_statement'
            all:
                - has: {field: name, pattern: $METHOD}
                - not: {has: {field: parameters, has: {kind: parameter, has: {kind: modifier, regex: '^this$'}}}}
                - any:
                    - all:
                        - has: {field: parameters, has: {kind: parameter, nthChild: {position: 1, ofRule: {kind: parameter}}, has: {field: name, pattern: $PARAM}}}
                        - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: called, has: {field: arguments, has: {matches: passed, nthChild: {position: 1, ofRule: {kind: argument}}}}}}
                    - all:
                        - has: {field: parameters, has: {kind: parameter, nthChild: {position: 2, ofRule: {kind: parameter}}, has: {field: name, pattern: $PARAM}}}
                        - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: called, has: {field: arguments, has: {matches: passed, nthChild: {position: 2, ofRule: {kind: argument}}}}}}
                    - all:
                        - has: {field: parameters, has: {kind: parameter, nthChild: {position: 3, ofRule: {kind: parameter}}, has: {field: name, pattern: $PARAM}}}
                        - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: called, has: {field: arguments, has: {matches: passed, nthChild: {position: 3, ofRule: {kind: argument}}}}}}
                    - all:
                        - has: {field: parameters, has: {kind: parameter, nthChild: {position: 4, ofRule: {kind: parameter}}, has: {field: name, pattern: $PARAM}}}
                        - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: called, has: {field: arguments, has: {matches: passed, nthChild: {position: 4, ofRule: {kind: argument}}}}}}
    effect-handler:
        kind: argument
        nthChild: {position: 2, ofRule: {kind: argument}}
        has: {kind: lambda_expression, has: {field: body, regex: '^(global::)?(LanguageExt\.)?IO\s*\.'}}
rule:
    kind: invocation_expression
    all:
        - has: {field: arguments, all: [{has: {matches: effect-handler}}, {not: {has: {kind: argument, nthChild: {position: 3, ofRule: {kind: argument}}}}}]}
        - has: {field: arguments, has: {kind: argument, any: [{has: {field: name, regex: '^Predicate$'}}, {all: [{nthChild: {position: 1, ofRule: {kind: argument}}}, {not: {has: {field: name, pattern: $_}}}]}], has: {nthChild: {position: 1, reverse: true}, pattern: $PREDICATE}}}
        - has: {field: arguments, has: {kind: argument, any: [{has: {field: name, regex: '^Fail$'}}, {all: [{nthChild: {position: 2, ofRule: {kind: argument}}}, {not: {has: {field: name, pattern: $_}}}]}], has: {nthChild: {position: 1, reverse: true}, pattern: $HANDLER}}}
        - has:
            field: function
            kind: member_access_expression
            all:
                - has: {field: name, regex: '^Catch$'}
                - has:
                    field: expression
                    pattern: $SOURCE
                    any:
                        - matches: failed-value
                        - matches: parameter-relay
                        - matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?IO\s*<'}}}
fix: ($SOURCE | @catch($PREDICATE, $HANDLER)).As()
message: '`Catch` on `$SOURCE`, an `IO` that can fail at construction, runs its handler for every error and ignores its predicate'
note: Use `<io> | @catch(<predicate>, <handler>)`, parenthesized inside a chain, the `Fallible` catch behind `|` tests its predicate on an `IO` that failed at construction
