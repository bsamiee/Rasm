# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-member-name-reflection-python
language: python
severity: error
utils:
    member-name:
        any:
            - matches: python-identifier-string
            - matches: python-identifier-string-variable
    relayed-callee:
        any:
            - kind: attribute
            - regex: '^(getattr(_static)?|setattr|delattr)$'
            - inside: {kind: module, stopBy: end, regex: '(?m)\b(getattr(_static)?|setattr|delattr)\s+as\s|=\s*(?:\w+\.)?(getattr(_static)?|setattr|delattr)\b\s*(?:[^\s(]|$)'}
    reader:
        kind: 'identifier, attribute'
        matches: relayed-callee
        all: [{matches: {builtins-attribute-function: {name: {regex: '^getattr(_static)?$'}}}}]
    writer:
        kind: 'identifier, attribute'
        matches: relayed-callee
        all: [{matches: {builtins-attribute-function: {name: {regex: '^(setattr|delattr)$'}}}}]
    object-dunder:
        kind: attribute
        regex: '^object\.__(getattribute|setattr|delattr)__$'
    reached:
        kind: call
        any:
            - all:
                - any:
                    - all: [{has: {field: function, matches: reader}}, {not: {has: {field: arguments, has: {nthChild: 3}}}}]
                    - has: {field: function, matches: writer}
                    - has: {field: function, matches: object-dunder}
                - has: {field: arguments, has: {nthChild: 2, matches: python-identifier-string-variable}}
            - all:
                - has: {field: arguments, has: {nthChild: 2, matches: python-identifier-string}}
                - any:
                    - all:
                        - has: {field: function, matches: reader, not: {matches: {python-builtin-name: {name: {regex: '^getattr$'}}}}}
                        - not: {has: {field: arguments, has: {nthChild: 3}}}
                    - all:
                        - has: {field: function, matches: writer}
                        - not: {all: [{inside: {kind: expression_statement}}, {has: {field: function, matches: {python-builtin-name: {name: {regex: '^(setattr|delattr)$'}}}}}]}
                    - has: {field: function, matches: object-dunder}
            - all:
                - inside: {kind: module, stopBy: end, regex: '\bpartial\(\s*(?:\w+\.)*(?:getattr|setattr|delattr|__getattribute__|__setattr__|__delattr__)\b'}
                - has: {field: function, matches: functools-partial-callee}
                - has: {field: arguments, has: {nthChild: 1, any: [{matches: reader}, {matches: writer}, {matches: object-dunder}]}}
                - has: {field: arguments, has: {nthChild: 3, matches: member-name}}
    indexed:
        kind: subscript
        all:
            - inside: {kind: module, stopBy: end, regex: '\bgetmembers'}
            - has: {field: value, matches: inspect-member-mapping}
            - has: {field: subscript, matches: member-name}
            - not: {matches: python-handled-key-error}
    coerced-operand:
        nthChild: 1
        inside:
            kind: argument_list
            inside:
                kind: call
                any:
                    - has: {field: function, matches: {python-builtin-name: {name: {regex: '^len$'}}}}
                    - all:
                        - has: {field: function, matches: {python-member-use: {module: {regex: '^numpy$'}, name: {regex: '^(asarray|array)$'}}}}
                        - inside: {kind: attribute, field: object, has: {field: attribute, regex: '^(ravel|flatten)$'}, inside: {kind: call, field: function}}
    resolved:
        kind: call
        all:
            - has: {field: function, kind: attribute, has: {field: attribute, regex: '^path_resolve$'}}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: python-identifier-string}}, {not: {has: {nthChild: 2}}}]}
            - not: {matches: coerced-operand}
rule:
    kind: 'call, subscript'
    pattern: $ACCESS
    any:
        - matches: reached
        - matches: indexed
        - matches: resolved
message: '`$ACCESS` reaches a member by a name string'
note: 'Access `<owner>.<member>` directly, in a lambda for a deferred read or call and a nested `def` for a deferred assignment or `del`'
