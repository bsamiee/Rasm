# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-tr-case-conversion
language: bash
severity: error
utils:
    parameter: {matches: {bash-parameter-string: {name: {pattern: $NAME}}}}
    conversion: {matches: {bash-case-conversion: {target: {pattern: $TO}}}}
    # The parameter written into the conversion by a pipe, two stages with the conversion last
    piped-parameter:
        kind: pipeline
        all:
            - has: {matches: {bash-parameter-writer: {value: {matches: parameter}}}}
            - has: {has: {matches: parameter}} # A slot forwarded into the nested writer call exports no capture, the name binds here
            - has: {nthChild: {position: 1, reverse: true}, matches: conversion}
            - not: {has: {nthChild: 3}}
    # The parameter fed to the conversion by a here string, bare or double-quoted, a here string splits no words
    herestring-parameter:
        matches: conversion
        has: {field: redirect, kind: herestring_redirect, has: {matches: {bash-parameter: {name: {pattern: $NAME}}}}}
rule:
    kind: command_substitution
    pattern: $SUB
    has: {any: [{matches: piped-parameter}, {matches: herestring-parameter}]}
transform:
    # The target class of tr, the awk function, the sed \L or \U replacement, or the second alphabet of a sed y command
    LOWER: {replace: {source: $TO, replace: '^.*(lower|a-z|\\L|/[a-z]{26}/["'']?$).*$', by: ',,'}}
    OPERATOR: {replace: {source: $LOWER, replace: '^.*(upper|A-Z|\\U|/[A-Z]{26}/["'']?$).*$', by: '^^'}}
fix: '${$NAME$OPERATOR}'
message: '`$SUB` forks a process to change the case of `$$NAME`'
note: 'Convert the case by expansion, `${<name>,,}` for lower and `${<name>^^}` for upper'
