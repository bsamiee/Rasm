id: enum-to-const-object-by-hand
valid:
    - 'enum Phase { Draft = 0, Sealed = 1 }' # The mechanical fold of enum-to-const-object covers it
    - 'const Phase = { Draft: 0, Sealed: 1 } as const;' # The target form
invalid:
    - 'enum Bare { Draft, Sealed }' # Valueless member
    - 'export enum Pub { Draft = 0 }' # Exported member
    - 'declare enum Ambient { P = 1 }' # Ambient context
    - 'declare namespace Item { enum Phase { P = 1 } }' # Ambient context levels above the enum
    - 'const enum Inline { X = 1 }' # const enum
