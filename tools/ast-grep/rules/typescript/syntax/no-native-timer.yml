# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-timer
language: tsx
severity: error
rule:
    kind: call_expression
    has:
        field: function
        pattern: $NAME
        any:
            - matches: syntax-global-reference
              regex: '^(globalThis\.)?(setTimeout|setInterval|setImmediate|queueMicrotask|clearTimeout|clearInterval|clearImmediate|AbortSignal\.timeout|process\.nextTick)$'
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?timers(/promises)?$'}
                    exported: {regex: '^(setTimeout|setInterval|setImmediate|clearTimeout|clearInterval|clearImmediate)$'}
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?process$'}
                    exported: {regex: '^nextTick$'}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(wait|yield)$'}
                - has:
                    field: object
                    matches:
                        syntax-import-reference:
                            source: {regex: '^(node:)?timers/promises$'}
                            exported: {regex: '^scheduler$'}
message: '`$NAME` schedules work through the host timer outside the effect runtime, the form of `Effect.sleep` for a delay, a `Schedule` for repetition, and `Effect.yieldNow` for yielding'
note: 'Cancellation is an interruption of the runtime'
