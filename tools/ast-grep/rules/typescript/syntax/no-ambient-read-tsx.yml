# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-ambient-read-tsx
language: tsx
severity: error
utils:
    service-key:
        any:
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(Clock|Random)$'}
                - has:
                    field: object
                    any:
                        - matches: {syntax-import-reference: {source: {regex: '^effect$'}, exported: {regex: '^(Clock|Random)$'}}}
                        - matches: {syntax-import-reference: {source: {regex: '^effect/(Clock|Random)$'}, exported: {regex: '^$'}}}
            - kind: identifier
              matches: {syntax-import-reference: {source: {regex: '^effect/(Clock|Random)$'}, exported: {regex: '^(Clock|Random)$'}}}
              not: {matches: {syntax-import-reference: {source: {regex: '^effect/(Clock|Random)$'}, exported: {regex: '^$'}}}}
    service-implementation:
        pattern: $_
        any:
            - inside: {kind: arguments}
              follows: {stopBy: end, matches: service-key}
            - inside:
                kind: arguments
                inside: {kind: call_expression, has: {field: function, kind: call_expression, has: {field: arguments, has: {matches: service-key}}}}
            - inside:
                kind: variable_declarator
                field: value
                has: {field: type, has: {stopBy: end, kind: nested_type_identifier, regex: '^(Clock\.Clock|Random\.Random)$'}}
    ambient-function:
        any:
            - matches: syntax-global-reference
              regex: '^((globalThis|window|self)\.)?(Date\.now|Temporal\.Now\.\w+|Math\.random|crypto\.(randomUUID|getRandomValues)|performance\.(now|timeOrigin)|process\.hrtime(\.bigint)?|process\.uptime)$'
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?crypto$'}
                    exported: {regex: '^(randomUUID|randomUUIDv7|getRandomValues|randomBytes|randomInt|randomFill|randomFillSync)$'}
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?(os|process)$'}
                    exported: {regex: '^uptime$'}
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?process$'}
                    exported: {regex: '^hrtime$'}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^bigint$'}
                - has:
                    field: object
                    matches:
                        syntax-import-reference:
                            source: {regex: '^(node:)?process$'}
                            exported: {regex: '^hrtime$'}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(now|timeOrigin)$'}
                - has:
                    field: object
                    matches:
                        syntax-import-reference:
                            source: {regex: '^(node:)?perf_hooks$'}
                            exported: {regex: '^performance$'}
rule:
    not: {inside: {matches: service-implementation, stopBy: end}}
    any:
        - kind: new_expression
          has: {field: constructor, regex: '^((globalThis|window|self)\.)?Date$', matches: syntax-global-reference}
          not: {has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}}
        - kind: call_expression
          has:
            field: function
            any:
                - matches: ambient-function
                - matches: syntax-global-reference
                  regex: '^((globalThis|window|self)\.)?Date$'
        - matches: ambient-function
          not: {any: [{inside: {kind: call_expression, field: function}}, {inside: {kind: member_expression, field: object}}, {inside: {kind: import_specifier}}]}
    pattern: $READ
message: '`$READ` reads host time or randomness as an ambient value'
note: 'Take the value as an argument or read it from a `Clock` or `Random` service'
labels:
    READ: {style: primary}
