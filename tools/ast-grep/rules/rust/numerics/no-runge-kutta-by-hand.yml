# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-runge-kutta-by-hand
language: rust
severity: error
utils:
    two:
        kind: 'float_literal, integer_literal'
        regex: '^2(\.0*)?(_?f(32|64))?$'
    sum:
        kind: binary_expression
        has: {field: operator, regex: '^\+$'}
    doubled:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\*$'}
            - any: [{has: {field: left, matches: two}}, {has: {field: right, matches: two}}]
    doubled-pair:
        matches: doubled
        has: {kind: parenthesized_expression, has: {matches: sum}}
    sixth:
        kind: 'float_literal, integer_literal'
        regex: '^6(\.0*)?(_?f(32|64))?$'
rule:
    kind: binary_expression
    pattern: $STAGES
    all:
        - matches: sum
        - has: {field: right, not: {matches: doubled}}
        - has:
            field: left
            matches: sum
            any:
                - all:
                    - has: {field: left, matches: sum, all: [{has: {field: left, not: {matches: doubled}}}, {has: {field: right, matches: doubled}}]}
                    - has: {field: right, matches: doubled}
                - all:
                    - has: {field: left, not: {matches: doubled}}
                    - has: {field: right, matches: doubled-pair}
        - inside:
            stopBy: {not: {kind: 'binary_expression, parenthesized_expression'}}
            kind: binary_expression
            has: {stopBy: end, matches: sixth}
        - not: {matches: rust-test-scope}
message: '`$STAGES` combines classic Runge-Kutta stages by hand'
note: 'Solve through diffsol: `OdeBuilder::<M>::new().rhs(<f>).init(<y0>, <n>).build()?` builds the problem and `problem.tsit45()?.solve(<t_final>)` integrates it with error-controlled steps. `bdf`, `tr_bdf2`, and `esdirk34` cover stiff systems'
