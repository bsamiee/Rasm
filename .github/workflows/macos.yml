name: macOS

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            uncached:
                description: Runs every task of the nx affected step past the Nx cache, to time them
                type: boolean
                default: false

concurrency:
    group: ${{ github.event_name == 'push' && 'macos' || format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && github.ref || github.run_id) }}
    queue: max

permissions:
    contents: read
    actions: read

env:
    HK_PROFILE: ci
    NX_PARALLEL: 100%
    GH_TOKEN: ${{ github.token }}
    NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
    NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ case(github.event_name == 'pull_request', secrets.NX_SELF_HOSTED_REMOTE_CACHE_READ_TOKEN, secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN) }}

defaults:
    run:
        shell: bash

jobs:
    macos:
        name: macOS
        runs-on: xcode-27-xlarge
        timeout-minutes: 120
        env:
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
            - id: root
              run: |-
                  root="$(git rev-list --max-parents=0 HEAD)"
                  printf "NX_BASE=%s\nNX_HEAD=%s\n" "${root}" "${GITHUB_SHA}" >> "${GITHUB_ENV}"
                  printf "sha=%s\n" "${root}" >> "${GITHUB_OUTPUT}"
            - if: ${{ github.event_name != 'workflow_dispatch' }}
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  fallback-sha: ${{ steps.root.outputs.sha }}
                  workflow-id: macos.yml
                  lookup-strategy: per-commit
                  max-commits: 150
            - id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |-
                      .cache/nx/workspace-data/*
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                      !.cache/nx/workspace-data/xcode-packages
                  key: nx-${{ runner.os }}-
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest-stable
            - id: tools
              uses: $/.github/actions/tools
            - if: ${{ env.APPLE_DEVELOPMENT_P12 != '' }}
              uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
              with:
                  p12-file-base64: ${{ env.APPLE_DEVELOPMENT_P12 }}
                  p12-password: ${{ env.APPLE_DEVELOPMENT_P12_PASSWORD }}
            - run: nx conformance:check
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:darwin,tag:host:rhino,tag:host:unreal,tag:host:claude-code'
              env:
                  NX_SKIP_NX_CACHE: ${{ inputs.uncached }}
            - if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
              run: hk check --step swiftlint --step swift-format --step plutil --step xcprojformatter --from-ref "${NX_BASE}" --to-ref "${NX_HEAD}"
              env:
                  HK_LIBGIT2: 'false'
            - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !endsWith(steps.graph.outputs.cache-matched-key, hashFiles('.cache/nx/workspace-data/*.hash')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: nx-${{ runner.os }}-${{ hashFiles('.cache/nx/workspace-data/*.hash') }}
            - if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.job }}-reports
                  if-no-files-found: ignore
                  path: |-
                      .artifacts/cmake/*/*.log
                      .artifacts/dotnet/test
                      .artifacts/playwright
                      .artifacts/vitest
                      .artifacts/apple/**/*.xcresult
                      .cache/nx/workspace-data/project-graph.json
                      .cache/nx/workspace-data/*.db*
