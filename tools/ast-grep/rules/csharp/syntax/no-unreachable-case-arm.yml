# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
utils:
    unreachable:
        kind: 'throw_expression, throw_statement'
        has: {kind: object_creation_expression, has: {field: type, matches: {csharp-type-name: {name: {regex: '^UnreachableException$'}}}}}
        not: {inside: {kind: switch_expression_arm, stopBy: &function {kind: 'lambda_expression, anonymous_method_expression, local_function_statement'}}}
    arm-name:
        any:
            - kind: identifier
              regex: &arm-names '^(Switch|SwitchPartially|Map|MapPartially|Match|MatchUnsafe|BiMap|BiBind|IfNone|IfNoneUnsafe|IfFail|IfLeft|IfRight|match|ifNone|ifNoneUnsafe|ifLeft|ifRight)$'
            - kind: generic_name
              has: {kind: identifier, regex: *arm-names}
    arm-call:
        any:
            - matches: arm-name
            - kind: member_access_expression
              has: {field: name, matches: arm-name}
rule:
    kind: argument
    all:
        - inside:
            kind: argument_list
            inside:
                kind: invocation_expression
                has: {field: function, pattern: $CALL, matches: arm-call}
        - has: {kind: 'lambda_expression, anonymous_method_expression', has: {stopBy: *function, matches: unreachable}}
message: 'Arm of `$CALL` throws `UnreachableException` for a case its value can hold'
note: 'Narrow the value to a union or request type holding only cases its call handles'
