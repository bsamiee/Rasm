id: swift-member-case
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol, swift-function]
symbolType: enumMember
utils:
    entry:
        inside: {kind: enum_class_body, inside: {kind: class_declaration, any: [{inside: {kind: 'source_file, ERROR'}}, {has: {field: name, pattern: $OWNER}}]}}
        all:
            - any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: enum_entry}]
            - any: [{has: {regex: '^indirect$', pattern: $$INDIRECT}}, {kind: enum_entry}]
rule:
    any:
        - kind: enum_entry
          all:
            - matches: entry
            - has: {field: name, pattern: $NAME}
            - not: {has: {kind: case_name, nthChild: {position: 2, ofRule: {kind: case_name}}}}
            - any: [{has: {field: data_contents, pattern: $TAIL}}, {kind: enum_entry}]
            - matches: leaf
        - kind: case_name
          pattern: $NAME
          inside: {kind: enum_entry, matches: entry}
          any:
            - precedes: {kind: enum_type_parameters, pattern: $TAIL, stopBy: {not: {kind: 'comment, multiline_comment'}}}
            - pattern: $NAME
rewriters:
    - {id: default, rule: {follows: {regex: '^=$'}, inside: {kind: enum_type_parameters}}, fix: …}
transform:
    MARKED: {replace: {source: $INDIRECT, replace: '$', by: ' '}}
    HEADER: {rewrite: {source: $TAIL, rewriters: [default, closure, comment]}}
name: $QUALIFIER$NAME
signature: $PREFIX$MARKEDcase $NAME$SIGNATURE
isPublic: {matches: open}
---
id: swift-member-function
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol, swift-function]
symbolType: function
variants: [function, member-function]
rule:
    any:
        - kind: function_declaration
          pattern: $DECLARATION
          all: [{matches: local}, {has: {kind: 'function_name, referenceable_operator', pattern: $NAME}}, {matches: leaf}]
        - kind: 'function_name, referenceable_operator'
          pattern: $NAME
          inside: {kind: function_declaration, pattern: $DECLARATION, matches: local}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: false
---
id: swift-member-error
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol, swift-function]
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, any: [{not: {has: {kind: 'simple_identifier, comment, multiline_comment'}}}, {not: {has: {stopBy: end, kind: 'class_declaration, protocol_declaration, function_declaration, init_declaration, deinit_declaration, subscript_declaration, property_declaration'}}}]}
        - {kind: 'simple_identifier, comment, multiline_comment', all: [{inside: {kind: ERROR}}, {not: {follows: {kind: 'simple_identifier, comment, multiline_comment', stopBy: end}}}, {nthChild: {position: 1, ofRule: {kind: 'simple_identifier, comment, multiline_comment'}}}]}
name: ERROR
signature: ''
isPublic: false
