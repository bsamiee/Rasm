# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level
language: tsx
severity: error
utils:
    callback-wrapper:
        any:
            - matches: syntax-expression-wrapper
            - kind: pair
            - kind: object
            - kind: array
            - kind: spread_element
            - kind: ternary_expression
    module-value:
        kind: call_expression
        any:
            - inside:
                kind: variable_declarator
                field: value
                stopBy:
                    not:
                        any:
                            - matches: syntax-expression-wrapper
                            - kind: object, pair
                inside:
                    kind: lexical_declaration
                    any:
                        - inside: {kind: program}
                        - inside: {kind: export_statement, inside: {kind: program}}
            - inside:
                kind: member_expression
                field: object
                stopBy: {not: {matches: syntax-expression-wrapper}}
                inside: {kind: call_expression, field: function, matches: module-value}
    effect-function-factory:
        kind: call_expression
        has:
            field: function
            any:
                - kind: member_expression
                  all:
                    - has: {field: property, regex: '^(fn|fnUntraced)$'}
                    - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Effect$'}}}}
                - kind: call_expression
                  has:
                    field: function
                    kind: member_expression
                    all:
                        - has: {field: property, regex: '^fn$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Effect$'}}}}
    effect-function-root:
        matches: syntax-function-boundary
        pattern: $BODY
        inside:
            kind: arguments
            stopBy: {not: {matches: syntax-expression-wrapper}}
            has:
                nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                any:
                    - pattern: $BODY
                    - matches: syntax-expression-wrapper
                      has: {pattern: $BODY, stopBy: {not: {matches: syntax-expression-wrapper}}}
            inside:
                all:
                    - matches: effect-function-factory
                    - matches: module-value
    nested-scope:
        matches: syntax-function-boundary
        not: {matches: effect-function-root}
        any:
            - inside: {matches: syntax-function-boundary, stopBy: end}
            - inside: {kind: arguments, stopBy: {not: {matches: callback-wrapper}}}
    fourth-level:
        matches: nested-scope
        inside:
            matches: nested-scope
            stopBy: end
            inside:
                matches: nested-scope
                stopBy: end
                inside: {matches: nested-scope, stopBy: end}
    control:
        any:
            - kind: for_statement, for_in_statement, while_statement, do_statement, switch_statement, try_statement
            - kind: if_statement
              not: {inside: {kind: else_clause}}
            - kind: ternary_expression
              not: {inside: {kind: ternary_expression, field: alternative, stopBy: {not: {matches: syntax-expression-wrapper}}}}
    control-boundary:
        any: [{matches: control}, {matches: syntax-function-boundary}]
rule:
    pattern: $SCOPE
    any:
        - matches: fourth-level
          not: {inside: {matches: fourth-level, stopBy: end}}
        - matches: control
          inside:
            matches: control
            stopBy: {matches: control-boundary}
            inside:
                matches: control
                stopBy: {matches: control-boundary}
                inside:
                    matches: control
                    stopBy: {matches: control-boundary}
                    not: {inside: {matches: control, stopBy: {matches: syntax-function-boundary}}}
message: The operation exceeds three nested function or control levels
note: Compose dependent operations in a flat pipe or Effect.gen and independent ones with the owning combinator
labels:
    SCOPE: {style: primary}
