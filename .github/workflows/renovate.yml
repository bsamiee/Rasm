name: Renovate

on:
    schedule:
        - cron: "17 1 * * *"
    workflow_dispatch: {}

permissions: {}

jobs:
    renovate:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
              with:
                  token: ${{ secrets.RENOVATE_TOKEN }}
              env:
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
                  RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise", "pixi"]'
