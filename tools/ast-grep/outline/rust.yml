    inside:
        kind: declaration_list
        inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
rewriters: [{id: enum-body, rule: {kind: enum_variant_list, inside: {kind: enum_item, field: body}}, fix: ''}]
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '(?s)^(.+)$', by: '${1}::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [enum-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-mod-macro
language: rustlang
role: member
parentRuleIds: [rust-mod]
symbolType: function
rule:
    kind: macro_definition
    has: {field: name, pattern: $NAME}
    inside:
        kind: declaration_list
        inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '(?s)^(.+)$', by: '${1}::'}}
name: $QUALIFIER$NAME
signature: macro_rules! $NAME
isPublic:
    follows:
        kind: attribute_item
        has: {kind: attribute, has: {kind: identifier, regex: '^macro_export$'}}
        stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}
---
id: rust-mod-foreign-block
language: rustlang
role: member
parentRuleIds: [rust-mod]
symbolType: namespace
rule:
    kind: foreign_mod_item
    pattern: $DECLARATION
    has: {kind: extern_modifier, pattern: $NAME}
    inside:
        kind: declaration_list
        inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
rewriters: [{id: foreign-body, rule: {kind: declaration_list, inside: {kind: foreign_mod_item, field: body}}, fix: ''}]
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '(?s)^(.+)$', by: '${1}::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [foreign-body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\p{White_Space}*;?$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: false
---
id: rust-mod-mod
language: rustlang
role: member
parentRuleIds: [rust-mod]
symbolType: module
rule:
    any:
        - kind: identifier
          pattern: $NAME
          inside:
              kind: mod_item
              field: name
              pattern: $DECLARATION
              inside:
                  kind: declaration_list
                  inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
        - kind: 'use_declaration, extern_crate_declaration'
          pattern: $DECLARATION
          any:
              - has: {field: argument, has: {field: path, pattern: $NAME}}
              - has: {field: argument, kind: use_wildcard, has: {kind: 'crate, identifier, metavariable, scoped_identifier, self, super', pattern: $NAME}}
              - has: {field: argument, pattern: $NAME}
              - has: {field: name, pattern: $NAME}
          inside:
              kind: declaration_list
              inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
rewriters: [{id: mod-body, rule: {kind: declaration_list, inside: {kind: mod_item, field: body}}, fix: ''}]
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '(?s)^(.+)$', by: '${1}::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [mod-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {any: [{has: {kind: visibility_modifier}}, {inside: {kind: mod_item, field: name, has: {kind: visibility_modifier}}}]}
---
id: rust-mod-trait
language: rustlang
role: member
parentRuleIds: [rust-mod]
symbolType: interface
rule:
    any:
        - kind: type_identifier
          pattern: $NAME
          inside:
              kind: trait_item
              field: name
              pattern: $DECLARATION
              inside:
                  kind: declaration_list
                  inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
        - kind: trait_alias
          pattern: $DECLARATION
          has: {field: name, pattern: $NAME}
          inside:
              kind: declaration_list
              inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
rewriters: [{id: trait-body, rule: {kind: declaration_list, inside: {kind: trait_item, field: body}}, fix: ''}]
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '(?s)^(.+)$', by: '${1}::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trait-body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\p{White_Space}*;?$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {any: [{has: {kind: visibility_modifier}}, {inside: {kind: trait_item, field: name, has: {kind: visibility_modifier}}}]}
---
id: rust-mod-impl
language: rustlang
role: member
parentRuleIds: [rust-mod]
symbolType: object
rule:
    kind: 'abstract_type, array_type, bounded_type, dynamic_type, function_type, generic_type, macro_invocation, metavariable, never_type, pointer_type, primitive_type, reference_type, removed_trait_bound, scoped_type_identifier, tuple_type, type_identifier, unit_type'
    any: [{kind: 'type_identifier, primitive_type', pattern: $NAME}, {has: {stopBy: end, kind: 'type_identifier, primitive_type', pattern: $NAME}}, {pattern: $NAME}]
    inside:
        kind: impl_item
        field: type
        pattern: $DECLARATION
        any:
            - has: {field: trait, any: [{kind: type_identifier, pattern: $TRAIT}, {has: {stopBy: end, kind: type_identifier, pattern: $TRAIT}}, {pattern: $TRAIT}]}
            - kind: impl_item
        inside:
            kind: declaration_list
            inside: {kind: mod_item, any: [{has: {field: name, pattern: $OWNER}, inside: {kind: declaration_list}}, {kind: mod_item}]}
rewriters: [{id: impl-body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ''}]
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '(?s)^(.+)$', by: '${1}::'}}
    FOR: {replace: {source: $TRAIT, replace: '(?s)^(.+)$', by: '${1} for '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [impl-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $QUALIFIER$FOR$NAME
signature: $SIGNATURE
isPublic: {inside: {kind: impl_item, field: type, has: {field: trait, pattern: $_}}}
---
id: rust-foreign-function
language: rustlang
role: member
parentRuleIds: [rust-foreign-block]
symbolType: function
rule:
    kind: 'function_item, function_signature_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: foreign_mod_item}}
transform:
    TRIMMED: {replace: {source: $DECLARATION, replace: ';$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\p{White_Space}*\n\p{White_Space}*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-foreign-static
language: rustlang
role: member
parentRuleIds: [rust-foreign-block]
symbolType: variable
rule:
    kind: static_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: foreign_mod_item}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: ';$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-foreign-type
language: rustlang
role: member
parentRuleIds: [rust-foreign-block]
symbolType: struct
rule:
    kind: 'type_item, associated_type'
