# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-rust
language: rust
severity: error
utils:
    state-write:
        any:
            - kind: call_expression
              has:
                field: function
                kind: field_expression
                all:
                    - has: {field: value, kind: identifier, pattern: $STATE}
                    - has: {field: field, regex: '^(push|push_back|push_front|push_str|insert|extend|extend_from_slice|append)$'}
            - kind: 'compound_assignment_expr, assignment_expression'
              has: {field: left, kind: identifier, pattern: $STATE}
    valued-return:
        kind: return_expression
        has: {pattern: $STATE, not: {regex: '^Some\s*\('}}
    valued-break:
        kind: break_expression
        has: {pattern: $STATE, not: {kind: label}}
    replaced-loop:
        any:
            - matches: rust-binary-header-read
            - matches: rust-byte-hash-constant
            - matches: rust-constant-time-compare
            - matches: rust-entity-escape
            - matches: rust-hex-by-byte
            - matches: rust-hex-pair-parse
            - matches: rust-html-tag-scan
            - matches: rust-json-pointer-escape
            - matches: rust-markdown-fence-scan
            - matches: rust-obj-face
            - matches: rust-simpson-weight
            - matches: rust-squared-deviation-sum
            - matches: rust-stl-text
            - matches: rust-template-replace
rule:
    matches: rust-statement-loop
    has:
        field: body
        has:
            stopBy: {kind: 'loop_expression, while_expression, for_expression, closure_expression'}
            any:
                - matches: state-write
                - matches: valued-return
                - matches: valued-break
    not: {has: {stopBy: end, matches: replaced-loop}}
message: 'Loop iterates by statement to produce `$STATE`'
note: 'Bind the result to one adapter chain, `.map(<f>).collect()` builds a collection, `.filter(<test>)` keeps elements, `.sum()` or `.fold(<initial>, <f>)` accumulates, `.max()`, `.min()`, or `.reduce(<f>)` selects an extreme with `None` for no items, `.any(<test>)`, `.all(<test>)`, `.find(<test>)`, `.position(<test>)`, or `.find_map(<f>)` stops at the first match, and a fallible traversal over independent elements collects into `validated::Validated` to keep every error'
