# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-bool-as-slice-index
language: python
severity: error
utils:
    bool-value:
        any:
            - matches: python-truth-value
            - kind: call
              all:
                - has: {field: function, kind: identifier, regex: '^int$', not: {matches: python-shadowed-name}}
                - has: {field: arguments, has: {nthChild: 1, matches: python-truth-value}, not: {has: {nthChild: 2}}}
    literal-table:
        kind: list, tuple, string, concatenated_string
    comparison:
        any:
            - kind: comparison_operator
            - kind: boolean_operator
              has: {stopBy: {kind: 'boolean_operator, parenthesized_expression'}, kind: comparison_operator}
    mask-name:
        matches: {python-assigned-name: {value: {matches: comparison}}}
    mask:
        any:
            - matches: comparison
            - kind: identifier
              matches: mask-name
    bool-index:
        any:
            - kind: slice
              has: {matches: bool-value}
            - matches: bool-value
              not: {matches: mask}
            - matches: mask
              inside: {kind: subscript, has: {field: value, matches: literal-table}}
    repeated:
        kind: list, tuple, string, concatenated_string
    bool-keyed-mapping:
        kind: identifier
        pattern: $M
        any:
            - matches: {python-typed-parameter: {type: {regex: '\b(Mapping|MutableMapping|dict|Dict)\[\s*bool\s*,'}}}
            - inside:
                kind: module, function_definition, class_definition
                stopBy: end
                has:
                    stopBy: {kind: 'function_definition, class_definition, lambda'}
                    kind: assignment
                    all:
                        - has: {field: left, kind: identifier, pattern: $M}
                        - has: {field: type, regex: '\b(Mapping|MutableMapping|dict|Dict)\[\s*bool\s*,'}
rule:
    any:
        - kind: subscript
          pattern: $USE
          has: {field: subscript, matches: bool-index}
          not: {has: {field: value, matches: bool-keyed-mapping}}
        - kind: binary_operator
          pattern: $USE
          all:
            - has: {field: operator, regex: '^\*$'}
            - any:
                - all: [{has: {field: left, matches: repeated}}, {has: {field: right, matches: bool-value}}]
                - all: [{has: {field: right, matches: repeated}}, {has: {field: left, matches: bool-value}}]
message: '`$USE` reads a boolean as an index or a repeat count'
note: 'Select the form by `<a> if <test> else <b>`'
