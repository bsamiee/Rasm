id: no-using-remove-in-project
valid:
    # Project adding a using it needs
    - |
      <ItemGroup><Using Include="Rhino.Geometry" /></ItemGroup>
    # Central using keyed on the package supplying the namespace
    - |
      <ItemGroup>
        <Using Include="Thinktecture" Condition="'@(PackageReference->WithMetadataValue('Identity', 'Thinktecture.Runtime.Extensions'))' != ''" />
      </ItemGroup>
    # Remove on another item type
    - |
      <ItemGroup><Compile Remove="Generated/**" /></ItemGroup>
invalid:
    # The instance, three projects removed a central Using of the kernel namespace
    - |
      <ItemGroup Label="Kernel-Free Usings"><Using Remove="Rasm.Analysis" /></ItemGroup>
    # The start-tag form
    - |
      <ItemGroup><Using Remove="Rasm.Domain"></Using></ItemGroup>
