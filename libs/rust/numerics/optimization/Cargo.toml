# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-optimization"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords             = ["optimization", "solver", "nonlinear", "conic"]
categories           = ["mathematics", "science", "algorithms"]
description          = "Optimization: bounded nonlinear solves, conic programs, allocation models, and Pareto ranking"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
bounded-integer      = { workspace = true }
nutype               = { workspace = true }
ordered-float        = { workspace = true }
nalgebra             = { workspace = true }
clarabel             = { workspace = true, optional = true }
good_lp              = { workspace = true, optional = true }
nlopt                = { workspace = true, optional = true }
rasm-stats           = { workspace = true, optional = true }

# --- [FEATURES] -------------------------------------------------------------------------

[features]
default   = ["conic", "linear", "nonlinear"]
conic     = ["dep:clarabel"]
linear    = ["dep:good_lp"]
nonlinear = ["dep:nlopt", "dep:rasm-stats"]

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
