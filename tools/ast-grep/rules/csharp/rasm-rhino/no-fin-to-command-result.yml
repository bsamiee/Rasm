# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
files: ['**/rhino/**']
utils:
    host-success:
        matches: {csharp-owner-member: {type: {regex: '^Result$'}, member: {regex: '^Success$'}}}
    host-failure:
        matches: {csharp-owner-member: {type: {regex: '^Result$'}, member: {regex: '^Failure$'}}}
    success:
        any:
            - kind: lambda_expression
              any:
                - has: {field: body, matches: host-success}
                - has: {field: body, kind: block, all: [{has: {kind: return_statement, nthChild: 1, has: {matches: host-success}}}, {not: {has: {nthChild: 2}}}]}
    reported-failure:
        kind: block
        all:
            - has: {kind: expression_statement, nthChild: 1, has: {kind: invocation_expression}}
            - has: {kind: return_statement, nthChild: 2, has: {matches: host-failure}}
            - not: {has: {nthChild: 3}}
    to-result:
        any:
            - matches: host-failure
            - kind: lambda_expression
              any:
                - has: {field: body, matches: host-failure}
                - has: {field: body, matches: reported-failure}
                - has:
                    field: body
                    kind: conditional_expression
                    all:
                        - has: {field: alternative, matches: {csharp-owner-member: {type: {regex: '^Result$'}, member: {regex: '^Failure$'}}}}
                        - has: {field: consequence, matches: {csharp-owner-member: {type: {regex: '^Result$'}, member: {regex: '^'}}}}
    success-map:
        kind: invocation_expression
        all:
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^Map$'}
                    - has: {field: expression, pattern: $SOURCE}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: success}}}
            - not: {has: {field: arguments, has: {kind: argument, nthChild: 2}}}
    run-success:
        any:
            - matches: success-map
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^RunSafe$'}}, {has: {field: expression, matches: success-map}}]}
                - matches: csharp-argumentless-call
    fin-match:
        kind: invocation_expression
        all:
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^Match$'}
                    - has: {field: expression, pattern: $SOURCE}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 3}}
                    - any:
                        - all:
                            - has: {kind: argument, all: [{has: {field: name, regex: '^Succ$'}}, {has: {matches: success}}]}
                            - has: {kind: argument, all: [{has: {field: name, regex: '^Fail$'}}, {has: {matches: to-result}}]}
                        - all:
                            - has: {kind: argument, nthChild: 1, not: {has: {field: name, kind: identifier}}, has: {matches: success}}
                            - has: {kind: argument, nthChild: 2, not: {has: {field: name, kind: identifier}}, has: {matches: to-result}}
    fin-fold:
        kind: invocation_expression
        all:
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^IfFail$'}
                    - has: {field: expression, matches: run-success}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: to-result}}}
            - not: {has: {field: arguments, has: {kind: argument, nthChild: 2}}}
    fin-test:
        kind: conditional_expression
        any:
            - all:
                - has: {field: condition, pattern: $SOURCE.IsSucc}
                - has: {field: consequence, matches: host-success}
                - has: {field: alternative, matches: host-failure}
            - all:
                - has: {field: condition, pattern: $SOURCE.IsFail}
                - has: {field: consequence, matches: host-failure}
                - has: {field: alternative, matches: host-success}
rule:
    any:
        - matches: fin-match
        - matches: fin-fold
        - matches: fin-test
message: '`$SOURCE` converts to a host `Result`'
note: 'Map unused values to `unit` and call `Results.Of`; finish `Fin` with `IfFail(Result.Failure)` or `IO` with `Session.Run(<effect>, Result.Failure)`'
