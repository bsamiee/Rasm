# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-set-size-uniqueness
language: rust
severity: error
rule:
    kind: binary_expression
    any:
        - pattern: $I.collect::<$SET<$_>>().len() == $N
        - pattern: $N == $I.collect::<$SET<$_>>().len()
        - pattern: $I.collect::<$SET<$_>>().len() != $N
        - pattern: $N != $I.collect::<$SET<$_>>().len()
        - pattern: $I.collect::<$SET<$_>>().len() < $N
        - pattern: $N > $I.collect::<$SET<$_>>().len()
constraints:
    SET: {regex: '^(Fx|Unord)?(Hash|BTree|Index)Set$'}
    N: {kind: call_expression, regex: '\.(len|count)\(\)$'}
message: '`$I` collects into a `$SET` only to compare its size with `$N`'
note: 'Call `Itertools::all_unique()` on the iterator (`use itertools::Itertools as _;`), negated where the comparison tests for a duplicate'
