# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nonzero-constant-by-hand
language: rust
severity: error
utils:
    minimum:
        regex: '^((::)?(std|core)::num::)?NonZero(::<\w+>)?::MIN$'
rule:
    kind: call_expression
    pattern: $COMPUTED
    all:
        - has: {field: arguments, has: {kind: integer_literal}}
        - any:
            - all:
                - has: {field: function, kind: scoped_identifier, regex: '^((::)?(std|core)::num::)?NonZero(::<\w+>)?::saturating_add$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: minimum}}, {has: {nthChild: 2, kind: integer_literal}}, {not: {has: {nthChild: 3}}}]}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^saturating_add$'}}, {has: {field: value, matches: minimum}}]}
                - has: {field: arguments, all: [{has: {nthChild: 1, kind: integer_literal}}, {not: {has: {nthChild: 2}}}]}
message: '`$COMPUTED` computes a `NonZero` constant from `NonZero::MIN`'
note: 'Write a `NonZero` constant as `Option::unwrap(NonZero::new(<value>))` in a field default and `const { NonZero::new(<value>).unwrap() }` in a runtime body, Clippy permits `unwrap` in both'
