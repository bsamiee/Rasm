# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Value with a type the syntax names and a fix writes as the type argument, a string or template literal, a signed number, or a cast
id: syntax-typed-value
language: tsx
rule:
    any:
        - kind: string
        - kind: template_string
        - kind: number
        - kind: unary_expression
          has: {field: argument, kind: number}
        # The const assertion names a literal type the site declares, const itself is no type argument
        - kind: as_expression
          not: {has: {regex: '^const$'}}
