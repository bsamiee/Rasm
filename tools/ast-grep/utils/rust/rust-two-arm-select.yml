# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-two-arm-select
language: rust
utils:
    arrow:
        regex: '^=>$'
rule:
    kind: macro_invocation
    all:
        - has: {field: macro, regex: '^(::)?(tokio::)?select$'}
        - has:
            kind: token_tree
            all:
                - has: {matches: arrow, follows: {stopBy: end, matches: arrow}}
                - not: {has: {matches: arrow, follows: {stopBy: end, matches: arrow, follows: {stopBy: end, matches: arrow}}}}
                - not: {has: {regex: '^(if|else)$'}}
