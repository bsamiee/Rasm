id: csharp-member-function
language: csharplang
role: member
symbolType: function
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-enum, csharp-function]
utils:
    enclosing: {kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    tooling: {kind: attribute, has: {field: name, regex: '(?:^|[.:])(?:Debugger.+|StackTraceHidden|ExcludeFromCodeCoverage|(?:Unconditional)?SuppressMessage|EditorBrowsable|StringSyntax)(?:Attribute)?$'}}
    plain: {not: {has: {stopBy: {kind: 'block, arrow_expression_clause'}, any: [{kind: 'attribute_list, preproc_if_in_attribute_list, preproc_if, argument, ERROR, comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, {kind: parameter, has: {regex: '^=$'}}]}}, pattern: $PLAIN}
    owned: {any: [{inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: {context: 'class $OWNER;', selector: identifier}}, inside: {stopBy: end, matches: enclosing}}}, {not: {kind: ERROR}}]}
    nesting: {has: {stopBy: end, kind: 'local_function_statement, ERROR'}}
    item: {kind: local_function_statement, inside: {kind: 'global_statement, compilation_unit', stopBy: {not: {kind: 'preproc_if, preproc_elif, preproc_else'}}}}
    holder:
        any:
            - {kind: 'method_declaration, constructor_declaration, destructor_declaration, local_function_statement, property_declaration, event_declaration'}
            - {kind: variable_declarator, inside: {kind: variable_declaration, inside: {kind: 'field_declaration, event_field_declaration'}}}
        not: {matches: item}
    declared:
        kind: local_function_statement
        matches: owned
        has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}
        all:
            - not: {matches: item}
            - any: [{inside: {stopBy: end, matches: holder, has: {field: name, pattern: {context: 'class $CALLER;', selector: identifier}}}}, {kind: local_function_statement}]
            - any: [{matches: plain}, {pattern: $DECLARATION}]
rule:
    any:
        - {kind: local_function_statement, all: [{matches: declared}, {not: {matches: nesting}}]}
        - {kind: parameter_list, inside: {kind: local_function_statement, field: parameters, all: [{matches: declared}, {matches: nesting}]}, not: {has: {stopBy: end, kind: ERROR}}}
        - {kind: modifier, nthChild: {position: 1, ofRule: {kind: modifier}}, inside: {kind: local_function_statement, all: [{matches: declared}, {has: {field: parameters, has: {stopBy: end, kind: ERROR}}}]}}
rewriters:
    - {id: broken, rule: {kind: ERROR}, fix: "\n"}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
    - {id: body, rule: {kind: 'block, arrow_expression_clause', inside: {kind: local_function_statement, field: body}}, fix: ''}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {kind: attribute, matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: branch, rule: {kind: 'preproc_else, preproc_elif'}, fix: ''}
    - id: parameters
      rule: {kind: parameter_list, inside: {kind: local_function_statement}, pattern: {context: 'record R($$$PARAMETERS);', selector: parameter_list}}
      transform: {KEPT: {rewrite: {source: $$$PARAMETERS, rewriters: [default, tool-list, tool, attributed, branch, broken, trivia]}}}
      fix: ($KEPT)
    - {id: default, rule: {not: {kind: ERROR}, inside: {kind: parameter, field: value}}, fix: …}
    - id: lineage
      rule:
        kind: identifier
        pattern: {context: 'class $SELF;', selector: identifier}
        inside: {field: name, matches: enclosing, any: [{inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: {context: 'class $UP;', selector: identifier}}, inside: {stopBy: end, matches: enclosing}}}, {matches: enclosing}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}}
      fix: $ABOVE$SELF.
    - id: unmaking
      rule: {kind: identifier, pattern: {context: 'class $SELF;', selector: identifier}, inside: {field: name, kind: destructor_declaration}}
      fix: ~$SELF.
    - id: calling
      rule:
        kind: identifier
        pattern: {context: 'class $SELF;', selector: identifier}
        inside: {field: name, matches: holder, any: [{inside: {stopBy: end, matches: holder, has: {field: name, pattern: {context: 'class $UP;', selector: identifier}}}}, {matches: holder}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [unmaking, calling], joinBy: ''}}}
      fix: $ABOVE$SELF.
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body, parameters, tool-list, tool, attributed, branch, broken, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*|#(?:if|endif)[^\n]*', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
    PLAIN_LINES: {replace: {source: $PLAIN, replace: '(?s)[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*(?:\{|=>|;[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*$).*|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*', by: "\n "}}
    PLAIN_SIGNATURE: {replace: {source: $PLAIN_LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    CALLED: {rewrite: {source: $CALLER, rewriters: [unmaking, calling], joinBy: ''}}
name: $QUALIFIER$CALLED$NAME
signature: $PLAIN_SIGNATURE$SIGNATURE
isPublic: false
