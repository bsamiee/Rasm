# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Binding of an operation in the plugin's composition/option.ts, the one place its arms and its two-call forms are the definition
id: claude-code-option-operation
language: tsx
rule:
    any: [{kind: variable_declarator}, {kind: function_declaration}]
    has: {field: name, regex: '^(map|flatMap|getOrElse|toArray|liftPredicate)$'}
