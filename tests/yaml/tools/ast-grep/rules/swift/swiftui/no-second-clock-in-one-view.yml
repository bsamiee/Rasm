id: no-second-clock-in-one-view
valid:
    - |
      struct Clock: View {
          var body: some View {
              TimelineView(.periodic(from: .now, by: 1)) { context in
                  Text(context.date, style: .time)
              }
          }
      }
    - |
      struct Clock: View {
          let live: Bool
          var body: some View {
              if live {
                  TimelineView(.periodic(from: .now, by: 1)) { context in
                      Text(context.date, style: .time)
                  }
              } else {
                  Text(start, style: .timer)
              }
          }
      }
    - |
      struct Elapsed: View {
          var body: some View {
              Text(start, style: .timer)
          }
      }
invalid:
    - |
      struct Clock: View {
          var body: some View {
              VStack {
                  TimelineView(.periodic(from: .now, by: 1)) { context in
                      Text(context.date, style: .time)
                  }
                  Text(start, style: .timer)
              }
          }
      }
    - |
      struct Clock: View {
          var body: some View {
              VStack {
                  TimelineView(.periodic(from: .now, by: 1)) { context in
                      Text(context.date, style: .time)
                  }
                  ProgressView(timerInterval: start...end)
              }
          }
      }
