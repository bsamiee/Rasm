# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    trap:
        any:
            - has: {field: name, kind: property_identifier, pattern: $TRAP}
            - inside: {kind: pair, field: value, has: {field: key, kind: property_identifier, pattern: $TRAP}}
    reflect:
        has: {field: object, regex: '^((globalThis|window|self)\.)?Reflect$', matches: typescript-global-reference}
    parameter-1: {kind: required_parameter, nthChild: 1, has: {field: pattern, kind: identifier, pattern: $A}}
    parameter-2: {kind: required_parameter, nthChild: 2, has: {field: pattern, kind: identifier, pattern: $B}}
    parameter-3: {kind: required_parameter, nthChild: 3, has: {field: pattern, kind: identifier, pattern: $C}}
    parameter-4: {kind: required_parameter, nthChild: 4, has: {field: pattern, kind: identifier, pattern: $D}}
    reflect-1:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(getPrototypeOf|isExtensible|ownKeys|preventExtensions)$', pattern: $TRAP}, matches: reflect}
            - has: {field: arguments, pattern: {context: f($A), selector: arguments}}
    reflect-2:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(deleteProperty|getOwnPropertyDescriptor|has|setPrototypeOf)$', pattern: $TRAP}, matches: reflect}
            - has: {field: arguments, pattern: {context: 'f($A, $B)', selector: arguments}}
    reflect-3:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(apply|construct|defineProperty|get)$', pattern: $TRAP}, matches: reflect}
            - has: {field: arguments, pattern: {context: 'f($A, $B, $C)', selector: arguments}}
    reflect-4:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^set$', pattern: $TRAP}, matches: reflect}
            - has: {field: arguments, pattern: {context: 'f($A, $B, $C, $D)', selector: arguments}}
    reflect-rest:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, pattern: $TRAP}, matches: reflect}
            - has: {field: arguments, pattern: {context: f(...$A), selector: arguments}}
    single-return:
        kind: statement_block
        not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    forwarded-1: {any: [{matches: reflect-1}, {matches: single-return, has: {kind: return_statement, has: {matches: reflect-1}}}]}
    forwarded-2: {any: [{matches: reflect-2}, {matches: single-return, has: {kind: return_statement, has: {matches: reflect-2}}}]}
    forwarded-3: {any: [{matches: reflect-3}, {matches: single-return, has: {kind: return_statement, has: {matches: reflect-3}}}]}
    forwarded-4: {any: [{matches: reflect-4}, {matches: single-return, has: {kind: return_statement, has: {matches: reflect-4}}}]}
    forwarded-rest: {any: [{matches: reflect-rest}, {matches: single-return, has: {kind: return_statement, has: {matches: reflect-rest}}}]}
rule:
    kind: arrow_function, function_expression, method_definition
    all:
        - not: {regex: '^async(?-u:\b)'}
        - not: {has: {field: parameters, has: {kind: required_parameter, has: {field: value, pattern: $_}}}}
        - matches: trap
        - matches: typescript-proxy-trap
        - any:
            - all:
                - any: [{has: {field: parameter, kind: identifier, pattern: $A}}, {has: {field: parameters, has: {matches: parameter-1}, not: {has: {nthChild: 2}}}}]
                - has: {field: body, matches: forwarded-1}
            - all:
                - has: {field: parameters, all: [{has: {matches: parameter-1}}, {has: {matches: parameter-2}}], not: {has: {nthChild: 3}}}
                - has: {field: body, matches: forwarded-2}
            - all:
                - has: {field: parameters, all: [{has: {matches: parameter-1}}, {has: {matches: parameter-2}}, {has: {matches: parameter-3}}], not: {has: {nthChild: 4}}}
                - has: {field: body, matches: forwarded-3}
            - all:
                - has: {field: parameters, all: [{has: {matches: parameter-1}}, {has: {matches: parameter-2}}, {has: {matches: parameter-3}}, {has: {matches: parameter-4}}], not: {has: {nthChild: 5}}}
                - has: {field: body, matches: forwarded-4}
            - all:
                - has: {field: parameters, has: {kind: required_parameter, nthChild: 1, has: {field: pattern, kind: rest_pattern, has: {kind: identifier, pattern: $A}}}, not: {has: {nthChild: 2}}}
                - has: {field: body, matches: forwarded-rest}
message: '`$TRAP` trap forwards its arguments to `Reflect.$TRAP` unchanged'
note: 'Delete the trap, default behavior performs it'
