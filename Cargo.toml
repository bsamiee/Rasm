# --- [LINTS] ----------------------------------------------------------------------------

# --- [RUST]

[workspace.lints.rust]
ambiguous_negative_literals   = "deny"                            # `-1.abs()` negating method result in place of literal
closure_returning_async_block = "deny"                            # Closures returning `async` block, async closure is the direct form
dead_code_pub_in_binary       = "deny"                            # `pub` items of binary crates nothing reads, removals delete every mention
deprecated_in_future          = "deny"                            # Items marked deprecated from future release
deref_into_dyn_supertrait     = "deny"                            # `Deref` impls from `dyn` subtrait to supertrait object, trait upcasting shadows each
impl_trait_redundant_captures = "deny"                            # `use<..>` listing every in-scope parameter, edition 2024 `impl Trait` captures each by default
let_underscore_drop           = "deny"                            # `let _ =` dropping values with destructors at once, acquisition and release pair in one resource scope
macro_use_extern_crate        = "deny"                            # `#[macro_use] extern crate`, `use` paths import each macro from its owner
missing_debug_implementations = "deny"                            # Public types without `Debug`, boundary tracing records values with `?`
non_ascii_idents              = "deny"                            # Non-ASCII identifiers
redundant_imports             = "deny"                            # Imports that prelude or earlier `use` items provide
redundant_lifetimes           = "deny"                            # Lifetime parameters that bounds make equal to another named lifetime
rust_2018_idioms              = { level = "deny", priority = -1 } # Hidden path lifetimes, inferable outlives bounds, and unused `extern crate` items
single_use_lifetimes          = "deny"                            # Named lifetimes used once, `'_` states lifetime no second position shares
unconditional_panic           = "forbid"                          # Operations rustc proves will panic
unnameable_types              = "deny"                            # Types and traits public signatures expose but consumers cannot name
unreachable_pub               = "deny"                            # `pub` items unreachable from the crate root, visibility states the reach consumers have
unsafe_code                   = "forbid"                          # Unsafe code and unsafe attributes with no override, unsafe operations stay inside owning crates
unused_import_braces          = "deny"                            # `use a::{b}` braces around one import, code keeps the direct form
unused_lifetimes              = "deny"                            # Lifetime parameters nothing reads, removals delete every mention
unused_macro_rules            = "deny"                            # `macro_rules!` rules nothing invokes, removals delete every mention
unused_qualifications         = "deny"                            # Qualified paths to names in scope, code calls owning APIs directly

# --- [GROUPS]

[workspace.lints.clippy]
cargo    = { level = "deny", priority = -1 } # Missing package metadata, negative or redundant feature names, and wildcard requirements
nursery  = { level = "deny", priority = -1 } # Lints under development, code smells are fixed as found
pedantic = { level = "deny", priority = -1 } # Strict lints with occasional false positives, code smells are fixed as found

# --- [PARTIALITY]

exit                   = "deny"   # `process::exit` outside `main`, boundary translates results into exit codes
expect_used            = "deny"   # `expect` on `Option` and `Result`, consumers compose without unwrapping
infinite_loop          = "deny"   # Endless loops in functions not returning `!`, signatures state divergence
missing_assert_message = "deny"   # Assertions without message, each failure in a test or `const` block names its broken invariant
out_of_bounds_indexing = "forbid" # Constant array indices and ranges Clippy proves exceed their bounds
panic                  = "deny"   # `panic!` calls, expected failures use the result type
todo                   = "deny"   # `todo!` placeholders, work runs to completion
unimplemented          = "deny"   # `unimplemented!` placeholders, work runs to completion
unreachable            = "deny"   # `unreachable!` calls, invalid states stay unrepresentable at construction
unwrap_used            = "deny"   # `unwrap` on `Option` and `Result`, consumers compose without unwrapping

# --- [OUTPUT]

dbg_macro      = "deny" # `dbg!` calls, telemetry goes through tracing at boundaries
pointer_format = "deny" # `{:p}` and `Debug` output holding raw or function pointers, addresses vary per run and expose memory layout
print_stderr   = "deny" # `eprint!` and `eprintln!`, domain functions write only their return value
print_stdout   = "deny" # `print!` and `println!`, domain functions write only their return value
use_debug      = "deny" # `{:?}` in format strings, text people read renders through `Display`

# --- [ATTRIBUTES]

allow_attributes                = "deny" # `#[allow]` on lints, `#[expect]` fails once the suppressed lint stops firing
allow_attributes_without_reason = "deny" # `#[expect]` and `#[allow]` without `reason`, each suppression names the fact excusing it
cfg_not_test                    = "deny" # `#[cfg(not(test))]` code, tests run what product runs
redundant_test_prefix           = "deny" # `test_` prefixes on `#[test]` functions, each fact is stated once

# --- [RESULTS]

assertions_on_result_states = "deny" # `assert!(r.is_ok())` and `assert!(r.is_err())`, failures print no `Result` contents
let_underscore_must_use     = "deny" # `let _ =` on must-use values, control flow matches every result case
let_underscore_untyped      = "deny" # `let _ =` without type, each discard names dropped type
try_err                     = "deny" # `Err(x)?` in place of `return Err(x)` outside `try` blocks, `?` marks a call that can fail
unused_result_ok            = "deny" # `.ok()` calls discarding `Result`, control flow matches every result case

# --- [EXPRESSIONS]

deref_by_slicing                     = "deny" # `&v[..]` full-range slices, deref is the direct form
if_then_some_else_none               = "deny" # `if` choosing `Some` or `None`, `bool::then` states it as one expression
iter_over_hash_type                  = "deny" # `for` loops over `HashMap` or `HashSet`, result order stays deterministic
map_with_unused_argument_over_ranges = "deny" # `(0..n).map(|_| x)`, `repeat_n` states count directly
mixed_read_write_in_expression       = "deny" # Reads and writes of one variable ordered by operand evaluation order
pathbuf_init_then_push               = "deny" # `PathBuf` creation followed by `push`, paths build in one expression
redundant_type_annotations           = "deny" # Annotations restating initializer's type, inferred types stand
semicolon_outside_block              = "deny" # `{ f(); }` block statements, `{ f() };` is the direct form

# --- [PATTERNS]

ref_patterns             = "deny" # `ref` bindings, matching on borrowed scrutinee is the direct form
unnecessary_rest_pattern = "deny" # `..` capturing no field, patterns state exactly fields they bind

# --- [NUMERICS]

arithmetic_side_effects    = "deny" # Integer `+`, `-`, `*`, `/`, and `%` that can overflow or divide by zero, `checked_*` returns absence and `strict_*` names the panic
float_cmp_const            = "deny" # `==` and `!=` against nonzero float constants, comparisons state their tolerance
host_endian_bytes          = "deny" # `to_ne_bytes` and `from_ne_bytes`, encodings name their endianness
lossy_float_literal        = "deny" # Whole-number float literals their type cannot hold exactly
modulo_arithmetic          = "deny" # `%` over signed or float operands taking dividend's sign, `rem_euclid` states sign rule
non_zero_suggestions       = "deny" # `NonZero` values widened through plain integer, `NonZero::from` keeps invariant
precedence_bits            = "deny" # Shifts mixed with `&`, `|`, or `^` without parentheses
suspicious_xor_used_as_pow = "deny" # `2 ^ 8` read as power, `pow` states exponentiation
unseparated_literal_suffix = "deny" # `1u32` suffixes, `1_u32` is the one spelling Clippy's suggestions write

# --- [STRINGS]

needless_raw_strings = "deny" # `r"..."` literals with nothing to escape, code keeps the direct form
str_to_string        = "deny" # `str::to_string` calls, `to_owned` names conversion directly
string_add           = "deny" # `String + &str`, asymmetric `Add` that `push_str` replaces
string_lit_chars_any = "deny" # `"abc".chars().any(..)` membership tests, `matches!` states set directly

# --- [OWNERSHIP]

clone_on_ref_ptr = "deny" # `.clone()` on `Rc`, `Arc`, and `Weak`, `Arc::clone(&x)` names the shared handle it copies
empty_drop       = "deny" # Empty `Drop` impls, removals delete every mention
mem_forget       = "deny" # `mem::forget` on values with destructors, release runs on every path
rc_buffer        = "deny" # `Rc` or `Arc` over growable buffers, shared values publish as immutable `str` or slices

# --- [DECLARATIONS]

empty_enum_variants_with_brackets = "deny" # `Variant()` and `Variant {}` with no fields, `Variant` is the direct form
empty_structs_with_brackets       = "deny" # `struct S {}` and `struct S();`, `struct S;` is the direct form
inline_trait_bounds               = "deny" # Bounds inside function `<..>`, every bound sits in `where` clause
multiple_inherent_impl            = "deny" # Inherent `impl` blocks split across crate, members stay in their type's section
same_name_method                  = "deny" # Inherent methods sharing trait method names, each call site names one member

# --- [VISIBILITY]

partial_pub_fields    = "deny" # Structs mixing public and private fields, types are plain data or guard their invariant whole
pub_without_shorthand = "deny" # `pub(in super)` visibility paths, `pub(super)` is the direct form

# --- [MODULES]

alloc_instead_of_core    = "deny" # Paths through `alloc` to items `core` owns, `core` names owner
std_instead_of_core      = "deny" # Paths through `std` to items `core` owns, `core` names owner
inline_modules           = "deny" # Inline `mod` blocks outside tests, each module takes its own file
mod_module_files         = "deny" # `mod.rs` files, each module file takes its module's name
unnecessary_self_imports = "deny" # `use m::{self}` imports, code keeps the direct form
unused_trait_names       = "deny" # `use Trait` imported for its methods alone, `as _` states import serves method resolution

# --- [NAMING]

error_impl_error           = "deny" # Error types named `Error`, each names raising package
min_ident_chars            = "deny" # Single-character identifiers, single letters name coordinate axes, color channels, and IEC 61672-1 weightings alone
module_name_repetitions    = "deny" # Item names repeating their module's name, paths state module once
renamed_function_params    = "deny" # Trait impls renaming trait parameters, trait owns each parameter name
single_char_lifetime_names = "deny" # Single-character lifetime names, each lifetime names its purpose

# --- [ALLOWED]

empty_enums                 = "allow" # Flags kind markers `impl_typed_uuid_kinds!` declares per entity, ast-grep `no-empty-enum` owns written enums
future_not_send             = "allow" # Demands `Sync` on generic parameters an async fn borrows, return-type notation binds `Send` at spawning use site
manual_assert               = "allow" # Rewrites flagged `panic!` calls into run-time assertions, expected failures use the result type
missing_errors_doc          = "allow" # Names and types state each contract in place of doc comments
missing_panics_doc          = "allow" # Names and types state each contract in place of doc comments
multiple_crate_versions     = "allow" # Resolves the whole dependency graph once per crate checked, for splits upstream releases own
option_if_let_else          = "allow" # Rewrites `match` and `if let` over `Option` into `map_or` or `map_or_else`, control flow selects by pattern matching result cases
redundant_field_names       = "allow" # Flags `field: field` literals, rustfmt `use_field_init_shorthand` rewrites each
redundant_pub_crate         = "allow" # Demands `pub` on items in private modules where rustc `unreachable_pub` demands `pub(crate)`
significant_drop_tightening = "allow" # Demands `drop` of lock guards before scope end, acquisition and release pair in one resource scope
too_many_lines              = "allow" # Caps functions at 100 lines, data dependency decides composition in place of line count

# --- [CARGO]

[workspace.lints.cargo]
pedantic                      = { level = "deny", priority = -1 } # Binary names off kebab case and `readme` keys restating inferred file, each fact is stated once
non_kebab_case_features       = "deny"                            # Feature names off kebab case, one spelling beside kebab-case package and binary names
non_kebab_case_packages       = "deny"                            # Package names off kebab case, Nx project, package, and installed binary share one spelling
unused_workspace_dependencies = "allow"                           # Flags catalog rows held for future members, Cargo resolves inherited rows alone

# --- [PROFILES] -------------------------------------------------------------------------

[profile.dev]
debug = "line-tables-only" # Backtraces show file and line with no variable or parameter info, fuller debug info slows each link

[profile.dev.package."*"]
debug = false # Non-member backtrace frames lack file and line

[profile.dist]
inherits        = "release" # `cargo dylint` builds lint libraries under unwinding `release`
panic           = "abort"   # Service manager restarts process after defect panic in place of tokio catching each task panic
overflow-checks = true      # Integer overflow panics as defect in place of wrapping to wrong value
