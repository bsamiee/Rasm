# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
utils:
    leaving:
        kind: command
        has: {field: name, regex: '^(return|exit)$'}
    break:
        matches: {bash-loop-control: {command: {regex: '^break$'}}}
    outer-break:
        matches: break
        has: {field: argument, regex: '^["'']?\+?([2-9]|[1-9][0-9]+)["'']?$'}
    reader:
        any:
            - kind: command
              has: {field: name, pattern: $READER, regex: '^(mapfile|readarray)$'}
              not: {has: {kind: 'word, string, raw_string', regex: '^["'']?-[a-zA-Z]*C'}}
            - kind: redirected_statement
              has: {field: body, matches: reader}
rule:
    kind: while_statement
    regex: '^while(?-u:\b)'
    all:
        - has: {matches: reader, precedes: {kind: do_group, stopBy: {not: {regex: '^;$'}}}}
        - not:
            has:
                field: body
                any:
                    - has: {stopBy: {matches: bash-isolated-scope}, matches: leaving}
                    - has: {stopBy: {matches: bash-isolated-scope}, matches: outer-break}
                    - has: {stopBy: {any: [{matches: bash-isolated-scope}, {kind: 'while_statement, for_statement, c_style_for_statement'}]}, matches: break}
message: '`$READER` succeeds at end of input in a loop condition'
note: Test fresh batch length or use a reader that reports end of input
