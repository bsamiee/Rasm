# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-answering-error
language: python
severity: error
utils:
    error-return:
        kind: block
        all:
            - has: {nthChild: 1, kind: return_statement, has: {kind: call, has: {field: function, kind: identifier, regex: '^Error$'}}}
            - not: {has: {nthChild: 2}}
    single-class:
        kind: except_clause
        all:
            - has: {field: value, any: [{kind: identifier}, {kind: attribute}, {kind: as_pattern, has: {kind: 'identifier, attribute'}}]}
            - not: {has: {nthChild: 2, not: {kind: block}}}
rule:
    kind: try_statement
    all:
        - has: {kind: except_clause}
        - not: {has: {kind: finally_clause}}
        - not: {has: {kind: except_clause, not: {matches: single-class}}}
        - not: {has: {kind: except_clause, not: {has: {matches: error-return}}}}
message: '`try` answers `Error` from every handler'
note: 'Call `expression.extra.result.catch(<callee>, exception=<error>)(<arguments>)`'
