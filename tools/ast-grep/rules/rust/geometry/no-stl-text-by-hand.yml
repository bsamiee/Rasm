# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-stl-text-by-hand
language: rust
severity: error
rule:
    kind: string_literal
    pattern: $TEXT
    matches: rust-stl-text
message: '`$TEXT` reads ASCII STL records by hand'
note: 'Read through `stl_io::read_stl(&mut reader)`, the function reads ASCII and binary STL into a `stl_io::IndexedMesh`'
