# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-http"
version.workspace = true
edition.workspace = true
description       = "HTTP server for an axum service: listeners on every resolved address of each host, and staged graceful shutdown under a grace deadline"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-util                         = { workspace = true }
socket2                            = { workspace = true }
nonempty-collections               = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
jiff                               = { workspace = true }
axum                               = { workspace = true }
http                               = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
