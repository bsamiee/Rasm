# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
# --- [BEHAVIOR]

default-groups   = "all"
preview-features = ["lockfile-format-check"]

# --- [RESOLUTION]

environments          = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
prerelease            = "allow"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]                                                                # Each needs a wheel or source distribution of every package its markers select, else `uv lock` fails

# --- [BUILDS]

extra-build-dependencies = { pyroscope-io = ["cmake"] } # `pyroscope-io` build.rs runs cmake its sdist leaves undeclared
no-build-package         = ["epdx"]                     # `epdx` sdist lacks `project.version`

[tool.uv.workspace]
members = [
    "libs/python/data/records",
    "libs/python/graphics/typography",
    "libs/python/runtime/cli",
    "libs/python/runtime/telemetry",
    "products/cli/foundry",
    "tests/libs/python/graphics/typography",
    "tests/libs/python/runtime/telemetry",
    "tests/products/cli/foundry",
    "tests/support/python",
    "tests/tools/refurb",
    "tools/refurb",
]

[tool.uv.sources]
rasm-cli        = { workspace = true }
rasm-foundry    = { workspace = true }
rasm-records    = { workspace = true }
rasm-refurb     = { workspace = true }
rasm-telemetry  = { workspace = true }
rasm-testing    = { workspace = true }
rasm-typography = { workspace = true }

[tool.uv.config-settings-package.pyarrow]
"cmake.define.PYARROW_GANDIVA" = "OFF" # PyPI wheels omit Gandiva, which Arrow's conda configuration enables

# --- [PIXI] -----------------------------------------------------------------------------

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "27.0" }, "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.environments.default]
no-default-feature = true

[tool.pixi.environments.default.dependencies]
# --- [ARROW]

libarrow           = "25.*"
libarrow-acero     = "25.*"
libarrow-compute   = "25.*"
libarrow-dataset   = "25.*"
libarrow-flight    = "25.*"
libarrow-substrait = "25.*"
libparquet         = "25.*"

# --- [TEXT]

fontconfig  = "*"
icu         = "78.*" # Every conda-forge libxml2 build links ICU below 79 or refuses ICU, so 79 fails the solve
libglib     = "*"
libharfbuzz = "*"
libpango    = "*"

# --- [FORMATS]

hdf5         = "2.2.*"
libmagic     = "*"
libpdal-core = "2.10.*"

# --- [OPENMP]

llvm-openmp = "*"

# --- [ACTIVATION]

[tool.pixi.environments.default.target.unix.activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
CPATH             = "$CONDA_PREFIX/include"
HDF5_DIR          = "$CONDA_PREFIX"
LDFLAGS           = "-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"

[tool.pixi.environments.default.target.win.activation.env]
CMAKE_PREFIX_PATH          = "%CONDA_PREFIX%\\Library"
HDF5_DIR                   = "%CONDA_PREFIX%\\Library"
ICU_VERSION                = "78"
INCLUDE                    = "%CONDA_PREFIX%\\Library\\include;%INCLUDE%"
LIB                        = "%CONDA_PREFIX%\\Library\\lib;%LIB%"
WEASYPRINT_DLL_DIRECTORIES = "%CONDA_PREFIX%\\Library\\bin"

# --- [TASKS]

[tool.pixi.environments.default.target.linux.tasks]
python = { cmd = "python", env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" } } # An activation row reaches every `pixi run` child ahead of system libraries, sdist builds included

[tool.pixi.environments.default.target.osx.tasks]
python = { cmd = "python", env = { DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib:$HOME/lib:/usr/local/lib:/lib:/usr/lib" } } # `pixi run` loses activation `DYLD_*` rows through the SIP-protected `/usr/bin/env` that captures them, and a set variable replaces dyld's default fallback list, restated after the Pixi folder

# --- [MYPY] -----------------------------------------------------------------------------

[tool.mypy]
# --- [DISCOVERY]

cache_dir              = "$MYPY_CONFIG_FILE_DIR/.cache/mypy"
exclude_gitignore      = true
explicit_package_bases = true                                # Each run names modules from its working folder, the member root holding the `rasm` namespace folder
plugins                = ["pydantic.mypy"]                   # Typed `__init__` and `model_construct` of each pydantic model, frozen models under a settings base, and no explicit `Any` in a synthesized signature

# --- [STRICTNESS]

disallow_any_explicit    = true
disallow_any_unimported  = true
strict                   = true
strict_equality_for_none = true
warn_unreachable         = true

# --- [ERROR_CODES]

disable_error_code = ["abstract", "arg-type", "assert-type", "assignment", "attr-defined", "call-arg", "call-overload", "import-not-found", "index", "name-defined", "no-redef", "operator", "override", "redundant-cast", "return", "return-value", "type-arg", "union-attr", "unused-coroutine", "valid-type", "var-annotated"] # ty owns each defect these codes report except `var-annotated`, which mypy raises on comprehension variables of each lambda a generic call infers, ruff PGH003 owns suppressions without a code
enable_error_code  = ["exhaustive-match", "redundant-self", "truthy-bool"]                                                                                                                                                                                                                                                        # ty owns `deprecated`, `missing-override-decorator`, `truthiness-test-of-iterable`, and `unused-awaitable`

# --- [MODULES]

overrides             = [{ module = ["fontTools.*", "ots.*", "pathops.*", "pvlib.*", "sqlite_vec", "sysexits", "ttfautohint.*", "ufo2ft.*", "uharfbuzz.*"], follow_untyped_imports = true }, { module = ["pathops"], implicit_reexport = true }]
untyped_calls_exclude = ["_skimage2.transform._geometric.ProjectiveTransform", "fontTools", "OpenImageIO.ColorConfig", "opentelemetry.distro", "opentelemetry.exporter.otlp.proto.http.trace_exporter", "opentelemetry.instrumentation.structlog", "opentelemetry.sdk._configuration", "opentelemetry.sdk._logs._internal.export.in_memory_log_exporter", "opentelemetry.test.mock_test_classes", "ots", "pvlib", "ufo2ft"] # Definitions these packages ship unannotated, OpenImageIO types `ColorConfig.get_cicp` only in releases newer than the one Blender bundles

[tool.pydantic-mypy]
init_forbid_extra             = true
init_typed                    = true
warn_required_dynamic_aliases = true

# --- [REFURB] ---------------------------------------------------------------------------

[tool.refurb]
disable    = [
    # --- [RUFF_CODES]

    "FURB101",    # Ruff runs FURB101
    "FURB103",    # Ruff runs FURB103
    "FURB105",    # Ruff runs FURB105
    "FURB110",    # Ruff runs FURB110
    "FURB116",    # Ruff runs FURB116
    "FURB136",    # Ruff runs FURB136
    "FURB140",    # Starmap suggestion ignores comprehension `if` filters, Ruff's FURB140 checks them
    "FURB152",    # Ruff runs FURB152
    "FURB154",    # Ruff runs FURB154
    "FURB156",    # Ruff runs FURB156
    "FURB157",    # Ruff runs FURB157
    "FURB161",    # Ruff runs FURB161
    "FURB162",    # Ruff runs FURB162
    "FURB163",    # Ruff runs FURB163
    "FURB164",    # Ruff runs FURB164
    "FURB166",    # Ruff runs FURB166
    "FURB167",    # Ruff runs FURB167
    "FURB168",    # Ruff runs FURB168
    "FURB169",    # Ruff runs FURB169
    "FURB171",    # Ruff runs FURB171
    "FURB177",    # Ruff runs FURB177
    "FURB180",    # Ruff runs FURB180
    "FURB188",    # Ruff runs FURB188
    "FURB189",    # Ruff runs FURB189
    "FURB192",    # Ruff runs FURB192

    # --- [RUFF_EQUIVALENTS]

    "FURB104",    # Ruff PTH109 reports the form
    "FURB108",    # Ruff PLR1714 reports the form
    "FURB111",    # Ruff PLW0108 reports the form
    "FURB112",    # Ruff C408 reports the form
    "FURB114",    # Ruff SIM208 reports the form
    "FURB117",    # Ruff PTH123 reports the form
    "FURB119",    # Ruff RUF010 reports the form
    "FURB121",    # Ruff SIM101 reports the form
    "FURB125",    # Ruff PLR1711 reports the form
    "FURB128",    # Ruff PLR1712 reports the form
    "FURB130",    # Ruff SIM118 reports the form
    "FURB134",    # Ruff UP033 reports the form
    "FURB135",    # Ruff PERF102 reports the form
    "FURB137",    # Ruff C400, C401, C409, and C419 report the form
    "FURB138",    # Ruff PERF401 reports the form
    "FURB141",    # Ruff PTH110 reports the form
    "FURB144",    # Ruff PTH107 and PTH108 report the form
    "FURB146",    # Ruff PTH112, PTH113, PTH114, and PTH117 report the form
    "FURB147",    # Ruff PTH118 reports the form, FURB147 rejects `posixpath.join` on archive and URL paths
    "FURB150",    # Ruff PTH102 and PTH103 report the form
    "FURB153",    # Ruff PTH201 reports the form
    "FURB155",    # Ruff PTH116 and PTH202 through PTH205 report the form
    "FURB160",    # Ruff PLW0127 reports the form
    "FURB176",    # Ruff DTZ003 and DTZ004 report the form

    # --- [REJECTED_REWRITES]

    "FURB107",    # Rewrites to `contextlib.suppress` `banned-api` rejects, Ruff SIM105 and S110 report swallowed exceptions
    "FURB109",    # Rewrites to a tuple membership Ruff PLR6201 rejects
    "FURB118",    # Rewrites to `operator` functions typeshed types as returning `Any`, `banned-api` rejects the getters
    "FURB124",    # Chained `x is y is z` compares outer operands mypy comparison-overlap rejects when types differ
    "FURB126",    # Dropping a trailing `case _` arm fails mypy exhaustive-match
    "FURB173",    # Merged literal `{...} | d` infers its own value type, mypy rejects it at target parameter type

    # --- [CHANGED_RESULTS]

    "FURB100",    # Arbitrary slices of `str(path)` need not remove its suffix, `Path.with_suffix` changes the result
    "FURB106",    # `expandtabs` differs from its replacement unless tabs lead the string
    "FURB151",    # `Path.touch` keeps an existing file's content, the replaced `open` truncates it
    "FURB172",    # `Path.suffix` differs from `endswith` for multi-part extensions and dotfiles
    "FURB183",    # `str(value)` calls `__str__`, formatting calls `__format__`
    "FURB184",    # Matches names with no type or binding check, chaining drops annotations and reused bindings
    "FURB186",    # In-place sorting changes list identity and aliases, functional code retains `sorted`
    "FURB187",    # In-place reversal changes list identity and aliases, Ruff's reverse-copy rule preserves a copied result
    "FURB190",    # Unbound `str` methods lose receiver overrides and reject bytes accepted by an untyped lambda

    # --- [RECEIVER_TYPES]

    "FURB113",    # Named receiver types do not prove exact builtin list mutation
    "FURB132",    # Named receiver types do not prove exact builtin mutation, hashing, or equality
    "FURB142",    # Named receiver types do not prove exact builtin set mutation

    # --- [RASM_CHECKS]

    "FURB120",    # Crashes on argument lists the mypy cache drops (`'FuncItem' arguments undefined`), RASM102 reports same-module restated defaults
    "FURB179",    # Reports `reduce(add, ...)` over arithmetic values as list concatenation, RASM107 owns `chain` flattening per Python version
]
enable_all = true
quiet      = true

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
format             = { exclude = ["*.md"], docstring-code-format = true, skip-magic-trailing-comma = true }
line-length        = 200
namespace-packages = ["products/cli/*/rasm", "libs/python/*/*/rasm", "tools/refurb/rasm", "tests/support/python/rasm"] # PEP 420 `rasm` folders, read as packages so each module resolves under `rasm.<name>`
preview            = true
src                = ["products/cli/*", "libs/python/*/*", "tests/support/python", "tools/refurb"]

[tool.ruff.lint]
select                    = ["ALL"]
ignore                    = [
    # --- [FORMATTER]

    "missing-trailing-comma",                                                                                                                                                                    # `skip-magic-trailing-comma` removes commas COM812 adds

    # --- [COUNTS]

    "complex-structure",                                                                                                                                                                         # Complexity scores push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "too-many-arguments",                                                                                                                                                                        # Argument counts push one-caller parameter records and wrappers
    "too-many-branches",                                                                                                                                                                         # Branch counts push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "too-many-locals",                                                                                                                                                                           # Local counts push one-caller helper extraction
    "too-many-positional-arguments",                                                                                                                                                             # Positional counts do not establish a domain record or keyword contract
    "too-many-public-methods",                                                                                                                                                                   # Member counts push one-caller helper extraction
    "too-many-return-statements",                                                                                                                                                                # Return counts push one-caller helper extraction, `match` arms return per case
    "too-many-statements",                                                                                                                                                                       # Statement counts push one-caller helper extraction
    "too-many-statements-in-try-clause",                                                                                                                                                         # Statement counts do not establish exception scope for native effects and typed refusals

    # --- [EXTRACTION]

    "f-string-in-exception",                                                                                                                                                                     # Moves message into a local only the raise reads
    "lambda-assignment",                                                                                                                                                                         # Pushes a `def` statement for a callback each `match` arm binds
    "magic-value-comparison",                                                                                                                                                                    # Moves a compared literal into a constant only that comparison reads
    "raise-vanilla-args",                                                                                                                                                                        # Pushes an exception class per message, raises stay for defects
    "raw-string-in-exception",                                                                                                                                                                   # Moves message into a local only the raise reads

    # --- [IMPORTS]

    "typing-only-first-party-import",                                                                                                                                                            # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "typing-only-standard-library-import",                                                                                                                                                       # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "typing-only-third-party-import",                                                                                                                                                            # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`

    # --- [PROCESSES]

    "start-process-with-partial-path",                                                                                                                                                           # Commands name tools mise places on `PATH`
    "subprocess-without-shell-equals-true",                                                                                                                                                      # Reports every argument-vector `subprocess` call
    "suspicious-subprocess-import",                                                                                                                                                              # Reports every `subprocess` import, process boundaries call it

    # --- [BANNED_API]

    "blocking-http-call-httpx-in-async-function",                                                                                                                                                # `banned-api` rejects `httpx`
    "blocking-http-call-in-async-function",                                                                                                                                                      # `banned-api` rejects every client it names
    "blocking-sleep-in-async-function",                                                                                                                                                          # `banned-api` rejects `time.sleep`
    "no-explicit-stacklevel",                                                                                                                                                                    # `banned-api` rejects `warnings.warn`
    "reimplemented-operator",                                                                                                                                                                    # Rewrites to `operator` functions typeshed types as returning `Any`, `banned-api` rejects the getters
    "request-without-timeout",                                                                                                                                                                   # `banned-api` rejects every client it names

    # --- [REFURB]

    "delete-full-slice",                                                                                                                                                                         # refurb FURB131 covers attribute receivers
    "for-loop-writes",                                                                                                                                                                           # refurb FURB122 owns the form
    "hashlib-digest-hex",                                                                                                                                                                        # refurb FURB181 covers attribute receivers
    "len-test",                                                                                                                                                                                  # refurb FURB115 owns the form
    "multiple-starts-ends-with",                                                                                                                                                                 # refurb FURB102 owns the form
    "readlines-in-for",                                                                                                                                                                          # refurb FURB129 owns the form
    "slice-copy",                                                                                                                                                                                # refurb FURB145 owns the form
    "true-false-comparison",                                                                                                                                                                     # refurb FURB149 reports `is` and `==` on bool-typed operands alone
    "unnecessary-enumerate",                                                                                                                                                                     # refurb FURB148 owns the form, comprehensions included

    # --- [RECEIVER_TYPES]

    "check-and-remove-from-set",                                                                                                                                                                 # Nominal receiver types do not prove exact builtin mutation, hashing, or equality
    "for-loop-set-mutations",                                                                                                                                                                    # Nominal receiver types do not prove exact builtin set mutation
    "repeated-append",                                                                                                                                                                           # Nominal receiver types do not prove exact builtin list mutation

    # --- [TYPE_CHECKERS]

    "any-type",                                                                                                                                                                                  # mypy `disallow_any_explicit` owns explicit `Any` in every position
    "undefined-name",                                                                                                                                                                            # ty `unresolved-reference` owns undefined names

    # --- [FORMS]

    "batched-without-explicit-strict",                                                                                                                                                           # `strict=True` asserts lengths the code constructs
    "compare-with-tuple",                                                                                                                                                                        # PLR1714 reports the form as a set membership PLR6201 accepts
    "float-equality-comparison",                                                                                                                                                                 # Authored controls compare against exact identity values (`0.0`, `1.0`)
    "function-uses-loop-variable",                                                                                                                                                               # Reports closures `Result` and `Option` combinators call before the loop advances
    "missing-copyright-notice",                                                                                                                                                                  # Files hold no license header
    "os-path-abspath",                                                                                                                                                                           # `os.path.abspath` drops `..` without following symlinks, a combination no `pathlib` member has
    "zip-without-explicit-strict",                                                                                                                                                               # `strict=True` asserts lengths the code constructs
]
flake8-bandit             = { check-typed-exception = true }
flake8-boolean-trap       = { extend-allowed-calls = ["expression.Ok", "expression.Some", "iter"] }
flake8-import-conventions = { extend-aliases = { "dask.array" = "da", "dask.dataframe" = "dd", datetime = "datetime", scipy = "sp", sympy = "sym", xarray = "xr" }, banned-from = ["builtins"] }
flake8-pytest-style       = { parametrize-names-type = "csv", raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError"] }
flake8-type-checking      = { runtime-evaluated-base-classes = ["msgspec.Struct"] }
isort                     = { combine-as-imports = true, force-sort-within-sections = true, order-by-type = false, split-on-trailing-comma = false }
pycodestyle               = { max-line-length = 300 }
pydoclint                 = { ignore-one-line-docstrings = true }
pydocstyle                = { convention = "google" }
pylint                    = { allow-dunder-method-names = ["__name__", "__version__"] }                                                                                                          # Protocol properties type module attributes, which ty matches to a property alone
task-tags                 = ["---", "TODO", "FIXME", "XXX"]                                                                                                                                      # `# --- [<LABEL>]` dividers open with `---`, commented-out-code skips comments opening with a task tag

[tool.ruff.lint.per-file-ignores]
# --- [TESTS]

"**/tests/**"                                         = ["assert", "implicit-namespace-package"] # pytest imports each test file by rootdir path, a test root holds no package
"tests/libs/python/runtime/telemetry/conftest.py"     = ["banned-api", "pytest-fixture-autouse"] # Every case runs over the root logger and structlog configuration it restores, `structlog.reset_defaults` among them, so no case leaks process logging state
"tests/libs/python/runtime/telemetry/test_logger.py"  = ["banned-api"]                           # Cases configure structlog process-wide and empty the root logger, the state `telemetry.logger` stands apart from
"tests/libs/python/runtime/telemetry/test_process.py" = ["banned-api", "import-private-name"]    # Cases log through third-party stdlib loggers and read the logger class the scope restores, and opentelemetry-sdk holds its log exporters in private `_logs` alone

# --- [LIBRARIES]

"libs/python/blender/extension/rasm/extension/data/_lifecycle/reports.py" = ["import-private-name"]                                        # opentelemetry-semantic-conventions holds `process.exit.code` in `_incubating` alone
"libs/python/blender/rendering/rasm/rendering/_batch/supervision.py"      = ["import-private-name"]                                        # opentelemetry-api holds `EnvironmentSetter` in private `_envcarrier` alone
"libs/python/runtime/telemetry/rasm/telemetry/_entries.py"                = ["banned-api"]                                                 # Holds the stdlib logger under each bound logger, the `logging.getLogger` call every other module leaves to it
"libs/python/runtime/telemetry/rasm/telemetry/export.py"                  = ["import-private-name"]                                        # opentelemetry-api holds the entry point lookup the SDK caches in private `_importlib_metadata` alone
"libs/python/runtime/telemetry/rasm/telemetry/process.py"                 = ["banned-api", "import-private-name", "private-member-access"] # Composition root the `logging` rows name, opentelemetry-api holds environment carriers and its cached entry point lookup, the SDK its exporter name resolution, and system-metrics its default table in private members alone

[tool.ruff.lint.flake8-tidy-imports]
ban-lazy             = ["abc", "os", "sys"] # Interpreter startup loads them before any module runs
ban-relative-imports = "all"
require-lazy         = [
    "adbc_driver_flightsql",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "xarray",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
