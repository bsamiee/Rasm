# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-ignored-removal-errors
language: pythonlang
severity: error
rule:
    kind: call
    all:
        - has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, regex: '^ignore_errors$'}}, {has: {field: value, kind: 'true'}}]}}
        - has: {field: function, pattern: $CALL, matches: {python-member-use: {module: {regex: '^shutil$'}, name: {regex: '^rmtree$'}}}}
message: '`$CALL` with `ignore_errors=True` discards every removal failure'
note: 'Call `catch(shutil.rmtree, exception=OSError)` and recover `FileNotFoundError` alone'
