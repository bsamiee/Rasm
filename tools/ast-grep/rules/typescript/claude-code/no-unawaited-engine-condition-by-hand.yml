# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unawaited-engine-condition-by-hand
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    matches: claude-code-engine-condition
    # No async function encloses the call, the await the sibling no-unawaited-engine-condition writes has no place
    not: {inside: {matches: syntax-function-boundary, stopBy: {matches: syntax-function-boundary}, has: {regex: '^async$'}}}
message: The engine call answers a Promise and the condition reads the Promise inside a synchronous function
note: Make the enclosing hook async and await the call before the condition reads it, `async ($, e, next) => { if (await $.fs.exists(path)) ... }`
