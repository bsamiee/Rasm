# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-usage-literal
language: rust
severity: error
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $USAGE
    not: {matches: rust-macro-argument}
    any:
        - regex: '(^[br]*#*"|\\n|\n)\s*(?i:usage)\s*(:|\\n|\n)'
        - regex: '(^[br]*#*"|\\n|\n)\s*-[A-Za-z0-9],\s+--[a-z][\w-]*'
message: '`$USAGE` spells command-line help text by hand'
note: 'Derive the command with `#[derive(clap::Parser)]`, describe it through `#[command(about = <text>)]` and each argument through `#[arg(help = <text>)]`'
