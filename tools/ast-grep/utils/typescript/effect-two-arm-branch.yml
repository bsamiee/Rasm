# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# A two-arm branch over a boolean, an Option, an Either, or an Exit, as match or the effect-returning matchEffect on an Exit
id: effect-two-arm-branch
language: tsx
rule:
    kind: call_expression
    has:
        field: function
        kind: member_expression
        any:
            - pattern: Effect.if
            - all:
                  - has: {field: object, regex: '^(Boolean|Option|Either|Exit)$'}
                  - has: {field: property, regex: '^(match|matchEffect)$'}
