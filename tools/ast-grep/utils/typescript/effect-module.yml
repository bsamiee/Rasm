# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-module
language: tsxlang
arguments: [name]
rule:
    any:
        - matches: {typescript-import-reference: {source: {regex: '^(effect|@effect/[[^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]-]+)(/[a-z][[^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]-]*)*$'}, exported: {matches: name}}}
        - matches: {typescript-import-reference: {source: {regex: '^(effect|@effect/[[^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]-]+)(/[a-z][[^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]-]*)*/[A-Z][^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*$', matches: name}, exported: {regex: '^\*$'}}}
