# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observable-change-stream
language: swiftlang
severity: error
utils:
    observable-class:
        kind: class_declaration
        has: {kind: modifiers, has: {kind: attribute, regex: '^@(Observation\.)?Observable$'}}
rule:
    pattern: $SITE
    any:
        - kind: property_declaration
          has: {kind: type_annotation, has: {field: name, kind: 'array_type, dictionary_type', regex: '\bAsync(Throwing)?Stream<.*>\.Continuation\]$'}}
          inside: {kind: class_body, inside: {matches: observable-class}}
        - kind: didset_clause
          has: {kind: statements, has: {stopBy: end, kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^yield$'}}}}
          inside: {kind: willset_didset_block, inside: {kind: property_declaration, inside: {kind: class_body, inside: {matches: observable-class}}}}
message: '`$SITE` hands changes of an `@Observable` model to waiters through stream continuations the model feeds by hand'
note: 'Iterate `Observations { <model>.<property> }` at each waiter for every transactional change of the properties the closure reads, and keep the waited state a tracked stored property'
