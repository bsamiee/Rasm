# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-source-in-error-message
language: rust
severity: error
utils:
    comment:
        kind: 'line_comment, block_comment'
    attribute-run:
        kind: 'attribute_item, line_comment, block_comment'
    source-attribute:
        kind: attribute_item
        regex: '^#\[\s*(from|source)\s*\]$'
    other-attribute:
        kind: attribute_item
        not: {regex: '^#\[\s*source\s*\]$'}
    slot:
        not: {matches: attribute-run}
    error-attribute:
        kind: attribute_item
        has: {kind: attribute, has: {nthChild: 1, kind: identifier, regex: '^error$'}}
    message-arguments:
        kind: token_tree
        inside: {kind: attribute, field: arguments, inside: {matches: error-attribute}}
    owner:
        kind: 'enum_variant, struct_item'
        has: {field: name, pattern: $NAME}
    renders-0:
        matches: message-arguments
        any:
            - has: {kind: string_literal, regex: '(^|[^{])\{0(:[^{}]*)?\}'}
            - has: {kind: integer_literal, regex: '^0$', follows: {regex: '^\.$'}}
    renders-1:
        matches: message-arguments
        any:
            - has: {kind: string_literal, regex: '(^|[^{])\{1(:[^{}]*)?\}'}
            - has: {kind: integer_literal, regex: '^1$', follows: {regex: '^\.$'}}
    renders-2:
        matches: message-arguments
        any:
            - has: {kind: string_literal, regex: '(^|[^{])\{2(:[^{}]*)?\}'}
            - has: {kind: integer_literal, regex: '^2$', follows: {regex: '^\.$'}}
    source-at-0:
        kind: ordered_field_declaration_list
        has: {nthChild: {position: 1, ofRule: {matches: slot}}, follows: {stopBy: {matches: slot}, matches: source-attribute}}
    source-at-1:
        kind: ordered_field_declaration_list
        has: {nthChild: {position: 2, ofRule: {matches: slot}}, follows: {stopBy: {matches: slot}, matches: source-attribute}}
    source-at-2:
        kind: ordered_field_declaration_list
        has: {nthChild: {position: 3, ofRule: {matches: slot}}, follows: {stopBy: {matches: slot}, matches: source-attribute}}
    source-field:
        kind: field_declaration
        all:
            - has: {field: name, pattern: $FIELD}
            - any:
                - follows: {stopBy: {matches: slot}, matches: source-attribute}
                - has: {field: name, regex: '^source$'}
    source-named:
        kind: field_declaration_list
        has: {matches: source-field}
    rendered-source:
        matches: error-attribute
        any:
            - all:
                - has: {kind: attribute, has: {matches: renders-0}}
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, matches: source-at-0}}
            - all:
                - has: {kind: attribute, has: {matches: renders-1}}
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, matches: source-at-1}}
            - all:
                - has: {kind: attribute, has: {matches: renders-2}}
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, matches: source-at-2}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, matches: source-named}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: identifier, pattern: $FIELD, follows: {regex: '^(,|=|\.)$'}, not: {precedes: {regex: '^(\.|::|\()$'}}}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^source$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{source(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^error$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{error(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^err$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{err(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^cause$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{cause(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^inner$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{inner(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^io$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{io(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^other$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{other(:[^{}]*)?\}'}}}
            - all:
                - precedes: {stopBy: {matches: slot}, matches: owner, has: {field: body, has: {matches: source-field, has: {field: name, regex: '^reason$'}}}}
                - has: {kind: attribute, has: {matches: message-arguments, has: {kind: string_literal, regex: '(^|[^{])\{reason(:[^{}]*)?\}'}}}
    transparent-ready:
        matches: owner
        not: {has: {stopBy: end, matches: comment}}
        any:
            - has:
                field: body
                kind: ordered_field_declaration_list
                all:
                    - matches: source-at-0
                    - not: {has: {nthChild: {position: 2, ofRule: {matches: slot}}}}
            - has:
                field: body
                kind: field_declaration_list
                all:
                    - matches: source-named
                    - not: {has: {kind: field_declaration, nthChild: {position: 2, ofRule: {kind: field_declaration}}}}
    forwarding-attribute:
        matches: error-attribute
        has: {kind: attribute, has: {field: arguments, regex: '^\(\s*("\{(0|[A-Za-z_]\w*)\}"|"\{\}"\s*,\s*\.(0|[A-Za-z_]\w*))\s*,?\s*\)$'}}
        any:
            - precedes: {matches: transparent-ready, pattern: $TARGET, has: {field: body, kind: ordered_field_declaration_list}}
            - precedes: {matches: transparent-ready, kind: struct_item, pattern: $STRUCT, has: {field: body, kind: field_declaration_list}}
            - precedes: {matches: transparent-ready, kind: enum_variant, pattern: $PLAIN, has: {field: body, kind: field_declaration_list, not: {has: {matches: other-attribute}}}}
            - precedes: {matches: transparent-ready, kind: enum_variant, pattern: $ATTRIBUTED, has: {field: body, kind: field_declaration_list, has: {matches: other-attribute}}}
rule:
    any:
        - matches: forwarding-attribute
        - kind: string_literal
          pattern: $KEPT
          inside:
            matches: message-arguments
            inside: {kind: attribute, inside: {matches: rendered-source, not: {matches: forwarding-attribute}}}
transform:
    TARGET_HEAD: {replace: {source: $TARGET, replace: '(?s)^.*$', by: "#[error(transparent)]\n"}}
    TARGET_STRIPPED: replace($TARGET, replace='#\[\s*source\s*\]\s*', by='')
    STRUCT_HEAD: {replace: {source: $STRUCT, replace: '(?s)^.*$', by: "#[error(transparent)]\n"}}
    STRUCT_STRIPPED: replace($STRUCT, replace='#\[\s*source\s*\]\s*', by='')
    ATTRIBUTED_HEAD: {replace: {source: $ATTRIBUTED, replace: '(?s)^.*$', by: "#[error(transparent)]\n"}}
    ATTRIBUTED_STRIPPED: replace($ATTRIBUTED, replace='#\[\s*source\s*\]\s*', by='')
    PLAIN_HEAD: {replace: {source: $PLAIN, replace: '(?s)^.*$', by: "#[error(transparent)]\n"}}
    PLAIN_JOINED: replace($PLAIN, replace='\s*\n\s*', by=' ')
    PLAIN_STRIPPED: replace($PLAIN_JOINED, replace='#\[\s*source\s*\]\s*', by='')
    PLAIN_CLOSED: replace($PLAIN_STRIPPED, replace=',\s*\}', by=' }')
fix:
    template: '$TARGET_HEAD$TARGET_STRIPPED$STRUCT_HEAD$STRUCT_STRIPPED$ATTRIBUTED_HEAD$ATTRIBUTED_STRIPPED$PLAIN_HEAD$PLAIN_CLOSED$KEPT'
    expandEnd: {kind: 'enum_variant, struct_item'}
message: '`$NAME` renders the error `source()` returns inside its own message'
note: 'Name the operation and its subject in the message and leave the source to `source()`, a report walking the chain prints it once, `#[error(transparent)]` forwards both where the message holds nothing else'
