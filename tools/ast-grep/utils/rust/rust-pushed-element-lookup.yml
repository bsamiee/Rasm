# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-pushed-element-lookup
language: rust
arguments: [boundary]
rule:
    kind: 'expression_statement, let_declaration, call_expression, try_expression'
    all:
        - inside: {kind: block}
        - any:
            - all:
                - follows: {has: {nthChild: 1, pattern: $V.push($X)}}
                - any: [{pattern: $V.last_mut()}, {has: {stopBy: {matches: boundary}, pattern: $V.last_mut()}}]
            - all:
                - follows: {has: {nthChild: 1, pattern: $V.push_back($X)}}
                - any: [{pattern: $V.back_mut()}, {has: {stopBy: {matches: boundary}, pattern: $V.back_mut()}}]
            - all:
                - follows: {has: {nthChild: 1, pattern: $V.push_front($X)}}
                - any: [{pattern: $V.front_mut()}, {has: {stopBy: {matches: boundary}, pattern: $V.front_mut()}}]
            - all:
                - follows: {has: {nthChild: 1, pattern: '$V.insert($I, $X)'}}
                - has: {stopBy: {matches: boundary}, pattern: '&mut $V[$I]'}
