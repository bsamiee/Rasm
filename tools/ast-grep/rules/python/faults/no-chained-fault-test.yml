# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-chained-fault-test
language: python
severity: error
utils:
    fault-type:
        any:
            - matches: {faults-member: {name: {regex: '^Faults?$'}}}
            - kind: tuple
              all:
                - has: {matches: fault-type}
                - not: {has: {pattern: $_, not: {matches: fault-type}}}
            - kind: binary_operator
              all:
                - has: {field: operator, regex: '^\|$'}
                - has: {field: left, matches: fault-type}
                - has: {field: right, matches: fault-type}
    isinstance-call:
        kind: call
        has: {field: function, matches: {python-builtin-name: {name: {regex: '^isinstance$'}}}}
    none-comparison:
        kind: comparison_operator
        all:
            - has: {nthChild: 1, matches: fault-test}
            - has: {nthChild: 2, kind: none}
            - not: {has: {nthChild: 3}}
    fault-test:
        any:
            - matches: isinstance-call
              has: {field: arguments, has: {nthChild: 2, matches: fault-type}, not: {has: {nthChild: 3}}}
            - kind: call
              has: {field: function, matches: {faults-member: {name: {regex: '^collect_faults$'}}}}
            - kind: parenthesized_expression
              has: {kind: named_expression, has: {field: value, matches: fault-test}}
            - matches: none-comparison
              has: {field: operators, regex: '^is\s+not$'}
    negated-test:
        any:
            - kind: not_operator
              has: {field: argument, matches: fault-test}
            - matches: none-comparison
              has: {field: operators, regex: '^is$'}
    or-chain:
        any:
            - kind: boolean_operator
              has: {field: operator, regex: '^or$'}
            - kind: binary_operator
              has: {field: operator, regex: '^\|$'}
    and-chain:
        kind: boolean_operator
        has: {field: operator, regex: '^and$'}
    or-operand:
        any:
            - matches: fault-test
            - {matches: or-chain, has: {stopBy: {not: {matches: or-chain}}, matches: fault-test}}
    and-operand:
        any:
            - matches: negated-test
            - {matches: and-chain, has: {stopBy: {not: {matches: and-chain}}, matches: negated-test}}
    literal-generator:
        kind: generator_expression
        has: {kind: for_in_clause, has: {field: right, kind: 'tuple, list'}}
    narrowing-guard:
        kind: boolean_operator
        all:
            - has: {stopBy: {not: {kind: 'boolean_operator, not_operator'}}, matches: isinstance-call}
            - inside:
                kind: 'if_statement, elif_clause'
                field: condition
                has:
                    field: consequence
                    has:
                        nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}
                        kind: 'return_statement, raise_statement, continue_statement, break_statement'
rule:
    pattern: $TEST
    not: {matches: narrowing-guard}
    any:
        - all:
            - matches: or-chain
            - not: {inside: {matches: or-chain}}
            - has: {field: left, matches: or-operand}
            - has: {field: right, matches: or-operand}
        - all:
            - matches: and-chain
            - not: {inside: {matches: and-chain}}
            - has: {field: left, matches: and-operand}
            - has: {field: right, matches: and-operand}
        - kind: call
          all:
            - has: {field: arguments, matches: literal-generator, has: {field: body, matches: fault-test}}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^any$'}}}}
        - kind: call
          all:
            - has: {field: arguments, matches: literal-generator, has: {field: body, matches: negated-test}}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^all$'}}}}
message: '`$TEST` tests independent results for faults one at a time, one `match` over every result removes the chain'
note: 'Use one `match` over independent results with a success case naming each value and `case failed: return Faults.of(*failed)` in place of the statement holding the test, an exiting `if` keeping its `isinstance` chain since ty narrows no name after a tuple-subject `match`'
