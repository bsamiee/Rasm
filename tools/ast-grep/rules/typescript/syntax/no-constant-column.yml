# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-constant-column
language: tsx
severity: error
utils:
    # $KEY and $VALUE bind on the first row, every later row re-matches their text
    same-pair:
        kind: pair
        all:
            - has: {field: key, pattern: $KEY}
            - has: {field: value, pattern: $VALUE}
    # Plain nthChild counts a comment as a row, ofRule counts the objects alone
    array-rows:
        all:
            - matches: {syntax-homogeneous-container: {item: {kind: object}}}
            - has: {nthChild: {position: 2, ofRule: {kind: object}}, kind: object}
            - not: {has: {kind: object, not: {has: {matches: same-pair}}}}
    # Object-valued pairs of an object, a scalar pair beside them makes the container a record
    object-rows:
        all:
            - matches: {syntax-homogeneous-container: {item: {kind: pair, has: {field: value, kind: object}}}}
            - has: {nthChild: {position: 2, ofRule: {kind: pair}}, kind: pair}
            - not: {has: {kind: pair, has: {field: value, kind: object, not: {has: {matches: same-pair}}}}}
rule:
    kind: pair
    all:
        - has: {field: key, pattern: $KEY}
        - has: {field: value, pattern: $VALUE}
        # First-row pairs report once, the later rows re-match through same-pair
        - inside:
              kind: object
              any:
                  - all: [{nthChild: {position: 1, ofRule: {kind: object}}}, {inside: {matches: array-rows}}]
                  - inside: {kind: pair, nthChild: {position: 1, ofRule: {kind: pair}}, field: value, inside: {matches: object-rows}}
constraints:
    VALUE:
        any:
            - matches: syntax-string-literal
            - kind: number
            - kind: unary_expression
              has: {kind: number}
            - kind: 'true'
            - kind: 'false'
            - kind: 'null'
            - kind: undefined
            - kind: regex
message: Every row holds $KEY as $VALUE, the column states one fact for the whole collection
note: >-
    Delete the column and apply the value once where the rows are consumed,
    a fact that holds for every row belongs to the collection or to its consumer
labels:
    KEY: {style: primary, message: The column that holds one value on every row}
