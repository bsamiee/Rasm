id: no-return-by-branch
valid:
    # The dispatch on the value
    - "const verdict = (sustained: boolean): Verdict => Boolean.match(sustained, { onFalse: () => 'pass', onTrue: () => 'regression' });"
    # If with an else clause, a full branch and no fall-through return
    - |
      const verdict = (sustained) => {
          if (sustained) {
              return 'regression';
          } else {
              return 'pass';
          }
      };
    # If with an else clause followed by a return, the else takes the branch
    - |
      const verdict = (sustained) => {
          if (sustained) {
              return 'regression';
          } else {
              log('pass');
          }
          return 'pass';
      };
    # Guard with a second statement in its block
    - |
      const verdict = (sustained) => {
          if (sustained) {
              log('sustained');
              return 'regression';
          }
          return 'pass';
      };
    # Guard followed by a statement other than a return
    - |
      const verdict = (sustained) => {
          if (sustained) {
              return 'regression';
          }
          log('pass');
          return 'pass';
      };
    # Guard with no return in its block
    - |
      const verdict = (sustained) => {
          if (sustained) {
              log('sustained');
          }
          return 'pass';
      };
    # The fromPredicate binding, the plugin's one branch
    - |
      const fromPredicate =
          (refinement) =>
          (value) => {
              if (refinement(value)) {
                  return some(value);
              }
              return none();
          };
    # The fromPredicate function declaration
    - |
      function fromPredicate(refinement, value) {
          if (refinement(value)) {
              return some(value);
          }
          return none();
      }
    # Return inside a nested function in the guard block, the block holds one statement other than a return
    - |
      const verdict = (sustained) => {
          if (sustained) {
              run(() => { return 'regression'; });
          }
          return 'pass';
      };
    # Guard as the last statement, no return follows it
    - |
      const verdict = (sustained) => {
          if (sustained) {
              return 'regression';
          }
      };
    # Comment after the guard and a statement other than a return, the walk over comments stops at the first statement
    - |
      const verdict = (sustained) => {
          if (sustained) {
              return 'regression';
          }
          // The long path
          log('pass');
          return 'pass';
      };
invalid:
    # The instance, guards before a fall-through return, reported once at the last guard
    - |
      const _verdict = (sustained: boolean, noisy: boolean): BenchmarkVerdict => {
          if (sustained) {
              return 'regression';
          }
          if (noisy) {
              return 'noisy';
          }
          return 'pass';
      };
    # Bare return as the guard consequence
    - |
      const verdict = (sustained) => {
          if (sustained) return 'regression';
          return 'pass';
      };
    # Block guard over a member test
    - |
      const settle = async (result) => {
          if (result.deny !== undefined) {
              return result;
          }
          return { ...result, context: [] };
      };
    # Guard inside a binding named otherwise, the exclusion reads the name alone
    - |
      const fromNullable = (value) => {
          if (value !== undefined) {
              return some(value);
          }
          return none();
      };
    # Comment inside the guard block, a comment sibling leaves the return the block's one statement
    - |
      const verdict = (sustained) => {
          if (sustained) {
              // The short path
              return 'regression';
          }
          return 'pass';
      };
    # Comment between the guard and the return, the walk to the return crosses comment siblings
    - |
      const verdict = (sustained) => {
          if (sustained) {
              return 'regression';
          }
          // The long path
          return 'pass';
      };
    # Guard inside a binding nested in fromPredicate, the exclusion stops at the nearest binding
    - |
      const fromPredicate = (refinement) => {
          const inner = (value) => {
              if (refinement(value)) {
                  return some(value);
              }
              return none();
          };
          return inner;
      };
    # Guard inside a function declaration nested in fromPredicate, the declaration stops the walk as a binding does
    - |
      const fromPredicate = (refinement) => {
          function inner(value) {
              if (refinement(value)) {
                  return some(value);
              }
              return none();
          }
          return inner;
      };
