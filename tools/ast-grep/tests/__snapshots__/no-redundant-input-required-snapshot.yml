    - source: required
      style: primary
      start: 52
      end: 60
  'on: {workflow_dispatch: {inputs: {value: {required: false, description: Value}}}}':
    fixed: 'on: {workflow_dispatch: {inputs: {value: {, description: Value}}}}'
    labels:
    - source: required
      style: primary
      start: 42
      end: 50
  'on: {workflow_dispatch: {inputs: {value: {required: false}}}}':
    fixed: 'on: {workflow_dispatch: {inputs: {value: {}}}}'
