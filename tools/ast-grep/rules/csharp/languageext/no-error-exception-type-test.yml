# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-error-exception-type-test
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    thrown-value:
        any:
            - pattern: {context: 'class C { object F() => $ERROR.ToException(); }', selector: invocation_expression, strictness: cst}
            - pattern: {context: 'class C { object F() => $ERROR.Exception.Case; }', selector: member_access_expression, strictness: cst}
    thrown:
        any:
            - matches: thrown-value
            - kind: identifier
              pattern: $THROWN
              inside:
                stopBy: end
                kind: block
                has:
                    kind: local_declaration_statement
                    has:
                        kind: variable_declaration
                        has:
                            kind: variable_declarator
                            all:
                                - has: {field: name, pattern: $THROWN}
                                - has: {matches: thrown-value}
    value-read:
        any:
            - kind: declaration_pattern
              has: {field: name, kind: identifier}
            - kind: recursive_pattern
              has: {stopBy: end, kind: subpattern}
            - kind: recursive_pattern
              has: {field: name, kind: identifier}
    type-only:
        not: {has: {field: pattern, any: [{matches: value-read}, {has: {stopBy: end, matches: value-read}}]}}
    tested:
        matches: {csharp-type-test: {subject: {pattern: $THROWN}, type: {pattern: $TYPE}}}
        all:
            - matches: type-only
    tested-result:
        any:
            - matches: tested
            - kind: block
              all:
                - has: {kind: return_statement, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, has: {matches: tested}}
                - not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    predicate-lambda:
        kind: lambda_expression, anonymous_method_expression
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: $THROWN
                    - kind: parameter_list
                      has: {kind: parameter, has: {field: name, pattern: $THROWN}}
                      not: {has: {kind: parameter, nthChild: 2}}
            - any: [{has: {field: body, matches: tested-result}}, {has: {kind: block, matches: tested-result}}]
    predicate-method:
        kind: identifier
        pattern: $PREDICATE
        inside:
            stopBy: end
            kind: class_declaration, struct_declaration, record_declaration
            has:
                field: body
                has:
                    kind: method_declaration, local_function_statement
                    all:
                        - has: {field: name, pattern: $PREDICATE}
                        - has:
                            field: parameters
                            has: {kind: parameter, has: {field: name, pattern: $THROWN}}
                            not: {has: {kind: parameter, nthChild: 2}}
                        - has:
                            field: body
                            any:
                                - kind: arrow_expression_clause
                                  has: {matches: tested}
                                - matches: tested-result
rule:
    any:
        - kind: invocation_expression
          all:
            - pattern: {context: 'class C { object F() => $ERROR.Exception.$METHOD($$$ARGUMENTS); }', selector: invocation_expression, strictness: cst}
            - has:
                field: arguments
                has:
                    kind: argument
                    has: {any: [{matches: predicate-lambda}, {matches: predicate-method}]}
        - kind: 'is_pattern_expression, is_expression, binary_expression, invocation_expression'
          all:
            - has: {stopBy: end, matches: thrown}
            - matches: {csharp-type-test: {subject: {matches: thrown}, type: {pattern: $TYPE}}}
            - matches: type-only
message: Exception inside `$ERROR` is tested against `$TYPE` by hand
note: Call `HasException<$TYPE>()` on `$ERROR`, which tests the type, its subtypes, and every `ManyErrors` leaf
