# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-promise-outside-boundary
language: tsx
severity: error
ignores: ['.claude/plugins/**', '**/*.config.ts', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
rule:
    all:
        - any:
            - kind: await_expression
            - kind: for_in_statement
              has: {regex: '^await$'}
        - not:
            any:
                - inside: {stopBy: {matches: syntax-function-boundary}, matches: effect-promise-boundary}
                - inside: {matches: nx-version-actions-method, stopBy: {matches: syntax-function-boundary}}
message: Await or for-await consumes a promise outside its conversion callback
note: Convert the promise once at the boundary, `Effect.tryPromise` or `Effect.promise`, and read an async iterable as `Stream.fromAsyncIterable`
