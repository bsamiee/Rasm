id: no-exit-in-else-clause
valid:
    - |
      for s in a; do
      [[ -v count[keys,$id] ]] || {
          finding "no snapshot: $id"
          continue
      }
      done
    # The then branch leaves too
    - |
      if [[ -f $s ]]; then
          exit 2
      else
          exit 1
      fi
    - |
      f() {
      if [[ -f $s ]]; then
          return 1
      else
          printf '%s\n' b
      fi
      }
    # An elif chain selects among cases
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      elif [[ -d $s ]]; then
          printf '%s\n' b
      else
          exit 1
      fi
    # The else clause continues
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          printf '%s\n' b
      fi
    # The else clause leaves before its last statement
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          exit 1
          printf '%s\n' late
      fi
    # A list of statements as the condition, the guard form needs a group around it
    - |
      if a; b; then
          printf '%s\n' a
      else
          exit 1
      fi
    # Both branches leave, statements separated by ;
    - if [[ -f $s ]]; then exit 2; else exit 1; fi
    # A comment on the line of the leaving command in the then branch
    - |
      if [[ -f $s ]]; then
          exit 2 # done
      else
          exit 1
      fi
    # A comment line after the leaving command in the then branch is no statement
    - |
      if [[ -f $s ]]; then
          exit 2
          # trailing comment
      else
          exit 1
      fi
    # An unconditional exit leaves even when unreachable statements follow
    - if [[ -f $s ]]; then exit 2; printf '%s\n' late; else exit 1; fi
    # Dead statements after exit do not make the then branch continue
    - |
      if [[ -f $s ]]; then
          exit 2
          printf '%s\n' late
      else
          exit 1
      fi
invalid:
    # A comment line before the leaving command in the else clause
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          # explain
          exit 1
      fi
    - |
      for s in a; do
      if [ -f "$s" ]; then
          diff a b
      else
          finding "no snapshot: $id"
          continue
      fi
      done
    # A nested block in the then branch and a comment beside a statement, both keep their text
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a # note
          if [[ -d $s ]]; then
              count=1
          fi
      else
          exit 1
      fi
    # A negated pipeline as the condition binds tighter than the guard's or-list
    - |
      if ! grep -q x "$f" | sort; then
          printf '%s\n' "$f"
      else
          exit 1
      fi
    # exit alone in the else clause
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          exit 1
      fi
    # break at the end of the else clause inside a loop
    - |
      for f in "${files[@]}"; do
          if [[ -f $f ]]; then
              printf '%s\n' "$f"
          else
              break
          fi
      done
    - |
      f() {
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          return 1
          # nothing after
      fi
      }
