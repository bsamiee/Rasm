                        |removeMany|set|setMany|some|union)$
        - matches: {effect-module-member: {module: {regex: '\bTxPriorityQueue$'}, member: {regex: '^(offer|offerAll|removeIf|retainIf|takeUpTo)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bTxPubSub$'}, member: {regex: '^(publish|publishAll|releaseSubscriber)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bTxQueue$'}, member: {regex: '^(fail|failCause|offer|offerAll|takeBetween|takeN)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bTxReentrantLock$'}, member: {regex: '^(withLock|withReadLock|withWriteLock)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bTxRef$'}, member: {regex: '^(modify|set|update)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bTxSemaphore$'}, member: {regex: '^(acquireN|releaseN|tryAcquireN)$'}}}
        - matches:
