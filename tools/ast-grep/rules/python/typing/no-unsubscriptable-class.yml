# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
rule:
    matches:
        python-evaluated-subscript:
            value:
                pattern: $G
                matches: python-unsubscriptable-class
message: '`$G` has no `__class_getitem__` and raises `TypeError` when subscripted'
note: 'Write `<class>` where type parameters have defaults, else its `collections.abc` protocol (`Iterator`, `Callable`)'
