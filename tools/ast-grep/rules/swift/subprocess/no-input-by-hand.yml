# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    writer-binding:
        kind: property_declaration
        has: {follows: {regex: '^=$'}, regex: '\.standardInputWriter$'}
    writer:
        any:
            - regex: '\.standardInputWriter$'
            - kind: simple_identifier
              pattern: $WRITER
              inside:
                stopBy: {kind: lambda_literal}
                kind: statements
                has: {nthChild: 1, matches: writer-binding, has: {kind: pattern, has: {field: bound_identifier, pattern: $WRITER}, precedes: {stopBy: {kind: pattern}, regex: '\.standardInputWriter$'}}}
    writer-call:
        kind: call_expression
        has: {nthChild: 1, kind: navigation_expression, has: {field: target, matches: writer}}
    writer-write:
        matches: writer-call
        has: {nthChild: 1, has: {field: suffix, has: {field: suffix, regex: '^write$'}}}
    writer-finish:
        matches: writer-call
        has: {nthChild: 1, has: {field: suffix, has: {field: suffix, regex: '^finish$'}}}
rule:
    kind: lambda_literal
    all:
        - inside: {kind: call_expression, stopBy: {kind: call_expression}, has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^(Subprocess(\.|::))?run$'}}
        - has:
            kind: statements
            any:
                - all:
                    - has: {nthChild: 1, has: {stopBy: &statement {not: {kind: 'assignment, try_expression, await_expression'}}, matches: writer-write, pattern: $WRITE}}
                    - has: {nthChild: 2, has: {stopBy: *statement, matches: writer-finish}}
                - all:
                    - has: {nthChild: 1, matches: writer-binding}
                    - has: {nthChild: 2, has: {stopBy: *statement, matches: writer-write, pattern: $WRITE}}
                    - has: {nthChild: 3, has: {stopBy: *statement, matches: writer-finish}}
message: '`$WRITE` writes one fixed value to standard input and closes it'
note: 'Pass the value to `run` as `input: .string(<text>)`, `.array(<bytes>)`, or `.data(<data>)`'
