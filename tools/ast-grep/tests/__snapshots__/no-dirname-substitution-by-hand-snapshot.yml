id: no-dirname-substitution-by-hand
snapshots:
  ? |
    name=$(basename -- "$f")
  : labels:
    - source: $(basename -- "$f")
      style: primary
      start: 5
      end: 24
    - source: basename
      style: secondary
      start: 7
      end: 15
    - source: basename -- "$f"
      style: secondary
      start: 7
      end: 23
  ? |
    names=$(basename -a "$first" "$second")
  : labels:
    - source: $(basename -a "$first" "$second")
      style: primary
      start: 6
      end: 39
    - source: basename
      style: secondary
      start: 8
      end: 16
    - source: basename -a "$first" "$second"
      style: secondary
      start: 8
      end: 38
  ? |
    root=$(dirname "$(realpath "$f")")
  : labels:
    - source: $(dirname "$(realpath "$f")")
      style: primary
      start: 5
      end: 34
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: dirname "$(realpath "$f")"
      style: secondary
      start: 7
      end: 33
  ? |
    root=$(dirname "$file/x")
  : labels:
    - source: $(dirname "$file/x")
      style: primary
      start: 5
      end: 25
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: dirname "$file/x"
      style: secondary
      start: 7
      end: 24
  ? |
    root=$(dirname "${file%/x}")
  : labels:
    - source: $(dirname "${file%/x}")
      style: primary
      start: 5
      end: 28
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: dirname "${file%/x}"
      style: secondary
      start: 7
      end: 27
  ? |
    root=$(dirname "${files[@]}")
  : labels:
    - source: $(dirname "${files[@]}")
      style: primary
      start: 5
      end: 29
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: dirname "${files[@]}"
      style: secondary
      start: 7
      end: 28
  ? |
    root=$(dirname -- "$file")
  : labels:
    - source: $(dirname -- "$file")
      style: primary
      start: 5
      end: 26
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: dirname -- "$file"
      style: secondary
      start: 7
      end: 25
  ? |
    root=$(dirname /a/b/c)
  : labels:
    - source: $(dirname /a/b/c)
      style: primary
      start: 5
      end: 22
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: dirname /a/b/c
      style: secondary
      start: 7
      end: 21
  ? |
    stem=$(basename "$f" ".yml")
  : labels:
    - source: $(basename "$f" ".yml")
      style: primary
      start: 5
      end: 28
    - source: basename
      style: secondary
      start: 7
      end: 15
    - source: basename "$f" ".yml"
      style: secondary
      start: 7
      end: 27
  ? |
    stem=$(basename "$file" .yml)
  : labels:
    - source: $(basename "$file" .yml)
      style: primary
      start: 5
      end: 29
    - source: basename
      style: secondary
      start: 7
      end: 15
    - source: basename "$file" .yml
      style: secondary
      start: 7
      end: 28
