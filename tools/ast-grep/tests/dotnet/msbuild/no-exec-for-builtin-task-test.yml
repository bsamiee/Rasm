id: no-exec-for-builtin-task
valid:
    # The task form
    - |
      <MakeDir Directories="$(OutDir)logs" />
    # External program with no built-in task
    - |
      <Exec Command="install_name_tool -change $(_TorchLibompInstallName) @loader_path/libomp.dylib '%(_TorchCpuDylib.FullPath)'" />
    # Echo that logs, no redirect
    - |
      <Exec Command="echo $(Version)" />
    # Program name opening with a listed word
    - |
      <Exec Command="cpio -o &lt; list.txt" />
    # Item holding the command as metadata, nothing runs
    - |
      <ItemGroup><_Step Include="logs" Command="mkdir $(OutDir)logs" /></ItemGroup>
    # Log pattern parameter naming the shell command, nothing runs
    - |
      <Exec Command="./setup.sh" CustomErrorRegularExpression="mkdir: cannot create" />
invalid:
    # Single-quoted command
    - |
      <Exec Command='mkdir $(OutDir)logs' />
    # Directory created through the shell
    - |
      <Exec Command="mkdir $(OutDir)logs" />
    # Copy through the shell
    - |
      <Exec Command="cp $(StageRoot)manifest.yml $(OutDir)" />
    # File written through a redirect
    - |
      <Exec Command="echo $(Version) &gt; $(IntermediateOutputPath)version.txt" />
    # Shell delete
    - |
      <Exec Command="rm -rf $(OutDir)stage" />
