# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-arm-call
language: python
severity: error
utils:
    arm-call:
        kind: call
        pattern: $E
        all:
            - has: {field: arguments, has: {pattern: $_}}
            - has: {field: function, kind: 'identifier, attribute', not: {matches: python-stateful-callee}}
            - not: {inside: {kind: expression_statement}}
            - not: {has: {kind: 'await, yield, named_expression', stopBy: end}}
            - not:
                has:
                    stopBy: end
                    kind: identifier
                    pattern: $Y
                    inside:
                        stopBy: end
                        kind: 'conditional_expression, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'
                        all:
                            - has: {stopBy: end, pattern: $E}
                            - has: {stopBy: end, matches: {python-binding: {name: {pattern: $Y}}}}
    arm-bound:
        has:
            stopBy: end
            kind: identifier
            pattern: $X
            inside:
                kind: 'case_clause, if_statement'
                stopBy: {kind: 'case_clause, if_statement'}
                has: {stopBy: end, matches: {python-binding: {name: {pattern: $X}}}}
    holds-call:
        any:
            - pattern: $E
            - has: {stopBy: end, pattern: $E}
    first-case:
        inside:
            stopBy: end
            kind: case_clause
            field: consequence
            nthChild: {position: 1, ofRule: {kind: case_clause}}
            inside:
                kind: block
                all:
                    - has: {kind: case_clause, nthChild: {position: 2, ofRule: {kind: case_clause}}}
                    - not: {has: {kind: case_clause, not: {has: {field: consequence, matches: holds-call}}}}
    first-branch:
        inside:
            stopBy: end
            kind: if_statement
            field: consequence
            all:
                - has: {kind: else_clause}
                - not: {has: {kind: 'elif_clause, else_clause', not: {matches: holds-call}}}
    first-arm:
        any:
            - nthChild: 1
              inside: {kind: conditional_expression, has: {nthChild: 3, matches: holds-call}}
            - inside:
                stopBy: end
                nthChild: 1
                inside: {kind: conditional_expression, has: {nthChild: 3, matches: holds-call}}
rule:
    all:
        - matches: arm-call
        - any:
            - all: [{not: {matches: arm-bound}}, {any: [{matches: first-case}, {matches: first-branch}]}]
            - matches: first-arm
message: '`$E` is evaluated in every arm of the branch'
note: 'Bind `<name> = <call>` once before the `match`, the `if`, or the statement holding the conditional expression, each arm reads `<name>`'
