name: Release

on:
    workflow_dispatch:
        inputs:
            specifier:
                description: Version or semver keyword every released project takes, empty reads conventional commits
                type: string
            first-release:
                description: No released project has an earlier tag or registry version
                type: boolean
                default: false
            dry-run:
                description: Prints the release and changes nothing
                type: boolean
                default: true

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    release:
        runs-on: xcode-27
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
            id-token: write
            packages: write
        env:
            DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0
            - id: blender
              run: |
                  series=$(git ls-files -z '*blender_manifest.toml' | xargs -0 sed -En 's/^blender_version_min *= *"([0-9]+\.[0-9]+).*/\1/p' | sort -V | tail -n 1)
                  printf 'series=%s\n' "${series}" >> "${GITHUB_OUTPUT}"
            - uses: BradyAJohnston/setup-blender@1006ec809db1af1422bd1197e107e2c4d368d81e # v5.2.0
              with:
                  version: ${{ steps.blender.outputs.series }}
            - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install
            - run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
            - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - run: nx release ${SPECIFIER:+"${SPECIFIER}"} --skip-publish --first-release="${FIRST_RELEASE}" --dry-run="${DRY_RUN}"
              env:
                  GH_TOKEN: ${{ github.token }}
                  SPECIFIER: ${{ inputs.specifier }}
                  FIRST_RELEASE: ${{ inputs.first-release }}
                  DRY_RUN: ${{ inputs.dry-run }}
            - run: nx run-many --targets=build --configuration=release --projects=tag:npm:public,tag:release
              env:
                  UV_LOCKED: "true"
                  APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
                  APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
                  DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
                  DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
                  ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
                  ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
                  ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
            - id: nuget
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              with:
                  user: ${{ secrets.NUGET_USER }}
            - run: nx release publish --first-release="${FIRST_RELEASE}" --dry-run="${DRY_RUN}"
              env:
                  GH_TOKEN: ${{ github.token }}
                  NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
                  BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
                  FIRST_RELEASE: ${{ inputs.first-release }}
                  DRY_RUN: ${{ inputs.dry-run }}
