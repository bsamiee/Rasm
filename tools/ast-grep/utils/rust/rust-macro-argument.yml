# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-macro-argument
language: rustlang
rule:
    all:
        - inside:
            kind: token_tree
            stopBy: end
            any:
                - inside: {kind: macro_invocation}
                - follows: {regex: '^!$', follows: {kind: identifier}}
        - not: {matches: rust-test-scope}
