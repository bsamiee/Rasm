# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-analysis"
version.workspace    = true
edition.workspace    = true
description          = "Analysis of measured and simulated data: regularized and robust polynomial, nonlinear and separable least squares with influence and covariance estimators, smoothing, monotone and periodic splines over grids, natural-neighbor, constrained and universal kriging interpolation of scattered data, scalar, polynomial and Newton-system roots with sensitivities, adaptive cubature and weighted Gauss rules"
repository.workspace = true
license.workspace    = true
keywords             = ["regression", "interpolation", "splines", "roots", "quadrature"]
categories           = ["mathematics", "science"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                              = { workspace = true }
nonempty-collections               = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
serde                              = { workspace = true }
nutype                             = { workspace = true }
ordered-float                      = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
almost                             = { workspace = true }
csaps                              = { workspace = true }
faer                               = { workspace = true }
gauss-quad                         = { workspace = true }
nalgebra                           = { workspace = true }
ndarray                            = { workspace = true }
num-complex                        = { workspace = true }
num-dual                           = { workspace = true }
statrs                             = { workspace = true }
argmin                             = { workspace = true }
nlopt                              = { workspace = true }
spade                              = { workspace = true }
rasm-stats                         = { workspace = true }
rasm-optimize                      = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
