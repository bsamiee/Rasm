# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unvisited-recursion
language: csharp
severity: error
utils:
    function:
        kind: 'method_declaration, local_function_statement'
    recursion:
        kind: invocation_expression
        has:
            field: function
            any:
                - {kind: identifier, pattern: $NAME}
                - {kind: generic_name, has: {kind: identifier, pattern: $NAME}}
                - kind: member_access_expression
                  all:
                    - has: {field: name, any: [{pattern: $NAME}, {kind: generic_name, has: {kind: identifier, pattern: $NAME}}]}
                    - has: {field: expression, any: [{regex: '^this$'}, {kind: identifier, regex: '^[a-z_]'}]}
    carries:
        any:
            - has: {field: function, kind: member_access_expression, has: {field: expression, kind: identifier, pattern: $NEXT}}
            - all:
                - not: {has: {field: function, kind: member_access_expression, has: {field: expression, not: {regex: '^this$'}}}}
                - has: {field: arguments, has: {stopBy: end, kind: identifier, pattern: $NEXT}}
    node:
        kind: identifier
        pattern: $NODE
        inside: {stopBy: {matches: function}, matches: function, has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $NODE}}}}
    relation:
        regex: '(?i)(parents|predecessors|successors|dependencies|dependents|deps|importers|imports|callers|callees|references|referrers|neighbors|neighbours|supertypes|superclasses|bases|edges|incoming|outgoing)$'
    relation-lookup:
        kind: element_access_expression
        has: {field: subscript, has: {kind: argument, has: {matches: node}}}
    relation-read:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, matches: relation}
                - has: {field: expression, any: [{matches: node}, {matches: relation-lookup}]}
            - kind: invocation_expression
              all:
                - has: {field: function, any: [{kind: identifier, matches: relation}, {has: {field: name, any: [{matches: relation}, {kind: generic_name, has: {kind: identifier, matches: relation}}]}}]}
                - any:
                    - has: {field: arguments, has: {kind: argument, has: {matches: node}}}
                    - has: {field: function, kind: member_access_expression, has: {field: expression, matches: node}}
    successors:
        any:
            - matches: relation-read
            - {kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: successors}}}
            - {kind: member_access_expression, has: {field: expression, matches: successors}}
            - {kind: parenthesized_expression, has: {matches: successors}}
    successor-call:
        inside: {kind: argument, inside: {kind: argument_list, inside: {kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: successors}}}}}
    membership-test:
        any:
            - kind: invocation_expression
              any:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Contains|ContainsKey|TryGetValue|GetValueOrDefault|GetOrAdd|Find|FindOrAdd)$'}}
                - all:
                    - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Add|TryAdd)$'}}
                    - not: {inside: {kind: expression_statement}}
            - kind: member_access_expression
              has: {field: name, regex: '^(Contains|ContainsKey|TryGetValue|GetValueOrDefault|GetOrAdd|Find|FindOrAdd|Add|TryAdd)$'}
              inside: {kind: argument}
rule:
    matches: function
    all:
        - has: {field: name, pattern: $NAME}
        - any:
            - has:
                field: body
                has:
                    stopBy: {matches: function}
                    all:
                        - matches: recursion
                        - any:
                            - inside:
                                kind: foreach_statement
                                field: body
                                stopBy: {matches: function}
                                all:
                                    - has: {field: right, matches: successors}
                                    - has: {field: left, kind: identifier, pattern: $NEXT}
                            - inside:
                                kind: 'lambda_expression, anonymous_method_expression'
                                stopBy: {matches: function}
                                all:
                                    - matches: successor-call
                                    - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $NEXT}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $NEXT}}}]}
                        - matches: carries
            - has:
                field: body
                has:
                    stopBy: {matches: function}
                    kind: argument
                    all:
                        - has: {any: [{kind: identifier, pattern: $NAME}, {kind: generic_name, has: {kind: identifier, pattern: $NAME}}]}
                        - inside: {kind: argument_list, inside: {kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: successors}}}}
            - has:
                field: body
                has:
                    stopBy: {matches: function}
                    kind: query_expression
                    all:
                        - has: {kind: from_clause, has: {matches: successors}}
                        - has: {stopBy: end, matches: recursion}
        - not: {has: {field: body, has: {stopBy: {matches: function}, matches: membership-test}}}
message: '`$NAME` recurses into every successor of `$NODE` with no visited test'
note: 'Hold the graph in a QuikGraph `AdjacencyGraph` and walk it with `DepthFirstSearchAlgorithm` or `BreadthFirstSearchAlgorithm`, each vertex visited once across shared parents and cycles'
