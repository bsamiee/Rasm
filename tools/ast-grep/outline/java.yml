---
id: java-method
language: javalang
role: item
symbolType: method
rule:
    kind: method_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: block, inside: {kind: method_declaration, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:\s*;)?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - has: {kind: modifiers, has: {regex: '^(public|protected)$'}}
        - inside: {kind: interface_body}
          not: {has: {kind: modifiers, has: {regex: '^private$'}}}
---
id: java-variable
language: javalang
role: item
symbolType: field
rule:
    kind: local_variable_declaration
    inside: {kind: program}
    pattern: $DECLARATION
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        has: {field: name, pattern: $DECLARED}
      fix: $DECLARED
    - id: declarator
      rule:
        kind: variable_declarator
        all:
            - has: {field: name, pattern: $DECLARED}
            - any:
                - has: {field: dimensions, pattern: $DIMENSIONS}
                - not: {has: {field: dimensions, pattern: $_}}
      fix: $DECLARED$DIMENSIONS
transform:
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [name], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[declarator])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:\s*;)?\s*$', by: ''}}
name: $NAMES
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {regex: '^(public|protected)$'}}}
---
id: java-member-module-directive
language: javalang
role: member
parentRuleIds: [java-module]
symbolType: module
rule:
    kind: requires_module_directive, exports_module_directive, opens_module_directive, uses_module_directive, provides_module_directive
    pattern: $DECLARATION
    any:
        - has: {field: module, pattern: $NAME}
        - has: {field: package, pattern: $NAME}
        - has: {field: type, pattern: $NAME}
        - has: {field: provided, pattern: $NAME}
transform:
    HEADER: {replace: {source: $DECLARATION, replace: ';\s*$', by: ''}}
name: $NAME
signature: $HEADER
---
id: java-member-method
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum]
symbolType: method
rule:
    kind: method_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: block, inside: {kind: method_declaration, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:\s*;)?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: modifiers, has: {regex: '^(public|protected)$'}}
        - inside: {kind: interface_body}
          not: {has: {kind: modifiers, has: {regex: '^private$'}}}
---
id: java-member-constructor
language: javalang
role: member
parentRuleIds: [java-class, java-enum]
symbolType: constructor
rule:
    kind: constructor_declaration, compact_constructor_declaration, static_initializer, block
    pattern: $DECLARATION
    any:
        - kind: constructor_declaration, compact_constructor_declaration
          has: {field: name, pattern: $NAME}
        - kind: static_initializer
          has: {pattern: $$NAME, regex: '^static$'}
        - kind: block
          inside: {kind: 'class_body, enum_body_declarations'}
          has: {pattern: $$INITIALIZER, regex: '^\{$'}
rewriters:
    - id: body
      rule:
        kind: constructor_body, block
        any:
            - inside: {kind: 'constructor_declaration, compact_constructor_declaration', field: body}
            - inside: {kind: 'static_initializer, class_body, enum_body_declarations'}
      fix: ''
transform:
    INITIALIZER_NAME: {replace: {source: $INITIALIZER, replace: '^\{$', by: 'initializer'}}
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:\s*;)?\s*$', by: ''}}
name: $NAME$INITIALIZER_NAME
signature: $SIGNATURE
isPublic: {has: {kind: modifiers, has: {regex: '^(public|protected)$'}}}
---
