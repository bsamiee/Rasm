# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    key:
        kind: identifier
        pattern: $KEY
        regex: '^(long|id|name)$'
        follows: {regex: '^[,(]$'}
    keyed:
        any:
            - follows: {regex: '^=$', follows: {matches: key}}
              inside: {kind: token_tree, inside: {kind: attribute, field: arguments}}
            - inside:
                kind: token_tree
                regex: '^\('
                follows: {matches: key}
                inside: {kind: token_tree, inside: {kind: attribute, field: arguments}}
    semantic-group:
        kind: attribute_item
        has: {kind: attribute, all: [{has: {field: path, pattern: group}}, {has: {field: arguments, has: {kind: identifier, regex: '^(required|multiple|requires|requires_all|conflicts_with|conflicts_with_all)$'}}}]}
rule:
    kind: 'string_literal, raw_string_literal'
    all:
        - regex: '^r?#*"[A-Za-z][A-Za-z0-9]*([-_][A-Za-z0-9]+)*"#*$'
        - not: {regex: '^r?#*"(self|Self|super|crate)"#*$'}
        - matches: keyed
        - inside:
            kind: attribute
            stopBy: {kind: attribute}
            any:
                - has: {field: path, regex: '^(arg|clap|command|value)$'}
                - all:
                    - has: {field: path, pattern: group}
                    - not:
                        inside:
                            kind: attribute_item
                            any:
                                - matches: semantic-group
                                - precedes: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: semantic-group}
                                - follows: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: semantic-group}
        - not: {matches: rust-test-scope}
        - pattern: $NAME
message: '`$KEY` spells `$NAME`, a name clap derives from the item or package'
note: 'Rename item or package to the literal and delete key or `long` value, `#[value(rename_all)]` on `ValueEnum` and `#[group(skip)]` on `Args`'
