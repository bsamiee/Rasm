# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-parse
language: tsx
severity: error
ignores: ['.claude/plugins/**']
rule:
    kind: call_expression
    has: {field: function, regex: '^(globalThis\.)?JSON\.parse$', matches: syntax-global-reference}
message: '`JSON.parse` answers an unvalidated value'
note: Decode the text through `Schema.decodeUnknown(Schema.parseJson(schema))` for a typed value or a ParseError
