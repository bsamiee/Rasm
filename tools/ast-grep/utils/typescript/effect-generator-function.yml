# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-generator-function
language: tsx
utils:
    generator-callee:
        any:
            - matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(gen|fn|fnUntraced)$'}}}
            - kind: call_expression
              has: {field: function, matches: traced-callee}
    traced-callee:
        matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(fn|fnUntraced)$'}}}
rule:
    kind: generator_function
    inside:
        kind: arguments
        inside:
            kind: call_expression
            has: {field: function, matches: generator-callee}
