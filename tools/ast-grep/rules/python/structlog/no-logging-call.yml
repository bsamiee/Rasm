# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-logging-call
language: python
severity: error
ignores: ['.claude/skills/use-blender/scripts/*.py', '.claude/skills/use-rhino/scripts/*.py', 'tools/interface/**']
rule:
    kind: attribute
    pattern: $USE
    all:
        - has: {field: attribute, regex: "^(log|debug|info|warning|warn|error|critical|fatal|exception)$"}
        - has: {field: object, matches: python-stdlib-logger}
message: '`$USE` logs through the standard library logging API'
note: 'Use `structlog.get_logger(__name__).<level>(<event>, <key>=<value>)`'
labels: {USE: {style: primary, message: Event method}}
