# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: call_expression
    all:
        - any:
            - pattern: '$S.iter().$POS($_).map(|$I| (&$S[..$I], &$S[$I + 1..]))'
            - pattern: '$S.iter().$POS($_).map(|$I| (&$S[..$I], &$S[($I + 1)..]))'
            - pattern: '$S.iter().$POS($_).and_then(|$I| Some(($S.get(..$I)?, $S.get($I + 1..)?)))'
            - pattern: '$S.iter().$POS($_).and_then(|$I| $S.get(..$I).zip($S.get($I + 1..)))'
constraints:
    I: {kind: identifier}
    POS: {regex: '^r?position$'}
message: '`$S.iter().$POS(..)` splits around a match of a predicate by hand'
note: 'Call `<slice>.split_once(<predicate>)` for the first match or `<slice>.rsplit_once(<predicate>)` for last'
