id: nested-module-calls-to-pipe
valid:
    - 'import { Array, pipe } from "effect"; const rows = Array.flatten(Array.map(Array.filter(items, keep), project));'
    - |
      import { Effect, Layer, pipe } from "effect";
      const run = Effect.provide(Effect.flatMap(Effect.provide(load, Layer.succeed(Tag, service)), g), layer);
    - |
      import { Array } from "effect";
      import { pipe } from "other";
      const rows = Array.flatten(Array.map(Array.filter(Array.fromIterable(items), keep), project));
    - 'import { Effect, pipe } from "effect"; const run = Effect.provide(Effect.flatMap(Effect.map(Effect.succeed(1)), g), layer);'
    - |
      import { Effect, pipe } from "effect";
      const run = Effect.provide(Effect.merge(Effect.succeed(1), Effect.map(Effect.succeed(2), f)), layer);
    - 'import { Array } from "effect"; const rows = Array.flatten(Array.map(Array.filter(Array.fromIterable(items), keep), project));'
    - 'import { Array, pipe as chain } from "effect"; const rows = Array.flatten(Array.map(Array.filter(Array.fromIterable(items), keep), project));'
    - |
      import { Array, pipe } from "effect";
      const rows = Array.flatten(Array.map(Array.filter(Array.fromIterable(items), /* keep */ keep), project));
    - 'import { Schema, pipe } from "effect"; const item = Schema.filter(Schema.map(Schema.filter(Schema.map(base, f), g), h), i);'
    - 'import { Effect, pipe } from "effect"; const run = Effect.locally(Effect.map(Effect.flatMap(Effect.zipRight(a, b), f), g), ref, value);'
    - 'import { Array, pipe } from "effect"; const rows = Array.flatten<number>(Array.map(Array.filter(Array.fromIterable(items), keep), project));'
    - 'import { Array, pipe } from "effect"; const rows = Array.flatten(Array.map<number, number>(Array.filter(Array.fromIterable(items), keep), project));'
invalid:
    - 'import { Array, pipe } from "effect"; const rows = Array.flatten(Array.map(Array.filter(Array.fromIterable(items), keep), project));'
    - |
      import { Effect, pipe } from "effect";
      const run = Effect.provide(Effect.flatMap(Effect.map(Effect.orElse(load, () => other), f), g), layer);
    - |
      import { Option, pipe } from "effect";
      const item = Option.getOrElse(Option.map(Option.flatMap(Option.filter(found, keep), lookup), project), () => fallback);
    - |
      import { Effect, pipe } from "effect";
      const run = Effect.provide(Effect.flatMap(Effect.map(Effect.orElse(Effect.succeed(1), () => other), f), g), layer);
    - |
      import { Effect, pipe } from "effect";
      const run = Effect.merge(Effect.succeed(1), Effect.provide(Effect.flatMap(Effect.map(Effect.orElse(load, () => other), f), g), layer));
    - 'import { Effect, pipe } from "effect"; const run = Effect.tap(Effect.map(Effect.flatMap(Effect.zipRight(a, b), f), g), h);'
    - |
      import { Array, pipe } from "effect";
      const rows = Array.flatten(Array.map(Array.filter(Array.map(Array.fromIterable(items), first), keep), project));
