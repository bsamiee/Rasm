id: no-catch-around-next
valid:
    # The chain returned without a catch
    - |
      on('tool.call', async ($, e, next) => next(e));
    # Try with a finally and no catch
    - |
      on('tool.call', async ($, e, next) => {
          try {
              return await next(e);
          } finally {
              $.ui.notice(e.tool_use_id, undefined);
          }
      });
    # Catch around a store write, no chain call in the try
    - |
      on('turn.complete', async ($, e, next) => {
          try {
              await $.store.set(key, row);
          } catch (error) {
              $.ui.log('classifier failed');
          }
          return next(e);
      });
    # Catch around an engine call, the chain called after it
    - |
      on('tool.call', async ($, e, next) => {
          try {
              await $.fs.exists(path);
          } catch (error) {
              return { deny: 'unreadable path' };
          }
          return next(e);
      });
    # Chain call inside a nested function inside the try, the nested function's chain settles there
    - |
      on('tool.call', async ($, e, next) => {
          try {
              const run = () => next(e);
              return await later(run);
          } catch (error) {
              return { deny: 'later failed' };
          }
      });
    # Chain call inside a nested function expression inside the try
    - |
      on('tool.call', async ($, e, next) => {
          try {
              return await later(function () { return next(e); });
          } catch (error) {
              return { deny: 'later failed' };
          }
      });
    # Chain call inside a nested function declaration inside the try
    - |
      on('tool.call', async ($, e, next) => {
          try {
              function run() { return next(e); }
              return await later(run);
          } catch (error) {
              return { deny: 'later failed' };
          }
      });
    # Chain call inside a generator function inside the try
    - |
      on('tool.call', async ($, e, next) => {
          try {
              return await later(function* () { yield next(e); });
          } catch (error) {
              return { deny: 'later failed' };
          }
      });
    # Chain call inside a method of an object inside the try
    - |
      on('tool.call', async ($, e, next) => {
          try {
              return await later({ run() { return next(e); } });
          } catch (error) {
              return { deny: 'later failed' };
          }
      });
    # Then on the chain's promise, the chain's failure passes through
    - |
      on('tool.call', async ($, e, next) => next(e).then((result) => result));
    # Catch on an engine call's promise, the chain untouched
    - |
      on('turn.complete', async ($, e, next) => {
          $.audio.speak(line).catch((): undefined => undefined);
          return next(e);
      });
    # Catch method on a call other than the chain
    - |
      on('tool.call', async ($, e, next) => {
          await load(e).catch(() => undefined);
          return next(e);
      });
    # Try with a catch outside any hook, no chain parameter binds
    - |
      const run = async (next) => {
          try {
              return await next();
          } catch (error) {
              return undefined;
          }
      };
    # Two-argument then on a call other than the chain
    - |
      on('tool.call', async ($, e, next) => {
          await load(e).then(use, () => undefined);
          return next(e);
      });
    # Chain called in the catch handler, the try body holds no chain call
    - |
      on('tool.call', async ($, e, next) => {
          try {
              await load(e);
          } catch (error) {
              return next(e);
          }
          return next(e);
      });
    # Finally on the chain's promise, the failure passes through
    - |
      on('tool.call', async ($, e, next) => next(e).finally(cleanup));
    # One-argument then after a finally on the chain's promise
    - |
      on('tool.call', async ($, e, next) => next(e).finally(cleanup).then(use));
    # Promise.all over the chain and another call with no catch, the chain's failure passes through
    - |
      on('tool.call', async ($, e, next) => {
          const [result] = await Promise.all([next(e), $.store.get(key)]);
          return result;
      });
    # Catch on a Promise.all holding no chain call
    - |
      on('tool.call', async ($, e, next) => {
          await Promise.all([$.store.get(key), $.fs.exists(path)]).catch(() => undefined);
          return next(e);
      });
    # Promise.allSettled over calls other than the chain
    - |
      on('tool.call', async ($, e, next) => {
          await Promise.allSettled([$.store.get(key), $.fs.exists(path)]);
          return next(e);
      });
    # Catch on a call other than a Promise combinator that takes the chain in a list, the call settles its own promise
    - |
      on('tool.call', async ($, e, next) => later([next(e), $.store.get(key)]).catch(() => undefined));
    # Two-argument then with undefined as the rejection handler, the chain's failure passes through
    - |
      on('tool.call', async ($, e, next) => next(e).then(use, undefined));
    # Nested function binding its own parameter under the chain's name, the catch settles that parameter's call
    - |
      on('tool.call', async ($, e, next) => {
          const guarded = async (next) => {
              try {
                  return await next();
              } catch (error) {
                  return undefined;
              }
          };
          await guarded(load);
          return next(e);
      });
    # Nested function destructuring its own parameter under the chain's name, the walk reaches inside the pattern
    - |
      on('tool.call', async ($, e, next) => {
          const guarded = async ({ run: next }) => {
              try {
                  return await next();
              } catch (error) {
                  return undefined;
              }
          };
          await guarded({ run: load });
          return next(e);
      });
    # Nested arrow with a bare parameter under the chain's name
    - |
      on('tool.call', async ($, e, next) => {
          const guarded = async next => {
              try {
                  return await next();
              } catch (error) {
                  return undefined;
              }
          };
          await guarded(load);
          return next(e);
      });
invalid:
    # The instance, a try with a catch around the awaited chain
    - |
      on('tool.call', async ($, e, next) => {
          try {
              return await next(e);
          } catch (error) {
              return { deny: 'chain failed' };
          }
      });
    # Chain parameter under another name
    - |
      on('prompt.submit', async ($, e, chain) => {
          try {
              return await chain(e);
          } catch (error) {
              return { drop: 'chain failed' };
          }
      });
    # Chain call nested in an expression inside the try body
    - |
      on('tool.call', async ($, e, next) => {
          try {
              const result = await next({ ...e, command });
              return { ...result, context: [line] };
          } catch (error) {
              return { deny: 'chain failed' };
          }
      });
    # Chain call under a matched registration
    - |
      on('tool.call', { tool: 'Bash' }, async ($, e, next) => {
          try {
              return await next(e);
          } catch (error) {
              return { deny: 'chain failed' };
          }
      });
    # Catch method on the chain's promise
    - |
      on('tool.call', async ($, e, next) => next(e).catch(() => ({ deny: 'chain failed' })));
    # Catch method on the chain's promise under a function expression hook
    - |
      on('tool.call', async function ($, e, next) {
          return next(e).catch(() => ({ deny: 'chain failed' }));
      });
    # Catch method after a then on the chain's promise
    - |
      on('tool.call', async ($, e, next) => next(e).then((result) => result).catch(() => ({ deny: 'chain failed' })));
    # Two-argument then on the chain's promise, the second argument is the rejection handler
    - |
      on('tool.call', async ($, e, next) => next(e).then((result) => result, () => ({ deny: 'chain failed' })));
    # Hook registered through a parameter typed On under another name
    - |
      const arm = (register: On): void => {
          register('tool.call', async ($, e, next) => {
              try {
                  return await next(e);
              } catch (error) {
                  return { deny: 'chain failed' };
              }
          });
      };
    # Catch after a finally on the chain's promise
    - |
      on('tool.call', async ($, e, next) => next(e).finally(cleanup).catch(() => ({ deny: 'chain failed' })));
    # Awaited catch method on the chain's promise inside a block
    - |
      on('tool.call', async ($, e, next) => {
          const result = await next(e).catch(() => ({ deny: 'chain failed' }));
          return result;
      });
    # Two-argument then with undefined as the fulfilled handler
    - |
      on('tool.call', async ($, e, next) => next(e).then(undefined, () => ({ deny: 'chain failed' })));
    # Try with a catch inside a closure of the hook around the hook's chain
    - |
      on('tool.call', async ($, e, next) => {
          const run = async () => {
              try {
                  return await next(e);
              } catch (error) {
                  return { deny: 'chain failed' };
              }
          };
          return run();
      });
    # Another call before the chain call in the try body, the hook binds the chain parameter and the earlier call is no chain
    - |
      on('tool.call', async ($, e, next) => {
          try {
              log(e);
              return await next(e);
          } catch (error) {
              return { deny: 'chain failed' };
          }
      });
    # Catch on a Promise.all holding the chain call
    - |
      on('tool.call', async ($, e, next) => {
          const [result] = await Promise.all([next(e), $.store.get(key)]).catch(() => [{ deny: 'chain failed' }]);
          return result;
      });
    # Two-argument then on a Promise.race holding the chain call
    - |
      on('tool.call', async ($, e, next) => Promise.race([next(e), timeout]).then(use, () => ({ deny: 'chain failed' })));
    # Promise.allSettled over the chain call, the chain's rejection ends as a settled record
    - |
      on('tool.call', async ($, e, next) => {
          const [settled] = await Promise.allSettled([next(e), $.store.get(key)]);
          return settled.status === 'fulfilled' ? settled.value : { deny: 'chain failed' };
      });
    # Promise.any over the chain call, the chain's rejection is swallowed while another call fulfills
    - |
      on('tool.call', async ($, e, next) => Promise.any([next(e), fallback(e)]));
    # Catch on a Promise.all holding a then on the chain call
    - |
      on('tool.call', async ($, e, next) => {
          const [result] = await Promise.all([next(e).then(use), $.store.get(key)]).catch(() => [{ deny: 'chain failed' }]);
          return result;
      });
    # Hook bound to a name before the registration
    - |
      const hook = async ($, e, next) => next(e).catch(() => ({ deny: 'chain failed' }));
      on('tool.call', hook);
    # Catch clause without a binding
    - |
      on('tool.call', async ($, e, next) => {
          try {
              return await next(e);
          } catch {
              return { deny: 'chain failed' };
          }
      });
    # Combinator over the chain awaited inside the try body
    - |
      on('tool.call', async ($, e, next) => {
          try {
              const [result] = await Promise.all([next(e), $.store.get(key)]);
              return result;
          } catch (error) {
              return { deny: 'chain failed' };
          }
      });
    # Hook bound to a name under a matched registration
    - |
      const hook = async ($, e, next) => next(e).catch(() => ({ deny: 'chain failed' }));
      on('tool.call', { tool: 'Bash' }, hook);
