        - matches: {effect-module-member: {module: {regex: '\bSchemaBinary$'}, member: {regex: '^(duplex)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bSchemaGetter$'}, member: {regex: '^(compose|map|run)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bSchemaTransformation$'}, member: {regex: '^(composeTransformation)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bScope$'}, member: {regex: '^(provide|use)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bScopedRef$'}, member: {regex: '^(set)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bSemaphore$'}, member: {regex: '^(release|resize|take|takeIfAvailable|takeScoped)$'}}}
        - matches:
            effect-module-member:
