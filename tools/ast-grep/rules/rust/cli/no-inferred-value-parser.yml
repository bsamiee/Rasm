# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    inferred:
        kind: identifier
        all:
            - any:
                - pattern: value_parser
                  precedes: {regex: '^!$'}
                - regex: '^(string|os_string|path_buf|bool)$'
                  follows: {regex: '^::$', follows: {pattern: ValueParser}}
                - pattern: new
                  follows: {regex: '^::$', follows: {stopBy: {regex: '^[,=]$'}, kind: identifier, regex: '^(String|OsString|PathBuf|Bool|Enum)ValueParser$'}}
            - not: {precedes: {stopBy: {regex: '^,$'}, regex: '^\.$'}}
rule:
    pattern: value_parser
    all:
        - follows: {regex: '^[,(]$'}
        - any:
            - precedes: {regex: '^[,)]$'}
            - precedes: {regex: '^=$', precedes: {stopBy: {regex: '^,$'}, matches: inferred}}
        - inside: {kind: token_tree, inside: {kind: attribute, field: arguments, has: {field: path, regex: '^(arg|clap)$'}}}
        - not: {matches: rust-test-scope}
        - pattern: $KEY
message: '`$KEY` restates the parser clap infers from field type'
note: 'Delete `value_parser` with its value'
