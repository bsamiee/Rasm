# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-value-or-promise-return
language: tsx
severity: error
utils:
    return-position:
        any:
            - inside:
                kind: type_annotation
                inside:
                    field: return_type
                    any:
                        - matches: syntax-function-boundary
                        - kind: method_signature, function_signature, abstract_method_signature, call_signature
            - inside: {kind: function_type, field: return_type}
            - inside: {kind: type_alias_declaration, field: value}
    promise-of:
        kind: generic_type
        all:
            - has: {field: name, regex: '^(Promise|PromiseLike)$'}
            - has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $T}}
            - has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $ARG}}
    promise-of-readonly:
        kind: generic_type
        all:
            - has: {field: name, regex: '^(Promise|PromiseLike)$'}
            - has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, kind: readonly_type, pattern: $ARG, has: {pattern: $T}}}
rule:
    any:
        - kind: union_type
          matches: return-position
          all:
            - has: {matches: promise-of}
            - has: {pattern: $T, not: {matches: promise-of}}
        - kind: readonly_type
          matches: return-position
          has:
            kind: union_type
            all:
                - has: {matches: promise-of-readonly}
                - has: {pattern: $T, not: {kind: generic_type}}
message: 'Return type holds `$ARG` or a promise of it, a union every caller branches on'
note: 'Return one `Promise<<value>>` at the host boundary, adapted from the composed effect by `Effect.runPromise`'
