# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-deadline-race-by-hand-tsx
language: tsx
severity: error
utils:
    sleep-call:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^sleep$'}}}}
    sleep-branch:
        any:
            - matches: sleep-call
            - kind: call_expression
              any:
                - has: {field: function, kind: member_expression, has: {field: object, matches: sleep-call}}
                - has: {field: arguments, has: {nthChild: 1, matches: sleep-call}}
rule:
    kind: call_expression
    pattern: $RACE
    all:
        - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^race$'}}}}
        - has: {field: arguments, has: {matches: sleep-branch}}
message: '`$RACE` composes a deadline fallback by hand'
note: '`Effect.timeoutOrElse({ duration, orElse })` interrupts the source at its deadline and evaluates `orElse` lazily, and `Effect.timeoutOption` returns `Option.none()` in place of `TimeoutError`'
