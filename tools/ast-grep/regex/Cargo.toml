# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-ast-grep-regex"
edition.workspace = true
description       = "Character classes, token structure, and exact literals of Rust regexes and ast-grep patterns, as their parsers read them"

# --- [TARGETS] --------------------------------------------------------------------------

[[bin]]
name = "rasm-ast-grep-regex"
path = "main.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
serde_path_to_error  = { workspace = true }
ast-grep-config      = { workspace = true }
ast-grep-core        = { workspace = true }
ast-grep-dynamic     = { workspace = true }
regex-syntax         = { workspace = true }
fs-err               = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
