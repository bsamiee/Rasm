id: sql-import
language: sql
role: item
symbolType: module
isImport: true
isExported: false
rule:
    pattern: $DECLARATION
    any:
        - kind: attach_statement
          has: {field: source, pattern: $SOURCE}
        - kind: dot_command
          all:
            - has: {field: name, regex: '^\.(?:import|load|open|read)$'}
            - has: {field: arguments, pattern: $ARGUMENTS}
        - kind: dot_command
          all:
            - has: {field: name, regex: '^\.restore$'}
            - has: {field: arguments, pattern: $RESTORED}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    ATTACHED: {replace: {source: $SOURCE, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    PATH: {replace: {source: $ARGUMENTS, replace: '^(?:[\t\f\r \x{FEFF}]+-[^\t\f\r \x{FEFF}]*)*[\t\f\r \x{FEFF}]*(''[^'']*''|"[^"]*"|[^\t\f\r \x{FEFF}]+).*$', by: '$1'}}
    BACKUP: {replace: {source: $RESTORED, replace: '^.*[\t\f\r \x{FEFF}]([^\t\f\r \x{FEFF}]+)[\t\f\r \x{FEFF}]*$', by: '$1'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $ATTACHED$PATH$BACKUP
signature: $SIGNATURE
---
id: sql-table
language: sql
role: item
symbolType: struct
isExported: false
rule:
    kind: create_table_statement, create_virtual_table_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule:
        any:
            - {kind: 'column_definition, table_constraint, vtab_module_arg', inside: {kind: 'create_table_statement, create_virtual_table_statement'}}
            - {kind: 'select_clause, substitution', inside: {kind: create_table_statement}, not: {inside: {kind: create_table_statement, field: temporary}}}
            - kind: line_comment, block_comment
      fix: {template: ' ', expandStart: {regex: '(?i-u)^([(,]|as)$'}, expandEnd: {regex: '^\)$'}}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-member-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table, sql-view]
rule:
    pattern: $DECLARATION
    any:
        - kind: column_definition
          has: {field: name, pattern: $NAME}
        - kind: identifier, quoted_identifier, string_literal, substitution
          pattern: $NAME
          inside: {kind: create_view_statement}
          not: {any: [{inside: {kind: create_view_statement, field: body}}, {inside: {kind: create_view_statement, field: temporary}}]}
        - kind: star_result_column, qualified_star_result_column, expression_result_column
          any:
            - has: {field: alias, pattern: $NAME}
            - has: {field: expression, kind: column_reference, has: {field: name, pattern: $NAME}}
            - has: {field: expression, pattern: $NAME}
            - pattern: $NAME
          inside:
            kind: result_column_list
            inside:
                kind: select_clause
                field: columns
                inside: {kind: 'create_table_statement, create_view_statement', not: {has: {field: column, kind: 'identifier, quoted_identifier, string_literal, substitution'}}}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $KEY
signature: $SIGNATURE
---
id: sql-table-constraint
language: sql
role: member
symbolType: key
parentRuleIds: [sql-table]
rule:
    kind: table_constraint
    pattern: $DECLARATION
    any:
        - has: {field: name, pattern: $NAME}
        - pattern: $UNNAMED
rewriters:
    - id: target
      rule: {kind: 'foreign_key_clause, line_comment, block_comment'}
      fix: ' '
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    LABEL: {rewrite: {source: $UNNAMED, rewriters: [target]}}
    FOLDED: {replace: {source: $LABEL, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    KIND: {replace: {source: $FOLDED, replace: ' (\()| $|(?i-u) on conflict [a-z]+ ?$', by: '$1'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $NAME$KIND
signature: $SIGNATURE
---
id: sql-table-argument
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table]
rule:
    kind: vtab_module_arg
    pattern: $ARGUMENT
transform:
    NAME: {replace: {source: $ARGUMENT, replace: '^[\t\n\f\r \x{FEFF}]+|[\t\n\f\r \x{FEFF}]+$', by: ''}}
name: $NAME
---
id: sql-view
language: sql
role: item
symbolType: interface
isExported: false
rule:
    kind: create_view_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: query
      rule:
        any:
            - {kind: 'select_clause, substitution', inside: {kind: create_view_statement, field: body}}
            - kind: line_comment, block_comment
      fix: {template: ' ', expandStart: {regex: '(?i-u)^as$'}}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [query]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-index
language: sql
role: item
symbolType: key
isExported: false
rule:
    kind: create_index_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-index-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-index]
rule:
    kind: indexed_column
    pattern: $DECLARATION
    inside: {kind: create_index_statement}
    has:
        field: expression
        any:
            - {kind: column_reference, has: {field: name, pattern: $NAME}}
            - {kind: collate_expression, has: {field: operand, kind: column_reference, has: {field: name, pattern: $NAME}}}
            - pattern: $NAME
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $KEY
signature: $SIGNATURE
---
id: sql-trigger
language: sql
role: item
symbolType: event
isExported: false
rule:
    kind: create_trigger_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: 'select_statement, insert_statement, update_statement, delete_statement, substitution, line_comment, block_comment', inside: {kind: create_trigger_statement}, follows: {regex: '(?i-u)^begin$', stopBy: end}}
      fix: {template: ' ', expandStart: {regex: '(?i-u)^begin$', stopBy: end}, expandEnd: {regex: '(?i-u)^end$', stopBy: end}}
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-trigger-statement
language: sql
role: member
symbolType: operator
isPublic: false
parentRuleIds: [sql-trigger]
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement
    pattern: $DECLARATION
    inside: {kind: create_trigger_statement}
    any:
        - has: {field: target, pattern: $SUBJECT}
        - has: {field: from, has: {kind: qualified_table_name, pattern: $SUBJECT, stopBy: {kind: select_clause}}}
        - has: {kind: select_clause, has: {field: from, has: {kind: qualified_table_name, pattern: $SUBJECT, stopBy: {kind: select_clause}}}}
        - has: {field: from, has: {kind: table_or_subquery, has: {field: alias, pattern: $SUBJECT}, stopBy: {kind: select_clause}}}
        - has: {kind: select_clause, has: {field: columns, pattern: $SUBJECT}}
        - has: {field: columns, pattern: $SUBJECT}
        - has: {kind: substitution, pattern: $SUBJECT}
        - has: {stopBy: end, pattern: $$SUBJECT, regex: '(?i-u)^values$', not: {pattern: $_}}
rewriters:
    - id: clause
      utils:
        statement: {kind: 'select_statement, insert_statement, update_statement, delete_statement'}
      rule:
        any:
            - kind: where_clause, having_clause, order_by_clause, limit_clause, returning_clause, upsert_clause, with_clause, window_clause, group_by_clause
              inside:
                any:
                    - matches: statement
                    - {kind: select_clause, inside: {kind: select_statement}}
            - kind: line_comment, block_comment
            - {kind: 'select_clause, values_clause, default_values_clause, substitution', inside: {kind: insert_statement, field: source}}
      fix: ' '
    - id: assignment
      rule: {kind: 'set_assignment, line_comment, block_comment', inside: {kind: update_statement}}
      fix: {template: ' ', expandStart: {regex: '(?i-u)^(set|,)$'}}
    - id: enclosed
      rule: {kind: 'normal_function_arguments, select_clause, column_name_list', regex: '\n', follows: {regex: '^\($'}}
      fix: …
    - id: grouped
      rule: {kind: 'parenthesized_expression, tuple_expression', regex: '\n'}
      fix: (…)
transform:
    NAME: {replace: {source: $SUBJECT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [assignment, clause, enclosed, grouped]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() (…) (\))| (\))', by: '$1$2$3$4'}}
name: $NAME
signature: $SIGNATURE
---
id: sql-statement
language: sql
role: item
symbolType: operator
isExported: false
utils:
    subject:
        any:
            - has: {field: target, pattern: $SUBJECT}
            - has: {field: name, pattern: $SUBJECT}
            - has: {field: schema, pattern: $SUBJECT}
            - has: {field: savepoint, pattern: $SUBJECT}
            - has: {field: from, has: {kind: qualified_table_name, pattern: $SUBJECT, stopBy: {kind: select_clause}}}
            - has: {kind: select_clause, has: {field: from, has: {kind: qualified_table_name, pattern: $SUBJECT, stopBy: {kind: select_clause}}}}
            - has: {field: from, has: {kind: table_or_subquery, has: {field: alias, pattern: $SUBJECT}, stopBy: {kind: select_clause}}}
            - has: {kind: select_clause, has: {field: columns, pattern: $SUBJECT}}
            - has: {field: columns, pattern: $SUBJECT}
            - has: {kind: substitution, pattern: $SUBJECT}
            - has: {stopBy: end, pattern: $$SUBJECT, regex: '(?i-u)^(values|begin|commit|end|rollback|analyze|reindex|vacuum|explain)$', not: {pattern: $_}}
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement, pragma_statement, alter_table_statement, drop_table_statement, drop_view_statement, drop_index_statement, drop_trigger_statement, analyze_statement, reindex_statement, vacuum_statement, detach_statement, begin_statement, commit_statement, rollback_statement, savepoint_statement, release_statement, explain_statement, dot_command
    pattern: $DECLARATION
    any:
        - {kind: dot_command, has: {field: name, pattern: $$SUBJECT}}
        - {kind: explain_statement, has: {field: statement, matches: subject}}
        - matches: subject
rewriters:
    - id: clause
      utils:
        statement: {kind: 'select_statement, insert_statement, update_statement, delete_statement'}
      rule:
        any:
            - kind: where_clause, having_clause, order_by_clause, limit_clause, returning_clause, upsert_clause, with_clause, window_clause, group_by_clause
              inside:
                any:
                    - matches: statement
                    - {kind: select_clause, inside: {kind: select_statement}}
            - kind: line_comment, block_comment
            - {kind: 'select_clause, values_clause, default_values_clause, substitution', inside: {kind: insert_statement, field: source}}
      fix: ' '
    - id: assignment
      rule: {kind: 'set_assignment, line_comment, block_comment', inside: {kind: update_statement}}
      fix: {template: ' ', expandStart: {regex: '(?i-u)^(set|,)$'}}
    - id: enclosed
      rule: {kind: 'normal_function_arguments, select_clause, column_name_list', regex: '\n', follows: {regex: '^\($'}}
      fix: …
    - id: grouped
      rule: {kind: 'parenthesized_expression, tuple_expression', regex: '\n'}
      fix: (…)
transform:
    NAME: {replace: {source: $SUBJECT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [assignment, clause, enclosed, grouped]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() (…) (\))| (\))', by: '$1$2$3$4'}}
name: $NAME
signature: $SIGNATURE
---
id: sql-member-query
language: sql
role: member
symbolType: variable
isPublic: false
parentRuleIds: [sql-table, sql-view, sql-statement]
rule:
    any:
        - kind: cte_definition, named_window
          pattern: $DECLARATION
          has: {field: name, pattern: $NAME}
        - kind: table_or_subquery
          pattern: $DECLARATION
          all: [{has: {kind: select_clause}}, {has: {field: alias, pattern: $NAME}}]
rewriters:
    - id: query
      rule:
        any:
            - {kind: select_clause, inside: {kind: table_or_subquery}}
            - {kind: 'select_clause, substitution', inside: {kind: cte_definition, field: body}}
            - kind: line_comment, block_comment
      fix: {template: ' ', expandStart: {regex: '^\($'}, expandEnd: {regex: '^\)$'}}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [query]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ ?(?i-u:as )?|(?i-u: as)? ?$', by: ''}}
name: $NAME
signature: $SIGNATURE
