# --- [PROJECT] --------------------------------------------------------------------------

[project]
name              = "rasm-rendering"
version           = "0.1.0"
description       = "Render management: render queues and farm targets, background-render supervision, light rigs, sun positions, and output naming"
readme            = "README.md"
license           = "MIT"
license-files     = ["LICENSE"]
authors           = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers       = ["Intended Audience :: Developers", "Operating System :: OS Independent", "Private :: Do Not Upload", "Topic :: Multimedia :: Graphics :: 3D Rendering"]
requires-python   = ">=3.13"
import-names      = ["rasm.rendering"]
import-namespaces = ["rasm"]

dependencies = [
    # --- [CORE]

    "expression",                          # Results, options, and collections of every module
    "msgspec",                             # Records, tagged unions, and field bounds
    "opentelemetry-api",                   # Span around each program a run starts, and trace context written into its environment
    "opentelemetry-instrumentation-httpx", # Client span and trace context header of each request to a render farm server
    "opentelemetry-semantic-conventions",  # `error.type` of a failed program span
    "rasm-imaging",                        # Image analysis the light rigs read
    "rasm-records",                        # Fault model, field domains, and record files
    "rasm-telemetry",                      # Program output relayed as records through the handler of a run log
    "typing-extensions",                   # Runtime `TypeForm` schemas where `typing` lacks `TypeForm`
    "tzdata",                              # IANA time zones for zoneinfo on platforms without a database

    # --- [MATHEMATICS]

    "numpy",                               # Arrays for sun positions and light rigs
    "pvlib",                               # Solar position, refraction, and horizon event times
    "scipy",                               # Vector quadrature over light rigs

    # --- [IMAGING]

    "opencolorio",                         # Color processing of render outputs

    # --- [HTTP]

    "httpx2",                              # HTTP for batch render targets and notices
    "tenacity",                            # Batch target retries over configured domain retry policies

    # --- [POWER]

    "wakepy",                              # System sleep held off while a local queue renders
]

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/libs/python/blender/rendering"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rasm.rendering"
module-root = ""
