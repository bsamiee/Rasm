# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-pdf"
edition.workspace = true
description       = "PDF documents authored, edited, read, signed, validated, and soft-proofed"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

