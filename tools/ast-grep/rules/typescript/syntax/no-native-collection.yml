# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-collection
language: tsx
severity: error
rule:
    any:
        - kind: new_expression
          all:
            - has: {field: constructor, pattern: $NAME, regex: '^(globalThis\.)?(Map|Set)$', matches: syntax-global-reference}
            - not:
                any:
                    - inside:
                        kind: public_field_definition, variable_declarator, required_parameter, optional_parameter
                        field: value
                        stopBy: {not: {kind: parenthesized_expression}}
                        has:
                            field: type
                            has: {kind: generic_type, has: {field: name, regex: '^(Readonly)?(Map|Set)$'}}
                    - inside:
                        kind: satisfies_expression
                        stopBy: {not: {kind: parenthesized_expression}}
                        has: {kind: generic_type, has: {field: name, regex: '^(Readonly)?(Map|Set)$'}}
        - kind: call_expression
          has: {field: function, pattern: $NAME, regex: '^(globalThis\.)?(Map|Object)\.groupBy$', matches: syntax-global-reference}
message: '`$NAME` builds a native collection without structural key equality'
note: '`HashMap` and `HashSet` compare keys by `Equal`, `Array.groupBy` groups into a record'
