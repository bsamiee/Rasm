id: no-unquoted-compound-subscript
snapshots:
  ((a[x,$i]++)):
    fixed: ((a["x,$i"]++))
    labels:
    - source: a[x,$i]
      style: primary
      start: 2
      end: 9
    - source: x,$i
      style: secondary
      start: 4
      end: 8
  '[[ -v a[x,"$i"] ]] && y=1':
    fixed: '[[ -v a["x,$i"] ]] && y=1'
    labels:
    - source: a[x,"$i"]
      style: primary
      start: 6
      end: 15
    - source: -v
      style: secondary
      start: 3
      end: 5
    - source: -v a[x,"$i"]
      style: secondary
      start: 3
      end: 15
  '[[ -v a[x,$i] && -v b ]]':
    fixed: '[[ -v a["x,$i"] && -v b ]]'
    labels:
    - source: a[x,$i]
      style: primary
      start: 6
      end: 13
    - source: -v
      style: secondary
      start: 3
      end: 5
    - source: -v a[x,$i]
      style: secondary
      start: 3
      end: 13
  '[[ -v snapshot_key[$id,${text[a]}] ]] && y=1':
    fixed: '[[ -v snapshot_key["$id,${text[a]}"] ]] && y=1'
    labels:
    - source: snapshot_key[$id,${text[a]}]
      style: primary
      start: 6
      end: 34
    - source: -v
      style: secondary
      start: 3
      end: 5
    - source: -v snapshot_key[$id,${text[a]}]
      style: secondary
      start: 3
      end: 34
  a[x,$i]+=v:
    fixed: a["x,$i"]+=v
    labels:
    - source: a[x,$i]
      style: primary
      start: 0
      end: 7
    - source: x,$i
      style: secondary
      start: 2
      end: 6
  a[x,$i]="v w":
    fixed: a["x,$i"]="v w"
    labels:
    - source: a[x,$i]
      style: primary
      start: 0
      end: 7
    - source: x,$i
      style: secondary
      start: 2
      end: 6
  count[valid,$id]=$v:
    fixed: count["valid,$id"]=$v
    labels:
    - source: count[valid,$id]
      style: primary
      start: 0
      end: 16
    - source: valid,$id
      style: secondary
      start: 6
      end: 15
  declare -A m=([x,$i]="v w"):
    fixed: declare -A m=(["x,$i"]="v w")
    labels:
    - source: '[x,$i]="v w"'
      style: primary
      start: 14
      end: 26
    - source: ([x,$i]="v w")
      style: secondary
      start: 13
      end: 27
  declare -A m=([x,$i]=v):
    fixed: declare -A m=(["x,$i"]=v)
    labels:
    - source: '[x,$i]=v'
      style: primary
      start: 14
      end: 22
    - source: ([x,$i]=v)
      style: secondary
      start: 13
      end: 23
  m+=([x,$i]=v):
    fixed: m+=(["x,$i"]=v)
    labels:
    - source: '[x,$i]=v'
      style: primary
      start: 4
      end: 12
    - source: ([x,$i]=v)
      style: secondary
      start: 3
      end: 13
  n=${#a[x,$i]}:
    fixed: n=${#a["x,$i"]}
    labels:
    - source: a[x,$i]
      style: primary
      start: 5
      end: 12
    - source: x,$i
      style: secondary
      start: 7
      end: 11
  printf '%s\n' "${a[x,$i]}":
    fixed: printf '%s\n' "${a["x,$i"]}"
    labels:
    - source: a[x,$i]
      style: primary
      start: 17
      end: 24
    - source: x,$i
      style: secondary
      start: 19
      end: 23
  w=${a[x,"$i"]}:
    fixed: w=${a["x,$i"]}
    labels:
    - source: a[x,"$i"]
      style: primary
      start: 4
      end: 13
    - source: x,"$i"
      style: secondary
      start: 6
      end: 12
  x=${count[valid,$id]}:
    fixed: x=${count["valid,$id"]}
    labels:
    - source: count[valid,$id]
      style: primary
      start: 4
      end: 20
    - source: valid,$id
      style: secondary
      start: 10
      end: 19
  y=${a[x,$i]:-d}:
    fixed: y=${a["x,$i"]:-d}
    labels:
    - source: a[x,$i]
      style: primary
      start: 4
      end: 11
    - source: x,$i
      style: secondary
      start: 6
      end: 10
  z=${a[$i,1]}:
    fixed: z=${a["$i,1"]}
    labels:
    - source: a[$i,1]
      style: primary
      start: 4
      end: 11
    - source: $i,1
      style: secondary
      start: 6
      end: 10
