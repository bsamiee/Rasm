syntax = "proto3";

package rasm.contracts.scene;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "rasm/contracts/artifact/artifact.proto";
import "rasm/contracts/geometry/tessellation.proto";
import "rasm/contracts/spatial/vector.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

enum LightKind {
  LIGHT_KIND_UNSPECIFIED = 0;
  LIGHT_KIND_DIRECTIONAL = 1;
  LIGHT_KIND_POINT = 2;
  LIGHT_KIND_SPOT = 3;
  LIGHT_KIND_LINEAR = 4;
  LIGHT_KIND_RECTANGULAR = 5;
}

enum Falloff {
  FALLOFF_UNSPECIFIED = 0;
  FALLOFF_CONSTANT = 1;
  FALLOFF_LINEAR = 2;
  FALLOFF_INVERSE_SQUARED = 3;
}

enum WebDialect {
  WEB_DIALECT_UNSPECIFIED = 0;
  WEB_DIALECT_IES = 1;
  WEB_DIALECT_EULUMDAT = 2;
  WEB_DIALECT_CIE = 3;
}

// Linear-light RGB per component; no transfer curve applies.
message Spectrum {
  double r = 1 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double g = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double b = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// --- [SUN] --------------------------------------------------------------------------------

// The geodetic frame an annual engine run admits, bounded to its own site and building rows. Longitude is
// positive EAST; `north_axis_deg` is the building rotation measured clockwise from true North; `moment` is the UTC
// instant the angles were solved at; `daylight_saving_minutes` records the offset the host's local clock carried.
message SolarFrame {
  double latitude_deg = 1 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];
  double longitude_deg = 2 [(buf.validate.field).double = {
    gte: -180
    lte: 180
  }];
  double time_zone_hours = 3 [(buf.validate.field).double = {
    gte: -12
    lte: 14
  }];
  double elevation_m = 4 [(buf.validate.field).double = {
    gte: -300
    lt: 8900
  }];
  double north_axis_deg = 5 [(buf.validate.field).double = {
    gte: 0
    lt: 360
  }];
  int32 daylight_saving_minutes = 6;
  google.protobuf.Timestamp moment = 7 [(buf.validate.field).required = true];
}

// `azimuth_deg` is measured EAST OF NORTH — North 0, East 90, South 180, West 270; a renderer's own convention
// converts at its edge.
message SolarAngles {
  double altitude_deg = 1 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];
  double azimuth_deg = 2 [(buf.validate.field).double = {
    gte: 0
    lt: 360
  }];
}

// Any peer holding the same almanac reproduces `angles` from `frame`; only this arm can seat a site.
message SitedSun {
  SolarFrame frame = 1 [(buf.validate.field).required = true];
  SolarAngles angles = 2 [(buf.validate.field).required = true];
}

// The `authored` arm carries no site, so an annual run refuses it by name rather than back-solving one.
// `intensity_scale` is the host's DIMENSIONLESS render multiplier, never an irradiance.
message SceneSun {
  oneof derivation {
    option (buf.validate.oneof).required = true;

    SitedSun sited = 1;
    SolarAngles authored = 2;
  }
  bool enabled = 3;
  double intensity_scale = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

// --- [PHOTOMETRY] -------------------------------------------------------------------------

// The authored photometric web by artifact coordinate, never a decoded distribution.
message WebRef {
  reserved 1, 3;
  reserved "key", "byte_length";

  WebDialect dialect = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  rasm.contracts.artifact.ArtifactRef artifact = 4 [(buf.validate.field).required = true];
}

// The one authoritative reading is the arm: `radiant_flux_w` is the column an engine lighting level reads
// directly, `relative_scale` is dimensionless and refuses every photometric slot. The two derived readings ride
// beside it.
message Power {
  oneof authority {
    option (buf.validate.oneof).required = true;

    double radiant_flux_w = 1 [(buf.validate.field).double = {
      finite: true
      gt: 0
    }];
    double relative_scale = 2 [(buf.validate.field).double = {
      finite: true
      gte: 0
    }];
  }
  double lumens = 3 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  double candela = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

message Cone {
  double half_angle_rad = 1 [(buf.validate.field).double = {
    gt: 0
    lte: 1.5707963267948966
  }];
  double hot_spot = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

message Extent {
  rasm.contracts.spatial.Displacement3 length = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Displacement3 width = 2 [(buf.validate.field).required = true];
}

message AttenuationCoefficients {
  double constant = 1 [(buf.validate.field).double.finite = true];
  double linear = 2 [(buf.validate.field).double.finite = true];
  double quadratic = 3 [(buf.validate.field).double.finite = true];
}

// `cone` separates the three answers a spot cone gives — none where the kind carries no cone, `shaped` where the
// document admits one, `degenerate` where the kind carries one the document's tolerance refuses. `falloff` names a
// host attenuation row and `coefficients` a free triple the host classified onto no row.
message Photometry {
  reserved "location_m";

  bytes id = 1 [(buf.validate.field).bytes.len = 16];
  optional string name = 2;
  LightKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool enabled = 4;
  rasm.contracts.spatial.Point3 location = 5 [(buf.validate.field).required = true];
  rasm.contracts.spatial.UnitDirection3 direction = 6 [(buf.validate.field).required = true];
  rasm.contracts.spatial.UnitDirection3 perpendicular = 7 [(buf.validate.field).required = true];
  Power power = 8 [(buf.validate.field).required = true];
  Spectrum diffuse = 9 [(buf.validate.field).required = true];
  Spectrum ambient = 10 [(buf.validate.field).required = true];
  Spectrum specular = 11 [(buf.validate.field).required = true];
  double shadow_fraction = 12 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  oneof cone {
    Cone shaped = 13;
    google.protobuf.Empty degenerate = 14;
  }
  oneof extent {
    rasm.contracts.spatial.Displacement3 linear = 15;
    Extent rectangular = 16;
  }
  oneof attenuation {
    option (buf.validate.oneof).required = true;

    Falloff falloff = 17 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    AttenuationCoefficients coefficients = 18;
  }
  WebRef web = 19;
}

// --- [SHADING] ----------------------------------------------------------------------------

// The fidelity the shading payload was tessellated AT: maximum linear chord deviation, angular deflection in
// RADIANS, and maximum triangle count; a consumer grades a payload against its own policy.
// The shading geometry by REFERENCE: the GLB body rides the artifact byte seam under its own key.
message Shading {
  reserved 1, 2;
  reserved "key", "artifact_hash";

  uint64 element_count = 3;
  uint64 triangle_count = 4;
  rasm.contracts.geometry.TessellationPolicy fidelity = 5 [(buf.validate.field).required = true];
  rasm.contracts.artifact.ArtifactRef artifact = 6 [(buf.validate.field).required = true];
}

// --- [DESCRIPTOR] -------------------------------------------------------------------------

// `key` covers the framed preimage of every band below, so two captures of an unchanged scene dedupe and a single
// edited light re-keys the descriptor. `source_unit` is the host regime name the metres derived FROM — a custom
// host unit carries its own name, so the column is open text.
message SceneDescriptor {
  bytes key = 1 [(buf.validate.field).bytes.len = 16];
  string source_unit = 2 [(buf.validate.field).string.min_len = 1];
  SceneSun sun = 3 [(buf.validate.field).required = true];
  repeated Photometry lights = 4;
  Shading shading = 5 [(buf.validate.field).required = true];
  google.protobuf.Timestamp captured_at = 6 [(buf.validate.field).required = true];
}
