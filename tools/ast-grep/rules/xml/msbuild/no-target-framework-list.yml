# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-target-framework-list
language: xml
severity: error
files: ['**/*.{csproj,props,targets}']
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^TargetFramework$'}}}
        - inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}}}
        - has: {kind: content, pattern: _FRAMEWORKS, has: {kind: CharData, regex: ';'}}
message: '`TargetFramework` holds the list `$FRAMEWORKS`, which fails `NETSDK1046`'
note: Assign a framework list to `TargetFrameworks`
