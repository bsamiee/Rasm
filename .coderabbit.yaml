        - path: "libs/python/**"
          instructions: |-
            - Corpus floor is py3.15 on pinned-newest providers, and doctrine fences themselves spell its forms: a syntax-validity or provider-semantics claim reads the named doctrine page BEFORE severity assignment, and a claim contradicting that page is never emitted.
            - Refuted standing claims, banned verbatim at every severity: "frozendict is not importable from builtins" — `from builtins import frozendict` is the legislated table spelling per docs/stacks/python/language.md [FROZENDICT_TABLE_SITE]; "start_soon returns None" — the pinned anyio surface is `start_soon -> TaskHandle[T]` with `handle.return_value` read after group close per docs/stacks/python/concurrency.md [CHILD_CARRIER]; "except A, B: is invalid syntax" — paren-less multi-exception is py3.14+ grammar and the ruff-format canonical form the repo gate emits, so re-adding grouping parens fails the format gate.
            - `lazy import`/`lazy from` are module-scope soft keywords.
            - `importlib.util.find_spec` on a dotted name imports the parent package, so a probe-the-submodule demand against a parent-side no-import gate pays the exact native band the gate defers — the probe rides the top-level distribution name, and unconditional submodules of one distribution make distribution presence the capability unit.
            - Single-door jax pages arm process-global configuration on the door's first line (`jax_enable_x64` first, or solves silently yield float32) — the ruled arm-first form; a move-to-application-startup or compile-time-rejection demand against it re-litigates the ruling, and every door writes the same monotone value, so concurrent compiles cannot race to divergent states. The inverse hunt is live: a door binding any dependent module before the arm is the finding, since a pre-arm dependent module-level array bakes float32 permanently.
            - `segno.helpers` ships `make_make_email_data(to, cc, bcc, subject, body)` and no `make_email_data` — the doubled spelling IS the installed surface, so a misspelling flag or corrected-spelling demand against it breaks the binding.
            - `ifcopenshell.util.geolocation.get_true_north` is total — `0` for a model declaring no TrueNorth, never `None`; declaredness reads the provider's own context roster, and the total-`0` collapse fabricating a due-north declaration is the real defect.
            - A laundering claim against a ruled builder-`ValueError` tail arm proves the named interior paths raise that class — provider kinds inheriting builtin `ValueError` route to the preceding provider-family arm by MRO order, so the tail traps caller data alone.
            - `functools.cache` over a subprocess-backed helper dedups the value, not the racing first construction, and a shared `-stay_open` pipe interleaves unserialized exchanges — one narrow `Lock` bracketing resolution and exchange is the demanded form, never a coarse lock.

            - Match semantics: `tuple()` is a class pattern matching any tuple instance and only the literal `()` matches the empty tuple — a claim built on the opposite reading is wrong.
            - Admission happens once: a typed int field carries no non-finite value so an isfinite demand adds nothing, and a typed frozen struct field needs no arity re-check — either demand violates BOUNDARY_ADMISSION.
            - Verify against the owning page before flagging a settled contract: raw-token admission lives at the parse seam per TABLE_DISPATCH, never inside a typed-enum total dispatch; a consumer declaring its per-offload budget through Kernel.of(deadline=, enforcement=) is the workers crossing contract; a sync rail selecting an async step through default_with with a single await is the ruled rails-and-effects composition form, never a nested rail.

            - Worker-crossing contracts are ruled: SHM release-in-finally is the POSIX semantics the workers page legislates — an attached mapping outlives the unlink, and deferred cleanup leaks blocks for workers that never run; Wire.SHARED_MEMORY dispatches per argument shape, so only bare ndarrays ride the span channel; pool self-healing is structural (reuse='auto' replaces broken singletons) and pool-DEAD is capsule absence; pebble ships no public pid roster — the complement over owned sets IS the pebble set under the custody law.
            - Preview is the five-field contract with the trailing band per core/receipt.md; a DEGRADED roll double-buffers so capacity never gaps — demanding NOT_SERVING before the roll advertises a phantom outage.

            - A msgspec tagged-union fault is a value with no BaseException lineage, consumed by match and never re-raised.
            - An in-place delta bounds by shift-displaced occupancy over one shared region, never the from-plus-to size sum.
            - A plugin set reads from distribution metadata (importlib.metadata.entry_points) activated once through EntryPoint.load() traversed fallibly — an import-time side-effect registry silently emptied by lazy import is the rejected form.
            - expression.Map is an ordered tree requiring a total order on every key, so an insertion-order-dependent derivation rides frozendict, never Map.
            - An owned enum mirroring a provider vocabulary admits the provider's full member roster — EnumType(foreign_value) raises ValueError on every dropped member, so mirrored-vocabulary coverage is a totality obligation.
            - msgspec.UNSET and pydantic.experimental.MISSING are the codec's own presence sentinels collapsed at the seam; a domain absence axis that changes dispatch is a @tagged_union case, never the wire sentinel leaked inward.
            - expression.extra.result.catch(exception=X) is the single-exception trap minting Result from a named raise; effect.try_ composes Try values and never catches a provider raise — demanding effect.try_ as the exception adapter is a false positive.
            - expression.collections.Block.map eagerly materializes and executes its mapper — an "unexecuted mapper" claim against it is false; the real defect class there is a discarded mapped result with no explicit emission policy.
            - Identity material rides msgspec canonical encodings — `msgspec.json.encode` for composite keys, msgpack with `enc_hook` for fingerprints; a hand-rolled join or quote id scheme beside an available canonical codec is the weaker form.
            - Corpus-floor surface is real API, never a hallucination: t-strings with string.templatelib Template/Interpolation are the required untrusted-markup form with conversion an integer ordinal; the active-surface owners the doctrine page rosters (math.integer, math.fma/sumprod, uuid.uuid7, heapq max family, compression.zstd, os.readinto, os.process_cpu_count, Path.copy_into/move_into/info, functools.Placeholder, hmac.digest, concurrent.interpreters, InterpreterPoolExecutor, sys.monitoring, annotationlib.get_annotations, and kin) exist; typing rides inline class C[T], type aliases, TypeIs, TypeForm, Unpack[TypedDict], TypedDict(closed=True), Required/NotRequired/ReadOnly, so importing from typing_extensions a member typing exports is the rejected form with Sentinel the one exception; a Sentinel minted once as a module global, compared by is and carried as a union arm, is a legitimate default rather than a magic value; and if TYPE_CHECKING is the narrower form for names that must never load at runtime.
            - Doctrine licenses named statement kernels where a for, try, or in-place mutation is platform-forced — never rail violations: the ordered-capture admission kernel putting the derived validation error before its base, the payload-adapter validation gate, the enum-vocabulary crossing trap, the module __getattr__ resolver, the aspect rail-lift catching the type-checker violation, the capsule memoryview release kernel, the async sequential fold under a move-on timeout, the shielded teardown await, recursion-frontier while kernels, in-place heap operations, and the single isinstance guard on the iterable-normalization arm.
            - Verified traps whose listed shape is the FIX: any type in a @checked/beartype-wrapped signature imports unconditionally, so a TYPE_CHECKING-stranded type on a checked signature is the finding and demanding the move is the defect; structlog BytesLoggerFactory() with no file= writes to sys.stdout.buffer, so each renderer branch carrying an explicit stderr file= is the fix and a bare factory on a stdout-protocol tool is a real collision; a definition-time @beartype aspect never raises into domain flow because the weave lifts the violation onto the fault rail, so a bare @beartype throwing into the interior is the finding; expression.MailboxProcessor is forbidden on the anyio substrate and the single-consumer send/receive drain is the ruled replacement; and platform-gated type suppressions in the operator estate are irreducible pairs whose removal flips the rejection between checkers, so demanding it is the false positive.
        - path: "libs/csharp/**"
          instructions: |-
            - Verified C# 14 / net10 substrate truths — flagging one is a false positive, and LanguageExt.Prelude is static-imported so bare Optional, guard, Some, None, unit, fun, pure, and atomic are legal unqualified while fences carry neutral placeholder identifiers by law, never as unfinished work.
            - Generated-owner admission is one settled authority: a partial struct/class/record with no visible body is generator-completed, not an empty type; attribute walls of OperatorsGeneration knobs are load-bearing algebra grants; and a generated [SmartEnum] admits no invalid instance by construction, so a membership guard against undeclared enum items is structurally void. Generated-factory arity splits by which one returns the error: TryCreate(TValue, out Owner) -> bool carries no error out-parameter so comparing its result against a validation-error value never compiles, Validate(TValue?, IFormatProvider?, out Owner?) is the error-returning factory, and [ValidationError<TFault>] makes the generator hand back the page's own fault family rather than a re-wrap mislabelling a malformed value as a policy breach.
            - A nullable receiver mirroring the platform's own unlistened-observer contract — Activity? and the kin a headless lane takes — is the settled headless form beside a required Option<T> payload on the same signature, so a nullable-capability-leak claim against it re-litigates that split; a proto3 non-optional message field is still nullable in C#, so every required message column owns a named presence refusal and a residual exception catch reporting the dereference as an opaque throw is the finding.
            - A hand-rolled Validation tower beside a generated Validate/ValidateFactoryArguments bridge is a second admission authority — the generated bridge rules and the tower deletes — and generator-owned absence guards precede ValidateFactoryArguments, so an interior normalization hook owes no null-or-absence re-check and a demand for one is void.
            - Null is unspellable on a readonly record struct parameter and on non-nullable members and union-case payloads under nullable-enable with warnings-as-errors — service, delegate, expression-tree, and collection fields included, Seq<T> a readonly struct spelling no null — union positional cases construct only over already-admitted payloads and seam guards ride the host entry weave, so an interior runtime null-fold demand re-spells the compile contract and is void at every severity under every phrasing (reject-null, ensure-null-rejected, a demanded ThrowIfNull), while a landed ThrowIfNull or null-test on a non-nullable contract is that same dead re-spelling, flagged for deletion and never ratified as hardening.
            - A host enum-typed field is a value type at catalog authority whose zero member is a legitimate roster default at decompile authority — a null-admission or malformed-default claim against it misreads the classification, undefined integral values the one representable defect admitted through the defined-value gate.
            - Host geometry value-struct payloads (Line, Arc, Circle, Plane, Sphere, Cylinder, and kin) spell no null by construction; only reference-bearing Curve, Surface, Mesh, and Brep admit null at host seams.
            - A readonly partial struct mints an admission-bypassing ghost through field zero-init and default, so it keeps exactly one mandated outer storage seam reading the key member — an aggregate receiving such rows checks that key seam per row and never replays the remaining owner invariants, and deleting the seam as redundant is the inverse false positive.
            - Trace construction before flagging a consumer: aggregate closure, cardinality, tolerance, plane, correlation, case-presence, and default-ghost law stay on the aggregate, while member geometry, finiteness, bulges, range, and correspondence admit at the member owner.
            - [Equatable]/[OrderedEquality] on class-root unions is intentional — class roots forfeit generated record equality; operator glyphs are per-carrier algebras (| as Validation-choice, Fallible-catch, Schedule-union, or Eff-finally) and constrained operators live only inside extension<E, F, A>(K<F, A>) blocks.
            - Deliberate compiler workarounds, never restructure targets: a domain union kept as abstract record with switch (this) instead of [Union] avoids CS9244 where a ref struct state parameter flows through record consumers; an outer lambda parameter renamed from _ to a real binding where the body uses _ = expr is the required CS8820/CS0029 fix; a block-body lambda copying a mutable struct field to a local before use is required because the IDE0200 method-group reduction silently freezes the receiver by value; operators without Negate/Multiply named alternates are canonical with CA2225 silenced estate-wide, and per-type epsilon lives as a typeclass interface member, never one shared constant across differing-unit types.
            - Inside a from..select expression, group/by/into/on/equals as range variables or named arguments cause CS0745 cascades — an error wall in a LINQ file is a keyword collision, not a brace imbalance, and positional arguments or renames are the fix.
            - Carrier and lookup truths refute their own demands: `Arr<T>` is a value carrier that cannot hold a null collection reference so a null-guard demand cites an actual nullable seam first; LanguageExt `Seq<T>.Head`/`.Last` return `Option<T>` rather than throwing, so a bounds-guard demand cites the canonical lookup owner first; and positive relational admission (`value is >= lower and <= upper`) rejects `double.NaN` because both comparisons are false, while negative rejection (`value < lower || value > upper`) needs an explicit finiteness fold.
            - using var on a scoped disposable boundary carrier, and var bindings inside pattern arms — list, property, positional, and slice — are doctrine-prescribed spellings; restructure or explicit-type demands against them are style noise at every severity.
            - The LanguageExt.Traits.Domain value-trait axes carry an inheritance-arity trap that reads as a redundant constraint and is not: Amount<SELF,SCALAR>, VectorSpace<SELF,SCALAR>, Locus<SELF,DIST,SCALARDIST>, and Identifier<SELF> inherit the arity-ONE marker DomainType<SELF>, which declares no members, so From(REPR) and To() come only from DomainType<SELF,REPR> — an owner or constraint naming BOTH the axis and the representation arity is the correct spelling and a demand to drop the second as duplicated inheritance is a false positive, while an owner naming the axis alone has no admission or egress surface at all and is the real defect. The bridge also forces its fault currency: the default Thinktecture.ValidationError is not a LanguageExt Error, so [ValidationError<TFault>] over a fault family carrying IValidationError<TFault> and a static Create(string) is mandatory rather than decorative.
            - Two or more bool columns on one generated [SmartEnum] row or one positional record are a capability flag set spelled positionally — the deleted form — because the row then admits every corner of a product the domain never legalizes; the repair is one rank-ordered vocabulary in a frozen set with membership as set algebra and the legal corners as a declared admission law, so an illegal corner stops being reachable rather than being guarded at each use. Genuinely independent axes with no legal-corner law lawfully stay bool columns when the owner says so, so a collapse demand against a stated-independent pair is a false positive.
            - An optional parameter cannot default to a ValueObject/SmartEnum value (CS1736/TTRESG047), and Option<T> x = default plus IfNone(policy) is the one optional-parameter form on every rail surface — a nullable parameter defaulting null is the finding, never the Option spelling.
            - State-threaded Switch(state:, static (s, c) =>) collapsing case overrides into one parent body is the canonical shape, explicit Switch type arguments are deliberate compiler workarounds, and arm arity splits by owner — a [Union] state-threaded arm is the two-parameter (state, case) lambda while a [SmartEnum] state-threaded arm takes the state alone, so a one-parameter arm on a state-threaded union Switch or a two-parameter arm on a smart-enum one re-binds overload resolution or fails late and is a defect regardless of how clean it reads.
            - Mandatory rail mechanics, never ceremony: Switch arms returning sibling case types give best-common-type inference nothing (CS0411) so the first arm's cast to the union base is the required anchor; `.As()` re-anchoring after every trait combinator is mandatory and TraverseM (abort) versus Traverse (accumulate) is a correctness choice; traversal lives on the trait carriers alone, so a bare array or FrozenSet lifts through toSeq(...) first and a traversal member spelled on the raw collection is a compile fiction; and Try.lift(...).Run().MapFail(...).Bind(static r => r) self-flattens, the dropped Bind discarding the error.
            - A Match whose Some arm null-probes a payload Option structurally cannot make null, and a from-in-Fin.Succ query shell binding a pure value no rail step consumes, are deleted-form residue — Fin.Succ inside a query legally sequences an effect or captures a pre-mutation read.
            - Sibling surfaces re-spelling shared-rail lifecycle machinery collapse onto the gate owner's generic members — a params ReadOnlySpan staged harvest whose product order and tallies are congruent by construction, a Fin<T> Rollback extension owning failure-release custody, and one context-guarded entry fold — never per-page re-mints or per-site MapFail-dispose blocks; a union carrying raw scalar payloads owns one generated-Switch admission fold whose per-case guard arms bind once before dispatch, and selector families converge on one guarded live-row projector so a new case inherits refusal for free.
            - Extern aliases over colliding domain packages are preventive fixes, never rename demands; Rhino-rich host capture coexisting with host-neutral semantics is architecture, never duplication; a case or nested record sharing a host type's simple name makes unqualified construction bind to the corpus type, so the whole collision family qualifies host spellings globally; exclusive disposable custody never rides a copyable record — record copy and with re-mint disposal ownership, so shared custody is reference-counted or the owner non-copyable.

            - Host truths hold at decompile authority, member spellings and lifecycle lineage included: an apparent typo in a decompile-verified host member — DisplayPipelineAttributes.ShowSilhouttes, NamedParametersEventArgs.TryGetUnmanged — is the shipped spelling, so a misspelling flag or corrected-spelling demand breaks the binding and is void at every severity; ObjectList.AllWires includes dangling entries by design (consumer filters), Canvas.ScheduleRedraw with the before-background paint phase is the canonical motion tick, KeyedValues.Set is typed-overload-only with no generic Set<T>, and RhinoCommon display-mode descriptors are owned copies — GetDisplayMode returns a copy and registration changes publish only through UpdateDisplayMode/AddDisplayMode, so a mutates-live-registration claim against a copy-then-publish flow is void; history-replay result wrappers carry internal constructors and update host-owned native state — ReplayHistoryResult and kin — so a detached-copy, per-result dispose, or per-result live-object compensation demand against them contradicts the decompiled lineage; an invariant the host surface does not document is never demanded — preview-bitmap sizing (InstanceDefinition.CreatePreviewBitmap and kin) carries no maximum-dimension contract, so the caller's admitted allocation budget governs and a demanded ceiling mints the banned magic number, a host absence sentinel (Guid.Empty and kin) collapses to the owned absence case at the read seam and round-trips at apply, so a nonempty-invariant demand against that projection fabricates law, and a host member decompile-proven to clamp its declared parameters rather than reject makes pre-host refusal the corpus form, so a host-rejects claim there is void; a host type's decompile-proven IDisposable lineage settles lease-ownership demands — custody lands as an owned lease through total union dispatch, so a per-site dispose demand the lease rail already owns, or a custody claim contradicting the linea