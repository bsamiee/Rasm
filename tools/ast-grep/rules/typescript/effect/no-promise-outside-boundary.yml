# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-promise-outside-boundary
language: tsx
severity: error
# The plugin loader accepts claude-code and relative .ts imports alone, a config root and a spec are the host's boundary and await there
ignores: ['.claude/plugins/**', '**/*.config.ts', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
rule:
    all:
        - any:
              - kind: await_expression
              # The await keyword is an unnamed child of the loop statement
              - kind: for_in_statement
                has: {regex: '^await$'}
              # The promise chain, a settlement handler on any receiver
              - kind: call_expression
                has: {field: function, kind: member_expression, has: {field: property, regex: '^(then|catch|finally)$'}}
        # The constructor that converts the promise holds the chain and the await inside its thunk, tested after the shape
        - not: {inside: {stopBy: end, matches: effect-promise-boundary}}
message: The promise is consumed outside the boundary through an await, a for-await, or a then, catch, or finally chain
note: >-
    Convert the promise once at the boundary, `Effect.tryPromise({ try: () => promise, catch: (cause) => error })` or `Effect.promise`,
    compose the Effect inside, and read an async iterable through `Stream.fromAsyncIterable`
