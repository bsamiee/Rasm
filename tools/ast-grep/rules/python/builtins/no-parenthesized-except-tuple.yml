# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parenthesized-except-tuple
language: python
severity: error
rule:
    kind: tuple
    pattern: $TYPES
    inside: {kind: except_clause, field: value}
    not: {has: {kind: list_splat}}
    has: {nthChild: 2}
constraints:
    TYPES: {not: {regex: '\n'}}
transform:
    MEMBERS: {replace: {source: $TYPES, replace: '^\(\s*(.*?)\s*,?\s*\)$', by: '$1'}}
fix: $MEMBERS
message: Except clause parenthesizes its exception types
note: Write `except <A>, <B>:`, retain parentheses around multiline or starred tuples and with an `as` clause
