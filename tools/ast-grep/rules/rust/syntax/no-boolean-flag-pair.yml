# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-boolean-flag-pair
language: rust
severity: error
utils:
    plain-type:
        kind: primitive_type
        regex: '^bool$'
    wrapped-type:
        any:
            - kind: reference_type
              has: {field: type, matches: plain-type}
            - kind: generic_type
              all:
                - has: {field: type, regex: '^((std|core)::option::)?Option$'}
                - has: {field: type_arguments, has: {matches: plain-type}, not: {has: {nthChild: 2}}}
    flag:
        kind: 'parameter, field_declaration'
        has: {field: type, any: [{matches: plain-type}, {matches: wrapped-type}]}
    wrapped-flag:
        kind: 'parameter, field_declaration'
        has: {field: type, matches: wrapped-type}
    flag-pair:
        any:
            - has: {matches: wrapped-flag, pattern: $FIRST, precedes: {stopBy: end, matches: flag, pattern: $SECOND}}
            - has: {matches: flag, pattern: $FIRST, precedes: {stopBy: end, matches: wrapped-flag, pattern: $SECOND}}
rule:
    any:
        - kind: 'function_item, function_signature_item'
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: parameters, matches: flag-pair}
            - not: {matches: rust-fixed-signature}
        - kind: struct_item
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: body, matches: flag-pair}
            - not: {matches: rust-serde-record}
message: '`$NAME` encodes one choice as `bool` flags `$FIRST` and `$SECOND`'
note: 'Take one enum with a variant per combination the code handles, a flag pair allows combinations no caller means. `&bool` or `Option<bool>` adds a state to each flag. Clippy `fn_params_excessive_bools` and `struct_excessive_bools` report two plain `bool` parameters or fields. A serde struct keeps its `Option<bool>` fields, each absent, `true`, or `false` on the wire'
