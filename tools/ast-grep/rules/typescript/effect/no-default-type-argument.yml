# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    defaulted:
        kind: predefined_type
        regex: '^never$'
        any:
            - nthChild: {position: n+2, ofRule: &type-argument {not: {kind: comment}}}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        kind: nested_type_identifier
                        any:
                            - all: [{has: {field: name, regex: '^Effect$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}}]
                            - all: [{has: {field: name, regex: '^Stream$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Stream$'}}}}}]
                            - all: [{has: {field: name, regex: '^Layer$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Layer$'}}}}}]
                            - all: [{has: {field: name, regex: '^Request$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Request$'}}}}}]
                            - all: [{has: {field: name, regex: '^Result$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Result$'}}}}}]
                            - all: [{has: {field: name, regex: '^Fiber$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Fiber$'}}}}}]
                            - all: [{has: {field: name, regex: '^Deferred$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Deferred$'}}}}}]
                            - all: [{has: {field: name, regex: '^Pool$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Pool$'}}}}}]
                            - all: [{has: {field: name, regex: '^RcRef$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)RcRef$'}}}}}]
                            - all: [{has: {field: name, regex: '^Resource$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Resource$'}}}}}]
                            - all: [{has: {field: name, regex: '^LayerRef$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)LayerRef$'}}}}}]
                            - all: [{has: {field: name, regex: '^(Exit|Success)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Exit$'}}}}}]
                            - all: [{has: {field: name, regex: '^(Queue|Enqueue|Dequeue)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Queue$'}}}}}]
                            - all: [{has: {field: name, regex: '^End$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Sink$'}}}}}]
                            - all: [{has: {field: name, regex: '^(TxQueue|TxEnqueue|TxDequeue)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)TxQueue$'}}}}}]
                            - all: [{has: {field: name, regex: '^TxDeferred$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)TxDeferred$'}}}}}]
                            - all: [{has: {field: name, regex: '^(Decoder|Encoder|ConstraintDecoder|ConstraintEncoder|withDecodingDefault(Type)?(Key)?)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Schema$'}}}}}]
                            - all: [{has: {field: name, regex: '^(AsyncResult|Initial|Success|Failure)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)AsyncResult$'}}}}}]
                            - all: [{has: {field: name, regex: '^(AtomRuntime|PullResult)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Atom$'}}}}}]
                            - all: [{has: {field: name, regex: '^(RpcClient|FromGroup)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)RpcClient$'}}}}}]
                            - all: [{has: {field: name, regex: '^(Client|ForApi)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)HttpApiClient$'}}}}}]
                            - all: [{has: {field: name, regex: '^EntityResource$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)EntityResource$'}}}}}]
                            - all: [{has: {field: name, regex: '^PersistedQueue$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)PersistedQueue$'}}}}}]
                            - all: [{has: {field: name, regex: '^PersistedCache$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)PersistedCache$'}}}}}]
            - nthChild: {position: n+3, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        kind: nested_type_identifier
                        any:
                            - all: [{has: {field: name, regex: '^Cache$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Cache$'}}}}}]
                            - all: [{has: {field: name, regex: '^ScopedCache$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)ScopedCache$'}}}}}]
                            - all: [{has: {field: name, regex: '^RcMap$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)RcMap$'}}}}}]
                            - all: [{has: {field: name, regex: '^LayerMap$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)LayerMap$'}}}}}]
                            - all: [{has: {field: name, regex: '^Schedule$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Schedule$'}}}}}]
                            - all: [{has: {field: name, regex: '^Sink$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Sink$'}}}}}]
                            - all: [{has: {field: name, regex: '^(Codec|ConstraintCodec|decodeTo)$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Schema$'}}}}}]
                            - all: [{has: {field: name, regex: '^Getter$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)SchemaGetter$'}}}}}]
                            - all: [{has: {field: name, regex: '^Transformation$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)SchemaTransformation$'}}}}}]
                            - all: [{has: {field: name, regex: '^AtomResultFn$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Atom$'}}}}}]
                            - all: [{has: {field: name, regex: '^Classifier$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)CircuitBreaker$'}}}}}]
            - nthChild: {position: n+4, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        kind: nested_type_identifier
                        any:
                            - all: [{has: {field: name, regex: '^Pull$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Pull$'}}}}}]
                            - all: [{has: {field: name, regex: '^FilterEffect$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Filter$'}}}}}]
            - nthChild: {position: n+7, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        kind: nested_type_identifier
                        any:
                            - all: [{has: {field: name, regex: '^Channel$'}}, {has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Channel$'}}}}}]
            - nthChild: {position: 2, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        kind: nested_type_identifier
                        all:
                            - has: {field: name, regex: '^Take$'}
                            - has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)Take$'}}}}
rule:
    kind: predefined_type
    all:
        - matches: defaulted
        - nthChild: {position: 1, reverse: true, ofRule: *type-argument}
        - inside: {kind: type_arguments, inside: {kind: generic_type, has: {field: name, pattern: $NAME}}}
fix:
    template: ''
    expandStart:
        stopBy: {kind: comment}
        any:
            - regex: '^,$'
              not: {follows: {matches: defaulted}}
            - matches: defaulted
              follows: {kind: comment}
    expandEnd: {regex: '^,$'}
message: '`$NAME` restates a trailing `never` default'
note: 'Omit each trailing type argument equal to its `never` default'
