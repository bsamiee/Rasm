# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: intersection_type
    pattern: $TYPE
    all:
        - has:
            kind: object_type
            has: {kind: property_signature}
            not: {has: {kind: property_signature, not: {has: {field: name, regex: '^(Type|Encoded|DecodingServices|EncodingServices)$'}}}}
        - has: {matches: {effect-module-type: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^Top$'}}}}
message: '`$TYPE` restates a schema interface through `Schema.Top`'
note: 'Write `Schema.Schema<T>`, `Schema.Decoder<T, RD>` or `Schema.Codec<T, E, RD, RE>`'
