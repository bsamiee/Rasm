# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-distinct-by-index-of
language: tsx
severity: error
utils:
    same-list:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $L}}, {has: {field: property, regex: '^indexOf$'}}]}
            - has: {field: arguments, has: {pattern: $X, nthChild: 1}}
    first-index-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^===?$'}
            - any:
                - all: [{has: {field: left, matches: same-list}}, {has: {field: right, pattern: $I}}]
                - all: [{has: {field: left, pattern: $I}}, {has: {field: right, matches: same-list}}]
    array-import:
        kind: import_statement
        all:
            - has: {field: source, regex: '^["'']effect(/Array)?["'']$'}
            - has:
                stopBy: end
                kind: import_specifier
                all:
                    - has: {field: name, regex: '^Array$'}
                    - has: {kind: identifier, pattern: $ARRAY, nthChild: {position: 1, reverse: true, ofRule: {kind: identifier}}}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $L}}, {has: {field: property, regex: '^filter$'}}]}
        - has:
            field: arguments
            has:
                kind: arrow_function
                all:
                    - has: {field: parameters, all: [{has: {nthChild: 1, has: {kind: identifier, pattern: $X}}}, {has: {nthChild: 2, has: {kind: identifier, pattern: $I}}}]}
                    - has: {field: body, matches: first-index-test}
        - any:
            - pattern: $FIXABLE
              inside: {kind: program, stopBy: end, has: {matches: array-import}}
            - pattern: $KEPT
rewriters:
    - id: dedupe
      rule: {kind: call_expression}
      fix: $ARRAY.dedupe($L)
transform:
    FIXED: rewrite($FIXABLE, rewriters=[dedupe])
fix: $FIXED$KEPT
message: '`$L.filter` keeps the first of each value by a quadratic `indexOf` scan'
note: '`Array.dedupe(<list>)` keeps the first of each value by `Equal`'
