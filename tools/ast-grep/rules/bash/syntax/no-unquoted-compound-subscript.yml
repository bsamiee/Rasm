# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-unquoted-compound-subscript
language: bash
severity: error
rule:
    any:
        # The assignment, expansion, and arithmetic forms, an index joining pieces with a comma, and an index with no comma is
        # an arithmetic index of an indexed array (two expansions in one index parse as ERROR, and no rule reads them)
        - kind: subscript
          pattern: $SUB
          has: {field: index, kind: concatenation, regex: ','}
        # The -v test spells the subscript as words, the name and the bracketed index join into one concatenation
        - kind: concatenation
          pattern: $SUB
          regex: '^[A-Za-z_][A-Za-z0-9_]*\[[^"].*,.*\]$' # An index opening with a quote is the corrected form
          inside: {kind: unary_expression, has: {field: operator, regex: '^-v$'}}
        # The element of a compound assignment, the bracketed index and its value join into one concatenation
        - kind: concatenation
          pattern: $SUB
          regex: '^\[[^"].*,.*\]='
          inside: {kind: array}
transform:
    # The name before the index, the index with its quoted pieces unquoted, and the value after it, the whole index takes one pair
    NAME: replace($SUB, replace='^([A-Za-z_][A-Za-z0-9_]*)?\[[\s\S]*$', by='$1')
    INNER: replace($SUB, replace='^([A-Za-z_][A-Za-z0-9_]*)?\[([\s\S]*?)\](=[\s\S]*)?$', by='$2')
    INDEX: replace($INNER, replace='"', by='')
    VALUE: replace($SUB, replace='^([A-Za-z_][A-Za-z0-9_]*)?\[([\s\S]*?)\](=[\s\S]*)?$', by='$3')
fix: $NAME["$INDEX"]$VALUE
message: 'The subscript of `$SUB` joins words without quotes'
note: 'Quote the whole index, `${<name>["<part>,$<part>"]}`, `<name>["<part>,$<part>"]=`, `(["<part>,$<part>"]=<value>)`, `[[ -v <name>["..."] ]]`'
