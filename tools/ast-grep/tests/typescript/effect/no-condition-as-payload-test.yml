id: no-condition-as-payload
valid:
    # The guarded value is lifted under its condition
    - |
      Option.liftPredicate(value, () => production)
    # A predicate over the value itself
    - |
      Option.liftPredicate(candidate, (held) => held.ready)
    # Elements kept under one condition
    - |
      Array.filter(plugins, () => production)
    # A refinement predicate narrows the payload
    - |
      Option.filter(option, Predicate.isString)
invalid:
    # The instance, a boolean lifted to stand for presence
    - |
      Option.liftPredicate(production, identity)
    # The qualified identity
    - |
      Option.liftPredicate(config.react, Function.identity)
    # The identity spelled as an arrow
    - |
      Option.filter(option, (held) => held)
    # The data-last filter in a pipe
    - |
      Option.some(flag).pipe(Option.filter(identity))
