# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    failure-return:
        matches: {swift-single-statement: {first: {matches: swift-failure-value}}}
rule:
    pattern: $SITE
    any:
        - matches: swift-result-bind-switch
        - kind: if_statement
          regex: '^if\p{White_Space}+case\p{White_Space}+(let\p{White_Space}+)?\.failure(?-u:\b)'
          all: [{has: {matches: swift-result-value, follows: {regex: '^=$'}}}]
          has: {matches: failure-return}
        - kind: if_statement
          regex: '^if\p{White_Space}+case\p{White_Space}+(let\p{White_Space}+)?\.success(?-u:\b)'
          all:
            - has: {matches: swift-result-value, follows: {regex: '^=$'}}
            - not: {has: {regex: '^,$'}}
            - not: {has: {kind: if_statement}}
            - any:
                - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}, matches: failure-return}
                - all:
                    - not: {has: {regex: '^else$'}}
                    - precedes: {kind: control_transfer_statement, has: {field: result, matches: swift-failure-call}}
        - kind: guard_statement
          regex: '^guard\p{White_Space}+case\p{White_Space}+(let\p{White_Space}+)?\.success(?-u:\b)'
          not: {regex: '(?s)^guard\p{White_Space}+case\p{White_Space}+(let\p{White_Space}+)?\.success(?-u:\b)[^,]*,.*(?-u:\b)(case|let|var)(?-u:\b)'}
          has: {matches: failure-return}
          all: [{has: {matches: swift-result-value, follows: {regex: '^=$'}}}]
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` returns a `Result` failure by hand to bind its success value'
note: 'Bind `try <result>.get()` inside one `Result { () throws(<Failure>) in }` body, after `mapError` when its failure arm replaces the error'
