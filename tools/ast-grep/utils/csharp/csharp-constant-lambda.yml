# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-constant-lambda
language: csharplang
arguments: [value]
utils:
    literal:
        any:
            - kind: boolean_literal
            - kind: default_expression
              not: {has: {field: type, not: {pattern: bool}}}
    literal-operand:
        any:
            - matches: literal
            - kind: parenthesized_expression
              has: {matches: literal-operand}
    constant:
        any:
            - matches: literal
              all:
                - matches: value
            - kind: prefix_unary_expression
              all:
                - regex: '^!'
                - has: {matches: literal-operand}
                - has: {stopBy: end, matches: literal, not: {matches: value}}
            - kind: binary_expression
              all:
                - any:
                    - all:
                        - has: {field: operator, regex: '^\|\|$'}
                        - has: {kind: boolean_literal, regex: '^true$', matches: value}
                    - all:
                        - has: {field: operator, regex: '^&&$'}
                        - has: {kind: boolean_literal, regex: '^false$', matches: value}
                - has: {field: left, matches: literal-operand}
                - has: {field: right, matches: literal-operand}
            - kind: parenthesized_expression
              has: {matches: constant}
    result:
        any:
            - matches: constant
            - kind: block
              matches: csharp-single-return
              has: {kind: return_statement, has: {matches: constant}}
    function:
        kind: lambda_expression, anonymous_method_expression
        has: {field: body, matches: result}
rule:
    any:
        - matches: function
        - kind: argument
          has: {matches: function}
          not: {has: {kind: comment}}
