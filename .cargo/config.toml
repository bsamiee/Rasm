# --- [BUILD] ----------------------------------------------------------------------------
[build]
target-dir = ".artifacts/rust"
build-dir = ".cache/rust/build"
warnings = "deny"
rustflags = ["-Zunstable-options", "--jobs-frontend=4"] # Four rustc front-end threads, cold build, clippy, and nextest 15 to 32 percent faster, eight threads gain less beside Cargo's crate-level jobs
fingerprint = "content"                                 # Source freshness by content hash, a formatter or hook rewrite that changes no byte rebuilds nothing
# --- [RESOLVER] -------------------------------------------------------------------------
[resolver]
feature-unification = "workspace"                       # Per-package targets compile each shared dependency once with the workspace's feature set
# --- [UNSTABLE] -------------------------------------------------------------------------
[unstable]
checksum-freshness = true                               # Enables `build.fingerprint`
feature-unification = true                              # Enables `resolver.feature-unification`
