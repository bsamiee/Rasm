# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-backslash-path
language: xml
severity: error
rule:
    kind: AttValue
    regex: |-
        (?x) (?: [A-Za-z]: | \$\([A-Za-z_][A-Za-z0-9_]*\) | @\([A-Za-z_][A-Za-z0-9_]*\) | %\([A-Za-z_][A-Za-z0-9_.]*\) | \.\.? ) \\ [A-Za-z0-9_.*?$@%(-]
        | [A-Za-z0-9_.*?)-] \\ (?: \$\( | @\( | %\( | \.\.? (?: \\ | \s | ["'] | $ ) )
        | [A-Za-z0-9_.*?-]+ \\ [A-Za-z0-9_.*?-]+ (?: \\ [A-Za-z0-9_.*?-]{2,} | \.[A-Za-z0-9]+ (?: \\ | \s | ["'] | $ ) )
        | [A-Za-z0-9_.*?)-] \\ \s*["']?\s*$
    inside:
        kind: Attribute
        any:
            - all:
                - has: {kind: Name, regex: '^Command$'}
                - inside: {matches: msbuild-tag, has: {kind: Name, regex: '^Exec$'}}
            - all:
                - has: {kind: Name, regex: '^Lines$'}
                - inside: {matches: msbuild-tag, has: {kind: Name, regex: '^WriteLinesToFile$'}}
message: Backslash path separator reaches the shell or the written file as text, MSBuild converts separators in properties and items alone
note: Write `/`, every operating system reads it
