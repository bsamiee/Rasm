# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-indirect-palette-read
language: python
severity: error
files: ['tools/interface/**']
utils:
    palette-class:
        any:
            - kind: identifier
              regex: '^Palette$'
              not: {inside: {kind: attribute, field: attribute}}
            - kind: attribute
              has: {field: attribute, regex: '^Palette$'}
            - kind: string_content
              regex: '^Palette(\.|$)'
              not: {regex: '^Palette\.[A-Z]+\[\d+\]$'}
    named-step-read:
        inside: {kind: attribute, field: object, has: {field: attribute, regex: '^[A-Z]+$'}, inside: {kind: subscript, field: value, has: {field: subscript, kind: integer}}}
    declared:
        any:
            - inside: {kind: class_definition, field: name}
            - inside: {kind: assignment, stopBy: end, has: {field: left, regex: '^__all__$'}}
rule:
    pattern: $READ
    matches: palette-class
    not: {any: [{kind: identifier, matches: named-step-read}, {matches: declared}]}
message: '`$READ` reads `Palette` without naming a step'
note: 'Read the step as `Palette.<FAMILY>[<step>]`, each read names the shade its role takes'
