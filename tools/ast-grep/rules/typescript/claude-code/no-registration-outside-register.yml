# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-registration-outside-register
language: tsx
severity: error
files:
    - '**/.claude/plugins/**'
utils:
    plain-registration:
        kind: expression_statement
        has:
            matches: claude-code-registration
            pattern: $_($_, $_)
            has:
                field: arguments
                has:
                    kind: string, template_string
                    has: {kind: string_fragment, pattern: $EV}
                    not: {has: {kind: 'escape_sequence, template_substitution'}}
rule:
    any:
        - {matches: claude-code-registration, inside: {stopBy: end, matches: claude-code-hook}}
        - {matches: plain-registration, follows: {stopBy: end, matches: plain-registration}}
    pattern: $MATCH
message: The registration runs outside `register` or repeats a plain hook on one event, and the loader refuses the module
note: Register each event once in `register` through `on('<event>', hook)`, and give a second hook on the same event a matcher
labels: {MATCH: {style: primary}}
