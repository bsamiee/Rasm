# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-itertools-chain
language: python
severity: error
rule:
    kind: call
    pattern: $CALL
    has:
        field: function
        any:
            - matches: python-chain-callee
            - kind: attribute
              all:
                - has: {field: object, matches: python-chain-callee}
                - has: {field: attribute, regex: "^from_iterable$"}
message: "`$CALL` concatenates iterables through a chain object an unpacking comprehension writes in place"
note: Flatten with `[*part for part in (<a>, <b>)]`, `{*...}` for a set, or `(*...)` for lazy iteration, over the chain arguments in their order
