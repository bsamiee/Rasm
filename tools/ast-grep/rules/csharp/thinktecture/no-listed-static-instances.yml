# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
utils:
    own-field:
        kind: identifier
        pattern: $ITEM
        inside:
            kind: declaration_list
            stopBy: end
            has:
                kind: field_declaration
                all:
                    - has: {kind: modifier, regex: '^static$'}
                    - has: {kind: modifier, regex: '^readonly$'}
                    - has: {kind: variable_declaration, all: [{has: {field: type, pattern: $TYPE}}, {has: {kind: variable_declarator, has: {field: name, pattern: $ITEM}}}]}
    own-instance:
        kind: 'collection_element, argument'
        any:
            - has: {kind: expression_element, has: {matches: own-field}}
            - has: {matches: own-field}
    instance-list:
        any:
            - kind: collection_expression
            - kind: argument_list
              inside: {kind: invocation_expression, matches: {csharp-named-call: {name: {regex: '^(Seq|toSeq|Arr|Lst|Set|HashSet|Array|List)$'}}}}
rule:
    all:
        - matches: instance-list
        - has: {kind: 'collection_element, argument', nthChild: 2}
        - inside:
            kind: declaration_list
            stopBy: {kind: declaration_list}
            inside:
                kind: 'record_declaration, class_declaration'
                has: {field: name, pattern: $TYPE}
                not: {matches: {csharp-attributed: {name: {regex: '^SmartEnum(Attribute)?$'}}}}
        - not: {has: {kind: 'collection_element, argument', not: {matches: own-instance}}}
message: '`$TYPE` lists its own static instances by hand'
note: 'Declare `<type>` a `[SmartEnum]` and read its generated `Items`'
