name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    MISE_ENV: ci

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - id: setup
              uses: ./.github/actions/setup
            - run: umask 077 && printf %s "$KEY" > "$RUNNER_TEMP/sixlabors.lic" && printf 'SixLaborsLicenseFile=%s/sixlabors.lic\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              env:
                KEY: ${{ secrets.SIXLABORSLICENSEKEY }}
            - run: nx run-many -t typecheck:clippy lint:dylint --projects=rasm
            - if: ${{ !cancelled() }}
              run: nx affected -t check test:integration e2e --configuration ci --exclude='rasm,tag:host:macos,tag:host:rhino,tag:host:claude,tag:host:blender'
            - uses: actions/cache/save@v6
              if: ${{ always() && steps.setup.outcome == 'success' && github.event_name == 'push' }}
              with:
                path: ${{ steps.setup.outputs.task-paths }}
                key: ${{ steps.setup.outputs.task-key }}
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                name: diagnostics-${{ github.job }}
                path: |
                    .artifacts/dotnet/binlog
                    .artifacts/typescript/vitest
                    .artifacts/typescript/playwright
                include-hidden-files: true
                retention-days: 14

    macos:
        runs-on: xcode-27
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - id: setup
              uses: ./.github/actions/setup
            - uses: mcneel/setup-rhino3d@v3.0.0
              with:
                email-address: b.samiee93@gmail.com
                release-version: wip
            - run: umask 077 && printf %s "$KEY" > "$RUNNER_TEMP/sixlabors.lic" && printf 'SixLaborsLicenseFile=%s/sixlabors.lic\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              env:
                KEY: ${{ secrets.SIXLABORSLICENSEKEY }}
            - run: nx run rasm:check
            - if: ${{ !cancelled() }}
              run: nx affected -t check --exclude='!tag:host:macos,!tag:host:rhino' --configuration ci
            - uses: actions/cache/save@v6
              if: ${{ always() && steps.setup.outcome == 'success' && github.event_name == 'push' }}
              with:
                path: ${{ steps.setup.outputs.task-paths }}
                key: ${{ steps.setup.outputs.task-key }}
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                name: diagnostics-${{ github.job }}
                path: |
                    .artifacts/dotnet/binlog
                    .artifacts/typescript/vitest
                include-hidden-files: true
                retention-days: 14
