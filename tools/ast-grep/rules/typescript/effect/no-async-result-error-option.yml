# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-async-result-error-option
language: tsx
severity: error
utils:
    option-render:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bOption$'}, member: {regex: '^(match|isSome|isNone|map|getOrNull|getOrUndefined|getOrElse)$'}}}}
            - any:
                - inside: {kind: jsx_expression, stopBy: {matches: typescript-function-boundary}}
                - has: {field: arguments, has: {stopBy: end, kind: 'jsx_element, jsx_self_closing_element'}}
    piped-render:
        any:
            - inside:
                kind: member_expression
                field: object
                has: {field: property, regex: '^pipe$'}
                inside: {kind: call_expression, field: function, has: {field: arguments, has: {matches: option-render}}}
            - nthChild: 1
              inside:
                kind: arguments
                has: {matches: option-render}
                inside: {kind: call_expression, has: {field: function, regex: '^pipe$'}}
rule:
    kind: call_expression
    pattern: $ERROR
    all:
        - has: {field: function, matches: {effect-module-member: {module: {regex: '\bAsyncResult$'}, member: {regex: '^error$'}}}}
        - has: {field: arguments, has: {nthChild: 1, pattern: $RESULT}}
        - any:
            - inside: {kind: arguments, inside: {matches: option-render}}
            - matches: piped-render
            - inside:
                kind: variable_declarator
                all:
                    - has: {field: name, kind: identifier, pattern: $NAME}
                    - inside:
                        stopBy: {matches: typescript-function-boundary}
                        matches: typescript-function-boundary
                        has:
                            stopBy: end
                            kind: identifier
                            pattern: $NAME
                            any:
                                - nthChild: 1
                                  inside: {kind: arguments, inside: {matches: option-render}}
                                - matches: piped-render
message: '`$ERROR` reads the failure of `$RESULT` into an `Option` to render it'
note: 'Render through `AsyncResult.builder(<result>).onError((error) => <element>).orNull()`, with `onWaiting`, `onSuccess`, or `onDefect` per state'
