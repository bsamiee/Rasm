# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-function-bash
language: bash
severity: error
utils:
    positional-parameter: {kind: string, regex: '^"\$(@|[1-9]|\{(@|[1-9])\})"$'}
    literal:
        any:
            - kind: command_name, word, raw_string
            - kind: string
              not: {has: {kind: 'simple_expansion, expansion, command_substitution, arithmetic_expansion'}}
            - matches: positional-parameter
rule:
    kind: function_definition
    not: {has: {field: redirect, pattern: $$_REDIRECT}}
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            field: body
            kind: compound_statement, subshell
            not:
                any:
                    - has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}
                    - has: {regex: '^&$'}
            has:
                kind: command
                pattern: $CALL
                all:
                    - has: {field: name, regex: '^[A-Za-z0-9_./-]+$'}
                    - not: {matches: bash-program-lookup}
                    - has: {matches: positional-parameter}
                    - not: {has: {not: {matches: literal}}}
                    - not: {has: {matches: positional-parameter, follows: {matches: positional-parameter, stopBy: end}}}
message: '`$NAME` forwards its arguments unchanged to `$CALL`'
note: Call `<command> <words>` at each call site and move each fixed option the tool reads from configuration into its configuration file
