# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: <before>-to-<after>
language: <language>
severity: off
rule:
    all:
        - pattern: <code capturing $$$ITEMS>
        - has: {field: <list-field>, kind: <list-kind>, pattern: $LIST}
        - not: {pattern: <unsupported variant>}
rewriters:
    - id: <rewriter-id>
      rule:
        kind: <kind>
        pattern: '$ITEM'
        inside: {kind: <list-kind>, pattern: $LIST}
      constraints:
        ITEM: {regex: "<name-pattern>"}
      transform:
        LOCAL: <op>($ITEM, <key>=<value>)
      fix: <per-item template referencing $ITEM and $LOCAL>
transform:
    OUT:
        rewrite:
            source: $$$ITEMS
            rewriters: [<rewriter-id>]
            joinBy: "<separator>"
fix: <template referencing $OUT>
message: <the construct being replaced>
note: <the required form and its reason>
