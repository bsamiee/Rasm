syntax = "proto3";

package rasm.contracts.cad.v1;

import "buf/validate/validate.proto";
import "rasm/contracts/artifact/v1/artifact.proto";
import "rasm/contracts/cad/v1/operations.proto";
import "rasm/contracts/cad/v1/types.proto";
import "rasm/contracts/geometry/v1/tessellation.proto";

message TessellateRequest {
  oneof source {
    option (buf.validate.oneof).required = true;

    SealedStep step = 1;
    rasm.contracts.artifact.v1.ArtifactRef iges = 2;
  }
  rasm.contracts.geometry.v1.TessellationPolicy policy = 3 [(buf.validate.field).required = true];
}

service CadService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc Tessellate(TessellateRequest) returns (TessellateResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
