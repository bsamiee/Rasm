    "pandas",                                                                     # Tabular dataframes
    "pandera",                                                                    # Schema and quality-rule contracts
    "pointblank",                                                                 # Graded data-quality reports above pass/fail checks
    "polars",                                                                     # Dataframe engine
    "sqlglot",                                                                    # SQL parser, transpiler, optimizer, and lineage engine
    "substrait[extensions]",                                                      # Typed Substrait plan IR with extension registry and validator
