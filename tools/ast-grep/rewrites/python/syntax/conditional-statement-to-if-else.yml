# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: conditional-statement-to-if-else
language: python
severity: off
rule:
    kind: expression_statement
    pattern: $STMT
    matches: {python-discarded-expression: {value: {pattern: $EFFECT if $TEST else $OTHER}}}
constraints:
    OTHER: {not: {kind: none}} # The None arm is the shape of conditional-statement-to-if
    STMT: {not: {regex: '\n'}} # Statement on one line, the parenthesized multi-line form re-indents the else past the if
rewriters:
    - id: if-else-statement
      rule: {kind: conditional_expression, pattern: $EFFECT if $TEST else $OTHER}
      fix: |-
          if $TEST:
              $EFFECT
          else:
              $OTHER
transform:
    OUT: rewrite($STMT, rewriters=[if-else-statement], joinBy='')
fix: $OUT
message: Conditional expression as a statement runs an effect in each arm and drops the values
note: Write the `if` statement with an `else:`, one effect in each body
