# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-throwing-factory
language: csharplang
utils:
    total-factory-owner:
        matches: {csharp-type-name: {name: {regex: '^@?(KeyValuePair|Tuple|ValueTuple|String|Immutable[A-Z]\w*|Frozen[A-Z]\w*)$'}}}
    converter-owner:
        matches: {csharp-type-name: {name: {regex: '^@?(Convert|BitConverter|XmlConvert)$'}}}
rule:
    kind: member_access_expression
    any:
        - all:
            - has:
                field: expression
                regex: '^@?((global::)?[A-Z]|(bool|byte|sbyte|char|short|ushort|int|uint|long|ulong|float|double|decimal)$)'
                not: {matches: total-factory-owner}
            - has: {field: name, regex: '^(Create|Parse|ParseExact|Get)(<.+>)?$'}
        - all:
            - has: {field: expression, matches: converter-owner}
            - has: {field: name, regex: '^To[A-Z]\w*$'}
