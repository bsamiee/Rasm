# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "mcp-muxer-tests"
edition.workspace = true

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[bin]]
name = "mcp-fixture"
path = "fixture.rs"
test = false

[[test]]
name = "muxer"
path = "muxer.rs"

[[test]]
name = "load"
path = "load.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures      = { workspace = true }
tokio        = { workspace = true, features = ["io-std"] }
tokio-util   = { workspace = true }
sysinfo      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
schemars     = { workspace = true }
jiff         = { workspace = true }
tempfile     = { workspace = true }
rmcp         = { workspace = true, features = ["client", "server", "macros", "elicitation", "transport-io", "transport-child-process"] }
clap         = { workspace = true }
escargot     = { workspace = true }
hdrhistogram = { workspace = true }

[dev-dependencies]
claims = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
