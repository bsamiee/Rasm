# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
rule:
    kind: member_modifier
    regex: '^nonisolated[\t-\r ]*\([\t-\r ]*unsafe[\t-\r ]*\)$'
    inside: {kind: property_declaration, stopBy: {kind: 'property_declaration, class_declaration, function_declaration, init_declaration, subscript_declaration'}, has: {kind: pattern, pattern: $NAME}}
message: '`nonisolated(unsafe)` exempts `$NAME` from data-race checking'
note: 'Hold the state in `Mutex`, `Atomic`, or actor-isolated storage, or hand a non-Sendable value across isolation as a `sending` parameter or result'
