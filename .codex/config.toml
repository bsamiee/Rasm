approval_policy = "never"
sandbox_mode    = "danger-full-access"

agents = { max_concurrent_threads_per_session = 30 }
apps   = { _default = { default_tools_approval_mode = "approve" } }
notice = { hide_full_access_warning = true }

[mcp_servers]
atelier  = { default_tools_approval_mode = "approve", url = "http://localhost:7490/" }
voicebox = { default_tools_approval_mode = "approve", url = "http://127.0.0.1:17493/mcp/", http_headers = { X-Voicebox-Client-Id = "codex" } }

[mcp_servers.illustrator]
url                 = "http://localhost:18412/v1/mcp"
http_headers_helper = '''prefs=$(jq -r --arg version "$(watch-app find com.adobe.illustratorBeta | jq -r 'first(.[][]).version')" 'select(has($version)) | input_filename | sub("\\.runConfig$"; "Adobe Illustrator Prefs")' "$HOME"/Library/Preferences/Adobe\ Illustrator*Settings/*/.runConfig) && rg -o '/AuthToken \[ [0-9]+[[:space:]]+([0-9a-f[:space:]]+)\]' -r '$1' "$prefs" | tr -d ' \t\n' | xxd -r -p | jq -R '{Authorization: "Bearer \(.)"}' '''

[hooks]
SessionStart = [{ hooks = [{ type = "command", command = "mise daemons register && mise exec -- pitchfork project enter --pid \"$PPID\"" }] }]
PreToolUse   = [{ matcher = "^Bash$", hooks = [{ type = "command", command = "mise exec -- node \"$(git rev-parse --show-toplevel)/plugins/claude/function-hooks/hook.ts\" codex", timeout = 30 }] }]

[plugins]
"blender@rasm"       = { enabled = true }
"dotnet@rasm"        = { enabled = true }
"msbuild@rasm"       = { enabled = true }
"python@rasm"        = { enabled = true }
"uxp@rasm"           = { enabled = true }
"orchestration@rasm" = { enabled = true }
"swift@rasm"         = { enabled = true }
"search@rasm"        = { enabled = true }
"rhino@rasm"         = { enabled = true }
"typescript@rasm"    = { enabled = true }
"rust@rasm"          = { enabled = true }
"cpp@rasm"           = { enabled = true }
"delegate@rasm"      = { enabled = true }
"web@rasm"           = { enabled = true }
"tool@rasm"          = { enabled = true }

[marketplaces]
rasm = { source = "./", source_type = "local" }
