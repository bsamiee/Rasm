# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-normal-sample-by-hand
language: rust
severity: error
utils:
    two:
        regex: '^-\s*2(\.0*)?(_?f(32|64))?$'
    log:
        kind: call_expression
        has: {field: function, kind: field_expression, has: {field: field, regex: '^ln$'}}
    angle:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(cos|sin|sin_cos)$'}}
            - has: {field: function, has: {field: value, has: {stopBy: end, kind: 'identifier, scoped_identifier', regex: '(^|::)(PI|TAU)$'}}}
    angle-value:
        any:
            - matches: angle
            - kind: identifier
              pattern: $COSINE
              inside:
                kind: function_item
                stopBy: end
                has:
                    stopBy: end
                    kind: let_declaration
                    all:
                        - has: {field: pattern, any: [{pattern: $COSINE}, {kind: tuple_pattern, has: {pattern: $COSINE}}]}
                        - has: {field: value, matches: angle}
    product:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\*$'}
            - has: {matches: angle-value}
rule:
    kind: call_expression
    pattern: $RADIUS
    all:
        - has: {field: function, kind: field_expression, has: {field: field, regex: '^sqrt$'}}
        - has:
            field: function
            has:
                field: value
                kind: parenthesized_expression
                has:
                    kind: binary_expression
                    all:
                        - has: {field: operator, regex: '^\*$'}
                        - any:
                            - all: [{has: {field: left, kind: unary_expression, matches: two}}, {has: {field: right, matches: log}}]
                            - all: [{has: {field: left, matches: log}}, {has: {field: right, kind: unary_expression, matches: two}}]
        - any:
            - inside: {matches: product}
            - inside:
                kind: let_declaration
                all:
                    - has: {field: pattern, kind: identifier, pattern: $RADIAL}
                    - inside: {kind: function_item, stopBy: end, has: {stopBy: end, matches: product, has: {pattern: $RADIAL}}}
message: '`$RADIUS` draws a normal sample through a Box-Muller transform by hand'
note: 'Sample through rand: `rng.sample::<f64, _>(rand_distr::StandardNormal)` for the standard normal or `rand_distr::Normal::new(mean, std_dev)?.sample(&mut rng)` for a scaled one. Each distribution draws uniforms from the passed generator'
