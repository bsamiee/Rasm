[project]
name = "workspace-foundation-python"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    # --- [GENERAL]
    "anyio",
    "apscheduler",                                        # [RUNTIME]: cron, interval, and date triggers
    "azure-identity",                                     # [RUNTIME]: TokenCredential chain (DefaultAzureCredential) backing the Azure Key Vault SecretTier.cloud arm
    "azure-keyvault-secrets",                             # [RUNTIME]: Azure Key Vault secret backend closing the SecretTier.cloud provider family beside the GCP and Vault arms
    "beartype",
    "cloudpickle",                                        # [RUNTIME]: kernel and closure shipping across the worker process/subinterpreter seams
    "cryptography",                                       # [RUNTIME]: AES-GCM envelope and key-wrap primitives behind the journal's per-subject crypto-shredding
    "cyclopts",
    "expression",
    "google-cloud-secret-manager",                        # [RUNTIME]: cloud secret backend for SecretTier.cloud admission
    "google-crc32c",                                      # [RUNTIME]: SecretPayload.data_crc32c integrity digest for the admission cloud arm
    "hvac",                                               # [RUNTIME]: HashiCorp Vault secret backend closing the SecretTier.cloud provider family beside the GCP arm
    "jinja2",                                             # [ARTIFACTS]: report templating between visual and document outputs
    "keyring",                                            # [RUNTIME]: OS keychain credential boundary
    "lark",                                               # [RUNTIME]+[GEOMETRY]: CESQL filter grammar beside the IDS and selector grammar
    "loky",                                               # [RUNTIME]: warm reusable crash-respawning process pool for the worker crossing
    "lxml",                                               # [ARTIFACTS]: XML processing
    "msgspec",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-grpc",             # [RUNTIME]: daemon-selectable OTLP gRPC egress row beside the proto-http default
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-asgi",                 # [RUNTIME]: ASGI middleware emitting server spans and extracting W3C context on every Connect request
    "opentelemetry-instrumentation-asyncio",              # [RUNTIME]: coroutine/to_thread/future trace-context propagation for the worker crossing
    "opentelemetry-instrumentation-dbapi",                # [RUNTIME]: generic PEP-249 wrap seam for drivers without a dedicated instrumentor (duckdb, ADBC DBAPI)
    "opentelemetry-instrumentation-httpx",                # [TRANSPORT]: httpx client spans carrying W3C trace context
    "opentelemetry-instrumentation-jinja2",               # [RUNTIME]: jinja2 template render spans, composed by the runtime instrumentor train
    "opentelemetry-instrumentation-psycopg",              # [RUNTIME]: psycopg v3 DBAPI spans, composed by the runtime instrumentor train
    "opentelemetry-instrumentation-sqlite3",              # [RUNTIME]: stdlib sqlite3 DBAPI spans, composed by the runtime instrumentor train
    "opentelemetry-instrumentation-system-metrics",       # [RUNTIME]: host and process gauges over psutil
    "opentelemetry-instrumentation-threading",            # [RUNTIME]: cross-thread trace-context propagation
    "opentelemetry-processor-baggage",                    # [RUNTIME]: baggage-to-span-attribute promotion for the tenant dimension
    "opentelemetry-resource-detector-containerid",        # [RUNTIME]: container.id resource detector for containerized daemon identity
    "opentelemetry-sdk",
    "opentelemetry-semantic-conventions",                 # [RUNTIME]: Schemas roster the one branch schema-url pin reads, so a semconv bump moves the pin
    "pebble",                                             # [RUNTIME]: terminal-deadline worker kill and per-worker task recycling
    "psutil",
    "pydantic",
    "pyroscope-io",                                       # [RUNTIME]: continuous-profiling agent feeding the pyroscope-otel span-link rail
    "pyroscope-otel",                                     # [RUNTIME]: continuous-profiling span links beside the OTLP rails
    "pydantic-settings",
    "ruamel-yaml",
    "stamina",
    "structlog",
    "tblib",                                              # [RUNTIME]: cross-process traceback fidelity for worker faults
    "tomlkit",
    "tree-sitter<0.26",                                   # [TOOLING]: 0.26.0 Node ancestor-traversal use-after-free segfaults the assay TSDECL rail (py-tree-sitter #472)
    "tree-sitter-python",
    "tree-sitter-typescript",
    "trio",                                               # [TESTKIT]: trio anyio backend for the deterministic-test-kit doubles
    "wasmtime",                                           # [RUNTIME]: in-process WASM guest sandbox for the SANDBOXED worker kind
    "watchfiles",
    "xxhash",                                             # [RUNTIME]: content identity hashes matching C# System.IO.Hashing
    # --- [IO_TRANSPORT]
    "asyncssh",                                           # [RUNTIME]: fleet SSH channel for the remote worker arm and SFTP artifact reads
    "brotli",                                             # [ARTIFACTS]: compression
    "cloudevents",                                        # [ARTIFACTS]: CloudEvents envelope and the HTTP/Kafka/AMQP/MQTT binding set carrying the W3C trace-and-baggage extensions
    "confluent-kafka[schemaregistry,avro,json,protobuf]", # [RUNTIME]: librdkafka producer/consumer and the Schema Registry client with its Avro, JSON, and Protobuf serializers; the json-fast extra stays out because orjson compiles against pre-3.15 CPython internals
    "connectrpc",                                         # [RUNTIME]: Connect-Python — generated async service ABCs, ASGI applications, and typed clients speaking Connect, gRPC, and gRPC-Web over one HTTP seam
    "detools",                                            # [ARTIFACTS]: binary-delta engine
    "fastavro",                                           # [RUNTIME]: Avro codec under the Schema Registry serializer and the `parse_schema` validator the branch reads `.avsc` documents through
    "fsspec",                                             # [TRANSPORT]: UPath-shared filesystem resolution and blocking-read offload for roots
    "hishel[httpx]",                                      # [TRANSPORT]: RFC-9111 HTTP cache layer over the httpx transport legs with a persistent sqlite store
    "httpx",                                              # [TRANSPORT]: approved HTTP client surface for typed adapters
    "hypercorn",                                          # [RUNTIME]: ASGI server binding HTTP/2 and h2c the Connect serve rail needs for gRPC and bidi streams; TCP and UNIX-socket binds
    "jsonschema",                                         # [RUNTIME]: validates a payload against a fetched JSON Schema document, the direction `msgspec.json.schema` emission cannot answer
    "lz4",                                                # [ARTIFACTS]: compression
    "nats-py",                                            # [RUNTIME]: NATS core and JetStream client for the subject-addressed transport arm
    "obspec-utils",                                       # [DATA]: multi-store ObjectStoreRegistry companion to obstore
    "obstore",                                            # [DATA]: object-store backend
    "paho-mqtt",                                          # [RUNTIME]: MQTT client for the telemetry and edge-device transport arm
    "pika",                                               # [RUNTIME]: blocking AMQP 0-9-1 client riding the `to_thread` arm, importing no asyncio
    "protobuf",                                           # [DATA]+[COMPUTE]: google-protobuf message runtime beneath the Substrait plan IR and the ONNX model IR; the estate wire runtime is protobuf-py
    "protobuf-py",                                        # [RUNTIME]: Buf protobuf runtime under the generated `_pb.py` bindings — binary, JSON, and descriptor surface for the estate wire
    "py7zr",
    "python-dateutil",                                    # [ARTIFACTS]: RFC-3339 `isoparse` the `cloudevents.core.bindings` and format modules import at module scope
    "stream-unzip",                                       # [ARTIFACTS]: bounded-memory streaming unzip inverse for stream-zip
    "stream-zip",                                         # [ARTIFACTS]: bounded-memory streaming zip with ZIP64/AES-256
    "universal-pathlib",                                  # [TRANSPORT]: UPath storage_options/protocol resolution over the fsspec registry; compute experiments/model UPath consumer
    "zlib-ng",                                            # [ARTIFACTS]: zlib-ng/gzip-ng accelerated compression beside zstandard/lz4/brotli
    "zstandard",                                          # [TOOLING]: zstd compression for tools.assay logging and cache payloads
    # --- [NUMERICS_SOLVERS]
    "array-api-compat",                                   # [COMPUTE]: array API portability shim
    "array-api-extra",                                    # [COMPUTE]: supplemental array API helpers
    "clarabel",                                           # [COMPUTE]: Clarabel conic solver and cvxpy backend
    "cvxpy<1.9",                                          # [COMPUTE]: disciplined convex optimization; 1.9 pulls sparsediffpy whose OpenMP CMake build fails (no cp315 wheel)
    "diffrax; python_version<'3.15'",                     # [COMPUTE]: JAX differential-equation solvers
    "equinox; python_version<'3.15'",                     # [COMPUTE]: JAX PyTree modules
    "findiff",                                            # [COMPUTE]: finite-difference operators for solvers and sensitivity
    "gmsh",                                               # [COMPUTE]: 1/2/3-D unstructured mesh generation with physical groups feeding scikit-fem assembly and the meshio round-trip
    "highspy",                                            # [COMPUTE]: HiGHS LP/MIP/QP simplex + interior-point solver; cvxpy backend beside the Clarabel/SCS conic arms
    "interpax; python_version<'3.15'",                    # [COMPUTE]: JAX interpolation and splines
    "jax; python_version<'3.15'",                         # [COMPUTE]: XLA accelerator; jax is pure-Python and the marker gates its mandatory jaxlib pin, which ships no cp315 wheel and no sdist at any release
    "jaxtyping",                                          # [COMPUTE]: array/PyTree shape-and-dtype contracts, jaxtyped(typechecker=beartype); jax-free at import
    "lineax; python_version<'3.15'",                      # [COMPUTE]: JAX linear solvers
    "mpmath",                                             # [COMPUTE]: arbitrary-precision real and complex math
    "numba; python_version<'3.15'",                       # [COMPUTE]: LLVM JIT accelerator; setup.py refuses cp315
    "numpy",                                              # [COMPUTE]: array substrate
    "optax; python_version<'3.15'",                       # [COMPUTE]: first-order JAX optimizers for optimistix
    "optimistix; python_version<'3.15'",                  # [COMPUTE]: JAX nonlinear solvers and adjoint VJP
    "pint",                                               # [COMPUTE]: unit registry and quantity arithmetic
    "python-flint",                                       # [COMPUTE]: Arb interval numerics
    "pywavelets",                                         # [COMPUTE]: discrete and continuous wavelet transforms
    "quadax; python_version<'3.15'",                      # [COMPUTE]: JAX adaptive quadrature
    "scikit-fem",                                         # [COMPUTE]: FEM assembly
    "scipy",                                              # [COMPUTE]: numerical algorithms
    "scs",                                                # [COMPUTE]: SCS first-order operator-splitting conic solver beside Clarabel; cvxpy SCS backend
    "sectionproperties",                                  # [GEOMETRY]: cross-section property solver enrichment
    "sparse; python_version<'3.15'",                      # [COMPUTE]: sparse n-D arrays; hard numba dep
    "sympy",                                              # [COMPUTE]: symbolic expressions beside the python-flint/mpmath ground domains
    "uncertainties",                                      # [COMPUTE]: first-order error propagation with correlated_values/unumpy
    # --- [STATISTICS_ML]
    "arviz<1",                                            # [COMPUTE]: Bayesian diagnostics; pymc 5.x caps arviz<1 and the pymc 6 line that admits arviz 1 hard-requires pytensor 3
    "blackjax; python_version<'3.15'",                    # [COMPUTE]: JAX NUTS/HMC samplers
    "numpyro; python_version<'3.15'",                     # [COMPUTE]: JAX NUTS sampler
    "nutpie",                                             # [COMPUTE]: Rust NUTS sampler for PyMC
    "onnx",                                               # [COMPUTE]: model graph IR
    "onnxruntime; python_version<'3.15'",                 # [COMPUTE]: model runtime; wheels cap at cp314 and the project ships no sdist
    "pyDOE3",                                             # [COMPUTE]: classical DOE design matrices — factorial, fractional-factorial, Box-Behnken, central-composite, Plackett-Burman, and GSD response-surface designs beside the SALib samplers and scipy.qmc floors
    "pymc<6",                                             # [COMPUTE]: probabilistic programming; every pytensor past 2.35.1 hard-requires numba, so the 5.26 line is the ceiling
    "salib",                                              # [COMPUTE]: global sensitivity analysis
    "scikit-learn",                                       # [COMPUTE]: classical ML and ONNX export
    "skl2onnx",                                           # [COMPUTE]: sklearn-to-ONNX converter
    # --- [DATAFRAMES_QUERY]
    "connectorx; python_version<'3.15'",                  # [DATA]: SQL-to-Arrow loader; wheels cap at cp314 and the project ships no sdist
    "cubed",                                              # [DATA]: bounded-memory distributed arrays
    "daft",                                               # [DATA]: distributed and streaming out-of-core engine
    "dask",                                               # [DATA_COMPUTE]: out-of-core arrays and dataframes; passive array_namespace backend
    "dataframely",                                        # [DATA]: polars-native declarative column rules with FailureInfo partition reporting
    "datafusion",                                         # [DATA]: federation and streaming engine with Substrait plan interchange
    "duckdb",                                             # [DATA]: analytical SQL engine
    "fastexcel",                                          # [DATA]: calamine Rust Arrow Excel reader
    "ibis-framework",                                     # [DATA]: backend-agnostic SQL-expression IR
    "narwhals",                                           # [DATA_COMPUTE]: dataframe-agnostic API; the compute DOE-frame lens
    "pandas",                                             # [DATA]: dataframe substrate
    "pandera",                                            # [DATA]: schema and quality-rule contracts
    "pointblank",                                         # [DATA]: graded data-quality observability tier above pass/fail checks
    "polars",                                             # [DATA]: dataframe engine
    "sqlglot",                                            # [DATA]: SQL parser, transpiler, optimizer, and lineage engine
    "substrait[extensions]",                              # [DATA]: typed Substrait plan IR — protobuf Plan model, extension registry, and validator gating Persistence plan bytes pre-execution
    # --- [ARROW_LAKEHOUSE]
    "adbc-driver-flightsql",                              # [DATA]: Arrow Flight SQL distributed remote driver
    "adbc-driver-manager",                                # [DATA]: ADBC driver manager for Arrow Flight SQL and DuckDB
    "adbc-driver-postgresql",                             # [DATA]: native ADBC PostgreSQL driver — bulk COPY ingest and partitioned Arrow reads
    "adbc-driver-snowflake",                              # [DATA]: native ADBC Snowflake driver — cloud warehouse federation, result-chunk partitioning, and Arrow bulk ingest
    "adbc-driver-sqlite",                                 # [DATA]: native ADBC SQLite driver — local-file federation and in-memory Arrow ingest
    "arro3-compute",                                      # [DATA]: Arrow compute kernels — closes the pa.table re-import hop on the materialize CDF path
    "arro3-core",                                         # [DATA]: Arrow core bridge
    "arro3-io",                                           # [DATA]: pyarrow-free Arrow IPC/Parquet/CSV/JSON/NDJSON readers-writers — the slim carrier-leg codec over the arro3.core memory model
    "deltalake",                                          # [DATA]: lakehouse tables
    "nanoarrow",                                          # [DATA]: Arrow C Data Interface interop
    "pyarrow<24",                                         # [DATA]: Arrow C++ bridge; ceiling tracks the Forge arrow-cpp major
    "pyiceberg",                                          # [DATA]: Apache Iceberg tables
    "pylance",                                            # [DATA]: Lance columnar/vector format
    # --- [ARRAY_STORES]
    "awkward",                                            # [DATA]: ragged arrays
    "flox",                                               # [DATA]: vectorized and parallel grouped reductions for xarray
    "h5netcdf",                                           # [DATA]: pure-h5py netCDF-4 engine for FieldEngine.H5NETCDF
    "h5py",                                               # [DATA]: HDF5 arrays
    "icechunk",                                           # [DATA]: versioned tensor store
    "netcdf4",                                            # [DATA]: CFD and field IO
    "numcodecs",                                          # [DATA]: zarr v3 filter and compressor codec registry
    "tensorstore; python_version<'3.15'",                 # [DATA]: high-throughput async zarr-v3 reader; wheels cap at cp314 and the sdist needs bazel, absent from the Forge lane
    "virtualizarr",                                       # [DATA]: archival reference aggregation into virtual Zarr
    "xarray",                                             # [DATA_COMPUTE]: labelled field datasets; the compute DataTree/labelled-array arms
    "zarr",                                               # [DATA]: chunked n-D arrays
    # --- [GEOSPATIAL]
    "geoarrow-pyarrow",                                   # [DATA]: pyarrow-native GeoArrow ExtensionType registration and geopandas/pandas ExtensionDtype interop bridge
    "geoarrow-rust-compute",                              # [DATA]: GeoRust operations on GeoArrow memory
    "geoarrow-rust-core",                                 # [DATA]: GeoArrow geometry array memory model under the GeoRust compute kernels
    "geoarrow-rust-io",                                   # [DATA]: GeoArrow-native FlatGeobuf/GeoParquet/shapefile/GeoJSON readers-writers, the GDAL-free fast path
    "geopandas",                                          # [DATA]: geospatial frames
    "h3ronpy",                                            # [DATA]: Arrow-native H3 cell ops on polars frames
    "kiss-matcher; python_version<'3.15'",                # [GEOMETRY]: global point-cloud registration; wheels cap at cp312
    "laspy",                                              # [DATA]: LAS/LAZ point-cloud IO
    "laszip",                                             # [DATA]: alternate compressed-COPC LAZ backend for laspy.copc
    "lazrs",                                              # [DATA]: compressed-COPC LAZ backend for laspy.copc
    "odc-stac",                                           # [DATA]: lazy dask cube from discovered STAC items
    "pdal",                                               # [GEOMETRY]: point-cloud pipeline
    "planetary-computer",                                 # [DATA]: STAC URL signing for Client.open modifiers and odc.stac patch_url
    "polars-st",                                          # [DATA]: spatial-typed polars frames for the DGGS/spatial-frame plane
    "pye57; python_version<'3.15'",                       # [GEOMETRY]: E57 scan IO; sdist hardcodes /usr/local xerces-c (no cp315 wheel)
    "pyogrio",                                            # [DATA]: GDAL vector IO
    "pyproj",                                             # [DATA]: PROJ coordinate transforms
    "pystac",                                             # [DATA]: STAC item and collection object model
    "pystac-client",                                      # [DATA]: STAC API search and discovery client
    "rasterio",                                           # [DATA]: raster geospatial IO
    "rioxarray",                                          # [DATA]: rasterio accessor bridging ndarray to CF DataArray and COG raster write
    "shapely",                                            # [DATA]: planar operations
    "stac-geoparquet; python_version<'3.15'",             # [DATA]: STAC item GeoParquet table interchange; hard orjson dep — orjson compiles against pre-3.15 CPython internals (no cp315 wheel)
    "xarray-spatial; python_version<'3.15'",              # [DATA]: raster terrain analytics; numba-gated
    "xvec",                                               # [DATA]: shapely-geometry-indexed xarray dimensions — vector data cubes backing the zone-cube owner
    # --- [GEOMETRY_CAD]
    "cadquery-ocp; python_version<'3.15'",                # [GEOMETRY]: OpenCASCADE STEP/AP242 kernel; the release declares Requires-Python <3.15 and ships no sdist
    "compas",                                             # [GEOMETRY]: algebra toolkit
    "compas_dr",                                          # [GEOMETRY]: COMPAS dynamic relaxation
    "compas_tna",                                         # [GEOMETRY]: COMPAS thrust-network analysis
    "manifold3d",                                         # [GEOMETRY]: robust mesh booleans
    "meshio",                                             # [DATA_COMPUTE]: mesh format codec IO; scikit-fem physical-group round-trip
