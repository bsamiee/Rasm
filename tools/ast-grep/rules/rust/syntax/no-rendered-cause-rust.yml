# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-rendered-cause-rust
language: rust
severity: error
utils:
    error-pattern:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^(\w+::)*Err$'}
            - has: {stopBy: end, kind: identifier, pattern: $E, not: {regex: '^(\w+::)*Err$'}}
    error-condition:
        kind: let_condition
        has: {field: pattern, matches: error-pattern}
    recovery-call:
        kind: call_expression
        has: {field: function, kind: field_expression, has: {field: field, regex: '^(map_err|or_else|unwrap_or_else|map_or_else|inspect_err|is_err_and)$'}}
    recovery-closure:
        kind: closure_expression
        all:
            - has:
                field: parameters
                has:
                    any:
                        - {kind: identifier, pattern: $E}
                        - {kind: parameter, has: {field: pattern, pattern: $E}}
            - inside: {kind: arguments, inside: {matches: recovery-call}}
    error-scope:
        any:
            - kind: match_arm
              has: {field: pattern, has: {stopBy: end, matches: error-pattern}}
            - kind: 'if_expression, while_expression'
              has: {field: condition, any: [{matches: error-condition}, {kind: let_chain, has: {matches: error-condition}}]}
            - kind: let_declaration
              all: [{has: {field: pattern, matches: error-pattern}}, {has: {field: alternative, pattern: $_}}]
            - matches: recovery-closure
            - kind: function_item
              has: {field: parameters, has: {kind: parameter, all: [{has: {field: pattern, pattern: $E}}, {has: {field: type, regex: '(Error|Report)\b'}}]}}
    rendered:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^to_string$'}}, {has: {field: value, kind: identifier, pattern: $E}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^(((std|alloc)::)?string::)?ToString::to_string$'}
                - has: {field: arguments, has: {any: [{kind: identifier, pattern: $E}, {kind: reference_expression, has: {field: value, kind: identifier, pattern: $E}}]}}
            - kind: macro_invocation
              all:
                - has: {field: macro, regex: '^(((std|alloc)::)?(fmt::)?)?format$'}
                - has:
                    kind: token_tree
                    any:
                        - has: {kind: identifier, pattern: $E, follows: {regex: '^(,|=)$'}, not: {precedes: {regex: '^(\.|::)$'}}}
                        - has: {kind: string_literal, regex: '\{(r#)?(e|err|error|source|cause|inner|\w*_err(or)?)(:[^}]*)?\}'}
    constructor:
        kind: call_expression
        has:
            field: function
            any:
                - {kind: identifier, regex: '^(r#)?[A-Z]', not: {regex: '^(Ok|Err|Some)$'}}
                - {kind: scoped_identifier, has: {field: name, regex: '^(r#)?[A-Z]'}, not: {regex: '(^|::)(Ok|Err|Some)$'}}
                - {kind: scoped_identifier, regex: '^(((std|core)::)?io::)?Error::(new|other)$'}
    boundary:
        kind: 'closure_expression, function_item, async_block'
    chain:
        kind: 'call_expression, field_expression, generic_function, parenthesized_expression, reference_expression, try_expression, await_expression'
    stored:
        any:
            - inside: {kind: arguments, stopBy: {kind: 'arguments, closure_expression, function_item'}, inside: {matches: constructor}}
            - inside: {kind: field_initializer, field: value, stopBy: {matches: boundary}}
            - inside: {kind: assignment_expression, field: right, stopBy: {matches: boundary}}
            - inside: {kind: closure_expression, field: body, matches: recovery-closure, stopBy: {not: {matches: chain}}}
            - inside: {kind: block, nthChild: {position: 1, reverse: true}, inside: {kind: closure_expression, field: body, matches: recovery-closure}, stopBy: {not: {matches: chain}}}
    compared:
        inside:
            stopBy: {matches: boundary}
            any:
                - {kind: binary_expression, has: {field: operator, regex: '^(==|!=)$'}}
                - {kind: match_expression, has: {field: body, has: {kind: match_arm, has: {field: pattern, has: {stopBy: end, kind: string_literal}}}}}
                - kind: call_expression
                  has: {field: function, kind: field_expression, has: {field: field, regex: '^(contains|starts_with|ends_with|find|rfind|matches|match_indices|eq|ne|eq_ignore_ascii_case|strip_prefix|strip_suffix|split_once|rsplit_once|is_match|captures)$'}}
    relayed:
        kind: identifier
        inside:
            stopBy: end
            kind: block
            has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $TEXT}}, {has: {field: value, matches: rendered}}]}
rule:
    pattern: $TEXT
    all:
        - matches: stored
        - any:
            - matches: rendered
            - matches: relayed
        - not: {matches: compared}
        - inside: {stopBy: end, matches: error-scope}
message: '`$TEXT` stores a typed failure as text no consumer can match to its cause'
note: 'Hold the failure as the `#[source]` field of a `thiserror` variant (`map_err(|source| <Error>::<Variant> { source })`) and render `{error}` where a log or protocol message prints it'
