id: run-in-callback-to-composed-effect
valid:
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => Effect.runSync(lookup(value)) + 1);'
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => { report(value); return Effect.runSync(lookup(value)); });'
    - 'import { Effect } from "effect"; const next = Effect.flatMap(load, (value) => Effect.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => Effect.runSync(lookup(value), { scheduler }));'
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => /* once */ Effect.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = Effect.promise(async () => Effect.runPromise(lookup(1)));'
    - 'import { Effect, Stream } from "effect"; const next = Stream.map(stream, (value) => Effect.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => Effect.runFork(lookup(value)));'
    - 'import { Effect, Runtime } from "effect"; const next = Effect.map(load, (value) => Runtime.runSync(runtime)(lookup(value)));'
    - 'import { Effect } from "other"; const next = Effect.map(load, (value) => Effect.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = Effect.map<number>(load, (value) => Effect.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => Effect.runSync(lookup(value)), extra);'
    - 'import { Stream } from "effect"; const next = Stream.map(stream, (value) => Stream.runSync(lookup(value)));'
    - 'import { Effect, Micro } from "effect"; const next = Effect.map(load, (value) => Micro.runSync(lookup(value)));'
invalid:
    - 'import { Effect } from "effect"; const next = Effect.map(load, (value) => Effect.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = load.pipe(Effect.map((value) => { return Effect.runSync(lookup(value)); }));'
    - 'import { Effect } from "effect"; const next = Effect.sync(() => Effect.runSync(lookup(1)));'
    - 'import { Effect } from "effect"; const next = Effect.promise(() => Effect.runPromise(lookup(1)));'
    - 'import { Effect } from "effect"; const next = Effect.map(load, function (value) { return Effect.runSync(lookup(value)); });'
    - 'import { Micro } from "effect"; const next = Micro.map(load, (value) => Micro.runSync(lookup(value)));'
    - 'import { Effect } from "effect"; const next = Effect.flatMap(load, (value) => Effect.sync(() => Effect.runSync(lookup(value))));'
