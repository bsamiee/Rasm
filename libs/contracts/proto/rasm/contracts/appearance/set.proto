syntax = "proto3";

package rasm.contracts.appearance;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "rasm/contracts/appearance/appearance.proto";
import "rasm/contracts/appearance/environment.proto";

// Capture evidence shared by a baked set and its material document.
message Provenance {
  message Capture {
    option (buf.validate.message).cel = {
      id: "capture.calibration"
      message: "a calibrated capture carries its chart residual"
      expression: "this.calibrated == has(this.calibration_delta_e)"
    };
    option (buf.validate.message).cel = {
      id: "capture.measured"
      message: "measurement posture derives from the capture method"
      expression: "this.measured == (this.method != 'authored')"
    };

    string device = 1 [(buf.validate.field).string.min_len = 1];
    string method = 2 [(buf.validate.field).string.min_len = 1];
    bool measured = 3;
    bool calibrated = 4;
    optional double calibration_delta_e = 5 [(buf.validate.field).double = {
      finite: true
      gte: 0
    }];
    optional uint32 wavelength_count = 6 [(buf.validate.field).uint32.gt = 0];
    optional uint32 angular_samples = 7 [(buf.validate.field).uint32.gt = 0];
  }

  message Fit {
    reserved 1, 2;
    reserved "wavelength_count", "angular_samples";

    option (buf.validate.message).cel = {
      id: "fit.rank"
      message: "rank cannot exceed the fitted parameter count"
      expression: "this.rank <= this.parameter_count"
    };
    option (buf.validate.message).cel = {
      id: "fit.conditioning"
      message: "only a full-rank fit carries a finite condition number"
      expression: "has(this.condition_number) == (this.rank == this.parameter_count)"
    };

    double residual = 3 [(buf.validate.field).double = {
      finite: true
      gte: 0
    }];
    uint32 rank = 5 [(buf.validate.field).uint32.gt = 0];
    uint32 parameter_count = 6 [(buf.validate.field).uint32.gt = 0];
    optional double condition_number = 4 [(buf.validate.field).double = {
      finite: true
      gte: 1
    }];
  }

  message Inference {
    uint64 tiles = 1 [(buf.validate.field).uint64.gt = 0];
    double golden_delta_max = 2 [(buf.validate.field).double = {
      finite: true
      gte: 0
    }];
  }

  message Chromaticity {
    reserved 1, 2, 3, 4;
    reserved "dominant_wavelength_nm", "excitation_purity", "cct_kelvin", "cct_duv";

    option (buf.validate.message).cel = {
      id: "chromaticity.observed"
      message: "chromaticity carries at least one observed readout"
      expression: "has(this.dominance) || has(this.temperature)"
    };

    message Dominance {
      double wavelength_nm = 1 [(buf.validate.field).double = {
        finite: true
        gte: 360
        lte: 700
      }];
      double purity = 2 [(buf.validate.field).double = {
        finite: true
        gt: 0
        lte: 1
      }];
    }

    message Temperature {
      double cct_kelvin = 1 [(buf.validate.field).double = {
        finite: true
        gt: 0
      }];
      double duv = 2 [(buf.validate.field).double = {
        finite: true
        gte: -0.05
        lte: 0.05
      }];
    }

    Dominance dominance = 5;
    Temperature temperature = 6;
  }

  message Card {
    reserved 3;
    reserved "model_artefact";

    string model_card = 1 [(buf.validate.field).string.min_len = 1];
    LicenseClass license = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
  }

  message Ingest {
    string source = 1 [(buf.validate.field).string.min_len = 1];
    optional string licence = 2;
    optional string reference = 3;
  }

  Capture capture = 1 [(buf.validate.field).required = true];
  oneof assessment {
    Fit fit = 2;
    Inference inference = 6;
  }
  Chromaticity chromaticity = 3;
  Card card = 4;
  Ingest ingest = 5;
}

// The optional CPU-minted press receipt of a baked set.
message Press {
  bytes plan_key = 1 [(buf.validate.field).bytes.len = 16];
  optional bytes graph_key = 2 [(buf.validate.field).bytes.len = 16];
  fixed64 seed = 3;
  uint64 texels = 4;
  google.protobuf.Duration elapsed = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  optional double gpu_delta_max = 6 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  uint32 downgraded = 7;
  uint64 faulted_texels = 8;
}

// The shared plane-set payload of PBR and baked products.
message SurfaceSet {
  option (buf.validate.message).cel = {
    id: "surface_set.udim"
    message: "udim tiles ride a mari set alone"
    expression: "(this.udim == 2) == (this.udim_tiles.size() > 0)"
  };

  optional string material_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string conductor = 2 [(buf.validate.field).string.min_len = 1];
  uint32 width = 3 [(buf.validate.field).uint32.gte = 1];
  uint32 height = 4 [(buf.validate.field).uint32.gte = 1];
  uint32 layers = 5 [(buf.validate.field).uint32.gte = 1];
  LayerLaw layer_law = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  NormalConvention normal_convention = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AlphaMode alpha_mode = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional double height_scale_mm = 9 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  bool tiled = 10;
  Udim udim = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated uint32 udim_tiles = 12 [(buf.validate.field).repeated = {
    unique: true
    items: {
      uint32: {gte: 1001}
    }
  }];
  repeated Plane planes = 13;
  repeated PackRow packs = 14;
  repeated string unresolved = 15;
}

message BakedSet {
  SurfaceSet surface = 1 [(buf.validate.field).required = true];
  bytes appearance_key = 2 [(buf.validate.field).bytes.len = 16];
  Provenance provenance = 3 [(buf.validate.field).required = true];
  Press press = 4;
}

message EnvironmentSet {
  optional string source = 1 [(buf.validate.field).string.min_len = 1];

  oneof product {
    option (buf.validate.oneof).required = true;

    Hdri hdri = 2;
    Ibl ibl = 3;
  }
}

// The generated product oneof is the sole set discriminant.
message Set {
  bytes key = 1 [(buf.validate.field).bytes.len = 16];
  LicenseClass license_class = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  oneof product {
    option (buf.validate.oneof).required = true;

    SurfaceSet pbr = 3;
    BakedSet baked = 4;
    EnvironmentSet environment = 5;
  }
}
