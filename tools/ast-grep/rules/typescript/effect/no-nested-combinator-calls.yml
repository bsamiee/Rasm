# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# The rewrite nested-module-calls-to-pipe applies the fix in files that import pipe from effect
id: no-nested-combinator-calls
language: tsx
severity: error
utils:
    module-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?[A-Z]\w*$'}}}}
    # Imported module operations with a data-last or unary pipeline form
    step:
        matches: module-call
        all:
            - has:
                field: function
                has:
                    field: property
                    regex: "^(map|flatMap|filter|filterMap|getOrElse|orElse|mapError|flatten|provide|merge|mapOut|filterInput|fromIterable)$"
            - not: {has: {field: function, has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?Schema$"}}}}}}
    # A unary transform consumes its first argument; dual operations require the data-first arity.
    data-first-step:
        matches: step
        has:
            field: arguments
            has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: module-call}
        any:
            - has: {field: function, has: {field: property, regex: "^(flatten|fromIterable)$"}}
            - has: {field: arguments, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
rule:
    pattern: $CALL
    all:
        - matches: data-first-step
        - has:
            field: arguments
            has:
                nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                matches: data-first-step
                has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: data-first-step}}
        # The outermost call of a chain reports once, an inner call sits as the first argument of another step
        - not:
            all:
                - nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                - inside: {kind: arguments, inside: {matches: data-first-step}}
message: Module calls nest four deep as data-first arguments and read from the inside out
note: Keep at most three nested data-first calls and pipe deeper compositions in evaluation order, `pipe(value, Array.map(project), Array.flatten)`
labels:
    CALL: {style: primary}
