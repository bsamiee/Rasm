# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-member-name-reflection-javascript
language: javascript
severity: error
utils:
    list-method:
        kind: call_expression
        has: {field: function, kind: member_expression, has: {field: property, regex: '^(slice|filter|reverse|sort)$'}}
    list-literal:
        any:
            - kind: array
              all:
                - not: {has: {pattern: $_, not: {any: [{matches: javascript-member-name}, {kind: comment}, {kind: spread_element, has: {matches: list-literal}}]}}}
                - has: {any: [{matches: javascript-member-name}, {kind: spread_element}]}
            - kind: object
              all:
                - not: {has: {pattern: $_, not: {any: [{kind: pair, has: {field: value, matches: list-literal}}, {kind: comment}]}}}
                - has: {kind: pair}
            - kind: ternary_expression
              all: [{has: {field: consequence, matches: list-literal}}, {has: {field: alternative, matches: list-literal}}]
            - kind: parenthesized_expression
              has: {matches: list-literal}
            - matches: list-method
              has: {field: function, has: {field: object, matches: list-literal}}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^concat$'}}, {has: {field: object, any: [{matches: list-literal}, {kind: array, not: {has: {pattern: $_}}}]}}]}
                - not: {has: {field: arguments, has: {pattern: $_, not: {any: [{matches: list-literal}, {matches: javascript-member-name}, {kind: comment}]}}}}
    list-binding:
        kind: identifier
        pattern: $LIST
        inside:
            kind: program
            stopBy: end
            has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $LIST}}, {has: {field: value, matches: list-literal}}]}
    list-member:
        kind: 'subscript_expression, member_expression'
        has: {field: object, matches: list-binding}
    list-copy:
        any:
            - kind: array
              all:
                - not: {has: {pattern: $_, not: {any: [{matches: javascript-member-name}, {kind: comment}, {kind: spread_element, has: {any: [{matches: list-literal}, {matches: list-binding}, {matches: list-member}]}}]}}}
                - has: {kind: spread_element}
            - matches: list-method
              has: {field: function, has: {field: object, any: [{matches: list-binding}, {matches: list-member}]}}
            - kind: call_expression
              all:
                - not: {has: {field: arguments, has: {pattern: $_, not: {any: [{matches: list-literal}, {matches: list-binding}, {matches: list-member}, {matches: javascript-member-name}, {kind: comment}]}}}}
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^concat$'}}, {has: {field: object, any: [{matches: list-binding}, {matches: list-member}]}}]}
    list-alias:
        kind: identifier
        pattern: $ALIAS
        inside:
            kind: program
            stopBy: end
            has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $ALIAS}}, {has: {field: value, any: [{matches: list-member}, {matches: list-copy}]}}]}
    list-direct:
        any:
            - matches: list-literal
            - matches: list-binding
            - matches: list-member
            - matches: list-copy
            - matches: list-alias
    element-direct:
        kind: subscript_expression
        has: {field: object, matches: list-direct}
    named-argument:
        any:
            - matches: javascript-member-name
            - matches: element-direct
            - matches: list-direct
    bound-parameter:
        kind: identifier
        pattern: $PARAMETER
        inside:
            kind: 'function_declaration, function_expression, arrow_function'
            stopBy: end
            all:
                - any: [{has: {field: name, pattern: $FUNCTION}}, {inside: {kind: variable_declarator, has: {field: name, pattern: $FUNCTION}}}]
                - inside:
                    kind: program
                    stopBy: end
                    not:
                        has:
                            stopBy: end
                            kind: identifier
                            pattern: $FUNCTION
                            not: {any: [{inside: {kind: call_expression, field: function}}, {inside: {kind: 'function_declaration, function_expression, variable_declarator', field: name}}]}
                - any:
                    - all: [{has: {field: parameters, has: {nthChild: 1, kind: identifier, pattern: $PARAMETER}}}, {inside: {kind: program, stopBy: end, matches: bound-1}}]
                    - all: [{has: {field: parameters, has: {nthChild: 2, kind: identifier, pattern: $PARAMETER}}}, {inside: {kind: program, stopBy: end, matches: bound-2}}]
                    - all: [{has: {field: parameters, has: {nthChild: 3, kind: identifier, pattern: $PARAMETER}}}, {inside: {kind: program, stopBy: end, matches: bound-3}}]
                    - all: [{has: {field: parameters, has: {nthChild: 4, kind: identifier, pattern: $PARAMETER}}}, {inside: {kind: program, stopBy: end, matches: bound-4}}]
    call:
        kind: call_expression
        has: {field: function, pattern: $FUNCTION}
    bound-1:
        all:
            - has: {stopBy: end, matches: call, has: {field: arguments, has: {nthChild: 1, matches: named-argument}}}
            - not: {has: {stopBy: end, matches: call, not: {has: {field: arguments, has: {nthChild: 1, matches: named-argument}}}}}
    bound-2:
        all:
            - has: {stopBy: end, matches: call, has: {field: arguments, has: {nthChild: 2, matches: named-argument}}}
            - not: {has: {stopBy: end, matches: call, not: {has: {field: arguments, has: {nthChild: 2, matches: named-argument}}}}}
    bound-3:
        all:
            - has: {stopBy: end, matches: call, has: {field: arguments, has: {nthChild: 3, matches: named-argument}}}
            - not: {has: {stopBy: end, matches: call, not: {has: {field: arguments, has: {nthChild: 3, matches: named-argument}}}}}
    bound-4:
        all:
            - has: {stopBy: end, matches: call, has: {field: arguments, has: {nthChild: 4, matches: named-argument}}}
            - not: {has: {stopBy: end, matches: call, not: {has: {field: arguments, has: {nthChild: 4, matches: named-argument}}}}}
    list-value:
        any:
            - matches: list-direct
            - matches: bound-parameter
    element:
        kind: subscript_expression
        has: {field: object, matches: list-value}
    element-alias:
        kind: identifier
        pattern: $ELEMENT
        inside:
            kind: program
            stopBy: end
            has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $ELEMENT}}, {has: {field: value, matches: element}}]}
    key-table:
        kind: object
        all:
            - not: {has: {pattern: $_, not: {any: [{kind: pair, has: {field: key, any: [{kind: property_identifier}, {matches: javascript-member-name}]}}, {kind: comment}]}}}
            - has: {kind: pair}
    key-table-binding:
        kind: identifier
        pattern: $TABLE
        inside:
            kind: program
            stopBy: end
            has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $TABLE}}, {has: {field: value, matches: key-table}}]}
    table-key:
        kind: identifier
        pattern: $KEY
        inside:
            kind: for_in_statement
            stopBy: end
            all:
                - has: {field: left, pattern: $KEY}
                - has: {field: right, any: [{matches: key-table}, {matches: key-table-binding}]}
    list-item:
        kind: identifier
        pattern: $ITEM
        any:
            - inside:
                kind: for_in_statement
                stopBy: end
                all: [{has: {regex: '^of$'}}, {has: {field: left, any: [{pattern: $ITEM}, {has: {stopBy: end, kind: identifier, pattern: $ITEM}}]}}, {has: {field: right, matches: list-value}}]
            - inside:
                kind: 'function_expression, arrow_function'
                stopBy: end
                all:
                    - any:
                        - has: {field: parameter, kind: identifier, pattern: $ITEM}
                        - has: {field: parameters, has: {nthChild: 1, kind: identifier, pattern: $ITEM}}
                    - inside:
                        kind: arguments
                        inside:
                            kind: call_expression
                            has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(forEach|map|filter|some|every|find|findLast|flatMap)$'}}, {has: {field: object, matches: list-value}}]}
    name-value:
        any:
            - matches: element
            - matches: element-alias
            - matches: table-key
            - matches: list-item
            - matches: bound-parameter
    literal-table:
        pattern: $OWNER
        inside:
            kind: program
            stopBy: end
            has:
                stopBy: end
                any:
                    - kind: variable_declarator
                      all: [{has: {field: name, pattern: $OWNER}}, {has: {field: value, kind: 'object, array'}}]
                    - kind: assignment_expression
                      all: [{has: {field: left, pattern: $OWNER}}, {has: {field: right, kind: 'object, array'}}]
    literal-root:
        kind: member_expression
        has:
            stopBy: end
            field: object
            kind: identifier
            pattern: $ROOT
            inside:
                kind: program
                stopBy: end
                has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $ROOT}}, {has: {field: value, kind: 'object, array'}}]}
    handle:
        kind: 'identifier, member_expression'
        not: {regex: '^([A-Z]\w*\.)?[A-Z][A-Z0-9_]*$'}
rule:
    pattern: $ACCESS
    any:
        - kind: subscript_expression
          all:
            - has: {field: object, pattern: $OWNER, not: {any: [{matches: literal-table}, {matches: literal-root}]}}
            - has: {field: index, matches: name-value}
        - kind: object
          all:
            - has: {kind: pair, all: [{has: {field: key, regex: '^[''"]?(name|member|property|field|key|attribute)[''"]?$'}}, {has: {field: value, matches: javascript-member-name}}]}
            - has:
                kind: pair
                has:
                    field: value
                    pattern: $OWNER
                    matches: handle
                    any:
                        - regex: '^app(\.|$)'
                        - inside: {kind: pair, has: {field: key, regex: '^[''"]?(owner|object|target|holder|receiver|host|subject)[''"]?$'}}
message: '`$ACCESS` reaches a member of `$OWNER` by a name string'
note: 'Read, call, or assign `<owner>.<member>`, one expression per member where a name list or an owner and name record selects several'
