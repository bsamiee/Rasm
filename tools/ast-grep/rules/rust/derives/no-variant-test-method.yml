# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    self-value:
        regex: '^(\*|&)?\p{White_Space}*self$'
    variant-test:
        any:
            - kind: macro_invocation
              all:
                - matches: {rust-std-macro: {name: {regex: '^matches$'}}}
                - has: {kind: token_tree, regex: '^\(\p{White_Space}*\*?\p{White_Space}*self\p{White_Space}*,\p{White_Space}*\p{XID_Continue}+::\p{XID_Continue}+\p{White_Space}*(\(\p{White_Space}*(\.\.|_)\p{White_Space}*\)|\{\p{White_Space}*\.\.\p{White_Space}*\})?\p{White_Space}*,?\p{White_Space}*\)$'}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^==$'}
                - any:
                    - all: [{has: {field: left, matches: self-value}}, {has: {field: right, regex: '^&?\p{White_Space}*\p{XID_Continue}+::\p{XID_Continue}+$'}}]
                    - all: [{has: {field: right, matches: self-value}}, {has: {field: left, regex: '^&?\p{White_Space}*\p{XID_Continue}+::\p{XID_Continue}+$'}}]
    variant-pattern:
        kind: match_pattern
        regex: '^(\p{XID_Continue}+::)+\p{XID_Continue}+$'
    bool-arm:
        kind: match_arm
        has: {field: value, kind: boolean_literal}
    bool-selection:
        kind: match_expression
        has:
            field: body
            all:
                - not: {has: {nthChild: 3}}
                - not: {has: {kind: match_arm, not: {matches: bool-arm}}}
                - has: {matches: bool-arm, has: {field: pattern, matches: variant-pattern}}
                - has: {kind: match_arm, has: {field: value, regex: '^true$'}}
                - has: {kind: match_arm, has: {field: value, regex: '^false$'}}
    test-body:
        matches: {rust-single-statement: {first: {any: [{matches: variant-test}, {matches: bool-selection}, {kind: expression_statement, has: {any: [{matches: variant-test}, {matches: bool-selection}]}}]}}}
rule:
    any:
        - kind: function_item
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: parameters, regex: '^\(\p{White_Space}*&?\p{White_Space}*self\p{White_Space}*\)$'}
            - has: {field: return_type, regex: '^bool$'}
            - has: {field: body, matches: test-body}
            - inside: {kind: declaration_list, inside: {kind: impl_item, all: [{not: {has: {field: trait, pattern: $_}}}, {has: {field: type, kind: type_identifier, pattern: $T}}]}}
            - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $T}}}
        - kind: match_expression
          all:
            - matches: bool-selection
            - not: {inside: {kind: function_item, stopBy: {kind: 'function_item, closure_expression'}, all: [{has: {field: parameters, regex: '^\(\p{White_Space}*&?\p{White_Space}*self\p{White_Space}*\)$'}}, {has: {field: return_type, regex: '^bool$'}}, {has: {field: body, matches: test-body}}]}}
            - has: {field: body, has: {kind: match_arm, has: {field: pattern, has: {kind: scoped_identifier, has: {field: path, pattern: $T}}}}}
            - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $T}}}
message: 'Method or `match` tests a `$T` variant by hand'
note: 'Derive `derive_more::IsVariant` on the enum and call `is_<variant>()` at each use in place of a test method or `match`'
