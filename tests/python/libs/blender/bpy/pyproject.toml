# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "blender-bpy-tests"
version         = "1.0.0"
description     = "Pytest over the bpy library in Blender"
requires-python = ">=3.13"

dependencies = [
    # --- [CORE]
    "blender",     # Library and fixture extension under test
    "expression",  # Results and options in native assertions and fixtures
    "msgspec",     # Records in native assertions and fixtures
    "pytest",      # Native suite runner and fixtures

    # --- [MATHEMATICS]
    "numpy",       # Arrays for fixture images and captured pixels

    # --- [IMAGING]
    "opencolorio", # Color processors in native assertions
    "openimageio", # Image buffers in native assertions
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# --- [HATCH] ----------------------------------------------------------------------------

[tool.hatch.build]
dev-mode-dirs = ["../../../../.."]

[tool.hatch.build.targets.wheel]
only-include = ["."]
exclude      = ["/pyproject.toml"]

[tool.hatch.build.targets.wheel.sources]
"" = "tests/python/libs/blender/bpy"

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../../../pyproject.toml"
