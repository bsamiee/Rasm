id: csharp-variable
language: csharplang
role: item
symbolType: variable
rule:
    kind: local_declaration_statement
    inside: {kind: global_statement}
    pattern: $DECLARATION
    has: {kind: variable_declaration, pattern: $VARIABLES}
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        any:
            - has: {field: name, pattern: $DECLARED}
            - has: {kind: tuple_pattern, pattern: $DECLARED}
      fix: $DECLARED
    - id: initializer
      rule:
        kind: variable_declarator
        inside: {kind: variable_declaration, inside: {kind: local_declaration_statement, not: {has: {kind: modifier, regex: '^const$'}}}}
        any:
            - has: {field: name, pattern: $DECLARED}
            - has: {kind: tuple_pattern, pattern: $DECLARED}
      fix: $DECLARED
transform:
    NAMES: {rewrite: {source: $VARIABLES, rewriters: [name], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[initializer])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}])+$|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}]+(;)', by: '$1'}}
name: $NAMES
signature: $SIGNATURE
isExported: false
