id: no-exec-build
valid:
    # The reference form orders the build
    - |
      <ProjectReference Include="../Tool/Tool.csproj" ReferenceOutputAssembly="false" />
    # dotnet query building nothing
    - |
      <Exec Command="dotnet --version" ConsoleToMSBuild="true" />
    # Tool restore evaluating no project
    - |
      <Exec Command="dotnet tool restore" />
    # Custom item with the build command as metadata, no Exec runs it
    - |
      <ItemGroup><_Step Include="tool" Command="dotnet build ../Tool/Tool.csproj" /></ItemGroup>
    # Log pattern parameter naming the subcommand, no build starts
    - |
      <Exec Command="./ci.sh" CustomErrorRegularExpression="dotnet build failed" />
invalid:
    # Single-quoted command holding the msbuild executable
    - |
      <Exec Command='msbuild Other.proj /t:Stage' />
    # dotnet build of another project
    - |
      <Exec Command="dotnet build ../Tool/Tool.csproj -c $(Configuration)" />
    # Pack from inside a target
    - |
      <Exec Command="dotnet pack $(MSBuildProjectFullPath) --no-build" />
    # Run, the project builds first
    - |
      <Exec Command="dotnet run --project ../Tool/Tool.csproj" />
    # The msbuild executable
    - |
      <Exec Command="msbuild.exe Other.proj /t:Stage" />
