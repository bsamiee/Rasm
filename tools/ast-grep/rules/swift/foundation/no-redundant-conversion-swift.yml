# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-redundant-conversion-swift
language: swiftlang
severity: error
utils:
    encoding:
        any:
            - pattern: '$ENCODER.encode($VALUE)'
            - kind: try_expression
              has: {pattern: '$ENCODER.encode($VALUE)'}
rule:
    kind: call_expression
    pattern: '$DECODER.decode($TYPE, from: $ENCODED)'
    has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^from$'}}, {has: {field: value, matches: encoding}}]}}}
constraints:
    TYPE: {regex: '\.self$|^[a-z_]\w*$'}
message: '`$ENCODED` re-encodes a value in memory to decode `$TYPE` from it'
note: 'Decode the target type in the read that produced the value, as `JSONDocument<Known>` when a write must keep unknown fields'
