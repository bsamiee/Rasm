# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-optimize"
version.workspace    = true
edition.workspace    = true
description          = "Optimization over named bounded spaces: bounded nonlinear solves with vector constraints and global search, conic programs assembled from typed cone blocks, allocation models, constrained Pareto ranking with crowding"
repository.workspace = true
license.workspace    = true
keywords             = ["optimization", "nonlinear", "conic", "pareto", "allocation"]
categories           = ["mathematics", "science"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
bounded-integer      = { workspace = true }
nalgebra             = { workspace = true }
clarabel             = { workspace = true }
good_lp              = { workspace = true }
nlopt                = { workspace = true }
rasm-stats           = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
