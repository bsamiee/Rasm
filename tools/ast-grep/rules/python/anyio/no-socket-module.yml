# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-socket-module
language: python
severity: error
ignores: ['.claude/skills/use-blender/scripts/**', '.claude/skills/use-rhino/scripts/**', 'tools/interface/**']
utils:
    socket-member:
        regex: '^(socket|create_connection|create_server|getaddrinfo|getnameinfo|gethostbyname|gethostbyname_ex|gethostbyaddr|getfqdn)$'
rule:
    kind: identifier, attribute
    pattern: $USE
    matches: {python-member-use: {module: {regex: '^socket$'}, name: {matches: socket-member}}}
    not:
        any:
            - inside: {kind: 'import_statement, import_from_statement', stopBy: end}
            - inside: {kind: type, stopBy: end}
message: '`$USE` names a blocking `socket` member'
note: 'Use `anyio.connect_tcp`, `anyio.create_tcp_listener`, `anyio.getaddrinfo`, or `anyio.getnameinfo`, a blocking socket call stalls the event loop'
