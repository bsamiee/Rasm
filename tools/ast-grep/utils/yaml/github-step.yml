id: github-step
language: yaml
utils:
    steps:
        kind: block_mapping_pair, flow_pair
        has:
            field: key
            regex: ^(steps|"steps"|'steps')$
        inside:
            kind: block_mapping, flow_mapping
            all:
                - has:
                    kind: block_mapping_pair, flow_pair
                    has:
                        field: key
                        regex: ^(using|"using"|'using')$
                    all:
                        - has:
                            field: value
                            regex: ^(composite|"composite"|'composite')$
                - inside:
                    kind: block_node, flow_node
                    inside:
                        kind: block_mapping_pair, flow_pair
                        has:
                            field: key
                            regex: ^(runs|"runs"|'runs')$
                        inside:
                            kind: block_mapping, flow_mapping
                            inside:
                                kind: block_node, flow_node
                                inside:
                                    kind: document
    workflow-step:
        kind: block_mapping, flow_mapping
        inside:
            kind: block_sequence, flow_sequence
            stopBy:
                kind: block_mapping_pair, flow_pair
            inside:
                kind: block_node, flow_node
                inside:
                    matches: workflow-sequence
    workflow-sequence:
        kind: block_mapping_pair, flow_pair
        any:
            - has:
                field: key
                regex: ^(steps|"steps"|'steps')$
              inside:
                matches: github-workflow-job
            - has:
                field: key
                regex: ^(parallel|"parallel"|'parallel')$
              inside:
                matches: workflow-step
rule:
    kind: block_mapping, flow_mapping
    any:
        - matches: workflow-step
        - kind: block_mapping, flow_mapping
          inside:
            kind: block_node, flow_node
            any:
                - inside:
                    kind: block_sequence_item
                    inside:
                        kind: block_sequence
                        inside:
                            kind: block_node
                            inside:
                                matches: steps
                - inside:
                    kind: flow_sequence
                    inside:
                        kind: flow_node
                        inside:
                            matches: steps
