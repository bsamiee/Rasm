# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-string-default-python
language: python
severity: error
utils:
    empty-string:
        kind: string
        not: {has: {kind: "string_content, interpolation"}}
    empty-default:
        any:
            - matches: empty-string
            - kind: call
              all:
                - has: {field: function, regex: '^((msgspec|attrs|attr)\.)?(field|ib)$'}
                - has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, regex: '^default$'}}, {has: {field: value, matches: empty-string}}]}}
    empty-keyword:
        kind: keyword_argument
        all:
            - has: {field: name, regex: '^default$'}
            - has: {field: value, matches: empty-string}
    empty-lookup:
        any:
            - kind: call
              all:
                - has: {field: function, kind: attribute, has: {field: attribute, regex: '^(get|getenv|findtext|pop)$'}}
                - has: {field: arguments, any: [{has: {nthChild: 2, matches: empty-string}}, {has: {matches: empty-keyword}}], not: {has: {nthChild: 3}}}
            - kind: call
              all:
                - has: {field: function, regex: '^(getattr|(os\.)?getenv)$'}
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, any: [{matches: empty-string}, {matches: empty-keyword}]}}
            - kind: boolean_operator
              all:
                - has: {field: operator, regex: '^or$'}
                - has: {field: right, matches: empty-string}
    passed:
        any:
            - inside: {kind: argument_list}
            - inside: {kind: keyword_argument, field: value}
            - inside: {kind: 'return_statement, yield'}
            - inside: {kind: lambda, field: body}
    text-type:
        kind: type
        regex: '^(str|Annotated\[\s*str\s*,.*\])$'
    tested:
        any:
            - inside: {kind: 'if_statement, elif_clause, while_statement, conditional_expression, assert_statement', field: condition}
            - inside: {kind: not_operator}
            - inside: {kind: boolean_operator}
            - inside: {kind: comparison_operator, has: {matches: empty-string}}
            - nthChild: 2
              inside: {kind: conditional_expression}
    tested-name:
        kind: identifier
        pattern: $NAME
        matches: tested
    passed-name:
        kind: identifier
        pattern: $NAME
        matches: passed
    tested-field:
        kind: attribute
        has: {field: attribute, pattern: $NAME}
        matches: tested
rule:
    any:
        - kind: typed_default_parameter
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: type, matches: text-type}
            - has: {field: value, matches: empty-string}
            - inside: {kind: function_definition, stopBy: end, has: {field: body, has: {stopBy: {kind: 'function_definition, lambda, class_definition'}, matches: tested-name}}}
        - kind: default_parameter
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: value, matches: empty-string}
            - inside: {kind: 'function_definition, lambda', stopBy: end, has: {field: body, any: [{matches: tested-name}, {has: {stopBy: {kind: 'function_definition, lambda, class_definition'}, matches: tested-name}}]}}
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME}
            - has: {field: type, matches: text-type}
            - has: {field: right, matches: empty-default}
            - inside: {kind: expression_statement, inside: {kind: block, inside: {kind: class_definition}}}
            - inside: {kind: module, stopBy: end, has: {stopBy: end, matches: tested-field}}
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME}
            - has: {field: right, matches: empty-lookup}
            - inside: {kind: 'function_definition, module', stopBy: end, has: {stopBy: {kind: 'function_definition, lambda, class_definition'}, any: [{matches: tested-name}, {matches: passed-name}]}}
        - matches: empty-lookup
          all:
            - matches: passed
            - any:
                - has: {field: left, pattern: $NAME}
                - all:
                    - has: {field: function, regex: '^getattr$'}
                    - has: {field: arguments, has: {nthChild: 2, pattern: $NAME}}
                - has: {field: arguments, has: {nthChild: 1, pattern: $NAME}}
message: '`$NAME` defaults to an empty string standing for absence'
note: 'Use `str | None` with `None` for absence and an `is None` test, an empty string is a valid `str` and states no absence'
