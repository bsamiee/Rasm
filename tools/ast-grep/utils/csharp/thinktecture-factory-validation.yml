# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: thinktecture-factory-validation
language: csharp
rule:
    kind: method_declaration
    all:
        - has: {field: name, regex: '^ValidateFactoryArguments$'}
        - has: {kind: modifier, regex: '^static$'}
        - has: {kind: modifier, regex: '^partial$'}
