    - 'import { VersionActions as Base } from "nx/release"; class Actions extends Base { override async updateProjectVersion(): Promise<string[]> { return await load(); } }'
    - 'import Base from "@nx/js/src/release/version-actions"; class Actions extends Base { override async updateProjectVersion(): Promise<string[]> { return await load(); } }'
    - 'import Base from "@nx/js/src/release/version-actions"; const Resolved: typeof Base = normalize(Base); class Actions extends Resolved { override async updateProjectVersion(): Promise<string[]> { return await load(); } }'
