# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observable-object
language: swiftlang
severity: error
rule:
    pattern: $SITE
    any:
        - kind: inheritance_specifier
          regex: '^(Combine\.)?ObservableObject$'
        - kind: attribute
          regex: '^@(Combine\.)?Published$'
message: '`$SITE` publishes model changes through Combine in place of Observation'
note: 'Declare `@Observable final class <Model>` without `@Published`, and iterate `Observations { <model>.<value> }` for a `$<value>` publisher'
