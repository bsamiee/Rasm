# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-effect-interface-without-leading-image
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    socket-call:
        kind: call
        has: {field: function, kind: identifier, regex: '^Socket$'}
    result-socket:
        kind: call
        all:
            - matches: socket-call
            - has: {field: arguments, kind: argument_list, has: {kind: keyword_argument, all: [{has: {field: name, regex: '^key$'}}, {has: {field: value, kind: attribute, regex: '^Shell\.(image|result)$'}}]}}
    image-socket:
        kind: call
        all:
            - matches: socket-call
            - has: {field: arguments, kind: argument_list, has: {kind: keyword_argument, all: [{has: {field: name, regex: '^key$'}}, {has: {field: value, kind: attribute, regex: '^Shell\.image$'}}]}}
            - has: {field: arguments, kind: argument_list, has: {kind: keyword_argument, all: [{has: {field: name, regex: '^kind$'}}, {has: {field: value, kind: attribute, regex: '^bpy\.types\.NodeSocketColor$'}}]}}
    result-outputs:
        kind: keyword_argument
        all:
            - has: {field: name, regex: '^outputs$'}
            - has: {field: value, kind: tuple, has: {nthChild: 1, matches: result-socket}}
    image-inputs:
        kind: keyword_argument
        all:
            - has: {field: name, regex: '^inputs$'}
            - has: {field: value, kind: tuple, has: {nthChild: 1, matches: image-socket}}
rule:
    kind: call
    all:
        - has: {field: function, pattern: $BUILD, regex: '^(Interface|(msgspec\.)?structs\.replace)$'}
        - has: {field: arguments, kind: argument_list, has: {matches: result-outputs}}
        - not: {has: {field: arguments, kind: argument_list, has: {matches: image-inputs}}}
message: 'Effect interface from `$BUILD` declares no `Shell.image` color socket as first input, the input Blender feeds an image'
note: 'Declare `inputs=(Socket(key=Shell.image, name="Image", kind=bpy.types.NodeSocketColor), <inputs>)` beside `outputs`'
