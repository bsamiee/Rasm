# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-import-reference
language: tsx
arguments: [source, exported]
utils:
    type-only:
        has: {regex: '^type$'}
    module-import:
        kind: import_statement
        has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, matches: source}}
    namespace-binding:
        kind: namespace_import
        has: {kind: identifier, pattern: $IMPORTED}
    export-binding:
        kind: import_clause
        any:
            - has:
                kind: named_imports
                has:
                    kind: import_specifier
                    all:
                        - has: {field: name, matches: exported}
                        - has: {kind: identifier, pattern: $IMPORTED, nthChild: {position: 1, reverse: true, ofRule: {kind: identifier}}}
                        - not: {matches: type-only}
            - has: {matches: namespace-binding, has: {regex: '^\*$', matches: exported}}
    type-binding:
        kind: import_clause
        any:
            - has:
                kind: named_imports
                has:
                    kind: import_specifier
                    all:
                        - has: {field: name, matches: exported}
                        - has: {kind: identifier, pattern: $IMPORTED, nthChild: {position: 1, reverse: true, ofRule: {kind: identifier}}}
            - has: {matches: namespace-binding, has: {regex: '^\*$', matches: exported}}
    module-binding:
        kind: import_clause
        any:
            - has: {kind: identifier, pattern: $IMPORTED}
            - has: {matches: namespace-binding}
    type-position:
        inside: {kind: 'nested_type_identifier, type_query', stopBy: {not: {kind: 'nested_identifier, member_expression'}}}
rule:
    any:
        - kind: identifier
          pattern: $IMPORTED
          all:
            - any:
                - inside: {kind: program, stopBy: end, has: {matches: module-import, not: {matches: type-only}, has: {matches: export-binding}}}
                - matches: type-position
                  inside: {kind: program, stopBy: end, has: {matches: module-import, has: {matches: type-binding}}}
            - not: {matches: typescript-shadowed-import}
        - kind: member_expression
          all:
            - has: {field: property, matches: exported}
            - has: {field: object, kind: identifier, pattern: $IMPORTED}
            - inside: {kind: program, stopBy: end, has: {matches: module-import, not: {matches: type-only}, has: {matches: module-binding}}}
            - has: {field: object, not: {matches: typescript-shadowed-import}}
