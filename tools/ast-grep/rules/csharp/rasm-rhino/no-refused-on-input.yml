# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-refused-on-input
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    input:
        any:
            - kind: identifier
              pattern: $INPUT
              all:
                - inside:
                    stopBy: end
                    kind: method_declaration, constructor_declaration, local_function_statement, operator_declaration
                    has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $INPUT}}}
                - not:
                    inside:
                        stopBy: end
                        kind: lambda_expression, anonymous_method_expression
                        has: {field: parameters, any: [{kind: implicit_parameter, pattern: $INPUT}, {has: {kind: parameter, has: {field: name, pattern: $INPUT}}}]}
            - kind: member_access_expression
              has: {field: expression, matches: input}
    public-input:
        matches: input
        inside: {stopBy: end, kind: method_declaration, has: {kind: modifier, regex: '^public$'}}
    local-value:
        kind: identifier
        pattern: $LOCAL
        inside:
            stopBy: end
            kind: method_declaration, constructor_declaration, local_function_statement, operator_declaration
            has:
                stopBy: end
                kind: declaration_pattern, variable_declarator, declaration_expression
                has: {field: name, pattern: $LOCAL}
    answer-error:
        kind: object_creation_expression
        has: {field: type, matches: {csharp-type-name: {name: {regex: '^Refused$'}}}}
rule:
    kind: invocation_expression
    not: {matches: {csharp-owner-body: {type: {regex: '^Conversions$'}, member: {regex: '^(Required|NonEmpty|Present)$'}}}}
    any:
        - all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^ToFin$'}}
            - has: {field: arguments, has: {kind: argument, has: {matches: answer-error}}}
            - has:
                field: function
                has:
                    field: expression
                    kind: invocation_expression
                    all:
                        - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Conversions$'}, member: {regex: '^Present$'}}}}
                        - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: input, pattern: $VALUE}}}
        - all:
            - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Conversions$'}, member: {regex: '^(NonEmpty|Required)$'}}}}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: input, pattern: $VALUE}}}
        - all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Unless\w*$'}}, {has: {field: expression, matches: {csharp-type-name: {name: {regex: '^Refused$'}}}}}]}
            - has:
                field: arguments
                has:
                    kind: argument
                    nthChild: 1
                    has:
                        any:
                            - kind: identifier
                              matches: public-input
                              pattern: $VALUE
                            - kind: binary_expression, is_pattern_expression, prefix_unary_expression, parenthesized_expression
                              all:
                                - has: {stopBy: end, kind: identifier, matches: public-input, pattern: $VALUE}
                                - not: {has: {stopBy: end, any: [{kind: 'invocation_expression, object_creation_expression, member_access_expression, element_access_expression, conditional_access_expression'}, {matches: local-value}]}}
message: '`Refused` guard checks caller input `$VALUE`'
note: 'Validate caller input through `<type>.Validated` of a `[ValueObject<T>]` with the check in `ValidateFactoryArguments`'
