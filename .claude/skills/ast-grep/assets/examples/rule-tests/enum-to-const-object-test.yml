id: enum-to-const-object
valid:
    - | # The target form
      const Phase = { Draft: 0, Sealed: 1 } as const;
      type Phase = (typeof Phase)[keyof typeof Phase];
    - 'enum Bare { Draft, Sealed }' # Valueless member has nothing to fold
    - 'export enum Pub { Draft = 0 }' # Exported member, hand repair
    - 'declare enum Ambient { P = 1 }' # Ambient context refuses an initializer
    - 'declare namespace Item { enum Phase { P = 1 } }' # Ambient context levels above the enum, the guard walks to the root
    - 'const enum Inline { X = 1 }' # const enum has no emit
invalid:
    - 'enum Phase { Draft = 0, Sealed = 1, Retired = 2 }' # Numeric members
    - 'enum Mode { Read = "read", Write = "write" }' # String members fold the same way
