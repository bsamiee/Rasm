# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: call_expression
    any:
        - pattern: $X.flat_map(|$A| $Y.map(move |$B| ($A, $B)))
        - pattern: $X.flat_map(|$A| $Y.map(|$B| ($A, $B)))
        - pattern: $X.flat_map(|$A| $Y.map(move |$B| ($A.clone(), $B)))
        - pattern: $X.flat_map(|$A| $Y.map(|$B| ($A.clone(), $B)))
        - pattern: $X.flat_map(|$A| repeat($A).zip($Y))
        - pattern: $X.flat_map(|$A| iter::repeat($A).zip($Y))
        - pattern: $X.flat_map(|$A| std::iter::repeat($A).zip($Y))
        - pattern: $X.flat_map(|$A| core::iter::repeat($A).zip($Y))
    not:
        has:
            field: arguments
            has:
                kind: closure_expression
                has:
                    field: body
                    any:
                        - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^map$'}}, {has: {field: value, has: {stopBy: end, kind: identifier, pattern: $A}}}]}
                        - all:
                            - has: {field: function, kind: field_expression, has: {field: field, regex: '^zip$'}}
                            - has: {field: arguments, has: {stopBy: end, kind: identifier, pattern: $A}}
constraints:
    Y:
        any:
            - regex: '^[\p{XID_Continue}.&*]+(\.(clone|as_slice|as_ref)\(\))?\.(iter|into_iter|keys|values|chars|bytes)\(\)(\.(copied|cloned)\(\))?$'
            - regex: '^\(\p{Pattern_White_Space}*[\p{XID_Continue}.]+\p{Pattern_White_Space}*\.\.=?\p{Pattern_White_Space}*[\p{XID_Continue}.]+(\(\))?\p{Pattern_White_Space}*\)$'
message: '`$X` pairs each element with every element of `$Y` through a nested `flat_map`'
note: 'Call `<outer>.cartesian_product(<inner>)` (`use itertools::Itertools as _;`) over a `Clone` outer element type'
