# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
rule:
    kind: alias_qualified_name
    pattern: $NAME
    has: {field: alias, regex: '^global$'}
message: '`$NAME` uses the global namespace qualifier'
note: 'Resolve namespace and type conflicts at their owning declarations and import the required type or namespace with `using`'
