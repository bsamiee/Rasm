# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-target-framework-form
language: xml
severity: error
rule:
    pattern: _PROPERTY
    any:
        - matches: {msbuild-property-value: {name: {regex: "^TargetFramework$"}, text: {regex: ";"}}}
        - matches: {msbuild-property-value: {name: {regex: "^TargetFrameworks$"}, text: {regex: '^\s*[A-Za-z][A-Za-z0-9.-]*\s*$'}}}
          not: {has: {kind: content, regex: ';'}}
    not:
        inside:
            kind: document
            stopBy: end
            all:
                - has: {matches: {msbuild-property: {name: {regex: "^TargetFramework$"}}}, stopBy: end}
                - has: {matches: {msbuild-property: {name: {regex: "^TargetFrameworks$"}}}, stopBy: end}
transform:
    RENAMED: rewrite($PROPERTY, rewriters=[plural, singular])
fix: $RENAMED
rewriters:
    - id: plural
      rule: {kind: Name, regex: '^TargetFramework$', inside: {kind: 'STag, ETag'}}
      fix: TargetFrameworks
    - id: singular
      rule: {kind: Name, inside: {kind: 'STag, ETag', inside: {pattern: _PROPERTY}}}
      fix: TargetFramework
message: Property name disagrees with its value
note: Use `TargetFramework` for one framework and `TargetFrameworks` for a semicolon list
