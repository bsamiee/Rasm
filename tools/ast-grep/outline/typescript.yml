    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, shape]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ' +$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic:
    not:
        any:
            - kind: class_static_block
            - inside: {kind: 'method_definition, method_signature, abstract_method_signature', has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}}
---
id: typescript-member-field
language: tsxlang
role: member
parentRuleIds: [typescript-class, typescript-interface, typescript-type, typescript-constant, typescript-variable, typescript-assignment, typescript-export, typescript-function]
symbolType: field
utils:
    body-value:
        any:
            - kind: class, object
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion
              has: {matches: body-value}
    nested:
        any:
            - inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $OWNER}}, {has: {field: name, pattern: $OWNER}}]}
            - kind: class_body
              inside:
                any:
                    - {kind: class, matches: nested}
                    - kind: class_declaration, abstract_class_declaration
                      has: {field: name, pattern: $OWNER}
                      inside: {kind: statement_block, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}
    scope:
        kind: class_body
        any: [{matches: nested}, {pattern: $_}]
rule:
    any:
        - kind: public_field_definition
          pattern: $DECLARATION
          has: {field: name, pattern: $NAME}
          not: {has: {field: value, matches: body-value}}
          inside: {matches: scope}
        - kind: property_identifier, private_property_identifier, string, number, computed_property_name
          pattern: $NAME
          inside:
            kind: public_field_definition
            field: name
            pattern: $DECLARATION
            has: {field: value, matches: body-value}
            inside: {matches: scope}
        - kind: required_parameter, optional_parameter
          pattern: $DECLARATION
          has: {field: pattern, pattern: $NAME}
          any: [{has: {kind: accessibility_modifier}}, {has: {regex: '^readonly$'}}]
          inside:
            kind: formal_parameters
            inside:
                kind: method_definition
                has: {field: name, regex: '^constructor$'}
                inside: {matches: scope}
rewriters:
    - id: arrow
      rule:
        kind: arrow_function
        regex: "\n"
        all:
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {pattern: $_}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {pattern: $_}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {pattern: $_}]
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        LINE: {replace: {source: $PARAMETERS, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
      fix: $MODIFIER$GENERICS$LINE$RETURN => …
    - id: block
      rule: {kind: 'object, object_type, class_body, statement_block', regex: "\n"}
      fix: '{…}'
    - id: call
      rule: {kind: arguments, regex: "\n", not: {has: {kind: object, regex: "\n"}}}
      fix: (…)
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [arrow, block, call]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n(?s:.*?)(?:\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*([)\]}>`"'';,]*)|)$', by: …$1}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic:
    not:
        any:
            - kind: private_property_identifier
            - has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}
            - has: {field: name, kind: private_property_identifier}
            - inside: {kind: public_field_definition, has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}}
---
id: typescript-member-property
language: tsxlang
role: member
parentRuleIds: [typescript-class, typescript-interface, typescript-type, typescript-constant, typescript-variable, typescript-assignment, typescript-export, typescript-function]
symbolType: property
utils:
    owned-value:
        any:
            - inside: {kind: 'variable_declarator, export_statement, extends_clause, public_field_definition, pair', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}
            - inside: {kind: assignment_expression, field: right, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}
            - inside: {kind: export_statement, has: {regex: '^=$'}, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}
    owned-object:
        kind: object
        any:
            - matches: owned-value
            - inside: {kind: arguments, inside: {kind: call_expression, matches: owned-value}}
        not: {inside: {kind: statement_block, stopBy: end, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}
    type-body:
        any:
            - kind: interface_body
            - kind: object_type
              any:
                - inside: {kind: type_alias_declaration, field: value, stopBy: {not: {kind: 'union_type, intersection_type, parenthesized_type'}}}
                - inside: {kind: ambient_declaration}
                - inside: {kind: type_annotation, inside: {kind: property_signature, inside: {matches: type-body}}}
    nested:
        any:
            - inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $OWNER}}, {has: {field: name, pattern: $OWNER}}]}
            - inside: {kind: type_annotation, inside: {kind: property_signature, has: {field: name, pattern: $OWNER}}}
            - kind: class_body
              inside:
                any:
                    - {kind: class, matches: nested}
                    - kind: class_declaration, abstract_class_declaration
                      has: {field: name, pattern: $OWNER}
                      inside: {kind: statement_block, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}
    body:
        all:
            - any: [{kind: class_body}, {matches: type-body}, {matches: owned-object}]
            - any: [{matches: nested}, {pattern: $_}]
    typed:
        all:
            - matches: type-body
            - any: [{matches: nested}, {pattern: $_}]
    object:
        all:
            - matches: owned-object
            - any: [{matches: nested}, {pattern: $_}]
    body-value:
        any:
            - kind: class, object
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion
              has: {matches: body-value}
rule:
    any:
        - kind: method_definition, method_signature, abstract_method_signature
          pattern: $DECLARATION
          has: {field: name, pattern: $NAME, follows: {regex: '^(?:get|set)$'}}
          inside: {matches: body}
        - kind: property_signature
          pattern: $DECLARATION
          has: {field: name, pattern: $NAME}
          not: {has: {field: type, has: {kind: object_type}}}
          inside: {matches: typed}
        - kind: index_signature
          pattern: $DECLARATION
          inside: {matches: body}
          any:
            - has: {field: name, pattern: $NAME}
            - has: {kind: mapped_type_clause, pattern: $NAME}
        - kind: pair
          pattern: $DECLARATION
          has: {field: key, pattern: $NAME}
          not: {has: {field: value, matches: body-value}}
          inside: {matches: object}
        - kind: property_identifier, private_property_identifier, string, number, computed_property_name
          pattern: $NAME
          any:
            - inside: {kind: pair, field: key, pattern: $DECLARATION, has: {field: value, matches: body-value}, inside: {matches: object}}
            - inside: {kind: property_signature, field: name, pattern: $DECLARATION, has: {field: type, has: {kind: object_type}}, inside: {matches: typed}}
        - kind: shorthand_property_identifier
          pattern: $NAME
          inside: {matches: object}
        - kind: spread_element
          pattern: $DECLARATION
          inside: {matches: object}
          any:
            - {has: {kind: 'identifier, member_expression'}, pattern: $NAME}
            - all:
                - has: {regex: '^\.\.\.$', pattern: $$NAME}
                - any: [{has: {kind: call_expression, has: {field: function, not: {regex: "\n"}, pattern: $SPREAD}}}, {pattern: $_}]
        - kind: export_statement
          pattern: $DECLARATION
          inside: {matches: typed}
          any:
            - has: {field: declaration, any: [{has: {field: name, pattern: $NAME}}, {has: {kind: variable_declarator, has: {field: name, pattern: $NAME}}}]}
            - has: {field: value, pattern: $NAME}
            - has: {regex: '^export$', pattern: $$NAME}
rewriters:
    - id: body
      rule: {kind: statement_block, inside: {kind: method_definition, field: body, pattern: $DECLARATION}}
      fix: ''
    - id: arrow
      rule:
        kind: arrow_function
        regex: "\n"
        all:
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {pattern: $_}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {pattern: $_}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {pattern: $_}]
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        LINE: {replace: {source: $PARAMETERS, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
      fix: $MODIFIER$GENERICS$LINE$RETURN => …
    - id: block
      rule: {kind: 'object, object_type, class_body, statement_block', regex: "\n"}
      fix: '{…}'
    - id: call
      rule: {kind: arguments, regex: "\n", not: {has: {kind: object, regex: "\n"}}}
      fix: (…)
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, arrow, block, call]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n(?s:.*?)(?:\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*([)\]}>`"'';,]*)|)$', by: …$1}}
    SIGNATURE: {replace: {source: $LINE, replace: ' *;?$', by: ''}}
name: $QUALIFIER$NAME$SPREAD
signature: $SIGNATURE
isPublic:
    not:
        any:
            - kind: private_property_identifier
            - has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}
            - has: {field: name, kind: private_property_identifier}
            - has: {field: key, kind: private_property_identifier}
            - inside: {kind: property_signature, has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}}
---
id: typescript-enum-member
language: tsxlang
role: member
parentRuleIds: [typescript-enum]
symbolType: enumMember
rule:
    inside: {kind: enum_body}
    any:
        - kind: enum_assignment
          has: {field: name, pattern: $NAME}
        - kind: property_identifier, private_property_identifier, string, number, computed_property_name
          pattern: $NAME
name: $NAME
---
id: typescript-suite-suite
language: tsxlang
role: member
parentRuleIds: [typescript-suite]
symbolType: function
utils:
    suite:
        any:
            - kind: identifier
              regex: '^(?:describe|describeWrapped|suite|layer)$'
            - kind: member_expression
              has: {field: object, matches: suite}
            - kind: call_expression
              has: {field: function, matches: suite}
rule:
    kind: identifier, member_expression, call_expression
    matches: suite
    pattern: $CALLEE
    inside:
        kind: 'arguments > :is(arrow_function, function_expression) > statement_block > expression_statement > call_expression'
        field: function
        has:
            field: arguments
            has:
                nthChild: 1
                any:
                    - {kind: 'string, template_string', pattern: $TITLE}
                    - {pattern: $LABEL}
rewriters:
    - id: arguments
      rule: {kind: arguments, inside: {kind: call_expression, field: arguments}, has: {pattern: $_}}
      fix: (…)
transform:
    TITLED: {replace: {source: $TITLE, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    LABELED: {replace: {source: $LABEL, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    NAME: {replace: {source: $TITLED, replace: '^.(.*).$', by: $1}}
    HEAD: {rewrite: {source: $CALLEE, rewriters: [arguments]}}
name: $NAME$LABELED
signature: $HEAD($TITLED$LABELED)
---
id: typescript-suite-case
language: tsxlang
role: member
parentRuleIds: [typescript-suite]
symbolType: method
utils:
    case:
        any:
            - kind: identifier
              regex: '^(?:test|it)$'
            - kind: identifier
              pattern: $RUNNER
              inside:
                kind: arrow_function, function_expression
                stopBy: end
                any:
                    - has: {field: parameter, pattern: $RUNNER}
                    - has: {field: parameters, has: {kind: required_parameter, nthChild: 1, has: {field: pattern, pattern: $RUNNER}}}
            - kind: member_expression
              has: {field: object, matches: case}
            - kind: call_expression
              has: {field: function, matches: case}
    title:
        has:
            field: arguments
            has:
                nthChild: 1
                any:
                    - {kind: 'string, template_string', pattern: $TITLE}
                    - {pattern: $LABEL}
    owner:
        inside:
            kind: expression_statement
            inside:
                kind: statement_block
                inside:
                    kind: arrow_function, function_expression
                    inside:
                        kind: arguments
                        inside:
                            kind: call_expression
                            all:
                                - inside: {kind: expression_statement, inside: {kind: statement_block}}
                                - has:
                                    field: arguments
                                    has:
                                        nthChild: 1
                                        any:
                                            - {kind: 'string, template_string', not: {regex: "\n"}, pattern: $OWNER}
                                            - {not: {regex: "\n"}, pattern: $ENCLOSING}
rule:
    kind: 'arguments > :is(arrow_function, function_expression) > statement_block > expression_statement > call_expression'
    all:
        - has: {field: function, matches: case, pattern: $CALLEE}
        - matches: title
        - any: [{matches: owner}, {pattern: $_}]
rewriters:
    - id: arguments
      rule: {kind: arguments, inside: {kind: call_expression, field: arguments}, has: {pattern: $_}}
      fix: (…)
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '^.(.*).$', by: $1.}}
    QUALIFIED: {replace: {source: $ENCLOSING, replace: $, by: .}}
    TITLED: {replace: {source: $TITLE, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    LABELED: {replace: {source: $LABEL, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    NAME: {replace: {source: $TITLED, replace: '^.(.*).$', by: $1}}
    HEAD: {rewrite: {source: $CALLEE, rewriters: [arguments]}}
name: $QUALIFIER$QUALIFIED$NAME$LABELED
signature: $HEAD($TITLED$LABELED)
