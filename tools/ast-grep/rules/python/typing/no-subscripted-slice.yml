# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
files: ['{apps/blender,libs/python/blender,libs/python/data/records}/**', 'eng/python/rasm_eng/_{probe,session,streams}.py']
rule:
    matches: {python-evaluated-subscript: {value: {pattern: $G, matches: {python-builtin-name: {name: {regex: '^slice$'}}}}}}
message: '`$G` has no `__class_getitem__` below Python 3.15 and raises `TypeError` when subscripted'
note: 'Annotate `slice` unsubscripted or through `type <Alias> = slice[<args>]`'
