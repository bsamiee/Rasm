# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-line-type-suppression
language: python
severity: error
files: ['.claude/skills/*/scripts/**', 'tools/interface/**']
rule:
    kind: comment
    regex: '^#\s*((type|ty|pyright|ruff):\s*ignore|noqa)\b'
    any:
        - follows: {stopBy: end, not: {kind: comment}}
        - not: {inside: {kind: module}}
message: 'Checker suppression sits on one line of a host or skill script'
note: 'Use the file-top `# ty: ignore[<code>]`, `# mypy: disable-error-code="<code>"`, or `# ruff: file-ignore[<name>]` directive, one list holds the script''s exemptions'
