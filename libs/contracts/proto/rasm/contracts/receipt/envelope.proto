syntax = "proto3";

package rasm.contracts.receipt;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "rasm/contracts/clock/hlc.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

// The producing package, a closed mirror of the kernel `TelemetrySource` roster. A package minted there with no
// row here refuses at the projection rather than crossing unattributed.
enum Package {
  PACKAGE_UNSPECIFIED = 0;
  PACKAGE_KERNEL = 1;
  PACKAGE_ELEMENT = 2;
  PACKAGE_APP_HOST = 3;
  PACKAGE_MATERIALS = 4;
  PACKAGE_BIM = 5;
  PACKAGE_FABRICATION = 6;
  PACKAGE_PERSISTENCE = 7;
  PACKAGE_COMPUTE = 8;
  PACKAGE_GENERATION = 9;
  PACKAGE_APP_UI = 10;
  PACKAGE_RHINO = 11;
  PACKAGE_GRASSHOPPER = 12;
}

// --- [HEADER] -----------------------------------------------------------------------------

// `tenant` is the 16 big-endian content-key bytes; `slug` is the human label that keys nothing.
message TenantContextWire {
  bytes tenant = 1 [(buf.validate.field).bytes.len = 16];
  string slug = 2 [(buf.validate.field).string.min_len = 1];
}

// The receipt spine every producing package composes beside its OWN closed receipt family — the header carries
// what every receipt has and nothing about what any one carries, so no payload slot and no kind key seat here.
// A composing message pairs this header with a `oneof` over its package's families, which is what makes the
// payload compiler-exhaustive at the composition site and the producing package derivable from the arm.
message ReceiptHeaderWire {
  bytes correlation = 1 [(buf.validate.field).bytes.len = 16];
  TenantContextWire tenant = 2 [(buf.validate.field).required = true];
  Package package = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  rasm.contracts.clock.Hlc stamp = 4 [(buf.validate.field).required = true];
  google.protobuf.Duration skew_bound = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
}
