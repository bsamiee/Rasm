# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-filter-by-membership
language: tsx
severity: error
ignores: ['plugins/function-hooks/**', '.codex/hooks/**']
utils:
    collection:
        matches: {effect-module: {name: {regex: '\b(Array|Chunk|HashSet)$'}}}
    membership:
        kind: call_expression
        any:
            - pattern: $SET.has($SEEN, $X)
              has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\bHashSet$'}}}}}
            - pattern: $LIST.contains($SEEN, $X)
              has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\b(Array|Chunk|Iterable)$'}}}}}
            - pattern: $SEEN.has($X)
            - pattern: $SEEN.includes($X)
    predicate:
        kind: arrow_function
        all:
            - has: {field: parameters, has: {kind: required_parameter, nthChild: 1, has: {field: pattern, kind: identifier, pattern: $X}}, not: {has: {nthChild: 2}}}
            - has: {field: body, any: [{matches: membership}, {pattern: '!$INNER', has: {matches: membership}}]}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^filter$'}}
        - any:
            - all:
                - has: {field: function, has: {field: object, matches: collection, pattern: $MODULE}}
                - has: {field: arguments, pattern: $ARGS, has: {matches: predicate, pattern: $FN, nthChild: {position: 1, reverse: true}}}
            - all:
                - pattern: $KEPT
                - has: {field: function, has: {field: object, not: {matches: collection}}}
                - has: {field: arguments, has: {matches: predicate, nthChild: 1}, not: {has: {nthChild: 2}}}
constraints:
    SEEN: {not: {any: [{kind: identifier, pattern: $X}, {has: {stopBy: end, kind: identifier, pattern: $X}}]}}
rewriters:
    - id: other
      rule: {kind: arrow_function}
      fix: $SEEN
    - id: absent
      rule: {kind: arrow_function, has: {field: body, pattern: '!$_'}}
      fix: difference
    - id: present
      rule: {kind: arrow_function}
      fix: intersection
transform:
    QUALIFIER: replace($MODULE, replace='^(.+)$', by='$1.')
    OPERATION: rewrite($FN, rewriters=[absent, present])
    OPERANDS: rewrite($ARGS, rewriters=[other])
fix: $QUALIFIER$OPERATION$OPERANDS$KEPT
message: '`filter` tests each element for membership in `$SEEN` by hand'
note: '`difference` of `Array`, `Chunk`, or `HashSet` keeps the elements absent from `<seen>` and `intersection` those present, each comparing by `Equal` in one call'
