# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
files: ['libs/**/rhino/**']
utils:
    host-name:
        kind: identifier
        regex: |-
            (?x)^(Custom(Brep|Curve|Mesh|Point)Object|CustomObjectGrips|UserData|UserDictionary|EtoCollapsibleSection3?
            |CollapsibleSection|ObjectPropertiesPage|PostEffect|VisualAnalysisMode|ObjectManagerExtension|UICommand|FactoryBase
            |RenderContent|RenderMaterial|RenderTexture|TwoColorRenderTexture|RenderEnvironment|RenderMeshProvider
            |CustomRenderMeshProvider2?|RealtimeDisplayMode|RealtimeDisplayModeClassInfo|LightManagerSupport|Skin|PlugIn
            |FileImportPlugIn|FileExportPlugIn|RenderPlugIn|DigitizerPlugIn|Command|SelCommand|TransformCommand)$
    rhino-root:
        any:
            - kind: identifier
              regex: '^Rhino$'
            - kind: alias_qualified_name
              has: {field: name, regex: '^Rhino$'}
            - kind: qualified_name
              has: {field: qualifier, matches: rhino-root}
    host-type:
        pattern: $HOST
        any:
            - matches: host-name
            - kind: alias_qualified_name
              has: {field: name, matches: host-name}
            - kind: qualified_name
              all: [{has: {field: qualifier, kind: qualified_name, matches: rhino-root}}, {has: {field: name, matches: host-name}}]
    first-base:
        nthChild: 1
        inside: {kind: base_list}
    host-base:
        any:
            - matches: host-type
            - kind: identifier
              pattern: $BASE
              inside:
                kind: compilation_unit
                stopBy: end
                has:
                    stopBy: end
                    any:
                        - kind: using_directive
                          all:
                            - has: {field: name, pattern: $BASE}
                            - has: {nthChild: 2, matches: host-type}
                        - kind: class_declaration
                          all:
                            - has: {field: name, pattern: $BASE}
                            - has: {kind: base_list, has: {matches: first-base, all: [{matches: host-type}]}}
rule:
    kind: class_declaration
    all:
        - has: {field: name, pattern: $NAME}
        - not: {has: {kind: modifier, regex: '^abstract$'}}
        - not: {has: {kind: parameter_list, has: {kind: parameter}}}
        - not:
            all:
                - has: {kind: declaration_list, has: {kind: constructor_declaration, has: {kind: parameter_list, has: {kind: parameter}}}}
                - not: {has: {kind: declaration_list, has: {kind: constructor_declaration, has: {kind: parameter_list, not: {has: {kind: parameter}}}}}}
        - has: {kind: base_list, has: {matches: first-base, all: [{matches: host-base}]}}
message: 'Library class `$NAME` derives from `$HOST` and stays instantiable'
note: 'Declare `<name>` `abstract` and give its application subclass the public parameterless constructor Rhino calls'
