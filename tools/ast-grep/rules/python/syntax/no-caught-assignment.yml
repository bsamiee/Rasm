# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-caught-assignment
language: python
severity: error
utils:
    rejection:
        kind: identifier
        regex: '^(TypeError|ValueError|AttributeError|KeyError|RuntimeError)$'
    written-value:
        any:
            - kind: 'identifier, integer, float, true, false, none'
            - kind: 'string, concatenated_string'
              not: {has: {stopBy: end, kind: interpolation}}
            - kind: 'unary_operator, tuple, list'
              not: {has: {stopBy: end, kind: 'attribute, subscript, call'}}
    member-write:
        kind: expression_statement
        pattern: $WRITE
        any:
            - has:
                kind: assignment
                all:
                    - has: {field: left, kind: attribute, not: {has: {stopBy: end, kind: 'subscript, call'}}}
                    - has: {field: right, matches: written-value}
            - has:
                kind: call
                all:
                    - has: {field: function, kind: identifier, regex: '^setattr$'}
                    - has: {field: arguments, has: {nthChild: 3, matches: written-value}}
    sole-write:
        kind: block
        all:
            - has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: member-write}
            - not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    suppress-callee:
        any:
            - {kind: identifier, regex: '^suppress$'}
            - {kind: attribute, regex: '^contextlib\.suppress$'}
rule:
    any:
        - kind: try_statement
          all:
            - has: {field: body, matches: sole-write}
            - has: {kind: except_clause, has: {stopBy: {kind: block}, matches: rejection}}
            - not: {has: {kind: 'except_clause, else_clause, finally_clause', has: {stopBy: end, kind: raise_statement}}}
            - not: {has: {kind: except_clause, has: {kind: block, not: {has: {not: {kind: 'pass_statement, continue_statement, comment'}}}}}}
        - kind: with_statement
          all:
            - has: {kind: with_clause, not: {has: {nthChild: 2}}, has: {kind: with_item, has: {kind: call, all: [{has: {field: function, matches: suppress-callee}}, {has: {field: arguments, has: {matches: rejection}}}]}}}
            - has: {field: body, matches: sole-write}
message: '`$WRITE` catches its own error to test whether its target accepts the value'
note: 'Check the value against what its owner declares before writing, `bl_rna.properties[<name>]` (`enum_items`, `hard_min`, `hard_max`, `is_readonly`) for a Blender property and `<enum>.__members__.get(<name>)` for an enum name, a checked write states the value it keeps'
