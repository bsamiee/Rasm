# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-default-value
language: rustlang
rule:
    any:
        - kind: 'call_expression, scoped_identifier'
          regex: '^(\p{XID_Continue}+::)*([A-Z]\p{XID_Continue}*(::<[^>]*>)?::default|(String|Vec|VecDeque|BTreeMap|BTreeSet|HashMap|HashSet|BinaryHeap|LinkedList|OsString|PathBuf)(::<.*>)?::new)(\(\))?$'
        - kind: integer_literal
          regex: '^0+(_?[iu](8|16|32|64|128|size))?$'
        - kind: float_literal
          regex: '^0+\.0*(_?f(32|64))?$'
        - kind: macro_invocation
          regex: '^vec!\p{Pattern_White_Space}*(\(\p{Pattern_White_Space}*\)|\[\p{Pattern_White_Space}*\]|\{\p{Pattern_White_Space}*\})$'
        - kind: closure_expression
          all:
            - has: {field: parameters, regex: '^\|\p{Pattern_White_Space}*(_\p{XID_Continue}*)?\p{Pattern_White_Space}*\|$'}
            - has: {field: body, matches: rust-default-value}
