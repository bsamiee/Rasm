# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-java
language: java
severity: error
utils:
    boundary: {any: [{matches: java-control-flow}, {matches: java-function-boundary}]}
rule:
    matches: java-control-flow
    pattern: $SCOPE
    inside:
        matches: java-control-flow
        stopBy: {matches: boundary}
        inside:
            matches: java-control-flow
            stopBy: {matches: boundary}
            inside:
                matches: java-control-flow
                stopBy: {matches: boundary}
                not: {inside: {matches: java-control-flow, stopBy: {matches: java-function-boundary}}}
message: Control flow reaches a fourth nesting level
note: 'Rebuild nested decisions or loops as a `switch` or a stream pipeline over their inputs'
labels:
    SCOPE: {style: primary}
