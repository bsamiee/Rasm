# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: no-native-timer
language: typescript
severity: error
ignores: ['.claude/plugins/**'] # The plugin loader accepts no package import, Effect.sleep and Schedule have no place there
rule:
    kind: call_expression
    has: # The callee as written, bare or through globalThis, a member of the same name on another object belongs to that object
        field: function
        pattern: $NAME
        regex: '^(globalThis\.)?(setTimeout|setInterval|setImmediate|queueMicrotask|clearTimeout|clearInterval|clearImmediate)$'
message: '`$NAME` schedules work through the host timer outside the effect runtime'
note: >-
    Schedule through the runtime, `Effect.sleep(duration)`, `Effect.repeat(effect, Schedule.spaced(duration))`, `Effect.yieldNow()`,
    and interrupt the fiber to cancel
