# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-last-segment-by-index
language: tsx
severity: error
ignores: ['.claude/workflows/*.js']
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^(slice|substring|substr)$'}}
        - has: {field: arguments, all: [{has: {nthChild: 1, kind: binary_expression}}, {not: {has: {nthChild: 2}}}]}
        - pattern: $S.$_METHOD($S.lastIndexOf($SEP) + 1)
    not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
message: '`$S` reads its last `$SEP` segment by index'
note: 'Call `Array.lastNonEmpty(String.split(<text>, <separator>))`'
