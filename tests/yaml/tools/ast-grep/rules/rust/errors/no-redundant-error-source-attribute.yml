id: no-redundant-error-source-attribute
valid:
    - |
      #[derive(Debug, thiserror::Error)]
      #[error("parse")]
      struct ParseFailure {
          #[source]
          cause: std::num::ParseIntError,
      }
    - |
      #[derive(Debug, thiserror::Error)]
      enum Failure {
          #[error("io")]
          Io(#[from] std::io::Error),
      }
invalid:
    - |
      #[derive(Debug, thiserror::Error)]
      enum Failure {
          #[error("io")]
          Io(#[from] #[source] std::io::Error),
      }
    - |
      #[derive(Debug, thiserror::Error)]
      #[error("parse")]
      struct ParseFailure {
          #[source]
          source: std::num::ParseIntError,
      }
    - |
      #[derive(Debug, thiserror::Error)]
      enum Failure {
          #[error("io")]
          Io {
              #[source]
              // read failure
              #[from]
              cause: std::io::Error,
          },
      }
