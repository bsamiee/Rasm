# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    owner-name:
        has: {field: name, any: [{kind: type_identifier, pattern: $OWNER}, {has: {kind: type_identifier, nthChild: 1, pattern: $OWNER}}]}
rule:
    kind: typealias_declaration
    has: {field: name, kind: type_identifier, pattern: $ALIAS}
    any:
        - inside: {kind: 'source_file, statements'}
        - inside:
            kind: 'class_body, enum_class_body'
            inside:
                kind: class_declaration
                all:
                    - not: {has: {kind: inheritance_specifier}}
                    - matches: owner-name
                    - not:
                        inside:
                            kind: source_file
                            stopBy: end
                            has:
                                stopBy: end
                                kind: class_declaration
                                all:
                                    - has: {kind: inheritance_specifier}
                                    - matches: owner-name
        - inside: {kind: protocol_body, inside: {kind: protocol_declaration, not: {has: {kind: inheritance_specifier}}}}
message: '`$ALIAS` is another name for its type'
note: 'Spell the type at each use or declare a type holding its fields, and delete the alias'
