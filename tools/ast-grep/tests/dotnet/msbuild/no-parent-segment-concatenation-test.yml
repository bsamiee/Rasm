id: no-parent-segment-concatenation
valid:
    - '<PropertyGroup><ToolRoot>prefix</ToolRoot><ToolPath>$(ToolRoot)../file</ToolPath></PropertyGroup>'
    - '<Message Text="$(MSBuildThisFileDirectory)/../path" />'
    - '<Exec Command="echo $(MSBuildThisFileDirectory)/../path" />'
    - '<PropertyGroup Label="$(MSBuildThisFileDirectory)/../path"><Description>$(MSBuildThisFileDirectory)/../path</Description></PropertyGroup>'
    - |
      <PropertyGroup><RepositoryRoot>$([MSBuild]::NormalizeDirectory('$(MSBuildThisFileDirectory)', '..', '..'))</RepositoryRoot></PropertyGroup>
    - |
      <ProjectReference Include="../../../../libs/dotnet/interop/Item/Item.csproj" />
    - |
      <PropertyGroup><_OuterPath>$([MSBuild]::GetPathOfFileAbove('Directory.Build.props', '$(MSBuildThisFileDirectory)../'))</_OuterPath></PropertyGroup>
    - |
      <PropertyGroup><ToolPath>$(ToolRoot)/.hidden/item</ToolPath></PropertyGroup>
invalid:
    - |
      <PropertyGroup><StageRoot>$(MSBuildThisFileDirectory)../../../.artifacts/native/item/stage/</StageRoot></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$(MSBuildThisFileDirectory)../../.artifacts/native/msbuild</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><VcpkgManifest>$(MSBuildProjectDirectory)/../manifests/extensions.json</VcpkgManifest></PropertyGroup>
    - |
      <Import Project="$(MSBuildThisFileDirectory)../../build/common.props" />
    - |
      <Import Project="$(MSBuildThisFileDirectory)..\..\build\common.props" />
    - |
      <Import Project='$(MSBuildThisFileDirectory)../../build/common.props' />
    - |
      <PropertyGroup><StageRoot>
        $(MSBuildThisFileDirectory)../.artifacts/native/stage/
      </StageRoot></PropertyGroup>
    - |
      <PropertyGroup><Roots>$(MSBuildThisFileDirectory)../a;$(MSBuildThisFileDirectory)../b</Roots></PropertyGroup>
    - |
      <Compile Include="$(MSBuildProjectDirectory)/../shared/**/*.cs" />
    - |
      <PropertyGroup><ToolPath>$(MSBuildThisFileDirectory)../tools/$(ToolName)/tool.exe</ToolPath></PropertyGroup>
    - |
      <PropertyGroup><ToolPath>$([System.IO.Path]::Combine('$(MSBuildThisFileDirectory)../tools', 'tool.exe'))</ToolPath></PropertyGroup>
    - |
      <None Include="@(Asset->'$(MSBuildThisFileDirectory)../%(Filename)%(Extension)')" />
    - |
      <PropertyGroup><DeepRoot>$(MSBuildThisFileDirectory)../a/b/c/d/e/f/g/h/i/j/k</DeepRoot></PropertyGroup>
    - |
      <PropertyGroup><ParentDir>$(MSBuildThisFileDirectory)../</ParentDir></PropertyGroup>
    - |
      <Compile Include='$(MSBuildProjectDirectory)/../shared/item.cs' />
    - |
      <PropertyGroup><Root>$(MSBuildThisFileDirectoryNoRoot)../item</Root></PropertyGroup>
