        - {kind: type_identifier, all: [{inside: {kind: trait_item, field: name, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {inside: {stopBy: end, kind: trait_item}}, {matches: declaration}]}}, {pattern: {context: 'struct $NAME;', selector: type_identifier}}]}
