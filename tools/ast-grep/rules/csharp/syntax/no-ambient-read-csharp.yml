# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-ambient-read-csharp
language: csharp
severity: error
rule:
    pattern: $READ
    any:
        - kind: member_access_expression
          regex: '^((global::)?System\.)?(DateTime(Offset)?\.(Utc)?Now|DateTime\.Today|Environment\.TickCount(64)?)$'
        - kind: member_access_expression
          regex: '^((global::)?NodaTime\.)?SystemClock\.Instance$'
        - kind: invocation_expression
          has: {field: function, regex: '^((global::)?System\.)?(Diagnostics\.)?Stopwatch\.(StartNew|GetTimestamp)$'}
        - kind: invocation_expression
          all:
            - has: {field: function, regex: '^((global::)?System\.)?(Diagnostics\.)?Stopwatch\.GetElapsedTime$'}
            - not: {has: {field: arguments, has: {kind: argument, nthChild: 2}}}
        - kind: object_creation_expression
          has: {field: type, regex: '^((global::)?System\.)?(Diagnostics\.)?Stopwatch$'}
message: '`$READ` reads the host clock as an ambient value'
note: 'Take the clock as a `TimeProvider` argument and read `GetUtcNow()`, `GetTimestamp()`, and `GetElapsedTime(start)` from it, the composition root alone names `TimeProvider.System`'
