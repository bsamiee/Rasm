# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-printf-into-pipeline
language: bash
severity: error
utils:
    parameter: {matches: {bash-parameter-string: {name: {any: [{kind: variable_name}, {kind: subscript}]}}}}
rule:
    kind: pipeline
    all:
        - has: {matches: {bash-parameter-writer: {value: {matches: parameter, pattern: $IN}}}}
        - not: {has: {kind: command, has: {regex: '^["'']%s["'']$'}}} # A bare %s writes no newline, and the here string appends one
        # The second of two stages is the reader when it is no writer itself, so the writer is the first, and the grammar reads
        # no here string after a group
        - has: {nthChild: 2, pattern: $READER, not: {any: [{matches: {bash-parameter-writer: {value: {matches: parameter}}}}, {kind: compound_statement}]}}
        - not: {has: {nthChild: 3}} # A third stage keeps the pipeline, the here string feeds one command
fix: $READER <<<$IN
message: The pipeline forks a process to write `$IN` into the next command
note: 'Feed the parameter by a here string, `<command> <<<"$<name>"`, which appends the newline printf `%s\n` wrote'
