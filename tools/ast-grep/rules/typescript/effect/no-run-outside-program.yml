# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsx
severity: error
rule:
    pattern: $RUN
    any:
        - matches: { typescript-import-reference: { source: { regex: &platform '^@effect/platform-[a-z]+(/|$)' }, exported: { regex: '^runMain$' } } }
        - kind: member_expression
          all:
              - has: { field: property, regex: '^runMain$' }
              - has: { field: object, matches: { typescript-import-reference: { source: { regex: *platform }, exported: { regex: 'Runtime$' } } } }
    not:
        any:
            - inside:
                  stopBy: end
                  field: consequence
                  kind: if_statement
                  has: { field: condition, kind: parenthesized_expression, has: { pattern: import.meta.main } }
                  inside: { kind: program }
            - inside:
                  stopBy: end
                  kind: expression_statement
                  inside: { kind: program, not: { has: { kind: export_statement } } }
            - inside: { kind: import_specifier }
message: '`$RUN` runs outside a program entry point, call `runMain` in a top-level statement of a module exporting nothing, or inside a top-level `if (import.meta.main)` block'
