# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-absolute-path-in-item
language: xml
severity: error
rule:
    kind: AttValue
    # A drive letter, a home directory, or a root directory opens the value
    regex: '^"([A-Za-z]:[\\/]|~[\\/]|/[A-Za-z0-9_.-])'
    inside: {kind: Attribute, has: {kind: Name, regex: '^(Include|Exclude|Update|Remove|Project|Path|HintPath|SourceFiles|DestinationFiles|DestinationFolder|Directories|Files|File|Inputs|Outputs|WorkingDirectory)$'}}
message: An item or import names a path that exists on one machine and fails elsewhere with MSB4019 or MSB3245, compose the path from $(MSBuildThisFileDirectory) with NormalizePath or read an installation root from a property with an environment override
