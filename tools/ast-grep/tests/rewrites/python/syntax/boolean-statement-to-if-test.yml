id: boolean-statement-to-if
valid:
    # The if statement the rewrite writes
    - |
      if not filesystem.exists(bucket):
          filesystem.call_s3("create_bucket", Bucket=bucket)
    # Right operand that is a name, ruff useless-expression reports it
    - |
      ready and started
    # Boolean operator bound to a name
    - |
      value = found or load(path)
    # Multi-line statement in parentheses, the effect keeps a column the template cannot lower
    - |
      (
          filesystem.exists(bucket)
          or filesystem.call_s3("create_bucket", Bucket=bucket)
      )
    # Assertion over a boolean operator, the value is tested
    - |
      assert ready and started(item)
invalid:
    # The instance, the or form with a call on the right
    - |
      filesystem.exists(bucket) or filesystem.call_s3("create_bucket", Bucket=bucket)
    # The and form
    - |
      ready and start(item)
    # Boolean tests under the or form take parentheses
    - |
      ready and armed or start(item)
    # Parentheses on one line, the join drops them
    - |
      (ready and start(item))
    # Statement inside a def, the body indents under the if
    - |
      def dispatch(item, ready):
          ready and start(item)
    # Awaited effect
    - |
      async def run():
          ready or await start(item)
