# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-promise-outside-boundary
language: tsx
severity: error
ignores: ['plugins/function-hooks/**', '.codex/hooks/**']
utils:
    nx-type-declaration:
        any:
            - kind: type_alias_declaration, interface_declaration, enum_declaration, class_declaration, abstract_class_declaration, internal_module
              has: {field: name, pattern: $NX_TYPE}
            - kind: export_statement, expression_statement
              has: {matches: nx-type-declaration}
    nx-shadowed-type:
        kind: type_identifier, identifier
        pattern: $NX_TYPE
        inside:
            stopBy: end
            any:
                - kind: statement_block, program
                  has: {matches: nx-type-declaration}
                - kind: function_declaration, function_expression, arrow_function, method_definition, class, class_declaration, abstract_class_declaration
                  has: {field: type_parameters, has: {kind: type_parameter, has: {field: name, pattern: $NX_TYPE}}}
    nx-imported-type:
        any:
            - kind: type_identifier
              pattern: $NX_TYPE
              not: {matches: nx-shadowed-type}
              inside:
                kind: program
                stopBy: end
                has:
                    kind: import_statement
                    all:
                        - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^(@nx/devkit|nx/src/project-graph/plugins)$'}}
                        - has:
                            kind: import_clause
                            has:
                                kind: named_imports
                                has:
                                    kind: import_specifier
                                    all:
                                        - has: {field: name, matches: nx-exported-type}
                                        - has: {kind: identifier, pattern: $NX_TYPE, nthChild: {position: 1, reverse: true, ofRule: {kind: identifier}}}
            - kind: nested_type_identifier
              all:
                - has: {field: name, matches: nx-exported-type}
                - has: {field: module, kind: identifier, pattern: $NX_MODULE, not: {any: [{matches: syntax-shadowed-import}, {matches: nx-shadowed-type}]}}
                - inside:
                    kind: program
                    stopBy: end
                    has:
                        kind: import_statement
                        all:
                            - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^(@nx/devkit|nx/src/project-graph/plugins)$'}}
                            - has: {kind: import_clause, has: {kind: namespace_import, has: {kind: identifier, pattern: $NX_MODULE}}}
    nx-exported-type:
        regex: '^(CreateNodes(Function)?(V2)?|CreateDependencies|CreateMetadata|PreTasksExecution|PostTasksExecution)$'
    nx-type:
        any:
            - matches: nx-imported-type
            - kind: generic_type
              has: {field: name, matches: nx-imported-type}
    nx-typed-value:
        any:
            - kind: variable_declarator
              has: {field: type, kind: type_annotation, has: {matches: nx-type}}
            - kind: satisfies_expression
              has: {nthChild: 2, matches: nx-type}
    nx-tuple-callback:
        any:
            - kind: arrow_function, function_expression
            - matches: syntax-expression-wrapper
        nthChild: {position: 2, ofRule: {not: {kind: comment}}}
        inside:
            kind: array
            inside:
                matches: nx-typed-value
                stopBy: {not: {matches: syntax-expression-wrapper}}
    nx-boundary:
        kind: arrow_function, function_expression
        any:
            - inside:
                matches: nx-typed-value
                stopBy: {not: {matches: syntax-expression-wrapper}}
            - matches: nx-tuple-callback
            - inside:
                matches: nx-tuple-callback
                stopBy: {not: {matches: syntax-expression-wrapper}}
    host-import:
        kind: call_expression
        has: {field: function, kind: import}
    run-promise:
        kind: call_expression
        has:
            field: function
            any:
                - matches: {syntax-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^(runPromise|runPromiseExit)$'}}}
                - kind: member_expression
                  all:
                    - has: {field: object, matches: effect-effect-module}
                    - has: {field: property, regex: '^(runPromise|runPromiseExit)$'}
    main-entry:
        any:
            - not: {inside: {matches: syntax-function-boundary, stopBy: end}}
            - inside:
                matches: syntax-function-boundary
                stopBy: {matches: syntax-function-boundary}
                any:
                    - has: {field: name, regex: '^main$'}
                    - inside: {kind: variable_declarator, has: {field: name, regex: '^main$'}}
    promise-call:
        kind: call_expression
        has:
            field: function
            any:
                - matches: {syntax-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^(promise|tryPromise)$'}}}
                - kind: member_expression
                  all:
                    - has: {field: object, matches: effect-effect-module}
                    - has: {field: property, regex: '^(promise|tryPromise)$'}
    conversion-boundary:
        any:
            - kind: arrow_function, function_expression
              any:
                - inside: {stopBy: {not: {matches: syntax-expression-wrapper}}, kind: arguments, inside: {matches: promise-call}}
                - inside:
                    stopBy: {not: {matches: syntax-expression-wrapper}}
                    kind: pair
                    field: value
                    has: {field: key, regex: '^(try|"try"|''try'')$'}
                    inside: {kind: object, inside: {kind: arguments, inside: {matches: promise-call}}}
            - kind: method_definition
              has: {field: name, regex: '^(try|"try"|''try'')$'}
              inside: {kind: object, inside: {kind: arguments, inside: {matches: promise-call}}}
            - matches: syntax-function-boundary
              inside: {matches: conversion-boundary, stopBy: {matches: syntax-function-boundary}}
            - kind: generator_function
              inside:
                kind: parenthesized_expression
                inside:
                    kind: call_expression
                    field: function
                    inside:
                        kind: arguments
                        inside:
                            kind: call_expression
                            has:
                                field: function
                                any:
                                    - matches: {syntax-import-reference: {source: {regex: '^effect/Stream$'}, exported: {regex: '^fromAsyncIterable$'}}}
                                    - kind: member_expression
                                      all:
                                        - has: {field: object, matches: {effect-module: {name: {regex: '\bStream$'}}}}
                                        - has: {field: property, regex: '^fromAsyncIterable$'}
    promise-boundary:
        any:
            - matches: nx-boundary
            - matches: conversion-boundary
    global-receiver: {matches: syntax-global-reference, regex: '^(globalThis|window|self)(\.(globalThis|window|self))*$'}
    promise-constructor:
        any:
            - {matches: syntax-global-reference, regex: '^Promise$'}
            - kind: member_expression
              all:
                - has: {field: object, matches: global-receiver}
                - has: {field: property, regex: '^Promise$'}
            - kind: subscript_expression
              all:
                - has: {field: object, matches: global-receiver}
                - has: {field: index, kind: string, regex: '^[''"]Promise[''"]$'}
            - matches: syntax-expression-wrapper
              has: {matches: promise-constructor}
    promise-combinator:
        any:
            - kind: member_expression
              all:
                - has: {field: object, matches: promise-constructor}
                - has: {field: property, regex: '^(all|allSettled|any|race|resolve|reject|withResolvers|try)$'}
            - kind: subscript_expression
              all:
                - has: {field: object, matches: promise-constructor}
                - has: {field: index, kind: string, regex: '^[''"](all|allSettled|any|race|resolve|reject|withResolvers|try)[''"]$'}
            - matches: syntax-expression-wrapper
              has: {matches: promise-combinator}
    fetch-callee:
        any:
            - {matches: syntax-global-reference, regex: '^fetch$'}
            - kind: member_expression
              all:
                - has: {field: object, matches: global-receiver}
                - has: {field: property, regex: '^fetch$'}
            - kind: subscript_expression
              all:
                - has: {field: object, matches: global-receiver}
                - has: {field: index, kind: string, regex: '^[''"]fetch[''"]$'}
            - matches: syntax-expression-wrapper
              has: {matches: fetch-callee}
rule:
    all:
        - any:
            - kind: await_expression
              has: {pattern: $PROMISE}
              not:
                any:
                    - has: {matches: host-import}
                    - all: [{matches: main-entry}, {has: {matches: run-promise}}]
                    - has: {kind: call_expression, has: {field: function, any: [{matches: fetch-callee}, {matches: promise-combinator}]}}
                    - has: {kind: new_expression, has: {field: constructor, matches: promise-constructor}}
            - kind: for_in_statement
              all:
                - has: {regex: '^await$'}
                - has: {field: right, pattern: $PROMISE}
            - kind: call_expression
              has: {field: function, matches: fetch-callee, pattern: $PROMISE}
            - kind: new_expression
              has: {field: constructor, pattern: $PROMISE, matches: promise-constructor}
            - kind: call_expression
              has:
                field: function
                pattern: $PROMISE
                matches: promise-combinator
        - not: {inside: {stopBy: {matches: syntax-function-boundary}, matches: promise-boundary}}
message: '`$PROMISE` runs as a promise outside a host or promise conversion callback'
note: 'Native Nx plugin callbacks imported from their owning package return promises to Nx. `Effect.tryPromise(() => <promise>)` converts other awaited promises, `Effect.callback` replaces `new Promise`, `Effect.all` replaces `Promise.all` and with `mode: "result"` `allSettled`, `Effect.raceAll` and `Effect.race` replace `race` and `any`, `Effect.succeed`, `Effect.fail`, `Deferred.make`, and `Effect.try` replace `resolve`, `reject`, `withResolvers`, and `try`, `HttpClient` replaces `fetch`, and `Stream.fromAsyncIterable` reads an async iterable, each keeping the failure typed'
