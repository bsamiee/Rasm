id: javascript-include
language: javascript
role: item
symbolType: module
rule:
    kind: comment
    regex: '^//@include\s'
    pattern: $DIRECTIVE
transform:
    NAME: {replace: {source: $DIRECTIVE, replace: '^//@include\s+["'']?([^"'']*)["'']?\s*$', by: '$1'}}
name: $NAME
isImport: true
isExported: false

---
id: javascript-function
language: javascript
role: item
symbolType: function
rule:
    kind: function_declaration
    has: {field: name, pattern: $NAME}
name: $NAME
isExported: false

---
id: javascript-function-declarator
language: javascript
role: item
symbolType: function
rule:
    kind: variable_declarator
    inside: {kind: variable_declaration}
    all:
        - has: {field: name, kind: identifier, pattern: $NAME}
        - has: {field: value, kind: 'function_expression, arrow_function'}
name: $NAME
isExported: false

---
id: javascript-variable
language: javascript
role: item
symbolType: variable
rule:
    kind: variable_declarator
    inside:
        kind: variable_declaration
        inside:
            any:
                - kind: program
                - {kind: statement_block, inside: {kind: 'function_expression, arrow_function', field: body}}
    has: {field: name, kind: identifier, pattern: $NAME}
    not: {has: {field: value, kind: 'function_expression, arrow_function'}}
name: $NAME
isExported: false

---
id: javascript-property-assignment
language: javascript
role: item
symbolType: property
rule:
    kind: assignment_expression
    inside: {kind: expression_statement}
    has: {field: left, kind: member_expression, pattern: $NAME}
name: $NAME
isExported: false

---
id: javascript-object-method
language: javascript
role: member
parentRuleIds: [javascript-variable, javascript-property-assignment]
symbolType: method
rule:
    kind: pair
    inside: {kind: object, inside: {kind: 'variable_declarator, assignment_expression'}}
    all:
        - has: {field: key, pattern: $NAME}
        - has: {field: value, kind: 'function_expression, arrow_function'}
name: $NAME

---
id: javascript-object-property
language: javascript
role: member
parentRuleIds: [javascript-variable, javascript-property-assignment]
symbolType: property
rule:
    kind: pair
    inside: {kind: object, inside: {kind: 'variable_declarator, assignment_expression'}}
    has: {field: key, pattern: $NAME}
    not: {has: {field: value, kind: 'function_expression, arrow_function'}}
name: $NAME
