# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-behind-nullable-parameter-python
language: python
severity: error
utils:
    local-shadow:
        inside:
            kind: function_definition, lambda
            stopBy: end
            has: {stopBy: {kind: "function_definition, lambda, class_definition"}, matches: {python-binding: {name: {pattern: $ROOT}}}}
    class-shadow:
        inside: {kind: class_definition, stopBy: end, has: {field: name, pattern: $ROOT}}
    module-binding:
        any:
            - kind: expression_statement
              has: {kind: assignment, has: {field: left, kind: identifier, pattern: $ROOT}}
            - kind: import_statement, import_from_statement
              has: {kind: identifier, pattern: $ROOT, stopBy: end}
            - kind: function_definition, class_definition
              has: {field: name, pattern: $ROOT}
            - kind: decorated_definition
              has: {kind: 'function_definition, class_definition', has: {field: name, pattern: $ROOT}}
    top-statement:
        kind: function_definition, class_definition, decorated_definition, expression_statement
        inside: {kind: module}
    module-constant:
        all:
            - not: {matches: local-shadow}
            - not: {matches: class-shadow}
            - inside: {matches: top-statement, stopBy: end, follows: {stopBy: end, matches: module-binding}}
            - not: {inside: {matches: top-statement, stopBy: end, precedes: {stopBy: end, matches: module-binding}}}
            - not: {inside: {kind: module, stopBy: end, has: {stopBy: end, kind: global_statement, has: {kind: identifier, pattern: $ROOT}}}}
    nullable-type:
        kind: type
        any:
            - has: {kind: binary_operator, has: {kind: none, stopBy: {not: {kind: binary_operator}}}}
            - has: {kind: generic_type, has: {kind: identifier, regex: '^Optional$'}}
            - has:
                kind: generic_type
                all:
                    - has: {kind: identifier, regex: '^Union$'}
                    - has: {kind: type_parameter, has: {kind: type, has: {kind: none}}}
            - has:
                kind: generic_type
                all:
                    - has: {kind: identifier, regex: '^Annotated$'}
                    - has: {kind: type_parameter, has: {kind: type, nthChild: 1, matches: nullable-type}}
            - has: {kind: subscript, has: {field: value, regex: '\.Optional$'}}
            - has:
                kind: subscript
                all:
                    - has: {field: value, regex: '\.Union$'}
                    - has: {kind: none}
            - has: {kind: string, has: {kind: string_content, regex: '\bNone\b'}}
    signature-default:
        any:
            - matches: python-plain-string
            - kind: 'integer, float, true, false'
            - kind: unary_operator
              has: {kind: 'integer, float'}
            - kind: tuple, parenthesized_expression
              not: {has: {pattern: $_, not: {matches: signature-default}}}
            - kind: call
              all:
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^(frozenset|tuple)$'}}}}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - kind: identifier
              pattern: $ROOT
              matches: module-constant
            - kind: attribute
              all:
                - has: {field: object, stopBy: end, kind: identifier, pattern: $ROOT, not: {inside: {kind: attribute, field: attribute}}}
                - matches: module-constant
    resolution:
        any:
            - pattern: $P if $P is not None else $D
            - pattern: $D if $P is None else $P
            - pattern: $P if $P else $D
            - pattern: $D if not $P else $P
            - pattern: $P or $D
            - kind: if_statement
              all:
                - has: {field: condition, any: [{pattern: $P is None}, {pattern: not $P}]}
                - has: {field: consequence, has: {kind: expression_statement, has: {pattern: $P = $D}}, not: {has: {nthChild: 2}}}
                - not: {has: {kind: "else_clause, elif_clause"}}
    evaluated:
        any:
            - matches: resolution
            - has:
                stopBy: {kind: 'lambda, function_definition, conditional_expression, boolean_operator, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
                matches: resolution
    top-resolution:
        any:
            - matches: resolution
            - kind: expression_statement, return_statement, raise_statement
              matches: evaluated
            - kind: if_statement, while_statement
              has: {field: condition, matches: evaluated}
            - kind: for_statement
              has: {field: right, matches: evaluated}
            - kind: match_statement, with_statement
              has: {not: {kind: block}, matches: evaluated}
    resolving-statement:
        any:
            - kind: if_statement
              matches: resolution
            - kind: expression_statement
              has: {kind: assignment, all: [{has: {field: left, pattern: $P}}, {has: {field: right, matches: resolution}}]}
    raw-read:
        kind: identifier
        pattern: $P
        not:
            any:
                - inside: {kind: attribute, field: attribute}
                - inside: {kind: keyword_argument, field: name}
                - inside: {kind: assignment, field: left}
                - inside: {stopBy: end, matches: resolution}
                - inside: {stopBy: end, follows: {stopBy: end, matches: resolving-statement}}
    override:
        kind: decorator
        has: {matches: {python-member-use: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^override$'}}}}
    rebinding:
        kind: assignment, augmented_assignment, for_statement, named_expression
        any:
            - has: {field: left, pattern: $P}
            - has: {field: name, pattern: $P}
        not:
            any:
                - has: {stopBy: end, matches: resolution}
                - inside: {kind: if_statement, stopBy: end, has: {field: condition, any: [{pattern: $P is None}, {pattern: not $P}]}}
rule:
    any:
        - kind: typed_default_parameter
          all:
            - has: {field: name, pattern: $P}
            - has: {field: value, kind: none}
        - kind: typed_parameter
          all:
            - has: {kind: identifier, nthChild: 1, pattern: $P}
            - has: {field: type, matches: nullable-type}
            - not: {precedes: {stopBy: {kind: 'keyword_separator, list_splat_pattern'}, kind: 'identifier, typed_parameter'}}
        - kind: default_parameter
          all:
            - has: {field: name, pattern: $P}
            - has: {field: value, kind: none}
    inside:
        kind: function_definition, lambda
        stopBy: {kind: 'function_definition, lambda'}
        all:
            - has:
                field: body
                any:
                    - kind: block
                      has: {matches: top-resolution}
                    - not: {kind: block}
                      matches: evaluated
            - not: {has: {field: body, has: {stopBy: {kind: 'function_definition, lambda'}, matches: rebinding}}}
            - not: {has: {field: body, has: {stopBy: end, matches: raw-read}}}
            - not: {inside: {kind: decorated_definition, has: {matches: override}}}
constraints:
    D: {matches: signature-default}
message: 'Parameter `$P` accepts None and the body resolves None to `$D`'
note: 'Use `<name>: <type> = <default>` in the signature, the parameter rejects None and callers read its default at its declaration'
