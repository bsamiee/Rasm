# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Enable on demand with ast-grep scan --filter '^run-in-callback-to-composed-effect$' --error=run-in-callback-to-composed-effect -U <paths>
id: run-in-callback-to-composed-effect
language: tsx
severity: off
utils:
    effect-module: {matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro)$'}}}}
    # The synchronous or promise run of one effect as the callback's whole answer
    run-call:
        kind: call_expression
        all:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: object, matches: effect-module}
                    - has: {field: property, regex: '^(runSync|runPromise)$'}
            - has: {field: arguments, has: {pattern: $EFFECT}, not: {has: {nthChild: 2}}}
    run-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: '^async$'}}
        has:
            field: body
            any:
                - matches: run-call
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: run-call}}
                  not: {has: {nthChild: 2}}
rule:
    kind: call_expression
    pattern: $CALL
    not: {has: {kind: comment, stopBy: end}}
    all:
        - has: {field: function, pattern: $M.$OWNER}
        - has: {field: arguments, has: {matches: run-callback, pattern: $CALLBACK}}
constraints:
    M: {matches: effect-module}
    # map composes through flatMap, and a sync or promise constructor around a run suspends the effect it ran
    OWNER: {regex: '^(map|sync|promise)$'}
rewriters:
    - id: unrun
      rule: {matches: run-call}
      fix: $EFFECT
    - id: map-first
      rule: {pattern: '$M.map($SELF, $H)'}
      transform: {BODY: 'rewrite($H, rewriters=[unrun])'}
      fix: $M.flatMap($SELF, $BODY)
    - id: map-last
      rule: {pattern: $M.map($H)}
      transform: {BODY: 'rewrite($H, rewriters=[unrun])'}
      fix: $M.flatMap($BODY)
    - id: suspend
      rule: {pattern: $M.$_($H)}
      transform: {BODY: 'rewrite($H, rewriters=[unrun])'}
      fix: $M.suspend($BODY)
transform:
    COMPOSED: rewrite($CALL, rewriters=[map-first, map-last, suspend])
fix: $COMPOSED
message: An Effect callback starts a separate runtime instead of composing its computation
note: Compose the effect through flatMap or suspend, `Effect.flatMap(self, (value) => load(value))`, and run effects at the host boundary alone
