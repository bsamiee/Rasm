# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-divider-over-imports-java
language: java
severity: error
rule:
    kind: line_comment
    regex: '^// --- \[IMPORTS\]'
    any:
        - precedes: {pattern: $NEXT}
        - pattern: $_
message: Divider `[IMPORTS]` names no section
note: Delete the divider, imports precede every section divider
fix:
    template: $NEXT
    expandEnd: {pattern: $NEXT}
