# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-value-or-promise-return
language: tsx
severity: error
utils:
    return-annotation:
        kind: type_annotation
        inside: {field: return_type, matches: syntax-function-boundary}
    promise-of:
        kind: generic_type
        all:
            - has: {field: name, regex: '^(Promise|PromiseLike)$'}
            - has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $T}}
            - has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $ARG}}
    promise-of-readonly:
        kind: generic_type
        all:
            - has: {field: name, regex: '^(Promise|PromiseLike)$'}
            - has: {field: type_arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, kind: readonly_type, pattern: $ARG, has: {pattern: $T}}}
rule:
    any:
        - kind: union_type
          inside: {matches: return-annotation}
          all:
            - has: {matches: promise-of}
            - has: {pattern: $T, not: {matches: promise-of}}
        - kind: readonly_type
          inside: {matches: return-annotation}
          has:
            kind: union_type
            all:
                - has: {matches: promise-of-readonly}
                - has: {pattern: $T, not: {kind: generic_type}}
fix: Promise<$ARG>
message: 'Function returns `$ARG` or a promise of it, a union every caller branches on'
note: 'Return one `Promise<$ARG>` at the host boundary, `Effect.runPromise` adapts the composed effect'
