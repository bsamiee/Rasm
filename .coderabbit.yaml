language: en-US
tone_instructions: "Adversarial senior reviewer: presume defects until the pass finds none; never ratify prose or praise. Findings name file, anchor, defect, and the demanded stronger form. Grade the full severity scale; uniform severity is ungraded."
early_access: false
enable_free_tier: true
inheritance: false
reviews:
    profile: assertive
    request_changes_workflow: true
    high_level_summary: true
    high_level_summary_instructions: >-
        One dense paragraph leading with contract-surface and behavior deltas: which owners changed shape, which strata or seams the diff crosses, what a consumer must now do differently. No restated diff statistics, no methodology narration, no praise.
    high_level_summary_placeholder: "@coderabbitai summary"
    high_level_summary_in_walkthrough: false
    auto_title_placeholder: "@coderabbitai"
    review_status: true
    review_details: true
    review_progress: true
    fail_commit_status: true
    collapse_walkthrough: true
    changed_files_summary: true
    sequence_diagrams: true
    estimate_code_review_effort: true
    assess_linked_issues: true
    related_issues: true
    related_prs: true
    suggested_labels: false
    auto_apply_labels: false
    suggested_reviewers: false
    auto_assign_reviewers: false
    in_progress_fortune: false
    poem: false
    enable_prompt_for_ai_agents: true
    abort_on_close: true
    disable_cache: false
    slop_detection:
        enabled: true
    path_filters:
        - "!**/pnpm-lock.yaml"
        - "!**/uv.lock"
        - "!**/packages.lock.json"
        - "!**/goldens/**"
        - "!**/*.verified.*"
        - "!**/*.har"
        - "!**/vendor/runtimes/**"
        - "!**/vendor/sdk/Lib3MF.cs"
        - "!**/node_modules/**"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
        - "!**/.venv/**"
        - "!**/.cache/**"
        - "!**/.cacheuv/**"
        - "!**/.artifacts/**"
        - "!**/bin/**"
        - "!**/obj/**"
        - "!**/dist/**"
        - "!**/*.tsbuildinfo"
        - "!**/scratch/**"
        - "!**/.scratch/**"
    path_instructions:
        - path: "{**,.claude/**}"
          instructions: |-
            - Dense, confident code is the prime suspect; a clean-reading page is unproven, not clean.
            - Verification precedes severity: every claim proves against the real domain and current disk at the positive-claim bar — the current file re-opened at the cited anchor, never prose, naming, comments, or a review snapshot. A claimed ABSENCE proves the member missing across every owner holding the fact — composed-constant or interpolated content traced through the composition, and an absent producer, capability, or landed row swept across every branch and package, never the folder in hand alone — so absence of the verbatim spelling at one site is not absence, a resolved row's `(none)` roster proves resolution rather than a missing producer, and the bar binds a pushback exactly as it binds a finding; a claimed PRESENCE — a parameter list, field mapping, return shape, or cross-file matching-rows assertion — proves its quoted shape on disk at every named site, a finding quoting an argument, literal, or shape the file does not contain void; a removal or desynchronization claim verifies the declaration and every constructor site. Demands hold the same bar: every member a fix names — replacement spelling, compensating or unregistration operation, stacking extension — proves existence, public accessibility, non-deprecation, and a declared type, return, and rail shape admitting the demanded use; a demanded routing proves the target owner's declared input types admit the routed value, and where the host ships no public inverse the declarative or structural form is the demanded fix, never compensation through a phantom member. A shape appearing only in a forbidden-form comment or rejected-form example documents the ban, never the live defect. Settled corpus law outranks intuition: a shape the owning page rules — factory contract, composition form, seam placement, diagram-template exclusion — verifies against that page before flagging, and re-litigating a ruled design is a false positive, not caution. Pinned-newest provider surfaces are corpus law: a released-library semantics claim — a member's return type, a pool's self-heal mechanics, a roster's existence — verifies against the owning doctrine page, and a provider-behavior claim — what internals strip, drop, retain, or default — verifies against the installed distribution's code path, never assumption: count-taking ranges yield the requested count, and projecting a vector onto a basis perpendicular to its parallel or antiparallel direction yields zero. An installed-surface member spelling that reads as a typo is the shipped spelling once probed on the distribution — a misspelling flag or corrected-spelling demand breaks the binding and is void on every language.
            - A corruption, mangling, or mis-spelling claim whose evidence rode search-tool output re-opens the raw file before emitting — `rg` invoked with `-r` rewrites its own match output (`-rn` parses as replace-with-literal-`n`) and manufactures plausible corruption findings.
            - Source descriptors retained beside a derived projection are not ignored; an omission finding proves absence from both owners, and a consistency-check demand between a declared shape and a value the owner computes from that same shape is void — a computed projection cannot desynchronize, though the carve ends at a provenance boundary: a count, length, or shape arriving from foreign bytes, a wire header, or a peer process is independently supplied, so a bound-before-allocate demand against it is live.
            - A modulo accessor is not an out-of-range access, an option-shaped lookup is not a throwing access, and an optional egress mapping an empty aggregate to `None` exposes absence rather than concrete closure evidence.
            - A host-completion finding cites the actual read surface: author-declared census fields are not native read-back counters, and an in-process callback whose charter exposes no host boundary owes owner-derived coverage, not host-completion evidence.
            - Private search, setup, or planning evidence is not output-affecting identity unless the frozen egress carries it.
            - Branches already inhabiting one typed rail need no carrier repair.
            - A duplicate-validation finding cites a second declaration or admission call, never an imagined sibling site.
            - Current-state claims trace composed calls, derived projections, internal provider operations, and receipt or canonical-egress consumption before flagging; a declaration is not a second call site, a value proven on the trace is not unused, and a direct path already entering the named admission owner is not missing the check.
            - Demand compatibility before mechanism: quantities share dimensions, the target owner carries the needed policy, never adjacent capability alone, every leveraged algorithm has its acceptance and fallback law, and a fixed ceiling or invariant exists in owner or provider law, never invented as a literal. A declared bound answers the scope its owner declares and no second one — a directory-, queue-, or run-wide cap is not a per-item ceiling, and a ceiling stamped as evidence on a receipt is not a second input to the grade that receipt reports. A move-the-check-earlier demand proves the invariant expressible at the demanded seam: a cross-roster or two-column invariant no per-row admission can state stays at the roster owner, and a locally re-derived schema or validator binds every peer to the deriving type system where the transported one binds none. A co-requirement demand across optional fields proves no admitted row carries one without the other; where the owning roster's rows split them, the true invariant is one-way. A machinery demand the file's own standing mechanism already discharges is void — a streaming drain on a timeout-bounded one-shot, retry rails on a cheap probe, a per-scope lifecycle cell where one held gate already makes every ownership transition atomic, a propagation demand where every raise already crosses the boundary fence onto the typed fault with the single trapped exception class the one deliberate degrade — so the demand proves that mechanism absent or insufficient before naming a new cell; a success-masquerade claim against a ruled typed degrade whose receipt discloses the answering provider is void at the same bar, since disclosed degrade is not success.
            - An admitted lower bound refutes a counterexample the complete owner roster cannot cross, and algebraically equivalent factorings are settled current shapes, not arithmetic defects.
            - A declaration migration demand moves every direct constructor and consumer in the same change.
            - A local codec never duplicates a canonical-byte owner; extend that owner's case family before routing the consumer.
            - Recursive execution expansion deletes only after the published trace retains every executable case, structural locus, and repetition identity; a predecessor dependency deletes only after the owning atom carries the intrinsic start, sweep, or equivalent evidence the consumer needs.
            - Gate failures on pre-existing untouched lines never authorize findings or edits against the reviewed diff; report only the smallest changed range that introduces or exposes the defect.
            - A reviewer reports and demands, never edits — precise enough for a fixer to land it without re-derivation; a finding row with an id and severity but no claim, target, or anchor is void, never a placeholder, and the anchor names the file owning the flagged construct — a construct living elsewhere routes the finding to its owner, never a demanded edit at a non-owning page. A relocation demand — move this to the composition root, to the app root, to the real owner — names that destination owner and proves it exists on disk distinct from the page in hand; where the page in hand IS the ruled owner, no second owner exists to receive the move and the demand is void.

            - Reviewable surface: a design corpus whose markdown-embedded code fences are the product, plus workflow and tooling JavaScript and configuration — judge fence code as production source.

            - Cross-surface coupling is review duty: docs/laws/topology.md maps surface-to-counterpart obligations — a diff editing a listed SURFACE without its obligated counterparts in the same change is a finding naming the missing counterpart.

            - Suggest at root-cause depth, in the owning page's rail idiom: a demanded raw exception, clamp, or ad-hoc guard against a page whose concern rides a monadic rail is the shallow demand fixers transcribe — demand the typed fault case, admission fold, or policy row on the existing rail instead.
            - Payloads with different motion or effect semantics remain distinct even when their carriers look alike.
            - A bare wording, tone, or verbosity preference is void: the house owns the voice, so deliberate load-bearing terseness and declarative owner-subject law are the standard — a claim naming a catalog defect class (hedge, weak verb, twin truth, enumeration or version anchor, coupled link, same-decision spread) is a live finding and never this class.
            - Depth at its owning tier is by design: a reference, catalog, or template page carries the mechanism its index abstracts, so a too-much-detail or hoist-to-the-root demand against one is void — the true positive runs the other direction, mechanism sitting AT the index tier demoting to the owning spec.
            - A routing row restating its destination's subject is the routing contract, never duplication, because routing surfaces own cross-references as their file class; the true positives are one fact owned by two NON-routing prose sites, and two routing rows aimed at one target.
            - Deterministic classes the docgen gate's Check and Repair vocabularies own — article openers, puffery and copula lexemes, heading and index numbering, table padding and alignment — belong to the gate's own fixer, never a review finding; a semantic or tier defect outside those vocabularies stays review work.
            - A finding grounded in a superseded ruling is void, the prose twin of the stale-quoted-shape rule: a claim citing a deleted, retired, or re-ruled standard refutes itself, while the cited law re-verified on current disk keeps the finding live.
            - macOS TCC attributes automation to the responsible process and devolves to the shared parent for CLI children, so a preflight probe reporting an identity other than the acting binary is the documented attribution, never a broken permission binding.
            - Producer-written receipts under ruled custody stand: the producing lane writes its own report as its final act, the harness states the exact model identity in that lane's own prompt, and no rail verb mutates a lane report — a demand relocating custody to the keeper, dispatcher, or orchestrator re-litigates the ruling.

            - Suppressions and gate bypasses are the finding: a true positive is architecture pressure on the shape, a false positive is rule pressure on the rule, and a suppression directive is neither; mechanical shape law is gate-owned — tools/biome GritQL rows for TypeScript, tools/cs-analyzer rules for C# — so a finding restating what a promoted gate row enforces is noise, and a recurring mechanical anti-pattern demands the gate row.

            - Deliberate house shapes are never findings: dense single-expression bodies and heavy polymorphic dispatch, absent defensive guards inside domain logic (admission-once boundaries), sparse 1-2 line agent-facing comments, a large file owning one full concern, bracketed uppercase section dividers, TODO/FIXME as source comment markers, explicit match arms over merged ternaries, named intermediates on result rails, and aggressive API breaks with every call site updated in the same change — a demanded migration, invalidation, or compatibility surface for a changed key, schema, or identity encoding is void on a corpus with no legacy consumer.
        - path: "{libs/**,tools/**,.claude/**}"
          instructions: |-
            - docs/stacks language doctrine is the floor: a conformant-but-weak form is a finding when a stronger form exists.
            - Attack entry-point sprawl — every touched module's public roster is a designed artifact: parallel entry points, modality-named siblings, get/getMany/getById families, arity twins, mode flags, and exports grown per capability demand one polymorphic entry per rail discriminating on input shape — forward and inverse of one correspondence on one owner; a helper with one caller, no plausible second consumer, and no meaning in isolation inlines into that caller.
            - Hunt bounded-exhaustion-as-success: a bounded iteration whose exhaustion arm returns the success rail certifies an unconverged state as converged — a `for (pass < budget)` loop or bounded fold whose fall-through returns success, especially beside sibling budgets that fault, demands the typed exhaustion fault on fall-through; distinct from an unbounded-loop finding.
            - Hunt parameterization both ways on every diff: a literal encoding a decision or recurring across sites becomes a policy value or vocabulary row, and a stringly key, path, or per-site spelling of one correspondence derives from the owning symbol; inversely, a parameter a policy value or input shape reconstructs, and a knob set whose combinations the body re-derives, collapse into policy rows, table dispatch, or a denser polymorphic owner with defaults derived once. Configuration ceremony pushed onto callers and orchestration a consumer must hand-write demand internalized lifecycle, routing, and policy with zero capability sacrifice.
            - An interface earns its existence through dispatch or substitution, and generated or source-gen surfaces run at intended power — decorative abstraction is a finding.
            - Hunt imperative and shape collapse: folds, combinators, tables, generators, generated owners, and discriminated types replace hand-rolled loops, branch ladders, flat case families, parallel models, and types differing by one axis. A collapse demand first proves one existing owner consumes the same state and rail preserving every behavior, policy, precedence, lifetime, evidence field, and consumer contract; equal row shape, labels, formulas, codecs, current mappings, or a shared type name across independent packages do not establish one semantic owner — the declared package or stratum boundary admitting the peers only through a ruled seam refutes the merge outright, the owning ARCHITECTURE or RULINGS row the citation — required ABI spellings remain on both sides, and a replacement spanning untouched ownership or lifetime concerns exceeds the changed defect and earns no rewrite. Every collapse demand states what the merge loses: where the plural form carries a guarantee — a per-folder closed roster's compile-time break, a dependency boundary keeping host SDKs above their stratum, a deliberate isolation co-location — the plurality is lawful, erasing the guarantee is a downgrade wearing density, and the unifying discriminant states at a durable owner so the twin surfaces never re-litigate. Two paradigms splitting one seam — an imperative or exception path beside the concern's monadic rail — are the same collapse target, one rail owning the concern end to end. Three shapes carry the collapse into dispatch: a total dispatch whose every arm returns a constant re-allocates that constant per call and collapses onto a generated map over precomputed static rows, arms answering alike sharing one row; a fold special-casing an operand by its immediate tag mis-recognizes the subtree wherever the tested property is inherited by composition, so recognition runs structurally over the whole subtree; and a dispatch ladder whose earlier arm's pattern forces a lazy operand pays an unreachable engine's cost, so cheap total gates precede every class pattern that reifies.
            - Presume tenfold demand on every touched owner: name missing attributes, sub-kinds, states, relationships, invariants, or operations as rows, cases, or members inside that owner, pressuring the standing policy axes — bounds and integrality, allocation capacity, calendar gap/overlap resolution, numerical scaling, posture hysteresis with distinct validated entry and exit thresholds, identity framing, and case-owned projection data — under a grounded owner contract; zero current consumers never lowers the bar.
            - A fixed roster of styles, patterns, variants, or presets spelled as a closed member set is seed data pigeonholed into structure: an owner whose cases enumerate today's instances cannot admit tomorrow's, so demand the algebraic owner over named parameters with the roster demoted to rows it consumes — and the same demand runs inverted, a knob set whose combinations the body re-derives collapsing into policy rows, table dispatch, or a denser polymorphic owner with defaults derived once.
            - A finding admitting a literal patch and a deeper collapse demands the collapse — a defect in one site or arm is evidence about every sibling, so demand the shared owner and the family fix; N siblings re-spelling one lifecycle machine over a shared rail — mint, custody hand-off, multi-product harvest, failure release, entry guard — demand that machinery as generic members on the rail owner, siblings collapsing to one-line compositions, congruence invariants turning structural inside the one generic builder, dispose-on-failure blocks becoming one extension on the rail's result type; two paths producing one product converge on one seam, and the unifying diff deletes the dead hop.
            - Hunt every defect family the live [DEFECT_CLASSES] table rosters — .macroscope/correctness/general/defect-classes.md, loaded into each review by its knowledge-base guideline row — resolving the table's current families on the diff at root-cause depth, each of its paragraphs one hunting family; the table is the sole roster owner, this config carries no transcribed copy, and a family the table gains is hunted with no edit here.

            - Admission provenance decides every value-check claim before severity. Interior re-validation of an admitted value is deleted-form residue: defensive arms re-testing closed cases and always-true predicates delete, and a band the producer's own construction proves — a norm-minted magnitude, an absolute deviation — admits no out-of-range instance, so the interior re-check and the boundary negative-rejection demand both delete; a finding cites the admission owner and an actual admission-bypassing constructor or foreign seam before reopening the interior. A host-crossing read, write, or import re-admits — foreign nulls and malformed shapes are real — and the canonical value re-proves at every write seam. A typed refusal the owning page or ruling designates as the verdict is the landed resolution: a fix-the-gap, add-a-fallback, or require-at-construction demand against it re-litigates the ruling — absence riding a gate verdict is design, never missing data; the admission-mechanics hunting families themselves resolve from the live [DEFECT_CLASSES] table, never a copy here.

            - Evidence read at use-time demands mint-time binding — the evidence-binding hunting families themselves resolve from the live [DEFECT_CLASSES] table, never a copy here; the demand-side guards stay this config's: a schema- or event-version-bump demand against a compatible widening is void — a version ordinal moves only on a breaking dataschema change, versioning custody homes at the wire owner rather than an in-process fact projector, a bump demand naming version machinery the file does not carry is a stale-machinery claim, and a replay-compatibility demand against an in-process observe-modality fact rides the same bar — no replay ring or decode path exists for the demanded gate to sit on; a tolerance-comparison demand against values decoded directly from literal attributes with no arithmetic accumulation is void — exact equality is the discriminant, and an epsilon collapse over a near-equal set silently discards a real discriminant. Operation identity derives apart from payload identity: a settlement, causal-log entry, or dedup keys on operation identity, never a content digest — the record stamp is writer-owned at the record authority, since a caller-threaded or stamp-free stable key lets two producers mint one key and dedup genuine evidence away as a redelivery; a retried operation that re-performs its work is a distinct operation pricing that work, cross-run re-execution is content-keyed deterministic recompute with the crash-window re-record the declared at-least-once posture of an append-only evidence plane, and a demanded fix degrading a ruled admission modality instead of completing the keyed preimage is the weaker-form demand, while a preimage row demanded for a term existing members already determine is derivable duplication riding as receipt evidence, never a second key row; the durable record seats at the nearest async fold off settled evidence, so a relocate-the-record-into-the-computation demand against a page returning its receipt only from the record's landed continuation converts a settlement fault into loss of completed evidence; an ack-until-landed or at-least-once demand against a lane whose declared overflow policy sheds converts deliberate shedding into unbounded redelivery, so the delivery verdict settles at the lane's declared policy, and a land-coupling demand against a plane exposing no per-fact landing acknowledgment demands a phantom signal — intake admission is the strongest producer-observable guarantee.
        - path: ".claude/**"
          instructions: |-
            - Bundle grants and loads judge by contract and consumption: a mandatory whole-set reference load whose every invocation consumes the set is the ruled flat-bundle design, ${CLAUDE_PROJECT_DIR} is the documented allowed-tools substitution (${CLAUDE_SKILL_DIR} binds skill content and bash injection only), and a tool a bundle's mandatory reference reads or its ruled rails consume is load-bearing — task-matched partial-loading, portability-swap, and minimization demands against any of the three re-litigate the bundle law.
            - Producer-written receipts under ruled custody stand: where the ruled design makes the producing lane the sole writer of its own report and the harness proves the disputed fields in-band, a demand relocating custody to the dispatcher re-litigates the ruling.
            - A template header stating its fill-and-replace contract in the bundle's sibling-consistent schema is schema, never narration to delete.
        - path: "{docs/**,CLAUDE.md,AGENTS.md,.greptile/**,.macroscope/**,.coderabbit.yaml}"
          instructions: |-
            - Doctrine-surface diffs are judged against the docs/laws/README.md admission law.
            - Flag the miss as hard as the spam: an addition without recurrence evidence or branch-spanning blast radius, and equally the neighboring clause that owed the collapse and was left untouched.
            - Enforcement transcription drift is a finding on sight: a reviewer rule, check-run agent, gate, or durable page enumerating rows a live table owns transcribes what it must walk, and the tell is the table having grown past the enumeration. docs/laws/topology.md states it directly — a consumer WALKS the coupling table and resolves each row live, never copies its contents — so the demanded fix names the table and derives the hunt from it, and every transcribed roster deletes whole rather than gaining the missing rows.
            - docs/laws/topology.md row [01] obligates every reviewer config from a docs/stacks/ page, a docgen template, or a Tier-0 law edit: one config updated and two stale is the finding, named per stale config.
        - path: "libs/**"
          instructions: |-
            - libs/.planning/campaign-method.md is the review standard for design-corpus work and libs/.planning/README.md owns the page grammar — judge against them, never generic documentation convention; planning registries relate only as their charters declare, so concept-to-task derivation is not identity or status mirroring. A fence is the work product, the measure of a planning item is the diff to a fence, and a fence owes transcription-complete code but no executable test: presume an external member is a phantom until the folder's .api/ catalogue verifies its spelling, public accessibility, and deprecation status, and verify a claimed ABSENCE at the same bar, because a false no-such-member claim steers every rebuild into the inferior spelling.
            - Sweep compiler-fatal shapes mechanically across a folder's sibling pages — every callee resolves to a declaration on the page or a cited sibling anchor, every INDEX row resolves to a same-page section, and these fictions survive fluent prose: a ref struct captured by a lambda or riding a generic carrier, an undeclared identifier, a value returned from a void member, a type name written as an invocation, a generated-owner row whose positional argument count drifts from its declared constructor arity, a railed factory result bound into a bare-typed slot with no flatten, a payload passed outside the factory's declared admitted union, a derivation from a registry row that does not exist. A collapse or rename ripples every referrer — cards, pages, catalogs — in the same pass, and a stale spelling of a deleted or renamed owner is a live defect.

            - Capability closes in both directions: enumerate every touched fence's composed members — the diff and the touched file around it — against the folder-overlay and language-substrate `.api/` tiers with the central manifest, then demand the deepest verified operator on the existing owner; a body re-deriving capability an admitted catalog member at either tier owns is the finding, the demand naming the member and smallest replacing range, and an unconsumed verified member the touched owner's concern admits is a gap. Proven leverage includes `Try.lift(...).Run()` for provider exception custody; `TensorPrimitives.MultiplyAdd`, finite-span predicates, and reductions; QuikGraph roots, path, acyclicity, component, and sink operators; `ArrayPoolBufferWriter<byte>` for framed canonical emission; NodaTime interval endpoints, clock seams, and mapping resolvers; quantity constructors and algebra; endpoint-inclusive numeric lattices; and provider-native segment geometry. A hand-rolled loop, shallow call, per-item mutation, or unconsumed verified member is a finding only when the exact invocation, return shape, complete provider roster, owner input contract, and preserved semantics are catalog-confirmed; a partial catalogue fragment or an operator lacking the owner's deterministic walk, geometry, precedence, acceptance, fallback, or custody contract is not approved leverage. Extend the canonical owner by row, case, or member, never a parallel surface; report the member and smallest replacing range. An overlapping second package enters only as a bounded fast-path under a named split predicate deciding which surface serves a call — a per-page arbitrary choice between two overlapping surfaces is the defect, and a fast-path member never owns the concern it accelerates. Declared capability must govern behavior: a noun with no fence member, an unmapped receipt, or a policy column used only by identity, logs, or evidence demands consumption or deletion, and an arm unable to honor it refuses before provider work; a row column declaring a capability carries the body that capability needs and the fold reads the column, so declaration and install cannot disagree and a second row costs one column answer rather than an edit at the consumer — a boolean column standing where a body belongs is the same decorative density one rank up.

            - An admitted manifest package is design-real: a central-manifest row carrying a sanctioned gate comment and named follow-up licenses every design page composing it — verification is the manifest admission, never wheel or distribution availability, and demanding a page drop an admitted package over a temporary distribution gap is the capability-gating defect.
            - A fence member whose body is a placeholder comment is an illusory implementation — reject it before deeper review, because the surrounding prose asserts capability no route materializes; a resource-release claim in prose or comments binds to a visible call in the shown body, and a design upgrading auto-cleanup to durable resume deletes that claim in the same edit.
            - Prose signatures byte-match their fence declarations: an Entry/Auto row whose parameter list, rail, or return drifts from the fence is a wrong contract, and a fence signature edit ripples its prose rows in the same diff; prose describing a fence binds to the fence's actual behavior — a described transformation the body does not perform is drift, and the correct form states the invariant the code embodies.

            - In a closed dispatch family folding one shared request shape, every column is consumed or loudly refused by every arm — an axis some arms read and others silently ignore converts an unrepresentable check into a silent pass, and a safety guarantee a shared rail claims is consumed structurally by the rail body from the case's data row, never buried in a per-case delegate.
            - One fault reason owns ONE recovery posture, declared at the family owner: a reason two consumers handle under divergent postures — retry at one site, terminal refusal at another — is a fork demanding the posture column on the family row, never per-site divergence.
            - A closed union whose every case carries one identically-typed field re-projected by a total switch is operand restatement — the shared value moves to the entrypoint argument; two cases byte-identical in payload and behavior, differing only in name, collapse to one case whose discriminant derives from the op's trait row.
            - Attack fold accumulators: a seed starting completeness flags true fabricates a receipt over an empty input set, and a name-keyed bag write-back silently drops all but one entry under a repeated key — set-valued findings emit as one typed list value; a subset test over a requirement row reads an empty requirement as vacuously satisfied, inverting a disabled row into always-enabled — demand the empty-row short-circuit.

            - Registry closure is same-change duty and bidirectional: a dependency or capability admission — and equally an .api consolidation or move — moves its full touch-point set together — central manifest row, consuming project manifest reference, branch and folder README registry rows of every consumer, and owning .api tier — and a member present without its counterparts is drift in either direction. A package registers in exactly one README section at its tier-correct cluster — substrate packages in the substrate cluster, domain packages in their domain cluster — a second row in another cluster is a drift seed, and a missing-registration claim is valid only after sweeping every section cluster of the README, since a single-cluster sweep manufactures the false-missing finding that manufactures the double. Registration singularity is per-README — a package lawfully registers at two sibling folders under a ruled role split the strata force apart, and a cross-folder dedup demand against that split is false; an admitted package no planning page composes is an orphaned admission demanding the composing fence or the re-card, never silent retention. Folder README router entries resolve 1:1 to on-disk .planning pages, a page rename ripples its router row and ARCHITECTURE codemap node, codemap identifiers carry the owning branch's casing — PascalCase csharp, snake_case python, camelCase typescript — and every cross-folder seam edge appears on both endpoint ARCHITECTURE pages with mirrored glyph and identical [KIND] while an in-package relation stays in the codemap, never a seam.
            - Cross-folder parity binds to material in the diff: a seam edge whose two endpoint pages disagree on the carried fields, a widened .api catalogue whose in-diff consumer pages still compose the narrow surface, and a diff shrinking a leading owner to match a narrower counterpart are findings — a parity fix widens the lagging side at its own grain, and a mirror demand is void since each side keeps its own owners, vocabulary, and casing.
            - Folder architecture is review duty: a .planning sub-folder is earned only by 2+ distinct non-eponymous sibling pages — a single-page folder flattens to the parent, a page echoing its parent folder's name (singular or plural) renames to the distinct concept it owns, a sub-folder names a larger domain concept that accretes siblings without rename, and grab-bag names (misc, utils, common, helpers, shared) are findings.

            - Strata leverage is hunted, never assumed: resolve the owning ARCHITECTURE strata table and seam ledger before judging any composition — that table also prohibits a lower stratum referencing a higher one, so a finding demanding direct upward delegation is refuted by it and the injected-seam form, the higher stratum supplying its capability through a parameter, is the legal shape. The strata row names the owners a folder composes, and capability a designated lower-stratum owner exports composes through its declared seam, never re-rolls — so a fence re-deriving capability a designated lower-stratum owner carries is a finding demanding composition of that owner, an owner minted at a higher stratum for a concern a lower-stratum owner already carries is duplication the lower owner absorbs, and two sibling consumers composing one stratum owner through divergent spellings converge on one composed form — every finding names the strata row, the owner, and the uncomposed or duplicated member. A shared mechanism homes at the LOWEST stratum every consumer references — homing it higher manufactures per-folder twins, a type or vocabulary re-declaring a lower-stratum owner's concept under a folder-local name is that twin demanding composition of the substrate owner as an instance, per-folder fact unions typing a shared mechanism are the one legitimate per-folder plurality, and the homing split is dependency cleanliness — a piece stays high only while it needs a dependency the lower stratum cannot carry, while a consumer blocked on an unlanded higher-stratum surface stays blocked, since seating the awaited composition below its stratum to clear the block is the rejected shortcut. A layout, grammar, or vocabulary two owners keep identical by hand — mirrored spellings with no sync guard — is the same twin one typed owner dissolves, both sites composing it.
            - Card and research markers match the page's own template: card status rides the closed vocabulary [ACTIVE]/[QUEUED]/[BLOCKED] open and [COMPLETE]/[DROPPED] closed — an invented token ([UPSTREAM-BLOCKED] and kin), a malformed leader, or an absolute path inside a card is a finding; card and research IDs are semantic UPPERCASE_SNAKE slugs — numeric ([0007]-class), compact-alphanumeric ([T1]/[C1]/[R23]-class), and hyphenated slugs are findings alike; open cards carry Capability/Shape/Unlocks/Anchors with Arms/Route/Tension/Ripple/Atomic present only on their stated conditions, a closed row collapses to the one-line disposition, a DROPPED row carries its rejection reason at ruling grain, and bullets flattened into run-on dashes are a repairable deformation. A card closes or re-anchors only on disk evidence, never a roster's say-so — a roster-vs-disk contradiction narrows the card and flags the contradiction. A research row is recorded epistemic debt and the terminal RESEARCH section is always present — (none) marks empty, absence is an error: a fence settling a member a sibling row still declares unverified is a finding, a resolved row deletes whole with no tombstone, a diff deleting, deforming, or orphaning a [TOKEN]-[OPEN|BLOCKED] marker — a row losing its exact question or verification route, a marker severed from the fence it gates — is a finding, and a completeness or restoration demand against a row deliberately BLOCKED on an upstream producer is void, routing instead to the producer owner the row names — the class inverts across EVERY close route, not producer-landing alone: a row retires when its producer lands OR when its question settles — a ruling row landed at the owning tier, a refusal-at-admission the ruling designates as the resolution — so a restore-the-row demand against any settled close, and a restore-or-fix compound whose fix half re-reads the ruled refusal as a pending defect, are void at the same bar, `(none)` the correct roster and never evidence of a missing producer. The repo-relative path law governs file paths alone, so the estate's `<branch>:<package>/<page>#<ANCHOR>` cross-package citation token and a sibling registry named beside its slug are the prescribed card spellings and a path-defect claim against one is void.
            - RULINGS.md registries — universal at package folders, branch tiers, and the cross-libs tier, an unpopulated instance carrying (none)-marked sections — are settled law reviewed both directions: a diff re-litigating a ruling row — re-admitting a rejected package, folding a ruled-plural surface, re-homing a ruled owner, re-adding a retired structure — fires with the row cited verbatim and routes its fix as a card (an IDEA at concept grain or a TASK at landing grain), never an inline workaround; a RULINGS.md diff answers the admission bar — a row dies only when its fact AND its why both live at one durable surface (a page stating the what while the discriminant, lost guarantee, or refuted objection stays homeless ADMITS the row), a fact-and-why-carried row is derivable creep demanding deletion, a row contradicting landed pages is drift, and a ruling homed above its narrowest containing tier, duplicated across tiers, or outside the closed section vocabulary is a defect. Positively: a diff realizing what a ruling anticipated is conformance worth naming, a diff whose stronger form a ruling anticipates receives the ruling-aligned deeper demand — a fix landing below the ruled bar is unfinished — and a diff exposing a homeless discriminant between lawful twin surfaces earns the new ruling row at the narrowest owning tier.
            - Every libs/ package is an independently adoptable library an unrelated application takes, so a package assumes no consumer, no sibling set, no deployment shape, and no lifecycle owner. Deployment shape arrives as data on the Tier-0 axis roster (libs/.planning/ARCHITECTURE.md [10]-[CONSUMPTION_MODEL]) supplied by the composition root: a closed axis fixes its vocabulary there while host and providers are open capability-descriptor rows their supplying branch fills, so a compile-time assumption of any axis value is a finding, and enumerating an open axis's instances re-anchors the roster to the instances that happen to exist. The assumed-consumer shapes are a package branching on which product hosts it, reading an ambient global, gating on a build flag, and assuming a sibling is present — sibling presence is itself an axis value bound as a declared port. Both failed responses are the finding: silent degradation and a narrowed public surface; the correct response is refusal at admission with typed evidence naming the axis, and an unbound port is a refused capability, never a crash. The demand side answers the same law: a move-to-application-startup or composition-root demand against a library tier is void where the ruled form arms a process-global setting on the single lazy door's first line — the demanded relocation assumes the lifecycle owner the package cannot name.
            - The three language estates are peers: no branch is a producer above another, no branch is a prerequisite for another, and a single-language application resolves every contract whole with no peer present. A fence, contract row, or manifest entry leaving one branch unable to run without another present is a finding — the two contract classes are the only cross-estate coupling, so the demand names the class and its owning MANIFEST.md entry. A branch's host focus is a domain it carries, never a rank the corpus honors.
            - tests/contracts/ contract class is read live from the entry's MANIFEST.md Class field: an INFRASTRUCTURE entry is minted by every branch from its own inputs with corpus parity as the proof, so a mint by fewer than every branch — or a second mint inside one branch — forks that parity; a DOMAIN entry names exactly one producer by the capability it holds, so a second producer forks the semantic model while every peer decodes and re-encodes.
            - Transcription is the conformance mechanism where Tier-0 law says so, and no derive-from-the-roster demand overrides it: [08]-[OBSERVABILITY_CONFORMANCE] fixes rows each branch transcribes identically in meaning at its three named branch anchors, the INFRASTRUCTURE mints spell one contract in three branch type systems, and the consumption-axis roster spells one axis set at each branch's admission owner. A drifted row is a finding repaired at its owning branch page in the same change, never through a shared library and never by demanding one branch import another's spelling.
            - Append-only log planes own truth and every derived plane carries zero authority: folds, snapshots, traces, cell tables, overlays, and actor configurations accelerate reads and drop at warm-up cost. A shape crossing planes names its truth plane, its rebuild route, and the retention floor below which rebuild fails, so a crossing stating fewer than all three is a finding naming the page that owns the crossing. Reading a projection as authority is the defect: a dropped accelerator becomes loss, and a write-back path into the derived plane folds drift into the log. An owner carrying no log declares itself ephemeral, so a durability or as-of claim on an unlogged owner is a finding whose repair is the missing declaration or the missing log.
        - path: "**/.api/**"
          instructions: |-
