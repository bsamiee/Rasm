# --- [DEPRECATIONS]

"typing_extensions.deprecated".msg = "Delete replaced API"
"warnings.deprecated".msg          = "Delete replaced API"

# --- [ENVIRONMENT]

"nt.environ".msg           = "Validate os.environ once at boundary into frozen settings"
"ntpath.expandvars".msg    = "Read validated settings field"
"os.getenv".msg            = "Read validated settings field"
"os.getenvb".msg           = "Read validated settings field"
"os.path.expandvars".msg   = "Read validated settings field"
