# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-bound-runner-callable
language: python
severity: error
utils:
    runner-function:
        any:
            - matches: {python-member-use: {module: {regex: '^anyio$'}, name: {regex: '^run$'}}}
            - matches: {python-member-use: {module: {regex: '^anyio\.from_thread$'}, name: {regex: '^run(_sync|_eventloop)?$'}}}
            - matches: {python-member-use: {module: {regex: '^anyio\.to_(thread|process|interpreter)$'}, name: {regex: '^run_sync$'}}}
            - kind: attribute
              not: {matches: python-shadowed-name}
              all:
                - has: {field: attribute, regex: '^run_sync$'}
                - has: {field: object, matches: {python-submodule: {parent: {regex: '^anyio$'}, child: {regex: '^to_(thread|process|interpreter)$'}}}}
            - kind: attribute
              not: {matches: python-shadowed-name}
              all:
                - has: {field: attribute, regex: '^run(_sync|_eventloop)?$'}
                - has: {field: object, matches: {python-submodule: {parent: {regex: '^anyio$'}, child: {regex: '^from_thread$'}}}}
    task-factory:
        matches: {python-member-use: {module: {regex: '^anyio$'}, name: {regex: '^create_task_group$'}}}
    portal-factory:
        any:
            - matches: {python-member-use: {module: {regex: '^anyio\.from_thread$'}, name: {regex: '^(BlockingPortal|start_blocking_portal)$'}}}
            - kind: attribute
              not: {matches: python-shadowed-name}
              all:
                - has: {field: attribute, regex: '^(BlockingPortal|start_blocking_portal)$'}
                - has: {field: object, matches: {python-submodule: {parent: {regex: '^anyio$'}, child: {regex: '^from_thread$'}}}}
    receiver-binding:
        matches: {python-binding: {name: {pattern: $RECEIVER}}}
    runner-method:
        kind: attribute
        all:
            - has: {field: object, kind: identifier, pattern: $RECEIVER}
            - any:
                - has: {field: attribute, regex: '^start(_soon)?$'}
                  inside:
                    kind: with_statement
                    stopBy: {kind: 'function_definition, class_definition, lambda'}
                    has:
                        kind: with_clause
                        has:
                            kind: with_item
                            has:
                                kind: as_pattern
                                all:
                                    - has: {field: alias, pattern: $RECEIVER}
                                    - has: {kind: call, has: {field: function, matches: task-factory}}
                - has: {field: attribute, regex: '^(call|start_task(_soon)?)$'}
                  inside:
                    kind: with_statement
                    stopBy: {kind: 'function_definition, class_definition, lambda'}
                    has:
                        kind: with_clause
                        has:
                            kind: with_item
                            has:
                                kind: as_pattern
                                all:
                                    - has: {field: alias, pattern: $RECEIVER}
                                    - has: {kind: call, has: {field: function, matches: portal-factory}}
            - not:
                inside:
                    kind: with_statement
                    stopBy: {kind: 'function_definition, class_definition, lambda'}
                    has: {field: body, has: {stopBy: {kind: 'function_definition, class_definition, lambda'}, matches: receiver-binding}}
    runner-callee:
        any:
            - matches: runner-function
            - matches: runner-method
            - kind: parenthesized_expression
              has: {matches: runner-callee}
    runner:
        kind: call
        has: {field: function, matches: runner-callee}
    partial-callee:
        any:
            - matches: functools-partial-callee
            - kind: parenthesized_expression
              has: {matches: partial-callee}
    partial:
        any:
            - kind: parenthesized_expression
              has: {matches: partial}
            - kind: call
              all:
                - has: {field: function, matches: partial-callee}
                - has:
                    field: arguments
                    any:
                        - pattern: $TRAILING_ARGS
                          has: {regex: '^,$', not: {precedes: {pattern: $_, not: {kind: comment}, stopBy: end}}}
                        - pattern: $ARGS
                    all:
                        - has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, not: {kind: 'list_splat, parenthesized_list_splat'}}
                        - not: {has: {kind: 'keyword_argument, dictionary_splat'}}
                        - not:
                            has:
                                stopBy: end
                                matches: {python-member-use: {module: {regex: '^functools$'}, name: {regex: '^Placeholder$'}}}
rule:
    any:
        - matches: partial
        - kind: keyword_argument
          all:
            - has: {field: name, regex: '^func$'}
            - has: {field: value, matches: partial}
            - inside: {kind: argument_list, not: {has: {kind: list_splat}}}
    nthChild: {position: 1, ofRule: {not: {kind: comment}}}
    inside: {kind: argument_list, inside: {matches: runner}}
transform:
    CONTENT: substring($ARGS, startChar=1, endChar=-1)
    TRAILING: substring($TRAILING_ARGS, startChar=1, endChar=-1)
    ARGUMENTS:
        replace: {source: $TRAILING, replace: ',(\s*(?:#[^\n]*(?:\n|$)\s*)*)$', by: '$1'}
fix: $CONTENT$ARGUMENTS
message: 'Pass positional arguments directly to the AnyIO runner instead of binding them with `partial`'
note: 'Keyword bindings and Placeholder slots require partial; closures, stored callables, and receivers outside AnyIO context bindings need semantic review'
