# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sql-keyword-sniff
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $SNIFF
    all:
        - has: {field: function, kind: field_expression, has: {field: field, regex: '^(starts_with|strip_prefix|eq_ignore_ascii_case)$'}}
        - any:
            - has: {field: arguments, has: {nthChild: 1, kind: string_literal, regex: '^"(SELECT|INSERT|UPDATE|WITH|CREATE|ALTER|DROP|PRAGMA|EXPLAIN)\b[^"]*"$'}}
            - all:
                - has: {field: function, kind: field_expression, has: {field: value, kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^to_(ascii_)?(upper|lower)case$'}}}}
                - has: {field: arguments, has: {nthChild: 1, kind: string_literal, regex: '(?i)^"(select|insert|update|delete|with|create|alter|drop|pragma|explain)\b[^"]*"$'}}
message: '`$SNIFF` classifies SQL text by its leading keyword'
note: 'Parse the text once with `sqlparser::parser::Parser::parse_sql(&dialect, text)` and match the `sqlparser::ast::Statement` variants (`Query`, `Insert`, `Update`, `Delete`, `CreateTable`), a keyword prefix misreads comments, parentheses, and CTE bodies'
