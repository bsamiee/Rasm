# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-predefined-target-name
language: xml
severity: error
files: ['**/*.csproj', '**/*.props']
rule:
    pattern: _TARGET
    matches: {msbuild-element: {name: {regex: '^Target$'}}}
    has:
        matches: msbuild-tag
        has:
            matches:
                msbuild-attribute:
                    name: {regex: '^Name$'}
                    value: {regex: '(?i)^["''](Before|After)(Build|Compile|Clean|Publish|Rebuild|ResolveReferences|ResGen)["'']$'}
rewriters:
    - id: rename
      rule:
        kind: AttValue
        pattern: _VALUE
        inside:
            kind: Attribute
            has: {kind: Name, regex: '^Name$'}
            inside: {matches: msbuild-tag, inside: {pattern: _TARGET}}
      transform:
        STEPPED: {replace: {source: $VALUE, replace: '(["''])$', by: 'Step$1'}}
      fix: $STEPPED
    - id: attach
      rule:
        matches: msbuild-tag
        pattern: _TAG
        inside: {pattern: _TARGET}
        has: {kind: Attribute, all: [{has: {kind: Name, regex: '^Name$'}}, {has: {kind: AttValue, pattern: _NAME}}]}
        not: {has: {kind: Attribute, has: {kind: Name, regex: '^(Before|After)Targets$'}}}
      transform:
        RENAMED_TAG: rewrite($TAG, rewriters=[rename])
        HEAD: {replace: {source: $RENAMED_TAG, replace: '\s*/?>$', by: ''}}
        CLOSE: {replace: {source: $RENAMED_TAG, replace: '(?s)^.*?(/?>)$', by: '$1'}}
        BEFORE: {replace: {source: $NAME, replace: '(?i)^["'']before([A-Za-z]+)["'']$', by: 'BeforeTargets="$1"'}}
        HOOK: {replace: {source: $BEFORE, replace: '(?i)^["'']after([A-Za-z]+)["'']$', by: 'AfterTargets="$1"'}}
      fix: '$HEAD $HOOK$CLOSE'
transform:
    RENAMED: rewrite($TARGET, rewriters=[attach, rename])
fix: $RENAMED
message: Target takes a predefined name the SDK import after the project body overrides
note: Give the target its own name and attach it with `BeforeTargets` or `AfterTargets`
