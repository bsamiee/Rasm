# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-copy-task-into-output
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^(Copy|Move)$'}}}
        - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^Destination(Folder|Files)$'}, value: {regex: '\$\((OutDir|OutputPath|TargetDir)\)'}}}}}
message: The task writes into the project's own output alone, and referencing projects and publish never receive the file
note: Declare the file as a None or Content item with CopyToOutputDirectory
