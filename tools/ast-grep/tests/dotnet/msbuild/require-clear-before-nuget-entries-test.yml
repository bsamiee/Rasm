id: require-clear-before-nuget-entries
valid:
    - |
      <packageSources>
          <clear />
          <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
      </packageSources>
    - |
      <disabledPackageSources><clear /></disabledPackageSources>
    - |
      <packageSourceMapping><clear /><packageSource key="nuget.org"><package pattern="*" /></packageSource></packageSourceMapping>
    - |
      <packageSources><!-- restore sources --><clear /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources>
    - |
      <config><add key="globalPackagesFolder" value=".cache/nuget/packages" /></config>
    - |
      <packageSources>
          <!-- restore sources -->
          <clear />
          <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
      </packageSources>
    - |
      <packageRestore><add key="enabled" value="True" /></packageRestore>
invalid:
    - |
      <packageSources>
          <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
      </packageSources>
    - |
      <packageSources><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /><clear /></packageSources>
    - |
      <packageSourceMapping><packageSource key="nuget.org"><package pattern="*" /></packageSource></packageSourceMapping>
    - |
      <packageSources />
    - |
      <packageSources><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /><clear></clear></packageSources>
    - |
      <packageSources><!-- <clear /> --><add key="feed" value="https://example.com" /></packageSources>
    - |
      <packageSources label="a > b"><add key="feed" value="https://example.com" /><clear /></packageSources>
    - |
      <packageSources><remove key="feed" /><clear /></packageSources>
    - |
      <disabledPackageSources><add key="feed" value="true" /></disabledPackageSources>
    - |
      <packageSources></packageSources>
