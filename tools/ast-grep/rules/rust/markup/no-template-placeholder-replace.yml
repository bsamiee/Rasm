# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: call_expression
    all:
        - matches: rust-template-replace
        - pattern: $RENDER
message: '`$RENDER` fills template placeholders through string replacement'
note: 'Render through `minijinja::Environment::render_str(<template>, minijinja::context! { .. })`, a reused template through `add_template`'
