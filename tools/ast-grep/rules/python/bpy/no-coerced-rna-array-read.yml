# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    identifier-read:
        kind: attribute
        has: {field: attribute, pattern: identifier}
    member-name:
        any:
            - matches: identifier-read
            - kind: identifier
              all: [{matches: {python-assigned-name: {value: {matches: identifier-read}}}}]
    coerced:
        kind: call
        any:
            - all:
                - has: {field: arguments, kind: argument_list, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, matches: member-name}}
                - not: {has: {field: arguments, kind: argument_list, has: {nthChild: {position: 3, ofRule: {not: {kind: comment}}}}}}
                - has:
                    field: function
                    kind: 'identifier, attribute'
                    any:
                        - &getattr {matches: {python-builtin-name: {name: {regex: '^getattr$'}}}}
                        - matches: {python-assigned-name: {value: *getattr}}
            - all:
                - has: {field: function, kind: attribute, has: {field: attribute, pattern: path_resolve}}
                - has: {field: arguments, kind: argument_list, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}}
                - not: {has: {field: arguments, kind: argument_list, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, not: {kind: 'true'}}}}
rule:
    kind: call
    any:
        - all:
            - has: {field: arguments, kind: argument_list, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $VALUE, matches: coerced}}
            - has: {field: function, kind: 'identifier, attribute', matches: {python-builtin-name: {name: {regex: '^len$'}}}}
        - all:
            - has: {field: function, kind: attribute, has: {field: attribute, regex: '^(ravel|flatten)$'}}
            - has:
                field: function
                kind: attribute
                has:
                    field: object
                    kind: call
                    all:
                        - has: {field: arguments, kind: argument_list, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $VALUE, matches: coerced}}
                        - has: {field: function, kind: 'identifier, attribute', matches: {python-member-use: {module: {regex: '^numpy$'}, name: {regex: '^(asarray|array)$'}}}}
message: '`$VALUE` coerces an RNA array, a `MATRIX` one to `Matrix` rows transposed from stored order'
note: 'Read `<owner>.path_resolve(<member>, False)` for an uncoerced array in stored order'
