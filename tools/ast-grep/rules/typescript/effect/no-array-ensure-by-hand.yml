# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/hooks/**']
rule:
    kind: ternary_expression
    pattern: $CALL
    any:
        - pattern: '$ARRAY.isArray($X) ? $X : [$X]'
        - pattern: '!$ARRAY.isArray($X) ? [$X] : $X'
constraints:
    X: {kind: 'identifier, undefined, this, number, string, true, false, null'}
    ARRAY:
        any:
            - regex: '^((globalThis|window|self)\.)?Array$'
              matches: typescript-global-reference
            - matches: {effect-module: {name: {regex: '(?-u:\b)Array$'}}}
message: '`$CALL` normalizes one `$X` or an array of `$X` into an array by hand'
note: 'Call `Array.ensure(<value>)` from `effect`'
