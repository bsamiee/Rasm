# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-restated-absence-error
language: tsx
severity: error
utils:
    absence-error:
        kind: arrow_function
        has:
            field: body
            kind: new_expression
            has: {field: constructor, matches: {effect-module-member: {module: {regex: '\bCause$'}, member: {regex: '^NoSuchElementError$'}}}}
    absence-lift:
        kind: call_expression
        has: {field: function, pattern: $LIFT, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(fromOption|fromNullishOr|fromNullOr|fromUndefinedOr)$'}}}}
    map-error:
        matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(mapError|orElseFail)$'}}}
rule:
    kind: call_expression
    any:
        - matches: absence-lift
          has: {field: arguments, has: {nthChild: 2, matches: absence-error}}
        - all:
            - has: {field: function, matches: map-error}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: absence-lift}}, {has: {nthChild: 2, matches: absence-error}}]}
        - all:
            - has: {field: function, matches: map-error}
            - has: {field: arguments, has: {nthChild: 1, matches: absence-error}, not: {has: {nthChild: 2}}}
          inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: absence-lift}}]}
message: '`$LIFT` absence is rebuilt as a second `NoSuchElementError`'
note: 'Let `Effect.fromOption` or `Effect.fromNullishOr` fail with its own `NoSuchElementError`, or map absence to a domain error naming the missing fact'
