# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-combinator-calls
language: tsx
severity: error
utils:
    module-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}
    one-argument:
        has: {field: arguments, all: [{has: {nthChild: 1}}, {not: {has: {nthChild: 2}}}]}
    step:
        all:
            - matches: module-call
            - not: {has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\bSchema$'}}}}}}
            - any:
                - matches: one-argument
                - has: {field: function, has: {field: property, matches: effect-dual-operation}}
    unary-step:
        all: [{matches: step}, {matches: one-argument}]
    data-first-step:
        matches: step
        has:
            field: arguments
            has: {nthChild: 1, matches: module-call}
        any:
            - matches: unary-step
            - has: {field: arguments, has: {nthChild: 2}}
rule:
    pattern: $CALL
    all:
        - matches: data-first-step
        - has: {field: function, pattern: $OUTER}
        - has:
            field: arguments
            has:
                nthChild: 1
                matches: data-first-step
                has: {field: arguments, has: {nthChild: 1, matches: data-first-step}}
        - not:
            all:
                - nthChild: 1
                - inside: {kind: arguments, inside: {matches: data-first-step}}
        - not: {has: {kind: comment, stopBy: end}}
        - not: {has: {kind: type_arguments, stopBy: end}}
        - any:
            - pattern: $FIXABLE
              inside:
                kind: program
                stopBy: end
                has:
                    kind: import_statement
                    all:
                        - has: {field: source, has: {kind: string_fragment, regex: '^effect(/Function)?$'}}
                        - has: {stopBy: end, kind: import_specifier, has: {field: name, regex: '^pipe$'}, not: {has: {field: alias, kind: identifier}}}
            - pattern: $KEPT
rewriters:
    - id: unary
      rule:
        matches: unary-step
        pattern: $M.$OP($FIRST)
      transform:
        INNER: rewrite($FIRST, rewriters=[unary, steps, unary-head, head])
      fix: $INNER, $M.$OP
    - id: steps
      rule:
        matches: data-first-step
        pattern: '$M.$OP($FIRST, $$$REST)'
      transform:
        INNER: rewrite($FIRST, rewriters=[unary, steps, unary-head, head])
        LISTED: {replace: {source: $$$REST, replace: '(?s),\s*$', by: ''}}
      fix: $INNER, $M.$OP($LISTED)
    - id: unary-head
      rule:
        matches: unary-step
        pattern: $M.$OP($FIRST)
      fix: $FIRST, $M.$OP
    - id: head
      rule:
        matches: step
        pattern: '$M.$OP($FIRST, $$$REST)'
      transform: {LISTED: {replace: {source: $$$REST, replace: '(?s),\s*$', by: ''}}}
      fix: $FIRST, $M.$OP($LISTED)
transform:
    STEPS: rewrite($FIXABLE, rewriters=[unary, steps, unary-head, head])
    PIPED: {replace: {source: $STEPS, replace: '(?s)^(.+)$', by: 'pipe($1)'}}
fix: $PIPED$KEPT
message: '`$OUTER` wraps data-first module calls four deep'
note: '`pipe(value, step, step, step)` lists the steps in evaluation order'
labels:
    CALL: {style: primary}
