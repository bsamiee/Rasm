# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
files:
    - libs/python/blender/**
    - libs/python/data/records/**
    - apps/blender/**
    - eng/python/rasm_eng/_{probe,session,streams}.py
rule:
    kind: string
    pattern: $S
    regex: '^[rRuU]?["'']{1,3}[\t-\r \x{200B}\x{2060}\x{FEFF}]*(bpy|bmesh)\.types\.\p{XID_Continue}+\['
    any:
        - inside: {kind: type, stopBy: end}
        - nthChild: {position: 1, ofRule: {not: {kind: comment}}}
          inside:
            kind: argument_list
            inside: {kind: call, has: {field: function, regex: '^(typing\.)?cast$'}}
message: '`$S` quotes a stub-only subscript in place of a `type` alias'
note: 'Declare `type <Alias> = <class>[<args>]` once and annotate with `<Alias>`'
