# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-self-assigning-upsert
language: sql
severity: error
rule:
    kind: upsert_clause
    pattern: _UPSERT
    all:
        - matches: {sql-update-upsert: {row: {pattern: _TABLE}}}
        - not:
            has:
                kind: set_assignment
                not:
                    all:
                        - has: {field: column, pattern: _COLUMN}
                        - has:
                            field: value
                            kind: column_reference
                            all:
                                - has: {field: name, pattern: _COLUMN}
                                - any: [{not: {has: {field: table, regex: '.'}}}, {has: {field: table, pattern: _TABLE}}]
transform:
    HEAD: {replace: {source: $UPSERT, replace: '(?is)^(.*?\bupdate\b).*$', by: '$1'}}
message: '`$HEAD` rewrites each conflicting row with its own values'
note: 'Write `on conflict (<key>) do nothing returning <columns>` and select existing rows in one transaction (PostgreSQL `union all`, SQLite batch)'
