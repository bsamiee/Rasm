name: Release

on:
    workflow_dispatch:
        inputs:
            specifier:
                description: Version or semver keyword every release project takes, empty reads each project's conventional commits
                type: string
            dry-run:
                description: Previews each project's version, tag, and GitHub release, changes nothing and skips attach and publish
                type: boolean
                default: true
            publish:
                description: Publishes every package to its registry or store after the release
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    release:
        runs-on: xcode-27
        timeout-minutes: 120
        environment: release
        outputs:
            commit: ${{ steps.released.outputs.commit }}
            engines: ${{ steps.engines.outputs.engines }}
        env:
            GH_TOKEN: &github ${{ github.token }}
            UV_LOCKED: "true"
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
            DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
            ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
            ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
            ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
            ZXP_CERTIFICATE: ${{ secrets.ZXP_CERTIFICATE }}
            ZXP_CERTIFICATE_PASSWORD: ${{ secrets.ZXP_CERTIFICATE_PASSWORD }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest
            - &tools
              uses: ./.github/actions/tools
            - id: signing
              if: ${{ env.APPLE_DEVELOPMENT_P12 != '' || env.DEVELOPER_ID_P12 != '' }}
              run: |
                  keychain="${RUNNER_TEMP}/app-signing.keychain-db"
                  password="$(uuidgen)"
                  security create-keychain -p "${password}" "${keychain}"
                  security set-keychain-settings -lut 21600 "${keychain}"
                  security unlock-keychain -p "${password}" "${keychain}"
                  for identity in APPLE_DEVELOPMENT_P12 DEVELOPER_ID_P12; do
                      passphrase="${identity}_PASSWORD"
                      [[ -n "${!identity}" ]] || continue
                      printf "%s" "${!identity}" | base64 --decode -o "${RUNNER_TEMP}/${identity}.p12"
                      security import "${RUNNER_TEMP}/${identity}.p12" -P "${!passphrase}" -A -t cert -f pkcs12 -k "${keychain}"
                  done
                  security set-key-partition-list -S apple-tool:,apple: -k "${password}" "${keychain}"
                  security list-keychains -d user | xargs security list-keychains -d user -s "${keychain}"
            - run: nx build @rasm/nx-apple-darwin-arm64
            - run: nx release ${SPECIFIER:+"${SPECIFIER}"} --skip-publish --dry-run=${{ inputs.dry-run }}
              env:
                  SPECIFIER: ${{ inputs.specifier }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            - id: released
              run: |
                  commit="$(git rev-parse HEAD)"
                  printf "commit=%s\n" "${commit}" >> "${GITHUB_OUTPUT}"
            - id: engines
              uses: ./.github/actions/engines
            - if: ${{ !inputs.dry-run }}
              run: nx run-many --targets=attach --configuration=release
            - if: ${{ inputs.publish && !inputs.dry-run }}
              run: nx release publish
              env:
                  PNPM_CONFIG__AUTH: '{"https://registry.npmjs.org":{"@":{"authToken":"${NODE_AUTH_TOKEN}"}}}'
                  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
                  UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
                  BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
                  SPARKLE_FEED_BUCKET: ${{ vars.SPARKLE_FEED_BUCKET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            - if: ${{ always() && steps.signing.outcome != 'skipped' }}
              run: security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db"

    unreal:
        needs: release
        if: ${{ !inputs.dry-run && needs.release.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.release.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        environment: release
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            GH_TOKEN: *github
            UV_LOCKED: "true"
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: "false"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release.outputs.commit }}
                  fetch-depth: 0
                  clean: false
            - *tools
            - run: nx run-many --targets=attach --configuration=release --projects=tag:os:linux
