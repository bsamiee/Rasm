# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
default-groups           = "all"
environments             = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
prerelease               = "allow"
override-dependencies    = ["cachebox>=6", "pyarrow>=26"]        # CPython 3.15 wheels start above DeepDiff and Daft bounds
no-build-package         = ["epdx"]                              # `epdx` sdist lacks `project.version`
extra-build-dependencies = { pyroscope-io = ["cmake"] }          # `pyroscope-io` build.rs runs cmake its sdist leaves undeclared

[tool.uv.workspace]
members = ["libs/python/*/*", "eng/python", "tools/refurb", "tests/python/support", "tests/python/libs/*/*", "tests/python/tools/*"]
exclude = ["libs/python/blender/*", "tests/python/libs/blender/*"]

[tool.uv.sources]
rasm-eng        = { workspace = true }
rasm-records    = { workspace = true }
rasm-refurb     = { workspace = true }
rasm-testing    = { workspace = true }
rasm-typography = { workspace = true }

[tool.uv.config-settings-package.manifold3d]
"cmake.define.MANIFOLD_USE_BUILTIN_TBB" = "ON"

# --- [PIXI] -----------------------------------------------------------------------------

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "27.0" }, "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.environments.default]
no-default-feature = true

[tool.pixi.environments.default.dependencies]
hdf5         = "2.2.*"
icu          = "78.*"
libpdal-core = "2.10.*"
llvm-openmp  = "*"
librdkafka   = "2.16.*"
libmagic     = "*"
libpango     = "*"
libharfbuzz  = "*"
fontconfig   = "*"
libglib      = "*"

[tool.pixi.environments.default.target.unix.activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
HDF5_DIR          = "$CONDA_PREFIX"
CPATH             = "$CONDA_PREFIX/include"
LDFLAGS           = "-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"

[tool.pixi.environments.default.target.osx.tasks]
python = { cmd = "python", env = { DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib" } } # `pixi run` loses activation `DYLD_*` rows through the SIP-protected `/usr/bin/env` that captures them

[tool.pixi.environments.default.target.linux.tasks]
python = { cmd = "python", env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" } } # An activation row reaches every `pixi run` child ahead of system libraries, sdist builds included

[tool.pixi.environments.default.target.win.activation.env]
ICU_VERSION                = "78"
CMAKE_PREFIX_PATH          = "%CONDA_PREFIX%\\Library"
HDF5_DIR                   = "%CONDA_PREFIX%\\Library"
INCLUDE                    = "%CONDA_PREFIX%\\Library\\include;%INCLUDE%"
LIB                        = "%CONDA_PREFIX%\\Library\\lib;%LIB%"
WEASYPRINT_DLL_DIRECTORIES = "%CONDA_PREFIX%\\Library\\bin"

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
cache-dir      = ".cache/ruff"
preview        = true
target-version = "py315"
line-length    = 200
src            = ["libs/python/*/*", "eng/python", "tools/refurb", "tests/python/support"]
format         = { exclude = ["*.md"], line-ending = "lf", docstring-code-format = true, skip-magic-trailing-comma = true }

[tool.ruff.lint]
select                    = ["ALL"]
ignore                    = [
    "missing-trailing-comma",                                                                                                                                                                                        # `skip-magic-trailing-comma` removes commas COM812 adds
    "too-many-public-methods",                                                                                                                                                                                       # Member counts push one-caller helper extraction
    "too-many-arguments",                                                                                                                                                                                            # Argument counts push one-caller parameter records and wrappers
    "too-many-positional-arguments",                                                                                                                                                                                 # Positional counts do not establish a domain record or keyword contract
    "too-many-return-statements",                                                                                                                                                                                    # Return counts push one-caller helper extraction, `match` arms return per case
    "too-many-branches",                                                                                                                                                                                             # Branch counts push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "too-many-locals",                                                                                                                                                                                               # Local counts push one-caller helper extraction
    "too-many-statements",                                                                                                                                                                                           # Statement counts push one-caller helper extraction
    "too-many-statements-in-try-clause",                                                                                                                                                                             # Statement counts do not establish exception scope for native effects and typed refusals
    "complex-structure",                                                                                                                                                                                             # Complexity scores push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "raw-string-in-exception",                                                                                                                                                                                       # Moves message into a local only the raise reads
    "f-string-in-exception",                                                                                                                                                                                         # Moves message into a local only the raise reads
    "raise-vanilla-args",                                                                                                                                                                                            # Pushes an exception class per message, raises stay for defects
    "typing-only-first-party-import",                                                                                                                                                                                # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "typing-only-third-party-import",                                                                                                                                                                                # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "typing-only-standard-library-import",                                                                                                                                                                           # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "suspicious-subprocess-import",                                                                                                                                                                                  # Reports every `subprocess` import, process boundaries call it
    "missing-copyright-notice",                                                                                                                                                                                      # Files hold no license header
    "commented-out-code",                                                                                                                                                                                            # Reads `# --- [<LABEL>]` section and subsection dividers as code
    "float-equality-comparison",                                                                                                                                                                                     # Authored controls compare against exact identity values (`0.0`, `1.0`)
    "zip-without-explicit-strict",                                                                                                                                                                                   # `strict=True` asserts lengths the code constructs
    "batched-without-explicit-strict",                                                                                                                                                                               # `strict=True` asserts lengths the code constructs
    "subprocess-without-shell-equals-true",                                                                                                                                                                          # Reports every argument-vector `subprocess` call
    "start-process-with-partial-path",                                                                                                                                                                               # Commands name tools mise places on `PATH`
    "os-path-abspath",                                                                                                                                                                                               # `os.path.abspath` drops `..` without following symlinks, a combination no `pathlib` member has
    "function-uses-loop-variable",                                                                                                                                                                                   # Reports closures `Result` and `Option` combinators call before the loop advances
    "logging-string-format",                                                                                                                                                                                         # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "logging-percent-format",                                                                                                                                                                                        # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "logging-string-concat",                                                                                                                                                                                         # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "logging-f-string",                                                                                                                                                                                              # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "reimplemented-operator",                                                                                                                                                                                        # Rewrites to `operator` functions typeshed types as returning `Any`, `banned-api` rejects the getters
    "lambda-assignment",                                                                                                                                                                                             # Pushes a `def` statement for a callback each `match` arm binds
    "compare-with-tuple",                                                                                                                                                                                            # PLR1714 reports the form as a set membership PLR6201 accepts
    "blocking-http-call-in-async-function",                                                                                                                                                                          # `banned-api` rejects every client it names
    "blocking-http-call-httpx-in-async-function",                                                                                                                                                                    # `banned-api` rejects `httpx`
    "blocking-sleep-in-async-function",                                                                                                                                                                              # `banned-api` rejects `time.sleep`
    "request-without-timeout",                                                                                                                                                                                       # `banned-api` rejects every client it names
    "no-explicit-stacklevel",                                                                                                                                                                                        # `banned-api` rejects `warnings.warn`
    "multiple-starts-ends-with",                                                                                                                                                                                     # refurb FURB102 preserves receiver evaluation and prefix independence
    "repeated-append",                                                                                                                                                                                               # Nominal receiver types do not prove exact builtin list mutation
    "len-test",                                                                                                                                                                                                      # refurb FURB115 checks exact materialized builtin size tests
    "for-loop-writes",                                                                                                                                                                                               # refurb FURB122 checks exact StringIO/BytesIO receivers and independent primitive writes
    "readlines-in-for",                                                                                                                                                                                              # refurb FURB129 checks exact StringIO/BytesIO receivers
    "delete-full-slice",                                                                                                                                                                                             # refurb FURB131 covers attribute receivers
    "check-and-remove-from-set",                                                                                                                                                                                     # Nominal receiver types do not prove exact builtin mutation, hashing, or equality
    "for-loop-set-mutations",                                                                                                                                                                                        # Nominal receiver types do not prove exact builtin set mutation
    "slice-copy",                                                                                                                                                                                                    # refurb FURB145 checks exact list and bytearray source forms
    "unnecessary-enumerate",                                                                                                                                                                                         # refurb FURB148 covers comprehensions
    "true-false-comparison",                                                                                                                                                                                         # refurb FURB149 reports `is` and `==` on bool-typed operands alone
    "hashlib-digest-hex",                                                                                                                                                                                            # refurb FURB181 covers attribute receivers
]
flake8-bandit             = { check-typed-exception = true }
flake8-boolean-trap       = { extend-allowed-calls = ["expression.Result.Ok", "expression.Some"] }
flake8-import-conventions = { extend-aliases = { "dask.array" = "da", "dask.dataframe" = "dd", datetime = "datetime", scipy = "sp", sympy = "sym", xarray = "xr" }, banned-from = ["builtins"] }
flake8-pytest-style       = { parametrize-names-type = "csv", raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError", "pydantic.ValidationError"] }
flake8-type-checking      = { runtime-evaluated-base-classes = ["msgspec.Struct"] }
isort                     = { combine-as-imports = true, force-sort-within-sections = true, order-by-type = false, split-on-trailing-comma = false }
pycodestyle               = { max-line-length = 300 }
pydocstyle                = { convention = "google" }
pydoclint                 = { ignore-one-line-docstrings = true }
pylint                    = { allow-dunder-method-names = ["__get_pydantic_core_schema__", "__get_pydantic_json_schema__", "__name__", "__version__"], allow-magic-value-types = ["str", "bytes", "int"] }           # Protocol properties type module attributes, which ty matches to a property alone

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["assert"]

[tool.ruff.lint.flake8-tidy-imports]
ban-lazy             = ["abc", "os", "sys"] # Interpreter startup loads them before any module runs
ban-relative-imports = "all"
require-lazy         = [
    "adbc_driver_flightsql",
    "adbc_driver_snowflake",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "xarray",
]

