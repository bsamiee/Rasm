# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-extra-package-source
language: xml
severity: error
files: ['NuGet.config'] # The root NuGet.config alone, the one config of the workspace
utils:
    # The restore sources of the mapping, each tag read as one row
    nuget-org-source: {kind: element, has: {matches: msbuild-tag, regex: '^<packageSource\s+key="nuget\.org"\s*/?>$'}}
    local-feed-source: {kind: element, has: {matches: msbuild-tag, regex: '^<packageSource\s+key="local"\s*/?>$'}}
rule:
    any:
        # A restore source outside nuget.org and the local feed, each row read as one tag
        - matches: {msbuild-element: {name: {regex: '^add$'}}}
          inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: '^packageSources$'}}}}}
          not:
              has:
                  matches: msbuild-tag
                  any:
                      - regex: '^<add\s+key="nuget\.org"\s+value="https://api\.nuget\.org/v3/index\.json"\s*/?>$'
                      - regex: '^<add\s+key="local"\s+value="\.artifacts/nuget"\s*/?>$'
        # A mapping source outside the restore sources
        - matches: {msbuild-element: {name: {regex: '^packageSource$'}}}
          not: {any: [{matches: nuget-org-source}, {matches: local-feed-source}]}
        # An entry under a known source outside the pattern it owns, the wildcard for nuget.org and the Rasm.* prefix for the local feed
        - kind: element
          inside: {kind: content, inside: {any: [{matches: nuget-org-source}, {matches: local-feed-source}]}}
          not:
              any:
                  - all: [{inside: {kind: content, inside: {matches: nuget-org-source}}}, {has: {matches: msbuild-tag, regex: '^<package\s+pattern="\*"\s*/?>$'}}]
                  - all: [{inside: {kind: content, inside: {matches: local-feed-source}}}, {has: {matches: msbuild-tag, regex: '^<package\s+pattern="Rasm\.\*"\s*/?>$'}}]
message: >-
    NuGet.config holds a source, mapping, or pattern outside the pairs nuget.org at https://api.nuget.org/v3/index.json mapped to * and local at
    .artifacts/nuget mapped to Rasm.*
note: Delete the source, mapping, or pattern outside the pairs
