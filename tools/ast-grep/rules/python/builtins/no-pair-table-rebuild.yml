# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-pair-table-rebuild
language: python
severity: error
utils:
    pair: {kind: tuple, has: {nthChild: 2}, not: {has: {nthChild: 3}}}
    pairs:
        any: [{kind: tuple}, {kind: list}]
        has: {matches: pair}
        not: {has: {pattern: $_, not: {any: [{matches: pair}, {kind: comment}]}}}
    splice:
        any: [{kind: tuple}, {kind: list}]
        has: {kind: list_splat}
        not: {has: {pattern: $_, not: {any: [{kind: list_splat, has: {any: [{kind: identifier}, {kind: attribute}]}}, {matches: pair}, {kind: comment}]}}}
    copied:
        kind: call
        any:
            - all:
                - has: {field: function, regex: '^(builtins\.)?(tuple|list|iter|sorted|reversed)$'}
                - has: {field: arguments, has: {nthChild: 1, matches: value}}
            - all:
                - has: {field: function, regex: '^(typing\.)?cast$'}
                - has: {field: arguments, has: {nthChild: 2, matches: value}}
    value:
        any:
            - matches: python-module-constant
            - matches: pairs
            - matches: splice
            - matches: copied
    pair-type:
        kind: generic_type
        all:
            - has: {kind: identifier, regex: '^tuple$'}
            - has: {kind: type_parameter, all: [{has: {kind: type, nthChild: 2}}, {not: {has: {kind: type, nthChild: 3}}}, {not: {has: {kind: type, has: {kind: ellipsis}}}}]}
    pair-sequence-type:
        kind: type
        has:
            kind: generic_type
            any:
                - all:
                    - has: {kind: identifier, regex: '^tuple$'}
                    - has: {kind: type_parameter, all: [{has: {kind: type, nthChild: 1, has: {matches: pair-type}}}, {has: {kind: type, nthChild: 2, has: {kind: ellipsis}}}]}
                - all:
                    - has: {kind: identifier, regex: '^(Sequence|Iterable|Collection|Iterator|list)$'}
                    - has: {kind: type_parameter, all: [{has: {kind: type, nthChild: 1, has: {matches: pair-type}}}, {not: {has: {kind: type, nthChild: 2}}}]}
    typed:
        kind: identifier
        inside:
            kind: function_definition
            stopBy: end
            has:
                field: parameters
                has:
                    kind: 'typed_parameter, typed_default_parameter'
                    all:
                        - any: [{has: {kind: identifier, nthChild: 1, pattern: $TABLE}}, {has: {field: name, pattern: $TABLE}}]
                        - has: {field: type, matches: pair-sequence-type}
    declared:
        kind: identifier
        inside:
            kind: 'module, function_definition'
            stopBy: end
            has:
                kind: assignment
                stopBy: {kind: 'function_definition, class_definition, lambda'}
                any:
                    - all: [{has: {field: left, pattern: $TABLE}}, {has: {field: right, matches: value}}]
                    - all: [{has: {field: left, pattern: $TABLE}}, {has: {field: type, matches: pair-sequence-type}}]
                    - all: [{has: {field: left, has: {nthChild: 1, pattern: $TABLE}}}, {has: {field: right, kind: expression_list, has: {nthChild: 1, matches: value}}}]
                    - all: [{has: {field: left, has: {nthChild: 2, pattern: $TABLE}}}, {has: {field: right, kind: expression_list, has: {nthChild: 2, matches: value}}}]
                    - all: [{has: {field: left, has: {nthChild: 3, pattern: $TABLE}}}, {has: {field: right, kind: expression_list, has: {nthChild: 3, matches: value}}}]
                    - all: [{has: {field: left, has: {nthChild: 4, pattern: $TABLE}}}, {has: {field: right, kind: expression_list, has: {nthChild: 4, matches: value}}}]
    imported:
        kind: identifier
        pattern: $ALIAS
        inside:
            kind: module
            stopBy: end
            has:
                kind: import_from_statement
                has: {kind: aliased_import, all: [{has: {field: name, regex: '^_?[A-Z][A-Z0-9_]*$'}}, {has: {field: alias, pattern: $ALIAS}}]}
    parameter:
        any: [{kind: identifier, pattern: $TABLE}, {kind: typed_parameter, has: {nthChild: 1, pattern: $TABLE}}]
    relayed:
        kind: identifier
        inside:
            kind: function_definition
            stopBy: end
            all:
                - has: {field: name, pattern: $HELPER}
                - any:
                    - has: {field: parameters, has: {kind: 'default_parameter, typed_default_parameter', all: [{has: {field: name, pattern: $TABLE}}, {has: {field: value, matches: value}}]}}
                    - inside:
                        kind: module
                        stopBy: end
                        has:
                            kind: call
                            stopBy: end
                            all:
                                - has: {field: function, pattern: $HELPER}
                                - has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, pattern: $TABLE}}, {has: {field: value, matches: value}}]}}
                    - all:
                        - has: {field: parameters, has: {nthChild: 1, matches: parameter}}
                        - inside: {kind: module, stopBy: end, has: {kind: call, stopBy: end, all: [{has: {field: function, pattern: $HELPER}}, {has: {field: arguments, has: {nthChild: 1, matches: value}}}]}}
                    - all:
                        - has: {field: parameters, has: {nthChild: 2, matches: parameter}}
                        - inside: {kind: module, stopBy: end, has: {kind: call, stopBy: end, all: [{has: {field: function, pattern: $HELPER}}, {has: {field: arguments, has: {nthChild: 2, matches: value}}}]}}
                    - all:
                        - has: {field: parameters, has: {nthChild: 3, matches: parameter}}
                        - inside: {kind: module, stopBy: end, has: {kind: call, stopBy: end, all: [{has: {field: function, pattern: $HELPER}}, {has: {field: arguments, has: {nthChild: 3, matches: value}}}]}}
    table:
        any:
            - pattern: $TABLE
              any:
                - matches: python-module-constant
                - matches: pairs
                - matches: splice
                - matches: declared
                - matches: imported
                - matches: relayed
                - matches: typed
            - kind: subscript
              all:
                - has: {field: value, matches: table}
                - has: {field: subscript, kind: slice, regex: '^:$'}
            - kind: call
              any:
                - all:
                    - has: {field: function, regex: '^(builtins\.)?(tuple|list|iter|sorted|reversed)$'}
                    - has: {field: arguments, has: {nthChild: 1, matches: table}}
                - all:
                    - has: {field: function, regex: '^(typing\.)?cast$'}
                    - has: {field: arguments, has: {nthChild: 2, matches: table}}
    unpacked:
        kind: 'pattern_list, tuple_pattern, list_pattern'
        all:
            - has: {nthChild: 1, pattern: $K}
            - has: {nthChild: 2, pattern: $V}
            - not: {has: {nthChild: 3}}
    keyed:
        any: [{pattern: $K == $_}, {pattern: $_ == $K}]
    indexed:
        any: [{pattern: '$P[0] == $_'}, {pattern: '$_ == $P[0]'}]
    row:
        kind: 'generator_expression, list_comprehension'
        all:
            - any:
                - all:
                    - has: {field: body, kind: identifier, pattern: $V}
                    - has: {kind: for_in_clause, all: [{has: {field: left, matches: unpacked}}, {has: {field: right, matches: table}}]}
                    - has: {kind: if_clause, has: {matches: keyed}}
                - all:
                    - has: {kind: for_in_clause, all: [{has: {field: left, kind: identifier, pattern: $P}}, {has: {field: right, matches: table}}]}
                    - has: {field: body, any: [{pattern: $P}, {pattern: '$P[1]'}]}
                    - has: {kind: if_clause, has: {matches: indexed}}
            - not: {has: {nthChild: 4}}
    filtered:
        kind: call
        all:
            - has: {field: function, regex: '^(builtins\.)?filter$'}
            - has: {field: arguments, has: {nthChild: 1, kind: lambda, all: [{has: {field: parameters, has: {kind: identifier, pattern: $P}, not: {has: {nthChild: 2}}}}, {has: {field: body, matches: indexed}}]}}
            - has: {field: arguments, has: {nthChild: 2, matches: table}}
    first:
        any:
            - kind: generator_expression
              matches: row
            - has: {nthChild: 1, any: [{matches: row}, {matches: filtered}]}
    projected:
        kind: 'generator_expression, list_comprehension, set_comprehension'
        all:
            - any:
                - all:
                    - has: {kind: for_in_clause, all: [{has: {field: left, matches: unpacked}}, {has: {field: right, matches: table}}]}
                    - has: {field: body, kind: identifier, pattern: $K}
                - all:
                    - has: {kind: for_in_clause, all: [{has: {field: left, kind: identifier, pattern: $P}}, {has: {field: right, matches: table}}]}
                    - has: {field: body, pattern: '$P[0]'}
            - not: {has: {nthChild: 3}}
rule:
    pattern: $CALL
    any:
        - kind: call
          all:
            - has: {field: function, regex: '^((builtins\.)?dict|(collections\.)?OrderedDict)$'}
            - has: {field: arguments, has: {nthChild: 1, matches: table}}
        - kind: call
          all:
            - has: {field: function, regex: '^(collections\.)?defaultdict$'}
            - has: {field: arguments, has: {nthChild: 2, matches: table}}
        - kind: call
          all:
            - has: {field: function, regex: '^(functools\.)?partial$'}
            - has: {field: arguments, has: {nthChild: 1, kind: 'identifier, attribute', regex: '^((builtins\.)?dict|(collections\.)?OrderedDict)$'}}
            - has: {field: arguments, has: {nthChild: 2, matches: table}}
        - kind: call
          all:
            - has: {field: function, regex: '^((builtins\.)?dict|(collections\.)?OrderedDict)\.fromkeys$'}
            - has: {field: arguments, any: [{matches: projected}, {has: {nthChild: 1, matches: projected}}]}
        - kind: dictionary_comprehension
          all:
            - has: {field: body, kind: pair, all: [{has: {field: key, kind: identifier, pattern: $K}}, {has: {field: value, kind: identifier, pattern: $V}}]}
            - has: {kind: for_in_clause, all: [{has: {field: left, matches: unpacked}}, {has: {field: right, matches: table}}]}
            - not: {has: {kind: if_clause}}
        - kind: call
          all:
            - has: {field: function, regex: '^(builtins\.)?next$'}
            - has: {field: arguments, matches: first}
        - kind: subscript
          has:
            field: value
            any:
                - kind: list_comprehension
                  matches: row
                - kind: call
                  all:
                    - has: {field: function, regex: '^(builtins\.)?(list|tuple)$'}
                    - has: {field: arguments, matches: first}
                - kind: list
                  all:
                    - has: {nthChild: 1, kind: list_splat, has: {matches: filtered}}
                    - not: {has: {nthChild: 2}}
        - kind: call
          all:
            - has: {field: function, regex: '^(builtins\.)?any$'}
            - has:
                field: arguments
                kind: generator_expression
                any:
                    - all:
                        - has: {kind: for_in_clause, all: [{has: {field: left, matches: unpacked}}, {has: {field: right, matches: table}}]}
                        - has: {field: body, matches: keyed}
                    - all:
                        - has: {kind: for_in_clause, all: [{has: {field: left, kind: identifier, pattern: $P}}, {has: {field: right, matches: table}}]}
                        - has: {field: body, matches: indexed}
                not: {has: {kind: if_clause}}
        - kind: comparison_operator
          all:
            - has: {field: operators, regex: '^(not\s+)?in$'}
            - has:
                nthChild: {position: 1, reverse: true}
                any:
                    - matches: projected
                    - kind: call
                      all:
                        - has: {field: function, regex: '^(builtins\.)?(set|frozenset|list|tuple)$'}
                        - has: {field: arguments, any: [{matches: projected}, {has: {nthChild: 1, matches: projected}}]}
        - kind: assignment
          all:
            - has: {field: left, kind: 'pattern_list, tuple_pattern, list_pattern', not: {has: {nthChild: 2}}}
            - has: {field: right, kind: list_comprehension, matches: row}
        - kind: for_statement
          all:
            - any:
                - all:
                    - has: {field: left, matches: unpacked}
                    - has: {field: right, matches: table}
                    - has: {field: body, has: {nthChild: 1, kind: if_statement, has: {field: condition, matches: keyed}}}
                - all:
                    - has: {field: left, kind: identifier, pattern: $P}
                    - has: {field: right, matches: table}
                    - has: {field: body, has: {nthChild: 1, kind: if_statement, has: {field: condition, matches: indexed}}}
            - has: {field: body, has: {nthChild: 1, kind: if_statement, has: {field: consequence, has: {nthChild: 1, any: [{kind: return_statement}, {kind: expression_statement, has: {kind: assignment}}]}}}}
            - not: {has: {field: body, has: {nthChild: 2}}}
message: '`$CALL` derives a key lookup from the pair table `$TABLE` on every read'
note: 'Declare `<table>` as a dict literal, under `MappingProxyType` at module level, and index or merge it directly'
