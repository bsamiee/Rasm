# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-map-then-default
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - any:
            - pattern: $O.map_or($D, $F)
            - pattern: $O.map_or_else($D, $F)
        - not: {matches: rust-retested-default}
constraints:
    O: {not: {matches: rust-dropped-error}}
    D: {matches: rust-default-value}
fix: $O.map_or_default($F)
message: '`$O` maps its value and spells the default fallback by hand'
note: 'Call `<option or result>.map_or_default(<fn>)`, the method returns `Default::default()` for `None` or `Err`. A literal fallback (`0`, `false`) states its value and stays as written. `no-sentinel-placeholder-rust` owns an empty-text literal fallback and a result the block compares to the default, and `no-try-default-rust` owns a receiver that drops its error through `.ok()`'
