# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yamllang
severity: error
files: ['tools/ast-grep/outline/**']
ignores: ['tools/ast-grep/outline/sources/**']
rule:
    kind: document
    has:
        kind: block_node, flow_node
        has:
            kind: block_mapping, flow_mapping
            has:
                kind: block_mapping_pair, flow_pair
                has: {field: key, pattern: $KEY}
                any:
                    - not: {has: {field: key, regex: '^["'']?(?:id|language|role|symbolType|rule|name|signature|constraints|utils|transform|rewriters|parentRuleIds|isImport|isExported|isPublic)["'']?$'}}
                    - all:
                        - has: {field: key, regex: '^["'']?(?:isImport|isExported)["'']?$'}
                        - inside: {has: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?role["'']?$'}, value: {has: {regex: '^["'']?member["'']?$'}}}}}}
                    - all:
                        - has: {field: key, regex: '^["'']?(?:isPublic|parentRuleIds)["'']?$'}
                        - inside: {has: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?role["'']?$'}, value: {has: {regex: '^["'']?item["'']?$'}}}}}}
labels:
    KEY: {style: primary, message: Key the loader skips}
message: Outline loads extractor key `$KEY` silently and ignores it
note: Items take `isImport` and `isExported`, members `isPublic` and `parentRuleIds`, every extractor `id`, `language`, `role`, `symbolType`, `rule`, `name`, `signature`, `constraints`, `utils`, `transform`, and `rewriters`
