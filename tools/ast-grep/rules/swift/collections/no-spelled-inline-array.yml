# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-spelled-inline-array
language: swiftlang
severity: error
utils:
    spelled:
        kind: user_type
        pattern: {context: 'var v: Swift.InlineArray<$_, $_>', selector: user_type}
rule:
    matches: spelled
    pattern: $SPELLED
    has: {kind: type_arguments, all: [{has: {nthChild: 1, pattern: $N}}, {has: {nthChild: 2, pattern: $T}}]}
    not: {inside: {stopBy: end, matches: spelled}}
rewriters:
    - id: sugar
      rule:
        matches: spelled
        has: {kind: type_arguments, all: [{has: {nthChild: 1, pattern: $COUNT}}, {has: {nthChild: 2, pattern: $ELEMENT}}]}
      transform:
        SUGARED: {rewrite: {source: $ELEMENT, rewriters: [sugar]}}
      fix: '[$COUNT of $SUGARED]'
transform:
    SUGARED: {rewrite: {source: $T, rewriters: [sugar]}}
fix: '[$N of $SUGARED]'
message: '`$SPELLED` spells out `[$N of $SUGARED]`'
note: 'Write `[<count> of <element>]` in type and constructor position'
