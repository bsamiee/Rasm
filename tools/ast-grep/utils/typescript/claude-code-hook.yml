# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Hook function registered on an event, inline or bound to a name, in on(event, hook) or on(event, matcher, hook), the event slot binds
id: claude-code-hook
language: tsx
arguments: [event]
rule:
    any: [{kind: arrow_function}, {kind: function_expression}]
    all:
        - any:
              # Matchers hold data alone, the one function among the arguments is the hook and needs no position pin
              - inside:
                    kind: arguments
                    all:
                        - inside: {matches: claude-code-registration}
                        - has: {nthChild: 1, matches: event}
              # The function bound to a name the registration passes, the event in the first slot
              - inside:
                    kind: variable_declarator
                    all:
                        - has: {field: name, pattern: $HOOK}
                        - inside:
                              kind: program
                              stopBy: end
                              has:
                                  stopBy: end
                                  matches: claude-code-registration
                                  has:
                                      field: arguments
                                      all:
                                          - has: {nthChild: 1, matches: event}
                                          - has: {kind: identifier, pattern: $HOOK}
