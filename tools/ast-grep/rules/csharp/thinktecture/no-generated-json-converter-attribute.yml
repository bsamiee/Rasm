# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-generated-json-converter-attribute
language: csharp
severity: error
utils:
    factory-converter:
        kind: attribute
        all:
            - has: {field: name, matches: {csharp-type-name: {name: {regex: '^JsonConverter(Attribute)?$'}}}}
            - has: {kind: attribute_argument_list, has: {kind: attribute_argument, has: {kind: typeof_expression, has: {field: type, matches: {csharp-type-name: {name: {regex: '^ThinktectureJsonConverterFactory$'}}}}}}}
rule:
    any:
        - kind: attribute_list
          all:
            - has: {matches: factory-converter}
            - not: {has: {kind: attribute, nthChild: 2}}
        - kind: attribute
          matches: factory-converter
          inside: {kind: attribute_list, has: {kind: attribute, nthChild: 2}}
message: '`[JsonConverter(typeof(ThinktectureJsonConverterFactory))]` restates the converter the Thinktecture generator emits'
note: 'Delete the attribute, the generator emits the span-based converter'
