# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-optimize"
edition.workspace = true
publish.workspace = true

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
nutype               = { workspace = true }
bounded-integer      = { workspace = true }
ordered-float        = { workspace = true }
nalgebra             = { workspace = true }
good_lp              = { workspace = true }
nlopt                = { workspace = true }
rasm-stats           = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
clarabel = { workspace = true, features = ["sdp-accelerate"] }

[target."cfg(target_os = \"linux\")".dependencies]
clarabel = { workspace = true, features = ["sdp-openblas"] }

[target."cfg(windows)".dependencies]
clarabel = { workspace = true, features = ["sdp-mkl"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
