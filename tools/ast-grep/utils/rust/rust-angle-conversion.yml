# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-angle-conversion
language: rust
arguments: [X, NUM, DEN, DEGREES, RADIANS, OFFSET]
utils:
    pi:
        kind: 'identifier, scoped_identifier'
        regex: '^((::)?(std|core)::)?((f32|f64)::)?(consts::)?(PI|TAU)$'
    half-turn:
        kind: 'float_literal, integer_literal'
        regex: '^(180|360)(\.0*)?(_?f(32|64))?$'
    degree-factor:
        kind: float_literal
        regex: '^5_?7\.2_?9_?5[\d_]*(_?f(32|64))?$'
    radian-factor:
        kind: float_literal
        regex: '^0\.0_?1_?7_?4_?5_?3[\d_]*(_?f(32|64))?$'
    term:
        any: [{matches: pi}, {matches: half-turn}]
    flops-term:
        any: [{matches: pi, regex: 'PI$'}, {matches: half-turn, regex: '^180'}]
    multiply:
        kind: binary_expression
        has: {field: operator, regex: '^\*$'}
    divide:
        kind: binary_expression
        has: {field: operator, regex: '^/$'}
    ratio:
        matches: divide
        all:
            - has: {field: left, all: [{matches: term}, {matches: NUM}]}
            - has: {field: right, all: [{matches: term}, {matches: DEN}]}
    constant-ratio:
        all:
            - any:
                - all:
                    - matches: divide
                    - has: {field: left, matches: multiply, all: [{has: {field: right, all: [{matches: term}, {matches: NUM}]}}, {has: {field: left, matches: X}}]}
                    - has: {field: right, all: [{matches: term}, {matches: DEN}]}
                    - not: {all: [{has: {field: left, has: {field: right, matches: flops-term}}}, {has: {field: right, matches: flops-term}}]}
                - all:
                    - matches: divide
                    - has: {field: left, matches: multiply, has: {field: left, all: [{matches: term}, {matches: NUM}]}}
                    - has: {field: right, all: [{matches: term}, {matches: DEN}]}
                    - has: {field: left, has: {field: right, matches: X}}
                - all:
                    - matches: multiply
                    - has: {field: right, all: [{matches: term}, {matches: NUM}]}
                    - has: {field: left, matches: divide, all: [{has: {field: right, all: [{matches: term}, {matches: DEN}]}}, {has: {field: left, matches: X}}]}
                - all:
                    - matches: multiply
                    - has: {field: right, kind: parenthesized_expression, has: {matches: ratio}}
                    - has: {field: left, matches: X}
                - all:
                    - matches: multiply
                    - has: {field: left, any: [{matches: ratio}, {kind: parenthesized_expression, has: {matches: ratio}}]}
                    - has: {field: right, matches: X}
            - has: {stopBy: end, matches: pi}
            - has: {stopBy: end, matches: half-turn}
            - not: {regex: '\bPI\b[^;]*\b360|\b360[^;]*\bPI\b|\bTAU\b[^;]*\b180|\b180[^;]*\bTAU\b'}
    to-degrees-factor:
        matches: DEGREES
        any:
            - all: [{matches: multiply}, {has: {field: right, matches: degree-factor}}, {has: {field: left, matches: X}}]
            - all: [{matches: multiply}, {has: {field: left, matches: degree-factor}}, {has: {field: right, matches: X}}]
            - all: [{matches: divide}, {has: {field: right, matches: radian-factor}}, {has: {field: left, matches: X}}]
    to-radians-factor:
        matches: RADIANS
        any:
            - all: [{matches: multiply}, {has: {field: right, matches: radian-factor}}, {has: {field: left, matches: X}}]
            - all: [{matches: multiply}, {has: {field: left, matches: radian-factor}}, {has: {field: right, matches: X}}]
            - all: [{matches: divide}, {has: {field: right, matches: degree-factor}}, {has: {field: left, matches: X}}]
    angle-ratio:
        all:
            - matches: ratio
            - has: {matches: pi}
            - has: {matches: half-turn}
    fused-conversion:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^mul_add$'}}, {has: {field: value, matches: X}}]}
            - has:
                field: arguments
                all:
                    - has:
                        nthChild: 1
                        any:
                            - matches: angle-ratio
                            - {kind: parenthesized_expression, has: {matches: angle-ratio}}
                            - all: [{matches: degree-factor}, {matches: DEGREES}]
                            - all: [{matches: radian-factor}, {matches: RADIANS}]
                    - has: {nthChild: 2, matches: OFFSET}
                    - not: {has: {nthChild: 3}}
            - not: {has: {field: arguments, has: {nthChild: 1, regex: '\bPI\b[^,]*\b360|\b360[^,]*\bPI\b|\bTAU\b[^,]*\b180|\b180[^,]*\bTAU\b'}}}
rule:
    kind: 'binary_expression, call_expression'
    any:
        - matches: constant-ratio
        - matches: to-degrees-factor
        - matches: to-radians-factor
        - matches: fused-conversion
