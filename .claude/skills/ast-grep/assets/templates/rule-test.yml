id: <rule-id> # Binds to the rule by id, the file name binds nothing, a rule with no test and a test with no rule both pass ast-grep test
valid:
    - | # The correction the note states, code holding key: value text takes the block scalar or the run exits 8
      <corrected snippet>
    - | # A sibling shape the correction does not apply to, one case per guard
      <near-miss snippet>
invalid:
    - | # The instance the rule was derived from, one violation per case because the snapshot records the first match alone
      <violating snippet>
    - | # A surface form the same correction applies to, one case per any: branch, ast-grep test -U writes the snapshots
      <sibling snippet>
