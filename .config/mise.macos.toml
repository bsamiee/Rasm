# --- [ENV] ------------------------------------------------------------------------------

[env]
_.path             = { path = ['''{% set props = config_root ~ "/Directory.Packages.props" %}/Applications/Rhino {{ exec(command="yq -p xml -oy '.Project.PropertyGroup[] | select(.+@Label == \"Rhino\") | .RhinoVersion | split(\".\") | .[0]' '" ~ props ~ "'", cache_key="rhino-major-" ~ props | hash_file) }}.app/Contents/Resources/bin''', "{{ env.HOME }}/Library/Application Support/McNeel/Rhinoceros/ai/bin", '{{ exec(command="xcode-select -p", cache_duration="1h") }}/../Applications/Icon Composer.app/Contents/Executables'], tools = true }
COLIMA_HOME        = "{{ env.CACHE_DIR }}/colima"
DOCKER_HOST        = "unix://{{ env.COLIMA_HOME }}/default/docker.sock"
GHIDRA_PROJECT_DIR = "{{ env.HOME }}/Library/Caches/rasm/ghidra/projects"
SDKROOT            = '{{ exec(command="xcrun --show-sdk-path 2>/dev/null || true", cache_duration="1h") }}'

# --- [DEPS] -----------------------------------------------------------------------------

[deps.nx-apple]
depends = ["pnpm"]
dir     = "products/developer/nx/apple/analyzer"
outputs = [".build/out/Products/Release/nx-apple-analyzer", ".build/out/Products/Release/nx-apple-analyzer.hash"]
run     = '''swift build --configuration release --force-resolved-versions --disable-index-store && node --input-type=module -e "import { workspaceRoot } from '@nx/devkit'; import { hashWithWorkspaceContext } from '@nx/devkit/internal'; import { writeFileSync } from 'node:fs'; import { relative } from 'node:path'; import { fileURLToPath } from 'node:url'; writeFileSync(fileURLToPath(import.meta.resolve('@rasm/nx-apple-darwin-arm64/nx-apple-analyzer')) + '.hash', await hashWithWorkspaceContext(workspaceRoot, [relative(workspaceRoot, process.cwd()) + '/**/*']))"'''
sources = ["Package*", "package.json", "Sources/**/*", "Tests/**/*"]

# --- [BOOTSTRAP] ------------------------------------------------------------------------

[bootstrap.settings.macos.defaults."org.swift.swift-build"]
CompilationCachingDiskSizeLimit = "4G"
