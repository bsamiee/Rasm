# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: bash-unparsed
language: bashlang
rule:
    any:
        - kind: ERROR
          not: {inside: {kind: ERROR, stopBy: end}}
        - kind: program
          has:
            stopBy: end
            all:
                - regex: '^$'
                - pattern: $$MISSING
                - not: {kind: 'heredoc_body, heredoc_content, heredoc_end'}
                - not: {inside: {kind: ERROR, stopBy: end}}
