# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    error-call:
        kind: call_expression
        has: {field: function, pattern: Err}
    error-value:
        any:
            - matches: error-call
            - matches: {rust-single-statement: {first: {matches: error-call}}}
rule:
    kind: match_expression
    all:
        - has: {field: value, pattern: $MAP.entry($KEY)}
        - has:
            field: body
            all:
                - has:
                    kind: match_arm
                    all:
                        - has: {field: pattern, kind: match_pattern, has: {kind: tuple_struct_pattern, has: {field: type, regex: '^((\p{XID_Continue}+::)*Entry::)?Occupied$'}}}
                        - has: {field: value, matches: error-value}
                - has:
                    kind: match_arm
                    all:
                        - has: {field: pattern, kind: match_pattern, has: {kind: tuple_struct_pattern, all: [{has: {field: type, regex: '^((\p{XID_Continue}+::)*Entry::)?Vacant$'}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $SLOT}}]}}
                        - has: {field: value, has: {stopBy: end, pattern: $SLOT.insert($VALUE)}}
message: '`match` on `$MAP.entry($KEY)` inserts into a vacant entry and returns `Err` for an occupied one'
note: 'Call `<map>.try_insert(<key>, <value>)` on a `HashMap` or `BTreeMap` (`#![feature(map_try_insert)]`) and map `OccupiedError` into the error'
