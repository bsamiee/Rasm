# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    rendering:
        any:
            - matches: swift-error-text
            - kind: call_expression
              all:
                - has: {nthChild: 1, regex: '^(Swift(\.|::))?String(\.init)?$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^(describing|reflecting)$'}}}}
rule:
    matches: os-log-interpolation
    has:
        field: value
        pattern: $RENDER
        any:
            - matches: rendering
            - kind: 'line_string_literal, multi_line_string_literal, raw_string_literal'
            - kind: simple_identifier
              pattern: $NAME
              all:
                - inside:
                    stopBy: {follows: {stopBy: end, kind: property_declaration, has: {kind: pattern, has: {field: bound_identifier, pattern: $NAME}}}}
                    follows:
                        stopBy: end
                        kind: property_declaration
                        has:
                            kind: pattern
                            has: {field: bound_identifier, pattern: $NAME}
                            precedes:
                                stopBy: {not: {any: [{kind: 'comment, multiline_comment, type_annotation'}, {regex: '^=$'}]}}
                                matches: rendering
                - matches: swift-let-alias
message: '`$RENDER` enters a log message as an interpolated literal or as text rendered from a value'
note: 'Pass an `Error` as `error:`, interpolate any other value itself with `privacy:` in `metadata:`, and write a literal into the message'
