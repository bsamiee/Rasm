# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    pushed:
        kind: expression_statement
        has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $V.$PUSH($$$_)}
rule:
    kind: 'expression_statement, let_declaration, call_expression, try_expression'
    all:
        - follows: {matches: pushed}
        - matches: {rust-pushed-element-lookup: {boundary: {matches: rust-conditional-scope}}}
message: '`$V.$PUSH` adds an element the next statement borrows back through a second lookup'
note: 'Read the `&mut T` that `push_mut`, `insert_mut`, `push_back_mut`, or `push_front_mut` returns, in `Some` for an `Option` consumer'
