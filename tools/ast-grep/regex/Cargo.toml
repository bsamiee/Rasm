# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-regex-classes"
edition.workspace = true
description       = "Character classes, token structure, and exact literals of Rust regexes, as the regex engine parses them"
publish.workspace = true

# --- [TARGETS] --------------------------------------------------------------------------

[[bin]]
name  = "rasm-regex-classes"
path  = "main.rs"
test  = false
bench = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
ast-grep-config      = { workspace = true }
ast-grep-core        = { workspace = true }
ast-grep-dynamic     = { workspace = true }
fs-err               = { workspace = true }
nonempty-collections = { workspace = true }
regex-syntax         = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
serde_path_to_error  = { workspace = true }
thiserror            = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
