                    |optimiz(?:e[ds]?|ing)|streamlin(?:e[ds]?|ing)|showcas(?:e[ds]?|ing)|emphasiz(?:e[ds]?|ing)
                    |plethora|myriad|a\ wealth\ of|paradigm|boasts|tackl(?:e[ds]?|ing)|ascertain|determin(?:e[ds]?|ing)
                    |commenc(?:e[ds]?|ing)|initiat(?:e[ds]?|ing)|embark(?:s|ed|ing)?|ceas(?:e[ds]?|ing)|endeavor(?:s|ed|ing)?
