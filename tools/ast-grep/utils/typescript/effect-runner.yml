# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-runner
language: tsxlang
arguments: [name]
utils:
    aliased:
        kind: identifier
        pattern: $ALIAS
        inside:
            kind: program
            stopBy: end
            has:
                kind: import_statement
                all:
                    - has: {field: source, regex: '^.effect/Effect.$'}
                    - has: {kind: import_clause, has: {kind: named_imports, has: {kind: import_specifier, has: {field: alias, pattern: $ALIAS}}}}
rule:
    any:
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^run(Callback|Fork|Promise|PromiseExit|Sync|SyncExit)$', matches: name}}}
        - kind: identifier
          regex: '^run'
          matches: {typescript-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Callback|Fork|Promise|PromiseExit|Sync|SyncExit)$', matches: name}}}
        - kind: identifier
          all:
            - not: {regex: '^run'}
            - matches: aliased
            - matches: {typescript-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Callback|Fork|Promise|PromiseExit|Sync|SyncExit)$', matches: name}}}
        - kind: call_expression
          has:
            field: function
            any:
                - matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^run(Callback|Fork|Promise|PromiseExit|Sync|SyncExit)With$', matches: name}}}
                - kind: identifier
                  regex: '^run'
                  matches: {typescript-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Callback|Fork|Promise|PromiseExit|Sync|SyncExit)With$', matches: name}}}
                - kind: identifier
                  all:
                    - not: {regex: '^run'}
                    - matches: aliased
                    - matches: {typescript-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Callback|Fork|Promise|PromiseExit|Sync|SyncExit)With$', matches: name}}}
