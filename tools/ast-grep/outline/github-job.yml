id: github-job
language: yaml
role: item
symbolType: function
utils:
    jobs-pair:
        kind: document > :is(block_node, flow_node) > :is(block_mapping, flow_mapping) > :is(block_mapping_pair, flow_pair)
        has: {field: key, regex: '^(jobs|"jobs"|''jobs'')$'}
    job:
        kind: block_mapping_pair, flow_pair
        inside: {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {matches: jobs-pair}}}
rule:
    matches: job
    pattern: $JOB
    has: {field: key, pattern: $NAME}
rewriters:
    - id: job-key
      rule:
        kind: block_mapping_pair, flow_pair
        pattern: $PAIR
        has: {field: key, regex: '^(needs|uses|runs-on|if|"needs"|"uses"|"runs-on"|"if"|''needs''|''uses''|''runs-on''|''if'')$'}
        inside: {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {matches: job}}}
      transform:
        HEAD: {replace: {source: $PAIR, replace: ':\s*[|>][-+0-9]*\s*\n\s*', by: ': '}}
        LINE: {replace: {source: $HEAD, replace: '\s*\n\s*', by: ' '}}
      fix: $LINE
transform:
    SIGNATURE: {rewrite: {source: $JOB, rewriters: [job-key], joinBy: ', '}}
name: $NAME
signature: $SIGNATURE
isExported: true
