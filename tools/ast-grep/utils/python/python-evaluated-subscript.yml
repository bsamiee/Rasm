# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-evaluated-subscript
language: python
arguments: [value]
utils:
    type-checking-flag:
        any:
            - matches: {python-member-use: {module: {regex: '^typing$'}, name: {regex: '^TYPE_CHECKING$'}}}
            - kind: parenthesized_expression
              has: {matches: type-checking-flag}
    type-checking-block:
        inside:
            kind: block
            stopBy: end
            inside: {kind: 'if_statement, elif_clause', field: consequence, has: {field: condition, matches: type-checking-flag}}
rule:
    kind: identifier, attribute
    all:
        - any:
            - nthChild: 1
              inside: {kind: generic_type}
            - inside: {kind: subscript, field: value, stopBy: {not: {kind: parenthesized_expression}}}
        - matches: value
        - not:
            any:
                - inside: {kind: assignment, field: type, stopBy: end, inside: {kind: function_definition, stopBy: {kind: 'function_definition, class_definition'}}}
                - matches: type-checking-block
                - inside: {kind: type_alias_statement, field: right, stopBy: end}
