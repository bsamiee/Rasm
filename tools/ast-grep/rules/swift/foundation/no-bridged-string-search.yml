# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    scope:
        kind: 'function_declaration, init_declaration, lambda_literal, computed_property, class_body'
    needle:
        kind: value_argument
        nthChild: 1
        has: {field: name, regex: '^of$'}
    searched:
        kind: value_arguments
        all:
            - has: {matches: needle}
            - not: {has: {kind: value_argument, nthChild: 2}}
    replaced:
        kind: value_arguments
        all:
            - has: {matches: needle}
            - has: {kind: value_argument, nthChild: 2, has: {field: name, regex: '^with$'}}
            - not: {has: {kind: value_argument, nthChild: 3}}
    search-call:
        kind: call_expression
        all:
            - has: {nthChild: 1, regex: '(^|\.)range$'}
            - has: {kind: call_suffix, has: {matches: searched}}
    replace-call:
        kind: call_expression
        all:
            - has: {nthChild: 1, regex: '(^|\.)replacingOccurrences$'}
            - has: {kind: call_suffix, has: {matches: replaced}}
    string-extension:
        kind: class_declaration
        all:
            - has: {field: declaration_kind, regex: '^extension$'}
            - has: {field: name, regex: '^((Swift|Foundation)\.)?(String|Substring|StringProtocol|Data)$'}
    bridged-binding:
        kind: 'property_declaration, parameter'
        regex: '(?-u:\b)(NS(Mutable)?(Attributed)?String|Attributed(String|Substring))(?-u:\b)'
        has: {stopBy: end, kind: simple_identifier, pattern: $R}
    data-needle:
        kind: value_argument
        all:
            - matches: needle
            - has: {field: value, kind: simple_identifier, pattern: $N}
            - inside: {stopBy: end, matches: scope, has: {stopBy: end, kind: 'property_declaration, parameter', regex: '(?-u:\b)Data(?-u:\b)', has: {stopBy: end, kind: simple_identifier, pattern: $N}}}
rule:
    kind: call_expression
    pattern: $SITE
    all:
        - any:
            - matches: search-call
            - matches: replace-call
        - not: {has: {kind: call_suffix, has: {kind: value_arguments, has: {matches: data-needle}}}}
        - has:
            nthChild: 1
            any:
                - kind: navigation_expression
                  has: {field: target, pattern: $R, not: {any: [{kind: self_expression}, {regex: '(?-u:\b)(NS(Mutable)?(Attributed)?String|Attributed(String|Substring))(?-u:\b)'}]}}
                - any: [{kind: simple_identifier}, {kind: navigation_expression, has: {field: target, kind: self_expression}}]
                  inside: {stopBy: end, matches: string-extension}
        - not: {inside: {stopBy: end, matches: scope, has: {stopBy: end, matches: bridged-binding}}}
message: '`$SITE` searches through a bridged `NSString` member'
note: 'Call `firstRange(of:)` or `replacing(_:with:)` after guarding an empty needle, with `String(_:)` around a `Substring` receiver''s `replacing` result'
