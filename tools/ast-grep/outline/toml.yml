id: toml-error
language: toml
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {kind: 'pair, table, table_array_element', stopBy: end}}}
        - {kind: 'bare_key, quoted_key, comment', all: [{inside: {kind: ERROR}}, {nthChild: {position: 1, ofRule: {kind: 'bare_key, quoted_key, comment'}}}]}
        - {kind: 'array, inline_table, bare_key, boolean, float, integer, local_date, local_date_time, local_time, offset_date_time', any: [{regex: '^$'}, {has: {regex: '^$'}}]}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: toml-table
language: toml
role: item
symbolType: object
rule:
    kind: table
    has: {kind: 'bare_key, quoted_key, dotted_key', any: [{regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}, {pattern: $KEY}]}
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART}
transform:
    NAME: {rewrite: {source: $KEY, rewriters: [bare, part], joinBy: .}}
name: $BARE$NAME
signature: '[$BARE$NAME]'
---
id: toml-table-element
language: toml
role: item
symbolType: array
rule:
    kind: table_array_element
    has: {kind: 'bare_key, quoted_key, dotted_key', any: [{regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}, {pattern: $KEY}]}
    any: [{has: {kind: pair, has: {kind: 'bare_key, quoted_key', regex: '^["'']?name["'']?$'}, all: [{has: {kind: string, not: {has: {kind: escape_sequence}}, has: {kind: string_content, not: {regex: '[\n\r]'}, pattern: $IDENTITY}}}]}}, {kind: table_array_element}]
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART}
transform:
    NAME: {rewrite: {source: $KEY, rewriters: [bare, part], joinBy: .}}
    IDENTITY_PART: replace($IDENTITY, replace='^', by=' ')
name: $BARE$NAME$IDENTITY_PART
signature: '[[$BARE$NAME]]'
---
id: toml-string
language: toml
role: item
symbolType: string
rule:
    any:
        - {kind: pair, inside: {kind: 'document, ERROR'}, all: [{has: {kind: string}}, {not: {matches: broken}}, {has: {matches: key}}]}
        - {matches: key, inside: {kind: pair, inside: {kind: 'document, ERROR'}, has: {kind: string}}, not: {has: {matches: failed}}}
utils:
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
    broken: {has: {any: [{matches: failed}, {kind: 'dotted_key, string', has: {matches: failed}}]}}
    key: {kind: 'bare_key, quoted_key, dotted_key', any: [{regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}, {pattern: $KEY}]}
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART}
transform:
    NAME: {rewrite: {source: $KEY, rewriters: [bare, part], joinBy: .}}
name: $BARE$NAME
signature: '$BARE$NAME = "…"'
---
id: toml-number
language: toml
role: item
symbolType: number
rule:
    any:
        - {kind: pair, inside: {kind: 'document, ERROR'}, all: [{has: {matches: number}}, {not: {matches: broken}}, {has: {matches: key}}]}
        - {matches: key, inside: {kind: pair, inside: {kind: 'document, ERROR'}, has: {matches: number}}, not: {has: {matches: failed}}}
utils:
    number: {kind: 'integer, float, offset_date_time, local_date_time, local_date, local_time'}
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
    broken: {has: {any: [{matches: failed}, {kind: 'dotted_key, string', has: {matches: failed}}]}}
