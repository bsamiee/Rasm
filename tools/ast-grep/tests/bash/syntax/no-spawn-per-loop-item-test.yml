id: no-spawn-per-loop-item
valid:
    - for f in a b; do cat "$f" & done
    - for f in a b; do cat header "$f"; done
    - for f in a b; do cat "$f" footer; done
    - for f in a b; do shfmt -ln "$f"; done
    - for f in a b; do ast-grep scan -r "$f"; done
    - for f in a b; do git add -C "$f"; done
    - for f in a b; do cat "${f}suffix"; done
    - for f in a b; do cat "${f:-fallback}"; done
    - for f in a b; do cat "$f" > all.txt; done
    - for f in a b; do cat "$f" >> all.txt; done
    - for f in a b; do cat "$f" 2>"$f.err"; done
    - for f in a b; do cat <<<"$f"; done
    - for f in a b; do cat "$f"; status=$?; done
    - for f in a b; do if shellcheck "$f"; then record "$f"; fi; done
    - for f in a b; do ! shellcheck "$f"; done
    - for f in a b; do shellcheck "$f" || record "$f"; done
    - for f in a b; do output=$(cat "$f"); done
    - for f in a b; do jq -s . "$f"; done
    - for f in a b; do yq ".x" "$f"; done
    - for f in a b; do cp "$f" archive/; done
    - for f in a b; do ast-grep test "$f"; done
    - for pattern in a b; do ast-grep run -p "$pattern" .; done
    - for f in a b; do git status "$f"; done
    - for f in a b; do printf add "$f"; done
    - for f in a b; do printf scan "$f"; done
    - for f in a b; do chmod +x "$f"; done
    - for f in a b; do cat -n "$f"; done
    - for f in a b; do mkdir -m "$f"; done
    - for f in a b; do touch -r "$f"; done
    - for f in a b; do shellcheck -s "$f"; done
    - for f in a b; do ast-grep scan --json "$f"; done
    - for f in a b; do ast-grep scan --format sarif "$f"; done
    - for f in a b; do printf rm "$f"; done
    - for f in a b; do actionlint -ignore "$f"; done
    - for f in a b; do rm archive "$f"; done
    - for f in a b; do rmdir empty "$f"; done
    - for f in a b; do mkdir build "$f"; done
    - for f in a b; do touch stamp "$f"; done
    - for f in a b; do shellcheck lib.sh "$f"; done
    - for f in a b; do shfmt lib.sh "$f"; done
    - for f in a b; do actionlint ci.yml "$f"; done
    - for f in a b; do git add other "$f"; done
    - for f in a b; do git rm other "$f"; done
    - for f in a b; do ast-grep scan other "$f"; done
    - for f in a b; do tool "$f"; done
    - while read -r f; do cat "$f"; done
    - for ((i=0; i<3; i++)); do cat "$i"; done
    - cat "${files[@]}"
    - for f in a b; do { cat "$f"; }; done
    - for f in a b; do cat "$f" | head; done
    - for f in a b; do cat "$other"; done
    - for f in a b; do INPUT=data cat "$f"; done
    - |-
      for f in a b; do cat "$f"
      # Status stays readable across a comment
      status=$?; done
invalid:
    - for f in "${files[@]}"; do shellcheck "$f"; done
    - for f in "${files[@]}"; do shfmt "$f"; done
    - for f in "${files[@]}"; do actionlint "$f"; done
    - for f in "${files[@]}"; do rm "$f"; done
    - for f in "${files[@]}"; do rmdir "$f"; done
    - for f in "${files[@]}"; do mkdir "$f"; done
    - for f in "${files[@]}"; do touch "$f"; done
    - for f in "${files[@]}"; do cat "$f"; done
    - for f in a b; do cat -- "${f}"; done
    - for f in a b; do cat $f; done
    - for f in a b; do rm -- $f; done
    - for d in a; do for f in b; do cat "$f"; done; done
    - for f in a b; do git add "$f"; done
    - for f in a b; do git rm "$f"; done
    - for f in a b; do ast-grep scan "$f"; done
    - for f in a b; do git add -- "$f"; done
    - for f in a b; do ast-grep scan -- "$f"; done
    - for f in a b; do cat "$f"; done > all.txt
    - result=$(for f in a b; do cat "$f"; done)
    - |-
      for f in a b; do
      # One synchronous operation
      cat "$f"
      # End of operation
      done
    - for f in a b; do rm -f "$f"; done
    - for f in "${files[@]}"; do rm -rf "$f"; done
    - for f in "${files[@]}"; do rmdir -p "$f"; done
    - for f in "${files[@]}"; do actionlint -oneline "$f"; done
    - for f in "${files[@]}"; do mkdir -p "$f"; done
    - for f in "${files[@]}"; do mkdir -p -m 755 "$f"; done
    - for f in "${files[@]}"; do touch -c "$f"; done
    - for f in "${files[@]}"; do shellcheck -x "$f"; done
    - for f in "${files[@]}"; do touch -r ref "$f"; done
    - for f in "${files[@]}"; do touch -d '2020-01-01' "$f"; done
    - for f in "${files[@]}"; do cat -v "$f"; done
    - for f in "${files[@]}"; do shellcheck -s bash -e SC1091 "$f"; done
    - for f in "${files[@]}"; do shfmt -i 4 -ci "$f"; done
    - for f in "${files[@]}"; do actionlint -config-file cfg.yml "$f"; done
    - for f in "${files[@]}"; do git add -f "$f"; done
    - for f in "${files[@]}"; do git rm --cached "$f"; done
    - for f in "${files[@]}"; do ast-grep scan -U "$f"; done
    - for f in "${files[@]}"; do ast-grep scan -c cfg.yml --filter '^x$' "$f"; done
    - for f in "${files[@]}"; do ast-grep scan --json=stream "$f"; done
