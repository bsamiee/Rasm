# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-angle-conversion
language: rustlang
utils:
    pi:
        kind: 'identifier, scoped_identifier'
        regex: '^((::)?(std|core)::)?((f32|f64)::)?(consts::)?(PI|TAU)$'
    half-turn:
        kind: 'float_literal, integer_literal'
        regex: '^(180|360)(\.0*)?(_?f(32|64))?$'
    factor:
        kind: float_literal
        any:
            - regex: '^5_?7\.2_?9_?5[0-9_]*(_?f(32|64))?$'
            - regex: '^0\.0_?1_?7_?4_?5_?3[0-9_]*(_?f(32|64))?$'
rule:
    kind: 'binary_expression, call_expression'
    any:
        - matches:
            rust-scaled-ratio:
                numerator: {matches: pi, regex: 'PI$'}
                denominator: {matches: half-turn, regex: '^180'}
        - matches:
            rust-scaled-ratio:
                numerator: {matches: half-turn, regex: '^180'}
                denominator: {matches: pi, regex: 'PI$'}
        - matches:
            rust-scaled-ratio:
                numerator: {matches: pi, regex: 'TAU$'}
                denominator: {matches: half-turn, regex: '^360'}
        - matches:
            rust-scaled-ratio:
                numerator: {matches: half-turn, regex: '^360'}
                denominator: {matches: pi, regex: 'TAU$'}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\*$'}
            - any: [{has: {field: left, matches: factor}}, {has: {field: right, matches: factor}}]
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^/$'}
            - has: {field: right, matches: factor}
        - pattern: $_VALUE.mul_add($_FACTOR, $_OFFSET)
          has: {field: arguments, has: {nthChild: 1, matches: factor}}
