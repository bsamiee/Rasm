# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-restated-write-target
language: python
severity: error
utils:
    target-argument:
        kind: keyword_argument
        has: {field: name, regex: '^target$'}
    restated:
        kind: identifier
        pattern: $SHARED
        not: {any: [{inside: {kind: attribute, field: attribute}}, {inside: {kind: keyword_argument, field: name}}]}
        inside:
            kind: call
            stopBy: end
            has: {field: arguments, has: {matches: target-argument, has: {field: value, has: {stopBy: end, kind: identifier, pattern: $SHARED, not: {inside: {kind: attribute, field: attribute}}}}}}
    discarding-write:
        kind: lambda
        pattern: $WRITE
        all:
            - has: {field: parameters, has: {nthChild: 1, kind: identifier, pattern: $DISCARDED}}
            - not: {has: {field: body, has: {stopBy: end, kind: identifier, pattern: $DISCARDED}}}
            - has: {field: body, has: {stopBy: end, matches: restated}}
rule:
    kind: keyword_argument
    all:
        - has: {field: name, regex: '^write$'}
        - has: {field: value, matches: discarding-write}
        - inside: {kind: argument_list, has: {matches: target-argument}}
message: '`$WRITE` ignores the value it receives and restates `$SHARED` from the row''s `target`'
note: 'Write the received value, `write=lambda <value>: <write of value>`, `target` then states once what the row writes'
