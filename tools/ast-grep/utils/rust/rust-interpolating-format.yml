# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-interpolating-format
language: rust
rule:
    kind: macro_invocation
    all:
        - has: {field: macro, regex: '^((::)?(std|alloc)::)?format$'}
        - has:
            kind: token_tree
            any:
                - has: {nthChild: 1, kind: string_literal, regex: '\{[A-Za-z_]'}
                - has: {kind: identifier, follows: {stopBy: end, regex: '^,$'}, not: {any: [{regex: '^(std|core|alloc)$'}, {precedes: {regex: '^(!|::)$'}}]}}
