# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "darkroom"
dynamic         = ["version"]
requires-python = ">=3.13"

dependencies = [
    "colour-science",
    "expression",
    "msgspec",
    "numpy",
    "opencolorio",
    "openimageio",
    "scipy",
    "typing-extensions",
]

# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
managed = false

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml"
