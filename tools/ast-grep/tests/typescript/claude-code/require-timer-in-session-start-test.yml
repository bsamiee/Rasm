id: require-timer-in-session-start
valid:
    # The correction, the timer registered in the session.start hook
    - |
      on('session.start', ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # The after timer in the session.start hook
    - |
      on('session.start', async ($, e, next) => {
          $.clock.after(1000, tick);
          return next(e);
      });
    # Timer inside a closure of the session.start hook, the hook still owns it
    - |
      on('session.start', ($, e, next) => {
          const arm = (): void => {
              $.clock.every(60000, tick);
          };
          arm();
          return next(e);
      });
    # The session.start hook under a matcher
    - |
      on('session.start', { source: 'startup' }, ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # Function expression as the session.start hook
    - |
      on('session.start', function ($, e, next) {
          $.clock.every(60000, tick);
          return next(e);
      });
    # Double-quoted event name
    - |
      on("session.start", ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # Clock read anywhere, no timer
    - |
      on('tool.call', ($, e, next) => {
          const started = $.clock.now();
          return next(e);
      });
    # Sleep anywhere, no timer
    - |
      on('tool.call', async ($, e, next) => {
          await $.clock.sleep(10);
          return next(e);
      });
    # Another noun with a member named every
    - |
      on('tool.call', ($, e, next) => {
          $.store.every(1000, tick);
          return next(e);
      });
    # Another object with a clock member, the engine interface alone is $
    - |
      on('tool.call', ($, e, next) => {
          timer.clock.every(60000, tick);
          return next(e);
      });
    # Timer in the session.start hook registered through a parameter typed On under another name
    - |
      const arm = (register: On): void => {
          register('session.start', ($, e, next) => {
              $.clock.every(60000, tick);
              return next(e);
          });
      };
    # Timer inside a nested hook-shaped closure of the session.start hook
    - |
      on('session.start', ($, e, next) => {
          const later = ($, e, next) => {
              $.clock.every(60000, tick);
              return next(e);
          };
          return next(e);
      });
    # session.start hook bound to a name before the registration
    - |
      const start = ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      };
      on('session.start', start);
    # Timer cancelled anywhere, no registration
    - |
      on('tool.call', ($, e, next) => {
          timer.cancel();
          return next(e);
      });
    # Timer in a session.start hook nested inside a tool.call hook, no-registration-outside-register reports the inner registration
    - |
      on('tool.call', ($, e, next) => {
          on('session.start', ($, e, next) => {
              $.clock.every(60000, tick);
              return next(e);
          });
          return next(e);
      });
invalid:
    # The instance, an every timer in a tool.call hook
    - |
      on('tool.call', ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # The after timer in a turn.complete hook
    - |
      on('turn.complete', ($, e, next) => {
          $.clock.after(1000, tick);
          return next(e);
      });
    # Timer at module level
    - |
      $.clock.every(60000, tick);
    # Timer in the register body outside any on(...) call
    - |
      const register = (on, options) => {
          $.clock.every(60000, tick);
          on('session.start', ($, e, next) => next(e));
      };
    # Timer in a hook on an event name that starts with session.start
    - |
      on('session.started', ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # Timer inside a function passed to a call other than on, no hook owns it
    - |
      other('session.start', ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # Event name in a later argument position, the event slot is the first argument alone
    - |
      on('tool.call', 'session.start', ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      });
    # Timer in a tool.call hook registered through a parameter typed On
    - |
      const arm = (register: On): void => {
          register('tool.call', ($, e, next) => {
              $.clock.every(60000, tick);
              return next(e);
          });
      };
    # Timer under a matched hook of another event
    - |
      on('turn.complete', { reason: 'answer' }, ($, e, next) => {
          $.clock.after(1000, tick);
          return next(e);
      });
    # Timer in a hook bound to a name, the event name in a later argument position
    - |
      const hook = ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      };
      on('tool.call', 'session.start', hook);
    # Hook bound to a name registered on another event
    - |
      const hook = ($, e, next) => {
          $.clock.every(60000, tick);
          return next(e);
      };
      on('tool.call', hook);
    # Timer in an async iife inside a turn.complete hook
    - |
      on('turn.complete', ($, e, next) => {
          void (async () => {
              $.clock.after(1000, tick);
          })();
          return next(e);
      });
