# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-hex-pair-parse
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $PARSE
    matches: rust-hex-pair-parse
message: '`$PARSE` decodes hex text two digits at a time'
note: 'Decode the whole text with `data_encoding::HEXLOWER_PERMISSIVE.decode(<text>.as_bytes())`, `HEXLOWER_PERMISSIVE` accepts either case and reports the first invalid position as a `DecodeError`'
