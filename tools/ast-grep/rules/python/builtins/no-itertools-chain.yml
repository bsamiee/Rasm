# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-itertools-chain
language: python
severity: error
utils:
    chain-function:
        matches: {python-member-use: {module: {regex: '^itertools$'}, name: {regex: '^chain$'}}}
    chain-head:
        any:
            - matches: chain-function
            - kind: list_splat
              has: {matches: chain-function}
    fixed-chain:
        kind: call
        all:
            - has: {field: function, matches: chain-head}
            - has:
                field: arguments
                any:
                    - kind: generator_expression
                    - kind: argument_list
                      has: {pattern: $_}
                      not: {has: {kind: 'list_splat, dictionary_splat, keyword_argument'}}
    spread-chain:
        kind: call
        any:
            - all:
                - has: {field: function, kind: attribute, all: [{has: {field: object, matches: chain-head}}, {has: {field: attribute, regex: '^from_iterable$'}}]}
                - has:
                    field: arguments
                    any:
                        - kind: generator_expression
                        - kind: argument_list
                          has: {nthChild: 1, not: {kind: 'list_splat, dictionary_splat, keyword_argument'}}
                          not: {has: {nthChild: 2}}
            - all:
                - has: {field: function, matches: chain-head}
                - has: {field: arguments, kind: argument_list, has: {kind: list_splat}, not: {has: {kind: 'dictionary_splat, keyword_argument'}}}
    chain-call:
        any: [{matches: fixed-chain}, {matches: spread-chain}]
    collector:
        matches: {python-builtin-name: {name: {regex: '^(list|set|tuple)$'}}}
    wrapper:
        matches: {python-builtin-name: {name: {regex: '^(frozenset|sorted)$'}}}
    display-head:
        any:
            - kind: list_splat
            - kind: attribute
              has: {field: object, kind: list_splat}
    plain-source:
        not: {kind: 'conditional_expression, lambda, named_expression'}
    single-source:
        has: {field: arguments, any: [{kind: generator_expression}, {not: {has: {nthChild: 2}}}]}
    foldable:
        kind: generator_expression
        not: {has: {stopBy: end, any: [{kind: for_in_clause, regex: '^async\b'}, {kind: identifier, regex: '^item$'}, {kind: generator_expression}]}}
    iterable-walrus:
        matches: spread-chain
        has: {field: arguments, has: {stopBy: end, kind: named_expression}}
    chain-at:
        any:
            - {matches: chain-call, pattern: $K}
            - has: {matches: chain-call, pattern: $K}
            - has: {field: arguments, has: {matches: chain-call, pattern: $K}}
rule:
    pattern: $M
    all:
        - not: {has: {kind: comment, stopBy: end}}
        - any:
            - kind: call
              all:
                - has: {field: function, matches: collector}
                - has: {field: arguments, kind: argument_list, has: {nthChild: 1, matches: chain-call}, not: {has: {nthChild: 2}}}
            - kind: call
              matches: chain-call
              nthChild: 1
              inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: wrapper}}}
            - kind: list_splat
              has: {matches: chain-call}
            - kind: 'list, set'
              has: {nthChild: 1, matches: chain-call, has: {field: function, matches: display-head}}
              not: {has: {nthChild: 2}}
        - any:
            - pattern: $UNFIXED
              any: [{matches: iterable-walrus}, {has: {matches: iterable-walrus}}, {has: {field: arguments, has: {matches: iterable-walrus}}}]
            - {pattern: $FIXED, matches: chain-at}
rewriters:
    - id: star
      rule: {pattern: $ITEM}
      fix: '*$ITEM'
    - id: fixed-items
      rule: {kind: call, matches: fixed-chain, pattern: '$CHAIN($$$ITEMS)', has: {field: arguments, kind: argument_list}}
      transform:
        STARRED: rewrite($$$ITEMS, rewriters=[star], joinBy=', ')
      fix: $STARRED
    - id: generator-items
      rule: {kind: call, matches: fixed-chain, has: {field: arguments, kind: generator_expression, pattern: $GENERATOR}}
      fix: '*$GENERATOR'
    - id: folded
      rule: {kind: call, matches: spread-chain, has: {field: arguments, matches: foldable, pattern: $GENERATOR, has: {field: body, pattern: $ITEMS}}}
      transform:
        INNER: {rewrite: {source: $ITEMS, rewriters: [plain-inner, grouped-inner]}}
        UNBODIED: {rewrite: {source: $GENERATOR, rewriters: [kept-clause, dropped-body]}}
        CLAUSES: {replace: {source: $UNBODIED, replace: '(?s)^\(\s*(.*?)\s*\)$', by: '$1'}}
      fix: 'item $CLAUSES for item in $INNER'
    - id: kept-clause
      rule: {kind: 'for_in_clause, if_clause', pattern: $CLAUSE}
      fix: $CLAUSE
    - id: dropped-body
      rule: {nthChild: 1, not: {kind: generator_expression}}
      fix: ''
    - id: plain-inner
      rule: {pattern: $ITEMS, matches: plain-source}
      fix: $ITEMS
    - id: grouped-inner
      rule: {pattern: $ITEMS}
      fix: '($ITEMS)'
    - id: plain-from-iterable
      rule:
        kind: call
        all:
            - has: {field: function, kind: attribute, has: {field: attribute, regex: '^from_iterable$'}}
            - has: {field: arguments, any: [{kind: generator_expression, pattern: $SOURCE}, {has: {nthChild: 1, matches: plain-source, pattern: $SOURCE}}]}
      fix: 'item for iterable in $SOURCE for item in iterable'
    - id: from-iterable
      rule:
        kind: call
        all:
            - has: {field: function, kind: attribute, has: {field: attribute, regex: '^from_iterable$'}}
            - has: {field: arguments, has: {nthChild: 1, pattern: $SOURCE}}
      fix: 'item for iterable in ($SOURCE) for item in iterable'
    - id: plain-sole-splat
      rule: {kind: call, has: {field: arguments, not: {has: {nthChild: 2}}, has: {kind: list_splat, has: {matches: plain-source, pattern: $SOURCE}}}}
      fix: 'item for iterable in $SOURCE for item in iterable'
    - id: sole-splat
      rule: {kind: call, has: {field: arguments, not: {has: {nthChild: 2}}, has: {kind: list_splat, has: {pattern: $SOURCE}}}}
      fix: 'item for iterable in ($SOURCE) for item in iterable'
    - id: mixed-splat
      rule: {kind: call, has: {field: arguments, pattern: $SOURCES}}
      fix: 'item for iterable in $SOURCES for item in iterable'
    - id: list-collector
      rule: {kind: call, has: {field: function, regex: '^list$'}}
      fix: '[|]'
    - id: set-collector
      rule: {kind: call, has: {field: function, regex: '^set$'}}
      fix: '{|}'
    - id: tuple-spread
      rule:
        kind: call
        all:
            - has: {field: function, regex: '^tuple$'}
            - has: {field: arguments, has: {matches: spread-chain}}
      fix: 'tuple(|)'
    - id: tuple-single
      rule:
        kind: call
        all:
            - has: {field: function, regex: '^tuple$'}
            - has: {field: arguments, has: {matches: single-source}}
      fix: '(|,)'
    - id: tuple-fixed
      rule: {kind: call, has: {field: function, regex: '^tuple$'}}
      fix: '(|)'
    - id: wrapped-set
      rule: {kind: call, matches: fixed-chain, inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^frozenset$'}}}}
      fix: '{|}'
    - id: wrapped-list
      rule: {kind: call, matches: fixed-chain}
      fix: '[|]'
    - id: wrapped-sole
      rule: {kind: call, inside: {kind: argument_list, not: {has: {nthChild: 2}}}}
      fix: '|'
    - id: wrapped-spread
      rule: {kind: call}
      fix: '(|)'
    - id: splat-spread
      rule: {kind: list_splat, has: {matches: spread-chain}}
      fix: '*(|)'
    - id: splat-fixed
      rule: {kind: list_splat}
      fix: '|'
    - id: display-list
      rule: {kind: list}
      fix: '[|]'
    - id: display-set
      rule: {kind: set}
      fix: '{|}'
transform:
    BODY: rewrite($K, rewriters=[fixed-items, generator-items, folded, plain-from-iterable, from-iterable, plain-sole-splat, sole-splat, mixed-splat])
    WRAP: rewrite($FIXED, rewriters=[list-collector, set-collector, tuple-spread, tuple-single, tuple-fixed, wrapped-set, wrapped-list, wrapped-sole, wrapped-spread, splat-spread, splat-fixed, display-list, display-set])
    OPEN: {replace: {source: $WRAP, replace: '^(.*)\|.*$', by: '$1'}}
    CLOSE: {replace: {source: $WRAP, replace: '^.*\|(.*)$', by: '$1'}}
fix: $OPEN$BODY$CLOSE$UNFIXED
message: '`$M` concatenates iterables through `itertools.chain`'
note: 'Use a display unpacking each iterable (`[*<a>, *<b>]`) or a nested comprehension (`[<item> for <iterable> in <iterables> for <item> in <iterable>]`), displays build the collection with no intermediate iterator'
