id: <item-extractor-id>
language: <language>
role: item
symbolType: <lsp-symbol-kind>
rule:
    kind: <item-kind>
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    any:
        - inside: {kind: <module-kind>}
        - inside: {kind: <export-kind>, inside: {kind: <module-kind>}}
transform:
    BODYLESS: {replace: {source: $DECLARATION, replace: '\s*(\{[\s\S]*$|=>[\s\S]*$|;\s*$)', by: ''}}
    LINE: {replace: {source: $BODYLESS, replace: '\s*\n\s*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '\s+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {inside: {kind: <export-kind>}}
