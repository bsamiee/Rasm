# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
rule:
    kind: expansion
    all:
        - has: {field: operator, regex: '^/'}
        - has:
            pattern: $DATA
            any:
                - matches: bash-string-expansion
                - kind: concatenation
                  has: {matches: bash-string-expansion}
            follows: {regex: '^/$'}
labels:
    DATA: {style: primary, message: Unquoted replacement data}
message: 'Unquoted replacement data `$DATA` treats `&` as matched text under `patsub_replacement`'
note: Quote replacement data while preserving existing literal quoting
