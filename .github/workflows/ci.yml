name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    affected:
        runs-on: [self-hosted, host]
        timeout-minutes: 30
        outputs:
            engines: ${{ steps.listed.outputs.engines }}
        env: &cache
            GH_TOKEN: ${{ github.token }}
            UV_LOCKED: "true"
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: &server ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: &token ${{ github.event_name == 'push' && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - &untracked
              run: git clean -ffd
            - &cores
              run: |
                  cores="$(getconf _NPROCESSORS_ONLN)"
                  since="$(date +%s)"
                  printf "%s\n" "NX_PARALLEL=${cores}" "NX_SINCE=${since}000" >> "${GITHUB_ENV}"
            - &shas
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
            - &tools
              uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
              with:
                  cache: ${{ runner.environment == 'github-hosted' }}
            - &packages
              run: pnpm install
            - run: nx sync:check
            - id: listed
              run: |
                  linux="$(nx show projects --affected --exclude='*,!tag:os:linux' --json)"
                  engines="$(git ls-files -z -- "*.uproject" | xargs -0 cat | jq --slurp --compact-output --argjson affected "${linux}" 'if $affected == [] then [] else map(.EngineAssociation | strings | select(test("^[0-9.]+$"))) | unique end')"
                  printf "engines=%s\n" "${engines}" >> "${GITHUB_OUTPUT}"

    linux:
        needs: affected
        runs-on: [self-hosted, host]
        timeout-minutes: 120
        env: *cache
        steps:
            - *checkout
            - *untracked
            - *cores
            - *shas
            - *tools
            - *packages
            - run: playwright install --with-deps --only-shell chromium
            - run: nx affected --targets=check,test,build --exclude=tag:os:darwin
            - &timed
              if: always()
              run: |
                  stores=("${NX_WORKSPACE_DATA_DIRECTORY}"/*.db)
                  sqlite3 -markdown "${stores[0]}" "select round((h.end - h.start) / 1000.0) as seconds, h.status, d.project || ':' || d.target as task from task_history h join task_details d on d.hash = h.hash where h.start >= ${NX_SINCE} order by seconds desc limit 30" >> "${GITHUB_STEP_SUMMARY}"
            - &reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.job }}-reports
                  if-no-files-found: ignore
                  path: |
                      .artifacts/playwright
                      .artifacts/vitest

    macos:
        runs-on: xcode-27
        timeout-minutes: 120
        env: *cache
        steps:
            - *checkout
            - *cores
            - *shas
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest
            - *tools
            - *packages
            - run: nx build @rasm/nx-apple-darwin-arm64
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:darwin,!tag:os:all'
              env:
                  APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
                  APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            - *timed
            - *reports

    unreal:
        needs: affected
        if: ${{ needs.affected.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.affected.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            UV_LOCKED: "true"
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: "false"
        steps:
            - *checkout
            - *untracked
            - *cores
            - *shas
            - run: |
                  kept="${GITHUB_WORKSPACE}/.cache"
                  printf "%s\n" "MISE_DATA_DIR=${kept}/mise" "RUSTUP_HOME=${kept}/mise/rustup" "CARGO_HOME=${kept}/mise/cargo" "PNPM_CONFIG_STORE_DIR=${kept}/pnpm" >> "${GITHUB_ENV}"
            - *tools
            - *packages
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:linux'
