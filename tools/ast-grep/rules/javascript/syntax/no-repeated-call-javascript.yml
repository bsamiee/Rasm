# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-call-javascript
language: javascript
severity: error
utils:
    scope:
        any:
            - matches: javascript-function-boundary
            - kind: 'expression_statement, return_statement, lexical_declaration, variable_declaration, if_statement, for_statement, for_in_statement, while_statement, do_statement, switch_statement, switch_case, switch_default, catch_clause, throw_statement, statement_block, class_declaration, field_definition, export_statement'
    holds-call:
        any:
            - pattern: $CALL
            - not: {matches: javascript-function-boundary}
              has: {stopBy: {matches: javascript-function-boundary}, pattern: $CALL}
    repeat-site:
        all:
            - not: {matches: scope}
            - follows: {stopBy: end, not: {inside: {kind: ternary_expression, field: consequence}}, matches: holds-call}
    tested:
        kind: if_statement
        has: {field: condition, matches: holds-call}
    other-arm:
        any:
            - kind: ternary_expression
              has: {field: alternative, matches: holds-call}
            - kind: if_statement
              has: {field: alternative, not: {has: {kind: if_statement}}, matches: holds-call}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: arguments, has: {pattern: $_}}
        - has: {field: function, kind: 'identifier, member_expression'}
        - not: {has: {kind: 'await_expression, yield_expression, arrow_function, function_expression, generator_function, assignment_expression, augmented_assignment_expression, update_expression', stopBy: end}}
        - any:
            - matches: repeat-site
            - inside: {stopBy: {matches: scope}, matches: repeat-site}
            - inside: {stopBy: {matches: javascript-function-boundary}, field: consequence, matches: tested}
            - inside: {stopBy: {matches: javascript-function-boundary}, field: alternative, matches: tested}
            - inside: {stopBy: {matches: javascript-function-boundary}, field: consequence, matches: other-arm}
message: '`$CALL` is evaluated again in one statement or once in every arm of a branch'
note: 'Bind the call to a name before the statement or branch and read the name at each use'
