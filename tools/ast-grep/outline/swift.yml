id: swift-member-enum-case
language: swiftlang
role: member
parentRuleIds: [swift-enum]
symbolType: enumMember
rule:
    kind: enum_entry
    pattern: $DECLARATION
    inside: {kind: 'source_file > class_declaration > enum_class_body'}
    any:
        - has: {field: name, kind: simple_identifier, pattern: $SINGLE_NAME}
          not: {has: {kind: simple_identifier, follows: {regex: '^,$', stopBy: {not: {kind: 'comment, multiline_comment'}}}}}
        - pattern: $GROUP_DECLARATION
rewriters:
    - id: raw-value
      rule:
          all:
              - not: {has: {pattern: $$_}}
              - regex: '^=$'
      fix: {template: '', expandEnd: {not: {kind: 'comment, multiline_comment'}, stopBy: {not: {kind: 'comment, multiline_comment'}}}}
    - id: noncase
      rule: {not: {kind: 'enum_entry, simple_identifier'}}
      fix: ''
    - id: case
      rule:
          kind: simple_identifier
          pattern: $CASE_NAME
      fix: '$CASE_NAME, '
transform:
    NAMES: {rewrite: {source: $GROUP_DECLARATION, rewriters: [raw-value, noncase, case], joinBy: ''}}
    GROUP_NAME: {replace: {source: $NAMES, replace: ', $', by: ''}}
name: $SINGLE_NAME$GROUP_NAME
signature: $DECLARATION

