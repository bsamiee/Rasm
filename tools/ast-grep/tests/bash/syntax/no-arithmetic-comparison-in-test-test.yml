# Numeric operators in [[ ]] share arithmetic evaluation; test/[ decimal and string comparisons remain distinct.
id: no-arithmetic-comparison-in-test
valid:
    - ((count == 1))
    - '[[ $text == 01 ]]'
    - '[[ $text > 9 ]]'
    - '[[ $text =~ ^1$ ]]'
    - '[[ $file -nt other ]]'
    - test "$text" = 1
    - test "$count" -lt 10
    - '[ "$count" -eq 1 ]'
    - '[ ! "$a" -eq 1 ]'
    - '[ "$a" -eq 1 -a "$b" -eq 2 ]'
    - '[[ $( [ "$n" -eq 1 ] && printf yes ) ]]'
    - compare "$a" -eq "$b"
invalid:
    - '[[ $a -eq $b ]]'
    - '[[ $a -ne $b ]]'
    - '[[ $a -lt $b ]]'
    - '[[ $a -le $b ]]'
    - '[[ $a -gt $b ]]'
    - '[[ $a -ge $b ]]'
    - '[[ $a -eq 1 && $b -eq 2 ]]'
    - '[[ -n $text && $a -eq 1 ]]'
    - '[[ ! ( $a -eq 1 ) ]]'
    - '[[ "" -eq 0 ]]'
    - '[[ "2+3" -eq "4|1" ]]'
    - '[[ $1 -eq 1 ]]'
    - '[[ $# -eq 2 ]]'
    - '[[ $(wc -l <f) -eq 0 ]]'
    - '[[ ${count:-0} -gt 1 ]]'
    - while [[ $i -lt 10 ]]; do ((i++)); done
