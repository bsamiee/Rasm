# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-unstructured-task
language: swiftlang
rule:
    any:
        - kind: call_expression
          has: {nthChild: 1, kind: navigation_expression, regex: '^_Concurrency\.Task$'}
        - matches: {swift-task-call: {member: {regex: '^(init|detached|immediate|immediateDetached)$'}}}
        - kind: constructor_expression
          has: {field: constructed_type, matches: swift-task-type}
