            - kind: function_declaration, generator_function_declaration, class_declaration, abstract_class_declaration, enum_declaration
              has: {field: name, pattern: $OUTLINE_SCHEMA_ROOT}
            - kind: internal_module, module
              has: {field: name, matches: schema-namespace-root}
            - kind: expression_statement
              has: {matches: schema-root-declaration}
            - kind: export_statement, ambient_declaration
              has: {matches: schema-root-declaration}
            - kind: import_alias
              has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_SCHEMA_ROOT}
            - kind: import_statement
              has: {kind: import_require_clause, has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_SCHEMA_ROOT}}
    schema-root:
        kind: identifier
        pattern: $OUTLINE_SCHEMA_ROOT
        not:
            inside:
                kind: statement_block
                stopBy: end
                has: {matches: schema-root-declaration}
    schema-namespace-import:
        kind: import_clause
        has: {kind: namespace_import, has: {kind: identifier, pattern: $OUTLINE_SCHEMA_ROOT}}
    schema-import:
        kind: import_statement
        all:
            - not: {has: {regex: '^type$', not: {kind: identifier}}}
            - any:
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                    - has:
                        kind: import_clause
                        has:
                            kind: named_imports
                            has:
                                kind: import_specifier
                                all:
                                    - has:
                                        field: name
                                        any:
                                            - regex: '^Schema$'
                                            - kind: string
                                              not: {has: {kind: escape_sequence}}
                                              has: {kind: string_fragment, regex: '^Schema$'}
                                    - any:
                                        - has: {field: alias, pattern: $OUTLINE_SCHEMA_ROOT}
                                        - has: {field: name, pattern: $OUTLINE_SCHEMA_ROOT}
                                          not: {has: {field: alias, pattern: $_}}
                                    - not: {has: {regex: '^type$', not: {kind: identifier}}}
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Schema$'}}
                    - has: {matches: schema-namespace-import}
    schema-module:
        any:
            - kind: identifier
              all:
                  - matches: schema-root
                  - inside: {kind: program, stopBy: end, has: {matches: schema-import}}
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^Schema$'}
                  - has: {field: object, matches: schema-root}
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                                - has: {matches: schema-namespace-import}
    schema-constructor:
        any:
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^(Struct|TaggedUnion)$'}
                  - has: {field: object, matches: schema-module}
            - kind: identifier
              all:
                  - matches: schema-root
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Schema$'}}
                                - has:
                                    kind: import_clause
                                    has:
                                        kind: named_imports
                                        has:
                                            kind: import_specifier
                                            all:
                                                - has:
                                                    field: name
                                                    any:
                                                        - regex: '^(Struct|TaggedUnion)$'
                                                        - kind: string
                                                          not: {has: {kind: escape_sequence}}
                                                          has: {kind: string_fragment, regex: '^(Struct|TaggedUnion)$'}
                                                - any:
                                                    - has: {field: alias, pattern: $OUTLINE_SCHEMA_ROOT}
                                                    - has: {field: name, pattern: $OUTLINE_SCHEMA_ROOT}
                                                      not: {has: {field: alias, pattern: $_}}
                                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
    schema-value:
        any:
            - kind: call_expression
              has: {field: function, matches: schema-constructor}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: schema-value}
rule:
    kind: assignment_expression
    pattern: $DECLARATION
    inside: {kind: expression_statement, inside: {kind: program}}
    all:
        - has: {field: left, kind: member_expression, pattern: $NAME}
        - has: {field: right, matches: schema-value}
rewriters:
    - id: block
      rule: {kind: statement_block, has: {pattern: $_}}
      fix: '{…}'
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: array
      rule: {kind: array, has: {pattern: $_}}
      fix: '[…]'
transform:
    SHAPED: {rewrite: {source: $DECLARATION, rewriters: [block, object, array]}}
    SIGNATURE: {replace: {source: $SHAPED, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: false

---
id: typescript-invocation
language: tsxlang
role: item
symbolType: event
rule:
    kind: expression_statement
    pattern: $STATEMENT
    inside: {kind: program}
    has:
        kind: call_expression
        has:
            field: function
            pattern: $CALLEE
            any:
                - kind: member_expression
                  has: {field: property, regex: '^(runMain|runFork|runPromise|runSync)$'}
                - kind: member_expression
                  has: {field: property, regex: '^pipe$'}
                  inside:
                    kind: call_expression
                    has:
                        field: arguments
                        has:
                            any:
                                - kind: member_expression
                                  has: {field: property, regex: '^(runMain|runFork|runPromise|runSync)$'}
                                - kind: call_expression
                                  has: {field: function, kind: member_expression, has: {field: property, regex: '^(runMain|runFork|runPromise|runSync)$'}}
rewriters:
    - id: block
      rule: {kind: statement_block, has: {pattern: $_}}
      fix: '{…}'
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
transform:
    SHAPED: {rewrite: {source: $STATEMENT, rewriters: [block, object]}}
    SIGNATURE: {replace: {source: $SHAPED, replace: '\s*;?\s*$', by: ''}}
name: $CALLEE
signature: $SIGNATURE
isExported: false

