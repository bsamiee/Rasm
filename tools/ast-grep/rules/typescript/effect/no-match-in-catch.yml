# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-match-in-catch
language: tsx
severity: error
utils:
    error-handler:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            pattern: $HANDLER
            all:
                - has: {field: property, regex: '^(catch|catchEager|catchCause|catchIf|catchFilter|tapError|tapCause)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Layer)$'}}}}
    callback-parameter:
        kind: arrow_function, function_expression
        any:
            - has: {field: parameter, kind: identifier, pattern: $E}
            - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $E}}}
    tag-parameter:
        kind: arrow_function, function_expression
        has:
            field: parameters
            has:
                kind: required_parameter
                has:
                    field: pattern
                    kind: object_pattern
                    has:
                        any:
                            - {kind: shorthand_property_identifier_pattern, regex: '^_tag$', pattern: $T}
                            - {kind: pair_pattern, all: [{has: {field: key, regex: '^_tag$'}}, {has: {field: value, kind: identifier, pattern: $T}}]}
    selector:
        kind: member_expression
        any:
            - all: [{has: {field: property, regex: '^(value|valueTags)$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '\bMatch$'}}}}}]
            - all: [{has: {field: property, regex: '^isTagged$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '\bPredicate$'}}}}}]
            - all: [{has: {field: property, regex: '^is$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '\bSchema$'}}}}}]
    selected:
        kind: call_expression
        has: {field: function, any: [{matches: selector}, {kind: call_expression, has: {field: function, matches: selector}}]}
    selection:
        any:
            - kind: call_expression
              all:
                - matches: selected
                - has: {field: arguments, has: {nthChild: 1, any: [{kind: identifier, pattern: $E}, {pattern: $E._tag}]}}
            - kind: switch_statement
              has: {field: value, has: {pattern: $E._tag}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^[!=]==?$'}
                - has: {pattern: $E._tag}
            - kind: binary_expression
              all:
                - has: {field: left, kind: identifier, pattern: $E}
                - has: {field: operator, regex: '^instanceof$'}
            - kind: call_expression
              all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bCause$'}, member: {regex: '^(is|has)[A-Z]\w*$'}}}}
                - has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $E}}
    tag-selection:
        any:
            - kind: call_expression
              all:
                - matches: selected
                - has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $T}}
            - kind: switch_statement
              has: {field: value, has: {kind: identifier, pattern: $T}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^[!=]==?$'}
                - has: {kind: identifier, pattern: $T}
    type-matcher:
        kind: call_expression
        any:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^pipe$'}
                    - has: {field: object, kind: call_expression, has: {field: function, matches: {effect-module-member: {module: {regex: '\bMatch$'}, member: {regex: '^type$'}}}}}
            - has: {field: function, kind: call_expression, has: {field: function, matches: {effect-module-member: {module: {regex: '\bMatch$'}, member: {regex: '^typeTags$'}}}}}
    refailing-catch:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^catch$'}}}}
            - has: {field: arguments, has: {matches: callback-parameter, has: {stopBy: end, pattern: $_MODULE.fail($E)}}}
rule:
    matches: error-handler
    all:
        - has:
            field: arguments
            has:
                nthChild: {position: 1, reverse: true}
                any:
                    - matches: callback-parameter
                      has: {stopBy: {matches: typescript-function-boundary}, matches: selection}
                    - matches: tag-parameter
                      has: {stopBy: {matches: typescript-function-boundary}, matches: tag-selection}
                    - matches: type-matcher
        - not: {matches: refailing-catch}
message: '`$HANDLER` selects the failure by hand inside its callback'
note: 'Call `catchTag`, `catchTags`, `tapErrorTag`, or `catchIf` of the same module to select the failure by `_tag` or predicate, `catchCauseIf` or `tapCauseIf` to select the cause by a `Cause` refinement'
