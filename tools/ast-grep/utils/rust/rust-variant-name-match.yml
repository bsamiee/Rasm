# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-variant-name-match
language: rustlang
arguments: [type, method]
utils:
    literal-text:
        any:
            - kind: string_literal
            - kind: macro_invocation
              all:
                - matches: {rust-std-macro: {name: {regex: '^write$'}}}
                - has: {kind: token_tree, regex: '^\(\p{Pattern_White_Space}*\p{XID_Continue}+\p{Pattern_White_Space}*,\p{Pattern_White_Space}*"[^"{}\\]*"\p{Pattern_White_Space}*,?\p{Pattern_White_Space}*\)$'}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^write_str$'}}
                - has: {field: arguments, has: {nthChild: 1, kind: string_literal}, not: {has: {nthChild: 2}}}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, kind: string_literal}}, {has: {field: field, regex: '^(to_owned|to_string|into)$'}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^(String|Cow)::(from|Borrowed)$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, kind: string_literal}}, {not: {has: {nthChild: 2}}}]}
            - kind: block
              all:
                - has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, any: [{matches: literal-text}, {kind: expression_statement, has: {matches: literal-text}}]}
                - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
    unit-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, regex: '^\p{XID_Continue}+::\p{XID_Continue}+\p{Pattern_White_Space}*(\(\p{Pattern_White_Space}*(_|\.\.)(\p{Pattern_White_Space}*,\p{Pattern_White_Space}*(_|\.\.))*\p{Pattern_White_Space}*,?\p{Pattern_White_Space}*\)|\{\p{Pattern_White_Space}*\.\.\p{Pattern_White_Space}*\})?$', not: {has: {field: condition, pattern: $_}}}
            - has: {field: value, matches: literal-text}
    naming-impl:
        kind: impl_item
        all:
            - has: {field: type, kind: type_identifier, pattern: $T, matches: type}
            - any:
                - not: {has: {field: trait, pattern: $_}}
                - has: {field: trait, regex: '^(((std|core)::)?fmt::)?Display$|^(((std|core)::)?convert::)?AsRef\p{Pattern_White_Space}*<\p{Pattern_White_Space}*str\p{Pattern_White_Space}*>$'}
            - inside:
                kind: 'source_file, declaration_list, block'
                all:
                    - has: {kind: enum_item, has: {field: name, pattern: $T}}
                    - not: {has: {matches: error-type}}
    naming-method:
        kind: function_item
        any:
            - has: {field: name, regex: '^(fmt|as_str|as_ref|name)$'}
            - all:
                - has: {field: parameters, regex: '^\(\p{Pattern_White_Space}*&?\p{Pattern_White_Space}*self\p{Pattern_White_Space}*\)$'}
                - has: {field: return_type, regex: '^(&\p{Pattern_White_Space}*(''static\p{Pattern_White_Space}+)?str|String|Cow\p{Pattern_White_Space}*<\p{Pattern_White_Space}*''static\p{Pattern_White_Space}*,\p{Pattern_White_Space}*str\p{Pattern_White_Space}*>)$'}
    error-type:
        matches: {rust-error-type: {name: {pattern: $T}}}
rule:
    kind: match_expression
    all:
        - has: {field: value, regex: '^\*?\p{Pattern_White_Space}*self$'}
        - has:
            field: body
            all:
                - has: {kind: match_arm, nthChild: {position: 2, ofRule: {kind: match_arm}}}
                - not: {has: {kind: match_arm, not: {matches: unit-arm}}}
        - inside:
            kind: function_item
            stopBy: {kind: 'function_item, closure_expression'}
            all:
                - has: {field: name, pattern: $METHOD, matches: method}
                - matches: naming-method
                - inside: {kind: declaration_list, inside: {matches: naming-impl}}
