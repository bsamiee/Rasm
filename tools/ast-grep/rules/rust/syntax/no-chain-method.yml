# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-chain-method
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - pattern: $A.into_iter().chain($B)
constraints:
    A: {kind: 'identifier, field_expression, self'}
fix: iter::chain($A, $B)
message: '`$A` converts into an iterator only to chain `$B` onto it'
note: 'Call `iter::chain(<first>, <second>)` with `core::iter` imported, `iter::chain` takes both operands as `IntoIterator` and reads them in order'
