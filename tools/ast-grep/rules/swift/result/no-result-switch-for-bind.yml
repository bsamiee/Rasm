# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-result-switch-for-bind
language: swiftlang
severity: error
utils:
    failure-return:
        matches: {swift-single-statement: {first: {matches: swift-failure-value}}}
rule:
    any:
        - matches: swift-result-bind-switch
        - kind: if_statement
          regex: '^if\s+case\s+(let\s+)?\.failure\b'
          has: {matches: failure-return}
        - kind: if_statement
          regex: '^if\s+case\s+(let\s+)?\.success\b'
          all:
            - not: {has: {regex: '^,$'}}
            - not: {has: {kind: if_statement}}
            - any:
                - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}, matches: failure-return}
                - all:
                    - not: {has: {regex: '^else$'}}
                    - precedes: {kind: control_transfer_statement, has: {field: result, matches: swift-failure-call}}
        - kind: guard_statement
          regex: '^guard\s+case\s+(let\s+)?\.success\b'
          not: {regex: '(?s)^guard\s+case\s+(let\s+)?\.success\b[^,]*,.*\b(case|let|var)\b'}
          has: {matches: failure-return}
message: 'Statement unpacks a Result to return its failure and bind its value in place of one `flatMap`'
note: 'Call `<result>.flatMap { value in <continuation> }`, `.bind` where the continuation awaits, with `mapError` first where the failure arm replaces the error'
