# Gate axis; generation is the sibling buf.gen.yaml
version: v2
modules:
  - path: tests/contracts
    excludes:
      - tests/contracts/io  # Vendored publisher bytes; module-membership exclusion carves generation aswell
lint:
  use:
    - STANDARD
  except:                   # Csharp:Rasm.Compute/Runtime/wire#PROTO_VOCABULARY names request and response shapes off the domain, never the rpc
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:              # One ReloadReply serves ReloadOptions and DispatchPatch on the trigger column; one ArtifactFrame frames both directions of the Sync bidi seam
    RPC_REQUEST_RESPONSE_UNIQUE:
      - tests/contracts/rasm/compute/v1/compute.proto
breaking:
  use:
    - FILE                  # Baseline is a git ref, never the parity snapshot — that digest mints at --exclude-imports and resolves as no image
