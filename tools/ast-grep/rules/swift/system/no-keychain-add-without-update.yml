# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swift
severity: error
utils:
    security-scope:
        any: [{ matches: swift-declaration-scope }, { kind: source_file }]
        has:
            stopBy: end
            any:
                - kind: call_expression
                  has: { nthChild: 1, kind: simple_identifier, regex: '^security$' }
                - kind: line_string_literal
                  regex: '^"(/usr/bin/)?security"$'
    add-subcommand:
        kind: line_string_literal
        regex: '^"add-(generic|internet)-password"$'
    whole-arguments:
        not: { inside: { kind: additive_expression, stopBy: { not: { kind: 'additive_expression, tuple_expression' } } } }
rule:
    pattern: $ARGS
    all:
        - any:
              - kind: array_literal
                matches: whole-arguments
                has: { matches: add-subcommand }
                not: { has: { kind: line_string_literal, regex: '^"-U"$' } }
              - kind: additive_expression
                matches: whole-arguments
                has: { stopBy: end, kind: array_literal, has: { matches: add-subcommand } }
                not: { has: { stopBy: end, kind: line_string_literal, regex: '^"-U"$' } }
              - kind: line_string_literal, multi_line_string_literal, raw_string_literal
                regex: '(?m)(?:^#*"*|\\n)[ \t]*add-(?:generic|internet)-password(?:[ \t]+(?:(?:[^\n\\ \t"]|\\[^n]){3,}|(?:[^\n\\ \t"-]|\\[^n])(?:[^\n\\ \t"]|\\[^n])|-(?:[^\n\\ \t"U]|\\[^n])|[^\n\\ \t"]|\\[^n]))+[ \t]*(?:"|\\n|$)'
        - inside:
              stopBy: { any: [{ matches: swift-declaration-scope }, { kind: source_file }] }
              matches: security-scope
message: '`$ARGS` adds a keychain item without `-U` and fails with `errSecDuplicateItem` on an existing item, pass `-U` after the subcommand to update it and keep its ACL and partition list'
