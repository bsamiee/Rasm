# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-volume-event-stream
language: swiftlang
severity: error
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, kind: simple_identifier, regex: '^FSEventStreamCreate$'}
        - has:
            kind: call_suffix
            has:
                kind: value_arguments
                has:
                    kind: value_argument
                    nthChild: 4
                    has:
                        stopBy: end
                        kind: array_literal
                        has:
                            field: element
                            pattern: $ROOT
                            regex: '^(NSOpenStepRootDirectory\(\)|"/"|(URL\((filePath|fileURLWithPath): "/"\)|FilePath\("/"\))\.(path|string)(\(.*\))?)$'
message: '`FSEventStreamCreate` over `$ROOT` streams every file event on the volume'
note: 'Watch a file through `DispatchSource.makeFileSystemObjectSource` on it and its nearest existing directory, and root FSEvents at the watched tree'
