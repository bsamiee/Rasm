# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-array-mutation
language: tsx
severity: error
rule:
    matches: syntax-mutating-array-call
    has: {field: function, has: {field: property, pattern: $METHOD}}
message: '`$METHOD` writes the array in place, and the callers that hold the array read the write'
note: >-
    Build the next array as a value, `[...rows, row]`, `Array.append(rows, row)`, `rows.toSorted(compare)`, `rows.toReversed()`,
    fold a loop with `reduce`, and hold an accumulation a callback fills in a `MutableRef`, across fibers in a `Ref`
labels:
    METHOD: {style: primary, message: The method that writes in place}
