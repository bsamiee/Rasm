# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-invisible-literal
language: python
severity: error
utils:
    invisible:
        regex: '(?:^|[^\p{Extended_Pictographic}\p{Emoji_Modifier}\x{200D}\x{FE0E}\x{FE0F}#*0-9])[\x{200C}\x{200D}\x{FE0E}\x{FE0F}]|(?:^|[^\x{1F3F4}\x{E0020}-\x{E007F}])[\x{E0020}-\x{E007F}]|[\p{Default_Ignorable_Code_Point}--[\x{61C}\x{200B}\x{200C}\x{200D}\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}\x{FE0E}\x{FE0F}\x{E0020}-\x{E007F}]]'
    outermost:
        kind: string
        matches: invisible
        not: {inside: {kind: string, stopBy: end}}
    unescapable:
        any:
            - {kind: identifier, matches: invisible}
            - {kind: string, matches: invisible, regex: '^[a-zA-Z]*[rR]'}
            - kind: interpolation
              all:
                - has: {pattern: $$_DEBUG, regex: '^=$'}
                - has: {field: expression, matches: invisible}
rule:
    any:
        - matches: outermost
          not: {regex: '\n'}
          any:
            - pattern: $FIXABLE
              not:
                any:
                    - regex: '[\x{E0000}-\x{E0FFF}]'
                    - matches: unescapable
                    - has: {matches: unescapable, stopBy: end}
            - pattern: $UNFIXED
        - kind: string_start
          pattern: $UNFIXED
          inside: {matches: outermost, regex: '\n'}
transform:
    T00: {replace: {source: $FIXABLE, replace: '\x{AD}', by: '\u00ad'}}
    T01: {replace: {source: $T00, replace: '\x{34F}', by: '\u034f'}}
    T02: {replace: {source: $T01, replace: '\x{115F}', by: '\u115f'}}
    T03: {replace: {source: $T02, replace: '\x{1160}', by: '\u1160'}}
    T04: {replace: {source: $T03, replace: '\x{17B4}', by: '\u17b4'}}
    T05: {replace: {source: $T04, replace: '\x{17B5}', by: '\u17b5'}}
    T06: {replace: {source: $T05, replace: '\x{180B}', by: '\u180b'}}
    T07: {replace: {source: $T06, replace: '\x{180C}', by: '\u180c'}}
    T08: {replace: {source: $T07, replace: '\x{180D}', by: '\u180d'}}
    T09: {replace: {source: $T08, replace: '\x{180E}', by: '\u180e'}}
    T10: {replace: {source: $T09, replace: '\x{180F}', by: '\u180f'}}
    T11: {replace: {source: $T10, replace: '(^|[^\p{Extended_Pictographic}\p{Emoji_Modifier}\x{200D}\x{FE0E}\x{FE0F}#*0-9])\x{200C}', by: '${1}\u200c'}}
    T12: {replace: {source: $T11, replace: '(^|[^\p{Extended_Pictographic}\p{Emoji_Modifier}\x{200D}\x{FE0E}\x{FE0F}#*0-9])\x{200D}', by: '${1}\u200d'}}
    T13: {replace: {source: $T12, replace: '\x{200E}', by: '\u200e'}}
    T14: {replace: {source: $T13, replace: '\x{2060}', by: '\u2060'}}
    T15: {replace: {source: $T14, replace: '\x{2061}', by: '\u2061'}}
    T16: {replace: {source: $T15, replace: '\x{2062}', by: '\u2062'}}
    T17: {replace: {source: $T16, replace: '\x{2063}', by: '\u2063'}}
    T18: {replace: {source: $T17, replace: '\x{2064}', by: '\u2064'}}
    T19: {replace: {source: $T18, replace: '\x{2065}', by: '\u2065'}}
    T20: {replace: {source: $T19, replace: '\x{206A}', by: '\u206a'}}
    T21: {replace: {source: $T20, replace: '\x{206B}', by: '\u206b'}}
    T22: {replace: {source: $T21, replace: '\x{206C}', by: '\u206c'}}
    T23: {replace: {source: $T22, replace: '\x{206D}', by: '\u206d'}}
    T24: {replace: {source: $T23, replace: '\x{206E}', by: '\u206e'}}
    T25: {replace: {source: $T24, replace: '\x{206F}', by: '\u206f'}}
    T26: {replace: {source: $T25, replace: '\x{3164}', by: '\u3164'}}
    T27: {replace: {source: $T26, replace: '\x{FE00}', by: '\ufe00'}}
    T28: {replace: {source: $T27, replace: '\x{FE01}', by: '\ufe01'}}
    T29: {replace: {source: $T28, replace: '\x{FE02}', by: '\ufe02'}}
    T30: {replace: {source: $T29, replace: '\x{FE03}', by: '\ufe03'}}
    T31: {replace: {source: $T30, replace: '\x{FE04}', by: '\ufe04'}}
    T32: {replace: {source: $T31, replace: '\x{FE05}', by: '\ufe05'}}
    T33: {replace: {source: $T32, replace: '\x{FE06}', by: '\ufe06'}}
    T34: {replace: {source: $T33, replace: '\x{FE07}', by: '\ufe07'}}
    T35: {replace: {source: $T34, replace: '\x{FE08}', by: '\ufe08'}}
    T36: {replace: {source: $T35, replace: '\x{FE09}', by: '\ufe09'}}
    T37: {replace: {source: $T36, replace: '\x{FE0A}', by: '\ufe0a'}}
    T38: {replace: {source: $T37, replace: '\x{FE0B}', by: '\ufe0b'}}
    T39: {replace: {source: $T38, replace: '\x{FE0C}', by: '\ufe0c'}}
    T40: {replace: {source: $T39, replace: '\x{FE0D}', by: '\ufe0d'}}
    T41: {replace: {source: $T40, replace: '(^|[^\p{Extended_Pictographic}\p{Emoji_Modifier}\x{200D}\x{FE0E}\x{FE0F}#*0-9])\x{FE0E}', by: '${1}\ufe0e'}}
    T42: {replace: {source: $T41, replace: '(^|[^\p{Extended_Pictographic}\p{Emoji_Modifier}\x{200D}\x{FE0E}\x{FE0F}#*0-9])\x{FE0F}', by: '${1}\ufe0f'}}
    T43: {replace: {source: $T42, replace: '\x{FEFF}', by: '\ufeff'}}
    T44: {replace: {source: $T43, replace: '\x{FFA0}', by: '\uffa0'}}
    T45: {replace: {source: $T44, replace: '\x{FFF0}', by: '\ufff0'}}
    T46: {replace: {source: $T45, replace: '\x{FFF1}', by: '\ufff1'}}
    T47: {replace: {source: $T46, replace: '\x{FFF2}', by: '\ufff2'}}
    T48: {replace: {source: $T47, replace: '\x{FFF3}', by: '\ufff3'}}
    T49: {replace: {source: $T48, replace: '\x{FFF4}', by: '\ufff4'}}
    T50: {replace: {source: $T49, replace: '\x{FFF5}', by: '\ufff5'}}
    T51: {replace: {source: $T50, replace: '\x{FFF6}', by: '\ufff6'}}
    T52: {replace: {source: $T51, replace: '\x{FFF7}', by: '\ufff7'}}
    T53: {replace: {source: $T52, replace: '\x{FFF8}', by: '\ufff8'}}
    T54: {replace: {source: $T53, replace: '\x{1BCA0}', by: '\U0001bca0'}}
    T55: {replace: {source: $T54, replace: '\x{1BCA1}', by: '\U0001bca1'}}
    T56: {replace: {source: $T55, replace: '\x{1BCA2}', by: '\U0001bca2'}}
    T57: {replace: {source: $T56, replace: '\x{1BCA3}', by: '\U0001bca3'}}
    T58: {replace: {source: $T57, replace: '\x{1D173}', by: '\U0001d173'}}
    T59: {replace: {source: $T58, replace: '\x{1D174}', by: '\U0001d174'}}
    T60: {replace: {source: $T59, replace: '\x{1D175}', by: '\U0001d175'}}
    T61: {replace: {source: $T60, replace: '\x{1D176}', by: '\U0001d176'}}
    T62: {replace: {source: $T61, replace: '\x{1D177}', by: '\U0001d177'}}
    T63: {replace: {source: $T62, replace: '\x{1D178}', by: '\U0001d178'}}
    T64: {replace: {source: $T63, replace: '\x{1D179}', by: '\U0001d179'}}
    T65: {replace: {source: $T64, replace: '\x{1D17A}', by: '\U0001d17a'}}
fix: $T65$UNFIXED
message: 'String literal holds an invisible code point'
note: 'Write the code point as a `\uXXXX` or `\UXXXXXXXX` escape'
