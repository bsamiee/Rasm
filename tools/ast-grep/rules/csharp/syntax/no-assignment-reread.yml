# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
utils:
    assignment:
        any:
            - kind: assignment_expression
            - kind: parenthesized_expression
              has: {matches: assignment}
    target-assignment:
        any:
            - kind: assignment_expression
              has: {field: left, pattern: $TARGET}
            - kind: parenthesized_expression
              has: {matches: target-assignment}
rule:
    pattern: $VALUE
    any:
        - kind: invocation_expression
          all:
            - has: {field: arguments, has: {kind: argument, has: {matches: assignment}}}
            - matches: {csharp-named-call: {name: {regex: '^ignore$'}}}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^(==|!=)$'}
            - any:
                - all: [{has: {field: left, matches: target-assignment}}, {has: {field: right, pattern: $TARGET}}]
                - all: [{has: {field: right, matches: target-assignment}}, {has: {field: left, pattern: $TARGET}}]
message: '`$VALUE` reads the value of an assignment'
note: 'Write the assignment as its own statement and read its target after it'
