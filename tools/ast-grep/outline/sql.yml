    SIGNATURE: {replace: {source: $JOINED, replace: '\s+$', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-macro
language: sql
role: item
symbolType: function
rule:
    kind: statement
    pattern: _DECLARATION
    regex: '(?i)^create\s+(or\s+replace\s+)?(temp(orary)?\s+)?macro\s'
transform:
    NAME: {replace: {source: $DECLARATION, replace: '(?is)^create\s+(?:or\s+replace\s+)?(?:temp(?:orary)?\s+)?macro\s+([\w.]+).*$', by: '$1'}}
    HEADER: {replace: {source: $DECLARATION, replace: '(?is)^(create\s.*?macro\s+[\w.]+\s*\([^)]*\)\s*as(?:\s+table)?)\s.*$', by: '$1'}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
