# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-module-state-tsx
language: tsx
severity: error
rule:
    kind: lexical_declaration
    any:
        - all:
            - has: {field: kind, regex: '^let$'}
            - has: {kind: variable_declarator, has: {field: name, pattern: $NAME}}
        - all:
            - has: {field: kind, regex: '^const$'}
            - has:
                kind: variable_declarator
                all:
                    - has: {field: name, pattern: $NAME}
                    - has:
                        field: value
                        kind: new_expression
                        all:
                            - has: {field: 'constructor', regex: '^(Map|Set|WeakMap|WeakSet)$', matches: syntax-global-reference}
                            - not: {has: {field: arguments, has: {pattern: $_}}}
    inside:
        any:
            - kind: program
            - kind: export_statement
              inside: {kind: program}
message: 'Module-level `$NAME` holds mutable state every function in the module shares'
note: 'Pass changing state to the next operation as a returned value, or hold shared state in a `Ref` across fibers and in a `$.state` atom across function hook reloads'
