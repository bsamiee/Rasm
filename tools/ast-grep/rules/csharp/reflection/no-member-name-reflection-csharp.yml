# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-member-name-reflection-csharp
language: csharp
severity: error
utils:
    type-type:
        matches: {csharp-type-name: {name: {regex: '^(Type|TypeInfo)$'}}}
    type-member:
        kind: identifier
        pattern: $RECEIVER
        inside:
            stopBy: {kind: &owner-type 'class_declaration, record_declaration, struct_declaration, interface_declaration'}
            kind: *owner-type
            any:
                - has: {field: body, has: {kind: property_declaration, all: [{has: {field: type, matches: type-type}}, {has: {field: name, pattern: $RECEIVER}}]}}
                - has: {field: body, has: {kind: field_declaration, has: {kind: variable_declaration, all: [{has: {field: type, matches: type-type}}, {has: {kind: variable_declarator, has: {field: name, pattern: $RECEIVER}}}]}}}
                - has: {kind: parameter_list, has: {kind: parameter, all: [{has: {field: type, matches: type-type}}, {has: {field: name, pattern: $RECEIVER}}]}}
    type-step:
        kind: identifier
        regex: '^(GetType|GetTypeInfo|MakeGenericType|MakeArrayType|MakeByRefType|MakePointerType|GetGenericTypeDefinition|GetElementType|GetNestedType|GetInterface|GetEnumUnderlyingType)$'
    type-property:
        kind: identifier
        regex: '^(PropertyType|FieldType|ReturnType|ParameterType|DeclaringType|ReflectedType|BaseType|UnderlyingSystemType|EventHandlerType|AsType)$'
    type-value:
        any:
            - kind: typeof_expression
            - kind: invocation_expression
              has:
                field: function
                any:
                    - kind: identifier
                      regex: '^GetType$'
                    - kind: member_access_expression
                      has: {field: name, any: [{matches: type-step}, {matches: type-property}]}
                    - kind: conditional_access_expression
                      has: {kind: member_binding_expression, has: {field: name, matches: type-step}}
            - kind: member_access_expression
              has: {field: name, matches: type-property}
            - kind: identifier
              matches: {csharp-declared-type: {type: {matches: type-type}}}
            - kind: identifier
              matches: {csharp-block-local: {declarator: {has: {not: {kind: identifier}, matches: type-value}}}}
            - matches: type-member
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^this$'}
                - has: {field: name, matches: type-member}
            - kind: 'postfix_unary_expression, parenthesized_expression'
              has: {matches: type-value}
    name-literal:
        any:
            - kind: 'string_literal, verbatim_string_literal, raw_string_literal'
            - kind: invocation_expression
              matches: csharp-nameof-call
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\+$'}
                - has: {field: left, matches: name-literal}
                - has: {field: right, matches: name-literal}
            - kind: parenthesized_expression
              has: {matches: name-literal}
    name-local:
        kind: identifier
        pattern: $LOCAL
        inside:
            stopBy: end
            kind: 'block, declaration_list'
            has:
                stopBy: end
                kind: variable_declarator
                all:
                    - has: {field: name, pattern: $LOCAL}
                    - has: {matches: name-literal}
    name-value:
        pattern: $NAME
        any:
            - matches: name-literal
            - matches: name-local
    name-argument:
        kind: argument
        has: {nthChild: {position: 1, reverse: true}, matches: name-value}
    first-name-argument:
        kind: argument
        any:
            - nthChild: 1
              not: {has: {field: name, kind: identifier}}
            - has: {field: name, regex: '^typeName$'}
        has: {nthChild: {position: 1, reverse: true}, matches: name-value}
    method:
        kind: identifier
        pattern: $METHOD
    member-lookup:
        kind: identifier
        regex: '^(GetField|GetProperty|GetMethod|GetMember|GetEvent|GetNestedType|GetInterface|GetRuntime(Field|Method|Property|Event)|GetDeclared(Field|Method|Methods|Property|Event|NestedType))$'
        matches: method
    type-parameter:
        kind: identifier
        pattern: $PARAMETER
        inside:
            stopBy: end
            has: {kind: type_parameter_list, has: {kind: type_parameter, has: {field: name, pattern: $PARAMETER}}}
    overload-lookup:
        all:
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {kind: invocation_expression, matches: csharp-nameof-call}}}
            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: typeof_expression, has: {field: type, matches: type-parameter}}}}
    lookup:
        kind: invocation_expression
        not: {matches: overload-lookup}
        all:
            - has:
                field: function
                any:
                    - kind: member_access_expression
                      all:
                        - has: {field: name, matches: member-lookup}
                        - has: {field: expression, matches: type-value}
                    - kind: conditional_access_expression
                      all:
                        - has: {field: condition, matches: type-value}
                        - has: {kind: member_binding_expression, has: {field: name, matches: member-lookup}}
            - has: {field: arguments, has: {matches: name-argument}}
    type-by-name:
        kind: invocation_expression
        all:
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: expression, matches: {csharp-type-name: {name: {regex: '^Type$'}}}}
                    - has: {field: name, regex: '^GetType$', matches: method}
            - has: {field: arguments, has: {matches: first-name-argument}}
            - not: {has: {field: arguments, has: {matches: first-name-argument, has: {kind: string_literal, regex: ',\s*[^",]+"$'}}}}
            - not:
                inside:
                    stopBy: end
                    kind: compilation_unit
                    has:
                        stopBy: end
                        kind: attribute
                        all:
                            - has: {field: name, matches: {csharp-type-name: {name: {regex: '^UnsafeAccessorType(Attribute)?$'}}}}
                            - has: {kind: attribute_argument_list, has: {kind: attribute_argument, has: {pattern: $NAME}}}
rule:
    any:
        - matches: lookup
        - matches: type-by-name
message: '`$METHOD` looks up a member or type by name `$NAME`'
note: 'Name the target (`typeof`, member access, method group, expression lambda), `[UnsafeAccessor]` or `[UnsafeAccessorType]` when non-public'
