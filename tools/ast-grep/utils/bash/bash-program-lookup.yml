# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: bash-program-lookup
language: bashlang
utils:
    option: {not: {follows: {stopBy: end, not: {any: [{kind: command_name}, {regex: '^-'}]}}}}
rule:
    kind: command
    any:
        - has: {field: name, regex: '^(?:\S+/)?(which|type)$'}
        - all:
            - has: {field: name, regex: '^(?:\S+/)?hash$'}
            - not: {has: {kind: word, regex: '^-[a-zA-Z]*[rdp]', matches: option}}
        - all:
            - has: {field: name, regex: '^command$'}
            - has: {kind: word, regex: '^-[pvV]*[vV][pvV]*$', matches: option}
