id: optional-to-union
valid:
    # The corrected form, the union with None
    - |
      def read(path: Path | None = None) -> str:
          return ""
    # The corrected form of a union, the operator between the members
    - |
      def read(path: Path | str) -> str:
          return ""
    # Member named Optional of another package, no typing import binds the name
    - |
      from schema import Optional

      field = Optional[str]
    # Attribute named like the member on another object
    - |
      field = schema.Optional[str]
    # String member, a forward reference the operator cannot join
    - |
      from typing import Optional

      def read(path: Optional["Path"]) -> str:
          return ""
    # String member under an attribute head, the subscript form of the forward reference
    - |
      import typing as t

      def read(path: t.Optional["Path"]) -> str:
          return ""
    # Another member of typing subscripted, bare and as an attribute
    - |
      from typing import List

      def read(paths: List[str], names: typing.Dict[str, int]) -> str:
          return ""
    # The member without a subscript, a value the lint rule reports
    - |
      from typing import Optional

      marker = Optional
    # A parameter shadows the imported typing constructor
    - |
      from typing import Optional
      def read(Optional):
          return Optional[int]
    # A rebound module alias does not retain typing semantics
    - |
      import typing as t
      t = schema
      value = t.Optional[int]
    # Comments inside the member list must not disappear in reconstructed output
    - |
      from typing import Union
      value: Union[
          int,  # Wire representation
          str,
      ]
    # Conflicting imports bind another constructor under the typing name.
    - |
      from typing import Optional
      from schema import Optional
      value = Optional[int]
    # A module alias is rebound by a different module import.
    - |
      import typing as t
      import schema as t
      value = t.Optional[int]
    # A function-local import hides the outer typing name.
    - |
      from typing import Optional
      def build():
          from schema import Optional
          return Optional[int]
    # Pattern captures are local bindings, including mapping, sequence, and class members.
    - |
      from typing import Optional
      def build(value):
          match value:
              case {"constructor": Optional}:
                  return Optional[int]
    - |
      from typing import Optional
      def build(value):
          match value:
              case [Optional]:
                  return Optional[int]
    - |
      from typing import Optional
      def build(value):
          match value:
              case Constructor(Optional):
                  return Optional[int]
    - |
      from typing import Optional
      def build(value):
          match value:
              case Constructor() as Optional:
                  return Optional[int]
    # A plain module import can also bind the constructor name.
    - |
      from typing import Optional
      import Optional
      value = Optional[int]
    # A from-import alias binds its alias, independently of the member spelling.
    - |
      from typing import Optional
      from schema import Field as Optional
      value = Optional[int]
    # Another member of the recognized package has a different contract.
    - |
      from typing import Optional
      from typing import List as Optional
      value = Optional[int]
    # Starred and keyword pattern targets also bind local names.
    - |
      from typing import Optional
      def build(value):
          match value:
              case [*Optional]:
                  return Optional[int]
    - |
      from typing import Optional
      def build(value):
          match value:
              case Constructor(field=Optional):
                  return Optional[int]
    # Optional[None] is NoneType; None | None would raise TypeError
    - |
      from typing import Optional
      value = Optional[None]
    # A union containing only None has the same runtime boundary
    - |
      from typing import Union
      value: Union[None, None]
    # A foreign wildcard import makes the constructor binding unknown.
    - |
      from typing import Optional
      from schema import *
      value = Optional[int]
    # A member import binds a value under the previous module alias.
    - |
      import typing as t
      from typing import Any as t
      value = t.Optional[int]
invalid:
    # A wildcard from the same package preserves the known constructor.
    - |
      from typing import Optional
      from typing import *
      value = Optional[int]
    # The from-clause names a package; only its imported members bind names.
    - |
      import typing as schema
      from schema import Field
      value = schema.Optional[int]
    # A dotted value pattern reads a name instead of binding the constructor.
    - |
      from typing import Optional
      def build(value):
          match value:
              case constants.Optional:
                  return Optional[int]
    # The instance, Optional over a name the from-import binds
    - |
      from typing import Optional

      def read(path: Optional[Path] = None) -> str:
          return ""
    # Union over two members
    - |
      from typing import Union

      def read(path: Union[Path, str]) -> str:
          return ""
    # Union over three members with a subscripted member, the inner comma stays inside its member
    - |
      from typing import Union

      def read(path: Union[Path, dict[str, int], None]) -> str:
          return ""
    # The attribute read as spelled
    - |
      import typing

      def read(path: typing.Optional[Path] = None) -> str:
          return ""
    # The attribute read through the alias the import binds
    - |
      import typing as t

      def read(path: t.Union[Path, str]) -> str:
          return ""
    # The member imported from the backport module
    - |
      from typing_extensions import Optional

      def read(path: Optional[Path] = None) -> str:
          return ""
    # Nested Optional inside Union rewrites in the same replacement
    - |
      from typing import Optional, Union

      def read(path: Union[Optional[Path], str]) -> str:
          return ""
    # Optional in a value position, the operator evaluates at run time
    - |
      from typing import Optional, cast

      value = cast(Optional[int], raw)
    # Union in a value position with two members, the members beside the value of the subscript
    - |
      from typing import Any, Union

      value = cast(Union[int, str], raw)
    - |
      from typing import Optional as Maybe
      def read(value: Maybe[int]) -> int:
          return 0
    - |
      from typing import Union
      members = Union[int, str].__args__
    # Nested unions inside another generic retain that generic and its argument order
    - |
      from typing import Optional, Union
      value: Optional[Union[list[Union[int, str]], bytes]]
    # Recursive names retain the aliases from their imports
    - |
      from typing import Optional as Maybe, Union as Either
      value: Maybe[Either[int, Maybe[str]]]
    # Recursive attributes use the imported module alias
    - |
      import typing as t
      value = t.Optional[t.Union[int, t.Optional[str]]]
    # An inner forward reference keeps its typing wrapper while the outer union rewrites
    - |
      from typing import Optional, Union
      value: Union[Optional["Item"], int]
