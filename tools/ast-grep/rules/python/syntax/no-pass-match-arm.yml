# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-pass-match-arm
language: python
severity: error
utils:
    pass-arm:
        kind: case_clause
        has:
            field: consequence
            not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
            has: {any: [{kind: pass_statement}, {kind: expression_statement, regex: '^\.\.\.$'}]}
    flat-arm:
        kind: case_clause
        not:
            any:
                - has: {kind: case_pattern, nthChild: {position: 2, ofRule: {kind: case_pattern}}}
                - has: {kind: case_pattern, has: {stopBy: end, any: [{kind: list_pattern}, {kind: tuple_pattern}, {kind: dict_pattern}, {kind: class_pattern, has: {kind: case_pattern}}]}}
    acting-arm:
        kind: case_clause
        not: {matches: pass-arm}
        all:
            - has: {field: consequence, pattern: $BODY}
            - any:
                - has: {field: guard, pattern: $GUARD}
                - not: {has: {field: guard, kind: if_clause}}
    identity-pattern:
        kind: case_pattern
        has: {any: [{kind: none}, {kind: 'true'}, {kind: 'false'}]}
    type-pattern:
        kind: case_pattern
        has:
            any:
                - kind: class_pattern
                - kind: union_pattern
                  has: {kind: class_pattern}
                  not: {has: {not: {any: [{kind: class_pattern}, {kind: none}, {regex: '^\|$'}]}}}
    value-pattern:
        kind: case_pattern
        has: {any: [{kind: string}, {kind: concatenated_string}, {kind: integer}, {kind: float}, {kind: complex_pattern}, {kind: dotted_name, has: {nthChild: 2}}]}
    values-pattern:
        kind: case_pattern
        has:
            kind: union_pattern
            not: {has: {not: {any: [{matches: value-member}, {regex: '^\|$'}]}}}
    value-member:
        any: [{kind: string}, {kind: concatenated_string}, {kind: integer}, {kind: float}, {kind: complex_pattern}, {kind: dotted_name, has: {nthChild: 2}}, {kind: none}, {kind: 'true'}, {kind: 'false'}]
    tested-pattern:
        kind: case_pattern
        any: [{matches: identity-pattern}, {matches: type-pattern}, {matches: values-pattern}, {matches: value-pattern}]
    bound-subject:
        pattern: $_SUBJECT
        inside:
            kind: match_statement
            field: subject
            has: {field: body, has: {kind: case_clause, not: {matches: pass-arm}, has: {kind: case_pattern, has: {any: [{kind: as_pattern}, {kind: dotted_name, not: {has: {nthChild: 2}}}]}}}}
    pass-match:
        kind: match_statement
        all:
            - has: {field: subject, pattern: $SUBJECT}
            - has:
                field: body
                all:
                    - has: {matches: pass-arm}
                    - has: {kind: case_clause, nthChild: {position: 2, ofRule: {kind: case_clause}}}
                    - not: {has: {kind: case_clause, nthChild: {position: 3, ofRule: {kind: case_clause}}}}
                    - not: {has: {kind: case_clause, not: {matches: flat-arm}}}
    fixable:
        kind: match_statement
        not:
            any:
                - has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, not: {kind: block}}
                - has: {stopBy: end, kind: comment, not: {inside: {stopBy: {any: [{kind: case_clause}, {kind: match_statement}]}, kind: block, inside: {kind: case_clause, not: {matches: pass-arm}}}}}
        has:
            field: body
            any:
                - all:
                    - has:
                        kind: case_clause
                        nthChild: {position: 1, ofRule: {kind: case_clause}}
                        matches: acting-arm
                        has:
                            kind: case_pattern
                            pattern: $ACT
                            any:
                                - matches: tested-pattern
                                - has: {kind: as_pattern, all: [{has: {kind: case_pattern, matches: tested-pattern}}, {has: {kind: identifier, pattern: $NAME}}]}
                    - has: {kind: case_clause, nthChild: {position: 2, ofRule: {kind: case_clause}}, matches: pass-arm, not: {has: {field: guard, kind: if_clause}}, has: {kind: case_pattern, regex: '^_$'}}
                - all:
                    - has: {kind: case_clause, nthChild: {position: 1, ofRule: {kind: case_clause}}, matches: pass-arm, not: {has: {field: guard, kind: if_clause}}, has: {kind: case_pattern, pattern: $NEG, matches: tested-pattern}}
                    - has: {kind: case_clause, nthChild: {position: 2, ofRule: {kind: case_clause}}, matches: acting-arm, has: {kind: case_pattern, any: [{regex: '^_$'}, {has: {kind: dotted_name, has: {kind: identifier, pattern: $NAME}, not: {has: {nthChild: 2}}}}]}}
rule:
    any:
        - matches: pass-match
          not: {matches: python-multiline-string}
          any:
            - pattern: $FIXABLE
              matches: fixable
            - pattern: $KEPT
        - kind: string_start
          pattern: $KEPT
          inside: {kind: string, regex: '\n', inside: {stopBy: end, matches: pass-match}}
rewriters:
    - id: if-test
      rule: {kind: match_statement}
      transform:
        TEST: rewrite($ACT, rewriters=[alias-test, identity-test, type-test, values-test, value-test])
        NEGATED: rewrite($NEG, rewriters=[identity-negated, type-negated, values-negated, value-negated])
        WHEN: rewrite($GUARD, rewriters=[grouped-guard, guard])
      fix: |-
        if $TEST$NEGATED$WHEN:
            $BODY
    - id: bound-head
      rule: {matches: bound-subject}
      fix: ($NAME := $SUBJECT)
    - id: bound-argument
      rule: {matches: bound-subject}
      fix: '$NAME := $SUBJECT'
    - id: grouped-head
      rule:
        any: [{kind: comparison_operator}, {kind: not_operator}, {kind: boolean_operator}, {kind: conditional_expression}, {kind: lambda}]
        inside: {kind: match_statement, field: subject}
      fix: ($SUBJECT)
    - id: type-name
      rule: {kind: class_pattern, has: {kind: dotted_name, pattern: $TYPE}}
      fix: $TYPE
    - id: value-member
      rule: {matches: value-member, pattern: $VALUE}
      fix: $VALUE
    - id: alias-test
      rule: {kind: case_pattern, has: {kind: as_pattern, has: {kind: case_pattern, pattern: $INNER}}}
      transform: {TEST: 'rewrite($INNER, rewriters=[identity-test, type-test, values-test, value-test])'}
      fix: $TEST
    - id: identity-test
      rule: {matches: identity-pattern, pattern: $LITERAL}
      transform: {HEAD: 'rewrite($SUBJECT, rewriters=[bound-head, grouped-head])'}
      fix: $HEAD is $LITERAL
    - id: type-test
      rule: {matches: type-pattern, pattern: $PATTERN}
      transform:
        HEAD: rewrite($SUBJECT, rewriters=[bound-argument])
        TYPES: rewrite($PATTERN, rewriters=[type-name])
      fix: isinstance($HEAD, $TYPES)
    - id: values-test
      rule: {matches: values-pattern, pattern: $PATTERN}
      transform:
        HEAD: rewrite($SUBJECT, rewriters=[bound-head, grouped-head])
        VALUES: {rewrite: {source: $PATTERN, rewriters: [value-member], joinBy: ', '}}
      fix: $HEAD in {$VALUES}
    - id: value-test
      rule: {matches: value-pattern, pattern: $VALUE}
      transform: {HEAD: 'rewrite($SUBJECT, rewriters=[bound-head, grouped-head])'}
      fix: $HEAD == $VALUE
    - id: identity-negated
      rule: {matches: identity-pattern, pattern: $LITERAL}
      transform: {HEAD: 'rewrite($SUBJECT, rewriters=[bound-head, grouped-head])'}
      fix: $HEAD is not $LITERAL
    - id: type-negated
      rule: {matches: type-pattern, pattern: $PATTERN}
      transform:
        HEAD: rewrite($SUBJECT, rewriters=[bound-argument])
        TYPES: rewrite($PATTERN, rewriters=[type-name])
      fix: not isinstance($HEAD, $TYPES)
    - id: values-negated
      rule: {matches: values-pattern, pattern: $PATTERN}
      transform:
        HEAD: rewrite($SUBJECT, rewriters=[bound-head, grouped-head])
        VALUES: {rewrite: {source: $PATTERN, rewriters: [value-member], joinBy: ', '}}
      fix: $HEAD not in {$VALUES}
    - id: value-negated
      rule: {matches: value-pattern, pattern: $VALUE}
      transform: {HEAD: 'rewrite($SUBJECT, rewriters=[bound-head, grouped-head])'}
      fix: $HEAD != $VALUE
    - id: grouped-guard
      rule:
        kind: if_clause
        has:
            pattern: $CONDITION
            any: [{kind: boolean_operator, has: {field: operator, regex: '^or$'}}, {kind: conditional_expression}, {kind: lambda}, {kind: named_expression}]
      fix: ' and ($CONDITION)'
    - id: guard
      rule: {kind: if_clause, has: {pattern: $CONDITION}}
      fix: ' and $CONDITION'
transform:
    OUT: rewrite($FIXABLE, rewriters=[if-test])
fix: $OUT$KEPT
message: 'Two-arm `match` over `$SUBJECT` holds an arm that only passes'
note: 'Use one `if` whose test states the case the acting arm matches, a name the arm binds assigned by `:=` inside the test'
