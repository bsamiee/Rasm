syntax = "proto3";

package rasm.contracts.element.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "rasm/contracts/declaration/v1/declaration.proto";
import "rasm/contracts/element/v1/evidence.proto";
import "rasm/contracts/element/v1/value.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

enum AttestationRole {
  ATTESTATION_ROLE_UNSPECIFIED = 0;
  ATTESTATION_ROLE_MANUFACTURER = 1;
  ATTESTATION_ROLE_MANUFACTURER_AUTHORIZED = 2;
  ATTESTATION_ROLE_PURCHASER = 3;
  ATTESTATION_ROLE_INDEPENDENT = 4;
  ATTESTATION_ROLE_QUALITY = 5;
  ATTESTATION_ROLE_REGULATOR = 6;
  ATTESTATION_ROLE_WELDING_INSPECTOR = 7;
  ATTESTATION_ROLE_CALIBRATION_LABORATORY = 8;
  ATTESTATION_ROLE_MATERIAL_REVIEW_BOARD = 9;
  ATTESTATION_ROLE_SUSTAINABILITY_VERIFIER = 10;
}

// EN 13501-1 reaction-to-fire classes; A1 and A2 are non-combustible.
enum FireRating {
  FIRE_RATING_UNSPECIFIED = 0;
  FIRE_RATING_A1 = 1;
  FIRE_RATING_A2 = 2;
  FIRE_RATING_B = 3;
  FIRE_RATING_C = 4;
  FIRE_RATING_D = 5;
  FIRE_RATING_E = 6;
  FIRE_RATING_F = 7;
}

enum SmokeClass {
  SMOKE_CLASS_UNSPECIFIED = 0;
  SMOKE_CLASS_S1 = 1;
  SMOKE_CLASS_S2 = 2;
  SMOKE_CLASS_S3 = 3;
}

enum DropletClass {
  DROPLET_CLASS_UNSPECIFIED = 0;
  DROPLET_CLASS_D0 = 1;
  DROPLET_CLASS_D1 = 2;
  DROPLET_CLASS_D2 = 3;
}

enum MeasurementBasis {
  MEASUREMENT_BASIS_UNSPECIFIED = 0;
  MEASUREMENT_BASIS_PER_KG = 1;
  MEASUREMENT_BASIS_PER_M2 = 2;
  MEASUREMENT_BASIS_PER_M3 = 3;
  MEASUREMENT_BASIS_PER_ITEM = 4;
}

// The EN 15978 band axis a material carries: declaration-granularity modules sum onto these six bands.
enum LifecycleBand {
  LIFECYCLE_BAND_UNSPECIFIED = 0;
  LIFECYCLE_BAND_A1_A3 = 1;
  LIFECYCLE_BAND_A4 = 2;
  LIFECYCLE_BAND_A5 = 3;
  LIFECYCLE_BAND_B = 4;
  LIFECYCLE_BAND_C = 5;
  LIFECYCLE_BAND_D = 6;
}

// The eighteen one-third-octave band centres from 100 Hz to 5 kHz.
enum AcousticBand {
  ACOUSTIC_BAND_UNSPECIFIED = 0;
  ACOUSTIC_BAND_HZ_100 = 1;
  ACOUSTIC_BAND_HZ_125 = 2;
  ACOUSTIC_BAND_HZ_160 = 3;
  ACOUSTIC_BAND_HZ_200 = 4;
  ACOUSTIC_BAND_HZ_250 = 5;
  ACOUSTIC_BAND_HZ_315 = 6;
  ACOUSTIC_BAND_HZ_400 = 7;
  ACOUSTIC_BAND_HZ_500 = 8;
  ACOUSTIC_BAND_HZ_630 = 9;
  ACOUSTIC_BAND_HZ_800 = 10;
  ACOUSTIC_BAND_HZ_1000 = 11;
  ACOUSTIC_BAND_HZ_1250 = 12;
  ACOUSTIC_BAND_HZ_1600 = 13;
  ACOUSTIC_BAND_HZ_2000 = 14;
  ACOUSTIC_BAND_HZ_2500 = 15;
  ACOUSTIC_BAND_HZ_3150 = 16;
  ACOUSTIC_BAND_HZ_4000 = 17;
  ACOUSTIC_BAND_HZ_5000 = 18;
}

// --- [COMPOSITION] ------------------------------------------------------------------------

// An unset priority is unset, never a numeric sentinel; an unset ventilated flag is the three-state unknown.
message MaterialLayerWire {
  string material_key = 1 [(buf.validate.field).string.min_len = 1];
  MeasureValueWire thickness = 2 [(buf.validate.field).required = true];
  string layer_name = 3;
  optional int32 priority = 4;
  string category = 5;
  optional bool ventilated = 6;
}

message LayerSetWire {
  repeated MaterialLayerWire layers = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ProfileRefWire {
  string standard = 1;
  string designation = 2 [(buf.validate.field).string.min_len = 1];
  bytes content_key = 3 [(buf.validate.field).bytes.len = 16];
}

message MaterialProfileWire {
  string material_key = 1 [(buf.validate.field).string.min_len = 1];
  ProfileRefWire profile = 2 [(buf.validate.field).required = true];
  optional int32 priority = 3;
  string category = 4;
  repeated MeasureValueWire offsets = 5;
}

// The producer lifts this receipt WHOLE, so every column is required and a zero is an engineering value, not
// absence: a zero shear centre reads doubly-symmetric, and a zero axis distance reads non-reinforced.
message SectionPropertiesWire {
  MeasureValueWire area = 1 [(buf.validate.field).required = true];
  MeasureValueWire iyy = 2 [(buf.validate.field).required = true];
  MeasureValueWire izz = 3 [(buf.validate.field).required = true];
  MeasureValueWire j = 4 [(buf.validate.field).required = true];
  MeasureValueWire iw = 5 [(buf.validate.field).required = true];
  MeasureValueWire wely = 6 [(buf.validate.field).required = true];
  MeasureValueWire welz = 7 [(buf.validate.field).required = true];
  MeasureValueWire wply = 8 [(buf.validate.field).required = true];
  MeasureValueWire wplz = 9 [(buf.validate.field).required = true];
  MeasureValueWire av_y = 10 [(buf.validate.field).required = true];
  MeasureValueWire av_z = 11 [(buf.validate.field).required = true];
  MeasureValueWire radius_of_gyration_major = 12 [(buf.validate.field).required = true];
  MeasureValueWire radius_of_gyration_minor = 13 [(buf.validate.field).required = true];
  MeasureValueWire depth = 14 [(buf.validate.field).required = true];
  MeasureValueWire width = 15 [(buf.validate.field).required = true];
  MeasureValueWire heated_perimeter = 16 [(buf.validate.field).required = true];
  MeasureValueWire axis_distance = 17 [(buf.validate.field).required = true];
  MeasureValueWire shear_centre_y = 18 [(buf.validate.field).required = true];
  MeasureValueWire shear_centre_z = 19 [(buf.validate.field).required = true];
  double monosymmetry_factor = 20 [(buf.validate.field).double.finite = true];
}

// `composite` is the set-level built-up outline; the primary material and profile derive from row zero.
message ProfileSetWire {
  SectionPropertiesWire section = 1;
  repeated MaterialProfileWire profiles = 2 [(buf.validate.field).repeated.min_items = 1];
  ProfileRefWire composite = 3;
}

message MaterialConstituentWire {
  string material_key = 1 [(buf.validate.field).string.min_len = 1];
  string category = 2;
  double fraction = 3 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  string part_name = 4;
}

message ConstituentSetWire {
  repeated MaterialConstituentWire constituents = 1 [(buf.validate.field).repeated.min_items = 1];
}

message MaterialCompositionWire {
  oneof composition {
    option (buf.validate.oneof).required = true;

    string single = 1 [(buf.validate.field).string.min_len = 1];
    LayerSetWire layer_set = 2;
    ProfileSetWire profile_set = 3;
    ConstituentSetWire constituent_set = 4;
  }
}

// --- [EVIDENCE] ---------------------------------------------------------------------------

message AttestationWire {
  AttestationRole role = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string credential = 2;
  bytes payload = 3 [(buf.validate.field).bytes.len = 16];
  google.protobuf.Timestamp at = 4 [(buf.validate.field).required = true];
}

// `reference` blank is unset; an absent `grade` decodes as catalogue evidence.
message PropertyEvidenceWire {
  string source = 1;
  string reference = 2;
  google.type.Date valid_until = 3;
  optional EvidenceGrade grade = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AttestationWire attested = 5;
  ProvenanceWire run = 6;
}

// --- [PROPERTIES] -------------------------------------------------------------------------

// The temperature-reduction curves ride beside the 20 °C scalars; a source declaring no curve crosses absent.
message MechanicalWire {
  MeasureValueWire density = 1 [(buf.validate.field).required = true];
  MeasureValueWire youngs_modulus = 2 [(buf.validate.field).required = true];
  MeasureValueWire yield_strength = 3 [(buf.validate.field).required = true];
  MeasureValueWire ultimate_strength = 4 [(buf.validate.field).required = true];
  double poissons_ratio = 5 [(buf.validate.field).double = {
    finite: true
    gte: -1
    lte: 0.5
  }];
  double thermal_expansion_per_k = 6 [(buf.validate.field).double.finite = true];
  SampledCurveWire youngs_reduction = 7;
  SampledCurveWire yield_reduction = 8;
}

message OrthotropicWire {
  MeasureValueWire density = 1 [(buf.validate.field).required = true];
  MeasureValueWire e1_parallel = 2 [(buf.validate.field).required = true];
  MeasureValueWire e2_perpendicular = 3 [(buf.validate.field).required = true];
  MeasureValueWire shear_modulus = 4 [(buf.validate.field).required = true];
  MeasureValueWire strength1_parallel = 5 [(buf.validate.field).required = true];
  MeasureValueWire strength2_perpendicular = 6 [(buf.validate.field).required = true];
  double thermal_expansion_per_k = 7 [(buf.validate.field).double.finite = true];
  SampledCurveWire modulus_reduction = 8;
  SampledCurveWire strength_reduction = 9;
}

// A substance crosses no `u_value`; the assembly fold owns transmittance.
message ThermalWire {
  reserved 3;
  reserved "u_value";

  MeasureValueWire conductivity = 1 [(buf.validate.field).required = true];
  MeasureValueWire specific_heat = 2 [(buf.validate.field).required = true];
  double vapour_resistance_factor = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  SampledCurveWire conductivity_curve = 5;
}

message BandValueWire {
  AcousticBand band = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  double value = 2 [(buf.validate.field).double.finite = true];
}

message AcousticWire {
  option (buf.validate.message).cel = {
    id: "acoustic.absorption_bands"
    message: "absorption must contain every acoustic band exactly once"
    expression: "this.absorption.map(row, row.band).unique()"
  };
  option (buf.validate.message).cel = {
    id: "acoustic.reduction_bands"
    message: "sound reduction must contain every acoustic band exactly once"
    expression: "this.sound_reduction_index_db.map(row, row.band).unique()"
  };

  repeated BandValueWire absorption = 1 [(buf.validate.field).repeated = {
    min_items: 18
    max_items: 18
  }];
  repeated BandValueWire sound_reduction_index_db = 2 [(buf.validate.field).repeated = {
    min_items: 18
    max_items: 18
  }];
  optional double dynamic_stiffness_mn_per_m3 = 3 [(buf.validate.field).double.finite = true];
  optional double flow_resistivity_pa_s_per_m2 = 4 [(buf.validate.field).double.finite = true];
  optional double loss_factor = 5 [(buf.validate.field).double.finite = true];
}

// An unmeasured criterion crosses absent, never a zero a peer reads as a failing rating.
message FireResistanceWire {
  optional uint32 load_bearing_minutes = 1;
  optional uint32 integrity_minutes = 2;
  optional uint32 insulation_minutes = 3;
}

// A tested-system resistance-only record carries no reaction; the two sub-classes ride with the reaction or not
// at all.
message FireWire {
  option (buf.validate.message).cel = {
    id: "fire.classification"
    message: "smoke and droplet classes ride together and require a reaction class"
    expression: "has(this.smoke) == has(this.droplets) && (!has(this.smoke) || has(this.reaction))"
  };

  optional FireRating reaction = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional SmokeClass smoke = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional DropletClass droplets = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  FireResistanceWire resistance = 4 [(buf.validate.field).required = true];
}

// One cell in the dense impact tensor; its semantic key makes wire order irrelevant.
message BandCellWire {
  rasm.contracts.declaration.v1.ImpactCategory category = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  LifecycleBand band = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  double value = 3 [(buf.validate.field).double.finite = true];
}

message EnvironmentalWire {
  option (buf.validate.message).cel = {
    id: "environmental.impact_cells"
    message: "every impact category and lifecycle band pair must appear exactly once"
    expression: "this.impacts.map(row, string(int(row.category)) + '/' + string(int(row.band))).unique()"
  };

  MeasurementBasis basis = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated BandCellWire impacts = 2 [(buf.validate.field).repeated = {
    min_items: 78
    max_items: 78
  }];
  optional double recycled_content = 3 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  optional double end_of_life_recovery = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
}

// The three rates cross as EXACT non-negative decimal text under the one `currency` this message declares, since a
// binary double loses the value before a consuming decimal accumulator ever reads it. Trailing zeros are
// significant scale and survive the round trip. `max_len` is the significant-digit ceiling of the consuming
// decimal types.
message CostWire {
  MeasurementBasis basis = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string currency = 2 [(buf.validate.field).string.pattern = "^[A-Z]{3}$"];
  string supply_per_unit = 3 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
  }];
  string install_per_unit = 4 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
  }];
  string lifecycle_per_unit = 5 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
  }];
}

message RayleighWire {
  double alpha_per_s = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  double beta_s = 2 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

message DampingWire {
  double damping_ratio = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  RayleighWire rayleigh = 2;
}

message HygrothermalWire {
  double porosity = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  MeasureValueWire water_content_80rh = 2 [(buf.validate.field).required = true];
  MeasureValueWire free_water_saturation = 3 [(buf.validate.field).required = true];
  optional double water_absorption_kg_per_m2_sqrt_s = 4 [(buf.validate.field).double.finite = true];
  SampledCurveWire sorption_isotherm = 5;
  SampledCurveWire liquid_transport = 6;
  SampledCurveWire moisture_conductivity = 7;
}

message DurabilityWire {
  double carbonation_rate_mm_per_sqrt_year = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  MeasureValueWire chloride_diffusion = 2 [(buf.validate.field).required = true];
  double ageing_exponent = 3 [(buf.validate.field).double.finite = true];
}

message OpticalWire {
  double visible_transmittance = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double visible_reflectance_front = 2 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double visible_reflectance_back = 3 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double solar_transmittance = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double solar_reflectance_front = 5 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double solar_reflectance_back = 6 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double thermal_ir_transmittance = 7 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double thermal_ir_emissivity_front = 8 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  double thermal_ir_emissivity_back = 9 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
}

// A non-magnetic or unmeasured substance crosses the optional columns absent, never a unity or zero.
message ElectricalWire {
  MeasureValueWire resistivity = 1 [(buf.validate.field).required = true];
  double relative_permittivity = 2 [(buf.validate.field).double = {
    finite: true
    gte: 1
  }];
  MeasureValueWire dielectric_strength = 3;
  optional double magnetic_permeability_relative = 4 [(buf.validate.field).double.finite = true];
}

// Evidence rides the envelope; every arm keeps its own typed columns.
message MaterialPropertySetWire {
  PropertyEvidenceWire evidence = 1 [(buf.validate.field).required = true];
  oneof property_set {
    option (buf.validate.oneof).required = true;

    MechanicalWire mechanical = 2;
    OrthotropicWire orthotropic = 3;
    ThermalWire thermal = 4;
    AcousticWire acoustic = 5;
    FireWire fire = 6;
    EnvironmentalWire environmental = 7;
    CostWire cost = 8;
    DampingWire damping = 9;
    HygrothermalWire hygrothermal = 10;
    DurabilityWire durability = 11;
    OpticalWire optical = 12;
    ElectricalWire electrical = 13;
  }
}

// --- [MATERIAL] ---------------------------------------------------------------------------

message MaterialWire {
  string material_key = 1 [(buf.validate.field).string.min_len = 1];
  MaterialCompositionWire composition = 2 [(buf.validate.field).required = true];
  repeated MaterialPropertySetWire property_sets = 3;
}
