id: no-literal-failure
valid:
    - |-
      import { Effect, Data } from "effect";
      class Error extends Data.TaggedError("LocalError")<{}> {}
      Effect.fail(new Error())
    - |-
      import { Effect } from "effect";
      import { LoadError as Error } from "errors";
      Effect.fail(new Error())
    - |-
      import { Effect } from "effect";
      function fail(globalThis) { return Effect.fail(new globalThis.Error()); }
    - |-
      import { Effect } from "effect";
      Effect.mapError(work, error => { const detail = { text() { return "gone"; } }; return new LoadError({ detail }); })
    - |-
      import { Effect } from "effect";
      Effect.fail(typeof 1)
    - |-
      import { Effect } from "effect";
      Effect.mapError(work, error => { const label = () => "gone"; return new LoadError({ label }); })
    - |-
      import { Effect } from "effect";
      Effect.fail(() => "gone")
    - |-
      import { Effect } from "effect";
      const checked = Effect.fail(new LoadError({ path }));
    - |-
      import { Effect } from "effect";
      const checked = Effect.failSync(() => new LoadError({ path }));
    - |-
      import { Effect } from "effect";
      const checked = Effect.fail(error);
    - |-
      import { Effect } from "effect";
      const checked = Effect.fail(loadError(path));
    - |-
      const checked = Item.fail("gone");
    - |-
      import { Cause } from "effect";
      const cause = Cause.fail(new LoadError({ path }));
    - |-
      import { Effect } from "effect";
      const held = Effect.succeed("done");
    - |-
      import { Effect } from "effect";
      const checked = Effect.fail({ _tag: "Gone" } as const);
    - |-
      import { Effect } from "effect";
      const checked = Effect.filterOrFail(work, () => true);
    - |-
      import { Effect } from "effect";
      const checked = Effect.mapError(work, (error) => new LoadError({ cause: error }));
    - |-
      import { Deferred } from "effect";
      const done = Deferred.fail(deferred, error);
    - |-
      const missing = Config.fail("missing");
    - import { Effect } from "other"; Effect.fail("gone")
    - import { Config as Effect } from "effect"; Effect.fail("missing")
    - import { Either as E } from "effect"; E.fail("gone")
    - import { Effect as E } from "effect"; E.left("gone")
    - import { Exit as E } from "effect"; E.failSync(() => "gone")
    - import { Micro as E } from "effect"; E.orElseFail(work, () => "gone")
    - import { Cause as E } from "effect"; E.mapError(cause, () => "gone")
    - import { Option as E } from "effect"; E.fromOption(found, () => "gone")
    - import { Either as E } from "effect"; E.map(decoded, () => "success")
    - |-
      import { Effect } from "effect";
      const checked = Effect.mapError(work, (error) => error.message);
    - |-
      import { Effect } from "effect";
      Effect.mapError(work, (error) => { const label = () => { return "gone"; }; return new LoadError({ label }); })
    - |-
      import { Effect } from "effect";
      const checked = Effect.filterOrFail(work, (item) => item.ready);
    - |-
      import { Effect } from "effect";
      const checked = Effect.filterOrFail(work, () => true, () => new LoadError({ path }));
    - import { Option as E } from "effect"; E.filterOrFail(found, isItem, () => "gone")
    - 'import { Effect } from "effect"; Effect.try({ try: () => parse(raw), catch: (cause) => new ParseError({ cause }) })'
    - 'import { Effect } from "effect"; Effect.try({ try: () => "done", catch: (cause) => new ParseError({ cause }) })'
    - 'import { Effect } from "effect"; Effect.mapBoth(work, { onFailure: (error) => new LoadError({ error }), onSuccess: () => "done" })'
    - 'import { Effect } from "effect"; Effect.match(work, { onFailure: () => "gone", onSuccess: () => "done" })'
    - 'import { Micro as E } from "effect"; E.mapBoth(work, { onFailure: () => "gone", onSuccess: (value) => value })'
    - 'import { Micro as E } from "effect"; E.tryMap(work, { try: (value) => parse(value), catch: () => "gone" })'
    - 'import { Effect } from "effect"; Effect.try({ try() { return "done"; }, catch: (cause) => new ParseError({ cause }) })'
    - 'import { Either } from "effect"; Either.match(decoded, { onLeft: () => "gone", onRight: (value) => value })'
    - 'import { Option as E } from "effect"; E.try({ try: () => parse(raw), catch: () => "gone" })'
invalid:
    - 'import { Effect } from "effect"; Effect.try({ try: () => parse(raw), catch: () => "gone" })'
    - 'import { Effect } from "effect"; Effect.tryPromise({ try: () => load(path), catch: (cause) => new Error("gone") })'
    - 'import { Effect } from "effect"; work.pipe(Effect.tryMap({ try: (value) => parse(value), catch: () => "gone" }))'
    - 'import { Effect } from "effect"; Effect.tryMapPromise(work, { try: (value) => load(value), catch: () => 404 })'
    - 'import { Effect } from "effect"; Effect.try({ try: () => parse(raw), catch() { return "gone"; } })'
    - 'import { Micro } from "effect"; Micro.try({ try: () => parse(raw), catch: () => "gone" })'
    - 'import { STM } from "effect"; STM.try({ try: () => parse(raw), catch: () => "gone" })'
    - 'import { Either } from "effect"; Either.try({ try: () => parse(raw), catch: () => "gone" })'
    - 'import { Effect } from "effect"; Effect.mapBoth(work, { onFailure: (error) => `load failed: ${error.message}`, onSuccess: (value) => value })'
    - 'import { STM } from "effect"; transaction.pipe(STM.mapBoth({ onFailure: () => "gone", onSuccess: (value) => value }))'
    - 'import { Exit } from "effect"; Exit.mapBoth(exit, { onFailure: () => "gone", onSuccess: (value) => value })'
    - 'import { Stream } from "effect"; Stream.mapBoth(stream, { onFailure: () => "gone", onSuccess: (value) => value })'
    - 'import { Either } from "effect"; Either.mapBoth(decoded, { onLeft: () => "gone", onRight: (value) => value })'
    - |-
