id: xml-root
language: xml
role: item
symbolType: module
rule:
    kind: Name
    pattern: $NAME
    inside: {kind: 'STag, EmptyElemTag', pattern: $TAG, inside: {kind: element, inside: {kind: document}}}
transform:
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: xml-import
language: xml
role: item
symbolType: module
utils:
    project-child: {inside: {kind: content, inside: {kind: element, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}}
rule:
    any:
        - kind: Attribute
          pattern: $TAG
          inside: {kind: 'STag, EmptyElemTag', inside: {kind: element, inside: {kind: document}}}
          all:
            - has: {kind: Name, regex: '^xmlns(?::|$)|(?:^|:)(?:noNamespaceS|s)chemaLocation$'}
            - has: {field: value, pattern: $TARGET}
        - kind: Attribute
          pattern: $TAG
          inside: {kind: 'STag, EmptyElemTag', has: {kind: Name, pattern: Project}, inside: {kind: element, inside: {kind: document}}}
          all:
            - has: {kind: Name, pattern: Sdk}
            - has: {field: value, pattern: $TARGET}
        - kind: StyleSheetPI, XmlModelPI
          pattern: $TAG
          has: {kind: PseudoAtt, all: [{has: {kind: Name, pattern: href}}, {has: {field: value, pattern: $TARGET}}]}
        - kind: ExternalID
          pattern: $TAG
          not: {inside: {kind: NotationDecl}}
          has: {kind: SystemLiteral, has: {kind: URI, pattern: $TARGET}}
        - kind: PEReference
          inside: {kind: doctypedecl}
          all: [{pattern: $TAG}, {pattern: $TARGET}]
        - kind: element
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, regex: '(?:^|:)(?:include|import|redefine|override|import-schema|use-package|externalRef)$'}
                - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: name}, {pattern: href}, {pattern: namespace}, {pattern: schemaLocation}, {pattern: schema-location}]}}, {has: {field: value, pattern: $TARGET}}]}
        - kind: element
          all:
            - has:
                kind: STag, EmptyElemTag
                pattern: $TAG
                all:
                    - has: {kind: Name, any: [{pattern: Import}, {pattern: Sdk}]}
                    - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: Project}, {pattern: Name}]}}, {has: {field: value, pattern: $TARGET}}]}
            - any:
                - inside: {kind: content, inside: {kind: element, matches: project-child, has: {kind: STag, pattern: $GROUP, has: {kind: Name, pattern: ImportGroup}}}}
                - matches: project-child
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    PREFIX_LINE: replace($GROUP, replace='[\t\n\r ]+|$', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $PREFIX_LINE$SIGNATURE
isImport: true
isExported: false
---
id: xml-interface
language: xml
role: item
symbolType: interface
rule: {kind: Name, pattern: $NAME, inside: {kind: doctypedecl}}
name: $NAME
signature: <!DOCTYPE $NAME>
isExported: false
---
id: xml-instruction
language: xml
role: item
symbolType: event
rule:
    pattern: $TAG
    any:
        - {kind: PI, has: {kind: PITarget, pattern: $NAME}}
        - {kind: XMLDecl, has: {regex: '^xml$', pattern: $$NAME}}
transform:
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: xml-namespace
language: xml
role: item
symbolType: namespace
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: Solution}}}}
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        all:
            - has: {kind: Name, pattern: Folder}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: Name}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-solution-project
language: xml
role: item
symbolType: module
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: Solution}}}}
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        all:
            - has: {kind: Name, pattern: Project}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: Path}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-using-task
language: xml
role: item
symbolType: class
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        all:
            - has: {kind: Name, pattern: UsingTask}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: TaskName}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-function
language: xml
role: item
symbolType: function
utils:
    hidden:
        any:
            - all: [{has: {kind: Name, pattern: Name}}, {has: {field: value, regex: '^_'}}]
            - all: [{has: {kind: Name, pattern: visibility}}, {has: {field: value, any: [{pattern: {context: '<a b="private"/>', selector: AttText}}, {pattern: {context: '<a b="hidden"/>', selector: AttText}}]}}]
rule:
    kind: element
    any:
        - inside: {kind: content, inside: {kind: element, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, pattern: Target}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: Name}}, {has: {field: value, pattern: $TARGET}}]}
        - has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            has: {kind: Name, any: [{pattern: template}, {pattern: function}, {regex: ':(?:template|function)$'}]}
            any:
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: match}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isExported: {not: {has: {kind: 'STag, EmptyElemTag', has: {kind: Attribute, matches: hidden}}}}
---
id: xml-struct
language: xml
role: item
symbolType: struct
rule:
    any:
        - kind: element
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, regex: '(?:^|:)(?:complexType|simpleType|group|attributeGroup|element|define|attribute-set|character-map)$'}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}
        - kind: elementdecl, AttlistDecl
          pattern: $TAG
          has: {kind: 'Name, PEReference', pattern: $TARGET}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-property
language: xml
role: item
symbolType: property
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        all:
            - has: {kind: Name, any: [{pattern: attribute}, {regex: ':attribute$'}]}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-variable
language: xml
role: item
symbolType: variable
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        all:
            - has: {kind: Name, any: [{pattern: variable}, {pattern: param}, {regex: ':(?:variable|param)$'}]}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isExported: {not: {has: {kind: 'STag, EmptyElemTag', has: {kind: Attribute, all: [{has: {kind: Name, pattern: visibility}}, {has: {field: value, any: [{pattern: {context: '<a b="private"/>', selector: AttText}}, {pattern: {context: '<a b="hidden"/>', selector: AttText}}]}}]}}}}
---
id: xml-constant
language: xml
role: item
symbolType: constant
rule:
    any:
        - kind: Name, PEReference
          pattern: $TARGET
          inside: {kind: 'GEDecl, PEDecl, NotationDecl', pattern: $TAG}
        - kind: element
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, any: [{pattern: notation}, {regex: ':notation$'}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-section
language: xml
role: item
symbolType: array
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: configuration}}}}
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, has: {kind: Name, pattern: $NAME}}
transform:
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-element
language: xml
role: item
symbolType: object
utils:
    project: {inside: {kind: element, stopBy: end, inside: {kind: document}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}
rule:
    kind: element
    inside: {kind: content}
    all:
        - has:
            kind: STag, EmptyElemTag
            has: {kind: Name, pattern: $TYPE, not: {all: [{any: [{pattern: Choose}, {pattern: When}, {pattern: Otherwise}, {pattern: ImportGroup}]}, {matches: project}]}}
            any:
                - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^(?:id|Id|ID|xml:id|name|Name|key|Key|ref|label|Label|pattern)$'}}, {has: {field: value, pattern: $IDENTITY}}]}
                - kind: STag, EmptyElemTag
        - any:
            - {pattern: $TAG, has: {kind: content, not: {any: [{regex: '^[\t\n\r ]*$'}, {has: {kind: 'element, CDSect, PI'}}]}}}
            - has: {kind: 'STag, EmptyElemTag', pattern: $TAG}
        - any:
            - inside: {kind: content, inside: {kind: element, has: {kind: STag, pattern: $BRANCH, has: {kind: Name, any: [{pattern: When}, {pattern: Otherwise}]}}}}
            - kind: element
transform:
    SUFFIX_LINE: replace($IDENTITY, replace='^[\t\n\r ]*|[\t\n\r ]+', by=' ')
    PREFIX_LINE: replace($BRANCH, replace='[\t\n\r ]+|$', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $TYPE$SUFFIX_LINE
signature: $PREFIX_LINE$SIGNATURE
isExported: {has: {kind: 'STag, EmptyElemTag', has: {kind: Name, any: [{pattern: PropertyGroup}, {pattern: ItemGroup}, {pattern: ItemDefinitionGroup}], matches: project}}}
---
id: xml-member-property
language: xml
role: member
parentRuleIds: [xml-element, xml-function, xml-using-task, xml-struct, xml-property]
symbolType: property
utils:
    text:
        any:
            - {pattern: $TEXT, has: {kind: content, not: {has: {kind: 'element, CDSect, PI'}}}}
            - has: {kind: 'STag, EmptyElemTag', pattern: $TEXT}
rule:
    any:
        - kind: element
          matches: text
          has: {kind: 'STag, EmptyElemTag', has: {kind: Name, pattern: $TARGET}}
          inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, any: [{pattern: PropertyGroup}, {pattern: ParameterGroup}]}}}}
        - kind: element
          matches: text
          has:
            kind: STag, EmptyElemTag
            all:
                - has: {kind: Name, any: [{pattern: Output}, {pattern: attribute}, {regex: ':attribute$'}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: PropertyName}, {pattern: name}, {pattern: ref}]}}, {has: {field: value, pattern: $TARGET}}]}
        - kind: Name, PEReference
          pattern: $TARGET
          inside: {kind: AttDef, pattern: $TEXT}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TEXT, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isPublic: {not: {has: {kind: 'STag, EmptyElemTag', any: [{has: {kind: Name, regex: '^_'}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: PropertyName}}, {has: {field: value, regex: '^_'}}]}}]}}}
---
id: xml-member-variable
language: xml
role: member
parentRuleIds: [xml-element, xml-function]
symbolType: variable
utils:
    item-group-child: {inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, any: [{pattern: ItemGroup}, {pattern: ItemDefinitionGroup}]}}}}}
    specification:
        any:
            - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: Include}, {pattern: Update}, {pattern: Remove}]}}, {has: {field: value, pattern: $SPECIFICATION}}]}
            - kind: STag, EmptyElemTag
    text:
        any:
            - {pattern: $TEXT, has: {kind: content, not: {has: {kind: 'element, CDSect, PI'}}}}
            - has: {kind: 'STag, EmptyElemTag', pattern: $TEXT}
    hidden:
        any:
            - has: {kind: Name, regex: '^_|(?:^|:)variable$'}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: ItemName}}, {has: {field: value, regex: '^_'}}]}
rule:
    any:
        - kind: element
          matches: item-group-child
          not: {has: {kind: content, has: {kind: element}}}
          all:
            - matches: text
            - has: {kind: 'STag, EmptyElemTag', has: {kind: Name, pattern: $TARGET}, matches: specification}
        - kind: STag
          pattern: $TEXT
          has: {kind: Name, pattern: $TARGET}
          matches: specification
          inside: {kind: element, matches: item-group-child, has: {kind: content, has: {kind: element}}}
        - kind: element
          matches: text
          has:
            kind: STag, EmptyElemTag
            all:
                - has: {kind: Name, any: [{pattern: Output}, {pattern: param}, {pattern: variable}, {regex: ':(?:param|variable)$'}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: ItemName}, {pattern: name}]}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SUFFIX_LINE: replace($SPECIFICATION, replace='^[\t\n\r ]*|[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TEXT, replace='[\t\n\r ]+', by=' ')
name: $NAME$SUFFIX_LINE
signature: $SIGNATURE
isPublic: {not: {any: [{matches: hidden}, {has: {kind: 'STag, EmptyElemTag', matches: hidden}}]}}
---
id: xml-member-metadata
language: xml
role: member
parentRuleIds: [xml-element, xml-function]
symbolType: field
rule:
    kind: element
    has: {kind: 'STag, EmptyElemTag', has: {kind: Name, pattern: $NAME}}
    any:
        - {pattern: $TEXT, has: {kind: content, not: {has: {kind: 'element, CDSect, PI'}}}}
        - has: {kind: 'STag, EmptyElemTag', pattern: $TEXT}
    inside:
        kind: content
        inside:
            kind: element
            has: {kind: STag, has: {kind: Name, pattern: $OWNER}}
            inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, any: [{pattern: ItemGroup}, {pattern: ItemDefinitionGroup}]}}}}
transform:
    SIGNATURE: replace($TEXT, replace='[\t\n\r ]+', by=' ')
name: $OWNER.$NAME
signature: $SIGNATURE
---
id: xml-function-group
language: xml
role: member
parentRuleIds: [xml-function]
symbolType: object
rule:
    kind: STag, EmptyElemTag
    pattern: $TAG
    inside: {kind: element, inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, pattern: Target}}}}}
    has: {kind: Name, any: [{pattern: PropertyGroup}, {pattern: ItemGroup}], pattern: $GROUP}
    any:
        - has: {kind: Attribute, all: [{has: {kind: Name, pattern: Label}}, {has: {field: value, pattern: $LABEL}}]}
        - kind: STag, EmptyElemTag
transform:
    SUFFIX: replace($LABEL, replace='^[\t\n\r ]*|[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $GROUP$SUFFIX
signature: $SIGNATURE
isPublic: false
---
id: xml-function-task
language: xml
role: member
parentRuleIds: [xml-function]
symbolType: method
rule:
    kind: STag, EmptyElemTag
    pattern: $TAG
    has: {kind: Name, pattern: $NAME, not: {any: [{pattern: PropertyGroup}, {pattern: ItemGroup}, {pattern: OnError}]}}
    inside: {kind: element, inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, pattern: Target}}}}}
transform:
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isPublic: false
---
id: xml-member-event
language: xml
role: member
parentRuleIds: [xml-element, xml-function, xml-using-task, xml-struct]
symbolType: event
rule:
    any:
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TAG, has: {kind: Name, all: [{pattern: OnError}, {pattern: $NAME}]}}
        - {kind: PI, pattern: $TAG, has: {kind: PITarget, pattern: $NAME}}
transform:
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
isPublic: false
---
id: xml-member-module
language: xml
role: member
parentRuleIds: [xml-element, xml-namespace, xml-struct]
symbolType: module
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        any:
            - all:
                - has: {kind: Name, pattern: Project}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: Path}}, {has: {field: value, pattern: $TARGET}}]}
            - all:
                - has: {kind: Name, any: [{pattern: include}, {regex: ':include$'}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: href}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-namespace-file
language: xml
role: member
parentRuleIds: [xml-namespace]
symbolType: file
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        all:
            - has: {kind: Name, pattern: File}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: Path}}, {has: {field: value, pattern: $TARGET}}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-struct-enum-member
language: xml
role: member
parentRuleIds: [xml-struct, xml-property]
symbolType: enumMember
rule:
    any:
        - kind: element
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, any: [{pattern: enumeration}, {regex: ':enumeration$'}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, pattern: value}}, {has: {field: value, pattern: $TARGET}}]}
        - {kind: Nmtoken, inside: {kind: Enumeration}, all: [{pattern: $TARGET}, {pattern: $TAG}]}
        - {kind: Name, inside: {kind: NotationType}, all: [{pattern: $TARGET}, {pattern: $TAG}]}
transform:
    NAME: replace($TARGET, replace='[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $NAME
signature: $SIGNATURE
---
id: xml-member-key
language: xml
role: member
parentRuleIds: [xml-element, xml-section]
symbolType: key
rule:
    any:
        - kind: STag, EmptyElemTag
          pattern: $TEXT
          has: {kind: Attribute, all: [{has: {kind: Name, pattern: key}}, {has: {field: value, pattern: $KEY}}]}
          inside: {kind: element, inside: {kind: content, inside: {kind: element, inside: {kind: content}}}}
        - kind: element
          pattern: $TEXT
          inside:
            kind: content
            inside:
                kind: element
                has: {kind: STag, has: {kind: Name, pattern: dict}}
                any:
                    - follows: {kind: element, stopBy: {kind: element}, all: [{has: {kind: STag, has: {kind: Name, pattern: key}}}, {has: {kind: content, pattern: $OWNER}}]}
                    - kind: element
          all:
            - has: {kind: STag, has: {kind: Name, pattern: key}}
            - has: {kind: content, pattern: $KEY}
          any:
            - precedes: {kind: element, stopBy: {kind: element}, pattern: $VALUE, not: {has: {kind: content, has: {kind: element}}}}
            - kind: element
transform:
    QUALIFIER: replace($OWNER, replace='$', by='.')
    QUALIFIER_LINE: replace($QUALIFIER, replace='[\t\n\r ]+', by=' ')
    NAME: replace($KEY, replace='[\t\n\r ]+', by=' ')
    VALUE_LINE: replace($VALUE, replace='^|[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TEXT, replace='[\t\n\r ]+', by=' ')
name: $QUALIFIER_LINE$NAME
signature: $SIGNATURE$VALUE_LINE
---
id: xml-member-field
language: xml
role: member
parentRuleIds: [xml-element, xml-struct, xml-solution-project, xml-namespace, xml-section, xml-import, xml-property]
symbolType: field
utils:
    identity: {kind: Name, regex: '^(?:id|Id|ID|xml:id|name|Name|key|Key|ref|label|Label|pattern)$'}
rule:
    kind: STag, EmptyElemTag
    has: {kind: Name, pattern: $TYPE}
    any:
        - pattern: $TAG
          has: {kind: Attribute, all: [{has: {matches: identity}}, {has: {field: value, pattern: $IDENTITY}}]}
        - precedes: {kind: content, not: {any: [{regex: '^[\t\n\r ]*$'}, {has: {kind: 'element, CDSect, PI'}}]}}
          inside: {kind: element, pattern: $TAG}
    inside:
        kind: element
        inside:
            kind: content
            inside:
                kind: element
                not: {has: {kind: STag, has: {kind: Name, any: [{pattern: dict}, {pattern: When}, {pattern: Otherwise}]}}}
                inside: {kind: content}
                any:
                    - inside: {kind: content, inside: {kind: element, inside: {kind: document}}}
                    - has: {kind: STag, has: {kind: Attribute, all: [{has: {matches: identity}}, {has: {field: value, pattern: $OWNER}}]}}
                    - kind: element
transform:
    QUALIFIER: replace($OWNER, replace='$', by='/')
    QUALIFIER_LINE: replace($QUALIFIER, replace='[\t\n\r ]+', by=' ')
    SUFFIX_LINE: replace($IDENTITY, replace='^[\t\n\r ]*|[\t\n\r ]+', by=' ')
    SIGNATURE: replace($TAG, replace='[\t\n\r ]+', by=' ')
name: $QUALIFIER_LINE$TYPE$SUFFIX_LINE
signature: $SIGNATURE
