# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-function-python
language: python
severity: error
utils:
    method:
        kind: function_definition
        inside: {kind: block, stopBy: {not: {kind: decorated_definition}}, inside: {kind: class_definition, field: body}}
    plain-decorator:
        kind: decorator
        has:
            any:
                - matches: {python-builtin-name: {name: {regex: '^(staticmethod|classmethod)$'}}}
                - matches: {python-member-use: {module: {regex: '^typing(_extensions)?$'}, name: {regex: '^override$'}}}
    named-callee:
        any:
            - kind: identifier
              pattern: $ROOT
              any:
                - not:
                    inside:
                        kind: function_definition
                        stopBy: {kind: 'function_definition, lambda'}
                        has: {field: parameters, has: {matches: {python-parameter: {name: {pattern: $ROOT}}}}}
                - regex: '^(self|cls)$'
                  all:
                    - inside: {kind: attribute, field: object}
                    - inside:
                        matches: method
                        stopBy: {kind: 'function_definition, lambda'}
                        has: {field: parameters, has: {nthChild: 1, kind: identifier, pattern: $ROOT}}
            - kind: attribute
              has: {field: object, matches: named-callee}
    forwarding-statement:
        kind: return_statement, expression_statement
        inside: {kind: block, inside: {kind: function_definition}}
    forwarded-call:
        kind: call
        pattern: $CALL
        any:
            - inside: {matches: forwarding-statement}
            - inside: {kind: await, inside: {matches: forwarding-statement}}
    receiver:
        kind: identifier
        regex: '^(self|cls)$'
        pattern: $RECEIVER
        nthChild: 1
        inside:
            kind: parameters
            inside:
                matches: method
                not: {has: {field: body, has: {stopBy: end, pattern: $CALL, has: {field: arguments, has: {stopBy: end, kind: identifier, pattern: $RECEIVER}}}}}
    slot:
        kind: identifier, typed_parameter, list_splat_pattern, dictionary_splat_pattern
        not: {matches: receiver}
    position:
        any: [{matches: slot}, {kind: keyword_separator}]
    plain-slot:
        any: [{kind: identifier, pattern: $X}, {kind: typed_parameter, has: {nthChild: 1, kind: identifier, pattern: $X}}]
    forwarded-parameters:
        kind: parameters
        all:
            - not: {has: {kind: 'default_parameter, typed_default_parameter'}}
            - not:
                has:
                    all:
                        - matches: slot
                        - matches: {python-parameter: {name: {pattern: $X}}}
                        - not: {inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: body, has: {stopBy: end, pattern: $CALL, has: {field: arguments, has: {stopBy: end, kind: identifier, pattern: $X}}}}}}
    positional-argument:
        any: [{kind: identifier, pattern: $X}, {kind: list_splat, has: {kind: identifier, pattern: $X}}]
    unforwarded-argument:
        any:
            - kind: identifier
              any:
                - follows: {stopBy: end, kind: list_splat}
                - all:
                    - pattern: $X
                    - not: {inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: parameters, has: {matches: plain-slot}}}}
            - kind: keyword_argument
              not:
                all:
                    - has: {field: name, pattern: $X}
                    - has: {field: value, kind: identifier, pattern: $X}
                    - inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: parameters, has: {matches: plain-slot}}}
            - kind: list_splat
              not:
                all:
                    - has: {kind: identifier, pattern: $X}
                    - inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: parameters, has: {stopBy: end, kind: list_splat_pattern, has: {kind: identifier, pattern: $X}}}}
            - kind: dictionary_splat
              not:
                all:
                    - has: {kind: identifier, pattern: $X}
                    - inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: parameters, has: {stopBy: end, kind: dictionary_splat_pattern, has: {kind: identifier, pattern: $X}}}}
            - not: {kind: 'identifier, keyword_argument, list_splat, dictionary_splat, comment'}
    forwarded-arguments:
        kind: argument_list
        all:
            - not: {has: {pattern: $_, matches: unforwarded-argument}}
            - not:
                has:
                    all:
                        - nthChild: {position: 1, ofRule: {kind: 'identifier, list_splat'}}
                        - matches: positional-argument
                        - not: {inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: parameters, has: {all: [{nthChild: {position: 1, ofRule: {matches: position}}}, {matches: {python-parameter: {name: {pattern: $X}}}}]}}}}
            - not:
                has:
                    all:
                        - matches: positional-argument
                        - precedes: {stopBy: {kind: 'identifier, list_splat'}, any: [{kind: identifier, pattern: $Y}, {kind: list_splat, has: {kind: identifier, pattern: $Y}}]}
                        - not: {inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: parameters, has: {all: [{matches: {python-parameter: {name: {pattern: $X}}}}, {precedes: {stopBy: {matches: position}, matches: {python-parameter: {name: {pattern: $Y}}}}}]}}}}
rule:
    kind: function_definition
    all:
        - has: {field: name, pattern: $NAME}
        - any:
            - not: {has: {regex: '^async$'}}
            - has: {field: body, has: {matches: forwarding-statement, has: {kind: await}}}
        - not: {inside: {kind: decorated_definition, has: {kind: decorator, not: {matches: plain-decorator}}}}
        - has:
            field: body
            matches: python-single-statement-block
            has:
                stopBy: {kind: 'function_definition, lambda'}
                all:
                    - matches: forwarded-call
                    - has: {field: function, pattern: $F}
                    - has: {field: arguments, matches: forwarded-arguments}
        - any:
            - has: {field: body, has: {stopBy: end, pattern: $CALL, has: {field: function, pattern: 'super().$NAME'}}}
            - all:
                - not: {has: {field: name, regex: '^__\w+__$'}}
                - has: {field: body, has: {stopBy: end, pattern: $CALL, has: {field: function, matches: named-callee, not: {pattern: $NAME}}}}
        - has: {field: parameters, matches: forwarded-parameters}
message: 'Function forwards its parameters unchanged to `$F`'
note: 'Call `<callee>` at each call site, write its body in the member a host calls by name, and delete an override its parent member answers'
