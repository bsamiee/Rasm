# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
utils:
    header:
        kind: extension_declaration
        all:
            - has: {kind: receiver_parameter, all: [{has: {field: type, pattern: $TYPE}}, {has: {nthChild: 1, pattern: $LEAD}}]}
            - has: {nthChild: 1, any: [{kind: type_parameter_list, pattern: $GENERIC}, {kind: receiver_parameter, has: {field: type, pattern: $GENERIC}}]}
            - has: {nthChild: {position: 2, reverse: true}, any: [{kind: type_parameter_constraints_clause, pattern: $WHERE}, {kind: receiver_parameter, has: {field: type, pattern: $WHERE}}]}
rule:
    all:
        - matches: header
        - follows: {stopBy: end, matches: header}
message: '`extension` block repeats receiver `$TYPE` an earlier block of the class declares'
note: 'Move its members into the earlier `extension` block of `<receiver>`, one subsection divider per family'
