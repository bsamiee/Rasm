name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            uncached:
                description: Jobs running every task of their nx affected step past the Nx cache, to time them
                type: choice
                default: none
                options: [none, linux and browser, macos, all]

concurrency:
    group: ${{ github.event_name == 'push' && 'main' || format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && github.ref || github.run_id) }}
    cancel-in-progress: false
    queue: max

permissions:
    contents: read
    actions: read

env:
    MSBUILDDISABLENODEREUSE: '1'
    NX_PARALLEL: 100%

defaults:
    run:
        shell: bash

jobs:
    shas:
        name: Base commit
        runs-on: [self-hosted, graph]
        timeout-minutes: 30
        outputs:
            base: ${{ steps.shas.outputs.base || steps.root.outputs.sha }}
            head: ${{ steps.shas.outputs.head || github.sha }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - id: root
              run: |-
                  root="$(git rev-list --max-parents=0 HEAD)"
                  printf "sha=%s\n" "${root}" >> "${GITHUB_OUTPUT}"
            - id: shas
              if: ${{ github.event_name != 'workflow_dispatch' }}
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  fallback-sha: ${{ steps.root.outputs.sha }}
                  workflow-id: ci.yml
                  lookup-strategy: per-commit
                  max-commits: 150

    affected:
        name: Affected projects
        needs: shas
        runs-on: [self-hosted, graph]
        timeout-minutes: 30
        outputs:
            engines: ${{ steps.unreal.outputs.engines }}
            unreal: ${{ steps.listed.outputs.unreal }}
            browser: ${{ steps.listed.outputs.browser }}
            windows: ${{ steps.listed.outputs.windows }}
            rhino: ${{ steps.listed.outputs.rhino }}
            image: ${{ steps.listed.outputs.image }}
            infra: ${{ steps.listed.outputs.infra }}
        env:
            GH_TOKEN: &github ${{ github.token }}
            NX_BASE: &base ${{ needs.shas.outputs.base }}
            NX_HEAD: &head ${{ needs.shas.outputs.head }}
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: &server ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: &token ${{ github.event_name == 'pull_request' && secrets.NX_SELF_HOSTED_REMOTE_CACHE_READ_TOKEN || secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
        steps:
            - *checkout
            - &tools
              id: tools
              uses: $/.github/actions/tools
            - id: unreal
              uses: $/.github/actions/unreal
            - id: listed
              run: |-
                  listed() {
                      projects="$(nx show projects --affected --withTarget="$2" --exclude="$3" --json)"
                      printf "%s=%s\n" "$1" "${projects}"
                  }
                  version="$(yq '.catalog["@playwright/test"]' pnpm-workspace.yaml)"
                  {
                      listed unreal check,test,build '*,!tag:host:unreal'
                      listed browser check,test,build,pack '*,!tag:host:browser'
                      listed windows test,build '*,!tag:os:win32,!tag:host:rhino'
                      listed rhino test,build '*,!tag:host:rhino'
                      listed infra deploy--pulumi '*,!@rasm/infra'
                      printf "image=%s\n" "ghcr.io/${GITHUB_REPOSITORY,,}/playwright:${version}"
                  } >> "${GITHUB_OUTPUT}"

    linux:
        name: Linux
        needs: shas
        runs-on: [self-hosted, host]
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - &stale
              run: rm -rf .artifacts/cmake/*/*.log .artifacts/dotnet/test .artifacts/playwright .artifacts/vitest
            - *checkout
            - *tools
            - run: nx sync:check
            - run: nx conformance:check
            - id: codegen
              run: nx run-many --targets=codegen
            - run: hk check --from-ref "${NX_BASE}" --to-ref "${NX_HEAD}"
            - if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
              run: nx affected --targets=check,test,build --configuration=ci --exclude='tag:os:*,!tag:os:linux,tag:host:rhino,tag:host:browser,tag:host:unreal,tag:host:claude-code'
              env:
                  NX_SKIP_NX_CACHE: ${{ contains(inputs.uncached, 'linux') || inputs.uncached == 'all' }}
            - &reports
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.job }}-reports
                  if-no-files-found: ignore
                  path: |-
                      .artifacts/cmake/*/*.log
                      .artifacts/dotnet/test
                      .artifacts/playwright
                      .artifacts/vitest
                      .artifacts/apple/**/*.xcresult
                      .cache/nx/workspace-data/project-graph.json
                      .cache/nx/workspace-data/*.db*

    browser:
        name: Browser
        needs: [shas, affected]
        if: ${{ needs.affected.outputs.browser != '[]' }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        permissions:
            contents: read
            packages: read
        container:
            image: ${{ needs.affected.outputs.image }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ github.token }}
            options: --init --ipc=host
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - *stale
            - *checkout
            - *tools
            - run: nx affected --targets=check,test,build,pack --exclude='*,!tag:host:browser'
              env:
                  NX_BATCH_MODE: 'false'
                  NX_SKIP_NX_CACHE: ${{ contains(inputs.uncached, 'linux') || inputs.uncached == 'all' }}
            - *reports

    macos:
        name: macOS
        needs: shas
        runs-on: xcode-27
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        steps:
            - &clone
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
            - &restore
              id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |-
                      .cache/nx/workspace-data/*
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                      !.cache/nx/workspace-data/xcode-packages
                  key: nx-${{ runner.os }}-
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest-stable
            - *tools
            - if: ${{ env.APPLE_DEVELOPMENT_P12 != '' }}
              uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
              with:
                  p12-file-base64: ${{ env.APPLE_DEVELOPMENT_P12 }}
                  p12-password: ${{ env.APPLE_DEVELOPMENT_P12_PASSWORD }}
            - run: nx conformance:check
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:darwin,tag:host:rhino,tag:host:unreal'
              env:
                  NX_SKIP_NX_CACHE: ${{ inputs.uncached == 'macos' || inputs.uncached == 'all' }}
            - if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
              run: hk check --step swiftlint --step swift-format --step plutil --step xcprojformatter --from-ref "${NX_BASE}" --to-ref "${NX_HEAD}"
              env:
                  HK_LIBGIT2: 'false'
            - &save
              if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !endsWith(steps.graph.outputs.cache-matched-key, hashFiles('.cache/nx/workspace-data/*.hash')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: nx-${{ runner.os }}-${{ hashFiles('.cache/nx/workspace-data/*.hash') }}
            - *reports

    windows:
        name: Windows
        needs: [shas, affected]
        if: ${{ needs.affected.outputs.windows != '[]' }}
        runs-on: windows-2025
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - *clone
            - *restore
            - *tools
            - id: rhino
              if: &rhino ${{ needs.affected.outputs.rhino != '[]' }}
              run: |-
                  major="$(yq -p xml -oy '.Project.PropertyGroup[] | select(.+@Label == "Rhino") | .RhinoVersion | split(".") | .[0]' Directory.Build.props)"
                  installer="$(curl -fsS -o /dev/null -w '%{redirect_url}' --get --data-urlencode "slug=rhino-for-windows/${major}/latest" --data-urlencode "email=${RHINO_EMAIL}" https://www.rhino3d.com/www-api/download/direct)"
                  printf "RHINO_INSTALLER=%s\n" "${installer}" >> "${GITHUB_ENV}"
              env:
                  RHINO_EMAIL: ${{ secrets.RHINO_EMAIL }}
            - if: ${{ needs.affected.outputs.windows != needs.affected.outputs.rhino }}
              run: nx affected --targets=test --configuration=headless --exclude='*,!tag:os:win32,tag:host:rhino'
            - id: cached
              if: *rhino
              run: nx affected --targets=test --configuration=headless --exclude='*,!tag:host:rhino' || printf "missed=true\n" >> "${GITHUB_OUTPUT}"
            - if: ${{ steps.cached.outputs.missed == 'true' }}
              uses: mcneel/setup-rhino3d@095a5ff63cdb7dc8383e229fc40ffa779915b0af # v4.0.0
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  download-url: ${{ env.RHINO_INSTALLER }}
            - if: ${{ steps.cached.outputs.missed == 'true' }}
              run: nx affected --targets=test --configuration=headless --exclude='*,!tag:host:rhino'
              env:
                  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}
            - *save
            - *reports

    unreal:
        name: Unreal Engine ${{ matrix.engine }}
        needs: affected
        if: ${{ needs.affected.outputs.unreal != '[]' && needs.affected.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.affected.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.repository_owner }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: 'false'
        steps:
            - *checkout
            - *tools
            - run: nx run-many --targets=check,test,build --projects="${PROJECTS}"
              env:
                  PROJECTS: ${{ join(fromJSON(needs.affected.outputs.unreal), ',') }}

    deploy:
        name: Deploy
        needs: [affected, linux, browser, unreal]
        if: ${{ !cancelled() && github.event_name == 'push' && needs.affected.result == 'success' && needs.affected.outputs.infra != '[]' }}
        permissions:
            contents: read
            id-token: write
        uses: $/.github/workflows/deploy.yml
        secrets: inherit
