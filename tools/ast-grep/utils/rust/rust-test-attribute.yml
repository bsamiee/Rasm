# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-test-attribute
language: rust
rule:
    kind: attribute_item
    any:
        - regex: '^#\[\s*cfg\s*\(.*\b(test|doctest)\b'
          not: {regex: '^#\[\s*cfg\s*\(\s*not\s*\(\s*test\b'}
        - regex: '^#\[\s*(::)?(((tokio|sqlx)::)?test|bench|(rstest::)?(rstest|fixture)|(proptest::)?property_test)\s*(\(|\]|$)'
