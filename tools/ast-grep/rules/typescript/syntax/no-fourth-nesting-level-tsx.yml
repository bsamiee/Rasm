# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-tsx
language: tsx
severity: error
utils:
    boundary: {any: [{matches: typescript-control-flow}, {matches: typescript-function-boundary}]}
rule:
    matches: typescript-control-flow
    pattern: $SCOPE
    inside:
        matches: typescript-control-flow
        stopBy: {matches: boundary}
        inside:
            matches: typescript-control-flow
            stopBy: {matches: boundary}
            inside:
                matches: typescript-control-flow
                stopBy: {matches: boundary}
                not: {inside: {matches: typescript-control-flow, stopBy: {matches: typescript-function-boundary}}}
message: Control flow reaches a fourth nesting level
note: 'Rebuild the nested decisions or loops as one match, lookup, or pipeline over their inputs, with no extracted helper'
labels:
    SCOPE: {style: primary}
