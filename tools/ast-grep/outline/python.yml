id: python-export-list
language: pythonlang
role: item
symbolType: variable
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
rule: {kind: expression_statement, pattern: $DECLARATION, inside: {kind: module}, has: {matches: exports}}
rewriters:
    - id: comment
      rule: {kind: comment}
      fix: ''
transform:
    BARE: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    SIGNATURE: {replace: {source: $BARE, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: __all__
signature: $SIGNATURE
isExported: false
---
id: python-constant
language: pythonlang
role: item
symbolType: constant
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
    listed: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}}
    unlisted: {not: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports}}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    capitals: {regex: '^_*\p{Lu}[\p{Lu}\p{Nd}_]*$'}
    unpacked: {kind: 'pattern_list, tuple_pattern, list_pattern, list_splat_pattern'}
rule:
    kind: 'assignment, identifier'
    any:
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME}
            - not: {has: {field: right, kind: assignment}}
            - any: [{has: {field: left, matches: capitals}}, {has: {field: type, has: {stopBy: end, pattern: Final}}}]
            - any: [{has: {field: type, pattern: $TYPE}}, {pattern: $_}]
        - kind: identifier
          pattern: $NAME
          inside:
            any:
                - {kind: assignment, all: [{has: {field: right, kind: assignment}}, {has: {field: left, pattern: $NAME}}]}
                - {matches: unpacked, any: [{inside: {kind: assignment, field: left}}, {inside: {matches: unpacked, stopBy: {not: {matches: unpacked}}, inside: {kind: assignment, field: left}}}]}
          matches: capitals
rewriters:
    - id: comment
      rule: {kind: comment}
      fix: ''
transform:
    BARE: {rewrite: {source: $TYPE, rewriters: [comment]}}
    TYPED: {replace: {source: $BARE, replace: '^(.)', by: ': $1'}}
    ANNOTATION: {replace: {source: $TYPED, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $NAME$ANNOTATION
isExported:
    any:
        - all: [{not: {any: [{kind: identifier, matches: private}, {has: {field: left, matches: private}}]}}, {matches: unlisted}]
        - matches: listed
---
id: python-variable
language: pythonlang
role: item
symbolType: variable
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
    listed: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}}
    unlisted: {not: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports}}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    unpacked: {kind: 'pattern_list, tuple_pattern, list_pattern, list_splat_pattern'}
rule:
    kind: 'assignment, named_expression, identifier'
    any:
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME}
            - not: {has: {field: right, kind: assignment}}
            - any: [{has: {field: type, pattern: $TYPE}}, {pattern: $_}]
        - kind: named_expression
          has: {field: name, pattern: $NAME}
          not: {inside: {kind: lambda, stopBy: end}}
        - kind: identifier
          pattern: $NAME
          not: {pattern: _}
          inside:
            any:
                - {kind: assignment, all: [{has: {field: right, kind: assignment}}, {has: {field: left, pattern: $NAME}}]}
                - {kind: for_statement, has: {field: left, pattern: $NAME}}
                - {matches: unpacked, any: [{inside: {kind: 'assignment, for_statement', field: left}}, {inside: {matches: unpacked, stopBy: {not: {matches: unpacked}}, inside: {kind: 'assignment, for_statement', field: left}}}]}
                - {kind: dotted_name, not: {has: {nthChild: 2}}, inside: {kind: 'case_pattern, keyword_pattern'}}
                - {kind: splat_pattern}
                - {kind: as_pattern, inside: {kind: case_pattern}}
                - {kind: as_pattern_target, inside: {kind: as_pattern, inside: {kind: with_item}}}
                - {kind: 'tuple, list, parenthesized_expression, list_splat', inside: {kind: as_pattern_target, stopBy: {not: {kind: 'as_pattern_target, tuple, list, parenthesized_expression, list_splat'}}, inside: {kind: as_pattern, inside: {kind: with_item}}}}
rewriters:
    - id: comment
      rule: {kind: comment}
      fix: ''
transform:
    BARE: {rewrite: {source: $TYPE, rewriters: [comment]}}
    TYPED: {replace: {source: $BARE, replace: '^(.)', by: ': $1'}}
    ANNOTATION: {replace: {source: $TYPED, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $NAME$ANNOTATION
isExported:
    any:
        - all: [{not: {any: [{kind: identifier, matches: private}, {has: {field: left, matches: private}}, {has: {field: name, matches: private}}]}}, {matches: unlisted}]
        - matches: listed
---
id: python-member-enum-member
language: pythonlang
role: member
symbolType: enumMember
parentRuleIds: [python-class, python-interface, python-enum, python-function]
utils:
    base: {any: [{pattern: Enum}, {pattern: IntEnum}, {pattern: StrEnum}, {pattern: ReprEnum}, {pattern: Flag}, {pattern: IntFlag}]}
    metaclass: {any: [{pattern: EnumType}, {pattern: EnumMeta}]}
    enumeration:
        kind: class_definition
        has:
            field: superclasses
            has:
                any:
                    - matches: base
                    - {kind: attribute, has: {field: attribute, matches: base}}
                    - {kind: keyword_argument, all: [{has: {field: name, pattern: metaclass}}, {has: {field: value, any: [{matches: metaclass}, {kind: attribute, has: {field: attribute, matches: metaclass}}]}}]}
    scope: {inside: {kind: class_definition, stopBy: {kind: 'class_definition, function_definition'}, matches: enumeration, any: [{all: [{inside: {kind: 'class_definition, function_definition', stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    hidden: {inside: {kind: 'class_definition, function_definition', stopBy: end, has: {field: name, matches: private}}}
    sunder: {regex: '^_(?:_|.*_$)'}
    unpacked: {kind: 'pattern_list, tuple_pattern, list_pattern, list_splat_pattern'}
rule:
    kind: 'assignment, identifier'
    any:
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME, not: {matches: sunder}}
            - has: {field: right, not: {kind: assignment}}
            - matches: scope
        - kind: identifier
          pattern: $NAME
          inside:
            any:
                - {kind: assignment, all: [{has: {field: right, kind: assignment}}, {has: {field: left, pattern: $NAME}}]}
                - {matches: unpacked, any: [{inside: {kind: assignment, field: left}}, {inside: {matches: unpacked, stopBy: {not: {matches: unpacked}}, inside: {kind: assignment, field: left}}}]}
          not: {matches: sunder}
          matches: scope
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
name: $QUALIFIER$NAME
isPublic: {not: {any: [{kind: identifier, matches: private}, {has: {field: left, matches: private}}, {matches: hidden}]}}
---
id: python-member-constructor
language: pythonlang
role: member
symbolType: constructor
parentRuleIds: [python-class, python-interface, python-enum, python-function]
utils:
    scope: {inside: {kind: class_definition, stopBy: {kind: 'class_definition, function_definition'}, any: [{all: [{inside: {kind: 'class_definition, function_definition', stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    hidden: {inside: {kind: 'class_definition, function_definition', stopBy: end, has: {field: name, matches: private}}}
rule:
    kind: parameters
    inside:
        kind: function_definition
        field: parameters
        has: {field: name, pattern: $NAME, any: [{pattern: __init__}, {pattern: __new__}, {pattern: __post_init__}]}
        any: [{inside: {kind: decorated_definition, pattern: $DECLARATION}}, {pattern: $DECLARATION}]
        matches: scope
rewriters:
    - id: body
      rule: {kind: block, inside: {kind: function_definition, field: body}}
      fix: {template: '', expandStart: {not: {kind: comment}, stopBy: end}}
    - id: comment
      rule: {kind: comment, not: {inside: {kind: 'class_definition, function_definition'}}}
      fix: ''
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, comment]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $QUALIFIER$NAME
signature: '$SIGNATURE:'
isPublic: {not: {matches: hidden}}
---
id: python-member-property
language: pythonlang
role: member
symbolType: property
parentRuleIds: [python-class, python-interface, python-enum, python-function]
utils:
    scope: {inside: {kind: class_definition, stopBy: {kind: 'class_definition, function_definition'}, any: [{all: [{inside: {kind: 'class_definition, function_definition', stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    hidden: {inside: {kind: 'class_definition, function_definition', stopBy: end, has: {field: name, matches: private}}}
    descriptor: {any: [{pattern: property}, {pattern: cached_property}]}
    accessor: {any: [{matches: descriptor}, {pattern: getter}, {pattern: setter}, {pattern: deleter}]}
rule:
    kind: parameters
    inside:
        kind: function_definition
        field: parameters
        has: {field: name, pattern: $NAME}
        inside:
            kind: decorated_definition
            pattern: $DECLARATION
            has: {kind: decorator, has: {any: [{matches: descriptor}, {kind: attribute, has: {field: attribute, matches: accessor}}]}}
        matches: scope
rewriters:
    - id: body
      rule: {kind: block, inside: {kind: function_definition, field: body}}
      fix: {template: '', expandStart: {not: {kind: comment}, stopBy: end}}
    - id: comment
      rule: {kind: comment, not: {inside: {kind: 'class_definition, function_definition'}}}
      fix: ''
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, comment]}}
