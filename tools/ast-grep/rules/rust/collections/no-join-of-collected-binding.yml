# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-join-of-collected-binding
language: rust
severity: error
utils:
    vec-collect:
        kind: let_declaration
        pattern: $COLLECT
        all:
            - has: {field: pattern, kind: identifier, pattern: $V}
            - any:
                - all:
                    - has: {field: type, kind: generic_type, has: {field: type, regex: '^((std::)?vec::)?Vec$'}}
                    - has: {field: value, kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^collect$'}}}
                - has: {field: value, kind: call_expression, has: {field: function, kind: generic_function, all: [{has: {field: function, kind: field_expression, has: {field: field, regex: '^collect$'}}}, {has: {field: type_arguments, regex: '^<\s*((std::)?vec::)?Vec\b'}}]}}
    join-receiver:
        inside: {kind: field_expression, field: value, has: {field: field, regex: '^join$'}}
rule:
    kind: call_expression
    pattern: $JOIN
    all:
        - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^join$'}}, {has: {field: value, kind: identifier, pattern: $V}}]}
        - has: {field: arguments, has: {nthChild: 1, not: {regex: '^""$'}}, not: {has: {nthChild: 2}}}
        - inside:
            kind: block
            stopBy: {kind: 'function_item, closure_expression'}
            all:
                - has: {matches: vec-collect}
                - not: {has: {stopBy: end, kind: identifier, pattern: $V, not: {any: [{inside: {kind: let_declaration, field: pattern}}, {matches: join-receiver}]}}}
labels:
    JOIN: {style: primary, message: 'Joins collected items'}
    COLLECT: {style: secondary, message: 'Collects items only for the join'}
message: '`$V` collects items into a `Vec` that only `$JOIN` reads'
note: 'Call `.join(<separator>)` on the iterator filling `<binding>` (`use itertools::Itertools as _;`) and delete `<binding>`'
