# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-infallible-result
language: swift
severity: error
utils:
    boundary: {kind: 'function_declaration, lambda_literal, property_declaration'}
    result-type:
        kind: user_type
        pattern: {context: 'func f() -> Result<$T, $E> {}', selector: user_type}
    failure-reference:
        any:
            - {kind: prefix_expression, regex: '^\.failure$'}
            - {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^failure$'}}}
rule:
    kind: 'function_declaration, property_declaration'
    pattern: $DECLARATION
    all:
        - any:
            - kind: function_declaration
              all:
                - has: {field: name, kind: simple_identifier, pattern: $NAME}
                - has: {matches: result-type}
            - kind: property_declaration
              all:
                - has: {field: name, has: {field: bound_identifier, pattern: $NAME}}
                - has: {kind: type_annotation, has: {field: name, matches: result-type}}
                - has: {field: computed_value, kind: computed_property, not: {has: {kind: computed_setter}}}
        - has: {stopBy: {matches: boundary}, matches: swift-success-call}
        - not: {has: {stopBy: {matches: boundary}, matches: failure-reference}}
        - not: {has: {stopBy: {matches: boundary}, kind: try_expression}}
        - not: {has: {stopBy: {matches: boundary}, kind: control_transfer_statement, has: {regex: '^return$'}, not: {has: {field: result, matches: swift-result-construction}}}}
        - any:
            - has: {stopBy: {matches: boundary}, kind: statements, inside: {kind: 'function_body, computed_property, computed_getter'}, matches: {swift-single-statement: {first: {matches: swift-result-construction}}}}
            - has: {stopBy: {matches: boundary}, kind: control_transfer_statement, has: {field: result, matches: swift-result-construction}}
rewriters:
    - id: return-type
      rule:
        matches: result-type
        any:
            - inside: {pattern: $DECLARATION}
            - inside: {kind: type_annotation, inside: {pattern: $DECLARATION}}
      fix: $T
    - id: unwrap-success
      rule:
        matches: swift-success-call
        inside: {stopBy: {matches: boundary}, pattern: $DECLARATION}
        has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, pattern: $V}}}}
      fix: $V
transform:
    UNWRAPPED: {rewrite: {source: $DECLARATION, rewriters: [return-type, unwrap-success]}}
fix: $UNWRAPPED
message: '`$NAME` constructs `.success` alone and returns `Result<$T, $E>` in place of `$T`'
note: 'Return the success type and unwrapped value, callers composing it into a Result chain call `.map`'
