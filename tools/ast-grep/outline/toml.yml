    NAME: {replace: {source: $PATH, replace: '\.$', by: ''}}
    CLOSED: {replace: {source: $EMPTY, replace: '[\t\n\r ]+', by: ''}}
    SHAPE: {replace: {source: $CLOSED, replace: '^$', by: '[…]'}}
    PATH: {rewrite: {source: $KEY, rewriters: [lineage], joinBy: ''}}
name: $BARE$NAME
signature: $BARE$NAME = $SHAPE
