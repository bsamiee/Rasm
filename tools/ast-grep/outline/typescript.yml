id: typescript-schema
language: tsxlang
role: item
symbolType: constant
utils:
    schema-root-binding:
        any:
            - kind: identifier, undefined, shorthand_property_identifier_pattern
              pattern: $OUTLINE_SCHEMA_ROOT
            - kind: object_pattern, array_pattern, rest_pattern
              has: {matches: schema-root-binding}
            - kind: assignment_pattern, object_assignment_pattern
              has: {field: left, matches: schema-root-binding}
            - kind: pair_pattern
              has: {field: value, matches: schema-root-binding}
    schema-namespace-root:
        any:
            - kind: identifier
