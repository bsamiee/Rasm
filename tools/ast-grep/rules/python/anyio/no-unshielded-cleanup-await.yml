# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unshielded-cleanup-await
language: python
severity: error
utils:
    shield-call:
        kind: call
        has:
            field: arguments
            has:
                kind: keyword_argument
                all:
                    - has: {field: name, regex: '^shield$'}
                    - has: {field: value, regex: '^True$'}
    shield-name:
        kind: identifier
        matches: {python-assigned-name: {value: {matches: shield-call}}}
    shielded-scope:
        kind: with_statement
        has:
            kind: with_clause
            has:
                kind: with_item
                has:
                    field: value
                    any:
                        - matches: shield-call
                        - matches: shield-name
                        - kind: as_pattern
                          has: {matches: shield-call}
    anyio-import:
        matches: {python-module-import: {module: {regex: '^anyio$'}, binding: {pattern: $ANYIO}}}
    anyio-shadowed:
        inside:
            kind: module, function_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
            stopBy: end
            has:
                stopBy: {kind: 'function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
                matches: {python-binding: {name: {pattern: $ANYIO}}}
    exit-body:
        inside:
            kind: function_definition
            all:
                - has: {field: name, regex: '^__aexit__$'}
                - has: {regex: '^async$'}
    cancel-handler:
        kind: except_clause
        any:
            - not: {has: {field: value, pattern: $_}}
            - has: {field: value, regex: '(^|\W)(BaseException|CancelledError|Cancelled|get_cancelled_exc_class\(\))(\W|$)'}
rule:
    kind: block
    pattern: $BODY
    all:
        - any:
            - inside:
                any:
                    - kind: finally_clause
                    - matches: cancel-handler
            - matches: exit-body
        - has:
            stopBy: {any: [{matches: python-function-boundary}, {matches: shielded-scope}]}
            any:
                - kind: await
                - kind: with_statement
                  has: {regex: '^async$'}
                - kind: for_statement
                  has: {regex: '^async$'}
        - not: {inside: {matches: shielded-scope, stopBy: {matches: python-function-boundary}}}
        - any:
            - all:
                - pattern: $SHIELDED
                - inside: {kind: module, stopBy: end, has: {matches: anyio-import}}
                - not: {matches: anyio-shadowed}
            - pattern: $UNSHIELDED
rewriters:
    - id: shield
      rule: {kind: block, pattern: $BLOCK}
      fix: |-
        with $ANYIO.CancelScope(shield=True):
            $BLOCK
transform:
    OUT: rewrite($SHIELDED, rewriters=[shield])
fix: $OUT$UNSHIELDED
message: 'Cleanup await raises under the cancellation the block handles'
note: 'Wrap the cleanup in `with anyio.CancelScope(shield=True):`'
