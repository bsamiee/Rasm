# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-dependency-graph"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords             = ["graph", "dag", "dependency", "evaluation"]
categories           = ["data-structures", "algorithms"]
description          = "Acyclic evaluation graph: dependency order, propagation, cycles, tearing, and critical paths"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive-where         = { workspace = true }
derive_more          = { workspace = true }
enum-map             = { workspace = true }
itertools            = { workspace = true }
num-traits           = { workspace = true }
petgraph             = { workspace = true }
rustworkx-core       = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
