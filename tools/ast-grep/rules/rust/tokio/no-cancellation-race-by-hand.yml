# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-cancellation-race-by-hand
language: rust
severity: error
rule:
    matches: rust-two-arm-select
    has:
        kind: token_tree
        has:
            kind: identifier
            regex: '^cancelled(_owned)?$'
            pattern: $CANCELLED
            follows: {regex: '^\.$'}
            precedes: {kind: token_tree, regex: '^\(\s*\)$', precedes: {stopBy: {not: {kind: 'line_comment, block_comment'}}, regex: '^=>$'}}
message: '`select!` races one future against a `$CANCELLED()` arm by hand'
note: 'Await `<token>.run_until_cancelled(<future>)` (`None` on cancellation, future dropped), an rmcp handler reads its token from `RequestContext::ct`'
