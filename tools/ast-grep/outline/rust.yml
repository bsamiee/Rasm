id: rust-member-impl
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait]
symbolType: object
variants: [impl]
rule:
    any:
        - kind: impl_item
          all: [{matches: declared}, {not: {matches: holding}}, {matches: enclosing}, {any: [{has: {regex: '^!$', not: {kind: never_type}, pattern: $$NEGATION}}, {kind: impl_item}]}, {any: [{has: {field: trait, matches: implemented}}, {kind: impl_item}]}, {has: {field: type, matches: target}}, {matches: declaration}]
        - kind: 'abstract_type, array_type, bounded_type, dynamic_type, function_type, generic_type, higher_ranked_trait_bound, macro_invocation, metavariable, never_type, pointer_type, primitive_type, reference_type, removed_trait_bound, scoped_type_identifier, tuple_type, type_identifier, unit_type, unsafe_binder_type'
          all: [{inside: {kind: impl_item, field: type, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {any: [{has: {regex: '^!$', not: {kind: never_type}, pattern: $$NEGATION}}, {kind: impl_item}]}, {any: [{has: {field: trait, matches: implemented}}, {kind: impl_item}]}, {matches: declaration}]}}, {matches: target}]
    matches: attributed
name: $QUALIFIER$OPEN$NAME$FOR$NEGATION$TRAIT$CLOSE
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{any: [{has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}, {inside: {kind: impl_item, field: type, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}}]}, {matches: exposed}]}
