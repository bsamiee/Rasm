id: csharp-member-method
language: csharplang
role: member
symbolType: method
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-enum]
utils:
    enclosing: {kind: 'class_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    public:
        any:
            - has: {kind: modifier, regex: '^(?:public|protected)$'}
              not: {has: {kind: modifier, regex: '^private$'}}
            - inside: {stopBy: {matches: enclosing}, kind: interface_declaration}
              not: {has: {kind: modifier, regex: '^(?:private|internal)$'}}
rule:
    kind: method_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    any:
        - inside: {stopBy: end, kind: extension_declaration, pattern: $EXTENDED}
        - inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: $OWNER}, inside: {stopBy: end, matches: enclosing}}
        - not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}}}
rewriters:
    - id: body
      rule: {kind: 'block, arrow_expression_clause', inside: {kind: method_declaration, field: body}}
      fix: ''
    - id: extended
      rule: {kind: extension_body, inside: {kind: extension_declaration}}
      fix: "\n"
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: .}}
    EXTENDED_HEADER: rewrite($EXTENDED, rewriters=[extended, trivia])
    EXTENDED_LINES: {replace: {source: $EXTENDED_HEADER, replace: '[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    EXTENDED_TRIMMED: {replace: {source: $EXTENDED_LINES, replace: '([(\[<.])\n|\n([)\]>.,;])', by: '$1$2'}}
    EXTENSION: {replace: {source: $EXTENDED_TRIMMED, replace: '\n', by: ' '}}
    HEADER: rewrite($DECLARATION, rewriters=[body, trivia])
    NEWLINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    TRIMMED: {replace: {source: $NEWLINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
name: $QUALIFIER$NAME
signature: $EXTENSION$SIGNATURE
isPublic:
    all:
        - matches: public
        - not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}, not: {matches: public}}}
---
id: csharp-member-property
language: csharplang
role: member
symbolType: property
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-enum]
utils:
    enclosing: {kind: 'class_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    public:
        any:
            - has: {kind: modifier, regex: '^(?:public|protected)$'}
              not: {has: {kind: modifier, regex: '^private$'}}
            - inside: {stopBy: {matches: enclosing}, kind: interface_declaration}
              not: {has: {kind: modifier, regex: '^(?:private|internal)$'}}
rule:
    any:
        - kind: property_declaration
          has: {field: name, pattern: $NAME}
        - kind: indexer_declaration
          has: {field: parameters, pattern: $PARAMETERS}
        - kind: parameter
          has: {field: name, pattern: $NAME}
          inside: {kind: parameter_list, inside: {kind: record_declaration}}
    pattern: $DECLARATION
    all:
        - any:
            - inside: {stopBy: end, kind: extension_declaration, pattern: $EXTENDED}
            - inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: $OWNER}, inside: {stopBy: end, matches: enclosing}}
            - not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}}}
rewriters:
    - id: value
      rule: {pattern: $$VALUE, inside: {kind: 'property_declaration, indexer_declaration, parameter', field: value}}
      fix: {template: '', expandStart: {regex: '^=$'}}
    - id: accessor
      rule: {kind: 'block, arrow_expression_clause', inside: {kind: accessor_declaration, field: body, has: {field: name, pattern: $$KEY}}}
      fix: {template: '$KEY;', expandStart: {regex: ^}, expandEnd: {regex: '^;$'}}
    - id: extended
      rule: {kind: extension_body, inside: {kind: extension_declaration}}
      fix: "\n"
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: .}}
