id: python-enum
language: pythonlang
role: item
symbolType: enum
utils:
    exports: {kind: expression_statement, has: {kind: 'assignment, augmented_assignment, call', any: [{has: {field: left, pattern: __all__}}, {has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, regex: '^(?:extend|append)$'}}]}}]}}
    declared: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports}}}
    listed: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    checked: {any: [{inside: {kind: block, stopBy: {kind: block}, any: [{inside: {kind: 'if_statement, elif_clause', field: consequence, all: [{has: {regex: '^(?:el)?if$', pattern: $$CLAUSE}}, {has: {field: condition, pattern: $GUARD}}]}}, {inside: {kind: else_clause, field: body, has: {regex: '^else$', pattern: $$CLAUSE}}}]}}, {not: {kind: ERROR}}]}
    hidden-name: {any: [{has: {field: name, matches: private}}, {has: {field: definition, has: {field: name, matches: private}}}, {has: {field: left, matches: private}}]}
    dotted: {any: [{kind: identifier}, {kind: attribute, not: {has: {stopBy: end, pattern: $_, not: {kind: 'identifier, attribute'}}}}]}
    scalar: {any: [{kind: 'integer, float, true, false, none, ellipsis'}, {kind: 'string, concatenated_string', not: {has: {stopBy: end, kind: interpolation}}}, {kind: unary_operator, has: {field: argument, kind: 'integer, float'}}, {kind: 'list_splat, dictionary_splat', has: {matches: dotted}}]}
    literal: {any: [{matches: dotted}, {matches: scalar}, {kind: 'list, tuple, set', not: {has: {pattern: $_, not: {matches: dotted}}}}]}
    base: {regex: '^(?:Enum|IntEnum|StrEnum|ReprEnum|Flag|IntFlag)$'}
    metaclass: {regex: '^(?:EnumType|EnumMeta)$'}
    enumeration: {kind: class_definition, has: {field: superclasses, has: {any: [{kind: identifier, matches: base}, {kind: attribute, has: {field: attribute, matches: base}}, {kind: keyword_argument, all: [{has: {field: name, pattern: metaclass}}, {has: {field: value, any: [{kind: identifier, matches: metaclass}, {kind: attribute, has: {field: attribute, matches: metaclass}}]}}]}]}}}
    functional: {kind: call, has: {field: function, any: [{kind: identifier, matches: base}, {kind: attribute, has: {field: attribute, matches: base}}]}}
rule:
    all:
        - any:
              - {kind: class_definition, all: [{matches: enumeration}, {has: {field: name, pattern: $NAME}}]}
              - {kind: decorated_definition, has: {field: definition, kind: class_definition, all: [{matches: enumeration}, {has: {field: name, pattern: $NAME}}]}}
              - {kind: assignment, all: [{has: {field: right, matches: functional}}, {not: {has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}}, {has: {field: left, kind: identifier, pattern: $NAME}}]}
        - matches: checked
rewriters:
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: tool, rule: {kind: decorator, regex: '^@(?:(?:typing|typing_extensions)\.)?(?:type_check_only|no_type_check|disjoint_base)$'}, fix: ''}
    - {id: argument, rule: {any: [{inside: {kind: argument_list}, all: [{pattern: $_}, {not: {kind: 'keyword_argument, comment'}}, {not: {matches: literal}}]}, {inside: {kind: keyword_argument, field: value}, not: {matches: literal}}]}, fix: '…'}
    - {id: decorator, rule: {kind: decorator, has: {kind: call, all: [{has: {field: function, pattern: $CALLEE}}, {has: {field: arguments, pattern: $ARGUMENTS}}]}}, transform: {OPTIONS: {rewrite: {source: $ARGUMENTS, rewriters: [comment, argument]}}}, fix: '@$CALLEE$OPTIONS'}
    - id: decorators
      rule: {kind: decorator, pattern: $DECORATOR, any: [{precedes: {stopBy: {not: {kind: comment}}, kind: decorator, pattern: $NEXT}}, {kind: decorator}]}
      transform:
          ONE: {rewrite: {source: $DECORATOR, rewriters: [tool, decorator, comment]}}
          REST: {rewrite: {source: $NEXT, rewriters: [decorators], joinBy: ''}}
      fix: '$ONE $REST'
    - id: header
      rule:
          kind: type_identifier
          inside:
              kind: class_definition
              field: name
              all:
                  - any: [{has: {field: type_parameters, pattern: $TYPES}}, {kind: class_definition}]
                  - any: [{has: {field: superclasses, pattern: $SUPERS}}, {kind: class_definition}]
                  - any: [{inside: {kind: decorated_definition, has: {kind: decorator, nthChild: 1, pattern: $FIRST}}}, {kind: class_definition}]
      transform:
          DECORATED: {rewrite: {source: $FIRST, rewriters: [decorators], joinBy: ''}}
          GENERIC: {rewrite: {source: $TYPES, rewriters: [comment]}}
          BASES: {rewrite: {source: $SUPERS, rewriters: [comment]}}
      fix: '$CLAUSE $GUARD: $DECORATEDclass $NAME$GENERIC$BASES:'
    - {id: assigned, rule: {kind: identifier, inside: {kind: assignment, field: left, pattern: $ASSIGNMENT}}, transform: {TEXT: {rewrite: {source: $ASSIGNMENT, rewriters: [comment]}}}, fix: '$CLAUSE $GUARD: $TEXT'}
transform:
    HEADER: {rewrite: {source: $NAME, rewriters: [header, assigned]}}
    LINE: {replace: {source: $HEADER, replace: '\\?[\t-\r \x{200B}\x{2060}\x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ',? ([)\]}])|([(\[{]) |^(?: :)? +|^(else) (:)| -> (:)$| +$', by: $1$2$3$4$5}}
name: $NAME
signature: $SIGNATURE
isExported: {any: [{all: [{not: {matches: hidden-name}}, {not: {matches: declared}}]}, {matches: listed}]}
