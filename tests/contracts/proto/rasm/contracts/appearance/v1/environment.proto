syntax = "proto3";

package rasm.contracts.appearance.v1;

import "buf/validate/validate.proto";
import "rasm/contracts/appearance/v1/appearance.proto";

// One environment product with every fact required to select and admit its decoder.
message EnvironmentPlane {
  option (buf.validate.message).cel = {
    id: "environment_plane.depth"
    message: "depth agrees with the plane format"
    expression: "(this.depth == 1 && this.format in [1, 5, 9]) || (this.depth == 2 && this.format in [2, 6, 10]) || (this.depth == 3 && this.format in [3, 7, 11]) || (this.depth == 4 && this.format in [4, 8, 12])"
  };
  option (buf.validate.message).cel = {
    id: "environment_plane.container"
    message: "non-ktx products carry no ktx payload and one stored level"
    expression: "this.container == 9 || (this.ktx_payload == 5 && this.mips == uint(1))"
  };
  option (buf.validate.message).cel = {
    id: "environment_plane.layers"
    message: "plain and cube products carry their exact structural layer count"
    expression: "(this.layer_law == 1 && this.layers == uint(1)) || (this.layer_law == 2 && this.layers == uint(6)) || this.layer_law in [3, 4, 5]"
  };

  PlaneRef plane = 1 [(buf.validate.field).required = true];
  Container container = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  PlaneFormat format = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Transfer transfer = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Primaries primaries = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Depth depth = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 channels = 7 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4
  }];
  uint32 width = 8 [(buf.validate.field).uint32.gte = 1];
  uint32 height = 9 [(buf.validate.field).uint32.gte = 1];
  uint32 layers = 10 [(buf.validate.field).uint32.gte = 1];
  LayerLaw layer_law = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 mips = 12 [(buf.validate.field).uint32.gte = 1];
  KtxPayload ktx_payload = 13 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AlphaMode alpha_mode = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// The source products shared by a raw HDRI and a complete IBL. The dome basis is +Z; intensity and rotation are
// read-time policy and never enter the product bytes.
message EnvironmentSource {
  repeated double sh9 = 1 [(buf.validate.field).repeated = {
    min_items: 27
    max_items: 27
    items: {
      double: {finite: true}
    }
  }];
  EnvironmentPlane equirect = 2 [(buf.validate.field).required = true];
  EnvironmentPlane cubemap = 3;
  EnvironmentPlane preview = 4;
  double intensity = 5 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  double rotation = 6 [(buf.validate.field).double.finite = true];
}

// A raw environment needs only its admitted equirectangular source.
message Hdri {
  EnvironmentSource source = 1 [(buf.validate.field).required = true];
}

// A complete prefiltered environment carries the cube, roughness ladder, and split-sum table. The guided CDF is
// optional; its absence is a valid unguided product.
message Ibl {
  option (buf.validate.message).cel = {
    id: "ibl.ladder"
    message: "roughness_per_mip has one entry per specular mip"
    expression: "this.roughness_per_mip.size() == this.specular.size()"
  };
  option (buf.validate.message).cel = {
    id: "ibl.cubemap"
    message: "a complete ibl carries a cubemap source"
    expression: "has(this.source.cubemap)"
  };

  EnvironmentSource source = 1 [(buf.validate.field).required = true];
  repeated EnvironmentPlane specular = 2 [(buf.validate.field).repeated.min_items = 1];
  repeated double roughness_per_mip = 3 [(buf.validate.field).repeated.items.double = {
    finite: true
    gte: 0
    lte: 1
  }];
  EnvironmentPlane brdf_lut = 4 [(buf.validate.field).required = true];
  EnvironmentPlane luminance_cdf = 5;
}
