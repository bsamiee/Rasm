id: no-sentinel-arm
valid:
    - |
      const changed = found === undefined ? undefined : { command: spliced, context: `Ran ${text}` };
    - |
      const facts = { prompt: decode(isNotice)(promptRow)?.text ?? '', cwd };
    - |
      const line = hit.replacement === undefined ? '' : `, fix: ${hit.file}`;
    - |
      const result = { type: 'create', filePath: path, content: text, structuredPatch: [], originalFile: null };
    - |
      const answered = ok ? { result: recordResult(x, out) } : { isError: true, result: err, text: err };
    - |
      const row = { session: input.session, proof: '', ts: input.now }; const done = () => ({ proof: 'done' });
    - |
      const item = (a: string): Item => { if (a === '') { return { name: '', size: 0 }; } return { name: a, size: a.length }; };
    - |
      const changed = (found: Word | undefined): Rewritten | undefined => { if (found === undefined) { return undefined; } return { command, context: 'Ran it' }; };
    - |
      const outer = (): Row => { const inner = (): Row => ({ command, context: 'Ran it' }); return { command, context: '' }; };
    - |
      const changed = found === undefined ? { command, context: '\n' } : { command, context: 'Ran it' };
    - |
      const changed = found === undefined ? { command, context: `kept as written` } : { command, context: 'Ran it' };
    - |
      const changed = found === undefined ? { command, context: `${line}` } : { command, context: 'Ran it' };
    - |
      const changed = found === undefined ? { command, context: `\n` } : { command, context: 'Ran it' };
invalid:
    - |
      const changed = found === undefined ? { command, context: '' } : { command: spliced, context: `Ran ${text}` };
    - |
      const changed = found === undefined ? { command, context: `` } : { command: spliced, context: 'Ran it' };
    - |
      const changed = found === undefined ? { command, context: null } : { command: spliced, context: 'Ran it' };
    - |
      const changed = (found: Word | undefined): Rewritten => { if (found !== undefined) { return { command: spliced, context: 'Ran it' }; } return { command, context: '' }; };
    - |
      function changed(found: Word | undefined): Rewritten { if (found !== undefined) { return { command: spliced, context: 'Ran it' }; } return { command, context: '' }; }
    - |
      const decoded = (row: unknown): Row => { if (isRow(row)) { return { key: row.key, proof: 'proven' }; } return { key: row.key, proof: null }; };
