# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-arm-nested-let
language: rust
severity: error
utils:
    statement:
        kind: 'expression_statement, let_declaration, empty_statement'
    let-else-branch:
        kind: if_expression
        all:
            - has: {field: condition, kind: let_condition, pattern: $COND}
            - has:
                field: consequence
                kind: block
                any:
                    - all: [{has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, not: {matches: statement}, pattern: $A}}, {not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}}]
                    - pattern: $AB
            - has:
                field: alternative
                kind: else_clause
                has:
                    kind: block
                    any:
                        - all: [{has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, not: {matches: statement}, pattern: $X}}, {not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}}]
                        - pattern: $X
    fallback:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, regex: '^_$'}
            - has: {field: value, pattern: $X}
    arm-binding:
        kind: identifier
        pattern: $BOUND
        inside: {kind: match_arm, stopBy: end, has: {field: pattern, has: {stopBy: end, kind: identifier, pattern: $BOUND, not: {inside: {kind: tuple_struct_pattern, field: type}}}}}
    binding-test:
        kind: if_expression
        all:
            - has: {field: condition, kind: let_condition, has: {field: value, any: [{matches: arm-binding}, {kind: 'unary_expression, reference_expression', has: {matches: arm-binding}}]}}
            - not: {has: {field: consequence, has: {stopBy: end, kind: identifier, pattern: $BOUND}}}
            - not: {has: {field: alternative, has: {stopBy: end, kind: identifier, pattern: $BOUND}}}
rule:
    kind: match_arm
    all:
        - has: {field: pattern, kind: match_pattern, pattern: $P, not: {has: {field: condition, pattern: $_}}}
        - has:
            field: value
            any:
                - matches: let-else-branch
                - kind: block
                  all:
                    - has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, any: [{matches: let-else-branch}, {kind: expression_statement, has: {matches: let-else-branch}}]}
                    - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
        - precedes: {matches: fallback, pattern: $FALLBACK}
        - not: {has: {field: value, any: [{matches: binding-test}, {has: {stopBy: end, matches: binding-test}}]}}
        - not: {matches: rust-else-reads-arm-binding}
transform:
    COMMA: {replace: {source: $A, replace: '^[\s\S]+$', by: ','}}
fix: '$P if $COND => $A$AB$COMMA'
labels:
    P: {style: primary, message: 'Arm nesting the `if let`'}
    FALLBACK: {style: secondary, message: 'Catch-all arm the `else` repeats'}
message: 'Arm `$P` nests `if $COND` with an `else` repeating the catch-all arm'
note: 'Move the `let` into the arm guard, `<pattern> if let <binding> = <value> => <body>`'
