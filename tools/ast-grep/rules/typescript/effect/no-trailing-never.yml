# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-trailing-never
language: tsx
severity: error
utils:
    never:
        any:
            - matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^never$'}}}
            - matches: endless-sleep
    endless-sleep:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^sleep$'}}}}
            - has:
                field: arguments
                has:
                    nthChild: 1
                    any:
                        - regex: '^(Infinity|[''"`]Infinity[''"`])$'
                        - kind: member_expression
                          all:
                            - has: {field: property, regex: '^infinity$'}
                            - has: {field: object, matches: {effect-module: {name: {regex: '\bDuration$'}}}}
    finalizer:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(ensuring|onExit|onInterrupt)$'}}}}
            - has: {field: arguments, not: {has: {nthChild: 2}}}
    last-statement:
        nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}
        inside: {kind: statement_block, inside: {kind: generator_function, field: body}}
rule:
    pattern: $NEVER
    any:
        - kind: yield_expression
          all:
            - regex: '^yield\s*\*'
            - any:
                - all: [{has: {matches: never}}, {inside: {kind: 'return_statement, expression_statement', matches: last-statement}}]
                - all: [{has: {matches: endless-sleep}}, {inside: {kind: expression_statement, matches: last-statement}}]
        - kind: call_expression
          all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(andThen|flatMap)$'}}}}
            - has:
                field: arguments
                has:
                    nthChild: {position: 1, reverse: true}
                    any:
                        - matches: never
                        - kind: arrow_function
                          all:
                            - not: {has: {field: parameters, has: {pattern: $_}}}
                            - has: {field: body, matches: never}
        - kind: call_expression
          all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(ensuring|onExit|onInterrupt)$'}}}}
            - has: {field: arguments, has: {nthChild: 1, matches: never}}
        - kind: call_expression
          any:
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: never}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: finalizer}}
            - all:
                - has: {field: function, matches: effect-pipe-function}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: never}}, {has: {nthChild: 2, matches: finalizer}}]}
            - all:
                - has: {field: function, matches: finalizer}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: never}}, {not: {has: {nthChild: 2}}}]}
        - kind: call_expression
          all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^forever$'}}}}
            - has:
                field: arguments
                all:
                    - not: {has: {nthChild: 2}}
                    - has:
                        nthChild: 1
                        kind: call_expression
                        has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^sleep$'}}}}
message: '`$NEVER` holds the program open after its last step'
note: 'Remove the wait, register cleanup through `Effect.acquireRelease` in the scope holding the program, and run a program as `Layer.launch(Layer.effectDiscard(<program>))`'
