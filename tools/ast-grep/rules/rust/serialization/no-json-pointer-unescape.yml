# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-pointer-unescape
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $ESCAPE
    matches: rust-json-pointer-escape
message: '`$ESCAPE` escapes or unescapes JSON Pointer tokens by hand'
note: 'Parse the pointer once with `jsonptr::PointerBuf::parse(<text>)` and read `Pointer::tokens` with `Token::decoded`, or build one with `PointerBuf::push_back(<token>)`, jsonptr applies the `~0` and `~1` escapes in the order RFC 6901 fixes'
