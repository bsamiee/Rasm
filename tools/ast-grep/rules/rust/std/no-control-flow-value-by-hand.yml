# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-control-flow-value-by-hand
language: rust
severity: error
utils:
    break-binding:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Break$'}
            - has: {nthChild: 2, kind: identifier, pattern: $VALUE}
            - not: {has: {nthChild: 3}}
    continue-binding:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Continue$'}
            - has: {nthChild: 2, kind: identifier, pattern: $VALUE}
            - not: {has: {nthChild: 3}}
    returning-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, all: [{not: {has: {field: condition, pattern: $_}}}, {has: {any: [{matches: break-binding}, {matches: continue-binding}]}}]}
            - has: {field: value, kind: identifier, pattern: $VALUE}
    other-arm:
        kind: match_arm
        all:
            - has:
                field: pattern
                kind: match_pattern
                all:
                    - not: {has: {field: condition, pattern: $_}}
                    - has: {kind: tuple_struct_pattern, all: [{has: {nthChild: 2, kind: identifier, pattern: $OTHER}}, {not: {has: {nthChild: 3}}}]}
            - has:
                field: value
                any:
                    - {kind: identifier, pattern: $OTHER}
                    - kind: call_expression
                      all:
                        - has: {field: function, kind: 'identifier, scoped_identifier'}
                        - has: {field: arguments, all: [{has: {nthChild: 1, kind: identifier, pattern: $OTHER}}, {not: {has: {nthChild: 2}}}]}
rule:
    any:
        - kind: or_pattern
          all:
            - not: {has: {nthChild: 3}}
            - any:
                - all: [{has: {nthChild: 1, matches: break-binding}}, {has: {nthChild: 2, matches: continue-binding}}]
                - all: [{has: {nthChild: 1, matches: continue-binding}}, {has: {nthChild: 2, matches: break-binding}}]
        - kind: match_block
          all:
            - not: {has: {nthChild: 3}}
            - has:
                matches: returning-arm
                any:
                    - precedes: {stopBy: end, matches: other-arm}
                    - follows: {stopBy: end, matches: other-arm}
message: '`Break` and `Continue` arms return the value each `ControlFlow` variant holds'
note: 'Call `<control flow>.into_value()` (`#![feature(control_flow_into_value)]`), after `map_continue` or `map_break` wraps one side''s value (`map_continue(Ok)`), through `.map(ControlFlow::into_value)` under a `Result` or `Option`'
