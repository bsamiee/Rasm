# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop
language: tsx
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
        - kind: for_statement, while_statement, do_statement
message: Loop iterates by statement
note: '`Array.map(<list>, <f>)` yields a value per element, `Array.reduce(<list>, <initial>, <f>)` folds elements into one value, `Array.unfold(<state>, <step>)` yields values while a state advances, `Effect.forEach(<list>, <f>)` runs an effect per element, `Effect.whileLoop` an effect per state step, and `<list>.forEach(<f>)` a host effect per element outside the runtime'
labels:
    LOOP: {style: primary}
