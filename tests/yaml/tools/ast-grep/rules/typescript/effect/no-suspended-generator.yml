id: no-suspended-generator
valid:
    - |
      import { Effect } from "effect";
      const a = Effect.suspend(() => compute());
    - |
      import { Effect } from "effect";
      const a = Effect.suspend((): Effect.Effect<number> => Effect.gen(function* () {
          return 1;
      }));
    - |
      import { Effect } from "effect";
      const a = Effect.gen(function* () {
          return 1;
      });
    - |
      import { Effect } from "effect";
      const a = Effect.suspend(() => {
          // rebuilds the counter on each run
          return Effect.gen(function* () {
              return 1;
          });
      });
invalid:
    - |
      import { Effect } from "effect";
      const a = Effect.suspend(() => Effect.gen(function* () {
          return 1;
      }));
    - |
      import { Effect } from "effect";
      const a = Effect.suspend(() => {
          return Effect.gen(function* () {
              return 1;
          });
      });
