# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-record-keyed-by-table
language: tsx
severity: error
utils:
    literal-object:
        any:
            - kind: object
            - matches: syntax-expression-wrapper
              has: {matches: literal-object}
    table-declaration:
        matches: syntax-module-constant
        has: {kind: variable_declarator, has: {field: name, pattern: $TABLE}}
rule:
    kind: generic_type
    all:
        - has: {field: name, regex: '^(\w+\.)?(Readonly)?Record$'}
        - has:
            field: type_arguments
            has:
                nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                kind: index_type_query
                has: {kind: type_query, has: {kind: identifier, pattern: $TABLE}}
        - inside:
            stopBy: {not: {kind: 'generic_type, type_arguments'}}
            any:
                - kind: satisfies_expression
                  all:
                    - has: {matches: literal-object}
                    - inside: {kind: variable_declarator, field: value, stopBy: {not: {kind: parenthesized_expression}}, inside: {matches: syntax-module-constant}}
                - kind: type_annotation
                  inside:
                    kind: variable_declarator
                    all:
                        - has: {field: value, matches: literal-object}
                        - inside: {matches: syntax-module-constant}
        - inside:
            kind: program
            stopBy: end
            has: {any: [{matches: table-declaration}, {kind: export_statement, has: {matches: table-declaration}}]}
message: 'The record repeats the keys of `$TABLE`'
note: Nest the row under a key of the owning table's row and map the one table at the consumer
labels:
    TABLE: {style: primary, message: The table the keys come from}
