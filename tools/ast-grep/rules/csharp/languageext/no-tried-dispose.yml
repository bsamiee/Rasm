# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['apps/roslyn/**']
rule:
    kind: invocation_expression
    all:
        - has: {field: function, regex: 'Run$'}
        - pattern: $RELEASE
        - any:
            - pattern: Try.lift($X.Dispose).Run()
            - pattern: Try.lift(() => $X.Dispose()).Run()
            - pattern: Try.lift(() => { $X.Dispose(); return unit; }).Run()
message: '`$RELEASE` releases `$X` through `Try`'
note: 'Acquire through `use` and release at the owning `Bracket`, `Finally(IO.lift(<release>))` for a release holding no handle'
