syntax = "proto3";

package rasm.contracts.capability.v1;

import "buf/validate/validate.proto";
import "rasm/contracts/capability/v1/descriptor.proto";

enum CostUnit {
  COST_UNIT_UNSPECIFIED = 0;
  COST_UNIT_CPU_MILLIS = 1;
  COST_UNIT_WALL_MILLIS = 2;
  COST_UNIT_BYTES_EGRESS = 3;
  COST_UNIT_MODEL_TOKENS = 4;
  COST_UNIT_CALLS = 5;
}

message CapabilityEstimate {
  CostUnit unit = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int64 amount = 2 [(buf.validate.field).int64.gte = 0];
}

// Presence is the current permitted-availability fact; all static semantics live in the pinned document.
message AvailableCapability {
  option (buf.validate.message).cel = {
    id: "available_capability.estimate_units"
    message: "estimate units must be unique"
    expression: "this.estimates.map(row, row.unit).unique()"
  };

  string descriptor = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  reserved 2, 3, 4, 5;
  reserved "surface", "effect", "idempotency", "scope";
  // Units are unique and the vocabulary is closed, so the estimate roster is bounded by its five defined units.
  repeated CapabilityEstimate estimates = 6 [(buf.validate.field).repeated.max_items = 5];
}

message DiscoverRequest {}

message DiscoverResponse {
  option (buf.validate.message).cel = {
    id: "discover_response.descriptors"
    message: "available descriptors must be unique and bounded by the pin"
    expression:
      "this.capabilities.map(row, row.descriptor).unique() && "
      "uint(this.capabilities.size()) <= this.pin.descriptors"
  };

  DescriptorPinWire pin = 1 [(buf.validate.field).required = true];
  repeated AvailableCapability capabilities = 2 [(buf.validate.field).repeated.max_items = 65536];
}

service CapabilityDiscoveryService {
  rpc Discover(DiscoverRequest) returns (DiscoverResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
