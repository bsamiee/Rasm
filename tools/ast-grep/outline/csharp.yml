    - id: parameters
      rule: {kind: parameter_list, inside: {kind: 'class_declaration, record_declaration, struct_declaration, delegate_declaration'}, pattern: {context: 'record R($$$PARAMETERS);', selector: parameter_list}}
      transform: {KEPT: {rewrite: {source: $$$PARAMETERS, rewriters: [default, tool-list, tool, attributed, branch, broken, trivia]}}}
