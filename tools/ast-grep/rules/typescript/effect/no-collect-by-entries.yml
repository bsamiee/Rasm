# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-collect-by-entries
language: tsx
severity: error
utils:
    entries:
        kind: call_expression
        has: {field: function, pattern: $ENTRIES, matches: typescript-record-entries}
    indexed-callback:
        kind: arrow_function, function_expression
        has: {field: parameters, has: {kind: 'required_parameter, optional_parameter', nthChild: 2}}
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, matches: entries}}, {has: {field: property, regex: '^map$'}}]}
            - has: {field: arguments, has: {nthChild: 1, not: {matches: indexed-callback}}}
        - all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\b(Array|Iterable)$'}, member: {regex: '^map$'}}}}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: entries}}, {has: {nthChild: 2, not: {matches: indexed-callback}}}]}
        - all:
            - has: {field: function, regex: '^((globalThis|window|self)\.)?Array\.from$', matches: typescript-global-reference}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: entries}}, {has: {nthChild: 2, not: {matches: indexed-callback}}}]}
message: '`$ENTRIES` builds key-value pairs to map entries to an array'
note: 'Call `Record.collect(<record>, (<key>, <value>) => <element>)`, `Record.keys` or `Record.values` for keys or values alone, `Record.mapEntries` to build a record'
