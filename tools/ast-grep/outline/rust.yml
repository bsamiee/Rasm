utils:
    public: {kind: visibility_modifier, regex: 'pub', not: {regex: '\('}}
    argument: {pattern: $ARGUMENT}
    owner: {pattern: $OWNER}
    row: {kind: 'associated_type, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, function_signature_item, impl_item, let_declaration, macro_definition, macro_invocation, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}
    enclosing: {any: [{inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item', inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item'}, any: [{has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, matches: owner}}]}}, {matches: row}]}
    up: {pattern: $UP}
    above: {inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item', any: [{has: {field: name, matches: up}}, {kind: impl_item, has: {field: type, matches: up}}]}}
    part: {pattern: $PART}
    missing: {regex: '^$', any: [{kind: 'identifier, type_identifier, field_identifier'}, {pattern: ';'}, {pattern: ')'}, {pattern: '}'}, {pattern: ']'}, {pattern: '>'}, {pattern: ','}]}
    broken: {has: {stopBy: end, any: [{kind: ERROR}, {matches: missing}]}}
    nesting: {has: {stopBy: end, any: [{kind: 'ERROR, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, impl_item, macro_definition, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}, {matches: missing}]}}
    assoc: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}
    implied: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}}
    tool:
        kind: attribute_item
        has:
            kind: attribute
            any:
                - has: {field: path, regex: '^(?:allow|expect|warn|deny|forbid|doc|coverage|(?:clippy|rustfmt|diagnostic)::.+)$'}
                - all: [{has: {field: path, regex: '^cfg_attr$'}}, {has: {field: arguments, not: {has: {kind: identifier, follows: {regex: '^,$'}, not: {regex: '^(?:allow|expect|warn|deny|forbid|doc|coverage|clippy|rustfmt|diagnostic)$'}}}}}]
    attribute: {follows: {stopBy: {not: {kind: 'line_comment, block_comment'}}, kind: attribute_item, pattern: $ATTRIBUTE}}
    attributed: {any: [{matches: attribute}, {kind: 'identifier, metavariable, type_identifier', inside: {field: name, matches: attribute}}, {kind: extern_modifier, inside: {kind: foreign_mod_item, matches: attribute}}, {kind: &types 'abstract_type, array_type, bounded_type, dynamic_type, function_type, generic_type, higher_ranked_trait_bound, macro_invocation, metavariable, never_type, pointer_type, primitive_type, reference_type, removed_trait_bound, scoped_type_identifier, tuple_type, type_identifier, unit_type, unsafe_binder_type', inside: {field: type, kind: impl_item, matches: attribute}}, {matches: row}, {kind: *types}, {kind: 'enum_variant, extern_modifier, field_declaration, identifier'}]}
    declaration: {pattern: $DECLARATION}
    conjoined: {all: [{matches: attributed}, {matches: enclosing}, {matches: declaration}]}
    target: {pattern: $TARGET}
    implemented: {pattern: $IMPLEMENTED}
    declared: {inside: {kind: 'declaration_list, block', not: {inside: {kind: 'impl_item, trait_item'}}}}
    exposed: {not: {inside: {stopBy: end, not: {has: {matches: public}}, any: [{kind: block}, {kind: 'mod_item, trait_item', inside: {kind: 'declaration_list, block'}}]}}}
    visible: {any: [{has: {matches: public}}, {inside: {field: name, has: {kind: visibility_modifier}}}]}
    name: {pattern: $NAME}
    bodied: {inside: {kind: 'declaration_list, block'}}
    holding: {has: {field: body, has: {any: [{kind: ERROR}, {matches: row}]}}}
rewriters:
    - {id: annotation, rule: {any: [{kind: 'line_comment, block_comment'}, {matches: tool}]}, fix: ''}
    - id: kept
      rule: {kind: attribute_item, all: [{not: {matches: tool}}, {any: [{follows: {stopBy: {not: {kind: 'line_comment, block_comment'}}, kind: attribute_item, pattern: $EARLIER}}, {kind: attribute_item}]}, {pattern: $KEPT}]}
      transform: {ABOVE: {rewrite: {source: $EARLIER, rewriters: [kept, dropped]}}}
      fix: '$ABOVE$KEPT '
    - id: dropped
      rule: {kind: attribute_item, any: [{follows: {stopBy: {not: {kind: 'line_comment, block_comment'}}, kind: attribute_item, pattern: $EARLIER}}, {kind: attribute_item}]}
      transform: {ABOVE: {rewrite: {source: $EARLIER, rewriters: [kept, dropped]}}}
      fix: $ABOVE
    - {id: body, rule: {any: [{kind: function_contract}, {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}]}, fix: ' '}
    - {id: semi, rule: {kind: identifier}, fix: ';'}
    - id: lineage
      rule: {any: [{all: [{inside: {field: name, kind: 'delegation_item, enum_item, function_item, mod_item, struct_item, trait_item, union_item', matches: above}}, {matches: part}]}, {all: [{inside: {field: type, kind: impl_item, not: {has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}, matches: above}}, {matches: part}]}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage, trait-lineage], joinBy: ''}}}
      fix: '$ABOVE$PART::'
    - id: trait-lineage
      rule: {all: [{inside: {field: type, kind: impl_item, has: {field: trait, pattern: $FACET}, matches: above}}, {matches: part}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage, trait-lineage], joinBy: ''}}}
      fix: '$ABOVE<$PART as $FACET>::'
    - {id: value, rule: {kind: 'array_expression, assignment_expression, async_block, attributed_expression, await_expression, become_expression, binary_expression, block, boolean_literal, break_expression, builtin_expression, call_expression, char_literal, closure_expression, compound_assignment_expr, const_block, continue_expression, field_expression, float_literal, for_expression, gen_block, generic_function, identifier, if_expression, index_expression, integer_literal, loop_expression, macro_invocation, match_expression, metavariable, move_expression, parenthesized_expression, range_expression, raw_string_literal, reference_expression, return_expression, scoped_identifier, self, string_literal, struct_expression, try_block, try_expression, tuple_expression, type_cast_expression, unary_expression, unit_expression, unsafe_block, while_expression, yeet_expression, yield_expression', inside: {kind: 'const_item, static_item, let_declaration, field_declaration, enum_variant', field: value}}, fix: {template: ' ', expandStart: {regex: '^=$', stopBy: end}, expandEnd: {regex: '^;$'}}}
    - {id: spaced, rule: {kind: visibility_modifier, pattern: $V}, fix: '$V '}
    - {id: lt, rule: {kind: 'type_identifier, scoped_type_identifier, generic_type'}, fix: '<'}
    - {id: as, rule: {kind: 'type_identifier, scoped_type_identifier, generic_type'}, fix: ' as '}
    - {id: gt, rule: {kind: 'type_identifier, scoped_type_identifier, generic_type'}, fix: '>'}
transform:
    PATH: {rewrite: {source: $ARGUMENT, rewriters: [annotation]}}
    FOLDED: {replace: {source: $PATH, replace: '\p{Pattern_White_Space}+', by: ' '}}
    NAME: {replace: {source: $TARGET, replace: '\p{Pattern_White_Space}+', by: ' '}}
    TRAIT: {replace: {source: $IMPLEMENTED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
    QUALIFIED: {rewrite: {source: $OWNER, rewriters: [lineage, trait-lineage], joinBy: ''}}
    QUALIFIER: {replace: {source: $QUALIFIED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    TERM: {rewrite: {source: $FILED, rewriters: [semi]}}
    ATTRIBUTES: {rewrite: {source: $ATTRIBUTE, rewriters: [kept, dropped]}}
    ATTRIBUTED: {replace: {source: $ATTRIBUTES, replace: '\p{Pattern_White_Space}+', by: ' '}}
    PREFIX: {rewrite: {source: $VISIBILITY, rewriters: [spaced]}}
    OPEN: {rewrite: {source: $IMPLEMENTED, rewriters: [lt]}}
    FOR: {rewrite: {source: $IMPLEMENTED, rewriters: [as]}}
    CLOSE: {rewrite: {source: $IMPLEMENTED, rewriters: [gt]}}
variants:
    placed:
        utils:
            enclosing: {any: [{inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item', any: [{has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, matches: owner}}]}}, {matches: row}]}
        rewriters:
            - id: lineage
              rule: {any: [{all: [{inside: {field: name, kind: 'delegation_item, enum_item, function_item, mod_item, struct_item, trait_item, union_item', any: [{matches: above}, {kind: 'delegation_item, enum_item, function_item, mod_item, struct_item, trait_item, union_item'}]}}, {matches: part}]}, {all: [{inside: {field: type, kind: impl_item, not: {has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}, any: [{matches: above}, {kind: impl_item}]}}, {matches: part}]}]}
              transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage, trait-lineage], joinBy: ''}}}
              fix: '$ABOVE$PART::'
            - id: trait-lineage
              rule: {all: [{inside: {field: type, kind: impl_item, has: {field: trait, pattern: $FACET}, any: [{matches: above}, {kind: impl_item}]}}, {matches: part}]}
              transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage, trait-lineage], joinBy: ''}}}
              fix: '$ABOVE<$PART as $FACET>::'
    valued:
        rewriters:
            - {id: annotation, rule: {any: [{kind: 'line_comment, block_comment', not: {follows: {regex: '^=$', stopBy: {not: {kind: 'line_comment, block_comment'}}}}}, {matches: tool}]}, fix: ''}
        transform:
            HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, annotation]}}
    impl:
        rewriters:
            - {id: body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ' '}
    mod:
        rewriters:
            - {id: body, rule: {kind: declaration_list, inside: {kind: mod_item, field: body}}, fix: ' '}
    trait:
        rewriters:
            - {id: body, rule: {kind: declaration_list, inside: {kind: trait_item, field: body}}, fix: ' '}
    struct:
        rewriters:
            - {id: body, rule: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item', field: body}}, fix: ' '}
    enum:
        rewriters:
            - {id: body, rule: {kind: enum_variant_list, inside: {kind: enum_item, field: body}}, fix: ' '}
    foreign:
        rewriters:
            - {id: body, rule: {kind: declaration_list, inside: {kind: foreign_mod_item, field: body}}, fix: ' '}
    use:
        transform:
            HEADER: {rewrite: {source: $DECLARATION, rewriters: [annotation]}}
            NAME: {replace: {source: $FOLDED, replace: '[ ,;]+$|,? ([)\]}>])|([(\[{]) ', by: $1$2}}
            SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]}>])|([(\[{]) ', by: $1$2}}
    block:
        transform:
            SIGNATURE: {substring: {source: $LINE, endChar: -1}}
---
id: rust-use
role: item
symbolType: module
variants: [use]
rule:
    kind: 'use_declaration, extern_crate_declaration'
    all:
        - any:
            - has: {field: argument, kind: use_as_clause, has: {field: path, any: [{has: {field: path, matches: argument}}, {matches: argument}]}}
            - has: {field: argument, has: {field: path, matches: argument}}
            - has: {field: argument, kind: use_wildcard, has: {matches: argument}}
            - has: {field: argument, matches: argument}
            - has: {field: name, matches: argument}
        - not: {matches: broken}
        - matches: attributed
        - matches: declaration
name: $NAME
signature: $ATTRIBUTED$SIGNATURE
isImport: true
isExported: {has: {matches: public}}
---
id: rust-mod
role: item
symbolType: module
variants: [placed, mod, block]
rule:
    kind: mod_item
    any: [{not: {has: {field: body, kind: declaration_list}}, has: {field: name, pattern: {context: 'mod $FILED;', selector: identifier}}}, {kind: mod_item}]
    matches: conjoined
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE$TERM
isExported: {has: {matches: public}}
---
id: rust-function
role: item
symbolType: function
variants: [placed]
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    all: [{not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}}, {not: {matches: nesting}}]
    matches: conjoined
    has: {field: name, pattern: $NAME}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {has: {matches: public}}
---
id: rust-function-owner
role: item
symbolType: function
variants: [placed]
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    all: [{not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}}, {matches: nesting}]
    matches: conjoined
    has: {field: name, pattern: $NAME}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {has: {matches: public}}
---
id: rust-method
role: item
symbolType: method
variants: [placed]
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    all: [{matches: assoc}, {not: {matches: nesting}}]
    matches: conjoined
    has: {field: name, pattern: $NAME}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {any: [{has: {matches: public}}, {matches: implied}]}
---
id: rust-method-owner
role: item
symbolType: method
variants: [placed]
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    all: [{matches: assoc}, {matches: nesting}]
    matches: conjoined
    has: {field: name, pattern: $NAME}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {any: [{has: {matches: public}}, {matches: implied}]}
---
id: rust-type
role: item
symbolType: struct
variants: [placed, struct]
rule:
    kind: 'struct_item, union_item, type_item, associated_type'
    any: [{kind: 'struct_item, union_item'}, {not: {matches: broken}}]
    matches: conjoined
    has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {any: [{has: {matches: public}}, {matches: implied}]}
---
id: rust-enum
role: item
symbolType: enum
variants: [placed, enum]
rule:
    kind: enum_item
    matches: conjoined
    has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {has: {matches: public}}
---
id: rust-trait
role: item
symbolType: interface
variants: [placed, trait]
rule:
    kind: 'trait_item, trait_alias'
    any: [{kind: trait_item}, {not: {matches: broken}}]
    matches: conjoined
    has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {has: {matches: public}}
---
id: rust-impl
role: item
symbolType: object
variants: [placed, impl]
rule:
    kind: impl_item
    not: {has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}
    matches: conjoined
    has: {field: type, matches: target}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: false
---
id: rust-trait-impl
role: item
symbolType: object
variants: [placed, impl]
rule:
    kind: impl_item
    all:
        - matches: conjoined
        - any: [{has: {regex: '^!$', not: {kind: never_type}, pattern: $$NEGATION}}, {kind: impl_item}]
        - has: {field: trait, matches: implemented}
        - has: {field: type, matches: target}
name: $QUALIFIER<$NAME as $NEGATION$TRAIT>
signature: $ATTRIBUTED$SIGNATURE
isExported: true
---
id: rust-const
role: item
symbolType: constant
variants: [placed, valued]
rule:
    any:
        - {kind: const_item, has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}
        - {kind: static_item, not: {has: {kind: mutable_specifier}}, has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}
        - {kind: let_declaration, not: {has: {kind: mutable_specifier}}, inside: {kind: 'source_file, ERROR, declaration_list'}, has: {field: pattern, pattern: $NAME}}
    not: {matches: broken}
    matches: conjoined
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {not: {has: {field: name, regex: '^_$'}}, any: [{has: {matches: public}}, {matches: implied}]}
---
id: rust-static
role: item
symbolType: variable
variants: [placed, valued]
rule:
    any:
        - {kind: static_item, has: {kind: mutable_specifier}, all: [{has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}]}
        - {kind: let_declaration, has: {kind: mutable_specifier}, inside: {kind: 'source_file, ERROR, declaration_list'}, all: [{has: {field: pattern, pattern: $NAME}}]}
    not: {matches: broken}
    matches: conjoined
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: {has: {matches: public}}
---
id: rust-macro
role: item
symbolType: function
variants: [placed]
rule:
    kind: macro_definition
    all:
        - matches: attributed
        - matches: enclosing
        - any: [{has: {kind: visibility_modifier, pattern: $VISIBILITY}}, {kind: macro_definition}]
        - has: {regex: '^(?:macro_rules\p{Pattern_White_Space}*!|macro)$', pattern: $$KEYWORD}
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$PREFIX$KEYWORD $NAME
isExported:
    any:
        - {has: {matches: public}}
        - follows: {kind: attribute_item, has: {kind: attribute, has: {field: path, pattern: macro_export}}, stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}}
---
id: rust-macro-invocation
role: item
symbolType: event
variants: [placed]
rule:
    kind: macro_invocation
    inside: {any: [{kind: 'source_file, ERROR, declaration_list'}, {kind: expression_statement, inside: {kind: 'source_file, ERROR'}}]}
    all:
        - not: {matches: broken}
        - matches: enclosing
        - any: [{matches: attribute}, {inside: {kind: expression_statement, matches: attribute}}, {kind: macro_invocation}]
    has: {field: macro, pattern: $NAME}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$NAME!
isExported: false
---
id: rust-foreign-block
role: item
symbolType: namespace
variants: [placed, foreign, block]
rule:
    kind: foreign_mod_item
    matches: conjoined
    has: {kind: extern_modifier, pattern: $NAME}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isExported: false
---
id: rust-error
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, matches: row}}}
        - {kind: 'identifier, line_comment, block_comment', all: [{inside: {kind: ERROR}}, {not: {follows: {kind: 'identifier, line_comment, block_comment', stopBy: end}}}, {nthChild: {position: 1, ofRule: {kind: 'identifier, line_comment, block_comment'}}}]}
        - matches: missing
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: rust-member-function
role: member
parentRuleIds: [rust-mod, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-foreign-block]
symbolType: function
rule:
    any:
        - {kind: 'function_item, function_signature_item, delegation_item', all: [{matches: declared}, {not: {matches: nesting}}, {matches: enclosing}, {matches: declaration}], has: {field: name, matches: name}}
        - {kind: 'identifier, metavariable', all: [{inside: {kind: 'function_item, delegation_item', field: name, all: [{matches: declared}, {matches: enclosing}, {matches: declaration}]}}, {matches: name}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{matches: visible}, {matches: exposed}]}
---
id: rust-member-function-nested
role: member
parentRuleIds: [rust-function-owner]
symbolType: function
rule:
    any:
        - {kind: 'function_item, function_signature_item, delegation_item', all: [{matches: declared}, {not: {matches: nesting}}, {matches: enclosing}, {matches: declaration}], has: {field: name, matches: name}}
        - {kind: 'identifier, metavariable', all: [{inside: {kind: 'function_item, delegation_item', field: name, all: [{matches: declared}, {matches: enclosing}, {inside: {stopBy: end, kind: 'function_item, delegation_item', not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}}}, {matches: declaration}]}}, {matches: name}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{matches: visible}, {matches: exposed}]}
---
id: rust-member-method
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-trait, rust-impl, rust-trait-impl]
symbolType: method
rule:
    any:
        - {kind: 'function_item, function_signature_item, delegation_item', all: [{matches: assoc}, {not: {matches: nesting}}, {matches: enclosing}, {matches: declaration}], has: {field: name, matches: name}}
        - {kind: 'identifier, metavariable', all: [{inside: {kind: 'function_item, delegation_item', field: name, all: [{matches: assoc}, {matches: enclosing}, {matches: declaration}]}}, {matches: name}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{any: [{matches: visible}, {matches: implied}, {inside: {field: name, matches: implied}}]}, {matches: exposed}]}
---
id: rust-member-method-nested
role: member
parentRuleIds: [rust-method-owner]
symbolType: method
rule:
    any:
        - {kind: 'function_item, function_signature_item, delegation_item', all: [{matches: assoc}, {not: {matches: nesting}}, {matches: enclosing}, {matches: declaration}], has: {field: name, matches: name}}
        - {kind: 'identifier, metavariable', all: [{inside: {kind: 'function_item, delegation_item', field: name, all: [{matches: assoc}, {matches: enclosing}, {inside: {stopBy: end, kind: 'function_item, delegation_item', inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}}, {matches: declaration}]}}, {matches: name}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{any: [{matches: visible}, {matches: implied}, {inside: {field: name, matches: implied}}]}, {matches: exposed}]}
---
id: rust-member-type
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-foreign-block]
symbolType: struct
variants: [struct]
utils:
    holding: {has: {field: body, has: {kind: 'field_declaration, ERROR'}}}
rule:
    any:
        - {kind: 'struct_item, union_item', not: {matches: holding}, all: [{matches: declared}, {matches: enclosing}, {matches: declaration}], has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}}
        - {kind: type_identifier, all: [{inside: {kind: 'struct_item, union_item', field: name, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {matches: declaration}]}}, {pattern: {context: 'struct $NAME;', selector: type_identifier}}]}
        - {kind: 'type_item, associated_type', all: [{matches: bodied}, {not: {matches: broken}}, {matches: enclosing}, {matches: declaration}], has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{any: [{matches: visible}, {matches: implied}]}, {matches: exposed}]}
---
id: rust-member-field
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-type]
symbolType: field
variants: [valued]
rule:
    kind: field_declaration
    all:
        - inside: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item', any: [{has: {field: name, pattern: $OWNER}, inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item'}}, {kind: 'struct_item, union_item'}]}}
        - not: {matches: broken}
        - matches: attributed
        - matches: declaration
    has: {field: name, pattern: {context: 'struct A { $NAME: u8 }', selector: field_identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{has: {matches: public}}, {matches: exposed}]}
---
id: rust-member-const
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-foreign-block]
symbolType: constant
variants: [valued]
rule:
    any:
        - {kind: const_item, matches: bodied, has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}
        - {kind: static_item, not: {has: {kind: mutable_specifier}}, matches: declared, has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}
        - {kind: let_declaration, not: {has: {kind: mutable_specifier}}, matches: declared, inside: {kind: declaration_list}, has: {field: pattern, pattern: $NAME}}
    not: {matches: broken}
    matches: conjoined
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{not: {has: {field: name, regex: '^_$'}}}, {any: [{has: {matches: public}}, {matches: implied}]}, {matches: exposed}]}
---
id: rust-member-static
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-foreign-block]
symbolType: variable
variants: [valued]
rule:
    any:
        - {kind: static_item, has: {kind: mutable_specifier}, all: [{has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}]}
        - {kind: let_declaration, has: {kind: mutable_specifier}, inside: {kind: declaration_list}, all: [{has: {field: pattern, pattern: $NAME}}]}
    all: [{matches: declared}, {not: {matches: broken}}]
    matches: conjoined
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{has: {matches: public}}, {matches: exposed}]}
---
id: rust-member-enum
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl]
symbolType: enum
variants: [enum]
utils:
    holding: {has: {field: body, has: {kind: 'enum_variant, ERROR'}}}
rule:
    any:
        - {kind: enum_item, not: {matches: holding}, all: [{matches: declared}, {matches: enclosing}, {matches: declaration}], has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}}
        - {kind: type_identifier, all: [{inside: {kind: enum_item, field: name, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {matches: declaration}]}}, {pattern: {context: 'struct $NAME;', selector: type_identifier}}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{matches: visible}, {matches: exposed}]}
---
id: rust-member-variant
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-enum]
symbolType: enumMember
variants: [valued]
rule:
    kind: enum_variant
    all:
        - inside: {kind: enum_variant_list, inside: {kind: enum_item, any: [{has: {field: name, pattern: $OWNER}, inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item'}}, {kind: enum_item}]}}
        - not: {matches: broken}
        - matches: attributed
        - matches: declaration
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
transform:
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|,( \})|([(\[<]) ', by: $1$2$3}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{not: {inside: {kind: enum_variant_list, inside: {inside: {kind: 'declaration_list, block'}, not: {has: {matches: public}}}}}}, {matches: exposed}]}
---
id: rust-member-macro
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl]
symbolType: function
rule:
    kind: macro_definition
    all:
        - matches: declared
        - matches: attributed
        - matches: enclosing
        - any: [{has: {kind: visibility_modifier, pattern: $VISIBILITY}}, {kind: macro_definition}]
        - has: {regex: '^(?:macro_rules\p{Pattern_White_Space}*!|macro)$', pattern: $$KEYWORD}
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$PREFIX$KEYWORD $NAME
isPublic:
    any:
        - all: [{has: {matches: public}}, {matches: exposed}]
        - follows: {kind: attribute_item, has: {kind: attribute, has: {field: path, pattern: macro_export}}, stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}}
---
id: rust-member-arm
role: member
parentRuleIds: [rust-macro]
symbolType: function
rule:
    kind: macro_rule
    inside: {kind: macro_definition, has: {field: name, pattern: {context: 'mod $MACRO;', selector: identifier}}}
    has: {field: left, kind: token_tree_pattern, pattern: $LEFT}
transform:
    NAME: {replace: {source: $LEFT, replace: '\p{Pattern_White_Space}+', by: ' '}}
name: $NAME
signature: $MACRO!$NAME
isPublic:
    inside:
        kind: macro_definition
        any:
            - {has: {matches: public}}
            - follows: {kind: attribute_item, has: {kind: attribute, has: {field: path, pattern: macro_export}}, stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}}
---
id: rust-member-foreign-block
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl]
symbolType: namespace
variants: [foreign, block]
rule:
    any:
        - {kind: foreign_mod_item, not: {matches: holding}, all: [{matches: declared}, {matches: enclosing}, {matches: declaration}], has: {kind: extern_modifier, matches: name}}
        - {kind: extern_modifier, all: [{inside: {kind: foreign_mod_item, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {matches: declaration}]}}, {matches: name}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: false
---
id: rust-member-mod
role: member
parentRuleIds: [rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl]
symbolType: module
variants: [mod, use]
rule:
    any:
        - {kind: mod_item, not: {matches: holding}, all: [{matches: declared}, {matches: enclosing}, {any: [{not: {has: {field: body, kind: declaration_list}}, has: {field: name, pattern: {context: 'mod $FILED;', selector: identifier}}}, {kind: mod_item}]}, {matches: declaration}], has: {field: name, pattern: {context: 'mod $ARGUMENT;', selector: identifier}}}
        - {kind: identifier, all: [{inside: {kind: mod_item, field: name, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {matches: declaration}]}}, {pattern: {context: 'mod $ARGUMENT;', selector: identifier}}]}
        - kind: 'use_declaration, extern_crate_declaration'
          all:
            - matches: declared
            - not: {matches: broken}
            - matches: enclosing
            - any:
                - has: {field: argument, kind: use_as_clause, has: {field: path, any: [{has: {field: path, matches: argument}}, {matches: argument}]}}
                - has: {field: argument, has: {field: path, matches: argument}}
                - has: {field: argument, kind: use_wildcard, has: {matches: argument}}
                - has: {field: argument, matches: argument}
                - has: {field: name, matches: argument}
            - matches: declaration
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE$TERM
isPublic: {all: [{matches: visible}, {matches: exposed}]}
---
id: rust-member-mod-nested
role: member
parentRuleIds: [rust-mod]
symbolType: module
variants: [mod, use]
rule:
    any:
        - {kind: mod_item, not: {matches: holding}, all: [{matches: declared}, {matches: enclosing}, {any: [{not: {has: {field: body, kind: declaration_list}}, has: {field: name, pattern: {context: 'mod $FILED;', selector: identifier}}}, {kind: mod_item}]}, {matches: declaration}], has: {field: name, pattern: {context: 'mod $ARGUMENT;', selector: identifier}}}
        - {kind: identifier, all: [{inside: {kind: mod_item, field: name, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {inside: {stopBy: end, kind: mod_item}}, {matches: declaration}]}}, {pattern: {context: 'mod $ARGUMENT;', selector: identifier}}]}
        - kind: 'use_declaration, extern_crate_declaration'
          all:
            - matches: declared
            - not: {matches: broken}
            - matches: enclosing
            - any:
                - has: {field: argument, kind: use_as_clause, has: {field: path, any: [{has: {field: path, matches: argument}}, {matches: argument}]}}
                - has: {field: argument, has: {field: path, matches: argument}}
                - has: {field: argument, kind: use_wildcard, has: {matches: argument}}
                - has: {field: argument, matches: argument}
                - has: {field: name, matches: argument}
            - matches: declaration
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE$TERM
isPublic: {all: [{matches: visible}, {matches: exposed}]}
