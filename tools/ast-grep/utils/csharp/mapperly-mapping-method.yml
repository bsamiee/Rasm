# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: mapperly-mapping-method
language: csharplang
utils:
    use-attribute:
        matches: {csharp-qualified-name: {name: {regex: '^Map(?:Property(?:FromSource)?|Value)(?:Attribute)?$'}, qualifier: {regex: '^Abstractions$'}}}
    user-mapping:
        matches: {csharp-attributed: {name: {regex: '^(User|Named)Mapping(Attribute)?$'}}}
    generated-mapping:
        all:
            - has: {kind: modifier, regex: '^partial$'}
            - not: {has: {field: body, pattern: $_}}
            - inside: {kind: declaration_list, inside: {matches: mapperly-mapper-class}}
    use-argument:
        kind: attribute_argument
        has: {field: name, regex: '^Use$'}
        inside:
            kind: attribute_argument_list
            inside:
                kind: attribute
                has: {field: name, matches: use-attribute}
    use-helper:
        all:
            - has: {field: name, pattern: $HELPER}
            - inside:
                kind: declaration_list
                inside:
                    kind: class_declaration
                    matches: mapperly-mapper-class
                    has:
                        field: body
                        has:
                            stopBy: {kind: 'class_declaration, struct_declaration, record_declaration, interface_declaration, block, arrow_expression_clause'}
                            matches: use-argument
                            has:
                                any:
                                    - matches: csharp-nameof-call
                                      has:
                                        field: arguments
                                        has:
                                            kind: argument
                                            has:
                                                any:
                                                    - {kind: identifier, pattern: $HELPER}
                                                    - {kind: member_access_expression, not: {regex: '^@'}, has: {field: name, pattern: $HELPER}}
                                    - kind: string_literal
                                      has: {kind: string_literal_content, pattern: $HELPER}
                                      not: {has: {kind: escape_sequence}}
rule:
    kind: method_declaration
    any:
        - matches: user-mapping
        - matches: generated-mapping
        - matches: use-helper
