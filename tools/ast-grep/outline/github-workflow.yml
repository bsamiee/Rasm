id: github-workflow
language: yaml
role: item
symbolType: module
utils:
    document-mapping:
        kind: document > :is(block_node, flow_node) > :is(block_mapping, flow_mapping)
    document-pair:
        kind: block_mapping_pair, flow_pair
        inside: {matches: document-mapping}
    on-pair:
        matches: document-pair
        has: {field: key, regex: '^(on|"on"|''on'')$'}
rule:
    matches: on-pair
    pattern: $TRIGGERS
    inside:
        matches: document-mapping
        has: {matches: document-pair, all: [{has: {field: key, regex: '^(name|"name"|''name'')$'}}, {has: {field: value, pattern: $NAME}}]}
rewriters:
    - id: event
      rule:
        any:
            - kind: block_mapping_pair, flow_pair
              has: {field: key, pattern: $EVENT}
              inside: {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {matches: on-pair}}}
            - kind: flow_node
              pattern: $EVENT
              any:
                - inside: {kind: block_sequence_item, inside: {kind: block_sequence, inside: {kind: block_node, inside: {matches: on-pair}}}}
                - inside: {kind: flow_sequence, inside: {kind: flow_node, inside: {matches: on-pair}}}
                - inside: {field: value, matches: on-pair}
                  has: {kind: 'plain_scalar, double_quote_scalar, single_quote_scalar'}
      fix: $EVENT
transform:
    SIGNATURE: {rewrite: {source: $TRIGGERS, rewriters: [event], joinBy: ', '}}
name: $NAME
signature: 'on: $SIGNATURE'
isExported: true
