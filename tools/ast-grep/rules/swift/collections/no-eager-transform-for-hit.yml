# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-eager-transform-for-hit
language: swiftlang
severity: error
rule:
    kind: navigation_expression
    all:
        - has: {field: suffix, has: {field: suffix, regex: '^(first|contains|allSatisfy)$', pattern: $HIT}}
        - has:
            field: target
            kind: call_expression
            all:
                - has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^(map|compactMap|flatMap)$', pattern: $MAP}}}
                - not: {has: {stopBy: {not: {kind: 'call_expression, navigation_expression'}}, any: [{kind: navigation_suffix, regex: '^\.\s*lazy$'}, {kind: simple_identifier, regex: '^lazy$'}]}}
message: '`$MAP` transforms every element where `$HIT` needs the first hit alone'
note: 'Put `.lazy` before the transform so it stops at the first hit, `lazy.compactMap { <transform> }.first`, or test each element directly with `first(where:)` or `contains(where:)`'
