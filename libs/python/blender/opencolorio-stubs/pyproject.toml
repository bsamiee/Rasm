# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-opencolorio-stubs"
version         = "0.1.0"
description     = "PyOpenColorIO stubs pybind11-stubgen generates at build time from the OpenColorIO release Blender bundles"
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers     = ["Private :: Do Not Upload"]
requires-python = ">=3.13"

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/libs/python/blender/opencolorio-stubs"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [DEPENDENCY_GROUPS] ----------------------------------------------------------------

[dependency-groups]
dev = ["hatchling"] # Build hook interface `hatch_build.py` implements

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["hatchling", "opencolorio", "pybind11-stubgen"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true # The build hook supplies every file the wheel holds

[tool.hatch.build.targets.wheel.hooks.custom]
# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "../pyproject.toml" }] # uv rebuilds the generated stubs when the build hook or the workspace OpenColorIO pin changes
