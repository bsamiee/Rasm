# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    effect-record:
        matches: {effect-module: {name: {regex: '(?-u:\b)Record$'}}}
    native-object:
        regex: '^((globalThis|window|self)\.)?Object$'
        matches: typescript-global-reference
        inside:
            kind: program
            stopBy: end
            has:
                kind: import_statement
                any:
                    - all:
                        - has: {field: source, regex: '^.effect.$'}
                        - has: {kind: import_clause, has: {kind: named_imports, has: {kind: import_specifier, regex: '^Record$'}}}
                    - all:
                        - has: {field: source, regex: '^.effect/Record.$'}
                        - has: {kind: import_clause, has: {kind: namespace_import, regex: '(?-u:\b)Record$'}}
    effect-iterable:
        matches: {effect-module: {name: {regex: '(?-u:\b)(Array|Chunk|Iterable)$'}}}
    last-statement:
        nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, html_comment'}}}
    projection:
        kind: arrow_function
        all:
            - has: {field: parameters, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: required_parameter}, not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}
            - not:
                has:
                    field: body
                    kind: statement_block
                    pattern: $BLOCK
                    any:
                        - not: {has: {kind: return_statement, matches: last-statement}}
                        - has: {kind: return_statement, not: {matches: last-statement}}
                        - has: {kind: return_statement, stopBy: {kind: 'arrow_function, function_expression, function_declaration, method_definition'}, not: {inside: {kind: statement_block, pattern: $BLOCK}}}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^fromEntries$'}}, {has: {field: object, pattern: $FROM, any: [{matches: effect-record}, {matches: native-object}]}}]}
        - has:
            field: arguments
            all:
                - not: {has: {kind: comment}}
                - not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
                - has:
                    nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}
                    kind: call_expression
                    any:
                        - all:
                            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^map$'}}, {has: {field: object, matches: effect-iterable}}]}
                            - has:
                                field: arguments
                                all:
                                    - not: {has: {kind: comment}}
                                    - has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, not: {has: {field: function, matches: typescript-record-entries}}}
                                    - has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: projection}
                                    - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'comment, html_comment'}}}}}
                        - all:
                            - has:
                                field: function
                                kind: member_expression
                                all:
                                    - has: {field: property, regex: '^map$'}
                                    - has: {field: object, not: {any: [{matches: effect-namespace}, {has: {field: function, matches: typescript-record-entries}}]}}
                            - has:
                                field: arguments
                                all:
                                    - not: {has: {kind: comment}}
                                    - has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: projection}
                                    - not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
message: '`$FROM.fromEntries` over a mapped list restates `Record.fromIterableWith` or `Record.fromIterableBy`'
note: 'Call `Record.fromIterableBy(<list>, <key>)`, or `Record.fromIterableWith(<list>, <f>)` with `<f>` returning a pair'
