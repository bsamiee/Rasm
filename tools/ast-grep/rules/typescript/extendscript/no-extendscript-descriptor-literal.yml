# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: object
    all:
        - has: { any: [{ kind: pair, has: { field: key, regex: '^specifier$' } }, { kind: shorthand_property_identifier, regex: '^specifier$' }] }
        - has: { any: [{ kind: pair, has: { field: key, regex: '^valid$' } }, { kind: shorthand_property_identifier, regex: '^valid$' }] }
        - inside:
              kind: program
              stopBy: end
              has:
                  kind: import_statement
                  all:
                      - has: { field: source, has: { kind: string_fragment, regex: '^@rasm/object-model/host$' } }
                      - has: { stopBy: end, kind: import_specifier, has: { field: name, regex: '^reference$' } }
message: 'Object restates the reference `encode` builds from the containment table'
note: 'Return the host object'
