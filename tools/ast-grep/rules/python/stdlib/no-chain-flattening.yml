# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
metadata: {python-from: '3.15'}
utils:
    plain-arguments:
        kind: argument_list
        not: {has: {kind: 'dictionary_splat, keyword_argument'}}
    chain-call:
        kind: call
        any:
            - all:
                - has: {field: arguments, all: [{has: {kind: list_splat, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, has: {pattern: $ITERABLES}}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}}, {matches: plain-arguments}]}
                - has: {field: function, matches: itertools-chain-callee}
            - all:
                - has: {field: function, kind: attribute, has: {field: attribute, pattern: from_iterable}}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, not: {kind: list_splat}, pattern: $ITERABLES}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}}, {matches: plain-arguments}]}
                - has: {field: function, has: {field: object, matches: itertools-chain-callee}}
            - all:
                - has: {field: arguments, all: [{has: {kind: list_splat}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}, {matches: plain-arguments}, {pattern: $ARGUMENTS}]}
                - has: {field: function, matches: itertools-chain-callee}
    wrapper:
        kind: call
        all:
            - has: {field: arguments, all: [{has: {kind: call, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: chain-call}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}}]}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^(list|set)$'}}}}
    nested-loop:
        any:
            - kind: list_comprehension, set_comprehension, generator_expression
              all:
                - has: {field: body, kind: identifier}
                - not: {has: {kind: for_in_clause, regex: '^async'}}
                - any:
                    - pattern: '[$INNER for $OUTER in $ROWS for $INNER in $ITEMS]'
                    - pattern: '{$INNER for $OUTER in $ROWS for $INNER in $ITEMS}'
                    - pattern: '($INNER for $OUTER in $ROWS for $INNER in $ITEMS)'
            - kind: dictionary_comprehension
              all:
                - not: {has: {kind: for_in_clause, regex: '^async'}}
                - pattern: '{$KEY: $VALUE for $OUTER in $ROWS for $KEY, $VALUE in $MAPPING.items()}'
rule:
    kind: call, list_comprehension, set_comprehension, generator_expression, dictionary_comprehension
    all:
        - any:
            - matches: wrapper
            - all:
                - matches: chain-call
                - not:
                    inside:
                        kind: argument_list
                        inside:
                            matches: wrapper
            - matches: nested-loop
        - pattern: $SITE
message: '`$SITE` flattens iterables in place of comprehension unpacking'
note: 'Use comprehension unpacking with equivalent iteration timing and bindings'
