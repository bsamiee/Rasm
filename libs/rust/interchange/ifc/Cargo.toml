# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-ifc"
version.workspace    = true
edition.workspace    = true
description          = "IFC5 models and BCF issues: IFCX layers read with field paths, import closures over caller loads, HTTP and files under SRI integrity with a lock, federation with opinion provenance and conflicts, strict and partial composition with schema validation and reverse indexes, attribute values typed and encoded by their schemas with quantities in uom, overlays, three-way merges and layer and model diffs, spatial, systems and flow graphs, classifications, georeference codes, alignment stations, linear references, projections and chord polylines, scoped instanced meshes, multi-run curves, and array, base64, and PCD point sets with colors and glTF materials, and BCF 2.1 and 3.0 archives keyed by node UUID with merges and components resolved to model nodes"
repository.workspace = true
license.workspace    = true
keywords             = ["ifc", "ifcx", "bim", "bcf", "interchange"]
categories           = ["encoding", "science"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
futures              = { workspace = true }
tokio                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
strum                = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
data-encoding        = { workspace = true }
data-encoding-macro  = { workspace = true }
serde                = { workspace = true, features = ["rc"] }
serde_json           = { workspace = true }
serde_path_to_error  = { workspace = true }
serde_with           = { workspace = true }
nutype               = { workspace = true }
jiff                 = { workspace = true }
newtype-uuid         = { workspace = true }
newtype-uuid-macros  = { workspace = true }
uuid                 = { workspace = true }
xot                  = { workspace = true }
fs-err               = { workspace = true }
typed-path           = { workspace = true }
zip                  = { workspace = true }
aws-lc-rs            = { workspace = true }
reqwest              = { workspace = true }
url                  = { workspace = true }
gauss-quad           = { workspace = true }
nalgebra             = { workspace = true }
uom                  = { workspace = true }
petgraph             = { workspace = true }
parry3d-f64          = { workspace = true }
pcd-rs               = { workspace = true }
color                = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
