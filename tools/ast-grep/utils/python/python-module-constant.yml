# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-module-constant
language: python
rule:
    kind: 'identifier, attribute'
    any:
        - regex: '^(\w+\.)*_?[A-Z][A-Z0-9_]*$'
        - kind: identifier
          pattern: $ALIAS
          inside:
            kind: module
            stopBy: end
            has: {kind: import_from_statement, has: {kind: aliased_import, all: [{has: {field: name, regex: '^_?[A-Z][A-Z0-9_]*$'}}, {has: {field: alias, pattern: $ALIAS}}]}}
