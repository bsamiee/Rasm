id: no-tr-case-conversion
valid:
    # Lower case by expansion
    - |
      lang=${BASH_REMATCH[1],,}
    # Upper case by expansion
    - |
      name=${name^^}
    # tr over a command's output, no-tr-case-conversion-by-hand
    - |
      lang=$(cmd | tr '[:upper:]' '[:lower:]')
    # tr at statement level, no-tr-case-conversion-by-hand
    - |
      printf '%s\n' "$name" | tr '[:upper:]' '[:lower:]'
    # tr deleting characters
    - |
      trimmed=$(printf '%s' "$name" | tr -d ' ')
    # tr with a third argument
    - |
      out=$(printf '%s' "$name" | tr -s '[:upper:]' '[:lower:]')
    # A third pipeline stage
    - |
      out=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | head -1)
    # printf of a format beside the parameter
    - |
      out=$(printf '%s-%s' "$name" "$suffix" | tr '[:upper:]' '[:lower:]')
    # awk over another field
    - |
      out=$(awk '{print tolower($1)}' <<<"$line")
    # The conversion before the writer, the written value is not converted
    - |
      out=$(tr '[:upper:]' '[:lower:]' | printf '%s' "$name")
    # A stage between the writer and the conversion
    - |
      out=$(printf '%s' "$name" | sed 's/ //g' | tr '[:upper:]' '[:lower:]')
    # Another command with the classes as its arguments
    - |
      out=$(printf '%s' "$name" | diff '[:upper:]' '[:lower:]')
    # tr from a class to one character
    - |
      out=$(printf '%s' "$name" | tr '[:upper:]' '_')
    # Another interpreter over the same program text
    - |
      out=$(printf '%s' "$name" | perl '{print tolower($0)}')
    # awk with a field separator option before the program
    - |
      out=$(printf '%s' "$name" | awk -F, '{print tolower($0)}')
    # An operator beside the name in the here string, the expansion result is the input
    - |
      out=$(tr '[:upper:]' '[:lower:]' <<<"${lang%x}")
    # A whole array in the here string, the elements joined by a space
    - |
      out=$(tr '[:upper:]' '[:lower:]' <<<"${names[@]}")
    # sed with an option before the program
    - |
      out=$(sed -n 's/.*/\L&/p' <<<"$name")
    # sed over another replacement
    - |
      out=$(sed 's/a/b/' <<<"$name")
    # Another interpreter over the same replacement text
    - |
      out=$(perl 's/.*/\L&/' <<<"$name")
    # sed converting one match, not the line
    - |
      out=$(sed 's/a/\U&/' <<<"$name")
    # sed converting every match of a part
    - |
      out=$(sed 's/x/\L&/g' <<<"$name")
    # tr between other sets over a length
    - |
      out=$(tr a b <<<"${#lang}")
    # An option end before the classes
    - |
      out=$(tr -- '[:upper:]' '[:lower:]' <<<"$name")
invalid:
    # sed with the GNU upper-case replacement over a here string
    - |
      out=$(sed 's/.*/\U&/' <<<"$name")
    # awk with spaces inside the braces
    - |
      out=$(awk '{ print tolower($0) }' <<<"$name")
    # Double-quoted classes and a space after the here string operator
    - |
      out=$(tr "[:lower:]" "[:upper:]" <<< "$name")
    # printf with the newline format
    - |
      out=$(printf '%s\n' "$name" | tr '[:upper:]' '[:lower:]')
    # The instance, printf of the parameter into tr lower
    - |
      lang=$(printf '%s' "$lang" | tr '[:upper:]' '[:lower:]')
    # echo into tr upper
    - |
      name=$(echo "$name" | tr '[:lower:]' '[:upper:]')
    # Range spelling of the classes
    - |
      name=$(echo "$name" | tr A-Z a-z)
    # Range spelling upward
    - |
      name=$(echo "$name" | tr a-z A-Z)
    # Here string into tr
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<"$lang")
    # awk tolower over a here string
    - |
      lang=$(awk '{print tolower($0)}' <<<"$lang")
    # awk toupper over a pipe
    - |
      lang=$(printf '%s\n' "$lang" | awk '{print toupper($0)}')
    # Backticks
    - |
      lang=`printf '%s' "$lang" | tr '[:upper:]' '[:lower:]'`
    # Bracketed range spelling of the classes
    - |
      name=$(echo "$name" | tr '[A-Z]' '[a-z]')
    # A bare parameter in the here string, a here string splits no words
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<$lang)
    # The braced parameter in the here string
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<"${lang}")
    # An array element in the here string
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<"${BASH_REMATCH[1]}")
    # The braced parameter written into the pipe
    - |
      lang=$(printf '%s' "${lang}" | tr '[:upper:]' '[:lower:]')
    # sed with the GNU lower-case replacement over a here string
    - |
      lang=$(sed 's/.*/\L&/' <<<"$lang")
    # sed with the GNU upper-case replacement over a pipe
    - |
      lang=$(printf '%s' "$lang" | sed 's/.*/\U&/')
    # sed with the y command over the alphabet
    - |
      lang=$(sed 'y/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/' <<<"$lang")
