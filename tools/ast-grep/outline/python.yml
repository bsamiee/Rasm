    checked: {any: [{inside: {kind: block, stopBy: {kind: block}, any: [{inside: {kind: 'if_statement, elif_clause', field: consequence, all: [{has: {regex: '^(?:el)?if$', pattern: $$CLAUSE}}, {has: {field: condition, pattern: $GUARD}}]}}, {inside: {kind: else_clause, field: body, has: {regex: '^else$', pattern: $$CLAUSE}}}]}}, {not: {kind: ERROR}}]}
    dotted: {any: [{kind: identifier}, {kind: attribute, not: {has: {stopBy: end, pattern: $_, not: {kind: 'identifier, attribute'}}}}]}
    scalar: {any: [{kind: 'integer, float, true, false, none, ellipsis'}, {kind: 'string, concatenated_string', not: {has: {stopBy: end, kind: interpolation}}}, {kind: unary_operator, has: {field: argument, kind: 'integer, float'}}, {kind: 'list_splat, dictionary_splat', has: {matches: dotted}}]}
    literal: {any: [{matches: dotted}, {matches: scalar}, {kind: 'list, tuple, set', not: {has: {pattern: $_, not: {matches: dotted}}}}]}
    scope: {inside: {kind: class_definition, stopBy: {kind: 'class_definition, function_definition'}, any: [{inside: {kind: 'class_definition, function_definition', stopBy: end}, has: {field: name, pattern: $OWNER}}, {kind: class_definition}]}}
    hidden: {inside: {kind: 'class_definition, function_definition', stopBy: end, has: {field: name, matches: private}}}
    leaf: {kind: function_definition, all: [{not: {has: {stopBy: end, any: [{kind: 'function_definition, class_definition, type_alias_statement, ERROR'}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}}, {has: {field: name, pattern: $NAME, not: {regex: '^__(?:init|new|post_init|del)__$'}}}]}
rule:
    all:
        - any:
              - {kind: function_definition, all: [{matches: leaf}, {matches: scope}]}
              - {kind: decorated_definition, all: [{has: {field: definition, matches: leaf}}, {matches: scope}, {not: {has: {any: [{kind: ERROR}, {kind: decorator, has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}]}}}]}
              - kind: parameters
                all:
                    - inside: {kind: function_definition, field: parameters, all: [{matches: scope}, {has: {field: name, pattern: $NAME}}]}
                    - not: {has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}
              - kind: assignment
                all:
                    - has: {field: right, kind: lambda}
                    - matches: scope
                    - not: {has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}
                    - has: {field: left, kind: identifier, pattern: $NAME}
        - matches: checked
rewriters:
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: tool, rule: {kind: decorator, regex: '^@(?:(?:typing|typing_extensions)\.)?(?:type_check_only|no_type_check|disjoint_base)$'}, fix: ''}
    - {id: argument, rule: {any: [{inside: {kind: argument_list}, all: [{pattern: $_}, {not: {kind: 'keyword_argument, comment'}}, {not: {matches: literal}}]}, {inside: {kind: keyword_argument, field: value}, not: {matches: literal}}]}, fix: '…'}
    - {id: decorator, rule: {kind: decorator, has: {kind: call, all: [{has: {field: function, pattern: $CALLEE}}, {has: {field: arguments, pattern: $ARGUMENTS}}]}}, transform: {OPTIONS: {rewrite: {source: $ARGUMENTS, rewriters: [comment, argument]}}}, fix: '@$CALLEE$OPTIONS'}
    - id: decorators
      rule: {kind: decorator, pattern: $DECORATOR, any: [{precedes: {stopBy: {not: {kind: comment}}, kind: decorator, pattern: $NEXT}}, {kind: decorator}]}
      transform:
          ONE: {rewrite: {source: $DECORATOR, rewriters: [tool, decorator, comment]}}
          REST: {rewrite: {source: $NEXT, rewriters: [decorators], joinBy: ''}}
      fix: '$ONE $REST'
    - id: header
      rule:
          kind: identifier
          inside:
              kind: function_definition
              field: name
              all:
                  - has: {field: parameters, pattern: $PARAMETERS}
                  - any: [{regex: '^async', has: {regex: '^async$', pattern: $$ASYNC}}, {kind: function_definition}]
                  - any: [{has: {field: type_parameters, pattern: $TYPES}}, {kind: function_definition}]
                  - any: [{has: {field: return_type, pattern: $RETURN}}, {kind: function_definition}]
                  - any: [{inside: {kind: decorated_definition, has: {kind: decorator, nthChild: 1, pattern: $FIRST}}}, {kind: function_definition}]
      transform:
          DECORATED: {rewrite: {source: $FIRST, rewriters: [decorators], joinBy: ''}}
          GENERIC: {rewrite: {source: $TYPES, rewriters: [comment]}}
          ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [default, typed, comment]}}
          RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: '$CLAUSE $GUARD: $DECORATED$ASYNC def $NAME$GENERIC$ARGUMENTS -> $RESULT:'
    - {id: assigned, rule: {kind: identifier, inside: {kind: assignment, field: left, pattern: $ASSIGNMENT}}, transform: {TEXT: {rewrite: {source: $ASSIGNMENT, rewriters: [lambda, thunk, comment]}}}, fix: '$CLAUSE $GUARD: $TEXT'}
    - {id: default, rule: {kind: default_parameter, has: {field: name, pattern: $PARAMETER}}, fix: '$PARAMETER=…'}
    - {id: typed, rule: {kind: typed_default_parameter, all: [{has: {field: name, pattern: $PARAMETER}}, {has: {field: type, pattern: $TYPE}}]}, fix: '$PARAMETER: $TYPE = …'}
    - {id: lambda, rule: {kind: lambda, inside: {kind: assignment, field: right}, has: {field: parameters, pattern: $PARAMETERS}}, transform: {ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [default]}}}, fix: 'lambda $ARGUMENTS:'}
    - {id: thunk, rule: {kind: lambda, inside: {kind: assignment, field: right}}, fix: 'lambda:'}
    - id: lineage
      rule: {kind: 'identifier, type_identifier', pattern: $SELF, any: [{inside: {kind: 'class_definition, function_definition', field: name, inside: {kind: 'class_definition, function_definition', stopBy: {kind: 'class_definition, function_definition'}, inside: {kind: 'class_definition, function_definition', stopBy: end}, has: {field: name, pattern: $UP}}}}, {kind: 'identifier, type_identifier'}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}}
      fix: $ABOVE$SELF.
transform:
    HEADER: {rewrite: {source: $NAME, rewriters: [header, assigned]}}
    LINE: {replace: {source: $HEADER, replace: '\\?[\t-\r \x{200B}\x{2060}\x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ',? ([)\]}])|([(\[{]) |^(?: :)? +|^(else) (:)| -> (:)$| +$', by: $1$2$3$4$5}}
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {not: {any: [{matches: hidden}, {has: {field: name, matches: private}}, {has: {field: definition, has: {field: name, matches: private}}}, {has: {field: left, matches: private}}]}}
