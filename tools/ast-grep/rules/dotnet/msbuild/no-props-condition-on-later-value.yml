# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-props-condition-on-later-value
language: xml
severity: error
files: ['**/*.props']
rule:
    kind: Attribute
    all:
        - has: {kind: Name, regex: '^Condition$'}
        # Values the SDK props, the project body, or the SDK targets assign after every .props import, and the workspace body properties
        - has: {kind: AttValue, regex: '\$\((Configuration|Platform|TargetFramework|TargetFrameworks|OutputType|TargetFrameworkIdentifier|TargetFrameworkVersion|TargetFrameworkMoniker|OutputPath|IntermediateOutputPath|TargetPath|TargetDir|TargetFileName|IsTestProject|IsTestingPlatformApplication|RhinoHost|PluginHost|ReleaseGroup|HostCommon|HostUi|HostPlatform|HostGrasshopper)\)'}
        # Empty-default guards, joined by and or or, are the one .props form that reads the names
        - not: {has: {kind: AttValue, regex: "^\"\\s*('\\$\\(\\w+\\)' == ''\\s*((and|or)\\s+)?)+\"$"}}
        # The condition sits on a property group, a When arm, an Import, or a property, an item and a target read the final value
        - inside:
            matches: msbuild-tag
            inside:
                any:
                    - matches: {msbuild-element: {name: {regex: '^(PropertyGroup|When|Import)$'}}}
                    - matches: {msbuild-property: {name: {regex: '.'}}}
        - not: {inside: {matches: {msbuild-element: {name: {regex: '^Target$'}}}, stopBy: end}}
message: A .props property condition reads a value the SDK props, the project body, or the SDK targets assign later and compares an empty string, move the group to Directory.Build.targets or key the condition on $(MSBuildProjectName) or the project directory
