# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-module-state
language: tsx
severity: error
rule:
    kind: lexical_declaration
    has: {field: kind, regex: '^let$'}
    inside:
        any:
            - kind: program
            - kind: export_statement
              inside: {kind: program}
message: The module-level let binding permits shared reassignment
note: Declare module values with const and keep a changing binding in the scope that owns its updates
