# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    serde-method:
        kind: function_item
        any:
            - all:
                - has: {field: name, regex: '^serialize$'}
                - inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '(^|::)Serialize$'}}}
            - all:
                - has: {field: name, regex: '^deserialize$'}
                - inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '(^|::)Deserialize\p{Pattern_White_Space}*<'}}}
            - has: {field: type_parameters, regex: '(?-u:\b)(Serializer|Deserializer\p{Pattern_White_Space}*<)'}
            - has: {kind: where_clause, regex: '(?-u:\b)(Serializer|Deserializer\p{Pattern_White_Space}*<)'}
            - has: {field: parameters, has: {kind: parameter, has: {field: type, regex: '^impl\p{Pattern_White_Space}+((serde::)?(ser::|de::)?)?(Serializer|Deserializer\p{Pattern_White_Space}*<)'}}}
    text-rendering:
        any:
            - kind: call_expression
              has: {field: function, kind: field_expression, has: {field: field, regex: '^to_string$'}}
            - matches: {rust-std-macro: {name: {regex: '^format$'}}}
            - kind: reference_expression
              has: {field: value, any: [{kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^to_string$'}}}, {matches: {rust-std-macro: {name: {regex: '^format$'}}}}]}
    display-write:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^serialize_str$'}}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: text-rendering}}
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^collect_str$'}}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^serialize$'}}, {has: {field: value, matches: text-rendering}}]}
            - all:
                - has: {field: function, regex: '^((serde::)?(ser::)?Serialize::)serialize$'}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: text-rendering}}
    text-type:
        regex: '^(String|&\p{Pattern_White_Space}*(''\p{XID_Continue}+\p{Pattern_White_Space}+)?str|(std::borrow::)?Cow<\p{Pattern_White_Space}*(''\p{XID_Continue}+\p{Pattern_White_Space}*,\p{Pattern_White_Space}*)?str\p{Pattern_White_Space}*>)$'
    text-read:
        any:
            - kind: call_expression
              has: {field: function, regex: '^(String|<\p{Pattern_White_Space}*&\p{Pattern_White_Space}*(''\p{XID_Continue}+\p{Pattern_White_Space}+)?str\p{Pattern_White_Space}*>|Cow::<\p{Pattern_White_Space}*str\p{Pattern_White_Space}*>|<\p{Pattern_White_Space}*(String|&\p{Pattern_White_Space}*(''\p{XID_Continue}+\p{Pattern_White_Space}+)?str)\p{Pattern_White_Space}+as\p{Pattern_White_Space}+((serde::)?(de::)?)?Deserialize(<[^>]*>)?\p{Pattern_White_Space}*>)::deserialize$'}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^((serde::)?(de::)?Deserialize::)deserialize$'}
                - inside: {kind: let_declaration, stopBy: {kind: 'let_declaration, block'}, has: {field: type, matches: text-type}}
            - kind: call_expression
              has: {field: function, kind: field_expression, has: {field: field, regex: '^deserialize_str$'}}
    text-parse:
        kind: call_expression
        any:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^parse$'}}
            - has: {field: function, kind: generic_function, has: {field: function, kind: field_expression, has: {field: field, regex: '^parse$'}}}
            - has: {field: function, kind: scoped_identifier, has: {field: name, regex: '^(from_str|try_from)$'}}
    parsing-visitor:
        kind: function_item
        all:
            - has: {field: name, regex: '^visit_(borrowed_)?str$'}
            - inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '(^|::)Visitor\p{Pattern_White_Space}*<'}}}
            - has: {field: body, has: {stopBy: end, matches: text-parse}}
rule:
    all:
        - any:
            - matches: display-write
              inside: {kind: function_item, stopBy: {kind: function_item}, matches: serde-method}
            - matches: text-read
              inside:
                kind: function_item
                stopBy: {kind: function_item}
                all:
                    - matches: serde-method
                    - has: {field: body, has: {stopBy: end, matches: text-parse}}
            - matches: parsing-visitor
        - pattern: $SITE
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\p{Pattern_White_Space}*\{?\p{Pattern_White_Space}*\n.*$', by: ''}}
message: '`$HEAD` serializes or deserializes a value through `Display` or `FromStr` text by hand'
note: 'Derive `serde_with::SerializeDisplay` and `DeserializeFromStr` in place of the impl, or mark a field `#[serde_as(as = "DisplayFromStr")]`'
