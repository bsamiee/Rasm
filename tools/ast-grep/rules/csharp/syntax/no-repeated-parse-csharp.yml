# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-parse-csharp
language: csharp
severity: error
utils:
    parse-call:
        kind: invocation_expression
        all:
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^(Try)?Parse(Exact)?$'}
                    - has: {field: expression, pattern: $RECEIVER}
            - any:
                - has: {field: arguments, has: {kind: argument, nthChild: 2, not: {has: {regex: '^(out|ref)$'}}, pattern: $POLICY}}
                - not: {has: {field: arguments, has: {kind: argument, nthChild: 2, not: {has: {regex: '^(out|ref)$'}}}}}
    reader:
        kind: method_declaration, property_declaration, field_declaration, constructor_declaration, operator_declaration, indexer_declaration, local_function_statement, class_declaration, record_declaration, struct_declaration, interface_declaration, namespace_declaration
    unary:
        kind: method_declaration, local_function_statement
        has: {field: parameters, all: [{has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $PARAMETER}}}, {not: {has: {kind: parameter, nthChild: 2}}}]}
    owner-body:
        inside: {kind: arrow_expression_clause, inside: {matches: unary}}
    owner:
        matches: unary
        kind: method_declaration
        all:
            - has: {kind: modifier, regex: '^static$'}
            - has:
                field: body
                kind: arrow_expression_clause
                all:
                    - has: {pattern: '$RECEIVER.$METHOD($PARAMETER, $$$)'}
                    - has: {pattern: '$_RECEIVER.$_METHOD($PARAMETER, $$$REST)'}
    plain-owner:
        matches: unary
        kind: method_declaration
        all:
            - has: {kind: modifier, regex: '^static$'}
            - has: {field: body, kind: arrow_expression_clause, has: {pattern: '$RECEIVER.$METHOD($PARAMETER)'}}
    owned:
        not: {has: {field: arguments, any: [{has: {kind: argument, has: {regex: '^(out|ref)$'}}}, {has: {kind: argument, nthChild: 1, has: {field: name, pattern: $_}}}]}}
        any:
            - all:
                - pattern: $RECEIVER.$METHOD($_ARGUMENT, $$$REST)
                - not: {matches: owner-body}
                - inside: {kind: declaration_list, stopBy: end, inside: {kind: 'class_declaration, struct_declaration, record_declaration, interface_declaration'}, has: {matches: owner}}
            - all:
                - pattern: $RECEIVER.$METHOD($_ARGUMENT)
                - not: {matches: owner-body}
                - inside: {kind: declaration_list, stopBy: end, inside: {kind: 'class_declaration, struct_declaration, record_declaration, interface_declaration'}, has: {matches: plain-owner}}
            - all:
                - pattern: $RECEIVER.$METHOD($_ARGUMENT, $$$REST)
                - inside: {kind: arrow_expression_clause, inside: {matches: unary, follows: {stopBy: end, matches: owner}}}
            - all:
                - pattern: $RECEIVER.$METHOD($_ARGUMENT)
                - inside: {kind: arrow_expression_clause, inside: {matches: unary, follows: {stopBy: end, matches: plain-owner}}}
rule:
    all:
        - pattern: $PARSE
        - matches: parse-call
        - not: {matches: owner-body}
        - not: {matches: owned}
        - inside:
            stopBy: end
            matches: reader
            follows: {stopBy: end, has: {stopBy: end, matches: parse-call}}
message: '`$PARSE` repeats a parse an earlier reader of the file runs'
note: Parse once at the owner of the text, a value object or smart enum member, and read the parsed value at every other reader
