id: nullable-parameter-to-default
valid:
    # The corrected form, the default in the signature
    - |
      from runtime import PROFILE_STATEFUL

      def run(machine, *, profile: str = PROFILE_STATEFUL) -> None:
          run_as_test(machine, settings=get_profile(profile))
    # Boolean or spelling, the truthiness test the signature default cannot carry
    - |
      from runtime import PROFILE_STATEFUL

      def run(machine, *, profile: str | None = None) -> None:
          resolved = profile or PROFILE_STATEFUL
    # Parameter without a default, the annotation alone accepts None and the rewrite cannot restate it
    - |
      import operator

      def check(left, right, equal: _Equality[T]) -> None:
          assert (equal if equal is not None else operator.eq)(left, right)
    # Two resolutions to different defaults
    - |
      LIMIT = 3
      CAP = 9

      def run(count: int | None = None) -> int:
          first = count if count is not None else LIMIT
          return first + (count if count is not None else CAP)
    # None test outside the resolution, a branch the default leaves dead
    - |
      LIMIT = 3

      def run(count: int | None = None) -> int:
          if count is None:
              log("defaulted")
          return count if count is not None else LIMIT
    # Not-None test outside the resolution
    - |
      LIMIT = 3

      def run(count: int | None = None) -> int:
          if count is not None:
              log("given")
          return count if count is not None else LIMIT
    # Statement form with a second statement in the branch, the branch does more than resolve the default
    - |
      LIMIT = 3

      def run(count: int | None = None) -> int:
          if count is None:
              count = LIMIT
              log(count)
          return count
    # Default computed by a call, the value exists where it is read
    - |
      def run(machine, *, settings: Settings | None = None) -> None:
          run_as_test(machine, settings=settings if settings is not None else get_profile(PROFILE_STATEFUL))
    # Statement form with an else branch
    - |
      LIMIT = 3

      def run(count: int | None = None) -> int:
          if count is None:
              count = LIMIT
          else:
              count = count + 1
          return count
invalid:
    # The instance, the parameter tested against None and replaced by an imported constant
    - |
      from runtime import PROFILE_STATEFUL

      def run(machine, *, profile: str | None = None) -> None:
          resolved = profile if profile is not None else PROFILE_STATEFUL
    # Arms swapped, the default first
    - |
      from runtime import PROFILE_STATEFUL

      def run(machine, *, profile: str | None = None) -> None:
          resolved = PROFILE_STATEFUL if profile is None else profile
    # None on the left of the union
    - |
      LIMIT = 3

      def run(count: None | int = None) -> int:
          return count if count is not None else LIMIT
    # Untyped parameter with a None default
    - |
      def run(count=None):
          return count if count is not None else 3
    # Parenthesized resolution in a call position, the parentheses leave with the conditional
    - |
      import operator

      def check(left, right, equal: Equality | None = None) -> None:
          assert (equal if equal is not None else operator.eq)(left, right)
    # Statement form, the None branch leaves
    - |
      LIMIT = 3

      def run(count: int | None = None) -> int:
          if count is None:
              count = LIMIT
          return count
    # Two resolutions to the same default, both leave
    - |
      LIMIT = 3

      def run(count: int | None = None) -> int:
          first = count if count is not None else LIMIT
          return first + (count if count is not None else LIMIT)
    # Attribute chain default rooted at an import
    - |
      import settings

      def run(profile: str | None = None) -> str:
          return profile if profile is not None else settings.defaults.profile
    # Method with a docstring, the other statements keep their text
    - |
      LIMIT = 3

      class Reader:
          def run(self, count: int | None = None) -> int:
              """Count the items."""
              log(count)
              return count if count is not None else LIMIT
