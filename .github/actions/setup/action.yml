name: Setup
description: Installs the toolchain and dependencies

runs:
    using: composite
    steps:
        - uses: nrwl/nx-set-shas@v5
        - uses: jdx/mise-action@v5.1.1
          with:
            auto_update: true
            minimum_release_age: 0s
        - uses: actions/cache@v6
          with:
            path: .cache/nuget/packages
            key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'NuGet.config', '**/*.csproj', '**/*.proj') }}
        - uses: actions/cache@v6
          if: runner.os == 'Linux'
          with:
            path: .cache/uv
            key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
        - uses: actions/cache@v6
          with:
            path: |
                .cache/pnpm/store
                .cache/pnpm/cache
            key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        - run: pnpm install
          shell: bash
        - run: uv sync --locked --no-default-groups --group dev
          if: runner.os == 'Linux'
          shell: bash
