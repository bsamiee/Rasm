# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-shadowed-name
language: python
utils:
    root:
        any:
            - kind: identifier
              pattern: $ROOT
            - kind: attribute
              has: {field: object, matches: root}
    binding:
        matches: {python-binding: {name: {pattern: $ROOT}}}
rule:
    all:
        - any:
            - matches: root
            - kind: call
              has: {field: function, matches: root}
        - any:
            - inside:
                kind: module, function_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
                stopBy: end
                has:
                    stopBy: {kind: "function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression"}
                    matches: binding
            - inside:
                kind: class_definition
                stopBy: {kind: "function_definition, lambda"}
                has:
                    stopBy: {kind: "function_definition, class_definition, lambda"}
                    matches: binding
