# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-assets-on-development-dependency
language: xml
severity: error
utils:
    development-reference:
        kind: element
        has:
            matches: msbuild-tag
            all:
                - has: {kind: Name, regex: '^PackageReference$'}
                - has:
                    kind: Attribute
                    all:
                        - has: {kind: Name, regex: '^Include$'}
                        - has:
                            kind: AttValue
                            regex: |-
                                (?xi)^["']([A-Za-z0-9.]+\.(Analyzers?|SourceGenerators?|Generators?)|Riok\.Mapperly|Grpc\.Tools|MessagePackAnalyzer
                                |Microsoft\.CodeAnalysis\.CSharp|Microsoft\.CodeAnalysis\.Analyzers|MinVer|Generator\.Equals)["']$
    private-assets-all:
        kind: element
        any:
            - all:
                - has:
                    matches: msbuild-tag
                    has:
                        kind: Attribute
                        all:
                            - has: {kind: Name, regex: '^PrivateAssets$'}
                            - has: {kind: AttValue, regex: '(?i)^["'']?\s*all\s*["'']?$'}
                - not:
                    has:
                        kind: content
                        has:
                            kind: element
                            has: {matches: msbuild-tag, has: {kind: Name, regex: '^PrivateAssets$'}}
                            not: {has: {kind: content, regex: '(?i)^["'']?\s*all\s*["'']?$'}}
            - has:
                kind: content
                has:
                    kind: element
                    nthChild:
                        position: 1
                        reverse: true
                        ofRule: {kind: element, has: {matches: msbuild-tag, has: {kind: Name, regex: '^PrivateAssets$'}}}
                    all:
                        - has: {kind: content, regex: '(?i)^["'']?\s*all\s*["'']?$'}
                        - not: {has: {kind: STag, has: {kind: Attribute}}}
rule:
    pattern: _REFERENCE
    matches: development-reference
    not: {matches: private-assets-all}
transform:
    FIXED: rewrite($REFERENCE, rewriters=[add-metadata, remove-metadata])
fix: $FIXED
rewriters:
    - id: remove-metadata
      rule:
        any:
            - kind: Attribute
              has: {kind: Name, regex: '^PrivateAssets$'}
              inside: {matches: msbuild-tag, inside: {pattern: _REFERENCE}}
            - matches: {msbuild-element: {name: {regex: '^PrivateAssets$'}}}
              inside: {kind: content, inside: {pattern: _REFERENCE}}
      fix: ''
    - id: add-metadata
      rule:
        matches: msbuild-tag
        pattern: _TAG
        has: {kind: Name, regex: '^PackageReference$'}
      transform:
        STRIPPED: rewrite($TAG, rewriters=[remove-metadata])
        FIXED:
            replace:
                source: $STRIPPED
                replace: '\s*(/?>)$'
                by: ' PrivateAssets="all"$1'
      fix: $FIXED
message: Development dependency flows to every referencing project
note: Set `PrivateAssets="all"` on the reference
