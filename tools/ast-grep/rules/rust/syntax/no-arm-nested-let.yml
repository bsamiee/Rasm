# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    arm-binding:
        kind: identifier
        pattern: $BOUND
        inside: {kind: match_arm, stopBy: end, has: {field: pattern, has: {stopBy: end, kind: identifier, pattern: $BOUND, not: {inside: {kind: tuple_struct_pattern, field: type}}}}}
    binding-test:
        kind: if_expression
        all:
            - has: {field: condition, kind: let_condition, has: {field: value, any: [{matches: arm-binding}, {kind: 'unary_expression, reference_expression', has: {matches: arm-binding}}]}}
            - not: {has: {field: consequence, has: {stopBy: end, kind: identifier, pattern: $BOUND}}}
            - not: {has: {field: alternative, has: {stopBy: end, kind: identifier, pattern: $BOUND}}}
rule:
    kind: match_arm
    all:
        - matches: rust-guard-foldable-arm
        - has: {field: pattern, pattern: $P}
        - has: {field: value, any: [{kind: if_expression, has: {field: condition, pattern: $COND}}, {has: {stopBy: {kind: if_expression}, kind: if_expression, has: {field: condition, pattern: $COND}}}]}
        - not: {has: {field: value, any: [{matches: binding-test}, {has: {stopBy: end, matches: binding-test}}]}}
        - precedes: {kind: match_arm, pattern: $FALLBACK}
labels:
    P: {style: primary, message: 'Arm nesting the `if`'}
    FALLBACK: {style: secondary, message: 'Catch-all arm the `else` repeats'}
message: 'Arm `$P` nests `if $COND` with an `else` repeating the catch-all arm'
note: 'Move the condition into an arm guard, `<pattern> if <condition> => <body>`'
