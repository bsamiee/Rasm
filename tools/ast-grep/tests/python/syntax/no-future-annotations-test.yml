id: no-future-annotations
valid:
    - |
      def load(path: Path) -> Item:
          return Item(path)
    - from __future__ import barry_as_FLUFL
    - from typing import annotations
invalid:
    - |
      from __future__ import annotations

      import os
    - from __future__ import (annotations)
    - |
      from __future__ import annotations  # Lazy

      import os
    - |
      from __future__ import (
          annotations,
      )
    - from __future__ import annotations, barry_as_FLUFL
    - from __future__ import barry_as_FLUFL, annotations, generator_stop
    - |
      from __future__ import (
          annotations,
          barry_as_FLUFL,
      )
    - |
      from __future__ import annotations
      def load(value: Missing):
          return value
      annotations = load.__annotations__
