name: Deploy

on:
    # jactionlint ignore=dangerous-triggers
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    repository_dispatch:
        types: [deploy]

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    deploy:
        if: ${{ github.event_name == 'repository_dispatch' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha == github.sha) }}
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        environment: deploy
        env:
            UV_LOCKED: "true"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
            - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
            - run: pnpm install
            - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
              with:
                  oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
                  tags: tag:deploy
                  ping: ${{ vars.TAILSCALE_MACHINES }}
            - run: mkdir -p ~/.ssh && tailscale status --json | jq --raw-output '.Peer[] | .HostName as $host | .sshHostKeys[]? | "\($host) \(.)"' >> ~/.ssh/known_hosts
            - run: nx deploy @rasm/infra
              env:
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            - if: ${{ always() }}
              run: |
                  curl --fail --silent --show-error --max-time 10 --request POST --header "Authorization: Bearer ${GATUS_HEARTBEAT_TOKEN}" "${GATUS_HEARTBEAT_SERVER}/api/v1/endpoints/jobs_deploy/external?success=${{ job.status == 'success' }}"
              env:
                  GATUS_HEARTBEAT_SERVER: ${{ secrets.GATUS_HEARTBEAT_SERVER }}
                  GATUS_HEARTBEAT_TOKEN: ${{ secrets.GATUS_HEARTBEAT_TOKEN }}
