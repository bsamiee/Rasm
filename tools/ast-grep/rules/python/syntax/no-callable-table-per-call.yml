# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-callable-table-per-call
language: python
severity: error
utils:
    type-key:
        kind: identifier
        any:
            - regex: '^(bool|int|float|complex|str|bytes|bytearray|tuple|list|dict|set|frozenset|type|object)$'
            - regex: '^[A-Z]\w*$'
    string-key:
        kind: string
        not: {has: {stopBy: end, kind: interpolation}}
    bound-method:
        kind: attribute
        has: {field: object, kind: identifier, regex: '^[a-z_]\w*$'}
    callable-tuple:
        kind: tuple
        not: {has: {pattern: $_, not: {any: [{kind: lambda}, {matches: bound-method}]}}}
    closure:
        any:
            - kind: lambda
            - {matches: callable-tuple, has: {kind: lambda}}
    closure-pair:
        kind: pair
        all:
            - has: {field: key, any: [{matches: type-key}, {matches: string-key}]}
            - has: {field: value, matches: closure}
    method-pair:
        kind: pair
        all:
            - has: {field: key, matches: type-key}
            - has: {field: value, any: [{kind: lambda}, {matches: bound-method}, {matches: callable-tuple, has: {pattern: $_}}]}
rule:
    kind: dictionary
    all:
        - has: {kind: pair, nthChild: 2}
        - any:
            - not: {has: {pattern: $_, not: {any: [{matches: closure-pair}, {kind: comment}]}}}
            - not: {has: {pattern: $_, not: {any: [{matches: method-pair}, {kind: comment}]}}}
        - inside: {kind: function_definition, stopBy: end, has: {field: name, pattern: $FN}}
message: '`$FN` builds a table of closures or bound methods on every call'
note: 'Use a table of unbound functions (`{<key>: (<Type>.<read>, <Type>.<write>)}`) called with the values each closure read, a read-only module constant where two functions read it, and a local closure only where a fixed-arity callback needs one'
