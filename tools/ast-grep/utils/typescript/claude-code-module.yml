# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: claude-code-module
language: tsxlang
rule:
    kind: program
    any:
        - matches: { typescript-module-importer: { module: { regex: '^claude-code(/|$)' } } }
        - all:
              - has: { kind: export_statement, has: { kind: lexical_declaration, has: { kind: variable_declarator, has: { field: name, regex: '^meta$' } } } }
              - not: { has: { kind: import_statement } }
