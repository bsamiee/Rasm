name: Setup
description: Installs toolchain and dependencies, restores the task cache

outputs:
    task-paths:
        description: Paths the job saves into the task cache after its checks
        value: ${{ steps.tasks.outputs.paths }}
    task-key:
        description: Key the job saves the task cache under
        value: ${{ steps.tasks.outputs.key }}

runs:
    using: composite
    steps:
        - uses: nrwl/nx-set-shas@v5
        - uses: maxim-lobanov/setup-xcode@v1.7.0
          if: runner.os == 'macOS'
        - uses: jdx/mise-action@v5.2.5
          with:
            auto_update: true
            minimum_release_age: 0s
            cache_save: ${{ github.event_name == 'push' }}
        - id: stores
          run: printf 'uv=%s\npixi=%s\npnpm=%s\n' "$(uv cache dir)" "$(pixi info --json | jq -r .cache_dir)" "$(pnpm store path)" >> "$GITHUB_OUTPUT"
          shell: bash
        - id: packages
          uses: actions/cache/restore@v6
          with:
            path: |
                ~/.rustup/toolchains
                ${{ steps.stores.outputs.uv }}
                ${{ steps.stores.outputs.pixi }}
                ${{ steps.stores.outputs.pnpm }}
            key: packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'uv.lock', 'pixi.lock', 'pnpm-lock.yaml') }}
            restore-keys: packages-${{ runner.os }}-${{ runner.arch }}-
        - run: pnpm install
          shell: bash
        - run: playwright install --with-deps --only-shell chromium
          if: runner.os == 'Linux'
          shell: bash
        - run: pixi run --locked -e hdf5 pixi run --locked -e default uv sync --locked --no-default-groups --group dev
          shell: bash
        - uses: actions/cache/save@v6
          if: github.event_name == 'push' && steps.packages.outputs.cache-hit != 'true'
          with:
            path: |
                ~/.rustup/toolchains
                ${{ steps.stores.outputs.uv }}
                ${{ steps.stores.outputs.pixi }}
                ${{ steps.stores.outputs.pnpm }}
            key: ${{ steps.packages.outputs.cache-primary-key }}
        - id: cargo
          if: runner.os == 'Linux'
          run: printf 'build=%s\n' "$(realpath --relative-to=. "$(cargo metadata --format-version 1 --no-deps | jq -r .build_directory)")" >> "$GITHUB_OUTPUT"
          shell: bash
        - uses: Swatinem/rust-cache@v2.9.3
          if: runner.os == 'Linux'
          with:
            workspaces: . -> ${{ steps.cargo.outputs.build }}
            cache-on-failure: true
            save-if: ${{ github.event_name == 'push' }}
        - id: tasks
          run: nx show projects > /dev/null && printf 'database=%s\nkey=tasks-%s-%s-%s-%s\npaths<<PATHS\n.cache/nx/cache\n.cache/ast-grep\n%s/*.db\n~/.nuget/packages\n~/.dylint_drivers\nPATHS\n' "$(basename "$NX_WORKSPACE_DATA_DIRECTORY"/*.db)" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" "$NX_WORKSPACE_DATA_DIRECTORY" >> "$GITHUB_OUTPUT"
          shell: bash
        - id: restored
          uses: actions/cache/restore@v6
          with:
            path: ${{ steps.tasks.outputs.paths }}
            key: ${{ steps.tasks.outputs.key }}
            restore-keys: tasks-${{ runner.os }}-${{ runner.arch }}-
        - if: steps.restored.outputs.cache-matched-key != ''
          run: find "$NX_WORKSPACE_DATA_DIRECTORY" -maxdepth 1 -name '*.db' ! -name "$DATABASE" -exec mv {} "$NX_WORKSPACE_DATA_DIRECTORY/$DATABASE" \;
          env:
            DATABASE: ${{ steps.tasks.outputs.database }}
          shell: bash
