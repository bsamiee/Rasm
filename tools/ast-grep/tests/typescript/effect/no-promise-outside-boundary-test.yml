    - 'import Base from "@nx/js/src/release/version-actions"; const Resolved: typeof Base = normalize(Base); function build(Resolved) { class Actions extends Resolved { override async updateProjectVersion(): Promise<string[]> { return await load(); } } return Actions; }'
    - 'class Actions extends VersionActions { override async updateProjectVersion(): Promise<string[]> { return await load(); } }'
