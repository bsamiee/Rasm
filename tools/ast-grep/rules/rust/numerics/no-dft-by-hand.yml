# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-dft-by-hand
language: rust
severity: error
utils:
    turn:
        any:
            - kind: 'identifier, scoped_identifier'
              regex: '^((::)?(std|core)::)?((f32|f64)::)?(consts::)?TAU$'
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\*$'}
                - has: {kind: 'identifier, scoped_identifier', regex: '^((::)?(std|core)::)?((f32|f64)::)?(consts::)?PI$'}
                - has: {kind: 'float_literal, integer_literal, unary_expression', regex: '^(-\s*)?2(\.0*)?(_?f(32|64))?$'}
rule:
    kind: binary_expression
    pattern: $ANGLE
    all:
        - has: {field: operator, regex: '^/$'}
        - has: {field: right, not: {kind: 'float_literal, integer_literal'}}
        - has: {field: left, has: {stopBy: end, matches: turn}}
        - has:
            field: left
            has:
                stopBy: end
                kind: identifier
                pattern: $K
                inside:
                    stopBy: end
                    any:
                        - kind: for_expression
                          has: {field: pattern, any: [{pattern: $K}, {has: {stopBy: end, pattern: $K}}]}
                        - kind: closure_expression
                          has: {field: parameters, has: {stopBy: end, pattern: $K}}
        - has:
            field: left
            has:
                stopBy: end
                kind: identifier
                pattern: $N
                not: {pattern: $K}
                inside:
                    stopBy: end
                    any:
                        - kind: for_expression
                          has: {field: pattern, any: [{pattern: $N}, {has: {stopBy: end, pattern: $N}}]}
                        - kind: closure_expression
                          has: {field: parameters, has: {stopBy: end, pattern: $N}}
        - not: {matches: rust-test-scope}
message: '`$ANGLE` evaluates the DFT kernel angle over the indices `$K` and `$N` by hand'
note: 'Plan the transform once through rustfft, `FftPlanner::<f64>::new().plan_fft_forward(<len>)` (`plan_fft_inverse` for the inverse) and `process(&mut <buffer>)` over `Complex<f64>`, or realfft `RealFftPlanner::<f64>::new().plan_fft_forward(<len>)` for real input. An O(n log n) transform of any length replaces the O(n²) sum'
