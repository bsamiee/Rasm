// rasm/channels/v1/channels.proto — the corpus-homed descriptor source the DESCRIPTOR_DRIFT contract gates.
// Texture family: the TEXTURE_SET_BY_KEY document (TextureSetWire + ChannelWire/PackWire/PressReceiptWire/
// PlaneRefWire), the ASSET_SET_MANIFEST document (AssetSetManifest + MapEntry/PackEntry/IblEntry/PlaneRef),
// and the shared WireProvenance capture receipt. Field order transcribes the durable wire rosters —
// csharp:Rasm.Materials/Appearance/interchange#TEXTURE_EGRESS and python:runtime/transport/shapes#VOCABULARY —
// verbatim while numbers only append past the last, so a column landing after a frozen block reads beside the group
// it belongs to and keys past every number a peer already decodes; removals reserve name and number.
// Enum-valued columns cross as their closed-vocabulary key strings, never proto enums: the producer's roster is
// the vocabulary owner and an unknown key is a decode refusal, not a schema arm.
syntax = "proto3";

package rasm.channels.v1;

option csharp_namespace = "Rasm.Channels";

// The producer capture receipt the appearance and baked-set families share; never a second shape per document.
message WireProvenance {
  string device = 1;
  int32 wavelength_count = 2;
  double fit_residual = 3;
  bool measured = 4;
  string method = 5;
  int32 angular_samples = 6;
  double fit_condition_number = 7;
  int32 fit_rank = 8;
  double dominant_wavelength_nm = 9;
  double excitation_purity = 10;
  double cct_kelvin = 11;
  double cct_duv = 12;
  // Neural-acquisition tail: the ModelCard registry row and its licence grant class.
  string model_card = 13;
  string license = 14;
  // Chart-solve tail: the flag separating a chart-corrected capture from a camera's guess, the mean CIEDE2000
  // residual over the twenty-four measured patches, and the digest of the inferred row's own weights.
  bool calibrated = 15;
  // Explicit presence: an uncalibrated capture measured no residual, and a zero here reads to a divergence
  // gate as a perfect chart fit; mirrors optional gpu_delta_max below and the C#/python nullable ends.
  optional double calibration_delta_e = 16;
  string model_artefact = 17;
}

// C#-family address triple: ONE stored plane FILE. `blob` is ContentAddress.ToValue() — 32 UPPERCASE hex.
message PlaneRefWire {
  string file = 1;
  string blob = 2;
  uint64 byte_length = 3;
}

// Python-family address triple: `digest` is ContentKey.project("wire") — 32 lowercase hex. The two triples
// never share a message because their hex cases differ.
message PlaneRef {
  string file = 1;
  string digest = 2;
  uint64 byte_length = 3;
}

message ChannelWire {
  string role = 1;
  string transfer = 2;
  string format = 3;
  string container = 4;
  uint32 channels = 5;
  string alpha_mode = 6;
  uint32 mips = 7;
  string mip_policy = 8;
  string block_format = 9;
  string ktx_payload = 10;
  // Level-ordered under the plane-levels law: ONE entry for a self-pyramiding container whatever `mips`
  // declares, one per level otherwise with length equal to `mips`.
  repeated PlaneRefWire levels = 11;
}

message PackWire {
  string pack = 1;
  repeated bool present = 2;
  string format = 3;
  string container = 4;
  uint32 mips = 5;
  repeated PlaneRefWire levels = 6;
}

message PressReceiptWire {
  string backend = 1;
  string plan_key = 2;
  string graph_key = 3;
  uint64 seed = 4;
  uint64 texels = 5;
  double elapsed_ms = 6;
  // Explicit presence: a single-lane press measures no divergence, and a zero here reads to the parity gate as
  // a perfect match.
  optional double gpu_delta_max = 7;
  // The press's two quality tallies: the channel count whose paired mip policy fell to the box floor, and the
  // neutral-filled texel tally summed across every channel.
  uint32 downgraded = 8;
  uint64 faulted_texels = 9;
}

// The appearance-coupled BAKED set document; rides BEHIND the AppearanceKey and carries no kind discriminant.
message TextureSetWire {
  string appearance_key = 1;
  string set_key = 2;
  string material_id = 3;
  string conductor = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 layers = 7;
  string layer_law = 8;
  string normal_convention = 9;
  string alpha_mode = 10;
  double height_scale = 11;
  bool tiled = 12;
  repeated uint32 udim_tiles = 13;
  // Roster-ordered; the order IS the set-key preimage order.
  repeated ChannelWire channels = 14;
  repeated PackWire packs = 15;
  WireProvenance provenance = 16;
  PressReceiptWire press = 17;
}

message MapEntry {
  string role = 1;
  string color_space = 2;
  // The plane's own declared primaries as a khr_df_primaries_e key — the manifest-side truth a consumer checks a
  // KTX2 file's data-format descriptor against.
  string color_primaries = 11;
  string depth = 3;
  string container = 4;
  uint32 channels = 5;
  uint32 mips = 6;
  string ktx_payload = 7;
  repeated PlaneRef levels = 8;
  // Per-map producing tool and probed version: one set legitimately mixes the spawned encode floor with an
  // in-process acceleration leg.
  string tool = 9;
  string tool_version = 10;
}

message PackEntry {
  string pack = 1;
  repeated bool present = 2;
  string format = 3;
  string container = 4;
  uint32 mips = 5;
  repeated PlaneRef levels = 6;
}

message IblEntry {
  // EXACTLY 27 values, band-major with RGB interleaved at i*3+c.
  repeated double sh9 = 1;
  PlaneRef equirect = 2;
  // ONE address: the published cube is a single self-pyramiding container holding all six faces.
  PlaneRef cubemap = 10;
  // The display-referred gain-map preview; the one product whose read-side intensity is baked.
  PlaneRef preview = 11;
  repeated PlaneRef specular = 3;
  repeated double roughness_per_mip = 4;
  PlaneRef brdf_lut = 5;
  PlaneRef luminance_cdf = 6;
  double intensity = 7;
  string up_axis = 8;
  double rotation = 9;
}

// The ingest/IBL-assembled set manifest; kind discriminates pbr_set | hdri | ibl.
message AssetSetManifest {
  string manifest_key = 1;
  string kind = 2;
  string source = 3;
  uint32 width = 4;
  uint32 height = 5;
  string normal_convention = 6;
  string alpha_mode = 7;
  string udim = 8;
  repeated uint32 udim_tiles = 9;
  bool tiled = 10;
  repeated MapEntry maps = 11;
  repeated PackEntry packs = 12;
  IblEntry ibl = 13;
  repeated string unresolved = 14;
  double height_scale = 15;
  string license_class = 16;
}
