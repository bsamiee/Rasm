    inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: ';$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
