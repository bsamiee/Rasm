# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: os-log-interpolation
language: swiftlang
rule:
    kind: interpolated_expression
    not: {has: {kind: value_argument_label}}
    inside:
        kind: 'line_string_literal, multi_line_string_literal, raw_string_literal'
        stopBy: {not: {kind: raw_str_interpolation}}
        inside:
            kind: value_argument
            inside: {kind: value_arguments, inside: {kind: call_suffix, inside: {matches: os-log-call}}}
