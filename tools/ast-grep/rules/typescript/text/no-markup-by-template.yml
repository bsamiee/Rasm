# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-markup-by-template
language: tsxlang
severity: error
utils:
    constant:
        kind: template_substitution
        has:
            kind: identifier
            pattern: $CONSTANT
            inside: {kind: program, stopBy: end, has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $CONSTANT}}, {has: {field: value, kind: string}}]}}
    markup-slot:
        kind: template_substitution
        any:
            - all: [{follows: {kind: string_fragment, regex: '>$'}}, {precedes: {kind: string_fragment, regex: '^</?[A-Za-z]'}}]
            - follows: {kind: string_fragment, regex: '<[A-Za-z][^<>]*=[''"]$'}
rule:
    kind: template_string
    all:
        - has: {kind: template_substitution}
        - any:
            - all: [{regex: '^`\s*<(\?xml|![Dd][Oo][Cc][Tt][Yy][Pp][Ee])'}, {has: {kind: template_substitution, pattern: $VALUE, not: {matches: constant}}}]
            - has: {matches: markup-slot, pattern: $VALUE, not: {matches: constant}}
        - not: {inside: {kind: call_expression, field: arguments}}
message: 'Template interpolates `$VALUE` into markup'
note: 'Build the document through its format encoder: `plist.build` for a property list, `fast-xml-builder` for XML, `parse5` serialization for HTML'
