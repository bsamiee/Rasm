# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    option-match:
        kind: member_expression
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^match$'}}}
    from-undefined:
        kind: call_expression
        all:
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, pattern: $VALUE}}
            - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^fromUndefinedOr$'}}}}
    data-last-match:
        kind: call_expression
        all:
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: object}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
            - has: {field: function, matches: option-match}
rule:
    kind: call_expression
    pattern: $HAND
    any:
        - all:
            - has: {field: function, matches: option-match}
            - has: {field: arguments, all: [{has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: object}}, {has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: from-undefined}}]}
        - all:
            - has: {field: function, matches: data-last-match}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: from-undefined}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: from-undefined}}]}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: data-last-match}}
        - all:
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: from-undefined}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: data-last-match}}]}
            - has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}
message: '`$HAND` converts `$VALUE` through `Option.fromUndefinedOr` to match it'
note: 'Call `UndefinedOr.match(<value>, { onUndefined, onDefined })`'
