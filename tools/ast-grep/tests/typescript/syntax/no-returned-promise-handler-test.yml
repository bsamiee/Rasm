id: no-returned-promise-handler
valid:
    - 'async function read(tree: Tree): Promise<Manifest> { const manifest = await load(tree); return { ...manifest, currentVersion: manifest.currentVersion ?? "0.0.0" }; }'
    - 'const read = async (tree: Tree): Promise<Manifest> => { return await load(tree); };'
    - 'class Actions { override async read(tree: Tree): Promise<Manifest> { return await super.read(tree); } }'
    - 'const read = async (tree: Tree) => load(tree).then(_widen);'
    - 'async function read(tree: Tree) { return load(tree).then(_widen); }'
    - 'function read(tree: Tree) { return load(tree); }'
    - 'function read(tree: Tree) { return rows.filter(_isNative); }'
    - 'function read(tree: Tree) { return option.then; }'
    - 'function read(tree: Tree) { const later = load(tree).then(_widen); return later; }'
    - 'function read(tree: Tree) { load(tree).then(_widen); return 1; }'
    - 'function read(tree: Tree) { const later = async () => { return await load(tree); }; return later(); }'
    - 'const read = (tree: Tree) => load(tree);'
    - 'const read = (tree: Tree) => ({ then: load(tree) });'
    - 'const read = (tree: Tree) => load(tree).then(_widen);'
    - 'const run = (argv: readonly string[]) => host.run(argv).catch(abort);'
    - 'function read(tree: Tree) { return () => load(tree).then(_widen); }'
invalid:
    - 'function read(tree: Tree): Promise<Manifest> { return load(tree).then((manifest) => ({ ...manifest, currentVersion: manifest.currentVersion ?? "0.0.0" })); }'
    - 'class Actions extends Base { override read(tree: Tree): Promise<Manifest> { return super.read(tree).then(_widen); } }'
    - 'const read = (tree: Tree): Promise<Manifest> => { return load(tree).then(_widen); };'
    - 'const read = function (tree: Tree) { return load(tree).catch(_recover); };'
    - 'function read(tree: Tree) { return load(tree).finally(_release); }'
    - 'function read(tree: Tree) { return load(tree).then(_widen).catch(_recover); }'
    - 'function read(tree: Tree) { return load(tree).then(_widen, _recover); }'
    - 'function read(tree: Tree) { if (tree.exists(path)) { return load(tree).then(_widen); } return fallback(); }'
    - 'async function outer(tree: Tree) { const inner = (tree: Tree) => { return load(tree).then(_widen); }; return await inner(tree); }'
    - 'const actions = { read(tree: Tree) { return load(tree).then(_widen); } };'
    - 'function* read(tree: Tree) { return load(tree).then(_widen); }'
