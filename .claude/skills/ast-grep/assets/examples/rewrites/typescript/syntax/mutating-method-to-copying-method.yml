# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: mutating-method-to-copying-method
language: typescript
severity: off # On demand, ast-grep scan --filter '^mutating-method-to-copying-method$' --error=mutating-method-to-copying-method -U <paths>
utils:
    # Receiver no other binding holds, an array literal or the fresh array a copying method or a static constructor answers
    fresh-array:
        any:
            - kind: array
            - kind: call_expression
              has:
                  field: function
                  any:
                      - kind: member_expression
                        has:
                            field: property
                            regex: '^(map|flatMap|filter|slice|concat|toSorted|toReversed|toSpliced|with|split|keys|values|entries)$'
                      - regex: '^(Array\.from|Array\.of|Object\.keys|Object\.values|Object\.entries)$'
rule:
    matches: syntax-mutating-array-call # utils/typescript/syntax-mutating-array-call.yml, the guard every rewrite over the construct shares
    all:
        - has: {field: function, all: [{has: {field: object, pattern: $RECEIVER, matches: fresh-array}}, {has: {field: property, pattern: $METHOD}}]}
        - has: {field: arguments, pattern: $ARGS}
        # Methods with no copying counterpart keep their finding under no-array-mutation, the lint rule over every in-place write
        - not: {has: {field: function, has: {field: property, regex: '^(push|pop|shift|unshift|fill|copyWithin)$'}}}
transform:
    # One stage per method, each miss keeps the text and the next stage reads it
    SORTED: replace($METHOD, replace='^sort$', by='toSorted')
    REVERSED: replace($SORTED, replace='^reverse$', by='toReversed')
    COPYING: replace($REVERSED, replace='^splice$', by='toSpliced')
fix: $RECEIVER.$COPYING$ARGS
message: '`$METHOD` writes a fresh array in place where its copying counterpart answers the same array'
note: Sort, reverse, or splice through the copying method, `[...rows].toSorted(compare)`, and the receiver keeps its own order
