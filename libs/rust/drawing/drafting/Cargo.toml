# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-drafting"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords             = ["drafting", "annotation", "cad", "sheets"]
categories           = ["graphics"]
description          = "Drafting annotation and sheet sets: text, notation, dimensions, tolerances, leaders, marks, symbols, legends, tables, viewports, and layer tables"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
