# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-relifted-failure-match
language: csharp
severity: error
utils:
    typed-none:
        matches: csharp-none-value
        not: {regex: '^[(\s]*default[\s)]*$'}
    none-arm:
        any:
            - matches: typed-none
            - kind: lambda_expression
              all:
                - has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
                - has:
                    field: body
                    any:
                        - matches: typed-none
                        - kind: block
                          has:
                            kind: return_statement
                            nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                            has: {matches: typed-none}
    failure-group:
        regex: '^((global::)?(LanguageExt\.)?)?(Fin\s*\.\s*Fail|IO\s*\.\s*fail|Either\s*\.\s*Left|(Prelude\s*\.\s*)?(FinFail|Fail|Left))\s*<.+>$'
    failure-constructor:
        any:
            - kind: invocation_expression
              all:
                - has: {field: function, any: [{matches: failure-group}, {regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?(Fail|Left)$'}]}
                - has: {field: arguments, has: {kind: argument, pattern: $ERROR}, not: {has: {kind: argument, nthChild: 2}}}
            - kind: object_creation_expression
              all:
                - has: {field: type, regex: '^((global::)?(LanguageExt\.)?)?(Fin\s*<.+>\s*\.\s*Fail|Either\s*<.+>\s*\.\s*Left)$'}
                - has: {field: arguments, has: {kind: argument, pattern: $ERROR}, not: {has: {kind: argument, nthChild: 2}}}
            - kind: cast_expression
              all:
                - has: {field: type, regex: '^((global::)?(LanguageExt\.)?)?(Fin|Either|Validation)\s*<.+>$'}
                - has: {field: value, pattern: $ERROR}
    failure-rebuild:
        any:
            - pattern: $ERROR
            - matches: failure-constructor
    error-lambda:
        kind: lambda_expression
        has:
            field: parameters
            any:
                - kind: implicit_parameter
                  pattern: $ERROR
                - kind: parameter_list
                  has: {kind: parameter, has: {field: name, pattern: $ERROR}}
                  not: {has: {kind: parameter, nthChild: 2}}
    rebuild-body:
        any:
            - matches: failure-rebuild
            - kind: block
              has:
                kind: return_statement
                nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                has: {matches: failure-rebuild}
            - kind: arrow_expression_clause
              has: {matches: failure-rebuild}
    relay:
        kind: identifier
        pattern: $RELAY
        inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                kind: method_declaration, local_function_statement
                all:
                    - has: {field: name, pattern: $RELAY}
                    - has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $ERROR}}, not: {has: {kind: parameter, nthChild: 2}}}
                    - has: {field: body, matches: rebuild-body}
    fail-arm:
        any:
            - matches: failure-group
            - matches: error-lambda
              has: {field: body, matches: rebuild-body}
            - matches: relay
    constructor-fail-arm:
        any:
            - matches: failure-group
            - matches: error-lambda
              has:
                field: body
                any:
                    - matches: failure-constructor
                    - kind: block
                      has:
                        kind: return_statement
                        nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                        has: {matches: failure-constructor}
    relift-argument:
        kind: argument
        has: {nthChild: {position: 1, reverse: true}, any: [{matches: none-arm}, {matches: fail-arm}]}
    positional:
        kind: argument
        not: {has: {field: name, pattern: $_}}
    member-match:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Match(\s*<.+>)?$'}}, {has: {field: expression, pattern: $VALUE}}]}
            - has: {field: arguments, all: [{has: {kind: argument, nthChild: 2}}, {not: {has: {kind: argument, nthChild: 3}}}]}
    prelude-match:
        kind: invocation_expression
        all:
            - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\.)?match(\s*<.+>)?$'}
            - has: {field: arguments, all: [{has: {kind: argument, nthChild: 3}}, {not: {has: {kind: argument, nthChild: 4}}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: positional, has: {pattern: $VALUE}}}
rule:
    kind: invocation_expression
    any:
        - all:
            - matches: member-match
            - has: {field: arguments, has: {matches: relift-argument, has: {field: name, regex: '^(None|Fail|Left)$'}}}
        - all:
            - matches: member-match
            - has: {field: arguments, has: {kind: argument, has: {field: name, regex: '^(Some|Succ|Right)$'}}}
            - has: {field: arguments, has: {matches: positional, all: [{matches: relift-argument}]}}
        - all:
            - matches: member-match
            - not: {has: {field: arguments, has: {kind: argument, not: {matches: positional}}}}
            - any:
                - has: {field: arguments, has: {kind: argument, nthChild: 2, has: {any: [{matches: none-arm}, {matches: constructor-fail-arm}]}}}
                - has:
                    field: arguments
                    all:
                        - has: {kind: argument, nthChild: 1, has: {matches: constructor-fail-arm, not: {has: {field: body, kind: cast_expression}}}}
                        - not: {has: {kind: argument, nthChild: 2, has: {kind: lambda_expression, has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}}}}
        - all:
            - matches: prelude-match
            - has: {field: arguments, has: {matches: relift-argument, has: {field: name, regex: '^None$'}}}
        - all:
            - matches: prelude-match
            - not: {has: {field: arguments, has: {kind: argument, not: {matches: positional}}}}
            - has: {field: arguments, has: {kind: argument, nthChild: 3, has: {matches: none-arm}}}
        - pattern: {context: 'class C { object F() => $VALUE.Map($CONTINUE).IfNone($ABSENT); }', selector: invocation_expression, strictness: cst}
        - pattern: {context: 'class C { object F() => $VALUE.Map($CONTINUE).$UNWRAP($REFAIL); }', selector: invocation_expression, strictness: cst}
constraints:
    UNWRAP: {regex: '^If(Fail|Left)$'}
    ABSENT: {kind: argument, has: {matches: none-arm}}
    REFAIL:
        kind: argument
        has: {matches: fail-arm}
        not: {has: {stopBy: end, regex: '^((global::)?(LanguageExt\.)?)?IO\s*\.\s*fail'}}
message: '`$VALUE` is matched to rebuild the `None`, `Left`, or failure case it holds'
note: Use `Bind(<continuation>)`, `Map` where the continuation wraps a plain value, and `IO.lift(<fin>).Bind(<continuation>)` where it returns an effect, each passes the failure through unchanged
