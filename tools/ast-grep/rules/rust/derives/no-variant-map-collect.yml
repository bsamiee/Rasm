# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-variant-map-collect
language: rust
severity: error
utils:
    every-variant:
        kind: call_expression
        any:
            - pattern: $E::iter()
            - pattern: $E::VARIANTS.iter()
            - pattern: $E::VARIANTS.into_iter()
            - pattern: $E::VARIANTS.iter().copied()
    keyed-pair:
        kind: closure_expression
        all:
            - has: {field: parameters, has: {any: [{kind: identifier, pattern: $V}, {kind: reference_pattern, has: {kind: identifier, pattern: $V}}]}}
            - has: {field: body, kind: tuple_expression, has: {nthChild: 1, any: [{pattern: $V}, {pattern: '*$V'}]}}
    variant-pairs:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^map$'}}, {has: {field: value, matches: every-variant}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: keyed-pair}}
    map-type:
        regex: '^((std::)?collections::)?BTreeMap\b'
rule:
    kind: call_expression
    pattern: $SITE
    all:
        - has: {field: function, any: [{kind: field_expression, has: {field: value, matches: variant-pairs}}, {kind: generic_function, has: {field: function, kind: field_expression, has: {field: value, matches: variant-pairs}}}]}
        - any:
            - has: {field: function, kind: generic_function, all: [{has: {field: function, has: {field: field, regex: '^collect$'}}}, {has: {field: type_arguments, has: {nthChild: 1, any: [{matches: map-type}, {kind: generic_type, has: {field: type, matches: map-type}}]}}}]}
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^collect$'}}
                - inside: {kind: let_declaration, field: value, has: {field: type, kind: generic_type, has: {field: type, matches: map-type}}}
constraints:
    E: {regex: '^[A-Z]\w*$'}
message: '`$SITE` collects a `BTreeMap` holding one entry per variant of `$E`'
note: 'Derive `enum_map::Enum` on `<enum>` and build `enum_map::EnumMap::from_fn(|<variant>| <value>)` or `enum_map::enum_map! { <variant> => <value>, .. }`, an `EnumMap` holds one value per variant by type and reads with no missing-key case. The `split_table` dylint owns a map built from an array literal listing every variant'
