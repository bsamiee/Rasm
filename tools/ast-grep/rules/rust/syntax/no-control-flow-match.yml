# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-control-flow-match
language: rust
severity: error
utils:
    break-variant:
        regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Break$'
    continue-variant:
        regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Continue$'
    empty-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, not: {has: {field: condition, pattern: $_}}}
            - has: {field: value, regex: '^None$'}
    two-arms:
        kind: match_block
        all:
            - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
            - not: {has: {nthChild: 3}}
    break-ok:
        all:
            - has: {matches: {rust-rewrap-arm: {variant: {matches: break-variant}, wrapper: {regex: '^Ok$'}}}}
            - has: {matches: {rust-rewrap-arm: {variant: {matches: continue-variant}, wrapper: {regex: '^Err$'}}}}
    continue-ok:
        all:
            - has: {matches: {rust-rewrap-arm: {variant: {matches: continue-variant}, wrapper: {regex: '^Ok$'}}}}
            - has: {matches: {rust-rewrap-arm: {variant: {matches: break-variant}, wrapper: {regex: '^Err$'}}}}
    break-value:
        all:
            - has: {matches: {rust-rewrap-arm: {variant: {matches: break-variant}, wrapper: {regex: '^Some$'}}}}
            - has: {matches: empty-arm}
    continue-value:
        all:
            - has: {matches: {rust-rewrap-arm: {variant: {matches: continue-variant}, wrapper: {regex: '^Some$'}}}}
            - has: {matches: empty-arm}
rule:
    kind: match_expression
    all:
        - has: {field: value, pattern: $CF}
        - has:
            field: body
            matches: two-arms
            any:
                - {matches: break-ok, pattern: $BREAK_OK}
                - {matches: continue-ok, pattern: $CONTINUE_OK}
                - {matches: break-value, pattern: $BREAK_VALUE}
                - {matches: continue-value, pattern: $CONTINUE_VALUE}
transform:
    BREAK_OK_NAME: {replace: {source: $BREAK_OK, replace: '^[\s\S]+$', by: 'break_ok'}}
    CONTINUE_OK_NAME: {replace: {source: $CONTINUE_OK, replace: '^[\s\S]+$', by: 'continue_ok'}}
    BREAK_VALUE_NAME: {replace: {source: $BREAK_VALUE, replace: '^[\s\S]+$', by: 'break_value'}}
    CONTINUE_VALUE_NAME: {replace: {source: $CONTINUE_VALUE, replace: '^[\s\S]+$', by: 'continue_value'}}
fix: $CF.$BREAK_OK_NAME$CONTINUE_OK_NAME$BREAK_VALUE_NAME$CONTINUE_VALUE_NAME()
message: '`match` on `$CF` rewraps each `ControlFlow` payload unchanged'
note: 'Call `<control flow>.break_ok()` or `.continue_ok()` for a `Result`, and `.break_value()` or `.continue_value()` for an `Option`, each converts the payload with no `match`'
