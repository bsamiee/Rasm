    has: {field: name, pattern: $NAME}
    not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}
rewriters:
    - id: body
      rule: {kind: block, inside: {pattern: $DECLARATION}}
      fix: ''
transform:
