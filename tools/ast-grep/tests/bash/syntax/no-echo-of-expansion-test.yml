id: no-echo-of-expansion
valid:
    - echo "${#value}"
    - echo "${#@}"
    - printf '%s\n' "$value"
    - runner echo "$value"
    - builtin printf '%s\n' "$value"
    - echo plain text
    - echo "quoted literal"
    - echo
    - echo '$literal'
    - echo $((1 + 2))
    - echo "${#values[@]}"
    - echo "$#"
    - echo "$?"
    - echo "$$"
    - echo "$!"
    - echo "$((1 + 2))"
    - echo "${#value} lines"
    - echo "${#first}${#second}"
    - echo $RANDOM
    - echo "$SECONDS"
    - echo "${UID}"
    - echo "$EUID $PPID $BASHPID $LINENO $SHLVL $OPTIND $HISTCMD $SRANDOM $BASH_SUBSHELL $EPOCHSECONDS $EPOCHREALTIME"
invalid:
    - echo "${!name}"
    - echo "${value#$prefix}"
    - echo "${value#prefix}"
    - echo "${#values[@]}$suffix"
    - echo "${value}"
    - echo $value
    - echo "${value:-default}"
    - echo "prefix$value"suffix
    - echo "$(produce)"
    - echo "$@"
    - echo "${values[@]}"
    - echo "${!prefix@}"
    - echo "${values[0]}"
    - echo -neE "$value"
    - echo -- "$value"
    - echo literal "$value"
    - echo "$value" >&2
    - builtin echo "$value"
    - command echo "$value"
    - \echo "$value"
    - echo "$RANDOM$suffix"
    - echo "${RANDOM:-0}"
    - echo "$RANDOMIZER"
    - echo "${values[RANDOM]}"
    - time echo "$value"
