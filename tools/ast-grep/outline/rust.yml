    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
