# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-property-rust
language: rustlang
severity: error
utils:
    inherent-method:
        inside:
            kind: declaration_list
            inside:
                kind: impl_item
                all:
                    - not: {has: {field: trait, pattern: $_}}
                    - has: {field: type, any: [{kind: generic_type, has: {field: type, pattern: $TYPE}}, {pattern: $TYPE}]}
    self-field:
        kind: field_expression
        all:
            - has: {field: value, kind: self}
            - has: {field: field, pattern: $F}
    field-read:
        any:
            - matches: self-field
            - kind: reference_expression
              has: {field: value, matches: self-field}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(clone|as_ref|as_deref|as_str|as_slice)$'}}, {has: {field: value, matches: self-field}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
    sole:
        kind: block
        not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
    reachable-visibility:
        kind: visibility_modifier
        any:
            - regex: '^pub$'
            - pattern: $VIS
              inside:
                kind: 'source_file, declaration_list, block'
                stopBy: {kind: 'source_file, declaration_list, block'}
                has:
                    kind: impl_item
                    all:
                        - has: {field: type, any: [{kind: generic_type, has: {field: type, pattern: $TYPE}}, {pattern: $TYPE}]}
                        - has: {field: body, has: {kind: function_item, all: [{has: {field: name, pattern: $NAME}}, {has: {kind: visibility_modifier, pattern: $VIS}}]}}
    public-field:
        inside:
            kind: declaration_list
            inside:
                kind: impl_item
                inside:
                    kind: 'source_file, declaration_list, block'
                    has:
                        kind: struct_item
                        all:
                            - has: {field: name, pattern: $TYPE}
                            - has:
                                field: body
                                any:
                                    - has: {kind: field_declaration, all: [{has: {field: name, pattern: $F}}, {has: {matches: reachable-visibility}}]}
                                    - kind: ordered_field_declaration_list
                                      not:
                                        has:
                                            pattern: $_
                                            all:
                                                - not: {kind: 'visibility_modifier, attribute_item, line_comment, block_comment'}
                                                - not: {follows: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: reachable-visibility}}
    assigned-parameter:
        kind: expression_statement
        has:
            kind: assignment_expression
            all:
                - has: {field: left, matches: self-field}
                - has: {field: right, kind: identifier, pattern: $P}
    setter-parameters:
        all:
            - has: {kind: self_parameter, has: {kind: mutable_specifier}}
            - has: {kind: parameter, has: {field: pattern, pattern: $P}}
            - not: {has: {kind: parameter, nthChild: {position: 2, ofRule: {kind: parameter}}}}
    tuple-field:
        not: {kind: 'visibility_modifier, attribute_item, line_comment, block_comment'}
    newtype:
        kind: struct_item
        all:
            - has: {field: name, pattern: $WRAPPER}
            - has:
                field: body
                any:
                    - kind: field_declaration_list
                      all: [{has: {kind: field_declaration}}, {not: {has: {nthChild: {position: 2, ofRule: {kind: field_declaration}}}}}]
                    - kind: ordered_field_declaration_list
                      all: [{has: {matches: tuple-field}}, {not: {has: {nthChild: {position: 2, ofRule: {matches: tuple-field}}}}}]
    forwarded-field:
        any:
            - {kind: field_expression, has: {field: value, kind: self}}
            - {kind: reference_expression, has: {field: value, kind: field_expression, has: {field: value, kind: self}}}
    passed-argument:
        any:
            - kind: identifier
            - {kind: reference_expression, has: {field: value, kind: identifier}}
    same-name-call:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, pattern: $FORWARDED}}, {has: {field: value, matches: forwarded-field}}]}
                - has: {field: arguments, not: {has: {pattern: $_, not: {matches: passed-argument}}}}
            - all:
                - has: {field: function, kind: scoped_identifier, has: {field: name, pattern: $FORWARDED}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: forwarded-field}}, {not: {has: {pattern: $_, not: {any: [{matches: passed-argument}, {matches: forwarded-field}]}}}}]}
    same-name-forward:
        kind: function_item
        all:
            - has: {field: name, pattern: $FORWARDED}
            - has: {field: body, matches: sole, has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, any: [{matches: same-name-call}, {kind: expression_statement, has: {matches: same-name-call}}]}}
    constructor:
        kind: function_item
        all:
            - not: {has: {field: parameters, has: {kind: self_parameter}}}
            - has:
                field: body
                matches: sole
                has:
                    nthChild: {position: 1, ofRule: {matches: rust-statement}}
                    any:
                        - pattern: Self($ARGUMENT)
                        - pattern: $WRAPPER($ARGUMENT)
                        - {kind: struct_expression, has: {field: name, regex: '^Self$'}}
                        - {kind: struct_expression, has: {field: name, pattern: $WRAPPER}}
    wrapper-type:
        any:
            - {kind: type_identifier, pattern: $WRAPPER}
            - {kind: generic_type, has: {field: type, pattern: $WRAPPER}}
    trait-impl-method:
        kind: impl_item
        all:
            - has: {field: trait, pattern: $_}
            - has: {field: type, matches: wrapper-type}
            - has: {field: body, has: {kind: function_item}}
    forwarding-newtype-impl:
        kind: impl_item
        all:
            - not: {has: {field: trait, pattern: $_}}
            - has: {field: type, matches: wrapper-type}
            - has: {field: body, all: [{not: {has: {kind: function_item, not: {any: [{matches: same-name-forward}, {matches: constructor}]}}}}, {has: {kind: function_item, matches: same-name-forward}}]}
            - inside: {kind: 'source_file, declaration_list, block', all: [{has: {matches: newtype}}, {not: {has: {matches: trait-impl-method}}}]}
rule:
    kind: function_item
    all:
        - has: {field: name, pattern: $NAME}
        - matches: inherent-method
        - not: {matches: rust-trait-impl-or-extern-function}
        - any:
            - all:
                - has: {field: parameters, has: {kind: self_parameter, not: {has: {kind: mutable_specifier}}}, not: {has: {kind: parameter}}}
                - has: {field: body, matches: sole, has: {matches: field-read}}
                - matches: public-field
                - not: {inside: {kind: declaration_list, inside: {kind: impl_item, matches: forwarding-newtype-impl}}}
            - all:
                - has: {field: parameters, matches: setter-parameters}
                - has: {field: body, matches: sole, has: {matches: assigned-parameter}}
                - matches: public-field
            - all:
                - has: {field: parameters, matches: setter-parameters}
                - has:
                    field: body
                    all:
                        - has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, matches: assigned-parameter}
                        - has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}, kind: self}
                        - not: {has: {nthChild: {position: 3, ofRule: {matches: rust-statement}}}}
                - matches: public-field
message: 'Method `$NAME` reads or writes field `$F` of `$TYPE` unchanged'
note: 'Read or assign the field at each use and build values with a struct literal or `..<base>` update'
