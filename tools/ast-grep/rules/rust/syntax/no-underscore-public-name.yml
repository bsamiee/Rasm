# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: 'function_item, function_signature_item, struct_item, enum_item, union_item, trait_item, const_item, static_item, type_item, mod_item'
    all:
        - has: {kind: visibility_modifier, regex: '^pub$'}
        - has: {field: name, regex: '^_\p{XID_Continue}', pattern: $NAME}
message: '`$NAME` marks a public item private by a leading underscore'
note: 'Remove the underscore, narrowing an item its crate alone reads to `pub(crate)` or `pub(super)`'
