# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    variant:
        kind: scoped_identifier
        has: {field: path, kind: identifier, pattern: $E}
    name:
        kind: string_literal
        regex: '^"[A-Za-z][\p{XID_Continue}-]*( [\p{XID_Continue}-]+)*"$'
    named-pair:
        kind: tuple_expression
        all:
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
            - any:
                - all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: name}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: variant}}]
                - all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: variant}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: name}}]
rule:
    kind: array_expression
    all:
        - has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: named-pair}
        - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}
        - not: {has: {pattern: $_, not: {matches: named-pair}}}
        - not: {has: {kind: tuple_expression, has: {kind: scoped_identifier, pattern: $V}, precedes: {stopBy: end, kind: tuple_expression, has: {kind: scoped_identifier, pattern: $V}}}}
        - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $E}}}
        - pattern: $TABLE
transform:
    HEAD: {replace: {source: $TABLE, replace: '(?s)^\[\p{Pattern_White_Space}*([^\n]*?)\p{Pattern_White_Space}*\n.*$', by: '[$1 ..]'}}
message: '`$HEAD` pairs each variant of `$E` with its name by hand'
note: 'Derive `strum::EnumString`, `IntoStaticStr`, and `EnumIter` with `#[strum(serialize = "<text>")]` per variant'
