# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-arrow
language: tsx
severity: error
utils:
    # Parameter that keeps its position as a name, a default, a rest, a destructuring, or an optional marker changes the call
    plain-parameter:
        kind: required_parameter
        has: {field: pattern, kind: identifier}
        not: {has: {field: value, pattern: $_}}
    # Namespace or class path, a capitalized root without an underscore, a lowercase or upper snake case root is a value and its method binds this
    namespace-path:
        any:
            - kind: identifier
              regex: '^[A-Z][A-Za-z0-9]*$'
              # Promise and typed array statics read this as the constructor and throw unbound, Array.from and Object.keys run unbound
              not: {regex: '^(Promise|(Int8|Uint8|Uint8Clamped|Int16|Uint16|Int32|Uint32|Float16|Float32|Float64|BigInt64|BigUint64)Array)$'}
            - kind: member_expression
              has: {field: object, matches: namespace-path}
    # Callee the point-free form names as written, a name or a namespace path, a this, a value, or a call object binds at the call alone
    named-callee:
        any:
            - kind: identifier
            - kind: member_expression
              has: {field: object, matches: namespace-path}
    # The call as the expression body, or as the one return of a block body, both forward and both take the callee itself
    forwarding-body:
        any:
            - kind: call_expression
            - kind: statement_block
              has: {kind: return_statement, has: {kind: call_expression}}
              not: {has: {nthChild: 2}}
rule:
    kind: arrow_function
    all:
        - not: {has: {regex: '^async$'}}
        # Type predicates and assertions name the narrowing the callee alone cannot state
        - not: {has: {field: return_type, any: [{kind: type_predicate_annotation}, {kind: asserts_annotation}]}}
        - has: {field: body, matches: forwarding-body}
        # The first parameter binds as the earliest plain one and the later ones by position
        - any:
              # No parameter and a call with no argument, the thunk defers what the callee itself defers
              - all:
                    - not: {has: {field: parameters, has: {pattern: $_}}}
                    - not: {has: {field: parameter, kind: identifier}}
                    - has:
                          field: body
                          any:
                              - pattern: $F()
                              - kind: statement_block
                                has: {kind: return_statement, has: {pattern: $F()}}
              - all:
                    - any:
                          - has:
                                field: parameters
                                has: {matches: plain-parameter, has: {field: pattern, pattern: $A}}
                                not: {has: {nthChild: 2}}
                          # One parameter without parentheses sits in the parameter field
                          - has: {field: parameter, kind: identifier, pattern: $A}
                    # The arity-pinned call re-matches each name in order and refuses a further argument or a type argument the point-free form drops
                    - has:
                          field: body
                          any:
                              - pattern: $F($A)
                              - kind: statement_block
                                has: {kind: return_statement, has: {pattern: $F($A)}}
              - all:
                    - has:
                          field: parameters
                          all:
                              - has: {matches: plain-parameter, has: {field: pattern, pattern: $A}}
                              - has: {nthChild: 2, matches: plain-parameter, has: {field: pattern, pattern: $B}}
                          not: {has: {nthChild: 3}}
                    - has:
                          field: body
                          any:
                              - pattern: $F($A, $B)
                              - kind: statement_block
                                has: {kind: return_statement, has: {pattern: '$F($A, $B)'}}
              - all:
                    - has:
                          field: parameters
                          all:
                              - has: {matches: plain-parameter, has: {field: pattern, pattern: $A}}
                              - has: {nthChild: 2, matches: plain-parameter, has: {field: pattern, pattern: $B}}
                              - has: {nthChild: 3, matches: plain-parameter, has: {field: pattern, pattern: $C}}
                          not: {has: {nthChild: 4}}
                    - has:
                          field: body
                          any:
                              - pattern: $F($A, $B, $C)
                              - kind: statement_block
                                has: {kind: return_statement, has: {pattern: '$F($A, $B, $C)'}}
constraints:
    F:
        matches: named-callee
        # A parameter applied to itself is a value bound at the call, the point-free form has no callee to name
        not:
            inside:
                kind: arrow_function
                stopBy: {kind: arrow_function}
                any:
                    - has: {field: parameters, has: {has: {field: pattern, pattern: $F}}}
                    - has: {field: parameter, pattern: $F}
message: The arrow forwards its parameters unchanged to one call and adds a name for the callee
note: >-
    Pass the callee itself, `Array.map(rows, decode)`, and keep the arrow with `// ast-grep-ignore: no-forwarding-arrow`
    naming the optional trailing parameter of the callee the caller fills
