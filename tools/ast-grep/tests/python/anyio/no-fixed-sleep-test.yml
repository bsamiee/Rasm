id: no-fixed-sleep
valid:
    # The corrected form, the condition awaited
    - |
      async def wait(process):
          await process.wait()
    # Another member of the time module
    - |
      import time

      start = time.perf_counter()
    # Attribute named like the member on another object
    - |
      clock.sleep(1)
    # Delay a value computes, the near miss of the fixed-delay arm
    - |
      import anyio

      async def wait(delay):
          await anyio.sleep(delay)
    # Zero, the checkpoint that stands for no wait
    - |
      import anyio

      async def wait():
          await anyio.sleep(0)
    # Another member of anyio over a literal
    - |
      import anyio

      async def wait():
          await anyio.sleep_until(5)
    # Imported name over a computed delay
    - |
      from anyio import sleep

      async def wait(delay):
          await sleep(delay * 2)
    # Float zero, the checkpoint spelled as a float
    - |
      import anyio

      async def wait():
          await anyio.sleep(0.0)
    # Sleep imported from another module
    - |
      from clock import sleep

      async def wait():
          await sleep(3)
    # Another member imported from anyio over a literal
    - |
      from anyio import sleep_until

      async def wait():
          await sleep_until(5)
    # Local name a value computes, one node past the module-level binding
    - |
      import anyio

      async def wait(base):
          delay = base * 2
          await anyio.sleep(delay)
    # Sleep of another async module over a literal
    - |
      import trio

      async def wait():
          await trio.sleep(1)
    # Alias the import binds to another module
    - |
      import clock as t

      t.sleep(1)
    # Literal result of asyncio.sleep beside a computed delay
    - |
      import asyncio

      async def wait(delay):
          await asyncio.sleep(delay, "done")
    # Result keyword over a literal beside a computed delay
    - |
      import asyncio

      async def wait(delay):
          await asyncio.sleep(delay, result=5)
    # Zero as the delay keyword
    - |
      import asyncio

      async def wait():
          await asyncio.sleep(delay=0)
invalid:
    # The instance, sleep imported from the module
    - |
      from time import sleep
    # The attribute read as spelled
    - |
      import time

      time.sleep(1)
    # The attribute read through the alias the import binds
    - |
      import time as t

      t.sleep(1)
    # The member second in a from-import of two names, under an alias
    - |
      from time import perf_counter, sleep as pause
    # The thread-blocking sleep over a computed delay, blocking whatever the argument
    - |
      import time

      def wait(delay):
          time.sleep(delay)
    # The awaited sleep over a literal before a read
    - |
      import anyio

      async def wait(path):
          await anyio.sleep(100)
          return path.read_text()
    # The awaited sleep over a module-level name
    - |
      import anyio

      _SETTLE = 100

      async def wait():
          await anyio.sleep(_SETTLE)
    # The asyncio spelling over a float
    - |
      import asyncio

      async def wait():
          await asyncio.sleep(2.5)
    # The imported name over a literal
    - |
      from anyio import sleep

      async def wait():
          await sleep(3)
    # The delay keyword over a literal
    - |
      import anyio

      async def wait():
          await anyio.sleep(delay=5)
    # The anyio attribute read through the alias the import binds
    - |
      import anyio as aio

      async def wait():
          await aio.sleep(1)
    # The imported name under an alias
    - |
      from anyio import sleep as pause

      async def wait():
          await pause(2)
    # The awaited sleep over a name a from-import binds at module level
    - |
      import anyio
      from settings import SETTLE

      async def wait():
          await anyio.sleep(SETTLE)
    # The awaited sleep over a module-level attribute, a second import before the read binding
    - |
      import anyio
      import settings

      async def wait():
          await anyio.sleep(settings.SETTLE)
    # Literal delay beside a result, the first positional alone decides
    - |
      import asyncio

      async def wait():
          await asyncio.sleep(1, "done")
