id: no-filter-over-lifted-value
valid:
    - 'import * as O from "effect/Option\u002fother"; O.filter(O.some(input), predicate);'
    - 'import { Option } from "effect"; Option.filter(Option.some<number | string>(1), x => true);'
    - 'import { Option } from "effect"; Option.filter(Option.some(input), /* preserve */ predicate);'
    - 'import { Micro as Effect } from "effect"; const value = Effect.filterOrFail(Effect.succeed(input), predicate, failure);'
    - 'import { Option as Either } from "effect"; const value = Either.filterOrLeft(Either.right(input), predicate, failure);'
    - 'import { Option, flow as pipe } from "effect"; const value = pipe(Option.some(input), Option.filter(predicate));'
    - 'import { Option } from "effect"; import { pipe } from "another"; const value = pipe(Option.some(input), Option.filter(predicate));'
    - 'import * as O from "Option"; const value = O.filter(O.some(input), predicate);'
    - 'import { Option as pipe } from "effect/Function"; const value = pipe.filter(pipe.some(input), predicate);'
    - 'import { Effect } from "effect/Function"; const value = Effect.filterOrFail(Effect.succeed(input), predicate, failure);'
    - "import { Effect, Either, Option, pipe } from 'effect'; const checked = Effect.liftPredicate(report, (held) => held.verdict !== 'regression', () => error);"
    - "import { Effect, Either, Option, pipe } from 'effect'; const checked = Effect.filterOrFail(load(name), (held) => held.verdict !== 'regression', () => error);"
    - 'import { Effect, Either, Option, pipe } from "effect"; const named = Option.filter(Option.fromNullable(name), String.isNonEmpty);'
    - "import { Effect, Either, Option, pipe } from 'effect'; const checked = Effect.filterOrDie(Effect.succeed(report), (held) => held.ok, () => new Error('rejected'));"
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Micro.filterOrFail(Micro.succeed(report), (held) => held.ok, () => error);'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Effect.succeed(report).pipe(Effect.map(summarize), Effect.filterOrFail((held) => held.ok, () => error));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Effect.filterOrElse(Effect.succeed(report), (held) => held.ok, () => load(name));'
    - "const value = Option.filter(Option.some(input), predicate);"
    - 'import { Option } from "other"; const value = Option.filter(Option.some(input), predicate);'
    - 'import { Option } from "effect"; function f(Option: Local) { return Option.filter(Option.some(input), predicate); }'
    - 'import { Option } from "effect"; const pipe = customPipe; const value = pipe(Option.some(input), Option.filter(predicate));'
    - 'import type { Option } from "effect"; const value = Option.filter(Option.some(input), predicate);'
    - 'import { type Option } from "effect"; const value = Option.filter(Option.some(input), predicate);'
    - 'import { Either as Option } from "effect"; const value = Option.filter(Option.some(input), predicate);'
    - 'import { Effect } from "effect"; const checked = Effect.filterOrFail(Effect.succeed(report), (held) => held.ok);'
invalid:
    - 'import { Option, pipe } from "effect"; const value = pipe(Option.some(input), Option.filter(predicate), factory());'
    - 'import { Either, pipe } from "effect"; const value = pipe(Either.right(input), Either.filterOrLeft(predicate, failure), factory());'
    - 'import { Option } from "effect"; import { pipe as flow } from "effect/Function"; const value = flow(Option.some(input), Option.filter(predicate), factory());'
    - 'import { Option as O } from "effect"; const value = O.filter(O.some(input), predicate);'
    - 'import * as E from "effect/Effect"; const value = E.succeed(input).pipe(E.filterOrFail(predicate, failure), E.map(render));'
    - 'import { Either as E, pipe as flow } from "effect/index"; const value = flow(E.right(input), E.filterOrLeft(predicate, failure));'
    - "import { Effect, Either, Option, pipe } from 'effect'; const checked = Effect.filterOrFail(Effect.succeed(report), (held) => held.verdict !== 'regression', () => error);"
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Effect.succeed(report).pipe(Effect.filterOrFail((held) => held.ok, () => error));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = pipe(Effect.succeed(report), Effect.filterOrFail((held) => held.ok, () => error));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Effect.succeed(report).pipe(Effect.filterOrFail((held) => held.ok, () => error), Effect.map(summarize));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = pipe(Effect.succeed(report), Effect.filterOrFail((held) => held.ok, () => error), Effect.map(summarize));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Either.filterOrLeft(Either.right(report), (held) => held.ok, () => left);'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Either.right(report).pipe(Either.filterOrLeft((held) => held.ok, () => left));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = pipe(Either.right(report), Either.filterOrLeft((held) => held.ok, () => left));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = pipe(Either.right(report), Either.filterOrLeft((held) => held.ok, () => left), Either.map(summarize));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const named = Option.filter(Option.some(name), String.isNonEmpty);'
    - 'import { Effect, Either, Option, pipe } from "effect"; const named = Option.some(name).pipe(Option.filter(String.isNonEmpty));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const named = pipe(Option.some(name), Option.filter(String.isNonEmpty));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const named = pipe(Option.some(name), Option.filter(String.isNonEmpty), Option.map(String.trim));'
    - 'import { Option } from "effect"; const value = Option.some(input).pipe(Option.filter(predicate), factory());'
    - 'import { Effect, Either, Option, pipe } from "effect"; const checked = Either.right(report).pipe(Either.filterOrLeft((held) => held.ok, () => left), Either.map(summarize));'
    - 'import { Effect, Either, Option, pipe } from "effect"; const named = Option.some(name).pipe(Option.filter(String.isNonEmpty), Option.map(String.trim));'
    - 'import { Option } from "effect"; const named = Option.some(name).pipe(Option.filter(String.isNonEmpty), Option.map(String.trim), Option.getOrElse(() => ""));'
