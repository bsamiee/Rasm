            - Refuted standing claim, banned verbatim at every severity: "Processing flow bridges failures through a NaN sentinel into Brent.TryFindRoot" — the current fold is Fin-railed bounded bisection naming the NaN bridge only as its forbidden form, and a banned-form name a page quotes re-minted as the live defect is the standing re-review false-positive engine.
            - Host rollback and custody choreography: where clear-all is the host's only rollback member, the owner's journal turns batch failure into clear-and-replay; unclonable host state stages on the host-supplied copy — prove there, then commit — with the inverse misread the standing false positive: a duplicate-revise-then-commit flow mutates only a detached copy and publishes through the table's commit member, so the mutation target verifies as the live object before any live-mutation or partial-mutation flag; raw multi-product host output converts to owned handles at the continuation head so rollback releases through handle custody, and a host product minted mid-pipeline rides an owned lease through every downstream stage, disposed on every failure path including completed-prefix release; host setter mutation and restoration fold one ordered vocabulary of setter delegates; index and identity admission validates against live table counts, uniqueness and required-result rules in one family, sentinels explicitly admitted.

            - Pinned-substrate semantics carry inverse defects worth hunting: Schedule union (|) runs to the longer operand so a finite curve unioned onto an infinite one is not bounded — intersect (&) or a cumulative-delay gate is — while retry wraps each attempt in a fail-only scope and repeat wraps every iteration unconditionally, so a repeated computation can never acquire and return a live resource; Fin<T> failures all equal each other and hash to one constant, so a set or dictionary keyed on Fin coalesces failures and the projected scalar discriminant is the demanded key; and TraverseM's trait-default delegates to applicative traverse, serializing independent effects under a monadic name.
            - guard returns Guard<Error, Unit> bound through per-rail SelectMany — a bare guard(...) arm or guard(...).Map(...) is a compile fiction, and implicit Error to Validation widening fires only in a target-typed position.
            - default(ImmutableArray<T>) is a distinct throwing state, and a RandomAccess.ReadAsync short return is a malformed-frame fault, never a silent partial.

            - Enum.IsDefined is a double admission trap: the non-generic overload throws ArgumentException whenever the boxed probe's type mismatches the enum's underlying type — an int probe over a byte- or short-backed host enum compiles and then crashes the happy path — and every unnamed [Flags] combination reports undefined, so enum admission routes through Enum.ToObject or the generic overload plus a name round-trip for combinable rosters.
            - A host-subclass override of a concrete virtual whose base carries default rendering or behavior — OnDraw, OnPaint, and kin — chains the base call before its own advice, or the native visual silently erases and a default-only instance renders blank.
            - A [UseDelegateFromConstructor] member stays an unimplemented partial declaration — an authored body bypasses the constructor-supplied delegate and mints illusory behavior; a lifecycle-gate read guarding an effectful entrypoint executes inside the deferred effect body, never at composition time; a bounded fixpoint iteration is a Range.Fold, never a Schedule; and a foreign wall-clock stamp with no zone evidence crosses as NodaTime LocalDateTime/LocalDate, never a fabricated UTC Instant.

            - LanguageExt.HashSet is the immutable persistent carrier whose update operations return values — a mutable-BCL reading of it is a false positive, and namespace qualification is the standing recurrence guard; steps converted to Validation before Traverse accumulate every failure with ToFin following the complete traversal, so a first-failure short-circuit claim against that shape is false; and Fin's Bind/Map/TraverseM evaluate strictly inside a catch lambda, so every host read on a seam — census and count reads included — is already captured by the surrounding catch frame, and a mixed guard splits by axis with the released/live lifecycle leg refusing on InvalidContext and the value leg on InvalidInput.
            - The kernel Deterministic is the branch's ONE splitmix64 owner: the 0x9E3779B97F4A7C15 gamma literal or a transcribed splitmix64 mixer outside Domain/identity.md, and new Random( outside a Deterministic.Source(...) crossing, are draw forks splitting replay across runtimes — demand the Deterministic.Source(seed, lanes) adapter; carve: a frozen wire constant whose VALUES define a format (the FastCDC gear table) is a recorded split, never a fork.
            - Direct RhinoApp.InvokeOnUiThread is the bug — it silently swallows exceptions, so the RhinoUi marshal wrapper is mandatory, never ceremony; obsolete host members (TextFormula, SetScale with UnitSystem) are genuinely gone with their LengthUnit and rich-text replacements correct, and a bool-returning host member whose false is a benign no-op stays bare-bool, never lifted onto Fin.Fail.
            - Named platform-forced patterns, never smells: Eto 2.11 macOS workarounds are law — using on Eto brushes is inert, MeasureString leaks state so a private FormattedText owns measurement, CreateGraphics throws on Mac, and font-keyed caches add FontDecoration because Font.Equals omits it; process-static [ThreadStatic] caches for expensive native measure and gradient state, and token-gated singleton custody over native singletons, are required where a naive bind/dispose subscription is the bug; TimeProvider injection drives motion and clock state, so demanding a fake-clock double the estate deliberately omits is a false positive; and SafeHandle plus [LibraryImport] with DangerousAddRef/DangerousRelease and unsafe inside a capsule kernel is the named exemption carrying its marker comment.
            - Provider ceilings are honest, not lazy: DuckDB.NET exposes no public zero-copy column span so per-chunk materialization into Arrow builders is the correct pattern and a zero-copy demand is illusory, and Complex lacks IMultiplyOperators<Complex, double, Complex> so separate real and complex bodies are correct rather than duplication to unify through generic math.
            - The owning contract settles the claim before any finding: any UndoBracket.Begin outside DocumentCommit.Sealed is the shared-envelope defect while Sealed owns undo-record rollback on failed execution, so a missing-rollback claim against it is false; a restore bracket folding the complete facet roster is the page's deterministic-scope contract and the subset fold leaks ambient state; a wire-shape or carrier-arity mismatch claim verifies against the owner's normalizing constructor and declared carrier contract, which a constructor folding array and Seq into one payload while publishing the array slot shape, and an anchor-row carrier keeping one outer row per query anchor with its complete set within, both settle; mutation receipts compare optional slot payloads through slot-owned content equality, never generated record equality; and per-folder same-shape address unions survive on genuinely different case sets, so a dedup demand across distinct rosters is false while a needs-derivation seq re-spelled per site collapses to the one derivation row.
        - path: "libs/typescript/**"
          instructions: |-
            - Verified Effect and compiler truths — flagging one is a false positive: Option and Either are Effect subtypes yielded directly with no lift adapter; Effect.fn("name")(function* ...) is the definition seam whose function* and return are sanctioned; inline type specifiers on one import statement are required under verbatimModuleSyntax, and Array/Order/Record/Struct deliberately shadow globals on the value plane; ?: T versus T | undefined are distinct spellings — the blur is the defect, not the distinction; overloaded function declarations over one wider implementation are required for overload sets; Schema.suspend with a mandatory return annotation plus one interior OwnerEncoded interface beside a recursive owner is required; Match.instanceOf ladders with orElse are correct over foreign thrown values; Array.partition returns [excluded, satisfying] with the predicate-false half leading, so an inverted-halves claim against a binding spelling that order is false.
            - Schema.optionalWith(S, { as: "Option" }) is the sole absence spelling on a decoded field — bare Schema.optional leaks undefined into the decoded type.
            - A broker offset, log sequence, or other foreign 64-bit coordinate crossing through Number loses precision silently — arithmetic rides BigInt over the provider's native string spelling.
            - Redacted implements Equal, prints <redacted> on every channel, and unsafeWipe makes later value reads throw terminally — sealed-secret handling is safety by construction, not missing discipline.
            - Arbitrary.make/Pretty.make throw Missing annotation over a bare Schema.declare while Schema.equivalence silently falls back to reference identity — the silent fallback is the audit line, so a foreign owner admits with its annotation set complete or not at all.
            - Canonical owner forms, never restructure targets: a service class extending the Effect service base with its scoped body and dependency roster is the owner with generated Default statics, its key string carrying a scope path segment intentionally; `as const satisfies Record<string, Row>` without a widening annotation is the vocabulary anchor form and a merged registry interface taking rows through declare module is the intended cross-module vocabulary; @ts-expect-error is a legal proof token where a surface must prove a form rejected; a plain record under Record/Struct folds is correct for a closed literal key set; JS stdlib survives at the FFI seam and inside marked kernels with globalThis the sanctioned global reach there; and deferred and side-effect imports are legal only leading a boot-edge module where runMain lives.
            - A foreign value resurfacing past the seam — a nested unknown band, a second source read — decodes again: that is a second admission site, never a duplicate validation.
            - Config-shape truths: a file-scoped biome linter-off override on one e2e platform spec dodges an upstream resolver panic on a tsc-clean file and is never a suppressed-lint smell, while emit-shaping options bind only declaration-emitting packages in their own configs — a shared base config carrying them taxes every non-emitting project, and a per-project waiver re-spelling the base's absent emit gate is redundant residue.
            - Composition defects worth hunting: Layer memoization is by reference identity, so a layer minted by calling a factory twice is two nodes — a shared resource declares once as a const every consumer composes, with Layer.fresh the only sharing opt-out; a RequestResolver rebuilt per call site re-mints identity and defeats the batch window; element-to-element state rides Stream.mapAccum/scan, never a Ref mutated inside map/tap; a value beside a generated union rides a stated Record<GeneratedUnion, V> annotation that breaks loudly on anchor growth, and consumption completeness closes with the (x satisfies never) residue proof.
        - path: "**/{*.csproj,*.props,*.targets,*.slnx,NuGet.config,package.json,pyproject.toml,pnpm-workspace.yaml,global.json}"
          instructions: |-
            - Package versions live only in the central manifests, hand-edited.
            - Version movement is forward-only — a downgrade or stale floor without a recorded reason in the diff is a finding; a sanctioned pin carries an inline comment stating exactly what breaks without it, and a pin missing that mechanism comment is a finding while a pin carrying one is never flagged. The demand side answers the same law: a demanded new floor or pin justified by a hypothetical older release is void where the installed pinned-newest surface constructs the member — a pin is earned only by a reproduced incompatibility.
            - A central row with no direct manifest consumer carries a `Rides <puller>` maintenance comment naming its direct puller — an uncommented transitive row is illegible and re-flags on every census, and a row carrying the comment is proven indirect custody, never an orphan or unused-dependency finding.
            - A version family ruled to move as a matched set — sibling packages riding one upstream release wave, twin release tracks, a channel choice a composed member requires — moves together or not at all: a single-member bump, a routine bump-to-newest against a ruled hold, and a unify-the-versions consistency demand against ruled twin tracks are the defect, the ruling riding the RULINGS registry or the pin comment.
            - A project reference breaching the strata edges the owning branch's `.planning/ARCHITECTURE.md` `[02]-[STRATA]` table declares is a strata defect; resolve that table live, never a copy of its rows.
            - Every central-manifest row sits inside exactly one labelled ItemGroup naming a consuming owner or concern, alphabetized within its group; every Directory.Build PropertyGroup carries a concern label, and a condition-bearing group carries a one-line comment justifying the condition.
            - A csproj groups references under concern labels matching the folder README cards, never version-bearing.
            - A dependency admission is a same-change multi-surface fact — central manifest row, consuming csproj reference, folder README registry row, and .api catalogue tier move together, and a package present in one surface but missing from another is registry drift.
            - A README package card row is the backticked package id plus at most one dash-led charter clause; a version pin, a parenthetical, an .api link, or multi-line depth is a finding — capability depth belongs to the .api catalogue.
            - A typed settings map carries only values of its declared type, sorted by key — a scaffold-hint placeholder committed as a value parses as neither state and re-warns on every invocation.
            - One canonical static gate per language: a manifest script minting a second compiler or checker lane, or running a stale toolchain build beside the stable release, splits the gate — the demanded fix is the one canonical invocation, never a parallel lane.
            - Settled package rulings never re-litigate in review: an admitted graph, math, mapping, or equality substrate package composes at depth and is never wrapped, a package the rulings pruned in favour of a platform-native member stays pruned, and a demand re-opening either cites the RULINGS row that settled it or is void.
        - path: "{tests/**,libs/typescript/**/*.spec.ts,libs/typescript/**/*.test.ts}"
          instructions: |-
            - Test law is tests/README.md with the owning language README (tests/<language>/README.md) — judge against them, never generic coverage convention.
            - Estate and language-tree RULINGS.md registries (tests/RULINGS.md, tests/<language>/RULINGS.md) are settled law: a finding re-litigating a row is void with the row as refutation, and a diff exposing a homeless testing discriminant earns the new ruling row at the narrowest owning tier.
            - A test falsifies production behavior with an independent oracle: existence tests, mirror tests asserting a constructed value's own fields, and specs proving only that their own doubles were called are findings; a refuting witness that survives, or sits trivially outside the domain, exposes a tautology.
            - Rail outcomes prove through the kit gates, never raw carrier-flag inspection or failure-message substrings; numeric equality proves under an explicit tolerance regime with a named metric row, and NaN admits nothing.
            - Kit gates by language: Spec.Succ/Fail/FailCategory asserting the closed-family case-type name never message text; assert_ok/assert_error/assert_error_status on the status sentinel; typed Data.TaggedError tag assertion. isinstance narrowing a wire union to its arm is the sanctioned Python form, and a message substring is legal only beside its status-identity check.
            - Time-dependent behavior takes an injected clock advanced deterministically — a unit-lane sleep or wall-clock read is the named defect; time.sleep inside a spawned subprocess argv proving TIMEOUT, Date.now() in k6 probes, and epoch fixtures in clock suites are the wall-clock subjects themselves, never findings.
            - integration is reserved for the real process or IO boundary — an in-process spec over doubles claiming the lane hides the missing boundary proof.
            - A spec-local helper, tolerance constant, generator, or double shadowing an existing _testkit owner extends the kit, never duplicates beside a spec, and a spec-local tame-band generator is a coverage illusion.
            - A capability blocked on an unbuilt producer is a named skip carrying its activation condition — a vacuous green over an absent producer is a finding, and every fold, gauge, matrix, and coverage census refuses an empty input set as proving nothing.
            - A snapshot captures only what an independent producer emits; snapshotting a self-constructed value, or reflexively re-accepting a verified-diff, is a finding.
            - Graph under test is the production composition with edges re-provided — a substitute is a Layer against the same Tag with interior edges real, and a proof against a hand-assembled parallel graph proves only the parallel graph.
            - Every kit capability lands with its falsification twin proving it can fail; kit import rides the exports-map or project-graph surface (sanctioned, with magic values in specs) — a relative-path reach-around into kit internals is the finding.
            - Process-boundary output decodes through NdjsonOracle, never stdout string-scraping.
            - CsCheck generators filter through Gen.Where(predicate).Select(transform) — a throwing Select breaks shrinking, so the throw is the finding and collapsing the pair back into one Select is the rejected simplification.
            - Estate placement is review duty: a container image pinned anywhere but tests/containers.json is a finding, markers are closed and auto-applied from membership, a benchmark without its registry row (absolute budget plus dispersion ceiling) is a finding, and a [RhinoScenario] recording only Note observations with no asserted Require/Expect/Certify fact proves nothing.
            - tests/contracts/ custody reads live from the entry's MANIFEST.md Class field, never from a language: a DOMAIN entry admits its asset from the one producer the entry names, an INFRASTRUCTURE entry admits a mint from every branch with corpus parity as the proof, and a manifest entry leading its producer is a finding; the corpus seats a contract only where a peer runtime binds it, so an entry whose producer and every decoder sit inside one branch homes at that branch's test tree (tests/RULINGS.md [04]-[STRUCTURE]) and the seat opens the day a second runtime decodes the wire, and an infrastructure entry freezes the payload-agnostic law alone while each branch-owned payload instantiating it takes its own domain entry at its own seam (tests/contracts/README.md [01]-[AUTHORITY]).
        - path: "{tools/**,.claude/workflows/**}"
          instructions: |-
            - Operator and workflow code is deterministic orchestration judged as production source: schema-typed agent outputs, bounded loops, every stage writing its product to disk and returning a path receipt.
            - Bare promises without await ownership, unbounded polling, wall-clock branching, subagents instructed to wait, and hand-authored exit semantics beside a typed envelope contract are findings.
            - Completed-with-failures and Fault ride distinct channels — a tool that ran and found defects stays Completed, and conflating the two in a caller is a finding; exit codes project from the one status owner, never re-derived per caller.
            - Host-exclusive work acquires the shared lease through the one combinator, never a hand-rolled lockfile; artifact writes route through the artifact store, and a tool write at repo root is a finding by name.
            - Per-run scratch paths mint deterministically from the target set, never clock or randomness, so a resume rehydrates the same directory.
            - Every agent() call carries a label, model tier, effort, and a closed JSON schema; a pass whose acceptance gate runs a network-bound toolchain stays native, never routed onto a codex wrapper.
            - Provision evidence is redacted by contract at the adapter seam — a raw password, token value, or password-bearing DSN crossing the seam is an adapter fault, never a redaction to add downstream.
            - A child process whose stdout feeds a parser launches with the runner's reporter silenced — pnpm exec rides pnpm --silent exec, since the reporter writes warnings to stdout ahead of child output.
            - A decoder folding failure to a success-shaped empty over non-empty input launders corruption into a zero-results pass — legal only where the invocation record retains the raw stream as evidence; a fold discarding it lands the undecodable input as a typed defect row.
            - Rhino-bridge Contract law is additive-only: renaming or reusing an existing field, union discriminator, status rank, or exit code is a finding; a [RhinoScenario] entrypoint emits through the typed evidence surface, and scenario code carrying #r, #load, or absolute build-output paths is a finding; --evidence author output is candidate material, never proof.
            - cs-analyzer's rule register IS the code — Kernel/Catalog.cs plus both AnalyzerReleases ledgers — and suppression rides [CspExempt(justification)] from the one contracts assembly, never #pragma or .editorconfig; reviewer prose never restates what promoted analyzer or GritQL rules enforce.
        - path: "{**/*.md,.claude/**/*.md}"
          instructions: |-
            - Prose law is docs/standards/style-guide.md, formatting.md, and information-structure.md — findings cite the named defect class and the line.
            - Regeneration test governs: a fact a fresh agent regenerates from disk plus stated invariants is a mirror demanding deletion.
            - Planning-corpus closed markers — [QUEUED]/[ACTIVE]/[BLOCKED] task status and marked RESEARCH items — are that standard's vocabulary, never hedge or process-ledger findings.
            - Mermaid fences answer the diagram template law, never completeness intuition: a strata node earns its place only when a sourcing decision names the member, same-stratum mutual reads ride prose and never edges, a seam graph resolves interior owners home-side only, and an edge-free island rides prose by construction — a finding demanding an excluded node, a same-stratum rung, or an island's edge re-litigates the template.
            - A fact lands at the lowest tier that owns it — index-tier prose carrying spec-tier mechanism demotes to the owning spec; routing is a file class, so a relative link or sibling reference outside README, SKILL, CLAUDE/AGENTS, and MEMORY files is a coupled-link finding; a durable cross-reference in an allowed file class resolves to a live repo-relative path and a real anchor, and a diff renaming or moving a page or slug repairs every referencing durable in the same change — a dangling reference to a moved or renamed target is a finding; permission verbs (supports, allows, enables, provides, offers) where an owning verb states law are findings.
            - Enumeration anchors — a member roster freezing a census, a forbidden-alternative litany, a frozen count or seal — and version anchors — a version literal, release band, calendar-dated transition ledger, freshness deictic, prose-stated last/free ordinal in a growing code band, or a fence comment pinning provider behavior to a named release — are findings whose demanded replacement is the extension rule or version-free current truth; allocation frontiers live only in the registry owner. Anchor boundaries read at the owner — a registry table at its own declaration, minting its members or solely carrying a harness-owned external key set, is accepted, and a derivation demand naming an elsewhere owner that does not exist is void; hedges (should, might, likely) and report frames are findings while contract qualifiers (optional, if present, only when, unless) survive; one owner per fact — a second prose copy at any tier is a fork waiting to drift.
            - A demanded fix answers to the same defect catalog as the prose it edits: a demanded version literal, band, or pinned lockfile-backed tool specifier, a demanded roster refresh where the extension rule is the repair, a demanded external documentation pointer in place of owned law, or a demanded deletion dropping demonstrated capability a rehome preserves is the defect from the demand side — void, with the catalog-conformant repair as the demanded form; a demanded form the surface's own enforcing gate refutes — a rewrite inverting the owning gate script's verified behavior, a fix the bundle's shipped validator rejects — is void at the same bar, and a landed deletion answers the same catalog: a diff deleting a decision, path, or precedence rule proves the surviving owner on disk — a whole-page deletion proves it per sentence, every carried decision absorbed, verified-carried at its proven owner, or migrated — since a collapse whose deleted fact survives nowhere is capability loss wearing densification; a flagged passage matching the owning defect catalog's Accepted exemplar is the ruled form, and re-demanding its shrink or restructure re-litigates settled law.
            - A demand names the strongest form the owning doctrine admits, never the local patch: a guard bolted onto a fragment the owning fence dissolves whole, and a demanded mechanism the platform itself refutes, are shallow demands owing the deeper form — the local patch is the demanded form only where the owning page rules that local shape.
            - Fence intent labels bind the body and bound the demand: a `template`-tagged fence carries neutral placeholder slots by definition and only `copy-safe` bodies run as written — a validity-as-written or literal-value demand against a `template` body is void, while a body dishonoring its label retags or repairs.
            - Concept-page index labels are ordinals, not same-page links; demand a link only in a router file class whose page grammar authorizes routing.
            - Deterministic register classes the docgen prose gate owns — bare sentence- and entry-opening articles, puffery and copula lexeme rosters, transition openers, table geometry — are gate territory, never findings; the judgment forms the gate cannot catch are findings whose demand is the positive claim alone: an `overall` summary tail (the gate roster excludes `overall` because it legally grades shape and structure), a trailing -ing apposition asserting significance (ensuring, highlighting, reflecting, fostering + an importance clause), the hollow not-just-X-but-Y pivot, explanatory framing however spelled — a definition, description, or capability tour where law belongs — a hidden article opener behind a leader (`[<TOKEN>]: a …`, `<term>: the …`, a table cell opening on an article) whose demanded fix re-authors from the fact as declarative owner-voice law, never a determiner edit, and an oversized list or numbered entry whose rebuild lands every decision near the 150-column line — the house prohibition tail, a rule closed by "never <form>", is sanctioned and never this class.
            - Adjacent sentences or sibling entries carrying one decision, and two near-similar lines or rows a diff introduces or leaves standing, are one decision spread (docgen SAME_DECISION_SPREAD) whose demand is the nuance-preserving merge — one higher-resolution ruling smaller than either source, every distinct decision surviving as its own clause, never a longer merged line or mega-concatenation; a neighbor separating a different failure class or false-positive discriminator is distinct law, never a restatement.
            - A comment carries the one in-situ constraint the code cannot show — never the what, never process narration.
            - Doctrine cites only tooling its owning manifest installs: a durable page naming a compiler, checker, or package no central manifest carries is drift whose demanded fix is the canonical gate spelling, never a second lane.
            - A table cell is one atomic unit with no internal comma — a cell that wants a comma wants to be a card, and a column whose cells all hold one value extracts to a card.
            - Terms the corpus reuses carry one binding sense minted at docs/glossary/, resolved live on the diff and never transcribed into a finding: a spelling a glossary entry's [NOT] line names, and a glossary-defined term used against the sense its entry binds, are findings naming that entry; a concept a durable page names with no entry binding its sense, recurring across two or more surfaces, routes as the entry mint at its owning band. Synonym choice among words no entry defines stays the wording preference the house already voids, so a term finding cites the entry or dies.
        - path: ".claude/agents/**"
          instructions: |-
            - An agent definition is a self-contained worker contract: frontmatter carries a third-person description stating when to delegate, and the body names objective, territory, and the receipt shape the caller parses.
            - A body clause telling the worker to re-read root instructions, load skills, or run checks the active instruction chain already carries is dead weight whose deletion is the demand.
