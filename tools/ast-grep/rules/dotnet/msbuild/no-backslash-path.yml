# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-backslash-path
language: xml
severity: error
utils:
    # A separator between two path characters, a regex escape follows a quote or a bracket and never a path character
    separator: {matches: msbuild-value, regex: '[A-Za-z0-9_.):*]\\[A-Za-z0-9_.$*(@%]'}
rule:
    matches: separator
    any:
        - kind: AttValue
          inside: {kind: Attribute, has: {kind: Name, regex: '^(Include|Exclude|Remove|Update|Project|Path|HintPath|SourceFiles|DestinationFiles|DestinationFolder|Directories|Files|File|Command|Inputs|Outputs|WorkingDirectory|PackagePath)$'}}
        # Element text, a property value or an item metadata value, a regex inside a property function keeps its escapes
        - kind: CharData
          not: {regex: 'RegularExpressions'}
message: A backslash separates the path, on macOS and Linux the evaluator converts it only when the first segment exists on disk and sh deletes it inside an Exec command, write / in every path
