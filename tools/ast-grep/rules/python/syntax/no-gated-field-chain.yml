# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-gated-field-chain
language: python
severity: error
utils:
    other-gate:
        any:
            - {kind: attribute, pattern: $OWNER.$OTHER.enabled, not: {pattern: $OWNER.$FIELD.enabled}}
            - {kind: boolean_operator, has: {field: left, kind: attribute, pattern: $OWNER.$OTHER.enabled, not: {pattern: $OWNER.$FIELD.enabled}}}
    other-branch:
        kind: if_statement
        has: {field: condition, matches: other-gate}
rule:
    kind: if_statement
    all:
        - has:
            field: condition
            any:
                - {kind: attribute, pattern: $OWNER.$FIELD.enabled}
                - {kind: boolean_operator, has: {field: left, kind: attribute, pattern: $OWNER.$FIELD.enabled}}
        - any:
            - follows: {stopBy: end, matches: other-branch}
            - precedes: {stopBy: end, matches: other-branch}
message: '`$OWNER.$FIELD.enabled` branches beside another gated field of `$OWNER`'
note: 'Hold alternatives as a `tuple[<Case> | ..., ...]` field of tagged cases, each case with its own method'
