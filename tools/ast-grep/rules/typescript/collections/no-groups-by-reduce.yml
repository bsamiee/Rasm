# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    accumulator-reference:
        kind: identifier
        pattern: $ACC
        matches: {typescript-local-binding: {owner: {pattern: $REDUCER}}}
    element-reference:
        kind: identifier
        pattern: $X
        matches: {typescript-local-binding: {owner: {pattern: $REDUCER}}}
    empty:
        any:
            - kind: object
              regex: '^\{[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\}$'
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^create$'}}, {has: {field: object, regex: '(^|\.)Object$', matches: typescript-global-member}}]}
                - has: {field: arguments, pattern: {context: f(null), selector: arguments}}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^empty$'}}, {has: {field: object, matches: effect-record-module}}]}
                - has: {field: arguments, regex: '^\([\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\)$'}
            - kind: new_expression
              all:
                - has: {field: constructor, regex: '(^|\.)Map$', matches: typescript-global-member}
                - not: {has: {field: arguments, not: {regex: '^\([\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\)$'}}}
            - matches: typescript-expression-wrapper
              has: {matches: empty}
    bucket:
        any:
            - kind: subscript_expression
              all:
                - has: {field: object, matches: accumulator-reference}
                - has: {field: index, pattern: $K}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(get|getOrInsert|getOrInsertComputed)$'}}, {has: {field: object, matches: accumulator-reference}}]}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, pattern: $K}}
    alias:
        kind: identifier
        pattern: $ALIAS
        all:
            - matches: {typescript-local-binding: {owner: {pattern: $ALIAS_OWNER}}}
            - inside:
                pattern: $ALIAS_OWNER
                stopBy: end
                has:
                    kind: lexical_declaration
                    all:
                        - has: {field: kind, regex: '^const$'}
                        - has: {kind: variable_declarator, all: [{has: {field: name, pattern: $ALIAS}}, {has: {field: value, matches: bucket-receiver}}]}
    bucket-receiver:
        any:
            - matches: bucket
            - matches: typescript-expression-wrapper
              has: {matches: bucket-receiver}
            - kind: assignment_expression, augmented_assignment_expression
              has: {field: left, matches: bucket}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(\?\?|\|\|)$'}
                - has: {field: left, matches: bucket}
                - has: {field: right, matches: bucket-receiver, not: {matches: bucket}}
    receiver:
        any: [{matches: bucket-receiver}, {matches: alias}]
    extended:
        all:
            - any:
                - kind: array
                  all: [{has: {kind: spread_element}}, {has: {matches: element-reference}}]
                - kind: call_expression
                  all:
                    - has:
                        field: function
                        kind: member_expression
                        any:
                            - has: {field: property, regex: '^concat$'}
                            - all: [{has: {field: property, regex: '^append$'}}, {has: {field: object, matches: effect-iterable-module}}]
                    - has: {field: arguments, has: {any: [{matches: element-reference}, {kind: array, has: {matches: element-reference}}]}}
            - has: {stopBy: end, matches: bucket}
    append:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^push$'}}, {has: {field: object, matches: receiver}}]}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: element-reference}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
            - kind: assignment_expression
              all: [{has: {field: left, matches: bucket}}, {has: {field: right, matches: extended}}]
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^set$'}}, {has: {field: object, matches: accumulator-reference}}]}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $K}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: extended}}]}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^set$'}}, {has: {field: object, matches: effect-record-module}}]}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $ACC}}, {has: {nthChild: {position: 2, ofRule: *code}, pattern: $K}}, {has: {nthChild: {position: 3, ofRule: *code}, matches: extended}}]}
            - kind: pair
              all: [{has: {field: key, kind: computed_property_name, has: {pattern: $K}}}, {has: {field: value, matches: extended}}]
            - kind: array
              all:
                - has: {nthChild: {position: 1, ofRule: *code}, pattern: $K}
                - has: {nthChild: {position: 2, ofRule: *code}, matches: extended}
                - not: {has: {nthChild: {position: 3, ofRule: *code}}}
                - inside: {kind: array, has: {kind: spread_element, has: {matches: accumulator-reference}}}
    tested:
        any:
            - matches: accumulator-reference
            - kind: identifier
              pattern: $TESTED
              all:
                - matches: {typescript-local-binding: {owner: {pattern: $TESTED_OWNER}}}
                - inside:
                    pattern: $TESTED_OWNER
                    stopBy: end
                    has:
                        kind: lexical_declaration
                        all:
                            - has: {field: kind, regex: '^const$'}
                            - has: {kind: variable_declarator, all: [{has: {field: name, pattern: $TESTED}}, {has: {field: value, has: {stopBy: end, matches: accumulator-reference}}}]}
    bucket-test:
        any:
            - matches: tested
            - has: {stopBy: end, matches: tested}
    filtered:
        inside:
            stopBy: &boundary {kind: 'arrow_function, function_expression, function_declaration, generator_function, generator_function_declaration, method_definition'}
            any:
                - kind: if_statement, ternary_expression
                  has: {field: condition, not: {matches: bucket-test}}
                - kind: binary_expression
                  all: [{has: {field: operator, regex: '^(&&|\|\||\?\?)$'}}, {has: {field: left, not: {matches: bucket-test}}}]
    accumulator:
        any:
            - kind: identifier
              pattern: $ACC
            - matches: typescript-expression-wrapper
              has: {matches: accumulator}
            - kind: sequence_expression
              has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: accumulator}
            - kind: call_expression
              any:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^set$'}}, {has: {field: object, matches: accumulator-reference}}]}
                - all:
                    - has: {field: function, any: [{pattern: Object.assign, matches: typescript-global-reference}, {kind: member_expression, all: [{has: {field: property, regex: '^set$'}}, {has: {field: object, matches: effect-record-module}}]}]}
                    - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, matches: accumulator-reference}}
            - kind: object
              has: {kind: spread_element, has: {matches: accumulator-reference}}
            - kind: new_expression
              all:
                - has: {field: constructor, regex: '(^|\.)Map$', matches: typescript-global-member}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, kind: array, has: {nthChild: {position: 1, ofRule: *code}, kind: spread_element, has: {matches: accumulator-reference}}}}
    bucketing:
        kind: arrow_function, function_expression
        pattern: $REDUCER
        all:
            - not: {regex: '^async(?-u:\b)'}
            - has:
                field: parameters
                all:
                    - has: {nthChild: {position: 1, ofRule: *code}, kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $ACC}}
                    - has: {nthChild: {position: 2, ofRule: *code}, kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $X}}
                    - not: {has: {nthChild: {position: 4, ofRule: *code}}}
            - has:
                field: body
                any:
                    - matches: accumulator
                    - kind: statement_block
                      has: {kind: return_statement, nthChild: {position: 1, reverse: true, ofRule: *code}, has: {matches: accumulator}}
            - has:
                field: body
                any:
                    - matches: append
                    - has: {stopBy: *boundary, matches: append, not: {matches: filtered}}
            - not:
                has:
                    field: body
                    kind: statement_block
                    pattern: $BLOCK
                    has: {stopBy: *boundary, kind: return_statement, not: {inside: {kind: statement_block, pattern: $BLOCK}}}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^reduce$'}}
        - any:
            - all:
                - has: {field: function, has: {field: object, not: {matches: effect-namespace}}}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: bucketing}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: empty}}, {not: {has: {nthChild: {position: 3, ofRule: *code}}}}]}
            - all:
                - has: {field: function, has: {field: object, matches: effect-iterable-module}}
                - has:
                    field: arguments
                    any:
                        - all: [{has: {nthChild: {position: 2, ofRule: *code}, matches: empty}}, {has: {nthChild: {position: 3, ofRule: *code}, matches: bucketing}}, {not: {has: {nthChild: {position: 4, ofRule: *code}}}}]
                        - all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: empty}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: bucketing}}, {not: {has: {nthChild: {position: 3, ofRule: *code}}}}]
constraints:
    K: {not: {any: [{kind: identifier, pattern: $ACC}, {has: {stopBy: end, kind: identifier, pattern: $ACC}}]}}
message: '`$ACC` groups `$X` by a computed key through `reduce`'
note: 'Call `Object.groupBy(<list>, <key>)` for a record, `Map.groupBy` for a `Map`, or `Array.groupBy` in place of an `effect` `reduce` or `append`'
