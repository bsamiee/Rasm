# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-inline-convergence-javascript
language: javascript
severity: error
files: ['tools/interface/**']
utils:
    other-side:
        any:
            - kind: pair
              has: {field: key, regex: '^(read|write)$', not: {pattern: $SIDE}}
            - kind: method_definition
              has: {field: name, regex: '^(read|write)$', not: {pattern: $SIDE}}
    accessor:
        all:
            - any:
                - kind: 'function_expression, arrow_function'
                  inside: {kind: pair, all: [{has: {field: key, regex: '^(read|write)$', pattern: $SIDE}}, {inside: {kind: object, has: {matches: other-side}}}]}
                - kind: method_definition
                  all: [{has: {field: name, regex: '^(read|write)$', pattern: $SIDE}}, {inside: {kind: object, has: {matches: other-side}}}]
            - has: {field: parameters, has: {nthChild: 2, kind: identifier, pattern: $TARGET}}
    own-accessor:
        inside: {stopBy: {matches: javascript-function-boundary}, matches: accessor}
    target:
        kind: identifier
        pattern: $TARGET
    held:
        kind: identifier
        all:
            - pattern: $HELD
            - inside: {stopBy: {matches: javascript-function-boundary}, matches: javascript-function-boundary, has: {field: parameters, has: {nthChild: 'n+3', kind: identifier, pattern: $HELD}}}
    yielded:
        any:
            - matches: target
            - kind: parenthesized_expression
              has: {matches: yielded}
            - kind: ternary_expression
              any: [{has: {field: consequence, matches: yielded}}, {has: {field: alternative, matches: yielded}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^(&&|\|\|)$'}}, {any: [{has: {field: left, matches: yielded}}, {has: {field: right, matches: yielded}}]}]
    compared:
        all: [{has: {stopBy: end, matches: target}}, {has: {stopBy: end, matches: held}}]
rule:
    any:
        - kind: return_statement
          all: [{matches: own-accessor}, {has: {matches: yielded}}]
        - kind: arrow_function
          all: [{matches: accessor}, {has: {field: body, matches: yielded}}]
        - kind: 'if_statement, while_statement, do_statement, for_statement, ternary_expression'
          all: [{matches: own-accessor}, {has: {field: condition, matches: compared}}]
        - kind: switch_statement
          all: [{matches: own-accessor}, {has: {field: value, matches: compared}}]
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^(&&|\|\|)$'}
            - any: [{inside: {kind: 'expression_statement, return_statement'}}, {inside: {kind: arrow_function, field: body}}]
            - matches: own-accessor
            - has: {field: left, matches: compared}
message: 'Accessor `$SIDE` returns or compares its `$TARGET` argument'
note: 'Return the held value from `read` and write `$TARGET` whole from `write`, `converged` alone compares held and target'
