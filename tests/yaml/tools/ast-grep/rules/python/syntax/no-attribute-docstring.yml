id: no-attribute-docstring
valid:
    - |
      """Module docstring."""

      x = 1
    - |
      def f():
          """Function docstring."""
    - |
      x = 1
      y = "text"
    - |
      x = 1
      f"{x}"
    - |
      print(x)
      "text"
    - |
      x = 1
      (
          "kept"  # inside the statement
      )
invalid:
    - |
      x = 1
      # keeps the comment
      "kept"  # explained
    - |
      x = 1
      """Doc for x."""
    - |
      class A:
          y: int = 2
          """Doc for y."""
    - |
      type Alias = int
      """Doc for Alias."""
    - |
      x = 1; "Doc for x."
