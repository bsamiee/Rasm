# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-typst"
edition.workspace = true
description       = "Typst documents compiled in process to PDF, SVG, PNG, HTML, and bundles"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
papaya                             = { workspace = true }
rayon                              = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
indexmap                           = { workspace = true }
itertools                          = { workspace = true }
rmp-serde                          = { workspace = true }
serde                              = { workspace = true }
serde_path_to_error                = { workspace = true }
toml                               = { workspace = true }
jiff                               = { workspace = true }
cap-std                            = { workspace = true }
reqwest                            = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
png                                = { workspace = true }
skrifa                             = { workspace = true }
merman                             = { workspace = true }
typst                              = { workspace = true }
typst-bundle                       = { workspace = true }
typst-html                         = { workspace = true }
typst-kit                          = { workspace = true }
typst-layout                       = { workspace = true }
typst-pdf                          = { workspace = true }
typst-render                       = { workspace = true }
typst-svg                          = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
