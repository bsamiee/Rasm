syntax = "proto3";

package rasm.contracts.binding;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "rasm/contracts/fault/fault.proto";

enum EchoClass {
  ECHO_CLASS_UNSPECIFIED = 0;
  ECHO_CLASS_ABSENT = 1;
  ECHO_CLASS_STAMPED = 2;
  ECHO_CLASS_TOKENED = 3;
  ECHO_CLASS_SLOTTED = 4;
}

// `canonical_unit` is the estate measure value's own open unit spelling and `source_unit` the foreign host tag's,
// carried because the coercion is the one place both are in hand; neither vocabulary is a roster the corpus closes.
message CoercedValueWire {
  string binding_id = 1 [(buf.validate.field).string.min_len = 1];
  double canonical = 2 [(buf.validate.field).double.finite = true];
  string canonical_unit = 3 [(buf.validate.field).string.min_len = 1];
  string source_unit = 4 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp source_at = 5 [(buf.validate.field).required = true];
}

message WriteBackWire {
  message Acknowledged {
    EchoClass echo = 1 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];
  }
  message Rejected {
    rasm.contracts.fault.FaultObservation fault = 1 [(buf.validate.field).required = true];
  }
  message RolledBack {
    rasm.contracts.fault.FaultObservation attempt = 1 [(buf.validate.field).required = true];
    double prior_value = 2 [(buf.validate.field).double.finite = true];
  }
  message Indeterminate {
    rasm.contracts.fault.FaultObservation attempt = 1 [(buf.validate.field).required = true];
    rasm.contracts.fault.FaultObservation rollback = 2 [(buf.validate.field).required = true];
  }
  oneof kind {
    option (buf.validate.oneof).required = true;
    Acknowledged acknowledged = 1;
    Rejected rejected = 2;
    RolledBack rolled_back = 3;
    Indeterminate indeterminate = 4;
  }
}

message WriteOutcomeWire {
  option (buf.validate.message).cel = {
    id: "write_outcome.rendered"
    message: "rendered and rendered_unit cross together"
    expression: "has(this.rendered) == has(this.rendered_unit)"
  };
  string binding_id = 1 [(buf.validate.field).string.min_len = 1];
  double canonical = 2 [(buf.validate.field).double.finite = true];
  WriteBackWire disposition = 3 [(buf.validate.field).required = true];
  google.protobuf.Duration elapsed = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  optional double rendered = 5 [(buf.validate.field).double.finite = true];
  // `rendered_unit` is the unit the host echoed back in its own spelling, so it stays open like the source it echoes.
  optional string rendered_unit = 6 [(buf.validate.field).string.min_len = 1];
}
