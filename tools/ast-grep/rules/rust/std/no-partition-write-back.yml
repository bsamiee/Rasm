# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    write-back:
        kind: expression_statement
        has: {kind: assignment_expression, any: [{pattern: '*$V = $KEPT'}, {pattern: '$V = $KEPT'}]}
rule:
    kind: let_declaration
    all:
        - any:
            - pattern: 'let ($TAKEN, $KEPT): ($TYPE, $_) = $V.drain(..).partition($P);'
            - pattern: 'let ($TAKEN, $KEPT) = $V.drain(..).partition($P);'
        - precedes: {matches: write-back}
message: '`$V` drains into a partition and takes its kept half back'
note: 'Collect `<vec>.extract_if(.., |value| predicate(&*value))` into the removed collection''s type'
