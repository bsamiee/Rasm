# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-secret-in-child-process
language: swift
severity: error
utils:
    valued-flag:
        kind: line_string_literal
        pattern: $SECRET
        precedes: {pattern: $_, stopBy: {pattern: $_}}
    secret-name:
        kind: line_string_literal
        regex: '^"([A-Z][A-Z0-9_]*_)?(TOKEN|SECRET|PASSWORD|PASSPHRASE|CREDENTIALS?|API_?KEY|KEY)"$'
    secret-value:
        any:
            - kind: navigation_expression
              has: {field: suffix, has: {field: suffix, regex: '(?i)(token|apiKey|secret|password|passphrase|credential)$'}}
            - kind: simple_identifier
              regex: '(?i)(token|apiKey|secret|password|passphrase|credential)$'
    variable-name:
        kind: line_string_literal
        regex: '^"[A-Z_][A-Z0-9_]*"$'
    descriptor-value:
        regex: '(?i)(descriptor|fileno|rawValue)'
rule:
    any:
        - matches: {swift-security-arguments: {subcommand: {regex: '^"add-generic-password"$'}}}
          has: {matches: valued-flag, regex: '^"-(p|w|X)"$'}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"add-internet-password"$'}}}
          has: {matches: valued-flag, regex: '^"-(w|X)"$'}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"(create|unlock)-keychain"$'}}}
          has: {matches: valued-flag, regex: '^"-p"$'}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"set-keychain-password"$'}}}
          has: {matches: valued-flag, regex: '^"-(o|p)"$'}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"set-(generic-password|internet-password|key)-partition-list"$'}}}
          has: {matches: valued-flag, regex: '^"-k"$'}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"(import|export)"$'}}}
          has: {matches: valued-flag, regex: '^"-P"$'}
        - pattern: '$STORE[$SECRET] = $VALUE'
          any:
            - all:
                - has: {field: target, has: {stopBy: end, matches: secret-name}}
                - has: {field: result, not: {matches: descriptor-value}}
            - all:
                - has: {field: target, has: {stopBy: end, matches: variable-name}}
                - has: {field: result, matches: secret-value}
        - pattern: '$STORE.updateValue($VALUE, forKey: $SECRET)'
          has:
            kind: call_suffix
            has:
                kind: value_arguments
                any:
                    - all:
                        - has: {kind: value_argument, nthChild: 2, has: {field: value, matches: secret-name}}
                        - has: {kind: value_argument, nthChild: 1, has: {field: value, not: {matches: descriptor-value}}}
                    - all:
                        - has: {kind: value_argument, nthChild: 2, has: {field: value, matches: variable-name}}
                        - has: {kind: value_argument, nthChild: 1, has: {field: value, matches: secret-value}}
        - kind: line_string_literal
          pattern: $SECRET
          nthChild: 2n+1
          inside: {kind: dictionary_literal}
          any:
            - all:
                - matches: secret-name
                - precedes: {not: {matches: descriptor-value}, stopBy: {pattern: $_}}
            - all:
                - matches: variable-name
                - precedes: {matches: secret-value, stopBy: {pattern: $_}}
message: '`$SECRET` exposes a secret to `ps` for every process of the same uid through child argv or environment'
note: 'Write secrets to a pipe the child reads, as a `security -i` command on stdin or through a descriptor number it opens'
