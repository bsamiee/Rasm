# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: enum-to-const-object
language: typescript
severity: error
rule:
    kind: enum_declaration
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, pattern: $BODY}
        - not: {has: {field: body, has: {kind: property_identifier}}} # Ordinal-less member: no synthesizable value, no fix
        - not: {inside: {kind: export_statement}} # Exported surface: hand repair owns the API break
        - not: {inside: {kind: ambient_declaration}} # declare enum: a const initializer is illegal in ambient context
        - not: {regex: '^const'} # const enum has no emit, the object would create a runtime value it never had
rewriters:
    - id: enum-row
      rule:
        kind: enum_assignment
        all:
            - has: {field: name, pattern: $KEY}
            - has: {field: value, pattern: $VALUE} # Field proven by CST, the published schema omits value
      fix: '$KEY: $VALUE'
transform:
    ROWS:
        rewrite:
            rewriters: [enum-row]
            source: $BODY
            joinBy: ', '
fix: |-
    const $NAME = { $ROWS } as const;
    type $NAME = (typeof $NAME)[keyof typeof $NAME];
message: Enum declares constants through emit-bearing syntax
note: The constants become an `as const` object with its value union derived, runtime values, key space, and value space survive verbatim
