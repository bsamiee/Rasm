# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-rendered-cause-tsx
language: tsx
severity: error
utils:
    failure-callback:
        kind: arrow_function, function_expression
        any:
            - inside: {kind: pair, field: value, has: {field: key, regex: '^(catch|onFailure)$'}}
            - inside:
                kind: pair
                field: value
                inside:
                    kind: object
                    inside:
                        kind: arguments
                        inside:
                            kind: call_expression
                            has: {field: function, kind: member_expression, has: {field: property, regex: '^(catchTags|catchReasons)$'}}
            - inside:
                kind: arguments
                inside:
                    kind: call_expression
                    has:
                        field: function
                        kind: member_expression
                        has: {field: property, regex: '^(mapError|catch|catchCause|catchTag|catchTags|catchIf|catchFilter|catchReason|catchReasons|catchDefect|tapError|tapCause|tapErrorTag)$'}
    cause-parameter:
        matches: failure-callback
        any:
            - has: {field: parameter, kind: identifier, pattern: $CAUSE}
            - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $CAUSE}}}
    rendering:
        any:
            - kind: call_expression
              all:
                - has:
                    field: function
                    any:
                        - {kind: identifier, regex: '^String$', matches: syntax-global-reference}
                        - kind: member_expression
                          all:
                            - has: {field: property, regex: '^stringify$'}
                            - has: {field: object, regex: '^JSON$', matches: syntax-global-reference}
                        - kind: member_expression
                          all:
                            - has: {field: property, regex: '^toStringUnknown$'}
                            - has: {field: object, matches: {effect-module: {name: {regex: '\bInspectable$'}}}}
                - has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $CAUSE}}
            - kind: member_expression
              all:
                - has: {field: object, kind: identifier, pattern: $CAUSE}
                - has: {field: property, regex: '^(message|stack)$'}
            - kind: template_substitution
              has: {kind: identifier, pattern: $CAUSE}
    error-class:
        kind: class_declaration, class
        has:
            kind: class_heritage
            has:
                kind: extends_clause
                has:
                    field: value
                    stopBy: end
                    kind: member_expression
                    all:
                        - has: {field: property, regex: '^(Error|TaggedError)$'}
                        - has: {field: object, matches: {effect-module: {name: {regex: '\b(Data|Schema)$'}}}}
    protocol-message:
        kind: member_expression
        has: {field: property, regex: '^message$'}
        inside:
            kind: pair
            field: value
            has: {field: key, regex: '^message$'}
            inside:
                kind: object
                inside:
                    kind: arguments
                    inside:
                        any:
                            - kind: new_expression
                              has: {field: 'constructor', matches: syntax-package-reference}
                            - kind: call_expression
                              has: {field: function, matches: syntax-package-reference}
    cause-module:
        matches: {effect-module: {name: {regex: '\bCause$'}}}
    built-cause:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, matches: cause-module}}, {has: {field: property, regex: '^(pretty|prettyErrors)$'}}]}
            - has:
                field: arguments
                has:
                    nthChild: 1
                    kind: call_expression
                    has: {field: function, kind: member_expression, all: [{has: {field: object, matches: cause-module}}, {has: {field: property, regex: '^(fail|die)$'}}]}
rule:
    any:
        - matches: rendering
          pattern: $TEXT
          inside: {stopBy: end, matches: cause-parameter}
          not: {matches: protocol-message}
        - matches: built-cause
          pattern: $TEXT
        - kind: method_definition
          all:
            - has: {regex: '^get$'}
            - has: {field: name, regex: '^message$', pattern: $TEXT}
            - inside: {kind: class_body, inside: {matches: error-class}}
message: '`$TEXT` renders a typed failure to text'
note: 'Keep failures typed to the boundary, where `<error>.message` fills a protocol error''s `message` field and `Cause.pretty(<cause>)` renders a caught cause with its `[cause]` chain'
