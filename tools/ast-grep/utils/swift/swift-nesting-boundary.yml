# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-nesting-boundary
language: swift
rule:
    any:
        - kind: init_declaration, deinit_declaration, subscript_declaration, computed_property, computed_getter, computed_setter, computed_modify, willset_clause, didset_clause
        - kind: function_declaration
          not: {inside: {kind: statements}}
