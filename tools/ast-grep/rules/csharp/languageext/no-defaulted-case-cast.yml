# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-defaulted-case-cast
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: binary_expression
    pattern: $VALUE as $CASE ?? $CASE.Default
message: '`$VALUE as $CASE ?? $CASE.Default` substitutes the default `$CASE` for every other case'
note: 'Focus case through `Prism<TState, TCase>.New(state => Optional(state as TCase), held => state => held)`, or read `Optional(state as TCase)`'
