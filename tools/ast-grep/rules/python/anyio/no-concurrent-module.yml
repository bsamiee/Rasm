# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-concurrent-module
language: python
severity: error
rule:
    pattern: $USE
    any:
        # The pools and the subinterpreters, each with the submodules under it
        - matches: {python-module-use: {module: {regex: '^concurrent\.(futures|interpreters)(\.[\w.]+)?$'}}}
        # Submodule imported from its package, `from concurrent import futures`, the package holds no other module
        - kind: dotted_name
          matches: {python-module-member: {module: {regex: '^concurrent$'}, name: {kind: dotted_name}}}
message: '`$USE` runs work on a concurrent pool or subinterpreter outside structured concurrency'
note: >-
    Run blocking work through `await anyio.to_thread.run_sync(<fn>, limiter=<limiter>)`, a process through
    `anyio.to_process.run_sync(<fn>)`, and a subinterpreter through `anyio.to_interpreter.run_sync(<fn>)`
