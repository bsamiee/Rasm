# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
# On demand, nx run rasm:rewrite -- --filter='^retry-to-once$' --error=retry-to-once <path>
id: retry-to-once
language: python
severity: off
utils:
    retry-member:
        any:
            - matches: {python-module-member: {module: {regex: '^stamina$'}, name: {regex: '^retry$'}}}
            - matches: {python-imported-name: {module: {regex: '^stamina$'}, name: {regex: '^retry$'}}}
    context-member:
        any:
            - matches: {python-module-member: {module: {regex: '^stamina$'}, name: {regex: '^retry_context$'}}}
            - matches: {python-imported-name: {module: {regex: '^stamina$'}, name: {regex: '^retry_context$'}}}
    caller-member:
        any:
            - matches: {python-module-member: {module: {regex: '^stamina$'}, name: {regex: '^(Async)?RetryingCaller$'}}}
            - matches: {python-imported-name: {module: {regex: '^stamina$'}, name: {regex: '^(Async)?RetryingCaller$'}}}
    # The retry loop with the attempt as its one binding, a body reading the attempt or leaving the loop is edited by hand
    retry-loop:
        kind: for_statement
        all:
            - has: {field: left, kind: identifier, pattern: $A}
            - has: {field: right, kind: call, has: {field: function, matches: context-member}}
            - has:
                field: body
                kind: block
                not: {has: {nthChild: 2}}
                has:
                    kind: with_statement
                    all:
                        - has: {kind: with_clause, has: {kind: with_item, has: {kind: identifier, pattern: $A}}, not: {has: {nthChild: 2}}}
                        - has:
                            field: body
                            pattern: $BODY
                            not: {has: {stopBy: {kind: 'function_definition, lambda, for_statement, while_statement'}, any: [{kind: identifier, pattern: $A}, {kind: continue_statement}, {kind: break_statement}]}}
            - not: {has: {kind: else_clause}}
rule:
    any:
        # The decorator leaves, the def keeps its name and body
        - kind: decorator
          pattern: $NODE
          has: {kind: call, has: {field: function, matches: retry-member}}
        # The loop and the attempt scope leave, the body keeps its statements at the loop's column
        - matches: retry-loop
          pattern: $NODE
        # The caller runs the function once with the same arguments, the bound form's on() call is the callee the pattern captures
        - kind: call
          pattern: $NODE
          all:
            - pattern: $CALLER($$$OPTS)($FN, $$$ARGS)
          has: {field: function, any: [{kind: call, has: {field: function, matches: caller-member}}, {kind: call, has: {field: function, kind: attribute, has: {field: object, kind: call, has: {field: function, matches: caller-member}}}}]}
rewriters:
    - id: decorator
      rule: {kind: decorator}
      fix: ''
    - id: loop
      rule: {kind: for_statement}
      fix: $BODY
    - id: caller
      rule: {kind: call}
      fix: $FN($$$ARGS)
transform:
    OUT: rewrite($NODE, rewriters=[decorator, loop, caller])
fix: $OUT
labels: {NODE: {style: primary}}
message: '`$NODE` reruns a failed operation through stamina'
note: The operation runs once with its arguments and its failure reaches the caller, the loop body keeps its statements at the loop's column
