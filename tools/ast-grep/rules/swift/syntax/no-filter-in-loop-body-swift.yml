# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    plain-loop:
        kind: for_statement
        all:
            - has: {field: collection, pattern: $COLL}
            - not: {has: {kind: where_clause}}
    single-item:
        kind: pattern
        all:
            - has: {field: bound_identifier, kind: simple_identifier}
            - not: {has: {nthChild: 2}}
    single-if:
        matches: {swift-single-statement: {first: {kind: if_statement, not: {has: {regex: '^(,|else)$'}}}}}
    element-source:
        follows: {regex: '^=$'}
        any:
            - {kind: simple_identifier, pattern: $ELEMENT}
            - matches: property-chain
            - kind: call_expression
              all:
                - has:
                    nthChild: 1
                    kind: 'simple_identifier, navigation_expression'
                    not: {has: {stopBy: end, any: [{kind: call_suffix}, {pattern: $ELEMENT}]}}
                - has:
                    kind: call_suffix
                    not: {has: {kind: lambda_literal}}
                    has:
                        kind: value_arguments
                        all:
                            - has: {kind: value_argument, not: {has: {kind: value_argument_label}}, has: {field: value, pattern: $ELEMENT}}
                            - not: {has: {kind: value_argument, nthChild: 2}}
            - all:
                - has: {kind: simple_identifier, stopBy: end, pattern: $ELEMENT}
                - not: {has: {stopBy: end, kind: lambda_literal}}
                - not:
                    has:
                        stopBy: end
                        kind: simple_identifier
                        not:
                            any:
                                - pattern: $ELEMENT
                                - inside: {kind: 'navigation_suffix, value_argument_label'}
                                - inside: {kind: prefix_expression, has: {field: operation, regex: '^\.$'}}
                                - {nthChild: 1, inside: {kind: call_expression}}
    property-chain:
        kind: navigation_expression
        has: {field: target, any: [{kind: simple_identifier, pattern: $ELEMENT}, {matches: property-chain}]}
    optional-binding:
        all:
            - has: {kind: value_binding_pattern}
            - has: {field: bound_identifier, kind: simple_identifier}
            - any:
                - has: {matches: element-source}
                - all:
                    - not: {has: {regex: '^=$'}}
                    - has: {field: bound_identifier, pattern: $ELEMENT}
    boolean-test:
        not:
            any:
                - has: {regex: '^case$'}
                - has: {kind: 'value_binding_pattern, availability_condition'}
    continue-body:
        matches: {swift-single-statement: {first: {kind: control_transfer_statement, regex: '^continue$'}}}
    continue-guard:
        kind: guard_statement
        all:
            - not: {has: {regex: '^,$'}}
            - has: {matches: continue-body}
    kept-item:
        has: {field: item, has: {stopBy: end, kind: simple_identifier, pattern: $READ}}
    reads-item:
        any:
            - {kind: simple_identifier, pattern: $READ}
            - has: {stopBy: end, kind: simple_identifier, pattern: $READ}
rule:
    all:
        - matches: plain-loop
        - not: {has: {kind: statements, has: {kind: 'guard_statement, if_statement', has: {stopBy: {kind: statements}, kind: 'try_expression, await_expression'}}}}
        - any:
            - all:
                - has: {field: item, matches: single-item, pattern: $X}
                - has:
                    kind: statements
                    matches: single-if
                    has:
                        kind: if_statement
                        all:
                            - has: {field: condition, regex: '^case$'}
                            - has: {kind: simple_identifier, pattern: $X, follows: {regex: '^=$'}}
                            - has: {kind: statements, not: {has: {stopBy: end, kind: simple_identifier, pattern: $X}}}
            - all:
                - has: {field: item, matches: single-item, pattern: $ELEMENT}
                - has:
                    kind: statements
                    matches: single-if
                    has:
                        kind: if_statement
                        all:
                            - matches: optional-binding
                            - has: {kind: statements}
            - all:
                - has: {field: item, matches: single-item, pattern: $ELEMENT}
                - has:
                    kind: statements
                    has: {nthChild: 1, matches: continue-guard, all: [{matches: optional-binding}]}
            - all:
                - has: {field: item, matches: single-item, pattern: $X}
                - has:
                    kind: statements
                    has:
                        nthChild: 1
                        matches: continue-guard
                        all: [{has: {field: condition, regex: '^case$'}}]
                        has: {kind: simple_identifier, pattern: $X, follows: {regex: '^=$'}, precedes: {regex: '^else$'}}
            - all:
                - matches: kept-item
                - has:
                    kind: statements
                    has:
                        nthChild: 1
                        kind: guard_statement
                        all:
                            - matches: boolean-test
                            - has: {matches: reads-item}
                            - has: {matches: continue-body}
            - all:
                - matches: kept-item
                - has:
                    kind: statements
                    all:
                        - has: {nthChild: 2}
                        - has:
                            nthChild: 1
                            kind: if_statement
                            all:
                                - matches: boolean-test
                                - not: {has: {regex: '^(,|else)$'}}
                                - has: {field: condition, matches: reads-item}
                                - has: {matches: continue-body}
            - all:
                - matches: kept-item
                - has:
                    kind: statements
                    all:
                        - not: {has: {nthChild: 2}}
                        - has:
                            nthChild: 1
                            kind: if_statement
                            all:
                                - matches: boolean-test
                                - not: {has: {regex: '^else$'}}
                                - has: {not: {kind: statements}, matches: reads-item}
                                - has: {kind: statements}
message: '`for` over `$COLL` selects elements by a test at the top of its body'
note: 'Select in `for` by `case`, `where`, or lazy `compactMap`, keeping throwing or asynchronous binding steps in the body'
