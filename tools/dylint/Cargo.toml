# --- [PACKAGE] --------------------------------------------------------------------------

# --- [IDENTITY]

[package]
name              = "rasm-lints"
edition.workspace = true
description       = "Dylint lints over resolved names, types, and expansions Clippy lacks"

# --- [RUST_ANALYZER]

[package.metadata.rust-analyzer]
rustc_private = true

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path       = "lib.rs"
test       = false
crate-type = ["cdylib"]

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
strum          = { workspace = true }
itertools      = { workspace = true }
camino         = { workspace = true }
dunce          = { workspace = true }
fs-err         = { workspace = true }
clippy_utils   = { workspace = true }
dylint_linting = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
