# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-alias-declaration-tsx
language: tsx
severity: error
ignores: ['**/*.d.ts']
utils:
    binding-target:
        any:
            - {kind: 'identifier, shorthand_property_identifier_pattern', pattern: $TARGET}
            - {kind: 'object_pattern, array_pattern, rest_pattern', has: {matches: binding-target}}
            - {kind: pair_pattern, has: {field: value, matches: binding-target}}
            - {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, matches: binding-target}}
    stable-target:
        any:
            - matches: syntax-module-constant
              has: {kind: variable_declarator, has: {field: name, matches: binding-target}}
            - {kind: 'function_declaration, class_declaration', has: {field: name, pattern: $TARGET}}
    aliased-import:
        kind: type_identifier
        pattern: $IMPORTED
        inside:
            kind: program
            stopBy: end
            has: {kind: import_statement, has: {stopBy: end, kind: import_specifier, has: {field: alias, pattern: $IMPORTED}}}
    exported-target:
        kind: export_statement
        any:
            - has: {kind: lexical_declaration, has: {kind: variable_declarator, has: {field: name, pattern: $TARGET}}}
            - has: {kind: 'function_declaration, class_declaration, type_alias_declaration, interface_declaration, enum_declaration', has: {field: name, pattern: $TARGET}}
            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $TARGET}, not: {has: {field: alias, pattern: $_}}}}
rule:
    any:
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $ALIAS}
            - has: {field: value, kind: identifier, pattern: $TARGET}
            - not: {has: {field: type, kind: type_annotation}}
            - inside: {matches: syntax-module-constant}
            - inside:
                kind: program
                stopBy: end
                has:
                    any:
                        - matches: stable-target
                        - kind: export_statement
                          has: {matches: stable-target}
        - kind: type_alias_declaration
          all:
            - has: {field: name, pattern: $ALIAS}
            - has: {field: value, kind: 'type_identifier, nested_type_identifier', pattern: $TARGET}
            - not: {has: {field: type_parameters, kind: type_parameters}}
            - not: {has: {field: value, matches: aliased-import}}
        - kind: type_alias_declaration
          pattern: $DECLARATION
          all:
            - has: {field: name, pattern: $ALIAS}
            - has: {field: value, kind: generic_type, pattern: $TARGET}
            - not: {has: {field: type_parameters, kind: type_parameters}}
            - not: {has: {field: value, has: {field: name, matches: aliased-import}}}
            - inside:
                kind: program
                all:
                    - not: {has: {kind: export_statement, has: {stopBy: end, kind: 'identifier, type_identifier', pattern: $ALIAS}}}
                    - has:
                        pattern: $USER
                        not: {pattern: $DECLARATION}
                        has: {stopBy: end, kind: type_identifier, pattern: $ALIAS}
                    - not:
                        has:
                            all:
                                - not: {pattern: $DECLARATION}
                                - not: {pattern: $USER}
                                - has: {stopBy: end, kind: type_identifier, pattern: $ALIAS}
        - kind: export_specifier
          all:
            - has: {field: alias, kind: identifier, pattern: $ALIAS}
            - has: {field: name, kind: identifier, pattern: $TARGET}
            - inside: {kind: export_clause, inside: {kind: export_statement, not: {has: {field: source, kind: string}}}}
            - inside: {kind: program, stopBy: end, has: {matches: exported-target}}
constraints:
    ALIAS: {not: {regex: '^default$'}}
message: '`$ALIAS` is another name for `$TARGET`'
note: 'Spell `<target>` where `<alias>` is used'
labels:
    TARGET: {style: primary, message: Aliased name}
