# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
files: ['libs/**', 'tools/**', 'plugins/**', 'apps/creative-cloud/**', '.claude/**', '.codex/**']
rule:
    kind: command
    all:
        - any:
            - has: {field: name, regex: '(?:^|/)open$', pattern: $NAME}
            - all:
                - has: {field: name, regex: '^(exec|command)$'}
                - has: {kind: word, regex: '(?:^|/)open$', pattern: $NAME, follows: {kind: command_name}}
        - not:
            has:
                kind: 'word, string, raw_string, concatenation'
                not: {follows: {stopBy: end, pattern: '--args'}}
                any:
                    - regex: '^[''"]?(-[eftFWRnjh]*g[A-Za-z]*|--background)[''"]?$'
                    - has: {stopBy: end, kind: special_variable_name, regex: '^[@*]$'}
                    - has: {stopBy: end, kind: subscript, has: {field: index, regex: '^[@*]$'}}
message: '`$NAME` supplies no fixed background option'
note: Pass `-g`, `open` then launches through LaunchServices with no activation
