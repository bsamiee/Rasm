id: no-alias-declaration-tsx
valid:
    - |
      function load() {}
      const read = (x: number) => load(x);
    - |
      function load() {}
      const read: Loader = load;
    - |
      export type Ids = Array<string>;
      const f = (x: Ids) => x;
    - |
      type Ids<T> = Array<T>;
    - |
      type Ids = Array<string>;
      const f = (x: Ids) => x;
      const g = (x: Ids) => x;
invalid:
    - |
      function load() {}
      const read = load;
    - |
      import { Effect } from "effect";
      const { map, flatMap } = Effect;
    - |
      interface Foo {}
      type Bar = Foo;
    - |
      type Ids = Array<string>;
      const f = (x: Ids) => x;
