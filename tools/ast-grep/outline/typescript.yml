    top:
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
            any:
                - kind: program
                - inside:
                    has: {field: name, pattern: $OWNER}
                    any:
                        - inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {has: {field: name, pattern: $OUTER}}}
                        - pattern: $_
    declaration:
        matches: top
        any:
            - kind: lexical_declaration
              has: {field: kind, regex: '^const$', pattern: $$KIND}
            - kind: using_declaration
              has: {field: kind, pattern: $$KIND}
    open:
        any:
            - inside: {kind: export_statement, stopBy: {not: {kind: expression_statement}}}
            - inside: {kind: ambient_declaration, stopBy: end}
            - all:
                - has: {field: name, pattern: $NS}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NS}}}
                            - has: {kind: identifier, pattern: $NS}
    exported:
        all:
            - any:
                - kind: export_statement
                - inside: {kind: export_statement, stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, variable_declarator, object_pattern, array_pattern, pair_pattern, rest_pattern, assignment_pattern, object_assignment_pattern, ambient_declaration'}}}
                - inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                            - has: {kind: identifier, pattern: $NAME}
            - not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}
rule:
    pattern: $DECLARATION
    any:
        - kind: variable_declarator
          has: {field: name, kind: identifier, pattern: $NAME}
          inside: {matches: declaration}
        - kind: identifier, shorthand_property_identifier_pattern
          pattern: $NAME
          all:
            - inside:
                kind: variable_declarator
                field: name
                stopBy: {not: {kind: 'object_pattern, array_pattern, pair_pattern, rest_pattern, assignment_pattern, object_assignment_pattern'}}
                inside: {matches: declaration}
            - not: {inside: {kind: 'assignment_pattern, object_assignment_pattern', field: right}}
        - kind: export_statement
          has: {regex: '^default$', pattern: $$NAME}
          all:
            - matches: top
            - has: {field: value, pattern: $_}
rewriters:
    - id: block
      rule: {kind: 'object, object_type, class_body, statement_block', regex: "\n"}
      fix: '{…}'
    - id: call
      rule: {kind: arguments, regex: "\n", not: {has: {kind: object, regex: "\n"}}}
      fix: (…)
transform:
    ENCLOSING: {replace: {source: $OUTER, replace: $, by: .}}
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
    USING: {replace: {source: $PREFIX, replace: '^await $', by: 'await using '}}
