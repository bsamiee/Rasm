    - source: echo $((1 + 2))
      style: primary
      start: 0
      end: 15
    - source: $((1 + 2))
      style: secondary
      start: 5
      end: 15
  echo $(cmd):
    fixed: printf '%s\n' $(cmd)
    labels:
    - source: echo $(cmd)
      style: primary
      start: 0
      end: 11
    - source: $(cmd)
      style: secondary
      start: 5
      end: 11
  echo $x:
    fixed: printf '%s\n' $x
    labels:
    - source: echo $x
