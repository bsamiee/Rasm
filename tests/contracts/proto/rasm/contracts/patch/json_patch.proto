syntax = "proto3";

package rasm.contracts.patch;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// RFC 6902 over the exact node ProtoJSON; `value` is the arbitrary JSON leaf the
// operation carries. Paths are RFC 6901 pointers; a prototype-polluting segment refuses
// at the consumer gate.

message PatchAdd {
  string path = 1 [(buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"];
  google.protobuf.Value value = 2 [(buf.validate.field).required = true];
}

message PatchRemove {
  string path = 1 [(buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"];
}

message PatchReplace {
  string path = 1 [(buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"];
  google.protobuf.Value value = 2 [(buf.validate.field).required = true];
}

message PatchMove {
  string from_path = 1 [
    json_name = "from",
    (buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"
  ];
  string path = 2 [(buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"];
}

message PatchCopy {
  string from_path = 1 [
    json_name = "from",
    (buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"
  ];
  string path = 2 [(buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"];
}

message PatchTest {
  string path = 1 [(buf.validate.field).string.pattern = "^(/([^/~]|~[01])*)*$"];
  google.protobuf.Value value = 2 [(buf.validate.field).required = true];
}

message PatchOp {
  oneof op {
    option (buf.validate.oneof).required = true;

    PatchAdd add = 1;
    PatchRemove remove = 2;
    PatchReplace replace = 3;
    PatchMove move = 4;
    PatchCopy copy = 5;
    PatchTest test = 6;
  }
}
