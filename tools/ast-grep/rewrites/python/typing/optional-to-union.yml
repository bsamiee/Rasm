# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: optional-to-union
language: python
severity: off
utils:
    # The typing member as spelled, a bare name the module's from-import binds or the attribute read off the module or its alias
    typing-member:
        any:
            - matches: {python-imported-name: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^(Optional|Union)$'}}}
            - matches: {python-module-member: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^(Optional|Union)$'}}}
    # Member of the reported node, a child of a subscript beside its value or a type under the type parameter of a generic type
    member:
        any:
            - pattern: $M
              inside: {pattern: $SUB, kind: subscript}
              not: {inside: {kind: subscript, field: value}}
            - kind: type
              pattern: $M
              inside: {kind: type_parameter, inside: {pattern: $SUB}}
    # The node headed by the typing member, a subscript in a value position or under an attribute head, or the generic type of an annotation
    union-head:
        any:
            - kind: subscript
              has: {field: value, matches: typing-member, pattern: $HEAD}
            - kind: generic_type
              has: {kind: identifier, matches: typing-member, pattern: $HEAD} # The members are type nodes, the head is the one identifier child
rule:
    pattern: $SUB
    matches: union-head
    all:
        # String members are forward references the operator cannot join at run time, the value of a subscript is never one
        - not: {any: [{has: {kind: string}}, {has: {kind: type_parameter, has: {kind: type, has: {kind: string}}}}]}
        # The outermost of nested unions reports once, the inner one is the next pass
        - not: {inside: {matches: union-head, stopBy: end}}
rewriters:
    # The one member of Optional joined with None, the head re-matches the node the rule bound
    - id: optional-member
      rule: {matches: member, inside: {stopBy: end, pattern: $SUB, has: {pattern: $HEAD, regex: '(^|\.)Optional$'}}}
      fix: $M | None
    # Each member of Union in order, the head is no member and leaves under the join
    - id: union-member
      rule: {matches: member}
      fix: $M
transform:
    OUT: rewrite($SUB, rewriters=[optional-member, union-member], joinBy=' | ')
fix: $OUT
message: '`$SUB` spells a union the `|` operator writes'
note: Write `<a> | <b>`, `<type> | None` for absence
