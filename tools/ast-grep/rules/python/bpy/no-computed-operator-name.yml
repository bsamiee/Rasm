# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-computed-operator-name
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    ops-module:
        matches: {python-member-use: {module: {regex: '^bpy$'}, name: {regex: '^ops$'}}}
    operators:
        any:
            - matches: ops-module
            - kind: attribute
              has: {field: object, matches: ops-module}
            - kind: call
              all:
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^getattr$'}}}}
                - has: {field: arguments, has: {nthChild: 1, matches: ops-module}}
rule:
    kind: call
    pattern: $ACCESS
    all:
        - has: {field: function, matches: {python-builtin-name: {name: {regex: '^getattr$'}}}}
        - has: {field: arguments, has: {nthChild: 1, matches: operators}}
        - has: {field: arguments, has: {nthChild: 2, not: {matches: python-plain-string}}}
        - not: {inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^getattr$'}}}}
        - not: {inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: {python-builtin-name: {name: {regex: '^dir$'}}}}}}}
message: '`$ACCESS` reaches an operator by a computed name'
note: 'Call the held command or a `bpy.ops.<module>.<name>` member, list a runtime submodule with `dir(getattr(bpy.ops, <module>))`, read RNA from held class `bl_rna`, and write context values through `bpy.ops.wm.context_set_value`'
