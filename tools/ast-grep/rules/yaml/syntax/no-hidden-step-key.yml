# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yamllang
severity: error
metadata: {injection-utils: bashlang}
files: ['.github/workflows/**', '**/action.{yml,yaml}']
utils:
    hidden-key: {any: [{kind: alias}, {kind: double_quote_scalar, any: [{has: {kind: escape_sequence}}, {regex: '[\r\n]'}]}]}
    root-map: {kind: 'document > :is(block_node, flow_node) > :is(block_mapping, flow_mapping)'}
    top-pair: {kind: &pair 'block_mapping_pair, flow_pair', inside: {matches: root-map}}
    run: {kind: *pair, has: {field: key, has: {regex: '^["'']?run["'']?$'}}}
    defaults: {kind: *pair, has: {field: key, has: {regex: '^["'']?defaults["'']?$'}}}
    job-map: {kind: &map 'block_mapping, flow_mapping', inside: {kind: &node 'block_node, flow_node', inside: {kind: *pair, inside: {kind: *map, inside: {kind: *node, inside: {matches: top-pair, has: {field: key, has: {regex: '^["'']?jobs["'']?$'}}}}}}}}
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - has: {field: key, pattern: $KEY, has: {matches: hidden-key}}
        - any:
            - matches: yaml-step-pair
            - inside:
                kind: block_mapping, flow_mapping
                inside:
                    kind: block_node, flow_node
                    inside:
                        any:
                            - {matches: defaults, inside: {any: [{matches: job-map}, {matches: root-map}]}}
                            - {matches: run, inside: {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {matches: defaults, inside: {any: [{matches: job-map}, {matches: root-map}]}}}}}
message: '`$KEY` hides its name from the bash injection'
note: Write the key as plain text
