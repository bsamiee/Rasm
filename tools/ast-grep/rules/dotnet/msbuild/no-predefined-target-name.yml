# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-predefined-target-name
language: xml
severity: error
files: ['**/*.csproj', '**/*.props']
rule:
    pattern: _TARGET
    all:
        - matches: {msbuild-element: {name: {regex: '^Target$'}}}
        - matches:
            msbuild-metadata:
                name: {regex: '^Name$'}
                value: {regex: '(?i)^["''](Before|After)(Build|Compile|Clean|Publish|Rebuild|ResolveReferences|ResGen)["'']$'}
transform:
    RENAMED_BEFORE:
        replace:
            source: $TARGET
            replace: '(?si)^(<Target\b.*?\bName\s*=\s*)(["''])(Before)(Build|Compile|Clean|Publish|Rebuild|ResolveReferences|ResGen)(["''])'
            by: '${1}${2}${3}${4}Step${5}@@BeforeTargets="${4}"@@'
    RENAMED:
        replace:
            source: $RENAMED_BEFORE
            replace: '(?si)^(<Target\b.*?\bName\s*=\s*)(["''])(After)(Build|Compile|Clean|Publish|Rebuild|ResolveReferences|ResGen)(["''])'
            by: '${1}${2}${3}${4}Step${5}@@AfterTargets="${4}"@@'
    KEPT:
        replace:
            source: $RENAMED
            replace: '(?si)^(<Target\b.*?\b(?:Before|After)Targets\s*=.*?)@@[^@]*@@|^(<Target\b[^@]*?)@@[^@]*@@([^>]*?\b(?:Before|After)Targets\s*=)'
            by: '${1}${2}${3}'
    ATTACHED: {replace: {source: $KEPT, replace: '@@([^@]*)@@', by: ' ${1}'}}
fix: $ATTACHED
message: Target takes a predefined name, the SDK import after the project body replaces it
note: Give the target its own name and attach it with `BeforeTargets` or `AfterTargets`
