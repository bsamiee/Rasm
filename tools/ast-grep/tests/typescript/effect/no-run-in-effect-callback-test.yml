id: no-run-in-effect-callback
valid:
    # A function returned by the factory can retain its host-owned callback boundary
    - 'import { Effect } from "effect"; const register = Effect.fnUntraced(function* () { return () => Effect.runSync(work); });'
    # A module with the same factory name does not establish Effect execution ownership
    - 'import { Effect } from "effect"; const register = Other.fnUntraced(function* () { return Effect.runSync(work); });'
    # Two runs beside each other, the second inside a callback a devkit function owns
    - |
      import { Effect } from 'effect';
      const source = Effect.runSync(Effect.cached(localSource));
      return createNodesFromFiles((file) => Effect.runPromise(node(source, files, file)), files, options, context);
    # Run from a callback a package outside effect owns, the outside call sits between the run and the combinator
    - |
      import { Effect, Runtime } from 'effect';
      const stack = yield* Effect.tryPromise({
        try: () => LocalWorkspace.createOrSelectStack({ program: () => Runtime.runPromise(fiberRuntime)(program(adopt)) }, workspace),
        catch: (cause) => new StackError({ cause }),
      });
    # Run inside an output callback an API outside effect owns
    - 'import { Effect } from "effect"; const result = yield* Effect.tryPromise({ try: () => stack.up({ onOutput: (line) => Effect.runSync(Console.log(line)) }) });'
    # Entry point runs once
    - 'import { Effect } from "effect"; NodeRuntime.runMain(Command.run(cli, { name: "cli", version: "" })(process.argv).pipe(Effect.provide(NodeContext.layer)));'
    # Test runs the effect inside a callback the test framework owns
    - 'import { Effect } from "effect"; it("decodes", () => { expect(Effect.runSync(decode(config))).toEqual(expected); });'
    # Curried combinator applied inside the callback, Effect.provide(layer)(effect) runs nothing
    - 'import { Effect } from "effect"; const provided = Effect.map(load(), (config) => Effect.provide(layer)(decode(config)));'
    # Run inside a callback a module outside the effect package owns, the module name sits outside the barrel
    - 'import { Effect } from "effect"; const items = Job.map(job, (item) => Effect.runSync(load(item)));'
    # Test callback with an expression body, the framework owns the callback and runs the promise
    - 'import { Effect } from "effect"; it("decodes", () => Effect.runPromise(decode(config)));'
    - 'import { Array, Effect } from "effect"; const rows = Array.map(files, (file) => Effect.runSync(read(file)));'
    - 'import { Effect } from "effect"; runtime.runCallback(program, { onExit: (exit) => runtime.runSync(report(exit)) });'
    - 'import { Effect } from "effect"; const value = Effect.runSync(Effect.succeed(Effect.runSync(inner)));'
    - import { Effect } from "other"; Effect.sync(() => Effect.runSync(work));
    - import { Effect } from "effect"; function build(Effect) { return Effect.sync(() => Effect.runSync(work)); }
    - import { Effect } from "effect"; const boundary = Effect.succeed(() => Effect.runSync(work));
    - import { Effect } from "effect"; const work = Effect.sync(() => { return () => Effect.runSync(other); });
    - import { Effect } from "effect"; const work = Effect.sync(() => service.register(() => Effect.runSync(other)));
    # Runtime partial application constructs a runner without executing an effect.
    - import { Effect, Runtime } from "effect"; const runner = Effect.map(Effect.runtime(), (runtime) => Runtime.runPromise(runtime /* runner factory */));
    # Value constructors store a function; they do not invoke its body.
    - import { Effect, Stream, Channel } from "effect"; const values = [Effect.succeedSome(() => Effect.runSync(work)), Stream.make(() => Effect.runSync(work)), Channel.write(() => Effect.runSync(work))];
    # A nonexistent member on another imported module belongs to the compiler, not this runtime diagnostic.
    - import { Effect, Option } from "effect"; const work = Effect.sync(() => Option.runSync(other, options));
    # Ref.make stores a function value without invoking it.
    - import { Effect, Ref } from "effect"; const stored = Ref.make(() => Effect.runSync(other));
    # MutableRef.update invokes its callback eagerly at the caller's boundary.
    - import { Effect, MutableRef } from "effect"; MutableRef.update(counter, (count) => Effect.runSync(next(count)));
invalid:
    # Removing the wrapper with the untraced factory keeps the generator inside Effect execution
    - 'import { Effect } from "effect"; const load = Effect.fnUntraced(function* (name) { return Effect.runSync(read(name)); });'
    # Ref update callbacks execute lazily inside the effect runtime and must stay pure.
    - 'import { Effect, Ref } from "effect"; const bumped = Ref.update(counter, (count) => Effect.runSync(next(count)));'
    # Run inside a map callback, the callback returns the effect and the combinator is flatMap
    - 'import { Effect } from "effect"; const decoded = Effect.runSync(Effect.map(load(), (config) => Effect.runSync(decode(config))));'
    # Run inside a promise thunk, the effect is yielded in place
    - 'import { Effect, Runtime } from "effect"; const job = Effect.promise(() => Runtime.runPromise(fiberRuntime)(job));'
    # Fiber runtime run inside the entry run's generator
    - |
      import { Effect, Runtime } from 'effect';
      NodeRuntime.runMain(
        Effect.gen(function* () {
          const fiberRuntime = yield* Effect.runtime();
          yield* Effect.promise(() => Runtime.runPromise(fiberRuntime)(job));
        }),
      );
    # Layer construction composes the effect through Layer.effect.
    - 'import { Effect, Layer } from "effect"; const live = Layer.sync(Service, () => Effect.runSync(build));'
    # Run inside a Channel callback, the mapping is Channel.mapOutEffect
    - 'import { Channel, Effect } from "effect"; const mapped = Channel.mapOut(channel, (out) => Effect.runSync(transform(out)));'
    # Run inside a Sink callback, the mapping is Sink.mapEffect
    - 'import { Effect, Sink } from "effect"; const summed = Sink.map(sink, (total) => Effect.runSync(report(total)));'
    # Micro run inside a Micro callback, the callback returns the Micro and the combinator is Micro.flatMap
    - 'import { Micro } from "effect"; const decoded = Micro.map(load, (config) => Micro.runSync(decode(config)));'
    # The named Effect.fn application owns its generator body.
    - 'import { Effect } from "effect"; const load = Effect.fn("load")(function* (name) { return Effect.runSync(read(name)); });'
    # Run inside a sync thunk, the thunk returns the value the effect computes
    - 'import { Effect } from "effect"; const built = Effect.sync(() => Effect.runSync(build));'
    - import { Effect as E } from "effect"; const work = E.sync(() => E.runSync(other));
    - import * as E from "effect/Effect"; const work = E.sync(() => E.runSync(other));
    # Runtime also executes through its data-first overload, ignoring argument comments.
    - import { Effect, Runtime } from "effect"; const value = Effect.sync(() => Runtime.runSync(runtime, /* effect */ other));
    # A generator body directly invokes the runner; no nested thunk supplies ownership.
    - import { Effect } from "effect"; const work = Effect.gen(function* () { return Effect.runSync(other); });
    # Object-form promise thunks execute under the effect just like positional thunks.
    - 'import { Effect } from "effect"; const work = Effect.tryPromise({ try: () => Effect.runPromise(other), catch: (cause) => cause });'
    # Applying a returned function is not another execution; only the inner runner reports.
    - import { Effect } from "effect"; const work = Effect.sync(() => Effect.runSync(callbackEffect)(value));
    # Ref.modify evaluates its state transition inside the runtime, including data-last usage.
    - import { Effect, Ref } from "effect"; const work = Ref.modify((count) => [Effect.runSync(next(count)), count])(counter);
