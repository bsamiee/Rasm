# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unchecked-item-count
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    sequence-type:
        any: [{matches: {csharp-type-name: {name: {regex: '^(Seq|Lst|Arr|Set|HashSet|Iterable|IEnumerable|IReadOnlyList|IReadOnlyCollection|IReadOnlySet|IList|ICollection|ISet|List|ImmutableArray|ImmutableList)$'}}}}, {kind: array_type}]
    sequence:
        any:
            - kind: 'collection_expression, array_creation_expression, implicit_array_creation_expression'
            - kind: invocation_expression
              has: {field: function, regex: '(^|\.)\s*(toSeq|Seq|Map|Select|Filter|Where|Choose|ToArray|ToList|Strict)(\s*<.+>)?$'}
            - matches: {csharp-declared-type: {type: {matches: sequence-type}}}
    counted:
        kind: member_access_expression
        any:
            - all:
                - has: {field: name, regex: '^(Delete|DeleteGrips|DeleteFaces|RemoveNgons|RemoveRange|SetHatchLines)$'}
                - not: {has: {field: expression, regex: '(^|\.)\s*Linetypes$'}}
            - all:
                - has: {field: name, regex: '^Attach$'}
                - has: {field: expression, regex: '(^|\.)\s*Worksession$'}
    compared:
        inside:
            stopBy: {not: {kind: parenthesized_expression}}
            kind: binary_expression
            has: {field: operator, regex: '^(==|!=)$'}
    discarded:
        any:
            - inside: {kind: expression_statement}
            - inside: {kind: assignment_expression, has: {field: left, regex: '^_$'}}
    collection-result:
        all:
            - has: {field: function, has: {field: name, regex: '^RemoveRange$'}}
            - not: {matches: discarded}
rule:
    kind: invocation_expression
    all:
        - has: {field: function, matches: counted, has: {field: name, pattern: $MEMBER}}
        - has: {field: arguments, has: {kind: argument, has: {matches: sequence, pattern: $ITEMS}}}
        - not: {matches: compared}
        - not: {matches: collection-result}
message: '`$MEMBER` returns how many items of `$ITEMS` it deleted or added, and no comparison checks the count'
note: Compare the count `<call>` answers with `<items>.Count` and fail on a difference with an error naming `nameof(<host type>.<member>)` and both counts
