    - source: <Target Name="AfterResGen"><Message Text="resources" /></Target>
      style: primary
      start: 0
      end: 64
  ? |
    <Target Name="BeforeCompile"><Message Text="compiling" /></Target>
  : labels:
    - source: <Target Name="BeforeCompile"><Message Text="compiling" /></Target>
      style: primary
      start: 0
      end: 66
