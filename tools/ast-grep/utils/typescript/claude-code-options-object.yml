# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# The narrowed options object, the name options or a parameter typed Options under any name, options(raw) reads raw and raw stays out
id: claude-code-options-object
language: tsx
rule:
    kind: identifier
    any:
        - regex: '^options$'
        - pattern: $OPTIONS
          # The parameter typed Options under any name, inline because a parameterized call under has fails random loads
          inside:
              stopBy: end
              matches: syntax-function-boundary
              has:
                  field: parameters
                  has:
                      kind: required_parameter
                      all:
                          - has: {field: pattern, kind: identifier, pattern: $OPTIONS}
                          - has: {field: type, kind: type_annotation, has: {kind: type_identifier, regex: '^Options$'}}
