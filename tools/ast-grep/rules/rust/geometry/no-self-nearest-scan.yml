# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-self-nearest-scan
language: rust
severity: error
utils:
    set-iter:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(iter|into_iter)$'}}, {has: {field: value, pattern: $PTS}}]}
            - has: {field: arguments, not: {has: {pattern: $_}}}
    set-iteration:
        any:
            - kind: reference_expression
              has: {field: value, pattern: $PTS}
            - matches: set-iter
            - pattern: $PTS
    distance-closure:
        kind: closure_expression
        regex: '\.(x|y|z)\b|distance|dist\(|length_squared|hypot|\.sqrt\(\)|powi\(\s*2\s*\)'
    mapped-distance:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(map|filter_map)$'}}
            - has: {field: arguments, has: {nthChild: 1, matches: distance-closure}}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(min_by|min_by_key|min|reduce|fold)$'}}, {has: {field: value, pattern: $SCAN}}]}
        - any:
            - all:
                - has: {field: function, has: {field: field, regex: '^(min_by|min_by_key)$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: distance-closure}}
            - all:
                - has: {field: function, has: {field: value, any: [{matches: mapped-distance}, {has: {stopBy: end, matches: mapped-distance}}]}}
                - any:
                    - has: {field: function, has: {field: field, regex: '^(min_by|min_by_key|min)$'}}
                    - has: {field: arguments, regex: '\bmin\b'}
        - has: {field: function, has: {field: value, any: [{matches: set-iter}, {has: {stopBy: end, matches: set-iter}}]}}
        - any:
            - inside:
                kind: for_expression
                stopBy: {kind: 'function_item, closure_expression'}
                has: {field: value, matches: set-iteration}
            - inside:
                kind: closure_expression
                stopBy: {kind: function_item}
                inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: field_expression, has: {field: value, matches: set-iteration}}}}
message: '`$SCAN` scans point set `$PTS` once per point of the same set'
note: 'Build one `kiddo::ImmutableKdTree` over the points and query each through `nearest_n` of 2 to skip itself, or `rstar::RTree` for boxes'
