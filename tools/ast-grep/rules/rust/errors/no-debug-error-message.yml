# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-debug-error-message
language: rust
severity: error
rule:
    kind: string_literal
    pattern: $MESSAGE
    not: {matches: rust-macro-argument}
    regex: '(^|[^{])(\{\{)*\{[^{}]*:[^{}]*\?\}'
    inside:
        kind: token_tree
        stopBy: {kind: attribute}
        inside: {kind: attribute, field: arguments, has: {nthChild: 1, kind: identifier, regex: '^(error|display)$', pattern: $ATTRIBUTE}, inside: {kind: attribute_item}}
message: '`#[$ATTRIBUTE($MESSAGE)]` formats a value through `Debug`'
note: 'Format each value through `Display`, a collection through argument `.<field>.iter().format(", ")` (`use itertools::Itertools as _;`)'
