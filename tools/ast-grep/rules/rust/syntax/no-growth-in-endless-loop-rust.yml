# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-growth-in-endless-loop-rust
language: rust
severity: error
utils:
    endless:
        kind: 'loop_expression, for_expression'
        all:
            - any:
                - kind: loop_expression
                - has: {field: value, kind: range_expression, regex: '\.\.$'}
            - not:
                any:
                    - has: {stopBy: {kind: 'closure_expression, function_item, async_block'}, kind: 'return_expression, try_expression'}
                    - has: {stopBy: {kind: 'closure_expression, function_item, async_block'}, kind: 'break_expression, continue_expression', has: {kind: label}}
                    - has: {stopBy: {kind: 'closure_expression, function_item, async_block, loop_expression, for_expression, while_expression'}, kind: break_expression}
                    - has: {stopBy: {kind: 'closure_expression, function_item, async_block'}, kind: macro_invocation, has: {kind: token_tree, regex: '\b(break|return)\b'}}
    shrink:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^(clear|pop|pop_front|pop_back|pop_first|pop_last|remove|swap_remove|truncate|drain|retain|retain_mut|split_off|dedup|dedup_by|dedup_by_key|shrink_to)$'}}
                - has: {field: function, has: {field: value, pattern: $GROWN}}
            - kind: assignment_expression
              has: {field: left, pattern: $GROWN}
            - kind: reference_expression
              all:
                - has: {kind: mutable_specifier}
                - has: {field: value, pattern: $GROWN}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: field_expression, has: {field: field, matches: rust-growing-method, not: {regex: '^(insert|insert_mut|try_insert)$'}}}
        - has: {field: function, has: {field: value, kind: identifier, pattern: $GROWN}}
        - inside:
            stopBy: {kind: 'closure_expression, function_item'}
            matches: endless
            all:
                - not: {has: {stopBy: end, kind: let_declaration, has: {field: pattern, pattern: $GROWN}}}
                - not: {has: {stopBy: end, matches: shrink}}
message: '`$GROWN` grows each pass of a loop with no exit and no removal'
note: 'Drain the buffer per pass with `std::mem::take(&mut <buffer>)`, cap a `VecDeque` with `pop_front` past a limit, or build it inside each pass'
