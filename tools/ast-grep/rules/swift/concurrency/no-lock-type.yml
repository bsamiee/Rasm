# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swift
severity: error
rule:
    kind: 'type_identifier, simple_identifier'
    regex: '^(NSLock|NSRecursiveLock|os_unfair_lock(_s|_t)?|pthread_mutex_t)$'
    pattern: $LOCK
    not:
        kind: simple_identifier
        any:
            - inside:
                  kind: property_declaration
                  stopBy: end
                  has: { kind: type_annotation, has: { stopBy: end, kind: type_identifier, pattern: $LOCK } }
            - inside:
                  kind: call_expression
                  follows: { stopBy: { kind: parameter }, kind: parameter, has: { stopBy: end, kind: type_identifier, pattern: $LOCK } }
message: '`$LOCK` guards state through a lock type, hold shared state in an actor, synchronous state in a class in `Mutex<State>`, and synchronous state of a copyable value in `OSAllocatedUnfairLock<State>`, each access in one `withLock`'
