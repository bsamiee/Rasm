name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - uses: nrwl/nx-set-shas@v5
              with:
                workflow-id: ci.yml
            - uses: ./.github/actions/setup
            - run: nx run rasm:check
            - run: nx affected -t check --exclude=tag:host:macos

    macos:
        runs-on: xcode-27
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - uses: nrwl/nx-set-shas@v5
              with:
                workflow-id: ci.yml
            - uses: ./.github/actions/setup
            - run: nx affected -t check --exclude='!tag:host:macos' -- CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

    format:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                persist-credentials: false
            - uses: ./.github/actions/setup
            - run: nx run rasm:format
            - run: git diff --exit-code

    required:
        needs: [check, macos, format]
        if: always()
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions: {}
        steps:
            - run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
              env:
                NEEDS: ${{ toJSON(needs) }}
