# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-answering-error
language: python
severity: error
utils:
    result-class:
        any:
            - matches: {python-member-use: {module: {regex: '^expression(\.core(\.result)?)?$'}, name: {regex: '^Result$'}}}
            - kind: subscript
              has: {field: value, matches: {python-member-use: {module: {regex: '^expression(\.core(\.result)?)?$'}, name: {regex: '^Result$'}}}}
    error-answer:
        kind: call
        any:
            - has: {field: function, matches: {python-member-use: {module: {regex: '^expression(\.core(\.result)?)?$'}, name: {regex: '^Error$'}}}}
            - has: {field: function, kind: attribute, all: [{has: {field: attribute, regex: '^Error$'}}, {has: {field: object, matches: result-class}}]}
            - all:
                - has: {field: function, matches: result-class}
                - has: {field: arguments, has: {kind: keyword_argument, has: {field: name, regex: '^error$'}}}
    answer:
        any:
            - kind: return_statement
            - kind: expression_statement
              has:
                any:
                    - kind: assignment
                      has: {field: left, kind: identifier}
                    - kind: yield
    error-handler:
        kind: block
        all:
            - has: {matches: answer}
            - not: {has: {pattern: $_, not: {any: [{matches: answer}, {kind: comment}]}}}
    class-handler:
        kind: except_clause
        all:
            - has: {field: value, pattern: $_}
            - not: {has: {regex: '^\*$'}}
            - has: {kind: block, matches: error-handler}
rule:
    kind: try_statement
    all:
        - not: {has: {kind: finally_clause}}
        - has: {kind: except_clause}
        - not: {has: {kind: except_clause, not: {matches: class-handler}}}
message: '`try` answers `Error` from every handler'
note: 'Call `expression.extra.result.catch(<callee>, exception=<error>)(<arguments>)` over each raising call'
