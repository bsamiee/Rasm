# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-proximity"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords             = ["collision", "distance", "geometry", "clash"]
categories           = ["mathematics", "algorithms"]
description          = "Proximity queries over placed shapes: clashes, separations, rays, neighbors, and registration"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive-where         = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
nutype               = { workspace = true }
bytemuck             = { workspace = true }
glamx                = { workspace = true }
nalgebra             = { workspace = true }
kiddo                = { workspace = true }
parry3d-f64          = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
