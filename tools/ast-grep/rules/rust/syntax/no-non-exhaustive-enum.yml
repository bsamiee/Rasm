# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: attribute_item
    all:
        - regex: '^#\[\p{White_Space}*(cfg_attr\p{White_Space}*\(.*,\p{White_Space}*)?non_exhaustive\p{White_Space}*\)?\p{White_Space}*\]$'
        - any:
            - precedes: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, kind: enum_item}
            - inside: {kind: enum_variant_list}
message: '`#[non_exhaustive]` marks a workspace enum or variant open'
note: 'Delete the attribute'
