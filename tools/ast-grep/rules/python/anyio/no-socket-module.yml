# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-socket-module
language: python
severity: error
utils:
    socket-member:
        regex: '^(socket|create_connection|create_server|getaddrinfo|getnameinfo|gethostbyname|gethostbyname_ex|gethostbyaddr|getfqdn)$'
rule:
    kind: call
    pattern: $CALL
    has:
        field: function
        any:
            - matches: {python-module-member: {module: {regex: '^socket$'}, name: {matches: socket-member}}}
            - matches: {python-imported-name: {module: {regex: '^socket$'}, name: {matches: socket-member}}}
message: '`$CALL` opens a socket or resolves a name outside anyio, the form of `anyio.connect_tcp`, `anyio.create_tcp_listener`, or `await anyio.getaddrinfo`'
