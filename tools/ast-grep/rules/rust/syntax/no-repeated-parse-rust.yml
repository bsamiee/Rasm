# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-parse-rust
language: rust
severity: error
utils:
    parse-method:
        kind: field_expression
        all:
            - has: {field: field, regex: '^parse$'}
            - has: {field: value, pattern: $INPUT, not: {regex: '\.(next|next_back|nth|pop|pop_front|pop_back|recv|take|remove)\('}}
    parser-path:
        kind: scoped_identifier
        regex: '::(from_str|from_str_radix|try_from|parse)$'
    parse-of:
        kind: call_expression
        any:
            - all:
                - has: {field: function, any: [{matches: parse-method}, {kind: generic_function, has: {field: function, matches: parse-method}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - all:
                - has: {field: function, matches: parser-path}
                - has: {field: arguments, has: {nthChild: 1, pattern: $INPUT, not: {regex: '^&\s*mut\b'}}, not: {has: {nthChild: 3}}}
    after-parse:
        inside: {kind: block}
        follows: {stopBy: end, any: [{matches: parse-of}, {has: {stopBy: {kind: block}, matches: parse-of}}]}
    parse-stream:
        inside:
            kind: 'function_item, closure_expression'
            stopBy: end
            any:
                - has: {field: parameters, has: {kind: parameter, all: [{has: {field: pattern, pattern: $INPUT}}, {has: {field: type, regex: 'Parse(Stream|Buffer)\b'}}]}}
                - has: {stopBy: end, kind: let_declaration, all: [{has: {field: pattern, pattern: $INPUT}}, {has: {field: value, regex: '\.(fork|lookahead1)\(\)$'}}]}
    keyed-parse:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: generic_function, all: [{has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^parse$'}}, {has: {field: value, pattern: $ARGUMENT}}]}}, {has: {field: type_arguments, has: {nthChild: 1, pattern: $KEY}, not: {has: {nthChild: 2}}}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - all:
                - has: {field: function, matches: parser-path, any: [{regex: '::from_str$', has: {field: path, pattern: $KEY}}, {not: {regex: '::from_str$'}, pattern: $KEY}]}
                - has: {field: arguments, has: {nthChild: 1, pattern: $ARGUMENT}, not: {has: {nthChild: 2}}}
    owner-parse:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: generic_function, all: [{has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^parse$'}}, {has: {field: value, kind: identifier, pattern: $PARAMETER}}]}}, {has: {field: type_arguments, has: {nthChild: 1, pattern: $KEY}, not: {has: {nthChild: 2}}}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - all:
                - has: {field: function, matches: parser-path, any: [{regex: '::from_str$', has: {field: path, pattern: $KEY}}, {not: {regex: '::from_str$'}, pattern: $KEY}]}
                - has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $PARAMETER}, not: {has: {nthChild: 2}}}
    owner-shape:
        kind: function_item
        all:
            - has: {field: parameters, all: [{has: {kind: parameter, nthChild: 1, all: [{has: {field: pattern, kind: identifier, pattern: $PARAMETER}}, {has: {field: type, kind: reference_type, has: {field: type, kind: primitive_type, regex: '^str$'}}}]}}, {not: {has: {nthChild: 2}}}]}
            - has: {field: body, kind: block, all: [{has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, matches: owner-parse}}, {not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}}]}
    owner:
        matches: owner-shape
        has: {field: name, pattern: $OWNER}
rule:
    pattern: $SECOND
    all:
        - any:
            - all:
                - matches: parse-of
                - any:
                    - matches: after-parse
                    - inside: {stopBy: {kind: 'function_item, closure_expression'}, matches: after-parse}
                - not: {matches: parse-stream}
            - all:
                - matches: keyed-parse
                - inside: {kind: source_file, stopBy: end, regex: '\bfn\s+\w+\s*(<[^>]*>)?\s*\(\s*\w+\s*:\s*&\s*(''\w+\s+)?str\s*,?\s*\)', has: {stopBy: end, matches: owner}}
                - not: {inside: {kind: function_item, stopBy: end, has: {field: name, pattern: $OWNER}}}
        - not: {matches: rust-test-scope}
labels:
    OWNER: {style: secondary, message: 'Function performing the parse'}
message: '`$SECOND` repeats a parse an earlier expression or a one-parameter function of the file performs'
note: 'Parse the input once at the boundary into its domain type and pass the value, or call the file''s one-parameter parsing function'
