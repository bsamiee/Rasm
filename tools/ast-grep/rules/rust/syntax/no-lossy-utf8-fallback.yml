# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lossy-utf8-fallback
language: rust
severity: error
utils:
    lossy-text:
        any:
            - pattern: String::from_utf8_lossy($E.as_bytes()).into_owned()
            - pattern: String::from_utf8_lossy($E.as_bytes()).to_string()
            - pattern: String::from_utf8_lossy($E.as_bytes()).into()
            - pattern: String::from(String::from_utf8_lossy($E.as_bytes()))
            - pattern: String::from_utf8_lossy(&$E.into_bytes()).into_owned()
            - pattern: String::from_utf8_lossy(&$E.into_bytes()).to_string()
            - pattern: String::from_utf8_lossy(&$E.into_bytes()).into()
            - pattern: String::from(String::from_utf8_lossy(&$E.into_bytes()))
            - pattern: $E.into_utf8_lossy()
    lossy-body:
        any:
            - matches: lossy-text
            - kind: block
              all:
                - has: {nthChild: {position: 1, ofRule: {matches: rust-statement-slot}}, matches: lossy-text}
                - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement-slot}}}}
    lossy-closure:
        kind: closure_expression
        all:
            - has: {field: parameters, has: {any: [{kind: identifier, pattern: $E}, {kind: parameter, has: {field: pattern, pattern: $E}}]}}
            - has: {field: body, matches: lossy-body}
    lossy-path:
        kind: scoped_identifier
        regex: '^(((std|alloc)::)?string::)?FromUtf8Error::into_utf8_lossy$'
    pass-arm:
        pattern: {context: 'match x { Ok($S) => $S }', selector: match_arm}
    lossy-arm:
        kind: match_arm
        all:
            - pattern: {context: 'match x { Err($E) => $_ }', selector: match_arm}
            - has: {field: value, matches: lossy-body}
rule:
    kind: 'call_expression, match_expression'
    all:
        - not: {matches: rust-commented}
        - any:
            - pattern: String::from_utf8($V).unwrap_or_else($F)
              has: {field: arguments, has: {any: [{matches: lossy-closure}, {matches: lossy-path}]}}
            - kind: match_expression
              all:
                - has: {field: value, pattern: 'String::from_utf8($V)'}
                - has: {field: body, not: {has: {kind: match_arm, nthChild: {position: 3, ofRule: {kind: match_arm}}}}}
                - has: {field: body, has: {matches: pass-arm}}
                - has: {field: body, has: {matches: lossy-arm}}
fix: String::from_utf8_lossy_owned($V)
message: '`String::from_utf8` falls back to a lossy copy of its own bytes'
note: 'Call `String::from_utf8_lossy_owned(<bytes>)` (Rust 1.99), which keeps the buffer when it is valid UTF-8 and replaces invalid sequences otherwise'
