    fixed: '''on'': {''workflow_dispatch'': {''inputs'': {value: {, description: Value}}}}'
    labels:
    - source: '''required'''
      style: primary
      start: 48
      end: 58
  ? |-
    inputs: {value: {required: false, description: Value}}
    runs: {using: composite, steps: []}
  : fixed: |-
      inputs: {value: {, description: Value}}
      runs: {using: composite, steps: []}
