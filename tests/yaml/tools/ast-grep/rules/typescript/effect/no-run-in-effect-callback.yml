id: no-run-in-effect-callback
valid:
    - |
      import { Effect } from "effect";
      const a = Effect.flatMap(task, (n) => load(n));
    - |
      import { Effect } from "effect";
      Effect.runPromise(task);
    - |
      import { Effect } from "effect";
      const a = Effect.map(task, () => Effect.gen(function* () {
          return yield* load(1);
      }));
invalid:
    - |
      import { Effect } from "effect";
      const a = Effect.map(task, (n) => Effect.runSync(load(n)));
    - |
      import { Effect, Stream } from "effect";
      const a = Stream.tap(stream, (n) => {
          Effect.runFork(log(n));
      });
