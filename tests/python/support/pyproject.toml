# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-testing"
version         = "0.0.0"
description     = "Test toolchain and shared fixtures of every Python suite, loaded as a pytest plugin"
requires-python = ">=3.13"

dependencies = [
    "hypothesis",       # Property-based tests, a required pytest plugin
    "pytest",           # Test collection, assertions, and fixtures
    "pytest-cov",       # Coverage collection, a required pytest plugin
    "pytest-randomly",  # Random test order and seeds, a required pytest plugin
    "pytest-reportlog", # JSON Lines test reports
    "pytest-socket",    # Block unrequested network connections
    "pytest-timeout",   # Per-test deadline
]

[project.entry-points.pytest11]
rasm_testing = "rasm_testing"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table

# --- [FAWLTYDEPS] -----------------------------------------------------------------------

[tool.fawltydeps]
ignore_unused = ["hypothesis", "pytest", "pytest-*"] # pytest loads the toolchain by entry point
