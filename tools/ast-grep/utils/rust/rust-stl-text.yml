# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-stl-text
language: rust
utils:
    printing:
        matches: {rust-std-macro: {name: {regex: '^(write|writeln|format|format_args|print|println|eprint|eprintln)$'}}}
rule:
    kind: string_literal
    regex: '^b?"\s*(facet normal|outer loop|endfacet|endloop|endsolid)\b'
    not: {inside: {stopBy: {kind: 'function_item, closure_expression'}, matches: printing}}
