# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-prose-matcher
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    # Event fields holding prose a person or the model wrote, edited text and sent messages included, a match on them fires when the rule is discussed
    prose-field:
        regex: '^(text|description|answer|prompt|content|new_string|old_string|new_source|message|summary|explanation)$'
    # RegExp value of a matcher, a literal, a constructor, a list holding one, or a name bound to one, an exact string fires on the whole text alone
    regex-value:
        any:
            - kind: regex
            - pattern: new RegExp($$$)
            - pattern: RegExp($$$)
            - kind: array
              has: {matches: regex-value}
            - kind: identifier
              pattern: $R
              inside:
                  kind: program
                  stopBy: end
                  has:
                      stopBy: end
                      kind: variable_declarator
                      all:
                          - has: {field: name, pattern: $R}
                          - has: {field: value, matches: regex-value}
    # Refusal in the hook body, a deny or drop pair, its shorthand, or the constructor call of the composition core
    refusal:
        any:
            - kind: pair
              has: {field: key, regex: '^(deny|drop)$'}
            - kind: shorthand_property_identifier
              regex: '^(deny|drop)$'
            - kind: call_expression
              has: {field: function, kind: identifier, regex: '^(deny|drop)$'}
    # Member of the event, e.input under tool.call holds the edited text, the member binds $E as its object
    event-path:
        kind: member_expression
        has: {field: object, pattern: $E}
    # Read of a prose field on the event parameter or a member of it, as a member, as an index, or through a local the hook declares
    prose-read:
        any:
            - kind: member_expression
              all:
                  - has: {field: property, pattern: $F, matches: prose-field}
                  - has: {field: object, any: [{matches: event-path}, {pattern: $E}]}
            - kind: subscript_expression
              all:
                  - has: {field: index, kind: string, pattern: $F, has: {kind: string_fragment, matches: prose-field}}
                  - has: {field: object, any: [{matches: event-path}, {pattern: $E}]}
            # The field destructured from the event under its own name
            - kind: identifier
              pattern: $F
              matches: prose-field
              inside:
                  stopBy: end
                  kind: statement_block
                  has:
                      stopBy: end
                      kind: variable_declarator
                      all:
                          - has: {field: name, kind: object_pattern, has: {kind: shorthand_property_identifier_pattern, pattern: $F}}
                          - has: {field: value, pattern: $E}
            # The read held in a local under another name
            - kind: identifier
              pattern: $LOCAL
              inside:
                  stopBy: end
                  kind: statement_block
                  has:
                      stopBy: end
                      kind: variable_declarator
                      all:
                          - has: {field: name, kind: identifier, pattern: $LOCAL}
                          - has: {field: value, matches: prose-read}
    # The read or a method call chained on it, the case-folded or trimmed text
    prose-value:
        any:
            - matches: prose-read
            - kind: call_expression
              has: {field: function, kind: member_expression, has: {field: object, matches: prose-value}}
    # Search method called on the value
    search-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(includes|startsWith|endsWith|indexOf|lastIndexOf|match|matchAll|search)$'}
                - has: {field: object, matches: prose-value}
    # String test on the value, a search method, a RegExp test or exec over it, or an equality, one over a search result reports at the search call
    prose-test:
        any:
            - matches: search-call
            - kind: call_expression
              all:
                  - has: {field: function, kind: member_expression, has: {field: property, regex: '^(test|exec)$'}}
                  - has: {field: arguments, has: {matches: prose-value}}
            # Equality against the empty string or template checks presence and matches no prose
            - kind: binary_expression
              all:
                  - has: {field: operator, regex: '^(===|!==|==|!=)$'}
                  - has: {matches: prose-value, not: {matches: search-call}}
                  - not: {has: {any: [{kind: string}, {kind: template_string}], not: {has: {kind: string_fragment}}}}
rule:
    any:
        # RegExp on a prose key at any depth of the matcher, the second argument of on(event, matcher, hook)
        - kind: pair
          all:
              - has: {field: key, pattern: $F, matches: prose-field}
              - has: {field: value, matches: regex-value}
              - inside:
                    stopBy: end
                    kind: object
                    any:
                        # The matcher is the one object among the arguments, the hook is a function and the event a string
                        - inside: {kind: arguments, inside: {matches: claude-code-registration}}
                        # The matcher bound to a name the registration passes
                        - inside:
                              kind: variable_declarator
                              all:
                                  - has: {field: name, pattern: $M}
                                  - inside:
                                        kind: program
                                        stopBy: end
                                        has:
                                            stopBy: end
                                            matches: claude-code-registration
                                            has: {field: arguments, has: {kind: identifier, pattern: $M}}
        # String test on a prose field inside a hook that refuses, the hook binds $E as its second parameter
        - matches: prose-test
          inside:
              stopBy: end
              matches: {claude-code-hook: {event: {pattern: $_}}}
              all:
                  - has: {field: parameters, has: {nthChild: 2, has: {pattern: $E}}}
                  - has: {stopBy: end, matches: refusal}
message: The refusal is keyed on the prose of `$F`, and the match fires when the rule is discussed
note: Match on `tool`, `component`, or the parsed command, and read prose in a hook that rewrites it with a `context` line
