# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unvalidated-construction
language: csharp
severity: error
utils:
    callee:
        kind: member_access_expression
        has: {field: name, pattern: $CALLEE}
    flags-type:
        matches: {csharp-type-name: {name: {regex: '^BindingFlags$'}}}
    non-public-member:
        kind: member_access_expression
        matches: {csharp-owner-member: {type: {regex: '^BindingFlags$'}, member: {regex: '^NonPublic$'}}}
    non-public-flag:
        has:
            stopBy: end
            any:
                - matches: non-public-member
                - kind: cast_expression
                  all:
                    - has: {field: type, matches: flags-type}
                    - has: {field: value, kind: integer_literal}
                - kind: identifier
                  pattern: $FLAGS
                  inside:
                    kind: compilation_unit
                    stopBy: end
                    has:
                        stopBy: end
                        kind: variable_declarator
                        all:
                            - has: {field: name, pattern: $FLAGS}
                            - has: {stopBy: end, matches: non-public-member}
rule:
    any:
        - kind: invocation_expression
          all:
            - has: {field: function, matches: callee, has: {field: name, regex: '^GetConstructors?$'}}
            - has: {field: arguments, matches: non-public-flag}
        - kind: method_declaration
          all:
            - has: {field: name, pattern: $CALLEE}
            - not: {has: {kind: attribute_list, has: {kind: attribute, has: {field: name, matches: {csharp-type-name: {name: {regex: '^UnsafeAccessorType(Attribute)?$'}}}}}}}
            - not:
                all:
                    - has: {field: returns, pattern: $COPIED}
                    - has:
                        field: parameters
                        all:
                            - has: {kind: parameter, nthChild: {position: 1, ofRule: {kind: parameter}}, has: {field: type, pattern: $COPIED}}
                            - not: {has: {kind: parameter, nthChild: {position: 2, ofRule: {kind: parameter}}}}
            - has:
                kind: attribute_list
                has:
                    kind: attribute
                    all:
                        - has: {field: name, matches: {csharp-type-name: {name: {regex: '^UnsafeAccessor(Attribute)?$'}}}}
                        - has: {stopBy: end, kind: attribute_argument, nthChild: 1, has: {matches: {csharp-owner-member: {type: {regex: '^UnsafeAccessorKind$'}, member: {regex: '^Constructor$'}}}}}
        - kind: invocation_expression
          has:
            field: function
            kind: member_access_expression
            all:
                - has:
                    field: name
                    kind: generic_name
                    pattern: $CALLEE
                    has:
                        kind: type_argument_list
                        not:
                            has:
                                nthChild: {position: 1, reverse: true}
                                any:
                                    - kind: predefined_type
                                    - kind: identifier, qualified_name, generic_name
                                      regex: |-
                                        (?x)^(global::)?(
                                            (System\.)?(Half|U?Int128)
                                            |(System\.Runtime\.InteropServices\.)?NFloat
                                            |(System\.Numerics\.)?(Vector[234]|Plane|Quaternion|Matrix3x2|Matrix4x4|Complex|Vector<.+>)
                                            |(System\.Runtime\.Intrinsics\.)?Vector(64|128|256|512)<.+>
                                            |(SixLabors\.ImageSharp\.PixelFormats\.)?(
                                                (A|Abgr|Argb|Bgr|Bgra|L|La|Rg|Rgb|Rgba)\d+P?
                                                |(Normalized)?(Byte|Short)[24]P?
                                                |Half(Single|Vector[24]P?)
                                                |RgbaHalfP?
                                                |RgbaVector
                                            )
                                        )$
                                    - kind: identifier
                                      pattern: $PARAMETER
                                      inside:
                                        stopBy: end
                                        has:
                                            kind: type_parameter_constraints_clause
                                            all:
                                                - has: {kind: identifier, pattern: $PARAMETER}
                                                - has:
                                                    kind: type_parameter_constraint
                                                    has: {field: type, matches: {csharp-type-name: {name: {regex: '^(IBinaryInteger|IFloatingPointIeee754|IBinaryFloatingPointIeee754|IPixel)$'}}}}
                - any:
                    - all:
                        - has: {field: expression, matches: {csharp-type-name: {name: {regex: '^Unsafe$'}}}}
                        - has: {field: name, regex: '^(As|BitCast|Read|ReadUnaligned)<'}
                    - all:
                        - has: {field: expression, matches: {csharp-type-name: {name: {regex: '^MemoryMarshal$'}}}}
                        - has: {field: name, regex: '^(Cast|AsRef|Read|TryRead)<'}
message: '`$CALLEE` bypasses the public constructors and factories of the type it creates'
note: 'Construct through a declared factory or public constructor, `[UnsafeAccessor]` with `[UnsafeAccessorType]` for a type the compiler cannot see'
