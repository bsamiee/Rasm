# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-platform-provide-in-test
language: tsx
severity: error
utils:
    platform-layer:
        kind: member_expression
        all:
            - has: {field: property, regex: '^layer'}
            - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^@effect/platform-node$'}, exported: {regex: '^Node\w+$'}}}}
rule:
    kind: call_expression
    all:
        - has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^provide$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Effect)?$'}, exported: {regex: '^Effect$'}}}}
        - has:
            field: arguments
            has:
                nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}
                any:
                    - matches: platform-layer
                      pattern: $LAYER
                    - has: {stopBy: {matches: syntax-function-boundary}, matches: platform-layer, pattern: $LAYER}
        - inside:
            kind: program
            stopBy: end
            has: {kind: import_statement, has: {field: source, has: {kind: string_fragment, regex: '^(@effect/)?vitest$'}}}
message: '`Effect.provide` builds `$LAYER` per effect run inside a test module'
note: '`layer($LAYER)` from `@effect/vitest` provides it once per file, the `it.effect` cases it passes name the services in `R`'
labels:
    LAYER: {style: primary}
