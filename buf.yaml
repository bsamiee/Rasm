# Gate axis; generation is sibling buf.gen.yaml
version: v2
modules:
  - path: tests/contracts/proto                      # rasm.contracts.<family>.v1; directory spells the package
    name: buf.build/rasm/contracts                   # One published estate release unit; vendored publisher modules remain unnamed
  - path: tests/contracts/vendor/cloudevents/proto   # Publisher bytes; estate grades no copy of them
    lint: {disable_builtin: true}
    breaking: {disable_builtin: true}
  - path: tests/contracts/vendor/grpc-health/proto   # Publisher bytes; Python has no package-shipped health client, so it generates here
    lint: {disable_builtin: true}
    breaking: {disable_builtin: true}
deps:
  - buf.build/bufbuild/protovalidate                 # (buf.validate.field) rules; STANDARD's PROTOVALIDATE rule type-checks them
  - buf.build/googleapis/googleapis                  # google.rpc error details beside FaultDetail; google.type calendar scalars
lint:
  use: [STANDARD]
breaking:
  use: [FILE]  # Generated trees bind the file path as an import path; file move breaks a consumer the wire rules pass
