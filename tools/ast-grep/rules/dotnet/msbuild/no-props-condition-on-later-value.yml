# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-props-condition-on-later-value
language: xml
severity: error
files: ['**/Directory.Build.props']
rule:
    kind: Attribute
    all:
        - has: {kind: Name, regex: '^(Condition|Project)$'}
        - has:
            kind: AttValue
            regex: "\\$\\((TargetFramework|TargetFrameworks|OutputType|TargetFrameworkIdentifier|TargetFrameworkVersion|TargetFrameworkMoniker|OutputPath|IntermediateOutputPath|TargetPath|TargetDir|TargetFileName|IsTestProject|IsTestingPlatformApplication|RhinoHost|PluginHost|ReleaseGroup|HostCommon|HostUi|HostPlatform|HostGrasshopper)[.)]"
        - not: {has: {kind: AttValue, regex: "^\"\\s*('\\$\\(\\w+\\)' == ''\\s*((and|or)\\s+)?)+\"$"}}
        - inside:
            matches: msbuild-tag
            inside:
                any:
                    - matches: {msbuild-element: {name: {regex: '^(PropertyGroup|When|Import)$'}}}
                    - matches: {msbuild-property: {name: {kind: Name}}}
        - not: {inside: {matches: {msbuild-element: {name: {regex: '^Target$'}}}, stopBy: end}}
message: The .props condition reads a value the project body or the SDK targets assign later, and compares an empty string
note: Move the group or the import to Directory.Build.targets, or key the condition on $(MSBuildProjectName) or the project directory
