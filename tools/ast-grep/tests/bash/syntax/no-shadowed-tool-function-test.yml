id: no-shadowed-tool-function
valid:
    - |
      copy_tree() { cp -RL "$1" "$2"; }
    - |
      tree_root() { printf '%s\n' "$PWD"; }
    - |
      tree -D tools
    - |
      function fdx { printf '%s\n' "$@"; }
    - |
      rgx() { rg -x "$@"; }
    - |
      Cat() { printf '%s\n' "$@"; }
invalid:
    - |
      tree-sitter() { command tree-sitter "$@"; }
    - |
      git-lfs() { :; }
    - |
      tree() {
          local root=$1
          cp -RL "$PWD/rules" "$root/rules"
      }
    - |
      function fd { printf '%s\n' "$@"; }
    - |
      sort() { printf '%s\n' "$@"; }
    - |
      echo() { printf '%s\n' "$*"; }
    - |
      git() { command git "$@"; }
    - |
      ast-grep() { command ast-grep "$@"; }
    - |
      set() { :; }
    - |
      pnpm() { corepack pnpm "$@"; }
    - |
      function jq() { command jq "$@"; }
    - |
      git () { command git "$@"; }
