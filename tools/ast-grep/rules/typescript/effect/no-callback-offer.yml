# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-callback-offer
language: tsx
severity: error
utils:
    queue-module:
        matches: {effect-module: {name: {regex: '\bQueue$'}}}
    effect-module-object:
        matches: {effect-module: {name: {regex: '\bEffect$'}}}
    constructor-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(make|unbounded|bounded|dropping|sliding)$'}
                - has: {field: object, matches: queue-module}
    queue-value:
        any:
            - matches: constructor-call
            - kind: 'yield_expression, await_expression'
              has: {matches: constructor-call}
            - kind: yield_expression
              has:
                kind: call_expression
                all:
                    - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^all$'}}, {has: {field: object, matches: effect-module-object}}]}
                    - has: {field: arguments, has: {nthChild: 1, kind: 'array, object', has: {any: [{matches: constructor-call}, {kind: pair, has: {field: value, matches: constructor-call}}]}}}
    queue-offer:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(offer|offerAll)$'}}, {has: {field: object, matches: queue-module}}]}
            - has: {field: arguments, has: {nthChild: 1, pattern: $QUEUE}}
    offer-call:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(offerUnsafe|offerAllUnsafe)$'}}, {has: {field: object, matches: queue-module}}]}
                - has: {field: arguments, has: {nthChild: 1, pattern: $QUEUE}}
            - all:
                - has:
                    field: function
                    kind: member_expression
                    all:
                        - has: {field: property, regex: '^(runFork|runSync|runPromise|runCallback)$'}
                        - has: {field: object, matches: effect-module-object}
                - has: {field: arguments, has: {nthChild: 1, matches: queue-offer}}
rule:
    kind: 'identifier, shorthand_property_identifier_pattern'
    pattern: $QUEUE
    any:
        - inside: &declarator
            kind: variable_declarator
            field: name
            has: {field: value, matches: queue-value}
            inside:
                kind: lexical_declaration
                inside:
                    kind: statement_block
                    has:
                        stopBy: end
                        matches: typescript-function-boundary
                        has: {stopBy: end, matches: offer-call}
        - inside: {kind: 'array_pattern, object_pattern', inside: *declarator}
        - inside: {kind: pair_pattern, field: value, inside: {kind: object_pattern, inside: *declarator}}
message: 'Callback feeds `$QUEUE` outside the effect that built it'
note: 'Build the queue through `Stream.callback((queue) => <registration>)`, and fork its consumer with `Effect.forkScoped({ startImmediately: true })` where a later step reads the registration'
