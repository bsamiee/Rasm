# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discarded-task
language: csharp
severity: error
utils:
    task-type:
        matches: {csharp-type-name: {name: {regex: '^(Task|ValueTask)$'}}}
    started:
        any:
            - kind: invocation_expression
              has:
                field: function
                any:
                    - {kind: identifier, regex: 'Async$'}
                    - {kind: generic_name, has: {kind: identifier, regex: 'Async$'}}
                    - kind: member_access_expression
                      any:
                        - has: {field: name, regex: 'Async(<.*>)?$|^(ConfigureAwait|ContinueWith|AsTask|WaitAsync)$'}
                        - all:
                            - has: {field: expression, regex: '^((global::)?System\.Threading\.Tasks\.)?Task(\.Factory)?$'}
                            - has: {field: name, regex: '^(Run|StartNew|Delay|WhenAll|WhenAny|WhenEach)$'}
              not: {has: {field: function, kind: member_access_expression, has: {field: expression, regex: '^IO$'}}}
            - kind: identifier
              matches: {csharp-declared-type: {type: {matches: task-type}}}
    discarded:
        any:
            - kind: assignment_expression
              all:
                - has: {field: left, kind: identifier, regex: '^_$'}
                - has: {field: operator, regex: '^=$'}
                - has: {field: right, matches: started, pattern: $TASK}
            - kind: variable_declarator
              all:
                - has: {field: name, regex: '^_$'}
                - has: {matches: started, pattern: $TASK}
rule:
    matches: discarded
message: '`$TASK` starts work and discards its task, no caller observes its failure or completion'
note: 'Await the task, return it to an awaiting caller, or pass it to a combinator that observes it (`Task.WhenAll`, `IO.liftAsync`, a `Channel` consumer the composition root runs)'
