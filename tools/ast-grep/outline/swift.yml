id: swift-member-property
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object]
symbolType: property
rule:
    kind: &declaration property_declaration
    pattern: $DECLARATION
    inside: &scope {kind: 'source_file > class_declaration > :is(class_body, enum_class_body)'}
    all:
        - any:
            - has: {field: name, kind: pattern, has: {field: bound_identifier, pattern: $SINGLE_NAME}}
              not: {has: {kind: pattern, follows: {kind: pattern, stopBy: end}}}
            - pattern: $GROUP_DECLARATION
              has:
                  kind: pattern
                  any:
                      - kind: &leaf 'pattern:not(:has(> pattern))'
                        has: {kind: simple_identifier}
                      - has: {kind: *leaf, has: {kind: simple_identifier}, stopBy: end}
        - any:
            - has: {kind: computed_property, pattern: $ACCESSOR_BODY, has: {kind: 'computed_getter, computed_setter, computed_modify, computed_init'}}
            - has: {kind: computed_property, has: {pattern: $$IMPLICIT_TOKEN, regex: '^\{$'}, not: {has: {kind: 'computed_getter, computed_setter, computed_modify, computed_init'}}}
            - not: {has: {kind: computed_property}}
rewriters:
    - id: nonbinding
      rule:
          not: {kind: 'property_declaration, pattern'}
      fix: ''
    - id: binding
      rule:
          kind: *leaf
          has: {kind: simple_identifier, pattern: $BINDING_NAME}
      fix: '$BINDING_NAME, '
    - id: body
      rule:
          kind: 'computed_property, willset_didset_block'
          inside: {kind: *declaration, inside: *scope}
      fix: ''
    - id: initializer
      rule:
          all:
              - not: {has: {pattern: $$_}}
              - regex: '^=$'
              - inside: {kind: *declaration, inside: *scope}
      fix: {template: '', expandEnd: {not: {kind: 'comment, multiline_comment'}, stopBy: {not: {kind: 'comment, multiline_comment'}}}}
    - id: accessor
      rule:
          kind: &accessor 'computed_getter, computed_setter, computed_modify, computed_init'
          pattern: $ACCESSOR_DECLARATION
          inside: {kind: computed_property, inside: {kind: *declaration, inside: *scope}}
      transform:
          ACCESSOR_HEADER: {rewrite: {source: $ACCESSOR_DECLARATION, rewriters: [accessor-body]}}
          ACCESSOR_SIGNATURE: {replace: {source: $ACCESSOR_HEADER, replace: '\s+$', by: ''}}
      fix: $ACCESSOR_SIGNATURE
    - id: accessor-body
      rule:
          all:
              - inside:
                    kind: *accessor
                    inside: {kind: computed_property, inside: {kind: *declaration, inside: *scope}}
              - any:
                  - kind: statements
                  - regex: '^[{}]$'
      fix: ''
transform:
    NAMES: {rewrite: {source: $GROUP_DECLARATION, rewriters: [nonbinding, binding], joinBy: ''}}
    GROUP_NAME: {replace: {source: $NAMES, replace: ', $', by: ''}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, initializer]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
    ACCESSORS: {rewrite: {source: $ACCESSOR_BODY, rewriters: [accessor], joinBy: ' '}}
    COMPUTED: {replace: {source: $ACCESSORS, replace: '(?s)^(.+)$', by: ' { $1 }'}}
    IMPLICIT: {replace: {source: $IMPLICIT_TOKEN, replace: '^\{$', by: ' { get }'}}
name: $SINGLE_NAME$GROUP_NAME
signature: $SIGNATURE$COMPUTED$IMPLICIT
isPublic:
    any:
        - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
        - not:
              any:
                  - has: &private {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}
                  - inside:
                        kind: class_body
                        inside:
                            kind: class_declaration
                            has:
                                field: declaration_kind
                                regex: '^extension$'
                                follows: {all: [*private], stopBy: {pattern: $_, not: {kind: 'comment, multiline_comment'}}}


