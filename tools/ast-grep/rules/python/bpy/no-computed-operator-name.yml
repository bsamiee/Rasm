# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    ops-module:
        matches: {python-member-use: {module: {regex: '^bpy$'}, name: {regex: '^ops$'}}}
    operators:
        any:
            - matches: ops-module
            - kind: attribute
              has: {field: object, matches: ops-module}
            - matches: {builtins-getattr-call: {object: {matches: ops-module}}}
rule:
    kind: call
    pattern: $ACCESS
    all:
        - has: {field: arguments, has: {nthChild: 2, not: {matches: python-plain-string}}}
        - matches: {builtins-getattr-call: {object: {matches: operators}}}
        - not: {inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^getattr$'}}}}
        - not: {inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: {python-builtin-name: {name: {regex: '^dir$'}}}}}}}
        - not:
            all:
                - has: {field: arguments, has: {nthChild: 2, kind: identifier, pattern: $NAME}}
                - inside:
                    kind: function_definition
                    stopBy: end
                    has:
                        field: body
                        has:
                            kind: expression_statement
                            has:
                                kind: assignment
                                all:
                                    - has: {field: left, has: {kind: identifier, pattern: $NAME}}
                                    - has: {field: right, kind: call, has: {field: function, kind: attribute, has: {field: attribute, regex: '^partition$'}}}
                - inside: {kind: expression_statement, stopBy: end, precedes: {kind: expression_statement, has: {kind: call, has: {field: function, regex: 'rna_type$'}}}}
message: '`$ACCESS` reaches an operator by a computed name'
note: 'Call operators directly, `dir(getattr(bpy.ops, <module>))` lists, `partition` resolves idnames before an RNA type read on next statement'
