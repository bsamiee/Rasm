# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-checked-value-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    owner:
        matches: {csharp-type-name: {name: {regex: '^Refused$'}}}
    unsafe:
        any:
            - kind: member_access_expression, element_access_expression, conditional_access_expression, cast_expression
            - kind: binary_expression
              has: {field: operator, regex: '^[/%]$'}
            - kind: object_creation_expression
              has: {field: type, matches: owner}
    plain:
        any:
            - kind: lambda_expression
            - not: {any: [{matches: unsafe}, {has: {stopBy: {kind: lambda_expression}, matches: unsafe}}]}
    typed:
        has: {matches: {csharp-type-name: {name: {regex: '^Fin$'}}}}
    result:
        inside:
            any:
                - kind: lambda_expression
                  matches: typed
                - kind: arrow_expression_clause, return_statement
                  inside:
                    stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, property_declaration'}
                    kind: method_declaration, local_function_statement, lambda_expression, property_declaration
                    matches: typed
                - kind: conditional_expression
                  matches: result
    error-branch:
        kind: object_creation_expression
        all:
            - has: {field: type, matches: owner}
            - has: {field: arguments, has: {kind: argument, nthChild: 2, has: {matches: {csharp-owner-member: {type: {regex: '^Refused$'}, member: {regex: '^(Declined|Empty|Invalid)$'}}}}}}
            - not: {all: [{has: {field: arguments, has: {kind: argument, nthChild: 3}}}, {not: {has: {field: arguments, has: {kind: argument, nthChild: 2, regex: 'Declined$'}}}}]}
rule:
    any:
        - pattern: Refused.$GUARD($$$).$MAP($LIFT)
        - kind: conditional_expression
          any:
            - all: [{has: {field: alternative, matches: error-branch}}, {has: {field: consequence, matches: plain}}]
            - all: [{has: {field: consequence, matches: error-branch}}, {has: {field: alternative, matches: plain}}]
          matches: result
          not: {has: {field: condition, has: {stopBy: end, kind: 'declaration_pattern, var_pattern, recursive_pattern'}}}
    not: {matches: {csharp-owner-body: {type: {regex: '^Refused$'}, member: {regex: '^Unless\w*$'}}}}
constraints:
    GUARD: {regex: '^Unless(Found)?$'}
    MAP: {regex: '^(Map|Select)(\s*<.+>)?$'}
    LIFT:
        has:
            kind: lambda_expression
            all:
                - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $DISCARDED}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $DISCARDED}}}]}
                - has: {field: body, not: {kind: block}, matches: plain}
                - not: {has: {field: body, any: [{pattern: $DISCARDED}, {has: {stopBy: end, kind: identifier, pattern: $DISCARDED}}]}}
message: Check selects between a value and `Refused` by hand
note: Use the `Refused` guard naming the reason the arm passes, `Unless(<check>, <value>, <member>)` for `Declined` with its index overload where the arm passes one, `UnlessFound` for `Empty`, and `UnlessValid` for `Invalid`
