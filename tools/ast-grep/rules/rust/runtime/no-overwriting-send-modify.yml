# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    overwrite:
        kind: assignment_expression
        all:
            - has: {field: left, kind: unary_expression, regex: '^\*', has: {kind: identifier, pattern: $VALUE}}
            - has:
                field: right
                not:
                    any:
                        - pattern: $VALUE
                        - matches: escape
                        - has: {stopBy: end, any: [{kind: identifier, pattern: $VALUE}, {matches: escape}]}
    escape:
        any: [{matches: rust-diverging}, {kind: 'try_expression, line_comment, block_comment'}]
    statement:
        kind: expression_statement
        has: {matches: overwrite}
    closure:
        kind: closure_expression
        has: {field: parameters, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, any: [{kind: identifier, pattern: $VALUE}, {kind: parameter, has: {field: pattern, kind: identifier, pattern: $VALUE}}]}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}
    sole-argument:
        kind: arguments
        not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: field_expression, all: [{has: {field: field, all: [{regex: '^send_(modify|if_modified)$'}, {pattern: $METHOD}]}}, {has: {field: value, pattern: $SENDER}}]}
        - inside: {kind: expression_statement}
        - any:
            - all:
                - has: {field: function, has: {field: field, regex: '^send_modify$'}}
                - has:
                    field: arguments
                    matches: sole-argument
                    has:
                        nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                        matches: closure
                        has:
                            field: body
                            any:
                                - matches: overwrite
                                - kind: block
                                  all:
                                    - has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, any: [{matches: overwrite}, {matches: statement}]}
                                    - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
            - all:
                - has: {field: function, has: {field: field, regex: '^send_if_modified$'}}
                - has:
                    field: arguments
                    matches: sole-argument
                    has:
                        nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                        matches: closure
                        has:
                            field: body
                            kind: block
                            all:
                                - has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: statement}
                                - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: boolean_literal, regex: '^true$'}
                                - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
message: '`$SENDER.$METHOD` overwrites the whole watched value through a closure'
note: 'Call `<sender>.send_replace(<value>)`'
