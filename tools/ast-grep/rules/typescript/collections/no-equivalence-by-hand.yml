# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: arrow_function
    all:
        - any:
            - pattern: '($L, $R) => $L.$K === $R.$K'
            - pattern: '($L: $_A, $R: $_B) => $L.$K === $R.$K'
        - inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, pattern: $CALL, matches: {effect-module-member: {module: {regex: '(?-u:\b)(Array|Chunk|Iterable)$'}, member: {regex: '^(dedupeWith|dedupeAdjacentWith|containsWith|differenceWith|unionWith|intersectionWith)$'}}}}
message: '`$CALL` compares by `$K` through a hand `===` callback'
note: 'Pass `Equivalence.mapInput(<equivalence>, Struct.get(''<key>''))`, declared once beside its type'
