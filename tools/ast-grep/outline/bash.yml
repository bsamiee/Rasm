utils:
    lead:
        any:
            - follows: {kind: command_name, regex: '^(source|\.)$'}
            - follows: {kind: word, regex: '^(source|\.)$', follows: {kind: command_name}}
            - follows: {kind: word, regex: '^-(?:[^p]|p.)', matches: lead}
            - follows: {follows: {pattern: '-p', matches: lead}}
    binding:
        any:
            - {kind: variable_name, pattern: $NAME}
            - kind: variable_assignment
              all:
                - has: {field: name, kind: variable_name, pattern: $NAME}
                - not: {has: {regex: '^\+=$'}}
                - any: [{has: {field: value, kind: array, pattern: $ARRAY}}, {has: {field: value, pattern: $VALUE}}, {pattern: $_}]
    assigned: {all: [{has: {field: name, pattern: $NAME}}, {kind: variable_assignment}, {not: {has: {regex: '^\+=$'}}}]}
    same: {any: [{kind: variable_name, pattern: $NAME}, {kind: variable_assignment, has: {field: name, pattern: $NAME}}]}
    declares: {kind: declaration_command, all: [{has: {matches: same}}, {not: {has: {kind: word, regex: '^[-+][a-zA-Z]*[fFp]'}}}]}
    fixes: {kind: declaration_command, all: [{has: {matches: same}}, {matches: constant}]}
    mutable: {kind: declaration_command, not: {has: {regex: '^(?:readonly$|[-+][a-zA-Z]*[fFpr])'}}}
    constant: {kind: declaration_command, has: {regex: '^(?:readonly$|-[a-zA-Z]*r)'}, not: {has: {kind: word, regex: '^[-+][a-zA-Z]*[fFp]'}}}
    local: {has: {regex: '^(local|declare|typeset)$'}, not: {has: {kind: word, regex: '^-[a-zA-Z]*g'}}}
    grouped: {has: {kind: 'variable_name, variable_assignment', follows: {kind: 'variable_name, variable_assignment', stopBy: end}}}
    declaration-seen: {any: [{follows: {stopBy: end, matches: declares}}, {precedes: {stopBy: end, matches: fixes}}]}
rewriters:
    - id: lineage
      rule:
        kind: word
        pattern: $SELF
        any:
            - inside: {kind: function_definition, field: name, inside: {kind: function_definition, stopBy: {kind: function_definition}, all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $UP}}]}}
            - pattern: $_
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SELF.
transform:
    PREFIX: {replace: {source: $KEYWORD, replace: '$', by: ' '}}
    PARENS: {replace: {source: $NAME, replace: '(?s).+', by: '()'}}
    HEAD: {replace: {source: $DECLARATION, replace: '(?s)^([^\t-\r ]+(?:[\t-\r ]+[-+][^\t-\r ]*)*).*', by: '${1} '}}
    ALIASED: {replace: {source: $DEFINITION, replace: '(?s)=.*', by: ''}}
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    CALLBACK: {replace: {source: $HANDLER, replace: '^[''"](.+)[''"]$|^(.+)$', by: '${1}${2} '}}
    SHAPE: {replace: {source: $ARRAY, replace: '(?s).+', by: '=(…)'}}
    VALUED: {replace: {source: $VALUE, replace: '(?s).+', by: '=…'}}
    DEFAULT: {replace: {source: $KEYWORD, replace: '.+', by: 'COPROC'}}
variants:
    constant:
        utils:
            binding:
                any:
                    - {kind: variable_name, pattern: $NAME}
                    - kind: variable_assignment
                      all:
                        - has: {field: name, kind: variable_name, pattern: $NAME}
                        - any: [{has: {field: value, kind: array, pattern: $ARRAY}}, {has: {field: value, pattern: $VALUE}}, {pattern: $_}]
    function:
        transform:
            HEAD: {replace: {source: $ALIAS, replace: '$', by: ' '}}
---
id: bash-function
role: item
symbolType: function
variants: [function]
rule:
    any:
        - kind: function_definition
          has: {field: name, pattern: $NAME}
          any: [{has: {regex: '^function$', pattern: $$KEYWORD}}, {pattern: $_}]
        - kind: 'word, concatenation'
          pattern: $DEFINITION
          all:
            - inside: {kind: command, has: {field: name, regex: '^alias$', pattern: $ALIAS}}
            - regex: '^[^-=][^=]*='
name: $NAME$ALIASED
signature: $PREFIX$HEAD$NAME$ALIASED$PARENS
isExported: {not: {inside: {stopBy: end, any: [{kind: 'subshell, process_substitution, pipeline'}, {kind: command_substitution, not: {has: {field: operator, regex: '^\$\{'}}}, {inside: {kind: coproc_command, field: body}}]}}}
---
id: bash-error
role: item
symbolType: 'null'
utils:
    carrier: {any: [{kind: 'function_definition, declaration_command, variable_assignment, coproc_command'}, {kind: comment, regex: '^# --- \['}, {kind: command, has: {field: name, regex: '^(?:source|\.|builtin|command|enable|set|shopt|setopt|unsetopt|getopts|alias|trap)$'}}]}
    opening: {nthChild: {position: 1, ofRule: {not: {any: [{matches: carrier}, {kind: ERROR}]}}}}
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, matches: carrier}}}
        - kind: 'word, comment, variable_name, number, raw_string, ansi_c_string, special_variable_name, file_descriptor, heredoc_start, heredoc_content, heredoc_end, string_content, test_operator, regex, extglob_pattern, expansion_flags'
          all:
            - inside: {kind: ERROR, stopBy: {kind: 'ERROR, program, compound_statement, do_group, subshell, case_item, if_statement, elif_clause, else_clause'}}
            - matches: opening
            - inside: {kind: ERROR, stopBy: {any: [{kind: ERROR}, {not: {matches: opening}}]}}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: bash-section
role: item
symbolType: namespace
rule: {kind: comment, regex: '^# --- \[[0-9A-Z_]+\](?: -+)?$', pattern: $DIVIDER}
transform:
    LABEL: {replace: {source: $DIVIDER, replace: '^# --- \[([0-9A-Z_]+)\].*', by: '${1}'}}
    SIGNATURE: {replace: {source: $DIVIDER, replace: ' -+$', by: ' ---'}}
name: $LABEL
signature: $SIGNATURE
isExported: false
---
id: bash-source
role: item
symbolType: module
rule:
    kind: command
    any:
        - all:
            - has: {field: name, regex: '^(source|\.|builtin|command)$'}
            - has: {matches: lead, pattern: $NAME, not: {any: [{kind: 'file_redirect, herestring_redirect, heredoc_redirect'}, {kind: word, regex: '^-'}]}}
        - all:
            - has: {field: name, regex: '^enable$'}
            - has: {kind: 'word, string, raw_string, concatenation, simple_expansion, expansion', pattern: $NAME, follows: {kind: word, regex: '^-[a-zA-Z]*f$'}}
name: $NAME
isImport: true
isExported: false
---
id: bash-member-source
role: member
parentRuleIds: [bash-function]
symbolType: module
rule:
    kind: command
    all:
        - any:
            - all:
                - has: {field: name, regex: '^(source|\.|builtin|command)$'}
                - has: {matches: lead, pattern: $NAME, not: {any: [{kind: 'file_redirect, herestring_redirect, heredoc_redirect'}, {kind: word, regex: '^-'}]}}
            - all:
                - has: {field: name, regex: '^enable$'}
                - has: {kind: 'word, string, raw_string, concatenation, simple_expansion, expansion', pattern: $NAME, follows: {kind: word, regex: '^-[a-zA-Z]*f$'}}
        - inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}
name: $QUALIFIER$NAME
isPublic: false
---
id: bash-option
role: item
symbolType: property
utils:
    switch: {kind: word, regex: '^[-+][a-zA-Z]+$'}
    operand: {not: {follows: {stopBy: end, kind: 'word, string, raw_string, concatenation, simple_expansion, expansion, command_substitution', not: {any: [{matches: switch}, {follows: {kind: word, regex: '^[-+][a-zA-Z]*o$'}}]}}}}
rule:
    kind: word
    pattern: $NAME
    all:
        - inside: {kind: command, has: {field: name, regex: '^(?:set|shopt|setopt|unsetopt)$', pattern: $LEAD}}
        - any:
            - all: [{inside: {kind: command, has: {field: name, regex: '^set$'}}}, {matches: switch, not: {regex: '^[-+]o$'}}, {matches: operand}]
            - all: [{inside: {kind: command, has: {field: name, regex: '^set$'}}}, {not: {regex: '^[-+]'}}, {follows: {kind: word, regex: '^[-+][a-zA-Z]*o$', pattern: $FLAG}}, {matches: operand}]
            - all: [{inside: {kind: command, has: {field: name, regex: '^shopt$'}}}, {not: {regex: '^-'}}, {follows: {stopBy: end, kind: word, regex: '^-[a-z]*[su][a-z]*$', pattern: $FLAG}}]
            - all: [{inside: {kind: command, has: {field: name, regex: '^(?:setopt|unsetopt)$'}}}, {not: {regex: '^-'}}]
transform:
    SWITCH: {replace: {source: $FLAG, replace: '^([-+])[a-zA-Z]*o$|^-[a-z]*?([su])[a-z]*$', by: '${1}o${2} '}}
    SIGN: {replace: {source: $SWITCH, replace: '^o', by: '-'}}
name: $NAME
signature: $LEAD $SIGN$NAME
isExported: false
---
id: bash-event
role: item
symbolType: event
utils:
    last: {not: {precedes: {stopBy: end, pattern: $_, not: {kind: comment}}}}
    tail: {not: {precedes: {stopBy: end, pattern: $_, not: {any: [{kind: comment}, {kind: command, has: {field: name, regex: '^exit$'}, matches: last}]}}}}
rule:
    any:
        - kind: command
          all:
            - any:
                - {inside: {kind: program}, matches: tail}
                - inside: {kind: 'program > :is(list, redirected_statement, if_statement, pipeline)', matches: tail}
                - inside: {kind: 'list, redirected_statement, pipeline', inside: {kind: 'program > :is(list, pipeline)', matches: tail}}
            - has: {field: name, pattern: $CALLEE}
            - any: [{has: {field: argument, pattern: $ARGUMENT}}, {pattern: $_}]
            - inside: {kind: program, stopBy: end, has: {kind: function_definition, has: {field: name, pattern: $CALLEE}}}
        - kind: 'word, number'
          regex: '(?i-u)^(?:sig)?[a-z][0-9a-z+-]*$|^[0-9]+$'
          pattern: $NAME
          inside: {kind: command, has: {field: name, regex: '^trap$', pattern: $TRAP}}
          follows: {stopBy: end, follows: {any: [{kind: command_name}, {pattern: '--', follows: {kind: command_name}}]}, not: {regex: '^-'}, any: [{kind: word, pattern: $HANDLER}, {kind: 'raw_string, string', regex: '^.[^\t-\r "''$;=&|<>()`\\]*.$', pattern: $HANDLER}, {pattern: $_}]}
transform:
    ARGUMENTS: {replace: {source: $ARGUMENT, replace: '(?s).+', by: ' …'}}
    HEAD: {replace: {source: $TRAP, replace: '$', by: ' '}}
name: $CALLEE$NAME
signature: $HEAD$CALLBACK$NAME$CALLEE$ARGUMENTS
isExported: false
---
id: bash-getopts
role: item
symbolType: interface
rule:
    kind: command
    all:
        - has: {field: name, regex: '^getopts$'}
        - has: {field: argument, pattern: $OPTIONS}
        - has: {kind: word, pattern: $VARIABLE, follows: {pattern: $OPTIONS}}
name: $VARIABLE
signature: getopts $OPTIONS $VARIABLE
isExported: false
---
id: bash-member-getopts
role: member
parentRuleIds: [bash-function]
symbolType: interface
rule:
    kind: command
    all:
        - has: {field: name, regex: '^getopts$'}
        - has: {field: argument, pattern: $OPTIONS}
        - has: {kind: word, pattern: $VARIABLE, follows: {pattern: $OPTIONS}}
        - inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}
name: $QUALIFIER$VARIABLE
signature: getopts $OPTIONS $VARIABLE
---
id: bash-variable
role: item
symbolType: variable
utils:
    assignment-seen: {any: [{precedes: {stopBy: end, kind: declaration_command, matches: declares}}, {follows: {stopBy: end, any: [{matches: assigned}, {matches: declares}, {kind: 'case_item, elif_clause, else_clause', has: {matches: assigned}}]}}]}
rule:
    any:
        - kind: declaration_command
          pattern: $DECLARATION
          all:
            - matches: mutable
            - has: {matches: binding}
            - not: {matches: grouped}
            - not: {any: [{matches: declaration-seen}, {inside: {stopBy: end, matches: declaration-seen}}]}
        - all:
            - matches: binding
            - inside: {kind: declaration_command, pattern: $DECLARATION, all: [{matches: mutable}, {matches: grouped}]}
            - not: {inside: {stopBy: end, matches: declaration-seen}}
        - kind: variable_assignment
          all:
            - matches: binding
            - not: {inside: {kind: 'declaration_command, command, expansion, arithmetic_expansion, binary_expression, c_style_for_statement'}}
            - not: {any: [{matches: assignment-seen}, {inside: {stopBy: end, matches: assignment-seen}}]}
        - {kind: word, pattern: $NAME, inside: {kind: coproc_command, field: name, pattern: $DECLARATION}}
        - {kind: coproc_command, pattern: $DECLARATION, all: [{has: {regex: '^coproc$', pattern: $$KEYWORD}}, {not: {has: {field: name, kind: word}}}, {not: {follows: {stopBy: end, kind: coproc_command, not: {has: {field: name, kind: word}}}}}]}
name: $NAME$DEFAULT
signature: $HEAD$NAME$DEFAULT$SHAPE$VALUED
isExported:
    not:
        any:
            - inside: {stopBy: end, any: [{kind: 'subshell, process_substitution, pipeline'}, {kind: command_substitution, not: {has: {field: operator, regex: '^\$\{'}}}, {inside: {kind: coproc_command, field: body}}]}
            - all: [{any: [{kind: declaration_command, matches: local}, {inside: {kind: declaration_command, matches: local}}]}, {inside: {stopBy: end, kind: command_substitution}}]
            - {kind: variable_assignment, has: {field: name, regex: '^REPLY$'}, inside: {stopBy: end, kind: command_substitution, has: {field: operator, regex: '\|$'}}}
---
id: bash-member-variable
role: member
parentRuleIds: [bash-function]
symbolType: variable
utils:
    assignment-seen: {follows: {stopBy: end, any: [{matches: assigned}, {matches: declares}, {kind: 'case_item, elif_clause, else_clause', has: {matches: assigned}}]}}
rule:
    inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}
    any:
        - kind: declaration_command
          pattern: $DECLARATION
          all:
            - matches: mutable
            - has: {matches: binding}
            - not: {matches: grouped}
            - not: {any: [{matches: declaration-seen}, {inside: {stopBy: {kind: function_definition}, not: {kind: function_definition}, matches: declaration-seen}}]}
        - all:
            - matches: binding
            - inside: {kind: declaration_command, pattern: $DECLARATION, all: [{matches: mutable}, {matches: grouped}]}
            - not: {inside: {stopBy: {kind: function_definition}, not: {kind: function_definition}, matches: declaration-seen}}
        - kind: variable_assignment
          all:
            - matches: binding
            - not: {inside: {kind: 'declaration_command, command, expansion, arithmetic_expansion, binary_expression, c_style_for_statement'}}
            - not: {any: [{matches: assignment-seen}, {inside: {stopBy: {kind: function_definition}, not: {kind: function_definition}, matches: assignment-seen}}]}
        - {kind: word, pattern: $NAME, inside: {kind: coproc_command, field: name, pattern: $DECLARATION}}
        - {kind: coproc_command, pattern: $DECLARATION, all: [{has: {regex: '^coproc$', pattern: $$KEYWORD}}, {not: {has: {field: name, kind: word}}}, {not: {follows: {stopBy: end, kind: coproc_command, not: {has: {field: name, kind: word}}}}}]}
name: $QUALIFIER$NAME$DEFAULT
signature: $HEAD$NAME$DEFAULT$SHAPE$VALUED
isPublic:
    not:
        any:
            - inside: {stopBy: {kind: function_definition}, any: [{kind: 'subshell, process_substitution, pipeline'}, {kind: command_substitution, not: {has: {field: operator, regex: '^\$\{'}}}, {inside: {kind: coproc_command, field: body}}]}
            - {kind: declaration_command, matches: local}
            - inside: {kind: declaration_command, matches: local}
            - {kind: variable_assignment, has: {field: name, regex: '^REPLY$'}, inside: {stopBy: {kind: function_definition}, kind: command_substitution, has: {field: operator, regex: '\|$'}}}
---
id: bash-constant
role: item
symbolType: constant
variants: [constant]
rule:
    any:
        - {kind: declaration_command, pattern: $DECLARATION, all: [{matches: constant}, {has: {matches: binding}}, {not: {matches: grouped}}]}
        - all: [{matches: binding}, {inside: {kind: declaration_command, pattern: $DECLARATION, all: [{matches: constant}, {matches: grouped}]}}]
name: $NAME
signature: $HEAD$NAME$SHAPE$VALUED
isExported:
    not:
        any:
            - inside: {stopBy: end, any: [{kind: 'subshell, process_substitution, pipeline'}, {kind: command_substitution, not: {has: {field: operator, regex: '^\$\{'}}}, {inside: {kind: coproc_command, field: body}}]}
            - all: [{any: [{kind: declaration_command, matches: local}, {inside: {kind: declaration_command, matches: local}}]}, {inside: {stopBy: end, kind: command_substitution}}]
---
id: bash-member-constant
role: member
parentRuleIds: [bash-function]
symbolType: constant
variants: [constant]
utils:
    localized: {follows: {stopBy: end, kind: declaration_command, all: [{has: {matches: same}}, {matches: local}]}}
rule:
    inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}
    any:
        - {kind: declaration_command, pattern: $DECLARATION, all: [{matches: constant}, {has: {matches: binding}}, {not: {matches: grouped}}]}
        - all: [{matches: binding}, {inside: {kind: declaration_command, pattern: $DECLARATION, all: [{matches: constant}, {matches: grouped}]}}]
name: $QUALIFIER$NAME
signature: $HEAD$NAME$SHAPE$VALUED
isPublic:
    not:
        any:
            - inside: {stopBy: {kind: function_definition}, any: [{kind: 'subshell, process_substitution, pipeline'}, {kind: command_substitution, not: {has: {field: operator, regex: '^\$\{'}}}, {inside: {kind: coproc_command, field: body}}]}
            - {kind: declaration_command, matches: local}
            - inside: {kind: declaration_command, matches: local}
            - matches: localized
            - inside: {stopBy: {kind: function_definition}, not: {kind: function_definition}, matches: localized}
---
id: bash-key
role: member
parentRuleIds: [bash-variable, bash-constant]
symbolType: field
rule:
    kind: 'word, number, string, raw_string'
    pattern: $KEY
    inside: {kind: array_entry, field: key}
transform:
    NAME: {replace: {source: $KEY, replace: '^"([^\t-\r "''$`\\]+)"$|^''([^\t-\r "''$`\\]+)''$', by: '${1}${2}'}}
name: $NAME
signature: '[$KEY]'
---
id: bash-member-function
role: member
parentRuleIds: [bash-function]
symbolType: function
variants: [function]
utils:
    owner: {inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    scope: {inside: {stopBy: {kind: function_definition}, any: [{kind: 'subshell, process_substitution, pipeline'}, {kind: command_substitution, not: {has: {field: operator, regex: '^\$\{'}}}, {inside: {kind: coproc_command, field: body}}]}}
rule:
    any:
        - kind: word
          pattern: $NAME
          inside: {kind: function_definition, field: name, any: [{has: {regex: '^function$', pattern: $$KEYWORD}}, {pattern: $_}], matches: owner}
        - kind: 'word, concatenation'
          pattern: $DEFINITION
          all:
            - inside: {kind: command, has: {field: name, regex: '^alias$', pattern: $ALIAS}}
            - regex: '^[^-=][^=]*='
            - matches: owner
name: $QUALIFIER$NAME$ALIASED
signature: $PREFIX$HEAD$NAME$ALIASED$PARENS
isPublic: {not: {any: [{inside: {kind: function_definition, matches: scope}}, {matches: scope}]}}
---
id: bash-member-trap
role: member
parentRuleIds: [bash-function]
symbolType: event
rule:
    kind: 'word, number'
    regex: '(?i-u)^(?:sig)?[a-z][0-9a-z+-]*$|^[0-9]+$'
    pattern: $NAME
    inside: {kind: command, has: {field: name, regex: '^trap$'}, inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    follows: {stopBy: end, follows: {any: [{kind: command_name}, {pattern: '--', follows: {kind: command_name}}]}, not: {regex: '^-'}, any: [{kind: word, pattern: $HANDLER}, {kind: 'raw_string, string', regex: '^.[^\t-\r "''$;=&|<>()`\\]*.$', pattern: $HANDLER}, {pattern: $_}]}
name: $QUALIFIER$NAME
signature: trap $CALLBACK$NAME
---
id: bash-member-error
role: member
parentRuleIds: [bash-function]
symbolType: 'null'
utils:
    carrier: {any: [{kind: 'function_definition, declaration_command, variable_assignment, coproc_command'}, {kind: command, has: {field: name, regex: '^(?:source|\.|builtin|command|enable|getopts|alias|trap)$'}}]}
rule: {kind: ERROR, not: {has: {stopBy: end, matches: carrier}}}
name: ERROR
signature: ''
isPublic: false
