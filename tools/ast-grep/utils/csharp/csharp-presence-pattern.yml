# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-presence-pattern
language: csharplang
rule:
    any:
        - kind: negated_pattern
          has: {kind: constant_pattern, has: {kind: null_literal}}
        - kind: recursive_pattern
          has: {kind: property_pattern_clause, not: {has: {kind: subpattern}}}
          not: {has: {nthChild: 2}}
