# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    limit-literal:
        kind: 'integer_literal, real_literal'
        not: {regex: '^0+(\.0+)?[dDfFmM]?$'}
    argument-read:
        any:
            - kind: identifier
              pattern: {context: 'class $NAME;', selector: identifier}
              inside: {stopBy: end, kind: method_declaration, has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}}}
            - kind: member_access_expression
              has: {field: expression, matches: argument-read}
    limit-name:
        kind: 'identifier, member_access_expression'
        not: {matches: argument-read}
    limit-comparison:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^(<|<=|>|>=)$'}
            - any:
                - has: {stopBy: end, matches: limit-literal}
                - has: {field: left, matches: limit-name}
                - has: {field: right, matches: limit-name}
    own-error:
        any:
            - kind: object_creation_expression
              has: {field: type, pattern: $SELF}
            - kind: invocation_expression
              has: {field: function, kind: identifier, regex: '^Of$'}
    error-factory:
        kind: method_declaration
        all:
            - has: {field: name, regex: '^Of$'}
            - has: {kind: modifier, regex: '^static$'}
            - has: {field: type, kind: identifier, pattern: {context: 'class $SELF;', selector: identifier}}
            - has: {field: body, kind: arrow_expression_clause, has: {kind: 'object_creation_expression, implicit_object_creation_expression'}}
            - inside: {stopBy: end, kind: record_declaration, has: {field: name, pattern: {context: 'class $SELF;', selector: identifier}}}
    guarded-value:
        any:
            - regex: '^unit$'
            - matches: argument-read
            - kind: identifier
              pattern: {context: 'class $NARROWED;', selector: identifier}
              inside:
                kind: conditional_expression
                has:
                    field: condition
                    kind: is_pattern_expression
                    all:
                        - has: {field: expression, matches: argument-read}
                        - has: {field: pattern, kind: 'declaration_pattern, recursive_pattern', has: {field: name, pattern: {context: 'class $NARROWED;', selector: identifier}}, not: {has: {stopBy: end, kind: relational_pattern}}}
    guard-factory:
        kind: method_declaration
        all:
            - has: {field: name, regex: ^Unless}
            - has: {field: type, matches: {csharp-type-name: {name: {regex: '^Fin$'}}}}
            - has:
                field: body
                kind: arrow_expression_clause
                has:
                    any:
                        - kind: conditional_expression
                          all:
                            - has: {field: condition, not: {any: [{matches: limit-comparison}, {has: {stopBy: end, matches: limit-comparison}}]}}
                            - not: {has: {stopBy: end, matches: limit-literal}}
                            - any:
                                - all:
                                    - has: {field: consequence, matches: guarded-value}
                                    - has: {field: alternative, matches: own-error}
                                - all:
                                    - has: {field: consequence, matches: own-error}
                                    - has: {field: alternative, matches: guarded-value}
                        - kind: invocation_expression
                          all:
                            - not: {has: {stopBy: end, matches: limit-literal}}
                            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^ToFin$'}}, {has: {field: expression, kind: invocation_expression, all: [{matches: {csharp-named-call: {name: {regex: '^Optional$'}}}}, {has: {field: arguments, has: {kind: argument, has: {matches: guarded-value}}, not: {has: {kind: argument, nthChild: 2}}}}]}}]}
                            - has: {field: arguments, has: {kind: argument, has: {matches: own-error}}, not: {has: {kind: argument, nthChild: 2}}}
            - inside: {stopBy: end, kind: record_declaration, has: {field: name, pattern: {context: 'class $SELF;', selector: identifier}}}
    validation-factory:
        kind: method_declaration
        all:
            - has: {field: name, regex: '^Create$'}
            - has: {kind: modifier, regex: '^static$'}
            - has: {field: parameters, has: {kind: parameter, has: {field: type, regex: '^string$'}}, not: {has: {kind: parameter, nthChild: 2}}}
            - has: {field: type, kind: identifier, pattern: {context: 'class $SELF;', selector: identifier}}
            - inside:
                stopBy: end
                kind: record_declaration
                all:
                    - has: {field: name, pattern: {context: 'class $SELF;', selector: identifier}}
                    - has: {kind: base_list, has: {kind: generic_name, all: [{has: {kind: identifier, regex: '^IValidationError$'}}, {has: {kind: type_argument_list, has: {pattern: $SELF}, not: {has: {nthChild: 2}}}}]}}
    string-constant:
        all:
            - has: {kind: modifier, regex: '^const$'}
            - has: {kind: variable_declaration, has: {field: type, kind: predefined_type, regex: '^string$'}}
            - inside:
                stopBy: end
                kind: record_declaration
                all:
                    - has: {field: name, pattern: {context: 'class $OWNER;', selector: identifier}}
                    - has: {stopBy: end, kind: object_creation_expression, all: [{has: {field: type, pattern: $OWNER}}, {has: {field: arguments, has: {kind: argument, has: {kind: identifier, pattern: {context: 'class $MEMBER;', selector: identifier}}}}}]}
    inherited:
        has: {kind: modifier, regex: '^(override|abstract)$'}
    type-argument-read:
        any:
            - kind: typeof_expression
              all:
                - has: {field: type, kind: identifier, pattern: {context: 'class $PARAM;', selector: identifier}}
                - inside: {stopBy: end, kind: record_declaration, has: {kind: type_parameter_list, has: {kind: type_parameter, has: {field: name, pattern: {context: 'class $PARAM;', selector: identifier}}}}}
            - kind: member_access_expression
              has: {field: expression, matches: type-argument-read}
    type-argument-property:
        any:
            - has: {field: value, kind: arrow_expression_clause, has: {matches: type-argument-read}}
            - has:
                field: accessors
                not: {has: {kind: accessor_declaration, nthChild: 2}}
                has:
                    kind: accessor_declaration
                    all:
                        - has: {field: name, regex: '^get$'}
                        - has:
                            field: body
                            any:
                                - {kind: arrow_expression_clause, has: {matches: type-argument-read}}
                                - {kind: block, has: {kind: return_statement, has: {matches: type-argument-read}}, not: {has: {nthChild: 2}}}
rule:
    all:
        - inside: {stopBy: end, kind: declaration_list, inside: {matches: languageext-error-record}}
        - any:
            - kind: field_declaration
              all:
                - has: {kind: modifier, regex: '^(const|static)$'}
                - has: {kind: variable_declaration, has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $MEMBER;', selector: identifier}}}}
                - not: {matches: string-constant}
            - kind: property_declaration
              all:
                - has: {field: name, pattern: {context: 'class $MEMBER;', selector: identifier}}
                - any:
                    - has: {kind: modifier, regex: '^static$'}
                    - has: {field: value, kind: arrow_expression_clause}
                    - has: {field: accessors, has: {kind: accessor_declaration, has: {field: body, kind: 'arrow_expression_clause, block'}}}
                - not: {any: [{matches: inherited}, {matches: type-argument-property}]}
            - kind: indexer_declaration
              all:
                - has: {regex: '^this$', pattern: $$MEMBER}
                - not: {matches: inherited}
            - kind: operator_declaration
              has: {field: operator, pattern: $$MEMBER}
            - kind: conversion_operator_declaration
              has: {field: type, pattern: $MEMBER}
            - kind: method_declaration
              all:
                - has: {field: name, pattern: {context: 'class $MEMBER;', selector: identifier}}
                - not: {any: [{matches: guard-factory}, {matches: error-factory}, {matches: validation-factory}, {matches: inherited}]}
message: '`$MEMBER` declares a limit or operation inside an error record'
note: 'Move member to an operations class that raises the error'
