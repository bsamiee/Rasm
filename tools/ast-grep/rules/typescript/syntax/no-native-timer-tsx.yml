# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-timer-tsx
language: tsx
severity: error
utils:
    listener-callback:
        matches: typescript-function-boundary
        inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, kind: member_expression, has: {field: property, regex: '^(addEventListener|once|on)$'}}
rule:
    kind: call_expression
    not:
        all:
            - has: {field: function, regex: 'clear(Timeout|Interval|Immediate)$'}
            - inside: {matches: listener-callback, stopBy: {matches: typescript-function-boundary}}
    has:
        field: function
        pattern: $NAME
        any:
            - matches: typescript-global-reference
              regex: '^((window|self)\.(setTimeout|setInterval)|((globalThis|window|self)\.)?(setImmediate|queueMicrotask|clearTimeout|clearInterval|clearImmediate|AbortSignal\.timeout|process\.nextTick))$'
            - matches:
                typescript-import-reference:
                    source: {regex: '^(node:)?timers$'}
                    exported: {regex: '^(setImmediate|clearTimeout|clearInterval|clearImmediate)$'}
            - matches:
                typescript-import-reference:
                    source: {regex: '^(node:)?timers/promises$'}
                    exported: {regex: '^(setTimeout|setInterval|setImmediate)$'}
            - matches:
                typescript-import-reference:
                    source: {regex: '^(node:)?process$'}
                    exported: {regex: '^nextTick$'}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(wait|yield)$'}
                - has:
                    field: object
                    matches:
                        typescript-import-reference:
                            source: {regex: '^(node:)?timers/promises$'}
                            exported: {regex: '^scheduler$'}
message: '`$NAME` schedules on the host timer outside the effect runtime'
note: 'Schedule inside the runtime through `Effect.sleep`, `Effect.repeat` with a `Schedule`, or `Effect.yieldNow`, with interruption in place of each clear call'
