# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-die-before-runner
language: tsxlang
severity: error
utils:
    die-handler:
        any:
            - matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^die$'}}}
            - kind: arrow_function
              all:
                - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $E}}}
                - has: {field: body, pattern: $_.die($E)}
    die-step:
        any:
            - matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^orDie$'}}}
            - kind: call_expression
              all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^catch$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: die-handler}}, {not: {has: {nthChild: 2}}}]}
    die-call:
        kind: call_expression
        any:
            - all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^orDie$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $_PROGRAM}}, {not: {has: {nthChild: 2}}}]}
            - all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^catch$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $_PROGRAM}}, {has: {nthChild: 2, matches: die-handler}}, {not: {has: {nthChild: 3}}}]}
    context-step:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(provide|provideService|provideServiceEffect|provideContext)$'}}}}
    runner-step:
        any:
            - matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(runPromise|runSync)$'}}}
            - kind: call_expression
              has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(runPromiseWith|runSyncWith)$'}}}}
    run-gen:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^gen$'}}}}
            - any:
                - inside:
                    kind: member_expression
                    field: object
                    has: {field: property, regex: '^pipe$'}
                    inside: {kind: call_expression, has: {field: arguments, has: {matches: runner-step, pattern: $RUN, not: {follows: {stopBy: end, pattern: $_, not: {matches: context-step}}}}}}
                - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, matches: runner-step, pattern: $RUN}}}
    run-yield:
        kind: yield_expression
        inside:
            kind: generator_function
            stopBy: {kind: 'arrow_function, function_expression, function_declaration, generator_function, generator_function_declaration, method_definition'}
            inside: {kind: arguments, inside: {matches: run-gen}}
rule:
    any:
        - matches: die-step
          inside: {kind: arguments}
          precedes:
            stopBy: {not: {any: [{matches: context-step}, {regex: '^,$'}]}}
            matches: runner-step
            pattern: $RUN
        - matches: die-call
          nthChild: 1
          inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, matches: runner-step, pattern: $RUN}}}
        - matches: die-step
          follows: {stopBy: end, pattern: $_}
          not: {precedes: {stopBy: end, pattern: $_}}
          inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: '^pipe$'}}, inside: {matches: run-yield}}}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, pattern: $_PROGRAM}}]}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: die-step}}, {not: {has: {nthChild: 2}}}]}
            - inside: {matches: run-yield}
        - matches: die-call
          inside: {matches: run-yield}
message: 'Failure turned into a defect throws the same value from `$RUN`'
note: 'Remove `Effect.orDie` or the dying `Effect.catch` and let the failure reach the runner'
