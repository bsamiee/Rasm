# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-vector-struct-by-hand
language: rust
severity: error
utils:
    component:
        kind: field_declaration
        all:
            - has: {field: name, regex: '^[xyzw]$'}
            - has: {field: type, kind: primitive_type, regex: '^f(32|64)$'}
rule:
    kind: struct_item
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            field: body
            kind: field_declaration_list
            all:
                - has: {kind: field_declaration, has: {field: name, regex: '^x$'}}
                - has: {kind: field_declaration, has: {field: name, regex: '^y$'}}
                - not: {has: {kind: field_declaration, not: {matches: component}}}
        - not:
            follows:
                stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}
                kind: attribute_item
                regex: '\b(Serialize|Deserialize)\b'
message: '`$NAME` declares a float vector the catalog vector crates own'
note: 'Use the vector type of the crate the module uses: glam `Vec2`/`Vec3`/`DVec3` in graphics code, nalgebra `Vector3<f64>`/`Point3<f64>` in geometry, geo-types `Coord`/`Point` in geospatial code, or kurbo `Point`/`Vec2` for 2D curves. A serde-derived wire record stays as written, glam and nalgebra serialize vectors as arrays'
