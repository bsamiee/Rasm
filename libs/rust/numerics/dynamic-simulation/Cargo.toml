# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-dynamic-simulation"
edition.workspace = true
description       = "Dynamic simulation: ODE and DAE solves with sensitivities, lumped networks, and FMI co-simulation"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path = "lib.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                 = { workspace = true }
nonempty-collections  = { workspace = true }
thiserror             = { workspace = true }
validated             = { workspace = true }
derive_more           = { workspace = true }
enum-map              = { workspace = true }
itertools             = { workspace = true }
nutype                = { workspace = true }
faer                  = { workspace = true }
nalgebra              = { workspace = true }
uom                   = { workspace = true }
diffsol               = { workspace = true }
fmi                   = { workspace = true }
petgraph              = { workspace = true }
rasm-dependency-graph = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
