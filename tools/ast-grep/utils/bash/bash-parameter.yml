# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# One parameter read whole, $name, ${name}, or ${name[index]}, bare or double-quoted alone, the slot binds the name or the subscript
id: bash-parameter
language: bash
arguments: [name]
utils:
    # The bare expansion, no operator beside the name and no whole-array subscript, the forms a later ${name<operator>} keeps as written
    plain:
        any:
            - kind: simple_expansion
              has: {kind: variable_name, matches: name}
            - kind: expansion
              has: {any: [{kind: variable_name}, {kind: subscript, not: {has: {field: index, regex: '^[@*]$'}}}], matches: name}
              not: {has: {field: operator, pattern: $$_OP}} # The operator is an unnamed node, $$ matches one
rule:
    any:
        - matches: plain
        - kind: string
          has: {matches: plain}
          not: {has: {nthChild: 2}}
