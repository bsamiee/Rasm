# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    option-test:
        any:
            - kind: call_expression
              all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^is(Some|None)$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, pattern: $OPTION}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
            - kind: unary_expression
              all:
                - has: {field: operator, regex: '^!$'}
                - has: {field: argument, matches: option-test}
rule:
    any:
        - kind: if_statement
          has: {field: condition, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: option-test, pattern: $TEST}}
        - kind: ternary_expression
          all:
            - has:
                field: condition
                pattern: $TEST
                any: [{matches: option-test}, {kind: parenthesized_expression, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: option-test}}]
            - any:
                - has: {field: consequence, pattern: $OPTION}
                - has: {field: alternative, pattern: $OPTION}
                - has: {stopBy: end, kind: member_expression, pattern: $OPTION.value}
        - kind: ternary_expression
          all:
            - has:
                field: condition
                kind: call_expression
                pattern: $TEST
                all:
                    - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, pattern: $OPTION}}
                    - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^exists$'}}}}
            - has:
                stopBy: end
                kind: call_expression
                all:
                    - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, pattern: $OPTION}}
                    - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^(getOrElse|getOrThrow|getOrThrowWith|getOrNull|getOrUndefined)$'}}}}
message: '`$TEST` branches on an `Option` outside its fold'
note: 'Fold with `Option.match(<option>, { onNone, onSome })` holding any test inside `onSome`, or exit through `Effect.fromOption` or `Option.getOrElse`'
