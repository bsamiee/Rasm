# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-pass-match-arm
language: python
severity: error
utils:
    pass-arm:
        kind: case_clause
        not: {has: {field: guard, kind: if_clause}}
        has: {field: consequence, kind: block, has: {kind: pass_statement}, not: {has: {nthChild: 2}}}
    none-arm:
        matches: pass-arm
        has: {kind: case_pattern, has: {kind: none}, not: {has: {nthChild: 2}}}
    capture-arm:
        kind: case_clause
        not: {has: {field: guard, kind: if_clause}}
        all:
            - has: {kind: case_pattern, not: {regex: '^_$'}, has: {kind: dotted_name, not: {has: {nthChild: 2}}, has: {kind: identifier, pattern: $NAME}}}
            - has: {field: consequence, pattern: $BODY}
    none-test:
        has:
            field: body
            all:
                - has: {matches: none-arm}
                - has: {matches: capture-arm}
rule:
    kind: match_statement
    all:
        - has: {field: subject, pattern: $SUBJECT}
        - has:
            field: body
            all:
                - has: {matches: pass-arm}
                - has: {kind: case_clause, nthChild: {position: 2, ofRule: {kind: case_clause}}}
                - not: {has: {kind: case_clause, nthChild: {position: 3, ofRule: {kind: case_clause}}}}
                - not: {has: {kind: case_clause, has: {kind: case_pattern, has: {kind: class_pattern, all: [{has: {kind: dotted_name, regex: '^(builtins\.)?(object|type)$'}}, {has: {kind: case_pattern, has: {kind: keyword_pattern}}}]}}}}
        - not: {has: {kind: comment, stopBy: end}}
        - not:
            all:
                - has: {field: body, has: {kind: case_clause, has: {kind: case_pattern, has: {kind: class_pattern, has: {kind: dotted_name, regex: '^([A-Za-z_]\w*\.)*Result$'}}}}}
                - precedes: {kind: return_statement}
        - any:
            - pattern: $FIXABLE
              matches: none-test
            - pattern: $KEPT
rewriters:
    - id: none-test
      rule: {kind: match_statement}
      fix: |-
        if ($NAME := $SUBJECT) is not None:
            $BODY
transform:
    OUT: rewrite($FIXABLE, rewriters=[none-test])
fix: $OUT$KEPT
message: 'Two-arm `match` over `$SUBJECT` holds an arm that only passes'
note: 'Use an `if` on the acting arm, `if (<name> := <subject>) is not None:` for a `None` arm and `if isinstance(<name> := <subject>, <type>):` for a class pattern, one test states which case acts'
