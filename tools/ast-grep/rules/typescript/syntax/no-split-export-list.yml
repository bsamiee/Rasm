# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    local-export-list:
        all:
            - kind: export_statement
            - has: { kind: export_clause }
            - not: { has: { field: source, kind: string } }
rule:
    all:
        - matches: local-export-list
        - follows: { matches: local-export-list, stopBy: end }
        - not: { follows: { matches: local-export-list } }
        - any: [{ regex: '^export[\t-\r ]+type(?-u:\b)' }, { follows: { stopBy: end, all: [{ matches: local-export-list }, { regex: '^export[\t-\r ]+type(?-u:\b)' }] } }]
message: 'Export list repeats a module export statement'
note: 'Fold the `export type { .. }` list into the value list, each type marked inline as `type Name`'
