# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: result-match-to-map
language: python
severity: off
utils:
    named-ok-arm:
        kind: case_clause
        all:
            - has:
                kind: case_pattern
                has:
                    kind: class_pattern
                    has: {kind: dotted_name, pattern: $RESULT_CLASS}
                    all:
                        - has: {kind: case_pattern, has: {kind: keyword_pattern, has: {kind: dotted_name, pattern: $V}}}
                        - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']ok["'']$|ok\s*=)'}}}}
            - not: {has: {field: guard, kind: if_clause}}
            - has:
                field: consequence
                kind: block
                not: {has: {nthChild: 2}}
                has:
                    matches: python-result-ok-return
                    has:
                        kind: call
                        has:
                            field: arguments
                            all:
                                - has: {pattern: $VALUE}
                                - has: {kind: identifier, pattern: $V, stopBy: end}
rule:
    kind: match_statement
    all:
        - inside: {kind: function_definition, stopBy: end}
        - not: {inside: {kind: try_statement, has: {kind: finally_clause}, stopBy: {kind: function_definition}}}
        - not: {has: {kind: comment, stopBy: end}}
        - has: {field: subject, pattern: $SUBJECT, kind: "identifier, attribute, call, subscript, parenthesized_expression, await"}
        - has:
            field: body
            kind: block
            all:
                - has: {matches: python-result-error-arm, has: {kind: case_pattern, has: {kind: class_pattern, has: {kind: dotted_name, pattern: $RESULT_CLASS}}}}
                - has: {matches: named-ok-arm}
                - not: {has: {kind: case_clause, nthChild: {position: 3, ofRule: {kind: case_clause}}}}
        - nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}
        - any:
            - all:
                - has: {field: body, has: {matches: named-ok-arm, has: {field: consequence, has: {matches: python-result-ok-return, has: {kind: call, has: {field: arguments, has: {kind: identifier, pattern: $V}}}}}}}
                - has: {field: subject, pattern: $PLAIN}
            - has: {field: subject, pattern: $MAPPED}
rewriters:
    - id: awaited
      rule: {kind: await, pattern: $AWAITED, inside: {kind: match_statement}}
      fix: ($AWAITED)
    - id: identity
      rule: {kind: identifier, pattern: $V}
      fix: ''
    - id: point-free
      rule: {kind: call, pattern: $F($V), has: {field: function, kind: "identifier, attribute"}}
      fix: $F
    - id: mapper
      rule: {pattern: $BODY}
      fix: 'lambda $V: $BODY'
transform:
    HEAD: rewrite($MAPPED, rewriters=[awaited])
    MAPPER: rewrite($VALUE, rewriters=[identity, point-free, mapper])
    TAIL: {replace: {source: $MAPPER, replace: "(?s)^(.+)$", by: ".map($1)"}}
fix: return $HEAD$PLAIN$TAIL
labels: {SUBJECT: {style: primary, message: Result transformation}}
message: Match over `$SUBJECT` repeats error propagation around an Ok transformation
note: Return `<subject>.map(<mapper>)`, the callee alone for a body of one call over the bound name, or `<subject>` alone for the identity
