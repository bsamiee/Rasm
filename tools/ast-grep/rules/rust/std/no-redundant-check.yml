# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-redundant-check
language: rust
severity: error
utils:
    zero:
        kind: integer_literal
        regex: '^0(_?[iu](8|16|32|64|128|size))?$'
    no-arguments:
        has: {field: arguments, not: {has: {pattern: $_}}}
    contains-key:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $M}}, {has: {field: field, regex: '^contains_key$'}}]}
            - has: {field: arguments, has: {nthChild: 1, pattern: $K}}
    keyed-read:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $M}}, {has: {field: field, regex: '^(get|get_mut|get_key_value|remove|remove_entry)$'}}]}
                - has: {field: arguments, has: {nthChild: 1, pattern: $K}}
            - kind: index_expression
              all: [{has: {nthChild: 1, pattern: $M}}, {has: {nthChild: 2, pattern: $K}}]
    diverging:
        any:
            - kind: 'return_expression, continue_expression, break_expression'
            - kind: expression_statement
              has: {kind: 'return_expression, continue_expression, break_expression'}
    length-call:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $V}}, {has: {field: field, regex: '^len$'}}]}
            - matches: no-arguments
    emptiness:
        any:
            - kind: unary_expression
              regex: '^!'
              has: {kind: call_expression, all: [{has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $V}}, {has: {field: field, regex: '^is_empty$'}}]}}, {matches: no-arguments}]}
            - kind: binary_expression
              any:
                - all: [{has: {field: left, matches: length-call}}, {has: {field: operator, regex: '^(>|!=)$'}}, {has: {field: right, matches: zero}}]
                - all: [{has: {field: left, matches: length-call}}, {has: {field: operator, regex: '^>=$'}}, {has: {field: right, regex: '^1$'}}]
                - all: [{has: {field: left, matches: zero}}, {has: {field: operator, regex: '^(<|!=)$'}}, {has: {field: right, matches: length-call}}]
    presence:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $V}}, {has: {field: field, regex: '^(is_some|is_none|is_ok|is_err)$'}}]}
            - matches: no-arguments
    iteration:
        any:
            - pattern: $V
            - kind: reference_expression
              has: {field: value, pattern: $V}
            - kind: call_expression
              has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $V}}, {has: {field: field, regex: '^(iter|iter_mut|into_iter|drain|keys|values|values_mut|chars|bytes|lines|first|last|split_first|split_last|get)$'}}]}
            - kind: call_expression
              has: {field: function, kind: field_expression, has: {field: value, kind: call_expression, matches: iteration}}
    consumer:
        any:
            - kind: for_expression
              has: {field: value, matches: iteration}
            - kind: 'if_expression, while_expression'
              all:
                - has: {field: condition, any: [{kind: let_condition, has: {field: value, matches: iteration}}, {kind: let_chain, has: {kind: let_condition, has: {field: value, matches: iteration}}}]}
                - not: {has: {field: alternative, pattern: $_}}
    consuming-block:
        kind: block
        all:
            - has:
                nthChild: {position: 1, ofRule: {matches: rust-statement}}
                any:
                    - matches: consumer
                    - kind: expression_statement
                      has: {nthChild: 1, matches: consumer}
            - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
rule:
    kind: if_expression
    has: {field: condition, pattern: $CONDITION}
    any:
        - kind: if_expression
          all:
            - not: {has: {field: alternative, pattern: $_}}
            - has: {field: condition, any: [{matches: emptiness}, {matches: presence}]}
            - has: {field: consequence, matches: consuming-block}
        - kind: if_expression
          all:
            - has: {field: condition, matches: contains-key}
            - has: {field: consequence, has: {stopBy: end, matches: keyed-read}}
        - kind: if_expression
          all:
            - not: {has: {field: alternative, pattern: $_}}
            - has: {field: condition, kind: unary_expression, regex: '^!', has: {matches: contains-key}}
            - has: {field: consequence, matches: {rust-single-statement: {first: {matches: diverging}}}}
            - inside: {kind: expression_statement, precedes: {stopBy: end, any: [{matches: keyed-read}, {has: {stopBy: end, matches: keyed-read}}]}}
message: '`$CONDITION` repeats a fact the next pattern or lookup states'
note: 'Delete the guard: a loop over an empty collection runs no body, an `if let` without `else` reads the case, and `get` returns `None` for a missing key'
