# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-module-member
language: tsxlang
arguments: [module, member]
utils:
    module-object:
        matches: {effect-module: {name: {matches: module}}}
rule:
    any:
        - kind: member_expression
          all:
            - has: {field: property, matches: member}
            - has: {field: object, matches: module-object}
        - kind: nested_type_identifier
          all:
            - has: {field: name, matches: member}
            - has: {field: module, matches: module-object}
