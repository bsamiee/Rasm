id: conditional-statement-to-if-else
valid:
    # The if statement with an else the rewrite writes
    - |
      if ready:
          start(item)
      else:
          queue(item)
    # None arm, the shape of conditional-statement-to-if
    - |
      start(item) if ready else None
    # Multi-line statement in parentheses, the else lands past the if
    - |
      (
          start(item)
          if ready
          else queue(item)
      )
    # Conditional bound to a name
    - |
      value = start(item) if ready else queue(item)
invalid:
    # The instance, an effect in each arm
    - |
      start(item) if ready else queue(item)
    # Parentheses on one line, the join drops them
    - |
      (start(item) if ready else queue(item))
    # Statement inside a def, both bodies indent under their clause
    - |
      def dispatch(item, ready):
          start(item) if ready else queue(item)
    # Chain in the else arm, the inner conditional is the next pass
    - |
      start(item) if ready else queue(item) if waiting else None
    # Awaited effects
    - |
      async def run():
          await start(item) if ready else await queue(item)
