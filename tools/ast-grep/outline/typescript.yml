id: typescript-import
language: tsxlang
role: item
symbolType: module
rule:
    kind: import_statement, import_alias
    pattern: $DECLARATION
    inside: {kind: program, stopBy: {not: {kind: export_statement}}}
    any:
        - has: {field: source, pattern: $NAME}
        - has: {kind: import_require_clause, has: {field: source, pattern: $NAME}}
        - has: {kind: identifier, nthChild: 1, pattern: $NAME}
transform:
    TRIMMED: {replace: {source: $DECLARATION, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: {inside: {kind: export_statement}}
---
id: typescript-export
language: tsxlang
role: item
symbolType: module
rule:
    kind: export_statement
    pattern: $DECLARATION
    inside: {kind: program}
    any:
        - has: {field: source, pattern: $NAME}
        - has: {kind: export_clause, pattern: $NAME}
        - has: {kind: identifier, pattern: $NAME}
          not: {has: {regex: '^default$'}}
transform:
    TRIMMED: {replace: {source: $DECLARATION, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
name: $NAME
signature: $TRIMMED
isExported: true
---
id: typescript-namespace
language: tsxlang
role: item
symbolType: namespace
utils:
    exported:
        any:
            - kind: ambient_declaration
            - inside: {kind: 'export_statement, ambient_declaration', stopBy: {not: {kind: expression_statement}}}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    pattern: $DECLARATION
    inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}
    any:
        - kind: internal_module, module
          has: {field: name, pattern: $NAME}
        - kind: ambient_declaration
          has: {regex: '^global$', pattern: $$NAME}
rewriters:
    - id: body
      rule:
        kind: statement_block
        any:
            - inside: {kind: 'internal_module, module', field: body}
            - inside: {kind: ambient_declaration}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {matches: exported}
---
id: typescript-class
language: tsxlang
role: item
symbolType: class
utils:
    top:
        inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
    declaration:
        matches: top
        any:
            - kind: lexical_declaration, using_declaration
              has: {field: kind, pattern: $$KIND}
            - kind: variable_declaration
              has: {regex: '^var$', pattern: $$KIND}
    class-value:
        any:
            - kind: class
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: 1, matches: class-value}
    exported:
        any:
            - kind: export_statement
            - inside: {kind: 'export_statement, ambient_declaration', stopBy: end}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    pattern: $DECLARATION
    any:
        - kind: class_declaration, abstract_class_declaration
          matches: top
          has: {field: name, pattern: $NAME}
        - kind: export_statement
          inside: {kind: program}
          all:
            - has: {field: decorator, kind: decorator}
            - has: {field: declaration, kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $NAME}}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - has: {field: value, matches: class-value}
            - inside: {matches: declaration}
        - kind: export_statement
          inside: {kind: program}
          all:
            - has: {field: value, matches: class-value}
            - has: {regex: '^default$', pattern: $$NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: 'class_declaration, abstract_class_declaration, class', field: body}}
      fix: ''
    - id: generics
      rule: {kind: type_arguments, inside: {kind: call_expression, field: type_arguments}}
      fix: <…>
    - id: layout
      rule: {kind: object_type, regex: "\n"}
      fix: '{…}'
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: block
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $ARROW_PARAMETERS}}, {has: {field: parameter, pattern: $ARROW_PARAMETERS}}]
            - any: [{has: {field: type_parameters, pattern: $ARROW_GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $ARROW_RETURN}}, {kind: arrow_function}]
            - any: [{has: {regex: '^async$', pattern: $$ARROW_ASYNC}}, {kind: arrow_function}]
      transform:
        ARROW_MODIFIER: {replace: {source: $ARROW_ASYNC, replace: '^(.+)$', by: '$1 '}}
      fix: $ARROW_MODIFIER$ARROW_GENERICS$ARROW_PARAMETERS$ARROW_RETURN => …
transform:
    USING: {replace: {source: $KIND, replace: '^await$', by: 'await using'}}
    PREFIX: {replace: {source: $USING, replace: '^(.+)$', by: '$1 '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, generics, layout, object, block, arrow]}}
    TRIMMED: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-function
language: tsxlang
role: item
symbolType: function
utils:
    top:
        inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
    declaration:
        matches: top
        any:
            - kind: lexical_declaration, using_declaration
              has: {field: kind, pattern: $$KIND}
            - kind: variable_declaration
              has: {regex: '^var$', pattern: $$KIND}
    effect-function:
        any:
            - kind: identifier
              regex: '^fn(?:Untraced)?$'
            - kind: member_expression
              has: {field: property, regex: '^fn(?:Untraced)?$'}
    callable:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              has:
                field: function
                any:
                    - matches: effect-function
                    - kind: call_expression
                      has: {field: function, matches: effect-function}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: 1, matches: callable}
    exported:
        any:
            - kind: export_statement
            - inside: {kind: 'export_statement, ambient_declaration', stopBy: end}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    pattern: $DECLARATION
    any:
        - kind: function_declaration, generator_function_declaration, function_signature
          matches: top
          has: {field: name, pattern: $NAME}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - has: {field: value, matches: callable}
            - inside: {matches: declaration}
        - kind: export_statement
          inside: {kind: program}
          all:
            - has: {field: value, matches: callable}
            - has: {regex: '^default$', pattern: $$NAME}
rewriters:
    - id: body
      rule: {kind: statement_block, inside: {kind: 'function_declaration, generator_function_declaration', field: body}}
      fix: ''
    - id: block
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $ARROW_PARAMETERS}}, {has: {field: parameter, pattern: $ARROW_PARAMETERS}}]
            - any: [{has: {field: type_parameters, pattern: $ARROW_GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $ARROW_RETURN}}, {kind: arrow_function}]
            - any: [{has: {regex: '^async$', pattern: $$ARROW_ASYNC}}, {kind: arrow_function}]
      transform:
        ARROW_MODIFIER: {replace: {source: $ARROW_ASYNC, replace: '^(.+)$', by: '$1 '}}
      fix: $ARROW_MODIFIER$ARROW_GENERICS$ARROW_PARAMETERS$ARROW_RETURN => …
transform:
    USING: {replace: {source: $KIND, replace: '^await$', by: 'await using'}}
    PREFIX: {replace: {source: $USING, replace: '^(.+)$', by: '$1 '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, block, object, arrow]}}
    TRIMMED: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-interface
language: tsxlang
role: item
symbolType: interface
utils:
    exported:
        any:
            - inside: {kind: 'export_statement, ambient_declaration'}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    kind: interface_declaration
    inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
    has: {field: name, pattern: $NAME}
    all:
        - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {kind: interface_declaration}]
        - any: [{has: {kind: extends_type_clause, pattern: $EXTENDS}}, {kind: interface_declaration}]
transform:
    CLAUSE: {replace: {source: $EXTENDS, replace: '(?s)^(.+)$', by: ' $1'}}
name: $NAME
signature: interface $NAME$GENERICS$CLAUSE
isExported: {matches: exported}
---
id: typescript-type
language: tsxlang
role: item
symbolType: struct
utils:
    exported:
        any:
            - inside: {kind: 'export_statement, ambient_declaration'}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    kind: type_alias_declaration
    pattern: $DECLARATION
    inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: object_type, inside: {kind: type_alias_declaration, field: value, stopBy: {not: {kind: 'union_type, intersection_type, parenthesized_type'}}}}
      fix: '{…}'
    - id: layout
      rule: {kind: object_type, regex: "\n"}
      fix: '{…}'
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, layout]}}
    TRIMMED: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {matches: exported}
---
id: typescript-enum
language: tsxlang
role: item
symbolType: enum
utils:
    exported:
        any:
            - inside: {kind: 'export_statement, ambient_declaration'}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    kind: enum_declaration
    pattern: $DECLARATION
    inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: enum_body, inside: {kind: enum_declaration, field: body}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {matches: exported}
---
id: typescript-constant
language: tsxlang
role: item
symbolType: constant
utils:
    declaration:
        inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
        any:
            - kind: lexical_declaration
              has: {field: kind, regex: '^const$', pattern: $$KIND}
            - kind: using_declaration
              has: {field: kind, pattern: $$KIND}
    exported:
        any:
            - kind: export_statement
            - inside: {kind: 'export_statement, ambient_declaration', stopBy: end}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    pattern: $DECLARATION
    any:
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - inside: {matches: declaration}
        - kind: identifier, shorthand_property_identifier_pattern
          pattern: $NAME
          all:
            - inside:
                kind: variable_declarator
                field: name
                stopBy: {not: {kind: 'object_pattern, array_pattern, pair_pattern, rest_pattern, assignment_pattern, object_assignment_pattern'}}
                inside: {matches: declaration}
            - not: {inside: {kind: 'assignment_pattern, object_assignment_pattern', field: right}}
        - kind: export_statement
          inside: {kind: program}
          all:
            - has: {field: value, pattern: $_}
            - has: {regex: '^default$', pattern: $$NAME}
rewriters:
    - id: arguments
      rule: {kind: arguments, regex: "\n"}
      fix: (…)
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: array
      rule: {kind: array, has: {pattern: $_}}
      fix: '[…]'
    - id: block
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: body
      rule: {kind: class_body, inside: {kind: class, field: body}}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $ARROW_PARAMETERS}}, {has: {field: parameter, pattern: $ARROW_PARAMETERS}}]
            - any: [{has: {field: type_parameters, pattern: $ARROW_GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $ARROW_RETURN}}, {kind: arrow_function}]
            - any: [{has: {regex: '^async$', pattern: $$ARROW_ASYNC}}, {kind: arrow_function}]
      transform:
        ARROW_MODIFIER: {replace: {source: $ARROW_ASYNC, replace: '^(.+)$', by: '$1 '}}
      fix: $ARROW_MODIFIER$ARROW_GENERICS$ARROW_PARAMETERS$ARROW_RETURN => …
transform:
    USING: {replace: {source: $KIND, replace: '^await$', by: 'await using'}}
    PREFIX: {replace: {source: $USING, replace: '^(.+)$', by: '$1 '}}
    SHAPED: {rewrite: {source: $DECLARATION, rewriters: [arguments, object, array, block, body, arrow]}}
    TRIMMED: {replace: {source: $SHAPED, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}])+$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-variable
language: tsxlang
role: item
symbolType: variable
utils:
    declaration:
        inside: {kind: program, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
        any:
            - kind: lexical_declaration
              has: {field: kind, regex: '^let$', pattern: $$KIND}
            - kind: variable_declaration
              has: {regex: '^var$', pattern: $$KIND}
    exported:
        any:
            - inside: {kind: 'export_statement, ambient_declaration', stopBy: end}
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: export_statement
                    not: {has: {field: source, pattern: $_}}
                    any:
                        - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                        - has: {kind: identifier, pattern: $NAME}
rule:
    pattern: $DECLARATION
    any:
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - inside: {matches: declaration}
        - kind: identifier, shorthand_property_identifier_pattern
          pattern: $NAME
          all:
            - inside:
                kind: variable_declarator
                field: name
                stopBy: {not: {kind: 'object_pattern, array_pattern, pair_pattern, rest_pattern, assignment_pattern, object_assignment_pattern'}}
                inside: {matches: declaration}
            - not: {inside: {kind: 'assignment_pattern, object_assignment_pattern', field: right}}
rewriters:
    - id: arguments
      rule: {kind: arguments, regex: "\n"}
      fix: (…)
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: array
      rule: {kind: array, has: {pattern: $_}}
      fix: '[…]'
    - id: block
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $ARROW_PARAMETERS}}, {has: {field: parameter, pattern: $ARROW_PARAMETERS}}]
            - any: [{has: {field: type_parameters, pattern: $ARROW_GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $ARROW_RETURN}}, {kind: arrow_function}]
            - any: [{has: {regex: '^async$', pattern: $$ARROW_ASYNC}}, {kind: arrow_function}]
      transform:
        ARROW_MODIFIER: {replace: {source: $ARROW_ASYNC, replace: '^(.+)$', by: '$1 '}}
      fix: $ARROW_MODIFIER$ARROW_GENERICS$ARROW_PARAMETERS$ARROW_RETURN => …
transform:
    PREFIX: {replace: {source: $KIND, replace: '^(.+)$', by: '$1 '}}
    SHAPED: {rewrite: {source: $DECLARATION, rewriters: [arguments, object, array, block, arrow]}}
name: $NAME
signature: $PREFIX$SHAPED
isExported: {matches: exported}
---
id: typescript-assignment
language: tsxlang
role: item
symbolType: property
rule:
    kind: assignment_expression
    pattern: $DECLARATION
    inside: {kind: expression_statement, inside: {kind: program}}
    has: {field: left, kind: member_expression, pattern: $NAME}
rewriters:
    - id: arguments
      rule: {kind: arguments, regex: "\n"}
      fix: (…)
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: array
      rule: {kind: array, has: {pattern: $_}}
      fix: '[…]'
    - id: block
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $ARROW_PARAMETERS}}, {has: {field: parameter, pattern: $ARROW_PARAMETERS}}]
            - any: [{has: {field: type_parameters, pattern: $ARROW_GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $ARROW_RETURN}}, {kind: arrow_function}]
            - any: [{has: {regex: '^async$', pattern: $$ARROW_ASYNC}}, {kind: arrow_function}]
