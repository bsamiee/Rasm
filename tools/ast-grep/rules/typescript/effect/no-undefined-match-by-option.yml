# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    option-match:
        kind: member_expression
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^match$'}}}
    from-undefined:
        kind: call_expression
        all:
            - has: {field: arguments, has: {nthChild: 1, pattern: $VALUE}}
            - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^fromUndefinedOr$'}}}}
    data-last-match:
        kind: call_expression
        all:
            - has: {field: arguments, all: [{has: {nthChild: 1, kind: object}}, {not: {has: {nthChild: 2}}}]}
            - has: {field: function, matches: option-match}
rule:
    kind: call_expression
    pattern: $HAND
    any:
        - all:
            - has: {field: function, matches: option-match}
            - has: {field: arguments, all: [{has: {nthChild: 2, kind: object}}, {has: {nthChild: 1, matches: from-undefined}}]}
        - all:
            - has: {field: function, matches: data-last-match}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: from-undefined}}, {not: {has: {nthChild: 2}}}]}
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: from-undefined}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: data-last-match}}
        - all:
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: from-undefined}}, {has: {nthChild: 2, matches: data-last-match}}]}
            - has: {field: function, matches: effect-pipe-function}
message: '`$HAND` converts `$VALUE` through `Option.fromUndefinedOr` to match it'
note: 'Call `UndefinedOr.match(<value>, { onUndefined, onDefined })`'
