# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-item-branch
language: yaml
severity: error
files: [tools/ast-grep/rules/**, tools/ast-grep/utils/**, tools/ast-grep/rewrites/**, tools/ast-grep/outline/**]
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - has: {field: key, pattern: $KEY, regex: '^(all|any|"all"|"any"|''all''|''any'')$'}
        - has:
            field: value
            any:
                - kind: block_node
                  has:
                    kind: block_sequence
                    not: {has: {kind: block_sequence_item, nthChild: {position: 2, ofRule: {kind: block_sequence_item}}}}
                - kind: flow_node
                  has:
                    kind: flow_sequence
                    not: {has: {kind: flow_node, nthChild: {position: 2, ofRule: {kind: flow_node}}}}
message: '`$KEY:` holds fewer than two items, one item states no conjunction or alternative, and an empty list matches every node or none'
note: Lift the item's keys into the map, or move the sibling clause of the same key into the list, ordered by capture dependency then cost
