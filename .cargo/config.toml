# --- [BUILD] ----------------------------------------------------------------------------

[build]
# --- [DIRECTORIES]

target-dir = ".artifacts/cargo"
build-dir  = "{workspace-root}/.cache/cargo" # Keep intermediate files separate for each workspace, including uv sdist workspaces under `.cache`

# --- [COMPILATION]

rustflags   = ["-Zunstable-options", "--jobs-frontend=0"] # `0` uses available cores, and frontend threads after the first wait for tokens from Cargo's shared jobserver
fingerprint = "content"

# --- [ENV] ------------------------------------------------------------------------------

[env]
CLIPPY_CONF_DIR  = { value = ".config", relative = true }
DYLINT_RUSTFLAGS = "-Zflatten-format-args=no"

# --- [CACHE] ----------------------------------------------------------------------------

[cache.global-clean]
max-src-age    = "1 week"
max-crate-age  = "1 month"
max-git-co-age = "1 week"
max-git-db-age = "1 month"

# --- [PROFILE] --------------------------------------------------------------------------

# --- [DEV]

# Cargo rejects member `[lints]` overrides with `workspace = true`, and Tombi's `Cargo.toml` schema rejects profile `rustflags`
[profile.dev.package]
rasm-site             = { rustflags = ["-Aunsafe_code"] }         # PROJ `proj_factors` uses `proj-sys` FFI until `proj` provides a wrapper
rasm-process          = { rustflags = ["-Aunsafe_code"] }         # Windows `CreateEnvironmentBlock` requires `windows` FFI without a safe crate wrapper
rasm-mcp              = { rustflags = ["-Adeprecated"] }          # MCP revisions using `initialize` retain logging and `resources/subscribe`. GenAI names moved to a repository without a published crate
rasm-mcp-tests        = { rustflags = ["-Adeprecated"] }          # Scenarios exercise server support for MCP revisions using `initialize`
rasm-dependency-graph = { rustflags = ["-Aclippy::expect_used"] } # petgraph requires checked `Acyclic::try_from` for graphs and subgraphs acyclic by construction

# --- [RELEASE]

# Separate release and dev profiles require repeated overrides for `check` under release, bench, and dist
[profile.release.package]
rasm-site             = { rustflags = ["-Aunsafe_code"] }
rasm-process          = { rustflags = ["-Aunsafe_code"] }
rasm-mcp              = { rustflags = ["-Adeprecated"] }
rasm-mcp-tests        = { rustflags = ["-Adeprecated"] }
rasm-dependency-graph = { rustflags = ["-Aclippy::expect_used"] }

# --- [RESOLVER] -------------------------------------------------------------------------

[resolver]
feature-unification = "workspace"

# --- [TARGET] ---------------------------------------------------------------------------

# Replace Apple ld with Wild (https://github.com/wild-linker/wild) when Mach-O supports Rust std's thread-local storage, Dylint dylibs, and dev line tables.
# Target `rustflags` replace `build.rustflags`, so repeat build flags when enabling Wild
# [target.aarch64-apple-darwin]
# rustflags = ["-Zunstable-options", "--jobs-frontend=0", "-Clink-arg=--ld-path=wild"]

# --- [UNSTABLE] -------------------------------------------------------------------------

[unstable]
# --- [DEPENDENCIES]

bindeps             = true
feature-unification = true
git                 = "shallow-deps"

# --- [BUILD]

build-analysis     = true # `CARGO_BUILD_ANALYSIS_ENABLED=true` sets `build.analysis.enabled` to record builds in `$CARGO_HOME/log` for `cargo report`
checksum-freshness = true
profile-rustflags  = true

# --- [CACHE]

gc = true
