# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unit-state-recur
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: invocation_expression
    pattern: $RECUR
    all:
        - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Monad$'}, member: {regex: '^recur$'}}}}
        - has:
            field: arguments
            all:
                - has: {kind: argument, nthChild: 1, regex: '^unit$'}
                - has: {kind: argument, nthChild: 2, has: {kind: lambda_expression, has: {field: parameters, kind: implicit_parameter, regex: '^_$'}}}
message: '`Monad.recur` over `unit` repeats one step with no state'
note: 'Answer `IO<bool>` from the step and loop through `RepeatUntil(done => done)`, `RepeatUntil(Schedule.spaced(<tick>), done => done)` where the loop waits between steps'
