# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    runner:
        any:
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)(NodeRuntime|BunRuntime|BrowserRuntime)$'}, member: {regex: '^runMain$'}}}
            - matches: {typescript-import-reference: {source: {regex: '^@effect/platform-[a-z]+/(Node|Bun|Browser)Runtime$'}, exported: {regex: '^runMain$'}}}
            - matches: {effect-runner: {name: {regex: '^run'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)ManagedRuntime$'}, member: {regex: '^make$'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Layer$'}, member: {regex: '^launch$'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)HttpRouter$'}, member: {regex: '^(serve|toWebHandler)$'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)it$'}, member: {regex: '^(effect|live|layer)$'}}}
            - matches: {typescript-import-reference: {source: {regex: '^@effect/vitest$'}, exported: {regex: '^(effect|live|layer)$'}}}
rule:
    kind: program
    all:
        - has:
            stopBy: end
            kind: member_expression
            pattern: $SINK
            any:
                - matches: {effect-module-member: {module: {regex: '(?-u:\b)Logger$'}, member: {regex: '^(layer|make|map|batched|toFile|CurrentLoggers|LogToStderr|defaultLogger|tracerLogger|format[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+|console[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+|with[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+)$'}}}
                - matches: {effect-module-member: {module: {regex: '(?-u:\b)(Otlp|OtlpExporter|OtlpLogger|OtlpTracer|OtlpMetrics|OtelLogger|OtelTracer|OtelMetrics|PrometheusMetrics|NodeSdk|WebSdk)$'}, member: {regex: '^(layer[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*|make)$'}}}
                - matches: {effect-module-member: {module: {regex: '(?-u:\b)Tracer$'}, member: {regex: '^make$'}}}
                - matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^(withLogger|withTracer)$'}}}
        - not: {has: {stopBy: end, matches: runner}}
labels:
    SINK: {style: primary}
message: '`$SINK` builds a telemetry sink in a module that runs no program'
note: 'Log through `Effect.log*` with `Effect.annotateLogs` and leave loggers, tracers, and exporters to the module calling a runner'
