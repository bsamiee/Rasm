# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-map-over-string-literals
language: tsx
severity: error
utils:
    # Template or concatenation as the body or in a return, a comparison against a string builds nothing
    string-value:
        any:
            - kind: template_string
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^\+$'}}, {has: {kind: string}}]
    string-builder:
        any: [{kind: arrow_function}, {kind: function_expression}]
        has:
            field: body
            any:
                - matches: string-value
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: string-value}}
rule:
    any:
        - pattern: $LIST.map($BUILDER)
        - pattern: Array.map($LIST, $BUILDER)
        - pattern: Array.map($BUILDER)($LIST)
        - pattern: pipe($LIST, Array.map($BUILDER), $$$)
constraints:
    LIST: {matches: {syntax-homogeneous-container: {item: {matches: syntax-string-literal}}}}
    BUILDER: {matches: string-builder}
message: The strings the map produces are known when the list is written
note: Write the produced strings as the list, or one brace glob `prefix/{a,b,c}` when the consumer expands globs
labels:
    LIST: {style: primary, message: The literal list}
