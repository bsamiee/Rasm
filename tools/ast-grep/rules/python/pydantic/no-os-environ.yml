# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-os-environ
language: python
severity: error
utils:
    mapping:
        any:
            - matches: {python-module-member: {module: {regex: '^os$'}, name: {regex: '^environb?$'}}}
            - matches: {python-imported-name: {module: {regex: '^os$'}, name: {regex: '^environb?$'}}}
rule:
    any:
        - kind: call
          has:
            field: function
            any:
                - matches: {python-module-member: {module: {regex: '^os$'}, name: {regex: '^getenvb?$'}}}
                - matches: {python-imported-name: {module: {regex: '^os$'}, name: {regex: '^getenvb?$'}}}
                - kind: attribute
                  all:
                    - has: {field: object, matches: mapping}
                    - has: {field: attribute, regex: '^(get|items|keys|values|copy)$'}
        - kind: comparison_operator
          regex: '\s(not\s+)?in\s+[\w.]+$'
          has: {matches: mapping, nthChild: 2}
        - kind: subscript
          has: {field: value, matches: mapping}
          not:
            any:
                - inside:
                    kind: 'assignment, augmented_assignment'
                    field: left
                    stopBy: {not: {kind: 'pattern_list, tuple_pattern, list_pattern'}}
                - inside: {kind: delete_statement}
message: 'Reading the process environment bypasses typed settings'
note: Declare the field on `BaseSettings`, load it at the application boundary, and pass the validated value to domain functions
