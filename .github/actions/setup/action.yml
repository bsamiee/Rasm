name: Setup
description: Fills the assets submodule at its recorded commit, installs mise tools and workspace packages, selects Xcode and builds the nx-apple core on macOS, and reports whether the Nx remote cache server answers

inputs:
    assets-key:
        description: Deploy key reading the assets repository
        required: true
    cache-server:
        description: Nx self-hosted remote cache server, empty runs tasks without one
        default: ""

outputs:
    cache:
        description: Holds true where the remote cache server answers
        value: ${{ steps.cache.outputs.reachable }}

runs:
    using: composite
    steps:
        - id: assets
          run: "{ printf 'ref=' && git rev-parse HEAD:assets; } >> \"${GITHUB_OUTPUT}\""
          shell: bash
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
              repository: ${{ github.repository }}-Assets
              ref: ${{ steps.assets.outputs.ref }}
              path: assets
              ssh-key: ${{ inputs.assets-key }}
              persist-credentials: false
        - if: runner.os == 'macOS'
          run: printf 'DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer\n' >> "${GITHUB_ENV}"
          shell: bash
        - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        - run: pnpm install
          shell: bash
        - id: cache
          if: inputs.cache-server != ''
          run: curl --fail --silent --show-error --max-time 10 "${SERVER}/health" && printf 'reachable=true\n' >> "${GITHUB_OUTPUT}" || printf '::warning::Nx remote cache is unreachable, tasks run without it\n'
          shell: bash
          env:
              SERVER: ${{ inputs.cache-server }}
        - if: runner.os == 'macOS'
          run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
          shell: bash
          env:
              NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ steps.cache.outputs.reachable == 'true' && inputs.cache-server || '' }}
