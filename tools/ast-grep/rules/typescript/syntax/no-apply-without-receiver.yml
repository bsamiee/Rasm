# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-apply-without-receiver
language: tsxlang
severity: error
rule:
    kind: call_expression
    pattern: '$_($F, $RECEIVER, $LIST)'
    has: {field: function, regex: '^((globalThis|window|self)\.)?Reflect\.apply$', matches: typescript-global-reference}
    not: {has: {field: arguments, has: {kind: comment, stopBy: end}}}
constraints:
    F: {not: {any: [{kind: 'member_expression, subscript_expression, parenthesized_expression'}, {kind: identifier, regex: '^eval$'}]}}
    RECEIVER: {regex: '^undefined$', matches: typescript-global-reference}
    LIST: {kind: array}
message: '`$F` is called through `Reflect.apply` with no receiver'
note: 'Call `<function>(<arguments>)`, spreading a held argument list as `<function>(...<arguments>)`'
