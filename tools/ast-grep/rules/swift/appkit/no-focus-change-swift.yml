# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
files: ['libs/**', 'tools/**', 'plugins/**', 'apps/creative-cloud/**', '.claude/**', '.codex/**']
rule:
    any:
        - kind: call_expression
          pattern: $SITE
          any:
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '(^|\.)activate$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 1, has: {field: name, regex: '^(options|from|ignoringOtherApps)$'}}}}
            - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^((AppKit(\.|::))?NSApp|(AppKit(\.|::))?NSApplication\.shared)\.(activate|unhide)$'}
            - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '(^|\.)activateFileViewerSelecting$'}
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '(^|\.)(selectFile|showSearchResults)$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^(inFileViewerRootedAtPath|forQueryString)$'}}}}
            - all:
                - has:
                    nthChild: 1
                    any:
                        - regex: '^(AppKit(\.|::))?NSWorkspace\.shared\.open$'
                        - {regex: '^(self\.)?open$', inside: {kind: class_declaration, stopBy: end, has: {field: name, regex: '^(AppKit(\.|::))?NSWorkspace$'}}}
                - not: {has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^configuration$'}}}}}
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '(^|\.)(openApplication|open)$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^configuration$'}}, {has: {field: value, pattern: $CONFIGURATION}}]}}}
                - not:
                    inside:
                        kind: 'function_declaration, init_declaration, source_file'
                        stopBy: {kind: 'function_declaration, init_declaration, source_file'}
                        has: {stopBy: end, kind: assignment, pattern: $CONFIGURATION.activates = false}
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^AXUIElementPerformAction$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 2, regex: '^(kAXRaiseAction(?-u:\b)|"AXRaise")'}}}
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^AXUIElementSetAttributeValue$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 2, regex: '^(kAXFrontmostAttribute(?-u:\b)|"AXFrontmost")'}}}
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^(NSAppleEventDescriptor(\.init)?|AECreateAppleEvent)$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {stopBy: end, kind: simple_identifier, regex: '^kAEActivate$'}}}}
            - all:
                - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^NSAppleScript(\.init)?$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^source$'}}, {has: {field: value, regex: '(?-u:\b)activate(?-u:\b)|(?-u:\b)set[\t-\r ]+frontmost(?-u:\b)|AXRaise'}}]}}}
        - kind: assignment
          pattern: $SITE
          all:
            - has: {field: target, regex: '\.activates$'}
            - has: {field: result, regex: '^true$'}
message: '`$SITE` takes focus from the frontmost application'
note: 'Call `NSWorkspace.launch` from `Applications`, use Accessibility actions except `AXRaise`, and delete activation calls'
