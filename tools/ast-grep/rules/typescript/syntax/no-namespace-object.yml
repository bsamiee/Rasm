# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    module-function:
        any:
            - {kind: function_declaration, has: {field: name, pattern: $MEMBER}}
            - kind: lexical_declaration
              has: {kind: variable_declarator, all: [{has: {field: name, pattern: $MEMBER}}, {has: {field: value, kind: 'arrow_function, function_expression'}}]}
    forwarded:
        kind: shorthand_property_identifier
        pattern: $MEMBER
        inside: {kind: program, stopBy: end, has: {any: [{matches: module-function}, {kind: export_statement, has: {matches: module-function}}]}}
    function-object:
        kind: object
        all:
            - not: {has: {stopBy: end, kind: this}}
            - not: {has: {kind: method_definition, has: {regex: '^(get|set)$', not: {kind: property_identifier}}}}
            - has: {any: [{kind: method_definition}, {kind: pair, has: {field: value, kind: 'arrow_function, function_expression, call_expression, new_expression'}}, {matches: forwarded}]}
            - not: {has: {kind: pair, has: {field: key, kind: 'string, number, computed_property_name'}}}
            - not: {has: {kind: spread_element}}
            - any:
                - not: {has: {kind: pair, has: {field: value, kind: 'string, template_string, number, true, false, null, undefined, regex, array'}}}
                - has: {matches: forwarded}
rule:
    kind: variable_declarator
    all:
        - inside: {matches: typescript-module-constant}
        - has: {field: name, kind: identifier, pattern: $NAME}
        - has:
            field: value
            any:
                - matches: function-object
                - matches: typescript-expression-wrapper
                  has: {stopBy: {not: {matches: typescript-expression-wrapper}}, matches: function-object}
        - not:
            inside:
                kind: program
                stopBy: end
                has:
                    stopBy: end
                    kind: identifier, shorthand_property_identifier
                    pattern: $NAME
                    not:
                        any:
                            - inside: {kind: variable_declarator, field: name}
                            - inside: {kind: member_expression, field: object}
                            - inside: {kind: export_specifier}
message: '`$NAME` groups module functions in a namespace object'
note: 'Declare each member as a module `const` and list it in the export statement'
