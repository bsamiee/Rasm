id: no-read-before-write
valid:
    - |
      const save = Effect.gen(function* () {
          const [row] = yield* sql`select total, revision from account where id = ${id}`;
          yield* sql`update account set total = ${row.total + amount} where id = ${id} and revision = ${row.revision}`;
      });
    - |
      const save = Effect.gen(function* () {
          yield* sql`update account set total = total + ${amount} where id = ${id}`;
      });
invalid:
    - |
      const save = Effect.gen(function* () {
          const [row] = yield* sql`select total from account where id = ${id}`;
          yield* sql`update account set total = ${row.total + amount} where id = ${id}`;
      });
    - |
      const save = Effect.gen(function* () {
          const rows = yield* sql`select name from account where id = ${id}`;
          const values = sql`(${rows[0].name})`;
          yield* sql`insert into audit (name) values ${values}`;
      });
