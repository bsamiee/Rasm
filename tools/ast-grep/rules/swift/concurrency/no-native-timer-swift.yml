# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-timer-swift
language: swift
severity: error
rule:
    kind: call_expression
    any:
        - has:
            nthChild: 1
            pattern: $NAME
            any:
                - kind: navigation_expression
                  has: {field: suffix, regex: '^\.asyncAfter$'}
                - kind: navigation_expression
                  regex: '^((Dispatch\.)?DispatchSource\.makeTimerSource|(Foundation\.)?Timer\.(scheduledTimer|publish)|(Foundation\.)?Thread\.sleep)$'
                - kind: simple_identifier
                  regex: '^(CFRunLoopTimerCreate(WithHandler)?|sleep|usleep)$'
        - all:
            - has: {nthChild: 1, pattern: $NAME, regex: '^(Foundation\.)?Timer$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 1, has: {field: name, regex: '^(timeInterval|fire|fireAt)$'}}}}
        - all:
            - has: {nthChild: 1, pattern: $NAME}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^afterDelay$'}}}}
        - all:
            - has: {nthChild: 1, kind: navigation_expression, pattern: $NAME, has: {field: suffix, regex: '^\.schedule$'}}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 1, has: {field: name, regex: '^after$'}}}}
message: '`$NAME` waits on a dispatch, run loop, or thread timer outside Swift concurrency'
note: '`Task.sleep(for:)` or `clock.sleep(until:)` in a task replaces a one-shot timer or blocking sleep, a loop sleeping `until:` a deadline it advances by the interval replaces a repeating timer without drift, `TimelineView` replaces a view clock, and task cancellation replaces `cancel()` and `invalidate()`'
