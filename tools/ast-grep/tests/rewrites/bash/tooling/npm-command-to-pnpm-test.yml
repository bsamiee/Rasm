id: npm-command-to-pnpm
valid:
    - npm publish
    - npm audit fix
    - command npm run build
    - pnpm run build
    - printf '%s\n' npm
    - npx -y tool
    - npx -p package tool
invalid:
    - npm run build
    - npm test
    - npm install
    - npm i --save-dev vitest
    - npm ci
    - npm run ci
    - npx biome check .
    - npx biome check --write
    - npm run build -- --watch
    - npm i -g tool
    - |
      build() {
          npm run build | tee log
      }
