syntax = "proto3";

package rasm.contracts.parity.v1;

import "buf/validate/validate.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

enum ArtifactRole {
  ARTIFACT_ROLE_UNSPECIFIED = 0;
  ARTIFACT_ROLE_RELATIONAL_MODEL = 1;
  ARTIFACT_ROLE_MIGRATION_BUNDLE = 2;
  ARTIFACT_ROLE_EVENT_STORAGE = 3;
  ARTIFACT_ROLE_SQL_OBJECT_SET = 4;
  ARTIFACT_ROLE_SEMANTIC_PROBE_SET = 5;
  ARTIFACT_ROLE_OBJECT_CUSTODY = 6;
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_POSTGRESQL = 1;
  PROVIDER_SQLITE = 2;
  PROVIDER_PGLITE = 3;
  PROVIDER_OBJECT_STORE = 4;
}

// Failure handling keys each row through its explicit absorption policy; ordinal order carries no disruption meaning.
enum FailureRank {
  FAILURE_RANK_UNSPECIFIED = 0;
  FAILURE_RANK_REQUIRED = 1;
  FAILURE_RANK_DEGRADABLE = 2;
  FAILURE_RANK_OBSERVATIONAL = 3;
}

// Rank order is load-bearing: an aggregated repair reports the worst restart disruption across its gap set.
enum RestartClass {
  RESTART_CLASS_UNSPECIFIED = 0;
  RESTART_CLASS_SESSION = 1;
  RESTART_CLASS_RELOAD = 2;
  RESTART_CLASS_RESTART = 3;
}

// --- [BACKEND] ----------------------------------------------------------------------------

// One schema artifact: key, role, canonical content, the provider set, and the dependency key set. Protovalidate
// owns item shape and uniqueness; producers emit both collections in ascending ordinal order and consuming
// admission rejects a different order.
message Artifact {
  option (buf.validate.message).cel = {
    id: "artifact.dependency_not_self"
    message: "an artifact cannot depend on itself"
    expression: "this.depends_on.all(key, key != this.key)"
  };

  string key = 1 [(buf.validate.field).string = {
    pattern: "^[\\x20-\\x7e]+$"
    max_len: 256
  }];
  ArtifactRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bytes content = 3 [(buf.validate.field).bytes.max_len = 262144];
  repeated Provider providers = 4 [(buf.validate.field).repeated = {
    max_items: 4
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  repeated string depends_on = 5 [(buf.validate.field).repeated = {
    max_items: 4096
    unique: true
    items: {
      string: {
        pattern: "^[\\x20-\\x7e]+$"
        max_len: 256
      }
    }
  }];
}

message Capability {
  string key = 1 [(buf.validate.field).string = {
    pattern: "^[\\x20-\\x7e]+$"
    max_len: 256
  }];
  string lane = 2 [(buf.validate.field).string = {
    pattern: "^[\\x20-\\x7e]+$"
    max_len: 256
  }];
  string requirement = 3 [(buf.validate.field).string = {
    pattern: "^[\\x20-\\x7e]+$"
    max_len: 256
  }];
  string requirement_value = 4 [(buf.validate.field).string = {
    pattern: "^[\\x20-\\x7e]*$"
    max_len: 256
  }];
  FailureRank failure_rank = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  RestartClass restart_class = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// One branch contribution to the schema contract. Producers emit artifacts and capabilities in ascending
// ordinal-key order; consuming admission rejects a different order after Protovalidate owns row shape and unique
// keys. A key two branches claim with differing content refuses at merge. Generation identity uses the estate
// canonical writer, never protobuf or ProtoJSON bytes: contract string; counted artifacts as key, role ordinal,
// framed content, counted provider ordinals, counted dependency strings; counted capabilities as their six fields
// in tag order. This map-free and float-free preimage reads known fields only, so unknown protobuf residue cannot
// change identity.
message Backend {
  option (buf.validate.message).cel = {
    id: "backend.artifact_keys_unique"
    message: "artifact keys must be unique"
    expression: "this.artifacts.map(row, row.key).unique()"
  };
  option (buf.validate.message).cel = {
    id: "backend.capability_keys_unique"
    message: "capability keys must be unique"
    expression: "this.capabilities.map(row, row.key).unique()"
  };

  string contract = 1 [(buf.validate.field).string = {
    pattern: "^[\\x20-\\x7e]+$"
    max_len: 256
  }];
  repeated Artifact artifacts = 2 [(buf.validate.field).repeated.max_items = 4096];
  repeated Capability capabilities = 3 [(buf.validate.field).repeated.max_items = 4096];
}
