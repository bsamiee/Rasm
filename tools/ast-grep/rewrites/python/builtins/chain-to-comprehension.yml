# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: chain-to-comprehension
language: python
severity: off
rule:
    kind: call
    pattern: $CALL
    not:
        any:
            - matches: python-shadowed-name
            - has: {kind: comment, stopBy: end}
    any:
        - pattern: $COLLECT($INNER)
          has:
            field: arguments
            has:
                kind: call
                all:
                    - has: {field: function, pattern: $F}
                    - has: {field: arguments, kind: generator_expression, pattern: $GENERATOR}
        - pattern: $COLLECT($F.from_iterable($ITERABLES))
        - pattern: $COLLECT($F($$$ARGS))
          has:
            field: arguments
            has:
                kind: call
                has:
                    field: arguments
                    all:
                        - has: {pattern: $_}
                        - not: {has: {kind: 'keyword_argument, dictionary_splat'}}
constraints:
    F: {matches: python-chain-callee}
    COLLECT: {kind: identifier, regex: "^(list|set)$"}
transform:
    ITER: {replace: {source: $ITERABLES, replace: "(?s)^(.+)$", by: "($1)"}}
    GROUP: {replace: {source: $$$ARGS, replace: '(?s)^(.+?)(?:,\s*)?$', by: "($1,)"}}
    GENERATOR_GROUP: {replace: {source: $GENERATOR, replace: "(?s)^(.+)$", by: "($1,)"}}
    SET_OPEN: {replace: {source: $COLLECT, replace: "^set$", by: "{"}}
    OPEN: {replace: {source: $SET_OPEN, replace: "^list$", by: "["}}
    SET_CLOSE: {replace: {source: $COLLECT, replace: "^set$", by: "}"}}
    CLOSE: {replace: {source: $SET_CLOSE, replace: "^list$", by: "]"}}
fix: "$OPEN*iterable for iterable in $ITER$GROUP$GENERATOR_GROUP$CLOSE"
message: "`$CALL` collects itertools.chain into a $COLLECT"
note: Flatten with an unpacking comprehension of the collector over the chain arguments, retaining their evaluation order and reading no length hint
