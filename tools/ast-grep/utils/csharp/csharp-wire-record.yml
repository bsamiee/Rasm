# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-wire-record
language: csharp
rule:
    kind: record_declaration
    all:
        - has: {field: name, pattern: $WIRE}
        - inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                kind: attribute
                all:
                    - has: {field: name, regex: '^(global::)?(System\.Text\.Json\.Serialization\.)?JsonSerializable(Attribute)?$'}
                    - has: {stopBy: end, kind: typeof_expression, has: {field: type, pattern: $WIRE}}
