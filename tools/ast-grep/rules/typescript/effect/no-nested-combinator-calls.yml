# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    member-call:
        kind: call_expression
        has: {field: function, kind: member_expression}
    module-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: effect-namespace}
    one-argument:
        has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
    step:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)[A-Z][^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*$', not: {regex: '(?-u:\b)Schema$'}}}}}}
            - any:
                - matches: one-argument
                - has: {field: function, matches: effect-dual-operation}
    unary-step:
        all: [{matches: step}, {matches: one-argument}]
    data-first-step:
        matches: step
        has:
            field: arguments
            has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: module-call}
        any:
            - matches: unary-step
            - has: {field: arguments, has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
rule:
    pattern: $CALL
    any:
        - kind: call_expression
          all:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^pipe$'}
                    - has: {field: object, matches: step, all: [{has: {field: function, pattern: $OUTER}}, {has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: module-call}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}]}}]}
            - not: {has: {kind: comment, stopBy: end}}
        - all:
            - matches: member-call
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: member-call, has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: member-call, has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: member-call}}}}}}
            - matches: data-first-step
            - has: {field: function, pattern: $OUTER}
            - has:
                field: arguments
                has:
                    nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}
                    matches: data-first-step
                    has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: data-first-step}}
            - not:
                all:
                    - nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}
                    - inside: {kind: arguments, inside: {matches: data-first-step}}
            - not: {has: {kind: comment, stopBy: end}}
            - not: {has: {kind: type_arguments, stopBy: end}}
message: '`$OUTER` nests data-first module calls four deep or under a `.pipe`'
note: 'Write `pipe(<value>, <step>, <step>, <step>)`'
labels:
    CALL: {style: primary}
