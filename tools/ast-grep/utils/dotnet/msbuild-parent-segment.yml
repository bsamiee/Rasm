# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: msbuild-parent-segment # Value appending a parent segment to a property reference as text, the file-above functions normalize their own result
language: xml
rule:
    any: [{kind: AttValue}, {kind: CharData}]
    regex: '\$\([^)]+\)[\\/]?\.\.[\\/]'
    not: {regex: 'FileAbove'}
