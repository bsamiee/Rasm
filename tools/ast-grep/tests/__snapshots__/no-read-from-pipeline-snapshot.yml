id: no-read-from-pipeline
snapshots:
  a x | b y | while IFS= read -r line; do count=1; done:
    fixed: while IFS= read -r line; do count=1; done < <(a x | b y)
    labels:
    - source: a x | b y | while IFS= read -r line; do count=1; done
      style: primary
      start: 0
      end: 53
    - source: while IFS= read -r line; do count=1; done
      style: secondary
      start: 12
      end: 53
  cmd 2>&1 | while read -r line; do count=1; done:
    fixed: while read -r line; do count=1; done < <(cmd 2>&1)
    labels:
    - source: cmd 2>&1 | while read -r line; do count=1; done
      style: primary
      start: 0
      end: 47
    - source: while read -r line; do count=1; done
      style: secondary
      start: 11
      end: 47
  cmd | IFS= read -r line:
    fixed: IFS= read -r line < <(cmd)
    labels:
    - source: cmd | IFS= read -r line
      style: primary
      start: 0
      end: 23
    - source: read
      style: secondary
      start: 11
      end: 15
    - source: IFS= read -r line
      style: secondary
      start: 6
      end: 23
  cmd | grep read | while read -r line; do count=1; done:
    fixed: while read -r line; do count=1; done < <(cmd | grep read)
    labels:
    - source: cmd | grep read | while read -r line; do count=1; done
      style: primary
      start: 0
      end: 54
    - source: while read -r line; do count=1; done
      style: secondary
      start: 18
      end: 54
  cmd | mapfile -t lines:
    fixed: mapfile -t lines < <(cmd)
    labels:
    - source: cmd | mapfile -t lines
      style: primary
      start: 0
      end: 22
    - source: mapfile
      style: secondary
      start: 6
      end: 13
    - source: mapfile -t lines
      style: secondary
      start: 6
      end: 22
  cmd | read -r line:
    fixed: read -r line < <(cmd)
    labels:
    - source: cmd | read -r line
      style: primary
      start: 0
      end: 18
    - source: read
      style: secondary
      start: 6
      end: 10
    - source: read -r line
      style: secondary
      start: 6
      end: 18
  cmd | readarray -t lines:
    fixed: readarray -t lines < <(cmd)
    labels:
    - source: cmd | readarray -t lines
      style: primary
      start: 0
      end: 24
    - source: readarray
      style: secondary
      start: 6
      end: 15
    - source: readarray -t lines
      style: secondary
      start: 6
      end: 24
  if cmd | read -r first; then printf '%s\n' "$first"; fi:
    fixed: if read -r first < <(cmd); then printf '%s\n' "$first"; fi
    labels:
    - source: cmd | read -r first
      style: primary
      start: 3
      end: 22
    - source: read
      style: secondary
      start: 9
      end: 13
    - source: read -r first
      style: secondary
      start: 9
      end: 22
  ls | until read -r line; do count=1; done:
    fixed: until read -r line; do count=1; done < <(ls)
    labels:
    - source: ls | until read -r line; do count=1; done
      style: primary
      start: 0
      end: 41
    - source: until read -r line; do count=1; done
      style: secondary
      start: 5
      end: 41
  ls | while read -r line; do count=1; done:
    fixed: while read -r line; do count=1; done < <(ls)
    labels:
    - source: ls | while read -r line; do count=1; done
      style: primary
      start: 0
      end: 41
    - source: while read -r line; do count=1; done
      style: secondary
      start: 5
      end: 41
  ls | while read -r line; do count=1; done 2>/dev/null:
    fixed: while read -r line; do count=1; done < <(ls) 2>/dev/null
    labels:
    - source: ls | while read -r line; do count=1; done
      style: primary
      start: 0
      end: 41
    - source: while read -r line; do count=1; done
      style: secondary
      start: 5
      end: 41
  ls | while read -r line; do printf '%s\n' "$line"; done | sort:
    fixed: while read -r line; do printf '%s\n' "$line"; done < <(ls) | sort
    labels:
    - source: ls | while read -r line; do printf '%s\n' "$line"; done | sort
      style: primary
      start: 0
      end: 62
    - source: while read -r line; do printf '%s\n' "$line"; done
      style: secondary
      start: 5
      end: 55
  ls | while true; do read -r line || break; count=1; done:
    fixed: while true; do read -r line || break; count=1; done < <(ls)
    labels:
    - source: ls | while true; do read -r line || break; count=1; done
      style: primary
      start: 0
      end: 56
    - source: while true; do read -r line || break; count=1; done
      style: secondary
      start: 5
      end: 56
  ls |& while read -r line; do count=1; done:
    fixed: while read -r line; do count=1; done < <(ls 2>&1)
    labels:
    - source: ls |& while read -r line; do count=1; done
      style: primary
      start: 0
      end: 42
    - source: while read -r line; do count=1; done
      style: secondary
      start: 6
      end: 42
  ? |
    shopt -u lastpipe
    ls | while read -r line; do count=1; done
  : fixed: |
      shopt -u lastpipe
      while read -r line; do count=1; done < <(ls)
    labels:
    - source: ls | while read -r line; do count=1; done
      style: primary
      start: 18
      end: 59
    - source: while read -r line; do count=1; done
      style: secondary
      start: 23
      end: 59
  y=$(ls | while read -r l; do n=$l; done; printf '%s' "$n"):
    fixed: y=$(while read -r l; do n=$l; done < <(ls); printf '%s' "$n")
    labels:
    - source: ls | while read -r l; do n=$l; done
      style: primary
      start: 4
      end: 39
    - source: while read -r l; do n=$l; done
      style: secondary
      start: 9
      end: 39
  y=$({ cd "$d" && ls | while read -r l; do n=$l; done; }; printf '%s' "$n"):
    fixed: y=$({ cd "$d" && while read -r l; do n=$l; done < <(ls); }; printf '%s' "$n")
    labels:
    - source: ls | while read -r l; do n=$l; done
      style: primary
      start: 17
      end: 52
    - source: while read -r l; do n=$l; done
      style: secondary
      start: 22
      end: 52
