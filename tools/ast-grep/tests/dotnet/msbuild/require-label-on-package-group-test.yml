id: require-label-on-package-group
valid:
    # Identical children under another container do not make an ItemGroup
    - '<Project><Group><PackageVersion Include="Example" Version="1.0.0" /></Group></Project>'
    # The policy labels dependency groups, not unrelated or empty item groups
    - '<Project><ItemGroup /></Project>'
    - '<Project><ItemGroup><None Include="readme.md" /></ItemGroup></Project>'
    # Labeled group
    - |
      <Project><ItemGroup Label="Testing"><PackageVersion Include="CsCheck" Version="4.8.0" /> <!-- Property-based testing --></ItemGroup></Project>
    # Property group, the rule reads item groups alone
    - |
      <Project><PropertyGroup><ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally></PropertyGroup></Project>
    # Single-quoted label
    - |
      <Project><ItemGroup Label='Testing'><PackageVersion Include="CsCheck" Version="4.8.0" /> <!-- Property-based testing --></ItemGroup></Project>
invalid:
    # Empty single-quoted label
    - |
      <Project><ItemGroup Label=''><PackageVersion Include="CsCheck" Version="4.8.0" /> <!-- Property-based testing --></ItemGroup></Project>
    # ItemGroup without a Label
    - |
      <Project><ItemGroup><PackageVersion Include="CsCheck" Version="4.8.0" /> <!-- Property-based testing --></ItemGroup></Project>
    # Empty label naming nothing
    - |
      <Project><ItemGroup Label=""><PackageVersion Include="CsCheck" Version="4.8.0" /> <!-- Property-based testing --></ItemGroup></Project>
    # Condition naming no responsibility
    - |
      <Project><ItemGroup Condition="'$(TargetFramework)' == 'net10.0'"><PackageVersion Include="CsCheck" Version="4.8.0"
        /> <!-- Property-based testing --></ItemGroup></Project>
