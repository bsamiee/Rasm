# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-dual-operation
language: tsxlang
rule:
    kind: member_expression
    any:
        - matches: {effect-module-member: {module: {regex: '\bActivity$'}, member: {regex: '^(retry)$'}}}
        - matches: {effect-module-member: {module: {regex: '\b(AnthropicConfig|OpenAiConfig|OpenRouterConfig|TypeSafeConfig)$'}, member: {regex: '^(withClientTransform)$'}}}
        - matches: {effect-module-member: {module: {regex: '\b(AnthropicLanguageModel|OpenAiEmbeddingModel|OpenAiLanguageModel|OpenRouterLanguageModel)$'}, member: {regex: '^(withConfigOverride)$'}}}
        - matches: {effect-module-member: {module: {regex: '\b(AnthropicTelemetry|OpenAiTelemetry|Telemetry)$'}, member: {regex: '^(addGenAIAnnotations)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bArbitrary$'}, member: {regex: '^(filter|filterMap|flatMap|map)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bArgument$'}
                member:
                    regex: |-
                        (?x)^(atLeast|atMost|between|filter|filterMap|map|mapEffect|mapTryCatch|orElse|orElseResult|variadic|withDefault
                        |withDescription|withFallbackConfig|withFallbackPrompt|withMetavar|withSchema)$
        - matches:
            effect-module-member:
                module: {regex: '\bArray$'}
                member:
                    regex: |-
                        (?x)^(append|appendAll|bind|bindTo|cartesian|cartesianWith|chop|chunksOf|contains|countBy|dedupeAdjacentWith|dedupeWith
                        |difference|drop|dropRight|dropWhile|dropWhileFilter|every|extend|filter|filterMap|findFirst|findFirstIndex
                        |findFirstWithIndex|findLast|findLastIndex|flatMap|flatMapNullishOr|forEach|get|getUnsafe|groupBy|groupWith|insertAt
                        |intersection|intersperse|join|let|makeBy|map|mapAccum|match|matchLeft|matchRight|max|min|modify|modifyHeadNonEmpty
                        |modifyLastNonEmpty|pad|partition|prepend|prependAll|reduce|reduceRight|remove|replace|replicate|rotate|scan|scanRight
                        |setHeadNonEmpty|setLastNonEmpty|some|sort|sortWith|span|split|splitAt|splitAtNonEmpty|splitWhere|take|takeRight
                        |takeWhile|takeWhileFilter|union|unionWith|window|zip|zipWith)$
        - matches:
            effect-module-member:
                module: {regex: '\bAsyncResult$'}
                member:
                    regex: |-
                        (?x)^(flatMap|getOrElse|map|match|matchWithError|matchWithWaiting|replacePrevious|waiting)$
        - matches:
            effect-module-member:
                module: {regex: '\bAtom$'}
                member:
                    regex: |-
                        (?x)^(debounce|getServerValue|initialValue|map|mapResult|modify|optimisticFn|serializable|set|setIdleTTL|setLazy|swr
                        |transform|update|withEquality|withFallback|withLabel|withRefresh|withServerValue)$
        - matches: {effect-module-member: {module: {regex: '\bAtomRegistry$'}, member: {regex: '^(getResult|mount|toStream|toStreamResult)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bBigDecimal$'}
                member:
                    regex: |-
                        (?x)^(between|ceil|clamp|digitAt|divide|divideUnsafe|equals|floor|isGreaterThan|isGreaterThanOrEqualTo|isLessThan
                        |isLessThanOrEqualTo|max|min|multiply|remainder|remainderUnsafe|round|scale|subtract|sum|truncate)$
        - matches:
            effect-module-member:
                module: {regex: '\bBigInt$'}
                member:
                    regex: |-
                        (?x)^(between|clamp|divide|divideUnsafe|gcd|isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo|lcm|max|min
                        |multiply|remainder|subtract|sum)$
        - matches: {effect-module-member: {module: {regex: '\bBoolean$'}, member: {regex: '^(and|eqv|implies|match|nand|nor|or|xor)$'}}}
        - matches: {effect-module-member: {module: {regex: '\b(BrowserRuntime|BunRuntime|NodeRuntime)$'}, member: {regex: '^(runMain)$'}}}
        - matches: {effect-module-member: {module: {regex: '\b(BunStream|NodeStream)$'}, member: {regex: '^(pipeThroughDuplex|pipeThroughSimple)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bByteSize$'}
                member:
                    regex: |-
                        (?x)^(between|clamp|divide|equals|isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo|max|min|subtract
                        |subtractUnsafe|sum|times|toUnit)$
        - matches:
            effect-module-member:
                module: {regex: '\b(Cache|ScopedCache)$'}
                member:
                    regex: |-
                        (?x)^(get|getOption|getSuccess|has|invalidate|invalidateWhen|refresh|set)$
        - matches: {effect-module-member: {module: {regex: '\bCause$'}, member: {regex: '^(annotate|combine|map)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bChannel$'}
                member:
                    regex: |-
                        (?x)^(acquireRelease|bind|bindTo|buffer|bufferArray|catch|catchCause|catchCauseFilter|catchCauseIf|catchDefect|catchFilter
                        |catchIf|catchReason|catchReasons|catchTag|combine|concat|concatWith|embedInput|ensuring|filter|filterArray
                        |filterArrayEffect|filterEffect|filterMap|filterMapArray|filterMapArrayEffect|filterMapEffect|flatMap|haltWhen|ignore
                        |ignoreCause|interruptWhen|let|map|mapAccum|mapDone|mapDoneEffect|mapEffect|mapError|mapInput|mapInputError|merge
                        |mergeAll|mergeEffect|onEnd|onError|onExit|onFirst|onStart|orElseIfEmpty|pipeTo|pipeToOrFail|provide|provideContext
                        |provideService|provideServiceEffect|repeat|retry|runFold|runFoldEffect|runForEach|runForEachWhile|runIntoPubSub
                        |runIntoPubSubArray|runIntoQueue|runIntoQueueArray|scan|scanEffect|schedule|switchMap|tap|tapCause|tapError|toPubSub
                        |toPubSubArray|toPubSubTake|toQueue|toQueueArray|unwrapReason|updateContext|updateService)$
        - matches: {effect-module-member: {module: {regex: '\bChannelSchema$'}, member: {regex: '^(duplex|duplexUnknown)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bChildProcess$'}, member: {regex: '^(pipeTo|setCwd|setEnv)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bChunk$'}
                member:
                    regex: |-
                        (?x)^(append|appendAll|chunksOf|contains|difference|drop|dropRight|dropWhile|every|filter|filterMap|filterMapWhile|findFirst
                        |findFirstIndex|findLast|findLastIndex|flatMap|forEach|get|getUnsafe|intersection|join|makeBy|map|mapAccum|modify
                        |partition|prepend|prependAll|reduce|reduceRight|remove|replace|some|sort|sortWith|split|splitAt|splitNonEmptyAt
                        |splitWhere|take|takeRight|takeWhile|union|zip|zipWith)$
        - matches:
            effect-module-member:
                module: {regex: '\bCommand$'}
                member:
                    regex: |-
                        (?x)^(annotate|annotateMerge|provide|provideEffect|provideEffectDiscard|provideSync|run|validate|withAlias|withDescription
                        |withExamples|withGlobalFlags|withHandler|withSharedFlags|withShortDescription|withSubcommands)$
        - matches: {effect-module-member: {module: {regex: '\bConfig$'}, member: {regex: '^(flatMap|map|mapEffect|nested|orElse|withDefault)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bConfigProvider$'}, member: {regex: '^(mapInput|nested|orElse)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bConsole$'}, member: {regex: '^(withGroup|withTime)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bContext$'}
                member:
                    regex: |-
                        (?x)^(add|addOrOmit|get|getOption|getOrElse|getOrUndefined|getUnsafe|merge)$
        - matches:
            effect-module-member:
                module: {regex: '\bCookies$'}
                member:
                    regex: |-
                        (?x)^(expireCookie|expireCookieUnsafe|get|getValue|merge|mergeIntoArray|remove|set|setAll|setAllCookie|setAllUnsafe
                        |setCookie|setUnsafe|toRequestCookieHeader)$
        - matches: {effect-module-member: {module: {regex: '\bCron$'}, member: {regex: '^(equals)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bDateTime$'}
                member:
                    regex: |-
                        (?x)^(add|addDuration|between|clamp|distance|endOf|format|formatIntl|formatLocal|formatUtc|getPart|getPartUtc|isGreaterThan
                        |isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo|mapEpochMillis|match|max|min|mutate|mutateUtc|nearest|setParts
                        |setPartsUtc|setZone|setZoneNamed|setZoneNamedUnsafe|setZoneOffset|startOf|subtract|subtractDuration|withCurrentZone
                        |withCurrentZoneNamed|withCurrentZoneOffset|withDate|withDateUtc)$
        - matches:
            effect-module-member:
                module: {regex: '\bDeferred$'}
                member:
                    regex: |-
                        (?x)^(complete|completeWith|die|dieSync|done|fail|failCause|failCauseSync|failSync|interruptWith|into|succeed|sync)$
        - matches:
            effect-module-member:
                module: {regex: '\bDurableDeferred$'}
                member:
                    regex: |-
                        (?x)^(done|fail|failCause|into|succeed|tokenFromExecutionId|tokenFromPayload)$
        - matches:
            effect-module-member:
                module: {regex: '\bDuration$'}
                member:
                    regex: |-
                        (?x)^(between|clamp|divide|divideUnsafe|equals|isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo|match
                        |matchPair|max|min|subtract|sum|times)$
        - matches:
            effect-module-member:
                module: {regex: '\bEffect$'}
                member:
                    regex: |-
                        (?x)^(andThen|annotateLogs|annotateSpans|as|bind|bindTo|cachedInvalidateWithTTL|cachedWithTTL|catch|catchCause
                        |catchCauseFilter|catchCauseIf|catchDefect|catchEager|catchFilter|catchIf|catchReason|catchReasons|catchTag|catchTags
                        |delay|ensuring|filter|filterMap|filterMapEffect|filterMapOrElse|filterMapOrFail|filterOrElse|filterOrFail|findFirst
                        |findFirstFilter|flatMap|flatMapEager|forEach|forever|forkChild|forkDetach|forkIn|forkScoped|fromOption|ignore
                        |ignoreCause|let|linkSpans|map|mapBoth|mapBothEager|mapEager|mapError|mapErrorEager|match|matchCause|matchCauseEager
                        |matchCauseEffect|matchCauseEffectEager|matchEager|matchEffect|onError|onErrorFilter|onErrorIf|onExit|onExitFilter
                        |onExitIf|onInterrupt|orElseSucceed|partition|provide|provideContext|provideServiceEffect|race|raceFirst|reduce|repeat
                        |repeatOrElse|replicate|replicateEffect|request|retry|retryOrElse|schedule|scheduleFrom|setContext|tap|tapCause
                        |tapCauseFilter|tapCauseIf|tapDefect|tapError|tapErrorTag|timeout|timeoutOption|timeoutOrElse|track|trackDefects
                        |trackDuration|trackErrors|trackSuccesses|unwrapReason|updateContext|updateService|validate|when|withErrorReporting
                        |withExecutionPlan|withLogSpan|withLogger|withTracer|withTracerEnabled|withTracerTiming|zip|zipWith)$
        - matches: {effect-module-member: {module: {regex: '\b(Equivalence|Order)$'}, member: {regex: '^(combine|mapInput)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bExit$'}, member: {regex: '^(map|mapBoth|mapError|match)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bFiber$'}, member: {regex: '^(interruptAllAs|interruptAs|runIn)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bFiberHandle$'}, member: {regex: '^(set|setUnsafe)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bFiberMap$'}, member: {regex: '^(get|getUnsafe|has|hasUnsafe|remove|set|setUnsafe)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bFiberSet$'}, member: {regex: '^(add|addUnsafe)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bFilter$'}
                member:
                    regex: |-
                        (?x)^(andLeft|andRight|compose|composePassthrough|mapFail|or|zip|zipWith)$
        - matches:
            effect-module-member:
                module: {regex: '\b(Flag|Param)$'}
                member:
                    regex: |-
                        (?x)^(atLeast|atMost|between|filter|filterMap|map|mapEffect|mapTryCatch|orElse|orElseResult|withAlias|withDefault
                        |withDescription|withFallbackConfig|withFallbackPrompt|withMetavar|withNegation|withOptionalValue|withSchema)$
        - matches: {effect-module-member: {module: {regex: '\bFunction$'}, member: {regex: '^(compose)$'}}}
        - matches: {effect-module-member: {module: {regex: '\b(Glob|Ordering)$'}, member: {regex: '^(match)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bGraph$'}
                member:
                    regex: |-
                        (?x)^(allShortestPaths|astar|bellmanFord|bfs|complement|compose|degree|dfs|dfsPostOrder|difference|dijkstra|edgesBetween
                        |externals|findEdge|findEdges|findNode|findNodes|floydWarshall|getEdge|getNode|hasEdge|hasNode|hasPath|inDegree
                        |incidentEdges|incomingEdges|inducedSubgraph|intersection|maximumFlow|minimumCut|minimumSpanningForest|mutate
                        |neighborhood|neighbors|neighborsDirected|outDegree|outgoingEdges|predecessors|simplePaths|successors|sum
                        |symmetricDifference|toGraphViz|toMermaid|topo|unweightedDistances)$
        - matches: {effect-module-member: {module: {regex: '\bGraphQLResolver$'}, member: {regex: '^(request)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bHash$'}, member: {regex: '^(combine)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bHashMap$'}
                member:
                    regex: |-
                        (?x)^(every|filter|filterMap|findFirst|flatMap|forEach|get|getHash|getUnsafe|has|hasBy|hasHash|map|modify|modifyAt
                        |modifyHash|mutate|reduce|remove|removeMany|set|setMany|some|union)$
        - matches: {effect-module-member: {module: {regex: '\bHashRing$'}, member: {regex: '^(add|addMany|has|remove)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\b(HashSet|TxHashSet)$'}
                member:
                    regex: |-
                        (?x)^(add|difference|every|filter|has|intersection|isSubset|map|reduce|remove|some|union)$
        - matches: {effect-module-member: {module: {regex: '\bHeaders$'}, member: {regex: '^(get|has|merge|redact|remove|removeMany|set|setAll)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bHttpApiSecurity$'}, member: {regex: '^(annotate|annotateMerge)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bHttpClient$'}
                member:
                    regex: |-
                        (?x)^(catch|catchTag|catchTags|filterOrElse|filterOrFail|filterStatus|followRedirects|mapRequest|mapRequestEffect
                        |mapRequestInput|mapRequestInputEffect|retry|retryTransient|tap|tapError|tapRequest|timeout|transform
                        |transformResponse|withCircuitBreaker|withCookiesRef|withRateLimiter)$
        - matches:
            effect-module-member:
                module: {regex: '\bHttpClientRequest$'}
                member:
                    regex: |-
                        (?x)^(accept|appendUrl|appendUrlParam|appendUrlParams|basicAuth|bearerToken|bodyFile|bodyFormData|bodyFormDataRecord
                        |bodyJson|bodyJsonUnsafe|bodyStream|bodyText|bodyUint8Array|bodyUrlParams|compressBody|modify|prependUrl|removeHeader
                        |setBody|setHash|setHeader|setHeaders|setMethod|setUrl|setUrlParam|setUrlParams|updateHeaders|updateUrl|upgrade)$
        - matches: {effect-module-member: {module: {regex: '\bHttpClientResponse$'}, member: {regex: '^(filterStatus|matchStatus)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bHttpEffect$'}, member: {regex: '^(withPreResponseHandler)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bHttpRouter$'}, member: {regex: '^(prefixPath|prefixRoute)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bHttpServer$'}, member: {regex: '^(serve|serveEffect)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bHttpServerResponse$'}
                member:
                    regex: |-
                        (?x)^(expireCookie|expireCookieUnsafe|mergeCookies|removeCookie|removeHeader|replaceCookies|setBody|setCookie
                        |setCookieUnsafe|setCookies|setCookiesUnsafe|setHeader|setHeaders|setStatus|updateCookies)$
        - matches: {effect-module-member: {module: {regex: '\bIpNetwork$'}, member: {regex: '^(contains|containsNetwork|overlaps)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bIterable$'}
                member:
                    regex: |-
                        (?x)^(append|appendAll|cartesian|cartesianWith|chunksOf|contains|countBy|dedupeAdjacentWith|drop|filter|filterMap
                        |filterMapWhile|findFirst|findLast|flatMap|flatMapNullishOr|forEach|groupBy|groupWith|intersperse|map|prepend
                        |prependAll|reduce|repeat|replicate|scan|some|take|takeWhile|zip|zipWith)$
        - matches: {effect-module-member: {module: {regex: '\bKeyValueStore$'}, member: {regex: '^(prefix)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bLayer$'}
                member:
                    regex: |-
                        (?x)^(buildWithMemoMap|buildWithScope|catch|catchCause|catchTag|flatMap|merge|provide|provideMerge|tap|tapCause|tapError
                        |updateService)$
        - matches: {effect-module-member: {module: {regex: '\bLogger$'}, member: {regex: '^(batched|map|toFile)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bLogLevel$'}
                member:
                    regex: |-
                        (?x)^(isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo)$
        - matches: {effect-module-member: {module: {regex: '\bMatch$'}, member: {regex: '^(valueTags)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bMetric$'}
                member:
                    regex: |-
                        (?x)^(mapInput|modify|update|withAttributes|withConstantInput)$
        - matches: {effect-module-member: {module: {regex: '\bModel$'}, member: {regex: '^(extract|fieldEvolve)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bMutableHashMap$'}, member: {regex: '^(forEach|get|has|modify|modifyAt|remove|set)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bMutableHashSet$'}, member: {regex: '^(add|has|remove)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bMutableRef$'}
                member:
                    regex: |-
                        (?x)^(compareAndSet|getAndSet|getAndUpdate|set|setAndGet|update|updateAndGet)$
        - matches: {effect-module-member: {module: {regex: '\bNdjson$'}, member: {regex: '^(duplex|duplexSchema|duplexSchemaString|duplexString)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bNetAddress$'}, member: {regex: '^(isFamily|match)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bNumber$'}
                member:
                    regex: |-
                        (?x)^(between|clamp|divide|divideUnsafe|isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo|max|min|multiply
                        |remainder|round|subtract|sum)$
        - matches:
            effect-module-member:
                module: {regex: '\bOptic$'}
                member:
                    regex: |-
                        (?x)^(get|getAll|getResult|modify|modifyAll|replace|replaceResult|set)$
        - matches:
            effect-module-member:
                module: {regex: '\bOption$'}
                member:
                    regex: |-
                        (?x)^(andThen|as|bind|bindTo|composeK|contains|exists|filter|filterMap|flatMap|flatMapNullishOr|getOrElse|getOrThrowWith|let
                        |liftPredicate|map|match|orElse|orElseResult|orElseSome|partitionMap|product|productMany|reduceCompact|tap|zipLeft
                        |zipRight|zipWith)$
        - matches: {effect-module-member: {module: {regex: '\bOtelTracer$'}, member: {regex: '^(withSpanContext)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bPartitionedSemaphore$'}, member: {regex: '^(release|take)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bPool$'}, member: {regex: '^(invalidate|reserve|use)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bPredicate$'}
                member:
                    regex: |-
                        (?x)^(and|compose|eqv|hasProperty|implies|isTagged|isTupleOf|isTupleOfAtLeast|mapInput|nand|nor|or|xor)$
        - matches:
            effect-module-member:
                module: {regex: '\bPrompt$'}
                member:
                    regex: |-
                        (?x)^(appendSystem|concat|flatMap|map|prependSystem|setSystem)$
        - matches:
            effect-module-member:
                module: {regex: '\bPubSub$'}
                member:
                    regex: |-
                        (?x)^(end|endUnsafe|publish|publishAll|publishUnsafe|takeBetween|takeUpTo)$
        - matches: {effect-module-member: {module: {regex: '\bPull$'}, member: {regex: '^(catchDone|matchEffect)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bQueue$'}, member: {regex: '^(fail|failCause|into|offer|offerAll|takeBetween|takeN)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bRandom$'}, member: {regex: '^(withSeed)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bRcMap$'}, member: {regex: '^(get|getOption|has|invalidate|touch)$'}}}
        - matches: {effect-module-member: {module: {regex: '\bReactivity$'}, member: {regex: '^(mutation|query|stream)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bRecord$'}
                member:
                    regex: |-
                        (?x)^(collect|difference|every|filter|filterMap|findFirst|fromIterableBy|fromIterableWith|get|has|intersection|isSubrecord
                        |map|mapEntries|mapKeys|modify|partition|pop|reduce|remove|replace|set|some|union)$
        - matches:
            effect-module-member:
                module: {regex: '\bRef$'}
                member:
                    regex: |-
                        (?x)^(getAndSet|getAndUpdate|getAndUpdateSome|modify|modifySome|set|setAndGet|update|updateAndGet|updateSome
                        |updateSomeAndGet)$
        - matches: {effect-module-member: {module: {regex: '\bRequest$'}, member: {regex: '^(complete|completeEffect|fail|failCause|succeed)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '\bRequestResolver$'}
                member:
                    regex: |-
                        (?x)^(around|asCache|batchN|grouped|persisted|race|setDelay|setDelayEffect|withCache|withSpan)$
        - matches:
            effect-module-member:
                module: {regex: '\bResult$'}
                member:
