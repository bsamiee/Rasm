# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-record-rebuilt-from-itself
language: python
severity: error
utils:
    struct-field:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has: {field: left, kind: identifier}
                - has: {field: type, kind: type}
    first-field:
        matches: struct-field
        has: {kind: assignment, has: {field: left, pattern: $FIRST}}
        not: {follows: {stopBy: end, matches: struct-field}}
    last-field:
        matches: struct-field
        has: {kind: assignment, has: {field: left, pattern: $LAST}}
        not: {precedes: {stopBy: end, matches: struct-field}}
    next-field:
        matches: struct-field
        has: {kind: assignment, has: {field: left, pattern: $PREVIOUS}}
        precedes: {stopBy: {not: {kind: comment}}, matches: struct-field, has: {kind: assignment, has: {field: left, pattern: $NEXT}}}
    frozen-struct:
        kind: class_definition
        all:
            - has: {field: name, pattern: $C}
            - has:
                field: superclasses
                all:
                    - has: {regex: '^(msgspec\.)?Struct$'}
                    - has: {kind: keyword_argument, regex: '^frozen\s*=\s*True$'}
    other-type:
        kind: identifier
        pattern: $X
        any:
            - regex: '^self$'
              inside: {kind: class_definition, stopBy: end, not: {has: {field: name, pattern: $C}}}
            - inside:
                kind: function_definition
                stopBy: end
                has:
                    field: parameters
                    has:
                        kind: typed_parameter
                        all:
                            - has: {kind: identifier, pattern: $X}
                            - has: {field: type, kind: type, not: {pattern: $C}}
rule:
    kind: call
    all:
        - has: {field: function, kind: identifier, pattern: $C}
        - has: {field: arguments, has: {nthChild: 1, pattern: $X.$FIRST}}
        - not: {has: {field: arguments, has: {nthChild: 1, kind: attribute, has: {field: object, matches: other-type}}}}
        - has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, pattern: $X.$LAST}}
        - has: {field: arguments, not: {has: {pattern: $_, not: {any: [{kind: comment}, {pattern: $X.$_}]}}}}
        - inside: {kind: module, stopBy: end, has: {matches: frozen-struct, has: {field: body, all: [{has: {matches: first-field}}, {has: {matches: last-field}}]}}}
        - not:
            has:
                field: arguments
                has:
                    all:
                        - pattern: $X.$PREVIOUS
                        - precedes: {stopBy: {all: [{pattern: $_}, {not: {kind: comment}}]}, pattern: $X.$NEXT}
                        - not: {inside: {kind: module, stopBy: end, has: {matches: frozen-struct, has: {field: body, has: {matches: next-field}}}}}
fix: $X
message: '`$C(...)` rebuilds `$X` from every field in order'
note: 'Use the record itself, a frozen record equals its rebuild'
