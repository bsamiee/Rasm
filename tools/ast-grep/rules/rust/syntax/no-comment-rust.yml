# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-comment-rust
language: rust
severity: error
rule:
    kind: 'line_comment, block_comment'
    pattern: $COMMENT
    not: {any: [{regex: '^// --- \[[A-Z][A-Z0-9_]*\]( -+)?$'}, {matches: rust-macro-argument}]}
transform:
    TEXT: {replace: {source: $COMMENT, replace: '\s+$', by: ''}}
message: '`$TEXT` comments code outside a section divider'
note: 'Move the comment''s fact into a name or type and delete the comment, keeping `// --- [<SECTION>]` and `// --- [<FAMILY>]` dividers'
