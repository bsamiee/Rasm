# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-attributes-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
rule:
    any:
        - kind: member_access_expression
          all:
            - has: {field: name, regex: '^CreateDefaultAttributes$'}
            - has: {field: expression, pattern: $DOC}
        - kind: conditional_access_expression
          all:
            - has: {field: condition, pattern: $DOC}
            - has: {kind: member_binding_expression, has: {field: name, regex: '^CreateDefaultAttributes$'}}
    not:
        inside:
            kind: argument
            nthChild: 1
            inside: {kind: argument_list, inside: {matches: {csharp-owner-call: {type: {regex: '^TableOps$'}, member: {regex: '^WithAttributes$'}}}}}
message: '`$DOC.CreateDefaultAttributes` builds default object attributes by hand'
note: Use `TableOps.WithAttributes(<defaults>, <attributes>, <body>)`, with `<doc>.CreateDefaultAttributes` as a document's defaults and `None` for each defaulted object, `WithAttributes` disposing what it created after `<body>`
