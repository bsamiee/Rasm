# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
rule:
    kind: delegate_declaration
    all:
        - has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}
        - not:
            any:
                - has: {kind: attribute_list}
                - has: {field: type, kind: ref_type}
                - has: {field: type, kind: pointer_type}
                - has:
                    field: parameters
                    has:
                        kind: parameter
                        any:
                            - has: {kind: modifier, regex: '^(ref|out|in|params|scoped|this)$'}
                            - has: {kind: attribute_list}
                            - has: {field: type, kind: 'pointer_type, function_pointer_type'}
                            - has: {field: value, pattern: $_}
                - has: {field: parameters, has: {kind: parameter, nthChild: 17}}
                - all:
                    - has: {field: type, regex: '^void$'}
                    - has:
                        field: parameters
                        all:
                            - has: {kind: parameter, nthChild: 1, has: {field: type, matches: {csharp-type-name: {name: {regex: '^(object|Object)$'}}}}}
                            - has: {kind: parameter, nthChild: 2, has: {field: type, matches: {csharp-type-name: {name: {regex: 'EventArgs$'}}}}}
                            - not: {has: {kind: parameter, nthChild: 3}}
                - has:
                    field: parameters
                    has:
                        kind: parameter
                        all:
                            - has: {field: type, pattern: $REPEATED}
                            - follows: {stopBy: end, kind: parameter, has: {field: type, pattern: $REPEATED}}
message: Delegate `$NAME` restates a `Func` or `Action` signature
note: 'Use the matching `Func` or `Action`, a delegate repeating a parameter type stays'
