id: no-exit-in-else-clause
snapshots:
  ? |
    for f in "${files[@]}"; do
        if [[ -f $f ]]; then
            printf '%s\n' "$f"
        else
            break
        fi
    done
  : labels:
    - source: |-
        if [[ -f $f ]]; then
                printf '%s\n' "$f"
            else
                break
            fi
      style: primary
      start: 31
