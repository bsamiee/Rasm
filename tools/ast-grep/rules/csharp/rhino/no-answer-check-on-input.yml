# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-answer-check-on-input
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    input:
        any:
            - kind: identifier
              pattern: $INPUT
              all:
                - inside:
                    stopBy: end
                    kind: method_declaration, constructor_declaration, local_function_statement, operator_declaration
                    has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $INPUT}}}
                - not:
                    inside:
                        stopBy: end
                        kind: lambda_expression, anonymous_method_expression
                        has: {field: parameters, any: [{kind: implicit_parameter, pattern: $INPUT}, {has: {kind: parameter, has: {field: name, pattern: $INPUT}}}]}
            - kind: member_access_expression
              has: {field: expression, matches: input}
    public-input:
        matches: input
        inside: {stopBy: end, kind: method_declaration, has: {kind: modifier, regex: '^public$'}}
    answer-error:
        kind: object_creation_expression
        has: {field: type, regex: '^((global::)?Rasm\.Rhino\.Document\.)?Refused$'}
rule:
    kind: invocation_expression
    any:
        - all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^ToFin$'}}
            - has: {field: arguments, has: {kind: argument, has: {matches: answer-error}}}
            - has:
                field: function
                has:
                    field: expression
                    kind: invocation_expression
                    all:
                        - has: {field: function, regex: '^((global::)?Rasm\.Rhino\.Document\.)?Answers\s*\.\s*Present$'}
                        - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: input, pattern: $VALUE}}}
        - all:
            - has: {field: function, regex: '^((global::)?Rasm\.Rhino\.Document\.)?Answers\s*\.\s*(NonEmpty|Required)(\s*<.+>)?$'}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: input, pattern: $VALUE}}}
        - all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Unless$'}}, {has: {field: expression, regex: '^((global::)?Rasm\.Rhino\.Document\.)?(Refused|Missing|CountMismatch)$'}}]}
            - has:
                field: arguments
                has:
                    kind: argument
                    nthChild: 1
                    has:
                        any:
                            - kind: identifier
                              matches: public-input
                              pattern: $VALUE
                            - kind: binary_expression, is_pattern_expression, prefix_unary_expression, parenthesized_expression
                              all:
                                - has: {stopBy: end, kind: identifier, matches: public-input, pattern: $VALUE}
                                - not: {has: {stopBy: end, kind: 'invocation_expression, object_creation_expression, member_access_expression, element_access_expression, conditional_access_expression'}}
message: '`$VALUE` is caller input checked as a host answer'
note: Use `Limits.AtLeast(0).Check(<value>, <subject>)` for a bound and `Invalid.Unless` over an emptiness test for an id or a sequence, `Refused`, `Missing`, and `CountMismatch` name a value the host returned
