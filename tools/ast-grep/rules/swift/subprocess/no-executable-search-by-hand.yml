# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-executable-search-by-hand
language: swiftlang
severity: error
utils:
    executable-test:
        pattern: $TEST
        any:
            - kind: simple_identifier
              regex: '^(isExecutableFile|isExecutableKey)$'
            - kind: call_expression
              all:
                - has: {nthChild: 1, regex: '^((Darwin|Glibc|Musl)\.)?(access|faccessat)$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, regex: '^X_OK$'}}}}
rule:
    any:
        - kind: call_expression
          all:
            - has:
                nthChild: 1
                kind: navigation_expression
                has: {field: suffix, has: {field: suffix, regex: '^(first|last|filter|contains|firstIndex|lastIndex|compactMap|forEach|allSatisfy|reduce|drop|prefix)$'}}
            - has: {kind: call_suffix, has: {stopBy: end, matches: executable-test}}
        - kind: for_statement
          has: {stopBy: end, matches: executable-test}
message: '`$TEST` tests candidate directories to find an executable by hand'
note: 'Run `Executable.name(<name>)` to search the child environment''s `PATH`, or call `resolveExecutablePath(in:)` for the path alone'
