# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
ignores: ['libs/rust/services/telemetry/**']
utils:
    subscriber-install:
        any:
            - kind: scoped_identifier
              regex: '^(::)?((tracing::)?(subscriber|dispatcher)|tracing)::(set_global_default|set_default|with_default)$|^(::)?(tracing_log::)?LogTracer::init$'
            - kind: field_expression
              all:
                - has: {field: field, regex: '^init$'}
                - any:
                    - has: {field: value, matches: tracer-builder}
                    - all:
                        - has: {field: value, kind: identifier, pattern: $BUILDER}
                        - inside: {kind: block, stopBy: end, has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $BUILDER}}, {has: {field: value, matches: tracer-builder}}]}}
    tracer-builder:
        any:
            - regex: '(?s)(?-u:\b)(LogTracer::builder|log_tracer::Builder::(new|default))\(\)'
            - all:
                - regex: '(?s)^\p{XID_Continue}*Builder::(new|default)\(\)'
                - inside: {kind: source_file, stopBy: end, has: {kind: use_declaration, regex: '(?s)(?-u:\b)log_tracer::.*(?-u:\b)Builder(?-u:\b)'}}
    global-install:
        kind: scoped_identifier
        regex: '(^|::)global::set_(tracer_provider|meter_provider|text_map_propagator)$'
    panic-hook:
        any:
            - kind: scoped_identifier
              regex: '(^|::)panic::(set_hook|take_hook)$'
            - all:
                - any:
                    - {kind: scoped_identifier, regex: '(^|::)panic::update_hook$'}
                    - matches: {rust-imported-name: {source: {regex: '(?-u:\b)panic(?-u:\b)'}, name: {regex: '^update_hook$'}}}
                - not:
                    inside:
                        kind: call_expression
                        has:
                            field: arguments
                            has:
                                kind: closure_expression
                                all:
                                    - has: {field: parameters, has: {kind: identifier, nthChild: 1, pattern: $PREVIOUS}}
                                    - has: {field: body, stopBy: end, kind: call_expression, has: {field: function, pattern: $PREVIOUS}}
rule:
    kind: 'identifier, scoped_identifier, field_expression'
    pattern: $SITE
    all:
        - not:
            any:
                - inside: {kind: scoped_identifier}
                - inside: {kind: use_declaration, stopBy: end}
        - any:
            - matches: subscriber-install
            - matches: global-install
            - matches: panic-hook
            - matches: {rust-imported-name: {source: {regex: '(?-u:\b)(tracing|global|panic)(?-u:\b)'}, name: {regex: '^(set_global_default|set_default|with_default|set_(tracer_provider|meter_provider|text_map_propagator)|set_hook|take_hook)$'}}}
        - not: {matches: rust-test-scope}
message: '`$SITE` installs a subscriber, `LogTracer`, provider, or propagator outside `rasm-telemetry`, or a panic hook dropping the one before it'
note: 'Start through `rasm_command::run`; keep panic hooks for process lifetime and call their predecessor through `panic::update_hook`'
