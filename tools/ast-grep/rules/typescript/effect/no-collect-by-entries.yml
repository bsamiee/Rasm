# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-collect-by-entries
language: tsx
severity: error
utils:
    entries:
        kind: call_expression
        has: {field: function, pattern: $ENTRIES, matches: typescript-record-entries}
    record-map:
        kind: call_expression
        has: {field: function, pattern: $ENTRIES, matches: {effect-module-member: {module: {regex: '\bRecord$'}, member: {regex: '^map$'}}}}
    record-values:
        any:
            - {regex: '^((globalThis|window|self)\.)?Object\.values$', matches: typescript-global-reference}
            - matches: {effect-module-member: {module: {regex: '\bRecord$'}, member: {regex: '^values$'}}}
    indexed-callback:
        kind: arrow_function, function_expression
        has: {field: parameters, has: {kind: 'required_parameter, optional_parameter', nthChild: 2}}
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^map$'}}, {has: {field: object, matches: entries}}]}
            - has: {field: arguments, has: {nthChild: 1, not: {matches: indexed-callback}}}
        - all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\b(Array|Iterable)$'}, member: {regex: '^(map|filterMap)$'}}}}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: entries}}, {has: {nthChild: 2, not: {matches: indexed-callback}}}]}
        - all:
            - has: {field: function, regex: '^((globalThis|window|self)\.)?Array\.from$', matches: typescript-global-reference}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: entries}}, {has: {nthChild: 2, not: {matches: indexed-callback}}}]}
        - all:
            - has: {field: function, matches: record-values}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: record-map}}, {not: {has: {nthChild: 2}}}]}
message: '`$ENTRIES` builds an intermediate collection to map record entries to an array'
note: 'Call `Record.collect(<record>, (<key>, <value>) => <element>)` over a `Record.filter` for a filtered map, `Record.keys` or `Record.values` for keys or values alone, `Record.mapEntries` to build a record'
