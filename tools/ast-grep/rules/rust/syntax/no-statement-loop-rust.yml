# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    pushing-fold:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(fold|try_fold)$'}}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, any: [{matches: rust-default-value, not: {kind: 'scoped_identifier, closure_expression'}}, {kind: call_expression, regex: '^(\p{XID_Continue}+::)*[A-Z]\p{XID_Continue}*(::<.*>)?::with_capacity\('}]}}
            - has:
                field: arguments
                has:
                    nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                    kind: closure_expression
                    all:
                        - has: {field: parameters, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, regex: '^mut\p{Pattern_White_Space}+\p{XID_Continue}+(\p{Pattern_White_Space}*:[\p{Pattern_White_Space}\P{Pattern_White_Space}]*)?$', has: {kind: identifier, pattern: $STATE}}}
                        - has: {field: body, kind: block, all: [{has: {kind: expression_statement, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, any: [{matches: element-write}, {matches: guarded-write}, {matches: last-element-match}]}}}, {has: {nthChild: {position: 1, reverse: true, ofRule: {matches: rust-statement}}, any: [{pattern: $STATE}, {pattern: Ok($STATE)}, {pattern: 'Ok::<$_, $_>($STATE)'}, {pattern: Some($STATE)}]}}, {not: {has: {matches: state-reading-step}}}]}
    state-reading-step:
        any:
            - kind: let_declaration
              has: {stopBy: end, kind: identifier, pattern: $STATE}
            - kind: expression_statement
              has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: element-write, has: {field: arguments, has: {stopBy: end, kind: identifier, pattern: $STATE}}}
            - kind: expression_statement
              has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: guarded-write, has: {field: condition, has: {stopBy: end, kind: identifier, pattern: $STATE}}}
    guarded-write:
        kind: if_expression
        has: {field: consequence, has: {kind: expression_statement, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: element-write}}}
    last-element-match:
        kind: match_expression
        has: {field: value, pattern: $STATE.last_mut()}
    element-write:
        kind: call_expression
        any:
            - has:
                field: function
                kind: field_expression
                all:
                    - has: {field: value, kind: identifier, pattern: $STATE}
                    - has: {field: field, regex: '^(push|push_back|push_front|push_str|insert|extend|extend_from_slice|append)$'}
            - all:
                - regex: '\.entry\([\p{Pattern_White_Space}\P{Pattern_White_Space}]*\)\p{Pattern_White_Space}*\.\p{Pattern_White_Space}*or_(insert|insert_with|insert_with_key|default)\('
                - any:
                    - pattern: '$STATE.entry($$$_KEY).$_SLOT($$$_VALUE)'
                    - pattern: '$STATE.entry($$$_KEY).$_SLOT($$$_VALUE).$_WRITE($$$_ITEM)'
rule:
    all:
        - {any: [{matches: rust-statement-loop}, {matches: pushing-fold}]}
        - {pattern: $LOOP}
transform:
    HEAD: {replace: {source: $LOOP, replace: '(?s)\p{Pattern_White_Space}*\{?\p{Pattern_White_Space}*\n.*$', by: ''}}
message: '`$HEAD` computes its result statement by statement'
note: 'Use iterator adapters and collect independent failures into `validated::Validated`; reserve `fold` for steps that read accumulated state'
