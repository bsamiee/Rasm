# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-interpolated-sql-value-bash
language: bash
severity: error
utils:
    sql-cli:
        kind: command
        has: {field: name, pattern: $CLI, regex: '^(?:\S+/)?(sqlite3|duckdb|psql)$'}
rule:
    has: {kind: 'simple_expansion, expansion, command_substitution'}
    any:
        - kind: string
          all:
            - regex: '^"(?:[^'']*''[^'']*'')*[^'']*''[^'']*\$(\{|\(|[A-Za-z_])'
            - not: {regex: '^"\s*(\.param\s|(?i:set\s+variable\s))'}
            - inside:
                stopBy: {kind: command}
                any:
                    - matches: sql-cli
                    - kind: command
                      inside: {kind: pipeline, has: {matches: sql-cli, nthChild: {position: 1, reverse: true}}}
        - kind: heredoc_body
          all:
            - regex: '^(?:[^'']*''[^'']*'')*[^'']*''[^'']*\$(\{|\(|[A-Za-z_])'
            - not: {regex: '^\s*(\.param\s|(?i:set\s+variable\s))'}
            - inside: {kind: heredoc_redirect, inside: {kind: redirected_statement, has: {field: body, matches: sql-cli}}}
message: '`$CLI` receives a shell expansion spliced into a quoted SQL literal'
note: 'Keep SQL text constant and bind values through sqlite3 `.param set`, duckdb `SET VARIABLE`, or `psql -v` with stdin SQL reading `:''<name>''`'
