id: no-map-over-from-boolean
valid:
    # The lift with its type
    - 'const lines = toArray(liftPredicate<string>(() => openCount > 0)(`${openCount} open findings`));'
    # Map over an Option other than the boolean one
    - 'const names = map((row: Row) => row.name)(fromNullable(row));'
    # The definition of liftPredicate in option.ts
    - |
      const liftPredicate =
          <A>(predicate: (value: A) => boolean): ((value: A) => Option<A>) =>
          (value: A): Option<A> =>
              map(() => value)(fromBoolean(predicate(value)));
    # The boolean Option alone
    - 'const held = fromBoolean(openCount > 0);'
    # Thunk over a call, the sibling no-map-over-from-boolean-by-hand reports it
    - 'const rest = toArray(map(() => leaf.slice(index))(fromBoolean(guarded.includes(basename(word.text)))));'
    # Thunk over a member read, the sibling reports it
    - 'const reason = toArray(map(() => _REQUIREMENT[family.requires].reason)(fromBoolean(!holds)));'
    # Named thunk passed point-free, the sibling reports it
    - 'const lines = toArray(map(line)(fromBoolean(openCount > 0)));'
    # Map with a parameter reads the boolean
    - 'const lines = toArray(map((held) => String(held))(fromBoolean(openCount > 0)));'
    # Thunk over an as const cast, const is no type argument and the sibling reports it
    - 'const modes = toArray(map(() => true as const)(fromBoolean(refresh)));'
    # Thunk over a boolean literal, the sibling reports it
    - 'const held = toArray(map(() => true)(fromBoolean(refresh)));'
    # Thunk over a double cast, the inner cast leaves the value as unknown and the sibling reports it
    - 'const rest = toArray(map(() => leaf as unknown as Leaf)(fromBoolean(held)));'
    # Map with a parameter under a template body, the template reads the boolean
    - 'const lines = toArray(map((held) => `${held} ready`)(fromBoolean(openCount > 0)));'
invalid:
    # The instance, a template string present when the count holds
    - 'const lines = toArray(map(() => `${openCount} open findings`)(fromBoolean(openCount > 0)));'
    # String literal present when the row count rose
    - "const lines = toArray(map(() => 'Record the dependency in the owning README.md dependency list')(fromBoolean(_count(text, row) > _count(old, row))));"
    # Template string under a fallback
    - "const due = getOrElse(() => '')(map(() => `, due: ${due.join(' ')}`)(fromBoolean(due.length > 0)));"
    # Template string under a compound condition
    - 'const status = map(() => `${openCount} open findings`)(fromBoolean(interactive && (openCount > 0 || due.length > 0)));'
    # Number literal
    - 'const limit = toArray(map(() => 1)(fromBoolean(strict)));'
    # Cast names the type
    - 'const rest = toArray(map(() => leaf.slice(index) as Leaf)(fromBoolean(guarded.includes(basename(word.text)))));'
    # Signed number literal
    - 'const step = toArray(map(() => -1)(fromBoolean(descending)));'
    # Template string cast to a type, the cast names the type over the template
    - 'const line = toArray(map(() => `${count} open` as string)(fromBoolean(held)));'
    # Two-call form in an expression statement
    - "run(map(() => 'line')(fromBoolean(held)));"
    # Thunk with a return type over a call, the return type names the type
    - 'const rest = toArray(map((): Leaf => leaf.slice(index))(fromBoolean(held)));'
    # Thunk with a return type over a string, the return type wins
    - "const line = toArray(map((): Line => 'ready')(fromBoolean(held)));"
    # Number literal with an exponent
    - 'const limit = toArray(map(() => 1e3)(fromBoolean(strict)));'
