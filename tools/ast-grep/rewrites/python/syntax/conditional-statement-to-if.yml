# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: conditional-statement-to-if
language: python
severity: off
rule:
    all: [{matches: python-block-statement}]
    pattern: $STMT
    matches: {python-discarded-expression: {value: {kind: conditional_expression}}}
constraints:
    STMT: {not: {regex: '\n'}} # Statement on one line, the parenthesized multi-line form re-indents its arm past the if
rewriters:
    - id: if-statement # The rewriter's template re-indents its body by the conditional's own column, the statement's column
      rule: {kind: conditional_expression, pattern: $EFFECT if $TEST else None}
      fix: |-
        if $TEST:
            $EFFECT
    - id: if-else-statement
      rule: {kind: conditional_expression, pattern: $EFFECT if $TEST else $OTHER}
      fix: |-
        if $TEST:
            $EFFECT
        else:
            $OTHER
transform:
    OUT: rewrite($STMT, rewriters=[if-statement, if-else-statement], joinBy='') # joinBy drops the parentheses around the expression
fix: $OUT
message: Conditional expression as a statement discards its selected value
note: Write the if statement with one effect per branch, omitting the else branch when its value is None
