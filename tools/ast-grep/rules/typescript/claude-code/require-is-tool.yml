# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-is-tool
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
ignores:
    - '**/*.spec.ts'
utils:
    tool-field:
        any:
            - kind: member_expression
              all:
                - {has: {field: object, pattern: $E}}
                - {has: {field: property, regex: ^tool$}}
            - kind: subscript_expression
              all:
                - {has: {field: object, pattern: $E}}
                - {has: {field: index, kind: string, regex: '^[''"]tool[''"]$'}}
    tool-test:
        kind: binary_expression
        all:
            - {has: {field: operator, regex: ^===$}}
            - any:
                - all:
                    - {has: {field: left, matches: tool-field}}
                    - {has: {field: right, kind: string, pattern: $NAME}}
                - all:
                    - {has: {field: right, matches: tool-field}}
                    - {has: {field: left, kind: string, pattern: $NAME}}
rule:
    kind: arrow_function, function_expression, function_declaration
    all:
        - has:
            field: parameters
            not: {has: {nthChild: 2}}
            has:
                kind: required_parameter
                all:
                    - {has: {field: pattern, kind: identifier, pattern: $E}}
                    - {has: {field: type, has: {kind: type_identifier, regex: ^ToolCallInput$}}}
                not: {has: {field: value, pattern: $_}}
        - {has: {field: return_type, kind: type_predicate_annotation}}
        - has:
            field: body
            any:
                - {matches: tool-test}
                - {kind: parenthesized_expression, has: {matches: tool-test}}
                - kind: statement_block
                  all:
                    - {has: {kind: return_statement, has: {matches: tool-test}}}
                    - {not: {has: {nthChild: 2}}}
        - any:
            - kind: function_declaration
              all:
                - has: {field: name, pattern: $FN}
                - not: {follows: {stopBy: end, has: {stopBy: end, kind: identifier, pattern: $FN}}}
            - {not: {kind: function_declaration}}
        - {not: {has: {stopBy: end, kind: comment}}}
    pattern: $MATCH
transform:
    HEAD: {replace: {source: $FN, replace: '^(.*)$', by: 'const $1 = '}}
    TAIL: {replace: {source: $FN, replace: '^(.*)$', by: ';'}}
    CALL: {replace: {source: $NAME, replace: '^(.*)$', by: 'isTool($1)'}}
fix: $HEAD$CALL$TAIL
message: The refinement on the tool field is written by hand
note: Narrow the event through `isTool('<tool>')` from policies/tools.ts
labels: {MATCH: {style: primary}}
