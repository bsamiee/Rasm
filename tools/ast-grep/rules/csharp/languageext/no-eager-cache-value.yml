# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-eager-cache-value
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    computation:
        kind: 'invocation_expression, object_creation_expression, implicit_object_creation_expression, array_creation_expression, collection_expression, with_expression, await_expression, query_expression, interpolated_string_expression'
    relayed:
        kind: identifier
        pattern: $LOCAL
        all:
            - matches: {csharp-block-local: {declarator: {has: {nthChild: 2, matches: computation}}}}
            - inside:
                stopBy: end
                kind: block
                has: {kind: local_declaration_statement, has: {kind: variable_declaration, has: {kind: variable_declarator, has: {field: name, pattern: $LOCAL}}}}
                not: {has: {stopBy: end, kind: identifier, pattern: $LOCAL, not: {any: [{inside: {kind: variable_declarator, field: name}}, {inside: {kind: argument, inside: {kind: argument_list, inside: {kind: invocation_expression, pattern: $CALL}}}}]}}}
    computed:
        kind: argument
        has: {pattern: $VALUE, any: [{matches: computation}, {matches: relayed}]}
rule:
    kind: invocation_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: member_access_expression, all: [{has: {field: name, pattern: $METHOD}}, {has: {field: expression, pattern: $MAP}}]}
        - any:
            - all:
                - has: {field: function, has: {field: name, regex: '^FindOr(Maybe)?Add$'}}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 2}}, {not: {has: {kind: argument, nthChild: 3}}}]}
                - has: {field: arguments, has: {matches: computed, any: [{has: {field: name, regex: '^value$'}}, {nthChild: 2, not: {has: {field: name, kind: identifier}}}]}}
            - all:
                - has: {field: function, has: {field: name, regex: '^AddOrUpdate$'}}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 3}}, {not: {has: {kind: argument, nthChild: 4}}}]}
                - has: {field: arguments, has: {matches: computed, any: [{has: {field: name, regex: '^None$'}}, {nthChild: 3, not: {has: {field: name, kind: identifier}}}]}}
transform:
    HEAD: {replace: {source: $VALUE, replace: '(?s)^((?:new\s+|await\s+)?[@\w.]+).*$', by: '$1'}}
message: '`$MAP.$METHOD` evaluates `$HEAD` on every call, a hit discards the value'
note: 'Pass `() => <value>` to the method''s `Func` overload'
