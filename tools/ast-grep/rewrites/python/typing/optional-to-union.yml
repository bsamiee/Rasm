# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: optional-to-union
language: python
severity: off
utils:
    # The union predicate establishes the package, the import spelling distinguishes Optional from Union
    optional-name:
        any:
            - matches: {python-imported-name: {module: {kind: ":is(identifier, dotted_name)"}, name: {regex: "^Optional$"}}}
            - matches: {python-module-member: {module: {kind: ":is(identifier, dotted_name)"}, name: {regex: "^Optional$"}}}
    typing-member:
        any:
            - matches: {python-imported-name: {module: {regex: "^(typing|typing_extensions)$"}, name: {regex: "^(Optional|Union)$"}}}
            - matches: {python-module-member: {module: {regex: "^(typing|typing_extensions)$"}, name: {regex: "^(Optional|Union)$"}}}
    member:
        any:
            - pattern: $MEMBER
              inside: {kind: subscript, matches: union-head}
              not: {inside: {kind: subscript, field: value}}
            - kind: type
              pattern: $MEMBER
              inside: {kind: type_parameter, inside: {matches: union-head}}
    union-head:
        any:
            - kind: subscript
              has: {field: value, matches: typing-member}
            - kind: generic_type
              has: {kind: identifier, matches: typing-member}
    optional-head:
        any:
            - kind: subscript
              has: {field: value, matches: optional-name}
            - kind: generic_type
              has: {kind: identifier, matches: optional-name}
    type-member:
        pattern: $_
        any:
            - inside: {kind: subscript}
              not: {inside: {kind: subscript, field: value}}
            - kind: type
              inside: {kind: type_parameter}
        not: {any: [{kind: none}, {kind: type, has: {kind: none}}]}
    union:
        matches: union-head
        # The operator needs an actual type: None | None raises at runtime.
        any:
            - has: {matches: type-member}
            - has: {kind: type_parameter, has: {matches: type-member}}
        # Reconstructing members must preserve comments; forward references stay strings.
        not:
            any:
                - has: {kind: comment, stopBy: end}
                - has: {kind: string}
                - has: {kind: type_parameter, has: {kind: type, has: {kind: string}}}
rule:
    pattern: $ROOT
    matches: union
    not: {inside: {matches: union-head, stopBy: end}}
rewriters:
    - id: optional
      rule:
        all:
            - matches: union
            - matches: optional-head
            - any:
                - has: {matches: member}
                - has: {kind: type_parameter, has: {matches: member}}
      transform:
        INNER: rewrite($MEMBER, rewriters=[optional, union])
      fix: ($INNER | None)
    - id: union
      rule:
        matches: union
        any:
            - pattern: $HEAD[$$$TYPES]
            - pattern:
                context: "value: $HEAD[$$$TYPES]"
                selector: generic_type
      transform:
        MEMBERS: rewrite($$$TYPES, rewriters=[member], joinBy=' | ')
      fix: ($MEMBERS)
    - id: member
      rule: {pattern: $TYPE}
      transform:
        INNER: rewrite($TYPE, rewriters=[optional, union])
      fix: $INNER

transform:
    OUT: rewrite($ROOT, rewriters=[optional, union])
fix: $OUT
labels: {ROOT: {style: primary}}
message: "`$ROOT` spells a union the `|` operator writes"
note: >-
    Review operand types before applying this rewrite: a metaclass can override `|`, and runtime annotation consumers must accept the resulting union. Keep typing wrappers when that contract differs. Use `<a> | <b>` and `<type> | None` when the operator has the intended type-union semantics.
