# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-rust
language: rust
severity: error
utils:
    state-write:
        any:
            - kind: call_expression
              has:
                field: function
                kind: field_expression
                all:
                    - has: {field: value, kind: identifier, pattern: $STATE}
                    - has: {field: field, matches: rust-growing-method}
            - kind: 'compound_assignment_expr, assignment_expression'
              has: {field: left, kind: identifier, pattern: $STATE}
    valued-return:
        kind: return_expression
        has: {pattern: $FOUND, not: {kind: call_expression, all: [{has: {field: function, regex: '^Some$'}}, {has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $ELEMENT}, not: {has: {nthChild: 2}}}}]}}
    valued-break:
        kind: break_expression
        has: {pattern: $FOUND, not: {kind: label}}
    pushing-fold:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(fold|try_fold)$'}}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: rust-default-value, not: {kind: 'scoped_identifier, closure_expression'}}, {kind: call_expression, regex: '^(\w+::)*[A-Z]\w*(::<.*>)?::with_capacity\('}]}}
            - has:
                field: arguments
                has:
                    nthChild: 2
                    kind: closure_expression
                    all:
                        - has: {field: parameters, has: {nthChild: 1, regex: '^mut\s+\w+(\s*:[\s\S]*)?$', has: {kind: identifier, pattern: $STATE}}}
                        - has: {field: body, kind: block, all: [{has: {kind: expression_statement, has: {nthChild: 1, any: [{matches: element-write}, {matches: guarded-write}, {matches: last-element-match}]}}}, {has: {nthChild: {position: 1, reverse: true, ofRule: {matches: rust-statement}}, any: [{pattern: $STATE}, {pattern: Ok($STATE)}, {pattern: 'Ok::<$_, $_>($STATE)'}, {pattern: Some($STATE)}]}}, {not: {has: {matches: state-reading-step}}}]}
    state-reading-step:
        any:
            - kind: let_declaration
              has: {stopBy: end, kind: identifier, pattern: $STATE}
            - kind: expression_statement
              has: {nthChild: 1, matches: element-write, has: {field: arguments, has: {stopBy: end, kind: identifier, pattern: $STATE}}}
    guarded-write:
        kind: if_expression
        has: {field: consequence, has: {kind: expression_statement, has: {nthChild: 1, matches: element-write}}}
    last-element-match:
        kind: match_expression
        has: {field: value, pattern: $STATE.last_mut()}
    element-write:
        kind: call_expression
        has:
            field: function
            kind: field_expression
            all:
                - has: {field: value, kind: identifier, pattern: $STATE}
                - has: {field: field, regex: '^(push|push_back|push_front|push_str|insert|extend|extend_from_slice|append)$'}
rule:
    pattern: $LOOP
    any:
        - matches: rust-statement-loop
          any:
            - kind: for_expression
              has: {field: pattern, any: [{kind: identifier, pattern: $ELEMENT}, {kind: reference_pattern, has: {kind: identifier, pattern: $ELEMENT}}, {pattern: $ELEMENT}]}
            - not: {kind: for_expression}
          has:
            field: body
            has:
                stopBy: {kind: 'loop_expression, while_expression, for_expression, closure_expression'}
                any:
                    - matches: state-write
                    - matches: valued-return
                    - matches: valued-break
        - matches: pushing-fold
transform:
    HEAD: {replace: {source: $LOOP, replace: '(?s)\s*\{?\s*\n.*$', by: ''}}
labels:
    STATE: {style: secondary, message: 'Written each pass'}
    FOUND: {style: secondary, message: 'Returned from inside the loop'}
message: '`$HEAD` computes its result statement by statement'
note: 'Build the value through one iterator chain, with a named adapter or reduction (`collect`, `Itertools::unique_by`, `Itertools::coalesce`) in place of a `fold`, a `fold` holding a reduction whose each step reads the state it builds, and collect a fallible traversal over independent elements into `validated::Validated`'
