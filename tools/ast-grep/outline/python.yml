id: python-type-alias
language: python
role: item
symbolType: struct
rule:
    kind: type_alias_statement
    pattern: $DECLARATION
    not:
        inside:
            kind: function_definition, class_definition
            stopBy: end
    has:
        field: left
        any:
            - has: {kind: identifier, pattern: $NAME}
            - has:
                kind: generic_type
                has: {kind: identifier, pattern: $NAME}
name: $NAME
signature: $DECLARATION
---
id: python-nested-function
language: python
role: member
symbolType: function
parentRuleIds: [python-function, python-async-function]
rule:
    kind: function_definition
    has: {field: name, pattern: $NAME}
name: $NAME
