# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-throwing-element-access
language: csharp
severity: error
utils:
    sequence-type:
        any:
            - kind: array_type
            - kind: 'generic_name, qualified_name'
              regex: |-
                (?x)^(global::)?((System(\.Collections\.(Generic|Immutable))?|LanguageExt)\.)?
                (Seq|Arr|Lst|Iterable|Set|HashSet|IEnumerable|IReadOnlyList|IReadOnlyCollection|IList|ICollection|List|ImmutableArray
                |ImmutableList|Span|ReadOnlySpan|Memory|ReadOnlyMemory)\s*<
    sequence-operator:
        kind: invocation_expression
        has:
            field: function
            kind: member_access_expression
            any:
                - has:
                    field: name
                    regex: |-
                        (?x)^(Where|Select|SelectMany|OrderBy|OrderByDescending|ThenBy|ThenByDescending|Order|OrderDescending|Skip|SkipLast
                        |SkipWhile|Take|TakeLast|TakeWhile|Distinct|DistinctBy|Reverse|Concat|Union|UnionBy|Intersect|IntersectBy|Except
                        |ExceptBy|Zip|GroupBy|Cast|OfType|AsEnumerable|ToList|ToArray|Chunk|Append|Prepend|Filter|Choose|Somes|Rev|ToSeq
                        |AsIterable|Flatten|Strict|DefaultIfEmpty|AsSpan|AsMemory|Slice|(Dangerous)?GetRowSpan)$
                - all:
                    - has: {field: name, regex: '^(Map|Bind)$'}
                    - has: {field: expression, matches: sequence-receiver}
    sequence-constructor:
        kind: invocation_expression
        has:
            field: function
            regex: '^((global::)?(LanguageExt\.)?Prelude\.)?(toSeq|Seq|List|Array|Range)(<[^()]*>)?$|^((global::)?System\.)?(Linq\.)?Enumerable\.(Range|Repeat|Empty)(<[^()]*>)?$'
    sequence-declarator:
        kind: variable_declarator
        any:
            - inside: {kind: variable_declaration, has: {field: type, matches: sequence-type}}
            - all:
                - inside: {kind: variable_declaration, has: {field: type, kind: implicit_type}}
                - has: {any: [{matches: sequence-operator}, {matches: sequence-constructor}, {matches: range-slice}, {kind: 'collection_expression, array_creation_expression, implicit_array_creation_expression, stackalloc_expression'}]}
    sequence-declaration:
        any:
            - kind: 'parameter, property_declaration'
              all:
                - has: {field: name, pattern: $RECEIVER}
                - has: {field: type, matches: sequence-type}
            - kind: variable_declaration
              has: {kind: variable_declarator, all: [{has: {field: name, pattern: $RECEIVER}}, {matches: sequence-declarator}]}
    sequence-local:
        kind: identifier
        pattern: $RECEIVER
        any:
            - inside:
                kind: 'method_declaration, constructor_declaration, local_function_statement, lambda_expression, accessor_declaration, operator_declaration'
                stopBy: end
                has: {field: parameters, has: {kind: parameter, matches: sequence-declaration}}
            - matches: {csharp-block-local: {declarator: {matches: sequence-declarator}}}
            - inside: {stopBy: end, kind: query_expression, has: {stopBy: end, kind: from_clause, has: {field: name, pattern: $RECEIVER}}}
            - inside: {stopBy: end, matches: designated-arm, inside: {kind: switch_expression, has: {nthChild: 1, matches: sequence-receiver}}}
    designated-arm:
        kind: switch_expression_arm
        has: {nthChild: 1, kind: declaration_pattern, has: {field: name, pattern: $RECEIVER}}
    sequence-member:
        inside:
            kind: 'class_declaration, record_declaration, struct_declaration'
            stopBy: end
            any:
                - has: {kind: parameter_list, has: {matches: sequence-declaration}}
                - has: {kind: declaration_list, has: {kind: 'field_declaration, property_declaration', any: [{matches: sequence-declaration}, {has: {matches: sequence-declaration}}]}}
    sequence-field:
        any:
            - kind: identifier
              pattern: $RECEIVER
              matches: sequence-member
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^this$'}
                - has: {field: name, pattern: $RECEIVER}
                - matches: sequence-member
    sequence-receiver:
        any:
            - matches: sequence-operator
            - matches: sequence-constructor
            - kind: 'collection_expression, array_creation_expression, implicit_array_creation_expression, stackalloc_expression'
            - kind: parenthesized_expression
              has: {kind: query_expression}
            - matches: sequence-local
            - matches: sequence-field
            - matches: range-slice
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^(Tail|Init|Span)$'}
                - has: {field: expression, matches: sequence-receiver}
    range-slice:
        kind: element_access_expression
        all:
            - has: {field: subscript, has: {kind: argument, has: {kind: range_expression}}}
            - has: {field: expression, matches: sequence-receiver}
    constant-name:
        kind: identifier
        pattern: $LENGTH
        inside:
            kind: compilation_unit
            stopBy: end
            has: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: $LENGTH}, inside: {kind: variable_declaration, inside: {has: {kind: modifier, regex: '^const$'}}}}
    constant:
        any:
            - kind: integer_literal
            - matches: constant-name
            - kind: member_access_expression
              has: {field: name, any: [{matches: constant-name}, {regex: '^(MinValue|MaxValue)$'}]}
            - kind: parenthesized_expression
              has: {matches: constant}
            - kind: binary_expression
              all: [{has: {field: left, matches: constant}}, {has: {field: right, matches: constant}}]
    fixed-source:
        any:
            - kind: 'stackalloc_expression, array_creation_expression'
              any:
                - has: {kind: initializer_expression}
                - has: {field: type, has: {field: rank, has: {matches: constant}}}
            - kind: implicit_array_creation_expression
            - kind: collection_expression
              not: {has: {kind: spread_element}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Slice|AsSpan|AsMemory)$'}}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 2, has: {matches: constant}}}, {not: {has: {kind: argument, nthChild: 3}}}]}
            - kind: element_access_expression
              has:
                field: subscript
                has:
                    kind: argument
                    has:
                        kind: range_expression
                        any:
                            - all: [{has: {nthChild: 1, matches: constant}}, {regex: '^\.\.'}]
                            - all: [{has: {nthChild: 1, kind: prefix_unary_expression, regex: '^\^', has: {matches: constant}}}, {regex: '\.\.$'}]
    declared-member:
        kind: identifier
        pattern: $MEMBER
        inside:
            kind: compilation_unit
            stopBy: end
            has: {stopBy: end, kind: 'property_declaration, method_declaration', has: {field: name, pattern: $MEMBER}}
    held-source:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, matches: declared-member}
                - not: {has: {field: expression, regex: '^this$'}}
            - kind: invocation_expression
              has: {field: function, any: [{matches: declared-member}, {kind: member_access_expression, has: {field: name, matches: declared-member}}]}
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(AsSpan|AsMemory|Slice)$'}}, {has: {field: expression, matches: held-source}}]}
            - kind: member_access_expression
              all: [{has: {field: name, regex: '^Span$'}}, {has: {field: expression, matches: held-source}}]
            - kind: element_access_expression
              all: [{has: {field: subscript, has: {kind: argument, has: {kind: range_expression}}}}, {has: {field: expression, matches: held-source}}]
            - kind: 'invocation_expression, array_creation_expression, stackalloc_expression'
              has:
                stopBy: end
                kind: member_access_expression
                all: [{has: {field: name, regex: '^(Length|Count)$'}}, {has: {field: expression, matches: sequence-field}}]
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^(Span|Memory)$'}
                - has: {field: expression, kind: identifier, matches: {csharp-block-local: {declarator: {has: {matches: held-source}}}}}
    fixed-count:
        any:
            - matches: fixed-source
            - matches: held-source
            - matches: sequence-field
            - kind: identifier
              pattern: $RECEIVER
              inside:
                stopBy: end
                kind: 'method_declaration, local_function_statement'
                all:
                    - has: {field: name, pattern: $PASSED}
                    - not: {has: {kind: modifier, regex: '^(public|internal|protected)$'}}
                    - has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $RECEIVER}}}
                    - inside:
                        kind: compilation_unit
                        stopBy: end
                        all:
                            - has: {stopBy: end, matches: passed-call}
                            - not: {has: {stopBy: end, matches: passed-call, not: {has: {field: arguments, has: {kind: argument, has: {any: [{matches: held-source}, {matches: fixed-source}]}}}}}}
            - kind: identifier
              pattern: $RECEIVER
              any:
                - matches: {csharp-block-local: {declarator: {has: {any: [{matches: fixed-source}, {matches: held-source}]}}}}
                - inside: {stopBy: end, matches: designated-arm, inside: {kind: switch_expression, has: {nthChild: 1, matches: fixed-source}}}
    passed-call:
        kind: invocation_expression
        has: {field: function, any: [{kind: identifier, pattern: $PASSED}, {kind: member_access_expression, has: {field: name, pattern: $PASSED}}]}
    map-type:
        kind: 'generic_name, qualified_name'
        regex: |-
            (?x)^(global::)?((System\.Collections\.(Generic|Immutable|Frozen|Concurrent)|LanguageExt)\.)?
            (Dictionary|IDictionary|IReadOnlyDictionary|SortedDictionary|SortedList|ConcurrentDictionary|ImmutableDictionary|ImmutableSortedDictionary
            |FrozenDictionary|Map|HashMap|TrackingHashMap)\s*<
    key-type:
        any:
            - {kind: identifier, pattern: $KEY}
            - {kind: member_access_expression, has: {field: name, pattern: $KEY}}
    key-items:
        kind: member_access_expression
        all: [{has: {field: expression, matches: key-type}}, {has: {field: name, regex: '^Items$'}}]
    key-item:
        any:
            - kind: member_access_expression
              has: {field: expression, matches: key-type}
            - kind: identifier
              pattern: $ITEM
              inside:
                stopBy: end
                any:
                    - kind: lambda_expression
                      all:
                        - has: {field: parameters, any: [{pattern: $ITEM}, {has: {kind: parameter, has: {field: name, pattern: $ITEM}}}]}
                        - inside: {kind: argument, inside: {kind: argument_list, inside: {kind: invocation_expression, has: {field: function, has: {stopBy: end, matches: key-items}}}}}
                    - kind: query_expression
                      has: {kind: from_clause, all: [{has: {field: name, pattern: $ITEM}}, {has: {stopBy: end, matches: key-items}}]}
                    - kind: foreach_statement
                      all: [{has: {field: left, pattern: $ITEM}}, {has: {field: right, any: [{matches: key-items}, {has: {stopBy: end, matches: key-items}}]}}]
    arity-read:
        kind: member_access_expression
        all: [{has: {field: expression, pattern: $INDEXED}}, {has: {field: name, regex: '^(Count|Length|IsEmpty)$'}}]
    arity-test:
        any: [{matches: arity-read}, {has: {stopBy: end, matches: arity-read}}]
    exit-guard:
        kind: if_statement
        all:
            - has: {field: condition, matches: arity-test}
            - has: {field: consequence, any: [{kind: 'continue_statement, break_statement, return_statement, throw_statement'}, {kind: block, has: {nthChild: 1, kind: 'continue_statement, break_statement, return_statement, throw_statement'}}]}
    guarded:
        any:
            - inside: {stopBy: end, kind: conditional_expression, has: {field: condition, matches: arity-test}}
            - inside: {stopBy: end, kind: if_statement, has: {field: condition, matches: arity-test}}
            - inside: {stopBy: end, kind: binary_expression, all: [{has: {field: operator, regex: '^(&&|\|\|)$'}}, {has: {field: left, matches: arity-test}}]}
            - inside: {stopBy: end, kind: 'local_declaration_statement, expression_statement, if_statement, return_statement', follows: {stopBy: end, matches: exit-guard}}
    literal-index:
        kind: bracketed_argument_list
        all:
            - has:
                kind: argument
                has:
                    any:
                        - kind: integer_literal
                        - kind: identifier
                          pattern: $CONSTANT
                          inside:
                            kind: compilation_unit
                            stopBy: end
                            has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $CONSTANT}}, {has: {kind: integer_literal}}], inside: {kind: variable_declaration, inside: {has: {kind: modifier, regex: '^const$'}}}}
                        - kind: prefix_unary_expression
                          regex: '^\^\s*\d+$'
                        - kind: binary_expression
                          all:
                            - has: {field: operator, regex: '^-$'}
                            - has: {field: left, kind: member_access_expression, all: [{has: {field: name, regex: '^(Length|Count)$'}}, {has: {field: expression, pattern: $INDEXED}}]}
                            - has: {field: right, kind: integer_literal}
            - not: {has: {kind: argument, nthChild: 2}}
rule:
    any:
        - kind: invocation_expression
          has:
            field: function
            kind: member_access_expression
            all:
                - has: {field: name, regex: '^(First|Last|Single|ElementAt)(OrDefault)?$', pattern: $NAME}
                - has: {field: expression, matches: sequence-receiver}
        - kind: invocation_expression
          has:
            field: function
            kind: member_access_expression
            all:
                - has: {field: expression, regex: '^((global::)?System\.)?(Linq\.)?Enumerable$'}
                - has: {field: name, regex: '^(First|Last|Single|ElementAt)(OrDefault)?$', pattern: $NAME}
        - kind: element_access_expression
          pattern: $NAME
          all:
            - has: {field: expression, kind: identifier, matches: {csharp-declared-type: {type: {matches: map-type}}}}
            - has: {field: subscript, all: [{has: {kind: argument}}, {not: {has: {kind: argument, nthChild: 2}}}]}
            - not:
                any:
                    - inside: {kind: assignment_expression, field: left}
                    - all:
                        - has:
                            field: expression
                            matches:
                                csharp-declared-type:
                                    type: {has: {kind: type_argument_list, has: {nthChild: 1, any: [{kind: identifier, pattern: $KEY}, {kind: qualified_name, has: {field: name, pattern: $KEY}}]}}}
                        - has: {field: subscript, has: {kind: argument, has: {matches: key-item}}}
        - kind: element_access_expression
          pattern: $NAME
          all:
            - has: {field: expression, pattern: $INDEXED, matches: sequence-receiver}
            - has: {field: subscript, matches: literal-index}
            - not: {any: [{has: {field: expression, matches: fixed-count}}, {matches: guarded}]}
message: '`$NAME` throws or returns a default sentinel on a sequence or map lacking the element'
note: Use `Head`, `Last`, `Find(<predicate>)`, `At(<index>)`, or a map's `Find(<key>)`, each returning an `Option`, a list pattern (`[var first, .. var rest]`, `[var only]`) for a known arity, or a slice or `stackalloc` of constant length that fixes the count
