# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-struct-fields-read
language: python
severity: error
utils:
    declared:
        kind: attribute
        has: {field: attribute, regex: '^__struct_(fields|defaults)__$'}
rule:
    pattern: $READ
    any:
        - kind: subscript
          all:
            - has: {field: value, matches: declared}
            - has: {field: subscript, any: [{kind: 'integer, slice'}, {kind: unary_operator, has: {field: argument, kind: integer}}]}
        - kind: assignment
          all:
            - has: {field: left, kind: 'pattern_list, tuple_pattern, list_pattern'}
            - has: {field: right, matches: declared}
message: '`$READ` reads a record field by declaration position'
note: 'Read the field by attribute, `<record>.<field>`'
