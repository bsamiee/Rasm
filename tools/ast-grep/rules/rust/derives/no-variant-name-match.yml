# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    constant-arm:
        kind: match_arm
        has: {field: value, kind: 'integer_literal, float_literal, boolean_literal, char_literal, scoped_identifier, call_expression, unary_expression', not: {has: {stopBy: end, kind: string_literal}}}
    self-table:
        kind: match_expression
        all:
            - has: {field: value, regex: '^\*?\p{Pattern_White_Space}*self$'}
            - has: {field: body, not: {has: {kind: match_arm, not: {matches: constant-arm}}}}
    constant-table:
        kind: function_item
        has: {field: body, kind: block, has: {any: [{matches: self-table}, {kind: expression_statement, has: {matches: self-table}}]}}
rule:
    kind: match_expression
    all:
        - matches: {rust-variant-name-match: {type: {pattern: $T}, method: {pattern: $METHOD}}}
        - not: {inside: {kind: impl_item, stopBy: end, has: {field: body, has: {matches: constant-table}}}}
message: '`$METHOD` of `$T` spells one string literal per variant'
note: 'Derive `strum::IntoStaticStr` with `serialize` and `const_into_str` for const methods, or `derive_more::Display` with `display`'
