id: chain-to-comprehension
valid:
    - |
      flat = [*row for row in rows]
    - |
      from itertools import chain
      flat = chain(first, second)
    - |
      from itertools import chain
      flat = chain.from_iterable(rows)
    - |
      from itertools import chain
      first = next(chain(*rows))
    - |
      from itertools import chain
      flat = sorted(chain(*rows))
    - |
      from links import chain
      flat = list(chain(*rows))
    - |
      from itertools import chain
      flat = list(chain())
    # Keyword arguments are outside the positional iterable correction
    - |
      from itertools import chain
      flat = list(chain(items=rows))
    - |
      from itertools import chain
      flat = list(chain(**options))
    # Keep comments inside the original argument list
    - |
      from itertools import chain
      flat = list(chain(first, # Retain the input description
                        second))
    # Imported chain names can be replaced by a parameter
    - |
      from itertools import chain
      def flatten(chain):
          return list(chain(rows))
    # A local collector is not the builtin list constructor
    - |
      from itertools import chain
      def flatten(list):
          return list(chain(rows))
    # Preserve comments around the from_iterable argument
    - |
      from itertools import chain
      flat = list(chain.from_iterable(
          # Rows retain their description
          rows))
invalid:
    - |
      from itertools import chain
      flat = list(chain(*rows))
    - |
      from itertools import chain
      flat = list(chain(first, second))
    - |
      from itertools import chain
      flat = list(chain.from_iterable(rows))
    - |
      from itertools import chain as link
      flat = list(link(*rows))
    - |
      import itertools as it
      flat = list(it.chain.from_iterable(rows))
    - |
      from itertools import starmap, chain
      flat = list(chain(first, *rest))
    - |
      from itertools import chain
      flat = list(chain(read_first(), read_second()))
    - |
      from itertools import chain
      flat = list(chain.from_iterable(first if selected else second))
    # A trailing argument comma is retained once in the tuple
    - |
      from itertools import chain
      flat = list(chain(first, second,))
    # A sole generator argument retains its own scope and evaluation order
    - |
      from itertools import chain
      flat = list(chain(row for row in rows))
    # Collecting chain does not call an input iterable length hint.
    - |
      from itertools import chain
      class Rows:
          def __iter__(self):
              yield 1
          def __len__(self):
              raise RuntimeError("length must not be requested")
      flat = list(chain(Rows()))
