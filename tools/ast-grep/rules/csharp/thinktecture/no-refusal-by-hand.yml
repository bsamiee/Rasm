# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-refusal-by-hand
language: csharp
severity: error
utils:
    refusal:
        kind: object_creation_expression, implicit_object_creation_expression
    accepted:
        kind: null_literal
rule:
    kind: conditional_expression
    all:
        - has: {field: condition, has: {stopBy: end, kind: identifier, regex: '^MinValue$'}}
        - has: {field: condition, has: {stopBy: end, kind: identifier, regex: '^MaxValue$'}}
        - any:
            - all: [{has: {field: consequence, matches: accepted}}, {has: {field: alternative, matches: refusal}}]
            - all: [{has: {field: consequence, matches: refusal}}, {has: {field: alternative, matches: accepted}}]
        - inside: {stopBy: end, matches: csharp-validation-hook}
message: '`ValidateFactoryArguments` compares its key with `MinValue` and `MaxValue` by hand'
note: Assign `validationError = Admission.Refusal(value, MinValue, MaxValue)`, with `MinValue._value` and `MaxValue._value` for a class value object, `Refusal` states the bounds in its message
