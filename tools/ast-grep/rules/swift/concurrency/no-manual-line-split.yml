# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-manual-line-split
language: swift
severity: error
utils:
    newline-text:
        any:
            - pattern: 'UInt8(ascii: "\n")'
            - pattern: 'Character("\n")'
            - kind: line_string_literal
              regex: '^"((\\r)?\\n|\\u\{0*[aA]\})"$'
            - kind: 'prefix_expression, navigation_expression'
              regex: '^(CharacterSet)?\.newlines$'
    newline-byte:
        any:
            - kind: hex_literal
              regex: '^0x0*[aA]$'
            - kind: integer_literal
              regex: '^10$'
    newline:
        any:
            - matches: newline-text
            - all:
                - matches: newline-byte
                - inside: {kind: for_statement, stopBy: end, has: {kind: type_annotation, regex: '^:\s*(UInt8|Int8|CChar)$'}}
    newline-search:
        kind: call_expression
        all:
            - has: {kind: navigation_expression, has: {field: suffix, regex: '^\.(split|firstIndex|lastIndex|components|firstRange|ranges)$'}}
            - has:
                kind: call_suffix
                has:
                    kind: value_arguments
                    has:
                        kind: value_argument
                        has:
                            field: value
                            any:
                                - matches: newline-text
                                - all:
                                    - matches: newline-byte
                                    - inside: {kind: for_statement, stopBy: end, regex: '^for\s+(try\s+)?await\b'}
rule:
    kind: for_statement
    all:
        - has: {field: collection, pattern: $BYTES}
        - has: {field: item, has: {field: bound_identifier, pattern: $B}}
        - has:
            kind: statements
            has:
                stopBy: end
                any:
                    - kind: equality_expression
                      all:
                        - has: {pattern: $B}
                        - has: {matches: newline}
                    - kind: switch_statement
                      all:
                        - has: {pattern: $B}
                        - has: {kind: switch_entry, has: {kind: switch_pattern, has: {matches: newline, stopBy: end}}}
                    - pattern: $B.isNewline
                    - pattern: $_.newlines.contains($B)
                    - matches: newline-search
message: '`for` over `$BYTES` splits lines by hand, testing each `$B` for a newline'
note: 'Iterate `lines` of an async byte sequence, `strings()` of swift-subprocess `SubprocessOutputSequence`, or `split(whereSeparator: \.isNewline)` of a string in memory'
