# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-module-state
language: tsx
severity: error
rule:
    kind: lexical_declaration
    has: {field: kind, regex: '^let$'}
    inside:
        any:
            - kind: program
            - kind: export_statement
              inside: {kind: program}
message: 'Module-level `let` shares mutable state across the module'
note: 'Pass changing state as a returned value, `Ref` holds state shared across fibers'
