id: no-nested-combinator-calls
valid:
    # Three calls remain within the nesting limit.
    - 'import { Array } from "effect"; Array.flatten(Array.map(Array.filter(rows, accept), project));'
    # Unary transforms count as calls, but three still remain within the limit.
    - 'import { Array } from "effect"; Array.flatten(Array.flatten(Array.make(rows)));'
    # A data-last function passed as an argument is not another data-first level.
    - 'import { Array } from "effect"; Array.map(Array.filter(rows, accept), Array.map(Array.filter(otherAccept)));'
    # Constructors contain nested values rather than pipeline steps.
    - 'import { Array } from "effect"; Array.make(Array.make(Array.make(Array.make(rows))));'
    # The same deep spelling without an import does not prove the package.
    - 'Option.getOrElse(Option.map(Option.filter(Option.some(input), accept), project), fallback);'
    # Wrong package and namespace source retain their own operation contracts.
    - 'import { Option as O } from "other"; O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback);'
    - 'import * as O from "other/Option"; O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback);'
    # The imported local name is different from the receiver being called.
    - 'import { Option as O } from "effect"; Option.getOrElse(Option.map(Option.filter(Option.some(input), accept), project), fallback);'
    # Type-only bindings supply no module value, in both import spellings.
    - 'import type { Option as O } from "effect"; O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback);'
    - 'import { type Option as O } from "effect"; O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback);'
    # A parameter shadows the otherwise correct imported module.
    - 'import { Option as O } from "effect"; function build(O) { return O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback); }'
    # Schema operations declare schemas, including under an import alias.
    - 'import { Schema as S } from "effect"; S.filter(S.filter(S.filter(S.filter(S.String, predicate), predicate), predicate), predicate);'
    # The outer data-last call accepts a function; its argument has only three calls.
    - 'import { Option as O } from "effect"; O.map(O.map(O.filter(O.some(input), accept), project));'
    - import { Option as O, identity } from "effect"; O.map(O.map(O.map(identity.call(undefined, input), first), second), third);
    - import { Array } from "effect"; Array.make(Array.make(Array.make(Array.make(rows), extra), extra), extra);
    - import { Option as O } from "effect"; O.map(value, O.map(O.map(O.some(input), first), second));
    - import { Option as O } from "effect"; O.map(O.map(O.some(raw), O.map(O.some(input), first)), second);
    - import { Option as O } from "effect"; O.map(O.map(O.map(raw, O.some(first)), second), third);
    # A comment after the only argument does not turn a data-last call into a two-argument operation.
    - 'import { Option as O } from "effect"; O.map(O.map(O.map(O.some(input), first), second) /* trailing */);'
invalid:
    # Four data-first calls exceed the limit.
    - 'import { Array } from "effect"; Array.flatten(Array.map(Array.filter(Array.dedupe(rows), accept), project));'
    # Renamed and namespace imports keep package identity.
    - 'import { Option as O } from "effect"; O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback);'
    - 'import * as O from "effect/Option"; O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback);'
    # A deep chain in another argument is an independent match.
    - 'import { Array, Effect } from "effect"; Effect.succeed(Array.flatten(Array.map(Array.filter(Array.dedupe(rows), accept), project)));'
    # Unary transforms in the middle still consume the nested input.
    - 'import { Array } from "effect"; Array.map(Array.flatten(Array.map(Array.make(items), wrap)), project);'
    # Comments do not shift semantic argument positions.
    - 'import { Array } from "effect"; Array.flatten(/* first */ Array.map(/* second */ Array.filter(/* third */ Array.make(items), accept), project));'
    # Five levels report only the outermost qualifying call.
    - 'import { Option as O } from "effect"; O.getOrElse(O.map(O.map(O.filter(O.some(input), accept), first), second), fallback);'
    - import { Option as O, Effect } from "effect"; Effect.map(Effect.succeed(rows), O.getOrElse(O.map(O.filter(O.some(input), accept), project), fallback));
    - import { Option as O } from "effect"; O.map(/* comment */ O.map(O.map(O.filter(O.some(input), accept), first), second), third);
    - import { Option as O } from "effect"; O.map(O.map(O.map(O.some(input) /* trailing */, /* leading */ first), second), third);
