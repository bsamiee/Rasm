# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-item-update-in-build-props
language: xml
severity: error
files: ['**/Directory.Build.props']
utils:
    same-include:
        kind: element
        all:
            - has: {matches: msbuild-tag, has: {kind: Name, pattern: _ITEM}}
            - matches: {msbuild-metadata: {name: {regex: '^Include$'}, value: {kind: AttValue}}}
    import:
        kind: element
        any:
            - matches: {msbuild-element: {name: {regex: '^(Import|Sdk)$'}}}
            - has: {kind: element, stopBy: end, matches: {msbuild-element: {name: {regex: '^(Import|Sdk)$'}}}}
rule:
    all:
        - kind: element
          has: {matches: msbuild-tag, has: {kind: Name, pattern: _ITEM, regex: '^(Compile|None|EmbeddedResource)$'}}
        - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^(Update|Remove)$'}, value: {kind: AttValue}}}}}
        - not: {inside: {matches: {msbuild-element: {name: {regex: '^Target$'}}}, stopBy: end}}
        - not: {follows: {stopBy: end, matches: import}}
        - not: {inside: {kind: element, stopBy: end, follows: {stopBy: end, matches: import}}}
        - not: {follows: {stopBy: end, matches: same-include}}
        - not:
            inside:
                kind: content
                inside: {kind: element, follows: {stopBy: end, kind: element, has: {kind: content, has: {matches: same-include}}}}
message: '`Directory.Build.props` updates or removes an SDK default item before the SDK declares it'
note: Move the item to `Directory.Build.targets`
