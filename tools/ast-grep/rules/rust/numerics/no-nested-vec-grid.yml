# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-vec-grid
language: rust
severity: error
utils:
    filled-row:
        any:
            - kind: macro_invocation
              all:
                - has: {field: macro, regex: '^((::)?(std|alloc)::)?vec$'}
                - has: {kind: token_tree, has: {regex: '^;$'}}
            - kind: call_expression
              all:
                - any:
                    - pattern: ($_).map($_).collect()
                    - pattern: ($_).map($_).collect::<$_>()
                - has: {stopBy: end, kind: range_expression}
    row-closure:
        kind: closure_expression
        has: {field: body, any: [{matches: filled-row}, {kind: block, has: {matches: filled-row}, not: {has: {nthChild: 2}}}]}
    repeated-row:
        kind: call_expression
        any:
            - all:
                - has: {field: function, regex: '(^|::)repeat_with$'}
                - has: {field: arguments, has: {nthChild: 1, matches: row-closure}}
            - all:
                - has: {field: function, regex: '(^|::)repeat(_n)?$'}
                - has: {field: arguments, has: {nthChild: 1, matches: filled-row}}
rule:
    kind: 'macro_invocation, call_expression'
    pattern: $GRID
    any:
        - kind: macro_invocation
          all:
            - has: {field: macro, regex: '^((::)?(std|alloc)::)?vec$'}
            - has:
                kind: token_tree
                all:
                    - has: {nthChild: 1, kind: identifier, regex: '^vec$', precedes: {regex: '^!$', precedes: {kind: token_tree, has: {regex: '^;$'}}}}
                    - has: {regex: '^;$'}
        - kind: call_expression
          all:
            - any:
                - pattern: $ROWS.collect()
                - pattern: $ROWS.collect::<$TYPE>()
            - has: {field: function, has: {field: value, any: [{matches: repeated-row}, {has: {stopBy: end, matches: repeated-row}}]}}
message: '`$GRID` builds a rectangular grid as a vector of row vectors'
note: 'Allocate a 2D type: `ndarray::Array2::zeros((<rows>, <cols>))` or `Array2::from_elem((<rows>, <cols>), <value>)` indexed as `grid[[<row>, <col>]]`, `nalgebra::DMatrix::zeros(<rows>, <cols>)`, or `faer::Mat::zeros(<rows>, <cols>)`'
