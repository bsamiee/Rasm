# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-thrown-failure-in-lift
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    thrown:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: expression, pattern: $VALUE}}, {has: {field: name, regex: '^ThrowIfFail$'}}]}
            - matches: csharp-bare-call
    thunk:
        kind: lambda_expression
        all:
            - matches: csharp-parameterless
            - inside: {kind: argument, inside: {kind: argument_list, inside: {kind: invocation_expression, matches: {csharp-owner-call: {type: {regex: '^IO$'}, member: {regex: '^lift$'}}}}}}
rule:
    matches: thrown
    any:
        - inside: {field: body, matches: thunk}
        - inside: {kind: return_statement, inside: {kind: block, inside: {matches: thunk}}}
fix: $VALUE
message: '`$VALUE.ThrowIfFail()` throws a failure the `IO.lift` thunk can return as `Fin`'
note: 'Return `Fin` from the thunk'
