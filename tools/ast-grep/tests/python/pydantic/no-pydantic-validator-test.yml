id: no-pydantic-validator
valid:
    - |
      from pydantic import BaseModel, Field

      class Settings(BaseModel):
          port: int = Field(gt=0)
    - "from pydantic import field_validator"
    - |
      from pydantic import model_validator
    - |
      check = schema.validator("port")
    - "from pydantic import validate_call"
    - 'pydantic.validate_call(config={"strict": True})(run)'
    - "other.validate_arguments(run)"
    - "pydantic.deprecated.decorator.validator(run)"
    - "pydantic.deprecated.class_validators.validate_arguments(run)"
    - "from pydantic.v1 import validator"
invalid:
    - |
      from pydantic import validator
    - |
      from pydantic import root_validator
    - |
      import pydantic

      @pydantic.validator("port")
      def positive(cls, value):
          return value
    - |
      import pydantic as pd

      @pd.root_validator
      def whole(cls, values):
          return values
    - "from pydantic.deprecated.class_validators import validator"
    - "pydantic.deprecated.class_validators.root_validator(pre=True)"
    - "from pydantic import validate_arguments"
    - "from pydantic.deprecated.decorator import validate_arguments as validated"
    - |
      import pydantic as pd
      @pd.validate_arguments
      def run(count: int) -> int:
          return count
    - "from pydantic import validator as check"
    - "from pydantic.class_validators import root_validator"
    - "pydantic.decorator.validate_arguments(run)"
