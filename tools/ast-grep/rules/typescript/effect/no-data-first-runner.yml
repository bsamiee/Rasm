# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-data-first-runner
language: tsx
severity: error
utils:
    dual-runner:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^runMain$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(NodeRuntime|BunRuntime|BrowserRuntime)$'}}}}
            - all:
                - has: {field: property, regex: '^run$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\bCommand$'}}}}
    effect-runner:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(runPromise|runPromiseExit|runSync|runSyncExit|runFork|runCallback)$'}
            - has: {field: object, matches: effect-effect-module}
    piped-program:
        kind: call_expression
        has: {field: arguments, has: {nthChild: 1}}
        any:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^pipe$'}}
            - has: {field: function, kind: identifier, matches: effect-pipe-function}
    runner-call:
        kind: call_expression
        all:
            - has: {field: function, pattern: $RUN, any: [{matches: dual-runner}, {matches: effect-runner}]}
            - any:
                - pattern: $RUN($PROGRAM)
                - pattern: '$RUN($PROGRAM, $OPTIONS)'
                  has: {field: function, matches: dual-runner}
            - has: {field: arguments, has: {nthChild: 1, matches: piped-program}}
rule:
    kind: call_expression
    all:
        - any:
            - matches: runner-call
              not: {inside: {kind: member_expression, field: object, has: {field: property, regex: '^pipe$'}}}
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: object, matches: runner-call}}, {has: {field: property, regex: '^pipe$'}}]}
                - has: {field: arguments, has: {nthChild: 1}}
        - any:
            - pattern: $FIXABLE
              not: {has: {kind: comment, stopBy: end}}
            - pattern: $KEPT
rewriters:
    - id: chained-method-options
      rule: {pattern: '$RUN($SELF.pipe($$$STEPS), $OPTIONS).pipe($$$MORE)'}
      transform:
        LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}
        FOLLOWING: {replace: {source: $$$MORE, replace: '(?s),\s*$', by: ''}}
      fix: $SELF.pipe($LISTED, $RUN($OPTIONS), $FOLLOWING)
    - id: chained-method
      rule: {pattern: $RUN($SELF.pipe($$$STEPS)).pipe($$$MORE)}
      transform:
        LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}
        FOLLOWING: {replace: {source: $$$MORE, replace: '(?s),\s*$', by: ''}}
      fix: $SELF.pipe($LISTED, $RUN, $FOLLOWING)
    - id: chained-function-options
      rule: {pattern: '$RUN($PIPE($$$STEPS), $OPTIONS).pipe($$$MORE)'}
      transform:
        LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}
        FOLLOWING: {replace: {source: $$$MORE, replace: '(?s),\s*$', by: ''}}
      fix: $PIPE($LISTED, $RUN($OPTIONS), $FOLLOWING)
    - id: chained-function
      rule: {pattern: $RUN($PIPE($$$STEPS)).pipe($$$MORE)}
      transform:
        LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}
        FOLLOWING: {replace: {source: $$$MORE, replace: '(?s),\s*$', by: ''}}
      fix: $PIPE($LISTED, $RUN, $FOLLOWING)
    - id: method-options
      rule: {pattern: '$RUN($SELF.pipe($$$STEPS), $OPTIONS)'}
      transform: {LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}}
      fix: $SELF.pipe($LISTED, $RUN($OPTIONS))
    - id: method
      rule: {pattern: $RUN($SELF.pipe($$$STEPS))}
      transform: {LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}}
      fix: $SELF.pipe($LISTED, $RUN)
    - id: function-options
      rule: {pattern: '$RUN($PIPE($$$STEPS), $OPTIONS)'}
      transform: {LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}}
      fix: $PIPE($LISTED, $RUN($OPTIONS))
    - id: function
      rule: {pattern: $RUN($PIPE($$$STEPS))}
      transform: {LISTED: {replace: {source: $$$STEPS, replace: '(?s),\s*$', by: ''}}}
      fix: $PIPE($LISTED, $RUN)
transform:
    FIXED: rewrite($FIXABLE, rewriters=[chained-method-options, chained-method, chained-function-options, chained-function, method-options, method, function-options, function])
fix: $FIXED$KEPT
message: '`$RUN` wraps the pipe it runs'
note: '`<program>.pipe(<step>, <runner>)` lists the runner as a step in reading order, with `<runner>(<options>)` for a runner that takes options'
