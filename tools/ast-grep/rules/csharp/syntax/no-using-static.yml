# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-using-static
language: csharp
severity: error
rule:
    kind: using_directive
    pattern: $DIRECTIVE
    has: {regex: '^static$'}
message: '`$DIRECTIVE` imports static members without their owning type'
note: 'Qualify each member with its owning type, `LanguageExt.Prelude` alone enters unqualified through the `Using Include="LanguageExt.Prelude" Static="true"` item in `Directory.Build.targets`'
