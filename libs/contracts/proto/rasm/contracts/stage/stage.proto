syntax = "proto3";

package rasm.contracts.stage;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

// The photo-to-PBR inference stage a request names and a result answers.
enum PbrStage {
  PBR_STAGE_UNSPECIFIED = 0;
  PBR_STAGE_DELIGHT = 1;
  PBR_STAGE_ALBEDO = 2;
  PBR_STAGE_NORMALS = 3;
  PBR_STAGE_DEPTH = 4;
  PBR_STAGE_SVBRDF = 5;
  PBR_STAGE_INTRINSIC_APPEARANCE = 6;
  PBR_STAGE_SPECTRAL_REFLECTANCE = 7;
  PBR_STAGE_SUPER_RESOLVE = 8;
  PBR_STAGE_TILEABILITY = 9;
}

// Grant posture of the model weights; BLOCKED carries no grant to run and the executing end re-checks it.
enum LicenseClass {
  LICENSE_CLASS_UNSPECIFIED = 0;
  LICENSE_CLASS_PERMISSIVE = 1;
  LICENSE_CLASS_COPYLEFT = 2;
  LICENSE_CLASS_OPEN_RAIL = 3;
  LICENSE_CLASS_RESEARCH = 4;
  LICENSE_CLASS_BLOCKED = 5;
}

enum InferenceProvider {
  INFERENCE_PROVIDER_UNSPECIFIED = 0;
  INFERENCE_PROVIDER_CPU = 1;
  INFERENCE_PROVIDER_CORE_ML = 2;
  INFERENCE_PROVIDER_WEB_GPU = 3;
}

enum TensorPrecision {
  TENSOR_PRECISION_UNSPECIFIED = 0;
  TENSOR_PRECISION_FP32 = 1;
  TENSOR_PRECISION_FP16 = 2;
}

// Border fill outside the source extent while a tile straddles its edge.
enum PadMode {
  PAD_MODE_UNSPECIFIED = 0;
  PAD_MODE_REFLECT = 1;
}

// A prior is an intermediate field one stage produces for another and no texture set stores.
enum PriorField {
  PRIOR_FIELD_UNSPECIFIED = 0;
  PRIOR_FIELD_DELIT = 1;
  PRIOR_FIELD_DEPTH = 2;
  PRIOR_FIELD_SPECTRAL = 3;
}

// A score is a measured grade that crosses by value and lands in no plane.
enum ScoreField {
  SCORE_FIELD_UNSPECIFIED = 0;
  SCORE_FIELD_TILEABILITY = 1;
}

enum PlaneTransfer {
  PLANE_TRANSFER_UNSPECIFIED = 0;
  PLANE_TRANSFER_LINEAR = 1;
  PLANE_TRANSFER_SRGB = 2;
  PLANE_TRANSFER_RAW = 3;
  PLANE_TRANSFER_PQ = 4;
  PLANE_TRANSFER_HLG = 5;
}

enum PlaneFormat {
  PLANE_FORMAT_UNSPECIFIED = 0;
  PLANE_FORMAT_R8 = 1;
  PLANE_FORMAT_R16 = 2;
  PLANE_FORMAT_R16F = 3;
  PLANE_FORMAT_R32F = 4;
  PLANE_FORMAT_RG8 = 5;
  PLANE_FORMAT_RG16 = 6;
  PLANE_FORMAT_RG16F = 7;
  PLANE_FORMAT_RG32F = 8;
  PLANE_FORMAT_RGBA8 = 9;
  PLANE_FORMAT_RGBA16 = 10;
  PLANE_FORMAT_RGBA16F = 11;
  PLANE_FORMAT_RGBA32F = 12;
}

// --- [PRODUCTS] ---------------------------------------------------------------------------

// What a stage consumes or emits: a texture channel keyed by the appearance channel roster the specifying end owns,
// a prior another stage produced, or a scalar grade. The channel key is the appearance roster's own spelling.
message StageProductWire {
  oneof role {
    option (buf.validate.oneof).required = true;

    string channel = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_]*$"];
    PriorField prior = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    ScoreField measure = 3 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
  }
}

// One consumed product. A source row carries the content key of the intent's own plane; a produced row names the
// stage and product an earlier stage already emitted, and the executor resolves it from results it holds.
message StageInputWire {
  oneof kind {
    option (buf.validate.oneof).required = true;

    Source source = 1;
    Produced produced = 2;
  }

  message Source {
    bytes key = 1 [(buf.validate.field).bytes.len = 16];
  }

  message Produced {
    PbrStage stage = 1 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    StageProductWire product = 2 [(buf.validate.field).required = true];
  }
}

// One produced plane, named by its role and addressed by the content key of the plane bytes the executor wrote.
message StageOutputWire {
  StageProductWire role = 1 [(buf.validate.field).required = true];
  bytes blob = 2 [(buf.validate.field).bytes.len = 16];
  uint32 width = 3 [(buf.validate.field).uint32.gt = 0];
  uint32 height = 4 [(buf.validate.field).uint32.gt = 0];
  PlaneTransfer transfer = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  PlaneFormat format = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// One measured grade; it crosses by value and never through a plane.
message StageScoreWire {
  StageProductWire role = 1 [(buf.validate.field).required = true];
  double value = 2 [(buf.validate.field).double.finite = true];
}

// The fixed ONNX bucket a request tiles against; the executor re-derives its grid from extent, tile, and overlap.
message BucketWire {
  uint32 width = 1 [(buf.validate.field).uint32.gt = 0];
  uint32 height = 2 [(buf.validate.field).uint32.gt = 0];
}

// --- [REQUEST] ----------------------------------------------------------------------------

// The inference request. Extents thread whole: a stage publishes `input × scale`, so the output extent is a
// column and never a scale a consumer re-derives; a cover stage carries equal extents. The tile bucket agrees
// with the tile extent, and a stochastic card carries a nonzero seed while a deterministic one carries zero.
message StageRequestWire {
  option (buf.validate.message).cel = {
    id: "stage.request.bucket"
    message: "the bucket must equal the tile extent"
    expression: "this.bucket.width == this.tile_width && this.bucket.height == this.tile_height"
  };
  option (buf.validate.message).cel = {
    id: "stage.request.scale"
    message: "the output extent must be an integer isotropic multiple of the input extent"
    expression: "this.output_width % this.input_width == 0u && this.output_height % this.input_height == 0u && this.output_width / this.input_width == this.output_height / this.input_height"
  };

  PbrStage stage = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string model_card_id = 2 [(buf.validate.field).string.min_len = 1];
  LicenseClass license = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated StageInputWire inputs = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
  }];
  uint32 input_width = 5 [(buf.validate.field).uint32.gt = 0];
  uint32 input_height = 6 [(buf.validate.field).uint32.gt = 0];
  uint32 output_width = 7 [(buf.validate.field).uint32.gt = 0];
  uint32 output_height = 8 [(buf.validate.field).uint32.gt = 0];
  uint32 tile_width = 9 [(buf.validate.field).uint32.gt = 0];
  uint32 tile_height = 10 [(buf.validate.field).uint32.gt = 0];
  uint32 overlap = 11;
  PadMode pad = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  BucketWire bucket = 13 [(buf.validate.field).required = true];
  InferenceProvider provider = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  TensorPrecision precision = 15 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint64 seed = 16;
  // Correlation key the executor echoes verbatim onto the result.
  string op = 17 [(buf.validate.field).string.min_len = 1];
  // Content key of the registered weight bytes; absent on a card whose weights the caller supplies.
  optional bytes artefact = 18 [(buf.validate.field).bytes.len = 16];
}

// --- [RESULT] -----------------------------------------------------------------------------

// The inference result. `artefact` is the content key of the weight bytes the session actually loaded;
// `parity_fresh` is true only on the run that measured `golden_delta` rather than served it from a memo.
message StageResultWire {
  PbrStage stage = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string model_card_id = 2 [(buf.validate.field).string.min_len = 1];
  bytes artefact = 3 [(buf.validate.field).bytes.len = 16];
  repeated StageOutputWire outputs = 4 [(buf.validate.field).repeated.max_items = 64];
  repeated StageScoreWire scores = 5 [(buf.validate.field).repeated.max_items = 64];
  InferenceProvider provider_used = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 partition_count = 7;
  google.protobuf.Duration elapsed = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  double golden_delta = 9 [(buf.validate.field).double.finite = true];
  bool parity_fresh = 10;
  float coverage = 11 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
  uint32 tiles_emitted = 12;
  string op = 13 [(buf.validate.field).string.min_len = 1];
}
