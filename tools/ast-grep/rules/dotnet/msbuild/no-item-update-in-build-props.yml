# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-item-update-in-build-props
language: xml
severity: error
files: ['**/Directory.Build.props']
rule:
    # Update and Remove sit on items alone, an ItemGroup parent adds no shape and a child element of that name is metadata
    matches: {msbuild-metadata: {name: {regex: '^(Update|Remove)$'}, value: {kind: AttValue}}}
    not: {inside: {matches: {msbuild-element: {name: {regex: '^Target$'}}}, stopBy: end}}
message: The Update or Remove in Directory.Build.props runs before the SDK globs add any item and matches nothing
note: Move the item to Directory.Build.targets or the project file, and express an exclusion through DefaultItemExcludes
