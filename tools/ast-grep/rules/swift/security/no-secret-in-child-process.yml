# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-secret-in-child-process
language: swift
severity: error
utils:
    secret-name:
        kind: line_string_literal
        regex: '^"([A-Z][A-Z0-9_]*_)?(TOKEN|SECRET|PASSWORD|PASSPHRASE|CREDENTIALS?|API_?KEY|KEY)"$'
    variable-name:
        kind: line_string_literal
        regex: '^"[A-Z_][A-Z0-9_]*"$'
    secret-value:
        any:
            - kind: navigation_expression
              has: {field: suffix, has: {field: suffix, regex: '(?i)(token|apiKey|secret|password|passphrase|credential)$'}}
            - kind: simple_identifier
              regex: '(?i)(token|apiKey|secret|password|passphrase|credential)$'
            - kind: line_string_literal, multi_line_string_literal, raw_string_literal
              has: {stopBy: end, kind: interpolated_expression, has: {field: value, matches: secret-value}}
    plain-value:
        pattern: $_
        not: {regex: '(?i)(descriptor|fileno|rawValue)'}
    exposed-pair:
        any:
            - all:
                - has: {stopBy: end, pattern: $SECRET, matches: secret-name}
                - has: {stopBy: end, pattern: $VALUE, matches: plain-value}
            - all:
                - has: {stopBy: end, pattern: $SECRET, matches: variable-name}
                - has: {stopBy: end, pattern: $VALUE, matches: secret-value}
    secret-option:
        kind: line_string_literal
        regex: '(?i)^"--?([a-z0-9]+-)*(token|password|passphrase|secret|api-?key|credentials?)("$|=)'
    valued-flag:
        kind: line_string_literal
        inside: {kind: array_literal}
        any:
            - regex: '^"-(w|X)"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"add-(generic|internet)-password"$'}}}}
            - regex: '^"-p"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"(add-generic-password|create-keychain|unlock-keychain|set-keychain-password)"$'}}}}
            - regex: '^"-o"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"set-keychain-password"$'}}}}
            - regex: '^"-k"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"set-(generic-password|internet-password|key)-partition-list"$'}}}}
            - regex: '^"-P"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"(import|export)"$'}}}}
            - matches: secret-option
              regex: '"$'
rule:
    any:
        - matches: valued-flag
          precedes: {stopBy: {pattern: $_}, pattern: $SECRET}
        - matches: secret-option
          pattern: $SECRET
          regex: '='
          inside: {kind: array_literal}
        - matches: secret-value
          pattern: $SECRET
          inside: {kind: array_literal}
          not: {follows: {stopBy: {pattern: $_}, matches: valued-flag}}
          any:
            - inside: {stopBy: end, kind: value_argument, has: {field: name, regex: '^arguments$'}}
            - inside: {stopBy: end, kind: call_expression, has: {nthChild: 1, kind: simple_identifier, regex: '^Arguments$'}}
            - inside: {stopBy: end, kind: assignment, has: {field: target, regex: '(^|\.)arguments$'}}
        - all:
            - kind: line_string_literal
              pattern: $SECRET
            - any:
                - nthChild: {position: 2n+1, ofRule: {not: {kind: 'comment, multiline_comment'}}}
                  inside: {kind: dictionary_literal}
                - nthChild: 1
                  inside: {kind: tuple_expression}
            - precedes: {stopBy: {pattern: $_}, pattern: $VALUE}
            - inside: {kind: 'dictionary_literal, tuple_expression', matches: exposed-pair}
        - all:
            - any:
                - pattern: '$STORE[$_] = $VALUE'
                  has: {field: target, has: {stopBy: end, kind: line_string_literal, pattern: $SECRET}}
                - pattern: '$STORE.updateValue($VALUE, forKey: $SECRET)'
                - kind: call_expression
                  all:
                    - has: {nthChild: 1, kind: simple_identifier, regex: '^setenv$'}
                    - has:
                        kind: call_suffix
                        has:
                            kind: value_arguments
                            all:
                                - has: {kind: value_argument, nthChild: 1, has: {field: value, pattern: $SECRET}}
                                - has: {kind: value_argument, nthChild: 2, has: {field: value, pattern: $VALUE}}
            - matches: exposed-pair
message: '`$SECRET` exposes a secret to `ps` for every process of the same uid through child argv or environment'
note: 'Write secrets to a pipe the child reads, as a `security -i` command on stdin or through a descriptor number it opens'
