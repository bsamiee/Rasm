# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-guard-on-decoded-union
language: tsx
severity: error
rule:
    kind: call_expression
    all:
        - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $VALUE}}, {not: {has: {nthChild: 2}}}]}
        - has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, pattern: $CASE}
                - has: {field: object, kind: member_expression, all: [{has: {field: property, regex: '^guards$'}}, {has: {field: object, pattern: $UNION}}]}
        - any:
            - all:
                - has: {field: function, has: {field: object, has: {field: object, kind: member_expression, all: [{has: {field: property, pattern: $FIELD}}, {has: {field: object, kind: member_expression, has: {field: property, regex: '^fields$'}}}]}}}
                - has: {field: arguments, has: {nthChild: 1, kind: member_expression, has: {field: property, pattern: $FIELD}}}
            - all:
                - has: {field: arguments, has: {nthChild: 1, kind: identifier}}
                - inside:
                    stopBy: end
                    kind: 'arrow_function, function_expression, function_declaration, method_definition'
                    has:
                        field: parameters
                        has:
                            kind: required_parameter
                            all:
                                - has: {field: pattern, pattern: $VALUE}
                                - has: {field: type, has: {kind: type_query, has: {kind: member_expression, all: [{has: {field: object, pattern: $UNION}}, {has: {field: property, regex: '^Type$'}}]}}}
fix: $UNION.isAnyOf(['$CASE'])($VALUE)
message: '`$UNION.guards.$CASE` validates `$VALUE` in full, a value already decoded as `$UNION`'
note: 'Test the tag of a decoded value with `<union>.isAnyOf([''<case>''])`, `guards` stays for unknown input'
