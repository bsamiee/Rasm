catalogMode: strict

linkWorkspacePackages: deep

# fetchRetries: NEVER ADD - DO NOT REMOVE COMMENT
# fetchRetryFactor: NEVER ADD - DO NOT REMOVE COMMENT

overrides:
  axios: 1.20.0
  # cloudevents declares the deprecated uuid@^8, the v4 API is unchanged in 11
  cloudevents>uuid: 11.1.1
  # @nx/vitest declares a peer on @nx/eslint for its generators, and the peer pulls Jest and glob@7
  '@nx/vitest>@nx/eslint': '-'
  # The grammar package misspells the optional marker of its tree-sitter peer, and the grammar target reads its C sources alone
  '@tree-sitter-grammars/tree-sitter-xml>tree-sitter': '-'
  jiti: 2.7.0
  minimatch: 10.2.6
  rollup: 4.63.1
  sharp: 0.35.4
  svgo: 4.1.0
  tar: 7.5.22

peerDependencyRules:
  allowedVersions:
    apache-arrow: 21.2.0
    '@effect/experimental': 0.61.1
    '@effect/platform': 0.97.1
    '@effect/rpc': 0.76.2
    '@nx/devkit': 23.2.0
    three: 0.185.1
    typescript: 7.0.2
    vitest: 4.1.11

allowBuilds:
  '@biomejs/biome': true
  '@datadog/pprof': true
  '@node-rs/argon2': true
  '@parcel/watcher': true
  '@pulumi/command': true
  '@pulumi/docker': true
  '@pulumi/docker-build': true
  '@pulumi/kubernetes': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-xml': false
  better-sqlite3: true
  core-js: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

saveExact: true
