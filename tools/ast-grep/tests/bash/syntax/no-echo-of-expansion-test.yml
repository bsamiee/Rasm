# Distinguish runtime text from provably numeric output; option-order permutations belong to the removed automatic fixer.
id: no-echo-of-expansion
valid:
    - echo "${#value}"
    - echo "${#@}"
    - printf '%s\n' "$value"
    - echo plain text
    - echo "quoted literal"
    - echo
    - echo '$literal'
    - echo $((1 + 2))
    - echo "${#values[@]}"
    - echo "$#"
    - echo "$?"
    - echo "$$"
    - echo "$!"
    - echo "$((1 + 2))"
invalid:
    - echo "${!name}"
    - echo "${value#$prefix}"
    # Prefix removal uses # after the variable and does not produce a length.
    - echo "${value#prefix}"
    # Numeric fragments cannot certify a word with additional runtime text.
    - echo "${#values[@]}$suffix"
    - echo "${value}"
    - echo $value
    - echo "${value:-default}"
    - echo "prefix$value"suffix
    - echo "$(produce)"
    - echo "$@"
    - echo "${values[@]}"
    - echo "${!prefix@}"
    - echo "${values[0]}"
    - echo -neE "$value"
    - echo -- "$value"
    - echo literal "$value"
    - echo "$value" >&2
