# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-pop-front-loop
language: rust
severity: error
utils:
    linked-list:
        regex: '\bLinkedList\b'
    vec-deque:
        regex: '\bVecDeque\b'
    linked-receiver:
        any:
            - matches: {rust-typed-binding: {type: {matches: linked-list}}}
            - kind: field_expression
              has: {field: field, pattern: $FIELD}
              inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: field_declaration, all: [{has: {field: name, pattern: $FIELD}}, {has: {field: type, matches: linked-list}}]}}
            - kind: identifier
              inside: {kind: block, stopBy: {kind: 'function_item, closure_expression'}, has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $D}}, {has: {field: value, regex: '^(\w+::)*LinkedList\b'}}]}}
    deque-receiver:
        any:
            - matches: {rust-typed-binding: {type: {matches: vec-deque}}}
            - kind: field_expression
              has: {field: field, pattern: $FIELD}
              inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: field_declaration, all: [{has: {field: name, pattern: $FIELD}}, {has: {field: type, matches: vec-deque}}]}}
            - kind: identifier
              inside: {kind: block, stopBy: {kind: 'function_item, closure_expression'}, has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $D}}, {has: {field: value, regex: '^(\w+::)*VecDeque\b'}}]}}
rule:
    kind: 'while_expression, expression_statement'
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - any:
            - all:
                - any:
                    - pattern: 'while $D.len() > $N { $D.pop_front(); }'
                    - pattern: 'while $N < $D.len() { $D.pop_front(); }'
                    - pattern: 'while $D.len() > $N { let _ = $D.pop_front(); }'
                    - pattern: 'while $N < $D.len() { let _ = $D.pop_front(); }'
                - not: {has: {stopBy: end, pattern: $D, matches: linked-receiver}}
            - all:
                - any:
                    - pattern: '$D.drain(..$D.len().saturating_sub($N));'
                    - pattern: '$D.drain(0..$D.len().saturating_sub($N));'
                - has: {stopBy: end, pattern: $D, matches: deque-receiver}
constraints:
    N: {kind: 'identifier, field_expression, integer_literal, scoped_identifier'}
fix: $D.retain_back($N);
message: '`$D` drops its front elements one at a time down to `$N`'
note: 'Call `<deque>.retain_back(<len>)`, the method keeps the last `<len>` elements and does nothing when the deque is already that short. A `>=` loop keeps one element fewer and runs forever at zero. A `drain` whose receiver no type names and a `LinkedList` receiver stay as written'
