# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
default-groups           = "all"
python-preference        = "only-system"
python-downloads         = "never"
environments             = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
prerelease               = "allow"
no-build-package         = ["epdx", "numpy"]                                                                                                                                         # `epdx` sdist omits `project.version`, numpy sdists fail under Xcode Clang (`std::ptrdiff_t` in `string_fastsearch.h`) where a pin outruns its wheels
constraint-dependencies  = ["numpy==2.3.4; python_full_version < '3.15'", "opencolorio==2.5.0; python_full_version < '3.15'", "openimageio==3.1.16.0; python_full_version < '3.15'"] # Versions Blender 5.4 bundles in the interpreter running host code
extra-build-dependencies = { pyroscope-io = ["cmake"] }                                                                                                                              # `pyroscope-io` build.rs runs cmake its sdist leaves undeclared
build-backend            = { module-name = ["blender"], module-root = "libs/python", namespace = true, wheel-exclude = ["pyproject.toml"] }

[tool.uv.dependency-groups]
dev       = { requires-python = ">=3.15" }
workspace = { requires-python = ">=3.15" }

[tool.uv.extra-build-variables]
opencolorio = { CMAKE_ARGS = "-DOCIO_BUILD_APPS=OFF" }
pyarrow     = { PYARROW_WITH_GANDIVA = "0" }
pyicu       = { ICU_VERSION = "78", PYICU_LIBRARIES = "icui18n:icuuc:icudata" }

[tool.uv.config-settings-package.manifold3d]
"cmake.define.MANIFOLD_USE_BUILTIN_TBB" = "ON"

[tool.uv.config-settings-package.pdal]
"cmake.define.CMAKE_INSTALL_RPATH_USE_LINK_PATH" = "ON"

[tool.uv.config-settings-package.small-gicp]
"cmake.define.CMAKE_DISABLE_FIND_PACKAGE_Eigen3" = "ON"
"cmake.define.CMAKE_INSTALL_RPATH_USE_LINK_PATH" = "ON"

# --- [PIXI] -----------------------------------------------------------------------------

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.environments.default]
no-default-feature = true

[tool.pixi.environments.default.dependencies]
libarrow-all = "25.*"
icu          = "78.*"
libpdal-core = "2.10.*"
llvm-openmp  = "*"
librdkafka   = "2.16.*"
libvips      = "*"
libmagic     = "*"
libpango     = "*"
libharfbuzz  = "*"
fontconfig   = "*"
libglib      = "*"

[tool.pixi.environments.default.target.unix.activation.env]
SKBUILD_CMAKE_DEFINE = "PYARROW_CPP_HOME=$CONDA_PREFIX"
PYICU_INCLUDES       = "$CONDA_PREFIX/include"
PYICU_LFLAGS         = "-L$CONDA_PREFIX/lib"
OpenMP_ROOT          = "$CONDA_PREFIX"
PDAL_ROOT            = "$CONDA_PREFIX"
CPATH                = "$CONDA_PREFIX/include"
LIBRARY_PATH         = "$CONDA_PREFIX/lib"
LDFLAGS              = "-Wl,-rpath,$CONDA_PREFIX/lib"

[tool.pixi.environments.hdf5]
no-default-feature = true

[tool.pixi.environments.hdf5.dependencies]
hdf5 = "2.2.*"

[tool.pixi.environments.hdf5.target.unix.activation.env]
HDF5_DIR = "$CONDA_PREFIX"

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
cache-dir      = ".cache/ruff"
preview        = true
target-version = "py315"
line-length    = 200
src            = [".", "libs/python"]
format         = { exclude = ["*.md"], line-ending = "lf", docstring-code-format = true, skip-magic-trailing-comma = true }

[tool.ruff.lint]
select                    = ["ALL"]
ignore                    = [
    "missing-trailing-comma",                                                                                                                                                                                        # Ruff format `skip-magic-trailing-comma` removes the commas COM812 adds
    "too-many-public-methods",                                                                                                                                                                                       # Member counts push one-caller helper extraction
    "too-many-return-statements",                                                                                                                                                                                    # Return counts push one-caller helper extraction, `match` arms return per case
    "too-many-branches",                                                                                                                                                                                             # Branch counts push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "too-many-locals",                                                                                                                                                                                               # Local counts push one-caller helper extraction
    "too-many-statements",                                                                                                                                                                                           # Statement counts push one-caller helper extraction
    "complex-structure",                                                                                                                                                                                             # Complexity scores push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "raw-string-in-exception",                                                                                                                                                                                       # Moves the message into a local the raise alone reads
    "f-string-in-exception",                                                                                                                                                                                         # Moves the message into a local the raise alone reads
    "raise-vanilla-args",                                                                                                                                                                                            # Pushes an exception class per message, raises stay for defects
    "typing-only-first-party-import",                                                                                                                                                                                # Fixes mark always-loaded modules `lazy`, and multi-name imports moved to `TYPE_CHECKING` raise `NameError` in cyclopts `App.command`
    "typing-only-third-party-import",                                                                                                                                                                                # Fixes mark always-loaded modules `lazy`, and multi-name imports moved to `TYPE_CHECKING` raise `NameError` in cyclopts `App.command`
    "typing-only-standard-library-import",                                                                                                                                                                           # Fixes mark always-loaded modules `lazy`, and multi-name imports moved to `TYPE_CHECKING` raise `NameError` in cyclopts `App.command`
    "suspicious-subprocess-import",                                                                                                                                                                                  # Reports every `subprocess` import, process boundaries call it
    "implicit-namespace-package",                                                                                                                                                                                    # Import roots under backend `module-root` are namespace packages
    "missing-copyright-notice",                                                                                                                                                                                      # Files hold no license header
    "commented-out-code",                                                                                                                                                                                            # Reads `# --- [<FAMILY>]` subsection dividers as code
    "float-equality-comparison",                                                                                                                                                                                     # Code compares authored controls with exact identity values (`0.0`, `1.0`) and guards division by exact zero
    "non-pep695-generic-class",                                                                                                                                                                                      # ty reads frozen `msgspec.Struct` fields as invariant, covariant records keep `TypeVar` variance
    "zip-without-explicit-strict",                                                                                                                                                                                   # `strict=True` asserts lengths the code constructs
    "batched-without-explicit-strict",                                                                                                                                                                               # `strict=True` asserts lengths the code constructs
    "subprocess-without-shell-equals-true",                                                                                                                                                                          # Reports every argument-vector `subprocess` call
    "start-process-with-partial-path",                                                                                                                                                                               # Commands name tools mise places on `PATH`
    "os-path-abspath",                                                                                                                                                                                               # `os.path.abspath` drops `..` without following symlinks, a combination no `pathlib` member has
    "function-uses-loop-variable",                                                                                                                                                                                   # Reports closures `Result` and `Option` combinators call before the loop advances
    "reimplemented-operator",                                                                                                                                                                                        # Rewrites to `operator` functions typeshed types as returning `Any`, `banned-api` rejects the getters
    "lambda-assignment",                                                                                                                                                                                             # Pushes a `def` statement for a callback each `match` arm binds
    "compare-with-tuple",                                                                                                                                                                                            # PLR1714 reports the form as a set membership PLR6201 accepts
    "blocking-http-call-in-async-function",                                                                                                                                                                          # banned-api rejects every client it names
    "blocking-http-call-httpx-in-async-function",                                                                                                                                                                    # banned-api rejects `httpx`
    "blocking-sleep-in-async-function",                                                                                                                                                                              # banned-api rejects `time.sleep`
    "request-without-timeout",                                                                                                                                                                                       # banned-api rejects every client it names
    "no-explicit-stacklevel",                                                                                                                                                                                        # banned-api rejects `warnings.warn`
    "multiple-starts-ends-with",                                                                                                                                                                                     # refurb FURB102 reports the form on attribute receivers too
    "repeated-append",                                                                                                                                                                                               # refurb FURB113 reports the form on attribute receivers too
    "len-test",                                                                                                                                                                                                      # refurb FURB115 reports every sized length test from its type
    "for-loop-writes",                                                                                                                                                                                               # refurb FURB122 reports the form on `Path.open` handles too
    "readlines-in-for",                                                                                                                                                                                              # refurb FURB129 reports the form on `Path.open` handles too
    "delete-full-slice",                                                                                                                                                                                             # refurb FURB131 reports the form on attribute receivers too
    "check-and-remove-from-set",                                                                                                                                                                                     # refurb FURB132 reports the form on attribute receivers too
    "for-loop-set-mutations",                                                                                                                                                                                        # refurb FURB142 reports the form on attribute receivers too
    "slice-copy",                                                                                                                                                                                                    # refurb FURB145 reports the form on attribute receivers too
    "unnecessary-enumerate",                                                                                                                                                                                         # refurb FURB148 reports the form in comprehensions too
    "true-false-comparison",                                                                                                                                                                                         # refurb FURB149 reports `is` and `==` on bool-typed operands alone
    "hashlib-digest-hex",                                                                                                                                                                                            # refurb FURB181 reports the form on attribute receivers too
    "list-reverse-copy",                                                                                                                                                                                             # refurb FURB187 reports the form on attribute receivers too
]
flake8-bandit             = { check-typed-exception = true }
flake8-import-conventions = { extend-aliases = { "dask.array" = "da", "dask.dataframe" = "dd", datetime = "datetime", scipy = "sp", sympy = "sym", xarray = "xr" }, banned-from = ["builtins"] }
flake8-pytest-style       = { parametrize-names-type = "csv", raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError", "pydantic.ValidationError"] }
flake8-type-checking      = { runtime-evaluated-base-classes = ["msgspec.Struct"] }
isort                     = { combine-as-imports = true, force-sort-within-sections = true, order-by-type = false, split-on-trailing-comma = false }
pycodestyle               = { max-line-length = 300 }
pydocstyle                = { convention = "google" }
pydoclint                 = { ignore-one-line-docstrings = true }
pylint                    = { allow-magic-value-types = ["str", "bytes", "int"], allow-dunder-method-names = ["__array__"], max-args = 8 }

[tool.ruff.lint.per-file-ignores]
"tests/**"                                      = ["assert"]
"{libs/python/blender,apps/blender}/**"         = [
    "boolean-positional-value-in-call",                                                     # bpy, gpu, RNA writes, and `Ok` take booleans as values (`gpu.state.scissor_test_set(True)`, `Ok(True)`)
    "import-private-name",                                                                  # Blender (`_bpy_internal`, `_blendfile_header`) and Windows (`_winapi`) supply private modules with no public form
    "no-self-use",                                                                          # Structural `Row`, `Part`, and `Effect` protocol methods read no `self`, and `@override` rejects a method with no base class
]
"apps/blender/**"                               = ["non-empty-init-module"]                 # Extension `__init__.py` composes the `register` and `unregister` entry points Blender imports
"libs/python/blender/bpy/ui/layout/sections.py" = ["boolean-type-hint-positional-argument"] # `Enum` unpacks each `Verb` member tuple into `__init__` positionally

[tool.ruff.lint.flake8-tidy-imports]
require-lazy = [
    "adbc_driver_flightsql",
    "adbc_driver_snowflake",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "xarray",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
