# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exists-check-before-file-operation-rust
language: rust
severity: error
utils:
    no-arguments:
        has: {field: arguments, not: {has: {pattern: $_}}}
    path-argument:
        any:
            - kind: reference_expression
              has: {field: value, pattern: $PATH}
            - pattern: $PATH
              not: {kind: reference_expression}
    metadata-read:
        kind: call_expression
        any:
            - all:
                - has: {field: function, regex: '^((::)?tokio::fs::|fs::|(::)?fs_err::(tokio::)?)(metadata|symlink_metadata)$'}
                - has: {field: arguments, has: {nthChild: 1, matches: path-argument}}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $PATH}}, {has: {field: field, regex: '^fs_err_(metadata|symlink_metadata)$'}}]}
                - matches: no-arguments
    exists-test:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $PATH}}, {has: {field: field, regex: '^fs_err_try_exists$'}}]}
                - matches: no-arguments
            - all:
                - has: {field: function, regex: '^((::)?tokio::fs::|fs::|(::)?fs_err::(tokio::)?)(exists|try_exists)$'}
                - has: {field: arguments, has: {nthChild: 1, matches: path-argument}}
    metadata-test:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: value, any: [{matches: metadata-read}, {kind: await_expression, has: {nthChild: 1, matches: metadata-read}}]}}
            - matches: no-arguments
    present:
        any:
            - matches: exists-test
            - matches: metadata-test
              has: {field: function, has: {field: field, regex: '^is_ok$'}}
            - kind: 'try_expression, await_expression, parenthesized_expression'
              has: {nthChild: 1, matches: present}
    absent:
        any:
            - kind: unary_expression
              regex: '^!'
              has: {matches: present}
            - matches: metadata-test
              has: {field: function, has: {field: field, regex: '^is_err$'}}
            - kind: parenthesized_expression
              has: {nthChild: 1, matches: absent}
    operation:
        kind: call_expression
        pattern: $SITE
        any:
            - all:
                - has: {field: function, regex: '^(((::)?(std|tokio)::)?fs::|(::)?fs_err::(tokio::)?)(read|read_to_string|read_dir|read_link|metadata|symlink_metadata|canonicalize|remove_file|remove_dir|remove_dir_all|create_dir|create_dir_all|copy|rename|hard_link|File::open|File::create_new)$|^File::(open|create_new)$'}
                - has: {field: arguments, has: {nthChild: 1, matches: path-argument}}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $PATH}}, {has: {field: field, regex: '^(fs_err_)?(metadata|symlink_metadata|read_dir|read_link|canonicalize)$'}}]}
                - matches: no-arguments
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^open$'}}, {has: {field: value, regex: '^(((::)?(std|tokio)::)?(fs::)?|(::)?fs_err::(tokio::)?)OpenOptions::new\(\)'}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: path-argument}}
    owner:
        kind: 'function_item, closure_expression'
    diverging:
        any:
            - kind: 'return_expression, continue_expression, break_expression'
            - kind: expression_statement
              has: {kind: 'return_expression, continue_expression, break_expression'}
            - kind: macro_invocation
              has: {field: macro, regex: '^(bail|todo|unreachable|panic)$'}
            - kind: expression_statement
              has: {kind: macro_invocation, has: {field: macro, regex: '^(bail|todo|unreachable|panic)$'}}
    guard:
        kind: expression_statement
        has:
            kind: if_expression
            all:
                - has: {field: condition, any: [{matches: absent}, {has: {stopBy: end, matches: absent}}]}
                - not: {has: {field: alternative, pattern: $_}}
                - has: {field: consequence, matches: {rust-single-statement: {first: {matches: diverging}}}}
    guarded-statement:
        follows: {stopBy: end, matches: guard}
rule:
    all:
        - matches: operation
        - any:
            - inside:
                kind: if_expression
                stopBy: {matches: owner}
                all:
                    - has: {field: condition, any: [{matches: present}, {has: {stopBy: end, matches: present}}]}
                    - has: {field: consequence, has: {stopBy: end, pattern: $SITE}}
            - inside:
                kind: if_expression
                stopBy: {matches: owner}
                all:
                    - has: {field: condition, any: [{matches: absent}, {has: {stopBy: end, matches: absent}}]}
                    - has: {field: alternative, has: {stopBy: end, pattern: $SITE}}
            - inside:
                kind: closure_expression
                stopBy: {matches: owner}
                inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: field_expression, all: [{has: {field: value, matches: present}}, {has: {field: field, regex: '^(then|then_some)$'}}]}}}
            - matches: guarded-statement
            - inside: {stopBy: {kind: 'block, function_item, closure_expression'}, matches: guarded-statement}
message: '`$SITE` runs after a test that `$PATH` exists'
note: 'Delete the existence test and match `io::ErrorKind::NotFound` on operation error, `AlreadyExists` for `create_dir` and `create_new`'
