id: require-os-condition-on-exec
valid:
    - '<Exec Command="dotnet build" WorkingDirectory="chmod" />'
    - |
      <Target Name="YakBuild" DependsOnTargets="YakStage" Condition="'$(YakPackageSlug)' != ''"><Exec Command="yak build --platform mac"
        WorkingDirectory="$(YakPackageDirectory)" /></Target>
    - |
      <Target Name="Generate"><Exec Command="bash generate.sh" /></Target>
    - |
      <Target Name="Generate"><Exec Command="pwsh generate.ps1" /></Target>
    - |
      <Target Name="RetargetTorchLibompInstallName" AfterTargets="CopyFilesToOutputDirectory" Condition="$([MSBuild]::IsOSPlatform('OSX'))">
        <Exec Command="install_name_tool -change $(_OldName) @loader_path/libomp.dylib '%(_D.FullPath)' &amp;&amp; codesign -s - '%(_D.FullPath)'" />
      </Target>
    - |
      <Target Name="MakeExecutable" AfterTargets="Build"><Exec Command="chmod +x $(OutDir)mytool"
        Condition="!$([MSBuild]::IsOSPlatform('Windows'))" /></Target>
    - |
      <Target Name="Version" AfterTargets="Build"><Exec Command="dotnet --version" /></Target>
    - |
      <Target Name="Stamp" AfterTargets="Build" Condition="'$(OS)' == 'Windows_NT'"><Exec Command="cmd /c echo stamped" /></Target>
    - |
      <Target Name="Perms"><ItemGroup><_Step Include="perm" Command="chmod +x $(OutDir)mytool" /></ItemGroup></Target>
    - |
      <Target Name="Setup" AfterTargets="Build"><Exec Command="./setup.sh" EnvironmentVariables="SHELL=/bin/bash" /></Target>
    - |
      <Target Name="Perms" Condition="$([MSBuild]::IsOsUnixLike())"><Exec Command="chmod +x $(OutDir)tool" /></Target>
    - |
      <Exec Command="chmod +x tool" Condition="'$(OS)' != 'Windows_NT'" />
invalid:
    - |
      <Target Name="Perms" AfterTargets="Build"><Exec Command='chmod +x $(OutDir)mytool' /></Target>
    - |
      <Target Name="MakeExecutable" AfterTargets="Build"><Exec Command="chmod +x $(OutDir)mytool" /></Target>
    - |
      <Target Name="Stamp" AfterTargets="Build"><Exec Command="cmd /c echo stamped" /></Target>
    - |
      <Target Name="Deps" BeforeTargets="Build"><Exec Command="brew install libomp" /></Target>
    - |
      <Target Name="Sign" AfterTargets="Build"><Exec Command="/usr/bin/codesign --force --sign - $(TargetPath)" /></Target>
    - |
      <Target Name="MakeExecutable" AfterTargets="Build"><Exec Command="chmod +x $(OutDir)mytool" EnvironmentVariables="HOST_OS=$(OS)" /></Target>
    - '<Exec Condition="true" Command="chmod +x tool" />'
    - |
      <Target Name="Deps" BeforeTargets="Build"><Exec Command="apt-get install -y libomp-dev" /></Target>
    - |
      <Exec Command="brew install libomp" Condition='$(Feature) == "deps"' />
    - |
      <Exec Command="cmd /c echo stamped" Condition="'$(Count)' > '0'" />
    - |
      <Exec Command="chmod +x tool" Condition="'$(Feature)' == 'IsOSPlatform'" />
    - |
      <Target Name="Deps"><Exec Command="sudo apt-get install -y libomp-dev" /></Target>
    - |
      <Target Name="Sign"><Exec Command="&quot;/usr/bin/codesign&quot; --force $(TargetPath)" /></Target>
    - |
      <Target Name="Perms"><Exec Command="
        chmod +x $(OutDir)tool
      " /></Target>
    - |
      <Target Name="Perms"><Exec Command="chmod +x $(OutDir)tool &amp;&amp; codesign -s - $(OutDir)tool" /></Target>
    - |
      <Target Name="Stamp"><Exec Command="powershell -Command Get-Date" /></Target>
    - |
      <Target Name="Stamp"><Exec Command="cmd.exe /c echo stamped" /></Target>
