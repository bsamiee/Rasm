# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-offset-pagination
language: sql
severity: error
rule:
    kind: limit_clause
    pattern: $LIMIT
    any:
        - all:
            - has: {regex: '(?i-u)^offset$'}
            - has: {nthChild: {position: 2, ofRule: &named {not: {kind: 'line_comment, block_comment'}}}, pattern: $SKIP, not: {kind: numeric_literal}}
        - all: [{has: {regex: '^,$'}}, {has: {nthChild: {position: 1, ofRule: *named}, pattern: $SKIP, not: {kind: numeric_literal}}}]
message: '`$LIMIT` pages through offset `$SKIP`'
note: 'Page by key with `where <key> > <last key> order by <key> limit <count>` on a unique `<key>`'
