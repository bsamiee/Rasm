utils:
    identity: {kind: Name, regex: '^(?:id|Id|ID|xml:id|name|key|Key|ref|label|Label|pattern)$|Name$'}
rewriters:
    - {id: elide, rule: {kind: 'AttText, EntityText', not: {inside: {has: {kind: Name, pattern: Condition}}}}, fix: '…'}
    - {id: comment, rule: {kind: Comment}, fix: ''}
    - id: entry
      rule: {kind: content, pattern: $SEGMENT}
      transform:
        BARE: rewrite($SEGMENT, rewriters=[comment])
      fix: $BARE/
    - id: lineage
      rule:
        kind: STag
        inside: {kind: element, inside: {kind: content, inside: {kind: element, inside: {kind: content}, has: {kind: STag, pattern: $UP}}}}
        any:
            - inside: {kind: element, follows: {kind: element, stopBy: {kind: element}, all: [{has: {kind: STag, has: {kind: Name, pattern: key}}}, {has: {kind: content, pattern: $ENTRY}}]}}
            - has: {kind: Attribute, all: [{has: {kind: Name, pattern: key}}, {has: {field: value, pattern: $KEYED}}]}
            - all: [{has: {kind: Name, pattern: $KIND}}, {has: {kind: Attribute, all: [{has: {matches: identity}}, {has: {field: value, pattern: $LABEL}}]}}]
            - kind: STag
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
        ENTRY_PART: {rewrite: {source: $ENTRY, rewriters: [entry], joinBy: ''}}
        KEYED_PART: replace($KEYED, replace='$', by='/')
        KIND_PART: replace($KIND, replace='$', by=' ')
        LABEL_PART: replace($LABEL, replace='$', by='/')
      fix: $ABOVE$ENTRY_PART$KEYED_PART$KIND_PART$LABEL_PART
transform:
    ELIDED: rewrite($TAG, rewriters=[elide])
    SIGNATURE: replace($ELIDED, replace='[\t\n\r ]*\n[\t\n\r ]*', by=' ')
    NAME: replace($TARGET, replace='[\t\n\r ]*\n[\t\n\r ]*', by=' ')
    INSTRUCTION: replace($TARGET, replace='^(.+)$', by='<?$1?>')
    SUFFIX_LINE: replace($IDENTITY, replace='^[\t\n\r ]*|[\t\n\r ]*\n[\t\n\r ]*', by=' ')
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    QUALIFIER_LINE: replace($QUALIFIER, replace='[\t\n\r ]*\n[\t\n\r ]*', by=' ')
variants:
    text:
        transform:
            ELIDED: rewrite($TEXT, rewriters=[elide])
---
id: xml-error
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, kind: 'element, Attribute, StyleSheetPI, XmlModelPI, ExternalID, PEReference, PI, XMLDecl, doctypedecl, elementdecl, AttlistDecl, GEDecl, PEDecl, NotationDecl'}}}
        - {kind: 'Name, Comment, STag, EmptyElemTag, element', all: [{inside: {kind: ERROR}}, {nthChild: {position: 1, ofRule: {kind: 'Name, Comment, STag, EmptyElemTag, element'}}}]}
        - {kind: Name, any: [{regex: '^$'}, {precedes: {stopBy: end, regex: '^$'}}]}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: xml-root
role: item
symbolType: module
rule:
    kind: Name
    pattern: $NAME
    inside: {kind: 'STag, EmptyElemTag', pattern: $TAG, inside: {kind: element, inside: {kind: 'document, ERROR'}}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: xml-import
role: item
symbolType: module
utils:
    project-child: {inside: {kind: content, inside: {kind: element, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}}
rule:
    any:
        - {kind: Attribute, pattern: $TAG, inside: {kind: 'STag, EmptyElemTag', inside: {kind: element, inside: {kind: 'document, ERROR'}}}, all: [{has: {kind: Name, regex: 'xmlns|chemaLocation'}}, {has: {field: value, pattern: $TARGET}}]}
        - {kind: Attribute, pattern: $TAG, inside: {kind: 'STag, EmptyElemTag', has: {kind: Name, pattern: Project}, inside: {kind: element, inside: {kind: 'document, ERROR'}}}, all: [{has: {kind: Name, pattern: Sdk}}, {has: {field: value, pattern: $TARGET}}]}
        - {kind: 'StyleSheetPI, XmlModelPI', pattern: $TAG, has: {kind: PseudoAtt, all: [{has: {kind: Name, pattern: href}}, {has: {field: value, pattern: $TARGET}}]}}
        - {kind: ExternalID, pattern: $TAG, not: {inside: {kind: NotationDecl}}, has: {kind: SystemLiteral, has: {kind: URI, pattern: $TARGET}}}
        - {kind: PEReference, inside: {kind: doctypedecl}, all: [{pattern: $TAG}, {pattern: $TARGET}]}
        - kind: element
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, regex: '(?:^|:)(?:include|import|redefine|override|import-schema|use-package|externalRef)$'}
                - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: name}, {pattern: href}, {pattern: namespace}, {pattern: schemaLocation}, {pattern: schema-location}]}}, {has: {field: value, pattern: $TARGET}}]}
        - kind: element
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            all:
                - has: {kind: Name, any: [{pattern: Import}, {pattern: Sdk}]}
                - has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: Project}, {pattern: Name}]}}, {has: {field: value, pattern: $TARGET}}]}
          any:
            - inside: {kind: content, inside: {kind: element, matches: project-child, has: {kind: STag, pattern: $GROUP, has: {kind: Name, pattern: ImportGroup}}}}
            - matches: project-child
transform:
    PREFIX_LINE: replace($GROUP, replace='[\t\n\r ]*\n[\t\n\r ]*|$', by=' ')
name: $NAME
signature: $PREFIX_LINE$SIGNATURE
isImport: true
isExported: false
---
id: xml-divider
role: item
symbolType: namespace
rule: {kind: Comment, regex: '^<!--[\t\n\r ]*\[[0-9A-Z_]+\][\t\n\r ]*-->$', pattern: $DIVIDER, not: {inside: {kind: ERROR}}}
transform:
    LABEL: {replace: {source: $DIVIDER, replace: '^<!--[\t\n\r ]*\[([0-9A-Z_]+)\][\t\n\r ]*-->$', by: '${1}'}}
name: $LABEL
signature: <!-- [$LABEL] -->
isExported: false
---
id: xml-interface
role: item
symbolType: interface
rule: {kind: Name, pattern: $NAME, inside: {kind: doctypedecl}}
name: $NAME
signature: <!DOCTYPE $NAME>
isExported: false
---
id: xml-instruction
role: item
symbolType: event
rule:
    any: [{kind: PI, has: {kind: PITarget, pattern: $TARGET}}, {kind: XMLDecl, pattern: $TAG, has: {regex: xml, pattern: $$NAME}}]
transform:
    SIGNATURE: replace($TAG, replace='[\t\n\r ]*\n[\t\n\r ]*', by=' ')
name: $NAME$TARGET
signature: $SIGNATURE$INSTRUCTION
isExported: false
---
id: xml-namespace
role: item
symbolType: namespace
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: Solution}}}}
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, pattern: Folder}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: Name}}, {has: {field: value, pattern: $TARGET}}]}}]}
name: $NAME
signature: $SIGNATURE
---
id: xml-solution-project
role: item
symbolType: module
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: Solution}}}}
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, pattern: Project}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: Path}}, {has: {field: value, pattern: $TARGET}}]}}]}
name: $NAME
signature: $SIGNATURE
---
id: xml-using-task
role: item
symbolType: class
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, pattern: UsingTask}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: TaskName}}, {has: {field: value, pattern: $TARGET}}]}}]}
name: $NAME
signature: $SIGNATURE
---
id: xml-function
role: item
symbolType: function
utils:
    hidden: {any: [{all: [{has: {kind: Name, pattern: Name}}, {has: {field: value, regex: '^_'}}]}, {all: [{has: {kind: Name, pattern: visibility}}, {has: {field: value, regex: 'private|hidden'}}]}]}
rule:
    kind: element
    any:
        - inside: {kind: content, inside: {kind: element, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}
          has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, pattern: Target}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: Name}}, {has: {field: value, pattern: $TARGET}}]}}]}
        - has: {kind: 'STag, EmptyElemTag', pattern: $TAG, has: {kind: Name, any: [{pattern: template}, {pattern: function}, {regex: ':(?:template|function)$'}]}, any: [{has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: match}}, {has: {field: value, pattern: $TARGET}}]}}]}
name: $NAME
signature: $SIGNATURE
isExported: {not: {has: {kind: 'STag, EmptyElemTag', has: {kind: Attribute, matches: hidden}}}}
---
id: xml-struct
role: item
symbolType: struct
rule:
    any:
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, regex: '(?:^|:)(?:complexType|simpleType|group|attributeGroup|element|define|attribute-set|character-map)$'}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}}]}
        - {kind: 'elementdecl, AttlistDecl', pattern: $TAG, has: {kind: 'Name, PEReference', pattern: $TARGET}}
name: $NAME
signature: $SIGNATURE
---
id: xml-property
role: item
symbolType: property
rule:
    kind: element
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, any: [{pattern: attribute}, {regex: ':attribute$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}}]}
name: $NAME
signature: $SIGNATURE
---
id: xml-variable
role: item
symbolType: variable
rule:
    kind: element
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, any: [{pattern: variable}, {pattern: param}, {regex: ':(?:variable|param)$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}}]}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
isExported: {not: {has: {kind: 'STag, EmptyElemTag', has: {kind: Attribute, all: [{has: {kind: Name, pattern: visibility}}, {has: {field: value, regex: 'private|hidden'}}]}}}}
---
id: xml-constant
role: item
symbolType: constant
rule:
    any:
        - {kind: 'Name, PEReference', pattern: $TARGET, inside: {kind: 'GEDecl, PEDecl, NotationDecl', pattern: $TAG}}
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, any: [{pattern: notation}, {regex: ':notation$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: name}}, {has: {field: value, pattern: $TARGET}}]}}]}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
---
id: xml-section
role: item
symbolType: array
rule:
    kind: element
    inside: {kind: content, inside: {kind: element, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: configuration}}}}
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, has: {kind: Name, pattern: $NAME}}
name: $NAME
signature: $SIGNATURE
---
id: xml-element
role: item
symbolType: object
utils:
    project: {inside: {kind: element, stopBy: end, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, pattern: Project}}}}
rule:
    kind: element
    inside: {kind: content}
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        has: {kind: Name, pattern: $TYPE}
        any:
            - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^(?:id|Id|ID|xml:id|name|key|Key|ref|label|Label|pattern)$|Name$'}}, {has: {field: value, pattern: $IDENTITY}}]}
            - not: {inside: {kind: element, stopBy: end, inside: {kind: 'document, ERROR'}, has: {kind: STag, has: {kind: Name, regex: '(?:^|:)svg$'}}}}
            - inside: {kind: element, has: {kind: content, has: {kind: Attribute, stopBy: end, has: {kind: Name, pattern: id}}}}
    any:
        - inside: {kind: content, inside: {kind: element, has: {kind: STag, pattern: $BRANCH, has: {kind: Name, any: [{pattern: When}, {pattern: Otherwise}]}}}}
        - kind: element
constraints:
    TYPE: {not: {all: [{any: [{pattern: Choose}, {pattern: When}, {pattern: Otherwise}, {pattern: ImportGroup}]}, {matches: project}]}}
transform:
    PREFIX_LINE: replace($BRANCH, replace='[\t\n\r ]*\n[\t\n\r ]*|$', by=' ')
name: $TYPE$SUFFIX_LINE
signature: $PREFIX_LINE$SIGNATURE
isExported: {has: {kind: 'STag, EmptyElemTag', has: {kind: Name, any: [{pattern: PropertyGroup}, {pattern: ItemGroup}, {pattern: ItemDefinitionGroup}], matches: project}}}
---
id: xml-member-property
role: member
parentRuleIds: [xml-element, xml-function, xml-using-task, xml-struct, xml-property]
symbolType: property
variants: [text]
rule:
    any:
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TEXT, has: {kind: Name, pattern: $TARGET}}
          inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, any: [{pattern: PropertyGroup}, {pattern: ParameterGroup}]}}}}
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TEXT, all: [{has: {kind: Name, any: [{pattern: Output}, {pattern: attribute}, {regex: ':attribute$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: PropertyName}, {pattern: name}, {pattern: ref}]}}, {has: {field: value, pattern: $TARGET}}]}}]}
        - {kind: 'Name, PEReference', pattern: $TARGET, inside: {kind: AttDef, pattern: $DEFINITION}}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
transform:
    DEFINITION_ELIDED: rewrite($DEFINITION, rewriters=[elide])
    DEFINITION_LINE: replace($DEFINITION_ELIDED, replace='[\t\n\r ]*\n[\t\n\r ]*', by=' ')
name: $NAME
signature: $SIGNATURE$DEFINITION_LINE
isPublic: {not: {has: {kind: 'STag, EmptyElemTag', any: [{has: {kind: Name, regex: '^_'}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: PropertyName}}, {has: {field: value, regex: '^_'}}]}}]}}}
---
id: xml-member-variable
role: member
parentRuleIds: [xml-element, xml-function]
symbolType: variable
variants: [text]
utils:
    item-group-child: {inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, any: [{pattern: ItemGroup}, {pattern: ItemDefinitionGroup}]}}}}}
    specification: {any: [{has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: Include}, {pattern: Update}, {pattern: Remove}]}}, {has: {field: value, pattern: $SPECIFICATION}}]}}, {kind: 'STag, EmptyElemTag'}]}
    hidden: {any: [{has: {kind: Name, regex: '^_|(?:^|:)variable$'}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: ItemName}}, {has: {field: value, regex: '^_'}}]}}]}
rule:
    any:
        - kind: element
          matches: item-group-child
          not: {has: {kind: content, has: {kind: element}}}
          has: {kind: 'STag, EmptyElemTag', pattern: $TEXT, has: {kind: Name, pattern: $TARGET}, matches: specification}
        - {kind: STag, pattern: $TEXT, has: {kind: Name, pattern: $TARGET}, matches: specification, inside: {kind: element, matches: item-group-child, has: {kind: content, has: {kind: element}}}}
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TEXT, all: [{has: {kind: Name, any: [{pattern: Output}, {pattern: param}, {pattern: variable}, {regex: ':(?:param|variable)$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: ItemName}, {pattern: name}]}}, {has: {field: value, pattern: $TARGET}}]}}]}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
transform:
    SUFFIX_LINE: replace($SPECIFICATION, replace='^[\t\n\r ]*|[\t\n\r ]*\n[\t\n\r ]*', by=' ')
name: $NAME$SUFFIX_LINE
signature: $SIGNATURE
isPublic: {not: {any: [{matches: hidden}, {has: {kind: 'STag, EmptyElemTag', matches: hidden}}]}}
---
id: xml-member-method
role: member
parentRuleIds: [xml-function]
symbolType: method
rule:
    kind: STag, EmptyElemTag
    pattern: $TAG
    has: {kind: Name, pattern: $NAME, not: {any: [{pattern: PropertyGroup}, {pattern: ItemGroup}, {pattern: OnError}]}}
    inside: {kind: element, inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, pattern: Target}}}}}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
isPublic: false
---
id: xml-member-object
role: member
parentRuleIds: [xml-function]
symbolType: object
rule:
    kind: STag
    pattern: $TAG
    has: {kind: Name, pattern: $NAME, any: [{pattern: PropertyGroup}, {pattern: ItemGroup}]}
    all: [{has: {kind: Attribute}}, {inside: {kind: element, inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, pattern: Target}}}}}}]
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
isPublic: false
---
id: xml-member-event
role: member
parentRuleIds: [xml-element, xml-function, xml-using-task, xml-struct]
symbolType: event
rule:
    any:
        - {kind: element, has: {kind: 'STag, EmptyElemTag', pattern: $TAG, has: {kind: Name, all: [{pattern: OnError}, {pattern: $NAME}]}}}
        - {kind: PI, has: {kind: PITarget, pattern: $TARGET}}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME$TARGET
signature: $SIGNATURE$INSTRUCTION
isPublic: false
---
id: xml-member-module
role: member
parentRuleIds: [xml-element, xml-namespace, xml-struct]
symbolType: module
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: $TAG
        any:
            - all: [{has: {kind: Name, pattern: Project}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: Path}}, {has: {field: value, pattern: $TARGET}}]}}]
            - all: [{has: {kind: Name, any: [{pattern: include}, {regex: ':include$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: href}}, {has: {field: value, pattern: $TARGET}}]}}]
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
---
id: xml-namespace-file
role: member
parentRuleIds: [xml-namespace]
symbolType: file
rule:
    kind: element
    has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, pattern: File}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: Path}}, {has: {field: value, pattern: $TARGET}}]}}]}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
---
id: xml-member-case
role: member
parentRuleIds: [xml-struct, xml-property]
symbolType: enumMember
rule:
    any:
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TAG, all: [{has: {kind: Name, any: [{pattern: enumeration}, {regex: ':enumeration$'}]}}, {has: {kind: Attribute, all: [{has: {kind: Name, pattern: value}}, {has: {field: value, pattern: $TARGET}}]}}]}
        - {kind: Nmtoken, inside: {kind: Enumeration}, all: [{pattern: $TARGET}, {pattern: $TAG}]}
        - {kind: Name, inside: {kind: NotationType}, all: [{pattern: $TARGET}, {pattern: $TAG}]}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
name: $NAME
signature: $SIGNATURE
---
id: xml-member-key
role: member
parentRuleIds: [xml-element, xml-section]
symbolType: key
utils:
    attributed: {has: {kind: Attribute, all: [{has: {kind: Name, pattern: key}}, {has: {field: value, pattern: $KEY}}]}}
    owned: {inside: {kind: content, inside: {kind: element, inside: {kind: content}, has: {kind: STag, pattern: $OWNER}}}}
rule:
    any:
        - {kind: element, matches: owned, not: {has: {kind: content, has: {kind: element}}}, has: {kind: 'STag, EmptyElemTag', pattern: $TEXT, matches: attributed}}
        - {kind: STag, pattern: $TEXT, matches: attributed, inside: {kind: element, matches: owned, has: {kind: content, has: {kind: element}}}}
        - kind: element
          pattern: $TEXT
          inside: {kind: content, inside: {kind: element, has: {kind: STag, pattern: $OWNER, has: {kind: Name, pattern: dict}}}}
          all: [{has: {kind: STag, has: {kind: Name, pattern: key}}}, {has: {kind: content, pattern: $KEY}}]
          any: [{precedes: {kind: element, stopBy: {kind: element}, has: {kind: 'STag, EmptyElemTag', pattern: $VALUE}}}, {kind: element}]
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
transform:
    KEY_BARE: rewrite($KEY, rewriters=[comment])
    NAME: replace($KEY_BARE, replace='[\t\n\r ]*\n[\t\n\r ]*', by=' ')
    VALUE_LINE: replace($VALUE, replace='^|[\t\n\r ]*\n[\t\n\r ]*', by=' ')
    ELIDED: rewrite($TEXT, rewriters=[elide, comment])
name: $QUALIFIER_LINE$NAME
signature: $SIGNATURE$VALUE_LINE
---
id: xml-member-field
role: member
parentRuleIds: [xml-element, xml-function, xml-struct, xml-solution-project, xml-namespace, xml-section, xml-import, xml-property]
symbolType: field
utils:
    identified: {has: {kind: Attribute, all: [{has: {matches: identity}}, {has: {field: value, pattern: $IDENTITY}}]}}
    owned:
        inside:
            kind: content
            inside:
                kind: element
                not: {has: {kind: STag, has: {kind: Name, any: [{pattern: dict}, {pattern: When}, {pattern: Otherwise}, {pattern: Target}]}}}
                inside: {kind: content}
                has: {kind: STag, pattern: $OWNER}
rule:
    any:
        - kind: element
          has: {kind: 'STag, EmptyElemTag', pattern: $TAG, has: {kind: Name, pattern: $NAME}}
          inside:
            kind: content
            inside:
                kind: element
                has: {kind: STag, has: {kind: Name, pattern: $METADATA}, any: [{has: {kind: Attribute, all: [{has: {kind: Name, any: [{pattern: Include}, {pattern: Update}, {pattern: Remove}]}}, {has: {field: value, pattern: $SPECIFICATION}}]}}, {kind: STag}]}
                inside: {kind: content, inside: {kind: element, has: {kind: STag, has: {kind: Name, any: [{pattern: ItemGroup}, {pattern: ItemDefinitionGroup}]}}}}
        - kind: element
          matches: owned
          not: {has: {kind: content, has: {kind: element}}}
          has:
            kind: STag, EmptyElemTag
            pattern: $TAG
            has: {kind: Name, pattern: $NAME}
            any: [{matches: identified}, {kind: EmptyElemTag, not: {has: {kind: Attribute}}}, {precedes: {kind: content, not: {any: [{regex: '^[\t\n\r ]*$'}, {has: {kind: 'CDSect, PI'}}]}}}]
        - {kind: STag, pattern: $TAG, has: {kind: Name, pattern: $NAME}, matches: identified, inside: {kind: element, matches: owned, has: {kind: content, has: {kind: element}}}}
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
transform:
    SPECIFICATION_LINE: replace($SPECIFICATION, replace='^[\t\n\r ]*|[\t\n\r ]*\n[\t\n\r ]*', by=' ')
    PARENT: replace($METADATA, replace='.+', by='/')
name: $METADATA$SPECIFICATION_LINE$PARENT$QUALIFIER_LINE$NAME$SUFFIX_LINE
signature: $SIGNATURE
