name: Release

on:
    workflow_dispatch: {}

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    version:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: write
        outputs:
            commit: ${{ steps.commit.outputs.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0
            - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install
            - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - run: nx release --skip-publish
              env:
                  GH_TOKEN: ${{ github.token }}
            - id: commit
              run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    build:
        needs: version
        strategy:
            matrix:
                include:
                    - runner: ubuntu-26.04
                      projects: tag:release,!tag:os:darwin,!tag:os:win32
                    - runner: xcode-27
                      projects: tag:os:darwin
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
        env:
            DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.commit }}
                  persist-credentials: false
            - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install
            - if: matrix.runner == 'xcode-27'
              uses: mcneel/setup-rhino3d@b3faf87453962c0742ab2a5e72d3494505f660df # v3.0.0
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  release-version: wip
            - run: nx run-many --targets=build --configuration=release --projects="$PROJECTS"
              env:
                  PROJECTS: ${{ matrix.projects }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-${{ matrix.runner }}
                  path: |
                      .artifacts/
                      **/dist/
                      !**/node_modules/
                  if-no-files-found: error

    publish:
        needs: [version, build]
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        environment: release
        permissions:
            contents: write
            id-token: write
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.commit }}
                  persist-credentials: false
            - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install --ignore-scripts
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: release-*
                  merge-multiple: true
            - id: nuget
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              with:
                  user: ${{ secrets.NUGET_USER }}
            - run: nx release publish --excludeTaskDependencies
              env:
                  GH_TOKEN: ${{ github.token }}
                  NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
