name: Setup
description: Installs toolchain and dependencies, restores the task cache

outputs:
    task-paths:
        description: Paths the job saves into the task cache after its checks
        value: ${{ steps.tasks.outputs.paths }}
    task-key:
        description: Key the job saves the task cache under
        value: ${{ steps.tasks.outputs.key }}

runs:
    using: composite
    steps:
        - id: tree
          run: printf 'sha=%s\n' "$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
          shell: bash
        - uses: nrwl/nx-set-shas@v5
          with:
            fallback-sha: ${{ steps.tree.outputs.sha }}
        - uses: maxim-lobanov/setup-xcode@v1.7.0
          if: runner.os == 'macOS'
        - id: rustup
          uses: actions/cache/restore@v6
          with:
            path: ~/.rustup/toolchains
            key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
        - uses: jdx/mise-action@v5.2.6
          env:
            MISE_PYTHON_UV_VENV_AUTO: create|source
            MISE_ENABLE_TOOLS: >-
                aqua:nextest-rs/nextest/cargo-nextest,cmake,docker-cli,dotnet,dotnet:minver-cli,fd,github:fonttools/fontspector,github:linebender/resvg,github:sbdchd/squawk,github:trailofbits/dylint,jq,node,pnpm,python,resvg,ripgrep,rust,uv
                ${{ runner.os == 'macOS' && ',ast-grep,github:NationalSecurityAgency/ghidra,github:pmd/pmd,google-java-format,hk,imagemagick,jactionlint,java,periphery,shellcheck,shfmt,swiftlint,tombi,tree-sitter' || '' }}
          with:
            auto_update: true
            minimum_release_age: 0s
            cache_save: ${{ github.event_name == 'push' }}
        - uses: actions/cache/save@v6
          if: github.event_name == 'push' && steps.rustup.outputs.cache-hit != 'true'
          with:
            path: ~/.rustup/toolchains
            key: ${{ steps.rustup.outputs.cache-primary-key }}
        - run: pnpm install --frozen-lockfile
          shell: bash
        - run: uv sync --locked --no-default-groups --group dev
          shell: bash
        - run: playwright install --with-deps --only-shell chromium
          if: runner.os == 'Linux'
          shell: bash
        - id: cargo
          run: printf 'build=%s\n' "$(node -p "require('node:path').relative('.', process.argv[1])" "$(cargo metadata --format-version 1 --no-deps | jq -r .build_directory)")" >> "$GITHUB_OUTPUT"
          shell: bash
        - uses: Swatinem/rust-cache@v2.9.3
          with:
            workspaces: . -> ${{ steps.cargo.outputs.build }}
            cache-directories: ~/.dylint_drivers
            cache-on-failure: true
            save-if: ${{ github.event_name == 'push' }}
        - id: tasks
          run: nx show projects > /dev/null && database=$(basename "$NX_WORKSPACE_DATA_DIRECTORY"/*.db) && prefix="tasks-$RUNNER_OS-$RUNNER_ARCH-${database##*-}-" && printf 'database=%s\nprefix=%s\nkey=%s%s-%s\npaths<<PATHS\n%s\n%s/*-%s\nPATHS\n' "$database" "$prefix" "$prefix" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" "$(jq -r .cacheDirectory nx.json)" "$NX_WORKSPACE_DATA_DIRECTORY" "${database##*-}" >> "$GITHUB_OUTPUT"
          shell: bash
        - id: restored
          uses: actions/cache/restore@v6
          with:
            path: ${{ steps.tasks.outputs.paths }}
            key: ${{ steps.tasks.outputs.key }}
            restore-keys: ${{ steps.tasks.outputs.prefix }}
        - if: steps.restored.outputs.cache-matched-key != ''
          run: find "$NX_WORKSPACE_DATA_DIRECTORY" -maxdepth 1 -name "*-${DATABASE##*-}" ! -name "$DATABASE" -exec mv {} "$NX_WORKSPACE_DATA_DIRECTORY/$DATABASE" \;
          env:
            DATABASE: ${{ steps.tasks.outputs.database }}
          shell: bash
