# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-global-type-reference
language: tsxlang
arguments: [name]
utils:
    declaration:
        any:
            - kind: class, class_declaration, abstract_class_declaration, interface_declaration, type_alias_declaration, enum_declaration, internal_module
              has: {field: name, pattern: $TYPE}
            - kind: expression_statement
              has: {kind: internal_module, has: {field: name, pattern: $TYPE}}
            - kind: import_alias
              has: {kind: identifier, nthChild: {position: 1, ofRule: {kind: 'identifier, undefined'}}, pattern: $TYPE}
            - kind: import_statement
              has: {stopBy: end, pattern: $TYPE, matches: typescript-import-binding}
            - kind: export_statement
              has: {matches: declaration}
rule:
    kind: type_identifier
    all:
        - matches: name
        - pattern: $TYPE
        - not:
            inside:
                stopBy: end
                any:
                    - matches: declaration
                    - has: {field: type_parameters, has: {kind: type_parameter, has: {field: name, pattern: $TYPE}}}
                    - kind: statement_block, program
                      has: {matches: declaration}
                    - kind: switch_body
                      has: {kind: 'switch_case, switch_default', has: {matches: declaration}}
