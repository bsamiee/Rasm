# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-codec
language: python
severity: error
rule:
    pattern: $NAME
    any:
        - matches: {python-member-use: {module: {regex: '^json$'}, name: {regex: '^(dumps?|loads?|JSONEncoder|JSONDecoder)$'}}}
        - matches: {python-member-use: {module: {regex: '^json\.encoder$'}, name: {regex: '^JSONEncoder$'}}}
        - matches: {python-member-use: {module: {regex: '^json\.decoder$'}, name: {regex: '^JSONDecoder$'}}}
message: '`$NAME` is the standard library JSON codec'
note: 'Use `msgspec.json.encode` and `msgspec.json.decode(<text>, type=<Type>)`'
