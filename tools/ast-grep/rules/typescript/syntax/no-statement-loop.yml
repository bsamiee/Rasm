# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop
language: tsx
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
        - kind: for_statement, while_statement, do_statement
message: Loop iterates by statement
note: 'Return the results as an expression through `Array.map`, `Array.reduce`, `Array.unfold`, or `Effect.forEach` with `discard` for effects, domain logic stays expression-oriented'
labels:
    LOOP: {style: primary}
