# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-output-by-hand
language: swiftlang
severity: error
utils:
    run-body:
        kind: lambda_literal
        inside: {kind: call_expression, stopBy: {kind: call_expression}, has: {nthChild: 1, regex: '^(Subprocess\.)?run$'}}
    collect:
        kind: for_statement
        all:
            - has: {field: collection, regex: '\.standard(Output|Error)$'}
            - has: {field: item, has: {stopBy: end, kind: simple_identifier, pattern: $BUFFER}}
            - has:
                kind: statements
                all:
                    - not: {has: {nthChild: 2}}
                    - has:
                        nthChild: 1
                        has:
                            stopBy: end
                            kind: call_expression
                            all:
                                - has: {nthChild: 1, regex: '\.withUnsafeBytes$', has: {stopBy: end, kind: simple_identifier, pattern: $BUFFER}}
                                - has: {stopBy: end, kind: call_expression, regex: '\.append\(contentsOf:'}
    sole:
        kind: statements
        not: {has: {nthChild: 2}}
rule:
    pattern: $SITE
    any:
        - matches: swift-output-discarding-loop
          inside:
            matches: run-body
            stopBy: end
            has:
                matches: sole
                has:
                    nthChild: 1
                    any:
                        - matches: swift-output-discarding-loop
                        - has:
                            stopBy: {kind: lambda_literal}
                            kind: call_expression
                            all:
                                - has: {nthChild: 1, regex: '^Result$'}
                                - has: {kind: call_suffix, has: {kind: lambda_literal, has: {matches: sole, has: {matches: swift-output-discarding-loop}}}}
        - matches: collect
          inside: {matches: run-body, stopBy: end}
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` discards or collects output by hand in place of an output option of the run'
note: 'Pass `output: .discarded` for unread output or `.string(limit:)`, `.data(limit:)`, or `.bytes(limit:)` for collected output, with no loop'
