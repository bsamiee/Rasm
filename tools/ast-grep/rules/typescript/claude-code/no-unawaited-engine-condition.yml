# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unawaited-engine-condition
language: tsx
severity: error
files:
    - '**/.claude/plugins/**'
rule:
    kind: call_expression
    matches: {claude-code-engine-call: {noun: {pattern: $_}}}
    all:
        - {not: {has: {field: function, matches: synchronous-member}}}
        - any:
            - {matches: truthiness-use}
            - {inside: {kind: binary_expression, matches: nullable-check}}
        - any:
            - {not: {inside: {matches: syntax-function-boundary, stopBy: {matches: syntax-function-boundary}, regex: '^async\b'}}}
            - {inside: {matches: syntax-function-boundary, stopBy: {matches: syntax-function-boundary}, pattern: $OWNER}}
    pattern: $MATCH
transform:
    AWAIT: {replace: {source: $OWNER, replace: '(?s)^.*$', by: 'await '}}
fix: $AWAIT$MATCH
message: The condition reads the engine call's Promise, a truthy and defined value
note: Await the engine result inside an async hook before testing it, and the caller of a hook made async consumes its Promise
utils:
    synchronous-member:
        kind: member_expression
        has: {field: property, regex: ^(notice|invalidate|log|toast|status|now|after|every)$}
    truthiness-use:
        any:
            - inside:
                field: condition
                kind: if_statement, while_statement, do_statement, for_statement, ternary_expression
            - {inside: {kind: parenthesized_expression, matches: truthiness-use}}
            - {inside: {kind: unary_expression, field: argument, has: {field: operator, regex: ^!$}}}
            - {inside: {kind: binary_expression, field: left, has: {field: operator, regex: ^(&&|\|\|)$}}}
            - inside:
                kind: binary_expression
                field: right
                has: {field: operator, regex: '^(&&|\|\||\?\?)$'}
                matches: truthiness-use
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: ^Boolean$}}}
    nullable-check:
        kind: binary_expression
        all:
            - {has: {field: operator, regex: ^(===|!==|==|!=)$}}
            - {has: {kind: 'undefined, null'}}
labels: {MATCH: {style: primary}}
