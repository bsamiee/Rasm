# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
rule:
    kind: expansion
    all:
        - has: {field: operator, regex: '^:?\+$'}
        - has:
            pattern: $DATA
            any:
                - matches: bash-string-expansion
                - kind: concatenation
                  has: {matches: bash-string-expansion}
        - inside: {kind: 'command, array', stopBy: {not: {kind: concatenation}}}
labels:
    DATA: {style: primary, message: Unquoted alternate data}
message: Unquoted alternate data can split words and expand globs
note: Quote expanded data while preserving existing literal quoting
