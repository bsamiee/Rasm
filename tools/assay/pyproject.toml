# --- [PROJECT] --------------------------------------------------------------------------

[project]
name = "assay"
version = "0.1.0"
description = "Rasm estate gate: one verdict authority dispatching every language lane, proof rail, and contract check."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anyio",
    "beartype",
    "cyclopts",
    "expression",
    "fsspec",
    "msgspec",
    "mutmut",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "psutil",
    "pydantic",
    "pydantic-settings",
    "stamina",
    "structlog",
    "tomlkit",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "universal-pathlib",
    "watchfiles",
    "xxhash",
    "zstandard",
]

[project.scripts]
assay = "assay.__main__:main"

# --- [BUILD] ----------------------------------------------------------------------------

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "assay"

# --- [MUTMUT] ---------------------------------------------------------------------------

[tool.mutmut]
source_paths = ["assay"]
pytest_add_cli_args_test_selection = [
    "../../tests/python/tools/assay",
]
pytest_add_cli_args = [
    "--hypothesis-profile=rasm-mutation",
    "-o",
    "required_plugins=",
    "-m",
    "not benchmark and not network and not subprocess",
]
do_not_mutate = ["assay/__init__.py", "assay/rails/mutation_gate.py"]
mutate_only_covered_lines = true
max_stack_depth = -1
timeout_multiplier = 4.0
timeout_constant = 5.0
