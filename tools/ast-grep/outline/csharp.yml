id: csharp-import
language: csharplang
role: item
symbolType: module
utils:
    named: {pattern: $NAME}
rule:
    pattern: $DECLARATION
    any:
        - {kind: using_directive, has: {matches: named, nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}}}
        - {kind: extern_alias_directive, has: {field: name, matches: named}}
        - {kind: file_based_directive, has: {field: kind, regex: 'sdk|package|project|ref'}, all: [{has: {field: name, matches: named}}]}
rewriters:
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    CLEAN: {replace: {source: $NAME, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: ''}}
    HEADER: rewrite($DECLARATION, rewriters=[trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*|#(?:if|endif)[^\n]*|#el(?:if|se)(?s:.)*?#endif', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $CLEAN
signature: $SIGNATURE
isImport: true
isExported: false
---
id: csharp-file-property
language: csharplang
role: item
symbolType: property
rule:
    kind: file_based_directive
    has: {field: kind, regex: property}
    all: [{has: {field: name, pattern: {context: '#:property $NAME=x', selector: directive_name}}}]
name: $NAME
isExported: false
---
id: csharp-file-selection
language: csharplang
role: item
symbolType: file
rule:
    kind: file_based_directive
    has: {field: kind, regex: 'include|exclude'}
    all: [{has: {field: name, pattern: {context: '#:include $NAME', selector: directive_name}}}]
name: $NAME
isImport: {has: {field: kind, regex: include}}
isExported: false
---
id: csharp-namespace
language: csharplang
role: item
symbolType: namespace
rule:
    kind: alias_qualified_name, generic_name, identifier, qualified_name
    pattern: $NAME
    inside: {kind: 'namespace_declaration, file_scoped_namespace_declaration', field: name}
transform:
    CLEAN: {replace: {source: $NAME, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: ''}}
name: $CLEAN
signature: namespace $CLEAN
isExported: false
---
id: csharp-interface
language: csharplang
role: item
symbolType: interface
utils:
    enclosing: {kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    tooling: {kind: attribute, has: {field: name, regex: '(?:^|[.:])(?:Debugger.+|StackTraceHidden|ExcludeFromCodeCoverage|(?:Unconditional)?SuppressMessage|EditorBrowsable)(?:Attribute)?$'}}
    public: {any: [{has: {kind: modifier, regex: 'public|protected', stopBy: {not: {kind: preproc_if}}}, not: {has: {kind: modifier, regex: private, stopBy: {not: {kind: preproc_if}}}}}, {has: {kind: explicit_interface_specifier}}, {inside: {stopBy: {matches: enclosing}, kind: interface_declaration}, not: {has: {kind: modifier, regex: 'private|internal', stopBy: {not: {kind: preproc_if}}}}}]}
    visible: {matches: public, not: {inside: {stopBy: end, matches: enclosing, not: {matches: public}}}}
rule:
    kind: interface_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}
rewriters:
    - {id: body, rule: {kind: 'declaration_list, enum_member_declaration_list', inside: {field: body, matches: enclosing}}, fix: ''}
    - {id: arguments, rule: {kind: argument_list, has: {kind: argument}, inside: {kind: 'base_list, primary_constructor_base_type, constructor_initializer'}}, fix: '(…)'}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body, arguments, tool-list, tool, attributed, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*|#(?:if|endif)[^\n]*|#el(?:if|se)(?s:.)*?#endif', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: csharp-class
language: csharplang
role: item
symbolType: class
utils:
    enclosing: {kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    tooling: {kind: attribute, has: {field: name, regex: '(?:^|[.:])(?:Debugger.+|StackTraceHidden|ExcludeFromCodeCoverage|(?:Unconditional)?SuppressMessage|EditorBrowsable)(?:Attribute)?$'}}
    public: {any: [{has: {kind: modifier, regex: 'public|protected', stopBy: {not: {kind: preproc_if}}}, not: {has: {kind: modifier, regex: private, stopBy: {not: {kind: preproc_if}}}}}, {has: {kind: explicit_interface_specifier}}, {inside: {stopBy: {matches: enclosing}, kind: interface_declaration}, not: {has: {kind: modifier, regex: 'private|internal', stopBy: {not: {kind: preproc_if}}}}}]}
    visible: {matches: public, not: {inside: {stopBy: end, matches: enclosing, not: {matches: public}}}}
rule:
    kind: class_declaration, record_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}
    not: {has: {regex: '^struct$'}}
rewriters:
    - id: parameters
      rule: {kind: parameter_list, inside: {kind: 'class_declaration, record_declaration, struct_declaration'}, pattern: {context: 'record R($$$PARAMETERS);', selector: parameter_list}}
      transform: {KEPT: {rewrite: {source: $$$PARAMETERS, rewriters: [default, tool-list, tool, attributed, trivia]}}}
      fix: ($KEPT)
    - {id: default, rule: {not: {kind: ERROR}, inside: {kind: parameter, field: value}}, fix: …}
    - {id: body, rule: {kind: 'declaration_list, enum_member_declaration_list', inside: {field: body, matches: enclosing}}, fix: ''}
    - {id: arguments, rule: {kind: argument_list, has: {kind: argument}, inside: {kind: 'base_list, primary_constructor_base_type, constructor_initializer'}}, fix: '(…)'}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body, arguments, parameters, tool-list, tool, attributed, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*|#(?:if|endif)[^\n]*|#el(?:if|se)(?s:.)*?#endif', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
