  while [[ $i -lt 10 ]]; do ((i++)); done:
    fixed: while ((i < 10)); do ((i++)); done
    labels:
    - source: '[[ $i -lt 10 ]]'
      style: primary
      start: 6
      end: 21
    - source: $i
      style: secondary
      start: 9
      end: 11
    - source: -lt
      style: secondary
      start: 12
      end: 15
    - source: '10'
      style: secondary
      start: 16
      end: 18
