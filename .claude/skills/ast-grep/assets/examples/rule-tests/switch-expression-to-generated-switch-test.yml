id: switch-expression-to-generated-switch
valid:
    - | # Already on the generated Switch
      public static class S {
          public static Fin<Outcome> Done(Request request, Ledger ledger) =>
              request.Switch(open: static o => ledger.Open(o.Code), close: static c => ledger.Close(c.Code));
      }
    - | # When-guarded arm refuses the fix
      public static class S {
          public static int Guarded(Request request) =>
              request switch { Request.Open o when o.Code.Live => 1, Request.Close c => 0 };
      }
    - | # Discard arm refuses the fix
      public static class S {
          public static int Fallback(Request request) =>
              request switch { Request.Open o => 1, _ => 0 };
      }
    - | # Compound subject rebinds under member access, the guard refuses it
      public static class S {
          public static Fin<Outcome> Waited(Task<Request> t, Ledger ledger) =>
              await t switch { Request.Open o => ledger.Open(o.Code), Request.Close c => ledger.Close(c.Code) };
      }
invalid:
    - |- # Bare qualified patterns on a language switch
      public static class S {
          public static Fin<Outcome> Dispatch(Request request, Ledger ledger) =>
              request switch {
                  Request.Open o => ledger.Open(o.Code),
                  Request.Amend a => ledger.Amend(a.Code, a.Delta),
                  Request.Close c => ledger.Close(c.Code),
              };
      }
