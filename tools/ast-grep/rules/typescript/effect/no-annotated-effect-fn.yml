# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: variable_declarator
    all:
        - has:
            field: type
            has:
                kind: function_type
                has:
                    field: return_type
                    kind: generic_type
                    has: {field: name, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^Effect$'}}}}
        - has: {field: name, pattern: $NAME}
        - has: {field: value, kind: call_expression, has: {field: arguments, has: {matches: effect-generator-function}}}
message: '`$NAME` restates the parameters and result of its `Effect.fn` body in a function type'
note: 'Annotate generator `function* (<parameters>): Effect.fn.Return<A, E, R>` and drop the binding type'
