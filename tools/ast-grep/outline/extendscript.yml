id: extendscript-import
language: extendscript
role: item
symbolType: module
rule:
    any:
        - kind: comment
          regex: '^//@include[\t ]'
          pattern: $DIRECTIVE
        - kind: preprocessor_directive
          all:
            - has: {field: name, regex: '^#include$'}
            - has: {field: value, pattern: $NAME}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^\$\.evalFile$'}
            - has: {field: arguments, has: {nthChild: 1, pattern: $NAME}}
transform:
    PATH: {replace: {source: $DIRECTIVE, replace: '^//@include[\t ]+', by: ''}}
name: $PATH$NAME
isImport: true
isExported: false
---
id: extendscript-module
language: extendscript
role: item
symbolType: module
utils:
    scope: {inside: {stopBy: {kind: 'program, function_declaration, function_expression'}, any: [{kind: program}, {kind: function_expression, matches: scope, inside: {stopBy: {not: {kind: 'parenthesized_expression, member_expression'}}, kind: 'call_expression, new_expression'}}]}}
    statement:
        kind: expression_statement
        matches: scope
        inside: {any: [{kind: program}, {inside: {kind: function_expression}}]}
    literal:
        any:
            - kind: function_expression
            - {kind: parenthesized_expression, has: {matches: literal}}
    instance:
        any:
            - {kind: parenthesized_expression, has: {matches: instance}}
            - {kind: call_expression, has: {field: function, any: [{matches: literal}, {kind: member_expression, has: {field: object, matches: literal}}, {matches: instance}]}}
            - {kind: new_expression, has: {field: constructor, matches: literal}}
rule:
    any:
        - kind: variable_declarator
          inside: {kind: 'variable_declaration, lexical_declaration', matches: scope, not: {inside: {kind: for_statement, field: initializer}}}
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: value, matches: instance}
        - kind: assignment_expression
          inside: {matches: statement}
          all:
            - has: {field: left, pattern: $NAME}
            - has: {field: right, matches: instance}
name: $NAME
signature: $NAME
isExported:
    any:
        - inside: {stopBy: {kind: 'program, function_declaration, function_expression'}, kind: program}
        - has: {field: left, regex: '^\$\.global[.\[]'}
---
id: extendscript-class
language: extendscript
role: item
symbolType: class
utils:
    scope: {inside: {stopBy: {kind: 'program, function_declaration, function_expression'}, any: [{kind: program}, {kind: function_expression, matches: scope, inside: {stopBy: {not: {kind: 'parenthesized_expression, member_expression'}}, kind: 'call_expression, new_expression'}}]}}
    statement:
        kind: expression_statement
        matches: scope
        inside: {any: [{kind: program}, {inside: {kind: function_expression}}]}
    literal:
        any:
            - {kind: function_expression, has: {field: parameters, pattern: $PARAMS}}
            - {kind: parenthesized_expression, has: {matches: literal}}
    fielded:
        any:
            - has: {field: body, has: {stopBy: {kind: 'function_declaration, function_expression'}, kind: assignment_expression, has: {field: left, has: {field: object, kind: this}}}}
            - {kind: parenthesized_expression, has: {matches: fielded}}
    prototyped:
        inside:
            stopBy: {kind: 'program, statement_block'}
            has: {kind: expression_statement, has: {kind: assignment_expression, has: {field: left, any: [{pattern: $NAME.prototype}, {has: {field: object, pattern: $NAME.prototype}}]}}}
rule:
    any:
        - kind: function_declaration
          matches: scope
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: parameters, pattern: $PARAMS}
            - any: [{matches: fielded}, {matches: prototyped}]
        - kind: variable_declarator
          inside: {kind: 'variable_declaration, lexical_declaration', matches: scope, not: {inside: {kind: for_statement, field: initializer}}}
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: value, matches: literal}
            - any: [{has: {field: value, matches: fielded}}, {matches: prototyped}]
        - kind: assignment_expression
          inside: {matches: statement}
          all:
            - has: {field: left, pattern: $NAME}
            - has: {field: right, matches: literal}
            - any: [{has: {field: right, matches: fielded}}, {matches: prototyped}]
rewriters:
    - {id: parameter, rule: {kind: 'required_parameter, optional_parameter', pattern: $PARAMETER}, fix: $PARAMETER}
transform:
    PARAMETERS: {rewrite: {source: $PARAMS, rewriters: [parameter], joinBy: ', '}}
name: $NAME
signature: function $NAME($PARAMETERS)
isExported:
    any:
        - inside: {stopBy: {kind: 'program, function_declaration, function_expression'}, kind: program}
        - has: {field: left, regex: '^\$\.global[.\[]'}
