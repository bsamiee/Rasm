# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-tsx
language: tsx
severity: error
utils:
    function:
        matches: syntax-function-boundary
    control:
        any:
            - kind: for_statement, for_in_statement, while_statement, do_statement, switch_statement
            - kind: if_statement
              not: {inside: {kind: else_clause}}
            - kind: ternary_expression
              not: {inside: {kind: ternary_expression, field: alternative, stopBy: {not: {matches: syntax-expression-wrapper}}}}
    boundary: {any: [{matches: control}, {matches: function}]}
rule:
    matches: control
    pattern: $SCOPE
    inside:
        matches: control
        stopBy: {matches: boundary}
        inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                stopBy: {matches: boundary}
                not: {inside: {matches: control, stopBy: {matches: function}}}
message: Control flow reaches a fourth nesting level
note: Rebuild nested decisions or loops with a match, comprehension or pipeline over their inputs
labels:
    SCOPE: {style: primary}
