# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-field-display
language: rust
severity: error
rule:
    kind: impl_item
    all:
        - has: {field: type, kind: type_identifier, pattern: $T}
        - matches: rust-field-display
message: '`Display` for `$T` writes a literal format over its own fields'
note: 'Replace the impl with `derive_more::Display` and `#[display("<format>")]` on type or variant, no attribute on a single-field struct'
