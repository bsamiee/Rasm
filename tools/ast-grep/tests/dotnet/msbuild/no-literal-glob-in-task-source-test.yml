id: no-literal-glob-in-task-source
valid:
    - '<Target Name="Stage"><Copy SourceFiles="@(Asset)" DestinationFiles="@(Asset->''$(StageRoot)%(RecursiveDir)%(Filename)%(Extension)'')" /></Target>'
    - '<Target Name="Stage"><Copy SourceFiles="$(StageRoot)manifest.yml" DestinationFolder="$(IntermediateOutputPath)stage/" /></Target>'
    - '<Target Name="Stage"><Copy SourceFiles="@(Asset)" DestinationFolder="$(StageRoot)**/" /></Target>'
    - '<ItemGroup><_Stage Include="native" SourceFiles="source/**/*.txt" /></ItemGroup>'
    - '<Target Name="Stage"><Copy SourceFiles="$(StageRoot)item.txt;$(StageRoot)other.txt" DestinationFolder="stage/" /></Target>'
    - '<Target Name="Clean"><ItemGroup><_Stale Include="stage/**/*.tmp" /></ItemGroup><Delete Files="@(_Stale)" /></Target>'
    - '<Target Name="Clean"><RemoveDir Directories="stage/*" /></Target>'
    - '<Target Name="Stage"><Copy Files="source/*.txt" DestinationFolder="stage/" /></Target>'
    - '<Target Name="Clean"><Delete><Files>stage/*.tmp</Files></Delete></Target>'
    - '<Target Name="Clean"><Delete Files="@(_Stale)" Condition="''$(Pattern)'' == ''*.tmp''" /></Target>'
invalid:
    - '<Target Name="Clean"><Delete Files="stage/*.tmp" /></Target>'
    - '<Target Name="Stamp"><Touch Files="stage/**/*.txt" AlwaysCreate="true" /></Target>'
    - '<Target Name="Stage"><Copy SourceFiles="source/**/*.txt" DestinationFolder="stage/" /></Target>'
    - '<Target Name="Stage"><Move SourceFiles="source/**/*.txt" DestinationFolder="stage/" /></Target>'
    - '<Target Name="Stage"><Copy SourceFiles="source/**/*.txt" DestinationFiles="@(_Destinations)" /></Target>'
    - '<Target Name="Stage"><Copy SourceFiles="source/*.txt" DestinationFolder="stage/" /></Target>'
    - '<Target Name="Stage"><Move SourceFiles="source/file?.txt" DestinationFolder="stage/" /></Target>'
    - "<Target Name='Stage'><Copy Condition='$(Stage) == true' SourceFiles='source/**/*.txt' DestinationFolder='stage' /></Target>"
    - '<Target Name="Stage"><Copy SourceFiles="item.txt;source/*.txt" DestinationFolder="stage/" /></Target>'
    - '<Target Name="Stage"><Copy SourceFiles="$(StageRoot)**/*.txt" DestinationFolder="$(OutDir)stage/" /></Target>'
