# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-use-generic
language: swiftlang
severity: error
utils:
    declaration:
        kind: 'function_declaration, init_declaration, subscript_declaration'
    sole-use:
        kind: parameter
        pattern: $USE
        all:
            - has: {kind: user_type, has: {kind: type_identifier, pattern: $T}, not: {has: {nthChild: 2}}}
            - not: {has: {regex: '^\.\.\.$'}}
    single-use-parameter:
        kind: type_parameter
        pattern: $PARAM
        all:
            - has: {nthChild: 1, kind: type_identifier, pattern: $T}
            - not: {regex: '^(each|let)\b'}
            - any:
                - has: {field: name, pattern: $BOUND}
                - {not: {has: {field: name, pattern: $_}}, pattern: $UNBOUND}
            - inside:
                kind: type_parameters
                inside:
                    matches: declaration
                    all:
                        - has: {matches: sole-use}
                        - not:
                            has:
                                stopBy: end
                                kind: 'type_identifier, simple_identifier'
                                pattern: $T
                                not:
                                    any:
                                        - inside: {kind: parameter, pattern: $USE, stopBy: {kind: parameter}}
                                        - {nthChild: 1, inside: {kind: type_parameter, pattern: $PARAM}}
rule:
    matches: declaration
    pattern: $DECL
    all:
        - has: {kind: type_parameters, has: {matches: single-use-parameter}}
        - not: {matches: swift-arity-overload}
transform:
    OPAQUE: {rewrite: {source: $DECL, rewriters: [sole-parameters, after-leading-parameter, listed-parameter, opaque-type]}}
rewriters:
    - id: sole-parameters
      rule:
        kind: type_parameters
        all:
            - has: {kind: type_parameter, pattern: $PARAM}
            - not: {has: {kind: type_parameter, nthChild: {position: 2, ofRule: {kind: type_parameter}}}}
      fix: ''
    - id: after-leading-parameter
      rule:
        kind: type_parameter
        pattern: $KEPT
        nthChild: {position: 2, ofRule: {kind: type_parameter}}
        follows: {stopBy: end, kind: type_parameter, pattern: $PARAM}
      fix: {template: $KEPT, expandStart: {stopBy: end, kind: type_parameter, pattern: $PARAM}}
    - id: listed-parameter
      rule:
        kind: type_parameter
        pattern: $PARAM
        not: {nthChild: {position: 1, ofRule: {kind: type_parameter}}}
      fix: {template: '', expandStart: {regex: '^,$'}}
    - id: opaque-type
      rule:
        kind: user_type
        has: {kind: type_identifier, pattern: $T}
        not: {has: {nthChild: 2}}
        inside: {kind: parameter, pattern: $USE}
      transform:
        CONSTRAINED: {replace: {source: $BOUND, replace: '^(.+)$', by: 'some $1'}}
        FREE: {replace: {source: $UNBOUND, replace: '^.+$', by: 'some Any'}}
      fix: $CONSTRAINED$FREE
fix: $OPAQUE
message: '`$PARAM` names a generic parameter one parameter type uses alone'
note: 'Write `some <Constraint>` as that parameter type, `some Any` for an unconstrained parameter, and drop the generic parameter'
