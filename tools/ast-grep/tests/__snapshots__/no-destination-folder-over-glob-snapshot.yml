id: no-destination-folder-over-glob
snapshots:
  ? |
    <Copy SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
  : labels:
    - source: <Copy SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
      style: primary
      start: 0
      end: 107
  ? |
    <Move SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
  : labels:
    - source: <Move SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
      style: primary
      start: 0
      end: 107
