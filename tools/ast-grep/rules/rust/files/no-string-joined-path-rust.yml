# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    slash:
        any:
            - {kind: string_literal, regex: '^"(/|/[^/"][^"]*|[^"]*[^:/"]/)"$'}
            - {pattern: '''/'''}
    path-name:
        regex: '(?i)(^|_)(path|dir|directory|file|root|folder)$'
        not: {regex: '(?i)(^|_)(url|uri|route|endpoint|request)_'}
    rooted-format:
        has: {kind: token_tree, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: string_literal, regex: '^"/'}}
    joined:
        any:
            - matches: rust-interpolating-format
              has: {kind: token_tree, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: string_literal, regex: '(\}|^")/|/(\{|"$)', not: {regex: '://'}}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\+$'}
                - not: {inside: {kind: binary_expression, field: left}}
                - has: {stopBy: end, matches: slash, inside: {kind: binary_expression, has: {field: operator, regex: '^\+$'}}}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^join$'}}, {has: {field: value, kind: array_expression, has: {pattern: $_, not: {matches: rust-literal}}}}]}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: slash}, not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}
    path-call:
        kind: call_expression
        has:
            field: function
            any:
                - regex: '(Path(Buf)?::(new|from)|fs::\p{XID_Continue}+|File::(open|create|create_new))$'
                - regex: 'OpenOptions[\p{Pattern_White_Space}\P{Pattern_White_Space}]*\.open$'
                - kind: field_expression
                  all: [{has: {field: field, regex: '^(join|push)$'}}, {has: {field: value, matches: path-name}}]
    pushed-slash:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(push_str|push)$'}}, {has: {field: value, matches: path-name}}]}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: slash}, not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}
rule:
    all:
        - any:
            - all:
                - matches: joined
                - any:
                    - inside: {kind: arguments, inside: {matches: path-call}}
                    - inside: {kind: reference_expression, inside: {kind: arguments, inside: {matches: path-call}}}
                    - all:
                        - not: {matches: rooted-format}
                        - any:
                            - inside: {kind: let_declaration, has: {field: pattern, kind: identifier, matches: path-name}}
                            - inside: {kind: assignment_expression, has: {field: left, matches: path-name}}
            - matches: pushed-slash
        - pattern: $JOINED
message: '`$JOINED` joins a file-system path with a `/` literal'
note: 'Join through `<base>.join(<segment>)` on a `Path` or `PathBuf`, or `[<a>, <b>].iter().collect::<PathBuf>()`'
