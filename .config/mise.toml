# --- [VERSION] --------------------------------------------------------------------------

min_version = "2026.11.1"

# --- [SETTINGS] -------------------------------------------------------------------------

[settings]
auto_install                        = false
dotnet.cli_telemetry_optout         = true
experimental                        = true
idiomatic_version_file_enable_tools = ["dotnet", "rust"]
java.shorthand_vendor               = "corretto"
lockfile_platforms                  = ["linux-arm64", "linux-x64", "macos-arm64", "windows-x64"]
minimum_release_age                 = "0s"
prereleases                         = true
python.uv_venv_auto                 = "source"
registry_floating                   = true
status.missing_tools                = "always"
use_versions_host_track             = false

# --- [ENV] ------------------------------------------------------------------------------

[env]
_.path                                        = ["./node_modules/.bin", "{{ xdg_config_home }}/swiftpm/bin"]
CARGO_LLVM_COV_DENY_WARNINGS                  = "1"
CF_QUIET                                      = "1"
CLOUDFLARE_DEV_REGISTRY_PATH                  = "{{config_root}}/.cache/cloudflare/registry"
DOPPLER_CONFIG                                = "dev"
DOPPLER_PROJECT                               = "rasm"
DOTNET_NOLOGO                                 = "1"
DOTNET_ROLL_FORWARD                           = "Major"
FOUNDRY_CACHE_DIR                             = "{{config_root}}/.cache/foundry"
FOUNDRY_LOG_DIR                               = "{{config_root}}/.artifacts/logs"
GHIDRA_CLASSPATH                              = { tools = true, value = '''{% set ghidra = tools["github:NationalSecurityAgency/ghidra"]?.path %}{% if ghidra %}{{ exec(command="fd --type f --full-path --glob '**/lib/*.jar' --absolute-path '" ~ ghidra ~ "/Ghidra' | paste -sd: -", cache_key="ghidra-classpath-" ~ ghidra, cache_duration="1d") }}{% endif %}''' }
GHIDRA_INSTALL_DIR                            = { tools = true, value = '{{ tools["github:NationalSecurityAgency/ghidra"]?.path or "" }}' }
GHIDRA_JAVA_OPTIONS                           = "-Dapplication.settingsdir={{config_root}}/.cache/ghidra/settings -Dapplication.cachedir={{config_root}}/.cache/ghidra/cache -Dapplication.tempdir={{config_root}}/.cache/ghidra/tmp"
GHIDRA_PROJECT_DIR                            = "{{ xdg_cache_home }}/rasm/ghidra/projects"
HK_CACHE_DIR                                  = "{{config_root}}/.cache/hk"
HK_MISE                                       = "1"
HK_PKL_CACHE_DIR                              = "{{config_root}}/.cache/pklr"
HYPOTHESIS_STORAGE_DIRECTORY                  = "{{config_root}}/.cache/hypothesis"
JAVAC_PLUGINS                                 = { tools = true, value = '{% for jar in ["dataflow-errorprone", "dataflow-nullaway", "error-prone", "jspecify", "nullaway"] %}{% set tool = tools["http:" ~ jar]?.path %}{% if tool %}{{ tool }}/{{ jar }}.jar{% if not loop.last %}:{% endif %}{% endif %}{% endfor %}' }
NODE_COMPILE_CACHE                            = "{{config_root}}/.cache/node"
NX_ISOLATE_PLUGINS                            = "false"                                                                                                                                                                                                                                                                                                                 # In-process plugins load faster than plugin workers while the daemon is off
NX_WORKSPACE_DATA_DIRECTORY                   = "{{config_root}}/.cache/nx/workspace-data"
PLAYWRIGHT_CLI_SESSION                        = "{{ get_env(name='CLAUDE_CODE_SESSION_ID', default='') }}"
PLAYWRIGHT_MCP_ALLOW_UNRESTRICTED_FILE_ACCESS = "true"
PLAYWRIGHT_MCP_BROWSER                        = "chromium"
PLAYWRIGHT_MCP_FILE_PATHS                     = "absolute"
PLAYWRIGHT_MCP_OUTPUT_DIR                     = "{{config_root}}/.artifacts/playwright/{{ env.PLAYWRIGHT_CLI_SESSION }}"
PLAYWRIGHT_TRANSFORM_CACHE_DIR                = "{{config_root}}/.cache/playwright/transform"
PULUMI_HOME                                   = "{{config_root}}/.cache/pulumi"
PYTEST_CACHE_DIR                              = "{{config_root}}/.cache/pytest"
RUSTUP_AUTO_INSTALL                           = "0"
RUSTUP_TOOLCHAIN                              = false
SHELLCHECK_OPTS                               = "--rcfile={{config_root}}/.config/shellcheckrc"
TOMBI_CACHE_HOME                              = "{{config_root}}/.cache/tombi"
TY_UV                                         = "1"
VCPKG_BINARY_SOURCES                          = "clear;files,{{config_root}}/.cache/vcpkg/archives,readwrite"
VCPKG_DISABLE_METRICS                         = "1"
VCPKG_DOWNLOADS                               = "{{config_root}}/.cache/vcpkg/downloads"
VCPKG_FORCE_SYSTEM_BINARIES                   = "1"
VCPKG_ROOT                                    = { tools = true, value = '{{ tools["github:microsoft/vcpkg-tool"]?.path or "" }}' }
WATCH_APPS_LOG_DIR                            = "{{config_root}}/.artifacts/logs"
WATCH_APPS_SESSION                            = "{{ get_env(name='CLAUDE_CODE_SESSION_ID', default='') }}"

# --- [DEPS] -----------------------------------------------------------------------------

[deps.uv]
run     = "pixi run --locked uv sync --all-packages"
sources = ["pixi.lock", "pyproject.toml", "uv.lock"]

# --- [HOOKS] ----------------------------------------------------------------------------

[hooks]
postinstall = "hk install"

# --- [TOOLS] ----------------------------------------------------------------------------

[tools]
"aqua:EmbarkStudios/cargo-deny"                                              = "latest"
"aqua:nextest-rs/nextest/cargo-nextest"                                      = "latest"
"aqua:taiki-e/cargo-llvm-cov"                                                = "latest"
ast-grep                                                                     = "latest"
carapace                                                                     = "latest"
cargo-insta                                                                  = "latest"
"cargo:cargo-edit"                                                           = "latest"
cmake                                                                        = "latest"
colima                                                                       = { os = ["macos"], version = "latest" }
"conda:openssh"                                                              = { os = ["linux"], version = "latest" }
"conda:pkgconf"                                                              = "latest"
crane                                                                        = { os = ["macos", "linux"], version = "latest" }
difftastic                                                                   = "latest"
docker-compose                                                               = { os = ["macos", "linux"], postinstall = { run = 'plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins" && mkdir -p "$plugins" && ln -sf "$MISE_TOOL_INSTALL_PATH/docker-compose" "$plugins/docker-compose"', when = "always" }, version = "latest" }
doppler                                                                      = "latest"
"dotnet:ilspycmd"                                                            = "latest"
"dotnet:Microsoft.AITools.BinlogMcp"                                         = "latest"
"dotnet:NuGet.Mcp.Server"                                                    = "latest"
"dotnet:RoslynCodeLens.Mcp"                                                  = "latest"
duckdb                                                                       = "latest"
editorconfig-checker                                                         = "latest"
fd                                                                           = "latest"
gh                                                                           = "latest"
git-lfs                                                                      = "latest"
"github:docker/buildx"                                                       = { bin = "docker-buildx", os = ["macos", "linux"], postinstall = { run = 'plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins" && mkdir -p "$plugins" && ln -sf "$MISE_TOOL_INSTALL_PATH/docker-buildx" "$plugins/docker-buildx"', when = "always" }, version = "latest" }
"github:fonttools/fontspector"                                               = { version = "latest", version_prefix = "fontspector-v" }
"github:hostinger/api-cli"                                                   = "latest"
"github:kucherenko/jscpd"                                                    = "latest"
"github:linebender/resvg"                                                    = { matching = "usvg", version = "latest" }
"github:sbdchd/squawk"                                                       = "latest"
google-java-format                                                           = "latest"
"github:trailofbits/dylint"                                                  = { matching = "cargo-dylint-", os = ["linux", "macos/arm64"], version = "latest" }
hk                                                                           = { version = "latest", workflow = "release.yml" }
hyperfine                                                                    = "latest"
imagemagick                                                                  = "latest"
jactionlint                                                                  = "latest"
java                                                                         = "latest"
jq                                                                           = "latest"
lima                                                                         = { os = ["macos"], version = "latest" }
ninja                                                                        = "latest"
node                                                                         = "latest"
"npm:@modelcontextprotocol/conformance"                                      = "0.2.0-alpha.12"
pitchfork                                                                    = { os = ["macos"], version = "latest" }
pixi                                                                         = "latest"
pkl                                                                          = "latest"
pnpm                                                                         = "latest"
pulumi                                                                       = "latest"
"pypi:ast-grep/ast-grep-mcp"                                                 = "latest"
"pypi:git+https://projects.blender.org/lab/blender_mcp.git#subdirectory=mcp" = "v1"
"pypi:mcp-for-blender"                                                       = { os = ["macos"], version = "latest" }
"pypi:tavily-cli"                                                            = { os = ["macos"], version = "latest" }
resvg                                                                        = "latest"
ripgrep                                                                      = "latest"
sd                                                                           = "latest"
shellcheck                                                                   = "latest"
shfmt                                                                        = "latest"
swiftlint                                                                    = { os = ["macos"], version = "latest" }
tombi                                                                        = "latest"
tree-sitter                                                                  = "latest"
uv                                                                           = "latest"
yq                                                                           = "latest"

[tools."github:apple/pkl-vscode"]
asset_pattern = "pkl-vscode-*.vsix"
bin           = "pkl-vscode.vsix"
format        = "raw"
version       = "latest"

[tools."github:BlankSpruce/gersemi"]
bin     = "gersemi"
format  = "raw"
version = "latest"

[tools."github:BlankSpruce/gersemi".platforms]
linux-arm64 = { asset_pattern = "gersemi-linux-arm" }
linux-x64   = { asset_pattern = "gersemi-linux" }
macos-arm64 = { asset_pattern = "gersemi-macos-arm" }
windows-x64 = { asset_pattern = "gersemi-windows.exe" }

[tools."github:docker/docker-credential-helpers"]
bin      = "docker-credential-osxkeychain"
format   = "raw"
matching = "docker-credential-osxkeychain"
os       = ["macos"]
version  = "latest"

[tools."github:llvm/llvm-project"]
bin_path         = "bin"
os               = ["macos", "linux"]
strip_components = 1
version          = "latest"
version_prefix   = "llvmorg-"

[tools."github:llvm/llvm-project".platforms]
linux-arm64 = { asset_pattern = "LLVM-*-Linux-ARM64.tar.zst" }
linux-x64   = { asset_pattern = "LLVM-*-Linux-X64.tar.zst" }
macos-arm64 = { asset_pattern = "LLVM-*-macOS-ARM64.tar.zst" }

[tools."github:microsoft/vcpkg-tool"]
additional_asset_patterns = ["vcpkg-standalone-bundle.tar.gz"]
bin                       = "vcpkg"
format                    = "raw"
version                   = "latest"
version_prefix            = ""

[tools."github:microsoft/vcpkg-tool".platforms]
linux-arm64 = { asset_pattern = "vcpkg-glibc-arm64" }
linux-x64   = { asset_pattern = "vcpkg-glibc" }
macos-arm64 = { asset_pattern = "vcpkg-macos" }
windows-x64 = { asset_pattern = "vcpkg.exe" }

[tools."github:NationalSecurityAgency/ghidra"]
asset_pattern    = "ghidra_*_PUBLIC_*.zip"
bin_path         = "support"
postinstall      = '''{% if env.CI | default(value="false") != "true" %}
set -e
decompiler="$MISE_TOOL_INSTALL_PATH/Ghidra/Features/Decompiler"
platform="$decompiler/os/{{ os(macos="mac", windows="win") }}_{{ arch(x64="x86_64", arm64="arm_64") }}"
if [ ! -d "$platform" ]; then
    make -C "$decompiler/src/decompile/cpp" -j "$(getconf _NPROCESSORS_ONLN)" ARCH_TYPE= ghidra_opt
    mkdir -p "$platform"
    mv "$decompiler/src/decompile/cpp/ghidra_opt" "$platform/decompile"
    make -C "$decompiler/src/decompile/cpp" clean
fi
{% endif %}'''
strip_components = 1
version          = "latest"
version_prefix   = "Ghidra_"

[tools."github:pmd/pmd"]
asset_pattern  = "pmd-dist-*-bin.zip"
version        = "latest"
version_prefix = "pmd_releases/"
version_regex  = '^pmd_releases/\d+\.\d+\.\d+(-rc\d+)?$'

[tools."github:sparkle-project/Sparkle"]
asset_pattern = "Sparkle-*.tar.xz"
bin_path      = "bin"
os            = ["macos"]
version       = "latest"

[tools."http:blender-ext"]
url              = "https://raw.githubusercontent.com/blender/blender/v{{ version }}/scripts/addons_core/bl_pkg/cli/blender_ext.py"
version          = "latest"
version_list_url = "https://api.github.com/repos/blender/blender/tags"
version_order    = "semver"

[tools."http:docker-cli"]
checksum_url     = 'https://download.docker.com/{{ os(macos="mac") }}/static/test/{{ arch(x64="x86_64", arm64="aarch64") }}/docker-cli_{{ version }}.tgz.sha256'
os               = ["macos", "linux"]
url              = 'https://download.docker.com/{{ os(macos="mac") }}/static/test/{{ arch(x64="x86_64", arm64="aarch64") }}/docker-cli_{{ version }}.tgz'
version          = "latest"
version_list_url = "https://download.docker.com/mac/static/test/aarch64/"
version_order    = "semver"
version_regex    = 'href="docker-cli_([^"]+)\.tgz"'

[tools."http:dataflow-errorprone"]
bin              = "dataflow-errorprone.jar"
format           = "raw"
url              = "https://repo1.maven.org/maven2/io/github/eisop/dataflow-errorprone/{{ version }}/dataflow-errorprone-{{ version }}.jar"
version          = "latest"
version_list_url = "https://repo1.maven.org/maven2/io/github/eisop/dataflow-errorprone/maven-metadata.xml"
version_regex    = "<version>([^<]+)</version>"

[tools."http:dataflow-nullaway"]
bin              = "dataflow-nullaway.jar"
format           = "raw"
url              = "https://repo1.maven.org/maven2/org/checkerframework/dataflow-nullaway/{{ version }}/dataflow-nullaway-{{ version }}.jar"
version          = "latest"
version_list_url = "https://repo1.maven.org/maven2/org/checkerframework/dataflow-nullaway/maven-metadata.xml"
version_regex    = "<version>([^<]+)</version>"

[tools."http:error-prone"]
bin              = "error-prone.jar"
format           = "raw"
url              = "https://repo1.maven.org/maven2/com/google/errorprone/error_prone_core/{{ version }}/error_prone_core-{{ version }}-with-dependencies.jar"
version          = "latest"
version_list_url = "https://repo1.maven.org/maven2/com/google/errorprone/error_prone_core/maven-metadata.xml"
version_regex    = "<version>([^<]+)</version>"

[tools."http:jspecify"]
bin              = "jspecify.jar"
format           = "raw"
url              = "https://repo1.maven.org/maven2/org/jspecify/jspecify/{{ version }}/jspecify-{{ version }}.jar"
version          = "latest"
version_list_url = "https://repo1.maven.org/maven2/org/jspecify/jspecify/maven-metadata.xml"
version_regex    = "<version>([^<]+)</version>"

[tools."http:nullaway"]
bin              = "nullaway.jar"
format           = "raw"
url              = "https://repo1.maven.org/maven2/com/uber/nullaway/nullaway/{{ version }}/nullaway-{{ version }}.jar"
version          = "latest"
version_list_url = "https://repo1.maven.org/maven2/com/uber/nullaway/nullaway/maven-metadata.xml"
version_regex    = "<version>([^<]+)</version>"

[tools."http:rustc-source"]
postinstall      = { run = 'rm -rf "$MISE_TOOL_INSTALL_PATH/src/llvm-project" && ln -sfn "$MISE_TOOL_INSTALL_PATH" "$MISE_CONFIG_ROOT/.cargo/rustc-source"', when = "always" }
strip_components = 1
url              = "https://static.rust-lang.org/dist/{{ version }}/rustc-nightly-src.tar.xz"
version          = "{{ read_toml(path=config_root ~ '/rust-toolchain.toml')['toolchain']['channel'] | trim_start(pat='nightly-') }}"

[tools."http:zxpsigncmd"]
os      = ["macos"]
url     = "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/fcee8de5537d2dd2ed3d91d5a495b7041155b280/ZXPSignCMD/{{ version }}/macOS/ZXPSignCmd"
version = "4.1.3"

[tools."http:yak"]
bin     = "yak"
url     = 'https://files.mcneel.com/yak/tools/{{ version }}/{{ os(macos="osx", linux="linux", windows="win") }}-{{ arch(x64="x64", arm64="arm64") }}/yak{{ os(macos="", linux="", windows=".exe") }}'
version = "0.19.1"
