id: no-telemetry-sink-outside-runner
valid:
    - |
      import { NodeRuntime } from "@effect/platform-node";
      import { Effect, Logger } from "effect";
      const layer = Logger.layer([Logger.consolePretty()]);
      NodeRuntime.runMain(program.pipe(Effect.provide(layer)));
    - |
      import { Effect } from "effect";
      export const program = Effect.annotateLogs(Effect.logInfo("start"), { id: 1 });
invalid:
    - |
      import { Logger } from "effect";
      export const layer = Logger.layer([Logger.consolePretty()]);
    - |
      import { Effect, Tracer } from "effect";
      export const traced = Effect.withTracer(program, Tracer.make({ span }));
