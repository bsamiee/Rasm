# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-not-in-subquery
language: sql
severity: error
rule:
    kind: in_subquery_expression
    pattern: _EXPRESSION
    any:
        - has: {regex: '(?i)^not$'}
        - has: {field: operand, kind: unary_expression, has: {field: operator, regex: '(?i)^not$'}}
transform:
    HEAD: {replace: {source: $EXPRESSION, replace: '(?is)^(.*?\bin)\b.*$', by: '$1 (...)'}}
message: '`$HEAD` selects no row once the subquery yields NULL'
note: 'Write `not exists (select 1 from <table> where <column> = <operand>)`'
