# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-item-update-in-build-props
language: xml
severity: error
files: ['**/Directory.Build.props']
rule:
    kind: element
    all:
        - has: {matches: msbuild-tag, has: {kind: Attribute, has: {kind: Name, regex: '^(Update|Remove)$'}}}
        - inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: '^ItemGroup$'}}}}}
        - not: {inside: {matches: {msbuild-element: {name: {regex: '^Target$'}}}, stopBy: end}}
message: An Update or Remove in Directory.Build.props runs before the SDK globs add any item and matches nothing, move it to Directory.Build.targets or the project file, and express an exclusion through DefaultItemExcludes
