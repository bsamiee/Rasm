# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: plpgsql
severity: error
rule:
    kind: sql_expression
    pattern: $SQL
    inside: {field: execute, kind: 'stmt_dynexecute, for_dynamic, stmt_open, stmt_return'}
    regex: '(?si)^(?:\$[\p{L}_]*\$.*?\$[\p{L}_]*\$|\$[0-9]+|[A-Z_a-z\x{80}-\x{10FFFF}]\$+|"(?:[^"]|"")*"|[^''$"eE]|[eE]''(?:[^''\\]|\\.|'''')*''|[eE][^''"$]|''(?:[^'']|'''')*'')*?[eE]?(?:\|\||(?-u:\b)concat(?:_ws)?[\t\n\x0B\f\r ]*\(|(?-u:\b)format[\t\n\x0B\f\r ]*\([\t\n\x0B\f\r ]*(?:[eE]?''(?:[^''%]|''''|%[^s''])*?|\$[\p{L}_]*\$(?:[^%]|%[^s])*?)%(?:[0-9]+\$)?-?(?:[0-9]+|\*(?:[0-9]+\$)?)?s)'
message: '`$SQL` splices text into dynamic SQL'
note: 'Bind each value with `USING`, quote each name through `format(''%I'', <name>)`'
