# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['apps/roslyn/**']
rule:
    kind: generic_name
    pattern: $TEST
    all:
        - has: {kind: identifier, regex: '^IsType$'}
        - has: {kind: type_argument_list, has: {matches: {csharp-type-name: {name: {regex: '^ValidationError$'}}}}, not: {has: {nthChild: 2}}}
    inside: {kind: member_access_expression, field: name}
message: '`$TEST` tests Thinktecture default error in place of the package error'
note: 'Declare `[ValidationError<T>]` with the package error type and branch on its `Reason`'
