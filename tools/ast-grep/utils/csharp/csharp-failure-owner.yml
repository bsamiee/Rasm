# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-failure-owner
language: csharp
arguments: [effect]
rule:
    inside:
        kind: arrow_expression_clause
        inside:
            kind: method_declaration
            all:
                - has: {field: name, regex: '^OnFailure$'}
                - has: {field: parameters, all: [{has: {kind: parameter, nthChild: 1, has: {field: name, matches: effect}}}, {has: {kind: parameter, nthChild: 2}}, {not: {has: {kind: parameter, nthChild: 3}}}]}
