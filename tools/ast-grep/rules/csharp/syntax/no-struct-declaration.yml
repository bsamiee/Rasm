# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-struct-declaration
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    named-type:
        any:
            - kind: identifier
              pattern: $NAME
            - has: {stopBy: end, kind: identifier, pattern: $NAME}
    native-signature:
        kind: method_declaration
        all:
            - has: {kind: modifier, regex: '^(partial|extern)$'}
            - has: {kind: attribute_list, has: {kind: attribute, has: {field: name, matches: {csharp-type-name: {name: {regex: '^(LibraryImport|DllImport)(Attribute)?$'}}}}}}
            - any:
                - has: {field: returns, matches: named-type}
                - has: {field: type, matches: named-type}
                - has: {field: parameters, has: {kind: parameter, has: {field: type, matches: named-type}}}
    constrained-kernel:
        has: {kind: base_list, has: {stopBy: end, kind: identifier, pattern: $KERNEL}}
        inside:
            kind: compilation_unit
            stopBy: end
            has: {stopBy: end, kind: type_parameter_constraints_clause, all: [{has: {kind: type_parameter_constraint, regex: "^struct$"}}, {has: {kind: type_parameter_constraint, has: {stopBy: end, kind: identifier, pattern: $KERNEL}}}]}
    parallel-action:
        has: {kind: base_list, has: {matches: {csharp-type-name: {name: {regex: '^I(Ref|In)?Action(2D)?$'}}}}}
    package-struct-contract:
        has: {kind: base_list, has: {matches: {csharp-type-name: {name: {regex: '^IPaletteDitherImageProcessor$'}}}}}
rule:
    any:
        - kind: struct_declaration
        - kind: record_declaration
          has: {regex: '^struct$'}
    all:
        - has: {field: name, pattern: $NAME}
        - not: {has: {regex: '^ref$'}}
        - not: {matches: {csharp-attributed: {name: {regex: '^StructLayout(Attribute)?$'}}}}
        - not: {matches: parallel-action}
        - not: {matches: package-struct-contract}
        - not: {matches: constrained-kernel}
        - not: {inside: {kind: compilation_unit, stopBy: end, has: {stopBy: end, matches: native-signature}}}
message: '`$NAME` is a struct'
note: 'Declare a record or class, interop structs, `ref struct`, `ParallelHelper` actions, package processors a package `struct` constraint reads, and kernels a `struct` constraint reads stay'
