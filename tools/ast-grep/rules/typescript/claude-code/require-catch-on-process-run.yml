# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-catch-on-process-run
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    # Hooks with a result the model reads, a run's lines are context or prompt text there, and an abort line is a fact the model acts on
    model-facing-hook:
        matches:
            claude-code-hook:
                event:
                    kind: string
                    regex: "^['\"](tool\\.call|prompt\\.submit|skill\\.prompt|prompt\\.section|prompt\\.context|tool\\.describe|agent\\.spawn)['\"]$"
rule:
    matches: claude-code-process-run
    # Any depth, a closure inside the hook runs in the same call
    inside: {stopBy: end, matches: model-facing-hook}
    not:
        any:
            # Catch method with the run under its object, on the run's own promise, after a then, or on the Promise.all around it
            - inside: {stopBy: end, kind: member_expression, field: object, has: {field: property, regex: '^catch$'}}
            # Two-argument then with the run under its object, the second argument is the rejection handler, the pattern pins the arity
            - inside:
                  stopBy: end
                  kind: member_expression
                  field: object
                  inside: {kind: call_expression, field: function, pattern: '$_.then($_, $_)'}
            # Promise.allSettled around the run, a settled list never rejects
            - inside: {stopBy: end, kind: call_expression, has: {field: function, regex: '^Promise\.allSettled$'}}
            # Try around the run with a handler beside it
            - inside: {stopBy: end, kind: try_statement, field: body, has: {field: handler, kind: catch_clause}}
message: The child run has no catch, a child that cannot start rejects the promise, the hook is skipped, and every line it fed drops
note: Catch the run on its own promise, `$.process.run(argv, init).catch(abort)`, the abort `Run` of policies/scan.ts reads as an exit -1 line
