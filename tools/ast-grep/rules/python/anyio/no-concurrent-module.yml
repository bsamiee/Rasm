# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-concurrent-module
language: python
severity: error
rule:
    pattern: $USE
    any:
        - matches: {python-module-use: {module: {regex: '^concurrent\.(futures|interpreters)(\.[\w.]+)?$'}}}
        - kind: dotted_name
          matches: {python-module-member: {module: {regex: '^concurrent$'}, name: {regex: "^(futures|interpreters)$"}}}
message: '`$USE` runs work on a pool or subinterpreter outside structured concurrency, the form of `anyio.to_thread.run_sync`, `anyio.to_process.run_sync`, or `anyio.to_interpreter.run_sync`'
