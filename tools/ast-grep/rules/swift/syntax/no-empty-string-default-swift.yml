# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-string-default-swift
language: swift
severity: error
utils:
    empty-string:
        any:
            - kind: line_string_literal
              not: {has: {kind: 'line_str_text, interpolated_expression'}}
            - pattern: String()
    empty-result:
        any:
            - matches: empty-string
            - kind: control_transfer_statement
              has: {field: result, matches: empty-string}
    empty-block:
        matches: {swift-single-statement: {first: {matches: empty-result}}}
rule:
    any:
        - kind: nil_coalescing_expression
          all:
            - has: {field: value, pattern: $SHAPE}
            - has: {field: if_nil, matches: empty-string}
            - not: {inside: {kind: 'additive_expression, interpolated_expression', stopBy: {not: {kind: tuple_expression}}}}
        - kind: switch_entry
          all:
            - has: {kind: switch_pattern, pattern: $SHAPE}
            - has: {matches: empty-block}
        - kind: guard_statement
          all:
            - has: {field: condition, kind: value_binding_pattern}
            - has: {field: bound_identifier, pattern: $SHAPE}
            - has: {matches: empty-block}
        - kind: if_statement
          all:
            - has: {field: condition, kind: value_binding_pattern}
            - has: {field: bound_identifier, pattern: $SHAPE}
            - has: {matches: empty-block, follows: {regex: '^else$', stopBy: end}}
        - kind: catch_block
          all:
            - pattern: $SHAPE
            - has: {matches: empty-block}
        - kind: value_argument
          all:
            - has: {field: name, regex: '^default$'}
            - has: {field: value, matches: empty-string}
            - inside:
                kind: value_arguments
                regex: '^\['
                inside:
                    kind: call_suffix
                    inside: {kind: call_expression, pattern: $SHAPE, not: {inside: {kind: 'directly_assignable_expression, navigation_expression'}}}
        - matches: empty-string
          all:
            - inside: {kind: 'function_declaration, init_declaration'}
            - follows: {kind: parameter, pattern: $SHAPE, stopBy: end}
        - kind: property_declaration
          all:
            - inside: {kind: 'class_body, enum_class_body'}
            - has: {kind: value_binding_pattern, regex: '^let$'}
            - has: {field: name, kind: pattern, pattern: $SHAPE}
            - any:
                - has: {kind: type_annotation, regex: '^:\s*String$'}
                - not: {has: {kind: type_annotation}}
            - has: {field: value, matches: empty-string}
message: '`$SHAPE` yields an empty string standing for absence'
note: 'Declare or return an Optional and test `nil`, the empty string stays a value'
