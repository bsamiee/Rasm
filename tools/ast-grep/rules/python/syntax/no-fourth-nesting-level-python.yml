# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-python
language: python
severity: error
utils:
    closure: {kind: 'lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression, function_definition'}
    control:
        any:
            - kind: if_statement, for_statement, while_statement, match_statement
            - kind: conditional_expression
              not:
                any:
                    - nthChild: 3
                      inside: {kind: conditional_expression}
                    - inside: {kind: parenthesized_expression, nthChild: 3, inside: {kind: conditional_expression}}
    scope: {any: [{matches: control}, {matches: closure}]}
    conditioned:
        any:
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition, stopBy: &scope {matches: scope}}
            - inside: {kind: 'for_statement, for_in_clause', field: right, stopBy: *scope}
            - inside: {kind: match_statement, field: subject, stopBy: *scope}
            - inside: {kind: if_clause, stopBy: *scope}
            - nthChild: 2
              inside: {kind: conditional_expression}
            - inside: {nthChild: 2, inside: {kind: conditional_expression}, stopBy: *scope}
    nested-body:
        any:
            - has: {kind: block, not: {matches: python-single-statement-block}}
            - has: {matches: control, stopBy: {matches: closure}}
    level:
        any:
            - matches: control
              not: {matches: conditioned}
            - matches: closure
              all:
                - inside: {matches: control, stopBy: {kind: function_definition}}
                - not: {matches: conditioned}
                - matches: nested-body
    boundary: {any: [{matches: level}, {kind: function_definition}]}
rule:
    matches: level
    pattern: $SCOPE
    inside:
        matches: level
        stopBy: {matches: boundary}
        inside:
            matches: level
            stopBy: {matches: boundary}
            inside:
                matches: level
                stopBy: {matches: boundary}
                not: {inside: {matches: level, stopBy: {kind: function_definition}}}
message: 'Control flow or closure opens a fourth nesting level'
note: 'Rebuild the nested levels as one `match` or one pipeline over their inputs'
labels:
    SCOPE: {style: primary, message: Fourth nesting level}
