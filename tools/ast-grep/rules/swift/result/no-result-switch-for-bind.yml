# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-result-switch-for-bind
language: swift
severity: error
utils:
    single-condition:
        kind: guard_statement
        not: {has: {regex: '^,$'}}
rule:
    any:
        - kind: switch_statement
          all:
            - has: {matches: result-success-entry}
            - has: {matches: result-failure-entry}
            - not: {has: {kind: switch_entry, nthChild: {position: 3, ofRule: {kind: switch_entry}}}}
        - kind: if_statement
          regex: '^if\s+case\s+(let\s+)?\.failure\b'
          has: {matches: result-failure-return}
        - kind: guard_statement
          regex: '^guard\s+case\s+(let\s+)?\.success\b'
          not: {regex: '(?s)^guard\s+case\s+(let\s+)?\.success\b[^,]*,.*\b(case|let|var)\b'}
          has: {matches: result-failure-return}
        - matches: single-condition
          regex: '^guard\s+(let|var)\s'
          all:
            - has: {kind: try_expression, stopBy: end, has: {kind: try_operator, regex: '^try\?$'}}
            - has: {kind: navigation_suffix, stopBy: end, regex: '^\.get$'}
            - has: {matches: result-failure-return}
message: 'Statement unpacks a Result by hand, failure returned and value bound'
note: '`<operation>.flatMap { value in ... }` skips the continuation on a failure, `bind` of `Issues.swift` where a side awaits, `mapError` first where the arm replaces the failure'
