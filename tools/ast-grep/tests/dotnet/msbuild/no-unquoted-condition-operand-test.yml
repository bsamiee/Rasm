id: no-unquoted-condition-operand
valid:
    - |
      <Optimize Condition="'$(TargetFramework)' == 'net10.0'">true</Optimize>
    - |
      <TargetFramework Condition="'$(TargetFramework)' == ''">net10.0</TargetFramework>
    - |
      <HostUi Condition="$(_HostTokens.Contains(';ui;')) or '$(HostPlatform)' == 'true'">true</HostUi>
    - |
      <_Missing Include="@(Reference->'%(HintPath)')" Condition="'%(Reference.HintPath)' != '' and !Exists('%(Reference.HintPath)')" />
    - |
      <Message Text="expected == $(Expected)" />
    - |
      <IsMac Condition="$([MSBuild]::IsOSPlatform('OSX')) == true">true</IsMac>
    - |
      <IsMac Condition="'$(HostIsMac)' == $([MSBuild]::IsOSPlatform('OSX'))">true</IsMac>
    - |
      <Trim Condition="($(OutputType) == 'Exe') and '$(SelfContained)' == 'true'">true</Trim>
    - |
      <Trim Condition="'$(OutputType)' == 'Exe' and (Exists('bin') or '$(Configuration)' == Release)">true</Trim>
    - |
      <Trim Condition="'$(OutputType)' == 'Exe' and $(SelfContained) != true">true</Trim>
    - |
      <Optimize Condition="`$(Configuration)` == `Release`">true</Optimize>
    - |
      <Optimize Condition='&apos;$(Configuration)&apos; == &apos;Release&apos;'>true</Optimize>
    - |
      <Trim Condition="$(OutputType) == Exe
        and $(SelfContained) != true">true</Trim>
    - |
      <P Condition="'a==b' == 'a==b'">true</P>
    - |
      <P Condition="'a!=b' != 'c'">true</P>
    - |
      <Item Condition="!$(Enabled)">true</Item>
    - |
      <Item Condition="$(Enabled)">true</Item>
    - |
      <Item Condition="Exists('$(Path)')">true</Item>
invalid:
    - |
      <Optimize Condition="$(TargetFramework) == net10.0">true</Optimize>
    - |
      <PropertyGroup Condition="$(OutputType) == 'Exe'"><SelfContained>false</SelfContained></PropertyGroup>
    - |
      <Compile Include="Extra.cs" Condition="'$(Configuration)' != Release" />
    - |
      <Optimize Condition="$(Configuration)==Release">true</Optimize>
    - |
      <Optimize Condition="'$(Configuration) $(Platform)' == Release">true</Optimize>
    - |
      <P Condition="'a==b' == value">true</P>
    - |
      <Item Condition="$(Path) == ''">true</Item>
    - |
      <Compile Include="Item.cs" Condition="%(Compile.Role) == host" />
    - |
      <Item Condition="@(Asset) != ''">true</Item>
    - |
      <Item Condition="$(Enabled) == true">true</Item>
    - |
      <Item Condition='$(Configuration) == Release'>true</Item>
    - |
      <Optimize Condition='$(Configuration) == "Release"'>true</Optimize>
    - |
      <Item Condition='"$(Configuration)" == Release'>true</Item>
    - |
      <Item Condition='"$(Configuration)" == "Release"'>true</Item>
    - |
      <Optimize Condition="&quot;$(Configuration)&quot; == Release">true</Optimize>
    - |
      <Optimize Condition="&quot;$(Configuration)&quot; != &quot;Release&quot;">true</Optimize>
