# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-stdlib-record
language: python
severity: error
rule:
    pattern: $NAME
    any:
        - matches: {python-member-use: {module: {regex: "^collections$"}, name: {regex: "^namedtuple$"}}}
        - matches: {python-member-use: {module: {regex: "^(typing|typing_extensions)$"}, name: {regex: "^NamedTuple$"}}}
        - matches: {python-member-use: {module: {regex: "^dataclasses$"}, name: {regex: "^(dataclass|make_dataclass)$"}}}
message: '`$NAME` declares a record outside msgspec and Pydantic'
note: 'Declare fields on `msgspec.Struct` with `frozen=True`, or on a Pydantic model when it validates input'
