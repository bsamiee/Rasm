# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    env-value:
        any:
            - all:
                - any:
                    - follows: {regex: '^=$', follows: {pattern: env}}
                    - inside: {kind: token_tree, regex: '^\(', follows: {pattern: env}}
                - inside: {kind: token_tree, stopBy: {kind: attribute}, inside: {kind: attribute}}
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|::)env::(var|var_os|set_var|remove_var)$'}}}
            - inside: {kind: token_tree, follows: {regex: '^!$', follows: {kind: identifier, regex: '^(option_)?env$'}}}
rule:
    any:
        - kind: 'string_literal, raw_string_literal'
          all:
            - regex: '^r?#*"([A-Z0-9]+_)*(OTLP|OTEL|OPENTELEMETRY|TELEMETRY)(_[A-Z0-9]+)*"#*$'
            - not: {regex: '^r?#*"OTEL_'}
            - pattern: $NAME
            - any:
                - matches: env-value
                - all:
                    - inside: {kind: 'const_item, static_item', field: value, has: {field: name, pattern: $CONST}}
                    - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: identifier, pattern: $CONST, matches: env-value}}
        - pattern: env
          all:
            - follows: {regex: '^[,(]$'}
            - precedes: {regex: '^[,)]$'}
            - inside: {kind: token_tree, inside: {kind: attribute, field: arguments, has: {field: path, regex: '^(arg|clap)$'}}}
            - inside:
                kind: attribute_item
                stopBy: end
                precedes:
                    stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}
                    kind: field_declaration
                    has: {field: name, pattern: $NAME, regex: '(^|_)(otlp|otel|opentelemetry|telemetry)(_|$)', not: {regex: '^otel_'}}
    not: {matches: rust-test-scope}
message: '`$NAME` names a telemetry environment variable outside the OpenTelemetry `OTEL_*` set'
note: 'Use `rasm_command::run` for flattened `rasm_command::telemetry::Options`, or read specified `OTEL_*` variables'
