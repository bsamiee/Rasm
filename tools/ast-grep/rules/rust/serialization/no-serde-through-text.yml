# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-serde-through-text
language: rust
severity: error
utils:
    serde-method:
        kind: function_item
        any:
            - all:
                - has: {field: name, regex: '^serialize$'}
                - inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '(^|::)Serialize$'}}}
            - all:
                - has: {field: name, regex: '^deserialize$'}
                - inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '(^|::)Deserialize\s*<'}}}
    display-write:
        kind: call_expression
        any:
            - pattern: $S.serialize_str(&self.to_string())
            - pattern: $S.collect_str(self)
            - pattern: $S.collect_str(&self)
    text-read:
        kind: call_expression
        has: {field: function, regex: '^(String|<\s*&\s*(''\w+\s+)?str\s*>|Cow::<\s*str\s*>|<\s*(String|&\s*(''\w+\s+)?str)\s+as\s+((serde::)?(de::)?)?Deserialize(<[^>]*>)?\s*>)::deserialize$'}
    text-parse:
        kind: call_expression
        any:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^parse$'}}
            - has: {field: function, kind: generic_function, has: {field: function, kind: field_expression, has: {field: field, regex: '^parse$'}}}
            - has: {field: function, kind: scoped_identifier, has: {field: name, regex: '^from_str$'}}
rule:
    pattern: $SITE
    any:
        - matches: display-write
          inside: {kind: function_item, stopBy: {kind: function_item}, matches: serde-method}
        - matches: text-read
          inside:
            kind: function_item
            stopBy: {kind: function_item}
            all:
                - matches: serde-method
                - has: {field: body, has: {stopBy: end, matches: text-parse}}
message: '`$SITE` serializes or deserializes a value through `Display` or `FromStr` text by hand'
note: 'Derive `serde_with::SerializeDisplay` and `serde_with::DeserializeFromStr` on the type, or mark a field `#[serde_as(as = "serde_with::DisplayFromStr")]`, and delete the hand impl, serde_with writes the `Display` text and parses through `FromStr` with the parse error as the serde error'
