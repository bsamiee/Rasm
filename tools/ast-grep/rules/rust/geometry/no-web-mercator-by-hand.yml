# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-web-mercator-by-hand
language: rust
severity: error
utils:
    quarter-turn:
        kind: 'identifier, scoped_identifier, binary_expression'
        regex: '^((\w+::)*FRAC_PI_4|(\w+::)*PI\s*/\s*4(\.0*)?(_?f(32|64))?)$'
    half-turn:
        kind: 'identifier, scoped_identifier, binary_expression'
        regex: '^((\w+::)*FRAC_PI_2|(\w+::)*PI\s*/\s*2(\.0*)?(_?f(32|64))?)$'
rule:
    kind: call_expression
    pattern: $CALL
    any:
        - pattern: $E.tan().ln()
          has: {field: function, has: {field: value, has: {field: function, has: {field: value, has: {stopBy: end, matches: quarter-turn}}}}}
        - pattern: $E.tan().asinh()
        - pattern: $E.sinh().atan()
        - pattern: $E.exp().atan()
          inside:
            kind: binary_expression
            stopBy: {not: {kind: 'binary_expression, parenthesized_expression'}}
            all:
                - has: {field: operator, regex: '^-$'}
                - has: {field: right, matches: half-turn}
message: '`$CALL` computes the Web Mercator projection by hand'
note: 'Transform through `proj::Proj::new_known_crs("EPSG:4326", "EPSG:3857", None)` and call `convert`'
