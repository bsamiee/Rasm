# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-log-handler-body
language: swiftlang
rule:
    inside: { stopBy: end, kind: function_declaration, has: { field: name, regex: '^log$' }, inside: { stopBy: end, kind: class_declaration, has: { kind: inheritance_specifier, regex: 'LogHandler$' } } }
