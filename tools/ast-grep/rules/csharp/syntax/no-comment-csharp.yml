# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-comment-csharp
language: csharp
severity: error
rule:
    kind: comment
    pattern: $COMMENT
    not: {regex: '^// --- \[[A-Z][A-Z0-9_]*\]( -+)?\s*$'}
transform:
    FIRST: {replace: {source: $COMMENT, replace: '(?s)^(/\*+)[ \t]*([^\n]*?)\s*\n.*$', by: '$1 $2 */'}}
    TEXT: {replace: {source: $FIRST, replace: '\s+$', by: ''}}
message: '`$TEXT` comments code outside a section divider'
note: 'Move each comment''s fact into a name or type and delete every comment except `// --- [<SECTION>] ---` and `// --- [<FAMILY>]` dividers'
