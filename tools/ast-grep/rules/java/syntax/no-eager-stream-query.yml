# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: javalang
severity: error
utils:
    stage:
        kind: method_invocation
        any:
            - has: {field: name, regex: '^(stream|parallelStream|filter|map|mapToObj|mapToInt|mapToLong|mapToDouble|flatMap(?:ToInt|ToLong|ToDouble)?|mapMulti(?:ToInt|ToLong|ToDouble)?|asLongStream|asDoubleStream|gather|sequential|parallel|unordered|onClose|distinct|sorted|skip|limit|boxed|takeWhile|dropWhile|lines|chars|codePoints|results|splitAsStream)$'}
            - all:
                - has: {field: object, regex: '^(Stream|IntStream|LongStream|DoubleStream|Arrays|StreamSupport)$'}
                - has: {field: name, regex: '^(of|ofNullable|concat|iterate|generate|range|rangeClosed|stream)$'}
    collected:
        kind: method_invocation
        all:
            - any:
                - has: {field: name, pattern: toList}
                - all:
                    - has: {field: name, pattern: collect}
                    - has: {field: arguments, has: {kind: method_invocation, has: {field: name, regex: '^(toList|toSet|toUnmodifiableList|toUnmodifiableSet|toCollection)$'}}}
            - has: {field: object, matches: stage}
    counted:
        kind: method_invocation
        all:
            - has: {field: name, pattern: count}
            - has: {field: object, matches: stage}
    zero:
        regex: '^0[lL]?$'
    one:
        regex: '^1[lL]?$'
    sorted:
        kind: method_invocation
        has: {field: name, pattern: sorted}
rule:
    any:
        - kind: binary_expression
          any:
            - all:
                - any:
                    - all: [{has: {field: operator, regex: '^(>|!=|==|<=)$'}}, {has: {field: right, matches: zero}}]
                    - all: [{has: {field: operator, regex: '^(>=|<)$'}}, {has: {field: right, matches: one}}]
                - has: {field: left, matches: counted, pattern: $TERM}
            - all:
                - any:
                    - all: [{has: {field: operator, regex: '^(<|!=|==|>=)$'}}, {has: {field: left, matches: zero}}]
                    - all: [{has: {field: operator, regex: '^(<=|>)$'}}, {has: {field: left, matches: one}}]
                - has: {field: right, matches: counted, pattern: $TERM}
        - kind: method_invocation
          all:
            - any:
                - all: [{has: {field: name, regex: '^(isEmpty|getFirst|contains)$'}}, {has: {field: object, matches: collected, pattern: $TERM}}]
                - all: [{has: {field: name, pattern: get}}, {has: {field: arguments, has: {matches: zero}}}, {has: {field: object, matches: collected, pattern: $TERM}}]
                - all: [{has: {field: name, regex: '^(findFirst|findAny)$'}}, {has: {field: object, matches: sorted, pattern: $TERM}}]
                - all: [{has: {field: name, pattern: limit}}, {has: {field: arguments, has: {matches: one}}}, {has: {field: object, matches: sorted, pattern: $TERM}}]
transform:
    CHAIN: {replace: {source: $TERM, replace: '[\t-\r ]*\n[\t-\r ]*', by: ''}}
message: '`$CHAIN` evaluates or sorts a stream before an element query'
note: 'Use `anyMatch` with `Objects.equals` for membership, existence predicates, or terminal `findFirst`, `min`, or `max` selection'
