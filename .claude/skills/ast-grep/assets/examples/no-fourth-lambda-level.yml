# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-fourth-lambda-level
language: python
severity: error
utils:
    callback: # The role, a lambda under an argument list that declares a parameter, a chain over the kind alone counts every lambda
        kind: lambda
        all:
            - any: # Positional or keyword argument, a dictionary value and a default parameter value sit in neither position
                - inside: {kind: argument_list}
                - inside: {kind: keyword_argument, inside: {kind: argument_list}}
            - has: {field: parameters, kind: lambda_parameters} # A thunk declares none, and a field with no rule key beside it fails the parse
rule:
    matches: callback
    all:
        - inside:
            matches: callback
            stopBy: end
            inside:
                matches: callback
                stopBy: end
                inside: {matches: callback, stopBy: end}
        - not: {has: {matches: callback, stopBy: end}} # The innermost callback of a chain reports once
message: A lambda with a parameter sits four callback levels deep and the reader carries four scopes
note: Name the inner steps as functions or write the traversal as a comprehension
