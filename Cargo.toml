opus = { version = "0.4.0", default-features = false }    # Opus encoding and decoding
subtitler = { version = "2.9.0", default-features = false, features = ["srt", "vtt", "ass", "ssa", "ttml"] } # Subtitle parsing, conversion, and retiming
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "vorbis", "flac", "aac", "wav", "ogg", "isomp4", "opt-simd"] } # Audio decoding
# --- [MACHINE_LEARNING]
