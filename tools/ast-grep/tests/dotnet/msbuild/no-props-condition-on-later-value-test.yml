id: no-props-condition-on-later-value
valid:
    - '<PropertyGroup Label="$(TargetFramework)"><Enabled>true</Enabled></PropertyGroup>'
    - |
      <PropertyGroup><TargetFramework Condition="'$(TargetFramework)' == ''">net10.0</TargetFramework></PropertyGroup>
    - |
      <PropertyGroup><TargetFramework Condition="'$(TargetFramework)' == '' and '$(TargetFrameworks)' == ''">net10.0</TargetFramework></PropertyGroup>
    - |
      <PropertyGroup><ProjectRole Condition="$(MSBuildProjectDirectory.StartsWith('$(LibsRoot)'))">libs</ProjectRole></PropertyGroup>
    - |
      <PropertyGroup><IsPackable Condition="'$(ProjectRole)' != 'libs'">false</IsPackable></PropertyGroup>
    - |
      <ItemGroup Condition="'$(TargetFramework)' == 'net10.0'"><PackageVersion Include="Some.Package" Version="10.0.0" /></ItemGroup>
    - |
      <Target Name="Report"><PropertyGroup Condition="'$(OutputType)' == 'Exe'"><_Host>true</_Host></PropertyGroup></Target>
    - |
      <PropertyGroup Condition="'$(CI)' == 'true'"><ContinuousIntegrationBuild>true</ContinuousIntegrationBuild></PropertyGroup>
    - |
      <PropertyGroup Condition="'$(Configuration)' == 'Release'"><Optimize>true</Optimize></PropertyGroup>
    - |
      <ItemGroup><None Include="$(TargetFramework)/item.txt" /></ItemGroup>
    - |
      <Import Project="item.props" Condition="'$(OutputType)' == ''" />
invalid:
    - |
      <PropertyGroup Condition="'$(TargetFramework)' == 'net10.0'"><DefineConstants>$(DefineConstants);MY_FEATURE</DefineConstants></PropertyGroup>
    - |
      <PropertyGroup><SelfContained Condition="'$(OutputType)' == 'Exe'">false</SelfContained></PropertyGroup>
    - |
      <PropertyGroup Label="Rhino Host Bundle" Condition="'$(HostCommon)' == 'true'">
        <RhinoAppPath Condition="'$(RhinoAppPath)' == ''">/Applications/RhinoWIP.app</RhinoAppPath></PropertyGroup>
    - |
      <PropertyGroup Label="Test Coverage" Condition="'$(IsTestingPlatformApplication)' == 'true'"><IsTestProject>true</IsTestProject></PropertyGroup>
    - |
      <Choose><When Condition="'$(TargetFramework)' == 'net10.0'"><PropertyGroup><Modern>true</Modern></PropertyGroup></When></Choose>
    - |
      <Import Project="host.props" Condition="'$(OutputType)' == 'Exe'" />
    - |
      <Import Project="$(MSBuildThisFileDirectory)frameworks/$(TargetFramework).props" />
    - |
      <PropertyGroup Condition="$(TargetFramework.StartsWith('net'))"><Item>true</Item></PropertyGroup>
    - |
      <PropertyGroup Condition="'$(TargetFrameworks)' != ''"><Item>true</Item></PropertyGroup>
    - |
      <PropertyGroup Condition='$(OutputType) == Exe'><Item>true</Item></PropertyGroup>
    - |
      <Import Project="$(MSBuildThisFileDirectory)$(OutputType).props" />
