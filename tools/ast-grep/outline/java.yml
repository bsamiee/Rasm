id: java-package
language: javalang
role: item
symbolType: package
rule:
    kind: package_declaration
    has: {kind: 'identifier, scoped_identifier', pattern: $NAME}
name: $NAME
isExported: false
---
id: java-import
language: javalang
role: item
symbolType: module
rule: {kind: import_declaration, pattern: $DECLARATION}
rewriters:
    - id: module
      rule: {kind: 'identifier, scoped_identifier', pattern: $PATH, inside: {kind: import_declaration, field: module}}
      fix: module $PATH
    - id: path
      rule: {kind: 'identifier, scoped_identifier, asterisk', pattern: $PATH, inside: {kind: import_declaration}}
      fix: $PATH
transform:
    NAME: {rewrite: {source: $DECLARATION, rewriters: [module, path], joinBy: .}}
name: $NAME
isImport: true
isExported: false
---
id: java-module
language: javalang
role: item
symbolType: module
rule:
    kind: module_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: module-body
      rule: {kind: module_body, inside: {kind: module_declaration, field: body}}
      fix: ;
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [module-body]}}
    LINE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r ])+$|[\t-\r ]*\n[\t-\r ]*', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
---
id: java-class
language: javalang
role: item
symbolType: class
utils:
    exposed:
