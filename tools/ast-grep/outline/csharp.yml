name: $QUALIFIER$NAME
signature: $DECLARATION
isPublic: {not: {inside: {stopBy: end, kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration, union_declaration, enum_declaration', inside: {kind: declaration_list, inside: {kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration, union_declaration'}}, not: {matches: public}}}}
