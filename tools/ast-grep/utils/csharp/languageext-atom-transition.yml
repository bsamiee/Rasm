# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: languageext-atom-transition
language: csharplang
rule:
    kind: invocation_expression
    any:
        - matches:
            languageext-atom-call:
                member: {regex: '^(Swap|SwapIO|SwapMaybe|SwapMaybeIO|SwapKey|AddOrUpdate|MapInPlace|FilterInPlace|BindInPlace|Commute)$'}
        - all:
            - matches: {csharp-named-call: {name: {regex: '^(swap|commute)$'}}}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: languageext-atom-cell}}}
