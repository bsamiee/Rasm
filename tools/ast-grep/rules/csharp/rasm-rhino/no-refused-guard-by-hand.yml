# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-refused-guard-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    owner:
        matches: {csharp-type-name: {name: {regex: '^Refused$'}}}
    member-text:
        any:
            - kind: string_literal, verbatim_string_literal, raw_string_literal, interpolated_string_expression
            - kind: invocation_expression
              has: {field: function, regex: '^nameof$'}
    unsafe:
        any:
            - kind: member_access_expression, element_access_expression, conditional_access_expression, cast_expression
            - kind: binary_expression
              has: {field: operator, regex: '^[/%]$'}
            - kind: object_creation_expression
              has: {field: type, matches: owner}
    plain:
        any:
            - kind: lambda_expression
            - not: {any: [{matches: unsafe}, {has: {stopBy: {kind: lambda_expression}, matches: unsafe}}]}
    typed:
        has: {matches: {csharp-type-name: {name: {regex: '^Fin$'}}}}
    result:
        inside:
            any:
                - kind: lambda_expression
                  matches: typed
                - kind: arrow_expression_clause, return_statement
                  inside:
                    stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, property_declaration'}
                    kind: method_declaration, local_function_statement, lambda_expression, property_declaration
                    matches: typed
                - kind: conditional_expression
                  matches: result
    refusal:
        kind: object_creation_expression
        pattern: $REFUSAL
        all:
            - has: {field: type, matches: owner}
            - has: {field: arguments, has: {kind: argument, nthChild: 2, has: {matches: {csharp-owner-member: {type: {regex: '^Refused$'}, member: {regex: '^(Declined|Absent|Invalid)$'}}}}}}
            - not: {all: [{has: {field: arguments, has: {kind: argument, nthChild: 3}}}, {not: {has: {field: arguments, has: {kind: argument, nthChild: 2, regex: 'Declined$'}}}}]}
    absent-refusal:
        matches: refusal
        has: {field: arguments, has: {kind: argument, nthChild: 2, regex: 'Absent$'}}
    valued-refusal:
        matches: refusal
        not: {matches: absent-refusal}
    unit-value:
        kind: identifier
        regex: '^unit$'
    optional-chain:
        kind: invocation_expression
        has: {field: arguments, not: {has: {kind: argument, nthChild: 2}}}
        any:
            - all: [{has: {field: function, regex: '^Optional(\s*<.+>)?$'}}, {has: {field: arguments, has: {kind: argument, pattern: $CHECKED}}}]
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Map(\s*<.+>)?$'}}, {has: {field: expression, matches: optional-chain}}]}
    null-present:
        any:
            - kind: is_pattern_expression
              all:
                - has: {field: expression, pattern: $CHECKED}
                - has: {field: pattern, any: [{regex: '^not\s+null$'}, {regex: '^\{\s*\}$'}]}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^!=$'}
                - any:
                    - all: [{has: {field: left, pattern: $CHECKED}}, {has: {field: right, kind: null_literal}}]
                    - all: [{has: {field: left, kind: null_literal}}, {has: {field: right, pattern: $CHECKED}}]
    null-absent:
        any:
            - kind: is_pattern_expression
              all:
                - has: {field: expression, pattern: $CHECKED}
                - has: {field: pattern, regex: '^null$'}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^==$'}
                - any:
                    - all: [{has: {field: left, pattern: $CHECKED}}, {has: {field: right, kind: null_literal}}]
                    - all: [{has: {field: left, kind: null_literal}}, {has: {field: right, pattern: $CHECKED}}]
    discarding-lift:
        kind: argument
        has:
            kind: lambda_expression
            all:
                - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $DISCARDED}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $DISCARDED}}, not: {has: {kind: parameter, nthChild: 2}}}]}
                - has: {field: body, not: {kind: block}, matches: plain, pattern: $VALUE}
                - not: {has: {field: body, any: [{pattern: $DISCARDED}, {has: {stopBy: end, kind: identifier, pattern: $DISCARDED}}]}}
    unless-call:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Refused$'}, member: {regex: '^Unless$'}}}}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, pattern: $CHECKED}}
            - any:
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 2, pattern: $MEMBER}}, {not: {has: {kind: argument, nthChild: 3}}}]}
                - has:
                    field: arguments
                    all:
                        - has: {kind: argument, nthChild: 2, pattern: $MEMBER, has: {matches: member-text}}
                        - has: {kind: argument, nthChild: 3, pattern: $INDEX, not: {has: {matches: member-text}}}
                        - not: {has: {kind: argument, nthChild: 4}}
rewriters:
    - id: optional-owner
      rule:
        kind: invocation_expression
        all:
            - has: {field: function, regex: '^Optional(\s*<.+>)?$', pattern: $LIFT}
            - has: {field: arguments, has: {kind: argument, pattern: $LIFTED}}
      transform:
        GUARD: {replace: {source: $LIFT, replace: '^Optional', by: Refused.UnlessFound}}
      fix: $GUARD($LIFTED, $MEMBER)
    - id: unchanged-arguments
      rule: {kind: argument_list, pattern: $ARGUMENTS}
      fix: $ARGUMENTS
    - id: optional-refusal
      rule:
        kind: invocation_expression
        pattern: $ANSWER.ToFin(new Refused($MEMBER, Refused.Absent))
      transform:
        OWNED: {rewrite: {source: $ANSWER, rewriters: [unchanged-arguments, optional-owner]}}
      fix: $OWNED
    - id: mapped-unless
      rule:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Select)$'}}, {has: {field: expression, matches: unless-call}}]}
            - has: {field: arguments, all: [{has: {matches: discarding-lift}}, {not: {has: {kind: argument, nthChild: 2}}}]}
      transform:
        INDEXED: {replace: {source: $INDEX, replace: '(?s)^(.+)$', by: ', $1'}}
      fix: Refused.Unless($CHECKED, $VALUE, $MEMBER$INDEXED)
rule:
    kind: invocation_expression, conditional_expression
    pattern: $MATCH
    all:
        - any:
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Select)$'}}, {has: {field: expression, matches: unless-call}}]}
                - has: {field: arguments, all: [{has: {matches: discarding-lift}}, {not: {has: {kind: argument, nthChild: 2}}}]}
            - kind: invocation_expression
              pattern: $ANSWER.ToFin(new Refused($MEMBER, Refused.Absent))
              has: {field: function, has: {field: expression, matches: optional-chain}}
            - kind: conditional_expression
              matches: result
              any:
                - all:
                    - has: {field: condition, matches: null-present}
                    - has: {field: consequence, pattern: $CHECKED}
                    - has: {field: alternative, matches: absent-refusal}
                - all:
                    - has: {field: condition, matches: null-absent}
                    - has: {field: consequence, matches: absent-refusal}
                    - has: {field: alternative, pattern: $CHECKED}
                - all:
                    - has: {field: condition, pattern: $CHECKED, not: {has: {stopBy: end, kind: 'declaration_pattern, var_pattern, recursive_pattern'}}}
                    - any:
                        - all: [{has: {field: alternative, matches: valued-refusal}}, {has: {field: consequence, matches: plain}}]
                        - all: [{has: {field: consequence, matches: valued-refusal}}, {has: {field: alternative, matches: plain}}]
                        - all: [{has: {field: alternative, matches: absent-refusal}}, {has: {field: consequence, matches: unit-value}}]
                        - all: [{has: {field: consequence, matches: absent-refusal}}, {has: {field: alternative, matches: unit-value}}]
        - not: {matches: {csharp-owner-body: {type: {regex: '^Refused$'}, member: {regex: '^Unless\w*$'}}}}
transform:
    GUARDED: {rewrite: {source: $MATCH, rewriters: [optional-refusal, mapped-unless]}}
fix: $GUARDED
labels:
    CHECKED: {style: primary, message: 'Condition the guard takes'}
    REFUSAL: {style: secondary, message: 'Refusal the guard builds'}
message: '`$CHECKED` chooses between a value and `Refused` by hand'
note: 'Call the reason''s `Refused` guard, `Unless` or its index overload for `Declined`, `UnlessFound` for `Absent`, `UnlessValid` for `Invalid`'
