# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-host-tests"
edition.workspace = true
description       = "Runs application tests with native runners"

# --- [TARGETS] --------------------------------------------------------------------------

[[bin]]
name = "rasm-host-tests"
path = "main.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures            = { workspace = true }
tokio              = { workspace = true }
jiff               = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
rasm-command       = { workspace = true }
rasm-process       = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
tokio-util = { workspace = true }
thiserror  = { workspace = true }
fs-err     = { workspace = true, features = ["tokio"] }
url        = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
