# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    log-member:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^(log|logTrace|logDebug|logInfo|logWarning|logError|logFatal)$'}}}
    failure-handler:
        kind: call_expression
        has:
            field: function
            matches:
                effect-module-member:
                    module: {regex: '(?-u:\b)(Effect|Stream|Channel|Layer)$'}
                    member:
                        regex: |-
                            (?x)^(catch|catchCause|catchCauseFilter|catchCauseIf|catchDefect|catchEager|catchFilter|catchIf|catchReason|catchReasons
                            |catchTag|catchTags|matchCauseEffect|matchCauseEffectEager|matchEffect|tapError|tapErrorTag)$
    handler-argument:
        any:
            - inside: {kind: arguments, inside: {matches: failure-handler}}
            - inside: {kind: pair, field: value, not: {has: {field: key, regex: '^onSuccess$'}}, inside: {kind: object, inside: {kind: arguments, inside: {matches: failure-handler}}}}
    handler-parameter:
        any:
            - has: {field: parameter, kind: identifier, pattern: $ERROR}
            - has: {field: parameters, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $ERROR}}}
    reads-error:
        has: {field: arguments, has: {stopBy: end, kind: 'identifier, shorthand_property_identifier', pattern: $ERROR}}
    annotated-error:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^annotateLogs$'}}}}
            - matches: reads-error
    failure-callback:
        kind: arrow_function, function_expression
        all: [{matches: handler-argument}, {matches: handler-parameter}]
rule:
    any:
        - pattern: $LOG
          all: [{matches: log-member}, {matches: handler-argument}]
        - kind: call_expression
          all:
            - has: {field: function, pattern: $LOG, matches: log-member}
            - inside: {matches: failure-callback, stopBy: end}
            - any:
                - matches: reads-error
                - inside: {kind: arguments, inside: {matches: annotated-error}}
                - inside:
                    kind: member_expression
                    field: object
                    has: {field: property, regex: '^pipe$'}
                    inside: {kind: call_expression, field: function, has: {field: arguments, has: {matches: annotated-error}}}
message: '`$LOG` logs a failure inside a failure handler'
note: 'Log through `Effect.tapCause(Effect.logError)` before recovery, discard through `Effect.ignore({ log })` or `Effect.ignoreCause({ log })`'
