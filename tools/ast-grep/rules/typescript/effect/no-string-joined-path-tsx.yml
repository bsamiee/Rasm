# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores: ['plugins/function-hooks/hooks/**']
utils:
    directory-read:
        any:
            - kind: member_expression
              regex: '^import\.meta\.(dirname|filename)$'
            - kind: identifier
              regex: '^__(dirname|filename)$'
              matches: typescript-global-reference
    slash-join:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^join$'}}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: string, regex: '^[''"]/[''"]$'}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
    directory-use: {kind: 'identifier, member_expression', pattern: $DIR}
    joined:
        any:
            - matches: slash-join
              has: {field: function, has: {field: object, kind: array, has: {matches: directory-use}}}
            - kind: template_string
              all:
                - has:
                    kind: template_substitution
                    has: {matches: directory-use}
                    precedes: {kind: string_fragment, regex: '^/'}
                - not: {has: {kind: string_fragment, regex: '[*{}]|://'}}
                - not: {inside: {kind: call_expression, field: arguments}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\+$'}
                - has: {field: left, any: [{matches: directory-use}, {kind: binary_expression, has: {field: left, matches: directory-use}}]}
                - has: {stopBy: end, kind: string, regex: '^[''"]/'}
                - not: {inside: {kind: binary_expression, field: left}}
rule:
    any:
        - matches: directory-read
          pattern: $DIR
          inside: {stopBy: end, matches: joined, pattern: $JOINED}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $DIR}
            - has: {field: value, matches: directory-read}
            - inside:
                kind: statement_block, program
                stopBy: {kind: 'statement_block, program'}
                has: {stopBy: end, matches: joined, pattern: $JOINED}
message: '`$JOINED` joins a file-system path with a `/` literal'
note: 'Call `path.join(<directory>, <segment>)` on the yielded `Path.Path` service'
labels:
    JOINED: {style: primary}
