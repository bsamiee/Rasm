# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-raising-host-call-in-ok
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    refusing:
        kind: call
        pattern: $CALL
        has:
            field: function
            any:
                - kind: attribute
                  all:
                    - has: {field: attribute, regex: '^(new|new_from_object|load|remove|create_gpencil_data|remove_gpencil_data)$'}
                    - has: {field: object, kind: attribute, has: {field: object, matches: {python-member-use: {module: {regex: '^bpy$'}, name: {regex: '^data$'}}}}}
                - matches: {python-member-use: {module: {regex: '^gpu\.types$'}, name: {regex: '^(Buffer|GPUBatch|GPUFrameBuffer|GPUIndexBuf|GPUOffScreen|GPUStorageBuf|GPUTexture|GPUUniformBuf|GPUVertBuf|GPUVertFormat)$'}}}
rule:
    kind: call
    all:
        - has: {field: function, kind: identifier, regex: '^Ok$', matches: {expression-member: {name: {regex: '^Ok$'}}}}
        - has: {field: arguments, not: {has: {nthChild: 2}}, has: {nthChild: 1, matches: refusing}}
message: '`Ok($CALL)` lets a host refusal raise'
note: 'Call `expression.extra.result.catch(<callee>, exception=<error>)(<arguments>)`'
