# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-default
language: swiftlang
severity: error
utils:
    optional-try:
        kind: try_expression
        has: {kind: try_operator, regex: '^try\?$'}
    tried-chain:
        any:
            - matches: optional-try
            - kind: navigation_expression
              has: {field: target, matches: tried-chain}
            - kind: call_expression
              has: {nthChild: 1, matches: tried-chain}
            - kind: tuple_expression
              has: {field: value, matches: tried-chain}
    get-call:
        kind: call_expression
        all:
            - has: {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^get$'}}}
            - has: {kind: call_suffix, has: {kind: value_arguments, not: {has: {kind: value_argument}}}}
    consumed:
        any:
            - inside: {kind: 'nil_coalescing_expression, guard_statement, if_statement, while_statement, equality_expression, infix_expression'}
            - inside: {kind: tuple_expression, inside: {kind: 'nil_coalescing_expression, equality_expression, infix_expression'}}
    projected-body:
        kind: statements
        all:
            - has:
                nthChild: 1
                any:
                    - pattern: $VALUE
                    - pattern: {context: 'func f() { return $VALUE }', selector: control_transfer_statement}
            - not: {has: {nthChild: 2}}
    value-return:
        kind: control_transfer_statement
        has: {field: result, not: {any: [{matches: swift-success-call}, {matches: swift-failure-call}]}}
    success-projection:
        kind: switch_entry
        all:
            - has:
                kind: switch_pattern
                regex: '^(\.success\(let\s+\w+\)|let\s+\.success\(\w+\))$'
                has: {stopBy: end, kind: pattern, inside: {kind: pattern}, has: {kind: simple_identifier, pattern: $VALUE}}
            - has: {matches: projected-body}
    partition:
        inside:
            kind: lambda_literal
            stopBy: end
            inside:
                kind: call_suffix
                inside: {kind: call_expression, has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, regex: '^\.compactMap$'}}}
    failure-default:
        kind: switch_entry
        all:
            - any:
                - has: {kind: switch_pattern, regex: '^\.failure(\(_\))?$'}
                - has: {kind: default_keyword}
            - not: {has: {kind: switch_pattern, nthChild: {position: 2, ofRule: {kind: switch_pattern}}}}
    default-value:
        any:
            - kind: 'boolean_literal, integer_literal, real_literal, line_string_literal, array_literal, dictionary_literal'
            - kind: prefix_expression
              has: {field: operation, regex: '^\.$'}
              not: {has: {field: target, regex: '^none$'}}
            - {kind: prefix_expression, regex: '^-\s*[0-9]'}
    swallowing-catch:
        kind: catch_block
        all:
            - not: {has: {kind: 'pattern, where_clause'}}
            - not: {has: {stopBy: end, kind: simple_identifier, regex: '^error$'}}
            - has:
                kind: statements
                matches:
                    swift-single-statement:
                        first:
                            kind: 'control_transfer_statement, assignment'
                            has: {field: result, matches: default-value}
rule:
    pattern: $SITE
    any:
        - kind: do_statement
          has: {matches: swallowing-catch}
        - kind: nil_coalescing_expression
          has: {field: value, matches: tried-chain}
          not: {has: {field: if_nil, regex: '^nil$'}}
        - matches: optional-try
          has: {field: expr, any: [{matches: get-call}, {kind: await_expression, has: {field: expr, matches: get-call}}]}
          not: {any: [{matches: consumed}, {matches: partition}]}
        - matches: get-call
          has: {kind: navigation_expression, has: {field: target, matches: tried-chain}}
          not: {any: [{matches: consumed}, {matches: partition}]}
        - kind: 'guard_statement, if_statement, while_statement'
          has: {matches: tried-chain, follows: {regex: '^=$'}}
          not: {has: {kind: wildcard_pattern}}
        - kind: 'equality_expression, infix_expression'
          all:
            - has: {matches: tried-chain}
            - has: {field: op, regex: '^[!=]=$'}
            - has: {any: [{regex: '^nil$'}, {kind: boolean_literal}]}
        - kind: switch_statement
          not: {matches: partition}
          all:
            - has: {matches: success-projection}
            - has: {matches: failure-default}
            - not: {has: {kind: switch_entry, nthChild: {position: 3, ofRule: {kind: switch_entry}}}}
        - kind: if_statement
          regex: '^if\s+case\s+(\.success\(let\s+\w+\)|let\s+\.success\(\w+\))\s*='
          all:
            - not: {has: {kind: if_statement}}
            - not: {matches: partition}
            - any:
                - all:
                    - has: {kind: pattern, has: {kind: simple_identifier, pattern: $VALUE}}
                    - has: {nthChild: {position: 1, ofRule: {kind: statements}}, matches: projected-body}
                    - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}}
                - all:
                    - has: {kind: statements, nthChild: {position: 1, ofRule: {kind: statements}}, matches: {swift-single-statement: {first: {matches: value-return}}}}
                    - any:
                        - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}, matches: {swift-single-statement: {first: {matches: value-return}}}}
                        - all:
                            - not: {has: {regex: '^else$'}}
                            - precedes: {matches: value-return}
        - kind: guard_statement
          regex: '^guard\s+case\s+(\.success\(let\s+\w+\)|let\s+\.success\(\w+\))\s*='
          all:
            - not: {has: {regex: '^,$'}}
            - has:
                kind: statements
                matches:
                    swift-single-statement:
                        first:
                            kind: control_transfer_statement
                            has: {field: result, not: {matches: swift-failure-call}}
            - not: {matches: partition}
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` discards the error for `nil` or a default'
note: 'Hold the call in `Result { try <call> }` and recover with `flatMapError`, transform with `map` or `mapError`, or match its `.failure` case'
