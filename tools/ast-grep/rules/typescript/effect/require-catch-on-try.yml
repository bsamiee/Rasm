# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-catch-on-try
language: tsx
severity: error
utils:
    thunk-overload:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^try$'}
                - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Either|STM)$'}}}}
            - all:
                - has: {field: property, regex: '^tryPromise$'}
                - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Effect$'}}}}
rule:
    kind: call_expression
    all:
        - has: {field: arguments, has: {stopBy: {not: {kind: parenthesized_expression}}, kind: 'arrow_function, function_expression'}}
        - has: {field: function, pattern: $TRY, matches: thunk-overload}
message: '`$TRY` runs without an error mapping, the form of the options object `{ try: () => parse(raw), catch: (cause) => new ParseError({ cause }) }`'
note: 'The thunk overload fails with `UnknownException`, the `catch` member names a matchable error'
