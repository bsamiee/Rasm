# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-findall-single-match
language: python
severity: error
utils:
    compile-call:
        kind: call
        has: {field: function, matches: {python-member-use: {module: {regex: '^(re|regex)$'}, name: {regex: '^compile$'}}}}
    compiled-pattern:
        any:
            - kind: identifier
              any:
                - matches: {python-assigned-name: {value: {matches: compile-call}}}
                - matches: {python-typed-parameter: {type: {regex: '^((re|regex)\.)?Pattern(\[.*\])?$'}}}
            - kind: attribute
              pattern: $RX
              has: {field: object, regex: '^self$'}
              inside: {kind: class_definition, stopBy: end, has: {stopBy: end, kind: assignment, all: [{has: {field: left, pattern: $RX}}, {has: {field: right, matches: compile-call}}]}}
    regex-callee:
        any:
            - matches: {python-member-use: {module: {regex: '^(re|regex)$'}, name: {regex: '^(findall|finditer)$'}}}
            - kind: attribute
              all:
                - has: {field: attribute, regex: '^(findall|finditer)$'}
                - has: {field: object, matches: compiled-pattern}
    every-match:
        kind: call
        has: {field: function, regex: '(^|\.)(findall|finditer)$', matches: regex-callee}
    searched:
        matches: every-match
        all:
            - has: {field: function, kind: attribute, pattern: $CALLEE}
            - has: {field: arguments, pattern: $ARGS, not: {has: {kind: keyword_argument, has: {field: name, regex: '^overlapped$'}}}}
    search:
        any: [{matches: searched}, {has: {stopBy: end, matches: searched}}]
    iterated:
        matches: every-match
        has: {field: function, regex: 'finditer$'}
    match-list:
        any:
            - matches: every-match
              has: {field: function, regex: 'findall$'}
            - kind: call
              all:
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: iterated}}, {not: {has: {nthChild: 2}}}]}
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^(list|tuple)$'}}}}
    truth:
        any:
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition}
            - inside: {kind: 'not_operator, if_clause'}
            - all: [{nthChild: 2}, {inside: {kind: conditional_expression}}]
            - inside: {kind: 'boolean_operator, parenthesized_expression', matches: truth}
            - inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^bool$'}}}
    present:
        kind: call
        all:
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: iterated}}, {not: {has: {nthChild: 2}}}]}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^any$'}}}}
    counted:
        kind: call
        all:
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: match-list}}, {not: {has: {nthChild: 2}}}]}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^len$'}}}}
    presence:
        kind: comparison_operator
        all:
            - has: {nthChild: 1, matches: counted}
            - not: {has: {nthChild: 3}}
            - any:
                - all: [{has: {field: operators, regex: '^(>|!=|==)$'}}, {has: {nthChild: 2, regex: '^0$'}}]
                - all: [{has: {field: operators, regex: '^(>=|<)$'}}, {has: {nthChild: 2, regex: '^1$'}}]
    first-read:
        kind: identifier
        any:
            - inside: {kind: subscript, field: value, has: {field: subscript, regex: '^0$'}}
            - inside: {kind: not_operator}
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition}
    bound-list:
        kind: assignment
        all:
            - has: {field: left, kind: identifier, pattern: $MATCHES}
            - inside:
                kind: expression_statement
                inside:
                    kind: block, module
                    all:
                        - has: {stopBy: end, kind: identifier, pattern: $MATCHES, inside: {kind: subscript, field: value, has: {field: subscript, regex: '^0$'}}}
                        - not: {has: {stopBy: end, kind: identifier, pattern: $MATCHES, not: {any: [{matches: first-read}, {inside: {kind: assignment, field: left}}]}}}
rule:
    pattern: $CALL
    any:
        - kind: call
          all:
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: iterated}}, {has: {nthChild: 2, kind: none}}, {not: {has: {nthChild: 3}}}]}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^next$'}}}}
            - matches: search
        - kind: call
          all:
            - matches: match-list
            - matches: truth
            - matches: search
        - kind: call
          all:
            - matches: present
            - matches: search
            - pattern: $PRESENT
        - kind: comparison_operator
          all:
            - matches: presence
            - matches: search
            - any:
                - {has: {field: operators, regex: '^(>|!=|>=)$'}, pattern: $PRESENT}
                - pattern: $ABSENT
        - pattern: $KEPT
          any:
            - matches: {python-first-item: {source: {matches: every-match}}}
            - kind: call
              matches: match-list
              any:
                - inside: {kind: match_statement, field: subject}
                - inside: {matches: bound-list, field: right}
                - matches: truth
            - matches: present
            - matches: presence
transform:
    SEARCH: {replace: {source: $CALLEE, replace: '(findall|finditer)$', by: 'search'}}
    FOUND: {replace: {source: $PRESENT, replace: '(?s)^.*$', by: ' is not None'}}
    MISSED: {replace: {source: $ABSENT, replace: '(?s)^.*$', by: ' is None'}}
fix: $SEARCH$ARGS$FOUND$MISSED$KEPT
message: '`$CALL` reads one match or the presence of a match through every match, `search`, `match`, or `fullmatch` stop at the first'
note: '`findall` and `finditer` scan the whole string, the single-match functions return the first `Match` or `None`'
