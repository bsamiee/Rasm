# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-cleared-deferred-foreign-keys
language: sql
severity: error
rule:
    kind: pragma_statement
    pattern: _PRAGMA
    all:
        - has: {field: name, regex: '(?i)^"?defer_foreign_keys"?$'}
        - has: {field: value, regex: '(?i)^[''"]?(off|no|false|0)[''"]?$'}
message: '`$PRAGMA` clears pending foreign key violations and lets orphan rows commit'
note: 'Delete the pragma and let the commit switch `defer_foreign_keys` off'
