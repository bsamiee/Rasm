    QUALIFIER: {replace: {source: $OWNER, replace: '^(.+)$', by: '$1.'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [qualified-name]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {matches: visible}
---
id: swift-member-enum-case
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object]
symbolType: enumMember
utils:
    owned:
        inside:
            kind: 'class_body, enum_class_body, protocol_body'
            inside:
                kind: 'class_declaration, protocol_declaration'
                any:
                    - inside: {kind: source_file}
                    - inside: {kind: 'class_body, enum_class_body'}
                      has: {field: name, pattern: $OWNER}
    private: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}}
    local:
        any:
            - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
            - not:
                  any:
                      - matches: private
                      - inside: {kind: class_body, inside: {kind: class_declaration, all: [{has: {field: declaration_kind, regex: '^extension$'}}, {matches: private}]}}
    visible:
        all:
            - matches: local
            - not: {inside: {kind: 'class_declaration, protocol_declaration', inside: {kind: 'class_body, enum_class_body'}, not: {matches: local}, stopBy: end}}
rule:
    kind: enum_entry
    pattern: $DECLARATION
    matches: owned
    any:
        - has: {field: name, pattern: $NAME}
          not: {has: {kind: simple_identifier, follows: {regex: '^,$', stopBy: end}}}
        - pattern: $GROUP
rewriters:
    - id: case
      rule: {kind: simple_identifier, pattern: $CASE, inside: {kind: enum_entry}}
      fix:
          template: $CASE
          expandStart: {regex: '', not: {follows: {regex: ''}}, stopBy: {regex: '^,$'}}
          expandEnd: {any: [{precedes: {regex: '^,$'}}, {regex: '', not: {precedes: {regex: ''}}}], stopBy: {regex: '^,$'}}
    - id: qualified-case
      rule: {kind: simple_identifier, pattern: $CASE, inside: {kind: enum_entry, inside: {kind: enum_class_body, inside: {kind: class_declaration, inside: {kind: 'class_body, enum_class_body'}}}}}
      fix: $OWNER.$CASE
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '^(.+)$', by: '$1.'}}
    NAMES: {rewrite: {source: $GROUP, rewriters: [case]}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [qualified-case]}}
    GROUP_NAME: {replace: {source: $NAMES, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
    TERMINATED: {replace: {source: $HEADER, replace: ';$', by: ''}}
    SIGNATURE: {replace: {source: $TERMINATED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]*', by: ' '}}
name: $QUALIFIER$NAME$GROUP_NAME
signature: $SIGNATURE
isPublic: {matches: visible}
