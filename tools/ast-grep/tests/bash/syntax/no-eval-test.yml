id: no-eval
valid:
    - |
      cmd=(git log --oneline)
      "${cmd[@]}"
    - printf '%s\n' "${!name}"
    - |
      f() { local -n out=$1; out=value; }
    - command -v eval
    - command -V eval
    - command tool eval
    - runner -p eval "$cmd"
    - builtin printf eval
    - type eval
    - printf '%s\n' eval
    - evaluate "$input"
    - bash -c 'printf "%s\n" "$1"' _ "$value"
    - bash script.sh "$x"
    - sh -c 'ls'
    - grep -c "$pattern" file
    - bash -c "ls -la"
    - bash script.sh -c "$arg"
    - sh script.sh -xc "$arg"
    - bash -- -c "$arg"
    - bash -c 'run "$1"' _ "$cmd"
    - bash --rcfile "$cmd" script.sh
    - env -u NAME node "$cmd"
    - bash -x script.sh -c "$arg"
    - printf bash -c "$cmd"
invalid:
    - bash -ec "$cmd"
    - bash -c $cmd
    - bash -c run_$x
    - sh -xc "$cmd"
    - \eval "$cmd"
    - '''eval'' "$cmd"'
    - bash -c "$cmd"
    - sh -c "run $x"
    - bash -c "$cmd" -- "$@"
    - '"eval" "$cmd"'
    - eval "$cmd"
    - builtin eval "$cmd"
    - command eval "$cmd"
    - command -p eval "$cmd"
    - command -p -- 'eval' "$cmd"
    - builtin -- "eval" "$cmd"
    - x=$(eval "$cmd")
    - |
      f() { eval "$1"; }
    - a && eval "$b"
    - eval "$cmd" | tee log
    - bash -x -c "$arg"
    - eval -- "$cmd"
    - sh -c "$1"
    - bash -o errexit -c "$cmd"
    - bash -O extglob -c "$cmd"
    - bash --norc -c "$cmd"
    - env bash -c "$cmd"
    - exec bash -c "$cmd"
    - sudo bash -c "$cmd"
    - /bin/bash -c "$cmd"
    - /usr/bin/env bash -c "$cmd"
    - zsh -c "$cmd"
    - time eval "$cmd"
    - command -p command eval "$cmd"
