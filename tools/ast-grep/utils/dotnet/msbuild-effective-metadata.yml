# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: msbuild-effective-metadata
language: xml
arguments: [name, value]
rule:
    kind: element
    any:
        - all:
            - has: {matches: msbuild-tag, has: {kind: Attribute, all: [{has: {kind: Name, matches: name}}, {has: {kind: AttValue, matches: value}}]}}
            - not:
                has:
                    kind: content
                    has:
                        kind: element
                        has: {matches: msbuild-tag, has: {kind: Name, matches: name}}
                        not: {has: {kind: content, matches: value}}
        - has:
            kind: content
            has:
                kind: element
                nthChild: {position: 1, reverse: true, ofRule: {kind: element, has: {matches: msbuild-tag, has: {kind: Name, matches: name}}}}
                all:
                    - has: {kind: content, matches: value}
                    - not: {has: {kind: STag, has: {kind: Attribute}}}
