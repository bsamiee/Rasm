id: require-strict-mode
valid:
    - |
      #!/usr/bin/env bash
      set -euo pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -eu
      set -o pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -o errexit -o nounset -o pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -euo pipefail; IFS=$'\n\t'
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -o pipefail -eu
      printf '%s\n' hello
    - |
      set -euo pipefail
      (set +e; false)
    - |
      set -euo pipefail
      run() { local -; set +u; printf '%s\n' done; }
      run
    - |
      set '-eu' "-o" 'pipefail'
    - |
      set -oeu pipefail
    - |
      set -e; set -u; set -o pipefail
    - |
      set -euxo pipefail
invalid:
    - |
      set -o nonsense-e -u -o pipefail
    - |
      set -e -o nonsense-u -o pipefail
    - |
      set -o -e -u -o pipefail
    - |
      set -- -euo pipefail
    - |
      set data -euo pipefail
    - |
      set 'data -euo pipefail'
    - |
      set -e data -uo pipefail
    - |
      set errexit nounset -o pipefail
    - |
      set +e -uo pipefail
    - |
      #!/usr/bin/env bash
      if true; then set -euo pipefail; fi
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      true && set -euo pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -e
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -uo pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -eo pipefail
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      set -eu
      printf '%s\n' hello
    - |
      #!/usr/bin/env bash
      run() {
        set -euo pipefail
        printf '%s\n' hello
      }
      run
