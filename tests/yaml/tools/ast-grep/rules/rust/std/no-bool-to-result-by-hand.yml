id: no-bool-to-result-by-hand
valid:
    - |
      const impl Check for Gate {
          fn check(&self) -> Result<(), Fault> {
              if self.open { Ok(()) } else { Err(Fault) }
          }
      }
    - |
      const trait Check {
          fn check(&self) -> Result<(), Fault> {
              if self.open() { Ok(()) } else { Err(Fault) }
          }
      }
invalid:
    - |
      impl Check for Gate {
          fn check(&self) -> Result<(), Fault> {
              if self.open { Ok(()) } else { Err(Fault) }
          }
      }
