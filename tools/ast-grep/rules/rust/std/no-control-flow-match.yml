# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    break-variant:
        regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Break$'
    continue-variant:
        regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Continue$'
    empty-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, not: {has: {field: condition, pattern: $_}}}
            - has: {field: value, regex: '^None$'}
    two-arms:
        kind: match_block
        all:
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
    break-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, all: [{not: {has: {field: condition, pattern: $_}}}, {has: {kind: tuple_struct_pattern, all: [{has: {field: type, matches: break-variant}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $BV}}, {not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}}]}
            - has: {field: value, kind: call_expression, has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $BV}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}}
    continue-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, all: [{not: {has: {field: condition, pattern: $_}}}, {has: {kind: tuple_struct_pattern, all: [{has: {field: type, matches: continue-variant}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $CV}}, {not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}}]}
            - has: {field: value, kind: call_expression, has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $CV}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}}
    break-ok:
        all:
            - has: {matches: break-arm, has: {field: value, has: {field: function, regex: '^Ok$'}}}
            - has: {matches: continue-arm, has: {field: value, has: {field: function, regex: '^Err$'}}}
    continue-ok:
        all:
            - has: {matches: continue-arm, has: {field: value, has: {field: function, regex: '^Ok$'}}}
            - has: {matches: break-arm, has: {field: value, has: {field: function, regex: '^Err$'}}}
    break-value:
        all:
            - has: {matches: break-arm, has: {field: value, has: {field: function, regex: '^Some$'}}}
            - has: {matches: empty-arm}
    continue-value:
        all:
            - has: {matches: continue-arm, has: {field: value, has: {field: function, regex: '^Some$'}}}
            - has: {matches: empty-arm}
rule:
    kind: match_expression
    all:
        - has: {field: value, pattern: $CF}
        - has:
            field: body
            matches: two-arms
            any:
                - matches: break-ok
                - matches: continue-ok
                - matches: break-value
                - matches: continue-value
message: '`match` on `$CF` rewraps each `ControlFlow` variant''s value unchanged'
note: 'Call `<control flow>.break_ok()` or `.continue_ok()` for a `Result`, and `.break_value()` or `.continue_value()` for an `Option`'
