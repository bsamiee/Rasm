# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    destructure:
        kind: 'struct_pattern, tuple_pattern, tuple_struct_pattern'
    binding:
        any:
            - kind: shorthand_field_identifier
              pattern: $FIELD
              inside: {kind: field_pattern, not: {has: {kind: mutable_specifier}}, regex: '^\p{XID_Continue}+$'}
            - kind: identifier
              pattern: $FIELD
              any:
                - inside: {kind: field_pattern, field: pattern}
                - inside: {kind: 'tuple_pattern, tuple_struct_pattern', not: {has: {field: type, pattern: $FIELD}}}
    refuted:
        kind: let_declaration
        all:
            - has: {field: pattern, kind: tuple_struct_pattern, all: [{has: {field: type, pattern: $_}}, {has: {kind: identifier, nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $FIELD}}, {not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}
            - has: {field: value, kind: identifier, pattern: $FIELD}
            - not: {has: {field: type, pattern: $_}}
            - has:
                field: alternative
                kind: block
                not:
                    has:
                        stopBy: end
                        any:
                            - kind: identifier
                              regex: '^[_\p{Ll}]'
                              not:
                                any:
                                    - inside: {kind: 'scoped_identifier, scoped_type_identifier'}
                                    - inside: {kind: macro_invocation, field: macro}
                            - kind: string_literal
                              regex: '\{[_\p{Ll}]'
                            - kind: 'line_comment, block_comment'
rule:
    kind: let_declaration
    all:
        - has: {field: pattern, matches: destructure, pattern: $PATTERN}
        - has: {field: value, pattern: $_}
        - not: {has: {field: alternative, pattern: $_}}
        - precedes: {matches: refuted, pattern: $NEXT}
        - has: {field: pattern, has: {stopBy: end, matches: binding}}
labels:
    PATTERN: {style: primary, message: 'Binds the field'}
    NEXT: {style: secondary, message: 'Refutes the field'}
message: '`$FIELD` binds in `$PATTERN` and the next `let`-`else` refutes it'
note: 'Refute the field inside its destructuring pattern, `let <struct> { <field>: Some(<field>), .. } = <value> else { .. };`'
