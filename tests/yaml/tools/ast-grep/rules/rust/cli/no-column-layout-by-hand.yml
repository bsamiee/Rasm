id: no-column-layout-by-hand
valid:
    - |
      fn widest(rows: &[String]) -> usize {
          rows.iter().map(|r| r.len()).max().unwrap_or(0)
      }
    - |
      fn show(rows: &[String]) {
          let w = rows.iter().map(|r| r.len()).max().unwrap_or(0);
          for r in rows {
              println!("{r:.w$}");
          }
      }
    - |
      fn show(rows: &[String]) {
          for r in rows {
              println!("{r:>12}");
          }
      }
invalid:
    - |
      fn show(rows: &[(String, u32)]) {
          let width = rows.iter().map(|r| r.0.len()).max().unwrap_or(0);
          for (name, n) in rows {
              println!("{name:width$} {n}");
          }
      }
    - |
      fn show(rows: &[String]) {
          let width = rows.iter().fold(0, |w, r| w.max(r.len()));
          for r in rows {
              println!("{r:>width$}|");
          }
      }
    - |
      fn show(rows: &[String]) {
          let mut w = 0;
          for r in rows {
              w = w.max(r.len());
          }
          for r in rows {
              eprintln!("{r:w$}");
          }
      }
