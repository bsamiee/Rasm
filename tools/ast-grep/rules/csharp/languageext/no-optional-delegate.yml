# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-optional-delegate
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    delegate-type:
        kind: generic_name
        has: {kind: identifier, nthChild: 1, regex: '^(Func|Action)$'}
    option-result:
        kind: generic_name
        all:
            - has: {kind: identifier, nthChild: 1, regex: '^Func$'}
            - has: {kind: type_argument_list, has: {nthChild: {position: 1, reverse: true}, matches: {csharp-type-name: {name: {regex: '^Option$'}}}}}
rule:
    kind: generic_name
    pattern: $TYPE
    all:
        - has: {kind: identifier, nthChild: 1, regex: '^Option$'}
        - any:
            - all:
                - has: {kind: type_argument_list, not: {has: {nthChild: 2}}, has: {matches: option-result}}
                - any:
                    - inside: {field: type, kind: 'property_declaration, parameter'}
                    - inside: {field: type, kind: variable_declaration, inside: {kind: field_declaration}}
            - all:
                - has: {kind: type_argument_list, not: {has: {nthChild: 2}}, has: {matches: delegate-type}}
                - inside: {field: type, kind: property_declaration, has: {field: accessors, has: {kind: accessor_declaration, has: {field: name, regex: '^init$'}}}}
message: '`$TYPE` wraps a delegate in `Option`'
note: 'Declare the plain delegate as an `init` member with a default, `None` for an `Option` result'
