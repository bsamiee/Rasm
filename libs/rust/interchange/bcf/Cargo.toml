# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-bcf"
edition.workspace = true
description       = "BCF 2.1 and 3.0 issue archives: topics, comments, documents, and viewpoints"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
strum                = { workspace = true }
enum-map             = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
data-encoding        = { workspace = true }
data-encoding-macro  = { workspace = true }
nutype               = { workspace = true }
jiff                 = { workspace = true }
newtype-uuid         = { workspace = true }
newtype-uuid-macros  = { workspace = true }
uuid                 = { workspace = true }
url                  = { workspace = true }
xot                  = { workspace = true }
typed-path           = { workspace = true }
zip                  = { workspace = true }
sha2                 = { workspace = true }
nalgebra             = { workspace = true }
uom                  = { workspace = true }
color                = { workspace = true }
imagesize            = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
