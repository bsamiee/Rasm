# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-scope-over-values
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    held:
        kind: identifier, member_access_expression, binary_expression
    value:
        any:
            - kind: invocation_expression
              all:
                - has: {field: function, regex: '^((global::)?(LanguageExt\.)?)?IO\s*\.\s*pure(\s*<.+>)?$'}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: held}}}
            - kind: invocation_expression
              all:
                - has: {field: function, regex: '^((global::)?(LanguageExt\.)?)?IO\s*\.\s*lift(\s*<.+>)?$'}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: value}}}
            - kind: lambda_expression
              all:
                - not: {has: {field: parameters, has: {kind: parameter}}}
                - has: {field: body, matches: held}
    use-value:
        kind: invocation_expression
        all:
            - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?use$'}
            - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: value}}}
    value-scope:
        kind: invocation_expression
        has:
            field: function
            kind: member_access_expression
            all:
                - has: {field: name, regex: '^Bracket$'}
                - has: {field: expression, any: [{matches: value}, {has: {stopBy: end, matches: use-value}}]}
    scope-body:
        kind: argument
        any:
            - all:
                - any: [{has: {field: name, regex: '^Use$'}}, {all: [{nthChild: 1}, {not: {has: {field: name, pattern: $_}}}]}]
                - inside: {kind: argument_list, inside: {matches: value-scope}}
            - inside:
                kind: argument_list
                inside:
                    kind: invocation_expression
                    has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Bind$'}}, {has: {field: expression, matches: use-value}}]}
                    inside: {kind: member_access_expression, field: expression, inside: {matches: value-scope}}
rule:
    matches: value-scope
    has: {field: function, has: {field: expression, pattern: $VALUES}}
    inside: {stopBy: end, matches: scope-body}
message: '`$VALUES` opens a second scope inside a scope over acquired values'
note: 'Use `IO.pure<Seq<IDisposable>>([.. <first>, .. <second>]).Bracket(Use: <body>, Fin: DisposalOps.Release)`, or `DisposalOps.Release<IDisposable>([.. <first>, .. <second>])` where no body follows'
