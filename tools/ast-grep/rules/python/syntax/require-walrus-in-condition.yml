# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-walrus-in-condition
language: python
severity: error
utils:
    first-operand:
        kind: ":is(identifier, parenthesized_expression, not_operator, comparison_operator, boolean_operator, attribute, subscript, binary_operator, call, unary_operator, await)"
        any:
            - inside: {kind: if_statement, pattern: $IF, field: condition}
            - inside: {kind: parenthesized_expression, matches: first-operand}
            - inside: {kind: not_operator, field: argument, matches: first-operand}
            - nthChild: 1
              inside: {kind: comparison_operator, matches: first-operand}
            - inside: {kind: boolean_operator, field: left, matches: first-operand}
            - inside: {kind: binary_operator, field: left, matches: first-operand}
            - inside: {kind: attribute, field: object, matches: first-operand}
            - inside: {kind: subscript, field: value, matches: first-operand}
            - inside: {kind: call, field: function, matches: first-operand}
            - inside: {kind: unary_operator, field: argument, matches: first-operand}
            - inside: {kind: await, matches: first-operand}
rule:
    kind: if_statement
    pattern: $IF
    all:
        - follows:
            kind: expression_statement
            has:
                kind: assignment
                all:
                    - has: {field: left, kind: identifier, pattern: $N}
                    - has: {field: right, pattern: $V, not: {kind: 'assignment, expression_list, yield'}}
                    - not: {has: {field: type, kind: type}}
        - has:
            field: condition
            any:
                - kind: identifier
                  pattern: $N
                - has: {kind: identifier, pattern: $N, matches: first-operand, stopBy: end}
constraints:
    V: {not: {regex: '\n'}}
rewriters:
    - id: bind-first-operand
      rule: {kind: identifier, pattern: $N, matches: first-operand}
      fix: "($N := $V)"
transform:
    OUT: rewrite($IF, rewriters=[bind-first-operand])
fix:
    template: $OUT
    expandStart: {kind: expression_statement}
message: 'Assignment to `$N` precedes the `if` condition that evaluates it first'
note: 'Bind `(<name> := <value>)` in the condition'
