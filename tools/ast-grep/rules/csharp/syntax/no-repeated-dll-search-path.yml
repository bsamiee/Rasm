# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
rule:
    kind: attribute
    pattern: $ATTRIBUTE
    all:
        - has: {field: name, matches: {csharp-qualified-name: {name: {regex: '^DefaultDllImportSearchPaths(?:Attribute)?$'}, qualifier: {regex: '^InteropServices$'}}}}
        - inside:
            kind: attribute_list
            inside:
                kind: method_declaration
                follows: {stopBy: end, kind: method_declaration, has: {kind: attribute_list, has: {kind: attribute, pattern: $ATTRIBUTE}}}
message: '`$ATTRIBUTE` repeats the search path of an earlier import'
note: 'Declare `[assembly: DefaultDllImportSearchPaths(<paths>)]` once, a method attribute only where an import differs'
