# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-pydantic-field-option
language: python
severity: error
utils:
    field-function:
        any:
            - matches: {python-module-member: {module: {regex: '^pydantic(\.fields)?$'}, name: {regex: "^Field$"}}}
            - matches: {python-imported-name: {module: {regex: '^pydantic(\.fields)?$'}, name: {regex: "^Field$"}}}
            - kind: attribute
              all:
                - has: {field: attribute, regex: "^Field$"}
                - has: {field: object, matches: {python-module-member: {module: {regex: '^pydantic$'}, name: {regex: "^fields$"}}}}
    field-call:
        kind: call
        has: {field: function, matches: field-function}
rule:
    kind: keyword_argument
    has: {field: name, regex: "^((min|max)_items|allow_mutation)$", pattern: $NAME}
    inside: {kind: argument_list, inside: {matches: field-call}}
message: '`$NAME` is a deprecated Pydantic field option, the form of `min_length`, `max_length`, or `frozen=True`'
labels: {NAME: {style: primary, message: Field option}}
