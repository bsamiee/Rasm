# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-keychain-delete-then-add
language: swift
severity: error
rule:
    all:
        - matches: {swift-security-argument: {subcommand: {regex: '^"add-generic-password"$', pattern: $COMMAND}}}
        - inside:
            stopBy: end
            all:
                - inside: {kind: statements}
                - follows: {stopBy: end, has: {stopBy: end, matches: {swift-security-argument: {subcommand: {regex: '^"delete-generic-password"$'}}}}}
message: '`$COMMAND` after `delete-generic-password` recreates the item''s ACL and partition list under the writer alone'
note: 'Drop the `delete-generic-password` statement, `add-generic-password -U` replaces the data in place'
