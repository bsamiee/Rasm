# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-checked-value-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    owner:
        regex: '^((global::)?Rasm\.Rhino\.)?(Refused|InvalidAnswer)$'
    unsafe:
        any:
            - kind: member_access_expression, element_access_expression, conditional_access_expression, cast_expression
            - kind: binary_expression
              has: {field: operator, regex: '^[/%]$'}
            - kind: object_creation_expression
              has: {field: type, matches: owner}
    plain:
        any:
            - kind: lambda_expression
            - not: {any: [{matches: unsafe}, {has: {stopBy: {kind: lambda_expression}, matches: unsafe}}]}
    typed:
        has: {regex: '^((global::)?LanguageExt\.)?Fin\s*<'}
    result:
        inside:
            any:
                - kind: lambda_expression
                  matches: typed
                - kind: arrow_expression_clause, return_statement
                  inside:
                    stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, property_declaration'}
                    kind: method_declaration, local_function_statement, lambda_expression, property_declaration
                    matches: typed
                - kind: conditional_expression
                  matches: result
    error-branch:
        pattern: new $OWNER($$$)
        any:
            - has: {field: type, matches: owner}
            - inside: {kind: conditional_expression, has: {regex: '^(unit|Unit\s*\.\s*Default|default\s*\(\s*Unit\s*\))$'}}
            - inside:
                stopBy: end
                kind: compilation_unit
                has: {stopBy: end, kind: record_declaration, all: [{has: {field: name, pattern: $OWNER}}, {matches: csharp-error-record}]}
rule:
    any:
        - pattern: $OWNER.Unless($$$).$MAP($LIFT)
        - kind: conditional_expression
          any:
            - all: [{has: {field: alternative, matches: error-branch}}, {has: {field: consequence, matches: plain}}]
            - all: [{has: {field: consequence, matches: error-branch}}, {has: {field: alternative, matches: plain}}]
          matches: result
          not: {has: {field: condition, has: {stopBy: end, kind: 'declaration_pattern, var_pattern, recursive_pattern'}}}
        - pattern: $ANSWERS.$FOUND($$$).ToFin(new $OWNER($$$))
    not: {matches: {csharp-owner-body: {type: {regex: '.'}, member: {regex: '^Unless$'}}}}
constraints:
    OWNER: {regex: '^((global::)?[A-Z]\w*\.)*[A-Z]\w*$'}
    MAP: {regex: '^(Map|Select)(\s*<.+>)?$'}
    LIFT:
        has:
            kind: lambda_expression
            all:
                - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $DISCARDED}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $DISCARDED}}}]}
                - has: {field: body, not: {kind: block}, matches: plain}
                - not: {has: {field: body, any: [{pattern: $DISCARDED}, {has: {stopBy: end, kind: identifier, pattern: $DISCARDED}}]}}
    ANSWERS: {regex: '^((global::)?Rasm\.Rhino\.)?Callbacks$'}
    FOUND: {regex: '^Found(\s*<.+>)?$'}
message: Check selects between a value and `$OWNER` by hand
note: Use `<owner>.Unless(<check>, <arguments>)`, or `Unless<T>(<check>, <value>, <arguments>)` with `T` a base type of `<value>`, declared on the error record in its namespace's `Errors.cs`
