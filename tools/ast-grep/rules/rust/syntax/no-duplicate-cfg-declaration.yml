# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-duplicate-cfg-declaration
language: rust
severity: error
utils:
    function-shape:
        kind: 'function_item, function_signature_item'
        all:
            - has: {field: name, pattern: $NAME}
            - has: {field: parameters, pattern: $PARAMS}
            - any:
                - has: {field: return_type, pattern: $RETURN}
                - all: [{not: {has: {field: return_type, pattern: $_}}}, {has: {field: name, pattern: $RETURN}}]
            - any:
                - has: {field: type_parameters, pattern: $GENERICS}
                - all: [{not: {has: {field: type_parameters, pattern: $_}}}, {has: {field: name, pattern: $GENERICS}}]
            - any:
                - has: {kind: where_clause, pattern: $WHERE}
                - all: [{not: {has: {kind: where_clause}}}, {has: {field: name, pattern: $WHERE}}]
            - any:
                - has: {kind: function_modifiers, pattern: $MODIFIERS}
                - all: [{not: {has: {kind: function_modifiers}}}, {has: {field: name, pattern: $MODIFIERS}}]
    value-shape:
        kind: 'const_item, static_item'
        all:
            - has: {field: name, pattern: $NAME, not: {regex: '^_$'}}
            - has: {field: type, pattern: $TYPE}
    impl-shape:
        kind: impl_item
        all:
            - has: {field: type, pattern: $NAME}
            - any:
                - has: {field: trait, pattern: $TRAIT}
                - all: [{not: {has: {field: trait, pattern: $_}}}, {has: {field: type, pattern: $TRAIT}}]
            - any:
                - has: {field: type_parameters, pattern: $GENERICS}
                - all: [{not: {has: {field: type_parameters, pattern: $_}}}, {has: {field: type, pattern: $GENERICS}}]
            - any:
                - has: {kind: where_clause, pattern: $WHERE}
                - all: [{not: {has: {kind: where_clause}}}, {has: {field: type, pattern: $WHERE}}]
    let-shape:
        kind: let_declaration
        has: {field: pattern, pattern: $NAME}
    declaration-shape:
        any:
            - matches: function-shape
            - matches: value-shape
            - matches: impl-shape
            - matches: let-shape
rule:
    kind: 'function_item, function_signature_item, const_item, static_item, impl_item, let_declaration'
    all:
        - follows: {stopBy: &run {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: rust-cfg-attribute, pattern: $CFG}
        - matches: declaration-shape
        - precedes:
            stopBy: end
            pattern: $AGAIN
            all:
                - matches: declaration-shape
                - follows: {stopBy: *run, matches: rust-cfg-attribute, not: {pattern: $CFG}}
labels:
    NAME: {style: primary, message: 'Declared under one `cfg`'}
    AGAIN: {style: secondary, message: 'Same declaration under another `cfg`'}
message: '`$CFG` and another `cfg` each declare `$NAME`'
note: 'Declare the item once and select the differing value, statements, or members with `cfg_select!`'
