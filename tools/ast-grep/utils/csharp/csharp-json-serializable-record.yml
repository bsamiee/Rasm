# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-json-serializable-record
language: csharplang
utils:
    serializable-attribute:
        matches: {csharp-type-name: {name: {regex: '^JsonSerializable(Attribute)?$'}}}
rule:
    kind: record_declaration
    all:
        - has: {field: name, pattern: $RECORD}
        - inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                kind: attribute
                all:
                    - has: {field: name, matches: serializable-attribute}
                    - has: {stopBy: end, kind: typeof_expression, has: {field: type, pattern: $RECORD}}
