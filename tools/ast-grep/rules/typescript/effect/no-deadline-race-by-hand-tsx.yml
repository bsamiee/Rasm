# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    sleep-branch:
        any:
            - matches: effect-sleep-call
            - kind: call_expression
              any:
                - has: {field: function, kind: member_expression, has: {field: object, matches: effect-sleep-call}}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: effect-sleep-call}}
rule:
    kind: call_expression
    pattern: $RACE
    all:
        - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^race(All)?(First)?$'}}}}
        - has: {field: arguments, has: {any: [{matches: sleep-branch}, {kind: array, has: {matches: sleep-branch}}]}}
transform:
    HEAD: {replace: {source: $RACE, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$HEAD` races its source against `Effect.sleep` for a deadline fallback'
note: 'Call `Effect.timeoutOrElse(<source>, { duration, orElse })`, or `Effect.timeoutOption(<source>, <duration>)` for `Option.none()` on timeout'
