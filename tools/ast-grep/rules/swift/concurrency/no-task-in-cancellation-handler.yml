# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-task-in-cancellation-handler
language: swiftlang
severity: error
utils:
    handler-body:
        kind: lambda_literal
        has: {stopBy: end, matches: swift-unstructured-task, pattern: $TASK}
rule:
    any:
        - kind: call_expression
          has:
            kind: call_suffix
            any:
                - has: {kind: lambda_literal, matches: handler-body, follows: {regex: '^onCancel$', stopBy: end}}
                - has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^onCancel$'}}, {has: {field: value, matches: handler-body}}]}}
        - kind: call_expression
          all:
            - has: {nthChild: 1, kind: simple_identifier, regex: '^withTaskCancellationHandler$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^handler$'}}, {has: {field: value, matches: handler-body}}]}}}
        - kind: assignment
          all:
            - has: {field: target, regex: '\.onTermination$'}
            - has: {field: result, matches: handler-body}
        - kind: call_expression
          all:
            - has: {nthChild: 1, kind: navigation_expression, regex: '\.setCancelHandler$'}
            - has: {kind: call_suffix, has: {stopBy: end, matches: handler-body}}
transform:
    HEAD: {replace: {source: $TASK, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` in a synchronous cancellation handler runs with no happens-before relation to the awaiting frame'
note: 'Cancel synchronously inside the handler, resume or finish a continuation, or await cleanup as a child task of an enclosing group'
