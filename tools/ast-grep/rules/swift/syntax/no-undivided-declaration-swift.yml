# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-undivided-declaration-swift
language: swift
severity: error
rule:
    inside: {kind: source_file}
    any:
        - kind: class_declaration, protocol_declaration, function_declaration, property_declaration, typealias_declaration
          has: {field: name, pattern: $NAME}
        - kind: operator_declaration
          has: {kind: custom_operator, pattern: $NAME}
        - kind: precedence_group_declaration, macro_declaration
          has: {kind: simple_identifier, pattern: $NAME}
    not: {follows: {stopBy: end, matches: text-section-divider}}
message: Declaration `$NAME` sits above every section divider
note: Open the section of its kind with `// --- [<SECTION>] ` dashed to column 90 above it
