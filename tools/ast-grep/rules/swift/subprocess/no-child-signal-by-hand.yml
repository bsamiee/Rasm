# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-child-signal-by-hand
language: swiftlang
severity: error
rule:
    kind: call_expression
    pattern: $SITE
    any:
        - all:
            - has: {nthChild: 1, regex: '^((Darwin|Glibc|Musl)\.)?kill$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 1, regex: '^-?\(?[\w.]+\.processIdentifier\.value\)?$'}}}
        - all:
            - pattern: '$EXECUTION.send(signal: .kill)'
            - inside:
                stopBy: {kind: statements}
                kind: statements
                all:
                    - has: {stopBy: end, kind: call_expression, regex: '^Task\.sleep'}
                    - has: {stopBy: end, pattern: '$EXECUTION.send(signal: .terminate)'}
message: '`$SITE` signals a Subprocess child by hand'
note: 'Call `<execution>.send(signal:toProcessGroup:)`, and `teardown(using:)` or a `teardownSequence` for a terminate-then-kill stop'
