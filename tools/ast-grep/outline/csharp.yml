    visible: {matches: public, not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}, not: {matches: public}}}}
    plain: {not: {has: {stopBy: {kind: 'declaration_list, enum_member_declaration_list'}, any: [{kind: 'attribute_list, preproc_if_in_attribute_list, preproc_if, argument, ERROR, comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, {kind: parameter, has: {regex: '^=$'}}]}}, pattern: $PLAIN}
