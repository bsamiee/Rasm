# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: require-concurrency-option
language: typescript
severity: error
utils:
    fan-out-call:
        any:
            - pattern: Effect.forEach($$$ARGS)
            - pattern: Effect.all($$$ARGS)
            - pattern: Stream.mapEffect($$$ARGS)
    declares-degree:
        has:
            field: arguments
            has: # Default neighbor traversal, a degree inside a nested callback never satisfies the call
                kind: object
                has:
                    any:
                        - kind: pair
                          has: {field: key, regex: '^concurrency$'}
                        - kind: shorthand_property_identifier
                          regex: '^concurrency$'
rule:
    all:
        - matches: fan-out-call
        - not: {matches: declares-degree}
message: Fan-out omits its concurrency option and silently serializes
note: 'Add `{ concurrency: <n | "unbounded" | "inherit"> }` at the call as an object literal, an options identifier or wrapped object cannot be proven'
