# --- [WORKSPACE] ------------------------------------------------------------------------

# --- [MEMBERS]

[workspace]
resolver = "3"
members  = ["libs/rust/*/*", "tools/dylint", "tools/dylint/auxiliary", "tools/mcp-proxy"]

# --- [IDENTITY]

[workspace.package]
edition = "2024"

# --- [DYLINT]

[workspace.metadata.dylint]
libraries = [{ path = "tools/dylint" }]

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[workspace.dependencies]
# --- [ASYNC]

backon           = "1.6.0"                                                                                                                       # Retry schedules with backoff, jitter, and a transient-failure predicate around one async operation
futures          = "0.3.34"                                                                                                                      # Future joins, stream combinators with ordered results, and a stream read as an iterator on a blocking thread
pin-project-lite = "0.2.17"                                                                                                                      # Pinned fields of hand-written futures and tower response types without unsafe
tokio            = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "net", "sync", "io-util", "time", "fs"] } # Async runtime every service, client, and store driver runs on
tokio-stream     = { version = "0.1.19", features = ["sync", "signal", "io-util", "rt", "net", "fs"] }                                           # Stream adapters over tokio channels, watches, intervals, line readers, join sets, listeners, and directory reads
tokio-util       = { version = "0.7.20", features = ["codec", "rt"] }                                                                            # Stream framing, cancellation tokens, task trackers, and scoped drop guards

# --- [CONCURRENCY]

arc-swap = "1.9.4"                                           # Read-mostly snapshots replaced whole while readers keep their copy
deadpool = { version = "0.13.1", features = ["rt_tokio_1"] } # Async pools of reusable connections and handles
papaya   = "0.2.5"                                           # Concurrent maps with lock-free reads across await points
rayon    = "1.12.0"                                          # Data parallelism over independent CPU-bound work

# --- [CACHES]

foyer = { version = "0.22.6", features = ["tracing", "serde"] } # Hybrid memory and disk caches holding results larger than memory
moka  = { version = "0.12.16", features = ["future", "sync"] }  # Bounded caches with per-entry expiry and coalesced async loads

# --- [SYSTEM]

libc            = "0.2.191"                                           # Native constants missing from higher-level process APIs
libproc         = "0.15.0"                                            # Darwin process group membership and process information
nix             = { version = "0.31.3", features = ["user"] }         # Account identity and home directories from the operating system
process-wrap    = { version = "10.0.1", features = ["tokio1"] }       # Child processes in groups and job objects that die with their owner
rustix          = { version = "1.1.6", features = ["fs", "process"] } # Typed POSIX calls returning errno values where std stops
sd-notify       = "0.5.0"                                             # Readiness and watchdog signals to systemd
socket2         = "0.6.5"                                             # Socket options tokio sockets lack, IPv6-only binding
stacksafe       = "1.0.3"                                             # Stack growth for recursive operations over nested values
velopack        = "1.2.161"                                           # Product installation and in-place updates
wasmtime        = "50.0.1"                                            # In-process WebAssembly sandbox around untrusted guest code
windows-service = "0.8.1"                                             # Windows service installation and control events

# --- [ERRORS]

annotate-snippets    = "0.12.17"                                   # Diagnostics rendered over source spans
anyhow               = "1.0.104"                                   # Native error reports preserved from NUTS and exercised by erased-error lint examples
nonempty-collections = { version = "1.4.0", features = ["serde"] } # Non-empty vectors, sets, and maps that hold accumulated errors
sysexits             = "0.13.0"                                    # Process exit statuses each crate error converts into at the host
thiserror            = "2.0.21"                                    # Error enums that consumers match by variant
validated            = { version = "1.0.0", features = ["rayon"] } # Applicative validation accumulating every independent error

# --- [DERIVES]

auto_impl    = "1.4.0"                                                                                                                                                                      # Capability traits implemented for references, Arc, and Box from one impl
bon          = "3.10.3"                                                                                                                                                                     # Compile-time-checked builders for optional arguments
derive-where = { version = "1.7.0", features = ["safe"] }                                                                                                                                   # Derives on generic and phantom-typed records without spurious bounds
derive_more  = { version = "2.1.1", features = ["from", "into", "try_from", "display", "debug", "error", "deref", "constructor", "is_variant", "from_str", "as_ref", "add", "add_assign"] } # Display and Debug derives on fieldless enums and opaque newtypes, conversion and constructor derives on invariant-free newtypes, field-wise sums on records of quantities
dynosaur     = "0.3.1"                                                                                                                                                                      # Dynamic dispatch over async capability traits swapped at composition
o2o          = { version = "0.5.5", default-features = false, features = ["syn2"] }                                                                                                         # Field mappings between domain and contract records, default `syn1` builds syn 1 beside syn 2
strum        = { version = "0.28.0", features = ["derive"] }                                                                                                                                # Enum name tables, iteration, and discriminant enums

# --- [COLLECTIONS]

cardinality-estimator = { version = "1.0.3", features = ["with_serde"] }          # HyperLogLog distinct counts that merge across shards
datasketches          = { version = "0.6.0", features = ["tdigest"] }             # Mergeable t-digest quantile sketches that chunk reductions merge and query
enum-map              = { version = "3.1.0", features = ["serde"] }               # Total maps holding one value per enum variant
fastbloom             = "0.17.0"                                                  # Bloom filters that precheck membership
fst                   = { version = "0.4.7", features = ["levenshtein"] }         # Finite-state sets and maps with prefix, range, and fuzzy queries
hashbrown             = ">=0.16.1, <0.17"                                         # Hash maps rustworkx-core takes as keyed inputs (Katz `beta_map`), at the release rustworkx-core links
imbl                  = { version = "7.0.2", features = ["serde"] }               # Persistent vectors and maps with structural sharing across tasks
indexmap              = { version = "2.14.2", features = ["serde"] }              # Insertion-ordered maps and sets that keep iteration and output deterministic
itertools             = "0.15.0"                                                  # Partitioned results, grouping, windows, and merges over iterators
roaring               = "0.12.0"                                                  # Compressed integer sets with set algebra
rust-lapper           = "2.0.0"                                                   # Interval overlap and stabbing queries
slotmap               = "1.1.1"                                                   # Generational-index arenas holding graph and scene nodes
smallvec              = { version = "2.0.0-beta.4", features = ["std", "serde"] } # Inline small vectors that spill to heap

# --- [CRDT]

loro = "1.17.1" # Loro documents with text, list, map, and tree history
yrs  = "0.28.1" # Yjs documents with state vectors and update exchange

# --- [SERIALIZATION]

apache-avro         = { version = "0.22.0", features = ["derive", "zstandard", "snappy"] }                   # Avro schemas, binary encoding, and container files
binrw               = "0.15.2"                                                                               # Binary formats read and written from one declaration
bytes               = { version = "1.12.1", features = ["serde"] }                                           # Shared immutable byte buffers
cbor4ii             = { version = "1.2.4", features = ["serde1", "use_std"] }                                # CBOR codec
csv                 = "1.4.0"                                                                                # CSV records decoded into and encoded from typed rows
data-encoding       = "2.11.1"                                                                               # Base64, base32, and hex codecs
data-encoding-macro = "0.1.21"                                                                               # Custom encodings checked at compile time
itoa                = "1.0.19"                                                                               # Integer text through a stack buffer, the form serde_json writes integers in
json-patch          = "5.0.0"                                                                                # JSON Patch apply and diff over JSON values
jsonptr             = "0.8.2"                                                                                # JSON Pointer resolution with typed failures
plist               = "1.10.3"                                                                               # XML and binary property lists
rasn                = "0.30.0"                                                                               # Typed ASN.1 values and DER encoding
rasn-cms            = "0.30.0"                                                                               # CMS and timestamp protocol records over rasn
rmp-serde           = "1.3.1"                                                                                # MessagePack codec
serde               = { version = "1.0.229", features = ["derive"] }                                         # Derived encode and decode of records and tagged unions
serde-saphyr        = "2.1.1"                                                                                # YAML codec without unsafe libyaml
serde-content       = "0.1.2"                                                                                # Serialization values preserving integer widths, map entries, and native replay
serde_json          = { version = "1.0.154", features = ["raw_value", "float_roundtrip", "preserve_order"] } # JSON codec with values, raw passthrough, and objects kept in insertion order
serde_path_to_error = "0.1.20"                                                                               # Boundary decode errors that name failing field path
serde_urlencoded    = "0.7.1"                                                                                # Typed decode of form-encoded fields, numbers and booleans parsed from text
serde_with          = { version = "3.24.0", features = ["base64", "hex", "jiff_0_2", "schemars_1"] }         # Field codecs declared on records that schema derivation reads
zmij                = "1.0.23"                                                                               # Shortest round-trip float text, the form serde_json writes floats in
toml                = { version = "1.2.1", features = ["preserve_order"] }                                   # Typed TOML decode and encode, tables in file order
toml_edit           = { version = "0.25.19", features = ["serde"] }                                          # TOML edits that keep comments and layout
yaml-edit           = "0.3.6"                                                                                # YAML edits that keep comments and layout

# --- [SCHEMA]

jsonschema = { version = "0.61.0", default-features = false, features = ["resolve-file", "idna"] }                             # JSON Schema validation, sync `validator_for` panics inside tokio fetching a remote `$ref` through default `resolve-http` and `tls-aws-lc-rs`
schemars   = { version = "1.2.3", features = ["jiff02", "uuid1", "indexmap2", "url2", "semver1", "bytes1", "preserve_order"] } # JSON Schema derived from record types in field declaration order

# --- [NEWTYPES]

bounded-integer = { version = "0.6.2", features = ["std", "serde1", "schemars1"] }     # Ranged integers with bounds that reach derived schema
nutype          = { version = "0.8.0", features = ["serde", "regex", "rust_decimal"] } # Validated newtypes with generated error enum per type
ordered-float   = { version = "5.5.1", features = ["serde"] }                          # NaN-free floats usable as ordered keys

# --- [TIME]

croner = { version = "4.0.3", default-features = false, features = ["jiff"] } # Cron expressions evaluated against passed-in instants, default `chrono` adds chrono beside jiff
jiff   = { version = "0.2.41", features = ["serde"] }                         # Instants, zoned date-times, spans, and zone database

# --- [IDENTIFIERS]

newtype-uuid        = { version = "1.4.0", features = ["v4", "v7", "serde"] }  # Identifiers typed by entity kind they name
newtype-uuid-macros = "0.1.1"                                                  # Kind types and identifier aliases generated per entity
semver              = { version = "1.0.28", features = ["serde"] }             # Semantic version and requirement parsing
uuid                = { version = "1.29.2", features = ["v4", "v7", "serde"] } # Random and creation-ordered identifiers

# --- [HASHING]

blake3      = "1.8.7"                                                     # Content-addressed keys
crc-fast    = "1.10.0"                                                    # CRC-32 and CRC-64 checksums across catalogued polynomials
xxhash-rust = { version = "0.8.19", features = ["std", "xxh3", "xxh64"] } # XXH3 and XXH64 content identity hashes

# --- [TEXT]

aho-corasick  = "1.1.5"                                                   # Many-literal search in one pass
bstr          = "1.13.1"                                                  # Byte strings with character iteration at text boundaries
bytesize      = { version = "2.7.0", features = ["serde"] }               # Byte sizes parsed and displayed in binary and decimal units
encoding_rs   = "0.8.44"                                                  # Legacy text encodings decoded and encoded
frizbee       = "0.13.0"                                                  # Typo-tolerant ranking of completion candidates
heck          = "0.5.0"                                                   # Identifier case conversion matching strum `serialize_all` styles
hypher        = "0.1.8"                                                   # Language-aware hyphenation
icu           = { version = "2.4.0", features = ["compiled_data"] }       # Segmentation, collation, properties, and plural rules from Unicode data
ropey         = { version = "2.0.0-beta.1", features = ["metric_utf16"] } # Editable text buffers with UTF-16 position conversion
strsim        = "0.11.1"                                                  # Edit-distance and similarity metrics
unicode-bidi  = "0.3.18"                                                  # Bidirectional reordering before shaping
unicode-width = "0.2.3"                                                   # Display width of wide, combining, and emoji text

# --- [PARSING]

ast-grep-config    = { version = "0.51.1", default-features = false }                              # Rule, util and transform documents of structural search
ast-grep-core      = "0.51.1"                                                                      # Structural search and rewrite over syntax trees
ast-grep-dynamic   = "0.51.1"                                                                      # Custom-language grammar libraries of structural search, loaded at run time
ast-grep-language  = "0.51.1"                                                                      # Built-in grammars of structural search
cel                = { version = "0.15.0", features = ["json"] }                                   # Common Expression Language policies
chumsky            = { version = "0.13.0", features = ["pratt"] }                                  # Parser combinators that recover and collect every error
ec4rs              = "2.0.0-rc.1"                                                                  # EditorConfig properties resolved per path
oxc                = { version = "0.157.0", features = ["ast_visit", "semantic", "codegen"] }      # JavaScript and TypeScript parsing, analysis, and printing
regex-syntax       = "0.8.11"                                                                      # Parser and Unicode classes the regex engine and tree-sitter link
regex-automata     = "0.4.18"                                                                      # Compiled regex programs the regex engine runs, with their heap size
regex              = "1.13.1"                                                                      # Unicode patterns with linear-time matching
sqlparser          = { version = "0.63.0", features = ["visitor"] }                                # SQL text parsed into dialect ASTs
syntect            = { version = "5.3.0", default-features = false, features = ["default-fancy"] } # Syntax definitions looked up by name, alias, and extension, default `regex-onig` builds Oniguruma C beside `regex-fancy`
tree-sitter        = "0.27.2"                                                                      # Incremental parsing runtime that loads grammar crates
tree-sitter-sequel = "0.3.11"                                                                      # SQL grammar
tree-sitter-xml    = "0.7.0"                                                                       # XML and DTD grammar
winnow             = "1.0.5"                                                                       # Parser combinators with caller-defined error types

# --- [MARKUP]

ammonia      = "4.2.4"                                                                               # Allow-list sanitization of untrusted HTML
comrak       = { version = "0.59.0", default-features = false, features = ["cli", "syntect-fancy"] } # CommonMark and GFM parsed into AST, default `syntect-onig` builds Oniguruma C beside `regex-fancy`
htmd         = "0.5.6"                                                                               # HTML converted to Markdown
lightningcss = { version = "1.0.0-alpha.72", features = ["visitor", "into_owned"] }                  # CSS parsing, transformation, and minification
minijinja    = { version = "3.1.0", features = ["serde", "json", "loop_controls", "urlencode"] }     # Jinja templates rendering reports and generated documents
quick-xml    = { version = "0.42.0", features = ["serialize", "encoding"] }                          # Streaming XML read and write with serde mapping
roxmltree    = "0.21.2"                                                                              # Read-only XML trees with source positions that locate validation errors
scraper      = "0.29.0"                                                                              # HTML parsing with CSS selectors
xot          = "0.31.2"                                                                              # Mutable XML trees with namespaces and parent access

# --- [FILES]

camino                = { version = "1.2.6", features = ["serde1"] }                                                                                                                                        # UTF-8 paths as construction invariant
cap-std               = { version = "4.0.3", features = ["fs_utf8"] }                                                                                                                                       # Directory capabilities opened at boundary and passed in
dunce                 = "1.0.5"                                                                                                                                                                             # Canonical Windows paths without verbatim prefix
file-format           = { version = "0.29.0", features = ["reader-zip", "reader-xml", "reader-pdf", "reader-cfb", "reader-ebml", "reader-exe", "reader-mp4", "reader-rm", "reader-sqlite3", "reader-txt"] } # Format detection from leading bytes and containers
fs-err                = "3.3.2"                                                                                                                                                                             # File calls with errors that name path
globset               = "0.4.21"                                                                                                                                                                            # One path matched against many globs in one pass
ignore                = "0.4.34"                                                                                                                                                                            # Gitignore-aware parallel directory walks
notify                = { version = "9.0.0-rc.7", features = ["tokio"] }                                                                                                                                    # File system change events
notify-debouncer-full = { version = "0.8.0-rc.2", features = ["tokio"] }                                                                                                                                    # Debounced, rename-aware change batches
tempfile              = "3.27.0"                                                                                                                                                                            # Temporary files and atomic writes that keep occupied destinations
walkdir               = "2.5.0"                                                                                                                                                                             # Recursive directory iteration without following symlinks
typed-path            = { version = "0.13.0", default-features = false }                                                                                                                                    # Archive entry names normalized by Unix path rules on every host

# --- [COMPRESSION]

async-compression = { version = "0.4.52", features = ["tokio", "gzip", "zlib", "zstd", "brotli", "lz4", "xz", "bzip2"] } # Compression over async byte streams
brotli            = "9.1.1"                                                                                              # Brotli streams
bzip2             = "0.6.1"                                                                                              # bzip2 streams
flate2            = { version = "1.1.11", default-features = false, features = ["zlib-rs", "runtime_detection"] }        # Deflate, zlib, and gzip streams, default `rust_backend` compiles miniz_oxide beside zlib-rs
lz4_flex          = "0.14.0"                                                                                             # LZ4 block and frame codecs
lzma-rust2        = "0.25.0"                                                                                             # XZ, LZMA, and LZIP streams
qbsdiff           = "1.4.4"                                                                                              # Binary deltas between file versions
sevenz-rust2      = { version = "0.25.0", features = ["zstd"] }                                                          # 7z archives
snap              = "1.1.2"                                                                                              # Snappy frames
tar               = "0.4.46"                                                                                             # Tar archives
zip               = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }               # ZIP archives with ZIP64, stored and deflated entries
zstd              = { version = "0.14.3", features = ["zstdmt"] }                                                        # Zstandard frames with dictionaries

# --- [CRYPTOGRAPHY]

argon2                   = "0.6.0"                                                                                               # Password hashing in PHC strings
aws-lc-rs                = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "alloc", "prebuilt-nasm"] } # Digests, MACs, key derivation, AEAD, signatures, and key wrap, default `ring-io` and `ring-sig-verify` add untrusted 0.7 beside 0.9
crypto_box               = "0.9.1"                                                                                               # NaCl public-key boxes
rcgen                    = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }                    # X.509 certificates issued to loopback and test endpoints, default `ring` adds ring beside aws-lc-rs
rustls                   = "0.23.46"                                                                                             # TLS stack with process-wide aws-lc-rs provider each binary installs
rustls-platform-verifier = "0.7.1"                                                                                               # Certificate verification through OS trust store
sigstore                 = { version = "0.15.0", default-features = false, features = ["full", "rustls-tls"] }                   # Keyless signing and transparency-log verification, default `native-tls` links platform TLS beside rustls
x509-parser              = { version = "0.18.1", features = ["verify-aws"] }                                                     # X.509 certificate parsing and signature checks

# --- [AUTHENTICATION]

httpsig       = { version = "0.0.26", features = ["rsa-signature"] }                                           # HTTP message signatures
jsonwebtoken  = { version = "11.1.0", features = ["aws_lc_rs"] }                                               # JWT signing and validation
openidconnect = { version = "4.1.0", default-features = false, features = ["timing-resistant-secret-traits"] } # OpenID Connect discovery, PKCE flows, and ID token validation, default `reqwest` and `rustls-tls` add reqwest 0.12 on ring beside aws-lc-rs
totp-rs       = { version = "6.0.0", features = ["otpauth", "gen_secret", "zeroize"] }                         # One-time passwords and otpauth URLs
webauthn-rs   = { version = "0.6.2", features = ["conditional-ui", "resident-key-support"] }                   # Passkey registration and authentication ceremonies
webbrowser    = "1.2.6"                                                                                        # Authorization URLs opened in user's browser

# --- [SECRETS]

aws-config                      = { version = "1.13.0", features = ["behavior-version-latest"] }                                                                # AWS credential and region resolution
aws-sdk-kms                     = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] } # AWS KMS keys, default `rustls` adds hyper 0.14 client on ring
azure_identity                  = { version = "1.0.0", features = ["tokio"] }                                                                                   # Microsoft Entra ID credential chain
azure_security_keyvault_keys    = "1.0.1"                                                                                                                       # Azure Key Vault keys and cryptographic operations
azure_security_keyvault_secrets = "1.0.1"                                                                                                                       # Azure Key Vault secrets
google-cloud-kms-v1             = "1.16.0"                                                                                                                      # Google Cloud KMS keys
google-cloud-secretmanager-v1   = "1.14.0"                                                                                                                      # Google Cloud Secret Manager secrets
keyring                         = "4.2.0"                                                                                                                       # OS keychain storage of OAuth tokens
secrecy                         = { version = "0.10.3", features = ["serde"] }                                                                                  # Secrets redacted from Debug output and zeroized on drop
vaultrs                         = "0.8.0"                                                                                                                       # HashiCorp Vault secrets, transit, and PKI

# --- [HTTP]

aide               = { version = "0.16.0-alpha.4", features = ["axum-json", "axum-query", "scalar"] }                                                                                                           # OpenAPI documents derived from tool parameter schemas
axum               = { version = "0.8.9", features = ["http2"] }                                                                                                                                                # Servers mounting tower services on bound sockets
form_urlencoded    = "1.2.2"                                                                                                                                                                                    # application/x-www-form-urlencoded encoding of name and value pairs
headers            = "0.4.2"                                                                                                                                                                                    # Typed conditional, range, and entity-tag headers
hickory-resolver   = "0.26.3"                                                                                                                                                                                   # Async DNS resolution with SRV lookups
http               = "1.5.0"                                                                                                                                                                                    # Request, response, URI, and header types axum and hyper share
http-cache-reqwest = "1.0.0-alpha.10"                                                                                                                                                                           # RFC 9111 response cache in embedded store
matchit            = "0.9.2"                                                                                                                                                                                    # Reader routes over URI templates with parameter suffixes and slashless paths
mime               = "0.3.18"                                                                                                                                                                                   # Media types parsed with their parameters
octocrab           = { version = "0.54.9", default-features = false, features = ["default-client", "follow-redirect", "jwt-aws-lc-rs", "retry", "rustls", "rustls-aws-lc-rs", "stream", "timeout", "tracing"] } # GitHub REST client, default `rustls-ring` adds ring beside aws-lc-rs
percent-encoding   = "2.3.2"                                                                                                                                                                                    # RFC 3986 percent-decoding of URI template variables
progenitor         = "0.16.0"                                                                                                                                                                                   # Typed clients generated from OpenAPI documents
reqwest            = { version = "0.13.5", features = ["json", "stream", "gzip", "zstd", "brotli", "blocking"] }                                                                                                # HTTP client with pooling, streaming, and decompression, and a blocking client typst-kit's synchronous downloader reads
reqwest-middleware = { version = "0.5.2", features = ["json", "rustls"] }                                                                                                                                       # Middleware chain around HTTP clients
reqwest-tracing    = "0.7.1"                                                                                                                                                                                    # Client request spans with semantic-convention attributes
sfv                = "0.16.0"                                                                                                                                                                                   # HTTP structured field values
tower              = { version = "0.5.3", features = ["util", "timeout", "limit", "load-shed"] }                                                                                                                # Service and layer composition with timeouts, limits, and load shedding
tower-http         = { version = "0.7.1", features = ["trace"] }                                                                                                                                                # Request tracing layers on served routes
url                = { version = "2.5.8", features = ["serde"] }                                                                                                                                                # WHATWG URLs parsed at boundaries

# --- [REMOTE_PROCEDURE_CALLS]

async-lsp           = { version = "0.2.4", features = ["tokio"] }                                                                                                                            # Language Server Protocol clients and servers as tower services
buffa               = { version = "0.9.2", features = ["json"] }                                                                                                                             # Protobuf messages with editions, views, and canonical JSON
buffa-types         = { version = "0.9.2", features = ["json", "jiff"] }                                                                                                                     # Protobuf well-known types with JSON mapping and jiff conversion
connectrpc          = { version = "0.9.1", features = ["server", "client-tls", "axum"] }                                                                                                     # Connect, gRPC, and gRPC-Web services and clients
protovalidate-buffa = { version = "0.7.3", features = ["json"] }                                                                                                                             # Protovalidate rules compiled into message validation
rmcp                = { version = "3.9.0", features = ["client", "elicitation", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] } # MCP servers over Streamable HTTP and clients of child-process and Streamable HTTP servers

# --- [TRANSFER]

object_store = { version = ">=0.13.2, <0.14", features = ["aws", "gcp", "azure", "http"] } # One API over S3, GCS, Azure, HTTP, and local object stores at the release DataFusion 55 and deltalake 1.1 link, `cloud` under each store feature adds reqwest 0.12 on ring and chrono
reqwest_dav  = "0.3.3"                                                                     # WebDAV transfers
russh        = "0.65.1"                                                                    # SSH clients and servers reaching remote workers
russh-sftp   = "3.0.1"                                                                     # SFTP over SSH channels
suppaftp     = { version = "12.2.1", features = ["tokio-rustls-aws-lc-rs"] }               # FTP and FTPS transfers

# --- [OBSERVABILITY]

json-subscriber                    = { version = "0.3.1", features = ["tracing-opentelemetry-0-34"] }    # JSON lines with flattened span fields, static service fields, and request trace and span ids
log                                = "0.4.35"                                                            # Logger registration failure `LogTracer::init` returns
opentelemetry                      = "0.33.1"                                                            # Trace, metric, and log API
