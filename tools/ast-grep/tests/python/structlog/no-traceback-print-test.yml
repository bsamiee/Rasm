id: no-traceback-print
valid:
    - |
      import structlog

      try:
          load(path)
      except OSError:
          structlog.get_logger(__name__).exception("load failed", path=str(path))
    - |
      import traceback

      text = traceback.format_exc()
    - |
      reporter.print_exc()
    - 'structlog.get_logger().error("failed", exc_info=error)'
    - 'structlog.get_logger().info("stack", stack_info=True)'
    - |
      import traceback

      lines = traceback.format_exception(error)
    - |
      import traceback

      frames = traceback.extract_stack()
    - |
      from traceback import TracebackException

      lines = TracebackException.from_exception(error).format()
