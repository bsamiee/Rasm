# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    predicate:
        any:
            - has: {field: arguments, has: {kind: argument, has: {field: name, regex: '^predicate$'}, pattern: {context: 'f($PREDICATE);', selector: argument}}}
            - all:
                - not: {has: {field: arguments, has: {kind: argument, has: {field: name, regex: '^predicate$'}}}}
                - has: {field: arguments, has: {kind: argument, nthChild: {position: 1, reverse: true}, matches: csharp-positional-argument, pattern: {context: 'f($PREDICATE);', selector: argument}}}
    named-or-outer-reading:
        any:
            - has: {field: arguments, has: {kind: argument, pattern: {context: 'f($PREDICATE);', selector: argument}, has: {kind: identifier, not: {inside: {kind: argument, field: name}}}}}
            - has: {field: arguments, has: {kind: argument, pattern: {context: 'f($PREDICATE);', selector: argument}, has: {matches: outer-read}}}
    outer-read:
        kind: lambda_expression, anonymous_method_expression
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: {context: 'var f = $READ_PARAMETER => 0;', selector: implicit_parameter}
                    - kind: parameter_list
                      has: {kind: parameter, has: {field: name, pattern: {context: 'class $READ_PARAMETER;', selector: identifier}}}
            - has:
                stopBy: end
                kind: identifier
                not:
                    any:
                        - pattern: {context: 'class $READ_PARAMETER;', selector: identifier}
                        - inside: {kind: member_access_expression, field: name}
                        - inside: {kind: parameter}
rule:
    kind: invocation_expression
    all:
        - has: {field: function, regex: '(?i:repeat|retry)'}
        - any:
            - has: {field: function, has: {field: name, matches: {csharp-simple-name: {name: {regex: '^(Repeat|Retry)(While|Until)(IO)?$'}}}, pattern: $NAME}}
            - has: {field: function, pattern: $NAME, matches: {csharp-type-name: {name: {regex: '^(repeat|retry)(While|Until)$'}}}}
        - matches: predicate
        - any:
            - all:
                - has: {field: function, matches: {csharp-type-name: {name: {regex: 'While(?:IO)?$'}}}}
                - has: {field: arguments, has: {kind: argument, pattern: {context: 'f($PREDICATE);', selector: argument}, matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}}}
            - all:
                - has: {field: function, matches: {csharp-type-name: {name: {regex: 'Until(?:IO)?$'}}}}
                - has:
                    field: arguments
                    has:
                        kind: argument
                        pattern: {context: 'f($PREDICATE);', selector: argument}
                        matches: {csharp-constant-lambda: {value: {any: [{regex: '^(?:false|default)$'}, {kind: default_expression, has: {field: type, matches: {csharp-type-name: {name: {regex: '^(?:bool|Boolean)$'}}}}}]}}}
        - not: {matches: named-or-outer-reading}
message: '`$NAME` takes a predicate that never stops the loop'
note: 'Call the method without its `While` or `Until` suffix and predicate argument'
