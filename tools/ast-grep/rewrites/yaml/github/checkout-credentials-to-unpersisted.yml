# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: checkout-credentials-to-unpersisted
language: yaml
severity: off
files: [".github/workflows/*.{yml,yaml}"]
utils:
    permissions-pair:
        kind: block_mapping_pair, flow_pair
        has: {field: key, regex: '^(permissions|"permissions"|''permissions'')$'}
    writer-permissions:
        matches: permissions-pair
        has:
            field: value
            any:
                - regex: '^(write-all|"write-all"|''write-all'')$'
                - has: {kind: alias}
                - has:
                    kind: block_mapping, flow_mapping
                    has:
                        kind: block_mapping_pair, flow_pair
                        all:
                            - has: {field: key, regex: '^(contents|"contents"|''contents'')$'}
                            - has: {field: value, regex: '^(write|"write"|''write'')$'}
    reader-job:
        matches: github-job
        not: {has: {matches: writer-permissions}}
        any:
            - has: {matches: permissions-pair}
            - inside: {matches: yaml-document-mapping, stopBy: end, not: {has: {matches: writer-permissions}}}
    checkout-uses:
        kind: block_mapping_pair, flow_pair
        all:
            - has: {field: key, regex: '^(uses|"uses"|''uses'')$'}
            - has: {field: value, regex: '^(actions/checkout@v(?:[4-9]|[1-9][0-9])(?:\.[0-9]+){0,2}|"actions/checkout@v(?:[4-9]|[1-9][0-9])(?:\.[0-9]+){0,2}"|''actions/checkout@v(?:[4-9]|[1-9][0-9])(?:\.[0-9]+){0,2}'')$'}
    with-pair:
        kind: block_mapping_pair, flow_pair
        has: {field: key, regex: '^(with|"with"|''with'')$'}
    persist-pair:
        kind: block_mapping_pair, flow_pair
        has: {field: key, regex: '^(persist-credentials|"persist-credentials"|''persist-credentials'')$'}
    checkout-step:
        matches: github-step
        all:
            - has: {matches: checkout-uses}
            - inside: {matches: reader-job, stopBy: end}
    unanchored-node:
        kind: block_node, flow_node
        not: {has: {kind: anchor}}
    input-map-node:
        matches: unanchored-node
        inside: {matches: with-pair, inside: {matches: checkout-step}}
    closing-comment:
        kind: comment
        nthChild: {position: 1, reverse: true}
rule:
    any:
        - kind: block_mapping
          pattern: $MAP
          inside: {matches: input-map-node}
          not: {has: {matches: persist-pair}}
        - kind: flow_mapping
          pattern: $FLOW
          inside: {matches: input-map-node}
          not: {any: [{has: {matches: persist-pair}}, {has: {matches: closing-comment}}]}
        - kind: block_mapping
          pattern: $STEP_MAP
          matches: checkout-step
          not: {has: {matches: with-pair}}
          inside: {matches: unanchored-node, inside: {kind: block_sequence_item, regex: '^- [^\s#!&*]'}}
        - kind: flow_mapping
          pattern: $STEP
          matches: checkout-step
          inside: {matches: unanchored-node}
          not: {any: [{has: {matches: with-pair}}, {has: {matches: closing-comment}}]}
        - kind: block_mapping_pair, flow_pair
          pattern: $PAIR
          matches: persist-pair
          has: {field: value, regex: '(?i)^(true|"true"|''true'')$'}
          inside: {kind: 'block_mapping, flow_mapping', inside: {matches: input-map-node}}
transform:
    MAP_FIX: {replace: {source: $MAP, replace: '(?s)^(.+?)\s*$', by: "${1}\npersist-credentials: false"}}
    FLOW_JOINED: {replace: {source: $FLOW, replace: '(?s)^\{\s*(.*?)\s*,?\s*\}$', by: '{${1}, persist-credentials: false}'}}
    FLOW_FIX: {replace: {source: $FLOW_JOINED, replace: '^\{, ', by: '{'}}
    STEP_MAP_FIX: {replace: {source: $STEP_MAP, replace: '(?s)^(.+?)\s*$', by: "${1}\n  with:\n    persist-credentials: false"}}
    STEP_FIX: {replace: {source: $STEP, replace: '(?s)^\{\s*(.*?)\s*,?\s*\}$', by: '{${1}, with: {persist-credentials: false}}'}}
    PAIR_FIX: {replace: {source: $PAIR, replace: '(?is)^(.*:\s*)["'']?true["'']?\s*$', by: '${1}false'}}
fix: $MAP_FIX$FLOW_FIX$STEP_MAP_FIX$STEP_FIX$PAIR_FIX
message: Checkout persists the workflow token in the local git config of a job with no contents writer
note: 'Set `persist-credentials: false` on the checkout step, the token then stays out of the workspace the caches and artifacts read'
