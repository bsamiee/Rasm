# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-host-override-forward
language: csharp
severity: error
files: ['libs/**']
utils:
    held-declaration:
        any:
            - kind: 'parameter, property_declaration'
              has: {field: name, pattern: $HELD}
            - kind: variable_declaration
              has: {kind: variable_declarator, has: {field: name, pattern: $HELD}}
    object-declaration:
        all:
            - matches: held-declaration
            - has: {field: type, any: [{kind: identifier, pattern: $OWNER}, {kind: generic_name, has: {kind: identifier, pattern: $OWNER}}]}
            - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, kind: class_declaration, has: {field: name, pattern: $OWNER}}}
    held-name:
        kind: identifier
        pattern: $HELD
        all:
            - not: {inside: {stopBy: end, kind: 'method_declaration, local_function_statement, lambda_expression', has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $HELD}}}}}
            - inside:
                stopBy: {kind: class_declaration}
                kind: class_declaration
                any:
                    - has: {kind: parameter_list, has: {kind: parameter, matches: held-declaration}}
                    - has: {field: body, has: {kind: field_declaration, has: {matches: held-declaration}}}
                    - has: {field: body, has: {kind: property_declaration, matches: held-declaration}}
            - not:
                inside:
                    stopBy: {kind: class_declaration}
                    kind: class_declaration
                    any:
                        - has: {kind: parameter_list, has: {kind: parameter, matches: object-declaration}}
                        - has: {field: body, has: {kind: field_declaration, has: {matches: object-declaration}}}
                        - has: {field: body, has: {kind: property_declaration, matches: object-declaration}}
    held-read:
        any:
            - matches: held-name
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^this$'}
                - has: {field: name, matches: held-name}
            - kind: member_access_expression
              all:
                - has: {field: name, kind: identifier, not: {regex: '^(IsSome|IsNone|IsEmpty|Count|Length)$'}}
                - has: {field: expression, matches: held-read}
    hook-read:
        any:
            - kind: member_access_expression
              matches: held-read
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Bind)$'}}, {has: {field: expression, matches: hook-read}}]}
    base-default:
        any:
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^base$'}
                - has: {field: name, pattern: $NAME}
            - kind: invocation_expression
              has: {field: function, matches: base-default}
            - kind: lambda_expression
              all:
                - has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
                - has: {field: body, matches: base-default}
    arm-read:
        any:
            - kind: identifier
              pattern: $ARM
            - kind: member_access_expression
              has: {field: expression, matches: arm-read}
            - kind: invocation_expression
              all:
                - has: {field: function, matches: arm-read}
                - has: {field: arguments, not: {has: {kind: argument}}}
    some-arm:
        kind: lambda_expression
        all:
            - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $ARM}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $ARM}}, not: {has: {kind: parameter, nthChild: 2}}}]}
            - has: {field: body, matches: arm-read}
    defaulted:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(IfNone|Match)$'}}, {has: {field: expression, matches: held-read}}]}
            - has: {field: arguments, has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, matches: base-default}}}
            - has: {field: arguments, not: {has: {kind: argument, not: {has: {nthChild: {position: 1, reverse: true}, any: [{matches: base-default}, {matches: some-arm}]}}}}}
    unwrapped:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^ValueUnsafe$'}}, {has: {field: expression, matches: held-read}}]}
            - has: {field: arguments, not: {has: {kind: argument}}}
    hook-call:
        kind: lambda_expression
        all:
            - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $HOOK}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $HOOK}}, not: {has: {kind: parameter, nthChild: 2}}}]}
            - has:
                field: body
                kind: invocation_expression
                has: {field: function, any: [{kind: identifier, pattern: $HOOK}, {kind: member_access_expression, has: {field: expression, kind: identifier, pattern: $HOOK}}]}
    optional-hook:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Bind)$'}}, {has: {field: expression, matches: held-read}}]}
            - has: {field: arguments, all: [{has: {kind: argument, has: {matches: hook-call}}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    absent:
        kind: lambda_expression
        has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
    gated:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^(IsSome|IsNone)$'}
                - has: {field: expression, matches: held-read}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Exists|ForAll)$'}}, {has: {field: expression, matches: held-read}}]}
                - has: {field: arguments, all: [{has: {kind: argument, has: {matches: hook-call}}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    answered:
        kind: invocation_expression
        any:
            - has:
                field: arguments
                all:
                    - has: {kind: argument, nthChild: 1, has: {nthChild: {position: 1, reverse: true}, matches: hook-read}}
                    - has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, matches: base-default}}
            - all:
                - matches: {csharp-owner-call: {type: {regex: '^Answers$'}, member: {regex: '^(Answer|Succeeded)$'}}}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {nthChild: {position: 1, reverse: true}, matches: held-read}}}
            - has:
                field: arguments
                all:
                    - has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, matches: optional-hook}}
                    - not: {has: {kind: argument, not: {has: {nthChild: {position: 1, reverse: true}, any: [{matches: optional-hook}, {kind: 'identifier, member_access_expression'}, {matches: base-default}, {matches: absent}]}}}}
    forward:
        any:
            - matches: held-read
            - matches: gated
            - matches: defaulted
            - matches: unwrapped
            - matches: answered
            - kind: assignment_expression
              all:
                - has: {field: left, regex: '^_$'}
                - has: {field: right, matches: answered}
rule:
    kind: 'property_declaration, method_declaration'
    all:
        - has: {kind: modifier, regex: '^override$'}
        - has: {field: name, pattern: $NAME, not: {regex: '^(ToString|Equals|GetHashCode)$'}}
        - inside: {kind: declaration_list, inside: {kind: class_declaration, has: {kind: base_list}}}
        - any:
            - kind: property_declaration
              all:
                - has: {field: accessors, kind: accessor_list, all: [{has: {kind: accessor_declaration, not: {has: {field: body, pattern: $_}}, has: {field: name, regex: '^get$'}}}, {not: {has: {kind: accessor_declaration, nthChild: 2}}}]}
                - not: {has: {field: value, pattern: $_}}
            - kind: property_declaration
              any:
                - has: {field: value, kind: arrow_expression_clause, has: {matches: forward}}
                - has: {field: accessors, kind: accessor_list, all: [{has: {kind: accessor_declaration, has: {field: body, kind: arrow_expression_clause, has: {matches: forward}}}}, {not: {has: {kind: accessor_declaration, nthChild: 2}}}]}
            - kind: method_declaration
              has: {field: body, kind: arrow_expression_clause, has: {matches: forward}}
            - kind: method_declaration
              has:
                field: body
                kind: block
                all:
                    - has: {kind: expression_statement, has: {matches: forward}}
                    - not: {has: {pattern: $_, not: {any: [{kind: comment}, {kind: expression_statement, has: {any: [{matches: forward}, {kind: invocation_expression, matches: base-default}]}}]}}}
message: '`$NAME` overrides a host virtual by forwarding to a member its library class holds'
note: Use an application override of `<member>` on the host subclass with the constructor argument, field, or hook-record member holding it deleted, a forward restates host overrides and hides the host default
