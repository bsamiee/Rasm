# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-ambient-read-tsx
language: tsx
severity: error
utils:
    service-key:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(Clock|Random)$'}
            - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Clock|Random))?$'}, exported: {regex: '^(Clock|Random)$'}}}}
    service-implementation:
        pattern: $_
        any:
            - inside: {kind: arguments}
              follows: {stopBy: end, matches: service-key}
            - inside:
                kind: arguments
                inside: {kind: call_expression, has: {field: function, kind: call_expression, has: {field: arguments, has: {matches: service-key}}}}
            - inside:
                kind: variable_declarator
                field: value
                has: {field: type, has: {stopBy: end, kind: nested_type_identifier, regex: '^(Clock\.Clock|Random\.Random)$'}}
rule:
    not: {inside: {matches: service-implementation, stopBy: end}}
    any:
        - kind: new_expression
          has: {field: constructor, regex: '^(globalThis\.)?Date$', matches: syntax-global-reference}
          not: {has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}}
        - kind: call_expression
          has:
            field: function
            any:
                - matches: syntax-global-reference
                  regex: '^(globalThis\.)?(Date|Date\.now|Temporal\.Now\.\w+|Math\.random|crypto\.(randomUUID|getRandomValues)|performance\.now|process\.hrtime(\.bigint)?|process\.uptime)$'
                - matches:
                    syntax-import-reference:
                        source: {regex: '^(node:)?crypto$'}
                        exported: {regex: '^(randomUUID|randomUUIDv7|getRandomValues|randomBytes|randomInt|randomFill|randomFillSync)$'}
                - matches:
                    syntax-import-reference:
                        source: {regex: '^(node:)?(os|process)$'}
                        exported: {regex: '^uptime$'}
                - matches:
                    syntax-import-reference:
                        source: {regex: '^(node:)?process$'}
                        exported: {regex: '^hrtime$'}
                - kind: member_expression
                  all:
                    - has: {field: property, regex: '^bigint$'}
                    - has:
                        field: object
                        matches:
                            syntax-import-reference:
                                source: {regex: '^(node:)?process$'}
                                exported: {regex: '^hrtime$'}
                - kind: member_expression
                  all:
                    - has: {field: property, regex: '^now$'}
                    - has:
                        field: object
                        matches:
                            syntax-import-reference:
                                source: {regex: '^(node:)?perf_hooks$'}
                                exported: {regex: '^performance$'}
    pattern: $READ
message: '`$READ` reads host time or randomness as an ambient value'
note: 'Read the value from the `Clock` or `Random` service or take it as an argument, the function then reads its inputs alone'
labels:
    READ: {style: primary}
