# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-retry
language: python
severity: error
rule:
    matches:
        python-module-member:
            module: {regex: '^stamina$'}
            name: {regex: '^(retry|retry_context|RetryingCaller|AsyncRetryingCaller|BoundRetryingCaller|BoundAsyncRetryingCaller)$'}
message: A stamina retry policy reruns a failed operation instead of returning its failure
note: Run the operation once and return its failure as the error case of the result, the rewrite `retry-to-once` drops the retry forms
