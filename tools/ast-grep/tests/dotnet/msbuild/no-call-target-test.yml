id: no-call-target
valid:
    - |
      <Target Name="Report" DependsOnTargets="Compute"><Message Text="$(Computed)" /></Target>
    - |
      <ItemGroup><_Step Include="report"><CallTarget>Compute</CallTarget></_Step></ItemGroup>
    - |
      <Target Name="Report"><Message Text="$(Computed)" /></Target>
invalid:
    - |
      <Target Name="Report"><CallTarget Targets="Compute" /><Message Text="$(Computed)" /></Target>
    - |
      <Target Name="Report" DependsOnTargets="Prepare"><CallTarget Targets="Compute;Check" /><Message Text="$(Computed)" /></Target>
    - |
      <Target Name="Report" AfterTargets="Build">
        <CallTarget Targets="Compute" />
        <Message Text="$(Computed)" />
      </Target>
    - |
      <Target Name="Report"><Message Text="start" /><CallTarget Targets="Compute" /></Target>
    - |
      <Target Name="Report"><CallTarget Targets="Compute" Condition="'$(Skip)' != 'true'" /><Message Text="$(Computed)" /></Target>
    - |
      <Target Name="Report"><CallTarget Targets='Compute' /><Message Text="$(Computed)" /></Target>
    - |
      <Target Name="Report" Condition="'$(Count)' > '0'"><CallTarget Targets="Compute" /><Message Text="$(Computed)" /></Target>
    - |
      <Target Name="Report"><!-- first --><CallTarget Targets="Compute" /><Message Text="$(Computed)" /></Target>
    - |
      <Target Name="Report"><CallTarget Targets="Compute" RunEachTargetSeparately="true" /></Target>
    - |
      <Target Name="Report"><CallTarget Targets="Compute" /></Target>
