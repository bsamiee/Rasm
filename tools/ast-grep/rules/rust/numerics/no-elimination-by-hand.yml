# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-elimination-by-hand
language: rust
severity: error
utils:
    row-update:
        any:
            - kind: compound_assignment_expr
              all:
                - has: {field: operator, regex: '^-=$'}
                - has: {field: left, pattern: '$M[$J][$_]'}
                - has: {field: right, has: {stopBy: end, pattern: '$M[$I][$_]'}}
            - kind: assignment_expression
              all:
                - has: {field: left, pattern: '$M[$J][$_]'}
                - has:
                    field: right
                    kind: binary_expression
                    all:
                        - has: {field: operator, regex: '^-$'}
                        - has: {field: left, pattern: '$M[$J][$_]'}
                        - has: {field: right, has: {stopBy: end, pattern: '$M[$I][$_]'}}
rule:
    kind: 'binary_expression, compound_assignment_expr'
    pattern: $FACTOR
    all:
        - any:
            - pattern: $M[$J][$I] / $M[$I][$I]
            - pattern: $M[$J][$I] /= $M[$I][$I]
        - inside: {kind: function_item, stopBy: end, has: {stopBy: end, matches: row-update}}
message: '`$FACTOR` computes a Gaussian elimination factor against the pivot `$M[$I][$I]` by hand'
note: 'Solve through a decomposition the catalog owns: faer `Mat::partial_piv_lu().solve(&rhs)` or nalgebra `DMatrix::lu().solve(&b)` for dense systems of any size, nalgebra `SMatrix::lu().solve(&b)` for fixed sizes. Each decomposition pivots rows and reports a singular system'
