# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: attribute_item
    regex: '^#\[\p{Pattern_White_Space}*error\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*"'
    all:
        - inside: {kind: enum_variant_list}
        - not: {regex: '^#\[\p{Pattern_White_Space}*error\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*("\{([0-9]+|[_\p{XID_Start}]\p{XID_Continue}*)(:[^{}]*)?\}"|"\{\}"\p{Pattern_White_Space}*,\p{Pattern_White_Space}*\.\p{XID_Continue}+)\p{Pattern_White_Space}*,?\p{Pattern_White_Space}*\)\p{Pattern_White_Space}*\]$'}
        - precedes: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, kind: enum_variant, has: {field: name, pattern: $VARIANT}}
        - pattern: $ATTRIBUTE
        - follows: {stopBy: end, kind: attribute_item, pattern: $ATTRIBUTE}
message: '`$VARIANT` repeats an earlier variant''s `#[error]` message'
note: 'State each variant''s failure in its own `#[error]` message'
