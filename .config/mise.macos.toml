# --- [ENV] ------------------------------------------------------------------------------

[env]
ATELIER_PATH                          = "/Applications/Atelier.app/Contents/MacOS/Atelier"
BLENDER_PATH                          = """{% if env.BLENDER_PATH | default(value="") %}{{ env.BLENDER_PATH }}{% else %}{{ exec(command=`mdfind "kMDItemCFBundleIdentifier == 'org.blenderfoundation.blender'" | sed -n '1s|$|/Contents/MacOS/Blender|p'`, cache_key="blender-bundle", cache_duration="1d") }}{% endif %}"""
COLIMA_HOME                           = "{{ xdg_data_home }}/rasm/colima"
DOCKER_CONFIG                         = "{{ xdg_data_home }}/rasm/docker"
DOCKER_HOST                           = "unix://{{ env.COLIMA_HOME }}/default/docker.sock"
PITCHFORK_SUPERVISOR_AUTO_START       = "false"
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"

# --- [DAEMONS] --------------------------------------------------------------------------

[daemons.docker]
ready_cmd   = { run = ["docker", "version"], timeout = "5m" }
run         = 'exec env -C "$COLIMA_HOME" colima start --foreground --activate=false --ssh-config=false --mount none --cpus 4 --memory 4'
stop_signal = { signal = "SIGTERM", timeout = "120s" }

# --- [TASKS] ----------------------------------------------------------------------------

[tasks."docker:update"]
description = "Update and restart Colima's VM"
run         = '''
mise daemons start docker
colima update
mise daemons restart docker
'''
