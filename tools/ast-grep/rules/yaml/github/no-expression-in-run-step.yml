# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/yaml_rule.json
# No fix, the correction names a variable and adds an env map, a probe over `run: echo ${{ inputs.x }}` shows no text replacement builds both
id: no-expression-in-run-step
language: yaml
severity: error
files: [".github/**"] # Workflow and composite action steps, .github is hidden and the scan needs --no-ignore hidden
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - has: {field: key, regex: '^(run|"run"|''run'')$'} # The key bare or quoted
        - inside: {matches: github-step}
        - has: # The step's shell text, every scalar style, a mapping under run is the defaults shell entry
            field: value
            regex: '\$\{\{' # The expression delimiter, GitHub substitutes the value into the script before the shell parses it
            any:
                - kind: flow_node
                - {kind: block_node, has: {kind: block_scalar}}
message: Run step holds a `${{ }}` expression, the value is substituted into the script before its interpreter parses it
note: 'Move the expression to the step''s env map, `env: {NAME: ${{ <context> }}}`, and read the variable through the interpreter'
