# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-sql
language: sql
severity: error
utils:
    nested:
        any:
            - kind: cte_definition
            - kind: select_clause
              inside: {kind: 'table_or_subquery, subquery_expression, exists_expression, in_subquery_expression'}
    fourth-level:
        matches: nested
        inside:
            matches: nested
            stopBy: end
            inside:
                matches: nested
                stopBy: end
                inside: {matches: nested, stopBy: end}
rule:
    pattern: _QUERY
    matches: fourth-level
    not: {inside: {matches: fourth-level, stopBy: end}}
message: '`$QUERY` sits at the fourth nesting level of its statement'
note: Name each inner query as a common table expression of a top-level `with` clause, or replace a correlated subquery with a window function over the same rows
