            - not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}}}
rewriters:
    - id: body
      rule: {kind: 'declaration_list, enum_member_declaration_list', inside: {kind: 'enum_declaration, union_declaration', field: body}}
      fix: ''
    - id: arguments
      rule: {kind: argument_list, regex: "\n", inside: {kind: 'base_list, primary_constructor_base_type'}}
      fix: '(…)'
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: .}}
    HEADER: rewrite($DECLARATION, rewriters=[body, arguments, trivia])
    NEWLINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    TRIMMED: {replace: {source: $NEWLINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {not: {inside: {stopBy: end, kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration', inside: {stopBy: end, matches: enclosing}, not: {matches: public}}}}
---
id: csharp-member-delegate
language: csharplang
role: member
symbolType: function
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-enum]
utils:
    enclosing: {kind: 'class_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    public:
        any:
            - has: {kind: modifier, regex: '^(?:public|protected)$'}
              not: {has: {kind: modifier, regex: '^private$'}}
            - inside: {stopBy: {matches: enclosing}, kind: interface_declaration}
              not: {has: {kind: modifier, regex: '^(?:private|internal)$'}}
rule:
    kind: delegate_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    any:
        - inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: $OWNER}, inside: {stopBy: end, matches: enclosing}}
        - not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}}}
rewriters:
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: .}}
    HEADER: rewrite($DECLARATION, rewriters=[trivia])
    NEWLINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    TRIMMED: {replace: {source: $NEWLINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic:
    all:
        - matches: public
        - not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}, not: {matches: public}}}
