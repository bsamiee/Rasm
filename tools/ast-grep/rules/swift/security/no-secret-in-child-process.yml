# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    child-call:
        kind: call_expression
        has: {nthChild: 1, regex: '^((Subprocess(\.|::))?(run|Configuration(\.init)?)|(Foundation(\.|::))?Process\.(run|launchedProcess))$'}
    child-parameter:
        kind: value_argument
        inside: {kind: value_arguments, inside: {kind: call_suffix, inside: {matches: child-call}}}
    process-receiver:
        any:
            - kind: call_expression
              has: {nthChild: 1, regex: '^(Foundation(\.|::))?Process(\.init)?$'}
            - all:
                - kind: simple_identifier
                - matches: {swift-typed-use: {type: {regex: '^(Foundation(\.|::))?Process$'}}}
    process-environment:
        kind: navigation_expression
        all:
            - has: {field: suffix, regex: '^\.environment$'}
            - has: {field: target, matches: process-receiver}
    environment-store:
        any:
            - matches: process-environment
            - kind: postfix_expression
              has: {matches: process-environment}
    arguments-sink:
        any:
            - inside: {stopBy: &scope {kind: 'lambda_literal, function_declaration, property_declaration'}, matches: child-parameter, has: {field: name, regex: '^arguments$'}}
            - inside: {stopBy: *scope, kind: call_expression, has: {nthChild: 1, regex: '^(Subprocess(\.|::))?Arguments(\.init)?$'}}
            - inside:
                kind: assignment
                field: result
                has:
                    field: target
                    has:
                        kind: navigation_expression
                        all:
                            - has: {field: suffix, regex: '^\.arguments$'}
                            - has: {field: target, matches: process-receiver}
    environment-sink:
        any:
            - inside: {stopBy: *scope, matches: child-parameter, has: {field: name, regex: '^environment$'}}
            - inside: {stopBy: *scope, kind: call_expression, has: {nthChild: 1, regex: '^(Subprocess(\.|::))?Environment\.(custom|inherit\.updating)$'}}
            - inside: {kind: assignment, field: result, has: {field: target, has: {matches: process-environment}}}
    secret-name:
        kind: line_string_literal
        regex: '^"([A-Z][A-Z0-9_]*_)?(TOKEN|SECRET|PASSWORD|PASSPHRASE|CREDENTIALS?|API_?KEY|KEY)"$'
    variable-name:
        kind: line_string_literal
        regex: '^"[A-Z_][A-Z0-9_]*"$'
    secret-value:
        any:
            - kind: navigation_expression
              has: {field: suffix, has: {field: suffix, regex: '(?i)(token|apiKey|secret|password|passphrase|credential)$'}}
            - kind: simple_identifier
              regex: '(?i)(token|apiKey|secret|password|passphrase|credential)$'
            - kind: line_string_literal, multi_line_string_literal, raw_string_literal
              has: {stopBy: end, kind: interpolated_expression, has: {field: value, matches: secret-value}}
    plain-value:
        pattern: $_
        not: {regex: '(?i)(descriptor|fileno|rawValue)'}
    exposed-pair:
        any:
            - all:
                - has: {stopBy: end, pattern: $SECRET, matches: secret-name}
                - has: {stopBy: end, pattern: $VALUE, matches: plain-value}
            - all:
                - has: {stopBy: end, pattern: $SECRET, matches: variable-name}
                - has: {stopBy: end, pattern: $VALUE, matches: secret-value}
    secret-option:
        kind: line_string_literal
        regex: '(?i)^"--?([a-z0-9]+-)*(token|password|passphrase|secret|api-?key|credentials?)("$|=)'
    valued-flag:
        kind: line_string_literal
        inside: {kind: array_literal}
        any:
            - regex: '^"-(w|X)"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"add-(generic|internet)-password"$'}}}}
            - regex: '^"-p"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"(add-generic-password|create-keychain|unlock-keychain|set-keychain-password)"$'}}}}
            - regex: '^"-o"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"set-keychain-password"$'}}}}
            - regex: '^"-k"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"set-(generic-password|internet-password|key)-partition-list"$'}}}}
            - regex: '^"-P"$'
              inside: {stopBy: end, matches: {swift-security-arguments: {subcommand: {regex: '^"(import|export)"$'}}}}
            - matches: secret-option
              regex: '"$'
rule:
    any:
        - all:
            - matches: valued-flag
            - matches: arguments-sink
            - precedes: {stopBy: {pattern: $_}, pattern: $SECRET}
        - all:
            - matches: secret-option
            - regex: '='
            - pattern: $SECRET
            - inside: {kind: array_literal}
            - matches: arguments-sink
        - all:
            - matches: secret-value
            - pattern: $SECRET
            - inside: {kind: array_literal}
            - not: {follows: {stopBy: {pattern: $_}, matches: valued-flag}}
            - matches: arguments-sink
        - all:
            - matches: variable-name
            - pattern: $SECRET
            - any:
                - nthChild: {position: 2n+1, ofRule: {not: {kind: 'comment, multiline_comment'}}}
                  inside: {kind: dictionary_literal}
                - nthChild: 1
                  inside: {kind: tuple_expression}
            - inside: {kind: 'dictionary_literal, tuple_expression', matches: environment-sink}
            - any:
                - matches: secret-name
                  precedes: {stopBy: &value {pattern: $_}, pattern: $VALUE, matches: plain-value}
                - precedes: {stopBy: *value, pattern: $VALUE, matches: secret-value}
        - all:
            - any:
                - pattern: '$STORE[$_] = $VALUE'
                  has: {field: target, all: [{has: {stopBy: end, kind: line_string_literal, pattern: $SECRET}}, {has: {kind: call_expression, has: {nthChild: 1, pattern: $STORE, matches: environment-store}}}]}
                - pattern: '$STORE.updateValue($VALUE, forKey: $SECRET)'
                  has: {nthChild: 1, has: {field: target, matches: environment-store}}
                - kind: call_expression
                  all:
                    - has: {nthChild: 1, regex: '^((Darwin|Glibc|Musl)(\.|::))?setenv$'}
                    - has:
                        kind: call_suffix
                        has:
                            kind: value_arguments
                            all:
                                - has: {kind: value_argument, nthChild: {position: 1, ofRule: {kind: value_argument}}, has: {field: value, pattern: $SECRET}}
                                - has: {kind: value_argument, nthChild: {position: 2, ofRule: {kind: value_argument}}, has: {field: value, pattern: $VALUE}}
            - matches: exposed-pair
message: '`$SECRET` passes a secret in child argv or environment, readable through `ps` by every process of the same uid'
note: 'Write secrets to a pipe the child reads, as a `security -i` command on stdin or a descriptor number it opens'
