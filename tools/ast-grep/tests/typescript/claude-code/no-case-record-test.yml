id: no-case-record
valid:
    - |
      const decided = decision.kind === 'deny' ? { deny: decision.reason } : next(decision.e);
    - |
      const block = summary === undefined ? undefined : questions(summary);
    - |
      const text = decode(isNotice)(row)?.text ?? '';
    - |
      const pinned = word.text.match(_PIN);
    - |
      const open = command.slice(0, span.start).match(_OPEN);
    - |
      const name = text.match(/x/u)?.groups?.name;
    - |
      const value = Option.match(option, { onNone: () => 0, onSome: (found) => found });
    - |
      interface PathRow { readonly match: (path: string, text: string) => boolean; }
    - |
      interface Row { match(path: string): boolean; }
    - |
      const row = { match: (path): boolean => extension(path) === '.cs', deny: () => BINARY };
    - |
      const rows = 'part' in batch ? [] : batch.rows;
    - |
      const spawned = $.agent.spawn({ subagentType: WORKER, prompt, background: true });
    - |
      const lifted = Option.match({ onNone: () => 0, onSome: (found) => found });
    - |
      const found = matcher.match(value, { partial: true });
    - |
      interface Io { readonly run: <T>(argv: readonly string[]) => Promise<T>; }
    - |
      interface Store { get<T>(key: string): T; }
    - |
      const named = 'reason' === field;
invalid:
    - |
      const value = option.match<Option<B>>({ some: f, none });
    - |
      fromBoolean(held).match<void>({ some: () => $.ui.notice(id, text), none: () => undefined });
    - |
      return decision.match<Promise<Result>>({ rewrite: (e, context) => next(e), deny: absurd, answer: absurd });
    - |
      const some = <A>(value: A): Option<A> => ({ match: (cases) => cases.some(value) });
    - |
      const none = <A>(): Option<A> => ({ match: (cases) => cases.none() });
    - |
      const denied = { match: (cases: Cases) => cases.deny(reason) };
    - |
      const answered = { match: <B>(cases: Cases<B>) => cases.answer(result) };
    - |
      interface Option<A> { readonly match: <B>(cases: OptionCases<A, B>) => B; }
    - |
      type Carrier = { match<B>(cases: Cases<B>): B };
    - |
      const held = 'reason' in decision ? { deny: decision.reason } : next(decision.e);
    - |
      const passed = 'e' in decision;
    - |
      const answered = "result" in decision;
