# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Two-arm branch over a carrier, Effect.if or a match with an onX pair, Layer.match and Fiber.match take arms no rule reads
id: effect-two-arm-branch
language: tsx
rule:
    kind: call_expression
    has:
        field: function
        kind: member_expression
        any:
            - pattern: Effect.if
            - all:
                  - has: {field: object, regex: '^(Boolean|Option|Either|Exit|Effect|Micro|STM)$'}
                  - has: {field: property, regex: '^(match|matchEffect|matchSTM)$'}
