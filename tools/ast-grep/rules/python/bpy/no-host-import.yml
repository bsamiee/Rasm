# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-host-import
language: python
severity: error
files:
    - libs/python/rasm/**
ignores:
    - libs/python/rasm/blender/**
rule:
    pattern: $M
    any:
        - matches: python-imported-module
          any:
            - matches: python-blender-module
            - kind: string_content
              regex: '^rasm\.blender(\.\w+)*$'
            - kind: dotted_name
              all:
                - has: {kind: identifier, regex: '^rasm$', nthChild: {position: 1, ofRule: {kind: identifier}}}
                - has: {kind: identifier, regex: '^blender$', nthChild: {position: 2, ofRule: {kind: identifier}}}
        - kind: dotted_name
          regex: '^blender$'
          any:
            - inside: {kind: import_from_statement, has: {field: module_name, regex: '^rasm$'}}
            - inside: {kind: aliased_import, field: name, inside: {kind: import_from_statement, has: {field: module_name, regex: '^rasm$'}}}
message: '`$M` reaches Blender, and a package outside `rasm.blender` imports no Blender module'
note: 'Use the value as data the `rasm.blender` caller passes, or move the capability into the `rasm.blender` sub-package owning the data it reads'
