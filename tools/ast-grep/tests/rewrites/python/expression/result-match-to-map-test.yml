# Every case is a function, the match sits under a function body, and no-result-match-for-map owns the detection cases
id: result-match-to-map
valid:
    # The corrected form
    - |
      def owner(names):
          return names.map(lambda text: text.strip())
    # Wildcard ok pattern, the mapper has no parameter name
    - |
      def owner(names, env):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=_):
                  return Ok(env)
    # Tag-only ok pattern, the mapper has no parameter name
    - |
      def owner(names, env):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(tag="ok"):
                  return Ok(env)
    # Ok pattern with no capture
    - |
      def owner(names, env):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result():
                  return Ok(env)
    # Operator subject, the member access would bind to the right operand
    - |
      def owner(first, second):
          match first or second:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(text.strip())
    # Guard on the ok arm
    - |
      def owner(names, rid):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=manifest) if rid in manifest.runtimes:
                  return Ok(manifest.runtimes[rid])
    # Ok arm return holding an await, a lambda has no await
    - |
      async def owner(names, fetch):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(await fetch(text))
    # Ok value destructured as a tuple
    - |
      def owner(pair):
          match pair:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=(repo, ref)):
                  return Ok(f"{repo}@{ref}")
    # Match followed by a statement
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(text)
          return Ok("")
    # Different qualified Result classes are different dispatch domains
    - |
      def owner(value):
          match value:
              case first.Result(error=failure):
                  return Error(failure)
              case second.Result(ok=text):
                  return Ok(text.strip())
    # Ok value compared with a dotted constant
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=Mode.Fast):
                  return Ok(True)
    # Ok pattern with a keyword beside the tag and the ok
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text, error=_):
                  return Ok(text)
    # Match at module level, a return has no function
    - |
      match names:
          case Result(tag="error", error=failure):
              return Error(failure)
          case Result(ok=text):
              return Ok(text.strip())
    # Pattern locals remain visible to cleanup outside the callback
    - |
      def owner(value):
          try:
              match value:
                  case Result(error=failure):
                      return Error(failure)
                  case Result(ok=text):
                      return Ok(text.strip())
          finally:
              observe(locals())
    # Comment inside the ok arm, the explanation needs an explicit review
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  # The strip drops the trailing newline
                  return Ok(text.strip())
    # Third arm
    - |
      def owner(names, rid):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=manifest) if rid not in manifest.runtimes:
                  return Ok(Unsupported(rid))
              case Result(ok=manifest):
                  return Ok(manifest.runtimes[rid])
    # Ok arm with a statement before the return
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  stripped = text.strip()
                  return Ok(stripped)
invalid:
    # Comment after the match, the match stays the last statement
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(text)
          # Every arm returns
    # Nested function under a try with cleanup, the nested def owns its match
    - |
      def owner(names):
          try:
              def inner(value):
                  match value:
                      case Result(tag="error", error=failure):
                          return Error(failure)
                      case Result(ok=text):
                          return Ok(text.strip())
              return names.bind(inner)
          finally:
              observe(locals())
    # The instance, an awaited subject takes parentheses
    - |
      async def owner(path, cwd):
          match await run(["otool", "-L", str(path)], cwd, capture=True):
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok([line.split()[0] for line in text.splitlines()[1:] if line.strip()])
    # Arms in the other order
    - |
      def owner(names):
          match names:
              case Result(ok=text):
                  return Ok(text.strip())
              case Result(tag="error", error=failure):
                  return Error(failure)
    # Ok arm spelled with the tag
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(tag="ok", ok=text):
                  return Ok(text.strip())
    # A body of one call over the name, the callee itself is the mapper
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(parse(text))
    # A body of one method call over the name
    - |
      def owner(self, names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(self.parse(text))
    # A call over another value keeps the lambda
    - |
      def owner(names, path):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(load(path))
    # A call with a further argument keeps the lambda
    - |
      def owner(names, path):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(parse(text, path))
    # The identity, the mapper returns its parameter
    - |
      def owner(names):
          match names:
              case Result(tag="error", error=failure):
                  return Error(failure)
              case Result(ok=text):
                  return Ok(text)
    # Static method spellings
    - |
      def owner(names):
          match names:
              case Result(error=failure, tag="error"):
