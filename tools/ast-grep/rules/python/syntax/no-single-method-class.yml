# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-method-class
language: python
severity: error
utils:
    init: {kind: function_definition, has: {field: name, regex: '^__init__$'}}
    method:
        kind: function_definition
        any:
            - not: {has: {field: name, regex: '^__.*__$'}}
            - has: {field: name, regex: '^__call__$'}
    static-method:
        kind: decorated_definition
        has: {kind: decorator, regex: '^@staticmethod$'}
        not: {has: {kind: function_definition, has: {field: name, regex: '^__.*__$'}}}
rule:
    kind: class_definition
    all:
        - matches: python-plain-class
        - has: {field: name, pattern: $NAME}
        - not: {has: {kind: identifier, regex: '^__class__$', stopBy: end}}
        - has:
            field: body
            any:
                - all:
                    - has: {matches: method}
                    - not: {has: {nthChild: {position: 2, ofRule: {not: {any: [{matches: python-docstring-or-comment}, {matches: init}]}}}}}
                - all:
                    - has: {matches: static-method}
                    - not: {has: {not: {any: [{matches: python-docstring-or-comment}, {matches: static-method}]}}}
message: '`$NAME` holds one instance method or static methods alone'
note: 'Write the operation as a function and its state as a frozen `msgspec.Struct`, or an `attrs.frozen` class where the interpreter lacks msgspec'
labels:
    NAME: {style: primary, message: Class with one method}
