# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-variant-parse-match
language: rust
utils:
    variant-value:
        any:
            - kind: scoped_identifier
              has: {field: path, pattern: $E}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^(Some|Ok)$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, kind: scoped_identifier, has: {field: path, pattern: $E}}}, {not: {has: {nthChild: 2}}}]}
            - kind: block
              all:
                - has: {nthChild: {position: 1, ofRule: {matches: rust-statement-slot}}, matches: variant-value}
                - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement-slot}}}}
    literal-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, regex: '^"[^"\\]*"(\s*\|\s*"[^"\\]*")*$'}
            - has: {field: value, matches: variant-value}
    fallback-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, regex: '^(_|[a-z_]\w*)$'}
            - has: {field: value, any: [{regex: '^\{?\s*(None\b|Err\s*\()'}, {matches: variant-value}]}
rule:
    kind: match_expression
    all:
        - has:
            field: body
            all:
                - has: {kind: match_arm, nthChild: {position: 1, reverse: true, ofRule: {kind: match_arm}}, matches: fallback-arm}
                - has: {kind: match_arm, matches: literal-arm}
                - not: {has: {kind: match_arm, not: {any: [{matches: literal-arm}, {matches: fallback-arm}]}}}
        - inside: {kind: 'function_item, closure_expression', stopBy: {kind: 'function_item, closure_expression'}}
        - any:
            - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $E}}}
            - all:
                - has: {field: body, has: {kind: match_arm, has: {field: value, regex: '\bSelf::'}}}
                - inside: {kind: impl_item, stopBy: end, has: {field: type, kind: type_identifier, pattern: $T}}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $T}}}
