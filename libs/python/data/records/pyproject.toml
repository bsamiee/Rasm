# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-records"
version         = "0.1.0"
description     = "Fault records and results, record field domains, record files and stores, and keyed record trees"
license         = "MIT"
authors         = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers     = ["Intended Audience :: Developers", "Operating System :: OS Independent", "Private :: Do Not Upload", "Topic :: Software Development :: Libraries", "Typing :: Typed"]
requires-python = ">=3.13"

dependencies = [
    "cbor2>=6.0.0",              # Canonical binary content hashing through `dumps(encoders=)`
    "expression>=5.2.0",         # Results, options, and collections over records, `Result.or_else_with` from 5.2.0
    "msgspec[toml]>=0.19.0",     # Records, tagged unions, field bounds, and JSON, TOML, and MessagePack codecs, Python 3.13 from 0.19.0
    "numpy>=2.1.0",              # Content hashes of array buffers, Python 3.13 from 2.1.0
    "typing-extensions>=4.13.0", # Runtime `TypeForm` schemas where `typing` lacks `TypeForm`
]

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/libs/python/data/records"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table
