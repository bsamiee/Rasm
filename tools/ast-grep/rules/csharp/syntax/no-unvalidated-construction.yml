# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unvalidated-construction
language: csharp
severity: error
utils:
    callee:
        any:
            - kind: member_access_expression
              has: {field: name, pattern: $CALLEE}
            - kind: identifier, generic_name
              pattern: $CALLEE
    flags-type:
        regex: '^(global::)?(System\.)?(Reflection\.)?BindingFlags$'
    non-public-member:
        kind: member_access_expression
        regex: '^(global::)?(System\.)?(Reflection\.)?BindingFlags\.NonPublic$'
    non-public-flag:
        has:
            stopBy: end
            any:
                - matches: non-public-member
                - kind: cast_expression
                  all:
                    - has: {field: type, matches: flags-type}
                    - has: {field: value, kind: integer_literal}
                - kind: identifier
                  pattern: $FLAGS
                  inside:
                    kind: compilation_unit
                    stopBy: end
                    has:
                        stopBy: end
                        kind: variable_declarator
                        all:
                            - has: {field: name, pattern: $FLAGS}
                            - has: {stopBy: end, matches: non-public-member}
rule:
    any:
        - kind: invocation_expression
          has:
            field: function
            matches: callee
            regex: '(^|\.)Get(Safe)?UninitializedObject$'
        - kind: invocation_expression
          all:
            - has:
                field: function
                matches: callee
                all:
                    - has: {field: expression, regex: '^(global::)?(System\.)?Activator$'}
                    - has: {field: name, regex: '^CreateInstance$'}
            - has:
                field: arguments
                any:
                    - has: {kind: argument, nthChild: 2, has: {kind: boolean_literal, regex: '^true$'}}
                    - has: {kind: argument, all: [{has: {field: name, regex: '^nonPublic$'}}, {has: {kind: boolean_literal, regex: '^true$'}}]}
                    - matches: non-public-flag
        - kind: invocation_expression
          all:
            - has: {field: function, matches: callee, has: {field: name, regex: '^GetConstructors?$'}}
            - has: {field: arguments, matches: non-public-flag}
        - kind: member_access_expression
          has: {field: name, pattern: $CALLEE, regex: '^DeclaredConstructors$'}
        - kind: invocation_expression
          has:
            field: function
            kind: member_access_expression
            all:
                - has:
                    field: name
                    kind: generic_name
                    pattern: $CALLEE
                    has: {kind: type_argument_list, not: {has: {nthChild: {position: 1, reverse: true}, kind: predefined_type}}}
                - any:
                    - all:
                        - has: {field: expression, regex: '^(global::)?(System\.)?(Runtime\.CompilerServices\.)?Unsafe$'}
                        - has: {field: name, regex: '^(As|BitCast|Read|ReadUnaligned)<'}
                    - all:
                        - has: {field: expression, regex: '^(global::)?(System\.)?(Runtime\.InteropServices\.)?MemoryMarshal$'}
                        - has: {field: name, regex: '^(Cast|AsRef|Read|TryRead)<'}
message: '`$CALLEE` bypasses its type''s public constructors and factories'
note: Use a declared factory or public constructor, each runs the checks its type states
