# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: languageext-error-record
language: csharp
utils:
    error-base:
        matches: {csharp-type-name: {name: {regex: '^(Expected|Exceptional|Error)$'}}}
rule:
    kind: 'record_declaration'
    has:
        kind: base_list
        has:
            nthChild: 1
            any:
                - {kind: 'identifier, qualified_name', matches: error-base}
                - {kind: primary_constructor_base_type, has: {field: type, matches: error-base}}
