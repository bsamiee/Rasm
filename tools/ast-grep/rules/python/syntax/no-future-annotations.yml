# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
metadata: {python-from: '3.14'}
rule:
    kind: future_import_statement
    pattern: $IMPORT
    has: {any: [{kind: dotted_name, regex: '^annotations$'}, {kind: aliased_import, has: {field: name, regex: '^annotations$'}}]}
message: '`$IMPORT` stores annotations as strings'
note: 'Delete `annotations` from the `__future__` import'
