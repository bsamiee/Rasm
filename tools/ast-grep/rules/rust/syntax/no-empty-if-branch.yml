# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-if-branch
language: rustlang
severity: error
utils:
    comment:
        kind: 'line_comment, block_comment'
    empty-then:
        kind: block
        not: {has: {pattern: $_, not: {matches: comment}}}
rule:
    kind: if_expression
    all:
        - has: {field: consequence, matches: empty-then}
        - has: {field: condition, pattern: $COND}
        - has: {field: alternative, kind: else_clause}
message: '`if $COND` holds an empty branch beside its `else`'
note: 'Negate the condition, using `let .. else` for diverging pattern failures or `!matches!(..)` for boolean pattern tests'
