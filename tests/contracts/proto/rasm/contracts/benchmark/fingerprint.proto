syntax = "proto3";

package rasm.contracts.benchmark;

import "buf/validate/validate.proto";

message LabelPair {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  string value = 2;
}

message HostFingerprintWire {
  string print = 1 [(buf.validate.field).string.min_len = 1];
  string machine = 2 [(buf.validate.field).string.min_len = 1];
  string os = 3 [(buf.validate.field).string.min_len = 1];
  string arch = 4 [(buf.validate.field).string.min_len = 1];
  uint32 processors = 5 [(buf.validate.field).uint32.gt = 0];
  string runtime = 6 [(buf.validate.field).string.min_len = 1];
  repeated LabelPair stamps = 7;
}
