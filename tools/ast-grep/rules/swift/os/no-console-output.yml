# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-console-output
language: swift
severity: error
utils:
    host-entry:
        any:
            - inside:
                stopBy: end
                kind: function_declaration
                all:
                    - has: {field: name, regex: '^main$'}
                    - has: {kind: modifiers, has: {kind: property_modifier, regex: '^static$'}}
                    - inside:
                        kind: 'class_body, enum_class_body'
                        inside: {kind: class_declaration, has: {kind: modifiers, has: {kind: attribute, regex: '^@main$'}}}
            - inside:
                stopBy: {kind: 'function_declaration, lambda_literal, class_declaration, protocol_declaration, property_declaration, init_declaration, deinit_declaration, subscript_declaration'}
                kind: source_file
    callee:
        any:
            - kind: simple_identifier
            - kind: navigation_expression
              has: {field: target, kind: simple_identifier, regex: '^(Swift|Foundation|CoreFoundation|Darwin|Glibc|os|System|SystemPackage)$'}
    standard-stream:
        pattern: $OUT
        any:
            - kind: navigation_expression
              regex: '^((Foundation\.)?FileHandle|((SystemPackage|System)\.)?FileDescriptor)\.standard(Output|Error)$'
            - kind: value_argument
              regex: '^((Darwin|Glibc)\.)?std(out|err)$'
              inside: {kind: value_arguments, inside: {kind: call_suffix, inside: {kind: call_expression, has: {nthChild: 1, matches: callee, regex: '(^|\.)(fputs|fprintf|vfprintf|fwrite|fputc|putc)$'}}}}
            - kind: value_argument
              nthChild: 1
              regex: '^(((Darwin|Glibc)\.)?STD(OUT|ERR)_FILENO|1|2)$'
              inside: {kind: value_arguments, inside: {kind: call_suffix, inside: {kind: call_expression, has: {nthChild: 1, matches: callee, regex: '(^|\.)(write|dprintf|vdprintf)$'}}}}
            - kind: value_argument
              nthChild: 1
              regex: '^(fileDescriptor|rawValue):\s*(((Darwin|Glibc)\.)?STD(OUT|ERR)_FILENO|1|2)$'
              inside: {kind: value_arguments, inside: {kind: call_suffix, inside: {kind: call_expression, has: {nthChild: 1, matches: callee, regex: '(^|\.)(FileHandle|FileDescriptor)$'}}}}
    diagnostic:
        any:
            - matches: standard-stream
              regex: '(?i)err|\b2$'
            - kind: call_expression
              any:
                - has: {nthChild: 1, matches: callee, pattern: $OUT, regex: '(^|\.)(debugPrint|dump|NSLog|NSLogv|os_log|perror|CFShow)$'}
                - has: {nthChild: 1, kind: navigation_expression, pattern: $OUT, has: {field: suffix, regex: '^\._printChanges$'}}
                - all:
                    - has: {nthChild: 1, matches: callee, pattern: $OUT, regex: '(^|\.)print$'}
                    - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^to$'}}}}
    result:
        any:
            - matches: standard-stream
            - kind: call_expression
              has: {nthChild: 1, matches: callee, pattern: $OUT, regex: '(^|\.)(print|puts|putchar|printf|vprintf)$'}
rule:
    any:
        - matches: diagnostic
        - matches: result
          not: {matches: host-entry}
message: '`$OUT` writes a diagnostic outside `Logger` or a result outside the program entry'
note: 'Log a diagnostic through `Logger` from `os` with a `privacy:` annotation on each interpolation, and write a command-line result to stdout from the program entry alone, `static func main` of the `@main` type or top-level code of `main.swift`'
