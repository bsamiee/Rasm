id: no-registration-outside-register
valid:
    - |
      const register = (on: On): void => {
          on('session.start', ($, e, next) => next(e));
          on('tool.call', ($, e, next) => next(e));
      };
    - |
      on('tool.call', { tool: 'Bash' }, ($, e, next) => next(e));
      on('tool.call', { tool: 'Read' }, ($, e, next) => next(e));
    - |
      on('tool.call', ($, e, next) => next(e));
      on('tool.call', { tool: 'Bash' }, ($, e, next) => next(e));
    - |
      on('*', ($, e, next) => next(e));
      on('tool.call', ($, e, next) => next(e));
    - |
      const toolCall = (on: On, options: Options): void => {
          on('tool.call', ($, e, next) => next(e));
      };
    - |
      on('session.start', ($, e, next) => {
          arm('tool.call');
          return next(e);
      });
    - |
      const first = (on: On): void => {
          on('tool.call', ($, e, next) => next(e));
      };
      const second = (on: On): void => {
          on('tool.call', ($, e, next) => next(e));
      };
    - |
      const arm = (register: Other): void => {
          register('tool.call', ($, e, next) => next(e));
          register('tool.call', ($, e, next) => next(e));
      };
    - |
      on('session.start', ($, e, next) => {
          emitter.on('change', redraw);
          return next(e);
      });
    - |
      on('tool.call', { tool: 'Bash' }, ($, e, next) => next(e));
      on('tool.call', ($, e, next) => next(e));
    - |
      const arm = (on: On): void => {
          EVENTS.forEach((event) => on(event, ($, e, next) => next(e)));
      };
    - "on(nextEvent(), first); on(nextEvent(), second);"
    - 'on(EVENT, first); EVENT = "other"; on(EVENT, second);'
    - |
      on(EVENT, ($, e, next) => next(e));
      on(EVENT, ($, e, next) => next(e));
    - 'on("tool.\u0063all", first); on("tool.\u0064escribe", second);'
    - 'on(`tool.${kind}`, first); on(`tool.${kind}`, second);'
invalid:
    - 'on(`tool.call`, first); on(`tool.call`, second);'
    - "on('tool.call', first); on(`tool.call`, second);"
    - |
      on('session.start', ($, e, next) => {
          on('tool.call', ($, e, next) => next(e));
          return next(e);
      });
    - |
      on('session.start', ($, e, next) => {
          const arm = (): void => {
              on('tool.call', ($, e, next) => next(e));
          };
          arm();
          return next(e);
      });
    - |
      on('tool.call', { tool: 'Bash' }, ($, e, next) => {
          on('prompt.submit', ($, e, next) => next(e));
          return next(e);
      });
    - |
      on('tool.call', ($, e, next) => next(e));
      on('tool.call', ($, e, next) => next(e));
    - |
      on("tool.call", ($, e, next) => next(e));
      on("tool.call", ($, e, next) => next(e));
    - |
      on('*', ($, e, next) => next(e));
      on('*', ($, e, next) => next(e));
    - |
      on('tool.call', ($, e, next) => next(e));
      on('session.start', ($, e, next) => next(e));
      on('tool.call', ($, e, next) => next(e));
    - |
      const arm = (register: On): void => {
          register('tool.call', ($, e, next) => next(e));
          register('tool.call', ($, e, next) => next(e));
      };
    - |
      const arm = (register: On): void => {
          register('session.start', ($, e, next) => {
              register('tool.call', ($, e, next) => next(e));
              return next(e);
          });
      };
    - |
      on('tool.call', ($, e, next) => next(e));
      on('tool.call', { tool: 'Bash' }, ($, e, next) => next(e));
      on('tool.call', ($, e, next) => next(e));
    - |
      on('tool.call', first);
      on('tool.call', second);
    - |
      const hook = ($, e, next) => {
          on('tool.call', ($, e, next) => next(e));
          return next(e);
      };
      on('session.start', hook);
    - |
      const hook = ($, e, next) => {
          on('prompt.submit', ($, e, next) => next(e));
          return next(e);
      };
      on('tool.call', { tool: 'Bash' }, hook);
    - "on(\"tool.call\", first); on('tool.call', second);"
    - |
      on('session.start', hook);
      function hook($, e, next) {
          on('tool.call', ($, e, next) => next(e));
          return next(e);
      }
