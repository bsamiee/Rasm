# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-untyped-error-tsx
language: tsx
severity: error
utils:
    untagged-error:
        any:
            - kind: string, number, true, false, null, undefined, regex
            - kind: unary_expression
              regex: '^[+-]'
              has: {field: argument, kind: number}
            - kind: template_string
            - kind: as_expression, satisfies_expression, parenthesized_expression
              has: {matches: untagged-error}
            - kind: new_expression
              has: {field: constructor, matches: syntax-global-reference, regex: '^(globalThis\.)?(Error|TypeError|RangeError|SyntaxError|ReferenceError|EvalError|URIError|AggregateError)$'}
            - any:
                - kind: new_expression
                  has: {field: 'constructor', not: {matches: syntax-package-reference}}
                - kind: call_expression
                  has: {field: function, not: {matches: syntax-package-reference}}
              all:
                - has:
                    field: arguments
                    has:
                        kind: object
                        has:
                            kind: pair
                            all:
                                - has: {field: key, regex: '^(message|cause|reason|detail|description|text)$'}
                                - has: {field: value, kind: 'string, template_string'}
    untagged-thunk:
        kind: arrow_function, function_expression, method_definition
        has:
            field: body
            any:
                - matches: untagged-error
                  pattern: $ERROR
                - kind: statement_block
                  has:
                    kind: return_statement
                    has: {matches: untagged-error, pattern: $ERROR}
                    stopBy: {matches: syntax-function-boundary}
    strict-constructor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^fail$'}
            - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Stream|Channel|Sink|Exit|Cause|Deferred|Request|Result))?$'}, exported: {regex: '^(Effect|Stream|Channel|Sink|Exit|Cause|Deferred|Request|Result)$'}}}}
    lazy-constructor:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^failSync$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Stream|Channel|Sink|Deferred))?$'}, exported: {regex: '^(Effect|Stream|Channel|Sink|Deferred)$'}}}}
            - all:
                - has: {field: property, regex: '^mapError$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Stream|Channel|Sink|Exit|Result))?$'}, exported: {regex: '^(Effect|Stream|Channel|Sink|Exit|Result)$'}}}}
            - all:
                - has: {field: property, regex: '^fromOption$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Result))?$'}, exported: {regex: '^(Effect|Result)$'}}}}
    filter-constructor:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^filterOrFail$'}
                - has: {field: object, matches: effect-effect-module}
            - all:
                - has: {field: property, regex: '^(filterOrFail|liftPredicate)$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Result)?$'}, exported: {regex: '^Result$'}}}}
    options-callee:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^(try|tryPromise)$'}
                - has: {field: object, matches: effect-effect-module}
            - all:
                - has: {field: property, regex: '^try$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Result)?$'}, exported: {regex: '^Result$'}}}}
            - all:
                - has: {field: property, regex: '^mapBoth$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Exit|Stream|Result))?$'}, exported: {regex: '^(Effect|Exit|Stream|Result)$'}}}}
    failure-member:
        any:
            - kind: pair
              all:
                - has: {field: key, regex: '^(catch|onFailure)$'}
                - has: {field: value, matches: untagged-thunk}
            - kind: method_definition
              has: {field: name, regex: '^(catch|onFailure)$'}
              matches: untagged-thunk
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: arguments, has: {matches: untagged-error, pattern: $ERROR}}
            - has: {field: function, pattern: $FAIL, matches: strict-constructor}
        - all:
            - has: {field: arguments, has: {matches: untagged-thunk}}
            - has: {field: function, pattern: $FAIL, matches: lazy-constructor}
        - all:
            - has:
                field: arguments
                all:
                    - has: {matches: untagged-thunk, nthChild: {position: 1, reverse: true}}
                    - any:
                        - has: {nthChild: 3}
                        - has: {nthChild: 1, kind: 'arrow_function, function_expression'}
            - has: {field: function, pattern: $FAIL, matches: filter-constructor}
        - all:
            - has: {field: arguments, has: {kind: object, has: {matches: failure-member}}}
            - has: {field: function, pattern: $FAIL, matches: options-callee}
message: '`$FAIL` fails with `$ERROR`, an error built from text'
note: 'Fail with a `Data.TaggedError`, `Schema.TaggedError`, or `Data.taggedEnum` variant holding typed fields, or with the error the library types (`Effect.fromOption(<option>)` fails with `NoSuchElementError`), consumers then match `_tag` in place of text'
