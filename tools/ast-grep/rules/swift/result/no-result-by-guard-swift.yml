# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    third-level:
        matches: swift-nesting-level
        inside:
            matches: swift-nesting-level
            stopBy: {matches: swift-function-scope}
            inside: {matches: swift-nesting-level, stopBy: {matches: swift-function-scope}}
    deepened-tail:
        precedes: {kind: control_transfer_statement, has: {stopBy: end, matches: third-level}}
    deepened:
        any:
            - has: {kind: statements, has: {stopBy: end, matches: third-level}}
            - matches: deepened-tail
    leading:
        any:
            - inside: {kind: control_transfer_statement}
            - all:
                - nthChild: 1
                - inside: {matches: leading}
    plain-value:
        not:
            any:
                - kind: ternary_expression
                - has: {kind: &effect 'await_expression, try_expression', stopBy: {kind: lambda_literal}}
    plain:
        matches: plain-value
        not: {kind: *effect}
    plain-condition:
        all:
            - not: {has: {regex: '^,$'}}
            - not: {has: {field: condition, kind: 'value_binding_pattern, availability_condition'}}
            - not: {has: {field: condition, regex: '^case$'}}
            - has: {field: condition, matches: plain}
    bool-else:
        kind: control_transfer_statement
        regex: '^return(?-u:\b)'
        has: {field: result, matches: plain-value, not: {regex: '\n'}}
    bool-tail:
        kind: control_transfer_statement
        regex: '^return(?-u:\b)'
        has:
            field: result
            not: {any: [{kind: ternary_expression}, {regex: '\n'}]}
            any:
                - not: {has: {kind: *effect, stopBy: {kind: lambda_literal}}}
                - all:
                    - regex: '^(try\??|await)[\t-\r ]'
                    - not: {has: {kind: *effect, stopBy: {kind: lambda_literal}, not: {matches: leading}}}
    bool-guard:
        kind: guard_statement
        all:
            - matches: plain-condition
            - has: {kind: statements, has: {nthChild: 1, matches: bool-else}, not: {has: {nthChild: 2}}}
            - precedes: {matches: bool-tail}
    bool-if:
        kind: if_statement
        matches: plain-condition
        any:
            - all:
                - not: {has: {regex: '^else$'}}
                - not: {matches: deepened-tail}
                - has: {kind: statements, has: {nthChild: 1, matches: bool-tail}, not: {has: {nthChild: 2}}}
                - precedes: {matches: bool-else}
            - all:
                - not: {has: {kind: if_statement}}
                - has: {kind: statements, nthChild: {position: 1, ofRule: {kind: statements}}, has: {nthChild: 1, matches: bool-tail}, not: {has: {nthChild: 2}}}
                - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}, has: {nthChild: 1, matches: bool-else}, not: {has: {nthChild: 2}}}
    optional-binding:
        all:
            - not: {has: {regex: '^,$'}}
            - has: {field: condition, kind: value_binding_pattern, regex: '^let$'}
            - has: {field: bound_identifier, kind: simple_identifier, pattern: $BOUND}
            - not: {has: {follows: {regex: '^=$'}, any: [{kind: try_expression}, {has: {kind: try_expression, stopBy: {kind: lambda_literal}}}]}}
    else-return:
        kind: control_transfer_statement
        regex: '^return(?-u:\b)'
        has: {field: result, matches: plain, not: {regex: '\n'}}
    else-body:
        matches: {swift-single-statement: {first: {kind: control_transfer_statement}}}
        has: {nthChild: 1, matches: else-return}
    failure-return:
        kind: control_transfer_statement
        has: {field: result, matches: swift-failure-call}
    map-parameter:
        any:
            - follows: {kind: guard_statement, has: {field: bound_identifier, pattern: $_}}
            - inside: {kind: statements, inside: {kind: if_statement, has: {field: bound_identifier, pattern: $_}}}
    plain-try:
        kind: try_expression
        has: {kind: try_operator, regex: '^try$'}
    value-return:
        kind: control_transfer_statement
        regex: '^return(?-u:\b)'
        not: {has: {field: result, regex: '\n'}}
        any:
            - has: {field: result, kind: simple_identifier, pattern: $BOUND}
            - all:
                - has:
                    field: result
                    not: {has: {kind: await_expression, stopBy: {kind: lambda_literal}}}
                    any:
                        - matches: plain-try
                        - has: {matches: plain-try, stopBy: {kind: lambda_literal}}
                - matches: map-parameter
            - all:
                - has: {field: result, not: {any: [{kind: *effect}, {has: {kind: *effect, stopBy: {kind: lambda_literal}}}]}}
                - matches: map-parameter
    value-body:
        matches: {swift-single-statement: {first: {kind: control_transfer_statement}}}
        has: {nthChild: 1, matches: value-return}
    returned-value:
        kind: control_transfer_statement
        regex: '^return[\t-\r ]'
    returning-branch:
        kind: statements
        matches: {swift-single-statement: {first: {matches: returned-value, not: {regex: '(?-u:\b)else(?-u:\b)'}}}}
    returning-chain:
        kind: if_statement
        all:
            - has: {regex: '^else$'}
            - not: {has: {kind: availability_condition}}
            - not: {has: {kind: statements, not: {matches: returning-branch}}}
            - not: {has: {kind: if_statement, not: {matches: returning-chain}}}
    returning-entry:
        kind: switch_entry
        has:
            kind: statements
            matches:
                swift-single-statement:
                    first:
                        any:
                            - {matches: returned-value, not: {regex: '(?-u:\b)else(?-u:\b)'}}
                            - {kind: control_transfer_statement, regex: '^throw(?-u:\b)'}
    boolean-switch:
        kind: switch_statement
        all:
            - not: {has: {kind: switch_entry, nthChild: {position: 3, ofRule: {kind: switch_entry}}}}
            - not: {has: {kind: switch_entry, not: {has: {kind: statements, has: {kind: control_transfer_statement, has: {field: result, kind: boolean_literal}}}}}}
    returning-switch:
        kind: switch_statement
        all:
            - not: {has: {kind: switch_entry, not: {matches: returning-entry}}}
            - has: {kind: switch_entry, has: {kind: statements, has: {matches: returned-value}}}
            - not: {matches: boolean-switch}
            - not: {inside: {kind: 'property_declaration, function_declaration', stopBy: {kind: 'property_declaration, function_declaration, lambda_literal'}, matches: swiftui-view-builder}}
    condition-guard:
        kind: guard_statement
        not: {has: {kind: 'wildcard_pattern, availability_condition'}}
        all:
            - has:
                kind: statements
                matches:
                    swift-single-statement:
                        first: {matches: returned-value, not: {regex: '(?-u:\b)else(?-u:\b)'}, has: {field: result, pattern: $_}}
            - precedes: {matches: returned-value, has: {field: result, not: {regex: '\n'}}}
    condition-if:
        kind: if_statement
        all:
            - not: {has: {regex: '^else$'}}
            - not: {has: {kind: 'wildcard_pattern, availability_condition'}}
            - not: {matches: deepened-tail}
            - has: {kind: statements, matches: returning-branch}
            - precedes: {matches: returned-value, has: {field: result, pattern: $_}}
rule:
    all:
        - any:
            - matches: bool-guard
            - matches: bool-if
            - kind: guard_statement
              matches: optional-binding
              all:
                - has: {kind: statements, matches: else-body}
                - precedes: {matches: value-return}
            - kind: if_statement
              matches: optional-binding
              all:
                - not: {has: {regex: '^else$'}}
                - has: {kind: statements, matches: value-body}
                - precedes: {matches: else-return}
            - kind: if_statement
              matches: optional-binding
              all:
                - not: {has: {kind: if_statement}}
                - has: {kind: statements, nthChild: {position: 1, ofRule: {kind: statements}}, matches: value-body}
                - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}, matches: else-body}
            - matches: condition-guard
            - kind: if_statement
              matches: returning-chain
              not: {inside: {kind: if_statement}}
            - kind: switch_statement
              matches: returning-switch
            - matches: condition-if
        - not: {kind: guard_statement, matches: deepened}
        - not: {kind: if_statement, inside: {kind: if_statement}}
        - not:
            any:
                - matches: {swift-boolean-match: {matched: {kind: boolean_literal}, other: {kind: boolean_literal}}}
                - regex: '^(if|guard)[\t-\r ]+case[\t-\r ]+(let[\t-\r ]+)?\.success(?-u:\b)'
                - kind: if_statement
                  regex: '^if[\t-\r ]+case[\t-\r ]+(let[\t-\r ]+)?\.failure(?-u:\b)'
                  has: {kind: statements, nthChild: {position: 1, ofRule: {kind: statements}}, has: {nthChild: 1, matches: failure-return}}
                - matches: swift-result-bind-switch
                - kind: guard_statement
                  all: [{has: {kind: value_binding_pattern}}, {has: {kind: statements, has: {matches: failure-return}}}]
                - kind: if_statement
                  all:
                    - has: {kind: value_binding_pattern}
                    - any:
                        - precedes: {matches: failure-return}
                        - has: {kind: statements, nthChild: {position: 2, ofRule: {kind: statements}}, has: {matches: failure-return}}
message: 'Branch statements return each case where one expression selects the value'
note: 'Return one `<condition> ? <then> : <else>`, `<optional>.map { <value> in <expression> } ?? <else>`, or `if` or `switch` expression'
