# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-restated-default-argument
language: python
severity: error
rule:
    pattern: $ARG
    matches: python-restated-default-argument
message: '`$ARG` restates the documented default of its callee'
note: Omit the argument the owning API supplies, the rewrite `restated-default-argument-to-omitted` keeps comments and positional binding
