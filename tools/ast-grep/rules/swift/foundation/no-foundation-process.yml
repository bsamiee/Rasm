# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-foundation-process
language: swift
severity: error
rule:
    all:
        - pattern: $SITE
        - any:
            - pattern: Process()
            - pattern: Pipe()
            - kind: assignment
              has: {field: target, regex: '\.terminationHandler$'}
            - pattern: $P.waitUntilExit()
message: '`$SITE` runs the child through `Foundation.Process` with no session, process group, or teardown sequence'
note: 'Run the child through `Subprocess.run` of swift-subprocess with `platformOptions.createSession` and `platformOptions.teardownSequence` set, its run closure replaces the pipes, exit wait, and termination handler'
