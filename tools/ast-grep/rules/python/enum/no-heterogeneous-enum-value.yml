# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-heterogeneous-enum-value
language: python
severity: error
utils:
    enum-base:
        any:
            - matches: {python-member-use: {module: {regex: '^enum$'}, name: {regex: '^(Enum|IntEnum|StrEnum|Flag|IntFlag|ReprEnum)$'}}}
            - kind: identifier
              pattern: $BASE
              inside: {kind: module, stopBy: end, has: {kind: class_definition, all: [{has: {field: name, pattern: $BASE}}, {has: {field: superclasses, has: {matches: enum-base}}}]}}
    enum-class:
        kind: class_definition
        has: {field: superclasses, has: {matches: enum-base}}
    unpacking-init:
        kind: function_definition
        has: {field: name, regex: '^(__init__|__new__)$'}
    text:
        kind: string, concatenated_string
        not: {regex: '^[rRuU]?[bB]'}
    data:
        kind: string, concatenated_string
        regex: '^[rR]?[bB]'
    homogeneous:
        any:
            - not: {has: {pattern: $_, not: {matches: text}}}
            - not: {has: {pattern: $_, not: {matches: data}}}
            - not: {has: {pattern: $_, not: {kind: 'integer, unary_operator'}}}
            - not: {has: {pattern: $_, not: {kind: 'float, unary_operator'}}}
            - not: {has: {pattern: $_, not: {kind: 'integer, float, unary_operator'}}}
            - not: {has: {pattern: $_, not: {kind: 'tuple, list'}}}
            - not: {has: {pattern: $_, not: {kind: identifier}}}
            - not: {has: {pattern: $_, not: {kind: attribute}}}
            - not: {has: {pattern: $_, not: {kind: 'true, false'}}}
            - all:
                - has: {nthChild: 1, kind: call, has: {field: function, pattern: $CALLEE}}
                - not: {has: {pattern: $_, not: {kind: call, has: {field: function, pattern: $CALLEE}}}}
rule:
    kind: assignment
    pattern: $MEMBER
    all:
        - has: {field: left, kind: identifier, regex: '^[A-Z][A-Z0-9_]*$'}
        - has: {field: right, kind: 'tuple, list, expression_list', has: {nthChild: 2}, not: {matches: homogeneous}}
        - inside:
            kind: expression_statement
            inside:
                kind: block
                inside: {matches: enum-class}
                not: {has: {any: [{matches: unpacking-init}, {kind: decorated_definition, has: {matches: unpacking-init}}]}}
message: 'Member `$MEMBER` holds values of mixed kinds in one tuple read by position'
note: 'Declare one field per element and unpack them in `__init__(self, <a>, <b>)`'
