id: no-native-timer
valid:
    - 'import { setTimeout } from "node:timers\u002fother"; setTimeout(callback);'
    - 'import * as timers from "node:timers\u002fother"; timers.setTimeout(callback);'
    - 'import type * as timers from "node:timers"; timers.setTimeout(tick, 1);'
    - 'import timers from "node:timers"; timers.toString();'
    - 'import * as timers from "node:timers"; function run(timers) { timers.setTimeout(1); }'
    - 'import { setTimeout as delay } from "node:timers"; const setTimeout = compute; setTimeout(1);'
    - 'function timer(AbortSignal: { timeout(value: number): unknown }) { return AbortSignal.timeout(1); }'
    - 'import { setTimeout as delay } from "./services"; delay(1);'
    - 'import { scheduler } from "node:timers/promises"; scheduler.toString();'
    - 'import { scheduler as host } from "node:timers/promises"; declare const scheduler: { yield(): void }; scheduler.yield();'
    - "const waited = Effect.sleep('1 second');"
    - "const polled = Effect.repeat(poll, Schedule.spaced('1 second'));"
    - 'const yielded = Effect.yieldNow();'
    - 'const handle = scheduler.setTimeout(tick, 1000);'
    - 'const schedule = setTimeout;'
    - 'const signal = AbortSignal.any([first, second]);'
    - "const bounded = Effect.timeout(step, '1 second');"
    - 'const scheduler = { wait: compute }; scheduler.wait(1);'
    - 'import { scheduler } from "node:timers/promises"; const run = (scheduler) => scheduler.wait(1);'
    - 'import { scheduler } from "worker"; scheduler.yield();'
    - 'import type { scheduler } from "node:timers/promises"; scheduler.wait(1);'
    - 'function run(setTimeout) { setTimeout(1); }'
    - 'const setTimeout = compute; setTimeout(1);'
    - 'import { type scheduler } from "node:timers/promises"; scheduler.wait(1);'
    - 'import { other as scheduler } from "node:timers/promises"; scheduler.wait(1);'
    - 'import { setTimeout } from "./custom"; setTimeout(1);'
    - 'import { schedule as setTimeout } from "./custom"; setTimeout(1);'
    - 'import setTimeout from "./custom"; setTimeout(1);'
    - 'import { nextTick } from "./queue"; nextTick(tick);'
    - 'import { cwd as nextTick } from "node:process"; nextTick();'
invalid:
    - 'import { setTimeout as delay /* local */ } from "node:timers/promises"; await delay(1);'
    - 'import { setTimeout as delay } from "node:timers/promises"; await delay(1);'
    - 'import * as timers from "node:timers"; timers.setTimeout(tick, 1);'
    - 'import timers from "node:timers/promises"; await timers.scheduler.wait(1);'
    - 'import { setTimeout as custom } from "./custom"; setTimeout(tick, 1);'
    - 'import { setTimeout } from "node:timers"; setTimeout(tick, 1);'
    - 'import { setTimeout } from "timers/promises"; await setTimeout(1);'
    - 'import { schedule as custom } from "./custom"; setTimeout(tick, 1);'
    - 'import { scheduler } from "node:timers/promises"; await scheduler.wait(1000);'
    - 'import { scheduler as host } from "timers/promises"; await host.yield();'
    - 'const signal = AbortSignal.timeout(1000);'
    - 'const handle = setTimeout(tick, 1000);'
    - 'const handle = setInterval(tick, 1000);'
    - 'const handle = setImmediate(tick);'
    - 'queueMicrotask(tick);'
    - 'clearTimeout(handle);'
    - 'clearInterval(handle);'
    - 'clearImmediate(handle);'
    - 'const handle = globalThis.setTimeout(tick, 1000);'
    - 'const signal = globalThis.AbortSignal.timeout(1000);'
    - 'process.nextTick(tick);'
    - 'import * as timers from "node:timers/promises"; await timers.setTimeout(1);'
    - 'import { nextTick } from "node:process"; nextTick(tick);'
