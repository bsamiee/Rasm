    "nanoarrow",                                                                  # Arrow C Data Interface interop
    "pgvector",                                                                   # pgvector, halfvec, and sparsevec adapters for psycopg and NumPy arrays
    "psycopg[binary,pool]",                                                       # PostgreSQL driver with sync and async APIs, pipeline mode, COPY, and connection pools
    "pyarrow",                                                                    # Arrow C++ bridge
