# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-decision-reason
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
utils:
    unreadable-reason:
        any:
            - {kind: string, not: {has: {any: [{kind: escape_sequence}, {kind: string_fragment, regex: \S}]}}}
            - kind: template_string
              not:
                has: {any: [{kind: template_substitution}, {kind: escape_sequence}, {kind: string_fragment, regex: \S}]}
    hook-return:
        any:
            - inside:
                kind: parenthesized_expression, as_expression, satisfies_expression, non_null_expression
                matches: hook-return
            - any:
                - {inside: {kind: ternary_expression, field: consequence, matches: hook-return}}
                - {inside: {kind: ternary_expression, field: alternative, matches: hook-return}}
            - inside:
                kind: return_statement
                inside: {matches: claude-code-hook, stopBy: {matches: syntax-function-boundary}}
            - {inside: {kind: arrow_function, field: body, matches: claude-code-hook}}
rule:
    any:
        - kind: pair
          all:
            - {has: {field: key, regex: '^[''"]?(deny|drop)[''"]?$'}}
            - {has: {field: value, pattern: $REASON, matches: unreadable-reason}}
            - {inside: {kind: object, matches: hook-return}}
        - kind: call_expression
          all:
            - {has: {field: function, kind: identifier, regex: ^(deny|drop)$}}
            - {has: {field: arguments, has: {nthChild: 1, pattern: $REASON, matches: unreadable-reason}}}
message: The decision reason `$REASON` is blank
note: State the decision and the corrective action in the reason
labels: {REASON: {style: primary, message: The reason value}}
