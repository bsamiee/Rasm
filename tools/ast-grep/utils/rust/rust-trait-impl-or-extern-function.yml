# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-trait-impl-or-extern-function
language: rustlang
rule:
    kind: 'function_item, function_signature_item'
    any:
        - inside: {kind: declaration_list, inside: {kind: 'impl_item, foreign_mod_item', any: [{kind: foreign_mod_item}, {has: {field: trait, pattern: $_}}]}}
        - has: {kind: function_modifiers, has: {kind: extern_modifier}}
        - matches: {rust-attributed: {attribute: {regex: '^#\[\p{Pattern_White_Space}*(unsafe\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*)?(no_mangle|export_name)(?-u:\b)'}}}
