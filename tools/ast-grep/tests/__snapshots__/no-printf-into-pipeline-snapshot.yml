    - source: printf '%s\n' "$out" | head -1
      style: primary
      start: 8
      end: 38
    - source: printf '%s\n' "$out"
      style: secondary
      start: 8
      end: 28
    - source: head -1
      style: secondary
      start: 31
      end: 38
  ? |
    if printf '%s\n' "$x" | rg -q FAIL; then exit 1; fi
  : fixed: |
      if rg -q FAIL <<<"$x"; then exit 1; fi
