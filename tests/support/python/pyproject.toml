# --- [PROJECT] --------------------------------------------------------------------------

[project]
name              = "rasm-testing"
version           = "0.1.0"
description       = "Outcomes a test step settles and a pytest plugin of HTTP servers a test hosts on a loopback port"
license           = "MIT"
classifiers       = ["Framework :: Pytest", "Intended Audience :: Developers", "Operating System :: OS Independent", "Private :: Do Not Upload", "Topic :: Software Development :: Testing"]
requires-python   = ">=3.13"
import-names      = ["rasm.testing"]
import-namespaces = ["rasm"]

dependencies = [
    "expression",    # Outcome a test step settles
    "pytest",        # Fixtures, collection hook, markers, and test failure
    "pytest-socket", # `enable_socket` marker a plugin adds to each test reaching a server
    "rasm-records",  # Fault results and their report text
]

[project.optional-dependencies]
hosting = [
    "anyio",     # Event loop thread a test hosts servers on, and its clock on each received request
    "hypercorn", # HTTP/1.1 and h2c server answering from a function of the test on a loopback port
    "msgspec",   # Request and answer records of a hosted server
]

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/tests/support/python"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rasm.testing"
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../ruff.toml" # Ruff reads this manifest's `requires-python` through its own table
