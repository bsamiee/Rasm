id: no-forwarding-shell-function
valid:
    - first() { handle "$1"; }
    - joined() { handle "$*"; }
    - defaulted() { handle "${1:-x}"; }
    - reordered() { handle "$2" "$1"; }
    - configured() { handle -q "$@"; }
    - appended() { handle "$@" --end; }
    - split() { handle $@; }
    - cleanup() { rm -rf "$tmp"; }
    - last() { handle "$?"; }
    - stop() { server_stop --now; }
    - quiet() { handle "$@" >/dev/null; }
    - replace() { exec handle "$@"; }
    - run() { "$@"; }
    - dynamic() { "$handler" "$@"; }
    - run() { handle "$@"; ran=1; }
    - ids() { query "$@" | sort; }
    - guarded() { handle "$@" || exit 1; }
    - forward() { handle "$@" & }
    - forward() { handle -- "$@"; }
    - forward() ( handle "$@" )
    - quiet() { handle "$@"; } >/dev/null
    - dynamic() { $handler "$@"; }
    - run() { sudo handle "$@"; }
    - run() { env handle "$@"; }
    - run() { time handle "$@"; }
    - run() { command -v handle "$@"; }
    - run() { command "$handler" "$@"; }
invalid:
    - forward() { handle "$@"; }
    - forward() { handle "${@}"; }
    - function forward { handle "$@"; }
    - function forward() { handle "$@"; }
    - forward() { ./handle "$@"; }
    - forward() { /usr/bin/handle "$@"; }
    - forward() { handle.sh "$@"; }
    - |
      forward() {
          # The complete argument list
          handle "$@"
      }
    - run() { command handle "$@"; }
    - run() { builtin handle "$@"; }
    - run() { command -p -- handle "$@"; }
    - run() { command -- ./handle.sh "$@"; }
