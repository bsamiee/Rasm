# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    empty-string:
        any:
            - kind: string
              not: {has: {kind: string_fragment}}
            - kind: template_string
              not: {has: {kind: 'string_fragment, template_substitution'}}
    indexed-element:
        pattern: $ELEMENT
        any:
            - kind: subscript_expression
            - kind: call_expression
              has: {field: function, kind: member_expression, has: {field: property, regex: '^(at|find|findLast|pop|shift|get)$'}}
    option-lookup:
        kind: call_expression
        pattern: $ELEMENT
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(head|last|get|findFirst|findLast)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)(Array|Chunk|HashMap|Iterable|Record)$'}}}}
    empty-fallback:
        kind: arrow_function
        has: {field: body, matches: empty-string}
    get-or-else:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^getOrElse$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Option$'}}}}
    piped-default:
        matches: get-or-else
        has: {field: arguments, has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, matches: empty-fallback}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
    concatenation:
        any:
            - kind: binary_expression
              has: {field: operator, regex: '^\+$'}
            - kind: template_substitution
    concatenated:
        inside: {matches: concatenation, stopBy: {not: {kind: parenthesized_expression}}}
rule:
    any:
        - kind: binary_expression
          all:
            - has: {field: left, matches: indexed-element}
            - has: {field: operator, regex: '^(\?\?|\|\|)$'}
            - has: {field: right, matches: empty-string}
            - not: {matches: concatenated}
        - kind: 'assignment_pattern, object_assignment_pattern'
          all:
            - inside: {kind: 'array_pattern, object_pattern, pair_pattern'}
            - has: {field: left, pattern: $ELEMENT}
            - has: {field: right, matches: empty-string}
            - not: {inside: {kind: 'required_parameter, optional_parameter', stopBy: {not: {kind: 'array_pattern, object_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, rest_pattern'}}}}
        - kind: call_expression
          all:
            - matches: get-or-else
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: option-lookup}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: empty-fallback}}], not: {has: {nthChild: {position: 3, ofRule: *code}}}}
            - not: {matches: concatenated}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^pipe$'}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: option-lookup}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: piped-default}}], not: {has: {nthChild: {position: 3, ofRule: *code}}}}
            - not: {matches: concatenated}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: option-lookup}}]}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, matches: piped-default}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
            - not: {matches: concatenated}
transform:
    HEAD: {replace: {source: $ELEMENT, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$HEAD` defaults an absent element to an empty string'
note: 'Keep an absent element as `undefined` in its type or as the `Option` its lookup returns (`Array.head`, `Record.get`)'
