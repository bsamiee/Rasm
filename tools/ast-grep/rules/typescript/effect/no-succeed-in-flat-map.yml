# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-succeed-in-flat-map
language: tsx
severity: error
utils:
    lifted-body:
        kind: call_expression, member_expression
        any:
            - has:
                field: function
                pattern: $M.succeed
                has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?(Effect|Micro|STM|Stream|Channel|Sink|Exit)$"}}}}
            - has:
                field: function
                pattern: $M.some
                has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?Option$"}}}}
            - has:
                field: function
                pattern: $M.right
                has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?Either$"}}}}
            - pattern: $M.void
              has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?(Effect|Micro|STM|Channel|Exit|Option)$"}}}}
    # The callback whose body is the bound module's void, the module test sits in lifted-body
    void-callback:
        kind: arrow_function, function_expression
        has:
            field: body
            any:
                - pattern: $M.void
                - kind: statement_block
                  has: {kind: return_statement, has: {pattern: $M.void}}
    lifting-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: "^async$"}}
        has:
            field: body
            any:
                - matches: lifted-body
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: lifted-body}}
                  not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, pattern: $M.$F}
        - has:
            field: arguments
            has:
                matches: lifting-callback
                nthChild: {position: 1, reverse: true}
constraints:
    F: {regex: "^(flatMap|andThen)$"}
rewriters:
    # The return annotation names the carrier, inference states the mapped value's type
    - id: return-type
      rule: {kind: type_annotation, inside: {matches: lifting-callback, field: return_type}}
      fix: ''
    # The outermost constructor of the body goes and a nested one stays in the value, an object literal keeps its parentheses
    - id: unlift-object
      rule:
        matches: lifted-body
        any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]
        has: {field: arguments, has: {kind: object}}
      fix: ($V)
    - id: unlift
      rule:
        matches: lifted-body
        any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]
      fix: $V
    # A discarded result is asVoid, and a comment in the dropped callback keeps the call as written
    - id: void-first
      rule:
        pattern: '$M.$_($SELF, $H)'
        has: {field: arguments, has: {pattern: $H, matches: void-callback, not: {has: {kind: comment, stopBy: end}}}}
      fix: $M.asVoid($SELF)
    - id: void-last
      rule:
        pattern: $M.$_($H)
        has: {field: arguments, has: {pattern: $H, matches: void-callback, not: {has: {kind: comment, stopBy: end}}}}
      fix: $M.asVoid
    # A void callback with a comment reaches neither the void nor the map rewriter, the call stays as written
    - id: map-first
      rule:
        pattern: '$M.$_($SELF, $H)'
        has: {field: arguments, has: {pattern: $H, not: {matches: void-callback}}}
      transform:
        BODY: rewrite($H, rewriters=[return-type, unlift-object, unlift])
      fix: $M.map($SELF, $BODY)
    - id: map-last
      rule:
        pattern: $M.$_($H)
        has: {field: arguments, has: {pattern: $H, not: {matches: void-callback}}}
      transform:
        BODY: rewrite($H, rewriters=[return-type, unlift-object, unlift])
      fix: $M.map($BODY)
transform:
    MAPPED: rewrite($CALL, rewriters=[void-first, void-last, map-first, map-last])
fix: $MAPPED
message: The bind callback only lifts its result back into the same carrier
note: Map the value through the carrier's map, or asVoid for a discarded result, keeping the callback's evaluation time and allocations
labels: {CALL: {style: primary}}
