# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-article-summary-javascript
language: javascript
severity: error
rule:
    kind: comment
    regex: '^/\*\*\s*(\*\s*)?(The|A|An)\s+\S'
message: 'Doc comment summary opens with an article'
note: 'Open summary with the noun it names or verb it performs'
