analytics             = [
    "cubed",                                                                      # Bounded-memory distributed arrays
    "daft!=0.8.0rc1",                                                             # Distributed query engine, 0.8.0rc1 requires Python below 3.15
    "dask",                                                                       # Out-of-core arrays and dataframes
    "dataframely",                                                                # Declarative Polars column rules that partition failures
