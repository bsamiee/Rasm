                    |possibly|typically|generally|usually|often|in\ some\ cases|in\ most\ cases|where\ appropriate
                    |a\ number\ of|various|several|multiple|the\ two|the\ three
                    |since\ version|as\ of|in\ version|upgrade\ from|legacy|new\ and\ current|migrate
                    |such\ as|whose|and/or
                    |should|might|could|would
                    |ship(?:ped|ping|s)?|seat(?:ed|s)?|roster|admission|blessed|mint(?:ed)?|strat(?:a|um)|substrate|backbone
