# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    process-environment:
        kind: navigation_expression
        regex: '^((Foundation(\.|::))?ProcessInfo\.processInfo)\.environment$'
    reshaped:
        kind: call_expression
        has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '\.(hasPrefix|hasSuffix|starts|lowercased|uppercased|replacing|trimmingCharacters|mapValues|compactMapValues)$'}
rule:
    kind: call_expression
    pattern: $SITE
    all:
        - has: {kind: 'simple_identifier, identifier, navigation_expression, prefix_expression', regex: '^((Subprocess(\.|::))?Environment)?\.custom$'}
        - any:
            - has: {stopBy: end, matches: process-environment}
            - has:
                stopBy: end
                kind: simple_identifier
                pattern: $COPY
                inside:
                    stopBy: end
                    kind: statements
                    has:
                        kind: property_declaration
                        all:
                            - has: {kind: pattern, has: {field: bound_identifier, pattern: $COPY}}
                            - has: {stopBy: end, matches: process-environment}
                            - not: {has: {stopBy: end, matches: reshaped}}
        - not: {has: {stopBy: end, matches: reshaped}}
message: '`$SITE` copies `ProcessInfo.processInfo.environment` into a custom environment'
note: 'Pass `Environment.inherit`, or `.inherit.updating(<changes>)` with a `nil` value for each removed key'
