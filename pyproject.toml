"httpx".msg          = "Use httpx2.Client or httpx2.AsyncClient"
"requests".msg       = "Use httpx2.Client or httpx2.AsyncClient"
"urllib.request".msg = "Use httpx2.Client or httpx2.AsyncClient"
"urllib3".msg        = "Use httpx2.Client or httpx2.AsyncClient"

# --- [JSON]

"json.JSONDecoder".msg         = "Use msgspec.json.decode with type="
"json.JSONEncoder".msg         = "Use msgspec.json.encode"
"json.decoder.JSONDecoder".msg = "Use msgspec.json.decode with type="
"json.dump".msg                = "Use msgspec.json.encode"
"json.dumps".msg               = "Use msgspec.json.encode"
"json.encoder.JSONEncoder".msg = "Use msgspec.json.encode"
"json.load".msg                = "Use msgspec.json.decode with type="
"json.loads".msg               = "Use msgspec.json.decode with type="

# --- [LOGGING]

"logging.Logger".msg                     = "Use structlog.typing.FilteringBoundLogger"
"logging.LoggerAdapter".msg              = "Use structlog.get_logger(__name__).bind"
"logging.RootLogger".msg                 = "Use structlog.typing.FilteringBoundLogger"
"logging.addLevelName".msg               = "Call structlog.configure once at composition root"
"logging.basicConfig".msg                = "Call structlog.configure once at composition root"
"logging.captureWarnings".msg            = "Call structlog.configure once at composition root"
"logging.config".msg                     = "Call structlog.configure once at composition root"
"logging.critical".msg                   = "Use structlog.get_logger(__name__)"
"logging.debug".msg                      = "Use structlog.get_logger(__name__)"
"logging.disable".msg                    = "Call structlog.configure once at composition root"
"logging.error".msg                      = "Use structlog.get_logger(__name__)"
"logging.exception".msg                  = "Use structlog.get_logger(__name__)"
"logging.fatal".msg                      = "Use structlog.get_logger(__name__)"
"logging.getLogRecordFactory".msg        = "Call structlog.configure once at composition root"
"logging.getLogger".msg                  = "Use structlog.get_logger(__name__)"
"logging.getLoggerClass".msg             = "Call structlog.configure once at composition root"
"logging.info".msg                       = "Use structlog.get_logger(__name__)"
"logging.lastResort".msg                 = "Call structlog.configure once at composition root"
"logging.log".msg                        = "Use structlog.get_logger(__name__)"
"logging.raiseExceptions".msg            = "Call structlog.configure once at composition root"
"logging.root".msg                       = "Use structlog.get_logger(__name__)"
"logging.setLogRecordFactory".msg        = "Call structlog.configure once at composition root"
"logging.setLoggerClass".msg             = "Call structlog.configure once at composition root"
"logging.shutdown".msg                   = "Delete call, atexit runs it"
"logging.warn".msg                       = "Use structlog.get_logger(__name__)"
"logging.warning".msg                    = "Use structlog.get_logger(__name__)"
"structlog.configure".msg                = "Configure structlog once in the program entry module"
"structlog.configure_once".msg           = "Configure structlog once in the program entry module"
"structlog.reset_defaults".msg           = "Configure structlog once in the program entry module"
"structlog.stdlib.recreate_defaults".msg = "Configure structlog once in the program entry module"

# --- [RECORDS]

"collections.namedtuple".msg       = "Use frozen msgspec.Struct"
"dataclasses.make_dataclass".msg   = "Use frozen msgspec.Struct"
"typing.NamedTuple".msg            = "Use frozen msgspec.Struct"
"typing_extensions.NamedTuple".msg = "Use frozen msgspec.Struct"

# --- [RESULTS]

"contextlib.suppress".msg    = "Return expression.Result"
"warnings.warn".msg          = "Return expression.Result"
"warnings.warn_explicit".msg = "Return expression.Result"

# --- [TRACEBACKS]

"sys.__excepthook__".msg        = "Log exception with exc_info="
"threading.__excepthook__".msg  = "Log exception with exc_info="
"traceback.print_exc".msg       = "Call logger.exception() in handler"
"traceback.print_exception".msg = "Log exception with exc_info="
"traceback.print_last".msg      = "Log exception with exc_info="
"traceback.print_list".msg      = "Log captured exception with exc_info="
"traceback.print_stack".msg     = "Log with stack_info=True"
"traceback.print_tb".msg        = "Log exception with exc_info="

# --- [TYPING]

"__future__".msg             = "Delete the import"
"operator.attrgetter".msg    = "Use lambda, typeshed types result as Any"
"operator.itemgetter".msg    = "Use lambda, typeshed types result as Any"
"operator.methodcaller".msg  = "Use lambda, typeshed types result as Any"
"typing.cast".msg            = "Type value at source or narrow with TypeIs"
"typing_extensions.cast".msg = "Type value at source or narrow with TypeIs"

# --- [TY] -------------------------------------------------------------------------------

[tool.ty]
analysis    = { allowed-unresolved-imports = ["uharfbuzz.**"] }                                           # uharfbuzz re-exports its compiled `_harfbuzz` module, which ships no stub
environment = { python-platform = "all" }
rules       = { all = "error", unsound-return = "ignore", unused-type-ignore-comment = "ignore" }         # mypy `no-any-return` owns `Any` returned through a typed boundary, `unused-ignore` unused `type: ignore` comments
src         = { exclude = ["libs/python/blender", "products/apps/blender", "tests/libs/python/blender"] } # 3.13 uv roots `libs/python/blender` and `products/apps/blender/darkroom`, each checked through its own `[tool.ty]`; ty opens one project per root and finds no nested one

# --- [VULTURE] --------------------------------------------------------------------------

[tool.vulture]
exclude           = [".venv/"]       # Third-party packages of a virtual environment a member folder holds
ignore_decorators = ["@*.register"]  # `functools.singledispatch` calls registered handlers through its dispatcher
ignore_names      = ["[!_]*", "_*_"] # Public names are API, `_x_` and `__x__` names are hooks the runtime calls

# --- [COVERAGE] -------------------------------------------------------------------------

[tool.coverage]
report = { show_missing = true, skip_covered = true, exclude_also = ["assert_never\\("] }
run    = { branch = true, parallel = true, relative_files = true, data_file = ".artifacts/coverage/.coverage" }

# --- [PYTEST] ---------------------------------------------------------------------------

[tool.pytest]
addopts                   = [
    "--disable-plugin-autoload",                # Loads the plugins named below alone, never every `pytest11` entry point the environment holds
    "-p",
    "hypothesispytest",
    "-p",
    "pytest_cov",
    "-p",
    "pytester",                                 # Inner pytest runs for the suites of pytest plugins
    "-p",
    "randomly",
    "-p",
    "rasm.testing.hosting",                     # Hosted HTTP servers of `tests/support/python`
    "-p",
    "rasm.testing.sqlite",                      # SQLite database of `tests/support/python`
    "-p",
    "pytest_socket",                            # Named by its module, the entry point name `socket` being the standard library module the hosting plugin imports first
    "-p",
    "timeout",
    "--tb=short",
    "--import-mode=importlib",
    "--disable-socket",
    "--allow-unix-socket",
]
cache_dir                 = "$PYTEST_CACHE_DIR"
collect_imported_tests    = false
empty_parameter_set_mark  = "fail_at_collect"
filterwarnings            = ["error"]
strict                    = true
timeout                   = "30"
tmp_path_retention_policy = "failed"            # Keeps the folders of failed tests alone, as the SQLite fixture keeps the file of a failed test

# --- [TOMBI] ----------------------------------------------------------------------------

[tool.tombi.files]
exclude = [".config/mise/locks/**", "assets/**"]

[tool.tombi.format.rules]
indent-width                    = 4
key-value-equals-sign-alignment = true
trailing-comment-alignment      = true
trailing-comment-space-width    = 1

[tool.tombi.extensions."tombi-toml/cargo".lsp.inlay-hint.default-features]
enabled = false

[tool.tombi.extensions."tombi-toml/pyproject".lsp.inlay-hint.dependency-version]
enabled = false

[tool.tombi.schema.format.rules]
table-keys-order.enabled   = false
array-values-order.enabled = false

[[tool.tombi.schemas]]
path    = "https://www.schemastore.org/cargo.json" # Bundled copy lacks the artifact dependency fields SchemaStore holds
include = ["**/Cargo.toml"]

[[tool.tombi.schemas]]
path    = "https://mise.jdx.dev/schema/mise.json"
include = [".config/mise.*.toml"]
