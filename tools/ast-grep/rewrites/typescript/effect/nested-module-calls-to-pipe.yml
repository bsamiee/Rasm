# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: nested-module-calls-to-pipe
language: tsx
severity: off
utils:
    module-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: {effect-module-reference: {module: {kind: identifier}}}}
    step:
        all:
            - matches: module-call
            - matches: effect-pipe-step
            - not: {has: {field: function, has: {field: object, matches: {effect-module-reference: {module: {regex: "^(effect/)?Schema$"}}}}}}
    unary-step:
        matches: step
        has:
            field: function
            has:
                field: property
                regex: "^(flatten|fromIterable|orDie|scoped|asVoid|flip|either|option|exit|cached|forever|fork|interruptible|uninterruptible|ignore|compact|reverse|dedupe|sandbox)$"
    data-first-step:
        matches: step
        has:
            field: arguments
            has: {nthChild: 1, matches: module-call}
        any:
            - matches: unary-step
            - has: {field: arguments, has: {nthChild: 2}}
    pipe-import:
        kind: import_statement
        all:
            - has: {field: source, regex: '^["'']effect["'']$'}
            - has: {kind: import_specifier, has: {field: name, regex: '^pipe$'}, not: {has: {field: alias, pattern: $_}}, stopBy: end}
rule:
    pattern: $CALL
    all:
        - matches: data-first-step
        - has:
            field: arguments
            has:
                nthChild: 1
                matches: data-first-step
                has: {field: arguments, has: {nthChild: 1, matches: data-first-step}}
        - not:
            all:
                - nthChild: 1
                - inside: {kind: arguments, inside: {matches: data-first-step}}
        - not: {has: {kind: comment, stopBy: end}}
        - not: {has: {kind: type_arguments, stopBy: end}}
        - inside: {kind: program, stopBy: end, has: {matches: pipe-import}}
rewriters:
    - id: unary
      rule:
        matches: unary-step
        pattern: $M.$OP($FIRST)
      transform:
        INNER: rewrite($FIRST, rewriters=[unary, steps, unary-head, head])
      fix: $INNER, $M.$OP
    - id: steps
      rule:
        matches: data-first-step
        pattern: '$M.$OP($FIRST, $$$REST)'
      transform:
        INNER: rewrite($FIRST, rewriters=[unary, steps, unary-head, head])
      fix: $INNER, $M.$OP($$$REST)
    - id: unary-head
      rule:
        matches: unary-step
        pattern: $M.$OP($FIRST)
      fix: $FIRST, $M.$OP
    - id: head
      rule:
        matches: step
        pattern: '$M.$OP($FIRST, $$$REST)'
      fix: $FIRST, $M.$OP($$$REST)
transform:
    STEPS: rewrite($CALL, rewriters=[unary, steps, unary-head, head])
fix: pipe($STEPS)
message: Module calls nest four deep as data-first arguments and read from the inside out
note: Pipe the composition through each operation in evaluation order, `pipe(value, Array.map(project), Array.flatten)`
