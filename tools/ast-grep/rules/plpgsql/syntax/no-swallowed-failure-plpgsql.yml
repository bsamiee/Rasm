# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: plpgsql
severity: error
rule:
    kind: proc_exception
    pattern: $HANDLER
    has: {field: when, has: {kind: proc_condition, regex: '^(?:(?i:others)|"others")$'}}
    not:
        has:
            field: then
            has:
                kind: proc_stmt
                nthChild: {position: 1, reverse: true, ofRule: {kind: proc_stmt}}
                has: {matches: plpgsql-error-raise}
transform:
    HEAD: {replace: {source: $HANDLER, replace: '(?si)[\t\n\x0B\f\r ]+then.*$', by: ''}}
message: '`$HEAD` catches every condition and raises none'
note: 'Name the conditions the handler answers, and end a `WHEN OTHERS` handler in `RAISE` after its cleanup'
