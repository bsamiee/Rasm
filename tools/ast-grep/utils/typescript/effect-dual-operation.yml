                    regex: |-
                        (?x)^(buildWithMemoMap|buildWithScope|catch|catchCause|catchTag|flatMap|merge|provide|provideMerge|tap|tapCause|tapError
                        |updateService)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Logger$'}, member: {regex: '^(batched|map|toFile)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)LogLevel$'}
                member:
                    regex: |-
                        (?x)^(isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Match$'}, member: {regex: '^(valueTags)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Metric$'}
                member:
                    regex: |-
                        (?x)^(mapInput|modify|update|withAttributes|withConstantInput)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Model$'}, member: {regex: '^(extract|fieldEvolve)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)MutableHashMap$'}, member: {regex: '^(forEach|get|has|modify|modifyAt|remove|set)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)MutableHashSet$'}, member: {regex: '^(add|has|remove)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)MutableRef$'}
                member:
                    regex: |-
                        (?x)^(compareAndSet|getAndSet|getAndUpdate|set|setAndGet|update|updateAndGet)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Ndjson$'}, member: {regex: '^(duplex|duplexSchema|duplexSchemaString|duplexString)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)NetAddress$'}, member: {regex: '^(isFamily|match)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Number$'}
                member:
                    regex: |-
                        (?x)^(between|clamp|divide|divideUnsafe|isGreaterThan|isGreaterThanOrEqualTo|isLessThan|isLessThanOrEqualTo|max|min|multiply
                        |remainder|round|subtract|sum)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Optic$'}
                member:
                    regex: |-
                        (?x)^(get|getAll|getResult|modify|modifyAll|replace|replaceResult|set)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Option$'}
                member:
                    regex: |-
                        (?x)^(andThen|as|bind|bindTo|composeK|contains|exists|filter|filterMap|flatMap|flatMapNullishOr|getOrElse|getOrThrowWith|let
                        |liftPredicate|map|match|orElse|orElseResult|orElseSome|partitionMap|product|productMany|reduceCompact|tap|zipLeft
                        |zipRight|zipWith)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)OtelTracer$'}, member: {regex: '^(withSpanContext)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)PartitionedSemaphore$'}, member: {regex: '^(release|take)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Pool$'}, member: {regex: '^(invalidate|reserve|use)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Predicate$'}
                member:
                    regex: |-
                        (?x)^(and|compose|eqv|hasProperty|implies|isTagged|isTupleOf|isTupleOfAtLeast|mapInput|nand|nor|or|xor)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Prompt$'}
                member:
                    regex: |-
                        (?x)^(appendSystem|concat|flatMap|map|prependSystem|setSystem)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)PubSub$'}
                member:
                    regex: |-
                        (?x)^(end|endUnsafe|publish|publishAll|publishUnsafe|takeBetween|takeUpTo)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Pull$'}, member: {regex: '^(catchDone|matchEffect)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Queue$'}, member: {regex: '^(fail|failCause|into|offer|offerAll|takeBetween|takeN)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Random$'}, member: {regex: '^(withSeed)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)RcMap$'}, member: {regex: '^(get|getOption|has|invalidate|touch)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Reactivity$'}, member: {regex: '^(mutation|query|stream)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Record$'}
                member:
                    regex: |-
                        (?x)^(collect|difference|every|filter|filterMap|findFirst|fromIterableBy|fromIterableWith|get|has|intersection|isSubrecord
                        |map|mapEntries|mapKeys|modify|partition|pop|reduce|remove|replace|set|some|union)$
        - matches:
