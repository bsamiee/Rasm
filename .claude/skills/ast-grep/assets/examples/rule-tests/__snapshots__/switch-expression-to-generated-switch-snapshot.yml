id: switch-expression-to-generated-switch
snapshots:
  ? |-
    public static class S {
        public static Fin<Outcome> Dispatch(Request request, Ledger ledger) =>
            request switch {
                Request.Open o => ledger.Open(o.Code),
                Request.Amend a => ledger.Amend(a.Code, a.Delta),
                Request.Close c => ledger.Close(c.Code),
            };
    }
  : fixed: |-
      public static class S {
          public static Fin<Outcome> Dispatch(Request request, Ledger ledger) =>
              request.Switch(open: static o => ledger.Open(o.Code), amend: static a => ledger.Amend(a.Code, a.Delta), close: static c => ledger.Close(c.Code));
      }
