# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    option-module:
        kind: identifier
        pattern: $M
        matches: {effect-module: {name: {regex: '(?-u:\b)Option$'}}}
    result-module:
        kind: identifier
        pattern: $M
        matches: {effect-module: {name: {regex: '(?-u:\b)Result$'}}}
    one-argument:
        has: {field: arguments, all: [{has: {nthChild: 1, pattern: $V}}, {not: {has: {nthChild: 2}}}]}
    option-lifted:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^some$'}}, {has: {field: object, matches: option-module}}]}
            - matches: one-argument
    option-empty:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $M}}, {has: {field: property, regex: '^none$'}}]}
            - has: {field: arguments, not: {has: {nthChild: 1}}}
    result-lifted:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^succeed$'}}, {has: {field: object, matches: result-module}}]}
            - matches: one-argument
    result-empty:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $M}}, {has: {field: property, regex: '^fail$'}}]}
            - has: {field: arguments, all: [{has: {nthChild: 1}}, {not: {has: {nthChild: 2}}}]}
    case-lifted:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(some|succeed)$'}}, {has: {field: object, any: [{matches: option-module}, {matches: result-module}]}}]}
            - matches: one-argument
            - has: {field: arguments, has: {nthChild: 1, has: {stopBy: end, pattern: $ROOT}}}
    tested:
        any:
            - pattern: $V
            - has: {stopBy: end, pattern: $V}
    failing-arm:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(fail|failSync)$'}
                - has: {field: object, kind: identifier, pattern: $M, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
    terminal-member:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(fail|failSync|failCause|failCauseSync|die|interrupt)$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
    terminal-arm:
        any:
            - kind: call_expression
              has: {field: function, matches: terminal-member}
            - matches: terminal-member
    result-failing:
        any:
            - kind: call_expression
              has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^fail$'}}, {has: {field: object, matches: result-module}}]}
            - kind: member_expression
              all: [{has: {field: property, regex: '^failVoid$'}}, {has: {field: object, matches: result-module}}]
    failing-result:
        any: [{matches: terminal-arm}, {matches: result-failing}]
    failing-declaration:
        kind: variable_declarator
        all:
            - has: {field: name, kind: identifier, pattern: $FAILER}
            - has: {field: value, kind: arrow_function, has: {field: body, matches: failing-result}}
    refused-arm:
        kind: arrow_function
        has:
            field: body
            any:
                - matches: failing-result
                - kind: call_expression
                  all:
                    - has: {field: function, kind: identifier, pattern: $FAILER}
                    - inside: {kind: program, stopBy: end, has: {kind: lexical_declaration, has: {matches: failing-declaration}}}
    succeeded-arm:
        kind: arrow_function
        has:
            field: body
            kind: call_expression
            all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^succeed$'}}, {has: {field: object, kind: identifier, pattern: $M, matches: {effect-module: {name: {regex: '(?-u:\b)(Effect|Result)$'}}}}}]}
                - has: {field: arguments, not: {has: {nthChild: 2}}}
    discriminant-test:
        kind: binary_expression
        any:
            - pattern: $_.kind === $_
            - pattern: $_.kind !== $_
            - pattern: $_._tag === $_
            - pattern: $_._tag !== $_
    declaration-of-tested:
        kind: variable_declarator
        has: {field: name, kind: identifier, pattern: $V}
    yielded-declaration:
        kind: variable_declarator
        all:
            - has: {field: name, kind: identifier, pattern: $V}
            - has: {field: value, kind: yield_expression, regex: '^yield[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\*'}
    generator-constant:
        kind: identifier
        pattern: $V
        inside:
            kind: generator_function
            stopBy: end
            has:
                field: body
                all:
                    - has: {kind: lexical_declaration, has: {matches: yielded-declaration}}
                    - not:
                        has:
                            has: {kind: 'identifier, shorthand_property_identifier', pattern: $V, stopBy: end}
                            not: {any: [{has: {matches: declaration-of-tested}}, {has: {kind: ternary_expression, pattern: $TERNARY, stopBy: end}}]}
    lift-call:
        kind: call_expression
        has: {field: function, kind: member_expression, has: {field: property, regex: '^(succeed|some)$'}}
    lifted-then-filtered:
        kind: call_expression
        not: {has: {stopBy: end, kind: comment}}
        all:
            - any:
                - has: {field: arguments, has: {nthChild: 1, matches: lift-call}}
                - has: {field: function, kind: member_expression, has: {field: object, matches: lift-call}}
            - any:
                - all:
                    - any:
                        - pattern: '$M.filterOrFail($M.succeed($V), $_, $_)'
                        - pattern: '$M.succeed($V).pipe($M.filterOrFail($_, $_))'
                        - pattern: '$M.succeed($V).pipe($M.filterOrFail($_, $_), $$$)'
                        - pattern: '$PIPE($M.succeed($V), $M.filterOrFail($_, $_))'
                        - pattern: '$PIPE($M.succeed($V), $M.filterOrFail($_, $_), $$$)'
                    - has: {stopBy: end, matches: result-module}
                - all:
                    - any:
                        - pattern: '$M.filter($M.some($V), $_)'
                        - pattern: '$M.some($V).pipe($M.filter($_))'
                        - pattern: '$M.some($V).pipe($M.filter($_), $$$)'
                        - pattern: '$PIPE($M.some($V), $M.filter($_))'
                        - pattern: '$PIPE($M.some($V), $M.filter($_), $$$)'
                    - has: {stopBy: end, matches: option-module}
rule:
    any:
        - matches: lifted-then-filtered
        - kind: ternary_expression
          all:
            - any:
                - all: [{has: {field: consequence, matches: option-lifted}}, {has: {field: alternative, matches: option-empty}}]
                - all: [{has: {field: alternative, matches: option-lifted}}, {has: {field: consequence, matches: option-empty}}]
                - all: [{has: {field: consequence, matches: result-lifted}}, {has: {field: alternative, matches: result-empty}}]
                - all: [{has: {field: alternative, matches: result-lifted}}, {has: {field: consequence, matches: result-empty}}]
            - has: {field: condition, matches: tested}
        - kind: ternary_expression
          all:
            - has: {field: condition, any: [{pattern: '$ROOT._tag === $TAG'}, {pattern: '$ROOT._tag !== $TAG'}], has: {field: right, kind: string}}
            - any:
                - all: [{has: {field: consequence, matches: case-lifted}}, {has: {field: alternative, any: [{matches: option-empty}, {matches: result-empty}]}}]
                - all: [{has: {field: alternative, matches: case-lifted}}, {has: {field: consequence, any: [{matches: option-empty}, {matches: result-empty}]}}]
        - kind: ternary_expression
          pattern: $TERNARY
          all:
            - has: {field: condition, has: {matches: generator-constant, stopBy: end}}
            - not: {has: {field: condition, any: [{matches: discriminant-test}, {has: {matches: discriminant-test, stopBy: end}}]}}
            - any:
                - all:
                    - has: {field: alternative, matches: failing-arm}
                    - not: {has: {field: consequence, matches: terminal-arm}}
                - all:
                    - has: {field: consequence, matches: failing-arm}
                    - not: {has: {field: alternative, matches: terminal-arm}}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^match$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Array$'}}}}}]}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $V}}, {not: {has: {nthChild: 3}}}]}
            - has: {field: arguments, has: {nthChild: 2, kind: object, has: {kind: pair, all: [{has: {field: key, regex: '^onNonEmpty$'}}, {has: {field: value, matches: succeeded-arm}}]}}}
            - has: {field: arguments, has: {nthChild: 2, kind: object, has: {kind: pair, all: [{has: {field: key, regex: '^onEmpty$'}}, {has: {field: value, matches: refused-arm}}]}}}
constraints:
    PIPE: {matches: {effect-function: {name: {regex: '^pipe$'}}}}
message: '`$V` enters `$M` through a predicate branch written by hand'
note: 'Call `<module>.liftPredicate` (`Result` takes `orFailWith`), `Effect.filterOrFail`, or `map` after `filter` for a tagged case'
