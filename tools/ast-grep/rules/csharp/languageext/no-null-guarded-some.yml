# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    some:
        kind: invocation_expression
        all:
            - matches: {csharp-named-call: {name: {regex: '^Some$'}}}
            - has:
                field: function
                any:
                    - kind: identifier
                    - kind: member_access_expression
                      has: {field: name, kind: identifier}
            - has:
                field: arguments
                all:
                    - has: {kind: argument, nthChild: 1, matches: csharp-positional-argument, has: {pattern: {context: 'class $BOUND;', selector: identifier}}}
                    - not: {has: {kind: argument, nthChild: 2}}
    some-value:
        any:
            - matches: some
            - kind: parenthesized_expression
              has: {matches: some-value}
    bound-pattern:
        kind: recursive_pattern
        all:
            - has: {field: name, pattern: {context: 'class $BOUND;', selector: identifier}}
            - has: {kind: property_pattern_clause, not: {has: {pattern: $_}}}
            - not: {has: {field: type, pattern: $_}}
            - not: {has: {kind: positional_pattern_clause}}
    present:
        any:
            - kind: is_pattern_expression
              all:
                - has: {field: expression, pattern: $X}
                - has: {field: pattern, matches: bound-pattern}
            - kind: parenthesized_expression
              has: {matches: present}
    absent:
        any:
            - kind: is_pattern_expression
              all:
                - has: {field: expression, pattern: $X}
                - has: {field: pattern, kind: negated_pattern, has: {matches: bound-pattern}}
            - kind: parenthesized_expression
              has: {matches: absent}
    none-branch:
        any:
            - matches: languageext-none-value
            - kind: return_statement
              has: {matches: languageext-none-value}
            - kind: block
              matches: csharp-single-return
              has: {kind: return_statement, has: {matches: languageext-none-value}}
    some-branch:
        any:
            - matches: some-value
            - kind: return_statement
              has: {matches: some-value}
            - kind: block
              matches: csharp-single-return
              has: {kind: return_statement, has: {matches: some-value}}
    fallthrough:
        kind: if_statement
        not: {has: {field: alternative, pattern: $_}}
    choice:
        any:
            - all:
                - has: {field: condition, matches: present}
                - has: {field: consequence, matches: some-branch}
                - any:
                    - has: {field: alternative, matches: none-branch}
                    - matches: fallthrough
                      precedes: {matches: none-branch}
            - all:
                - has: {field: condition, matches: absent}
                - has: {field: consequence, matches: none-branch}
                - any:
                    - has: {field: alternative, matches: some-branch}
                    - matches: fallthrough
                      precedes: {matches: some-branch}
    switch-arms:
        kind: switch_expression
        all:
            - has: {nthChild: 1, pattern: $X}
            - has:
                kind: switch_expression_arm
                all:
                    - has: {nthChild: 1, regex: '^(null|_)$'}
                    - has: {nthChild: 2, matches: languageext-none-value}
                    - not: {has: {kind: when_clause}}
            - has:
                kind: switch_expression_arm
                all:
                    - has: {nthChild: 1, matches: bound-pattern}
                    - has: {nthChild: 2, matches: some-value}
                    - not: {has: {kind: when_clause}}
            - not: {has: {kind: switch_expression_arm, nthChild: {position: 3, ofRule: {kind: switch_expression_arm}}}}
rule:
    any:
        - kind: conditional_expression, if_statement
          matches: choice
        - matches: switch-arms
message: 'Binding pattern on `$X` chooses between `Some($BOUND)` and `None`'
note: 'Use `Optional(<value>)` to test for null and construct the option in one call'
