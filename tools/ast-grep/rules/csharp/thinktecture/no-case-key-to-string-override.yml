# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-case-key-to-string-override
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    case-text:
        any:
            - kind: string_literal, verbatim_string_literal, raw_string_literal
            - kind: invocation_expression
              matches: csharp-nameof-call
            - kind: lambda_expression
              has: {field: body, matches: case-text}
            - kind: parenthesized_expression
              has: {matches: case-text}
    case-table:
        any:
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    any:
                        - kind: identifier, generic_name
                          matches: {csharp-type-name: {name: {regex: '^(Map|Switch)$'}}}
                        - kind: member_access_expression
                          all: [{has: {field: expression, regex: '^this$'}}, {has: {field: name, matches: {csharp-type-name: {name: {regex: '^(Map|Switch)$'}}}}}]
                - has: {field: arguments, has: {kind: argument}}
                - not: {has: {field: arguments, has: {kind: argument, not: {all: [{has: {field: name, kind: identifier}}, {has: {nthChild: {position: 1, reverse: true}, matches: case-text}}]}}}}
            - kind: switch_expression
              regex: '^this\s+switch\b'
              all:
                - has: {kind: switch_expression_arm, has: {nthChild: {position: 1, reverse: true}, matches: case-text}}
                - not: {has: {kind: switch_expression_arm, has: {nthChild: {position: 1, reverse: true}, not: {any: [{matches: case-text}, {kind: throw_expression}]}}}}
rule:
    kind: method_declaration
    all:
        - has: {field: name, regex: '^ToString$'}
        - has: {kind: modifier, regex: '^override$'}
        - not: {has: {field: parameters, has: {kind: parameter}}}
        - any:
            - has:
                field: body
                any:
                    - kind: arrow_expression_clause
                      has: {matches: case-table}
                    - kind: block
                      all:
                        - has: {kind: return_statement, has: {matches: case-table}}
                        - not: {has: {kind: return_statement, nthChild: 2}}
            - inside:
                kind: declaration_list
                stopBy: end
                inside:
                    kind: class_declaration, record_declaration, struct_declaration
                    matches: {csharp-attributed: {name: {regex: '^(SmartEnum|Union|AdHocUnion)(Attribute)?$'}}}
        - inside: {kind: declaration_list, inside: {kind: 'class_declaration, record_declaration, struct_declaration', has: {field: name, pattern: $TYPE}}}
message: '`$TYPE` overrides `ToString` with text its cases or key state'
note: 'Delete the override, read `Key` for a keyed item, map a displayed case to text through generated `Map`'
