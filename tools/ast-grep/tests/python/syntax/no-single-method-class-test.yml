id: no-single-method-class
valid:
    # The corrected form, a function
    - |
      def render(item):
          return item.name
    # Two methods
    - |
      class Reader:
          def load(self):
              return self.path

          def save(self):
              return self.path
    # Protocol, a base names the role
    - |
      class Reader(Protocol):
          def load(self) -> str: ...
    # Exception subclass
    - |
      class Missing(Exception):
          def __str__(self):
              return "missing"
    # Struct subclass
    - |
      class Item(msgspec.Struct):
          def render(self):
              return self.name
    # Class-level field beside the method
    - |
      class Reader:
          path = "item"

          def load(self):
              return self.path
    # Decorated method, the decorator names a role
    - |
      class Reader:
          @property
          def path(self):
              return "item"
    # Static method beside a plain method
    - |
      class Reader:
          @staticmethod
          def make():
              return Reader()

          def load(self):
              return self.path
    # Init alone
    - |
      class Reader:
          def __init__(self, path):
              self.path = path
              register(self)
    # Nested class beside the method
    - |
      class Renderer:
          class Inner:
              pass

          def render(self, item):
              return item.name
    # Keyword base, a metaclass builds the class
    - |
      class Renderer(metaclass=Meta):
          def render(self, item):
              return item.name
    # Init under a docstring with no other method
    - |
      class Renderer:
          """Render items."""

          def __init__(self, prefix):
              self.prefix = prefix
              register(self)
    # Special methods implement language protocols without requiring a base class
    - |
      class Empty:
          def __bool__(self):
              return False
    - |
      class Path:
          def __fspath__(self):
              return "file.txt"
    - |
      class Values:
          def __iter__(self):
              return iter((1, 2))
    - |
      class Field:
          def __get__(self, instance, owner):
              return 1
    - |
      class Values:
          @classmethod
          def __class_getitem__(cls, item):
              return item
    # Class method depends on class identity beside a static method
    - |
      class Tools:
          @staticmethod
          def render(item):
              return item.name

          @classmethod
          def make(cls):
              return cls()
    # Class method receives the owning class
    - |
      class Tools:
          @classmethod
          def make(cls):
              return cls()
    # Class decorator can consume the class identity
    - |
      @register
      class Renderer:
          def render(self, item):
              return item.name
    # Static method reads its implicit class cell
    - |
      class Factory:
          @staticmethod
          def make():
              return __class__()
    # Static special method implements construction
    - |
      class Factory:
          @staticmethod
          def __new__(cls):
              return object.__new__(cls)
