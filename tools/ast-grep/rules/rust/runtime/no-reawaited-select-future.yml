# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    polled:
        kind: identifier
        pattern: $FUTURE
        any:
            - follows: {kind: mutable_specifier, follows: {regex: '^&$', follows: {regex: '^=$', follows: {kind: identifier, pattern: $VALUE}}}}
              precedes: {regex: '^=>$', precedes: {matches: handler}}
            - follows: {regex: '^=$', follows: {kind: identifier, pattern: $VALUE}}
              precedes: {regex: '^\.$', precedes: {pattern: as_mut, precedes: {kind: token_tree, regex: '^\(\p{Pattern_White_Space}*\)$', precedes: {regex: '^=>$', precedes: {matches: handler}}}}}
    output-write:
        kind: identifier
        pattern: $OUTPUT
        precedes: {regex: '^=$', precedes: {pattern: Some, precedes: {kind: token_tree, pattern: {context: 'call!($VALUE)', selector: token_tree}}}}
    handler:
        any:
            - matches: output-write
            - kind: token_tree
              regex: '^\{\p{Pattern_White_Space}*(r#)?\p{XID_Continue}+\p{Pattern_White_Space}*=\p{Pattern_White_Space}*Some\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*(r#)?\p{XID_Continue}+\p{Pattern_White_Space}*\)\p{Pattern_White_Space}*;?\p{Pattern_White_Space}*\}$'
              has: {matches: output-write}
    awaited:
        kind: await_expression
        has:
            any:
                - {kind: identifier, pattern: $FUTURE}
                - {kind: parenthesized_expression, has: {kind: reference_expression, has: {field: value, kind: identifier, pattern: $FUTURE}}}
                - {kind: call_expression, has: {field: function, kind: field_expression, all: [{has: {field: value, kind: identifier, pattern: $FUTURE}}, {has: {field: field, regex: '^as_mut$'}}]}}
    absent:
        any:
            - kind: match_arm
              all:
                - has: {field: pattern, regex: '^(Option::)?None$'}
                - follows: {stopBy: end, kind: match_arm, has: {field: pattern, regex: '^(Option::)?Some\('}}
                - inside: {kind: match_block, inside: {kind: match_expression, has: {field: value, kind: identifier, pattern: $OUTPUT}}}
            - kind: match_arm
              all:
                - has: {field: pattern, regex: '^(Option::)?None$'}
                - precedes: {stopBy: end, kind: match_arm, has: {field: pattern, regex: '^(Option::)?Some\('}}
                - inside: {kind: match_block, inside: {kind: match_expression, has: {field: value, kind: identifier, pattern: $OUTPUT}}}
            - kind: else_clause
              inside: {kind: if_expression, has: {field: condition, kind: let_condition, all: [{has: {field: pattern, regex: '^(Option::)?Some\('}}, {has: {field: value, kind: identifier, pattern: $OUTPUT}}]}}
    completion-select:
        kind: macro_invocation
        all:
            - has: {field: macro, regex: '^(::)?(tokio::|futures::)?select(_biased)?$'}
            - has: {kind: token_tree, has: {matches: polled}}
    select-statement:
        pattern: $SELECT_STATEMENT
        any:
            - matches: completion-select
            - kind: expression_statement
              has: {matches: completion-select}
            - kind: let_declaration
              has: {field: value, matches: completion-select}
    tracked-output:
        all:
            - follows: {stopBy: end, matches: select-statement}
            - not:
                follows:
                    stopBy: end
                    not: {pattern: $SELECT_STATEMENT}
                    all:
                        - follows: {stopBy: end, pattern: $SELECT_STATEMENT}
                        - has: {stopBy: {kind: function_item}, kind: identifier, any: [{pattern: $OUTPUT}, {pattern: $FUTURE}]}
rule:
    kind: await_expression
    all:
        - matches: awaited
        - inside: {matches: absent, stopBy: {any: [{matches: rust-return-boundary}, {kind: 'match_arm, else_clause'}]}}
        - any:
            - matches: tracked-output
            - inside: {stopBy: {matches: rust-return-boundary}, matches: tracked-output}
message: '`$OUTPUT` stores `$FUTURE` completion from `select!` before a `None` fallback awaits it'
note: 'Pin `futures::future::maybe_done(<future>)`, poll it through `&mut` in each `select!`, and read its output once through `take_output()`'
