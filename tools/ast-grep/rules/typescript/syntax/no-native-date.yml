# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-date
language: tsx
severity: error
rule:
    any:
        - kind: new_expression
          all:
            - has: {field: constructor, regex: '^(globalThis\.)?Date$', matches: syntax-global-reference}
            - has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}
        - kind: call_expression
          has: {field: function, regex: '^(globalThis\.)?Date\.(parse|UTC)$', matches: syntax-global-reference}
message: 'Native `Date` accepts invalid input with no failure case'
note: '`DateTime.make(input)` returns `Option.none()` for invalid input'
