# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-read-then-swap
language: csharp
severity: error
utils:
    transaction:
        kind: invocation_expression
        has: {field: function, regex: '^(global::)?(LanguageExt\.)?(Prelude\.)?(atomic|atomicIO|snapshot|serial)$'}
    callback:
        kind: 'lambda_expression, anonymous_method_expression'
    receiver:
        any:
            - kind: identifier
              pattern: $ALIAS
              inside:
                stopBy: end
                kind: block
                has:
                    kind: local_declaration_statement
                    has:
                        kind: variable_declaration
                        has:
                            kind: variable_declarator
                            all:
                                - has: {field: name, pattern: $ALIAS}
                                - has: {nthChild: 2, any: [{kind: identifier, pattern: $NAME}, {kind: member_access_expression, all: [{has: {field: expression, regex: '^this$'}}, {has: {field: name, pattern: $NAME}}]}]}
            - kind: identifier
              pattern: $NAME
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^this$'}
                - has: {field: name, pattern: $NAME}
    swap:
        kind: invocation_expression
        all:
            - matches: csharp-atom-mutation
            - any:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: expression, matches: receiver}}, {has: {field: name, pattern: $SWAP}}]}
                - all:
                    - has: {field: function, pattern: $SWAP}
                    - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {matches: receiver}}}
    binding:
        kind: 'local_declaration_statement, from_clause, let_clause'
        not: {inside: {kind: if_statement, field: consequence}}
        any:
            - has: {field: name, pattern: $BOUND}
            - has: {kind: identifier, nthChild: 1, pattern: $BOUND}
            - has: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: $BOUND}}
    derived:
        kind: 'local_declaration_statement, from_clause, let_clause'
        all:
            - has: {stopBy: end, kind: identifier, pattern: $BOUND}
            - any:
                - has: {field: name, pattern: $DERIVED}
                - has: {kind: identifier, nthChild: 1, pattern: $DERIVED}
                - has: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: $DERIVED}}
    fed-bound:
        kind: invocation_expression
        all:
            - matches: swap
            - has: {stopBy: end, kind: identifier, pattern: $BOUND}
    fed-derived:
        kind: invocation_expression
        all:
            - matches: swap
            - has: {stopBy: end, kind: identifier, pattern: $DERIVED}
rule:
    kind: member_access_expression
    all:
        - has: {field: name, pattern: $READER, regex: '^(Value|ValueIO|Find|ContainsKey|Contains|Count|IsEmpty)$'}
        - has: {field: expression, pattern: $CELL, matches: receiver}
        - not: {inside: {stopBy: end, kind: 'lambda_expression, anonymous_method_expression', has: {field: parameters, any: [{kind: implicit_parameter, pattern: $CELL}, {has: {kind: parameter, has: {field: name, pattern: $CELL}}}]}}}
        - not: {inside: {stopBy: end, matches: transaction}}
        - any:
            - inside:
                stopBy: end
                matches: binding
                precedes:
                    stopBy: end
                    any:
                        - has: {stopBy: end, matches: fed-bound}
                        - all:
                            - matches: derived
                            - precedes: {stopBy: end, has: {stopBy: end, matches: fed-derived}}
            - inside:
                stopBy: end
                field: condition
                kind: 'if_statement, conditional_expression, while_statement, do_statement'
                has: {stopBy: end, matches: swap}
            - inside:
                stopBy: {matches: callback}
                kind: argument
                inside: {kind: 'tuple_expression, argument_list'}
                precedes: {stopBy: end, has: {stopBy: {matches: callback}, matches: swap}}
message: '`$CELL.$READER` is read before a separate `$SWAP` of `$CELL`'
note: Use one transition from the prior value, `Swap` returning the state before and after or a keyed `FindOrAdd`, `TryAdd`, or `SwapKey`, a separate read races each write
