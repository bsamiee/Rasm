# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-interactive-login-shell
language: swift
severity: error
rule:
    kind: array_literal
    pattern: $ARGS
    any:
        - has: {kind: line_string_literal, regex: '^"-([a-zA-Z]*i[a-zA-Z]*c|[a-zA-Z]*c[a-zA-Z]*i)[a-zA-Z]*"$', pattern: $FLAG}
        - all:
            - has: {kind: line_string_literal, regex: '^"-[a-zA-Z]*i[a-zA-Z]*"$', pattern: $FLAG}
            - has: {kind: line_string_literal, regex: '^"-[a-zA-Z]*c[a-zA-Z]*"$'}
    inside:
        kind: 'function_declaration, lambda_literal, computed_property'
        stopBy: end
        has:
            stopBy: end
            any:
                - kind: line_str_text
                  regex: '(^|/)(zsh|bash|sh|fish|dash|ksh)$|^SHELL$'
                - kind: simple_identifier
                  regex: '(?i)shell'
transform:
    DROPPED: {replace: {source: $ARGS, replace: '"-i", ?|, ?"-i"', by: ''}}
    WITHOUT: {replace: {source: $DROPPED, replace: '"-([a-zA-Z]*)i([a-zA-Z]*)"', by: '"-$1$2"'}}
fix: $WITHOUT
message: '`$FLAG` runs the interactive profile in a child with no terminal under the parent application''s attribution'
note: 'Pass the login flags without `i`, `["-lc", script]`'
