# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-builder-by-hand
language: rust
severity: error
utils:
    stored-value:
        any: [{pattern: $V}, {pattern: $V.into()}, {pattern: Some($V)}, {pattern: Some($V.into())}]
    setter:
        kind: function_item
        all:
            - has: {field: parameters, all: [{has: {kind: self_parameter, regex: '^(mut\s+self|&\s*mut\s+self|self)$'}}, {has: {kind: parameter, has: {field: pattern, kind: identifier, pattern: $V}}}]}
            - has:
                field: body
                any:
                    - all:
                        - has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, kind: expression_statement, has: {kind: assignment_expression, all: [{has: {field: left, pattern: self.$F}}, {has: {field: right, matches: stored-value}}]}}
                        - has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}, kind: self}
                        - not: {has: {nthChild: {position: 3, ofRule: {matches: rust-statement}}}}
                    - all:
                        - has:
                            nthChild: {position: 1, ofRule: {matches: rust-statement}}
                            kind: struct_expression
                            all:
                                - has: {field: name, regex: '^Self$'}
                                - has: {field: body, all: [{has: {kind: field_initializer, has: {field: value, matches: stored-value}}}, {has: {kind: base_field_initializer, regex: '^\.\.\s*self$'}}, {not: {has: {nthChild: 3}}}]}
                        - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
rule:
    kind: impl_item
    all:
        - not: {has: {field: trait, pattern: $_}}
        - has: {field: type, any: [{kind: generic_type, has: {field: type, pattern: $B}}, {pattern: $B}]}
        - has: {field: body, has: {matches: setter, nthChild: {position: 3, ofRule: {matches: setter}}}}
        - any:
            - has: {field: body, has: {kind: function_item, has: {field: name, regex: '^(build|finish)$', pattern: $BUILD}}}
            - all:
                - has: {field: type, regex: '^\w*Builder\b'}
                - has: {field: body, has: {kind: function_item, nthChild: {position: 1, reverse: true, ofRule: {kind: function_item}}, has: {field: name, pattern: $BUILD}}}
labels:
    B: {style: primary, message: 'Builder written by hand'}
    BUILD: {style: secondary, message: 'Builds the value'}
message: '`$B` sets each member through a hand-written setter before `$BUILD`'
note: 'Derive `bon::Builder` on the built type, or put `#[bon::builder]` on its constructor, and delete the builder'
