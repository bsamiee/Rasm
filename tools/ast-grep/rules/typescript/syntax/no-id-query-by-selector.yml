# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-id-query-by-selector
language: tsx
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - not: {has: {field: type_arguments, kind: type_arguments, not: {regex: '^<HTMLElement>$'}}}
        - has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^querySelector$'}
                - has:
                    field: object
                    pattern: $DOCUMENT
                    any:
                        - all: [{regex: '^((globalThis|window|self)\.)?document$'}, {matches: typescript-global-reference}]
                        - kind: member_expression
                          has: {field: property, regex: '^ownerDocument$'}
        - has:
            field: arguments
            all:
                - not: {has: {nthChild: 2}}
                - has:
                    nthChild: 1
                    any:
                        - pattern: '`#${CSS.escape($ID)}`'
                        - pattern: "'#' + CSS.escape($ID)"
                        - pattern: '"#" + CSS.escape($ID)'
                        - pattern: '`#${$ID}`'
                        - pattern: "'#' + $ID"
                        - pattern: '"#" + $ID'
fix: $DOCUMENT.getElementById($ID)
message: '`$CALL` finds one element through a selector built from an id'
note: 'Call `getElementById(<id>)` on the same document with the id unescaped'
