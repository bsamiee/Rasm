                        |dropUntilEffect|dropWhile|dropWhileEffect|dropWhileFilter|ensuring|filter|filterEffect|filterMap|filterMapEffect
                        |flatMap|flatten|flattenEffect|groupAdjacentBy|groupBy|groupByKey|grouped|groupedWithin|haltWhen|ignore|ignoreCause
                        |interleave|interleaveWith|interruptWhen|intersperse|intersperseAffixes|let|limitBytes|map|mapAccum|mapAccumArray
                        |mapAccumArrayEffect|mapAccumEffect|mapArray|mapArrayEffect|mapBoth|mapEffect|mapError|merge|mergeAll|mergeEffect
                        |mergeLeft|mergeResult|mergeRight|onEnd|onError|onExit|onFirst|onStart|orElseIfEmpty|orElseSucceed|partition
