id: java-method
language: javalang
role: item
symbolType: method
utils:
    exposed: {any: [{has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}}, {inside: {kind: 'interface_body, annotation_type_body'}, not: {has: {kind: modifiers, has: {pattern: private}}}}]}
    open: {not: {inside: {stopBy: end, any: [{kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', not: {matches: exposed}}, {kind: 'program, ERROR', has: {kind: 'method_declaration, field_declaration'}}]}}}
    public: {all: [{matches: exposed}, {matches: open}]}
    form:
        all:
            - any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: &kinds 'method_declaration, annotation_type_element_declaration'}]
            - any: [{has: {field: type_parameters, pattern: $TYPES}}, {kind: *kinds}]
            - any: [{has: {kind: 'annotation, marker_annotation', pattern: $ANNOTATION}}, {kind: *kinds}]
            - any: [{has: {field: type, pattern: $TYPE}}, {kind: *kinds}]
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {kind: *kinds}]
            - any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: *kinds}]
            - any: [{has: {kind: throws, pattern: $THROWS}}, {kind: *kinds}]
rule:
    kind: method_declaration, annotation_type_element_declaration
    has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}
rewriters:
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: "\n"}
    - {id: value, rule: {kind: annotation_argument_list}, fix: '(…)'}
    - {id: tool, rule: {kind: annotation, has: {field: name, regex: 'SuppressWarnings'}}, fix: ''}
    - id: element
      rule: {kind: identifier, inside: {kind: annotation_type_element_declaration, field: name, matches: form, any: [{has: {field: value, pattern: $VALUE}}, {kind: annotation_type_element_declaration}]}}
      transform:
          M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
          Y: rewrite($TYPE, rewriters=[comment, tool, value])
          D: {replace: {source: $VALUE, replace: '(?s).+', by: ' default …'}}
      fix: "$M\n$Y $NAME()$DIMENSIONS$D"
    - id: header
      rule: {kind: identifier, inside: {field: name, matches: form}}
      transform:
          M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
          T: rewrite($TYPES, rewriters=[comment, tool, value])
          A: rewrite($ANNOTATION, rewriters=[comment, tool, value])
          Y: rewrite($TYPE, rewriters=[comment, tool, value])
          P: rewrite($PARAMETERS, rewriters=[comment, tool, value])
          H: rewrite($THROWS, rewriters=[comment, tool, value])
      fix: "$M\n$T\n$A\n$Y $NAME$P$DIMENSIONS\n$H"
transform:
    HEADER: rewrite($NAME, rewriters=[element, header])
    LINES: replace($HEADER, replace='[\t-\r ]+', by="\n ")
    SIGNATURE: replace($LINES, replace='^\n |\n $|([(\[<]|[^.]\.)\n |\n ([)\]>.,;])|\n', by='$1$2')
name: $NAME
signature: $SIGNATURE
isExported: {matches: public}
---
id: java-constant
language: javalang
role: item
symbolType: constant
utils:
    exposed: {any: [{has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}}, {inside: {kind: 'interface_body, annotation_type_body'}, not: {has: {kind: modifiers, has: {pattern: private}}}}]}
    open: {not: {inside: {stopBy: end, any: [{kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', not: {matches: exposed}}, {kind: 'program, ERROR', has: {kind: 'method_declaration, field_declaration'}}]}}}
    public: {all: [{matches: exposed}, {matches: open}]}
    constant: {any: [{kind: constant_declaration}, {has: {kind: modifiers, all: [{has: {pattern: static}}, {has: {pattern: final}}]}}]}
rule:
    any:
        - kind: field_declaration, constant_declaration
          matches: constant
          not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}
          has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}}
        - kind: variable_declarator
          has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}
          inside: {kind: 'field_declaration, constant_declaration', matches: constant}
rewriters:
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: "\n"}
    - {id: value, rule: {kind: annotation_argument_list}, fix: '(…)'}
    - {id: tool, rule: {kind: annotation, has: {field: name, regex: 'SuppressWarnings'}}, fix: ''}
    - id: header
      rule:
          kind: identifier
          inside:
              kind: variable_declarator
              field: name
              any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: variable_declarator}]
              inside: {has: {field: type, pattern: $TYPE}, any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: 'field_declaration, constant_declaration'}]}
      transform:
          M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
          Y: rewrite($TYPE, rewriters=[comment, tool, value])
      fix: "$M\n$Y $NAME$DIMENSIONS"
transform:
    HEADER: rewrite($NAME, rewriters=[header])
    LINES: replace($HEADER, replace='[\t-\r ]+', by="\n ")
    SIGNATURE: replace($LINES, replace='^\n |\n $|([(\[<]|[^.]\.)\n |\n ([)\]>.,;])|\n', by='$1$2')
name: $NAME
signature: $SIGNATURE
isExported: {any: [{matches: public}, {inside: {kind: 'field_declaration, constant_declaration', matches: public}}]}
---
id: java-field
language: javalang
role: item
symbolType: field
utils:
    exposed: {any: [{has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}}, {inside: {kind: 'interface_body, annotation_type_body'}, not: {has: {kind: modifiers, has: {pattern: private}}}}]}
    open: {not: {inside: {stopBy: end, any: [{kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', not: {matches: exposed}}, {kind: 'program, ERROR', has: {kind: 'method_declaration, field_declaration'}}]}}}
    public: {all: [{matches: exposed}, {matches: open}]}
    variable: {not: {has: {kind: modifiers, all: [{has: {pattern: static}}, {has: {pattern: final}}]}}}
rule:
    any:
        - kind: field_declaration
          matches: variable
          not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}
          has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}}
        - kind: variable_declarator
          has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}
          inside: {kind: field_declaration, matches: variable}
rewriters:
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: "\n"}
    - {id: value, rule: {kind: annotation_argument_list}, fix: '(…)'}
    - {id: tool, rule: {kind: annotation, has: {field: name, regex: 'SuppressWarnings'}}, fix: ''}
    - id: header
      rule:
          kind: identifier
          inside:
              kind: variable_declarator
              field: name
              any: [{has: {field: dimensions, pattern: $DIMENSIONS}}, {kind: variable_declarator}]
              inside: {has: {field: type, pattern: $TYPE}, any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: field_declaration}]}
      transform:
          M: rewrite($MODIFIERS, rewriters=[comment, tool, value])
          Y: rewrite($TYPE, rewriters=[comment, tool, value])
      fix: "$M\n$Y $NAME$DIMENSIONS"
transform:
    HEADER: rewrite($NAME, rewriters=[header])
    LINES: replace($HEADER, replace='[\t-\r ]+', by="\n ")
    SIGNATURE: replace($LINES, replace='^\n |\n $|([(\[<]|[^.]\.)\n |\n ([)\]>.,;])|\n', by='$1$2')
name: $NAME
signature: $SIGNATURE
isExported: {any: [{matches: public}, {inside: {kind: field_declaration, matches: public}}]}
---
id: java-error
language: javalang
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, kind: 'package_declaration, import_declaration, module_declaration, class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, method_declaration, annotation_type_element_declaration, field_declaration, constant_declaration'}}}
        - {kind: 'identifier, line_comment, block_comment', all: [{inside: {kind: ERROR}}, {not: {follows: {kind: 'identifier, line_comment, block_comment', stopBy: end}}}]}
        - {regex: '^$', any: [{kind: 'identifier, type_identifier'}, {pattern: ';'}, {pattern: ')'}, {pattern: '}'}, {pattern: ']'}, {pattern: '>'}]}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: java-module-directive
language: javalang
role: member
parentRuleIds: [java-module]
symbolType: module
rule:
    kind: requires_module_directive, exports_module_directive, opens_module_directive, uses_module_directive, provides_module_directive
    all: [{not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}}, {has: {pattern: $$VERB}}, {has: {kind: 'identifier, scoped_identifier', pattern: $PATH}}, {pattern: $DECLARATION}]
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: "\n"}]
transform:
    NAME: replace($PATH, replace='[\t-\r ]+', by='')
    HEADER: rewrite($DECLARATION, rewriters=[comment])
    LINES: replace($HEADER, replace='(?:;|[\t-\r ])+$|[\t-\r ]+', by="\n ")
    SIGNATURE: replace($LINES, replace='^\n |\n $|([(\[<]|[^.]\.)\n |\n ([)\]>.,;])|\n', by='$1$2')
name: $VERB $NAME
signature: $SIGNATURE
---
id: java-member-error
language: javalang
role: member
parentRuleIds: [java-module, java-class, java-interface, java-enum, java-method, java-constant, java-field]
symbolType: 'null'
utils:
    row: {any: [{kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, method_declaration, annotation_type_element_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration, constant_declaration, requires_module_directive, exports_module_directive, opens_module_directive, uses_module_directive, provides_module_directive'}, {kind: 'formal_parameter, spread_parameter', inside: {kind: formal_parameters, inside: {kind: record_declaration, field: parameters}}}]}
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, matches: row}}}
        - {kind: 'identifier, line_comment, block_comment', all: [{inside: {kind: ERROR}}, {not: {follows: {kind: 'identifier, line_comment, block_comment', stopBy: end}}}]}
        - {regex: '^$', any: [{kind: 'identifier, type_identifier'}, {pattern: ';'}, {pattern: ')'}, {pattern: '}'}, {pattern: ']'}, {pattern: '>'}]}
        - {kind: 'annotated_type, annotation, annotation_argument_list, argument_list, array_access, array_creation_expression, array_initializer, array_type, assert_statement, assignment_expression, binary_expression, boolean_type, break_statement, cast_expression, catch_clause, catch_formal_parameter, catch_type, class_literal, continue_statement, dimensions, dimensions_expr, do_statement, element_value_array_initializer, element_value_pair, enhanced_for_statement, explicit_constructor_invocation, expression_statement, extends_interfaces, field_access, finally_clause, floating_point_type, for_statement, formal_parameters, generic_type, guard, if_statement, inferred_parameters, instanceof_expression, integral_type, labeled_statement, lambda_expression, local_variable_declaration, marker_annotation, method_invocation, method_reference, modifiers, object_creation_expression, parenthesized_expression, pattern, permits, receiver_parameter, record_pattern, record_pattern_body, record_pattern_component, requires_modifier, resource, resource_specification, return_statement, scoped_identifier, scoped_type_identifier, string_interpolation, string_literal, super_interfaces, superclass, switch_block_statement_group, switch_expression, switch_label, switch_rule, synchronized_statement, template_expression, ternary_expression, throw_statement, throws, try_statement, try_with_resources_statement, type_arguments, type_bound, type_list, type_parameter, type_parameters, type_pattern, unary_expression, update_expression, variable_declarator, void_type, while_statement, wildcard, yield_statement', all: [{has: {regex: '^$'}}, {not: {has: {stopBy: end, matches: row}}}]}
name: ERROR
signature: ''
isPublic: false
---
id: java-member-class
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum, java-method, java-constant, java-field]
symbolType: class
utils:
    exposed: {any: [{has: {kind: modifiers, has: {any: [{pattern: public}, {pattern: protected}]}}}, {inside: {kind: 'interface_body, annotation_type_body'}, not: {has: {kind: modifiers, has: {pattern: private}}}}]}
    open: {not: {inside: {stopBy: end, any: [{kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, object_creation_expression', not: {matches: exposed}}, {kind: 'program, ERROR', has: {kind: 'method_declaration, field_declaration'}}]}}}
    public: {all: [{matches: exposed}, {matches: open}]}
    owner: {inside: {kind: 'class_body, interface_body, annotation_type_body, enum_body_declarations', not: {inside: {kind: object_creation_expression}}, inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant', stopBy: end, any: [{inside: {kind: 'program, ERROR'}}, {has: {field: name, pattern: {context: 'class $OWNER {}', selector: identifier}}}]}}}
    local:
        inside:
            stopBy: {kind: 'method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration > variable_declarator, constant_declaration > variable_declarator, enum_constant, class_body, interface_body, annotation_type_body, enum_body_declarations'}
            kind: method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration > variable_declarator, constant_declaration > variable_declarator, enum_constant
            not: {any: [{inside: {kind: class_body, inside: {kind: object_creation_expression}}}, {inside: {kind: field_declaration, inside: {kind: class_body, inside: {kind: object_creation_expression}}}}]}
            any:
                - inside: {kind: 'program, ERROR'}
                - inside: {kind: field_declaration, inside: {kind: 'program, ERROR'}}
                - has: {field: name, pattern: {context: 'class $OWNER {}', selector: identifier}}
                - has: {pattern: $$OWNER, not: {kind: block}}
    placed:
        inside:
            stopBy: end
            kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant, method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, class_body > block, enum_body_declarations > block, field_declaration > variable_declarator, constant_declaration > variable_declarator
            any:
                - inside: {kind: 'program, ERROR'}
                - inside: {kind: field_declaration, inside: {kind: 'program, ERROR'}}
                - has: {field: name, pattern: {context: 'class $UP {}', selector: identifier}}
                - has: {pattern: $$UP, not: {kind: block}}
    form:
