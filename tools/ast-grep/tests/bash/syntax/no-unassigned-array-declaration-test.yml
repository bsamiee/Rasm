id: no-unassigned-array-declaration
valid:
    - |
      declare -A m=()
      n=${#m[@]}
    - |
      declare -A m=([k]=v)
      n=${#m[@]}
    - |
      declare -A m
      for k in "${!m[@]}"; do :; done
    - |
      declare -A m
      printf '%s\n' "${m[@]}"
    - |
      declare -A m
      m[$k]=1
      printf '%s\n' "${m[$k]}"
    - |
      local plain
      p=${#plain}
    - |
      declare -i n
      ((n += 1))
    - |
      local -n ref=$1
      printf '%s\n' "${#ref[@]}"
    - |
      declare -p m
      n=${#m[@]}
    - |
      f() { local -A m; m[a]=1; }
      g() { local -A m=(); printf '%s\n' "${#m[@]}"; }
    - |
      declare -a m
      m[0]=x
      n=${#m[0]}
invalid:
    - |
      declare -A m
      n=${#m[@]}
    - |
      declare -a items
      c=${#items[*]}
    - |
      f() { local -A a b=(); printf '%s\n' "${#a[@]}" "${#b[@]}"; }
    - |
      declare -gA m
      f() { printf '%s\n' "${#m[@]}"; }
    - |
      declare -ai counts
      n=${#counts[@]}
    - |
      g() { local -a q; q+=(x); printf '%s\n' "${#q[@]}"; }
    - |
      typeset -A m
      n=${#m[@]}
