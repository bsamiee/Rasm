# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Preserve comments and parameter initialization effects when replacing the callback.
id: require-is-tool
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
ignores:
    - '**/*.spec.ts'
utils:
    tool-test:
        kind: binary_expression
        all:
            - {has: {field: operator, regex: ^===$}}
            - has:
                field: left
                any:
                    - kind: member_expression
                      all:
                        - {has: {field: object, pattern: $E}}
                        - {has: {field: property, regex: ^tool$}}
                    - kind: subscript_expression
                      all:
                        - {has: {field: object, pattern: $E}}
                        - {has: {field: index, kind: string, regex: '^[''"]tool[''"]$'}}
            - {has: {field: right, kind: string, pattern: $NAME}}
rule:
    any:
        - {kind: arrow_function}
        - {kind: function_expression}
    all:
        - {not: {has: {stopBy: end, kind: comment}}}
        - has:
            field: parameters
            not: {has: {nthChild: 2}}
            has:
                kind: required_parameter
                all:
                    - {has: {field: pattern, kind: identifier, pattern: $E}}
                    - {has: {field: type, has: {kind: type_identifier, regex: ^ToolCallInput$}}}
                not: {has: {field: value, pattern: $_}}
        - {has: {field: return_type, kind: type_predicate_annotation}}
        - has:
            field: body
            any:
                - {matches: tool-test}
                - {kind: parenthesized_expression, has: {matches: tool-test}}
                - kind: statement_block
                  all:
                    - {has: {kind: return_statement, has: {matches: tool-test}}}
                    - {not: {has: {nthChild: 2}}}
    pattern: $MATCH
fix: isTool($NAME)
message: The refinement on the tool field is written by hand, and `isTool($NAME)` in policies/tools.ts is the one refinement
note: Narrow the event through `isTool('<tool>')`, `const _isBash = isTool('Bash')`
labels: {MATCH: {style: primary}}
