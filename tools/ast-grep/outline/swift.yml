---
id: swift-macro-expansion
language: swiftlang
role: item
symbolType: event
rule:
    kind: 'macro_invocation, diagnostic'
    pattern: $DECLARATION
    inside: {kind: source_file}
    any:
        - has: {kind: simple_identifier, pattern: $NAME}
        - kind: diagnostic
          pattern: $DIAGNOSTIC
rewriters:
    - id: body
      rule: {kind: lambda_literal}
      fix: '{ ... }'
transform:
    DIAGNOSTIC_NAME: {replace: {source: $DIAGNOSTIC, replace: '^#([^\s(]+)[\s\S]*$', by: '$1'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
name: $NAME$DIAGNOSTIC_NAME
signature: $SIGNATURE
isExported: false

