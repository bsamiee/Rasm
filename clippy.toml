# --- [CLIPPY] ---------------------------------------------------------------------------

# --- [API]
avoid-breaking-exported-api = false

# --- [FORMS]
warn-on-all-wildcard-imports                 = true       # `wildcard_imports` covers prelude, test-module `super::*`, and `pub use` globs
matches-for-let-else                         = "AllTypes" # `manual_let_else` covers diverging matches on every type, not `Option` and `Result` alone
max-struct-bools                             = 1
max-fn-params-bools                          = 1          # `true, false` arguments state no meaning at a call site
excessive-nesting-threshold                  = 5          # The impl block counts as one level, a free fn nests 4 control levels and a method 3
check-inconsistent-struct-field-initializers = true       # `inconsistent_struct_constructor` covers expression fields beside shorthand fields
enforce-iter-loop-reborrow                   = true       # `explicit_iter_loop` covers reborrows, `&*v` and `&mut *v` replace `iter` and `iter_mut`
allow-mixed-uninlined-format-args            = false      # `uninlined_format_args` covers strings mixing inlinable arguments with field accesses
lint-commented-code                          = true       # `collapsible_if` and `collapsible_else_if` cover chains holding a comment

# --- [NAMING]
upper-case-acronyms-aggressive = true  # `upper_case_acronyms` covers every all-caps run in a type or variant name (`HTTPServer` becomes `HttpServer`)
allow-exact-repetitions        = false # `module_name_repetitions` covers public items named exactly as their public module
enum-variant-name-threshold    = 2     # Two variants are the fewest that share an affix
struct-field-name-threshold    = 2     # Two fields are the fewest that share an affix
allow-renamed-params-for       = []    # `renamed_function_params` covers `From`, `TryFrom`, and `FromStr` impls

# --- [GRAPH]
allowed-duplicate-crates = [
    "syn",                   # 2 under proc macros not on `syn` 3
    "getrandom",             # 0.3 under `ahash`, `jsonschema`, `jsonschema-value`, `referencing`, and `rand_core` 0.9, 0.4 under `rand` 0.10, `uuid`, `tempfile`, and `jobserver`
    "rand",                  # 0.9 under newest `opentelemetry_sdk` 0.33.1 `trace`, its main branch still requires 0.9, 0.10 under rmcp `server-side-http`
    "rand_core",             # 0.9 under `rand` 0.9 beside 0.10 under `rand` 0.10
    "r-efi",                 # 5 under `getrandom` 0.3 beside 6 under `getrandom` 0.4
    "matchit",               # 0.8.4 pinned exactly by newest `axum` 0.8.9 beside 0.9 for resource URI routes
    "bitflags",              # 1 under newest `defmt` 1.2.0, which `cargo metadata` resolves through the weak `defmt?/alloc` of every `jiff` 0.2.38 and `jiff-core` 0.1.1 build though no build compiles it (rust-clippy#16440), beside 2 under `nix`, `rustix`, and `tower-http`
]

