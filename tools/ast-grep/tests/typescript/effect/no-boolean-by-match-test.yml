id: no-boolean-by-match
valid:
    - |-
      import { Option } from "effect";
      Option.match<number, boolean, boolean>(found, { onNone: () => false, onSome: () => true })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: () => /* preserve explanation */ true })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: async () => true })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: constFalse, onSome: constTrue })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: (value = read()) => true })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: ({ value }) => true })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: () => true, extra: log() })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: () => true, ...handlers })
    - |-
      import { Option } from "effect";
      Option.match(found, { onNone: () => false, onSome: () => true /* retain explanation */ })
    - |-
      import { Option } from "effect";
      Option.match(found, { 'onNone': () => false, 'onSome': () => true })
    - |-
      import { Option } from "effect";
      const held = Option.isSome(found);
    - |-
      import { Effect } from "effect";
      const same = Effect.match(work, { onFailure: () => false, onSuccess: (back) => equivalence(value, back) });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: () => true, onSome: () => true });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: () => missing, onSome: () => present });
    - |-
      import { Boolean } from "effect";
      const count = Boolean.match(flag, { onTrue: () => 1, onFalse: () => 0 });
    - |-
      import { Micro } from "effect";
      const passed = Micro.match(work, { onFailure: () => false, onSuccess: () => true });
    - |-
      const leaf = Item.match(item, { onLeaf: () => true, onNode: () => false });
    - |-
      import { Take } from "effect";
      const ended = Take.match(take, { onEnd: () => true, onFailure: () => false, onSuccess: () => false });
    - |-
      import { Option } from "effect";
      const held = Option.map(found, { onNone: () => false, onSome: () => true });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: () => { log(); return false; }, onSome: () => true });
    - |-
      import { Boolean } from "effect";
      const held = flag.pipe(Boolean.match({ onTrue: () => true, onFalse: () => false }));
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: () => false, onSome: () => { log(); return true; } });
    - |-
      import { Effect } from "effect";
      const passed = Effect.matchCause(work, { onFailure: () => false, onSuccess: () => true });
    - 'import { Option } from "other"; Option.match(found, { onNone: () => false, onSome: () => true })'
    - 'import { Option } from "effect"; import { Function } from "other"; Option.match(found, { onNone: Function.constFalse, onSome: Function.constTrue })'
    - 'import { Option as Boolean } from "effect"; Boolean.match(found, {onNone: () => false, onSome: () => true})'
    - 'import { Boolean as Option } from "effect"; Option.match(flag, {onTrue: () => true, onFalse: () => false})'
    - 'import { Option, Predicate as Function } from "effect"; Option.match(found, {onNone: Function.constFalse, onSome: () => true})'
    - 'import { Option, Predicate as Function } from "effect"; Option.match(found, {onNone: () => false, onSome: Function.constTrue})'
    - |-
      import { Option, Function } from "effect";
      const held = Option.match(found, { onNone: Function.constNull, onSome: Function.constTrue });
    - |-
      import { Cause } from "effect";
      const empty = Cause.match(cause, { onEmpty: true, onFail: () => false });
invalid:
    - |-
      import { Boolean } from "effect";
      Boolean.match(false, { onFalse: () => true, onTrue: () => false }).toString()
    - |-
      import { Boolean } from "effect";
      Boolean.match(flag, { onFalse: () => true, onTrue: () => false })[property]
    - |-
      import { Boolean } from "effect";
      Boolean.match((flag), { onFalse: () => true, onTrue: () => false })
    - |-
      import { Boolean } from "effect";
      const result = Boolean.match(item.ready, { onFalse: () => true, onTrue: () => false });
    - |-
      import { Boolean } from "effect";
      const result = Boolean.match(ready(), { onFalse: () => true, onTrue: () => false });
    - |-
      import { Boolean } from "effect";
      const result = Boolean.match(flags[0], { onFalse: () => true, onTrue: () => false });
    - |-
      import { Boolean } from "effect";
      const result = Boolean.match(ready!, { onFalse: () => true, onTrue: () => false });
    - |-
      import { Effect } from "effect";
      const passed = Effect.match(work, { onFailure: () => false, onSuccess: () => true });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: () => false, onSome: () => true });
    - |-
      import { Option } from "effect";
      const missing = Option.match(found, { onNone: () => true, onSome: (_) => false });
    - |-
      import { Either } from "effect";
      const decoded = Either.match(result, { onLeft: () => false, onRight: () => true });
    - |-
      import { Exit } from "effect";
      const failed = Exit.match(exit, { onFailure: () => true, onSuccess: () => false });
    - |-
      import { Option } from "effect";
      const held = found.pipe(Option.match({ onNone: () => false, onSome: () => true }));
    - |-
      import { Option } from "effect";
      const held = Option.match({ onNone: () => false, onSome: () => true })(found);
    - |-
      import { Option, Function } from "effect";
      const held = Option.match(found, { onNone: Function.constFalse, onSome: Function.constTrue });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: () => { return false; }, onSome: () => { return true; } });
    - |-
      import { Boolean } from "effect";
      const held = Boolean.match(flag, { onTrue: () => true, onFalse: () => false });
    - |-
      import { Boolean } from "effect";
      const quiet = Boolean.match(flag, { onFalse: () => true, onTrue: () => false });
    - |-
      import { Boolean } from "effect";
      const small = Boolean.match(size > limit, { onTrue: () => false, onFalse: () => true });
    - 'import * as O from "effect/Option"; O.match(found, { onNone: () => false, onSome: () => true })'
    - |-
      import { Option, Function as F } from "effect";
      const held = Option.match(found, { onNone: F.constFalse, onSome: F.constTrue });
    - |-
      import { STM } from "effect";
      const passed = STM.match(transaction, { onFailure: () => false, onSuccess: () => true });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onSome: () => true, onNone: () => false });
    - |-
      import { Option } from "effect";
      const held = Option.match(found, { onNone: function () { return false; }, onSome: function () { return true; } });
