# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-call-target
language: xml
severity: error
rule:
    matches: {msbuild-element: {name: {regex: '^CallTarget$'}}}
message: CallTarget runs the target in a new scope, its properties and items reach the caller after the calling target finishes
note: Name the dependency in DependsOnTargets
