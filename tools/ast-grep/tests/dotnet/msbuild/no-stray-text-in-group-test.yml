id: no-stray-text-in-group
valid:
    - '<package><metadata><description>Package description</description></metadata></package>'
    - '<Project><ProjectExtensions><Data><Folder>text</Folder></Data></ProjectExtensions></Project>'
    - '<Project><PropertyGroup><Folder>assets</Folder><Solution>workspace</Solution></PropertyGroup></Project>'
    - '<Project><ItemGroup><None Include="data"><Folder>assets</Folder></None></ItemGroup></Project>'
    - '<Project><ItemDefinitionGroup><None><Folder>assets</Folder></None></ItemDefinitionGroup></Project>'
    - |
      <ItemGroup>
          <_RuntimeInitBinding Include="itext" Companion="itext.bouncy-castle-adapter" /> <!-- iText crypto paths need the adapter -->
          <_RuntimeInitBinding Include="itext.pdfhtml" Companion="itext.bouncy-castle-adapter" />
      </ItemGroup>
    - |
      <PropertyGroup><Description>Aggregate runtime initialization</Description></PropertyGroup>
    - |
      <ItemGroup>
        <AssemblyAttribute Include="System.Runtime.Versioning.SupportedOSPlatformAttribute"><_Parameter1>macos</_Parameter1></AssemblyAttribute>
      </ItemGroup>
    - |
      <PropertyGroup><Description>a &amp; b</Description></PropertyGroup>
    - |
      <ItemGroup><None Include="data"><Note>a &#60; b</Note></None></ItemGroup>
invalid:
    - |
      <ItemGroup>
          <_RuntimeInitBinding Include="itext" Companion="itext.bouncy-castle-adapter" />. <!-- iText crypto paths need the adapter -->
      </ItemGroup>
    - |
      <PropertyGroup>stale<Nullable>enable</Nullable></PropertyGroup>
    - |
      <Project><ItemGroup><PackageReference Include="CsCheck">stale<PrivateAssets>all</PrivateAssets></PackageReference></ItemGroup></Project>
    - |
      <Solution><Folder Name="/libs/">stale<Project Path="libs/A/A.csproj" /></Folder></Solution>
    - |
      <packageSources><clear />stale<add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources>
    - |
      <PropertyGroup>&amp;<Nullable>enable</Nullable></PropertyGroup>
    - |
      <ItemGroup><Compile Include="A.cs" />&#60;</ItemGroup>
    - |
      <Target Name="Run">stale<Message Text="x" /></Target>
    - |
      <Choose><When Condition="true">stale<PropertyGroup /></When></Choose>
    - |
      <Project>stale<PropertyGroup /></Project>
    - |
      <ItemDefinitionGroup><None>stale<Folder>x</Folder></None></ItemDefinitionGroup>
    - |
      <configuration><packageSourceMapping>stale<clear /></packageSourceMapping></configuration>
