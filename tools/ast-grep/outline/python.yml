id: python-import
language: pythonlang
role: item
symbolType: module
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
    listed: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports, has: {kind: string_content, stopBy: end, pattern: $EXPORT}}}}}
    unlisted: {not: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports}}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    imported: {not: {inside: {kind: import_from_statement, field: module_name}}}
    bound: {any: [{kind: dotted_name, has: {nthChild: 1, pattern: $EXPORT}}, {kind: aliased_import, has: {field: alias, pattern: $EXPORT}}]}
    redundant: {kind: aliased_import, all: [{has: {field: alias, pattern: $ALIAS, not: {matches: private}}}, {has: {field: name, pattern: $ALIAS}}]}
    sibling: {kind: import_from_statement, all: [{has: {field: module_name, kind: relative_import, not: {has: {kind: dotted_name}}}}, {has: {kind: dotted_name, matches: imported, not: {matches: private}}}]}
rule:
    kind: 'import_statement, import_from_statement, future_import_statement'
    pattern: $DECLARATION
    any:
        - {kind: import_statement, pattern: $LIST}
        - has: {field: module_name, pattern: $MODULE}
        - has: {pattern: $$MODULE, follows: {not: {follows: {pattern: $$_}}}}
rewriters:
    - id: module
      rule: {kind: 'dotted_name, aliased_import', pattern: $IMPORTED, inside: {kind: import_statement}}
      fix: $IMPORTED
    - id: comment
      rule: {kind: comment}
      fix: ''
transform:
    MODULES: {rewrite: {source: $LIST, rewriters: [module], joinBy: ', '}}
    BARE: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    SIGNATURE: {replace: {source: $BARE, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $MODULES$MODULE
signature: $SIGNATURE
isImport: true
isExported:
    any:
        - all: [{any: [{has: {matches: redundant}}, {has: {kind: wildcard_import}}, {matches: sibling}]}, {matches: unlisted}]
        - has: {all: [{matches: imported}, {matches: bound}, {matches: listed}]}
---
id: python-type-alias
language: pythonlang
role: item
symbolType: struct
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
    listed: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}}
    unlisted: {not: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports}}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    alias: {any: [{kind: identifier, pattern: $NAME}, {kind: generic_type, has: {kind: identifier, pattern: $NAME}}]}
rule:
    kind: type_alias_statement
    pattern: $DECLARATION
    has: {field: left, has: {matches: alias}}
rewriters:
    - id: comment
      rule: {kind: comment}
      fix: ''
transform:
    BARE: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    SIGNATURE: {replace: {source: $BARE, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - all: [{not: {has: {field: left, has: {any: [{kind: identifier, matches: private}, {kind: generic_type, has: {kind: identifier, matches: private}}]}}}}, {matches: unlisted}]
        - matches: listed
---
id: python-enum
language: pythonlang
role: item
symbolType: enum
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
    listed: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}}
    unlisted: {not: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports}}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    base: {any: [{pattern: Enum}, {pattern: IntEnum}, {pattern: StrEnum}, {pattern: ReprEnum}, {pattern: Flag}, {pattern: IntFlag}]}
    metaclass: {any: [{pattern: EnumType}, {pattern: EnumMeta}]}
    enumeration:
        kind: class_definition
        has:
            field: superclasses
            has:
                any:
                    - matches: base
                    - {kind: attribute, has: {field: attribute, matches: base}}
                    - {kind: keyword_argument, all: [{has: {field: name, pattern: metaclass}}, {has: {field: value, any: [{matches: metaclass}, {kind: attribute, has: {field: attribute, matches: metaclass}}]}}]}
rule:
    kind: 'class_definition, decorated_definition'
    pattern: $DECLARATION
    any:
        - {kind: class_definition, matches: enumeration, has: {field: name, pattern: $NAME}}
        - {kind: decorated_definition, has: {field: definition, matches: enumeration, has: {field: name, pattern: $NAME}}}
rewriters:
    - id: body
      rule: {kind: block, inside: {kind: class_definition, field: body}}
      fix: {template: '', expandStart: {not: {kind: comment}, stopBy: end}}
    - id: comment
      rule: {kind: comment, not: {inside: {kind: 'class_definition, function_definition'}}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, comment]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: '$SIGNATURE:'
isExported:
    any:
        - all: [{not: {any: [{has: {field: name, matches: private}}, {has: {field: definition, has: {field: name, matches: private}}}]}}, {matches: unlisted}]
        - matches: listed
---
id: python-interface
language: pythonlang
role: item
symbolType: interface
utils:
    exports:
        any:
            - {kind: 'assignment, augmented_assignment', has: {field: left, pattern: __all__}}
            - {kind: call, has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, any: [{pattern: extend}, {pattern: append}]}}]}}
    listed: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}}
    unlisted: {not: {inside: {kind: module, stopBy: end, has: {kind: expression_statement, has: {matches: exports}}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    protocol: {any: [{pattern: Protocol}, {kind: attribute, has: {field: attribute, pattern: Protocol}}]}
    structural: {kind: class_definition, has: {field: superclasses, has: {any: [{matches: protocol}, {kind: subscript, has: {field: value, matches: protocol}}]}}}
rule:
    kind: 'class_definition, decorated_definition'
    pattern: $DECLARATION
    any:
        - {kind: class_definition, matches: structural, has: {field: name, pattern: $NAME}}
        - {kind: decorated_definition, has: {field: definition, matches: structural, has: {field: name, pattern: $NAME}}}
rewriters:
    - id: body
      rule: {kind: block, inside: {kind: class_definition, field: body}}
      fix: {template: '', expandStart: {not: {kind: comment}, stopBy: end}}
    - id: comment
      rule: {kind: comment, not: {inside: {kind: 'class_definition, function_definition'}}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, comment]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $NAME
signature: '$SIGNATURE:'
isExported:
    any:
        - all: [{not: {any: [{has: {field: name, matches: private}}, {has: {field: definition, has: {field: name, matches: private}}}]}}, {matches: unlisted}]
        - matches: listed
