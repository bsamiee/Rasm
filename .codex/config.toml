approval_policy = "never"
sandbox_mode    = "danger-full-access"

[agents]
max_concurrent_threads_per_session = 30

[apps._default]
default_tools_approval_mode = "approve"

[notice]
hide_full_access_warning = true

[plugins."blender@rasm"]
enabled = true

[plugins."dotnet@rasm"]
enabled = true

[plugins."msbuild@rasm"]
enabled = true

[plugins."python@rasm"]
enabled = true

[plugins."uxp@rasm"]
enabled = true

[plugins."orchestration@rasm"]
enabled = true

[plugins."swift@rasm"]
enabled = true

[plugins."search@rasm"]
enabled = true

[plugins."rhino@rasm"]
enabled = true

[plugins."typescript@rasm"]
enabled = true

[plugins."chrome@rasm"]
enabled = true

[plugins."web@rasm"]
enabled = true

[plugins."rust@rasm"]
enabled = true

[plugins."cpp@rasm"]
enabled = true

[plugins."media@rasm"]
enabled = true

[plugins."tool@rasm"]
enabled = true

[plugins."code@rasm"]
enabled = true

[plugins."writing@rasm"]
enabled = true

[marketplaces.rasm]
source_type  = "git"
source       = "https://github.com/bsamiee/Rasm.git"
ref          = "main"
sparse_paths = [
    ".agents/plugins",
    "plugins",
]

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS    = "80"
CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS = "50000"
BASH_DEFAULT_TIMEOUT_MS                 = "300000"
