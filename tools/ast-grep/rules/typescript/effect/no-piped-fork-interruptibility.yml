# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-piped-fork-interruptibility
language: tsx
severity: error
utils:
    uninterruptible:
        matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^uninterruptible$'}}}
    fork-member:
        matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(forkIn|forkChild|forkScoped|forkDetach|runFork)$'}}}
    fork-options:
        kind: object
        not: {has: {any: [{kind: spread_element}, {kind: pair, has: {field: key, regex: '^uninterruptible$'}}, {kind: shorthand_property_identifier, regex: '^uninterruptible$'}]}}
    fork-step:
        any:
            - matches: fork-member
              not: {has: {field: property, regex: '^(forkIn|runFork)$'}}
            - kind: call_expression
              all:
                - has: {field: function, matches: fork-member, not: {has: {field: property, regex: '^runFork$'}}}
                - any:
                    - all:
                        - has: {field: function, has: {field: property, regex: '^forkIn$'}}
                        - has: {field: arguments, all: [{has: {nthChild: 1, not: {kind: object}}}, {not: {has: {nthChild: 2, not: {matches: fork-options}}}}, {not: {has: {nthChild: 3}}}]}
                    - all:
                        - has: {field: function, not: {has: {field: property, regex: '^forkIn$'}}}
                        - has: {field: arguments, all: [{not: {has: {nthChild: 1, not: {matches: fork-options}}}}, {not: {has: {nthChild: 2}}}]}
    uninterruptible-effect:
        any:
            - kind: call_expression
              has: {field: function, matches: uninterruptible}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^pipe$'}}
                - has: {field: arguments, has: {matches: uninterruptible, nthChild: {position: 1, reverse: true}}}
rule:
    any:
        - matches: uninterruptible
          pattern: $FIXABLE
          inside: {kind: arguments}
          precedes: {matches: fork-step, pattern: $FORK, stopBy: {not: {regex: '^,$'}}}
        - kind: call_expression
          pattern: $KEPT
          all:
            - has: {field: function, matches: fork-member, pattern: $HEAD}
            - has: {field: arguments, has: {nthChild: 1, matches: uninterruptible-effect}}
        - kind: call_expression
          pattern: $KEPT
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: uninterruptible-effect}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: fork-step, pattern: $HEAD}}
rewriters:
    - id: empty
      rule: {kind: call_expression, pattern: $M.$F()}
      fix: '$M.$F({ uninterruptible: true })'
    - id: optioned
      rule: {kind: call_expression, pattern: '$M.$F({ $$$OPTIONS })'}
      transform: {LISTED: {replace: {source: $$$OPTIONS, replace: '(?s)^(.+)$', by: ', $1'}}}
      fix: '$M.$F({ uninterruptible: true$LISTED })'
    - id: scoped-optioned
      rule: {kind: call_expression, pattern: '$M.$F($SCOPE, { $$$OPTIONS })'}
      transform: {LISTED: {replace: {source: $$$OPTIONS, replace: '(?s)^(.+)$', by: ', $1'}}}
      fix: '$M.$F($SCOPE, { uninterruptible: true$LISTED })'
    - id: scoped
      rule: {kind: call_expression, pattern: $M.$F($SCOPE)}
      fix: '$M.$F($SCOPE, { uninterruptible: true })'
    - id: unscoped
      rule: {matches: fork-member, pattern: $M.$F}
      fix: '$M.$F({ uninterruptible: true })'
transform:
    OPTIONED: rewrite($FORK, rewriters=[empty, optioned, scoped-optioned, scoped, unscoped])
fix:
    template: $OPTIONED$KEPT
    expandEnd: {matches: fork-step, stopBy: end}
message: '`$FORK$HEAD` starts its fiber interruptible until its `Effect.uninterruptible` step runs'
note: 'Pass `{ uninterruptible: true }` to the fork call in place of `Effect.uninterruptible`'
