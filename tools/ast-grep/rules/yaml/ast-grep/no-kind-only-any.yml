# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-kind-only-any
language: yaml
severity: error
files: [tools/ast-grep/rules/**, tools/ast-grep/utils/**, tools/ast-grep/rewrites/**, tools/ast-grep/outline/**]
utils:
    kind-pair:
        kind: block_mapping_pair, flow_pair
        has: {field: key, regex: '^(kind|"kind"|''kind'')$'}
    one-kind-map:
        kind: block_mapping, flow_mapping
        has: {matches: kind-pair}
        not: {has: {kind: 'block_mapping_pair, flow_pair', nthChild: {position: 2, ofRule: {kind: 'block_mapping_pair, flow_pair'}}}}
    kind-only-list:
        any:
            - kind: block_node
              has:
                kind: block_sequence
                not: {has: {kind: block_sequence_item, not: {has: {kind: 'block_node, flow_node', has: {matches: one-kind-map}}}}}
            - kind: flow_node
              has:
                kind: flow_sequence
                not: {has: {kind: flow_node, not: {has: {matches: one-kind-map}}}}
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - has: {field: key, regex: '^(any|"any"|''any'')$'}
        - not: {inside: {kind: 'block_mapping, flow_mapping', has: {matches: kind-pair}}}
        - has: {field: value, matches: kind-only-list}
        - any:
            - {kind: block_mapping_pair, has: {field: value, pattern: $BLOCK}}
            - {kind: flow_pair, has: {field: value, pattern: $FLOW}}
rewriters:
    - id: kind-name
      rule: {matches: kind-pair, has: {field: value, pattern: $K}}
      transform:
        NAME: {replace: {source: $K, replace: '^[''"](.*)[''"]$', by: '$1'}}
      fix: $NAME
transform:
    BLOCK_LIST: {rewrite: {source: $BLOCK, rewriters: [kind-name], joinBy: ', '}}
    FLOW_LIST: {rewrite: {source: $FLOW, rewriters: [kind-name], joinBy: ', '}}
    QUOTED: {replace: {source: $FLOW_LIST, replace: '^(.+)$', by: "'$1'"}}
fix: 'kind: $BLOCK_LIST$QUOTED'
message: '`any:` holds kind-only branches, one comma kind list states the union'
note: 'Write `kind: <a>, <b>`, quoted inside a flow map, and keep `any:` for a branch with a second key'
