# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: call_expression
    all:
        - pattern: $O.get_or_insert_with($D)
constraints:
    D: {matches: rust-default-value}
message: '`$O` inserts the default value through `$D`'
note: 'Call `<option>.get_or_insert_default()`'
