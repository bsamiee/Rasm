# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-distinct-by-index-of
language: tsx
severity: error
ignores: ['plugins/function-hooks/**', '.codex/hooks/**']
utils:
    first-index-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^===?$'}
            - any:
                - all: [{has: {field: left, matches: own-index}}, {has: {field: right, pattern: $I}}]
                - all: [{has: {field: left, pattern: $I}}, {has: {field: right, matches: own-index}}]
    own-index:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $OWNER}}, {has: {field: property, regex: '^indexOf$'}}]}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $X}}, {not: {has: {nthChild: 2}}}]}
    first-index-callback:
        kind: arrow_function, function_expression
        all:
            - has: {field: parameters, all: [{has: {nthChild: 1, has: {kind: identifier, pattern: $X}}}, {has: {nthChild: 2, has: {kind: identifier, pattern: $I}}}]}
            - has:
                field: body
                any:
                    - matches: first-index-test
                    - kind: statement_block
                      has: {kind: return_statement, has: {matches: first-index-test}}
                      not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    native-set:
        kind: new_expression
        all:
            - has: {field: constructor, regex: '^((globalThis|window|self)\.)?Set$', matches: syntax-global-reference}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $L}}, {not: {has: {nthChild: 2}}}]}
    array-import:
        kind: import_statement
        not: {has: {regex: '^type$'}}
        any:
            - all:
                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                - has:
                    stopBy: end
                    kind: import_specifier
                    all:
                        - has: {field: name, regex: '^Array$'}
                        - has: {kind: identifier, pattern: $ARRAY, nthChild: {position: 1, reverse: true, ofRule: {kind: identifier}}}
                        - not: {has: {regex: '^type$'}}
            - all:
                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Array$'}}
                - has: {kind: import_clause, has: {kind: namespace_import, has: {kind: identifier, pattern: $ARRAY}}}
rule:
    all:
        - any:
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $L}}, {has: {field: property, regex: '^filter$'}}]}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: first-index-callback}}, {not: {has: {nthChild: 2}}}]}
                - any:
                    - has: {field: function, has: {field: object, pattern: $OWNER}}
                    - has: {field: arguments, has: {has: {field: parameters, has: {nthChild: 3, has: {kind: identifier, pattern: $OWNER}}}}}
            - kind: array
              all:
                - has: {nthChild: 1, kind: spread_element, has: {matches: native-set}}
                - not: {has: {nthChild: 2}}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^((globalThis|window|self)\.)?Array\.from$', matches: syntax-global-reference}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: native-set}}, {not: {has: {nthChild: 2}}}]}
        - any:
            - pattern: $FIXABLE
              inside: {kind: program, stopBy: end, has: {matches: array-import}}
            - pattern: $KEPT
rewriters:
    - id: dedupe
      rule: {kind: 'call_expression, array'}
      fix: $ARRAY.dedupe($L)
transform:
    FIXED: rewrite($FIXABLE, rewriters=[dedupe])
fix: $FIXED$KEPT
message: '`$L` is deduplicated by hand'
note: '`Array.dedupe(<list>)` keeps the first of each value by `Equal` in one call, a `Set` compares by identity and `indexOf` drops every `NaN`'
