# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-run-python-script
language: python
severity: error
rule:
    kind: string
    pattern: $MACRO
    has: {kind: string_content, regex: '(?i)runpythonscript'}
    not: {inside: {kind: comparison_operator}}
message: '`$MACRO` runs a file on IronPython 2.7 through `_-RunPythonScript`'
note: 'Use `_-ScriptEditor _Run "<file>"`, Script Editor runs a `.py` file on the shared CPython'
