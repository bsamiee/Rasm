# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-assets-on-development-dependency
language: xml
severity: error
rule:
    pattern: _REFERENCE
    # Analyzers, source generators, and build tools, the development dependencies with no runtime asset a consumer needs
    matches:
        msbuild-package-reference:
            id:
                regex: "(?i)^[\"']([A-Za-z0-9.]+\\.(Analyzers?|SourceGenerators?|Generators?)|Riok\\.Mapperly|Grpc\\.Tools|MessagePackAnalyzer|Microsoft\\.CodeAnalysis\\.CSharp|Microsoft\\.CodeAnalysis\\.Analyzers|MinVer|Generator\\.Equals)[\"']$"
    not:
        any:
            - all:
                - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^PrivateAssets$'}, value: {regex: '(?i)^["'']\s*all\s*["'']$'}}}}}
                - not:
                    has:
                        kind: content
                        has:
                            matches: {msbuild-element: {name: {regex: '^PrivateAssets$'}}}
                            not: {has: {kind: content, regex: '(?i)^\s*all\s*$'}}
            - has:
                kind: content
                has:
                    kind: element
                    nthChild: {position: 1, reverse: true, ofRule: {matches: {msbuild-element: {name: {regex: '^PrivateAssets$'}}}}}
                    all:
                        - has: {kind: content, regex: '(?i)^\s*all\s*$'}
                        - not: {has: {kind: STag, has: {kind: Attribute}}}
transform:
    FIXED: rewrite($REFERENCE, rewriters=[add-metadata, remove-metadata])
fix: $FIXED
rewriters:
    - id: remove-metadata
      rule:
        any:
            - kind: Attribute
              has: {kind: Name, regex: '^PrivateAssets$'}
              inside: {matches: msbuild-tag, inside: {pattern: _REFERENCE}}
            - matches: {msbuild-element: {name: {regex: '^PrivateAssets$'}}}
              inside: {kind: content, inside: {pattern: _REFERENCE}}
      fix: ''
    - id: add-metadata
      rule:
        matches: msbuild-tag
        pattern: _TAG
        has: {kind: Name, regex: '^PackageReference$'}
      transform:
        STRIPPED: rewrite($TAG, rewriters=[remove-metadata])
        FIXED:
            replace:
                source: $STRIPPED
                replace: '\s*(/?>)$'
                by: ' PrivateAssets="all"$1'
      fix: $FIXED
message: The analyzer, generator, or build tool is a development dependency and flows to every consumer without PrivateAssets
note: Add PrivateAssets="all", the package stays in the compiling project
