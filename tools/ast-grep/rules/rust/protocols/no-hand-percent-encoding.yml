# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-hand-percent-encoding
language: rust
severity: error
rule:
    kind: macro_invocation
    pattern: $ENCODE
    all:
        - matches: {rust-std-macro: {name: {regex: '^(format|format_args|write|writeln)$'}}}
        - has: {kind: token_tree, has: {kind: string_literal, regex: '%\{\w*:02[xX]\}'}}
message: '`$ENCODE` percent-encodes a byte by hand'
note: 'Encode query values through `url::form_urlencoded::byte_serialize(<bytes>)` or `Url::query_pairs_mut().append_pair`, and path parts through `Url::path_segments_mut().push`, each applies the encode set its URL component requires'
