# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-error-heritage
language: tsx
utils:
    error-module:
        matches: {effect-module: {name: {regex: '\b(Data|Schema)$'}}}
    error-constructor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(Error|TaggedError)$'}
            - has: {field: object, matches: error-module}
rule:
    kind: extends_clause
    has:
        field: value
        any:
            - matches: error-constructor
            - kind: call_expression
              has:
                field: function
                any:
                    - matches: error-constructor
                    - {kind: call_expression, has: {field: function, matches: error-constructor}}
