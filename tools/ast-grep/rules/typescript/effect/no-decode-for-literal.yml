# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-decode-for-literal
language: tsx
severity: error
utils:
    codec:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, pattern: $FN, regex: '^(decode|encode)(Unknown)?(Sync|Exit|Option|Result|Effect|Promise)$'}
                - has: {field: object, pattern: $M, matches: {effect-module: {name: {regex: '\bSchema$'}}}}
rule:
    kind: call_expression
    all:
        - has: {field: arguments, has: {nthChild: 1, matches: typescript-literal-expression}}
        - any:
            - has: {field: function, matches: codec}
            - all:
                - has: {field: function, kind: identifier, pattern: $CODEC}
                - inside: {kind: program, stopBy: end, has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $CODEC}}, {has: {field: value, matches: codec}}]}}
            - all:
                - has: {field: function, matches: effect-pipe-function}
                - has: {field: arguments, has: {nthChild: 2, matches: codec}}
message: '`$M.$FN` runs over a literal the compiler checks'
note: 'Write the literal as `typeof <schema>.Type`, `Encoded` for an encode, in the success constructor of the codec result type (`Option.some`)'
