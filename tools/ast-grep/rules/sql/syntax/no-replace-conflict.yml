# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: sql
severity: error
rule:
    kind: insert_statement, update_statement, column_constraint, table_constraint, alter_table_statement
    all:
        - has: {regex: '(?i-u)^replace$', not: {pattern: $_}}
        - pattern: $NODE
message: '`$NODE` can delete conflicting rows or substitute defaults for NULL through `REPLACE`'
note: 'Handle conflicts explicitly while preserving trigger, default, and foreign key behavior'
