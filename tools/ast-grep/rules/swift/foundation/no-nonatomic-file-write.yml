# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nonatomic-file-write
language: swift
severity: error
utils:
    data-receiver:
        any:
            - pattern: 'Data($$$ARGS)'
            - pattern: '$OWNER.encode($$$ARGS)'
            - pattern: '$OWNER.data($$$ARGS)'
            - pattern: '$OWNER.archivedData($$$ARGS)'
    data-binding:
        any:
            - kind: property_declaration
              all:
                - has: {field: name, has: {field: bound_identifier, pattern: $R}}
                - has: {kind: type_annotation, has: {field: name, regex: '^Data\??$'}}
            - kind: parameter
              all:
                - has: {kind: simple_identifier, pattern: $R}
                - has: {kind: 'user_type, optional_type', regex: '^Data\??$'}
            - kind: 'if_statement, guard_statement'
              all:
                - has: {field: bound_identifier, pattern: $R}
                - has: {kind: type_annotation, has: {field: name, regex: '^Data$'}}
    atomic-option:
        regex: '^\.(atomic|withoutOverwriting)$'
rule:
    any:
        - pattern: $ATOMICALLY_FALSE
          any:
            - pattern: '$R.write(to: $U, atomically: false, encoding: $E)'
            - pattern: '$R.write(toFile: $U, atomically: false, encoding: $E)'
            - pattern: '$R.write(to: $U, atomically: false)'
            - pattern: '$R.write(toFile: $U, atomically: false)'
        - pattern: $WITH_OPTIONS
          any:
            - pattern: '$R.write(to: $U, options: $O)'
            - pattern: '$R.write(toFile: $U, options: $O)'
          has:
            kind: call_suffix
            has:
                kind: value_arguments
                has:
                    kind: value_argument
                    all:
                        - has: {field: name, regex: '^options$'}
                        - has:
                            field: value
                            any:
                                - kind: array_literal
                                  not: {has: {matches: atomic-option}}
                                - kind: prefix_expression
                                  not: {matches: atomic-option}
        - pattern: $WITHOUT_OPTIONS
          all:
            - any:
                - pattern: '$R.write(to: $U)'
                - pattern: '$R?.write(to: $U)'
            - any:
                - has: {kind: navigation_expression, has: {field: target, stopBy: end, matches: data-receiver}}
                - inside: {stopBy: end, kind: 'function_declaration, init_declaration, computed_property, lambda_literal', has: {stopBy: end, matches: data-binding}}
transform:
    ATOMICALLY: {replace: {source: $ATOMICALLY_FALSE, replace: 'atomically: false', by: 'atomically: true'}}
    FILLED: {replace: {source: $WITH_OPTIONS, replace: 'options: \[(\s*[^\]\s])', by: 'options: [.atomic, $1'}}
    EMPTY: {replace: {source: $FILLED, replace: 'options: \[\]', by: 'options: [.atomic]'}}
    SINGLE: {replace: {source: $EMPTY, replace: 'options: (\.[a-zA-Z]\w*)', by: 'options: [.atomic, $1]'}}
    APPENDED: {replace: {source: $WITHOUT_OPTIONS, replace: '(?s)^(.*?)(,?)(\s*)\)$', by: '${1}, options: [.atomic]${2}${3})'}}
fix: '$ATOMICALLY$SINGLE$APPENDED'
message: '`$R.write` truncates the file in place and exposes partial content until writing ends'
note: 'Pass `.atomic` in the `options:` of `Data.write` or `atomically: true` to `String.write` and `NSData.write`'
