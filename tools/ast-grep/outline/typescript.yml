id: typescript-class-method
language: tsxlang
role: member
parentRuleIds: [typescript-class, typescript-class-value, typescript-default-class]
symbolType: method
utils:
    declaration-scope:
        any:
            - kind: program
            - kind: statement_block
              inside:
                any:
                    - kind: internal_module, module
                    - kind: ambient_declaration
                      has: {regex: '^global$', not: {pattern: $_}}
    class-owner:
        any:
            - kind: class_declaration, abstract_class_declaration
              inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
            - kind: class
              any:
                  - inside:
                        kind: variable_declarator
                        field: value
                        stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}
                        inside:
                            kind: lexical_declaration, variable_declaration, using_declaration
                            inside: {matches: declaration-scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}}
                  - inside:
                        kind: export_statement
                        field: value
                        stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression'}}
                        inside: {kind: program}
rule:
    kind: abstract_method_signature, method_signature, method_definition
    pattern: $DECLARATION
    inside: {kind: class_body, inside: {matches: class-owner}}
    has: {field: name, pattern: $NAME}
    not: {has: {field: name, regex: '^constructor$'}}
rewriters:
    - id: body
      rule:
          kind: statement_block
          inside:
              kind: method_definition
              field: body
              inside: {kind: class_body, inside: {matches: class-owner}}
      fix: ''
    - id: nested-class
      rule: {kind: class_body}
      fix: '{…}'
    - id: nested-function
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function, arrow_function, method_definition', field: body}}
      fix: '{…}'
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, nested-class, nested-function]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic:
    not:
        any:
            - has: {kind: accessibility_modifier, regex: '^(private|protected)$'}
            - has: {field: name, kind: private_property_identifier}

