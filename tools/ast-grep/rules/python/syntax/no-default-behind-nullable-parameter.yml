# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-behind-nullable-parameter
language: python
severity: error
utils:
    local-binding:
        any:
            - matches: {python-parameter: {name: {pattern: $ROOT}}}
              inside: {kind: "parameters, lambda_parameters"}
            - kind: assignment, augmented_assignment, for_statement, for_in_clause
              has: {field: left, kind: identifier, pattern: $ROOT}
    local-shadow:
        inside:
            kind: function_definition, lambda
            stopBy: end
            has: {matches: local-binding, stopBy: {kind: "function_definition, lambda, class_definition"}}
    class-shadow:
        inside: {kind: class_definition, stopBy: end, has: {field: name, pattern: $ROOT}}
    module-binding:
        any:
            - kind: expression_statement
              has: {kind: assignment, has: {field: left, kind: identifier, pattern: $ROOT}}
            - kind: import_statement
              has: {kind: identifier, pattern: $ROOT, stopBy: end}
            - kind: import_from_statement
              has: {kind: identifier, pattern: $ROOT, stopBy: end}
            - kind: function_definition
              has: {field: name, pattern: $ROOT}
            - kind: class_definition
              has: {field: name, pattern: $ROOT}
    nullable-type:
        kind: type
        any:
            - has: {kind: binary_operator, has: {kind: none, stopBy: {not: {kind: binary_operator}}}}
            - has: {kind: generic_type, has: {kind: identifier, regex: '^Optional$'}}
            - has:
                kind: generic_type
                all:
                    - has: {kind: identifier, regex: '^Union$'}
                    - has: {kind: type_parameter, has: {kind: type, has: {kind: none}}}
            - has: {kind: subscript, has: {field: value, regex: '\.Optional$'}}
            - has:
                kind: subscript
                all:
                    - has: {field: value, regex: '\.Union$'}
                    - has: {kind: none}
            - has: {kind: string, has: {kind: string_content, regex: '\bNone\b'}}
    signature-default:
        any:
            - kind: string
              not: {has: {kind: interpolation}}
            - kind: integer
            - kind: float
            - kind: 'true'
            - kind: 'false'
            - kind: unary_operator
              has: {kind: 'integer, float'}
            - kind: tuple
              not: {has: {pattern: $_}}
            - kind: identifier
              pattern: $ROOT
              all:
                - not: {matches: local-shadow}
                - not: {matches: class-shadow}
                - inside: {kind: module, stopBy: end, has: {matches: module-binding}}
            - kind: attribute
              all:
                - has: {field: object, stopBy: end, kind: identifier, pattern: $ROOT}
                - not: {matches: local-shadow}
                - not: {matches: class-shadow}
                - inside: {kind: module, stopBy: end, has: {matches: module-binding}}
rule:
    any:
        - kind: typed_default_parameter
          all:
            - has: {field: name, pattern: $P}
            - has: {field: value, kind: none}
        - kind: typed_parameter
          all:
            - has: {kind: identifier, pattern: $P}
            - has: {field: type, matches: nullable-type}
        - kind: default_parameter
          all:
            - has: {field: name, pattern: $P}
            - has: {field: value, kind: none}
    inside:
        kind: function_definition
        stopBy: {matches: python-function-boundary}
        has:
            field: body
            has:
                stopBy: {matches: python-function-boundary}
                any:
                    - pattern: $P if $P is not None else $D
                    - pattern: $D if $P is None else $P
                    - pattern: $P or $D
                    - kind: if_statement
                      all:
                        - has: {field: condition, pattern: $P is None}
                        - has: {field: consequence, has: {kind: expression_statement, has: {pattern: $P = $D}}, not: {has: {nthChild: 2}}}
                        - not: {has: {kind: "else_clause, elif_clause"}}
constraints:
    D: {matches: signature-default}
message: 'Parameter `$P` accepts None and the body resolves None to `$D`'
note: 'Declare the default in the signature, an explicit None argument then stays None'
