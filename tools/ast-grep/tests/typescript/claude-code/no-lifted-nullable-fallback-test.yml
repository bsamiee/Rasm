id: no-lifted-nullable-fallback
valid:
    - "const bound = e.timeout ?? 0;"
    - "const note = compact.note ?? compact.message;"
    - "const field = getOrElse(() => '')(fromPredicate(isString)(fields[name]));"
    - "const start = getOrElse(() => 0)(map((word: Word) => word.start)(fromNullable(leaf[0])));"
    - "const index = getOrElse(() => leaf.length)(liftPredicate<number>((found) => found >= 0)(leaf.indexOf(word)));"
    - "const held = getOrElse(() => { return derived(); })(fromNullable(row.value));"
    - "const rows = getOrElse<Option<string>>(none)(await forEach(read)(fromNullable(path)));"
    - "const text = fromNullable(row.text).match<string>({ some: (value) => value, none: () => '' });"
invalid:
    - "const bound = getOrElse(() => 0)(fromNullable(e.timeout));"
    - "const note = getOrElse(() => compact.message)(fromNullable(compact.note));"
    - "const section = getOrElse(() => '')(fromNullable(reply.section));"
    - "const largest = Math.min(cap, getOrElse(() => cap)(fromNullable(e.timeout)));"
    - "const slow = getOrElse(() => 0)(fromNullable(e.timeout)) < MAX;"
    - "const note = getOrElse(fallback)(fromNullable(row.note));"
