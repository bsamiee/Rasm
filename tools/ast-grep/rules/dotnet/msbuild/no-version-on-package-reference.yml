# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-version-on-package-reference
language: xml
severity: error
rule:
    pattern: _REFERENCE
    all:
        - matches: {msbuild-element: {name: {regex: '^PackageReference$'}}}
        - any:
            - has: {matches: msbuild-tag, has: {kind: Attribute, has: {kind: Name, regex: '^(Version|VersionOverride)$'}}}
            - has: {kind: content, has: {matches: {msbuild-element: {name: {regex: '^(Version|VersionOverride)$'}}}}}
transform:
    STRIPPED: rewrite($REFERENCE, rewriters=[remove-metadata])
fix: $STRIPPED
rewriters:
    - id: remove-metadata
      rule:
        any:
            - kind: Attribute
              has: {kind: Name, regex: '^(Version|VersionOverride)$'}
              inside: {matches: msbuild-tag, inside: {pattern: _REFERENCE}}
            - matches: {msbuild-element: {name: {regex: '^(Version|VersionOverride)$'}}}
              inside: {kind: content, inside: {pattern: _REFERENCE}}
      fix: ''
message: The PackageReference names a version, the PackageVersion row holds it and VersionOverride is disabled
note: Name the package id alone on the reference
