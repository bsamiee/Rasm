# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-random-uuid-v4
language: tsx
severity: error
rule:
    kind: member_expression
    pattern: $MEMBER
    all:
        - has: {field: property, regex: '^uuidV4(Unsafe)?$', pattern: $NAME}
        - has: {field: object, pattern: $RANDOM}
        - inside: {kind: call_expression, field: function}
transform:
    ORDERED: replace($NAME, replace='V4', by='V7')
fix: $RANDOM.$ORDERED
message: '`$MEMBER` generates identifiers with no time order'
note: 'Call the `uuidV7` form of the same `SecureRandom` member'
