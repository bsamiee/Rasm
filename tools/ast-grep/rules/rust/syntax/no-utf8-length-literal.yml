# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-utf8-length-literal
language: rust
severity: error
utils:
    utf8-call:
        kind: call_expression
        has: {field: function, kind: field_expression, has: {field: field, regex: '^encode_utf8$'}}
    utf16-call:
        kind: call_expression
        has: {field: function, kind: field_expression, has: {field: field, regex: '^encode_utf16$'}}
    inline-utf8:
        inside: {kind: reference_expression, inside: {kind: arguments, inside: {matches: utf8-call}}}
    inline-utf16:
        inside: {kind: reference_expression, inside: {kind: arguments, inside: {matches: utf16-call}}}
    bound-utf8:
        inside:
            kind: let_declaration
            has: {field: pattern, pattern: $BUF}
            precedes: {stopBy: {kind: let_declaration, has: {field: pattern, pattern: $BUF}}, has: {stopBy: end, matches: utf8-call, has: {field: arguments, has: {kind: reference_expression, has: {pattern: $BUF}}}}}
    bound-utf16:
        inside:
            kind: let_declaration
            has: {field: pattern, pattern: $BUF}
            precedes: {stopBy: {kind: let_declaration, has: {field: pattern, pattern: $BUF}}, has: {stopBy: end, matches: utf16-call, has: {field: arguments, has: {kind: reference_expression, has: {pattern: $BUF}}}}}
rule:
    kind: integer_literal
    pattern: $LEN
    inside: {kind: array_expression, field: length}
    any:
        - all:
            - regex: '^4(_?usize)?$'
            - inside: {kind: array_expression, any: [{matches: inline-utf8}, {matches: bound-utf8}]}
            - pattern: $UTF8
        - all:
            - regex: '^2(_?usize)?$'
            - inside: {kind: array_expression, any: [{matches: inline-utf16}, {matches: bound-utf16}]}
            - pattern: $UTF16
transform:
    UTF8_OUT: {replace: {source: $UTF8, replace: '^[\s\S]+$', by: 'char::MAX_LEN_UTF8'}}
    UTF16_OUT: {replace: {source: $UTF16, replace: '^[\s\S]+$', by: 'char::MAX_LEN_UTF16'}}
fix: $UTF8_OUT$UTF16_OUT
message: '`$LEN` restates the longest encoding of one `char`'
note: 'Write `char::MAX_LEN_UTF8` as the length of an `encode_utf8` buffer and `char::MAX_LEN_UTF16` as the length of an `encode_utf16` buffer (Rust 1.93)'
