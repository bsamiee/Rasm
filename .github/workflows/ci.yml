name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    actions: read

env:
    MSBUILDDISABLENODEREUSE: '1'
    NX_PARALLEL: 100%

defaults:
    run:
        shell: bash

jobs:
    affected:
        name: Affected projects
        runs-on: [self-hosted, host]
        timeout-minutes: 30
        outputs:
            base: ${{ steps.shas.outputs.base }}
            head: ${{ steps.shas.outputs.head }}
            engines: ${{ steps.unreal.outputs.engines }}
            unreal: ${{ steps.listed.outputs.unreal }}
            browser: ${{ steps.listed.outputs.browser }}
            image: ${{ steps.listed.outputs.image }}
        env:
            GH_TOKEN: &github ${{ github.token }}
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: &server ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: &token ${{ github.event_name == 'push' && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - id: root
              run: |-
                  root="$(git rev-list --max-parents=0 HEAD)"
                  printf "sha=%s\n" "${root}" >> "${GITHUB_OUTPUT}"
            - id: shas
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  fallback-sha: ${{ steps.root.outputs.sha }}
            - &tools
              uses: ./.github/actions/tools
            - run: nx sync:check
            - run: nx conformance:check
            - id: unreal
              uses: ./.github/actions/unreal
            - id: listed
              run: |-
                  unreal="$(nx show projects --affected --exclude='*,!tag:host:unreal' --json)"
                  browser="$(nx show projects --affected --exclude='*,!tag:host:browser' --json)"
                  version="$(jq --raw-output .version infra/node_modules/@playwright/test/package.json)"
                  printf "%s\n" "unreal=${unreal}" "browser=${browser}" "image=ghcr.io/${GITHUB_REPOSITORY,,}/playwright:${version}" >> "${GITHUB_OUTPUT}"

    linux:
        name: Linux
        needs: affected
        runs-on: [self-hosted, host]
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: &base ${{ needs.affected.outputs.base }}
            NX_HEAD: &head ${{ needs.affected.outputs.head }}
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - &stale
              run: rm -rf .artifacts/cmake/*/*.log .artifacts/dotnet/test .artifacts/playwright .artifacts/vitest
            - *checkout
            - *tools
            - run: nx affected --targets=check,test,build --configuration=ci --exclude='tag:os:*,!tag:os:linux,!tag:os:all,tag:host:rhino,tag:host:browser,tag:host:unreal'
            - &reports
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.job }}-reports
                  if-no-files-found: ignore
                  path: |-
                      .artifacts/cmake/*/*.log
                      .artifacts/dotnet/test
                      .artifacts/playwright
                      .artifacts/vitest

    browser:
        name: Browser
        needs: affected
        if: ${{ needs.affected.outputs.browser != '[]' }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        permissions:
            contents: read
            packages: read
        container:
            image: ${{ needs.affected.outputs.image }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ github.token }}
            options: --init --ipc=host
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - *stale
            - *checkout
            - *tools
            - run: nx affected --targets=check,test,build,pack --exclude='*,!tag:host:browser'
            - *reports

    macos:
        name: macOS
        needs: affected
        runs-on: xcode-27
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        steps:
            - *checkout
            - id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |-
                      .cache/nx/workspace-data
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                  key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'products/developer/nx/**') }}
                  restore-keys: nx-${{ runner.os }}-
            - &xcode
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest-stable
            - *tools
            - uses: ./.github/actions/signing
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:darwin,!tag:os:all,tag:host:rhino'
            - if: ${{ !cancelled() && steps.graph.outcome == 'success' && steps.graph.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: ${{ steps.graph.outputs.cache-primary-key }}
            - *reports

    files:
        name: Files
        needs: affected
        runs-on: xcode-27
        timeout-minutes: 30
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
        steps:
            - *checkout
            - *xcode
            - *tools
            - run: nx run-many --targets=codegen
            - run: hk check --from-ref "${NX_BASE}" --to-ref "${NX_HEAD}"

    windows:
        name: Windows
        needs: affected
        runs-on: windows-2025
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - *checkout
            - *tools
            - id: listed
              run: |-
                  rhino="$(nx show projects --affected --exclude='*,!tag:host:rhino' --json)"
                  printf "rhino=%s\n" "${rhino}" >> "${GITHUB_OUTPUT}"
            - id: rhino
              if: ${{ steps.listed.outputs.rhino != '[]' }}
              run: |-
                  major="$(yq -p xml -oy '.Project.PropertyGroup[] | select(.+@Label == "Rhino") | .RhinoVersion | split(".") | .[0]' Directory.Packages.props)"
                  printf "major=%s\n" "${major}" >> "${GITHUB_OUTPUT}"
            - uses: mcneel/setup-rhino3d@095a5ff63cdb7dc8383e229fc40ffa779915b0af # v4.0.0
              if: ${{ steps.listed.outputs.rhino != '[]' }}
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  major-version: ${{ steps.rhino.outputs.major }}
            - run: nx affected --targets=test --configuration=headless --exclude='*,!tag:os:win32,!tag:host:rhino'
              env:
                  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}
            - *reports

    unreal:
        name: Unreal Engine ${{ matrix.engine }}
        needs: affected
        if: ${{ needs.affected.outputs.unreal != '[]' && needs.affected.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.affected.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: 'false'
        steps:
            - *checkout
            - *tools
            - run: nx run-many --targets=check,test,build --projects="${PROJECTS}"
              env:
                  PROJECTS: ${{ join(fromJSON(needs.affected.outputs.unreal), ',') }}
