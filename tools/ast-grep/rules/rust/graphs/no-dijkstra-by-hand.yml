# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-dijkstra-by-hand
language: rust
severity: error
utils:
    relax-write:
        any:
            - kind: assignment_expression
              all:
                - has: {field: left, kind: index_expression}
                - has: {field: right, pattern: $ND}
            - kind: call_expression
              pattern: $_.insert($_, $ND)
rule:
    kind: call_expression
    all:
        - pattern: $H.push($$$)
        - has: {field: arguments, has: {stopBy: end, kind: call_expression, has: {field: function, regex: '^((std|core)::cmp::)?Reverse$'}}}
        - inside:
            kind: if_expression
            stopBy: {kind: 'closure_expression, function_item, for_expression, while_expression, loop_expression'}
            all:
                - has: {field: consequence, has: {stopBy: end, matches: relax-write}}
                - has: {field: condition, has: {stopBy: end, pattern: $ND}}
        - has: {field: arguments, has: {stopBy: end, pattern: $ND}}
        - inside:
            kind: 'while_expression, loop_expression'
            stopBy: {kind: 'closure_expression, function_item'}
            has: {stopBy: end, kind: call_expression, pattern: $H.pop()}
message: '`$H` relaxes distances through a min-heap in a hand-written Dijkstra''s algorithm'
note: 'Hold the graph as a `petgraph::graphmap::DiGraphMap` or `petgraph::Graph` and call `petgraph::algo::dijkstra(&graph, start, goal, |edge| *edge.weight())`, or `petgraph::algo::astar` when a goal and an admissible estimate prune the search and the path is needed'
