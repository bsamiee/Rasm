# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    removal:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(removeEventListener|removeListener|off)$'}}
            - has: {field: function, has: {field: object, pattern: $TARGET}}
            - has: {field: arguments, has: {nthChild: 1, pattern: $EVENT}}
rule:
    kind: call_expression
    any:
        - all:
            - matches: removal
            - has: {field: arguments, has: {nthChild: 2, kind: 'arrow_function, function_expression'}}
        - all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(addEventListener|addListener|prependListener|on|once)$'}}
            - has: {field: function, has: {field: object, matches: typescript-global-reference, regex: '^(globalThis|window|self|document|process)(?-u:\b)', pattern: $TARGET}}
            - has: {field: arguments, has: {nthChild: 1, pattern: $EVENT}}
            - has: {field: arguments, has: {nthChild: 2, pattern: $HANDLER}}
            - not:
                has:
                    field: arguments
                    has:
                        nthChild: 3
                        any:
                            - not: {kind: 'true, false, object'}
                            - has: {any: [{kind: pair, has: {field: key, regex: '^signal$'}}, {kind: shorthand_property_identifier, regex: '^signal$'}, {kind: spread_element}]}
            - inside: {stopBy: end, matches: typescript-function-boundary}
            - not: {inside: {kind: program, stopBy: end, has: {stopBy: end, matches: removal, has: {field: arguments, has: {nthChild: 2, pattern: $HANDLER, not: {kind: 'arrow_function, function_expression'}}}}}}
message: '`$TARGET` keeps the `$EVENT` listener attached'
note: 'Register with `{ signal }` and abort its `AbortController` when its owner closes, or remove the listener by its added function reference'
