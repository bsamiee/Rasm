# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-process-entry-by-hand
language: rust
severity: error
ignores: ['libs/rust/cli/command/**', 'tools/dylint/examples/**']
utils:
    runtime-build:
        any:
            - kind: scoped_identifier
              regex: '^(::)?(tokio::)?runtime::((Local)?Runtime::new|Builder::new_(multi|current)_thread)$'
            - kind: scoped_identifier
              all:
                - regex: '^((Local)?Runtime::new|Builder::new_(multi|current)_thread)$'
                - has: {field: path, matches: {rust-imported-name: {source: {regex: '\btokio\b'}, name: {regex: '^((Local)?Runtime|Builder)$'}}}}
            - kind: identifier
              inside: {kind: token_tree}
              any:
                - {regex: '^new$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^(Local)?Runtime$'}}}
                - {regex: '^new_(multi|current)_thread$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^Builder$'}}}
            - kind: 'identifier, scoped_identifier'
              inside: {kind: attribute}
              any:
                - regex: '^(::)?tokio::main$'
                - matches: {rust-imported-name: {source: {regex: '\btokio\b'}, name: {regex: '^main$'}}}
    signal-listener:
        any:
            - kind: scoped_identifier
              regex: '^(::)?((tokio::)?signal::)?(unix::signal|(windows::)?ctrl_c|windows::ctrl_(break|close|logoff|shutdown))$'
            - kind: identifier
              inside: {kind: token_tree}
              any:
                - {regex: '^signal$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^unix$'}}}
                - {regex: '^ctrl_c$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^(signal|windows)$'}}}
                - {regex: '^ctrl_(break|close|logoff|shutdown)$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^windows$'}}}
            - matches: {rust-imported-name: {source: {regex: '\btokio\b'}, name: {regex: '^(signal|ctrl_(c|break|close|logoff|shutdown))$'}}}
    completion-script:
        any:
            - kind: scoped_identifier
              regex: '(^|::)CompleteEnv::with_factory$|^(::)?(clap_complete::)?((aot|generator)::)?generate(_to)?$'
            - matches: {rust-imported-name: {source: {regex: '\bclap_complete\b'}, name: {regex: '^generate(_to)?$'}}}
    man-page:
        any:
            - kind: scoped_identifier
              regex: '^(::)?clap_mangen::(Man::new|generate_to)$'
            - kind: scoped_identifier
              all:
                - regex: '^Man::new$'
                - has: {field: path, matches: {rust-imported-name: {source: {regex: '\bclap_mangen\b'}, name: {regex: '^Man$'}}}}
            - matches: {rust-imported-name: {source: {regex: '\bclap_mangen\b'}, name: {regex: '^generate_to$'}}}
rule:
    kind: 'identifier, scoped_identifier'
    pattern: $SITE
    any:
        - matches: runtime-build
        - matches: signal-listener
        - matches: completion-script
        - matches: man-page
    not:
        any:
            - matches: rust-test-scope
            - inside: {kind: scoped_identifier}
            - inside: {kind: use_declaration, stopBy: end}
message: '`$SITE` builds a runtime, signal listener, completion script, or man page outside `rasm-command`'
note: 'Run the entry through `rasm_command::run` and read `Process::signals`'
