# --- [PROJECT] --------------------------------------------------------------------------

[project]
name = "rasm-compute"
version = "0.1.0"
description = "Numerical solvers, samplers, and analysis kernels for the Rasm estate."
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

# --- [BUILD] ----------------------------------------------------------------------------

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]  # Flat layout, no src/: the package sits at the project root, and scoped sys.path entries keep the editable install unshadowed.
module-root = ""
module-name = "rasm.compute"
namespace = true
