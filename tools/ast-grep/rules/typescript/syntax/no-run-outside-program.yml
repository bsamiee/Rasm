# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores: ['**/main.ts', '**/main.tsx', 'plugins/function-hooks/server.ts', 'plugins/function-hooks/codex.ts']
rule:
    any:
        - {pattern: runMain, not: {inside: {kind: import_specifier}}}
        - {kind: property_identifier, regex: '^runMain$', inside: {kind: member_expression, field: property}}
    not:
        inside:
            stopBy: end
            field: consequence
            kind: if_statement
            has: {field: condition, kind: parenthesized_expression, has: {pattern: import.meta.main}}
            inside: {kind: program}
message: '`runMain` runs outside a program entry point'
note: 'Call `runMain` in `main.ts` or inside a top-level `if (import.meta.main)` block'
