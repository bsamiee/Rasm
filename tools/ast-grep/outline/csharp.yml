    TRIMMED: {replace: {source: $DECLARATION, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}])+$|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}]+(;)', by: '$1'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}]*\n[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}]*', by: ' '}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic:
    all:
        - matches: public
        - not: {inside: {stopBy: end, kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration, union_declaration, enum_declaration', inside: {kind: declaration_list, inside: {kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration, union_declaration'}}, not: {matches: public}}}
