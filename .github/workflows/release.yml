name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/native-cache
        with:
          rid: osx-arm64
      - run: pnpm exec nx run-many -t pack
      - run: pnpm exec nx run-many -t build
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
