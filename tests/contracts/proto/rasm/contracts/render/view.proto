syntax = "proto3";

package rasm.contracts.render;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "rasm/contracts/spatial/vector.proto";

message ViewCameraWire {
  message Frame {
    rasm.contracts.spatial.Point3 eye = 1 [(buf.validate.field).required = true];
    rasm.contracts.spatial.Point3 target = 2 [(buf.validate.field).required = true];
    rasm.contracts.spatial.UnitDirection3 up = 3 [(buf.validate.field).required = true];
  }

  message Perspective {
    double field_of_view_degrees = 1 [(buf.validate.field).double = {
      finite: true
      gt: 0
      lt: 180
    }];
  }

  message Orthographic {
    double view_height = 1 [(buf.validate.field).double = {
      gt: 0
      finite: true
    }];
    double retained_field_degrees = 2 [(buf.validate.field).double = {
      finite: true
      gt: 0
      lt: 180
    }];
  }

  // OpenXR Fovf angles are signed radians off the view axis: left/down negative, right/up positive.
  message Asymmetric {
    double angle_left_radians = 1 [(buf.validate.field).double = {
      finite: true
      gt: -1.5707963267948966
      lt: 0
    }];
    double angle_right_radians = 2 [(buf.validate.field).double = {
      finite: true
      gt: 0
      lt: 1.5707963267948966
    }];
    double angle_up_radians = 3 [(buf.validate.field).double = {
      finite: true
      gt: 0
      lt: 1.5707963267948966
    }];
    double angle_down_radians = 4 [(buf.validate.field).double = {
      finite: true
      gt: -1.5707963267948966
      lt: 0
    }];
  }

  Frame frame = 1 [(buf.validate.field).required = true];
  oneof lens {
    option (buf.validate.oneof).required = true;

    Perspective perspective = 2;
    Orthographic orthographic = 3;
    Asymmetric asymmetric = 4;
  }
}

message SectionBoxWire {
  rasm.contracts.spatial.Point3 min = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.Point3 max = 2 [(buf.validate.field).required = true];
}

message VisibilityOverrideWire {
  string element_id = 1 [(buf.validate.field).string.min_len = 1];
  bool visible = 2;
  double transparency = 3 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lte: 1
  }];
  optional uint32 color_argb = 4;
}

message ViewMeasurementPointWire {
  bytes source_key = 1 [(buf.validate.field).bytes.len = 16];
  uint32 sample_index = 2;
  rasm.contracts.spatial.Point3 position = 3 [(buf.validate.field).required = true];
}

message ViewMeasurementWire {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  repeated ViewMeasurementPointWire vertices = 2 [(buf.validate.field).repeated.max_items = 65536];
  double total_meters = 3 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  repeated double angles_degrees = 4 [(buf.validate.field).repeated = {
    max_items: 65536
    items: {
      double: {finite: true}
    }
  }];
}

message ViewpointWire {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  uint32 version = 2;
  ViewCameraWire camera = 3 [(buf.validate.field).required = true];
  repeated VisibilityOverrideWire overrides = 4 [(buf.validate.field).repeated.max_items = 65536];
  repeated string selection = 5 [(buf.validate.field).repeated.max_items = 65536];
  repeated ViewMeasurementWire measurements = 6 [(buf.validate.field).repeated.max_items = 65536];
  google.protobuf.Timestamp at = 7;
  optional SectionBoxWire section = 8;
}
