# --- [PACKAGES] -------------------------------------------------------------------------
packages = [
    { id = "Rhino-MCP-Platform", source = "bundled", commands = { STANDARD = ["AIPanel"] } }, # Rhino's bundled AI panel, MCP router, and document listener
