        - matches: {effect-module-member: {module: {regex: '(?-u:\b)SchemaBinary$'}, member: {regex: '^(duplex)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)SchemaGetter$'}, member: {regex: '^(compose|map|run)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)SchemaTransformation$'}, member: {regex: '^(composeTransformation)$'}}}
