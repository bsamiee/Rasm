# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-cfg-attribute
language: rustlang
rule:
    kind: attribute_item
    has: {kind: attribute, has: {nthChild: 1, kind: identifier, regex: '^cfg$'}}
    not: {regex: '^#\[\p{White_Space}*cfg\p{White_Space}*\(\p{White_Space}*(all\p{White_Space}*\(\p{White_Space}*\)|any\p{White_Space}*\(\p{White_Space}*\)|true|false|not\p{White_Space}*\(\p{White_Space}*(all|any)\p{White_Space}*\(\p{White_Space}*\)\p{White_Space}*\))\p{White_Space}*\)\p{White_Space}*\]$'}
