id: no-underscored-attribute
valid:
    - '@inline(never) func f() {}'
    - '@inlinable func f() {}'
    - '@inline(always) func f() {}'
invalid:
    - '@inline(__always) func f() {}'
    - '@_alwaysEmitIntoClient public func g() {}'
    - |
      class Base {
          @inline(__always) func f() {}
      }
    - |
      @inline(__always) func count(_ n: Int) -> Int {
          n == 0 ? 0 : count(n - 1)
      }
