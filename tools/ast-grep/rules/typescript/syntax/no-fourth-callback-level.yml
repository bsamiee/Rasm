# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-callback-level
language: tsx
severity: error
utils:
    # A function under an argument list that declares a parameter, an initializer, a curried return, a pair value, and a thunk add no level
    callback:
        all:
            - any:
                  - kind: arrow_function
                  - kind: function_expression
                  - kind: generator_function
            - inside: {kind: arguments}
            - any:
                  - has: {field: parameters, has: {kind: required_parameter}}
                  - has: {field: parameter, kind: identifier}
rule:
    matches: callback
    inside:
        matches: callback
        stopBy: end
        inside:
            matches: callback
            stopBy: end
            inside:
                matches: callback
                stopBy: end
    # The innermost callback of a chain reports once, an outer one holds a deeper callback
    not: {has: {matches: callback, stopBy: end}}
message: The callback with a parameter sits four callback levels deep and the reader holds four scopes
note: Flatten the chain into data-last steps in one `pipe`, a `yield*` per dependent step in `Effect.gen`, or a `Match` at the call site
