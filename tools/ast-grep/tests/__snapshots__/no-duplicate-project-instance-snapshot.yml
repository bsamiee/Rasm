      start: 9
      end: 45
    - source: Properties="$(PublishProperties)"
      style: secondary
      start: 64
      end: 97
    - source: <MSBuild Projects="$(MSBuildProjectFullPath)" Targets="Publish" Properties="$(PublishProperties)" />
      style: secondary
      start: 0
      end: 100
