# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-stop-iteration-default
language: python
severity: error
utils:
    lone:
        kind: block
        not: {has: {nthChild: 2}}
    next-function:
        matches: {python-unparenthesized: {value: {matches: {python-builtin-name: {name: {regex: '^next$'}}}, not: {has: {stopBy: end, kind: call}}}}}
    anext-function:
        matches: {python-unparenthesized: {value: {matches: {python-builtin-name: {name: {regex: '^anext$'}}}, not: {has: {stopBy: end, kind: call}}}}}
    exception-name:
        matches: {python-unparenthesized: {value: {matches: builtins-stop-iteration, not: {has: {stopBy: end, kind: call}}}}}
    exception:
        any:
            - matches: exception-name
            - kind: tuple
              has: {matches: exception-name}
              not: {has: {pattern: $_, not: {matches: exception-name}}}
    reference:
        matches: {python-unparenthesized: {value: {kind: identifier}}}
    literal:
        matches:
            python-unparenthesized:
                value:
                    any:
                        - kind: none, true, false, integer, float, ellipsis
                        - matches: python-plain-string
                        - kind: unary_operator
                          all:
                            - has: {field: operator, regex: '^[+-]$'}
                            - has: {field: argument, kind: 'integer, float'}
                        - kind: tuple
                          not: {has: {pattern: $_, not: {matches: literal}}}
    advance:
        any:
            - kind: call
              pattern: $NEXT($IT)
              all:
                - has: {field: function, matches: next-function}
                - has: {field: arguments, has: {matches: reference}}
            - kind: await
              pattern: $AWAITED
              has:
                kind: call
                pattern: $NEXT($IT)
                all:
                    - has: {field: function, matches: anext-function}
                    - has: {field: arguments, has: {matches: reference}}
            - kind: parenthesized_expression
              has: {matches: advance}
rule:
    all:
        - pattern: |
            try:
                $STMT
            except $ERROR:
                $FALLBACK
        - not: {has: {stopBy: end, kind: comment}}
        - not:
            has:
                any:
                    - kind: else_clause, finally_clause
                    - kind: except_clause
                      nthChild: {position: 2, ofRule: {kind: except_clause}}
        - not:
            any:
                - all: [{has: {field: body, has: {stopBy: end, kind: await}}}, {has: {kind: except_clause, has: {stopBy: end, regex: '^StopIteration$'}}}]
                - all: [{not: {has: {field: body, has: {stopBy: end, kind: await}}}}, {has: {kind: except_clause, has: {stopBy: end, regex: '^StopAsyncIteration$'}}}]
        - any:
            - all:
                - has: {field: body, matches: lone, has: {kind: return_statement, has: {matches: advance}}}
                - has: {kind: except_clause, has: {matches: lone, has: {kind: return_statement, any: [{has: {matches: literal}}, {not: {has: {pattern: $_}}}]}}}
            - all:
                - has: {field: body, matches: lone, has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, kind: 'identifier, attribute', pattern: $TARGET}}, {has: {field: right, matches: advance}}, {not: {has: {field: type, kind: type}}}]}}}
                - has: {kind: except_clause, has: {matches: lone, has: {kind: expression_statement, has: {pattern: $TARGET = $DEFAULT}}}}
constraints:
    ERROR: {matches: exception}
    DEFAULT: {matches: literal}
rewriters:
    - id: value
      rule: {any: [{pattern: return $VALUE}, {pattern: $TARGET = $VALUE}]}
      fix: $VALUE
    - id: implicit-none
      rule: {kind: return_statement}
      fix: None
    - id: return-prefix
      rule: {kind: return_statement}
      fix: return
    - id: assignment-prefix
      rule: {pattern: $TARGET = $VALUE}
      fix: $TARGET =
transform:
    PREFIX: rewrite($STMT, rewriters=[return-prefix, assignment-prefix])
    DEFAULT_VALUE: rewrite($FALLBACK, rewriters=[value, implicit-none])
    ASYNC: {replace: {source: $AWAITED, replace: '(?s)^.*$', by: 'await '}}
fix: $PREFIX $ASYNC$NEXT($IT, $DEFAULT_VALUE)
message: '`try` around `$NEXT($IT)` catches `$ERROR` to supply a literal default'
note: 'Call `next(<iterator>, <default>)` or `await anext(<iterator>, <default>)`'
