# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fail-by-branch
language: tsx
severity: error
utils:
    # Failed or dead carrier constructors, the Sync thunk is the orFailWith or orDieWith thunk, Exit.fail and Either.left build values and run nothing
    fail-constructor:
        kind: member_expression
        regex: "^(Effect\\.(fail|failSync|failCause|failCauseSync|die|dieSync|dieMessage)|Micro\\.(fail|failSync|failCause|failCauseSync|die)|\
            STM\\.(fail|failSync|die|dieSync|dieMessage))$"
    pass-constructor:
        kind: member_expression
        regex: '^(Effect|Micro|STM)\.succeed$'
    fail-call:
        kind: call_expression
        has: {field: function, matches: fail-constructor}
    pass-value:
        any:
            - {kind: call_expression, has: {field: function, matches: pass-constructor}}
            - {kind: member_expression, regex: '^(Effect|Micro|STM)\.void$'}
    # Arm as an arrow with the constructor call as its expression body or its one returned value, or the constructor passed point-free
    fail-arm:
        any:
            - kind: arrow_function
              has:
                  field: body
                  any:
                      - matches: fail-call
                      - {kind: statement_block, has: {kind: return_statement, has: {matches: fail-call}}, not: {has: {nthChild: 2}}}
            - matches: fail-constructor
    pass-arm:
        any:
            - kind: arrow_function
              has:
                  field: body
                  any:
                      - matches: pass-value
                      - {kind: statement_block, has: {kind: return_statement, has: {matches: pass-value}}, not: {has: {nthChild: 2}}}
            - matches: pass-constructor
rule:
    kind: call_expression
    any:
        - matches: effect-two-arm-branch
          has:
              field: arguments
              has:
                  kind: object
                  all:
                      - has: {kind: pair, has: {field: value, matches: fail-arm}}
                      - has: {kind: pair, has: {field: value, matches: pass-arm}}
        # Match.when and Match.orElse hold the arms as arguments, one step fails and the other passes the value
        - matches: effect-two-step-match-chain
          has:
              field: arguments
              all:
                  - has: {kind: call_expression, has: {field: arguments, has: {matches: fail-arm}}}
                  - has: {kind: call_expression, has: {field: arguments, has: {matches: pass-arm}}}
message: The branch fails in one arm and passes the value through in the other
note: >-
    Guard a boolean with `Effect.filterOrFail(effect, predicate, () => error)` or `Effect.filterOrDie(effect, predicate, () => defect)`,
    a local with `Effect.liftPredicate(value, predicate, () => error)`, and `Effect.mapError` renames the failure of an Option, Either, or Exit
