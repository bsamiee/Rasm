# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-procfs-read
language: rust
severity: error
rule:
    kind: string_literal
    matches: rust-procfs-path
    pattern: $PATH
message: '`$PATH` reads a Linux procfs file by hand'
note: 'Read through `sysinfo::System` (`refresh_memory` then `total_memory` or `total_swap`, `refresh_cpu_all` then `cpus`, `System::load_average`, `System::uptime`, `refresh_processes` then `process(<pid>)` for `cmd`, `environ`, `exe`, `cwd`, `root`, `memory`, `status`, and `disk_usage`, `sysinfo::get_current_pid` for `self`), `sysinfo::Disks` for mounts and disk counters, `sysinfo::Networks` for interface counters, and `std::env::current_exe` for `/proc/self/exe`, each typed and portable past Linux'
