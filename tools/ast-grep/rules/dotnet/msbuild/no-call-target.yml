# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-call-target
language: xml
severity: error
rule:
    matches: {msbuild-element: {name: {regex: '^CallTarget$'}}}
message: '`CallTarget` hides the called target''s properties and items until the calling target finishes'
note: Name the target in `DependsOnTargets`
