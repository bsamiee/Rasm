# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unread-parameter
language: tsx
severity: error
files:
    - '**/.claude/plugins/**/hooks/**'
ignores:
    - '**/*.spec.ts'
utils:
    declared-function:
        any:
            - kind: function_declaration
            - kind: arrow_function, function_expression
              any:
                - {inside: {kind: variable_declarator, field: value}}
                - {inside: {kind: arrow_function, field: body, matches: declared-function}}
                - {inside: {kind: return_statement, inside: {kind: statement_block, inside: {matches: declared-function}}}}
rule:
    kind: identifier
    regex: ^_
    inside: {kind: 'required_parameter, optional_parameter', field: pattern, inside: {kind: formal_parameters, inside: {matches: declared-function}}}
    pattern: $MATCH
message: The declared function ignores its parameter `$MATCH`, and every caller is in the tree
note: Drop the parameter at the declaration and at each call
labels: {MATCH: {style: primary}}
