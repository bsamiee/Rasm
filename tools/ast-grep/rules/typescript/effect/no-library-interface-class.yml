# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    library-interface:
        kind: nested_type_identifier
        all:
            - not: {has: {field: name, regex: '^(Equal|Hash|Inspectable|Pipeable|Redactable)$'}}
            - has: {field: module, matches: {effect-module: {name: {regex: '(?-u:\b)[A-Z][^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*$'}}}}
rule:
    kind: class_declaration, abstract_class_declaration, class
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            kind: class_heritage
            has:
                kind: implements_clause
                has:
                    pattern: $INTERFACE
                    any:
                        - matches: library-interface
                        - kind: generic_type
                          has: {field: name, matches: library-interface}
message: '`$NAME` reimplements `$INTERFACE`, a value the library constructs'
note: 'Build the value with `<module>.make` or read it from the runtime (`Tracer.make` over `Effect.tracer` for a tracer)'
