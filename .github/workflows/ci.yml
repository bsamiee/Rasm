name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            uncached:
                description: Runs every task of each leg's nx affected step past the Nx cache, to time them
                type: boolean
                default: false

concurrency:
    group: ${{ format('{0}-{1}', github.workflow, case(github.event_name == 'pull_request', github.ref, github.run_id)) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    actions: read

env:
    HK_PROFILE: ci
    HK_LIBGIT2: 'false'
    NX_PARALLEL: 100%
    NX_SKIP_NX_CACHE: ${{ inputs.uncached == true }}
    CARGO_INCREMENTAL: '0'
    GH_TOKEN: ${{ github.token }}
    NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
    NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ case(github.event_name == 'pull_request', secrets.NX_SELF_HOSTED_REMOTE_CACHE_READ_TOKEN, secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN) }}

defaults:
    run:
        shell: bash

jobs:
    shas:
        name: Base commit
        runs-on: ubuntu-slim
        timeout-minutes: 15
        outputs:
            base: ${{ steps.shas.outputs.base || steps.root.outputs.sha }}
            head: ${{ steps.shas.outputs.head || github.sha }}
            engines: ${{ steps.images.outputs.engines }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0
            - id: root
              run: |-
                  root="$(git rev-list --max-parents=0 HEAD)"
                  printf "sha=%s\n" "${root}" >> "${GITHUB_OUTPUT}"
            - id: shas
              if: ${{ github.event_name != 'workflow_dispatch' }}
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  fallback-sha: ${{ steps.root.outputs.sha }}
                  workflow-id: ci.yml
                  lookup-strategy: per-commit
                  max-commits: 150
            - id: images
              uses: $/.github/actions/images

    ci:
        name: ${{ matrix.name }}
        needs: shas
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      runner: ubuntu-26.04
                      mise: ci-linux
                      targets: check,test,build
                      configuration: ci
                      graph: true
                      hk: true
                      exclude: tag:technology:rust,tag:os:*,!tag:os:linux,tag:host:rhino,tag:host:browser,tag:host:unreal,tag:host:claude-code
                    - name: Rust check
                      runner: ubuntu-26.04
                      mise: ci-linux
                      targets: check
                      cargo: check
                      exclude: &rust '*,!tag:technology:rust,tag:os:*,!tag:os:linux'
                    - name: Rust test
                      runner: ubuntu-26.04
                      mise: ci-linux
                      targets: test,build
                      cargo: test
                      exclude: *rust
                    - name: Browser
                      runner: ubuntu-26.04
                      mise: ci-linux
                      targets: check,test,build,pack
                      batch: 'false'
                      exclude: '*,!tag:host:browser'
                    - name: macOS
                      runner: xcode-27
                      mise: ci
                      targets: check,test,build
                      graph: true
                      hk: true
                      steps: --step swiftlint --step swift-format --step plutil --step xcprojformatter
                      exclude: '*,!tag:os:darwin,tag:host:rhino,tag:host:unreal,tag:host:claude-code'
                    - name: Windows
                      runner: windows-2025
                      mise: ci
                      targets: test
                      configuration: headless
                      exclude: '*,!tag:os:win32,!tag:host:rhino,tag:host:claude-code'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 120
        env:
            NX_BASE: ${{ needs.shas.outputs.base }}
            NX_HEAD: ${{ needs.shas.outputs.head }}
            NX_BATCH_MODE: ${{ matrix.batch }}
            TARGETS: ${{ matrix.targets }}
            CONFIGURATION: ${{ matrix.configuration }}
            EXCLUDE: ${{ matrix.exclude }}
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
            - if: ${{ runner.os == 'Linux' }}
              background: true
              run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            - id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |-
                      .cache/nx/workspace-data/*
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                      !.cache/nx/workspace-data/xcode-packages
                  key: nx-${{ runner.os }}-
            - if: ${{ runner.os == 'macOS' }}
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest-stable
            - uses: $/.github/actions/tools
              with:
                  mise-env: ${{ matrix.mise }}
            - if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPMENT_P12 != '' }}
              uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
              with:
                  p12-file-base64: ${{ env.APPLE_DEVELOPMENT_P12 }}
                  p12-password: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            - if: ${{ runner.os == 'Windows' }}
              run: |-
                  major="$(yq -p xml -oy '.Project.PropertyGroup[] | select(.+@Label == "Rhino") | .RhinoVersion | split(".") | .[0]' Directory.Build.props)"
                  installer="$(curl -fsS -o /dev/null -w '%{redirect_url}' --get --data-urlencode "slug=rhino-for-windows/${major}/latest" --data-urlencode "email=${RHINO_EMAIL}" https://www.rhino3d.com/www-api/download/direct)"
                  printf "RHINO_INSTALLER=%s\n" "${installer}" >> "${GITHUB_ENV}"
              env:
                  RHINO_EMAIL: ${{ secrets.RHINO_EMAIL }}
            - id: codegen
              if: ${{ matrix.hk && !matrix.steps }}
              run: nx run-many --targets=codegen
            - if: ${{ matrix.graph }}
              run: nx sync:check
            - if: ${{ !cancelled() && matrix.graph && steps.codegen.outcome != 'failure' }}
              background: true
              run: nx conformance:check
            - if: ${{ !cancelled() && matrix.hk && steps.codegen.outcome != 'failure' }}
              background: true
              run: hk check ${{ matrix.steps }} --from-ref "${NX_BASE}" --to-ref "${NX_HEAD}"
            - id: cargo
              if: ${{ matrix.cargo }}
              run: |-
                  projects="$(nx show projects --affected --withTarget="${TARGETS}" --exclude="${EXCLUDE}" --json)"
                  affected="$(jq 'length > 0' <<< "${projects}")"
                  printf "affected=%s\n" "${affected}" >> "${GITHUB_OUTPUT}"
            - id: state
              if: ${{ steps.cargo.outputs.affected == 'true' }}
              uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
              env: &bucket
                  RUNS_ON_S3_BUCKET_CACHE: ${{ secrets.RUNS_ON_S3_BUCKET_CACHE }}
                  RUNS_ON_S3_BUCKET_ENDPOINT: ${{ secrets.RUNS_ON_S3_BUCKET_ENDPOINT }}
                  RUNS_ON_S3_FORCE_PATH_STYLE: 'true'
                  AWS_REGION: us-east-1
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              with:
                  path: &state |-
                      .cache/cargo
                      .artifacts/cargo/dylint
                      ~/.dylint_drivers
                      ~/.local/share/mise/cargo/registry/index
                      ~/.local/share/mise/cargo/registry/cache
                      ~/.local/share/mise/cargo/git/db
                  key: cargo-${{ matrix.cargo }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-${{ matrix.cargo }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            - id: affected
              if: ${{ !cancelled() && steps.codegen.outcome != 'failure' }}
              run: nx affected --targets="${TARGETS}" ${CONFIGURATION:+--configuration="${CONFIGURATION}"} --exclude="${EXCLUDE}" || { [[ "${RUNNER_OS}" == Windows ]] && printf "missed=true\n" >> "${GITHUB_OUTPUT}"; }
              env:
                  NX_SKIP_NX_CACHE: ${{ inputs.uncached == true || github.event_name == 'push' && steps.state.outputs.cache-hit == 'false' }}
            - if: ${{ steps.affected.outputs.missed == 'true' }}
              uses: mcneel/setup-rhino3d@095a5ff63cdb7dc8383e229fc40ffa779915b0af # v4.0.0
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  download-url: ${{ env.RHINO_INSTALLER }}
            - if: ${{ steps.affected.outputs.missed == 'true' }}
              run: nx affected --targets="${TARGETS}" --configuration="${CONFIGURATION}" --exclude="${EXCLUDE}"
              env:
                  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}
            - wait-all: true
            - if: ${{ !cancelled() && github.event_name == 'push' && steps.state.outputs.cache-hit == 'false' }}
              uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
              env: *bucket
              with:
                  path: *state
                  key: ${{ steps.state.outputs.cache-primary-key }}
            - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !endsWith(steps.graph.outputs.cache-matched-key, hashFiles('.cache/nx/workspace-data/*.hash')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: nx-${{ runner.os }}-${{ hashFiles('.cache/nx/workspace-data/*.hash') }}
            - if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ matrix.name }}-reports-${{ github.run_attempt }}
                  if-no-files-found: ignore
                  path: |-
                      .artifacts/cmake/*/*.log
                      .artifacts/dotnet/test
                      .artifacts/playwright
                      .artifacts/vitest
                      .artifacts/apple/**/*.xcresult
                      .cache/nx/workspace-data/project-graph.json
                      .cache/nx/workspace-data/*.db*

    unreal:
        name: Unreal Engine ${{ matrix.engine }}
        needs: shas
        if: ${{ github.event_name != 'pull_request' && needs.shas.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.shas.outputs.engines) }}
        runs-on: [self-hosted, unreal]
        timeout-minutes: 120
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.repository_owner }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=20g
        env:
            NX_BASE: ${{ needs.shas.outputs.base }}
            NX_HEAD: ${{ needs.shas.outputs.head }}
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: 'false'
        steps:
            - *checkout
            - uses: $/.github/actions/tools
              with:
                  mise-env: ci
            - run: nx affected --targets=check,test,build --exclude='*,!tag:host:unreal'
