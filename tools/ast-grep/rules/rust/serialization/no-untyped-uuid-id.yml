# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-untyped-uuid-id
language: rust
severity: error
utils:
    uuid:
        kind: 'type_identifier, scoped_type_identifier'
        regex: '^((::)?uuid::)?Uuid$'
    uuid-type:
        any:
            - matches: uuid
            - kind: generic_type
              all:
                - has: {field: type, regex: '^(Option|Vec|VecDeque|BTreeSet|HashSet|IndexSet|NEVec|Box|Arc|Rc)$'}
                - has: {field: type_arguments, has: {nthChild: 1, matches: uuid-type}, not: {has: {nthChild: 2}}}
            - kind: array_type
              has: {field: element, matches: uuid-type}
            - kind: reference_type
              has: {field: type, any: [{matches: uuid-type}, {kind: array_type, has: {field: element, matches: uuid-type}}]}
    uuid-keyed:
        kind: generic_type
        all:
            - has: {field: type, regex: '^(BTreeMap|HashMap|IndexMap)$'}
            - has: {field: type_arguments, has: {nthChild: 1, matches: uuid}}
    id-name:
        regex: '^(r#)?(id|ids|uuid|uuids|guid|\w+_(id|ids|uuid|uuids|guid))$'
    declared:
        kind: 'field_declaration, parameter, let_declaration, const_item, static_item'
        not: {inside: {kind: parameters, inside: {matches: rust-trait-or-extern-function}}}
rule:
    pattern: $SITE
    any:
        - matches: declared
          all:
            - any: [{has: {field: name, matches: id-name}}, {has: {field: pattern, kind: identifier, matches: id-name}}]
            - has: {field: type, matches: uuid-type}
        - matches: declared
          has: {field: type, any: [{matches: uuid-keyed}, {kind: reference_type, has: {field: type, matches: uuid-keyed}}]}
        - kind: identifier
          matches: id-name
          inside:
            kind: function_item
            field: name
            all:
                - has: {field: return_type, matches: uuid-type}
                - not: {matches: rust-trait-or-extern-function}
        - kind: 'string_literal, raw_string_literal'
          regex: '\{\w*:08x\}-\{\w*:04x\}-\{\w*:04x\}-'
          inside: {kind: token_tree, inside: {kind: macro_invocation}}
message: '`$SITE` holds or spells an identifier as an untyped UUID'
note: 'Type each entity identifier `newtype_uuid::TypedUuid<<Kind>>`, print through `uuid::Uuid`, and keep strings for tokens a peer echoes back'
