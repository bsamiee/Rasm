# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: msbuild-property
language: xml
arguments: [name]
rule:
    kind: element
    all:
        - matches: {msbuild-element: {name: {matches: name}}}
        - inside: {kind: content, inside: {kind: element, has: {matches: msbuild-tag, has: {kind: Name, regex: '^PropertyGroup$'}}}}
        - not:
            inside:
                kind: element
                stopBy: end
                has: {kind: STag, has: {kind: Name, regex: '^ProjectExtensions$'}}
