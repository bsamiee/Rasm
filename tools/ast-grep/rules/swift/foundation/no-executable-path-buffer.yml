# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    any:
        - has: {nthChild: 1, pattern: _NSGetExecutablePath}
        - all:
            - has: {nthChild: 1, pattern: proc_pidpath}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: {position: 1, ofRule: {kind: value_argument}}, regex: '^(getpid\(\)|ProcessInfo\.processInfo\.processIdentifier)$'}}}
message: '`$CALL` fills a C buffer with the running executable''s path'
note: 'Read `Bundle.main.executableURL` or `Bundle.main.executablePath`'
