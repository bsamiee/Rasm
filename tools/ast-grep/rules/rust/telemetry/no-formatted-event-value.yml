# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-formatted-event-value
language: rust
severity: error
utils:
    rendering-call:
        kind: identifier
        any:
            - all: [{regex: '^(format|format_args)$'}, {precedes: {regex: '^!$'}}]
            - all:
                - regex: '^to_string$'
                - follows: {regex: '^\.$'}
                - precedes: {kind: token_tree, regex: '^\(\s*\)$', precedes: {stopBy: {not: {kind: 'line_comment, block_comment'}}, regex: '^(,|\)|\})$'}}
            - all:
                - regex: '^to_string$'
                - follows: {regex: '^::$'}
                - precedes: {kind: token_tree, not: {regex: '^\(\s*\)$'}}
rule:
    kind: attribute_item
    has: {kind: attribute, has: {stopBy: end, matches: rust-instrument-fields, has: {matches: rendering-call, pattern: $FORMAT}}}
message: '`$FORMAT` renders a value to text before the `#[instrument]` span records it'
note: 'Record each value as its own field (`<name> = %<value>`, `<name> = ?<value>`)'
