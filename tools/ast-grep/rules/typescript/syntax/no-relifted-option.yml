# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-relifted-option
language: tsx
severity: error
files: ['**/.claude/plugins/**'] # The case record Option of composition/option.ts, the effect carrier spells its arms onSome and onNone
utils:
    # Case record passed to the match of an Option, with or without a type argument on the call
    match-cases:
        kind: object
        inside:
            kind: arguments
            inside: {kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: '^match$'}}}
    # None arm that stays a none, the thunk over the constructor with or without its type argument, the constructor itself, or its shorthand
    none-arm:
        any:
            - kind: pair
              all:
                  - has: {field: key, regex: '^none$'}
                  - has: {field: value, any: [{pattern: '() => none()'}, {pattern: '() => none<$_>()'}, {pattern: none}]}
            - kind: shorthand_property_identifier
              pattern: {context: 'const cases = { none }', selector: shorthand_property_identifier}
    # None arm that yields the empty array, the absent case of toArray
    empty-arm:
        kind: pair
        all:
            - has: {field: key, pattern: {context: 'const cases = { none: 0 }', selector: property_identifier}}
            - has: {field: value, pattern: '() => []'}
rule:
    kind: pair
    all:
        - has: {field: key, regex: '^some$'}
        - inside: {matches: match-cases}
        - any:
              # Some arm beside a none that stays none, a map when the arm wraps its value in some and a flatMap otherwise
              - inside: {matches: match-cases, has: {matches: none-arm}}
              # Identity arm beside any none, the value or the fallback
              - has: {field: value, any: [{pattern: '($X) => $X'}, {pattern: '($X: $_) => $X'}]}
              # One-element arm beside the empty array, the value or one built from it, a spread element holds any count
              - all:
                    - has:
                          field: value
                          kind: arrow_function
                          has: {field: body, kind: array, all: [{has: {pattern: $_, not: {kind: spread_element}}}, {not: {has: {nthChild: 2}}}]}
                    - inside: {matches: match-cases, has: {matches: empty-arm}}
        # The definitions in option.ts spell the arms once, the walk stops at the nearest binding
        - not: {inside: {stopBy: {any: [{kind: variable_declarator}, {kind: function_declaration}]}, matches: claude-code-option-operation}}
message: The case record rebuilds the Option's own cases, and `composition/option.ts` exports the operation the arms spell
note: >-
    Call `map(f)(option)` for `some: (x) => some(f(x))`, `flatMap(f)(option)` for an arm that answers an Option,
    `getOrElse(() => fallback)(option)` for `some: (x) => x`, and `toArray(option)` or `toArray(map(f)(option))`
    for a one-element arm beside `none: () => []`
