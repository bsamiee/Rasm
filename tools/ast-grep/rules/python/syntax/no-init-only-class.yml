# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-init-only-class
language: python
severity: error
utils:
    field-value:
        any:
            - kind: identifier, integer, float, true, false, none
            - kind: string
              not: {has: {kind: interpolation}}
            - kind: list, tuple, set, dictionary, expression_list, pair
              not: {has: {pattern: $_, not: {matches: field-value}}}
    self-field:
        kind: attribute
        has: {field: object, kind: identifier, regex: '^self$'}
    self-assignment:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has:
                    field: left
                    any:
                        - matches: self-field
                        - kind: pattern_list
                          has: {matches: self-field}
                          not: {has: {pattern: $_, not: {matches: self-field}}}
                - has: {field: right, matches: field-value}
rule:
    kind: class_definition
    all:
        - has: {field: name, pattern: $NAME}
        - not: {has: {field: superclasses, kind: argument_list}}
        - not: {inside: {kind: decorated_definition}}
        - not:
            has:
                field: body
                any:
                    - has: {kind: function_definition, stopBy: {not: {kind: decorated_definition}}, has: {field: name, regex: '^(__new__|__setattr__)$'}}
                    - has: {kind: decorated_definition, has: {kind: function_definition, not: {has: {field: name, regex: '^__.*__$'}}}}
                    - has:
                        kind: expression_statement
                        has:
                            kind: assignment
                            has: {field: right, not: {kind: "integer, float, string, true, false, none, tuple, list"}}
        - has:
            field: body
            has:
                kind: function_definition
                all:
                    - has: {field: name, regex: '^__init__$'}
                    - has:
                        field: body
                        all:
                            - has: {matches: self-assignment}
                            - not: {has: {not: {any: [{matches: python-docstring-or-comment}, {matches: self-assignment}]}}}
message: '`__init__` of `$NAME` assigns self attributes alone'
note: 'Declare the fields on a `msgspec.Struct` with `frozen=True`'
labels:
    NAME: {style: primary, message: Init-only class}
