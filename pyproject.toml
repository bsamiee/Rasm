data-storage          = [
    "adbc-driver-flightsql",                                                      # Arrow Flight SQL remote driver
    "adbc-driver-manager",                                                        # ADBC driver manager for Arrow Flight SQL and DuckDB
    "adbc-driver-postgresql",                                                     # PostgreSQL driver for COPY ingest and partitioned Arrow reads
    "adbc-driver-sqlite",                                                         # SQLite driver for local-file federation and Arrow ingest
