# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-default-proxy-trap
language: tsx
rule:
    kind: arrow_function
    all:
        - any:
            - pattern: ($A) => Reflect.$TRAP($A)
            - pattern: ($A, $B) => Reflect.$TRAP($A, $B)
            - pattern: ($A, $B, $C) => Reflect.$TRAP($A, $B, $C)
            - pattern: ($A, $B, $C, $D) => Reflect.$TRAP($A, $B, $C, $D)
        - inside: {kind: pair, field: value, has: {field: key, kind: property_identifier, pattern: $TRAP}, inside: {kind: object, nthChild: 2, inside: {kind: arguments, inside: {kind: new_expression, has: {field: constructor, regex: '^Proxy$', matches: typescript-global-reference}}}}}
