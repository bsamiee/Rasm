id: csharp-import
language: csharplang
role: item
symbolType: module
rule:
    pattern: $DECLARATION
    any:
        - kind: using_directive
          has: {pattern: $NAME, nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}}}}
        - kind: extern_alias_directive
          has: {field: name, pattern: $NAME}
        - kind: file_based_directive
          has: {field: kind, regex: '^(?:sdk|package|project|ref)$'}
          all: [{has: {field: name, pattern: $NAME}}]
rewriters:
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    HEADER: rewrite($DECLARATION, rewriters=[trivia])
    NEWLINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    TRIMMED: {replace: {source: $NEWLINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
    NAMED: rewrite($NAME, rewriters=[trivia])
    NAME_LINES: {replace: {source: $NAMED, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    NAME_TRIMMED: {replace: {source: $NAME_LINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    CLEAN: {replace: {source: $NAME_TRIMMED, replace: '\n', by: ' '}}
name: $CLEAN
signature: $SIGNATURE
isImport: true
isExported: false
---
id: csharp-file-property
