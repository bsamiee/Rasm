id: no-loop-over-command-substitution
valid:
    - |
      mapfile -d '' -t files < <(fd -0 -e yml .)
      for f in "${files[@]}"; do printf '%s\n' "$f"; done
    - |
      while IFS= read -r -d '' f; do printf '%s\n' "$f"; done < <(fd -0 -e yml .)
    - |
      for f in "$dir"/**/*.yml; do printf '%s\n' "$f"; done
    - |
      for f in "${files[@]}"; do printf '%s\n' "$f"; done
    - |
      for f in a b; do printf '%s\n' "$(basename "$f")"; done
    - |
      for f in $(ls); do printf '%s\n' "$f"; done
    - |
      for f in $(find . -name '*.yml'); do printf '%s\n' "$f"; done
    - |
      for f in $(cat list); do printf '%s\n' "$f"; done
    - |
      for f in "$(cmd)"; do printf '%s\n' "$f"; done
    - |
      for f in ${files[@]}; do printf '%s\n' "$f"; done
    - |
      for f in $@; do printf '%s\n' "$f"; done
    - |
      for f in "$x"; do printf '%s\n' "$f"; done
    - |
      for f in "${files[@]}" "$(cmd)"; do printf '%s\n' "$f"; done
    - |
      for f in $x/*; do printf '%s\n' "$f"; done
    - |
      for f in $*; do printf '%s\n' "$f"; done
invalid:
    - |
      for f in $(cmd) "$x"; do printf '%s\n' "$f"; done
    - |
      for f in $(cat list | sort); do printf '%s\n' "$f"; done
    - |
      for lib in $(yq -r '.customLanguages[].libraryPath' sgconfig.yml); do ln -s "$PWD/$lib" "$scratch/$lib"; done
    - |
      for t in $(test_files); do printf '%s\n' "$t"; done
    - |
      for f in `fd -e yml .`; do printf '%s\n' "$f"; done
    - |
      for f in $(ls | head -3); do printf '%s\n' "$f"; done
    - |
      for f in first $(fd -e yml .); do printf '%s\n' "$f"; done
    - |
      for f in $(<list); do printf '%s\n' "$f"; done
    - |
      for d in $rule_dirs; do printf '%s\n' "$d"; done
    - |
      for d in ${rule_dirs}; do printf '%s\n' "$d"; done
    - |
      for d in ${rule_dirs:-.}; do printf '%s\n' "$d"; done
    - |
      for d in $1; do printf '%s\n' "$d"; done
    - |
      for f in "${files[@]}" $x; do printf '%s\n' "$f"; done
    - |
      select f in $(cmd); do printf '%s\n' "$f"; done
