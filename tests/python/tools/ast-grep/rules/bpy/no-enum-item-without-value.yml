id: no-enum-item-without-value
valid:
    - |
      items = tuple((item.identifier, item.name, item.description, item.icon, item.value) for item in prop.enum_items)
    - |
      items = tuple((depth.name, depth.name, "") for depth in Depth)
    - |
      items = (("FIXED", "Fixed", "Fixed angles"), ("SUN", "Sun Light", "Follow scene sun light"))
    - |
      items = tuple(MenuItem(name=item.name, description=item.description) for item in prop.enum_items)
    - |
      items = tuple((other.identifier, other.name, other.description) for item in prop.enum_items)
    - |
      items = tuple((item.identifier, item.name, item.description) for item in members)
invalid:
    - |
      items = tuple((item.identifier, item.name, item.description) for item in prop.enum_items)
    - |
      items = [(item.identifier, item.name, item.description) for item in prop.enum_items if item.identifier in KEPT]
    - |
      items = (*((item.identifier, item.name, item.description) for item in prop.enum_items), ("COLOR", "Color", ""))
    - |
      items = tuple((item.identifier, item.name, item.description, item.icon) for item in prop.enum_items)
    - |
      items = tuple((item.identifier, item.name, item.description) for item in prop.enum_items_static)
