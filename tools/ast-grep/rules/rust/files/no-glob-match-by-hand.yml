# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    star-cut:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(strip_prefix|strip_suffix|starts_with|ends_with|split|splitn|rsplit|split_once|rsplit_once|contains|find|replace|trim_start_matches|trim_end_matches)$'}}
            - any:
                - all:
                    - has: {field: function, has: {field: value, regex: '(?i)(^|[^a-z0-9])(pat|pattern|glob|wildcard|mask|spec|include|exclude)s?(\.as_str\(\)|\.as_ref\(\))?$'}}
                    - has:
                        field: arguments
                        has:
                            nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                            any:
                                - {kind: string_literal, regex: '\*', not: {regex: '\.\*'}}
                                - {pattern: '''*'''}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: string_literal, regex: '^"(\*\.[^"]*|\*\*/[^"]*)"$'}}
rule:
    kind: call_expression
    all:
        - matches: star-cut
        - pattern: $CALL
message: '`$CALL` matches a glob pattern by cutting it at `*` by hand'
note: 'Compile the pattern once with `globset::Glob::new(<pattern>)?.compile_matcher()`, or a `globset::GlobSetBuilder` for a pattern list'
