# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-keys-for-membership
language: tsx
severity: error
rule:
    # $RECORD and $KEY bind in the argument rules at the call site, the util's own body exports nothing to the fix
    matches: {effect-key-search: {list: {matches: {effect-key-list: {record: {pattern: $RECORD}}}}, key: {pattern: $KEY}}}
    # Object.keys in a file without a Record import breaks the fix, the sibling no-keys-for-membership-by-hand reports it
    not: {has: {stopBy: end, pattern: Object.keys($_)}, not: {inside: {kind: program, stopBy: end, has: {matches: effect-record-import}}}}
fix: Record.has($RECORD, $KEY)
message: The key list of $RECORD answers a membership test the record answers itself
note: Test the record with `Record.has(record, key)`, the key list exists for the membership test alone
labels:
    RECORD: {style: primary, message: The record with the listed keys}
