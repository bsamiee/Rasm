# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-restated-default-argument
language: python
utils:
    msgspec-decoder:
        kind: argument_list
        inside:
            kind: call
            has:
                field: function
                kind: attribute
                all:
                    - has: {field: object, matches: python-msgspec-module}
                    - has: {field: attribute, regex: "^(decode|Decoder)$"}
    msgspec-encoder:
        kind: argument_list
        inside:
            kind: call
            has:
                field: function
                kind: attribute
                all:
                    - has: {field: object, matches: python-msgspec-module}
                    - has: {field: attribute, regex: "^(encode|Encoder)$"}
    cpu-percent-member:
        any:
            - matches: {python-module-member: {module: {regex: "^psutil$"}, name: {regex: "^cpu_percent$"}}}
            - matches: {python-imported-name: {module: {regex: "^psutil$"}, name: {regex: "^cpu_percent$"}}}
    process-member:
        any:
            - matches: {python-module-member: {module: {regex: "^psutil$"}, name: {regex: "^Process$"}}}
            - matches: {python-imported-name: {module: {regex: "^psutil$"}, name: {regex: "^Process$"}}}
    gzip-member:
        any:
            - matches: {python-module-member: {module: {regex: "^gzip$"}, name: {regex: "^open$"}}}
            - matches: {python-imported-name: {module: {regex: "^gzip$"}, name: {regex: "^open$"}}}
    httpx-member:
        any:
            - matches: {python-module-member: {module: {regex: "^httpx$"}, name: {regex: "^(get|post|put|patch|delete|head|options|request|stream|Client|AsyncClient)$"}}}
            - matches: {python-imported-name: {module: {regex: "^httpx$"}, name: {regex: "^(get|post|put|patch|delete|head|options|request|stream|Client|AsyncClient)$"}}}
    httpx-call:
        kind: argument_list
        inside:
            kind: call
            has:
                field: function
                matches: httpx-member
    gzip-open:
        kind: argument_list
        inside:
            kind: call
            has:
                field: function
                matches: gzip-member
    process-constructor:
        kind: call
        has:
            field: function
            matches: process-member
    cpu-percent:
        kind: argument_list
        inside:
            kind: call
            has:
                field: function
                any:
                    - matches: cpu-percent-member
                    - kind: attribute
                      all:
                        - has: {field: attribute, regex: "^cpu_percent$"}
                        - has: {field: object, matches: process-constructor}
rule:
    not:
        inside:
            kind: argument_list
            any:
                - has: {kind: "list_splat, dictionary_splat"}
                - matches: gzip-open
                  all:
                    - has: {kind: keyword_argument, has: {field: name, regex: '^mode$'}}
                    - has: {pattern: $_, not: {kind: "keyword_argument, comment"}, nthChild: {position: 2, ofRule: {not: {kind: comment}}}}
                - matches: cpu-percent
                  has: {pattern: $_, not: {kind: "keyword_argument, comment"}}
    any:
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^strict$"}
            - has: {field: value, kind: "true"}
            - inside: {matches: msgspec-decoder}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^dec_hook$"}
            - has: {field: value, kind: none}
            - inside: {matches: msgspec-decoder}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^(enc_hook|order)$"}
            - has: {field: value, kind: none}
            - inside: {matches: msgspec-encoder}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^timeout$"}
            - has: {field: value, any: [{kind: float, regex: '^5\.0*$'}, {kind: integer, regex: "^5$"}]}
            - inside: {matches: httpx-call}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^follow_redirects$"}
            - has: {field: value, kind: "false"}
            - inside: {matches: httpx-call}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^verify$"}
            - has: {field: value, kind: "true"}
            - inside: {matches: httpx-call}
        - kind: string
          regex: '^("rb"|''rb'')$'
          nthChild: {position: 2, ofRule: {not: {kind: comment}}}
          inside: {matches: gzip-open}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^mode$"}
            - has: {field: value, kind: string, regex: '^("rb"|''rb'')$'}
            - inside: {matches: gzip-open}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^interval$"}
            - has: {field: value, kind: none}
            - inside: {matches: cpu-percent}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^pid$"}
            - has: {field: value, kind: none}
            - inside: {kind: argument_list, inside: {matches: process-constructor}}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: "^compresslevel$"}
            - has: {field: value, kind: integer, regex: "^6$"}
            - inside: {matches: gzip-open}
