# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
rule:
    all:
        - has:
            field: function
            kind: attribute
            has: {field: attribute, regex: '^(en|de)code$'}
        - pattern: $CODEC().$METHOD($$$)
constraints:
    CODEC:
        any:
            - kind: attribute
              all:
                - has: {field: attribute, regex: '^(Encoder|Decoder)$'}
                - has: {field: object, matches: {python-submodule: {parent: {regex: '^msgspec$'}, child: {regex: '^(json|msgpack)$'}}}}
            - kind: identifier
              matches: {python-imported-name: {module: {regex: '^msgspec\.(json|msgpack)$'}, name: {regex: '^(Encoder|Decoder)$'}}}
message: '`$CODEC()` constructs a default codec for one `$METHOD` call'
note: 'Call module-level `encode` or `decode` directly'
