# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-squared-deviation-sum
language: rust
utils:
    mean-value:
        any:
            - kind: call_expression
              has: {field: function, kind: field_expression, has: {field: field, regex: '^mean$'}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^/$'}
                - has: {field: left, kind: call_expression, has: {field: function, regex: '\.sum(::<[^>]*>)?$'}}
    mean:
        any:
            - matches: mean-value
            - kind: identifier
              pattern: $MEAN
              inside:
                kind: function_item
                stopBy: end
                has: {stopBy: end, kind: let_declaration, all: [{has: {field: pattern, pattern: $MEAN}}, {has: {field: value, matches: mean-value}}]}
    element:
        any:
            - pattern: $X
            - pattern: '*$X'
    deviation:
        kind: parenthesized_expression
        has:
            kind: binary_expression
            all:
                - has: {field: operator, regex: '^-$'}
                - any:
                    - all: [{has: {field: left, matches: element}}, {has: {field: right, matches: mean}}]
                    - all: [{has: {field: left, matches: mean}}, {has: {field: right, matches: element}}]
    squared:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, matches: deviation}}, {has: {field: field, regex: '^(powi|powf)$'}}]}
                - has: {field: arguments, regex: '^\(\s*2(\.0*)?(_?f(32|64))?\s*\)$'}
            - kind: binary_expression
              pattern: $D * $D
              has: {field: left, matches: deviation}
    parameter:
        any:
            - {kind: identifier, pattern: $X}
            - {kind: reference_pattern, has: {kind: identifier, pattern: $X}}
rule:
    any:
        - all:
            - any:
                - pattern: $ITER.map($MAP).sum()
                - pattern: $ITER.map($MAP).sum::<$TYPE>()
            - has:
                field: function
                has:
                    stopBy: end
                    kind: closure_expression
                    pattern: $MAP
                    all:
                        - has: {field: parameters, kind: closure_parameters, all: [{has: {nthChild: 1, matches: parameter}}, {not: {has: {nthChild: 2}}}]}
                        - has: {field: body, matches: squared}
        - all:
            - pattern: $ITER.fold($INIT, $FOLD)
            - has:
                field: arguments
                has:
                    nthChild: 2
                    kind: closure_expression
                    all:
                        - has: {field: parameters, kind: closure_parameters, all: [{has: {nthChild: 1, kind: identifier, pattern: $ACC}}, {has: {nthChild: 2, matches: parameter}}]}
                        - has: {field: body, kind: binary_expression, all: [{has: {field: operator, regex: '^\+$'}}, {has: {field: left, pattern: $ACC}}, {has: {field: right, matches: squared}}]}
        - kind: compound_assignment_expr
          all:
            - has: {field: operator, regex: '^\+=$'}
            - has: {field: left, kind: identifier}
            - has: {field: right, matches: squared}
            - inside: {kind: for_expression, stopBy: {kind: 'for_expression, function_item, closure_expression'}, has: {field: pattern, matches: parameter}}
