# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-type-level-guard
language: tsx
severity: error
files:
    - '**/.claude/plugins/**'
ignores:
    - '**/*.spec.ts'
rule:
    kind: conditional_type
    all:
        - {has: {field: left, kind: tuple_type}}
        - {has: {field: right, kind: tuple_type, has: {kind: predefined_type, regex: ^never$}}}
    pattern: $MATCH
message: The conditional type proves the table against the generated declarations, and `typecheck` fails when a tool leaves them
note: Test the tool name at run time, `tool.startsWith('mcp__<server>__')`, and let an absent tool pass
labels: {MATCH: {style: primary}}
