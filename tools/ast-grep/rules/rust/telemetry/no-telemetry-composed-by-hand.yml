# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-telemetry-composed-by-hand
language: rust
severity: error
ignores: ['libs/rust/telemetry/**']
utils:
    subscriber-install:
        any:
            - kind: scoped_identifier
              regex: '^(::)?((tracing::)?(subscriber|dispatcher)|tracing)::(set_global_default|set_default|with_default)$|^(::)?(tracing_log::)?LogTracer::init$'
            - all:
                - regex: '^(set_global_default|set_default|with_default)$'
                - matches: {rust-imported-name: {source: {regex: '\btracing\b'}, name: {regex: '^(set_global_default|set_default|with_default)$'}}}
            - kind: field_expression
              all:
                - has: {field: field, regex: '^init$'}
                - any:
                    - has: {field: value, matches: tracer-builder}
                    - all:
                        - has: {field: value, kind: identifier, pattern: $BUILDER}
                        - inside: {kind: block, stopBy: end, has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $BUILDER}}, {has: {field: value, matches: tracer-builder}}]}}
    tracer-builder:
        any:
            - regex: '(?s)\b(LogTracer::builder|log_tracer::Builder::(new|default))\(\)'
            - all:
                - regex: '(?s)^\w*Builder::(new|default)\(\)'
                - inside: {kind: source_file, stopBy: end, has: {kind: use_declaration, regex: '(?s)\blog_tracer::.*\bBuilder\b'}}
    global-install:
        any:
            - kind: scoped_identifier
              regex: '(^|::)global::set_(tracer_provider|meter_provider|text_map_propagator)$'
            - all:
                - regex: '^set_(tracer_provider|meter_provider|text_map_propagator)$'
                - matches: {rust-imported-name: {source: {regex: '\bglobal\b'}, name: {regex: '^set_(tracer_provider|meter_provider|text_map_propagator)$'}}}
    panic-hook:
        any:
            - kind: scoped_identifier
              regex: '(^|::)panic::(set_hook|update_hook)$'
            - all:
                - regex: '^(set_hook|update_hook)$'
                - matches: {rust-imported-name: {source: {regex: '\bpanic\b'}, name: {regex: '^(set_hook|update_hook)$'}}}
rule:
    kind: 'identifier, scoped_identifier, field_expression'
    pattern: $SITE
    any:
        - matches: subscriber-install
        - matches: global-install
        - matches: panic-hook
    not: {matches: rust-test-scope}
    inside: {kind: call_expression, field: function}
message: '`$SITE` composes telemetry outside `rasm-telemetry`'
note: 'Run the process entry under `rasm_telemetry::Options::run`, which installs the subscriber, `log` forwarding, exporters, propagator, and panic hook and flushes them when the work returns'
