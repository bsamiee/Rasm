# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: github-step
language: yaml
utils:
    composite-runs:
        kind: block_mapping, flow_mapping
        all:
            - has:
                kind: block_mapping_pair, flow_pair
                all:
                    - has: {field: key, regex: '^(using|"using"|''using'')$'}
                    - has: {field: value, regex: '^(composite|"composite"|''composite'')$'}
            - inside:
                kind: block_node, flow_node
                inside:
                    kind: block_mapping_pair, flow_pair
                    has: {field: key, regex: '^(runs|"runs"|''runs'')$'}
                    inside: {matches: yaml-document-mapping}
    workflow-step-list:
        kind: block_mapping_pair, flow_pair
        any:
            - all:
                - has: {field: key, regex: '^(steps|"steps"|''steps'')$'}
                - inside: {matches: github-job}
            - all:
                - has: {field: key, regex: '^(parallel|"parallel"|''parallel'')$'}
                - inside: {matches: workflow-step}
    workflow-step:
        kind: block_mapping, flow_mapping
        inside:
            kind: block_sequence, flow_sequence
            stopBy: {kind: 'block_mapping_pair, flow_pair'}
            inside: {kind: 'block_node, flow_node', inside: {matches: workflow-step-list}}
    composite-step-list:
        kind: block_mapping_pair, flow_pair
        all:
            - has: {field: key, regex: '^(steps|"steps"|''steps'')$'}
            - inside: {matches: composite-runs}
rule:
    kind: block_mapping, flow_mapping
    any:
        - matches: workflow-step
        - inside:
            kind: block_sequence, flow_sequence
            stopBy: {kind: 'block_mapping_pair, flow_pair'}
            inside: {kind: 'block_node, flow_node', inside: {matches: composite-step-list}}
