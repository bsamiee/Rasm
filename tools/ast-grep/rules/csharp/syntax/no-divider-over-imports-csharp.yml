# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-divider-over-imports-csharp
language: csharp
severity: error
rule:
    pattern: $DIVIDER
    all:
        - matches: csharp-divider-comment
        - precedes:
            stopBy: {not: {kind: comment}}
            kind: 'extern_alias_directive, using_directive, global_attribute, file_scoped_namespace_declaration, namespace_declaration'
        - precedes: {pattern: $NEXT}
message: Divider `$DIVIDER` sits over the preamble
note: Delete the divider, `extern alias` and `using` directives, assembly attributes, and the namespace line precede every section divider
fix:
    template: $NEXT
    expandEnd: {pattern: $NEXT}
