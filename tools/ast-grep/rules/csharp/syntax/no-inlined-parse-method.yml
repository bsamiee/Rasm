# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-inlined-parse-method
language: csharplang
severity: error
rule:
    kind: invocation_expression
    pattern: $PARSE
    all:
        - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Try)?Parse(Exact)?$'}}
        - matches: {csharp-owned-parse: {owner: {pattern: $OWNER}, argument: {pattern: $ARGUMENT}}}
transform:
    WRAPPED: {replace: {source: $ARGUMENT, replace: '^((?s).*)$', by: '($1)'}}
fix: $OWNER$WRAPPED
labels:
    PARSE: {style: primary, message: Inlined parse}
    OWNER: {style: secondary, message: Method whose body is the parse}
message: '`$PARSE` repeats the body of `$OWNER`'
note: 'Call `<owner>(<argument>)`'
