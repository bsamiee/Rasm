id: no-fourth-csharp-nesting-level
valid:
    - "class C { void F() { if(a) while(b) foreach(var x in xs) Work(); } }"
    - "class C { void F() { if(a) A(); else if(b) B(); else if(c) Cc(); else if(d) D(); else E(); } }"
    - "class C { int F() => a ? 1 : b ? 2 : c ? 3 : d ? 4 : 5; }"
    - "class C { int F() => a ? 1 : (b ? 2 : (c ? 3 : (d ? 4 : 5))); }"
    - "class C { int F() => a ? (b ? (c ? 1 : 2) : 3) : 4; }"
    - "class C { void F() { if(a) while(b) { void Local() { if(c) while(d) foreach(var x in xs) Work(); } } } }"
    - "class C { void F() { if(a) while(b) Run(() => { if(c) while(d) foreach(var x in xs) Work(); }); } }"
    - "class C { void F() { if(a) while(b) try { Work(); } catch(E e) { Retry(); } finally { Close(); } } }"
    - "class C { int F(object x) => x switch { A { B.C.D.E: true } => 1, B => 2, C => 3, D => 4, _ => 0 }; }"
    - "class C { void F() { using var a=Open(); using var b=Open(); using var c=Open(); using var d=Open(); Work(); } }"
    - "class C { object F() => A(x => B(y => Cc(z => z))); }"
    - "class C { void F() { void A() { void B() { void D() { Work(); } } } } }"
    - "class C { int P { get { if(a) while(b) foreach(var x in xs) Work(); return 0; } } }"
    - "class C { object F() => from x in xs from y in ys from z in zs from w in ws select w; }"
    - "class A { class B { class C { class D { int P => 1; } } } }"
    - "class C { object F() => A(() => { object Local() { return B(delegate { return 1; }); } return Local(); }); }"
invalid:
    - "class C { void F() { if(a) while(b) foreach(var x in xs) if(c) Work(); } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) for(;;) Work(); } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) do Work(); while(c); } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) while(c) Work(); } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) foreach(var y in ys) Work(); } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) switch(x) { case 0: Work(); break; } } }"
    - "class C { int F() { if(a) while(b) foreach(var x in xs) return x switch { 0 => 1, _ => 0 }; return 0; } }"
    - "class C { int F() { if(a) while(b) foreach(var x in xs) return c ? 1 : 0; return 0; } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) try { Work(); } finally { Close(); } } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) using(var y=Open()) Work(); } }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) lock(x) Work(); } }"
    - "class C { unsafe void F() { if(a) while(b) foreach(var x in xs) fixed(int* y=xs) Work(); } }"
    - "class C { object F() => A(x => B(y => Cc(z => D(w => w)))); }"
    - "class C { void F() { void A() { void B() { void D() { void E() { Work(); } } } } } }"
    - "class C { object F() => A(delegate { return B(delegate { return Cc(delegate { return D(delegate { return 1; }); }); }); }); }"
    - "class C { void F() { if(a) while(b) foreach(var x in xs) if(c) while(d) Work(); } }"
    - "class C { void F() { if(a) A(); else if(b) while(c) foreach(var x in xs) if(d) Work(); } }"
    - "class C { int F() => a ? (b ? (c ? (d ? 1 : 2) : 3) : 4) : 5; }"
    - "class C { void F() { if(a) while(b) try { Work(); } catch(E e) { if(c) Work(); } } }"
    - "class C { object F() => A(x => B(y => Cc(z => D(w => E(v => v))))); }"
    - "class C { void F() { if(a) while(b) Run(() => { if(c) while(d) foreach(var x in xs) if(e) Work(); }); } }"
    - "class C { void F() { if(a) { while(b) { foreach(var x in xs) { if(c) { while(d) Work(); } } } } } }"
    - "class C { object F() => A(() => { object Local() { return B(delegate { return D(x => x); }); } return Local(); }); }"
