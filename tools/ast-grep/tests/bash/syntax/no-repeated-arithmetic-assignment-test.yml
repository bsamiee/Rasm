# Cover every compound operator and precedence boundary; shell assignment status is preserved.
id: no-repeated-arithmetic-assignment
valid:
    - ((m = m == n))
    - ((m = m && n))
    - ((m = 2 - m))
    # Expansion substitutes an expression before arithmetic precedence applies
    - ((m = $m + n))
    - ((m = n + m))
    - ((m = m + n + 1))
    - ((m += 1))
    - ((m == m + 2))
    - ((m = n + 1))
    - count=$((count - 1))
    - count=$((${count:-0} + 1))
    - values[i]=$((values[i] + 1))
    # let is shellcheck SC2219's
    - let n=n+1
invalid:
    - ((m = m + n))
    - ((m = m - n))
    - ((m = m * n))
    - ((m = m / n))
    - ((m = m % n))
    - ((m = m << n))
    - ((m = m >> n))
    - ((m = m & n))
    - ((m = m | n))
    - ((m = m ^ n))
    # The arithmetic command form with the number first
    - ((m = 2 + m))
    - ((m = 2 * m))
    - ((m = 2 & m))
    - ((m = 2 | m))
    - ((m = 2 ^ m))
    - for ((i=0; i<3; i=i+1)); do printf "%s" "$i"; done
    - ((m = m - n, x = 3))
    - result=$((m = m + 1))
    - ((m = m + -1))
    - ((m = m * (n + 1)))
