# --- [SETTINGS] -------------------------------------------------------------------------
[settings]
prereleases                         = true
minimum_release_age                 = "0s"
registry_floating                   = true
idiomatic_version_file_enable_tools = ["dotnet", "rust"]
dotnet.cli_telemetry_optout         = true
python.uv_venv_auto                 = "create|source"
experimental                        = true
auto_install                        = false

# --- [ENV] ------------------------------------------------------------------------------
[env]
_.path                                = ["./node_modules/.bin", "{{ xdg_config_home }}/swiftpm/bin"]
DOTNET_NOLOGO                         = "1"
DOTNET_ROLL_FORWARD                   = "Major"
NODE_COMPILE_CACHE                    = "{{config_root}}/.cache/node"
PYTHONPYCACHEPREFIX                   = "{{config_root}}/.cache/pycache"
HYPOTHESIS_STORAGE_DIRECTORY          = "{{config_root}}/.cache/hypothesis"
CARGO_LLVM_COV_DENY_WARNINGS          = "1"
RUSTUP_TOOLCHAIN                      = false
RUSTUP_AUTO_INSTALL                   = "0"
TOMBI_CACHE_HOME                      = "{{config_root}}/.cache/tombi"
YAMLLINT_CONFIG_FILE                  = "{{config_root}}/.config/yamllint.yaml"
XDG_CONFIG_HOME                       = "{{ xdg_config_home }}"
MACOSX_DEPLOYMENT_TARGET              = "27.0"
SWIFTPM_BUILD_DIR                     = "{{config_root}}/.cache/swiftpm/build"
OMIT_DYNAMIC_TEST_SUPPORT             = "1"
NX_WORKSPACE_DATA_DIRECTORY           = ".cache/nx/workspace-data"
NX_ISOLATE_PLUGINS                    = "false"
NX_DEFAULT_OUTPUT_STYLE               = "static-failures-only"
CLOUDFLARE_DEV_REGISTRY_PATH          = "{{config_root}}/.cache/cloudflare/registry"
STORYBOOK_DISABLE_TELEMETRY           = "1"
PLAYWRIGHT_MCP_CONFIG                 = "{{config_root}}/.playwright/cli.config.json"
PLAYWRIGHT_MCP_OUTPUT_DIR             = "{{config_root}}/.artifacts/playwright"
WATCH_APPS_LOG                        = "{{config_root}}/.artifacts/logs/watch-apps.log"
RHINO_MCP_URL                         = "http://127.0.0.1:{{ env.RHINO_MCP_PLATFORM_PORT }}/"
BLENDER_PATH                          = """{% if os() == "macos" %}{{ exec(command=`mdfind "kMDItemCFBundleIdentifier == 'org.blenderfoundation.blender'" | head -n 1`, cache_key="blender-path", cache_duration="1d") }}/Contents/MacOS/Blender{% elif os() == "windows" %}{{ exec(command="where blender", cache_key="blender-path", cache_duration="1d") }}{% else %}{{ exec(command="command -v blender", cache_key="blender-path", cache_duration="1d") }}{% endif %}"""
ATELIER_PATH                          = "/Applications/Atelier.app/Contents/MacOS/Atelier"
BLENDER_MCP_URL                       = "http://127.0.0.1:{{ env.BLENDER_LAB_PORT }}/"
PULUMI_HOME                           = "{{config_root}}/.cache/pulumi"
DOPPLER_PROJECT                       = "agent-runtime"
DOPPLER_CONFIG                        = "dev"
PITCHFORK_SUPERVISOR_AUTO_START       = "{% if os() == 'macos' %}false{% else %}true{% endif %}"
PITCHFORK_LOG_TIME_RETENTION          = "7d"
COLIMA_HOME                           = "{{ xdg_data_home }}/rasm/colima"
DOCKER_CONFIG                         = "{{ xdg_data_home }}/rasm/docker"
DOCKER_HOST                           = "{% if os() == 'macos' %}unix://{{ env.COLIMA_HOME }}/default/docker.sock{% else %}unix:///var/run/docker.sock{% endif %}"
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"
GHIDRA_INSTALL_DIR                    = { value = '{{ tools["github:NationalSecurityAgency/ghidra"]?.path or "" }}', tools = true }
GHIDRA_PROJECT_DIR                    = "{{ xdg_cache_home }}/rasm/ghidra/projects"
GHIDRA_JAVA_OPTIONS                   = "-Dapplication.settingsdir={{config_root}}/.cache/ghidra/settings -Dapplication.cachedir={{config_root}}/.cache/ghidra/cache -Dapplication.tempdir={{config_root}}/.cache/ghidra/tmp"

# --- [TOOL_ALIAS] -----------------------------------------------------------------------
[tool_alias]
blender-mcp = "pypi:git+https://projects.blender.org/lab/blender_mcp.git#subdirectory=mcp"

# --- [TOOLS] ----------------------------------------------------------------------------
[tools]
python                               = ["3.15", "3.13"]
java                                 = "latest"
node                                 = "latest"
pnpm                                 = "latest"
uv                                   = "latest"
pixi                                 = "latest"
cargo-binstall                       = "latest"
"cargo:cargo-nextest"                = "latest"
"cargo:cargo-llvm-cov"               = "latest"
"cargo:cargo-edit"                   = "latest"
"cargo:cargo-dylint"                 = "latest"
cargo-insta                          = "latest"
cmake                                = "latest"
git-lfs                              = "latest"
hk                                   = "latest"
actionlint                           = "latest"
"npm:actions-up"                     = "latest"
shellcheck                           = "latest"
shfmt                                = "latest"
yamlfmt                              = "latest"
tombi                                = "latest"
google-java-format                   = "latest"
swiftlint                            = { version = "latest", os = ["macos"] }
periphery                            = { version = "latest", os = ["macos"] }
"http:zxpsigncmd"                    = { version = "4.1.3", os = ["macos"], url = "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/fcee8de5537d2dd2ed3d91d5a495b7041155b280/ZXPSignCMD/{{ version }}/macOS/ZXPSignCmd" }
"dotnet:minver-cli"                  = "latest"
"github:sbdchd/squawk"               = "latest"
ripgrep                              = "latest"
fd                                   = "latest"
jq                                   = "latest"
yq                                   = "latest"
doppler                              = "latest"
pulumi                               = "latest"
gh                                   = "latest"
pitchfork                            = "latest"
colima                               = { version = "latest", os = ["macos"], postinstall = 'mkdir -p "$COLIMA_HOME"' }
lima                                 = { version = "latest", os = ["macos"] }
docker-cli                           = { version = "latest", os = ["macos", "linux"] }
"github:docker/buildx"               = { version = "latest", bin = "docker-buildx", os = ["macos", "linux"], postinstall = 'mkdir -p "$DOCKER_CONFIG/cli-plugins" && ln -sfn "$MISE_TOOL_INSTALL_PATH/docker-buildx" "$DOCKER_CONFIG/cli-plugins/docker-buildx"' }
ast-grep                             = "latest"
tree-sitter                          = "latest"
carapace                             = "latest"
sd                                   = "latest"
difftastic                           = "latest"
duckdb                               = "latest"
hyperfine                            = "latest"
resvg                                = "latest"
"github:linebender/resvg"            = { version = "latest", matching = "usvg" }
imagemagick                          = "latest"
"github:fonttools/fontspector"       = { version = "latest", version_prefix = "fontspector-v" }
"pypi:ast-grep/ast-grep-mcp"         = "latest"
"pypi:tavily-cli"                    = "latest"
"pypi:mcp-for-blender"               = "latest"
blender-mcp                          = "v1"
"dotnet:RoslynCodeLens.Mcp"          = "latest"
"dotnet:NuGet.Mcp.Server"            = "latest"
"dotnet:Microsoft.AITools.BinlogMcp" = "latest"
"dotnet:ilspycmd"                    = "latest"
"github:pmd/pmd"                     = { version = "latest", version_prefix = "pmd_releases/", asset_pattern = "pmd-dist-*-bin.zip" }
"http:jdtls"                         = { version = "latest", url = 'https://download.eclipse.org/jdtls/milestones/{{ version }}/{{ exec(command="curl -fsSL https://download.eclipse.org/jdtls/milestones/" ~ version ~ "/latest.txt") }}', version_list_url = "https://download.eclipse.org/jdtls/milestones/", version_regex = 'milestones/(\d+\.\d+\.\d+)', version_order = "semver" }
"http:xcode-build-server"            = { version = "latest", os = ["macos"], url = "https://github.com/SolaWing/xcode-build-server/archive/refs/tags/v{{ version }}.tar.gz", version_list_url = "https://api.github.com/repos/SolaWing/xcode-build-server/releases", version_json_path = ".[].tag_name", version_order = "semver" }

[tools."http:rustc-source"]
version          = "{{ read_toml(path='rust-toolchain.toml')['toolchain']['channel'] | trim_start(pat='nightly-') }}"
url              = "https://static.rust-lang.org/dist/{{ version }}/rustc-nightly-src.tar.xz"
strip_components = 1
postinstall      = { run = 'ln -sfn "$MISE_TOOL_INSTALL_PATH" "$MISE_CONFIG_ROOT/.cargo/rustc-source"', when = "always" }

[tools."github:NationalSecurityAgency/ghidra"]
version          = "latest"
version_prefix   = "Ghidra_"
asset_pattern    = "ghidra_*_PUBLIC_*.zip"
strip_components = 1
bin_path         = "support"
postinstall      = '''
set -e
mkdir -p "$GHIDRA_PROJECT_DIR"
case "$(uname -sm)" in
    'Darwin arm64') platform=mac_arm_64 arch='-arch arm64' ;;
    'Linux aarch64') platform=linux_arm_64 arch= ;;
    *) platform= ;;
esac
if [ -n "$platform" ]; then
    decompiler="$MISE_TOOL_INSTALL_PATH/Ghidra/Features/Decompiler"
    make -C "$decompiler/src/decompile/cpp" -j "$(getconf _NPROCESSORS_ONLN)" ARCH_TYPE="$arch" ghidra_opt
    mkdir -p "$decompiler/os/$platform"
    mv "$decompiler/src/decompile/cpp/ghidra_opt" "$decompiler/os/$platform/decompile"
    make -C "$decompiler/src/decompile/cpp" clean
fi
'''

# --- [HOOKS] ----------------------------------------------------------------------------
[hooks]
postinstall = "mise exec -- hk install --mise"

# --- [BOOTSTRAP] ------------------------------------------------------------------------
[bootstrap.macos.launchd.agents]
pitchfork = { program = "{{ mise_bin }}", args = ["exec", "--", "pitchfork", "supervisor", "run", "--boot"], working_directory = "{{config_root}}", keep_alive = true }

# --- [DAEMONS] --------------------------------------------------------------------------
[daemons_settings]
namespace = "rasm"

[daemons]
roslyn-codelens    = { run = "exec env -C / roslyn-codelens-mcp --http --port $PORT", env = { DOTNET_GCConserveMemory = "5" }, port = 7401, ready_port = 7401, proxy = false, boot_start = true }
nuget              = { run = "exec rasm-mcp-bridge --listen 127.0.0.1:$PORT --grace 4s -- nuget-mcp-server", env = { DOTNET_GCConserveMemory = "5" }, port = 7402, ready_http = { url = "http://127.0.0.1:7402/", status = [406], timeout = "5m" }, proxy = false, boot_start = true }
binlog             = { run = 'exec env XDG_CACHE_HOME="$PWD/.cache" rasm-mcp-bridge --listen 127.0.0.1:$PORT --grace 4s -- binlog-mcp', env = { DOTNET_GCConserveMemory = "5" }, port = 7403, ready_http = { url = "http://127.0.0.1:7403/", status = [406], timeout = "5m" }, proxy = false, boot_start = true }
ast-grep           = { run = "exec rasm-mcp-bridge --listen 127.0.0.1:$PORT --grace 4s -- ast-grep-server --config sgconfig.yml", env = { AST_GREP_PATH = "sh -c 'c=$1; shift; exec ast-grep \"$c\" --custom-languages allow \"$@\"' ast-grep" }, port = 7404, ready_http = { url = "http://127.0.0.1:7404/", status = [406], timeout = "5m" }, proxy = false, boot_start = true }
rhino-mcp-platform = { run = 'exec rasm-mcp-bridge --listen 127.0.0.1:$PORT --grace 4s -- "$HOME/Library/Application Support/McNeel/Rhinoceros/ai/bin/rhino-mcp-router"', env = { RHINO_MCP_DEFAULT_VERSION = "9" }, port = 7406, ready_http = { url = "http://127.0.0.1:7406/", status = [406], timeout = "5m" }, proxy = false, boot_start = true }
blender-lab        = { run = "exec rasm-mcp-bridge --listen 127.0.0.1:$PORT --grace 4s -- blender-mcp", env = { BLENDER_MCP_PORT = "9877" }, port = 7407, ready_http = { url = "http://127.0.0.1:7407/", status = [406], timeout = "5m" }, proxy = false, boot_start = true }
mcp-for-blender    = { run = "exec doppler run --only-secrets BLENDERMCP_SKETCHFAB_API_KEY,BLENDERMCP_POLYPIZZA_API_KEY --no-fallback --attempts 1 --forward-signals=false -- rasm-mcp-bridge --listen 127.0.0.1:$PORT --grace 4s -- mcp-for-blender", env = { BLENDER_MCP_DISABLE_TELEMETRY = "true" }, port = 7408, ready_http = { url = "http://127.0.0.1:7408/", status = [406], timeout = "5m" }, proxy = false, boot_start = true }
argus              = { run = "exec node plugins/argus/main.ts --listen 127.0.0.1:$PORT", port = 7410, ready_port = 7410, proxy = false, boot_start = true }
playwright-test    = { run = "exec playwright run-test-mcp-server --headless -c tests/typescript/playwright.config.ts --host 127.0.0.1 --port $PORT", port = 7412, ready_port = 7412, proxy = false, boot_start = true }
docker             = { run = '{% if os() == "macos" %}exec env -C "$COLIMA_HOME" colima start --foreground --activate=false --ssh-config=false --mount none --cpus 4 --memory 4{% else %}exec docker events{% endif %}', ready_cmd = { run = 'if [ "$(uname -s)" = Darwin ]; then colima status; else docker version; fi', timeout = "5m" }, stop_signal = { signal = "SIGTERM", timeout = "120s" } }

# --- [TASKS] ----------------------------------------------------------------------------
[tasks."docker:update"]
description = "Updates Colima VM engine and restarts VM on macOS"
run         = '''
{% if os() == "macos" %}
mise daemons start docker
colima update
mise daemons restart docker
{% endif %}
'''
