# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-bound-runner-callable
language: python
severity: error
utils:
    anyio-import:
        inside: {kind: module, stopBy: end, has: {kind: 'import_statement, import_from_statement', regex: '^(import|from)\s+anyio\b', stopBy: end}}
    runner-name:
        any:
            - regex: '(^|\.)run(_sync)?$'
            - kind: identifier
              inside: {kind: 'module, block', stopBy: end, has: {kind: import_from_statement, regex: '(?s)^from\s+anyio(\.\w+)?\s+import\b.*\brun(_sync)?\s+as\b'}}
    thread-module:
        matches: {python-submodule: {parent: {regex: '^anyio$'}, child: {regex: '^(to_thread|from_thread)$'}}}
    process-module:
        matches: {python-submodule: {parent: {regex: '^anyio$'}, child: {regex: '^(to_process|to_interpreter)$'}}}
    in-place-callee:
        any:
            - regex: '(^|\.)(to_thread\.run_sync|from_thread\.run(_sync)?)$'
            - {regex: '\.call$', matches: anyio-import}
            - kind: attribute
              all:
                - has: {field: attribute, regex: '^run(_sync)?$'}
                - has: {field: object, matches: thread-module}
            - all:
                - matches: runner-name
                - any:
                    - matches: {python-member-use: {module: {regex: '^anyio$'}, name: {regex: '^run$'}}}
                    - matches: {python-member-use: {module: {regex: '^anyio\.from_thread$'}, name: {regex: '^run(_sync)?$'}}}
                    - matches: {python-member-use: {module: {regex: '^anyio\.to_thread$'}, name: {regex: '^run_sync$'}}}
    runner-callee:
        any:
            - matches: in-place-callee
            - regex: '(^|\.)((to_process|to_interpreter)\.run_sync|start_soon|start_task(_soon)?)$'
            - {regex: '\.start$', matches: anyio-import}
            - kind: attribute
              all:
                - has: {field: attribute, regex: '^run_sync$'}
                - has: {field: object, matches: process-module}
            - all: [{matches: runner-name}, {matches: {python-member-use: {module: {regex: '^anyio\.(to_process|to_interpreter)$'}, name: {regex: '^run_sync$'}}}}]
    in-place-runner:
        kind: call
        has: {field: function, matches: in-place-callee}
    runner:
        kind: call
        has: {field: function, matches: runner-callee}
    runner-argument:
        nthChild: 1
        inside: {kind: argument_list, inside: {matches: runner}}
    in-place-argument:
        nthChild: 1
        inside: {kind: argument_list, inside: {matches: in-place-runner}}
    plain:
        kind: 'identifier, string, integer, float, true, false, none'
    plain-call:
        kind: call
        all:
            - has: {field: function, kind: 'identifier, attribute', regex: '^[\w.]+$'}
            - has: {field: arguments, not: {has: {pattern: $_, not: {matches: plain}}}}
    partial-call:
        kind: call
        all:
            - has: {field: arguments, has: {nthChild: 1, not: {kind: 'list_splat, parenthesized_list_splat'}}, not: {has: {kind: 'keyword_argument, dictionary_splat'}}}
            - has: {field: function, matches: functools-partial-callee}
    lambda-call:
        kind: lambda
        all:
            - any:
                - not: {has: {field: parameters, kind: lambda_parameters}}
                - has:
                    field: parameters
                    not:
                        has:
                            pattern: $_
                            not:
                                any:
                                    - kind: keyword_separator
                                    - {kind: default_parameter, all: [{has: {field: name, pattern: $P}}, {has: {field: value, pattern: $P}}]}
            - has: {field: body, matches: plain-call}
    partial-relay:
        kind: assignment
        all:
            - has: {field: left, pattern: $BOUND}
            - has: {field: right, matches: partial-call}
    in-place-relay:
        any:
            - kind: assignment
              all:
                - has: {field: left, pattern: $BOUND}
                - has: {field: right, matches: lambda-call}
            - kind: function_definition
              not: {inside: {kind: decorated_definition}}
              all:
                - has: {field: name, pattern: $BOUND}
                - has: {field: parameters, not: {has: {pattern: $_}}}
                - has: {field: body, not: {has: {nthChild: 2}}, has: {nthChild: 1, kind: return_statement}}
                - any:
                    - {not: {regex: '^async\b'}, has: {field: body, has: {kind: return_statement, has: {matches: plain-call}}}}
                    - {regex: '^async\b', has: {field: body, has: {kind: return_statement, has: {kind: await, has: {matches: plain-call}}}}}
    sole-use:
        not:
            has:
                stopBy: end
                kind: identifier
                pattern: $BOUND
                not:
                    any:
                        - inside: {kind: assignment, field: left}
                        - inside: {kind: function_definition, field: name}
                        - inside: {kind: attribute, field: attribute}
                        - inside: {kind: keyword_argument, field: name}
                        - matches: runner-argument
    scope:
        kind: 'function_definition, module'
rule:
    pattern: $BOUND
    any:
        - kind: call
          all:
            - matches: runner-argument
            - matches: partial-call
            - has: {field: arguments, has: {nthChild: 1, pattern: $F}}
            - any:
                - has: {field: arguments, pattern: {context: 'f($_, $$$ARGS)', selector: argument_list}}
                - has: {field: arguments, not: {has: {nthChild: 2}}}
        - kind: lambda
          all:
            - matches: in-place-argument
            - matches: lambda-call
            - has: {field: body, all: [{has: {field: function, pattern: $F}}, {has: {field: arguments, pattern: {context: 'f($$$ARGS)', selector: argument_list}}}]}
        - kind: identifier
          pattern: $UNFIXED
          all:
            - matches: runner-argument
            - any:
                - inside: {matches: scope, stopBy: end, all: [{has: {stopBy: {kind: 'function_definition, class_definition, lambda'}, matches: partial-relay}}, {matches: sole-use}]}
                - all:
                    - matches: in-place-argument
                    - inside: {matches: scope, stopBy: end, all: [{has: {stopBy: {kind: 'function_definition, class_definition, lambda'}, matches: in-place-relay}}, {matches: sole-use}]}
        - kind: 'call, lambda'
          pattern: $UNFIXED
          all:
            - nthChild: 2
            - any: [{matches: partial-call}, {matches: lambda-call}]
            - inside:
                kind: argument_list
                not: {has: {nthChild: 3}}
                inside:
                    kind: call
                    all:
                        - has: {field: function, matches: {python-member-use: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^cast$'}}}}
                        - any:
                            - matches: in-place-argument
                            - {matches: runner-argument, not: {has: {field: arguments, has: {nthChild: 2, kind: lambda}}}}
        - kind: call
          pattern: $UNFIXED
          all:
            - has: {field: function, kind: identifier, pattern: $HELPER}
            - matches: runner-argument
            - inside:
                matches: scope
                stopBy: end
                has:
                    stopBy: {kind: 'function_definition, class_definition, lambda'}
                    kind: function_definition
                    not: {any: [{regex: '^async\b'}, {inside: {kind: decorated_definition}}]}
                    all:
                        - has: {field: name, pattern: $HELPER}
                        - has: {field: body, not: {has: {nthChild: 2}}, has: {nthChild: 1, kind: return_statement, has: {matches: partial-call}}}
transform:
    REST:
        replace: {source: $$$ARGS, replace: '(?s)^(.+)$', by: ', $1'}
fix: $F$REST$UNFIXED
message: '`$BOUND` binds arguments to the function an anyio runner calls'
note: 'Use `<runner>(<function>, <arguments>)`, anyio runners forward positional `*args` to the function'
