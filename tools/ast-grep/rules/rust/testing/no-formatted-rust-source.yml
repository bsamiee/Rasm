# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-formatted-rust-source
language: rust
severity: error
rule:
    kind: macro_invocation
    pattern: $SOURCE
    all:
        - matches: {rust-std-macro: {name: {regex: '^(format|format_args|write|writeln)$'}}}
        - has:
            kind: token_tree
            has:
                kind: 'string_literal, raw_string_literal'
                all:
                    - regex: |-
                        (?x)^r?\#*"(\\n|\s)*(\#\[[^\]"]*\](\\n|\s)*)*(pub(\([\w\s]+\))?\s+)?((async|const|unsafe)\s+)*(
                            fn\s+[\w{}:]+\s*[(<]
                            |(struct|enum|trait|union)\s+[\w{}:]+\s*(\{\{|<|\(|;)
                            |mod\s+[\w{}:]+\s*(\{\{|;)
                            |impl\b[^"]*\{\{
                            |impl(<[^>"]*>)?\s+[\w{}:<>]+\s+for\s+[\w{}:]+
                            |(const|static)\s+[\w{}:]+\s*:
                            |type\s+[\w{}:]+\s*(<[^>"]*>)?\s*=
                            |use\s+[\w{}:]+::
                        )
                    - regex: '(^|[^{])\{[A-Za-z0-9_:}]'
message: '`$SOURCE` writes Rust source as formatted text'
note: 'Build the item as tokens with `quote::quote!` and `quote::format_ident!`, parse them through `syn::parse2::<syn::File>(tokens)?`, and print with `prettyplease::unparse(&file)`, `syn` checks every generated item''s syntax and `prettyplease` owns its layout'
