id: no-growth-in-endless-loop-rust
valid:
    - |
      fn drain(source: &Source) -> Result<(), Fault> {
          let mut seen = Vec::new();
          loop {
              seen.push(source.next()?);
          }
      }
    - |
      fn drain(source: &Source) {
          let mut seen = Vec::new();
          loop {
              seen.push(source.next());
              if seen.len() > 8 {
                  return;
              }
          }
      }
invalid:
    - |
      fn drain(source: &Source) {
          let mut seen = Vec::new();
          loop {
              let next: Option<u8> = try { source.next()? };
              seen.push(next);
          }
      }
    - |
      fn drain(source: &Source) {
          let mut seen = Vec::new();
          loop {
              let pending = gen { return; };
              seen.push(pending);
          }
      }
