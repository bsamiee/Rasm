id: no-never-arm
valid:
    - |
      const reason = decision.match<string>({ deny: absurd, answer: absurd, rewrite: (input) => input.prompt });
    - |
      const absurd = (value: never): never => value;
    - |
      const reason = decision.match<string>({ deny: (reason: string): string => reason, rewrite: () => '' });
    - |
      run((value: never): never => value);
    - |
      const text = option.match<string>({ some: (value) => value, none: (): never => absurd(none) });
    - |
      class Arms { deny(value: never): never { return value; } }
    - |
      const reason = decision.match<string>({ deny: (values: never[]): string => '', rewrite: (input) => input.prompt });
    - |
      const reason = decision.match<string>({ deny: wrap((value: never): never => value), rewrite: (input) => input.prompt });
    - |
      type Arms = { deny: never };
    - |
      const reason = decision.match<string>({ deny: (value?: never): string => String(value), rewrite: (input) => input.prompt });
    - "const arms = { deny: (value: never = fail()): never => value };"
invalid:
    - |
      const reason = decision.match<string>({ deny: (value: never): never => value, rewrite: (input) => input.prompt });
    - |
      const reason = decision.match<string>({ deny: function (value: never): never { return value; }, rewrite: (input) => input.prompt });
    - |
      const reason = decision.match<string>({ deny(value: never): never { return value; }, rewrite: (input) => input.prompt });
    - |
      const reason = decision.match<string>({ answer: (_result: never): never => { throw new Error('unreachable'); }, rewrite: (input) => input.prompt });
    - |
      const done = decision.match<Promise<void>>({ deny: (_reason: never): Promise<void> => Promise.resolve(), rewrite: () => next(e) });
    - |
      const reason = decision.match<string>({ deny: (_: never): never => absurd(_), rewrite: (input) => input.prompt });
    - |
      const done = decision.match<Promise<void>>({ async deny(_reason: never): Promise<void> { return; }, rewrite: () => next(e) });
    - |
      const arms = { deny: (value: never): never => value, rewrite: (input) => input.prompt };
    - |
      const reason = decision.match<string>({ *deny(value: never) { yield value; }, rewrite: (input) => input.prompt });
    - |
      const done = decision.match<Promise<void>>({ deny: async (_reason: never): Promise<void> => {}, rewrite: () => next(e) });
    - |
      const arms = { deny: function* (value: never) { yield value; }, rewrite: (input) => input.prompt };
    - |
      const arms = { deny: async function* (value: never) { yield value; }, rewrite: (input) => input.prompt };
    - |
      const reason = decision.match<string>({ deny: (reason: string, extra: never): string => reason, rewrite: (input) => input.prompt });
