# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-alias-declaration-rust
language: rust
severity: error
rule:
    kind: type_item
    all:
        - has: {field: name, pattern: $ALIAS}
        - has: {field: type, pattern: $TARGET}
        - not: {inside: {kind: declaration_list, inside: {kind: 'trait_item, impl_item'}}}
        - not: {matches: {rust-attributed: {attribute: {matches: rust-cfg-attribute}}}}
message: '`$ALIAS` is another name for `$TARGET`'
note: 'Spell the aliased type at each use and delete the alias'
