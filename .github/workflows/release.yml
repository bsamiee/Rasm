name: Release

on:
    workflow_dispatch:
        inputs:
            specifier:
                description: Version or semver keyword every released project takes, empty reads conventional commits
                type: string
            first-release:
                description: No release tag exists yet
                type: boolean
                default: false
            dry-run:
                description: Previews the version, tag, and GitHub release, changes nothing and skips attach and publish
                type: boolean
                default: true
            publish:
                description: Publishes every package to its registry or store after the release
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    release:
        runs-on: xcode-27
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
        outputs:
            commit: ${{ steps.released.outputs.commit }}
            engines: ${{ steps.released.outputs.engines }}
        env:
            GH_TOKEN: ${{ github.token }}
            UV_LOCKED: "true"
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
            DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
            ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
            ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
            ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest
            - &tools
              uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
              with:
                  cache: ${{ runner.environment == 'github-hosted' }}
            - &packages
              run: pnpm install
            - run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
            - run: nx release ${SPECIFIER:+"${SPECIFIER}"} --skip-publish --first-release=${{ inputs.first-release }} --dry-run=${{ inputs.dry-run }}
              env:
                  SPECIFIER: ${{ inputs.specifier }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            - id: released
              run: |
                  commit="$(git rev-parse HEAD)"
                  engines="$(git ls-files -z -- "*.uproject" | xargs -0 cat | jq --slurp --compact-output 'map(.EngineAssociation | strings | select(test("^[0-9.]+$"))) | unique')"
                  printf "commit=%s\nengines=%s\n" "${commit}" "${engines}" >> "${GITHUB_OUTPUT}"
            - if: ${{ !inputs.dry-run }}
              run: nx run-many --targets=attach --configuration=release
            - if: ${{ inputs.publish && !inputs.dry-run }}
              run: nx release publish --first-release=${{ inputs.first-release }}
              env:
                  PNPM_CONFIG_NPMRC_AUTH_FILE: ${{ github.workspace }}/.config/npmrc
                  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
                  UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
                  BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
                  SPARKLE_FEED_BUCKET: ${{ vars.SPARKLE_FEED_BUCKET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    unreal:
        needs: release
        if: ${{ !inputs.dry-run && needs.release.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.release.outputs.engines) }}
        runs-on: [self-hosted, linux, x64]
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
        env:
            GH_TOKEN: ${{ github.token }}
            UV_LOCKED: "true"
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: "false"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release.outputs.commit }}
                  fetch-depth: 0
            - *tools
            - *packages
            - run: nx run-many --targets=attach --configuration=release --projects=tag:os:linux
