# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-central-property-in-project
language: xml
severity: error
files: ["**/*.csproj"]
rule:
    pattern: _PROPERTY
    matches:
        msbuild-property:
            name:
                regex: "^(NoWarn|(MSBuild)?Warnings(AsErrors|NotAsErrors|AsMessages)|(MSBuild|CodeAnalysis)?TreatWarningsAsErrors|AnalysisLevel|AnalysisMode|RunAnalyzers|EnforceCodeStyleInBuild|NuGetAudit(Mode|Level)?|ArtifactsPath|UseArtifactsOutput|ArtifactsProjectName|Base(Intermediate)?OutputPath|OutputPath|Version|VersionPrefix|VersionSuffix|PackageVersion|InformationalVersion|AssemblyVersion|FileVersion|MinVer[A-Za-z]*|GeneratePackageOnBuild|ContinuousIntegrationBuild|RestorePackagesWithLockFile|RestoreLockedMode|IsTestProject|UseMicrosoftTestingPlatformRunner|IsTestingPlatformApplication|TestingPlatform[A-Za-z]*|Enable(MSTest|NUnit)Runner|GenerateTestingPlatformEntryPoint)$"
fix:
    template: ""
    expandEnd: {kind: CharData, regex: '^\s*$'}
message: The project file sets a property another file owns
note: Delete the property, the root files, .editorconfig, the git tag, the native manifest, or the test package hold it
