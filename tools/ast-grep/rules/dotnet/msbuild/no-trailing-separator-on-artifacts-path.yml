# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-trailing-separator-on-artifacts-path
language: xml
severity: error
rule:
    pattern: _PROPERTY
    # Separator ending the value or the last NormalizePath argument, or a function appending one, the text slot binds the value for the message
    matches:
        msbuild-property-value:
            name: {regex: '^ArtifactsPath$'}
            text: {pattern: _TEXT, regex: '[\\/]\s*$|[\\/]''\s*\)\s*\)\s*$|NormalizeDirectory|EnsureTrailingSlash'}
transform:
    # Padding around the value trims away, the message stays on one line
    VALUE: {replace: {source: $TEXT, replace: '^\s+|\s+$', by: ''}}
    # NormalizePath keeps a separator its last argument ends with, EnsureTrailingSlash over one property takes the BCL trim
    TRIMMED: {replace: {source: $PROPERTY, replace: '[\\/](\s*</ArtifactsPath>|''\s*\)\s*\)\s*</ArtifactsPath>)$', by: '$1'}}
    NORMALIZED: {replace: {source: $TRIMMED, replace: 'NormalizeDirectory\(', by: 'NormalizePath('}}
    UNSLASHED: {replace: {source: $NORMALIZED, replace: '\[MSBuild\]::EnsureTrailingSlash\(', by: '[System.IO.Path]::TrimEndingDirectorySeparator('}}
fix: $UNSLASHED
message: >-
    ArtifactsPath $VALUE ends with a separator and the SDK appends its own before bin, obj, publish, and package, every output path holds a
    doubled separator
note: Write the value without a trailing separator, NormalizePath for NormalizeDirectory and TrimEndingDirectorySeparator for EnsureTrailingSlash
