# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "mcp-muxer"
edition.workspace = true
description       = "Shares one stdio MCP server process across every agent session that configures the same server"
publish           = false

# --- [TARGETS] --------------------------------------------------------------------------

[[bin]]
name = "mcp-muxer"
path = "main.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
backon                             = { workspace = true }
futures                            = { workspace = true }
tokio                              = { workspace = true, features = ["io-std"] }
itertools                          = { workspace = true }
tokio-util                         = { workspace = true }
nonempty-collections               = { workspace = true }
camino                             = { workspace = true }
tempfile                           = { workspace = true }
dirs                               = { workspace = true }
interprocess                       = { workspace = true }
rlimit                             = { workspace = true }
sysinfo                            = { workspace = true }
which                              = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
derive_more                        = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
jiff                               = { workspace = true }
xxhash-rust                        = { workspace = true }
fs-err                             = { workspace = true, features = ["tokio"] }
rmcp                               = { workspace = true, default-features = false, features = ["server"] }
opentelemetry                      = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-subscriber                 = { workspace = true }
clap                               = { workspace = true }
rasm-cli                           = { workspace = true }
rasm-ipc                           = { workspace = true }
rasm-mcp                           = { workspace = true, features = ["proxy"] }
rasm-process                       = { workspace = true }
rasm-telemetry                     = { workspace = true, features = ["metrics", "process"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
