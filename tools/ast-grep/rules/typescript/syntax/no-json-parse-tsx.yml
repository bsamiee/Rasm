# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-parse-tsx
language: tsx
severity: error
ignores: ['plugins/function-hooks/**', '.codex/hooks/**']
rule:
    kind: call_expression
    any:
        - has: {field: function, pattern: $PARSE, regex: '^((globalThis|window|self)\.)?JSON\.parse$', matches: syntax-global-reference}
        - all:
            - has: {field: function, pattern: $PARSE, kind: member_expression, has: {field: property, regex: '^json$'}}
            - not: {has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}}
message: '`$PARSE` parses JSON into an unvalidated `any`'
note: '`Schema.decodeUnknownEffect(Schema.fromJsonString(<schema>))` over the body text parses and validates in one step into the typed value or a `SchemaError`'
