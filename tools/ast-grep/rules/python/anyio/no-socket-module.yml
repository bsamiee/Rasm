# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-socket-module
language: python
severity: error
utils:
    socket-member:
        regex: '^(socket|create_connection|create_server|getaddrinfo|getnameinfo|gethostbyname|gethostbyname_ex|gethostbyaddr|getfqdn)$'
rule:
    kind: call
    pattern: $CALL
    has:
        field: function
        any:
            - matches: {python-module-member: {module: {regex: '^socket$'}, name: {matches: socket-member}}}
            - matches: {python-imported-name: {module: {regex: '^socket$'}, name: {matches: socket-member}}}
message: '`$CALL` uses the blocking socket module'
note: 'Use `anyio.connect_tcp` or `anyio.create_tcp_listener` for TCP, `anyio.create_udp_socket` for UDP, `anyio.connect_unix` or `anyio.create_unix_listener` for a Unix socket, and `anyio.getaddrinfo` or `anyio.getnameinfo` for a name'
