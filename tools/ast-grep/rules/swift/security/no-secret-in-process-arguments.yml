# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-secret-in-process-arguments
language: swift
severity: error
rule:
    any:
        - matches: {swift-security-arguments: {subcommand: {regex: '^"add-generic-password"$', pattern: $COMMAND}}}
          has: {kind: line_string_literal, regex: '^"-(p|w|X)"$', pattern: $FLAG, precedes: {pattern: $_, stopBy: {pattern: $_}}}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"add-internet-password"$', pattern: $COMMAND}}}
          has: {kind: line_string_literal, regex: '^"-(w|X)"$', pattern: $FLAG, precedes: {pattern: $_, stopBy: {pattern: $_}}}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"(create|unlock)-keychain"$', pattern: $COMMAND}}}
          has: {kind: line_string_literal, regex: '^"-p"$', pattern: $FLAG, precedes: {pattern: $_, stopBy: {pattern: $_}}}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"set-keychain-password"$', pattern: $COMMAND}}}
          has: {kind: line_string_literal, regex: '^"-(o|p)"$', pattern: $FLAG, precedes: {pattern: $_, stopBy: {pattern: $_}}}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"set-(generic-password|internet-password|key)-partition-list"$', pattern: $COMMAND}}}
          has: {kind: line_string_literal, regex: '^"-k"$', pattern: $FLAG, precedes: {pattern: $_, stopBy: {pattern: $_}}}
        - matches: {swift-security-arguments: {subcommand: {regex: '^"(import|export)"$', pattern: $COMMAND}}}
          has: {kind: line_string_literal, regex: '^"-P"$', pattern: $FLAG, precedes: {pattern: $_, stopBy: {pattern: $_}}}
message: '`$FLAG` exposes the secret of `$COMMAND` in argv to `ps` under the same uid'
note: 'Pass `["-i"]` as argv and write the command with its secret on stdin, one line of at most 4095 bytes'
