# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-yaml
language: yaml
severity: error
utils:
    unreported:
        inside: {kind: ERROR, stopBy: end}
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: stream
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Span fails to parse, write it in a form tree-sitter-yaml parses
note: Every other rule skips constructs inside a parse error
