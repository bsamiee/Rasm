# Runtimes and standalone binaries no package manifest can pin, the .NET SDK version comes from global.json
min_version = "2026.8.6"

[tools]
node = "26.8.1"
pnpm = "12.3.1"
python = "3.15.0rc2"
uv = "0.12.9"
git-lfs = "3.8.0"
act = "0.2.89"
actionlint = "1.7.12"
"github:sethvargo/ratchet" = "0.12.0"

[settings]
idiomatic_version_file_enable_tools = ["dotnet"]

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
PULUMI_HOME = "{{config_root}}/.cache/pulumi"
NX_WORKSPACE_DATA_DIRECTORY = "{{config_root}}/.cache/nx/workspace-data"
