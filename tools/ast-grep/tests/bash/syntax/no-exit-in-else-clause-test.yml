id: no-exit-in-else-clause
valid:
    - |
      for s in a; do
      [[ -v count[keys,$id] ]] || {
          finding "no snapshot: $id"
          continue
      }
      done
    - |
      if [[ -f $s ]]; then
          exit 2
      else
          exit 1
      fi
    - |
      f() {
      if [[ -f $s ]]; then
          return 1
      else
          printf '%s\n' b
      fi
      }
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      elif [[ -d $s ]]; then
          printf '%s\n' b
      else
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          printf '%s\n' b
      fi
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          exit 1
          printf '%s\n' late
      fi
    - |
      if a; b; then
          printf '%s\n' a
      else
          exit 1
      fi
    - if [[ -f $s ]]; then exit 2; else exit 1; fi
    - |
      if [[ -f $s ]]; then
          exit 2 # done
      else
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          exit 2
          # trailing comment
      else
          exit 1
      fi
    - if [[ -f $s ]]; then exit 2; printf '%s\n' late; else exit 1; fi
    - |
      if [[ -f $s ]]; then
          exit 2
          printf '%s\n' late
      else
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          cat <<TEXT
              indented
      TEXT
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          cat <<TEXT
              indented
      TEXT
      else
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          message="first
              second"
          printf '%s\n' "$message"
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          message="first
      second"
      else
          exit 1
      fi
invalid:
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          # explain
          exit 1
      fi
    - |
      for s in a; do
      if [ -f "$s" ]; then
          diff a b
      else
          finding "no snapshot: $id"
          continue
      fi
      done
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a # note
          if [[ -d $s ]]; then
              count=1
          fi
      else
          exit 1
      fi
    - |
      if ! grep -q x "$f" | sort; then
          printf '%s\n' "$f"
      else
          exit 1
      fi
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          exit 1
      fi
    - if ! grep -q x "$f"; then printf '%s\n' a; else exit 1; fi
    - if [[ -f $s ]] && [[ -r $s ]]; then printf '%s\n' a; else exit 1; fi
    - |
      for f in "${files[@]}"; do
          if [[ -f $f ]]; then
              printf '%s\n' "$f"
          else
              break
          fi
      done
    - |
      f() {
      if [[ -f $s ]]; then
          printf '%s\n' a
      else
          return 1
          # nothing after
      fi
      }
    - |
      if [[ -f $s ]]; then
          printf '%s\n' a
          if [[ -d $s ]]; then
              count=1
          fi
          printf '%s\n' b
      else
          exit 1
      fi
