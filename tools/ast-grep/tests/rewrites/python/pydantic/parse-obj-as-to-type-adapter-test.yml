    - |
      import custom as pd
      pd.parse_obj_as(list[int], values)
    # Imports in other functions cannot bind the caller's parameter
    - |
      def configure():
          import pydantic as pd
      def validate(pd, values):
          return pd.parse_obj_as(list[int], values)
    # Class attributes are not unqualified module aliases inside methods
    - |
      class Validator:
          import pydantic as pd
          def validate(self, pd, values):
              return pd.parse_obj_as(list[int], values)
    # Function parameters shadow imported module aliases
    - |
      import pydantic as pd
      def validate(pd, values):
          return pd.parse_obj_as(list[int], values)
    # Local assignments replace imported module aliases
    - |
      import pydantic as pd
      def validate(values):
          pd = Custom()
          return pd.parse_obj_as(list[int], values)
    # Parameters can shadow the module's unaliased name
    - |
      def validate(pydantic, values):
          return pydantic.parse_obj_as(list[int], values)
    # Lambda parameters shadow enclosing imports
    - |
      import pydantic as pd
      validate = lambda pd: pd.parse_obj_as(int, "2")
    # A loop binding replaces the imported module alias
    - |
      import pydantic as pd
      for pd in validators:
          pd.parse_obj_as(int, value)
