# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-context-member-none-test
language: python
severity: error
utils:
    context:
        any:
            - kind: parenthesized_expression
              has: {matches: context}
            - matches: {python-member-use: {module: {regex: '^bpy$'}, name: {regex: '^context$'}}}
            - matches: {python-typed-parameter: {type: {has: {matches: {python-member-use: {module: {regex: '^bpy\.types$'}, name: {regex: '^Context$'}}}}}}}
    member:
        kind: attribute
        all:
            - has: {field: attribute, regex: '^preferences$'}
            - has: {field: object, matches: context}
    tested:
        any:
            - matches: member
            - kind: named_expression
              has: {field: value, matches: member}
            - kind: parenthesized_expression
              has: {matches: tested}
            - kind: identifier
              matches: {python-assigned-name: {value: {matches: member}}}
    none-value:
        any:
            - kind: none
            - kind: parenthesized_expression
              has: {matches: none-value}
    none-pattern:
        any:
            - kind: none
            - kind: case_pattern, union_pattern, as_pattern
              has: {matches: none-pattern}
            - kind: tuple_pattern
              all:
                - not: {has: {pattern: $$_COMMA, regex: '^,$'}}
                - has: {matches: none-pattern}
    truth-position:
        any:
            - inside: {kind: parenthesized_expression, matches: truth-position}
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition}
            - all: [{inside: {kind: assert_statement}}, {nthChild: 1}]
            - all: [{inside: {kind: conditional_expression}}, {nthChild: 2}]
            - inside: {kind: if_clause}
            - inside: {kind: not_operator, field: argument}
            - inside: {kind: boolean_operator, field: left}
            - inside: {kind: boolean_operator, field: right, matches: truth-position}
    optional-wrap:
        any:
            - kind: parenthesized_expression
              has: {matches: optional-wrap}
            - matches: {python-member-use: {module: {regex: '^expression(\.core)?\.option$'}, name: {regex: '^of_(obj|optional)$'}}}
            - kind: attribute
              all:
                - has: {field: attribute, regex: '^of_(obj|optional)$'}
                - has: {field: object, matches: {python-member-use: {module: {regex: '^expression(\.core)?(\.option)?$'}, name: {regex: '^(Option|option)$'}}}}
    test-call:
        regex: '(^|\.)(bool|isinstance|of_obj|of_optional)\)?$'
        any: [{matches: optional-wrap}, {matches: {python-builtin-name: {name: {regex: '^(bool|isinstance)$'}}}}]
rule:
    any:
        - kind: comparison_operator
          has:
            matches: tested
            any:
                - precedes:
                    regex: '^(is|is\s+not|==|!=)$'
                    stopBy: {not: {kind: comment}}
                    precedes: {matches: none-value, stopBy: {not: {kind: comment}}}
                - follows:
                    regex: '^(is|is\s+not|==|!=)$'
                    stopBy: {not: {kind: comment}}
                    follows: {matches: none-value, stopBy: {not: {kind: comment}}}
        - all:
            - not: {inside: {kind: parenthesized_expression}}
            - any:
                - matches: truth-position
                - inside: {kind: match_statement, field: subject, has: {field: body, has: {kind: case_clause, has: {matches: none-pattern}}}}
                - nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                  inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: test-call}}}
                - inside:
                    kind: keyword_argument
                    field: value
                    has: {field: name, regex: '^value$'}
                    inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: test-call}}}
            - matches: tested
message: 'Absence test reads `Context.preferences`, whose native getter returns the global user preferences'
note: 'Use `Context.preferences` directly; its native value is present independently of the context window, scene and window manager'
