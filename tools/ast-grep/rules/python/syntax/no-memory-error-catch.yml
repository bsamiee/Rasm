# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-memory-error-catch
language: python
severity: error
utils:
    memory-error:
        any:
            - matches: {python-builtin-name: {name: {regex: '^MemoryError$'}}}
            - kind: tuple, parenthesized_expression
              has: {matches: memory-error}
            - kind: as_pattern
              has: {nthChild: 1, matches: memory-error}
rule:
    any:
        - kind: except_clause
          has: {field: value, pattern: $CAUGHT, matches: memory-error}
        - kind: keyword_argument
          all:
            - has: {field: name, regex: '^exception$'}
            - has: {field: value, pattern: $CAUGHT, matches: memory-error}
            - inside:
                kind: argument_list
                inside: {kind: call, has: {field: function, matches: {expression-member: {name: {regex: '^catch$'}}}}}
message: '`$CAUGHT` catches `MemoryError`, an allocation defect'
note: 'Remove `MemoryError` from caught exceptions'
