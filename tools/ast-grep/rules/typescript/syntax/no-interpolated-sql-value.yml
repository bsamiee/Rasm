# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-interpolated-sql-value
language: tsx
severity: error
utils:
    hand-quoted:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^replace(All)?$'}}
                - has: {field: arguments, has: {nthChild: 2, kind: string, regex: "^[\"`]''[\"`]$"}}
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^join$'}}, {has: {field: object, kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: '^split$'}}}}]}
                - has: {field: arguments, has: {nthChild: 1, kind: string, regex: "^[\"`]''[\"`]$"}}
    quoting:
        any:
            - matches: hand-quoted
            - kind: call_expression
              has: {field: function, kind: identifier, pattern: $QUOTER}
              inside:
                kind: program
                stopBy: end
                has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $QUOTER}}, {has: {field: value, has: {stopBy: end, matches: hand-quoted}}}]}
rule:
    kind: template_string
    all:
        - has: {kind: string_fragment, regex: '(?im)^\s*(alter|analyze|attach|begin|commit|create|delete|detach|drop|end|explain|insert|pragma|reindex|release|replace|rollback|savepoint|select|update|vacuum|values|with)\b'}
        - not: {inside: {kind: call_expression, field: arguments}}
        - not: {has: {kind: string_fragment, regex: '(?m)^\s*\.param(eter)?\b'}}
        - has:
            kind: template_substitution
            pattern: $VALUE
            any:
                - follows: {kind: string_fragment, regex: "'$"}
                - has: {stopBy: end, matches: quoting}
message: '`$VALUE` splices a quoted value into SQL text, a bound parameter carries it'
note: 'Keep the statement constant and bind each value as a parameter, through `bound` in `observation/sql.ts` for the sqlite3 shell and the Effect SQL client tagged template elsewhere, the database then reads each value typed and unquoted'
