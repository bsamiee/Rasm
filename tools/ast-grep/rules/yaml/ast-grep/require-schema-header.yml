# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-schema-header
language: yaml
severity: error
files: [tools/ast-grep/rules/**, tools/ast-grep/utils/**, tools/ast-grep/rewrites/**]
rule:
    kind: stream
    pattern: $FILE
    not: {has: {kind: comment, nthChild: 1, regex: '^# yaml-language-server: \$schema=https://raw\.githubusercontent\.com/ast-grep/ast-grep/main/schemas/rule\.json$'}}
transform:
    BODY: {replace: {source: $FILE, replace: '(?m)^#\s*yaml-language-server:\s*\$schema=[^\n]*\n', by: ''}}
fix: |-
    # yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
    $BODY
message: The file opens with no `rule.json` schema line
note: 'Write `# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json` on line 1'
