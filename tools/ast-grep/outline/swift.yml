id: swift-import
language: swiftlang
role: item
symbolType: module
rule:
    kind: import_declaration
    pattern: $DECLARATION
    has: {kind: identifier, pattern: $NAME}
name: $NAME
signature: $DECLARATION
isImport: true
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|package)$'}}}

---
id: swift-class
language: swiftlang
role: item
symbolType: class
rule:
    kind: class_declaration
    pattern: $DECLARATION
    all:
        - has: {field: declaration_kind, regex: '^class$'}
        - has: {field: name, pattern: $NAME}
transform:
    HEADER: {replace: {source: $DECLARATION, replace: '\s*\{[\s\S]*$', by: ''}}
    UNTRAILED: {replace: {source: $HEADER, replace: ',(\s*\n\s*[)\]>])', by: '$1'}}
    LINE: {replace: {source: $UNTRAILED, replace: '\s*\n\s*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '(\()\s+|\s+(\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open)$'}}}

