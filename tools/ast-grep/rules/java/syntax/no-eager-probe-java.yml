# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-eager-probe-java
language: java
severity: error
utils:
    stage:
        kind: method_invocation
        any:
            - has: {field: name, regex: '^(stream|parallelStream|filter|map|mapToObj|mapToInt|mapToLong|mapToDouble|flatMap|mapMulti|distinct|sorted|skip|limit|boxed|peek|takeWhile|dropWhile|lines|chars|codePoints|results|splitAsStream)$'}
            - all:
                - has: {field: object, regex: '^(Stream|IntStream|LongStream|DoubleStream|Arrays|StreamSupport)$'}
                - has: {field: name, regex: '^(of|ofNullable|concat|iterate|generate|range|rangeClosed|stream)$'}
    collected:
        kind: method_invocation
        all:
            - has: {field: object, matches: stage}
            - any:
                - has: {field: name, regex: '^toList$'}
                - all:
                    - has: {field: name, regex: '^collect$'}
                    - has: {field: arguments, has: {kind: method_invocation, has: {field: name, regex: '^(toList|toSet|toUnmodifiableList|toUnmodifiableSet|toCollection)$'}}}
    counted:
        kind: method_invocation
        all:
            - has: {field: name, regex: '^count$'}
            - has: {field: object, matches: stage}
    zero:
        regex: '^0[lL]?$'
    one:
        regex: '^1[lL]?$'
    sorted:
        kind: method_invocation
        has: {field: name, regex: '^sorted$'}
rule:
    any:
        - kind: binary_expression
          any:
            - all:
                - has: {field: left, matches: counted, pattern: $TERM}
                - any:
                    - all: [{has: {field: operator, regex: '^(>|!=|==|<=)$'}}, {has: {field: right, matches: zero}}]
                    - all: [{has: {field: operator, regex: '^(>=|<)$'}}, {has: {field: right, matches: one}}]
            - all:
                - has: {field: right, matches: counted, pattern: $TERM}
                - any:
                    - all: [{has: {field: operator, regex: '^(<|!=|==|>=)$'}}, {has: {field: left, matches: zero}}]
                    - all: [{has: {field: operator, regex: '^(<=|>)$'}}, {has: {field: left, matches: one}}]
        - kind: method_invocation
          all:
            - any:
                - all: [{has: {field: name, regex: '^(isEmpty|getFirst|contains)$'}}, {has: {field: object, matches: collected, pattern: $TERM}}]
                - all: [{has: {field: name, regex: '^get$'}}, {has: {field: arguments, has: {matches: zero}}}, {has: {field: object, matches: collected, pattern: $TERM}}]
                - all: [{has: {field: name, regex: '^(findFirst|findAny)$'}}, {has: {field: object, matches: sorted, pattern: $TERM}}]
                - all: [{has: {field: name, regex: '^limit$'}}, {has: {field: arguments, has: {matches: one}}}, {has: {field: object, matches: sorted, pattern: $TERM}}]
message: '`$TERM` evaluates the whole stream where a short-circuiting operation reads one element'
note: 'Call `anyMatch` or `noneMatch` for count or emptiness, `anyMatch(<value>::equals)` for `contains`, `findFirst` for a first element, `min` for a sort'
