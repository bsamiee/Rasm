# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: javalang
severity: error
utils:
    control-flow:
        any:
            - kind: for_statement, enhanced_for_statement, while_statement, do_statement, switch_expression
            - kind: if_statement
              not: {inside: {kind: if_statement, field: alternative}}
            - kind: ternary_expression
              not: {inside: {kind: ternary_expression, field: alternative, stopBy: {not: {kind: parenthesized_expression}}}}
    execution:
        any:
            - kind: method_declaration, constructor_declaration, compact_constructor_declaration, static_initializer, lambda_expression, class_body, interface_body, enum_body_declarations, annotation_type_body
            - kind: block
              inside: {kind: 'class_body, enum_body_declarations'}
    scope: {any: [{matches: control-flow}, {matches: execution}]}
    conditioned:
        any:
            - inside: {kind: 'if_statement, while_statement, do_statement, for_statement, switch_expression, ternary_expression', field: condition, stopBy: &scope {matches: scope}}
            - inside: {kind: for_statement, field: init, stopBy: *scope}
            - inside: {kind: for_statement, field: update, stopBy: *scope}
            - inside: {kind: enhanced_for_statement, field: value, stopBy: *scope}
    nested-body:
        any:
            - has: {field: body, kind: block, has: {pattern: $_, not: &comment {kind: 'line_comment, block_comment'}, follows: {stopBy: end, pattern: $_, not: *comment}}}
            - has: {field: body, any: [{matches: control-flow}, {has: {matches: control-flow, stopBy: {matches: execution}}}]}
    level:
        any:
            - all: [{matches: control-flow}, {not: {matches: conditioned}}]
            - kind: lambda_expression
              all:
                - inside: {matches: control-flow, stopBy: {matches: execution}}
                - not: {matches: conditioned}
                - matches: nested-body
    boundary: {any: [{matches: level}, {matches: execution}]}
rule:
    matches: level
    inside:
        matches: level
        stopBy: {matches: boundary}
        inside:
            matches: level
            stopBy: {matches: boundary}
            inside:
                matches: level
                stopBy: {matches: boundary}
                not: {inside: {matches: level, stopBy: {matches: execution}}}
message: Nesting exceeds three levels
note: 'Rebuild nested decisions, loops, or lambdas as a `switch` or a stream pipeline over their inputs'
