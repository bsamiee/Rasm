# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-clap-name-literal
language: rust
severity: error
utils:
    keyed:
        any:
            - follows: {regex: '^=$', follows: {kind: identifier, pattern: $KEY, regex: '^(long|id|name)$'}}
              inside: {kind: token_tree, inside: {kind: attribute, field: arguments}}
            - inside:
                kind: token_tree
                regex: '^\('
                follows: {kind: identifier, pattern: $KEY, regex: '^(long|id|name)$'}
                inside: {kind: token_tree, inside: {kind: attribute, field: arguments}}
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $NAME
    all:
        - regex: '^r?#*"[A-Za-z][A-Za-z0-9]*([-_][A-Za-z0-9]+)*"#*$'
        - matches: keyed
        - inside:
            kind: attribute
            stopBy: {kind: attribute}
            any:
                - has: {nthChild: 1, kind: identifier, regex: '^(arg|clap|command|value)$'}
                - all:
                    - has: {nthChild: 1, kind: identifier, regex: '^group$'}
                    - not: {has: {field: arguments, has: {kind: identifier, regex: '^(required|multiple|requires|requires_all|conflicts_with|conflicts_with_all)$'}}}
        - not: {matches: rust-test-scope}
message: '`$KEY` spells `$NAME`, a name clap derives from the annotated item or the package'
note: 'Name the field, variant, or struct after its flag, value, or id and delete the key: a flag keeps a bare `long`, an enum whose values take another case takes `#[value(rename_all = <case>)]`, a flattened `Args` struct takes `#[group(skip)]`, and a top-level command reads the package name'
