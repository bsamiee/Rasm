# --- [CLIPPY] ---------------------------------------------------------------------------

# --- [API]
avoid-breaking-exported-api = false

# --- [FORMS]
warn-on-all-wildcard-imports                 = true
matches-for-let-else                         = "AllTypes"
max-struct-bools                             = 1
max-fn-params-bools                          = 1
excessive-nesting-threshold                  = 5
check-inconsistent-struct-field-initializers = true
enforce-iter-loop-reborrow                   = true
allow-mixed-uninlined-format-args            = false
lint-commented-code                          = true

# --- [NAMING]
upper-case-acronyms-aggressive = true
allowed-idents-below-min-chars = ["w", "x", "y", "z"]
enum-variant-name-threshold    = 2
struct-field-name-threshold    = 2
allow-renamed-params-for       = []
pub-underscore-fields-behavior = "AllPubFields"

# --- [GRAPH]
allowed-duplicate-crates = [
    "syn",
    "getrandom",
    "rand",
    "rand_core",
    "r-efi",
    "matchit",
    "bitflags",
    "base64",
    "core-foundation",
    "cpufeatures",
    "windows-sys",
]

