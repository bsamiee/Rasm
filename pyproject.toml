    "wcwidth",                                            # Display width of text with wide, combining, and emoji characters
]

# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
default-groups = "all"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
dependency-groups = { workspace = { requires-python = ">=3.15" }, dev = { requires-python = ">=3.15" } }
prerelease = "allow"
exclude-dependencies = ["dotnet-stubs"]                   # Untyped System-stubs on the same path as netstandard-stubs, rhino-stubs-typed requires both
workspace = { members = ["tools/interface"] }
override-dependencies = ["truststore @ git+https://github.com/sethmlarson/truststore.git@8d19b4d3dea6d28003886a5b254f0ce8ce66eeb3"] # httpx2 verifies through truststore, whose released 0.10.4 races concurrent handshakes on one SSL context in wrap_bio, fixed upstream after the release
extra-build-variables = { manifold3d = { CMAKE_ARGS = "-DMANIFOLD_USE_BUILTIN_TBB=ON" }, opencolorio = { CMAKE_ARGS = "-DOCIO_BUILD_APPS=OFF" } } # manifold3d's sdist enables MANIFOLD_PAR without the builtin TBB its wheel builds set, opencolorio's setup.py builds the command-line apps
extra-build-dependencies = { pyroscope-io = ["cmake"], rhino3dm = ["cmake"] } # pyroscope-io's build.rs and rhino3dm's setup.py run cmake, neither sdist declares it
build-backend = { module-name = "rasm", module-root = "libs/python", namespace = true }

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
preview = true
target-version = "py315"
line-length = 200
src = [".", "libs/python", "tools"]
per-file-target-version = { ".claude/skills/use-blender/scripts/*.py" = "py313", ".claude/skills/use-rhino/scripts/{canvas,document,file3dm,records}.py" = "py313", "tools/interface/{roles,report,units,render,aliases,frame}.py" = "py313", "tools/interface/rhino/{window,markup}.py" = "py313", "tools/interface/blender/rows.py" = "py313", "tools/interface/*/script/**/*.py" = "py313", "tools/interface/blender/extension/**/*.py" = "py313" }
format = { line-ending = "lf", docstring-code-format = true, skip-magic-trailing-comma = true }

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-locals",
    "too-many-statements",
    "complex-structure",
    "raw-string-in-exception",
    "f-string-in-exception",
    "raise-vanilla-args",
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    "unsorted-dunder-all",
    "suspicious-subprocess-import",
    "implicit-namespace-package",
    "missing-copyright-notice",
    "commented-out-code",
    "django-extra",
]
per-file-ignores = { "tests/**" = ["assert"] }
flake8-bandit = { check-typed-exception = true }
flake8-boolean-trap = { extend-allowed-calls = ["ctypes.c_bool"] }
flake8-import-conventions = { extend-aliases = { "dask.array" = "da", "dask.dataframe" = "dd", scipy = "sp", sympy = "sym", xarray = "xr" } }
flake8-pytest-style = { parametrize-names-type = "csv", raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError", "pydantic.ValidationError"] }
flake8-type-checking = { runtime-evaluated-base-classes = ["msgspec.Struct"] }
isort = { combine-as-imports = true, force-sort-within-sections = true, order-by-type = false, split-on-trailing-comma = false }
pycodestyle = { max-line-length = 300 }
pydocstyle = { convention = "google" }
pydoclint = { ignore-one-line-docstrings = true }
pylint = { allow-magic-value-types = ["str", "bytes", "int"], max-args = 8, max-nested-blocks = 3 }

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
require-lazy = [
    "adbc_driver_flightsql",
    "adbc_driver_snowflake",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "xarray",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg =                      "Use the anyio member"
"collections.namedtuple".msg =       "Declare a frozen msgspec.Struct, or an attrs.frozen class where the interpreter lacks msgspec"
"concurrent.futures".msg =           "Use anyio.to_thread.run_sync or anyio.to_process.run_sync"
"concurrent.interpreters".msg =      "Use anyio.to_interpreter.run_sync"
"contextlib.suppress".msg =          "Return an expression.Result from the suppressed call"
"dataclasses.dataclass".msg =        "Declare a frozen msgspec.Struct, or an attrs.frozen class where the interpreter lacks msgspec"
"dataclasses.make_dataclass".msg =   "Declare a frozen msgspec.Struct, or an attrs.frozen class where the interpreter lacks msgspec"
"http.client".msg =                  "Use httpx2.Client or httpx2.AsyncClient"
"httpx".msg =                        "Use httpx2.Client or httpx2.AsyncClient"
"json.JSONDecoder".msg =             "Use msgspec.json.decode with type=, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.JSONEncoder".msg =             "Use msgspec.json.encode, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.decoder.JSONDecoder".msg =     "Use msgspec.json.decode with type=, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.dump".msg =                    "Use msgspec.json.encode, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.dumps".msg =                   "Use msgspec.json.encode, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.encoder.JSONEncoder".msg =     "Use msgspec.json.encode, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.load".msg =                    "Use msgspec.json.decode with type=, or the cattrs JSON converter where the interpreter lacks msgspec"
"json.loads".msg =                   "Use msgspec.json.decode with type=, or the cattrs JSON converter where the interpreter lacks msgspec"
"requests".msg =                     "Use httpx2.Client or httpx2.AsyncClient"
"time.sleep".msg =                   "Use await anyio.sleep"
"typing.NamedTuple".msg =            "Declare a frozen msgspec.Struct, or an attrs.frozen class where the interpreter lacks msgspec"
"typing_extensions.NamedTuple".msg = "Declare a frozen msgspec.Struct, or an attrs.frozen class where the interpreter lacks msgspec"
"typing_extensions.deprecated".msg = "Delete the replaced API"
"urllib.request".msg =               "Use httpx2.Client or httpx2.AsyncClient"
"urllib3".msg =                      "Use httpx2.Client or httpx2.AsyncClient"
"warnings.deprecated".msg =          "Delete the replaced API"
"warnings.warn".msg =                "Return an expression.Result for an expected failure"
"warnings.warn_explicit".msg =       "Return an expression.Result for an expected failure"

# --- [TY] -------------------------------------------------------------------------------

[tool.ty]
environment = { python-version = "3.15", python-platform = "all", root = [".", "libs/python", "tools"] }
analysis = { respect-type-ignore-comments = false, replace-imports-with-any = ["AppKit", "CoreFoundation", "Foundation", "PyObjCTools"] }
rules = { all = "error", dynamic-function-decorator-return = "ignore", unsound-assignment = "ignore", unsound-return-statement = "ignore" }
overrides = [{ include = ["tools/interface/rhino"], rules = { call-non-callable = "ignore", too-many-positional-arguments = "ignore" } }]

# --- [MYPY] -----------------------------------------------------------------------------

[tool.mypy]
files = [".", ".claude"]
mypy_path = ["libs/python", "tools"]
cache_dir = "$MYPY_CONFIG_FILE_DIR/.cache/mypy"
strict = true
pretty = true
warn_unreachable = true
explicit_package_bases = true
exclude_gitignore = true
disallow_any_explicit = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
enable_error_code = ["exhaustive-match", "explicit-override", "ignore-without-code", "redundant-self", "truthy-bool", "truthy-iterable", "unused-awaitable"]
overrides = [
    { module = "tests.*", disallow_any_explicit = false, disallow_any_unimported = false, warn_unreachable = false, disable_error_code = ["arg-type"] },
    { module = ["fsspec", "fsspec.*", "s3fs"], ignore_missing_imports = true },
    { module = ["AppKit", "CoreFoundation", "Foundation", "PyObjCTools"], ignore_missing_imports = true },
    { module = "interface.host", disallow_any_unimported = false, disallow_subclassing_any = false },
    { module = "interface.rhino.*", disable_error_code = ["abstract", "call-arg", "type-abstract"] },
    { module = ["OpenImageIO", "PyOpenColorIO", "_bpy"], ignore_missing_imports = true },
]

# --- [PYDANTIC_MYPY]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# --- [PYTEST] ---------------------------------------------------------------------------

[tool.pytest]
strict = true
cache_dir = ".cache/pytest"
testpaths = ["tests"]
pythonpath = [".", "libs/python"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
collect_imported_tests = false
empty_parameter_set_mark = "fail_at_collect"
addopts = [
    "-p",
    "tests.python.support.runtime",
    "-p",
    "no:zarr",
    "-p",
    "no:pointblank",
    "-x",
    "--tb=short",
    "--import-mode=importlib",
    "--benchmark-skip",
    "--disable-socket",
    "--allow-unix-socket",
    "--benchmark-storage=file://.artifacts/python/benchmarks",
]
filterwarnings = ["error"]
timeout = "30"
required_plugins = [
    "anyio",
    "hypothesis",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-timeout",
    "pytest-xdist",
]
markers = [
    "network: tests that need real INET sockets (loopback servers or outbound connections)",
    "property: @property_test registration, record holds its PropertyRecord",
]

# --- [COVERAGE] -------------------------------------------------------------------------

[tool.coverage]
run = { branch = true, relative_files = true, data_file = ".artifacts/python/coverage/data/.coverage", source = ["libs/python", "tests/python/support"] }
report = { show_missing = true, skip_covered = true, exclude_also = ["assert_never\\(", "if __name__ == .__main__.:"] }
