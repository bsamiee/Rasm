# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    observe-call:
        kind: call_expression
        all:
            - has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^observe$'}}}
            - has:
                kind: call_suffix
                has:
                    kind: value_arguments
                    not: {has: {kind: value_argument, all: [{has: {field: name, regex: '^options$'}}, {has: {field: value, regex: '\.initial(?-u:\b)'}}]}}
    handler:
        kind: call_suffix
        has: {kind: lambda_literal, has: {matches: swift-sole-statement, has: {pattern: $CHECK, not: {kind: 'comment, multiline_comment'}}}}
    registration:
        kind: call_expression
        has: {matches: handler}
        any:
            - matches: observe-call
            - has: {nthChild: 1, matches: observe-call}
rule:
    any:
        - kind: property_declaration
          has: {matches: registration}
        - kind: assignment
          has: {field: result, matches: registration}
    precedes: {pattern: $CHECK}
message: 'Handler statement `$CHECK` runs again by hand after `observe` registration for the initial value'
note: 'Add `.initial` to `observe(_:options:changeHandler:)` options and delete the repeated statement'
