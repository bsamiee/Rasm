syntax = "proto3";

package rasm.contracts.bcf.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "rasm/contracts/spatial/v1/vector.proto";

enum BcfStatus {
  BCF_STATUS_UNSPECIFIED = 0;
  BCF_STATUS_OPEN = 1;
  BCF_STATUS_IN_PROGRESS = 2;
  BCF_STATUS_RESOLVED = 3;
  BCF_STATUS_CLOSED = 4;
  BCF_STATUS_REOPENED = 5;
}

enum BcfBitmapFormat {
  BCF_BITMAP_FORMAT_UNSPECIFIED = 0;
  BCF_BITMAP_FORMAT_PNG = 1;
  BCF_BITMAP_FORMAT_JPG = 2;
}

// --- [BCF] ------------------------------------------------------------------------------

// BCF declares the camera orthogonal XOR perspective, and the lens arm is the one column the two
// projections disagree on; a viewpoint carrying neither is the legal selection-only viewpoint,
// carried as an absent camera on the viewpoint row.
message BcfCameraWire {
  rasm.contracts.spatial.v1.Point3 position = 1 [(buf.validate.field).required = true];
  rasm.contracts.spatial.v1.UnitDirection3 direction = 2 [(buf.validate.field).required = true];
  rasm.contracts.spatial.v1.UnitDirection3 up = 3 [(buf.validate.field).required = true];
  double aspect_ratio = 4 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  oneof lens {
    option (buf.validate.oneof).required = true;

    double field_of_view_deg = 5 [(buf.validate.field).double = {
      finite: true
      gt: 0
      lt: 180
    }];
    double view_to_world_scale = 6 [(buf.validate.field).double = {
      finite: true
      gt: 0
    }];
  }
}

message BcfColoringWire {
  string color = 1 [(buf.validate.field).string.min_len = 1];
  repeated string global_ids = 2 [(buf.validate.field).repeated = {
    max_items: 65536
    items: {
      string: {
        len: 22
        pattern: "^[0-9A-Za-z_$]{22}$"
      }
    }
  }];
}

message BcfLineWire {
  rasm.contracts.spatial.v1.Point3 start = 1;
  rasm.contracts.spatial.v1.Point3 end = 2;
}

message BcfClippingWire {
  rasm.contracts.spatial.v1.Point3 location = 1;
  rasm.contracts.spatial.v1.UnitDirection3 direction = 2;
}

message BcfBitmapWire {
  BcfBitmapFormat format = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reference = 2 [(buf.validate.field).string.min_len = 1];
  rasm.contracts.spatial.v1.Point3 location = 3;
  rasm.contracts.spatial.v1.UnitDirection3 normal = 4;
  rasm.contracts.spatial.v1.UnitDirection3 up = 5;
  double height = 6 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

message BcfSnippetWire {
  string snippet_type = 1;
  string reference = 2;
  string reference_schema = 3;
  bool is_external = 4;
}

message BcfDocumentWire {
  string guid = 1;
  optional string document_guid = 2;
  optional string url = 3;
  string description = 4;
}

message BcfFileWire {
  string filename = 1;
  optional google.protobuf.Timestamp date = 2;
  string reference = 3;
  string ifc_project = 4;
  string ifc_spatial_structure_element = 5;
  bool is_external = 6;
}

message BcfHintsWire {
  bool spaces_visible = 1;
  bool space_boundaries_visible = 2;
  bool openings_visible = 3;
}

message BcfShowingWire {
  repeated string hidden = 1 [(buf.validate.field).repeated.max_items = 65536];
}

message BcfHidingWire {
  repeated string visible = 1 [(buf.validate.field).repeated.max_items = 65536];
}

// The Components/Visibility regime: the case names what its exception set means, so the
// inverted read a bare default flag forces on every consumer cannot be spelled.
message BcfVisibilityWire {
  oneof regime {
    option (buf.validate.oneof).required = true;

    BcfShowingWire showing = 1;
    BcfHidingWire hiding = 2;
  }
}

message BcfViewpointWire {
  string guid = 1 [(buf.validate.field).string.min_len = 1];
  optional BcfCameraWire camera = 2;
  repeated string selected_global_ids = 3 [(buf.validate.field).repeated = {
    max_items: 65536
    items: {
      string: {
        len: 22
        pattern: "^[0-9A-Za-z_$]{22}$"
      }
    }
  }];
  BcfVisibilityWire visibility = 4 [(buf.validate.field).required = true];
  repeated BcfColoringWire coloring = 5 [(buf.validate.field).repeated.max_items = 65536];
  repeated BcfLineWire lines = 6 [(buf.validate.field).repeated.max_items = 65536];
  repeated BcfClippingWire clipping_planes = 7 [(buf.validate.field).repeated.max_items = 65536];
  repeated BcfBitmapWire bitmaps = 8 [(buf.validate.field).repeated.max_items = 65536];
  optional uint32 index = 9;
  optional BcfHintsWire view_setup_hints = 10;
}

message BcfCommentWire {
  string guid = 1 [(buf.validate.field).string.min_len = 1];
  string author = 2;
  string text = 3;
  optional string viewpoint_guid = 4;
  google.protobuf.Timestamp date = 5;
  optional google.protobuf.Timestamp modified_date = 6;
  string modified_author = 7;
  optional string reply_to_guid = 8;
}

// The heavy snapshot bytes never ride the topic document; a preview resolves by reference.
message BcfTopicWire {
  string guid = 1 [(buf.validate.field).string.min_len = 1];
  string title = 2 [(buf.validate.field).string.min_len = 1];
  BcfStatus status = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  string topic_type = 4;
  string priority = 5;
  string author = 6;
  google.protobuf.Timestamp creation_date = 7;
  repeated BcfCommentWire comments = 8 [(buf.validate.field).repeated.max_items = 65536];
  repeated BcfViewpointWire viewpoints = 9 [(buf.validate.field).repeated.max_items = 65536];
  string description = 10;
  string assigned_to = 11;
  string stage = 12;
  optional google.protobuf.Timestamp due_date = 13;
  repeated string labels = 14 [(buf.validate.field).repeated.max_items = 65536];
  optional uint32 index = 15;
  optional google.protobuf.Timestamp modified_date = 16;
  string modified_author = 17;
  string server_assigned_id = 18;
  repeated string reference_links = 19 [(buf.validate.field).repeated.max_items = 65536];
  repeated string related_topics = 20 [(buf.validate.field).repeated.max_items = 65536];
  repeated BcfDocumentWire document_references = 21 [(buf.validate.field).repeated.max_items = 65536];
  optional BcfSnippetWire bim_snippet = 22;
  repeated BcfFileWire files = 23 [(buf.validate.field).repeated.max_items = 65536];
  string status_label = 24;
}
