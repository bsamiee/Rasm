# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parameter-discard
language: python
severity: error
rule:
    all:
        - kind: expression_statement
          has: {kind: assignment, pattern: _ = $P, has: {field: right, kind: identifier}}
        - inside:
            kind: function_definition
            stopBy: {matches: python-function-boundary}
            has: {field: parameters, has: {matches: {python-parameter: {name: {pattern: $P}}}}}
message: 'Body discards parameter `$P` with an underscore assignment'
note: 'Rename the parameter `_<name>`, keyword callers pass the new name'
