# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unit-const-assertion
language: rust
severity: error
rule:
    kind: let_declaration
    all:
        - has: {field: value, kind: scoped_identifier, has: {field: name, regex: '^[A-Z][A-Z0-9_]*$'}, pattern: $PATH}
        - any:
            - has: {field: pattern, kind: tuple_pattern, regex: '^\(\s*\)$'}
            - all:
                - has: {field: pattern, pattern: $$_P, regex: '^_$'}
                - has: {field: value, has: {field: path, kind: generic_type}}
message: '`let` reads `$PATH` to force its compile-time evaluation'
note: 'Write the assertion in place as an inline `const { assert!(<condition>, "<invariant>") };` and delete the unit associated constant, the block evaluates once per instantiation with the generic parameters in scope'
