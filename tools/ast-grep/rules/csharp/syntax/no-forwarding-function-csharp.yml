# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-function-csharp
language: csharp
severity: error
utils:
    function:
        kind: 'method_declaration, local_function_statement'
    plain-parameter:
        kind: parameter
        not:
            has:
                any:
                    - kind: attribute_list
                    - kind: modifier
                      regex: '^(ref|out|scoped)$'
    type-parameter-name:
        kind: identifier
        pattern: $TYPE_PARAMETER
        inside:
            stopBy: end
            has: {kind: type_parameter_list, has: {kind: type_parameter, has: {kind: identifier, pattern: $TYPE_PARAMETER}}}
    parameter-name:
        kind: identifier
        pattern: $PARAMETER
        inside:
            stopBy: {matches: function}
            matches: function
            has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $PARAMETER}}}
    static-root:
        any:
            - kind: identifier
              regex: '^[A-Z]'
              not:
                any:
                    - matches: type-parameter-name
                    - matches: parameter-name
            - kind: 'predefined_type, alias_qualified_name, generic_name, qualified_name'
            - kind: member_access_expression
              has: {field: expression, matches: static-root}
    parameter-root:
        any:
            - kind: identifier
              not: {not: {matches: parameter-name}}
            - kind: member_access_expression
              has: {field: expression, matches: parameter-root}
    root:
        any:
            - matches: static-root
            - matches: parameter-root
    callee-name:
        any:
            - kind: identifier
              pattern: $CALLEE
            - kind: generic_name
              has: {kind: identifier, pattern: $CALLEE}
    parameter-argument:
        kind: argument
        not: {has: {kind: modifier}}
        has: {nthChild: {position: 1, reverse: true}, matches: parameter-name}
    call:
        kind: invocation_expression
        all:
            - not: {has: {field: function, kind: identifier, pattern: $NAME}}
            - has:
                field: function
                any:
                    - matches: callee-name
                    - kind: member_access_expression
                      all: [{has: {field: name, matches: callee-name}}, {has: {field: expression, matches: root}}]
                    - kind: conditional_access_expression
                      all: [{has: {field: condition, matches: parameter-root}}, {has: {kind: member_binding_expression, has: {field: name, matches: callee-name}}}]
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, not: {matches: parameter-argument}}}
                    - not: {has: {kind: argument, has: {kind: identifier, pattern: $REPEATED}, follows: {stopBy: end, kind: argument, has: {kind: identifier, pattern: $REPEATED}}}}
            - not:
                all:
                    - has: {field: function, has: {stopBy: end, kind: identifier, pattern: $SHARED}}
                    - has: {field: arguments, has: {kind: argument, has: {kind: identifier, pattern: $SHARED}}}
    member-read:
        kind: member_access_expression
        all:
            - has: {field: name, pattern: $CALLEE}
            - has: {field: expression, matches: root}
    single-statement:
        kind: block
        not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    setter:
        matches: single-statement
        has:
            kind: expression_statement
            has:
                kind: assignment_expression
                all:
                    - has: {field: operator, regex: '^=$'}
                    - has: {field: left, matches: member-read}
                    - has: {field: right, kind: identifier, not: {not: {matches: parameter-name}}}
    lift:
        kind: invocation_expression
        has: {field: function, regex: '^((global::)?LanguageExt\.)?IO\.(lift|liftAsync)$'}
    thunk:
        kind: lambda_expression
        has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
    lifted:
        matches: lift
        has:
            field: arguments
            has:
                kind: argument
                any:
                    - has: {matches: thunk, has: {field: body, any: [{matches: call}, {matches: member-read}, {matches: setter}]}}
                    - has: {matches: member-read}
    forwarded:
        any:
            - matches: lifted
            - matches: call
              not: {inside: {stopBy: {matches: function}, matches: function, has: {field: parameters, not: {has: {kind: parameter}}}}}
    unit-return:
        kind: return_statement
        has: {regex: '^(((global::)?LanguageExt\.)?(Prelude\.)?unit|((global::)?LanguageExt\.)?Unit\.Default)$'}
    unit-adapted:
        kind: block
        all:
            - has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, matches: unit-return}
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: comment}}}}}
    forwarding-body:
        any:
            - kind: arrow_expression_clause
              has: {matches: forwarded}
            - matches: single-statement
              has: {kind: 'return_statement, expression_statement', has: {matches: forwarded}}
            - matches: unit-adapted
              has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, kind: expression_statement, has: {matches: forwarded}}
    mapper-attribute:
        kind: attribute_list
        has: {kind: attribute, has: {field: name, regex: '^((global::)?Riok\.Mapperly\.Abstractions\.)?Mapper(Attribute)?$'}}
    hidden-owner:
        kind: identifier
        pattern: $HIDDEN
        inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, kind: class_declaration, all: [{has: {field: name, pattern: $HIDDEN}}, {not: {has: {kind: modifier, regex: '^public$'}}}]}}
    mapper-owner:
        kind: identifier
        pattern: $MAPPER
        regex: '^\w+Mapper$'
        not: {inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, kind: class_declaration, all: [{has: {field: name, pattern: $MAPPER}}, {not: {has: {matches: mapper-attribute}}}]}}}
    boundary-callee:
        kind: member_access_expression
        has: {field: expression, any: [{matches: hidden-owner}, {matches: mapper-owner}]}
    case-arguments:
        kind: argument_list
        not: {has: {kind: argument, not: {has: {nthChild: {position: 1, reverse: true}, kind: member_access_expression, has: {field: expression, kind: identifier, pattern: $CASE}}}}}
    case-call:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, has: {field: expression, kind: identifier, pattern: $TARGET}}
            - has: {field: arguments, matches: case-arguments}
    state-arm:
        kind: lambda_expression
        all:
            - has: {field: parameters, has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $TARGET}}}
            - has: {field: parameters, has: {kind: parameter, nthChild: 2, has: {field: name, pattern: $CASE}}}
            - not: {has: {field: parameters, has: {kind: parameter, nthChild: 3}}}
            - has: {field: body, matches: case-call}
    capture-arm:
        kind: lambda_expression
        all:
            - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $CASE}, {kind: parameter_list, has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $CASE}}, not: {has: {kind: parameter, nthChild: 2}}}]}
            - has: {field: body, kind: invocation_expression, all: [{has: {field: function, kind: member_access_expression, has: {field: expression, pattern: $CALLEE}}}, {has: {field: arguments, matches: case-arguments}}]}
    switch-arm:
        kind: switch_expression_arm
        all:
            - has: {nthChild: 1, kind: declaration_pattern, has: {field: name, pattern: $CASE}}
            - not: {has: {kind: when_clause}}
            - has: {nthChild: {position: 1, reverse: true}, kind: invocation_expression, all: [{has: {field: function, kind: member_access_expression, has: {field: expression, pattern: $CALLEE}}}, {has: {field: arguments, matches: case-arguments}}]}
    case-receiver:
        kind: identifier
        pattern: $CALLEE
        matches: parameter-name
    switch-subject:
        kind: identifier
        pattern: $SUBJECT
        inside: {stopBy: end, matches: function, has: {field: parameters, has: {kind: parameter, has: {field: name, pattern: $SUBJECT}}}}
    switch-forward:
        any:
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Switch$'}}, {has: {field: expression, matches: switch-subject}}]}
                - any:
                    - all:
                        - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {nthChild: {position: 1, reverse: true}, matches: case-receiver}}}
                        - has: {field: arguments, has: {kind: argument, nthChild: 2}}
                        - has: {field: arguments, not: {has: {kind: argument, not: {any: [{nthChild: 1}, {has: {nthChild: {position: 1, reverse: true}, matches: state-arm}}]}}}}
                    - all:
                        - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {kind: lambda_expression, has: {field: body, kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: case-receiver}}}}}}
                        - has: {field: arguments, not: {has: {kind: argument, not: {has: {nthChild: {position: 1, reverse: true}, matches: capture-arm}}}}}
            - kind: switch_expression
              all:
                - has: {nthChild: 1, matches: switch-subject}
                - has: {kind: switch_expression_arm, has: {nthChild: {position: 1, reverse: true}, kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: case-receiver}}}}
                - not: {has: {kind: switch_expression_arm, not: {matches: switch-arm}}}
    switch-body:
        any:
            - matches: switch-forward
            - matches: lift
              has: {field: arguments, has: {kind: argument, has: {matches: thunk, has: {field: body, matches: switch-forward}}}}
rule:
    matches: function
    all:
        - has: {field: name, pattern: $NAME}
        - not:
            any:
                - has: {kind: modifier, regex: '^(override|partial|extern|abstract|async)$'}
                - has:
                    kind: attribute_list
                    has:
                        kind: attribute
                        not: {has: {field: name, regex: '^((global::)?System\.(Diagnostics(\.(CodeAnalysis|Contracts))?|Runtime\.CompilerServices|ComponentModel)\.)?(Pure|MethodImpl|DebuggerStepThrough|DebuggerHidden|DebuggerNonUserCode|SuppressMessage|UnconditionalSuppressMessage|Obsolete|EditorBrowsable|ExcludeFromCodeCoverage|NotNull|MaybeNull|NotNullIfNotNull)(Attribute)?$'}}
                - has: {kind: explicit_interface_specifier}
                - all:
                    - kind: method_declaration
                    - inside: {kind: declaration_list, inside: {has: {kind: base_list, has: {regex: '^((global::)?[\w.]*\.)?I[A-Z]\w*(<.*>)?$'}}}}
                    - has: {kind: modifier, regex: '^public$'}
                - inside:
                    kind: declaration_list
                    has: {stopBy: end, kind: attribute_argument, all: [{has: {field: name, regex: '^Use$'}}, {has: {kind: invocation_expression, pattern: nameof($NAME)}}]}
        - any:
            - all:
                - has: {field: body, matches: forwarding-body}
                - not: {has: {field: parameters, has: {kind: parameter, not: {matches: plain-parameter}}}}
            - has: {field: body, any: [{kind: arrow_expression_clause, has: {matches: switch-body}}, {matches: single-statement, has: {kind: return_statement, has: {matches: switch-body}}}]}
        - not:
            all:
                - has: {kind: modifier, regex: '^public$'}
                - has: {field: body, has: {stopBy: end, matches: lift}}
                - inside:
                    kind: declaration_list
                    has: {kind: method_declaration, all: [{has: {field: name, pattern: $CALLEE}}, {not: {has: {kind: modifier, regex: '^public$'}}}]}
        - not:
            all:
                - has: {kind: modifier, regex: '^public$'}
                - has:
                    field: body
                    has:
                        stopBy: end
                        matches: lift
                        has:
                            field: arguments
                            has:
                                kind: argument
                                has:
                                    any:
                                        - matches: thunk
                                          has: {field: body, kind: invocation_expression, has: {field: function, matches: boundary-callee}}
                                        - matches: boundary-callee
message: '`$NAME` forwards its parameters unchanged to `$CALLEE`'
note: Call `<callee>` at each use, `IO.lift(<receiver>.<member>)` where an effect composes and `fun(<action>)` for an `Action` in expression position, a forwarding function adds no fact
