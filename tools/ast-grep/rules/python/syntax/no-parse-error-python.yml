# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-python
language: python
severity: error
utils:
    type-parameter-default:
        kind: ERROR
        has: {regex: '^=$'}
        inside:
            stopBy: {kind: type_parameter}
            kind: type_parameter
            inside:
                any:
                    - kind: class_definition
                    - kind: function_definition
                    - {kind: generic_type, inside: {kind: type, inside: {kind: type_alias_statement, field: left}}}
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: type-parameter-default
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: module
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Span fails to parse, write it in a form tree-sitter-python parses
note: >-
    Every other rule skips constructs inside a parse error. Unreported tree-sitter-python grammar gaps are type parameter defaults (`class Box[T = int]`)
