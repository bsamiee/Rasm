# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-inline-msgspec-codec
language: python
severity: error
utils:
    msgspec-module:
        all:
            - any:
                - matches: {python-module-member: {module: {regex: "^msgspec$"}, name: {regex: "^(json|msgpack)$"}}}
                - matches: {python-imported-name: {module: {regex: "^msgspec$"}, name: {regex: "^(json|msgpack)$"}}}
                - kind: identifier
                  pattern: $CODEC
                  not: {matches: {python-conflicting-import: {module: {regex: '^msgspec\.(json|msgpack)$'}, name: {regex: '^$'}}}}
                  inside:
                    kind: module, function_definition
                    stopBy: end
                    has:
                        stopBy: {kind: "function_definition, class_definition, lambda"}
                        kind: aliased_import
                        inside: {kind: import_statement}
                        has: {field: alias, pattern: $CODEC}
            - not: {matches: python-shadowed-name}
    class-import:
        kind: import_from_statement
        all:
            - has: {field: module_name, pattern: $SOURCE, regex: '^msgspec\.(json|msgpack)$'}
            - has:
                any:
                    - kind: dotted_name
                      matches: codec-class
                    - kind: aliased_import
                      has: {field: name, matches: codec-class}
    function-import:
        kind: import_from_statement
        all:
            - has: {field: module_name, pattern: $SOURCE}
            - has:
                any:
                    - kind: dotted_name
                      pattern: $FUNCTION
                      has: {kind: identifier, pattern: $OPERATION}
                    - kind: aliased_import
                      all:
                        - has: {field: name, has: {kind: identifier, pattern: $OPERATION}}
                        - has: {field: alias, pattern: $FUNCTION}
    imported-codec:
        inside:
            kind: module, function_definition
            stopBy: end
            all:
                - has: {stopBy: {kind: "function_definition, class_definition, lambda"}, matches: class-import}
                - has: {stopBy: {kind: "function_definition, class_definition, lambda"}, matches: function-import}
    codec-class: {regex: "^(Encoder|Decoder)$"}
    codec-module: {regex: '^msgspec\.(json|msgpack)$'}
    imported-encoder: {kind: call, has: {field: function, matches: {python-imported-name: {module: {matches: codec-module}, name: {regex: "^Encoder$"}}}}}
    imported-decoder: {kind: call, has: {field: function, matches: {python-imported-name: {module: {matches: codec-module}, name: {regex: "^Decoder$"}}}}}
rule:
    kind: call
    any:
        - all:
            - any:
                - pattern: $MODULE.Encoder().encode($VALUE)
                - pattern: $MODULE.Decoder().decode($VALUE)
            - has: {field: function, has: {field: attribute, pattern: $METHOD}}
        - all:
            - any:
                - pattern: $ENCODER().encode($VALUE)
                  has: {field: function, has: {field: object, matches: imported-encoder}}
                - pattern: $DECODER().decode($VALUE)
                  has: {field: function, has: {field: object, matches: imported-decoder}}
            - has: {field: function, has: {field: attribute, pattern: $OPERATION}}
            - matches: imported-codec
    not: {has: {kind: comment, stopBy: end}}
constraints:
    MODULE: {matches: msgspec-module}
    VALUE: {not: {kind: "keyword_argument, list_splat, dictionary_splat"}}
transform:
    HEAD: {replace: {source: $MODULE, replace: "(?s)^(.+)$", by: "$1."}}
    METHOD_NAME: {replace: {source: $METHOD, replace: "^(.+)$", by: "$1"}}
    FUNCTION_NAME: {replace: {source: $FUNCTION, replace: "^(.+)$", by: "$1"}}
fix: "$HEAD$METHOD_NAME$FUNCTION_NAME($VALUE)"
message: Codec instance serves one call
note: Use `<module>.encode(<value>)` or `<module>.decode(<value>)`
