symbolType: string
rule:
    any:
        - {kind: pair, inside: {kind: 'table, table_array_element, inline_table'}, all: [{has: {kind: string}}, {not: {matches: broken}}, {matches: key}]}
        - {kind: 'bare_key, quoted_key, dotted_key', inside: {kind: pair, inside: {kind: 'table, table_array_element, inline_table'}, has: {kind: string}}, not: {has: {matches: failed}}, matches: token}
utils:
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
    broken: {has: {any: [{matches: failed}, {kind: 'dotted_key, string', has: {matches: failed}}]}}
    key: {any: [{inside: {kind: 'table, table_array_element'}, has: {kind: 'bare_key, dotted_key', regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}}, {has: {kind: 'bare_key, quoted_key, dotted_key', pattern: $KEY}}]}
    token: {any: [{regex: '^[0-9A-Za-z_.-]+$', inside: {kind: pair, inside: {kind: 'table, table_array_element'}}, pattern: $BARE}, {pattern: $KEY}]}
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART.}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART.}
    - id: lineage
      rule:
          kind: 'bare_key, quoted_key, dotted_key'
          pattern: $SEGMENT
          any: [{inside: {kind: pair, inside: {kind: inline_table, inside: {kind: pair, stopBy: {not: {kind: array}}, inside: {kind: 'table, table_array_element, inline_table'}, has: {kind: 'bare_key, quoted_key, dotted_key', pattern: $UP}}}}}, {kind: 'bare_key, quoted_key, dotted_key'}]
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
          SEGMENT_PART: {rewrite: {source: $SEGMENT, rewriters: [bare, part], joinBy: ''}}
      fix: $ABOVE$SEGMENT_PART
transform:
    PATH: {rewrite: {source: $KEY, rewriters: [lineage], joinBy: ''}}
    NAME: {replace: {source: $PATH, replace: '\.$', by: ''}}
name: $BARE$NAME
signature: '$BARE$NAME = "…"'
