# --- [BUILD] ----------------------------------------------------------------------------

[build]
target-dir  = ".artifacts/cargo"
build-dir   = "{workspace-root}/.cache/cargo"             # Cargo workspaces this file reaches outside the repository's (uv sdist builds under .cache) keep their own build folder
rustflags   = ["-Zunstable-options", "--jobs-frontend=0"] # 0 is every core, each thread past the first waiting on a token of the jobserver cargo shares with every rustc
fingerprint = "content"

# --- [ENV] ------------------------------------------------------------------------------

[env]
CLIPPY_CONF_DIR  = { value = ".config", relative = true }
DYLINT_RUSTFLAGS = "-Zflatten-format-args=no"

# --- [CACHE] ----------------------------------------------------------------------------

[cache.global-clean]
max-src-age    = "1 week"
max-crate-age  = "1 month"
max-git-co-age = "1 week"
max-git-db-age = "1 month"

# --- [PROFILES] -------------------------------------------------------------------------

[profile.dev.package] # Cargo refuses a member `[lints]` override beside `workspace = true`, and tombi's Cargo.toml schema refuses profile `rustflags`
rasm-site             = { rustflags = ["-Aunsafe_code"] }         # PROJ `proj_factors`, which the `proj` crate wraps none of, runs through `proj-sys` FFI
rasm-process          = { rustflags = ["-Aunsafe_code"] }         # Windows `CreateEnvironmentBlock`, which no crate wraps, runs through `windows` FFI
rasm-mcp              = { rustflags = ["-Adeprecated"] }          # Initialize-era MCP revisions keep logging and resources/subscribe, and the GenAI names moved to a repository publishing no crate
rasm-mcp-tests        = { rustflags = ["-Adeprecated"] }          # Scenarios exercise the initialize-era revisions their server keeps
rasm-dependency-graph = { rustflags = ["-Aclippy::expect_used"] } # petgraph builds `Acyclic` through a checked `TryFrom` alone, over graphs and subgraphs acyclic by construction

[profile.release.package] # Root profiles inherit nothing, so release repeats each dev row for itself, bench, and dist, which `check` also lints under
rasm-site             = { rustflags = ["-Aunsafe_code"] }
rasm-process          = { rustflags = ["-Aunsafe_code"] }
rasm-mcp              = { rustflags = ["-Adeprecated"] }
rasm-mcp-tests        = { rustflags = ["-Adeprecated"] }
rasm-dependency-graph = { rustflags = ["-Aclippy::expect_used"] }

# --- [RESOLVER] -------------------------------------------------------------------------

[resolver]
feature-unification = "workspace"

# --- [TARGET] ---------------------------------------------------------------------------

# Kept on purpose, do not remove: wild (https://github.com/wild-linker/wild) replaces Apple ld once a
# release of its Mach-O backend holds thread-local storage, which Rust std uses on macOS, dylib output,
# which the Dylint cdylib needs, and debug info, which `profile.dev` line tables need. Target rustflags
# replace `build.rustflags`, so the row repeats them.
# [target.aarch64-apple-darwin]
# rustflags = ["-Zunstable-options", "--jobs-frontend=0", "-Clink-arg=--ld-path=wild"]

# --- [UNSTABLE] -------------------------------------------------------------------------

[unstable]
bindeps             = true
build-analysis      = true           # CARGO_BUILD_ANALYSIS_ENABLED=true sets `build.analysis.enabled`, recording each build in $CARGO_HOME/log for cargo report
checksum-freshness  = true
feature-unification = true
fine-grain-locking  = true
gc                  = true
git                 = "shallow-deps"
profile-rustflags   = true
