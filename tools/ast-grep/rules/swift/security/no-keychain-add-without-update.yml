# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
rule:
    pattern: $ARGS
    any:
        - matches: {swift-security-arguments: {subcommand: {regex: '^"add-(generic|internet)-password"$'}}}
          not: {has: {stopBy: end, kind: line_string_literal, regex: '^"-U"$'}}
        - kind: line_string_literal, multi_line_string_literal, raw_string_literal
          regex: '(?m)(?:^#*"*|\\n)[ \t]*add-(?:generic|internet)-password(?:[ \t]+(?:(?:[^\n\\ \t"]|\\[^n]){3,}|(?:[^\n\\ \t"-]|\\[^n])(?:[^\n\\ \t"]|\\[^n])|-(?:[^\n\\ \t"U]|\\[^n])|[^\n\\ \t"]|\\[^n]))+[ \t]*(?:"|\\n|$)'
message: '`$ARGS` adds a keychain item without `-U` and fails with `errSecDuplicateItem` on an existing item'
note: 'Pass `-U` after the subcommand to update an existing item and keep its ACL and partition list'
