# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-variance-by-hand
language: rust
severity: error
rule:
    kind: 'call_expression, compound_assignment_expr'
    pattern: $SUM
    matches: rust-squared-deviation-sum
message: '`$SUM` sums squared deviations from a mean by hand'
note: 'Compute the moment through statrs: `statrs::statistics::Data::new(<values>).variance()` for the sample variance or `<values>.iter().copied().fold(OnlineVariance::default(), Accumulate::push).population_variance()` for the population variance. Both return `Option` on empty input where the `Statistics` trait returns NaN'
