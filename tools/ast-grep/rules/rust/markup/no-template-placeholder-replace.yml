# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-template-placeholder-replace
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $RENDER
    matches: rust-template-replace
message: '`$RENDER` fills template placeholders through string replacement'
note: 'Render the template with `minijinja::Environment::render_str(<template>, minijinja::context! { <name> => <value> })`, or register it once through `Environment::add_template` and call `get_template(<name>)?.render(<context>)`'
