# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-deadline-race-by-hand-rust
language: rust
severity: error
rule:
    matches: tokio-two-arm-select
    has:
        kind: token_tree
        all:
            - has:
                kind: identifier
                regex: '^sleep(_until)?$'
                pattern: $SLEEP
                precedes: {kind: token_tree, regex: '^\(', precedes: {stopBy: {not: {kind: 'line_comment, block_comment'}}, regex: '^=>$'}}
            - not: {has: {kind: identifier, regex: '^cancelled(_owned)?$', follows: {regex: '^\.$'}}}
message: '`select!` races one future against `$SLEEP` by hand'
note: 'Await `tokio::time::timeout(<duration>, <future>)` or `timeout_at(<deadline>, <future>)` (`Err(Elapsed)` at the deadline, future dropped)'
