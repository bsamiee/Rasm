# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-grpc-tests"
edition.workspace = true
description       = "gRPC suite: inbound deadlines and the timeout header grammar, shutdown of calls and streams in flight, health checking, server reflection, and channels to a late server"

# --- [TARGETS] --------------------------------------------------------------------------

[[test]]
name = "suite"
path = "suite/main.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dev-dependencies]
backon           = { workspace = true }
futures          = { workspace = true }
tokio            = { workspace = true }
tokio-stream     = { workspace = true }
tokio-util       = { workspace = true }
bytes            = { workspace = true }
http             = { workspace = true }
tonic            = { workspace = true }
tonic-health     = { workspace = true }
tonic-reflection = { workspace = true }
claims           = { workspace = true }
h2               = { workspace = true }
rstest           = { workspace = true }
rasm-grpc        = { workspace = true, features = ["health", "reflection"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
