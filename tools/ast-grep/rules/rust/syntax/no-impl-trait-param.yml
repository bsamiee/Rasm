# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-impl-trait-param
language: rust
severity: error
rule:
    kind: abstract_type
    all:
        - not: {inside: {kind: abstract_type, stopBy: {kind: parameter}}}
        - inside:
            kind: parameter
            stopBy: end
            inside:
                kind: parameters
                inside:
                    kind: 'function_item, function_signature_item'
                    field: parameters
                    all:
                        - not: {has: {kind: visibility_modifier, regex: '^pub$'}}
                        - not: {inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '\S'}}}}
                        - not: {inside: {kind: declaration_list, inside: {kind: trait_item, has: {kind: visibility_modifier}}}}
message: '`impl Trait` parameter leaves its type unnamed'
note: 'Name the type as a generic parameter bounded in the `where` clause (`fn f<I>(items: I) where I: Iterator<Item = u8>`). Clippy `impl_trait_in_params` reports `pub` functions, `pub` inherent methods, and methods of a trait carrying a visibility, a trait impl follows its trait'
