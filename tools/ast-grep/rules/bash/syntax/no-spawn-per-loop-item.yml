# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-spawn-per-loop-item
language: bash
severity: error
ignores: ["**/*.json"]
utils:
    batch-operand:
        any:
            - matches: rm-operand
            - matches: rmdir-operand
            - matches: mkdir-operand
            - matches: touch-operand
            - matches: cat-operand
            - matches: shellcheck-operand
            - matches: shfmt-operand
            - matches: actionlint-operand
            - matches: git-add-operand
            - matches: git-rm-operand
            - matches: ast-grep-scan-operand
    rm-operand:
        follows: {kind: command_name, regex: '^rm$', stopBy: {not: {matches: rm-option}}}
    rm-option: {kind: word, regex: '^(--|-[dfiIPrRvWx]+|--(force|recursive|dir|verbose|interactive(=\w+)?|one-file-system|(no-)?preserve-root(=all)?))$'}
    rmdir-operand:
        follows: {kind: command_name, regex: '^rmdir$', stopBy: {not: {matches: rmdir-option}}}
    rmdir-option: {kind: word, regex: '^(--|-[pv]+|--(parents|verbose|ignore-fail-on-non-empty))$'}
    mkdir-operand:
        follows: {kind: command_name, regex: '^mkdir$', stopBy: {not: {matches: mkdir-option}}}
        not: {follows: {matches: mkdir-value-option}}
    mkdir-value-option: {kind: word, regex: '^-[pvZ]*m$'}
    mkdir-option:
        any:
            - kind: word
              regex: '^(--|-[pvZ]+|--(parents|verbose|context(=.*)?|mode=.*))$'
            - matches: mkdir-value-option
            - follows: {matches: mkdir-value-option}
    touch-operand:
        follows: {kind: command_name, regex: '^touch$', stopBy: {not: {matches: touch-option}}}
        not: {follows: {matches: touch-value-option}}
    touch-value-option: {kind: word, regex: '^-[acfhm]*[rtdA]$'}
    touch-option:
        any:
            - kind: word
              regex: '^(--|-[acfhm]+|--(no-create|no-dereference|reference=.*|date=.*|time=.*))$'
            - matches: touch-value-option
            - follows: {matches: touch-value-option}
    cat-operand:
        follows: {kind: command_name, regex: '^cat$', stopBy: {not: {matches: cat-option}}}
    cat-option: {kind: word, regex: '^(--|-[AeEtTuv]+|--(show-all|show-ends|show-tabs|show-nonprinting))$'}
    shellcheck-operand:
        follows: {kind: command_name, regex: '^shellcheck$', stopBy: {not: {matches: shellcheck-option}}}
        not: {follows: {matches: shellcheck-value-option}}
    shellcheck-value-option: {kind: word, regex: '^-[iefoPsSW]$'}
    shellcheck-option:
        any:
            - kind: word
              regex: '^(--|-[ax]|-C(auto|always|never)?|--(check-sourced|color(=\w+)?|external-sources|norc|extended-analysis=\w+|(include|exclude|format|enable|source-path|shell|severity|wiki-link-count|rcfile)=.*))$'
            - matches: shellcheck-value-option
            - follows: {matches: shellcheck-value-option}
    shfmt-operand:
        follows: {kind: command_name, regex: '^shfmt$', stopBy: {not: {matches: shfmt-option}}}
        not: {follows: {matches: shfmt-value-option}}
    shfmt-value-option: {kind: word, regex: '^(-(i|ln|filename|detect)|--(indent|language-dialect|filename|detect))$'}
    shfmt-option:
        any:
            - kind: word
              regex: '^(--|-(l|w|d|p|s|bn|ci|sr|kp|fn|mn)|--(list|write|diff|posix|simplify|binary-next-line|case-indent|space-redirects|keep-padding|func-next-line|minify|apply-ignore)|-(l|i|ln|filename|detect)=.*|--(list|indent|language-dialect|filename|detect)=.*)$'
            - matches: shfmt-value-option
            - follows: {matches: shfmt-value-option}
    actionlint-operand:
        follows: {kind: command_name, regex: '^actionlint$', stopBy: {not: {matches: actionlint-option}}}
        not: {follows: {matches: actionlint-value-option}}
    actionlint-value-option: {kind: word, regex: '^-(config-file|format|ignore|pyflakes|shellcheck)$'}
    actionlint-option:
        any:
            - kind: word
              regex: '^(--|-(color|debug|no-color|oneline|verbose))$'
            - matches: actionlint-value-option
            - follows: {matches: actionlint-value-option}
    git-add-operand:
        follows: {kind: word, regex: '^add$', follows: {kind: command_name, regex: '^git$'}, stopBy: {not: {matches: git-add-option}}}
    git-add-option: {kind: word, regex: '^(--|-[nvfuNA]+|--(no-)?(dry-run|verbose|force|update|renormalize|intent-to-add|all|ignore-removal|refresh|ignore-errors|ignore-missing|sparse))$'}
    git-rm-operand:
        follows: {kind: word, regex: '^rm$', follows: {kind: command_name, regex: '^git$'}, stopBy: {not: {matches: git-rm-option}}}
    git-rm-option: {kind: word, regex: '^(--|-[nqfr]+|--(no-)?(dry-run|quiet|cached|force|ignore-unmatch|sparse))$'}
    ast-grep-scan-operand:
        follows: {kind: word, regex: '^scan$', follows: {kind: command_name, regex: '^ast-grep$'}, stopBy: {not: {matches: ast-grep-scan-option}}}
        not: {follows: {matches: ast-grep-scan-value-option}}
    ast-grep-scan-value-option: {kind: word, regex: '^(-[crjABC]|--(config|rule|inline-rules|filter|report-style|color|no-ignore|globs|threads|min-severity|inspect|max-results|after|before|context))$'}
    ast-grep-scan-option:
        any:
            - kind: word
              regex: '^(--|-[Ui]|--(update-all|interactive|follow|include-metadata|files-with-matches|json=stream|(error|warning|info|hint|off)(=.*)?|(config|rule|inline-rules|filter|report-style|color|no-ignore|globs|threads|min-severity|inspect|max-results|after|before|context)=.*))$'
            - matches: ast-grep-scan-value-option
            - follows: {matches: ast-grep-scan-value-option}
rule:
    kind: command
    not: {has: {kind: variable_assignment}}
    all:
        - inside:
            kind: do_group
            matches: bash-single-command-body
            inside:
                kind: for_statement
                has: {field: variable, pattern: $ITEM}
        - has: {field: name, pattern: $NAME}
        - has:
            pattern: $OPERAND
            nthChild: {position: 1, reverse: true}
            matches: {bash-parameter: {name: {pattern: $ITEM}}}
        - has: {pattern: $OPERAND, matches: batch-operand}
message: 'The loop invokes `$NAME` separately for each `$ITEM` operand'
note: Pass independent operands together as one array, with `--` where the tool accepts it, and skip an empty set
