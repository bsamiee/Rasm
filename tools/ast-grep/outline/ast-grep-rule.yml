id: ast-grep-rule
language: yaml
role: item
symbolType: module
utils:
    document-pair:
        kind: block_mapping_pair, flow_pair
        inside: {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {kind: document}}}
rule:
    kind: document
    pattern: $DOCUMENT
    all:
        - has: {stopBy: end, matches: document-pair, all: [{has: {field: key, regex: '^(id|"id"|''id'')$'}}, {has: {field: value, pattern: $NAME}}]}
        - has: {stopBy: end, matches: document-pair, has: {field: key, regex: '^(rule|"rule"|''rule'')$'}}
rewriters:
    - id: severity
      rule: {matches: document-pair, all: [{has: {field: key, regex: '^(severity|"severity"|''severity'')$'}}, {has: {field: value, pattern: $VALUE}}]}
      fix: $VALUE
    - id: files
      rule: {matches: document-pair, all: [{has: {field: key, regex: '^(files|"files"|''files'')$'}}, {has: {field: value, pattern: $VALUE}}]}
      transform:
        LIST: {replace: {source: $VALUE, replace: '\s*\n\s*', by: ' '}}
      fix: 'files $LIST'
    - id: fix
      rule: {matches: document-pair, has: {field: key, regex: '^(fix|"fix"|''fix'')$'}}
      fix: fix
    - id: util-call
      rule: {kind: 'block_mapping_pair, flow_pair', all: [{has: {field: key, regex: '^(matches|"matches"|''matches'')$'}}, {has: {field: value, pattern: $UTIL, has: {kind: 'plain_scalar, double_quote_scalar, single_quote_scalar'}}}]}
      fix: 'matches $UTIL'
    - id: util-call-map
      rule:
        kind: block_mapping_pair, flow_pair
        has: {field: key, pattern: $UTIL}
        inside: {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {kind: 'block_mapping_pair, flow_pair', has: {field: key, regex: '^(matches|"matches"|''matches'')$'}}}}
      fix: 'matches $UTIL'
transform:
    SIGNATURE: {rewrite: {source: $DOCUMENT, rewriters: [severity, files, fix, util-call, util-call-map], joinBy: ', '}}
name: $NAME
signature: $SIGNATURE
isExported: true
