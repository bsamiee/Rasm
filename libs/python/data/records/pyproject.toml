# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-records"
version         = "0.0.0"
description     = "Fault records and results, record field domains, record files and stores, and keyed record trees"
requires-python = ">=3.13"

dependencies = [
    "cbor2",             # Canonical binary content hashing with unbounded integers
    "expression",        # Results, options, and collections over records
    "msgspec[toml]",     # Records, tagged unions, field bounds, and JSON, TOML, and MessagePack codecs
    "numpy",             # Content hashes of array buffers
    "typing-extensions", # Runtime `TypeForm` schemas where `typing` lacks `TypeForm`
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table
