# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-engine-as-value
language: tsx
severity: error
files:
    - '**/.claude/plugins/**'
utils:
    engine-call-site:
        inside:
            kind: member_expression
            field: object
            inside: {kind: member_expression, field: object, inside: {kind: call_expression, field: function}}
    plugin-read:
        inside:
            kind: member_expression
            field: object
            inside: {any: [{pattern: $.plugin.name}, {pattern: $.plugin.root}]}
rule:
    kind: identifier, shorthand_property_identifier
    regex: ^\$$
    not:
        any:
            - {matches: engine-call-site}
            - {matches: plugin-read}
            - {inside: {kind: 'required_parameter, optional_parameter'}}
            - {inside: {kind: arrow_function, field: parameter}}
    pattern: $MATCH
message: '`$` is read as a value and the loader refuses the module'
note: Spell the engine interface as `$.<noun>.<verb>(...)` at each call site, `$.plugin.name` and `$.plugin.root` are its property reads
labels: {MATCH: {style: primary}}
