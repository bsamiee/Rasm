id: mapfile-status-loop-to-length-test
valid:
    - 'while mapfile -tn 2 batch && (( ${#batch[@]} )); do :; done'
    - 'while mapfile -tn 2; do :; done'
    - 'while mapfile -t -n 2; do :; done'
    - 'while mapfile -O 1; do :; done'
    - 'while mapfile -t -C cb -c 1 rows; do :; done'
    - 'while mapfile -tn 2 batch < f; do :; done'
    - 'while mapfile -tn 2 batch; (( ${#batch[@]} )); do :; done'
    - 'while mapfile -tn "$size" batch; do :; done'
    - 'until mapfile -tn 2 batch; do :; done'
    - 'while echo mapfile batch; do :; done'
    - 'while builtin read -r line; do :; done'
    - 'while mapfile -t a-b; do :; done'
    - 'while mapfile -t -d x; do :; done'
    - 'while read -r line; do :; done'
invalid:
    - |
      while mapfile -tn 2 batch; do
          printf '%s\n' "${#batch[@]}"
      done < <(printf 'a\nb\nc\n')
    - 'while readarray -t rows; do :; done'
    - 'while mapfile -t -n 2 batch; do :; done'
    - 'while builtin mapfile -tn 2 batch; do :; done'
    - 'while mapfile -t -O 1 rows; do :; done'
    - 'while mapfile -tn 2 batch; do :; done < file'
    - 'while command mapfile -tn 2 batch; do :; done'
