# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-import-reference
language: tsxlang
arguments: [source, exported]
utils:
    module-reference:
        matches: {typescript-module-reference: {source: {matches: source}}}
    type-only:
        has: {regex: '^type$', not: {pattern: $_}}
    module-import:
        kind: import_statement
        has: {field: source, all: [{has: {kind: string_fragment, matches: source}}, {not: {has: {kind: escape_sequence}}}]}
    exported-binding:
        any:
            - kind: import_specifier
              has: {field: name, matches: exported}
            - kind: namespace_import
              has: {regex: '^\*$', matches: exported}
    type-position:
        inside: {kind: 'nested_type_identifier, type_query', stopBy: {not: {kind: 'nested_identifier, member_expression'}}}
rule:
    any:
        - kind: identifier, undefined
          pattern: $IMPORTED
          all:
            - any:
                - inside: {kind: program, stopBy: end, has: {all: [{matches: module-import}, {not: {matches: type-only}}, {has: {stopBy: end, pattern: $IMPORTED, matches: typescript-import-binding, inside: {matches: exported-binding, not: {matches: type-only}}}}]}}
                - matches: type-position
                  inside: {kind: program, stopBy: end, has: {all: [{matches: module-import}, {has: {stopBy: end, pattern: $IMPORTED, matches: typescript-import-binding, inside: {matches: exported-binding}}}]}}
            - not: {matches: {typescript-local-binding: {owner: {pattern: $_}}}}
        - kind: member_expression, nested_identifier
          all:
            - has: {field: property, matches: exported}
            - has: {field: object, matches: module-reference}
