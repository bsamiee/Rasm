# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-topological-sort-by-hand
language: rust
severity: error
utils:
    decrement:
        kind: expression_statement
        has: {kind: compound_assignment_expr, pattern: $D -= 1}
rule:
    kind: if_expression
    all:
        - has: {field: condition, pattern: $D == 0}
        - has: {field: consequence, has: {stopBy: {kind: 'closure_expression, function_item'}, kind: call_expression, pattern: $Q.$PUSH($$$)}}
        - any:
            - follows: {matches: decrement}
            - inside: {kind: expression_statement, follows: {matches: decrement}}
        - inside:
            kind: 'while_expression, loop_expression'
            stopBy: {kind: 'closure_expression, function_item'}
            has: {stopBy: end, kind: call_expression, pattern: $Q.$POP()}
constraints:
    PUSH: {regex: '^(push|push_back|push_front)$'}
    POP: {regex: '^(pop|pop_back|pop_front)$'}
message: '`$Q` releases a node when its in-degree `$D` reaches zero in a hand-written Kahn''s algorithm'
note: 'Build a `petgraph::graphmap::DiGraphMap` or `petgraph::Graph` and call `petgraph::algo::toposort(&graph, None)`, `toposort` returns the order or `Err(Cycle)` naming a node on a cycle'
