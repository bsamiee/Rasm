# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-keychain-delete-then-add
language: swift
severity: error
utils:
    delete-command:
        any:
            - matches: {swift-security-arguments: {subcommand: {regex: '^"delete-(generic|internet)-password"$'}}}
            - kind: line_string_literal, multi_line_string_literal, raw_string_literal
              regex: '(?m)(?:^#*"*|\\n)[ \t]*delete-(?:generic|internet)-password[ \t]'
            - kind: call_expression
              has: {nthChild: 1, kind: simple_identifier, regex: '^(SecItemDelete|SecKeychainItemDelete)$'}
    after-delete:
        inside: {kind: statements}
        follows: {stopBy: end, any: [{matches: delete-command}, {has: {stopBy: end, matches: delete-command}}]}
rule:
    pattern: $ADD
    any:
        - kind: line_string_literal, multi_line_string_literal, raw_string_literal
          regex: '(?ms)(?:^#*"*|\\n)[ \t]*delete-(?:generic|internet)-password[ \t].*(?:^|\\n)[ \t]*add-(?:generic|internet)-password[ \t]'
        - all:
            - any:
                - matches: {swift-security-arguments: {subcommand: {regex: '^"add-(generic|internet)-password"$'}}}
                - kind: line_string_literal, multi_line_string_literal, raw_string_literal
                  regex: '(?m)(?:^#*"*|\\n)[ \t]*add-(?:generic|internet)-password[ \t]'
                - kind: call_expression
                  has: {nthChild: 1, kind: simple_identifier, regex: '^(SecItemAdd|SecKeychainAdd(Generic|Internet)Password)$'}
            - any:
                - matches: after-delete
                - inside: {stopBy: end, matches: after-delete}
                - inside:
                    stopBy: end
                    kind: call_suffix
                    inside: {kind: call_expression, has: {kind: navigation_expression, has: {stopBy: end, matches: delete-command}}}
message: '`$ADD` recreates a deleted keychain item and replaces its ACL and partition list with ones naming the writer alone'
note: 'Drop the delete and update data in place through `add-generic-password -U` or `SecItemUpdate`'
