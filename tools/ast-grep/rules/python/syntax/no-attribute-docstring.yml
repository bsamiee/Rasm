# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
utils:
    literal:
        any:
            - kind: string, concatenated_string
              not: {has: {stopBy: end, kind: string_start, regex: '(?i)[bft]'}}
            - kind: parenthesized_expression
              has: {matches: literal}
    string-statement:
        kind: expression_statement
        has:
            matches: literal
rule:
    matches: string-statement
    not:
        any:
            - has: {pattern: $_, nthChild: {position: 2, ofRule: {not: {kind: comment}}}}
            - has: {stopBy: end, kind: comment}
            - precedes: {regex: '^;$'}
              not: {follows: {regex: '^;$'}}
    follows:
        stopBy: {not: {any: [{kind: comment}, {regex: '^;$'}, {matches: string-statement}]}}
        any:
            - kind: expression_statement
              has: {kind: assignment, has: {field: left, pattern: $NAME}}
            - kind: type_alias_statement
              has: {field: left, pattern: $NAME}
fix:
    template: ""
    expandStart: {regex: '^;$', precedes: {matches: string-statement, has: {matches: literal}}}
message: 'String after `$NAME` is a docstring Python discards'
note: 'Delete the string and state its fact in a name or annotated type'
