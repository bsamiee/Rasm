# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-form"
version.workspace    = true
edition.workspace    = true
description          = "Force-density equilibrium, dynamic relaxation, and inverse form-finding of supported networks"
repository.workspace = true
license.workspace    = true
keywords             = ["form-finding", "force-density", "dynamic-relaxation", "cable-net", "gridshell"]
categories           = ["science", "mathematics", "simulation"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
faer                 = { workspace = true }
nalgebra             = { workspace = true }
petgraph             = { workspace = true }
nlopt                = { workspace = true }
rasm-stats           = { workspace = true }
rasm-optimize        = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
