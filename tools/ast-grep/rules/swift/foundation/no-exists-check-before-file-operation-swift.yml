# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exists-check-before-file-operation-swift
language: swiftlang
severity: error
utils:
    subject-path:
        any:
            - pattern: $SUBJECT.path
            - pattern: $SUBJECT.path()
            - pattern: '$SUBJECT.path(percentEncoded: $_)'
            - pattern: $SUBJECT
    first-argument:
        has:
            kind: call_suffix
            has:
                kind: value_arguments
                has: {kind: value_argument, nthChild: 1, has: {field: value, matches: subject-path}}
    existence:
        kind: call_expression
        all:
            - has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^(fileExists|isExecutableFile)$'}}}
            - matches: first-argument
    exists-check:
        any:
            - matches: existence
              pattern: $CHECK
              not: {regex: '^!'}
            - kind: equality_expression
              pattern: $CHECK
              all:
                - has: {kind: tuple_expression, has: {kind: try_expression, has: {pattern: $SUBJECT.checkResourceIsReachable()}}}
                - has: {regex: '^true$'}
    absent-check:
        matches: existence
        pattern: $CHECK
        regex: '^!'
    file-operation:
        kind: call_expression
        all:
            - has:
                nthChild: 1
                any:
                    - kind: navigation_expression
                      has: {field: suffix, has: {field: suffix, regex: '^(removeItem|trashItem|moveItem|copyItem|contentsOfDirectory|attributesOfItem|destinationOfSymbolicLink|contents)$'}}
                    - regex: '^((Foundation\.)?(Data|String|FileHandle)(\.init)?|\.init)$'
            - has:
                kind: call_suffix
                has:
                    kind: value_arguments
                    has:
                        kind: value_argument
                        nthChild: 1
                        all:
                            - has: {field: name, regex: '^(at|atPath|contentsOf|contentsOfFile|forReadingFrom|forReadingAtPath)$'}
                            - has: {field: value, matches: subject-path}
    executable-path:
        regex: '^((Subprocess\.)?Executable)?\.path\('
        has: {stopBy: end, kind: value_argument, has: {field: value, matches: subject-path}}
    spawn:
        kind: call_expression
        has:
            kind: call_suffix
            has:
                kind: value_arguments
                any:
                    - has: {kind: value_argument, all: [{has: {field: name, regex: '^executable$'}}, {has: {field: value, matches: executable-path}}]}
                    - all:
                        - inside: {kind: call_suffix, inside: {kind: call_expression, has: {nthChild: 1, regex: '^((Subprocess\.)?run|(Subprocess\.)?Configuration(\.init)?)$'}}}
                        - has: {kind: value_argument, nthChild: 1, has: {field: value, matches: executable-path}}
    operation:
        any:
            - matches: file-operation
            - matches: spawn
    exit-body:
        matches: {swift-single-statement: {first: {kind: control_transfer_statement}}}
rule:
    any:
        - kind: ternary_expression
          all:
            - has: {field: condition, matches: exists-check}
            - inside:
                stopBy: end
                kind: 'function_declaration, init_declaration'
                has: {stopBy: end, matches: spawn}
        - kind: ternary_expression
          all:
            - has: {field: condition, matches: exists-check}
            - has: {field: if_true, has: {matches: operation, stopBy: end}}
        - kind: guard_statement
          all:
            - has: {matches: exists-check}
            - precedes: {has: {matches: operation, stopBy: end}, stopBy: end}
        - kind: if_statement
          all:
            - has: {matches: exists-check}
            - has: {kind: statements, has: {matches: operation, stopBy: end}}
        - kind: if_statement
          all:
            - has: {matches: absent-check}
            - not: {has: {regex: '^else$'}}
            - has: {kind: statements, matches: exit-body}
            - precedes: {has: {matches: operation, stopBy: end}, stopBy: end}
        - kind: for_statement
          all:
            - has: {kind: where_clause, has: {matches: exists-check}}
            - has: {kind: statements, has: {matches: operation, stopBy: end}}
message: '`$CHECK` tests that a file exists or is executable before an operation that reports a missing file itself'
note: 'Run the operation unconditionally in the function mapping a missing file to `.success(nil)`, and match `executableNotFound` for a spawn'
