# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-package-reference
language: tsxlang
rule:
    any:
        - matches: {typescript-import-reference: {source: {regex: '^[^.]'}, exported: {regex: '.'}}}
        - kind: member_expression
          has: {field: object, matches: typescript-package-reference}
