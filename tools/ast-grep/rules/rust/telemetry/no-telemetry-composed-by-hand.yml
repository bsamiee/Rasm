# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
ignores: ['libs/rust/runtime/telemetry/process.rs']
utils:
    tracer-builder:
        any:
            - regex: '(?s)(?-u:\b)(LogTracer::builder|log_tracer::Builder::(new|default))\(\)'
            - all:
                - regex: '(?s)^\p{XID_Continue}*Builder::(new|default)\(\)'
                - inside: {kind: source_file, stopBy: end, has: {kind: use_declaration, regex: '(?s)(?-u:\b)log_tracer::.*(?-u:\b)Builder(?-u:\b)'}}
    builder-init:
        all:
            - has: {field: field, regex: '^init$'}
            - any:
                - has: {field: value, matches: tracer-builder}
                - all:
                    - has: {field: value, kind: identifier, pattern: $BUILDER}
                    - inside: {kind: block, stopBy: end, has: {kind: let_declaration, all: [{has: {field: pattern, pattern: $BUILDER}}, {has: {field: value, matches: tracer-builder}}]}}
    qualified-install:
        regex: '^(::)?(tracing::)?(subscriber|dispatcher)::(set_global_default|set_default|with_default)$|^(::)?(tracing_log::)?LogTracer::init$|(^|::)global::set_(tracer_provider|meter_provider|text_map_propagator)$|(^|::)panic::(set_hook|take_hook)$'
    module-alias:
        kind: identifier
        matches: {rust-imported-name: {source: {has: {field: argument, regex: '^(::)?(tracing|opentelemetry|std)::'}}, name: {regex: '^(subscriber|dispatcher|global|panic)$'}}}
    predecessor-dropped:
        not:
            inside:
                kind: call_expression
                has:
                    field: arguments
                    has:
                        kind: closure_expression
                        all:
                            - has:
                                field: parameters
                                has:
                                    nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                                    any:
                                        - {kind: identifier, pattern: $PREVIOUS}
                                        - {kind: parameter, has: {field: pattern, kind: identifier, pattern: $PREVIOUS}}
                            - has: {field: body, stopBy: end, kind: call_expression, has: {field: function, pattern: $PREVIOUS}}
rule:
    all:
        - any:
            - kind: scoped_identifier
              all:
                - any:
                    - matches: qualified-install
                    - regex: &installer-name '(^|::)(set_global_default|set_default|with_default|set_(tracer_provider|meter_provider|text_map_propagator)|set_hook|take_hook)$'
                      has: {field: path, matches: module-alias}
                    - regex: '(^|::)update_hook$'
                      any:
                        - regex: '(^|::)panic::update_hook$'
                        - has: {field: path, matches: module-alias}
                      matches: predecessor-dropped
                - not: {inside: {kind: &use-tree 'scoped_identifier, use_declaration, use_list, scoped_use_list, use_as_clause, use_wildcard'}}
            - kind: field_expression
              matches: builder-init
            - kind: identifier
              all:
                - any:
                    - all:
                        - regex: *installer-name
                        - matches: {rust-imported-name: {source: &installer-source {has: {field: argument, regex: '^(::)?(tracing|opentelemetry::global|std::panic)::'}}, name: {regex: *installer-name}}}
                    - all:
                        - pattern: update_hook
                        - matches: {rust-imported-name: {source: {has: {field: argument, regex: '^(::)?std::panic::'}}, name: {regex: '^update_hook$'}}}
                        - matches: predecessor-dropped
                - not: {inside: {kind: *use-tree}}
            - kind: use_as_clause
              matches: {rust-renamed-import: {source: *installer-source, name: {regex: *installer-name}}}
        - pattern: $SITE
        - not: {matches: rust-test-scope}
message: '`$SITE` installs a subscriber, `LogTracer`, provider, or propagator outside `rasm-telemetry`, or a panic hook dropping the one before it'
note: 'Start through `rasm_cli::run`; keep panic hooks for process lifetime and call their predecessor through `panic::update_hook`'
