# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: msbuild-metadata # Element holding a named value as an attribute or a child element, the attribute form alone shows the value regex its delimiters
language: xml
arguments: [name, value]
rule:
    kind: element
    any:
        - has: {matches: msbuild-tag, has: {kind: Attribute, all: [{has: {kind: Name, matches: name}}, {has: {kind: AttValue, matches: value}}]}}
        - has:
              kind: content
              has:
                  kind: element
                  all:
                      - has: {kind: STag, has: {kind: Name, matches: name}}
                      - has: {kind: content, has: {kind: CharData, matches: value}}
