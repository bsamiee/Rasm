# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-condition-poll
language: swift
severity: error
utils:
    observed-state:
        kind: navigation_expression
        all:
            - has: {field: suffix, regex: '^\.(isTerminated|isFinishedLaunching|isRunning|isActive|isHidden|isReady|isFinished|isCancelled|isExecuting|fileExists|contentsOfDirectory|attributesOfItem|runningApplications|frontmostApplication|menuBarOwningApplication)$'}
            - not: {has: {field: target, regex: '^!?Task$'}}
    sleep-call:
        any:
            - pattern: $_.sleep($$$A)
            - pattern: usleep($$$A)
            - pattern: sleep($$$A)
            - pattern: Task.yield()
            - pattern: '$_.run(until: $$$A)'
            - pattern: '$_.run(mode: $M, before: $$$A)'
            - pattern: CFRunLoopRunInMode($$$A)
            - pattern: '$_.wait(timeout: $$$A)'
            - pattern: '$_.wait(wallTimeout: $$$A)'
rule:
    kind: 'while_statement, repeat_while_statement, for_statement'
    all:
        - has:
            stopBy: end
            matches: observed-state
            pattern: $STATE
            any:
                - not: {inside: {kind: statements, stopBy: {kind: 'while_statement, repeat_while_statement, for_statement'}}}
                - inside:
                    kind: 'if_statement, guard_statement'
                    stopBy: {kind: statements}
                    has: {kind: statements, has: {kind: control_transfer_statement, regex: '^(break|return|throw)\b'}}
        - has: {stopBy: end, matches: sleep-call, pattern: $SLEEP}
message: '`$SLEEP` polls `$STATE` in a loop'
note: 'Await the change through `Observations { <state> }` for `@Observable` state, `publisher(for: <key path>).values` for a KVO-compliant property, `notifications(named:)` for a posted notification, `DispatchSource.makeFileSystemObjectSource` for a file, or the server push'
