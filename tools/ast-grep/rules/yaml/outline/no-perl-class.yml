# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yaml
severity: error
files: ['tools/ast-grep/outline/**', 'tools/ast-grep/rules/**', 'tools/ast-grep/utils/**']
rule:
    any:
        - kind: plain_scalar, single_quote_scalar, block_scalar
          not: {regex: '^(?:[^\\]|\\[^sSwWdDbB]|\(\?-u:\\[bB]\))*$'}
        - kind: double_quote_scalar
          not: {regex: '^(?:[^\\]|\\[^\\]|\\\\\\\\|\\\\\\[^\\]|\\\\[^\\sSwWdDbB]|\(\?-u:\\\\[bB]\))*$'}
message: Unicode Perl class compiles about four times slower and states no grammar fact
note: 'Write `[\t\n\v\f\r ]`, `[0-9A-Za-z_]`, `[0-9]` or `(?-u:\b)` over ASCII tokens, else the class the grammar''s `word` and `extras` derive'
