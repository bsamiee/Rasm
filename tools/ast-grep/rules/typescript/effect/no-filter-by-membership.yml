# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-filter-by-membership
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/**']
utils:
    collection:
        matches: {effect-module: {name: {regex: '\b(Array|Chunk|HashSet)$'}}}
    native-receiver:
        not: {any: [{kind: 'string, template_string'}, {matches: {effect-module: {name: {regex: '\w'}}}}]}
    membership:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: object, pattern: $OWNER}}
            - any:
                - pattern: $OWNER.has($SEEN, $X)
                  has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\bHashSet$'}}}}}
                - pattern: $OWNER.contains($SEEN, $X)
                  has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\b(Array|Chunk|Iterable)$'}}}}}
                - pattern: $OWNER.includes($X)
                  has: {field: function, has: {field: object, pattern: $SEEN, matches: native-receiver}}
    predicate:
        kind: arrow_function
        all:
            - has: {field: parameters, has: {kind: required_parameter, nthChild: 1, has: {field: pattern, kind: identifier, pattern: $X}}, not: {has: {nthChild: 2}}}
            - has: {field: body, any: [{matches: membership}, {pattern: '!$_INNER', has: {matches: membership}}]}
    set-test:
        pattern: $_SET.has($_SEEN, $_ITEM)
        has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\bHashSet$'}}}}}
    set-predicate:
        kind: arrow_function
        has: {field: body, any: [{matches: set-test}, {has: {matches: set-test}}]}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^filter$'}}
        - any:
            - all:
                - has: {field: arguments, has: {matches: predicate, nthChild: {position: 1, reverse: true}}}
                - has: {field: function, has: {field: object, matches: collection}}
                - any:
                    - has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\bArray$'}}}}}
                      not: {has: {field: arguments, has: {matches: set-predicate}}}
                    - has: {field: function, has: {field: object, pattern: $OWNER}}
            - all:
                - has: {field: function, has: {field: object, matches: native-receiver}}
                - has: {field: arguments, has: {matches: predicate, nthChild: 1}, not: {has: {nthChild: 2}}}
                - not: {has: {field: arguments, has: {matches: set-predicate}}}
        - not: {matches: typescript-complementary-filter}
constraints:
    SEEN: {not: {any: [{kind: identifier, pattern: $X}, {has: {stopBy: end, kind: identifier, pattern: $X}}]}}
message: '`filter` tests each element for membership in `$SEEN` by hand'
note: 'Call `<module>.difference(<list>, <seen>)` for elements absent from `<seen>`, or `<module>.intersection` for those present'
