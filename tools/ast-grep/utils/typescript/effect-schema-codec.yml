# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-schema-codec
language: tsxlang
arguments: [name]
utils:
    aliased:
        kind: identifier
        pattern: $ALIAS
        inside:
            kind: program
            stopBy: end
            has:
                kind: import_statement
                all:
                    - has: {field: source, regex: '^.effect/(Schema|SchemaParser).$'}
                    - has: {kind: import_clause, has: {kind: named_imports, has: {kind: import_specifier, has: {field: alias, pattern: $ALIAS}}}}
rule:
    any:
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)(Schema|SchemaParser)$'}, member: {regex: '^(de|en)code(Unknown)?(Effect|Exit|Option|Promise|Result|Sync)$', matches: name}}}
        - kind: identifier
          regex: '^(de|en)code'
          matches: {typescript-import-reference: {source: {regex: '^effect/(Schema|SchemaParser)$'}, exported: {regex: '^(de|en)code(Unknown)?(Effect|Exit|Option|Promise|Result|Sync)$', matches: name}}}
        - kind: identifier
          all:
            - not: {regex: '^(de|en)code'}
            - matches: aliased
            - matches: {typescript-import-reference: {source: {regex: '^effect/(Schema|SchemaParser)$'}, exported: {regex: '^(de|en)code(Unknown)?(Effect|Exit|Option|Promise|Result|Sync)$', matches: name}}}
