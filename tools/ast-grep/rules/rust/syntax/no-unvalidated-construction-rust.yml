# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unvalidated-construction-rust
language: rust
severity: error
utils:
    open:
        kind: visibility_modifier
        regex: '^pub(\s*\(\s*crate\s*\))?$'
    fallible-self:
        kind: generic_type
        all:
            - has: {field: type, regex: '^(Result|Option)$'}
            - has: {field: type_arguments, has: {nthChild: 1, regex: '^Self$'}}
    own-impl:
        kind: impl_item
        has: {field: type, any: [{kind: generic_type, has: {field: type, pattern: $NAME}}, {pattern: $NAME}]}
    refusing-conversion:
        matches: own-impl
        has: {field: trait, kind: generic_type, all: [{has: {field: type, regex: '^((std|core)::)?(convert::)?TryFrom$'}}, {has: {field: type_arguments, has: {nthChild: 1, pattern: $T}}}]}
    refusing-constructor:
        matches: own-impl
        has:
            field: body
            has:
                kind: function_item
                all:
                    - has: {field: return_type, matches: fallible-self}
                    - has: {field: parameters, has: {kind: parameter, all: [{has: {field: pattern, pattern: $P}}, {has: {field: type, pattern: $T}}]}}
rule:
    kind: struct_item
    all:
        - has: {field: name, pattern: $NAME}
        - any:
            - all:
                - has: {field: body, kind: ordered_field_declaration_list, has: {matches: open, precedes: {pattern: $T}}}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: refusing-conversion}}
            - all:
                - has: {field: body, kind: field_declaration_list, has: {kind: field_declaration, all: [{has: {matches: open}}, {has: {field: name, pattern: $P}}, {has: {field: type, pattern: $T}}]}}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, any: [{matches: refusing-conversion}, {matches: refusing-constructor}]}}
message: '`$NAME` validates a `$T` through a fallible constructor and exposes a public `$T` field that bypasses it'
note: 'Keep every field private and expose the validated value through an accessor, construction then runs the checks `TryFrom` or the fallible constructor state'
