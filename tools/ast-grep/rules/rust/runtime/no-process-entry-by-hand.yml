# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
ignores: ['libs/rust/runtime/command/**']
utils:
    qualified-path:
        regex: '^(::)?(tokio::)?runtime::((Local)?Runtime::new|Builder::new_(multi|current)_thread)$|^(::)?((tokio::)?signal::)?(unix::signal|(windows::)?ctrl_c|windows::ctrl_(break|close|logoff|shutdown))$|(^|::)CompleteEnv::with_factory$|^(::)?(clap_complete::)?((aot|generator)::)?generate(_to)?$|^(::)?clap_mangen::(Man::new|generate_to)$'
    imported-constructor:
        any:
            - regex: '::new$'
              has: {field: path, matches: {rust-imported-name: {source: {has: {field: argument, regex: '^(::)?(tokio|clap_mangen)::'}}, name: {regex: '^((Local)?Runtime|Man)$'}}}}
            - regex: '::new_(multi|current)_thread$'
              has: {field: path, matches: {rust-imported-name: {source: &tokio {has: {field: argument, regex: '^(::)?tokio::'}}, name: {regex: '^Builder$'}}}}
    macro-path:
        inside: {kind: token_tree}
        any:
            - {regex: '^new$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^(Local)?Runtime$'}}}
            - {regex: '^new_(multi|current)_thread$', follows: {regex: '^::$', follows: {pattern: Builder}}}
            - {regex: '^signal$', follows: {regex: '^::$', follows: {pattern: unix}}}
            - {regex: '^ctrl_c$', follows: {regex: '^::$', follows: {kind: identifier, regex: '^(signal|windows)$'}}}
            - {regex: '^ctrl_(break|close|logoff|shutdown)$', follows: {regex: '^::$', follows: {pattern: windows}}}
    entry-attribute:
        regex: '^((::)?tokio::)?main$'
        inside: {kind: attribute, field: path}
    runtime-choice:
        regex: '(^|::)Builder::new_(multi|current)_thread$'
        inside: {stopBy: end, kind: closure_expression, precedes: {stopBy: end, kind: closure_expression}, inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|::)run$'}}}}
rule:
    all:
        - any:
            - kind: scoped_identifier
              all:
                - any:
                    - matches: qualified-path
                    - matches: imported-constructor
                    - matches: entry-attribute
                - not: {inside: {kind: &use-tree 'scoped_identifier, use_declaration, use_list, scoped_use_list, use_as_clause, use_wildcard'}}
                - not: {matches: runtime-choice}
            - kind: identifier
              all:
                - any:
                    - matches: macro-path
                    - all:
                        - matches: entry-attribute
                        - matches: {rust-imported-name: {source: *tokio, name: {regex: '^main$'}}}
                    - all:
                        - regex: &entry-name '^(signal|ctrl_(c|break|close|logoff|shutdown)|generate(_to)?)$'
                        - matches: {rust-imported-name: {source: &entry-source {has: {field: argument, regex: '^(::)?(tokio|clap_complete|clap_mangen)::'}}, name: {regex: *entry-name}}}
                - not: {inside: {kind: *use-tree}}
            - kind: use_as_clause
              matches: {rust-renamed-import: {source: *entry-source, name: {regex: '^(signal|ctrl_(c|break|close|logoff|shutdown)|generate(_to)?|main)$'}}}
        - pattern: $SITE
        - not: {matches: rust-test-scope}
message: '`$SITE` builds a runtime, signal listener, completion script, or man page outside `rasm-command`'
note: 'Run the entry through `rasm_command::run` and call `rasm_command::signals`'
