# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    field-read:
        kind: field_expression
        has: {field: value, kind: self}
    copied-field:
        kind: field_initializer
        all:
            - has: {field: field, pattern: $COPY_FIELD}
            - has: {field: value, pattern: self.$COPY_FIELD}
    equality:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^==$'}
                - has: {field: left, matches: field-read}
                - has: {field: right, kind: field_expression, has: {field: value, pattern: $OTHER}}
                - not: {not: {pattern: self.$EQUAL_FIELD == $OTHER.$EQUAL_FIELD}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^&&$'}
                - has: {field: left, matches: equality}
                - has: {field: right, matches: equality}
            - kind: parenthesized_expression
              has: {matches: equality}
    covered-field:
        kind: field_declaration
        all:
            - has: {field: name, pattern: $COVERED_FIELD}
            - inside:
                kind: field_declaration_list
                inside:
                    kind: struct_item
                    inside:
                        kind: 'source_file, declaration_list, block'
                        has: {kind: impl_item, has: {field: body, has: {kind: function_item, pattern: $METHOD, has: {field: body, has: {stopBy: end, pattern: self.$COVERED_FIELD}}}}}
    singleton:
        inside:
            kind: 'source_file, declaration_list, block'
            has:
                kind: struct_item
                all:
                    - has: {field: name, pattern: $T}
                    - has: {field: body, all: [{has: {kind: field_declaration, has: {field: name, pattern: $FIELD}}}, {not: {has: {nthChild: {position: 2, ofRule: {kind: field_declaration}}}}}]}
    prelude-shadow:
        inside:
            kind: 'source_file, declaration_list, block'
            stopBy: end
            has:
                any:
                    - kind: 'trait_item, type_item'
                      has: {field: name, regex: '^(Clone|PartialEq)$'}
                    - kind: use_declaration
                      has: {stopBy: end, any: [{kind: use_wildcard}, {kind: identifier, regex: '^(Clone|PartialEq)$'}]}
rule:
    kind: impl_item
    all:
        - has:
            field: trait
            pattern: $TRAIT
            any:
                - regex: '^(::)?(std|core)::(clone::Clone|cmp::PartialEq|fmt::Debug|hash::Hash)$'
                - kind: type_identifier
                  regex: '^(Clone|PartialEq)$'
                  not: {matches: prelude-shadow}
        - has: {field: type, any: [{kind: type_identifier, pattern: $T}, {kind: generic_type, has: {field: type, kind: type_identifier, pattern: $T}}]}
        - inside:
            kind: 'source_file, declaration_list, block'
            has:
                kind: struct_item
                all:
                    - has: {field: name, pattern: $T}
                    - has: {field: body, kind: field_declaration_list, all: [{has: {kind: field_declaration}}, {not: {has: {kind: field_declaration, not: {has: {field: type, kind: primitive_type}}}}}]}
        - has:
            field: body
            all:
                - has:
                    kind: function_item
                    pattern: $METHOD
                    any:
                        - all:
                            - has: {field: name, regex: '^clone$'}
                            - has:
                                field: body
                                matches:
                                    rust-single-statement:
                                        first:
                                            kind: struct_expression
                                            all:
                                                - has: {field: name, any: [{regex: '^Self$'}, {pattern: $T}]}
                                                - has: {field: body, all: [{has: {kind: field_initializer}}, {not: {has: {pattern: $_, not: {matches: copied-field}}}}]}
                        - all:
                            - has: {field: name, regex: '^eq$'}
                            - has: {field: parameters, has: {kind: parameter, has: {field: pattern, pattern: $OTHER}}}
                            - has: {field: body, matches: {rust-single-statement: {first: {matches: equality}}}}
                        - all:
                            - has: {field: name, regex: '^fmt$'}
                            - has: {field: parameters, has: {kind: parameter, has: {field: pattern, pattern: $FORMATTER}}}
                            - has: {field: body, matches: {rust-single-statement: {first: {pattern: '$FORMATTER.debug_struct("$T").field("$FIELD", &self.$FIELD).finish()'}}}}
                            - inside: {kind: declaration_list, inside: {matches: singleton}}
                        - all:
                            - has: {field: name, regex: '^hash$'}
                            - has: {field: parameters, has: {kind: parameter, has: {field: pattern, pattern: $STATE}}}
                            - has: {field: body, matches: {rust-single-statement: {first: {kind: expression_statement, any: [{pattern: 'std::hash::Hash::hash(&self.$FIELD, $STATE);'}, {pattern: 'core::hash::Hash::hash(&self.$FIELD, $STATE);'}]}}}}
                            - inside: {kind: declaration_list, inside: {matches: singleton}}
                - not: {has: {kind: function_item, nthChild: {position: 2, ofRule: {kind: function_item}}}}
        - inside:
            kind: 'source_file, declaration_list, block'
            has: {kind: struct_item, all: [{has: {field: name, pattern: $T}}, {not: {has: {field: body, has: {kind: field_declaration, not: {matches: covered-field}}}}}]}
        - not:
            all:
                - has: {field: trait, regex: '(^|::)Clone$'}
                - inside: {kind: 'source_file, declaration_list, block', has: {kind: struct_item, all: [{has: {field: name, pattern: $T}}, {matches: {rust-attributed: {attribute: {matches: {rust-derive: {trait: {regex: '^Copy$'}}}}}}}]}}
labels:
    TRAIT: {style: primary, message: 'Implemented by hand'}
    METHOD: {style: secondary, message: 'Copies or compares corresponding primitive fields'}
transform:
    DERIVE: replace($TRAIT, replace='^.*::', by='')
message: '`$DERIVE` for `$T` restates its derive over primitive fields'
note: 'Delete the impl and derive its trait'
