id: github-workflow-job
language: yaml
rule:
    kind: block_mapping, flow_mapping
    inside:
        kind: block_node, flow_node
        inside:
            kind: block_mapping_pair, flow_pair
            inside:
                kind: block_mapping, flow_mapping
                inside:
                    kind: block_node, flow_node
                    inside:
                        kind: block_mapping_pair, flow_pair
                        has: {field: key, regex: '^(jobs|"jobs"|''jobs'')$'}
                        inside:
                            kind: block_mapping, flow_mapping
                            inside:
                                kind: block_node, flow_node
                                inside: {kind: document}
