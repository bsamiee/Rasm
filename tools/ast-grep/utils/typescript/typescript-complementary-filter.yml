# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-complementary-filter
language: tsxlang
utils:
    list-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)(Array|Chunk)$'}}}
    predicate-not:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Predicate$'}, member: {regex: '^not$'}}}
    filtering:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^filter$'}}
            - any:
                - all:
                    - has: {field: arguments, has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
                    - has: {field: function, has: {field: object, pattern: $R, not: {matches: effect-namespace}}}
                - all:
                    - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $R}}, {has: {nthChild: {position: 2, ofRule: *code}}}, {not: {has: {nthChild: {position: 3, ofRule: *code}}}}]}
                    - has: {field: function, has: {field: object, matches: list-module}}
                - all:
                    - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
                    - any:
                        - nthChild: {position: 1, ofRule: *code}
                          inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, pattern: $R}}]}}}
                        - nthChild: {position: 2, ofRule: *code}
                          inside: {kind: arguments, has: {nthChild: {position: 1, ofRule: *code}, pattern: $R}, inside: {kind: call_expression, has: {field: function, regex: '^pipe$'}}}
                    - has: {field: function, has: {field: object, matches: list-module}}
    negating:
        any:
            - pattern: '($P) => !$F($P)'
            - pattern: '$P => !$F($P)'
            - pattern: '($P) => !($F($P))'
            - pattern: '$P => !($F($P))'
            - kind: call_expression
              pattern: '$NOT($F)'
              has: {field: function, matches: predicate-not}
    passing:
        any:
            - pattern: $F
            - pattern: '($Q) => $F($Q)'
            - pattern: '$Q => $F($Q)'
    negated:
        any:
            - pattern: '($P) => !($B)'
            - pattern: '($P) => !$B'
            - pattern: '$P => !($B)'
            - pattern: '$P => !$B'
    kept:
        any:
            - pattern: '($P) => $B'
            - pattern: '$P => $B'
rule:
    kind: call_expression
    all:
        - matches: filtering
        - any:
            - all:
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: negating}}
                - inside:
                    kind: &scope 'statement_block, arrow_function, program'
                    stopBy: &unconditional
                        not:
                            kind: 'call_expression, member_expression, arguments, lexical_declaration, variable_declarator, expression_statement, return_statement, array, object, pair, spread_element, parenthesized_expression, await_expression, assignment_expression, as_expression, satisfies_expression, non_null_expression'
                    has: {stopBy: *unconditional, matches: filtering, has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: passing}}}
            - all:
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: negated}}
                - inside:
                    kind: *scope
                    stopBy: *unconditional
                    has: {stopBy: *unconditional, matches: filtering, has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: kept}}}
