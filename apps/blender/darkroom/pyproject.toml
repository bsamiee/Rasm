# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "darkroom"
dynamic         = ["version"]
requires-python = ">=3.13"

dependencies = [
    "atomicwrites",
    "cbor2",
    "colour-science",
    "expression",
    "httpx2",
    "imagecodecs",
    "matplotlib",
    "msgspec",
    "numpy",
    "opencolorio",
    "openimageio",
    "psdtags",
    "scikit-image",
    "scipy",
    "structlog",
    "tenacity",
    "tifffile",
    "typing-extensions",
    "typing-inspection",
]

# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
managed = false

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml"
