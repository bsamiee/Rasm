# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: 'call_expression, match_expression, let_declaration'
    any:
        - pattern: '$R.unwrap_or_else(|$E| match $E {})'
        - pattern: 'match $R { Ok($V) => $V, Err($E) => match $E {} }'
        - pattern: 'match $R { Err($E) => match $E {}, Ok($V) => $V }'
        - pattern: 'match $R { Ok($V) => match $V {}, Err($E) => $E }'
        - pattern: 'match $R { Err($E) => $E, Ok($V) => match $V {} }'
        - all: [{pattern: 'let Ok($$_) = $R;'}, {not: {has: {field: alternative, kind: block}}}]
        - all: [{pattern: 'let Err($$_) = $R;'}, {not: {has: {field: alternative, kind: block}}}]
message: '`$R` unwraps an uninhabited case through an empty `match` or an irrefutable `let`'
note: 'Call `<result>.into_ok()` for an `Err` type of `!` and `<result>.into_err()` for an `Ok` type of `!`'
