# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-null-defaulted-equality
language: sql
severity: error
utils:
    defaulted:
        kind: function_call
        all:
            - has: {field: name, regex: '(?i)^(ifnull|coalesce)$'}
            - has: {field: arguments, kind: normal_function_arguments, not: {has: {nthChild: 3}}}
    left-defaulted:
        matches: defaulted
        has:
            field: arguments
            all:
                - has: {nthChild: 1, any: [{matches: sql-operator-expression, pattern: _AG}, {pattern: _A}]}
                - has: {nthChild: 2, pattern: _X}
    right-defaulted:
        matches: defaulted
        has:
            field: arguments
            all:
                - has: {nthChild: 1, any: [{matches: sql-operator-expression, pattern: _BG}, {pattern: _B}]}
                - has: {nthChild: 2, pattern: _X}
rule:
    kind: binary_expression
    pattern: _COMPARISON
    all:
        - has: {field: operator, regex: '^(==?|<>|!=)$', pattern: __OPERATOR}
        - has: {field: left, matches: left-defaulted, pattern: _LEFT}
        - has: {field: right, matches: right-defaulted, pattern: _RIGHT}
transform:
    EQUAL: {replace: {source: $OPERATOR, replace: '^==?$', by: ' not'}}
    NEGATION: {replace: {source: $EQUAL, replace: '^(<>|!=)$', by: ''}}
    GROUPED_A: {replace: {source: $AG, replace: '(?s)^(.+)$', by: '($1)'}}
    GROUPED_B: {replace: {source: $BG, replace: '(?s)^(.+)$', by: '($1)'}}
fix: '$A$GROUPED_A is$NEGATION distinct from $B$GROUPED_B'
message: '`$COMPARISON` compares `$LEFT` and `$RIGHT` through the shared default `$X`'
note: 'Compare with `is not distinct from` or `is distinct from`, the null-safe comparisons SQLite and DuckDB both read'
