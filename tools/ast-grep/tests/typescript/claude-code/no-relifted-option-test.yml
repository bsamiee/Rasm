id: no-relifted-option
valid:
    - "const result = some(true).match<number | Option<number>>({ some: () => 1, none: () => none<number>() });"
    - "const result = held.match({ some: compute, none });"
    - "const once = map((row: ServerRow): Once => ({ key: row.skill, line: row.line }))(serverRow(tool));"
    - "const row = flatMap((name: ToolName) => fromNullable(TOOLS[name]))(fromPredicate(isToolKey)(tool));"
    - "const field = getOrElse(() => '')(fromPredicate(isString)(fields[name]));"
    - "const rows = values.flatMap((value) => toArray(decodeFinding(value)));"
    - "const text = notice.match<string>({ some: (row) => row.text, none: () => '' });"
    - "const head = first.match<Option<Head>>({ some: (key) => some({ key, args }), none: () => second });"
    - "const lines = hit.match<readonly string[]>({ some: (line) => [line], none: () => [fallback] });"
    - "const lines = hit.match<readonly string[]>({ some: (rows) => [...rows], none: () => [] });"
    - "const lines = hit.match<readonly string[]>({ some: (row) => [row, row], none: () => [] });"
    - |
      const map =
          <A, B>(f: (value: A) => B): ((option: Option<A>) => Option<B>) =>
          (option: Option<A>): Option<B> =>
              option.match<Option<B>>({ some: (value) => some(f(value)), none });
    - "const getOrElse = <A>(fallback: () => A): ((option: Option<A>) => A) => (option: Option<A>): A => option.match<A>({ some: (value) => value, none: fallback });"
    - "const result = decision.match<Result>({ rewrite: (input) => next(input), deny: (reason) => ({ deny: reason }), answer: (value) => ({ result: value }) });"
    - "const cases = { some: (value) => value, none: () => fallback };"
    - "const held = registry.cases({ some: (value) => value, none: () => fallback });"
    - "const flipped = option.match<Option<Word>>({ some: () => none(), none: () => some(word) });"
    - "function map(f, option) { return option.match({some: (value) => some(f(value)), none}); }"
    - 'const mixed = fromBoolean(enabled).match<number | Option<number>>({ some: () => Number("1"), none: () => none<number>() });'
invalid:
    - "const once = serverRow(tool).match<Option<Once>>({ some: (row) => some({ key: row.skill, line: row.line }), none: () => none() });"
    - "const row = fromPredicate(isToolKey)(tool).match<Option<ToolRow>>({ some: (name) => fromNullable(TOOLS[name]), none: () => none() });"
    - "const row = fromPredicate(isToolKey)(tool).match<Option<ToolRow>>({ some: (name) => fromNullable(TOOLS[name]), none: none });"
    - "const substitution = fromPredicate(isString)(pair.from).match<Option<Substitution>>({ some: (from) => some({ pattern: pair.to, value: from }), none });"
    - "const row = server(tool).match({ some: (name) => fromNullable(SERVERS[name]), none: () => none() });"
    - "const operand = fromBoolean(hit >= 0).match<Option<Word>>({ some: () => find(argv), none: () => none() });"
    - "const field = isString(fields[name]).match<string>({ some: (value) => value, none: () => '' });"
    - "const directory = chosen.match<string>({ some: (directory: string) => directory, none: () => derived });"
    - "const rows = values.flatMap((value) => decodeFinding(value).match<readonly Finding[]>({ some: (row) => [row], none: () => [] }));"
    - "const keyed = decoded.match<readonly Keyed[]>({ some: (row) => [{ key, row }], none: () => [] });"
    - "const lines = fromNullable(hit.row.context).match<readonly string[]>({ some: (line) => [line(hit.leaf)], none: () => [] });"
    - |
      const map = (f) => {
          const inner = (option) => option.match({ some: (value) => some(f(value)), none });
          return inner;
      };
    - |
      const toArray = (option) => {
          function inner(held) {
              return held.match({ some: (value) => [value], none: () => [] });
          }
          return inner(option);
      };
    - "const matches = words.flatMap((word) => found(word).match<readonly Match[]>({ some: (match: Match) => [match], none: () => [] }));"
    - "const batch = held.match<Option<Batch>>({ some: (row) => some(decode(row)), none: () => none<Batch>() });"
    - "const field = held.match<string>({ some: (value) => { return value; }, none: () => '' });"
    - "const field = held.match<string>({ some: (value: string) => { return value; }, none: () => '' });"
    - "const same = held.match<Option<Row>>({ some: some, none: () => none() });"
