# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-blender"
version         = "0.1.0"
requires-python = "==3.13.*"     # Python minor Blender bundles, the one interpreter every member runs on
dependencies    = []

# --- [DEPENDENCY_GROUPS] ----------------------------------------------------------------

[dependency-groups]
blender = [
    "attrs==25.3.0",
    "autopep8==2.3.1",
    "cattrs==25.1.1",
    "certifi==2025.4.26",
    "charset-normalizer==3.4.1",
    "Cython==3.0.11",
    "docutils==0.22.4",
    "idna==3.10",
    "numpy==2.3.4",
    "opencolorio==2.5.0",
    "openimageio==3.1.16.0",
    "packaging==25.0",
    "pip==26.0.1",
    "pycodestyle==2.13.0",
    "pyproject-metadata==0.9.1",
    "requests==2.32.3",
    "setuptools==80.9.0",
    "tomli_w==1.2.0",
    "typing_extensions==4.14.1",
    "urllib3==2.4.0",
    "zstandard==0.25.0",
]                                # Versions Blender bundles, the lock holds each at it
dev     = [
    "fake-bpy-module-latest",    # Stubs for bpy, bmesh, mathutils, and gpu
    "mypy",                      # Type checker owning `exhaustive-match`, the `disallow_any_*` flags, `no-any-return`, unreachable code, and unused `type: ignore` comments
    "pydantic",                  # mypy plugin typing each pydantic model, whose replace signature holds explicit `Any` without it
    "rasm-refurb",               # Refurb checks over mypy types Ruff lacks, loaded by refurb as a plugin
    "refurb",                    # FURB checks Ruff lacks, over a mypy build
    "scipy-stubs",
    "ty",                        # Type checker of every member
    "types-networkx",
    "vulture",                   # Private functions, classes, methods, and attributes nothing reads
    "rasm-opencolorio-stubs",    # Stubs for PyOpenColorIO generated from the OpenColorIO Blender bundles
]

# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
environments                  = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]                                                                                 # The platforms the manifests of the extensions bundling these members list, the only ones uv solves for
required-environments         = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]                                                                                 # Each needs a wheel or source distribution of every package, else `uv lock` fails
minimum-libc-version          = { glibc = "2.28" }                                # Linux wheels in `required-environments` load on glibc 2.28, the `x86_64-manylinux_2_28` tag the extension build selects
prerelease                    = "allow"
preview-features              = ["lockfile-format-check", "minimum-libc-version"]
build-constraint-dependencies = ["opencolorio==2.5.0"]                            # Builds generating the PyOpenColorIO stubs import the OpenColorIO release Blender bundles

[tool.uv.workspace]
members = ["extension", "imaging", "opencolorio-stubs", "rendering", "../../../tests/libs/python/blender/extension", "../../../tests/libs/python/blender/rendering"]

[tool.uv.sources]
rasm-extension         = { workspace = true }
rasm-imaging           = { workspace = true }
rasm-opencolorio-stubs = { workspace = true }
rasm-rendering         = { workspace = true }
rasm-records           = { workspace = "../../.." }
rasm-refurb            = { workspace = "../../.." }
rasm-telemetry         = { workspace = "../../.." }
rasm-testing           = { workspace = "../../.." }

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml"

# --- [TY] -------------------------------------------------------------------------------

[tool.ty]
environment = { python-platform = "all" }                                                                                        # ty merges no parent table and takes `requires-python` from the table holder, so each 3.13 root states its own
rules       = { all = "error", unsound-assignment = "ignore", unsound-return = "ignore", unused-type-ignore-comment = "ignore" } # mypy infers the lambdas ty reads as `Unknown` in an annotated assignment or return, `no-any-return` owns `Any` returned, `unused-ignore` unused `type: ignore` comments
