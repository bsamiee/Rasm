# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-date
language: tsx
severity: error
ignores: ['.claude/plugins/**']
rule:
    any:
        - kind: new_expression
          all:
            - has: {field: constructor, regex: '^(globalThis\.)?Date$', matches: syntax-global-reference}
            - has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}
        - kind: call_expression
          has: {field: function, regex: '^(globalThis\.)?Date\.(parse|UTC)$', matches: syntax-global-reference}
message: The time value is built through the native Date
note: Construct DateTime values with DateTime.make at the boundary, and DateTime.unsafeMake for an input with established validity
