rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs", "prefer-post-quantum"] } # TLS stack with the process-wide aws-lc-rs provider each binary installs
sigstore = { version = "0.14.0", default-features = false, features = ["sign", "verify", "bundle", "rustls-tls"] } # Keyless signing and transparency-log verification
x509-parser = { version = "0.18.1", default-features = false, features = ["verify-aws"] } # X.509 certificate parsing and signature checks
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] } # X.509 certificates issued to loopback and test endpoints
rustls-platform-verifier = { version = "0.7.1", default-features = false } # Certificate verification through the OS trust store
# --- [AUTHENTICATION]
httpsig = { version = "0.0.26", default-features = false, features = ["rsa-signature"] } # HTTP message signatures
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] } # JWT signing and validation
openidconnect = { version = "4.0.1", default-features = false, features = ["timing-resistant-secret-traits"] } # OpenID Connect discovery, PKCE flows, and ID token validation
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "gen_secret", "zeroize"] } # One-time passwords and otpauth URLs
webauthn-rs = { version = "0.6.1-dev", default-features = false, features = ["attestation", "conditional-ui", "resident-key-support"] } # Passkey registration and authentication ceremonies
webbrowser = { version = "1.2.4", default-features = false } # Authorization URLs opened in the user's browser
# --- [SECRETS]
aws-config = { version = "1.12.0", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process", "sso", "behavior-version-latest"] } # AWS credential and region resolution
aws-sdk-kms = { version = "1.123.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] } # AWS KMS keys
azure_identity = { version = "1.1.0-beta.1", default-features = false, features = ["reqwest_rustls", "tokio"] } # Microsoft Entra ID credential chain
azure_security_keyvault_keys = { version = "1.0.1", default-features = false } # Azure Key Vault keys and cryptographic operations
azure_security_keyvault_secrets = { version = "1.0.1", default-features = false } # Azure Key Vault secrets
google-cloud-kms-v1 = { version = "1.15.0", default-features = false, features = ["default-rustls-provider"] } # Google Cloud KMS keys
google-cloud-secretmanager-v1 = { version = "1.14.0", default-features = false, features = ["default-rustls-provider"] } # Google Cloud Secret Manager secrets
keyring = { version = "4.2.0", default-features = false, features = ["v1"] } # OS keychain storage of OAuth tokens
secrecy = { version = "0.10.3", default-features = false, features = ["serde"] } # Secrets redacted from Debug output and zeroized on drop
vaultrs = { version = "0.8.0", default-features = false, features = ["rustls"] } # HashiCorp Vault secrets, transit, and PKI
# --- [HTTP]
headers = { version = "0.4.2", default-features = false } # Typed conditional, range, and entity-tag headers
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] } # Async DNS resolution with SRV lookups
progenitor = { version = "0.15.1", default-features = false } # Typed clients generated from OpenAPI documents
sfv = { version = "0.16.0", default-features = false, features = ["parsed-types"] } # HTTP structured field values
tower = { version = "0.5.3", default-features = false, features = ["util", "timeout", "limit", "load-shed"] } # Service and layer composition with timeouts, limits, and load shedding
tower-http = { version = "0.7.1", default-features = false, features = ["trace"] } # Request tracing layers on served routes
url = { version = "2.5.8", default-features = false, features = ["std", "serde"] } # WHATWG URLs parsed at boundaries
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] } # Server that mounts tower services on loopback ports
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream", "gzip", "zstd", "brotli", "charset", "system-proxy"] } # HTTP client with pooling, streaming, and decompression
aide = { version = "0.16.0-alpha.4", default-features = false, features = ["axum", "axum-json", "axum-query", "scalar"] } # OpenAPI documents derived from the same schemas as tool parameters
