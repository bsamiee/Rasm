# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-binding-for-equality
language: swift
severity: error
utils:
    binding:
        kind: pattern
        has: {kind: simple_identifier, pattern: $NAME}
        not: {has: {kind: pattern}}
    operand:
        not:
            any:
                - kind: 'disjunction_expression, conjunction_expression, equality_expression'
                - pattern: $NAME
                - has: {stopBy: end, kind: simple_identifier, pattern: $NAME}
    compared:
        kind: equality_expression
        all:
            - has: {field: op, regex: '^==$'}
            - any:
                - all:
                    - has: {field: lhs, pattern: $NAME}
                    - has: {field: rhs, pattern: $VALUE}
                - all:
                    - has: {field: rhs, pattern: $NAME}
                    - has: {field: lhs, pattern: $VALUE}
            - not: {has: {field: lhs, kind: 'disjunction_expression, conjunction_expression'}}
            - not: {has: {field: rhs, kind: 'disjunction_expression, conjunction_expression'}}
            - not: {has: {has: {stopBy: end, kind: simple_identifier, pattern: $NAME}}}
    compared-pair:
        kind: equality_expression
        all:
            - has: {field: op, regex: '^==$'}
            - has: {field: lhs, pattern: $NAME}
            - has:
                field: rhs
                kind: disjunction_expression
                all:
                    - has: {field: lhs, pattern: $FIRST, matches: operand}
                    - has:
                        field: rhs
                        kind: equality_expression
                        all:
                            - has: {field: op, regex: '^==$'}
                            - has: {field: lhs, pattern: $NAME}
                            - has: {field: rhs, pattern: $SECOND, matches: operand}
    declared-binding:
        matches: binding
        any:
            - has: {kind: value_binding_pattern}
            - follows: {stopBy: end, kind: value_binding_pattern}
    sole-binding:
        has: {kind: pattern, matches: declared-binding}
        not: {has: {kind: pattern, follows: {kind: pattern, stopBy: end}}}
    name-read:
        has: {stopBy: end, kind: simple_identifier, pattern: $NAME}
rule:
    any:
        - kind: switch_pattern
          all:
            - has:
                kind: pattern
                all:
                    - has:
                        kind: pattern
                        any:
                            - matches: binding
                            - all:
                                - has: {kind: value_binding_pattern}
                                - has: {kind: pattern, matches: binding}
                                - has: {field: name, kind: user_type}
                    - not: {has: {kind: pattern, follows: {kind: pattern, stopBy: end}}}
            - precedes: {kind: where_keyword}
            - any:
                - {pattern: $ALONE, precedes: {stopBy: end, matches: compared}}
                - {pattern: $PAIRED, precedes: {stopBy: end, matches: compared-pair}}
            - not: {precedes: {stopBy: end, kind: switch_pattern}}
            - not: {follows: {stopBy: end, kind: switch_pattern}}
            - not: {precedes: {stopBy: end, kind: statements, matches: name-read}}
        - kind: 'if_statement, guard_statement'
          regex: '^(if|guard)\s+case\b'
          pattern: $STATEMENT
          all:
            - matches: sole-binding
            - has: {kind: equality_expression, matches: compared}
            - not: {has: {pattern: $$_FIRST, regex: '^,$', precedes: {stopBy: end, pattern: $$_SECOND, regex: '^,$'}}}
            - not: {has: {stopBy: end, kind: statements, matches: name-read}}
            - not: {all: [{kind: guard_statement}, {precedes: {stopBy: end, any: [{kind: simple_identifier, pattern: $NAME}, {matches: name-read}]}}]}
        - kind: for_statement
          pattern: $STATEMENT
          all:
            - has: {field: item, regex: '^case\b', matches: sole-binding}
            - has: {kind: where_clause, has: {kind: equality_expression, matches: compared}}
            - not: {has: {kind: statements, matches: name-read}}
rewriters:
    - id: binding-to-value
      rule: {matches: binding}
      fix: $VALUE
    - id: dropped-condition
      rule: {any: [{kind: equality_expression, matches: compared}, {kind: where_clause, has: {kind: equality_expression, matches: compared}}]}
      fix: ''
    - id: binding-to-first
      rule: {matches: binding}
      fix: $FIRST
    - id: binding-to-second
      rule: {matches: binding}
      fix: $SECOND
transform:
    SINGLE: {rewrite: {source: $ALONE, rewriters: [binding-to-value]}}
    FIRST_CASE: {rewrite: {source: $PAIRED, rewriters: [binding-to-first]}}
    SECOND_CASE: {rewrite: {source: $PAIRED, rewriters: [binding-to-second]}}
    SINGLE_PATTERN: {replace: {source: $SINGLE, replace: '\blet\s+', by: ''}}
    FIRST_PATTERN: {replace: {source: $FIRST_CASE, replace: '\blet\s+', by: ''}}
    SECOND_PATTERN: {replace: {source: $SECOND_CASE, replace: '\blet\s+', by: ''}}
    SECOND_JOINED: {replace: {source: $SECOND_PATTERN, replace: '(?s)^(.+)$', by: ', $1'}}
    MATCHED: {rewrite: {source: $STATEMENT, rewriters: [binding-to-value, dropped-condition]}}
    UNBOUND: {replace: {source: $MATCHED, replace: '^((?:if|guard|for)\s+case)\s+let\s+', by: '$1 '}}
    CONDITION: {replace: {source: $UNBOUND, replace: '(?s)^(.*?)\s*,?\s*(\{|\belse\b)', by: '$1 $2'}}
fix:
    template: $SINGLE_PATTERN$FIRST_PATTERN$SECOND_JOINED$CONDITION
    expandEnd: {stopBy: end, follows: {stopBy: end, kind: where_keyword}, any: [{matches: compared}, {matches: compared-pair}]}
message: 'Case pattern binds `$NAME` only to compare it in a `where` clause or condition'
note: 'Match each value inside its pattern as `case .<case>(<value>):`, `if case .<case>(<value>) = <subject>`, or `case .<case>(.<code> as <ErrorType>):`, and `where <name> == <a> || <name> == <b>` as `case .<case>(<a>), .<case>(<b>):`'
