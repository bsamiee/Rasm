# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    any:
        - kind: new_expression
          all:
            - has: {field: constructor, pattern: $FORMATTER, regex: '^((globalThis|window|self)\.)?Intl\.[A-Z][^\x00-#%-/:-@\[-\^`{-~\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*$', matches: typescript-global-reference}
            - not: {has: {field: arguments, has: {pattern: $_, not: {matches: typescript-literal-expression}}}}
            - inside: {stopBy: end, kind: &boundary 'arrow_function, function_expression, function_declaration, generator_function, generator_function_declaration, method_definition'}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, pattern: $FORMATTER, has: {field: property, regex: '^(toLocaleString|toLocaleDateString|toLocaleTimeString)$'}}
            - has: {field: arguments, has: {nthChild: 1}}
            - not: {has: {field: arguments, has: {pattern: $_, not: {matches: typescript-literal-expression}}}}
            - inside: {stopBy: end, kind: *boundary}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, pattern: $FORMATTER, has: {field: property, regex: '^localeCompare$'}}
            - has: {field: arguments, has: {nthChild: 2}}
            - not: {has: {field: arguments, has: {nthChild: 'n+2', not: {matches: typescript-literal-expression}}}}
            - inside: {stopBy: end, kind: *boundary}
    not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
message: '`$FORMATTER` builds an `Intl` object from constant arguments at each call'
note: 'Build the `Intl` object once in a module `const` and call its `format` or `compare` inside the function'
