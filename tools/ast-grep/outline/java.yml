id: java-package
language: javalang
role: item
symbolType: package
rule:
    kind: package_declaration
    pattern: $DECLARATION
    has: {kind: 'scoped_identifier, identifier', pattern: $NAME}
transform:
    HEADER: {replace: {source: $DECLARATION, replace: ';\s*$', by: ''}}
name: $NAME
signature: $HEADER
isExported: false
---
id: java-import
language: javalang
role: item
symbolType: module
rule:
    kind: import_declaration
    pattern: $DECLARATION
    all:
        - has: {kind: 'identifier, scoped_identifier', pattern: $PATH}
        - any:
            - has: {kind: asterisk, pattern: $STAR}
            - not: {has: {kind: asterisk}}
transform:
    HEADER: {replace: {source: $DECLARATION, replace: ';\s*$', by: ''}}
    WILDCARD: {replace: {source: $STAR, replace: '^\*$', by: '.*'}}
name: $PATH$WILDCARD
signature: $HEADER
isImport: true
isExported: false
---
id: java-module
language: javalang
role: item
symbolType: module
rule:
    kind: module_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: module_body, inside: {kind: module_declaration, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:\s*;)?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: java-class
language: javalang
role: item
symbolType: class
rule:
    kind: class_declaration, record_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: 'class_declaration, record_declaration', field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:\s*;)?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - has: {kind: modifiers, has: {regex: '^(public|protected)$'}}
        - inside: {kind: 'interface_body, annotation_type_body'}
---
