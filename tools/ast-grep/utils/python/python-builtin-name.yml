# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-builtin-name
language: python
arguments: [name]
utils:
    implicit-module:
        matches: {python-builtin-identifier: {name: {regex: '^__builtins__$'}}}
    implicit-reference:
        any:
            - matches: implicit-module
            - matches: {python-assigned-name: {value: {matches: implicit-module}}}
rule:
    any:
        - matches: {python-builtin-identifier: {name: {matches: name}}}
        - matches: {python-member-use: {module: {regex: '^builtins$'}, name: {matches: name}}}
        - kind: attribute
          all:
            - has: {field: attribute, matches: name}
            - has: {field: object, matches: implicit-reference}
