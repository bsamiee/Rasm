# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-cursor-struct
language: rust
severity: error
utils:
    input-type:
        any:
            - kind: reference_type
              all:
                - not: {has: {kind: mutable_specifier}}
                - has: {field: type, any: [{kind: primitive_type, regex: '^str$'}, {kind: array_type, not: {has: {field: length, pattern: $_}}, has: {field: element, regex: '^(u8|char)$'}}]}
            - kind: generic_type
              regex: '^(Vec\s*<\s*(char|u8)\s*>|Box\s*<\s*(str|\[\s*(u8|char)\s*\])\s*>|(Arc|Rc)\s*<\s*(str|\[\s*u8\s*\])\s*>)$'
            - kind: type_identifier
              regex: '^String$'
    self-field:
        kind: field_expression
        all:
            - has: {field: value, kind: self}
            - has: {field: field, pattern: $POS}
    input-field:
        kind: field_expression
        all:
            - has: {field: value, kind: self}
            - has: {field: field, pattern: $INPUT}
    positioned-read:
        any:
            - kind: index_expression
              all:
                - has: {nthChild: 1, any: [{matches: input-field}, {has: {stopBy: end, matches: input-field}}]}
                - has: {nthChild: 2, any: [{matches: self-field}, {has: {stopBy: end, matches: self-field}}]}
            - kind: call_expression
              all:
                - has: {field: function, has: {stopBy: end, matches: input-field}}
                - has: {field: arguments, has: {stopBy: end, matches: self-field}}
rule:
    kind: struct_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, has: {kind: field_declaration, all: [{has: {field: name, pattern: $INPUT}}, {has: {field: type, matches: input-type}}]}}
        - has: {field: body, has: {kind: field_declaration, all: [{has: {field: name, pattern: $POS}}, {has: {field: type, kind: primitive_type, regex: '^usize$'}}]}}
        - inside:
            kind: source_file
            stopBy: end
            has:
                stopBy: end
                kind: impl_item
                all:
                    - has: {field: type, any: [{pattern: $NAME}, {kind: generic_type, has: {field: type, pattern: $NAME}}]}
                    - has: {field: body, has: {stopBy: end, kind: 'compound_assignment_expr, assignment_expression', has: {field: left, matches: self-field}}}
                    - has: {field: body, has: {stopBy: end, matches: positioned-read}}
message: '`$NAME` walks `$INPUT` by hand through index `$POS`'
note: 'Parse through a `winnow` stream (`&str`, `LocatingSlice` for spans, `Partial` for incremental input), and binary layouts through `binrw`'
