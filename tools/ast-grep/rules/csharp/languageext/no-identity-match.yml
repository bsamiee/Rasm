# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-identity-match
language: csharp
severity: error
utils:
    relay:
        kind: identifier
        not: {regex: '^identity$'}
        matches: csharp-identity-function
    relayed:
        has:
            field: arguments
            has:
                kind: argument
                any:
                    - matches: relay
                    - has: {matches: relay}
    identity-argument:
        kind: argument
        pattern: $IDENTITY_ARGUMENT
        any:
            - matches: csharp-identity-function
            - has: {matches: csharp-identity-function}
    positional:
        kind: argument
        not: {has: {field: name, pattern: $_}}
    fallback-argument:
        kind: argument
        not: {pattern: $IDENTITY_ARGUMENT}
        has: {nthChild: {position: 1, reverse: true}, pattern: $FALLBACK}
    empty-lambda:
        kind: lambda_expression
        has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
    literal-value:
        any:
            - kind: integer_literal, real_literal, string_literal, verbatim_string_literal, raw_string_literal, character_literal, boolean_literal, interpolated_string_expression
            - kind: prefix_unary_expression
              has: {kind: 'integer_literal, real_literal'}
    widening-value:
        any:
            - kind: integer_literal
              regex: '(?i)[ul]$'
            - kind: real_literal, cast_expression
            - kind: member_access_expression
              has: {field: expression, kind: predefined_type, not: {regex: '^int$'}}
            - kind: prefix_unary_expression, parenthesized_expression
              has: {matches: widening-value}
    widening-result:
        any:
            - matches: widening-value
            - has: {field: body, matches: widening-value}
            - has:
                field: body
                kind: block
                has: {kind: return_statement, has: {matches: widening-value}}
    typed-receiver:
        has: {field: function, has: {field: expression, pattern: $RECEIVER}}
    member-match:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^Match$'}}
            - matches: typed-receiver
            - has: {field: arguments, all: [{has: {kind: argument, nthChild: 2}}, {not: {has: {kind: argument, nthChild: 3}}}]}
    positional-match:
        matches: member-match
        not: {has: {field: arguments, has: {kind: argument, has: {field: name, pattern: $_}}}}
    shape:
        any:
            - all:
                - matches: member-match
                - has: {field: arguments, has: {matches: identity-argument, has: {field: name, regex: '^(Succ|Some|Right|Left)$', pattern: $IDENTITY_CASE}}}
                - has: {field: arguments, has: {matches: fallback-argument}}
            - all:
                - matches: member-match
                - has: {field: arguments, has: {matches: positional, all: [{matches: identity-argument}]}}
                - has: {field: arguments, has: {matches: fallback-argument, has: {field: name, regex: '^(Fail|None|Left|Right)$', pattern: $FALLBACK_CASE}}}
            - all:
                - matches: positional-match
                - has: {field: function, has: {field: name, pattern: $NONE_CASE}}
                - has: {field: arguments, has: {nthChild: 1, matches: identity-argument}}
                - has: {field: arguments, has: {nthChild: 2, matches: fallback-argument, has: {any: [{matches: empty-lambda}, {matches: literal-value}]}}}
            - all:
                - matches: positional-match
                - has: {field: function, has: {field: name, pattern: $FAIL_CASE}}
                - has: {field: arguments, has: {nthChild: 1, matches: identity-argument}}
                - has: {field: arguments, has: {nthChild: 2, matches: fallback-argument}}
                - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Try|IO)\s*<'}}}}}
            - all:
                - matches: positional-match
                - has: {field: function, has: {field: name, pattern: $FAIL_CASE}}
                - has: {field: arguments, has: {nthChild: 2, matches: identity-argument}}
                - has: {field: arguments, has: {nthChild: 1, matches: fallback-argument}}
                - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?Validation\s*<'}}}}}
            - all:
                - matches: positional-match
                - has: {field: function, has: {field: name, pattern: $RIGHT_CASE}}
                - has: {field: arguments, has: {nthChild: 1, matches: identity-argument}}
                - has: {field: arguments, has: {nthChild: 2, matches: fallback-argument}}
                - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?Either\s*<'}}}}}
            - all:
                - matches: positional-match
                - has: {field: function, has: {field: name, pattern: $LEFT_CASE}}
                - has: {field: arguments, has: {nthChild: 2, matches: identity-argument}}
                - has: {field: arguments, has: {nthChild: 1, matches: fallback-argument}}
                - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?Either\s*<'}}}}}
            - all:
                - kind: invocation_expression
                - has: {field: function, pattern: $CALLEE, regex: '^((global::)?(LanguageExt\.)?Prelude\.)?match$'}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 3}}, {not: {has: {kind: argument, nthChild: 4}}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: positional, has: {pattern: $INPUT}}}
                - any:
                    - has: {field: arguments, has: {matches: identity-argument, has: {field: name, regex: '^Some$'}}}
                    - all:
                        - has: {field: arguments, has: {nthChild: 2, matches: positional, all: [{matches: identity-argument}]}}
                        - has: {field: arguments, has: {nthChild: 3, any: [{has: {field: name, regex: '^None$'}}, {has: {matches: empty-lambda}}]}}
                - has: {field: arguments, has: {not: {nthChild: 1}, matches: fallback-argument}}
    match-call:
        any:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^Match$'}}
            - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\.)?match$'}
    kept-fallback:
        has:
            field: arguments
            has:
                kind: argument
                any:
                    - has: {kind: null_literal}
                    - has: {kind: lambda_expression, any: [{has: {field: body, kind: null_literal}}, {has: {field: type, pattern: $_}}]}
rule:
    kind: invocation_expression
    all:
        - matches: match-call
        - not: {matches: kept-fallback}
        - not:
            all:
                - has: {field: arguments, has: {kind: argument, has: {matches: widening-result}}}
                - not:
                    any:
                        - all:
                            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: integer_literal, regex: '(?i)^(0x[0-9a-f_]+|0b[01_]+|[0-9_]+)l$'}}}
                            - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Option|Validation|Try|IO)\s*<(.+,\s*)?((global::)?System\.)?(long|Int64|float|Single|double|Double|decimal|Decimal)\s*>$'}}}}}
                        - all:
                            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: integer_literal, regex: '(?i)^(0x[0-9a-f_]+|0b[01_]+|[0-9_]+)(ul|lu)$'}}}
                            - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Option|Validation|Try|IO)\s*<(.+,\s*)?((global::)?System\.)?(ulong|UInt64|float|Single|double|Double|decimal|Decimal)\s*>$'}}}}}
                        - all:
                            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: integer_literal, regex: '(?i)^(0x[0-9a-f_]+|0b[01_]+|[0-9_]+)u$'}}}
                            - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Option|Validation|Try|IO)\s*<(.+,\s*)?((global::)?System\.)?(uint|UInt32|long|Int64|ulong|UInt64|float|Single|double|Double|decimal|Decimal)\s*>$'}}}}}
                        - all:
                            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: real_literal, regex: '(?i)f$'}}}
                            - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Option|Validation|Try|IO)\s*<(.+,\s*)?((global::)?System\.)?(float|Single|double|Double)\s*>$'}}}}}
                        - all:
                            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: real_literal, regex: '(?i)m$'}}}
                            - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Option|Validation|Try|IO)\s*<(.+,\s*)?((global::)?System\.)?(decimal|Decimal)\s*>$'}}}}}
                        - all:
                            - has: {field: arguments, has: {kind: argument, has: {stopBy: end, kind: real_literal, not: {regex: '(?i)[fm]$'}}}}
                            - has: {field: function, has: {field: expression, matches: {csharp-declared-type: {type: {regex: '^((global::)?LanguageExt\.)?(Fin|Option|Validation|Try|IO)\s*<(.+,\s*)?((global::)?System\.)?(double|Double)\s*>$'}}}}}
        - any:
            - all:
                - not: {matches: relayed}
                - matches: shape
            - all:
                - matches: relayed
                - pattern: $HELD
                - not: {not: {matches: shape}}
transform:
    RECEIVER_DOT: {replace: {source: $RECEIVER, replace: '(?s)^(.*)$', by: '${1}.'}}
    SUCCESS_CASE: {replace: {source: $IDENTITY_CASE, replace: '^Succ$', by: 'IfFail'}}
    SOME_CASE: {replace: {source: $SUCCESS_CASE, replace: '^Some$', by: 'IfNone'}}
    RIGHT_IDENTITY: {replace: {source: $SOME_CASE, replace: '^Right$', by: 'IfLeft'}}
    IDENTITY_METHOD: {replace: {source: $RIGHT_IDENTITY, replace: '^Left$', by: 'IfRight'}}
    FALLBACK_METHOD: {replace: {source: $FALLBACK_CASE, replace: '^(.+)$', by: 'If${1}'}}
    NONE_METHOD: {replace: {source: $NONE_CASE, replace: '(?s)^.*$', by: 'IfNone'}}
    FAIL_METHOD: {replace: {source: $FAIL_CASE, replace: '(?s)^.*$', by: 'IfFail'}}
    RIGHT_METHOD: {replace: {source: $RIGHT_CASE, replace: '(?s)^.*$', by: 'IfRight'}}
    LEFT_METHOD: {replace: {source: $LEFT_CASE, replace: '(?s)^.*$', by: 'IfLeft'}}
    CALL: {replace: {source: $CALLEE, replace: 'match$', by: 'ifNone'}}
    FIRST: {replace: {source: $INPUT, replace: '(?s)^(.*)$', by: '${1}, '}}
    OPEN: {replace: {source: $FALLBACK, replace: '(?s)^(.*)$', by: '('}}
    CLOSE: {replace: {source: $FALLBACK, replace: '(?s)^(.*)$', by: ')'}}
fix: "$HELD$RECEIVER_DOT$IDENTITY_METHOD$FALLBACK_METHOD$NONE_METHOD$FAIL_METHOD$RIGHT_METHOD$LEFT_METHOD$CALL$OPEN$FIRST$FALLBACK$CLOSE"
message: "`Match` returns one case's value unchanged and handles the other case alone"
note: "Use `IfFail` on a `Fin`, `Validation`, `Try`, or `IO`, `IfNone` or prelude `ifNone` on an `Option`, and `IfLeft` or `IfRight` on an `Either`, each passes the unchanged case through"
