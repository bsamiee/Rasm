id: typescript-import
language: tsxlang
role: item
symbolType: module
utils:
    scope: {any: [{kind: 'program, ERROR'}, {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}}]}
    named: {pattern: $NAME}
    listed: {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, matches: named}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, matches: named}}]}}}
rule:
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
    kind: import_statement, import_alias
    pattern: $DECLARATION
    inside: {matches: scope, stopBy: {not: {kind: export_statement}}, any: [{kind: 'program, ERROR'}, {inside: {has: {field: name, pattern: $OWNER}}}]}
    any:
        - has: {field: source, pattern: $NAME}
        - has: {kind: import_require_clause, has: {field: source, pattern: $NAME}}
        - has: {kind: identifier, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $NAME}
rewriters:
    - id: lineage
      rule:
        kind: identifier, nested_identifier, string
        pattern: $LEVEL
        inside:
            kind: internal_module, module, ambient_declaration
            field: name
            any: [{inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {kind: 'internal_module, module, ambient_declaration', has: {field: name, pattern: $UP}}}}, {kind: 'internal_module, module, ambient_declaration'}]
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage]}}
    SPECIFIED: {replace: {source: $NAME, replace: '^["''`](.*)["''`]$', by: $1}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
name: $QUALIFIER$SPECIFIED
signature: $SIGNATURE
isImport: true
isExported: {any: [{inside: {kind: export_statement}}, {kind: import_alias, matches: listed}]}
---
id: typescript-export
language: tsxlang
role: item
symbolType: module
utils:
    scope: {any: [{kind: 'program, ERROR'}, {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}}]}
    owned: {any: [{kind: 'program, ERROR'}, {inside: {has: {field: name, pattern: $OWNER}}}]}
    binds:
        any:
            - {kind: 'class_declaration, abstract_class_declaration, function_declaration, generator_function_declaration, function_signature, interface_declaration, type_alias_declaration, enum_declaration, internal_module, module', has: {field: name, pattern: $NAME}}
            - {kind: 'lexical_declaration, variable_declaration, using_declaration', has: {kind: variable_declarator, has: {field: name, any: [{pattern: $NAME}, {has: {stopBy: end, kind: 'identifier, shorthand_property_identifier_pattern', pattern: $NAME}}]}}}
            - {kind: import_alias, has: {kind: identifier, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $NAME}}
    declared: {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {stopBy: {not: {kind: 'export_statement, ambient_declaration'}}, matches: binds}}}
rule:
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
    any:
        - kind: export_statement
          pattern: $DECLARATION
          inside: {matches: scope, all: [{matches: owned}]}
          any:
            - has: {field: source, pattern: $NAME}
            - all: [{has: {regex: '^default$', pattern: $$NAME}}, {has: {field: value, kind: identifier}}]
            - has: {kind: identifier, pattern: $NAME}
            - all: [{has: {regex: '^=$'}}, {has: {regex: '^export$', pattern: $$NAME}}]
        - kind: export_specifier
          pattern: $SPECIFIER
          inside:
            kind: export_clause
            inside:
                kind: export_statement
                not: {has: {field: source, pattern: $_}}
                inside: {matches: scope, all: [{matches: owned}]}
                any: [{has: {regex: '^type$', pattern: $$TYPE}}, {kind: export_statement}]
          any:
            - has: {field: alias, pattern: $NAME}
            - all: [{has: {field: name, pattern: $NAME}}, {not: {matches: declared}}]
rewriters:
    - id: lineage
      rule:
        kind: identifier, nested_identifier, string
        pattern: $LEVEL
        inside:
            kind: internal_module, module, ambient_declaration
            field: name
            any: [{inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {kind: 'internal_module, module, ambient_declaration', has: {field: name, pattern: $UP}}}}, {kind: 'internal_module, module, ambient_declaration'}]
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: block, rule: {kind: 'object, object_type, class_body, statement_block', regex: "\n"}, fix: '{…}'}
    - {id: list, rule: {kind: array, regex: "\n"}, fix: '[…]'}
    - {id: call, rule: {kind: arguments, regex: "\n", not: {has: {kind: object, regex: "\n"}}}, fix: (…)}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage]}}
    SPECIFIED: {replace: {source: $NAME, replace: '^["''`](.*)["''`]$', by: $1}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [block, list, call, comment]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    OPENING: {replace: {source: $SPECIFIER, replace: '(?s).+', by: 'export '}}
    TYPED: {replace: {source: $TYPE, replace: $, by: ' '}}
    CLAUSE: {replace: {source: $SPECIFIER, replace: '(?s)^(.*)$', by: '{ $1 }'}}
name: $QUALIFIER$SPECIFIED
signature: $OPENING$TYPED$CLAUSE$SIGNATURE
isExported: true
---
id: typescript-namespace
language: tsxlang
role: item
symbolType: namespace
utils:
    scope: {any: [{kind: 'program, ERROR'}, {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}}]}
    open: {any: [{has: {field: name, kind: string}}, {inside: {kind: export_statement, stopBy: {not: {kind: 'expression_statement, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {all: [{has: {field: name, pattern: $NS}}, {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, pattern: $NS}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, pattern: $NS}}]}}}]}]}
rule:
    kind: identifier, nested_identifier, string
    pattern: $NAME
    inside:
        kind: internal_module, module, ambient_declaration
        field: name
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}
            any: [{kind: 'program, ERROR'}, {inside: {has: {field: name, pattern: $OWNER}}}]
        all:
            - any: [{has: {regex: '^(?:namespace|module)$', pattern: $$KIND}}, {kind: ambient_declaration}]
            - any: [{inside: {kind: ambient_declaration, has: {regex: '^declare$', pattern: $$AMBIENT}}}, {has: {regex: '^declare$', pattern: $$AMBIENT}}, {kind: 'internal_module, module, ambient_declaration'}]
rewriters:
    - id: lineage
      rule:
        kind: identifier, nested_identifier, string
        pattern: $LEVEL
        inside:
            kind: internal_module, module, ambient_declaration
            field: name
            any: [{inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {kind: 'internal_module, module, ambient_declaration', has: {field: name, pattern: $UP}}}}, {kind: 'internal_module, module, ambient_declaration'}]
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage]}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
    DECLARED: {replace: {source: $AMBIENT, replace: $, by: ' '}}
name: $QUALIFIER$NAME
signature: $DECLARED$PREFIX$NAME
isExported: {not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}}
---
id: typescript-class
language: tsxlang
role: item
symbolType: class
utils:
    scope: {any: [{kind: 'program, ERROR'}, {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}}]}
    named: {pattern: $NAME}
    listed: {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, matches: named}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, matches: named}}]}}}
    open: {any: [{has: {field: name, kind: string}}, {inside: {kind: export_statement, stopBy: {not: {kind: 'expression_statement, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {all: [{has: {field: name, pattern: $NS}}, {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, pattern: $NS}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, pattern: $NS}}]}}}]}]}
    top: {inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}, any: [{kind: 'program, ERROR'}, {inside: {has: {field: name, pattern: $OWNER}}}]}}
    declaration: {matches: top, any: [{kind: lexical_declaration, has: {field: kind, pattern: $$KIND}}, {kind: variable_declaration, has: {regex: '^var$', pattern: $$KIND}}]}
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    typed: {any: [{has: {field: type, pattern: $TYPE}}, {regex: ''}]}
    form:
        all:
            - any: [{has: {field: decorator, matches: first, pattern: $FIRSTDECORATOR}}, {inside: {kind: export_statement, has: {field: decorator, matches: first, pattern: $FIRSTDECORATOR}}}, {regex: ''}]
            - any: [{has: {regex: '^abstract$', pattern: $$ABSTRACT}}, {regex: ''}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]
            - any: [{has: {kind: class_heritage, pattern: $HERITAGE}}, {regex: ''}]
    exported: {all: [{any: [{kind: export_statement}, {inside: {kind: export_statement, stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {matches: listed}]}, {not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}}]}
    value: {any: [{kind: class}, {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion', has: {matches: value}}]}
rule:
    any:
        - kind: export_statement
          matches: top
          all:
            - has: {field: decorator, kind: decorator}
            - has: {field: declaration, kind: 'class_declaration, abstract_class_declaration', has: {field: name, matches: named}}
        - {kind: 'class_declaration, abstract_class_declaration', matches: top, has: {field: name, matches: named}}
        - kind: lexical_declaration, variable_declaration
          matches: declaration
          not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}
          has: {kind: variable_declarator, all: [{has: {field: name, kind: identifier, matches: named}}, {has: {field: value, matches: value}}]}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, matches: named}
            - inside: {matches: declaration}
            - has: {field: value, matches: value}
        - kind: export_statement
          all:
            - has: {regex: '^default$', pattern: $$NAME}
            - matches: top
            - any: [{has: {field: value, matches: value}}, {has: {field: declaration, kind: abstract_class_declaration, not: {has: {field: name, kind: type_identifier}}}}]
rewriters:
    - id: lineage
      rule:
        kind: identifier, nested_identifier, string
        pattern: $LEVEL
        inside:
            kind: internal_module, module, ambient_declaration
            field: name
            any: [{inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {kind: 'internal_module, module, ambient_declaration', has: {field: name, pattern: $UP}}}}, {kind: 'internal_module, module, ambient_declaration'}]
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: call, rule: {kind: arguments, regex: "\n", not: {has: {kind: object}}}, fix: (…)}
    - {id: object, rule: {kind: object, has: {kind: 'pair, spread_element, method_definition, shorthand_property_identifier'}}, fix: '{…}'}
    - {id: shape, rule: {kind: object_type, regex: "\n"}, fix: '{…}'}
    - id: decorators
      rule: {kind: decorator, pattern: $DECORATOR, any: [{precedes: {kind: decorator, pattern: $NEXT}}, {regex: ''}]}
      transform:
        ONE: {rewrite: {source: $DECORATOR, rewriters: [call, comment]}}
        REST: {rewrite: {source: $NEXT, rewriters: [decorators]}}
      fix: $ONE $REST
    - id: declared
      rule: {kind: type_identifier, inside: {kind: 'class_declaration, abstract_class_declaration', field: name, matches: form}}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        EXTENDED: {rewrite: {source: $HERITAGE, rewriters: [object, shape, call, comment]}}
      fix: $DECORATED$ABSTRACTEDclass $NAME$GENERICS $EXTENDED
    - {id: body, rule: {kind: class_body, inside: {kind: class, field: body}}, fix: '{…}'}
    - id: assigned
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, kind: class, matches: form}}]}}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        EXTENDED: {rewrite: {source: $HERITAGE, rewriters: [object, shape, call, comment]}}
      fix: $NAME$TYPE = $DECORATEDclass$GENERICS $EXTENDED
    - id: wrapped
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, pattern: $VALUE}}]}}
      transform: {SHOWN: {rewrite: {source: $VALUE, rewriters: [body, object, shape, call, comment]}}}
      fix: $NAME$TYPE = $SHOWN
    - id: default-class
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, kind: class, matches: form}}}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        EXTENDED: {rewrite: {source: $HERITAGE, rewriters: [object, shape, call, comment]}}
      fix: export default $DECORATEDclass$GENERICS $EXTENDED
    - id: default-abstract
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: declaration, kind: abstract_class_declaration, matches: form}}}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        EXTENDED: {rewrite: {source: $HERITAGE, rewriters: [object, shape, call, comment]}}
      fix: export default $DECORATED$ABSTRACTEDclass$GENERICS $EXTENDED
    - id: default-wrapped
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, pattern: $VALUE}}}
      transform: {SHOWN: {rewrite: {source: $VALUE, rewriters: [body, object, shape, call, comment]}}}
      fix: export default $SHOWN
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
    HEADER: {rewrite: {source: $NAME, rewriters: [declared, assigned, wrapped, default-class, default-abstract, default-wrapped]}}
name: $QUALIFIER$NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-function
language: tsxlang
role: item
symbolType: function
utils:
    scope: {any: [{kind: 'program, ERROR'}, {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}}]}
    named: {pattern: $NAME}
    listed: {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, matches: named}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, matches: named}}]}}}
    open: {any: [{has: {field: name, kind: string}}, {inside: {kind: export_statement, stopBy: {not: {kind: 'expression_statement, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {all: [{has: {field: name, pattern: $NS}}, {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, pattern: $NS}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, pattern: $NS}}]}}}]}]}
    top: {inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}, any: [{kind: 'program, ERROR'}, {inside: {has: {field: name, pattern: $OWNER}}}]}}
    declaration: {matches: top, any: [{kind: lexical_declaration, has: {field: kind, pattern: $$KIND}}, {kind: variable_declaration, has: {regex: '^var$', pattern: $$KIND}}]}
    value:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              all:
                - has: {field: function, any: [{matches: effect-function}, {kind: call_expression, has: {field: function, matches: effect-function}}]}
                - has: {field: arguments, has: {matches: first, kind: 'arrow_function, function_expression, generator_function, identifier, member_expression, call_expression'}}
            - {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion', has: {matches: value}}
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    typed: {any: [{has: {field: type, pattern: $TYPE}}, {regex: ''}]}
    exported: {all: [{any: [{kind: export_statement}, {inside: {kind: export_statement, stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {matches: listed}]}, {not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}}]}
    fn: {regex: '^fn(?:Untraced(?:Eager)?)?$'}
    effect-function: {any: [{kind: identifier, matches: fn}, {kind: member_expression, has: {field: property, matches: fn}}]}
    parts:
        all:
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {regex: ''}]
            - any: [{has: {regex: '^\*$', pattern: $$STAR}}, {regex: ''}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {regex: ''}]
    after: {any: [{has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, pattern: $SECOND}}, {regex: ''}]}
    later: {all: [{any: [{has: {nthChild: {position: 3, ofRule: {not: {kind: comment}}}, pattern: $THIRD}}, {regex: ''}]}, {any: [{has: {nthChild: {position: 4, ofRule: {not: {kind: comment}}}, pattern: $FOURTH}}, {regex: ''}]}, {any: [{has: {nthChild: {position: 5, ofRule: {not: {kind: comment}}}, pattern: $FIFTH}}, {regex: ''}]}]}
    called: {kind: call_expression, all: [{has: {field: function, pattern: $CALLEE}}, {has: {field: arguments, all: [{matches: after}, {matches: later}]}}]}
    owned-value: {any: [{inside: {kind: 'variable_declarator, export_statement, extends_clause, public_field_definition, pair', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}, {inside: {kind: assignment_expression, field: right, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}, {inside: {kind: export_statement, has: {regex: '^=$'}, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}]}
    chained: {kind: call_expression, any: [{matches: owned-value}, {inside: {kind: member_expression, field: object, inside: {kind: call_expression, field: function, matches: chained}}}]}
    chain-root: {kind: call_expression, not: {has: {field: function, kind: member_expression, any: [{has: {field: object, kind: call_expression}}, {has: {field: property, regex: '^(?:annotate|annotateKey|check|pipe|rebuild)$'}}]}}, matches: chained}
    owned-object: {kind: object, any: [{matches: owned-value}, {inside: {kind: arguments, inside: {matches: chain-root}}}], not: {inside: {kind: statement_block, stopBy: end, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}}
    group: {any: [{kind: identifier, regex: '^(?:describe|describeWrapped|suite|layer|test|it)$'}, {kind: member_expression, has: {field: object, matches: group}}, {kind: call_expression, has: {field: function, matches: group}}]}
    runner: {kind: identifier, pattern: $RUNNER, inside: {kind: 'arrow_function, function_expression', stopBy: end, any: [{has: {field: parameter, pattern: $RUNNER}}, {has: {field: parameters, has: {kind: required_parameter, matches: first, has: {field: pattern, pattern: $RUNNER}}}}]}}
    case: {any: [{matches: group}, {matches: runner}, {kind: member_expression, has: {field: object, matches: case}}, {kind: call_expression, has: {field: function, matches: case}}]}
    owning:
        any:
            - has: {stopBy: end, any: [{kind: 'ERROR, function_declaration, generator_function_declaration, function_signature, class_declaration, abstract_class_declaration, class, interface_declaration, type_alias_declaration'}, {regex: '^$'}, {kind: 'arguments > :is(arrow_function, function_expression) > statement_block > expression_statement > call_expression', has: {field: function, matches: case}}]}
            - has: {stopBy: {kind: statement_block}, matches: owned-object}
    leaf: {not: {matches: owning}}
rule:
    all:
        - any:
            - {kind: 'function_declaration, generator_function_declaration, function_signature', matches: top, has: {field: name, matches: named}}
            - kind: lexical_declaration, variable_declaration
              matches: declaration
              not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}
              has: {kind: variable_declarator, all: [{has: {field: name, kind: identifier, matches: named}}, {has: {field: value, matches: value}}]}
            - kind: variable_declarator
              all:
                - inside: {matches: declaration}
                - has: {field: name, kind: identifier, matches: named}
                - has: {field: value, matches: value}
            - kind: export_statement
              all:
                - has: {regex: '^default$', pattern: $$NAME}
                - matches: top
                - has: {field: value, matches: value}
        - matches: leaf
rewriters:
    - id: lineage
      rule:
        kind: identifier, nested_identifier, string
        pattern: $LEVEL
        inside:
            kind: internal_module, module, ambient_declaration
            field: name
            any: [{inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {kind: 'internal_module, module, ambient_declaration', has: {field: name, pattern: $UP}}}}, {kind: 'internal_module, module, ambient_declaration'}]
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: call, rule: {kind: arguments, regex: "\n"}, fix: (…)}
    - id: declared
      rule: {kind: identifier, inside: {kind: 'function_declaration, generator_function_declaration, function_signature', field: name, matches: parts}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIERfunction$STAR $NAME$GENERICS$ARGUMENTS$RESULT
    - id: wrapped
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, pattern: $VALUE}}]}}
      transform:
        SHOWN: {rewrite: {source: $VALUE, rewriters: [step, opened, call, comment]}}
      fix: $NAME$TYPE = $SHOWN
    - id: default-wrapped
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, pattern: $VALUE}}}
      transform:
        SHOWN: {rewrite: {source: $VALUE, rewriters: [step, opened, call, comment]}}
      fix: export default $SHOWN
    - id: initializer
      rule: {kind: 'required_parameter, optional_parameter', all: [{has: {field: value, regex: ''}}, {has: {field: pattern, pattern: $BOUND}}, {any: [{has: {kind: accessibility_modifier, pattern: $PACCESS}}, {regex: ''}]}, {any: [{has: {kind: override_modifier, pattern: $POVERRIDE}}, {regex: ''}]}, {any: [{has: {regex: '^readonly$', pattern: $$PREADONLY}}, {regex: ''}]}, {any: [{has: {field: type, pattern: $PTYPE}}, {regex: ''}]}]}
      transform:
        PACCESSED: {replace: {source: $PACCESS, replace: $, by: ' '}}
        POVERRIDDEN: {replace: {source: $POVERRIDE, replace: $, by: ' '}}
        PREAD: {replace: {source: $PREADONLY, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $BOUND, rewriters: [nested, comment]}}
      fix: $PACCESSED$POVERRIDDEN$PREAD$SHAPED$PTYPE = …
    - {id: nested, rule: {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, pattern: $LEFT}}, transform: {LEFTED: {rewrite: {source: $LEFT, rewriters: [nested]}}}, fix: '$LEFTED = …'}
    - id: lambda
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, kind: arrow_function, matches: parts}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $NAME$TYPE = $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - id: expressed
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, kind: 'function_expression, generator_function', matches: parts}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $NAME$TYPE = $MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT {…}
    - id: called-function
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, matches: called, has: {field: arguments, has: {kind: 'function_expression, generator_function', all: [{matches: first}, {matches: parts}]}}}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
        CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}
        STEP2: {rewrite: {source: $SECOND, rewriters: [step, call, comment]}}
        STEP3: {rewrite: {source: $THIRD, rewriters: [step, call, comment]}}
        STEP4: {rewrite: {source: $FOURTH, rewriters: [step, call, comment]}}
        TRAIL2: {replace: {source: $STEP2, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL3: {replace: {source: $STEP3, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL4: {replace: {source: $STEP4, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL5: {replace: {source: $FIFTH, replace: '(?s).+', by: ', …'}}
      fix: $NAME$TYPE = $CALLED($MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT {…}$TRAIL2$TRAIL3$TRAIL4$TRAIL5)
    - id: called-arrow
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, matches: called, has: {field: arguments, has: {kind: arrow_function, all: [{matches: first}, {matches: parts}]}}}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
        CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}
        STEP2: {rewrite: {source: $SECOND, rewriters: [step, call, comment]}}
        STEP3: {rewrite: {source: $THIRD, rewriters: [step, call, comment]}}
        STEP4: {rewrite: {source: $FOURTH, rewriters: [step, call, comment]}}
        TRAIL2: {replace: {source: $STEP2, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL3: {replace: {source: $STEP3, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL4: {replace: {source: $STEP4, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL5: {replace: {source: $FIFTH, replace: '(?s).+', by: ', …'}}
      fix: $NAME$TYPE = $CALLED($MODIFIER$GENERICS$ARGUMENTS$RESULT => …$TRAIL2$TRAIL3$TRAIL4$TRAIL5)
    - id: called-reference
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, matches: called}}]}}
      transform: {CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}}
      fix: $NAME$TYPE = $CALLED(…)
    - id: step
      rule: {kind: arrow_function, matches: parts}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - {id: opened, rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}, fix: '{…}'}
    - id: default-function
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, kind: 'function_expression, generator_function', matches: parts}}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: export default $MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT
    - id: default-arrow
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, kind: arrow_function, matches: parts}}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: export default $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - id: default-called
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, matches: called}}}
      transform: {CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}}
      fix: export default $CALLED(…)
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage]}}
    HEADER: {rewrite: {source: $NAME, rewriters: [declared, lambda, expressed, called-function, called-arrow, called-reference, wrapped, default-function, default-arrow, default-called, default-wrapped]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
name: $QUALIFIER$NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-function-owner
language: tsxlang
role: item
symbolType: function
utils:
    scope: {any: [{kind: 'program, ERROR'}, {kind: statement_block, inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}}]}
    named: {pattern: $NAME}
    listed: {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, matches: named}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, matches: named}}]}}}
    open: {any: [{has: {field: name, kind: string}}, {inside: {kind: export_statement, stopBy: {not: {kind: 'expression_statement, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {all: [{has: {field: name, pattern: $NS}}, {inside: {kind: 'program, ERROR, statement_block', stopBy: {kind: 'program, ERROR, statement_block'}, has: {kind: export_statement, any: [{has: {kind: export_clause, has: {kind: export_specifier, not: {has: {field: alias, pattern: $_}}, has: {field: name, pattern: $NS}}}, not: {has: {field: source, pattern: $_}}}, {has: {kind: identifier, pattern: $NS}}]}}}]}]}
    top: {inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration'}}, any: [{kind: 'program, ERROR'}, {inside: {has: {field: name, pattern: $OWNER}}}]}}
    declaration: {matches: top, any: [{kind: lexical_declaration, has: {field: kind, pattern: $$KIND}}, {kind: variable_declaration, has: {regex: '^var$', pattern: $$KIND}}]}
    value:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              all:
                - has: {field: function, any: [{matches: effect-function}, {kind: call_expression, has: {field: function, matches: effect-function}}]}
                - has: {field: arguments, has: {matches: first, kind: 'arrow_function, function_expression, generator_function, identifier, member_expression, call_expression'}}
            - {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion', has: {matches: value}}
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    typed: {any: [{has: {field: type, pattern: $TYPE}}, {regex: ''}]}
    exported: {all: [{any: [{kind: export_statement}, {inside: {kind: export_statement, stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, ambient_declaration'}}}}, {inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}}, {matches: listed}]}, {not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}}]}
    fn: {regex: '^fn(?:Untraced(?:Eager)?)?$'}
    effect-function: {any: [{kind: identifier, matches: fn}, {kind: member_expression, has: {field: property, matches: fn}}]}
    parts:
        all:
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {regex: ''}]
            - any: [{has: {regex: '^\*$', pattern: $$STAR}}, {regex: ''}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {regex: ''}]
    after: {any: [{has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, pattern: $SECOND}}, {regex: ''}]}
    later: {all: [{any: [{has: {nthChild: {position: 3, ofRule: {not: {kind: comment}}}, pattern: $THIRD}}, {regex: ''}]}, {any: [{has: {nthChild: {position: 4, ofRule: {not: {kind: comment}}}, pattern: $FOURTH}}, {regex: ''}]}, {any: [{has: {nthChild: {position: 5, ofRule: {not: {kind: comment}}}, pattern: $FIFTH}}, {regex: ''}]}]}
    called: {kind: call_expression, all: [{has: {field: function, pattern: $CALLEE}}, {has: {field: arguments, all: [{matches: after}, {matches: later}]}}]}
rule:
    any:
        - {kind: 'function_declaration, generator_function_declaration, function_signature', matches: top, has: {field: name, matches: named}}
        - kind: lexical_declaration, variable_declaration
          matches: declaration
          not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}
          has: {kind: variable_declarator, all: [{has: {field: name, kind: identifier, matches: named}}, {has: {field: value, matches: value}}]}
        - kind: variable_declarator
          all:
            - inside: {matches: declaration}
            - has: {field: name, kind: identifier, matches: named}
            - has: {field: value, matches: value}
        - kind: export_statement
          all:
            - has: {regex: '^default$', pattern: $$NAME}
            - matches: top
            - has: {field: value, matches: value}
rewriters:
    - id: lineage
      rule:
        kind: identifier, nested_identifier, string
        pattern: $LEVEL
        inside:
            kind: internal_module, module, ambient_declaration
            field: name
            any: [{inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {kind: 'internal_module, module, ambient_declaration', has: {field: name, pattern: $UP}}}}, {kind: 'internal_module, module, ambient_declaration'}]
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: call, rule: {kind: arguments, regex: "\n"}, fix: (…)}
    - id: declared
      rule: {kind: identifier, inside: {kind: 'function_declaration, generator_function_declaration, function_signature', field: name, matches: parts}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIERfunction$STAR $NAME$GENERICS$ARGUMENTS$RESULT
    - id: wrapped
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, pattern: $VALUE}}]}}
      transform:
        SHOWN: {rewrite: {source: $VALUE, rewriters: [step, opened, call, comment]}}
      fix: $NAME$TYPE = $SHOWN
    - id: default-wrapped
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, pattern: $VALUE}}}
      transform:
        SHOWN: {rewrite: {source: $VALUE, rewriters: [step, opened, call, comment]}}
      fix: export default $SHOWN
    - id: initializer
      rule: {kind: 'required_parameter, optional_parameter', all: [{has: {field: value, regex: ''}}, {has: {field: pattern, pattern: $BOUND}}, {any: [{has: {kind: accessibility_modifier, pattern: $PACCESS}}, {regex: ''}]}, {any: [{has: {kind: override_modifier, pattern: $POVERRIDE}}, {regex: ''}]}, {any: [{has: {regex: '^readonly$', pattern: $$PREADONLY}}, {regex: ''}]}, {any: [{has: {field: type, pattern: $PTYPE}}, {regex: ''}]}]}
      transform:
        PACCESSED: {replace: {source: $PACCESS, replace: $, by: ' '}}
        POVERRIDDEN: {replace: {source: $POVERRIDE, replace: $, by: ' '}}
        PREAD: {replace: {source: $PREADONLY, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $BOUND, rewriters: [nested, comment]}}
      fix: $PACCESSED$POVERRIDDEN$PREAD$SHAPED$PTYPE = …
    - {id: nested, rule: {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, pattern: $LEFT}}, transform: {LEFTED: {rewrite: {source: $LEFT, rewriters: [nested]}}}, fix: '$LEFTED = …'}
    - id: lambda
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, kind: arrow_function, matches: parts}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $NAME$TYPE = $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - id: expressed
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, kind: 'function_expression, generator_function', matches: parts}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $NAME$TYPE = $MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT {…}
    - id: called-function
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, matches: called, has: {field: arguments, has: {kind: 'function_expression, generator_function', all: [{matches: first}, {matches: parts}]}}}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
        CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}
        STEP2: {rewrite: {source: $SECOND, rewriters: [step, call, comment]}}
        STEP3: {rewrite: {source: $THIRD, rewriters: [step, call, comment]}}
        STEP4: {rewrite: {source: $FOURTH, rewriters: [step, call, comment]}}
        TRAIL2: {replace: {source: $STEP2, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL3: {replace: {source: $STEP3, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL4: {replace: {source: $STEP4, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL5: {replace: {source: $FIFTH, replace: '(?s).+', by: ', …'}}
      fix: $NAME$TYPE = $CALLED($MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT {…}$TRAIL2$TRAIL3$TRAIL4$TRAIL5)
    - id: called-arrow
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, matches: called, has: {field: arguments, has: {kind: arrow_function, all: [{matches: first}, {matches: parts}]}}}}]}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
        CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}
        STEP2: {rewrite: {source: $SECOND, rewriters: [step, call, comment]}}
        STEP3: {rewrite: {source: $THIRD, rewriters: [step, call, comment]}}
        STEP4: {rewrite: {source: $FOURTH, rewriters: [step, call, comment]}}
        TRAIL2: {replace: {source: $STEP2, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL3: {replace: {source: $STEP3, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL4: {replace: {source: $STEP4, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL5: {replace: {source: $FIFTH, replace: '(?s).+', by: ', …'}}
      fix: $NAME$TYPE = $CALLED($MODIFIER$GENERICS$ARGUMENTS$RESULT => …$TRAIL2$TRAIL3$TRAIL4$TRAIL5)
    - id: called-reference
      rule: {kind: identifier, inside: {kind: variable_declarator, field: name, all: [{matches: typed}, {has: {field: value, matches: called}}]}}
      transform: {CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}}
      fix: $NAME$TYPE = $CALLED(…)
    - id: step
      rule: {kind: arrow_function, matches: parts}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - {id: opened, rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}, fix: '{…}'}
    - id: default-function
      rule: {regex: '^default$', inside: {kind: export_statement, has: {field: value, kind: 'function_expression, generator_function', matches: parts}}}
