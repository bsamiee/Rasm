# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-expansion-in-sql-literal
language: bash
severity: error
rule:
    kind: string
    all:
        - has: {kind: 'simple_expansion, expansion, command_substitution'}
        - regex: '^"(?:[^'']*''[^'']*'')*[^'']*''[^'']*\$(\{|\(|[A-Za-z_])'
        - not: {regex: '^"\s*(\.param\s|(?i:set\s+variable\s))'}
        - inside:
            kind: command
            stopBy: {kind: command}
            has: {field: name, pattern: $CLI, regex: '^(?:\S+/)?(sqlite3|duckdb|psql)$'}
message: '`$CLI` receives a shell expansion spliced into a single-quoted SQL literal'
note: Bind the value as a named parameter of the CLI and read the parameter in the SQL
