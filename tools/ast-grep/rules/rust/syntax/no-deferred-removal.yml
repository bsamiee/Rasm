# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    any:
        - kind: attribute
          pattern: $MARK
          any:
            - has: {nthChild: 1, pattern: deprecated}
            - all:
                - has: {nthChild: 1, pattern: cfg_attr}
                - has: {field: arguments, has: {pattern: deprecated, follows: {regex: '^,$'}}}
            - all:
                - has: {nthChild: 1, kind: identifier, regex: '^cfg(_attr)?$'}
                - has: {field: arguments, regex: '^\(\p{Pattern_White_Space}*(any\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*\)|false|not\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*all\p{Pattern_White_Space}*\(\p{Pattern_White_Space}*\)\p{Pattern_White_Space}*\))\p{Pattern_White_Space}*[,)]'}
        - kind: 'function_item, struct_item, enum_item, union_item, const_item, static_item, type_item, trait_item, trait_alias, mod_item, macro_definition'
          has: {field: name, regex: '^_\p{XID_Continue}', pattern: $MARK}
          not: {has: {kind: visibility_modifier, regex: '^pub$'}}
message: '`$MARK` keeps an item in place of finishing its removal'
note: 'Delete the item and move each consumer to its replacement in one change'
