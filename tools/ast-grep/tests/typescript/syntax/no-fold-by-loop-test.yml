id: no-fold-by-loop
valid:
    # The fold as one reduce
    - 'const sum = (items) => { return items.reduce((total, item) => total + item, 0); };'
    # Second statement in the body, the loop does more than fold
    - 'const sum = (items) => { let total = 0; for (const item of items) { total += item; count += 1; } return total; };'
    # Declaration not directly before the loop
    - 'const sum = (items) => { let total = 0; const base = 1; for (const item of items) { total += item; } return total; };'
    # Statement other than the return after the loop
    - 'const sum = (items) => { let total = 0; for (const item of items) { total += item; } log(total); return total; };'
    # Step into another binding
    - 'const sum = (items) => { let total = 0; for (const item of items) { count += item; } return total; };'
    # Return of a member, the accumulator leaves the function transformed
    - 'const sum = (items) => { let total = 0; for (const item of items) { total += item; } return total.value; };'
    # Const declaration, the loop reassigns nothing it declares
    - 'const sum = (items) => { const total = 0; for (const item of items) { total += item; } return total; };'
    # Typed declarator, the template drops the annotation
    - 'const sum = (items) => { let total: number = 0; for (const item of items) { total += item; } return total; };'
    # Second declarator beside the accumulator
    - 'const sum = (items) => { let total = 0, count = 1; for (const item of items) { total += item; } return total; };'
    # Loop over keys with in
    - 'const sum = (items) => { let total = 0; for (const key in items) { total += items[key]; } return total; };'
    # While loop
    - 'const sum = (items) => { let total = 0; while (items.length > 0) { total += items.pop(); } return total; };'
    # Loop inside a nested function, its return belongs to that function and the declaration sits outside it
    - 'const sum = (items) => { let total = 0; const run = () => { for (const item of items) { total += item; } return total; }; return run(); };'
    # Await in the step, the reduce callback is synchronous
    - 'const sum = async (items) => { let total = 0; for (const item of items) { total = await add(total, item); } return total; };'
    # Async iteration, an async iterable has no reduce
    - 'const sum = async (items) => { let total = 0; for await (const item of items) { total += item; } return total; };'
    # Await nested in a call in the step, the guard walks the whole step
    - 'const sum = async (items) => { let total = 0; for (const item of items) { total = add(total, await load(item)); } return total; };'
    # Loop variable declared outside the loop, the loop assigns it
    - 'const sum = (items) => { let total = 0; for (item of items) { total += item; } return total; };'
    # Var as the loop declaration, its binding outlives the loop
    - 'const sum = (items) => { let total = 0; for (var item of items) { total += item; } return total; };'
    # Comment beside the step, the fix drops it
    - 'const sum = (items) => { let total = 0; for (const item of items) { /* add */ total += item; } return total; };'
    # Comment between the declaration and the loop, the fix drops it
    - 'const sum = (items) => { let total = 0; /* start */ for (const item of items) { total += item; } return total; };'
    # Comment between the loop and the return, the fix drops it
    - 'const sum = (items) => { let total = 0; for (const item of items) { total += item; } /* done */ return total; };'
    # Step under a condition, the callback needs a ternary
    - 'const sum = (items) => { let total = 0; for (const item of items) { if (item) total += item; } return total; };'
    # Member as the accumulator
    - 'const sum = (items) => { let total = 0; for (const item of items) { this.total += item; } return total; };'
    # Return of another binding
    - 'const sum = (items) => { let total = 0; for (const item of items) { total += item; } return count; };'
    # Declaration without an initializer, an undefined start value fails the reduce overloads under the type checker
    - 'const first = (items) => { let found; for (const item of items) found ??= item; return found; };'
    # Push of two elements per item, neither map nor flatMap writes two, no-array-mutation reports the push
    - 'const pairs = (items) => { const out = []; for (const item of items) { out.push(item, item); } return out; };'
    # Push into a seeded array, the seed keeps its place ahead of the mapped elements
    - 'const names = (items) => { const out = [first]; for (const item of items) { out.push(item.name); } return out; };'
    # Push into a member, no declaration before the loop starts it
    - 'const names = (items) => { for (const item of items) { this.out.push(item.name); } return this.out; };'
    # Push under a condition, the callback needs a filter
    - 'const names = (items) => { const out = []; for (const item of items) { if (item.live) out.push(item.name); } return out; };'
    # Push with an await in the element, the map callback is synchronous
    - 'const names = async (items) => { const out = []; for (const item of items) { out.push(await load(item)); } return out; };'
    # The map the push rewrites to
    - 'const names = (items) => { return items.map((item) => item.name); };'
    # Unshift per item, the order reverses and no map writes it
    - 'const names = (items) => { const out = []; for (const item of items) { out.unshift(item.name); } return out; };'
    # Push beside a second statement in the block, the loop does more than map
    - 'const names = (items) => { const out = []; for (const item of items) { out.push(item.name); count += 1; } return out; };'
    # Second declarator beside the empty array
    - 'const names = (items) => { const out = [], count = 0; for (const item of items) { out.push(item.name); } return out; };'
    # Push onto a PascalCase binding, a module under the guard no-array-mutation shares
    - 'const names = (items) => { const Out = []; for (const item of items) { Out.push(item.name); } return Out; };'
invalid:
    # The instance, a destructured item folded through a plain assignment
    - |
      const redact = (text: string): string => {
          let redacted = text;
          for (const [id, value] of secrets) {
              redacted = redacted.replaceAll(value, id);
          }
          return redacted;
      };
    # Compound step as a bare body
    - 'const sum = (items) => { let total = 0; for (const item of items) total += item; return total; };'
    # Compound step in a block
    - 'const sum = (items) => { let total = 0; for (const item of items) { total *= item; } return total; };'
    # Plain assignment as a bare body
    - 'const last = (items) => { let held = null; for (const item of items) held = item; return held; };'
    # Object literal as the step, the callback body takes parentheses or parses as a block
    - 'const index = (items) => { let byId = {}; for (const item of items) { byId = { ...byId, [item.id]: item }; } return byId; };'
    # Await as the iterated expression, the member access binds inside the await without parentheses
    - 'const sum = async () => { let total = 0; for (const item of await load()) { total += item; } return total; };'
    # Logical expression as the iterated expression, the member access binds to its right operand without parentheses
    - 'const sum = (items, fallback) => { let total = 0; for (const item of items || fallback) { total += item; } return total; };'
    # Exponent step, the regex keeps the two-character operator
    - 'const product = (items) => { let total = 1; for (const item of items) { total **= item; } return total; };'
    # Push of one element per item into the empty array, a map
    - 'const names = (items) => { const out = []; for (const item of items) { out.push(item.name); } return out; };'
    # Push as a bare body
    - 'const names = (items) => { const out = []; for (const item of items) out.push(item.name); return out; };'
    # Push of a spread per item, a flatMap
    - 'const parts = (items) => { const out = []; for (const item of items) { out.push(...item.parts); } return out; };'
    # Push into a let, the binding form changes nothing
    - 'const names = (items) => { let out = []; for (const item of items) { out.push(item.name); } return out; };'
    # Push into an annotated empty array, the annotation names the element type the map infers
    - 'const names = (items: readonly Item[]): string[] => { const out: string[] = []; for (const item of items) { out.push(item.name); } return out; };'
    # Push of an object literal, the callback body takes parentheses
    - 'const rows = (items) => { const out = []; for (const item of items) { out.push({ id: item.id }); } return out; };'
    # Push of the destructured item
    - 'const ids = (pairs) => { const out = []; for (const [id] of pairs) { out.push(id); } return out; };'
