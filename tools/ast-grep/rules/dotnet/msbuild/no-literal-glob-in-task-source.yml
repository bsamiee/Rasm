# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-literal-glob-in-task-source
language: xml
severity: error
rule:
    pattern: _TASK
    any:
        - all:
            - matches: {msbuild-element: {name: {regex: "^(Copy|Move)$"}}}
            - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: "^SourceFiles$"}, value: {regex: "[*?]"}}}}}
        - all:
            - matches: {msbuild-element: {name: {regex: "^(Delete|Touch)$"}}}
            - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: "^Files$"}, value: {regex: "[*?]"}}}}}
transform:
    ITEMIZED:
        replace:
            source: $TASK
            replace: '(?s)^<(Copy|Move)\b(?P<a>[^<]*?)\bSourceFiles\s*=\s*["''](?P<g>[^"'']*)["'']'
            by: '<ItemGroup><_${1}Source Remove="@(_${1}Source)" /><_${1}Source Include="${g}" /></ItemGroup><${1}${a}SourceFiles="@(_${1}Source)"'
    LISTED:
        replace:
            source: $ITEMIZED
            replace: '(?s)^<(Delete|Touch)\b(?P<a>[^<]*?)\bFiles\s*=\s*["''](?P<g>[^"'']*)["'']'
            by: '<ItemGroup><_${1}File Remove="@(_${1}File)" /><_${1}File Include="${g}" /></ItemGroup><${1}${a}Files="@(_${1}File)"'
    TREED:
        replace:
            source: $LISTED
            replace: '(?s)^(<ItemGroup>.*?Include="[^"]*\*\*[^"]*".*?<(Copy|Move)\b[^<]*?)\bDestinationFolder\s*=\s*["''](?P<d>[^"'']*?)/?["'']'
            by: '${1}DestinationFiles="@(_${2}Source->''${d}/%(RecursiveDir)%(Filename)%(Extension)'')"'
fix: $TREED
message: The task reads a literal glob in its file list as a file name and finds no file, wildcards expand in an item Include alone
note: Expand the glob in an item Include and pass the item list, with a RecursiveDir transform in DestinationFiles to keep a copied tree
