# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-mcp"
edition.workspace = true
description       = "MCP server layers at rmcp's service level over any transport: traced requests, one endpoint shared by many sessions, an upstream proxy, and a routed app framework with elicitation"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [FEATURES] -------------------------------------------------------------------------

[features]
proxy = ["dep:arc-swap", "rmcp/client"]
app   = ["dep:arc-swap", "dep:nonempty-collections", "dep:validated", "dep:derive-where", "dep:bytes", "dep:data-encoding", "dep:serde_path_to_error", "dep:serde_urlencoded", "dep:jsonschema", "dep:uuid", "dep:form_urlencoded", "dep:matchit", "dep:percent-encoding", "dep:url", "rmcp/elicitation"]

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
arc-swap                           = { workspace = true, optional = true }
nonempty-collections               = { workspace = true, optional = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true, optional = true }
derive-where                       = { workspace = true, optional = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
bytes                              = { workspace = true, optional = true }
data-encoding                      = { workspace = true, optional = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true, optional = true }
serde_urlencoded                   = { workspace = true, optional = true }
jsonschema                         = { workspace = true, optional = true }
uuid                               = { workspace = true, optional = true }
form_urlencoded                    = { workspace = true, optional = true }
matchit                            = { workspace = true, optional = true }
percent-encoding                   = { workspace = true, optional = true }
url                                = { workspace = true, optional = true }
rmcp                               = { workspace = true, default-features = false, features = ["server"] }
opentelemetry                      = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-opentelemetry              = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
