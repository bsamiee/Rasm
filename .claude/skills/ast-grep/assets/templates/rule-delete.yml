# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: <rule-id>
language: <language>
severity: error
rule:
    kind: <kind> # The removed node, one element of a delimited list
    pattern: <the removed element>
fix:
    template: '' # Deletes the node, the test snapshot shows it alone and scan --json replacementOffsets prove the consumed sibling
    expandEnd: {regex: '<separator>'} # Extends the range to the first sibling matching the rule, adjacent by default, any later one under stopBy: end
    # Unnamed siblings count and regex: ',' hits the comma token, a miss keeps the match range, expandStart reaches the preceding sibling
message: <one line naming the violation>
note: <the correction as the shape to produce>
