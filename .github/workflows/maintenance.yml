name: Maintenance

on:
    schedule:
        - cron: '0 9 * * 0'
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    host:
        name: Host runner
        runs-on: [self-hosted, host]
        timeout-minutes: 60
        outputs:
            image: ${{ steps.image.outputs.image }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - &tools
              uses: $/.github/actions/tools
            - &packages
              run: pnpm store prune
            - &wheels
              run: uv cache prune
            - &prune
              run: mise prune --yes
            - run: docker container prune --force --filter until=1h
            - run: docker volume prune --force
            - run: docker image prune --force
            - run: docker builder prune --all --force --filter until=168h
            - run: docker image prune --all --force --filter until=168h --filter "label=org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            - run: nx run rasm:check--cargo-deny-advisories
              env:
                  NX_SKIP_NX_CACHE: 'true'
            - id: image
              run: |-
                  version="$(yq '.catalog["@playwright/test"]' pnpm-workspace.yaml)"
                  printf "image=%s\n" "ghcr.io/${GITHUB_REPOSITORY,,}/playwright:${version}" >> "${GITHUB_OUTPUT}"

    container:
        name: Container runner
        needs: host
        runs-on: [self-hosted, container]
        timeout-minutes: 60
        container:
            image: ${{ needs.host.outputs.image }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ github.token }}
        steps:
            - *checkout
            - *tools
            - *packages
            - *wheels
            - *prune

    graph:
        name: Graph runner
        runs-on: [self-hosted, graph]
        timeout-minutes: 60
        steps:
            - *checkout
            - *tools
            - *packages
            - *wheels
