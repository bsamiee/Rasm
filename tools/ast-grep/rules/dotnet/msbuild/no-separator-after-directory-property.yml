# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-separator-after-directory-property
language: xml
severity: error
rule:
    pattern: _VALUE
    matches: msbuild-path-value
    # These reserved properties include their separator; user-defined suffixes establish no value contract.
    regex: '\$\(MSBuildThisFileDirectory(NoRoot)?\)[\\/]'
transform:
    JOINED:
        replace:
            source: $VALUE
            replace: '(\$\(MSBuildThisFileDirectory(?:NoRoot)?\))[\\/]+'
            by: '$1'
fix: $JOINED
message: The separator follows a reserved property that already ends with one
note: Concatenate the segment directly after the property
