# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-size-ratio-count
language: csharp
severity: error
utils:
    size:
        any:
            - kind: sizeof_expression
            - kind: invocation_expression
              matches: {csharp-owner-call: {type: {regex: '^(Unsafe|Marshal)$'}, member: {regex: '^SizeOf$'}}}
            - kind: member_access_expression
              all:
                - has: {field: expression, matches: {csharp-type-name: {name: {regex: '^(IntPtr|UIntPtr|nint|nuint)$'}}}}
                - has: {field: name, regex: '^Size$'}
            - kind: 'parenthesized_expression, cast_expression, checked_expression'
              has: {matches: size}
            - kind: identifier
              matches: {csharp-block-local: {declarator: {has: {not: {kind: identifier}, matches: size}}}}
rule:
    kind: binary_expression
    pattern: $RATIO
    all:
        - has: {field: operator, regex: '^/$'}
        - has: {field: left, matches: size}
        - has: {field: right, matches: size}
message: '`$RATIO` counts elements as a ratio of type sizes'
note: 'Read the declared count (`Vector128<T>.Count`, `Vector<T>.Count`), a `MemoryMarshal.Cast` span''s `Length`, or lane count (`4` for `Vector4`)'
