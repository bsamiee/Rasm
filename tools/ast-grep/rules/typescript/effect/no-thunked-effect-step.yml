# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-thunked-effect-step
language: tsx
severity: error
rule:
    kind: arrow_function
    all:
        - has: {field: parameters, not: {has: {nthChild: 1}}}
        - has:
            field: body
            pattern: $STEP
            any:
                - kind: identifier
                - kind: member_expression
                  not: {has: {stopBy: end, kind: call_expression}}
                - kind: call_expression
                  has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(try|tryPromise|sync|promise|suspend|gen)$'}}}}
        - inside:
            kind: arguments
            inside: {kind: call_expression, has: {field: function, pattern: $COMBINATOR, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(tap|andThen)$'}}}}}
        - not:
            inside:
                stopBy: end
                kind: variable_declarator
                has: {field: name, pattern: $STEP}
fix: $STEP
message: '`$COMBINATOR` wraps `$STEP` in a thunk that takes no input'
note: 'Pass the effect to `Effect.tap` or `Effect.andThen` directly'
