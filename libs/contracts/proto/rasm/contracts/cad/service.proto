syntax = "proto3";

package rasm.contracts.cad;

import "buf/validate/validate.proto";
import "rasm/contracts/cad/operations.proto";
import "rasm/contracts/cad/types.proto";
import "rasm/contracts/geometry/tessellation.proto";

message TessellateRequest {
  reserved 1, 2;
  reserved "step", "iges";

  SealedBody source = 4 [(buf.validate.field).required = true];
  rasm.contracts.geometry.TessellationPolicy policy = 3 [(buf.validate.field).required = true];
}

service CadService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc Tessellate(TessellateRequest) returns (TessellateResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
