syntax = "proto3";

package rasm.contracts.organization.v1;

import "buf/validate/validate.proto";

// --- [ENTITY] -----------------------------------------------------------------------------

message ViewOverride {
  string view = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  bool visible = 2;
}

// Nesting is the containment contract: an entity occurs once beneath either the document roots or one parent's
// ordered children. Members and view overrides therefore cannot detach from, or name a different, owning entity.
// `key` is the 16-byte big-endian seed-zero content key over the count-framed ancestor label chain; `name` is the
// leaf label. Across one Organization, keys are unique, total entities do not exceed 65,536, and depth does not
// exceed 64. Runtime admission proves those whole-forest laws once because field validation cannot traverse them.
message Entity {
  option (buf.validate.message).cel = {
    id: "organization_entity.override_view_unique"
    message: "view overrides must have unique view keys"
    expression: "this.overrides.map(row, row.view).unique()"
  };

  bytes key = 1 [(buf.validate.field).bytes.len = 16];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  bool visible = 3;
  bool locked = 4;
  repeated Entity children = 5 [(buf.validate.field).repeated.max_items = 65536];
  repeated string members = 6 [(buf.validate.field).repeated = {
    max_items: 65536
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  repeated ViewOverride overrides = 7 [(buf.validate.field).repeated.max_items = 65536];
}

// Each index selects one value from the ordered roots or the selected entity's ordered children. A present path is
// non-empty and bounded to the document depth ceiling; runtime admission proves every index resolves exactly.
message EntityPath {
  repeated uint32 indexes = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
    items: {
      uint32: {lt: 65536}
    }
  }];
}

// --- [DOCUMENT] ---------------------------------------------------------------------------

message Organization {
  // `authority` is the issuer namespace for every nested member and view key. When present, `current` must resolve
  // every index against roots then ordered children; a free entity key is not a selection.
  bytes source_key = 1 [(buf.validate.field).bytes.len = 16];
  string authority = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated Entity roots = 3 [(buf.validate.field).repeated.max_items = 65536];
  EntityPath current = 4;
}
