# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-growth-in-endless-loop-swift
language: swiftlang
severity: error
utils:
    scope:
        kind: 'function_declaration, lambda_literal, init_declaration, computed_property'
    loop:
        kind: 'for_statement, while_statement, repeat_while_statement, switch_statement'
    endless:
        kind: 'while_statement, repeat_while_statement'
        has: {field: condition, regex: '^(true|!Task\.isCancelled)$'}
        not:
            has:
                stopBy: {matches: scope}
                any:
                    - {kind: control_transfer_statement, regex: '^(return|throw)\b'}
                    - {kind: control_transfer_statement, regex: '^break\s+\S'}
                    - kind: control_transfer_statement
                      regex: '^break$'
                      inside: {stopBy: {matches: loop}, matches: loop, has: {field: condition, regex: '^(true|!Task\.isCancelled)$'}}
                    - kind: try_operator
                      regex: '^try$'
                      not: {inside: {kind: do_statement, stopBy: {kind: 'while_statement, repeat_while_statement'}}}
    sequence-type:
        any:
            - has: {kind: type_annotation, has: {field: name, kind: array_type}}
            - has: {field: value, any: [{kind: array_literal}, {kind: call_expression, has: {nthChild: 1, kind: array_type}}]}
rule:
    kind: 'call_expression, assignment'
    all:
        - any:
            - kind: call_expression
              has:
                nthChild: 1
                kind: navigation_expression
                all:
                    - has: {field: target, kind: simple_identifier, pattern: $GROWN}
                    - has: {field: suffix, has: {field: suffix, regex: '^(append|insert)$'}}
            - kind: assignment
              all:
                - has: {field: operator, regex: '^\+=$'}
                - has: {field: target, has: {kind: simple_identifier, pattern: $GROWN}}
            - kind: assignment
              all:
                - has: {field: operator, regex: '^=$'}
                - has: {field: target, has: {kind: simple_identifier, pattern: $GROWN}}
                - has: {field: result, kind: additive_expression, has: {field: lhs, pattern: $GROWN}}
        - inside:
            stopBy: {matches: scope}
            matches: endless
            not: {has: {stopBy: end, kind: property_declaration, has: {field: name, has: {field: bound_identifier, pattern: $GROWN}}}}
        - inside:
            stopBy: {matches: scope}
            matches: scope
            all:
                - has:
                    stopBy: {matches: scope}
                    kind: property_declaration
                    matches: sequence-type
                    all:
                        - has: {kind: value_binding_pattern, has: {field: mutability, regex: '^var$'}}
                        - has: {field: name, has: {field: bound_identifier, pattern: $GROWN}}
                - not:
                    has:
                        stopBy: end
                        any:
                            - kind: call_expression
                              has:
                                nthChild: 1
                                kind: navigation_expression
                                all:
                                    - has: {field: target, pattern: $GROWN}
                                    - has: {field: suffix, has: {field: suffix, regex: '^(removeAll|removeFirst|removeLast|popFirst|popLast|remove|removeSubrange|replaceSubrange)$'}}
                            - kind: assignment
                              all:
                                - has: {field: operator, regex: '^=$'}
                                - has: {field: target, has: {pattern: $GROWN}}
                                - not: {has: {field: result, kind: additive_expression, has: {field: lhs, pattern: $GROWN}}}
                            - kind: prefix_expression
                              all: [{has: {field: operation, regex: '^&$'}}, {has: {field: target, pattern: $GROWN}}]
message: '`$GROWN` grows each pass of a loop with no exit and no removal'
note: 'Bound the collection, drain it per pass, or build it inside the loop body so each pass starts empty'
