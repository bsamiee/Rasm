# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-first-by-filter
language: tsx
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/**']
utils:
    array-member:
        kind: member_expression
        has: {field: object, matches: {effect-module: {name: {regex: '\bArray$'}}}}
    filter-member:
        kind: member_expression
        all: [{has: {field: property, pattern: $FILTER, regex: '^(filter|filterMap|flatMap)$'}}, {matches: array-member}]
    native-flat-map:
        kind: call_expression
        has: {field: function, kind: member_expression, has: {field: property, pattern: $FILTER, regex: '^flatMap$'}}
    native-filter:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, pattern: $FILTER, regex: '^(filter|flatMap)$'}}
            - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
            - not: {has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}}}
    filtered:
        kind: call_expression
        any:
            - all: [{has: {field: arguments, has: {nthChild: 2}}}, {has: {field: function, matches: filter-member}}]
            - all:
                - has: {field: function, kind: call_expression, has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}}
                - has: {field: function, has: {field: function, matches: filter-member}}
    end:
        kind: member_expression
        all: [{has: {field: property, regex: '^(head|last)$'}}, {matches: array-member}]
    getter:
        kind: member_expression
        all: [{has: {field: property, regex: '^get$'}}, {matches: array-member}]
rule:
    pattern: $FIRST
    any:
        - kind: subscript_expression
          all:
            - has: {field: index, regex: '^0$'}
            - has: {field: object, any: [{matches: native-flat-map}, {matches: filtered}]}
        - kind: call_expression
          all:
            - has: {field: arguments, regex: '^\(\s*(0|-1)\s*\)$'}
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^at$'}}
            - any:
                - has: {field: function, has: {field: object, any: [{matches: native-flat-map}, {matches: filtered}]}}
                - all:
                    - has: {field: arguments, regex: '^\(\s*-1\s*\)$'}
                    - has: {field: function, has: {field: object, matches: native-filter}}
        - kind: call_expression
          all:
            - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
            - has: {field: function, matches: end}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: filtered}, {matches: native-filter}]}}
        - kind: call_expression
          all:
            - has: {field: arguments, all: [{has: {nthChild: 2, regex: '^0$'}}, {not: {has: {nthChild: 3}}}]}
            - has: {field: function, matches: getter}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: filtered}, {matches: native-filter}]}}
        - any:
            - matches: end
            - kind: call_expression
              all: [{has: {field: arguments, regex: '^\(\s*0\s*\)$'}}, {has: {field: function, matches: getter}}]
          inside: {kind: arguments}
          follows:
            stopBy: {not: {regex: '^,$'}}
            kind: call_expression
            all:
                - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
                - has: {field: function, matches: filter-member}
rewriters:
    - id: find
      rule:
        any:
            - pattern: $A.head($M.filter($XS, $P))
            - pattern: $A.get($M.filter($XS, $P), 0)
      fix: $A.findFirst($XS, $P)
    - id: find-last
      rule: {pattern: '$A.last($M.filter($XS, $P))'}
      fix: $A.findLast($XS, $P)
transform:
    FOUND: rewrite($FIRST, rewriters=[find, find-last])
fix: $FOUND
message: '`$FILTER` collects every match to read its first or last element'
note: 'Call `Array.findFirst(<list>, <f>)` or `Array.findLast`, with `<f>` a predicate, `Option` mapper, or `flow(<filter>, Result.getSuccess)`'
