# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-sql
language: sql
severity: error
utils:
    in-error:
        inside: {kind: ERROR, stopBy: end}
    opening:
        any:
            - has: {stopBy: end, all: [{not: {has: {pattern: $$_}}}, {not: {regex: '^$'}}, {pattern: $$TOKEN}]}
            - pattern: $$TOKEN
rule:
    any:
        - kind: ERROR, malformed_blob_literal, malformed_number_id
          all:
            - not: {matches: in-error}
            - matches: opening
        - kind: source_file
          has:
            stopBy: end
            all:
                - regex: '^$'
                - pattern: $$MISSING
                - not: {matches: in-error}
                - inside: {matches: opening}
labels:
    TOKEN: {style: primary, message: Opens the span}
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: '`$TOKEN` opens a span the grammar failed to parse'
note: Fix the syntax, or extend tools/ast-grep/grammars/sql for valid syntax it rejects
---
id: no-host-hole-sql
language: sql
severity: error
files: ['**/*.sql']
rule: {kind: substitution}
message: '`.sql` file holds a host hole no host fills'
note: Write the value in SQL or move its statement into a host template
