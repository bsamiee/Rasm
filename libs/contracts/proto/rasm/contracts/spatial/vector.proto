syntax = "proto3";

package rasm.contracts.spatial;

import "buf/validate/validate.proto";

message Point3 {
  reserved "x", "y", "z";

  double x_m = 1 [(buf.validate.field).double.finite = true];
  double y_m = 2 [(buf.validate.field).double.finite = true];
  double z_m = 3 [(buf.validate.field).double.finite = true];
}

// A signed displacement in metres. Unlike Point3, this value carries no origin or location semantics.
message Displacement3 {
  double x_m = 1 [(buf.validate.field).double.finite = true];
  double y_m = 2 [(buf.validate.field).double.finite = true];
  double z_m = 3 [(buf.validate.field).double.finite = true];
}

message UnitDirection3 {
  option (buf.validate.message).cel = {
    id: "unit_direction_3.magnitude"
    message: "squared magnitude must be within 0.000001 of one"
    expression: "this.x * this.x + this.y * this.y + this.z * this.z >= 0.999999 && this.x * this.x + this.y * this.y + this.z * this.z <= 1.000001"
  };

  double x = 1 [(buf.validate.field).double.finite = true];
  double y = 2 [(buf.validate.field).double.finite = true];
  double z = 3 [(buf.validate.field).double.finite = true];
}

message Axis3 {
  Point3 origin = 1 [(buf.validate.field).required = true];
  UnitDirection3 direction = 2 [(buf.validate.field).required = true];
}

// A right-handed orthonormal placement frame. Local X/Y coordinates are metres along x_axis and
// y_axis = z_axis cross x_axis, so the derived axis cannot diverge on the wire.
message Frame3 {
  option (buf.validate.message).cel = {
    id: "frame_3.orthogonal"
    message: "frame axes must be orthogonal"
    expression:
      "this.z_axis.x * this.x_axis.x + this.z_axis.y * this.x_axis.y + this.z_axis.z * this.x_axis.z >= -0.000001 && "
      "this.z_axis.x * this.x_axis.x + this.z_axis.y * this.x_axis.y + this.z_axis.z * this.x_axis.z <= 0.000001"
  };

  Point3 origin = 1 [(buf.validate.field).required = true];
  UnitDirection3 z_axis = 2 [(buf.validate.field).required = true];
  UnitDirection3 x_axis = 3 [(buf.validate.field).required = true];
}

message LineSegment3 {
  Point3 end = 1 [(buf.validate.field).required = true];
}

message ArcSegment3 {
  Point3 through = 1 [(buf.validate.field).required = true];
  Point3 end = 2 [(buf.validate.field).required = true];
}

message SplineSegment3 {
  repeated Point3 through = 1 [(buf.validate.field).repeated.min_items = 1];
  Point3 end = 2 [(buf.validate.field).required = true];
}

// Each segment starts at the prior endpoint, so continuity is structural and the open curve has one coordinate
// for every join.
message CurveSegment3 {
  oneof curve {
    option (buf.validate.oneof).required = true;

    LineSegment3 line = 1;
    ArcSegment3 arc = 2;
    SplineSegment3 spline = 3;
  }
}

message Curve3 {
  Point3 start = 1 [(buf.validate.field).required = true];
  repeated CurveSegment3 segments = 2 [(buf.validate.field).repeated.min_items = 1];
}
