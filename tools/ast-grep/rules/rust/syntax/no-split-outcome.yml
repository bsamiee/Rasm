# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-split-outcome
language: rust
severity: error
utils:
    flag-tuple:
        kind: tuple_type
        has: {kind: primitive_type, regex: '^bool$'}
rule:
    any:
        - kind: 'function_item, function_signature_item'
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: return_type, any: [{matches: flag-tuple}, {has: {stopBy: end, matches: flag-tuple}}]}
            - not: {matches: rust-fixed-signature}
        - kind: field_declaration
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: type, any: [{matches: flag-tuple}, {has: {stopBy: end, matches: flag-tuple}}]}
message: '`$NAME` holds an unnamed `bool` beside a value in a tuple'
note: 'A flag stating an outcome becomes one `Result<<value>, <error>>`, `Option<<value>>`, or an enum with a variant per outcome matched by case, a flag held beside a value allows a success with no value. A flag stating an attribute of the value becomes a named field of a struct holding both, a tuple position names neither. The `split_outcome` dylint owns struct fields: a failure beside a success, and a `bool` restating whether an `Option` holds a value'
