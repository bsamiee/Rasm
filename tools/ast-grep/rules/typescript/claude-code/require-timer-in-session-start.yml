# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-timer-in-session-start
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    kind: call_expression
    # List order, the walk to the hook runs on the timer calls alone and a not before the shape walks from every call
    all:
        # Timer registrations of the clock noun, now and sleep answer a value and belong anywhere
        - matches: {claude-code-engine-call: {noun: {regex: '^clock$'}}}
        - has: {field: function, has: {field: property, regex: '^(every|after)$'}}
        # Timers die on reload, a hook that runs once per session owns every registration, a closure inside the hook included
        - not:
              inside:
                  stopBy: end
                  matches: {claude-code-hook: {event: {kind: string, regex: "^['\"]session\\.start['\"]$"}}}
message: The timer is registered outside the `session.start` hook and dies on reload
note: Register `$.clock.every` and `$.clock.after` timers in the `session.start` hook, `($, e, next) => { $.clock.every(ms, tick); return next(e) }`
