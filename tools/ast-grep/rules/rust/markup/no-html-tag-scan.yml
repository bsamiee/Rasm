# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-html-tag-scan
language: rust
severity: error
utils:
    any-tag-regex:
        kind: call_expression
        all:
            - has: {field: function, regex: '^((::)?regex::)?(bytes::)?(Regex|RegexBuilder|RegexSet)::new$'}
            - has: {field: arguments, has: {nthChild: 1, kind: 'string_literal, raw_string_literal', regex: '^r?#*"<(/\??)?(\[\^>\][*+]\??|\.[*+]\?)>"#*$'}}
rule:
    kind: call_expression
    pattern: $SCAN
    any:
        - matches: rust-html-tag-scan
        - matches: any-tag-regex
message: '`$SCAN` reads HTML by searching tag text'
note: 'Select through `scraper::Html` and `Selector`, strip markup through `ammonia::Builder::empty()`, convert to Markdown through `htmd::convert`'
