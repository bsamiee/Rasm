# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: mapperly-mapping-method
language: csharp
utils:
    user-mapping:
        matches: {csharp-attributed: {name: {regex: '^(User|Named)Mapping(Attribute)?$'}}}
    generated-mapping:
        all:
            - has: {kind: modifier, regex: '^partial$'}
            - not: {has: {field: body, pattern: $_}}
            - inside: {kind: declaration_list, inside: {matches: mapperly-mapper-class}}
    use-argument:
        kind: attribute_argument
        has: {field: name, regex: '^Use$'}
    use-helper:
        all:
            - has: {field: name, pattern: $HELPER}
            - inside: {kind: compilation_unit, stopBy: end, regex: '\bUse\b'}
            - any:
                - inside:
                    kind: declaration_list
                    inside:
                        kind: class_declaration
                        has:
                            stopBy: {kind: 'block, arrow_expression_clause'}
                            matches: use-argument
                            has:
                                any:
                                    - {matches: csharp-nameof-call, has: {field: arguments, has: {kind: argument, has: {kind: identifier, pattern: $HELPER}}}}
                                    - {kind: string_literal, has: {kind: string_literal_content, pattern: $HELPER}}
                - inside:
                    kind: compilation_unit
                    stopBy: end
                    has:
                        stopBy: {kind: 'block, arrow_expression_clause'}
                        matches: use-argument
                        has: {matches: csharp-nameof-call, has: {field: arguments, has: {kind: argument, has: {kind: member_access_expression, has: {field: name, pattern: $HELPER}}}}}
rule:
    kind: method_declaration
    any:
        - matches: user-mapping
        - matches: generated-mapping
        - matches: use-helper
