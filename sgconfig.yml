# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/project.json
ruleDirs:
    - tools/ast-grep/rules
utilDirs:
    - tools/ast-grep/utils
languageGlobs:
    tsx: ["*.ts"]
    xml: ["NuGet.config"]
customLanguages:
    xml:
        libraryPath: .cache/ast-grep/xml.so
        extensions: [xml, csproj, props, targets, slnx]
        expandoChar: _
        outlineRules: tools/ast-grep/outline/msbuild.yml
    sql:
        libraryPath: .cache/ast-grep/sql.so
        languageSymbol: tree_sitter_sqlite3
        extensions: [sql]
        expandoChar: _
        outlineRules: tools/ast-grep/outline/sql.yml
languageInjections:
    - hostLanguage: tsx
      rule:
        kind: string_fragment
        pattern: $CONTENT
        regex: '(?i)^\s*(alter|analyze|attach|begin|commit|create|delete|detach|drop|end|explain|insert|pragma|reindex|release|replace|rollback|savepoint|select|update|vacuum|values|with)\b\s*\S'
        not: {regex: '^\s*[A-Z][a-z]'}
        inside: {kind: 'string, template_string', not: {has: {kind: 'escape_sequence, template_substitution'}}}
      injected: sql
    - hostLanguage: yaml
      rule:
        kind: block_mapping_pair, flow_pair
        all:
            - has: {field: key, regex: '^(run|"run"|''run'')$'}
            - has:
                field: value
                any:
                    - {kind: flow_node, has: {kind: plain_scalar, pattern: $CONTENT, not: {regex: '[\r\n]'}}}
                    - {kind: block_node, has: {kind: block_scalar, pattern: $CONTENT, regex: '^\|'}}
      injected: bash
