# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    zero:
        kind: number
        regex: '^0(\.0*)?$'
    below-zero:
        any:
            - kind: binary_expression
              any:
                - all: [{has: {field: operator, regex: '^<=?$'}}, {has: {field: left, pattern: $N}}, {has: {field: right, matches: zero}}]
                - all: [{has: {field: operator, regex: '^>=?$'}}, {has: {field: left, matches: zero}}, {has: {field: right, pattern: $N}}]
            - kind: parenthesized_expression
              has: {matches: below-zero}
    above-zero:
        any:
            - kind: binary_expression
              any:
                - all: [{has: {field: operator, regex: '^>=?$'}}, {has: {field: left, pattern: $N}}, {has: {field: right, matches: zero}}]
                - all: [{has: {field: operator, regex: '^<=?$'}}, {has: {field: left, matches: zero}}, {has: {field: right, pattern: $N}}]
            - kind: parenthesized_expression
              has: {matches: above-zero}
    math-ceil:
        kind: member_expression
        all:
            - has: {field: property, regex: '^ceil$'}
            - has: {field: object, regex: '(^|\.)Math$', matches: typescript-global-member, pattern: $MATH}
    math-floor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^floor$'}
            - has: {field: object, regex: '(^|\.)Math$', matches: typescript-global-member, pattern: $MATH}
    negated:
        kind: unary_expression
        all: [{has: {field: operator, regex: '^-$'}}, {has: {field: argument, pattern: $N}}]
    ceiling:
        any:
            - kind: call_expression
              all:
                - has: {field: function, matches: math-ceil}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, pattern: $N}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
            - kind: unary_expression
              all:
                - has: {field: operator, regex: '^-$'}
                - has:
                    field: argument
                    kind: call_expression
                    all:
                        - has: {field: function, matches: math-floor}
                        - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: negated}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
            - kind: parenthesized_expression
              has: {matches: ceiling}
    flooring:
        any:
            - kind: call_expression
              all:
                - has: {field: function, matches: math-floor}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $N}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
            - kind: unary_expression
              all:
                - has: {field: operator, regex: '^-$'}
                - has:
                    field: argument
                    kind: call_expression
                    all:
                        - has: {field: function, matches: math-ceil}
                        - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: negated}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
            - kind: parenthesized_expression
              has: {matches: flooring}
    sign:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^sign$'}}, {has: {field: object, regex: '(^|\.)Math$', matches: typescript-global-member, pattern: $MATH}}]}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $N}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
    floored-magnitude:
        kind: call_expression
        all:
            - has: {field: function, matches: math-floor}
            - has:
                field: arguments
                all:
                    - not: {has: {nthChild: {position: 2, ofRule: *code}}}
                    - has:
                        nthChild: {position: 1, ofRule: *code}
                        kind: call_expression
                        all:
                            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^abs$'}}, {has: {field: object, regex: '(^|\.)Math$', matches: typescript-global-member, pattern: $MATH}}]}
                            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $N}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
rule:
    any:
        - kind: ternary_expression
          any:
            - all: [{has: {field: condition, matches: below-zero}}, {has: {field: consequence, matches: ceiling}}, {has: {field: alternative, matches: flooring}}]
            - all: [{has: {field: condition, matches: above-zero}}, {has: {field: consequence, matches: flooring}}, {has: {field: alternative, matches: ceiling}}]
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\*$'}
            - any:
                - all: [{has: {field: left, matches: sign}}, {has: {field: right, matches: floored-magnitude}}]
                - all: [{has: {field: left, matches: floored-magnitude}}, {has: {field: right, matches: sign}}]
message: 'Sign test with `floor` or `ceil` truncates `$N` toward zero by hand'
note: 'Call `Math.trunc(<n>)` on a value evaluated once'
