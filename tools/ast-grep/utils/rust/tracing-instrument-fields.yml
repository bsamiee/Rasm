# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: tracing-instrument-fields
language: rustlang
rule:
    kind: token_tree
    follows: {pattern: fields}
    inside: {kind: token_tree, follows: {regex: '^(::)?(tracing::)?instrument$'}, inside: {kind: attribute, stopBy: end}}
