id: no-parse-obj-as
valid:
    - "pydantic.TypeAdapter(list[int]).validate_python(values)"
    - "custom.parse_obj_as(list[int], values)"
    - "from pydantic.v1 import parse_obj_as"
    # Imports in other functions do not establish the module alias
    - |
      def configure():
          import pydantic as pd
      def validate(pd, values):
          return pd.parse_obj_as(list[int], values)
invalid:
    - "pydantic.parse_obj_as(list[int], values)"
    - "from pydantic import parse_obj_as as parse"
    - "from pydantic.deprecated.tools import parse_obj_as"
    - |
      import pydantic as pd
      pd.parse_obj_as(list[int], values)
