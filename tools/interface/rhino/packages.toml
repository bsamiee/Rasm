    { id = "Garage", commands = { STANDARD = ["ScriptManager", "WhatPanel", "ByParent", "RandomColor", "BlendLayerColors"], SELECT = ["SelStackedControlPointCrv"], VISIBILITY = ["LayerWalker", "MatchModelVisibility"], CURVE_TOOLS = ["SimplifyPolyline", "ExtractInflectionPoints", "ExtractMinMaxRadiusPoints", "OverCut", "ZigZag", "SuperEllipse", "GoldenRectangle", "Cycloid", "Guilloche"], SOLID_TOOLS = ["SolidWeight", "MarkOutOfToleranceEdges", "QuadSphere", "Baseball"], MESH_TOOLS = ["ShowUnweldedEdges"], TRANSFORM = ["OrientOnMesh", "ResetBlock"], DRAFTING = ["DetailDisplayMode", "ConvertFieldToText"] } }, # Script Manager panel and utility commands
    { id = "schlepp" },                                                  # Random walk components for Grasshopper 2
    { id = "UnitsCalculator", commands = { DRAFTING = ["UnitsCalculator"] } }, # Floating calculator for mixed imperial and metric expressions
]
