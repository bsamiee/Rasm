id: typescript-import
language: tsxlang
role: item
symbolType: module
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
rule:
    kind: import_statement, import_alias
    pattern: $DECLARATION
    inside: {matches: scope, stopBy: {not: {kind: export_statement}}}
    any:
        - has: {field: source, pattern: $NAME}
        - has: {kind: import_require_clause, has: {field: source, pattern: $NAME}}
        - has: {kind: identifier, nthChild: 1, pattern: $NAME}
transform:
    LINE: {replace: {source: $DECLARATION, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ' *;$', by: ''}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: {inside: {kind: export_statement}}
---
id: typescript-export
language: tsxlang
role: item
symbolType: module
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
rule:
    kind: export_statement
    pattern: $DECLARATION
    inside: {matches: scope}
    any:
        - has: {field: source, pattern: $NAME}
        - has: {kind: export_clause, not: {regex: "\n"}, pattern: $NAME}
        - all: [{has: {kind: export_clause}}, {has: {regex: '^export$', pattern: $$NAME}}]
        - has: {kind: identifier, pattern: $NAME}
          not: {has: {regex: '^default$'}}
        - all: [{has: {regex: '^=$'}}, {has: {regex: '^export$', pattern: $$NAME}}]
rewriters:
    - id: block
      rule: {kind: 'object, object_type, class_body, statement_block', regex: "\n"}
      fix: '{…}'
    - id: call
      rule: {kind: arguments, regex: "\n", not: {has: {kind: object, regex: "\n"}}}
      fix: (…)
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [block, call]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ' *;$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: true
---
id: typescript-namespace
language: tsxlang
role: item
symbolType: namespace
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
    open:
        any:
            - inside: {kind: export_statement, stopBy: {not: {kind: expression_statement}}}
            - inside: {kind: ambient_declaration, stopBy: end}
            - all:
                - has: {field: name, pattern: $NS}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NS}}}
                            - has: {kind: identifier, pattern: $NS}
rule:
    kind: identifier, nested_identifier, string
    pattern: $NAME
    inside:
        kind: internal_module, module, ambient_declaration
        field: name
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}
            any:
                - kind: program
                - inside:
                    has: {field: name, pattern: $OWNER}
                    any:
                        - inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {has: {field: name, pattern: $OUTER}}}
                        - pattern: $_
        any: [{has: {regex: '^(?:namespace|module)$', pattern: $$KEYWORD}}, {kind: ambient_declaration}]
transform:
    ENCLOSING: {replace: {source: $OUTER, replace: $, by: .}}
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    PREFIX: {replace: {source: $KEYWORD, replace: $, by: ' '}}
name: $ENCLOSING$QUALIFIER$NAME
signature: $PREFIX$ENCLOSING$QUALIFIER$NAME
isExported:
    not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}
---
id: typescript-class
language: tsxlang
role: item
symbolType: class
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
    top:
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
            any:
                - kind: program
                - inside:
                    has: {field: name, pattern: $OWNER}
                    any:
                        - inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {has: {field: name, pattern: $OUTER}}}
                        - pattern: $_
    declaration:
        matches: top
        any:
            - kind: lexical_declaration
              has: {field: kind, pattern: $$KIND}
            - kind: variable_declaration
              has: {regex: '^var$', pattern: $$KIND}
    value:
        any:
            - kind: class
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion
              has: {matches: value}
    open:
        any:
            - inside: {kind: export_statement, stopBy: {not: {kind: expression_statement}}}
            - inside: {kind: ambient_declaration, stopBy: end}
            - all:
                - has: {field: name, pattern: $NS}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NS}}}
                            - has: {kind: identifier, pattern: $NS}
    exported:
        all:
            - any:
                - kind: export_statement
                - inside: {kind: export_statement, stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, ambient_declaration'}}}
                - inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                            - has: {kind: identifier, pattern: $NAME}
            - not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}
rule:
    pattern: $SOURCE
    any:
        - kind: export_statement
          matches: top
          all:
            - has: {field: decorator, kind: decorator}
            - has: {field: declaration, kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $NAME}}
        - kind: class_declaration, abstract_class_declaration
          matches: top
          has: {field: name, pattern: $NAME}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $NAME}
            - inside: {matches: declaration}
            - has: {field: value, matches: value}
        - kind: export_statement
          all:
            - has: {regex: '^default$', pattern: $$NAME}
            - matches: top
            - any:
                - has: {field: value, matches: value}
                - has: {field: declaration, kind: abstract_class_declaration, not: {has: {field: name, kind: type_identifier}}}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: 'class_declaration, abstract_class_declaration, class', field: body}}
      fix: ''
    - id: generics
      rule: {kind: type_arguments, inside: {kind: call_expression, field: type_arguments}}
      fix: <…>
    - id: object
      rule: {kind: object, has: {pattern: $_}}
      fix: '{…}'
    - id: shape
      rule: {kind: object_type, regex: "\n"}
      fix: '{…}'
    - id: call
      rule: {kind: arguments, regex: "\n", not: {has: {kind: object}}}
      fix: (…)
transform:
    ENCLOSING: {replace: {source: $OUTER, replace: $, by: .}}
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
    HEADER: {rewrite: {source: $SOURCE, rewriters: [body, generics, object, shape, call]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ;]+$', by: ''}}
name: $ENCLOSING$QUALIFIER$NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-function
language: tsxlang
role: item
symbolType: function
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
    top:
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
            any:
                - kind: program
                - inside:
                    has: {field: name, pattern: $OWNER}
                    any:
                        - inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {has: {field: name, pattern: $OUTER}}}
                        - pattern: $_
    fn: {regex: '^fn(?:Untraced(?:Eager)?)?$'}
    declaration:
        matches: top
        any:
            - kind: lexical_declaration
              has: {field: kind, pattern: $$KIND}
            - kind: variable_declaration
              has: {regex: '^var$', pattern: $$KIND}
    effect-function:
        any:
            - {kind: identifier, matches: fn}
            - kind: member_expression
              has: {field: property, matches: fn}
    value:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              all:
                - has:
                    field: function
                    any:
                        - matches: effect-function
                        - kind: call_expression
                          has: {field: function, matches: effect-function}
                - has:
                    field: arguments
                    has: {nthChild: 1, kind: 'arrow_function, function_expression, generator_function, identifier, member_expression, call_expression'}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion
              has: {matches: value}
    open:
        any:
            - inside: {kind: export_statement, stopBy: {not: {kind: expression_statement}}}
            - inside: {kind: ambient_declaration, stopBy: end}
            - all:
                - has: {field: name, pattern: $NS}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NS}}}
                            - has: {kind: identifier, pattern: $NS}
    exported:
        all:
            - any:
                - kind: export_statement
                - inside: {kind: export_statement, stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, ambient_declaration'}}}
                - inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                            - has: {kind: identifier, pattern: $NAME}
            - not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}
rule:
    pattern: $DECLARATION
    any:
        - kind: function_declaration, generator_function_declaration, function_signature
          matches: top
          has: {field: name, pattern: $NAME}
        - kind: variable_declarator
          all:
            - inside: {matches: declaration}
            - has: {field: name, kind: identifier, pattern: $NAME}
            - has: {field: value, matches: value}
        - kind: export_statement
          all:
            - has: {regex: '^default$', pattern: $$NAME}
            - matches: top
            - has: {field: value, matches: value}
rewriters:
    - id: declared
      rule: {kind: statement_block, inside: {kind: 'function_declaration, generator_function_declaration', field: body}}
      fix: ''
    - id: expression
      rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: shape
      rule: {kind: 'object, object_type', regex: "\n"}
      fix: '{…}'
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {pattern: $_}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {pattern: $_}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {pattern: $_}]
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $PARAMETERS, rewriters: [shape]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [shape]}}
      fix: $MODIFIER$GENERICS$SHAPED$RESULT => …
    - id: reference
      rule:
        kind: arguments
        has: {nthChild: 1, kind: 'identifier, member_expression, call_expression'}
        inside: {kind: call_expression, field: arguments, inside: {kind: 'variable_declarator, export_statement', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}
      fix: (…)
    - id: call
      rule: {kind: arguments, regex: "\n", not: {has: {kind: 'object, arrow_function, function_expression, generator_function'}}}
      fix: (…)
transform:
    ENCLOSING: {replace: {source: $OUTER, replace: $, by: .}}
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [declared, expression, arrow, reference, shape, call]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ;]+$', by: ''}}
name: $ENCLOSING$QUALIFIER$NAME
signature: $PREFIX$SIGNATURE
isExported: {matches: exported}
---
id: typescript-interface
language: tsxlang
role: item
symbolType: interface
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
    top:
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
            any:
                - kind: program
                - inside:
                    has: {field: name, pattern: $OWNER}
                    any:
                        - inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {has: {field: name, pattern: $OUTER}}}
                        - pattern: $_
    open:
        any:
            - inside: {kind: export_statement, stopBy: {not: {kind: expression_statement}}}
            - inside: {kind: ambient_declaration, stopBy: end}
            - all:
                - has: {field: name, pattern: $NS}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NS}}}
                            - has: {kind: identifier, pattern: $NS}
    exported:
        all:
            - any:
                - inside: {kind: export_statement, stopBy: {not: {kind: ambient_declaration}}}
                - inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                            - has: {kind: identifier, pattern: $NAME}
            - not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}
rule:
    kind: interface_declaration
    pattern: $DECLARATION
    matches: top
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: interface_body, inside: {kind: interface_declaration, field: body}}
      fix: ''
    - id: shape
      rule: {kind: object_type, regex: "\n"}
      fix: '{…}'
transform:
    ENCLOSING: {replace: {source: $OUTER, replace: $, by: .}}
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, shape]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ' +$', by: ''}}
name: $ENCLOSING$QUALIFIER$NAME
signature: $SIGNATURE
isExported: {matches: exported}
---
id: typescript-type
language: tsxlang
role: item
symbolType: struct
utils:
    scope:
        any:
            - kind: program
            - kind: statement_block
              inside: {kind: 'internal_module, module, ambient_declaration', inside: {matches: scope, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}}}
    top:
        inside:
            matches: scope
            stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
            any:
                - kind: program
                - inside:
                    has: {field: name, pattern: $OWNER}
                    any:
                        - inside: {kind: statement_block, stopBy: {not: {kind: 'export_statement, ambient_declaration, expression_statement'}}, inside: {has: {field: name, pattern: $OUTER}}}
                        - pattern: $_
    open:
        any:
            - inside: {kind: export_statement, stopBy: {not: {kind: expression_statement}}}
            - inside: {kind: ambient_declaration, stopBy: end}
            - all:
                - has: {field: name, pattern: $NS}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NS}}}
                            - has: {kind: identifier, pattern: $NS}
    exported:
        all:
            - any:
                - inside: {kind: export_statement, stopBy: {not: {kind: ambient_declaration}}}
                - inside: {kind: statement_block, stopBy: end, inside: {kind: ambient_declaration, stopBy: end}}
                - inside:
                    kind: program, statement_block
                    stopBy: {kind: 'program, statement_block'}
                    has:
                        kind: 'export_statement:not(:has(> string))'
                        any:
                            - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                            - has: {kind: identifier, pattern: $NAME}
            - not: {inside: {kind: 'internal_module, module', stopBy: end, not: {matches: open}}}
rule:
    kind: type_alias_declaration
    pattern: $DECLARATION
    matches: top
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: object_type, inside: {kind: type_alias_declaration, field: value, stopBy: {not: {kind: 'union_type, intersection_type, parenthesized_type'}}}}
      fix: '{…}'
    - id: layout
      rule: {kind: object_type, regex: "\n"}
      fix: '{…}'
transform:
    ENCLOSING: {replace: {source: $OUTER, replace: $, by: .}}
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, layout]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ' *;$', by: ''}}
name: $ENCLOSING$QUALIFIER$NAME
signature: $SIGNATURE
isExported: {matches: exported}
---
