name: Setup
description: Installs mise tools and workspace packages, and on macOS selects the newest installed Xcode and builds the nx-apple core

runs:
    using: composite
    steps:
        - if: runner.os == 'macOS'
          run: |
              newest="$(printf '%s\n' /Applications/Xcode_*.app | grep --extended-regexp '/Xcode_[0-9.]+\.app$' | sort --version-sort | tail -n 1)"
              sudo xcode-select --switch "${newest}"
          shell: bash
        - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        - run: pnpm install
          shell: bash
        - if: runner.os == 'macOS'
          run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
          shell: bash
