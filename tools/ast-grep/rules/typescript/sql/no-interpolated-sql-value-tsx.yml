# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    hand-quoted:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^replace(All)?$'}}
                - has: {field: arguments, has: {nthChild: {position: 2, ofRule: &code {not: {kind: 'comment, html_comment'}}}, kind: string, regex: "^[\"`]''[\"`]$"}}
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^join$'}}, {has: {field: object, kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: '^split$'}}}}]}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, kind: string, regex: "^[\"`]''[\"`]$"}}
    quoting:
        any:
            - matches: hand-quoted
            - kind: call_expression
              has: {field: function, matches: {typescript-constant-value: {value: {has: {stopBy: end, matches: hand-quoted}}}}}
    value-string:
        kind: string
        regex: '(?is)^.+(?:''|(?:[=<>]|(?-u:\b)values[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\(|(?-u:\b)in[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\(|(?-u:\b)limit|(?-u:\b)offset)[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*)[''"]$'
rule:
    any:
        - kind: template_string
          all:
            - has: {kind: string_fragment, regex: '(?im)^[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*(begin|commit|delete|end|explain|insert|release|replace|rollback|savepoint|select|update|values|with)(?-u:\b)'}
            - not: {inside: {kind: call_expression, field: arguments}}
            - not: {has: {kind: string_fragment, regex: '(?m)^[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\.param(eter)?(?-u:\b)'}}
            - has:
                kind: template_substitution
                pattern: $VALUE
                any:
                    - follows: {kind: string_fragment, regex: "'$"}
                    - all:
                        - follows: {kind: string_fragment, regex: '(?i)(?:[=<>]|(?-u:\b)values[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\(|(?-u:\b)in[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\(|(?-u:\b)limit|(?-u:\b)offset)[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*$'}
                        - not: {precedes: {kind: string_fragment, regex: '^\.'}}
                        - inside: {kind: template_string, regex: '(?i)^`[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*(insert|update|delete|select|with|replace|values)(?-u:\b)'}
                    - has: {stopBy: end, matches: quoting}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\+$'}
            - has: {field: right, pattern: $VALUE, not: {kind: 'string, template_string, number'}}
            - has: {field: left, any: [{matches: value-string}, {kind: binary_expression, has: {field: right, matches: value-string}}]}
            - has: {stopBy: end, kind: string, regex: '(?i)^[''"][\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*(insert|update|delete|select|with|replace|values)(?-u:\b)'}
message: '`$VALUE` splices a value into SQL text'
note: 'Write the statement as a `sql` tagged template to bind each value as a parameter, `sql(<name>)` for an identifier'
