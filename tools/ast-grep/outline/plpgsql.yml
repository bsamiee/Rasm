id: plpgsql-option
language: plpgsql
role: item
symbolType: operator
isExported: false
rule:
    kind: comp_option
    has: {kind: 'kw_option, kw_print_strict_params, kw_variable_conflict', pattern: $NAME}
name: $NAME
---
id: plpgsql-scope
language: plpgsql
role: item
symbolType: namespace
isExported: false
utils:
    header:
        has: {kind: 'kw_for, kw_foreach, kw_while, kw_loop', pattern: $OPENER}
        any: [{has: {kind: for_variable, pattern: $VARIABLE}}, {kind: 'stmt_loop, stmt_while'}]
rule:
    any:
        - kind: pl_block
          has: {kind: block_label, has: {pattern: $NAME}}
        - kind: pl_block
          has: {kind: decl_sect, has: {kind: kw_declare, pattern: $KEYWORD}}
        - kind: pl_block
          has: {kind: kw_begin, pattern: $KEYWORD}
        - kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
          has: {kind: loop_label, has: {pattern: $NAME}}
          matches: header
transform:
    LABELED: replace($NAME, replace='(?s)^(.+)$', by='<<${1}>>')
    FORM: replace($OPENER, replace='^', by=' ')
    TARGET: replace($VARIABLE, replace='^|[\t\n\x0B\f\r ]+', by=' ')
name: $NAME$KEYWORD
signature: $LABELED$KEYWORD$FORM$TARGET
---
id: plpgsql-loop-variable
language: plpgsql
role: item
symbolType: variable
isExported: false
rule:
    kind: for_variable
    pattern: $NAME
    inside: {kind: stmt_for, field: for, has: {field: in, kind: 'for_integer_range, for_cursor'}}
name: $NAME
signature: $NAME
---
id: plpgsql-raise
language: plpgsql
role: item
symbolType: event
isExported: false
rule:
    kind: stmt_raise
    matches: condition
utils:
    condition:
        any:
            - has: {kind: any_identifier, pattern: $CONDITION}
            - all: [{has: {kind: kw_sqlstate, pattern: $KEYWORD}}, {has: {field: sqlstate, pattern: $STATE}}]
            - has:
                  kind: raise_option
                  pattern: $OPTION
                  has: {field: left, kind: kw_errcode}
                  any: [{has: {field: right, regex: "^(?:[eE]|[uU]&)?'(?:[^']|'')*'$", pattern: $ERRCODE}}, {has: {field: left, pattern: $ERRKEY}}]
        not: {has: {field: raise, kind: raise_level, not: {has: {kind: kw_exception}}}}
rewriters:
    - {id: value, rule: {kind: sql_expression, not: {regex: "^(?:[eE]|[uU]&)?'(?:[^']|'')*'$"}}, fix: …}
transform:
    CODE: replace($STATE, replace="^(?:[eE]|[uU]&)?'|'$", by='')
    ERRNAME: replace($ERRCODE, replace="^(?:[eE]|[uU]&)?'|'$", by='')
    STATED: replace($KEYWORD, replace='$', by=' ')
    VALUED: {rewrite: {source: $OPTION, rewriters: [value]}}
    USING: replace($VALUED, replace='(?s)^(.)', by='USING ${1}')
    LINE: replace($USING, replace='[\t\n\x0B\f\r ]+', by=' ')
name: $CONDITION$CODE$ERRNAME$ERRKEY
signature: RAISE $CONDITION$STATED$STATE$LINE
---
id: plpgsql-error
language: plpgsql
role: item
symbolType: 'null'
rule:
    any:
        - regex: '^$'
          any: [{kind: 'kw_end, kw_loop, identifier, sql_expression'}, {pattern: ';'}, {pattern: ')'}, {pattern: ']'}]
        - kind: ERROR
          not:
              has:
                  stopBy: end
                  any:
                      - kind: 'pl_block, comp_option'
                      - {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}
                      - {kind: for_variable, inside: {kind: stmt_for, field: for, has: {field: in, kind: 'for_integer_range, for_cursor'}}}
                      - kind: stmt_raise
                        any: [{has: {kind: any_identifier}}, {has: {kind: kw_sqlstate}}, {has: {kind: raise_option, has: {field: left, kind: kw_errcode}}}]
                        not: {has: {field: raise, kind: raise_level, not: {has: {kind: kw_exception}}}}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: plpgsql-scope-label
language: plpgsql
role: member
symbolType: namespace
parentRuleIds: [plpgsql-scope]
rule:
    has: {pattern: $NAME}
    not: {has: {kind: ERROR}}
    any:
        - kind: block_label
          inside: {kind: pl_block, matches: scope}
        - kind: loop_label
          inside: {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', all: [{matches: scope}, {matches: header}]}
utils:
    header:
        has: {kind: 'kw_for, kw_foreach, kw_while, kw_loop', pattern: $OPENER}
        any: [{has: {kind: for_variable, pattern: $VARIABLE}}, {kind: 'stmt_loop, stmt_while'}]
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    scope:
        matches: nested
        any:
            - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}
            - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
rewriters:
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
transform:
    LABELED: replace($NAME, replace='(?s)^(.+)$', by='<<${1}>>')
    FORM: replace($OPENER, replace='^', by=' ')
    TARGET: replace($VARIABLE, replace='^|[\t\n\x0B\f\r ]+', by=' ')
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
name: $QUALIFIER$NAME
signature: $LABELED$FORM$TARGET
---
id: plpgsql-scope-cursor
language: plpgsql
role: member
symbolType: function
parentRuleIds: [plpgsql-scope]
utils:
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    owner: {any: [{inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}}, {kind: decl_statement}]}
rule:
    kind: decl_varname
    pattern: $NAME
    inside: {kind: decl_statement, pattern: $DECLARATION, has: {kind: kw_cursor}, matches: owner}
rewriters:
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
    - {id: strip, rule: {kind: comment}, fix: ''}
    - {id: query, rule: {kind: 'kw_for, kw_is, sql_expression', inside: {kind: decl_statement}}, fix: ''}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    FOLDED: replace($HEADER, replace='[\t\n\x0B\f\r ]+', by=' ')
    SIGNATURE: replace($FOLDED, replace=' ?;$', by='')
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [query, strip]}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
---
id: plpgsql-scope-variable
language: plpgsql
role: member
symbolType: variable
parentRuleIds: [plpgsql-scope]
utils:
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    owner: {any: [{inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}}, {kind: decl_statement}]}
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
rule:
    any:
        - kind: decl_statement
          pattern: $DECLARATION
          has: {kind: decl_varname, pattern: $NAME}
          all: [{not: {has: {kind: 'kw_constant, kw_cursor'}}}, {not: {has: {stopBy: end, matches: failed}}}, {matches: owner}]
        - kind: decl_varname
          regex: .
          pattern: $NAME
          inside: {kind: decl_statement, pattern: $DECLARATION, all: [{not: {has: {kind: 'kw_constant, kw_cursor'}}}, {has: {stopBy: end, matches: failed}}, {matches: owner}]}
rewriters:
    - {id: value, rule: {kind: sql_expression, inside: {kind: decl_defval}}, fix: …}
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
    - {id: strip, rule: {kind: comment}, fix: ''}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, strip]}}
    FOLDED: replace($HEADER, replace='[\t\n\x0B\f\r ]+', by=' ')
    SIGNATURE: replace($FOLDED, replace=' ?;$', by='')
name: $QUALIFIER$NAME
signature: $SIGNATURE
---
id: plpgsql-scope-private-variable
language: plpgsql
role: member
symbolType: variable
isPublic: false
parentRuleIds: [plpgsql-scope]
rule:
    any:
        - kind: decl_cursor_arg
          pattern: $DECLARATION
          has: {kind: decl_varname, pattern: $NAME}
          not: {has: {stopBy: end, matches: failed}}
          matches: argument
        - kind: decl_varname
          regex: .
          pattern: $NAME
          inside: {kind: decl_cursor_arg, pattern: $DECLARATION, has: {stopBy: end, matches: failed}, matches: argument}
        - kind: for_variable
          pattern: $DECLARATION
          has: {kind: dotted_name, pattern: $NAME}
          not: {has: {stopBy: end, matches: failed}}
          inside:
              kind: stmt_for
              field: for
              has: {field: in, kind: 'for_integer_range, for_cursor'}
              any:
                  - {has: {kind: loop_label, pattern: $OWNER}, matches: nested}
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}
                  - kind: stmt_for
utils:
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    owner: {any: [{inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}}, {kind: decl_statement}]}
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
    argument: {inside: {kind: decl_cursor_args, inside: {kind: decl_statement, has: {kind: decl_varname, pattern: $CURSOR}, matches: owner}}}
rewriters:
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
    - {id: strip, rule: {kind: comment}, fix: ''}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    PARENT: replace($CURSOR, replace='$', by='.')
    STRIPPED: {rewrite: {source: $DECLARATION, rewriters: [strip]}}
    SIGNATURE: replace($STRIPPED, replace='[\t\n\x0B\f\r ]+', by=' ')
name: $QUALIFIER$PARENT$NAME
signature: $SIGNATURE
---
id: plpgsql-scope-constant
language: plpgsql
role: member
symbolType: constant
parentRuleIds: [plpgsql-scope]
utils:
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    owner: {any: [{inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}}, {kind: decl_statement}]}
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
rule:
    any:
        - kind: decl_statement
          pattern: $DECLARATION
          has: {kind: decl_varname, pattern: $NAME}
          all: [{has: {kind: kw_constant}}, {not: {has: {stopBy: end, matches: failed}}}, {matches: owner}]
        - kind: decl_varname
          regex: .
          pattern: $NAME
          inside: {kind: decl_statement, pattern: $DECLARATION, all: [{has: {kind: kw_constant}}, {has: {stopBy: end, matches: failed}}, {matches: owner}]}
rewriters:
    - {id: value, rule: {kind: sql_expression, inside: {kind: decl_defval}}, fix: …}
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
    - {id: strip, rule: {kind: comment}, fix: ''}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, strip]}}
    FOLDED: replace($HEADER, replace='[\t\n\x0B\f\r ]+', by=' ')
    SIGNATURE: replace($FOLDED, replace=' ?;$', by='')
name: $QUALIFIER$NAME
signature: $SIGNATURE
---
id: plpgsql-scope-handler
language: plpgsql
role: member
symbolType: event
isPublic: false
parentRuleIds: [plpgsql-scope]
rule:
    any:
        - kind: proc_condition
          not: {has: {stopBy: end, matches: failed}}
          matches: condition
        - kind: 'any_identifier, kw_sqlstate'
          regex: .
          inside: {kind: proc_condition, has: {stopBy: end, matches: failed}, matches: condition}
utils:
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
    condition:
        any: [{has: {kind: any_identifier, pattern: $CONDITION}}, {has: {field: sqlstate, pattern: $STATE}}]
        inside: {kind: proc_conditions, pattern: $CONDITIONS, inside: {kind: proc_exception}}
        matches: owner
    owner: {any: [{inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}}, {kind: proc_condition}]}
rewriters:
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
    - {id: strip, rule: {kind: comment}, fix: ''}
transform:
    CODE: replace($STATE, replace="^(?:[eE]|[uU]&)?'|'$", by='')
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    CLAUSE: {rewrite: {source: $CONDITIONS, rewriters: [strip]}}
    HEADER: replace($CLAUSE, replace='[\t\n\x0B\f\r ]+', by=' ')
name: $QUALIFIER$CONDITION$CODE
signature: WHEN $HEADER
---
id: plpgsql-scope-raise
language: plpgsql
role: member
symbolType: event
parentRuleIds: [plpgsql-scope]
rule:
    any:
        - kind: stmt_raise
          all: [{matches: condition}, {not: {has: {stopBy: end, matches: failed}}}]
        - kind: kw_raise
          inside: {kind: stmt_raise, all: [{matches: condition}, {has: {stopBy: end, matches: failed}}]}
utils:
    nested: {inside: {stopBy: end, any: [{kind: pl_block}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}}
    failed: {any: [{kind: ERROR}, {regex: '^$'}]}
    condition:
        any:
            - has: {kind: any_identifier, pattern: $CONDITION}
            - all: [{has: {kind: kw_sqlstate, pattern: $KEYWORD}}, {has: {field: sqlstate, pattern: $STATE}}]
            - has:
                  kind: raise_option
                  pattern: $OPTION
                  has: {field: left, kind: kw_errcode}
                  any: [{has: {field: right, regex: "^(?:[eE]|[uU]&)?'(?:[^']|'')*'$", pattern: $ERRCODE}}, {has: {field: left, pattern: $ERRKEY}}]
        not: {has: {field: raise, kind: raise_level, not: {has: {kind: kw_exception}}}}
        matches: owner
    owner: {any: [{inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $OWNER}, matches: nested}}, {kind: stmt_raise}]}
rewriters:
    - {id: value, rule: {kind: sql_expression, not: {regex: "^(?:[eE]|[uU]&)?'(?:[^']|'')*'$"}}, fix: …}
    - id: lineage
      rule:
          kind: 'block_label, loop_label'
          has: {pattern: $SEGMENT}
          inside:
              kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
              any:
                  - inside: {stopBy: end, kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: 'block_label, loop_label', pattern: $UP}, matches: nested}
                  - kind: 'pl_block, stmt_loop, stmt_while, stmt_for, stmt_foreach_a'
      transform:
          ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$SEGMENT.
transform:
    CODE: replace($STATE, replace="^(?:[eE]|[uU]&)?'|'$", by='')
    ERRNAME: replace($ERRCODE, replace="^(?:[eE]|[uU]&)?'|'$", by='')
    STATED: replace($KEYWORD, replace='$', by=' ')
    VALUED: {rewrite: {source: $OPTION, rewriters: [value]}}
    USING: replace($VALUED, replace='(?s)^(.)', by='USING ${1}')
    LINE: replace($USING, replace='[\t\n\x0B\f\r ]+', by=' ')
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
name: $QUALIFIER$CONDITION$CODE$ERRNAME$ERRKEY
signature: RAISE $CONDITION$STATED$STATE$LINE
---
id: plpgsql-member-error
language: plpgsql
role: member
parentRuleIds: [plpgsql-option, plpgsql-scope, plpgsql-loop-variable, plpgsql-raise]
symbolType: 'null'
rule:
    any:
        - regex: '^$'
          any: [{kind: 'kw_end, kw_loop, identifier, sql_expression'}, {pattern: ';'}, {pattern: ')'}, {pattern: ']'}]
        - kind: ERROR
          not:
              has:
                  stopBy: end
                  any:
                      - {kind: decl_statement, inside: {stopBy: end, kind: pl_block}}
                      - {kind: decl_cursor_arg, inside: {kind: decl_cursor_args, inside: {kind: decl_statement}}}
                      - {kind: block_label, inside: {kind: pl_block}}
                      - {kind: loop_label, inside: {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a'}}
                      - {kind: for_variable, inside: {kind: stmt_for, field: for, has: {field: in, kind: 'for_integer_range, for_cursor'}}}
                      - {kind: proc_condition, inside: {kind: proc_conditions, inside: {kind: proc_exception}}}
                      - matches: condition-raise
        - kind: kw_begin
          inside:
              any:
                  - kind: ERROR
                  - {kind: pl_block, inside: {stopBy: {matches: boundary}, kind: ERROR}}
        - kind: 'kw_declare, kw_exception, kw_cursor'
          inside: {kind: ERROR}
        - kind: 'kw_option, kw_print_strict_params, kw_variable_conflict, loop_label, dotted_name'
          inside:
              kind: 'comp_option, stmt_loop, stmt_while, stmt_for, stmt_foreach_a, for_variable'
              inside: {stopBy: {matches: boundary}, kind: ERROR}
        - kind: kw_raise
          inside: {matches: condition-raise, inside: {stopBy: {matches: boundary}, kind: ERROR}}
utils:
    boundary: {any: [{kind: 'ERROR, pl_block'}, {kind: 'stmt_loop, stmt_while, stmt_for, stmt_foreach_a', has: {kind: loop_label}}]}
    condition-raise:
        kind: stmt_raise
        any: [{has: {kind: any_identifier}}, {has: {kind: kw_sqlstate}}, {has: {kind: raise_option, has: {field: left, kind: kw_errcode}}}]
        not: {has: {field: raise, kind: raise_level, not: {has: {kind: kw_exception}}}}
name: ERROR
signature: ''
isPublic: false
