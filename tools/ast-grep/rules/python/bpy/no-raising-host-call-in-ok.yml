# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-raising-host-call-in-ok
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    refusing:
        kind: call
        pattern: $CALL
        has:
            field: function
            any:
                - kind: attribute
                  all:
                    - has: {field: attribute, regex: '^(new|new_from_object|load|remove|create_gpencil_data|remove_gpencil_data)$'}
                    - has: {field: object, kind: attribute, has: {field: object, matches: {python-member-use: {module: {regex: '^bpy$'}, name: {regex: '^data$'}}}}}
                - matches: {python-member-use: {module: {regex: '^gpu\.types$'}, name: {regex: '^(Buffer|GPUBatch|GPUFrameBuffer|GPUIndexBuf|GPUOffScreen|GPUStorageBuf|GPUTexture|GPUUniformBuf|GPUVertBuf|GPUVertFormat)$'}}}
rule:
    any:
        - kind: call
          all:
            - has: {field: function, kind: identifier, regex: '^Ok$', matches: {python-imported-name: {module: {regex: '^expression$'}, name: {regex: '^Ok$'}}}}
            - has: {field: arguments, not: {has: {nthChild: 2}}, has: {nthChild: 1, matches: refusing}}
        - kind: lambda
          all:
            - not: {has: {field: parameters, kind: lambda_parameters}}
            - has: {field: body, matches: refusing}
            - inside: {kind: argument_list}
message: '`$CALL` lets a host refusal raise'
note: 'Call `host(<callee>, <arguments>)`, subject and member read from bound callee, caught error kept as cause'
