# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-ternary-to-lift-predicate
language: tsx
severity: off
rule:
    kind: ternary_expression
    pattern: $BRANCH
    any: # The value in either arm, the lift evaluates it ahead of the condition and the error stays in its thunk
        - pattern: '$_ ? Effect.succeed($V) : Effect.fail($_)'
        - pattern: '$_ ? Effect.fail($_) : Effect.succeed($V)'
    not:
        any:
            - matches: syntax-narrowed-branch
            # Await or yield in the condition or in the failing arm has no place in the synchronous thunks the lift takes
            - has: {field: condition, matches: syntax-suspension}
            - has: {field: consequence, matches: syntax-suspension}
            - has: {field: alternative, matches: syntax-suspension}
constraints:
    V: {matches: effect-liftable-value}
rewriters:
    - id: value-when-true
      rule: {pattern: '$C ? Effect.succeed($V) : Effect.fail($E)'}
      fix: Effect.liftPredicate($V, () => $C, () => $E)
    - id: value-when-false
      rule: {pattern: '$C ? Effect.fail($E) : Effect.succeed($V)'}
      transform:
          NOT: rewrite($C, rewriters=[negate-negation, negate-operand, negate-compound])
      fix: Effect.liftPredicate($V, () => $NOT, () => $E)
    - id: negate-negation
      rule: {pattern: '!$E'}
      fix: $E
    - id: negate-operand
      rule: {pattern: $E, matches: syntax-negation-operand}
      fix: '!$E'
    - id: negate-compound
      rule: {pattern: $E}
      fix: '!($E)'
transform:
    LIFT: rewrite($BRANCH, rewriters=[value-when-true, value-when-false])
fix: $LIFT
message: The branch fails or succeeds an effect by hand
note: Lift the value under its condition, `Effect.liftPredicate(value, () => condition, () => error)`
