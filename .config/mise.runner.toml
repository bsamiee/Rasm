# --- [BOOTSTRAP] ------------------------------------------------------------------------

# --- [FILES]

[bootstrap.files."/etc/apt/apt.conf.d/53unattended-upgrades-runner"]
content = '''
Unattended-Upgrade::Automatic-Reboot "false";
'''

[bootstrap.files."/etc/needrestart/conf.d/actions_runner_services.conf"]
content = '''
$nrconf{override_rc}{qr(^actions\.runner\..+\.service$)} = 0;
'''

[bootstrap.files."/etc/sudoers.d/90-runner"]
content = """
runner ALL=(ALL) NOPASSWD:ALL
"""
mode    = "0440"

[bootstrap.files."/etc/systemd/system/reboot-when-idle.service"]
content = """
[Unit]
Description=Reboot after updates when all repository workflow runs on the first API page have concluded
ConditionPathExists=/run/reboot-required
Wants=network-online.target
After=network-online.target
[Service]
Type=oneshot
ExecStart=/bin/bash -c 'url=$$(jq -rn "first(inputs.gitHubUrl)" /home/runner/actions-runner-*/.runner) && count=$$(curl -fsS "https://api.github.com/repos/$${url#https://github.com/}/actions/runs?per_page=100" | jq "[.workflow_runs[] | select(.conclusion == null)] | length") && [ "$$count" = 0 ] && exec systemctl reboot; echo "Reboot deferred, unfinished workflow run count is $${count:-unknown}"'
"""
notify  = ["reboot-when-idle.timer"]

[bootstrap.files."/etc/systemd/system/reboot-when-idle.timer"]
content = """
[Unit]
Description=Hourly check for updates that require a reboot
[Timer]
OnCalendar=hourly
[Install]
WantedBy=timers.target
"""
notify  = ["reboot-when-idle.timer"]

# --- [GROUPS]

[bootstrap.groups.docker]
system = true

[bootstrap.groups.runner]
# --- [PACKAGES]

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:fontconfig"      = "latest"
"apt:jq"              = "latest"
"apt:libgl1"          = "latest"
"apt:libice6"         = "latest"
"apt:libsm6"          = "latest"
"apt:libsqlite3-dev"  = "latest"
"apt:libxfixes3"      = "latest"
"apt:libxi6"          = "latest"
"apt:libxrender1"     = "latest"
"apt:pkg-config"      = "latest"
"apt:sqlite3"         = "latest"
"apt:unzip"           = "latest"
"apt:zip"             = "latest"

# --- [SERVICES]

[bootstrap.services]
"reboot-when-idle.timer" = {}

# --- [USERS]

[bootstrap.users.runner]
create_home = true
group       = "runner"
groups      = ["docker"]
shell       = "/bin/bash"
uid         = 1000
