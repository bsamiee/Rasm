id: rust-member-error
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-trait, rust-impl, rust-trait-impl, rust-type, rust-enum, rust-foreign-block]
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, any: [{matches: row}, {kind: 'enum_variant, field_declaration'}]}}}
        - matches: missing
