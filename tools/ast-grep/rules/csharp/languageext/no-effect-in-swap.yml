# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['apps/roslyn/**']
utils:
    transition-scope:
        kind: 'lambda_expression, anonymous_method_expression, local_function_statement, method_declaration'
        any:
            - pattern: $TRANSITION
            - inside: {stopBy: end, pattern: $TRANSITION}
    declared-local:
        kind: 'lambda_expression, anonymous_method_expression, local_function_statement, method_declaration'
        matches: transition-scope
        has: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: {context: 'class $LOCAL;', selector: identifier}}}
    transition-local:
        kind: 'lambda_expression, anonymous_method_expression, local_function_statement, method_declaration'
        any:
            - matches: declared-local
            - all:
                - matches: transition-scope
                - has: {field: parameters, any: [{pattern: {context: 'var f = $LOCAL => 0;', selector: implicit_parameter}}, {has: {kind: parameter, has: {field: name, pattern: {context: 'class $LOCAL;', selector: identifier}}}}]}
    local-write:
        all:
            - any:
                - kind: assignment_expression
                  has: {field: left, kind: identifier, pattern: {context: 'class $LOCAL;', selector: identifier}}
                - kind: 'postfix_unary_expression, prefix_unary_expression'
                  has: {kind: identifier, pattern: {context: 'class $LOCAL;', selector: identifier}}
            - inside: {stopBy: end, matches: transition-local}
    local-call:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, has: {field: expression, kind: identifier, pattern: {context: 'class $LOCAL;', selector: identifier}}}
            - inside: {stopBy: end, matches: declared-local}
    effect:
        any:
            - kind: expression_statement
              not: {has: {any: [{matches: local-write}, {matches: local-call}]}}
            - kind: assignment_expression
              all:
                - not: {inside: {kind: 'expression_statement, initializer_expression'}}
                - not: {matches: local-write}
            - kind: local_declaration_statement
              has:
                kind: variable_declaration
                all:
                    - has: {kind: variable_declarator, has: {nthChild: 2, kind: 'invocation_expression, await_expression'}}
                    - any:
                        - has: {field: type, matches: {csharp-type-name: {name: {regex: '^Unit$'}}}}
                        - has: {kind: variable_declarator, has: {field: name, regex: '^_$'}}
    effect-member:
        kind: identifier
        pattern: {context: 'class $GROUP;', selector: identifier}
        inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                kind: 'method_declaration, local_function_statement'
                pattern: $TRANSITION
                all:
                    - has: {field: name, pattern: {context: 'class $GROUP;', selector: identifier}}
                    - has: {stopBy: end, matches: effect}
rule:
    kind: invocation_expression
    all:
        - matches: languageext-atom-transition
        - has: {field: function, pattern: $SWAP}
        - has:
            field: arguments
            has:
                kind: argument
                any:
                    - has:
                        kind: 'lambda_expression, anonymous_method_expression'
                        pattern: $TRANSITION
                        has: {stopBy: end, matches: effect}
                    - has: {kind: identifier, matches: effect-member}
                    - has:
                        kind: 'lambda_expression, anonymous_method_expression'
                        has: {stopBy: end, kind: invocation_expression, has: {field: function, matches: effect-member}}
message: '`$SWAP` transition runs an effect that reruns on every compare-and-swap retry'
note: 'Return next state from a pure transition, run effects on the returned value'
