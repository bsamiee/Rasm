# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unconditional-upsert
language: sql
severity: error
rule:
    kind: upsert_clause
    pattern: $UPSERT
    all:
        - has: {field: assignment, kind: set_assignment}
        - not: {has: {field: where, kind: where_clause}}
        - not: {has: {kind: set_assignment, not: {has: {field: value, kind: column_reference, has: {field: table, regex: '(?i-u)^["`\[]?excluded["`\]]?$'}}}}}
message: '`$UPSERT` rewrites rows that hold every incoming value'
note: 'Skip unchanged updates only when triggers and returning readers require no update'
