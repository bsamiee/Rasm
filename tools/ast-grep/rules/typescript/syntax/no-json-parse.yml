# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-parse
language: tsx
severity: error
rule:
    kind: call_expression
    has: {field: function, regex: '^(globalThis\.)?JSON\.parse$', matches: syntax-global-reference}
message: '`JSON.parse` answers an unvalidated value, the form of `Schema.decodeUnknown(Schema.parseJson(schema))`'
note: 'The decoder answers a typed value or a `ParseError`'
