# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-atom-under-lock
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    scope-entry:
        kind: invocation_expression
        has: {field: function, kind: member_access_expression, has: {field: name, regex: '^EnterScope$'}}
    lock-acquire:
        kind: invocation_expression
        any:
            - all:
                - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Monitor$'}, member: {regex: '^(Enter|TryEnter)$'}}}}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {pattern: $LOCK}}}
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^(Enter|TryEnter|Wait|WaitAsync|WaitOne|EnterWriteLock|EnterReadLock|EnterUpgradeableReadLock|TryEnterWriteLock|TryEnterReadLock|TryEnterUpgradeableReadLock)$'}
                    - has: {field: expression, pattern: $LOCK, not: {matches: {csharp-type-name: {name: {regex: '^Monitor$'}}}}}
    lock-release:
        kind: invocation_expression
        any:
            - all:
                - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Monitor$'}, member: {regex: '^Exit$'}}}}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {pattern: $LOCK}}}
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^(Exit|Release|ReleaseMutex|ExitWriteLock|ExitReadLock|ExitUpgradeableReadLock)$'}
                    - has: {field: expression, pattern: $LOCK, not: {matches: {csharp-type-name: {name: {regex: '^Monitor$'}}}}}
    deferred-callback:
        any:
            - kind: local_function_statement
            - kind: 'lambda_expression, anonymous_method_expression'
              any:
                - not: {inside: {kind: argument}}
                - inside:
                    kind: argument
                    inside:
                        kind: argument_list
                        inside:
                            any:
                                - kind: 'object_creation_expression, implicit_object_creation_expression'
                                - kind: invocation_expression
                                  has:
                                    field: function
                                    any:
                                        - matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^(lift|liftAsync|liftVAsync)$'}}}
                                        - matches: {csharp-owner-member: {type: {regex: '^Eff$'}, member: {regex: '^lift$'}}}
                                        - matches: {csharp-type-name: {name: {regex: '^(liftIO|liftEff|memo)$'}}}
                                        - matches: {csharp-owner-member: {type: {regex: '^Task$'}, member: {regex: '^Run$'}}}
                                        - matches: {csharp-owner-member: {type: {regex: '^Factory$'}, member: {regex: '^StartNew$'}}}
    locked-try:
        kind: try_statement
        all:
            - has: {kind: finally_clause, has: {stopBy: end, matches: lock-release}}
            - any:
                - has: {field: body, has: {stopBy: end, matches: lock-acquire}}
                - follows: {stopBy: end, has: {stopBy: end, matches: lock-acquire}}
    lock-region:
        any:
            - kind: lock_statement
            - kind: using_statement
              has: {matches: scope-entry}
            - follows:
                stopBy: end
                kind: local_declaration_statement
                regex: '^using\b'
                has: {stopBy: end, matches: scope-entry}
            - kind: 'block, catch_clause'
              inside: {matches: locked-try}
    mutation:
        kind: invocation_expression
        all:
            - matches: languageext-atom-mutation
            - any:
                - has: {field: function, kind: member_access_expression, has: {field: expression, pattern: $CELL}}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {pattern: $CELL}}}
    helper-call:
        kind: invocation_expression
        all:
            - has: {field: function, kind: identifier, pattern: $HELPER}
            - inside:
                stopBy: end
                kind: compilation_unit
                has:
                    stopBy: end
                    kind: 'method_declaration, local_function_statement'
                    all:
                        - has: {field: name, pattern: $HELPER}
                        - has: {stopBy: end, matches: mutation}
rule:
    kind: invocation_expression
    pattern: $WRITE
    all:
        - any:
            - matches: mutation
            - matches: helper-call
        - inside:
            stopBy: {matches: deferred-callback}
            matches: lock-region
            pattern: $REGION
labels:
    WRITE: {style: primary, message: 'Writes the atom'}
    REGION: {style: secondary, message: 'Holds the lock'}
message: '`$WRITE` writes an atom under a lock that serializes the write a second time'
note: 'Write through `Atom` operations without a lock, or hold state in a plain field under the lock'
