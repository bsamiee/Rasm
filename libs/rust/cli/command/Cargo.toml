# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-command"
version.workspace    = true
edition.workspace    = true
description          = "CLI entry point with completions, man pages, layered settings, telemetry, color, async runtime, and shutdown signals"
repository.workspace = true
license.workspace    = true
keywords             = ["cli", "clap", "completions", "settings", "signals"]
categories           = ["command-line-interface"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
futures              = { workspace = true }
tokio                = { workspace = true }
annotate-snippets    = { workspace = true }
nonempty-collections = { workspace = true }
sysexits             = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
serde                = { workspace = true }
serde_path_to_error  = { workspace = true }
toml                 = { workspace = true }
camino               = { workspace = true }
fs-err               = { workspace = true }
tracing-appender     = { workspace = true }
tracing-subscriber   = { workspace = true }
clap                 = { workspace = true }
clap_complete        = { workspace = true }
clap_mangen          = { workspace = true }
colorchoice-clap     = { workspace = true }
rasm-telemetry       = { workspace = true }

[target."cfg(unix)".dependencies]
tokio-stream = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
