# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    exited-zero:
        regex: '^(Subprocess(\.|::))?TerminationStatus\.exited\([\t-\r ]*0[\t-\r ]*\)$'
    plain-operand:
        kind: 'simple_identifier, navigation_expression, call_expression'
rule:
    pattern: $SITE
    any:
        - kind: equality_expression
          all:
            - has: {matches: exited-zero}
            - has: {matches: plain-operand, not: {matches: exited-zero}}
        - kind: infix_expression
          all:
            - has: {field: op, pattern: '!='}
            - has: {matches: exited-zero}
            - has: {matches: plain-operand, not: {matches: exited-zero}}
        - kind: 'if_statement, guard_statement'
          all:
            - has: {field: condition, regex: '^case$'}
            - regex: '^(if|guard)[\t-\r ]+case[\t-\r ]+(Subprocess(\.|::))?TerminationStatus\.exited\([\t-\r ]*0[\t-\r ]*\)[\t-\r ]*='
transform:
    HEAD: {replace: {source: $SITE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` tests a `TerminationStatus` for exit code 0 by pattern'
note: 'Read `<status>.isSuccess`, or compare `<optional>?.isSuccess` with `true`'
