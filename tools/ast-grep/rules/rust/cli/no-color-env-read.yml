# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-color-env-read
language: rust
severity: error
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $NAME
    regex: '^r?#*"(NO_COLOR|CLICOLOR|CLICOLOR_FORCE|COLORTERM|TERM)"#*$'
    inside: {kind: token_tree, stopBy: {kind: attribute}, inside: {kind: attribute}}
    follows: {regex: '^=$', follows: {regex: '^env$'}}
message: '`$NAME` reads a color variable `anstream` reads itself'
note: 'Delete the argument and write through `anstream::stdout()` or `stderr()`, and set an explicit choice through `anstream::ColorChoice::write_global`'
