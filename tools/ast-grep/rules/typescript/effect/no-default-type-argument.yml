# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-type-argument
language: tsx
severity: error
rule:
    kind: generic_type
    all:
        - has:
            field: name
            kind: nested_type_identifier
            pattern: $NAME
            all:
                - has: {field: name, regex: '^(Effect|Stream|Layer|Exit|Result|Fiber|Deferred|Pool|Request|Queue|Enqueue|Dequeue)$'}
                - has: {field: module, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Layer|Exit|Result|Fiber|Deferred|Pool|Request|Queue)$'}}}}
        - has:
            field: type_arguments
            pattern: $ARGUMENTS
            all:
                - has: {nthChild: 2}
                - has: {nthChild: {position: 1, reverse: true}, kind: predefined_type, regex: '^never$'}
transform:
    KEPT: {replace: {source: $ARGUMENTS, replace: '(\s*,\s*never)+\s*,?\s*>$', by: '>'}}
fix: $NAME$KEPT
message: '`$ARGUMENTS` restates the `never` defaults of its trailing type parameters'
note: 'Omit each trailing type argument equal to its parameter default, `Effect.Effect<A>` reads as `Effect.Effect<A, never, never>`'
