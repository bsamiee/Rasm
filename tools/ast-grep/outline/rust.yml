id: rust-use
language: rustlang
role: item
symbolType: module
utils:
    public: {kind: visibility_modifier, regex: 'pub', not: {regex: '\('}}
    argument: {pattern: $ARGUMENT}
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    any:
        - has: {field: argument, kind: use_as_clause, has: {field: path, any: [{has: {field: path, matches: argument}}, {matches: argument}]}}
        - has: {field: argument, has: {field: path, matches: argument}}
        - has: {field: argument, kind: use_wildcard, has: {matches: argument}}
        - has: {field: argument, matches: argument}
        - has: {field: name, matches: argument}
rewriters:
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    PATH: {rewrite: {source: $ARGUMENT, rewriters: [annotation]}}
    FOLDED: {replace: {source: $PATH, replace: '\p{Pattern_White_Space}+', by: ' '}}
    NAME: {replace: {source: $FOLDED, replace: '[ ,;]+$|,? ([)\]}>])|([(\[{]) ', by: $1$2}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]}>])|([(\[{]) ', by: $1$2}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [annotation]}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: {has: {matches: public}}
---
id: rust-mod
language: rustlang
role: item
symbolType: module
utils:
    public: {kind: visibility_modifier, regex: 'pub', not: {regex: '\('}}
    owner: {pattern: $OWNER}
    enclosing: {any: [{inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item', any: [{has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, matches: owner}}]}}, {kind: 'associated_type, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, function_signature_item, impl_item, let_declaration, macro_definition, macro_invocation, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}]}
    up: {pattern: $UP}
    above: {inside: {stopBy: end, kind: 'delegation_item, function_item, impl_item, mod_item, trait_item', any: [{has: {field: name, matches: up}}, {kind: impl_item, has: {field: type, matches: up}}]}}
    part: {pattern: $PART}
    head: {any: [{kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: head}}, {kind: scoped_type_identifier, has: {field: name, matches: head}}, {matches: part}]}
    facet: {any: [{kind: generic_type, has: {field: type, matches: facet}}, {kind: scoped_type_identifier, has: {field: name, matches: facet}}, {pattern: $FACET}]}
    role-attribute: {kind: attribute_item, has: {kind: attribute, has: {any: [{pattern: cfg}, {pattern: test}, {pattern: non_exhaustive}, {pattern: 'tokio::main'}, {pattern: 'tokio::test'}]}}, pattern: $ROLE}
    role: {any: [{follows: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: role-attribute}}, {not: {kind: source_file}}]}
    conjoined: {all: [{matches: role}, {matches: enclosing}]}
rule:
    kind: mod_item
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
    any: [{not: {has: {field: body, kind: declaration_list}}, has: {field: name, pattern: {context: 'mod $FILED;', selector: identifier}}}, {kind: mod_item}]
    matches: conjoined
rewriters:
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
    - {id: body, rule: {kind: declaration_list, inside: {kind: mod_item, field: body}}, fix: ' '}
    - {id: semi, rule: {kind: identifier}, fix: ';'}
    - {id: role-space, rule: {kind: attribute_item}, fix: ' '}
    - {id: lineage, rule: {any: [{matches: part, inside: {field: name, kind: 'delegation_item, enum_item, function_item, mod_item, struct_item, trait_item, union_item', any: [{matches: above}, {kind: 'delegation_item, enum_item, function_item, mod_item, struct_item, trait_item, union_item'}]}}, {inside: {field: type, kind: impl_item, not: {has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}, any: [{matches: above}, {kind: impl_item}]}, matches: head}]}, transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage, trait-lineage], joinBy: ''}}}, fix: '$ABOVE$PART::'}
    - {id: trait-lineage, rule: {inside: {field: type, kind: impl_item, has: {field: trait, matches: facet}, any: [{matches: above}, {kind: impl_item}]}, matches: head}, transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage, trait-lineage], joinBy: ''}}}, fix: '$ABOVE<$PART as $FACET>::'}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
    QUALIFIED: {rewrite: {source: $OWNER, rewriters: [lineage, trait-lineage], joinBy: ''}}
    QUALIFIER: {replace: {source: $QUALIFIED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    TERM: {rewrite: {source: $FILED, rewriters: [semi]}}
    ROLE_LINE: {replace: {source: $ROLE, replace: '\p{Pattern_White_Space}+', by: ' '}}
    ROLE_SPACE: {rewrite: {source: $ROLE, rewriters: [role-space]}}
name: $QUALIFIER$NAME
signature: $ROLE_LINE$ROLE_SPACE$SIGNATURE$TERM
isExported: {has: {matches: public}}
