# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-untyped-error-swift
language: swiftlang
severity: error
utils:
    text-entry:
        kind: dictionary_literal
        has:
            kind: simple_identifier
            regex: '^NSLocalized(Description|FailureReason(Error)?|RecoverySuggestion(Error)?)Key$'
            precedes: {kind: line_string_literal, stopBy: {pattern: $_}}
rule:
    kind: call_expression
    any:
        - all:
            - has: {nthChild: 1, pattern: $CALLEE, regex: '^((Foundation\.)?NSError(\.init)?|\.init)$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, all: [{has: {kind: value_argument, has: {field: name, regex: '^domain$'}}}, {has: {kind: value_argument, has: {field: name, regex: '^code$'}}}]}}
        - all:
            - has: {nthChild: 1, pattern: $CALLEE, regex: '^(Foundation\.)?((CocoaError|URLError|POSIXError|MachError)(\.init)?|CocoaError\.error)$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^userInfo$'}}, {has: {field: value, matches: text-entry}}]}}}
message: '`$CALLEE` builds an error from a domain, code, or text no Swift case names'
note: 'Build a system error by code (`CocoaError(.<code>)`), else a case of an `enum` conforming to `CustomNSError` or `LocalizedError`'
