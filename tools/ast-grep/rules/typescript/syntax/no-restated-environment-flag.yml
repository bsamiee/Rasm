# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-restated-environment-flag
language: tsx
severity: error
utils:
    # Tool word with the flag its environment variable sets, in one command string, the flag after the tool word at any distance
    dotnet-nologo: {regex: '(?i)\bdotnet\b.*\s(--nologo|--no-logo|-nologo|/nologo)\b'}
    uv-cache-or-python: {regex: '\buv\b.*\s(--cache-dir|--python|-p)(\s|=)'}
    python-pycache: {regex: '\bpython[0-9.]*\b.*\s-X\s*pycache_prefix\b'}
    # Argument array of a process run holding the tool word and the flag as elements, a runner prefix can precede the tool word
    argv-flag:
        any: [{kind: string}, {kind: template_string}]
        inside:
            kind: array
            any:
                - all:
                      - has: {kind: string, regex: '^.dotnet.$'}
                      - has: {pattern: $FLAG, kind: string, regex: '(?i)^.(--nologo|--no-logo|-nologo|/nologo).$'}
                - all:
                      - has: {kind: string, regex: '^.uv.$'}
                      # The value can follow the long flag after an equals sign, a template when it is a path expression
                      - has: {pattern: $FLAG, any: [{kind: string}, {kind: template_string}], regex: '^.(--cache-dir|--python)(=.*)?.$|^.-p.$'}
                - all:
                      - has: {kind: string, regex: '^.python[0-9.]*.$'}
                      - has: {pattern: $FLAG, kind: string, regex: '^.-X.$'}
                      - has: {kind: string, regex: '^.pycache_prefix'}
rule:
    any:
        - kind: template_string
          pattern: $FLAG
          any: [{matches: dotnet-nologo}, {matches: uv-cache-or-python}, {matches: python-pycache}]
        - kind: string
          pattern: $FLAG
          any: [{matches: dotnet-nologo}, {matches: uv-cache-or-python}, {matches: python-pycache}]
        - matches: argv-flag
          pattern: $FLAG
transform:
    # The first flag of the family in the string, after a space, a quote, or the start
    RESTATED:
        replace:
            source: $FLAG
            replace: '(?is)^.*?(?:^|\s|["''`])((?:--|-|/)(?:nologo|no-logo|cache-dir|python|p|X)\b).*$'
            by: '$1'
message: '`$RESTATED` restates a value the process environment of every task sets'
note: >-
    Drop the flag, the `[env]` table of `mise.toml` sets `DOTNET_NOLOGO`, `UV_CACHE_DIR`, `UV_PYTHON`, and `PYTHONPYCACHEPREFIX`
    for every task's process, and a differing value belongs in that table
