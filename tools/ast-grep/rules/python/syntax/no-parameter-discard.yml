# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parameter-discard
language: python
severity: error
rule:
    all:
        - kind: expression_statement
          has: {kind: assignment, pattern: _ = $P, has: {field: right, kind: identifier}}
        - inside:
            kind: function_definition
            stopBy: {matches: python-function-boundary}
            has: {field: parameters, has: {matches: {python-parameter: {name: {pattern: $P}}}}}
message: 'The body discards parameter `$P` with an underscore assignment, the form of a leading underscore on the parameter name'
note: 'A keyword caller passes the renamed parameter under its new name, and a name an external callable contract requires is another form'
