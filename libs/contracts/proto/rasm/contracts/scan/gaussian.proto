syntax = "proto3";

package rasm.contracts.scan;

import "buf/validate/validate.proto";

enum SplatFormat {
  SPLAT_FORMAT_UNSPECIFIED = 0;
  SPLAT_FORMAT_SPZ_V4 = 1;
  SPLAT_FORMAT_SOG_V2 = 2;
}

// Reality-capture splat frame: each channel is one packed float32 block in the format's accessor order;
// `harmonics` leads with its DC triple and `alphas` is the sigmoid-activated opacity column.
message GaussianSplatScan {
  option (buf.validate.message).cel = {
    id: "gaussian_splat_scan.layout"
    message: "packed float32 channel widths must match splat_count and harmonic_degree"
    expression: "this.splat_count > 0u && uint(this.positions.size()) == this.splat_count * 12u && uint(this.scales.size()) == this.splat_count * 12u && uint(this.rotations.size()) == this.splat_count * 16u && uint(this.harmonics.size()) == this.splat_count * (uint(this.harmonic_degree) + 1u) * (uint(this.harmonic_degree) + 1u) * 12u && uint(this.alphas.size()) == this.splat_count * 4u"
  };
  option (buf.validate.message).cel = {
    id: "gaussian_splat_scan.extent"
    message: "packed channels must fit the bounded artifact body"
    expression: "uint(this.positions.size()) + uint(this.scales.size()) + uint(this.rotations.size()) + uint(this.harmonics.size()) + uint(this.alphas.size()) <= 1000000000u"
  };

  SplatFormat format = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bytes positions = 2 [(buf.validate.field).bytes.max_len = 1000000000];
  bytes scales = 3 [(buf.validate.field).bytes.max_len = 1000000000];
  bytes rotations = 4 [(buf.validate.field).bytes.max_len = 1000000000];
  bytes harmonics = 5 [(buf.validate.field).bytes.max_len = 1000000000];
  uint32 harmonic_degree = 6 [(buf.validate.field).uint32.lte = 3];
  uint64 splat_count = 7 [(buf.validate.field).uint64.lte = 4237288];
  bytes alphas = 8 [(buf.validate.field).bytes.max_len = 1000000000];
}
