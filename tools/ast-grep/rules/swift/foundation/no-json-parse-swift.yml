# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-parse-swift
language: swift
severity: error
utils:
    keyed:
        kind: call_expression
        has:
            kind: call_suffix
            nthChild: {position: 1, reverse: true}
            has: {kind: value_arguments, regex: '^\[', has: {kind: value_argument, has: {field: value, kind: line_string_literal}}}
    tag:
        kind: call_expression
        regex: '^\.(string|number|bool)\('
        has:
            kind: call_suffix
            has:
                kind: value_arguments
                has: {kind: value_argument, not: {has: {field: name, kind: value_argument_label}}, has: {field: value, kind: 'line_string_literal, integer_literal, real_literal, boolean_literal'}}
rule:
    pattern: $SITE
    any:
        - kind: call_expression
          has:
            nthChild: 1
            regex: '^(Foundation\.)?(JSONSerialization\.(jsonObject|data)|PropertyListSerialization\.(propertyList|data))$'
        - kind: navigation_expression
          all:
            - has: {field: suffix, has: {field: suffix, regex: '^(string|int|double|bool|array|object|dictionary|number)Value$'}}
            - has: {field: target, matches: keyed}
        - kind: dictionary_literal
          all:
            - has: {field: key, kind: line_string_literal}
            - has: {field: value, kind: 'call_expression, prefix_expression', regex: '^\.(string|number|bool|object|array|null)\b'}
        - kind: as_expression
          has: {field: name, regex: '^(\[String: Any(Object)?\]|\[Any(Object)?\]|NS(Mutable)?(Dictionary|Array))$'}
        - kind: equality_expression
          has: {matches: tag}
        - kind: pattern
          regex: '^\.(string|number|bool)\('
          has: {kind: pattern, has: {kind: 'line_string_literal, integer_literal, real_literal, boolean_literal'}}
message: '`$SITE` reads, matches, or builds a document as an untyped value keyed by string'
note: 'Declare a `Codable` type per document or message with an enum per tag, read it through `JSONDecoder` or `PropertyListDecoder`, and write it through `JSONEncoder` or `PropertyListEncoder`'
