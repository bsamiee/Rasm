# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-present-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    tested:
        kind: is_pattern_expression
        has: {field: expression, pattern: $V}
    guid-present:
        any:
            - pattern: $V != Guid.Empty
            - pattern: Guid.Empty != $V
            - pattern: '!$V.Equals(Guid.Empty)'
            - pattern: '!Guid.Empty.Equals($V)'
            - pattern: $V != default(Guid)
    guid-present-default:
        any:
            - pattern: $V != default
            - pattern: default != $V
    guid-absent:
        any:
            - pattern: $V == Guid.Empty
            - pattern: Guid.Empty == $V
            - pattern: $V.Equals(Guid.Empty)
            - pattern: Guid.Empty.Equals($V)
            - pattern: $V == default(Guid)
    guid-absent-default:
        any:
            - pattern: $V == default
            - pattern: default == $V
    string-present:
        any:
            - pattern: $V != ""
            - pattern: '"" != $V'
            - pattern: $V != string.Empty
            - pattern: string.Empty != $V
            - pattern: '!string.IsNullOrEmpty($V)'
            - matches: tested
              has: {field: pattern, regex: '^\{\s*Length\s*:\s*(>\s*0|not\s+0)\s*\}$'}
    string-present-length:
        any:
            - pattern: $V.Length > 0
            - pattern: $V.Length != 0
            - pattern: 0 < $V.Length
            - pattern: 0 != $V.Length
            - pattern: $V.Length is > 0
            - pattern: $V.Length is not 0
    string-absent:
        any:
            - pattern: $V == ""
            - pattern: '"" == $V'
            - pattern: $V == string.Empty
            - pattern: string.Empty == $V
            - pattern: string.IsNullOrEmpty($V)
            - matches: tested
              has: {field: pattern, regex: '^(null\s+or\s+""|""\s+or\s+null|null\s+or\s+\{\s*Length\s*:\s*0\s*\})$'}
    string-absent-length:
        any:
            - pattern: $V.Length == 0
            - pattern: 0 == $V.Length
            - pattern: $V.Length is 0
    int-present:
        any:
            - pattern: $V >= 0
            - pattern: 0 <= $V
            - pattern: $V > -1
            - pattern: -1 < $V
            - matches: tested
              has: {field: pattern, regex: '^(>=\s*0|>\s*-1|not\s+<\s*0)$'}
    int-absent:
        any:
            - pattern: $V < 0
            - pattern: 0 > $V
            - pattern: $V <= -1
            - pattern: -1 >= $V
            - matches: tested
              has: {field: pattern, regex: '^(<\s*0|<=\s*-1)$'}
    uint-present:
        any:
            - pattern: $V != 0u
            - pattern: 0u != $V
            - pattern: $V > 0u
            - pattern: 0u < $V
            - pattern: $V != 0
            - pattern: 0 != $V
            - pattern: $V > 0
            - pattern: 0 < $V
            - matches: tested
              has: {field: pattern, regex: '^(not\s+0[uU]?|>\s*0[uU]?)$'}
    uint-absent:
        any:
            - pattern: $V == 0u
            - pattern: 0u == $V
            - pattern: $V == 0
            - pattern: 0 == $V
            - matches: tested
              has: {field: pattern, regex: '^0[uU]?$'}
    site:
        any:
            - kind: conditional_expression
            - kind: query_expression
            - kind: invocation_expression
              has: {field: function, has: {field: name, regex: '^(Filter|Where)$'}}
    guid-typed:
        any:
            - has: {stopBy: end, kind: identifier, pattern: $V, matches: {csharp-declared-type: {type: {regex: '^((global::)?System\.)?Guid$'}}}}
            - inside: {stopBy: {matches: site}, matches: site, has: {stopBy: end, kind: generic_name, regex: '^(Some|Option)\s*<\s*((global::)?System\.)?Guid\s*>$'}}
    guid-nullable:
        has:
            stopBy: end
            kind: identifier
            pattern: $V
            matches: {csharp-declared-type: {type: {regex: '^(((global::)?System\.)?Guid\s*\?|((global::)?System\.)?Nullable\s*<\s*((global::)?System\.)?Guid\s*>)$'}}}
    string-typed:
        any:
            - has: {stopBy: end, kind: identifier, pattern: $V, matches: {csharp-declared-type: {type: {regex: '^((global::)?System\.)?(string|String)\s*\??$'}}}}
            - inside: {stopBy: {matches: site}, matches: site, has: {stopBy: end, kind: generic_name, regex: '^(Some|Option)\s*<\s*((global::)?System\.)?(string|String)\s*\??\s*>$'}}
    int-typed:
        any:
            - has: {stopBy: end, kind: identifier, pattern: $V, matches: {csharp-declared-type: {type: {regex: '^((global::)?System\.)?(int|Int32)$'}}}}
            - inside: {stopBy: {matches: site}, matches: site, has: {stopBy: end, kind: generic_name, regex: '^(Some|Option)\s*<\s*((global::)?System\.)?(int|Int32)\s*>$'}}
    uint-typed:
        any:
            - has: {stopBy: end, kind: identifier, pattern: $V, matches: {csharp-declared-type: {type: {regex: '^((global::)?System\.)?(uint|UInt32)$'}}}}
            - inside: {stopBy: {matches: site}, matches: site, has: {stopBy: end, kind: generic_name, regex: '^(Some|Option)\s*<\s*((global::)?System\.)?(uint|UInt32)\s*>$'}}
    negation:
        any:
            - kind: prefix_unary_expression
              regex: '^!'
              has: {kind: parenthesized_expression, pattern: $NEGATED}
            - kind: is_pattern_expression
              all:
                - has: {field: expression, pattern: $NEGATED}
                - has: {field: pattern, regex: '^false$'}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^==$'}
                - has: {field: left, pattern: $NEGATED}
                - has: {field: right, regex: '^false$'}
    present:
        any:
            - all: [{matches: guid-present}, {not: {matches: guid-nullable}}]
            - all: [{matches: guid-present-default}, {matches: guid-typed}]
            - matches: string-present
            - all: [{matches: string-present-length}, {matches: string-typed}]
            - all: [{matches: int-present}, {matches: int-typed}]
            - all: [{matches: uint-present}, {matches: uint-typed}]
            - matches: negation
              has: {stopBy: end, pattern: $NEGATED, any: [{matches: absent}, {kind: parenthesized_expression, has: {matches: absent}}]}
            - kind: parenthesized_expression
              has: {matches: present}
    absent:
        any:
            - all: [{matches: guid-absent}, {not: {matches: guid-nullable}}]
            - all: [{matches: guid-absent-default}, {matches: guid-typed}]
            - matches: string-absent
            - all: [{matches: string-absent-length}, {matches: string-typed}]
            - all: [{matches: int-absent}, {matches: int-typed}]
            - all: [{matches: uint-absent}, {matches: uint-typed}]
            - matches: negation
              has: {stopBy: end, pattern: $NEGATED, any: [{matches: present}, {kind: parenthesized_expression, has: {matches: present}}]}
            - kind: parenthesized_expression
              has: {matches: absent}
    held:
        kind: identifier
        pattern: $FLAG
    held-present:
        matches: held
        inside: {stopBy: end, kind: return_statement, follows: {kind: local_declaration_statement, has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $FLAG}}, {has: {nthChild: {position: 1, reverse: true}, matches: present}}]}}}
    held-absent:
        matches: held
        inside: {stopBy: end, kind: return_statement, follows: {kind: local_declaration_statement, has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $FLAG}}, {has: {nthChild: {position: 1, reverse: true}, matches: absent}}]}}}
    explicit-lift:
        kind: invocation_expression
        all:
            - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?(Some|Optional)(\s*<.+>)?$'}
            - has:
                field: arguments
                all:
                    - has: {kind: argument, nthChild: 1, regex: '^(value\s*:\s*)?[^:]', has: {nthChild: {position: 1, reverse: true}, pattern: $X}}
                    - not: {has: {kind: argument, nthChild: 2}}
    lift:
        any:
            - matches: explicit-lift
            - kind: identifier
              pattern: $X
            - kind: parenthesized_expression
              has: {matches: lift}
    lift-of-value:
        any:
            - matches: explicit-lift
              has: {field: arguments, has: {kind: argument, has: {nthChild: {position: 1, reverse: true}, pattern: $V}}}
            - kind: identifier
              pattern: $V
            - kind: parenthesized_expression
              has: {matches: lift-of-value}
    lifted-query:
        kind: query_expression
        all:
            - has: {kind: from_clause, nthChild: 1, all: [{has: {field: name, pattern: $V}}, {has: {nthChild: {position: 1, reverse: true}, matches: explicit-lift}}]}
            - has: {kind: where_clause, nthChild: 2, has: {matches: present}}
            - has: {kind: select_clause, nthChild: 3, has: {kind: identifier, pattern: $V}}
            - not: {has: {nthChild: 4}}
    ternary:
        kind: conditional_expression
        any:
            - all:
                - has: {field: consequence, matches: lift}
                - has: {field: alternative, matches: csharp-none-value}
                - has: {field: condition, any: [{matches: present}, {matches: held-present}]}
                - has: {field: consequence, matches: lift-of-value}
            - all:
                - has: {field: alternative, matches: lift}
                - has: {field: consequence, matches: csharp-none-value}
                - has: {field: condition, any: [{matches: absent}, {matches: held-absent}]}
                - has: {field: alternative, matches: lift-of-value}
    element:
        any:
            - kind: predefined_type
              regex: '^string$'
            - kind: identifier
              pattern: $ELEMENT
              inside:
                stopBy: end
                kind: compilation_unit
                has:
                    stopBy: end
                    kind: class_declaration, record_declaration
                    has: {field: name, pattern: $ELEMENT}
                    not: {has: {regex: '^struct$'}}
            - kind: qualified_name
              has: {field: name, matches: element}
            - kind: nullable_type
              has: {field: type, matches: element}
    sequence-type:
        any:
            - kind: array_type
              has: {field: type, matches: element}
            - kind: generic_name
              all:
                - has: {kind: identifier, regex: '^(IEnumerable|IReadOnlyList|IReadOnlyCollection|IList|ICollection|List|Seq|Lst|Arr|Iterable)$'}
                - has: {kind: type_argument_list, has: {matches: element}, not: {has: {nthChild: 2}}}
            - kind: nullable_type
              has: {field: type, matches: sequence-type}
    declaration:
        any:
            - kind: parameter
              all:
                - has: {field: type, matches: sequence-type}
                - has: {field: name, pattern: $DECLARED}
            - kind: variable_declaration
              all:
                - has: {field: type, matches: sequence-type}
                - has: {kind: variable_declarator, has: {field: name, pattern: $DECLARED}}
    reference-items:
        any:
            - kind: identifier
              pattern: $DECLARED
              inside:
                stopBy: end
                kind: method_declaration, local_function_statement, lambda_expression, constructor_declaration, accessor_declaration, operator_declaration
                has: {stopBy: end, matches: declaration}
            - kind: parenthesized_expression
              has: {matches: reference-items}
    option:
        any:
            - kind: invocation_expression
              has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?(Optional|Some)(\s*<.+>)?$'}
            - kind: identifier
              pattern: $OPTION
              inside:
                stopBy: end
                kind: method_declaration, local_function_statement, lambda_expression, constructor_declaration, accessor_declaration, operator_declaration
                has:
                    stopBy: end
                    any:
                        - kind: parameter
                          all: [{has: {field: type, regex: '^((global::)?(LanguageExt\.)?)?Option\s*<'}}, {has: {field: name, pattern: $OPTION}}]
                        - kind: variable_declaration
                          all: [{has: {field: type, regex: '^((global::)?(LanguageExt\.)?)?Option\s*<'}}, {has: {kind: variable_declarator, has: {field: name, pattern: $OPTION}}}]
    to-seq:
        regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?toSeq(\s*<.+>)?$'
    empty:
        any:
            - kind: collection_expression
              not: {has: {kind: expression_element}}
            - kind: invocation_expression
              all:
                - has: {field: function, regex: '^((global::)?System\.)?((Linq\.)?Enumerable\s*\.\s*Empty|Array\s*\.\s*Empty)\s*<.+>$'}
                - has: {field: arguments, not: {has: {kind: argument}}}
    items:
        any:
            - kind: invocation_expression
              all:
                - has: {field: function, matches: to-seq}
                - has: {field: arguments, not: {has: {kind: argument, nthChild: 2}}}
                - has: {field: arguments, has: {kind: argument, has: {kind: binary_expression, all: [{has: {field: operator, regex: '^\?\?$'}}, {has: {field: right, matches: empty}}]}}}
                - has: {field: arguments, has: {kind: argument, has: {kind: binary_expression, has: {field: left, pattern: $COALESCED}}}}
            - kind: invocation_expression
              all:
                - has: {field: function, matches: to-seq}
                - has: {field: arguments, not: {has: {kind: argument, nthChild: 2}}}
                - has: {field: arguments, has: {kind: argument, not: {has: {field: name, pattern: $_}}, has: {pattern: $UNWRAPPED}}}
            - pattern: $RECEIVER
              not: {matches: option}
    slot-lambda:
        kind: lambda_expression
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: $SLOT
                    - kind: parameter_list
                      all:
                        - has: {kind: parameter, has: {field: name, pattern: $SLOT}}
                        - not: {has: {kind: parameter, nthChild: 2}}
            - not: {has: {field: type, pattern: $_}}
    slot-lift:
        kind: argument
        any:
            - has: {regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?Optional$'}
            - has:
                matches: slot-lambda
                has:
                    field: body
                    kind: invocation_expression
                    all:
                        - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?Optional(\s*<.+>)?$'}
                        - has: {field: arguments, has: {kind: argument, nthChild: 1, pattern: $SLOT}, not: {has: {kind: argument, nthChild: 2}}}
    null-test:
        any:
            - kind: is_pattern_expression
              all:
                - has: {field: expression, pattern: $SLOT}
                - has: {field: pattern, any: [{regex: '^not\s+null$'}, {regex: '^\{\s*\}$'}]}
            - kind: is_expression
              all:
                - has: {field: left, pattern: $SLOT}
                - has: {field: right, regex: '^((global::)?System\.)?(object|Object)$'}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^!=$'}
                - any:
                    - all: [{has: {field: left, pattern: $SLOT}}, {has: {field: right, kind: null_literal}}]
                    - all: [{has: {field: left, kind: null_literal}}, {has: {field: right, pattern: $SLOT}}]
            - kind: prefix_unary_expression
              all:
                - regex: '^!'
                - has: {kind: parenthesized_expression, has: {kind: is_pattern_expression, all: [{has: {field: expression, pattern: $SLOT}}, {has: {field: pattern, regex: '^null$'}}]}}
            - kind: parenthesized_expression
              has: {matches: null-test}
    receiver:
        any:
            - kind: member_access_expression
              has: {field: expression, matches: items}
            - kind: conditional_access_expression
              has: {field: condition, matches: items}
    slot-read:
        kind: invocation_expression
        any:
            - all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^Somes$'}}
                - has: {field: arguments, not: {has: {kind: argument}}}
                - has:
                    field: function
                    has:
                        field: expression
                        kind: invocation_expression
                        all:
                            - has: {field: function, any: [{kind: member_access_expression, has: {field: name, regex: '^Map$'}}, {kind: conditional_access_expression, has: {kind: member_binding_expression, has: {field: name, regex: '^Map$'}}}]}
                            - has: {field: arguments, all: [{has: {matches: slot-lift}}, {not: {has: {kind: argument, nthChild: 2}}}]}
                            - has: {field: function, matches: receiver}
            - all:
                - has: {field: function, any: [{kind: member_access_expression, has: {field: name, regex: '^Choose$'}}, {kind: conditional_access_expression, has: {kind: member_binding_expression, has: {field: name, regex: '^Choose$'}}}]}
                - has: {field: arguments, all: [{has: {matches: slot-lift}}, {not: {has: {kind: argument, nthChild: 2}}}]}
                - has: {field: function, matches: receiver}
            - all:
                - has: {field: function, any: [{kind: member_access_expression, has: {field: name, regex: '^(Filter|Where)$'}}, {kind: conditional_access_expression, has: {kind: member_binding_expression, has: {field: name, regex: '^(Filter|Where)$'}}}]}
                - has:
                    field: arguments
                    all:
                        - not: {has: {kind: argument, nthChild: 2}}
                        - has: {kind: argument, has: {matches: slot-lambda, has: {field: body, matches: null-test}}}
                - has: {field: function, matches: receiver}
    null-slot-read:
        kind: invocation_expression
        any:
            - all:
                - has: {field: arguments, not: {has: {kind: argument}}}
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Strict$'}}, {has: {field: expression, matches: slot-read}}]}
            - all:
                - matches: slot-read
                - not: {inside: {kind: member_access_expression, field: expression, has: {field: name, regex: '^Strict$'}, inside: {kind: invocation_expression, field: function, has: {field: arguments, not: {has: {kind: argument}}}}}}
rule:
    kind: invocation_expression, conditional_expression, query_expression, return_statement
    all:
        - any:
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    kind: member_access_expression
                    all:
                        - has: {field: name, regex: '^(Filter|Where)$'}
                        - has: {field: expression, matches: explicit-lift}
                - has:
                    field: arguments
                    all:
                        - not: {has: {kind: argument, nthChild: 2}}
                        - has:
                            kind: argument
                            not: {has: {field: name, kind: identifier}}
                            has:
                                kind: lambda_expression
                                all:
                                    - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $V}, {kind: parameter_list, all: [{has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $V}}}, {not: {has: {kind: parameter, nthChild: 2}}}]}]}
                                    - has: {field: body, matches: present}
            - kind: query_expression
              matches: lifted-query
            - kind: conditional_expression
              all:
                - matches: ternary
                - not: {has: {field: condition, kind: identifier}}
            - kind: return_statement
              has: {kind: conditional_expression, matches: ternary, has: {field: condition, kind: identifier}}
            - kind: invocation_expression
              pattern: $READ
              matches: null-slot-read
        - not: {has: {stopBy: end, kind: comment}}
        - not: {inside: {stopBy: end, kind: ERROR}}
        - not: {has: {stopBy: end, kind: ERROR}}
        - not: {matches: {csharp-owner-body: {type: {regex: '^Answers$'}, member: {regex: '^Present$'}}}}
transform:
    OPEN:
        replace:
            source: $FLAG
            replace: '(?s)^.+$'
            by: 'return '
    CLOSE:
        replace:
            source: $FLAG
            replace: '(?s)^.+$'
            by: ';'
    PRESENT:
        replace:
            source: $X
            replace: '(?s)^.+$'
            by: Answers.Present(
    SHUT:
        replace:
            source: $X
            replace: '(?s)^.+$'
            by: )
    SLOTS: {rewrite: {source: $READ, rewriters: [slot-present]}}
rewriters:
    - id: slot-present
      rule: {matches: null-slot-read}
      constraints:
        COALESCED: {matches: reference-items}
        UNWRAPPED: {matches: reference-items}
        RECEIVER: {matches: reference-items}
      fix: Answers.Present($COALESCED$UNWRAPPED$RECEIVER)
fix:
    template: $OPEN$PRESENT$X$SHUT$CLOSE$SLOTS
    expandStart: {kind: local_declaration_statement}
message: Sentinel or null test on `$X$COALESCED$UNWRAPPED$RECEIVER` rebuilds `Answers.Present` by hand
note: Use `Answers.Present(<value or items>)`, `Present` filters each empty, negative, zero, and null host answer
