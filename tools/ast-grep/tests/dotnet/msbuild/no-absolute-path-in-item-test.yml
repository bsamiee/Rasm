id: no-absolute-path-in-item
valid:
    - |
      <Import Project="$(MSBuildThisFileDirectory)eng/custom.props" Condition="Exists('$(MSBuildThisFileDirectory)eng/custom.props')" />
    - |
      <Reference Include="RhinoCommon" HintPath="$(RhinoAssemblyDirectory)RhinoCommon.dll" Private="false" />
    - |
      <ProjectReference Include="../Item/Item.csproj" />
    - |
      <Folder Name="/libs/dotnet/" />
    - |
      <None Include="$(StageRoot)runtimes/**" Pack="true" PackagePath="runtimes/" />
    - |
      <PropertyGroup><Path>/usr/local/bin</Path></PropertyGroup>
    - |
      <Exec Command="/usr/bin/codesign --sign - $(TargetPath)" />
    - |
      <None Include="./item.txt" />
invalid:
    - |
      <Reference Include='Tool' HintPath='C:\tools\mytool\mytool.dll' />
    - |
      <Reference Include="Tool"><HintPath>C:\tools\mytool\mytool.dll</HintPath></Reference>
    - |
      <Reference Include="Tool" HintPath="C:\tools\mytool\mytool.dll" Private="false" />
    - |
      <None Include="/usr/local/share/data.bin" CopyToOutputDirectory="PreserveNewest" />
    - |
      <Import Project="/Users/someone/build/common.props" />
    - |
      <Reference Include="Newtonsoft.Json" HintPath="~/.nuget/packages/newtonsoft.json/13.0.3/lib/netstandard2.0/Newtonsoft.Json.dll" />
    - |
      <Project Path="/Users/someone/checkout/libs/Item/Item.csproj" />
    - |
      <Compile Include="/srv/generated/Bindings.cs" />
    - |
      <Exec Command="build" WorkingDirectory="/opt/tool" />
    - |
      <Compile Include="C:/src/item.cs" />
    - |
      <Copy SourceFiles="~/item.txt" DestinationFolder="$(OutDir)" />
    - |
      <Reference Include="Tool"><HintPath>/usr/lib/tool.dll</HintPath></Reference>
