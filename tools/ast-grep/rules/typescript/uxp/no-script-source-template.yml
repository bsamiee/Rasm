# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsx
severity: error
utils:
    built-source:
        pattern: $SOURCE
        any:
            - matches: typescript-built-text
            - matches: { typescript-constant-value: { value: { matches: typescript-built-text } } }
rule:
    kind: call_expression
    all:
        - has: { field: function, kind: member_expression, pattern: $CALLEE, has: { field: property, regex: '^doScript$' } }
        - has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { kind: 'comment, html_comment' } } }, matches: built-source } }
        - inside: { kind: program, stopBy: end, matches: { typescript-module-importer: { module: { regex: '^(adobe:)?indesign$' } } } }
message: '`$CALLEE` runs a script source built from values'
note: 'Pass constant source to `doScript` with values in `withArguments`, read through script arguments'
