# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    string-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)String$'}}}
    array-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)Array$'}}}
    fixed-regex:
        kind: regex
        all:
            - has: {field: flags, all: [{regex: 'g'}, {regex: '^[dgmsuv]+$'}]}
            - has: {field: pattern, regex: '^(?:[^\\^$.*+?()\[\]{}|/]|\\[\\^$.*+?()\[\]{}|/nrtfv])+$'}
    separator:
        kind: string
        has: {kind: 'string_fragment, escape_sequence'}
    native-split:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^split$'}}, {not: {has: {field: object, matches: string-module}}}]}
            - has: {field: function, pattern: $_SF}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, matches: separator, pattern: $_A}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
    module-split:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^split$'}}, {has: {field: object, matches: string-module}}]}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $_S}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: separator, pattern: $_A}}, {not: {has: {nthChild: {position: 3, ofRule: *code}}}}]}
    piped-split:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^split$'}}, {has: {field: object, matches: string-module}}]}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: separator}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
    piped-join:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^join$'}}, {has: {field: object, matches: array-module}}]}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
    joined-split:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^join$'}}, {has: {field: object, any: [{matches: native-split}, {matches: module-split}]}}]}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, pattern: $_T}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^join$'}}, {has: {field: object, matches: array-module}}]}
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, any: [{matches: native-split}, {matches: module-split}]}}, {has: {nthChild: {position: 2, ofRule: *code}, pattern: $_T}}, {not: {has: {nthChild: {position: 3, ofRule: *code}}}}]}
rule:
    kind: call_expression
    pattern: $CALL
    any:
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(replace|replaceAll)$'}}, {not: {has: {field: object, matches: string-module}}}]}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: fixed-regex}}, {has: {nthChild: {position: 2, ofRule: *code}}}, {not: {has: {nthChild: {position: 3, ofRule: *code}}}}]}
            - not: {has: {field: arguments, matches: typescript-separator-swap}}
        - all:
            - matches: joined-split
            - not: {matches: typescript-separator-swap}
        - all:
            - matches: piped-split
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|\.)(pipe|flow|compose)$'}}}
            - precedes: {stopBy: {not: {regex: '^,$'}}, matches: piped-join}
    not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
transform:
    HEAD: {replace: {source: $CALL, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$HEAD` replaces a fixed string through a regular expression or `split` and `join`'
note: 'Call `<text>.replaceAll(<search>, <replacement>)`, or `String.replaceAll(<search>, <replacement>)` inside a pipe'
