# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-dirname-substitution
language: bash
severity: error
ignores: ["**/*.json"]
utils:
    literal-path:
        kind: word, string, raw_string
        regex: '^["'']?/?[A-Za-z0-9_.][A-Za-z0-9_.-]*(/[A-Za-z0-9_.-]+)*["'']?$'
rule:
    kind: command_substitution
    has:
        kind: command
        all:
            - has: {field: name, regex: "^(dirname|basename)$", pattern: $CMD}
            - has: {pattern: $PATH, matches: literal-path, nthChild: {position: 1, reverse: true}}
            - not: {has: {nthChild: 2, not: {any: [{pattern: $PATH}, {regex: '^--$'}]}}}
            - not: {has: {nthChild: 4}}
    not:
        any:
            - has: {nthChild: 2}
            - inside: {kind: command_name, stopBy: end}
rewriters:
    - id: basename
      rule:
        pattern: $PATH
        inside: {kind: command, has: {field: name, regex: "^basename$"}}
      transform:
        TEXT: {replace: {source: $PATH, replace: '^["'']|["'']$', by: ""}}
        COMPONENT: replace($TEXT, replace='^.*/', by='')
      fix: $COMPONENT
    - id: dirname
      rule: {pattern: $PATH}
      transform:
        TEXT: {replace: {source: $PATH, replace: '^["'']|["'']$', by: ""}}
        CURRENT: replace($TEXT, replace='^[^/]+$', by='.')
        DIRECTORY: replace($CURRENT, replace='/[^/]+$', by='')
        COMPONENT: replace($DIRECTORY, replace='^$', by='/')
      fix: $COMPONENT
transform:
    RESULT: rewrite($PATH, rewriters=[basename, dirname])
fix: $RESULT
message: "`$CMD` computes a literal path component at runtime"
note: Write the literal component directly, a variable path keeps the command for its trailing-slash, root, and slash-free behavior
