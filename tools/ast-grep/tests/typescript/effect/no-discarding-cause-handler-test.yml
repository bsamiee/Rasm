id: no-discarding-cause-handler
valid:
    # Recovery by tag
    - "const held = Effect.catchTag(work, 'LoadError', () => Effect.succeed(false));"
    # Cause logged before the discard
    - 'const held = Effect.ignore(Effect.tapErrorCause(work, (cause) => Console.error(Cause.pretty(cause))));'
    # Cause handler that reads the cause
    - 'const held = Effect.catchAllCause(work, (cause) => Effect.fail(Cause.squash(cause)));'
    # Defect handler that runs an operation
    - 'const held = Effect.catchAllDefect(work, () => reload(path));'
    # Typed failure handler with a lifted value on Effect, the sibling no-discarding-catch-all fixes it
    - 'const held = Effect.catchAll(work, () => Effect.succeed(false));'
    # Typed failure handler with a lifted value on Stream, the sibling fixes it
    - 'const held = Stream.catchAll(stream, () => Stream.succeed(false));'
    # Cause handler with a block body holding a statement before the return
    - 'const held = Effect.catchAllCause(work, () => { report(); return Effect.void; });'
    # Cause handler on a module outside the carrier set
    - 'const held = Item.catchAllCause(item, () => Item.void);'
    # Handler under a read parameter name
    - 'const held = Effect.catchAllCause(work, (cause) => Effect.succeed(fallback));'
    # Recovery by tag with a void answer
    - "const held = Effect.catchTag(work, 'LoadError', () => Effect.void);"
    # Handler answering another effect constant, Effect.interrupt runs an operation
    - 'const held = Effect.catchAllCause(work, () => Effect.interrupt);'
    # Block handler with a lifted value on Effect, the sibling fixes it
    - 'const held = Effect.catchAll(work, () => { return Effect.succeed(false); });'
invalid:
    # The instance, every cause swallowed into a constant
    - 'const held = Effect.catchAllCause(work, () => Effect.succeed(false));'
    # Void handler on the typed failure, the success value stays beside the void
    - 'const held = Effect.catchAll(work, () => Effect.void);'
    # Defect handler answering void
    - 'const held = Effect.catchAllDefect(work, () => Effect.void);'
    # Data-last cause handler as a pipe step
    - 'const held = work.pipe(Effect.catchAllCause(() => Effect.succeed(false)));'
    # Cause handler with a block body holding the one return
    - 'const held = Effect.catchAllCause(work, () => { return Effect.void; });'
    # Function expression handler
    - 'const held = Effect.catchAllCause(work, function () { return Effect.void; });'
    # Handler with an underscore parameter
    - 'const held = Effect.catchAllCause(work, (_cause) => Effect.void);'
    # Micro sibling
    - 'const held = Micro.catchAllCause(work, () => Micro.void);'
    # Stream sibling
    - 'const held = Stream.catchAllCause(stream, () => Stream.succeed(false));'
    # Layer failure handler, no orElseSucceed on the module
    - 'const held = Layer.catchAll(layer, () => Layer.succeed(Service, fallback));'
    # Layer cause handler
    - 'const held = Layer.catchAllCause(layer, () => Layer.succeed(Service, fallback));'
    # Channel failure handler
    - 'const held = Channel.catchAll(channel, () => Channel.void);'
    # Channel cause handler
    - 'const held = Channel.catchAllCause(channel, () => Channel.void);'
    # Micro void handler on the typed failure
    - 'const held = Micro.catchAll(work, () => Micro.void);'
    # STM void handler on the typed failure
    - 'const held = STM.catchAll(transaction, () => STM.void);'
