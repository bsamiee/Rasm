    "ifctester; python_version<'3.15'",                   # [GEOMETRY]: IDS validation over IFC models; ifcopenshell-gated
    "ladybug-comfort",                                    # [GEOMETRY]: comfort-model calculations
    "ladybug-core",                                       # [GEOMETRY]: Ladybug weather, units, analysis-period, and location primitives
