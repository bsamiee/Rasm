# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: call_expression
    pattern: $DATE
    has:
        field: function
        kind: member_expression
        all:
            - has: {field: property, regex: '^(parse|UTC)$'}
            - has: {field: object, regex: '^((globalThis|window|self)\.)?Date$'}
        matches: typescript-global-reference
message: '`$DATE` returns `NaN` on invalid input'
note: 'Call `DateTime.make(<input>)` for `Option.none()` on invalid input'
