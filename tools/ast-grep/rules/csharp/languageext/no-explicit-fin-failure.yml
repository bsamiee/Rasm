# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-explicit-fin-failure
language: csharp
severity: error
utils:
    fin-type:
        matches: {csharp-type-name: {name: {regex: '^Fin$'}}}
        not: {has: {stopBy: end, kind: type_argument_list, has: {matches: {csharp-type-name: {name: {regex: '^(Error|Expected|Exceptional)$'}}}}}}
    fin-target:
        inside:
            stopBy: {not: {kind: 'conditional_expression, switch_expression_arm, switch_expression, parenthesized_expression'}}
            any:
                - kind: arrow_expression_clause
                  inside:
                    any:
                        - {kind: method_declaration, has: {field: returns, matches: fin-type}}
                        - {kind: 'local_function_statement, property_declaration', has: {field: type, matches: fin-type}}
                - kind: return_statement
                  inside:
                    stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, anonymous_method_expression, accessor_declaration'}
                    any:
                        - {kind: method_declaration, has: {field: returns, matches: fin-type}}
                        - {kind: local_function_statement, has: {field: type, matches: fin-type}}
                - kind: variable_declarator
                  inside: {kind: variable_declaration, has: {field: type, matches: fin-type}}
rule:
    any:
        - kind: invocation_expression
          pattern: $LIFT
          all:
            - has:
                field: function
                any:
                    - matches: {csharp-owner-member: {type: {regex: '^Fin$'}, member: {regex: '^Fail$'}}}
                    - matches: {csharp-type-name: {name: {regex: '^FinFail$'}}}
            - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, not: {has: {field: name, pattern: $_}}, has: {pattern: $ERROR}}}, {not: {has: {kind: argument, nthChild: 2}}}]}
            - matches: fin-target
        - kind: cast_expression
          pattern: $LIFT
          all:
            - has: {field: type, matches: {csharp-type-name: {name: {regex: '^Error$'}}}}
            - has: {field: value, pattern: $ERROR}
            - matches: fin-target
fix: $ERROR
message: '`$LIFT` restates the conversion from `Error` to the declared `Fin` the position receives'
note: Write the error alone, `Error` and each `Expected` record convert to `Fin<T>` where a declared return or local fixes the type, a lambda body or argument keeps `Fin.Fail<T>` for inference
