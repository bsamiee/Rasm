# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-dwg"
edition.workspace = true
description       = "DWG and DXF reading and writing under a caller audit policy, with conversion to and from the rasm-drawing model"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
stacksafe            = { workspace = true, optional = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true, optional = true }
derive-where         = { workspace = true }
derive_more          = { workspace = true }
strum                = { workspace = true }
itertools            = { workspace = true, optional = true }
uom                  = { workspace = true }
acadrust             = { workspace = true }
color                = { workspace = true, optional = true }
parlance             = { workspace = true, optional = true }
kurbo                = { workspace = true, optional = true }
linesweeper          = { workspace = true, optional = true }
rasm-drawing         = { workspace = true, optional = true }

# --- [FEATURES] -------------------------------------------------------------------------

[features]
default = ["drawing"]
drawing = ["dep:stacksafe", "dep:validated", "dep:itertools", "dep:color", "dep:parlance", "dep:kurbo", "dep:linesweeper", "dep:rasm-drawing"]

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
