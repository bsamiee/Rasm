# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    sql-text:
        kind: 'string_literal, raw_string_literal'
        any:
            - regex: |-
                (?x)^r?\#*"\p{Pattern_White_Space}*(
                    SELECT\p{Pattern_White_Space}|INSERT\p{Pattern_White_Space}+(OR\p{Pattern_White_Space}+\p{XID_Continue}+\p{Pattern_White_Space}+)?INTO\p{Pattern_White_Space}|REPLACE\p{Pattern_White_Space}+INTO\p{Pattern_White_Space}|UPDATE\p{Pattern_White_Space}+\P{Pattern_White_Space}+\p{Pattern_White_Space}+SET\p{Pattern_White_Space}|DELETE\p{Pattern_White_Space}+FROM\p{Pattern_White_Space}|WITH\p{Pattern_White_Space}+(RECURSIVE\p{Pattern_White_Space}+)?\P{Pattern_White_Space}+\p{Pattern_White_Space}+AS\p{Pattern_White_Space}
                    |CREATE\p{Pattern_White_Space}+(UNIQUE\p{Pattern_White_Space}+)?(TABLE|INDEX|VIEW)\p{Pattern_White_Space}|ALTER\p{Pattern_White_Space}+TABLE\p{Pattern_White_Space}|DROP\p{Pattern_White_Space}+(TABLE|INDEX|VIEW)\p{Pattern_White_Space}|PRAGMA\p{Pattern_White_Space}
                    |select\p{Pattern_White_Space}[^"]*(?-u:\b)from\p{Pattern_White_Space}|insert\p{Pattern_White_Space}+(or\p{Pattern_White_Space}+\p{XID_Continue}+\p{Pattern_White_Space}+)?into\p{Pattern_White_Space}|update\p{Pattern_White_Space}+\P{Pattern_White_Space}+\p{Pattern_White_Space}+set\p{Pattern_White_Space}|delete\p{Pattern_White_Space}+from\p{Pattern_White_Space}|with\p{Pattern_White_Space}+(recursive\p{Pattern_White_Space}+)?\P{Pattern_White_Space}+\p{Pattern_White_Space}+as\p{Pattern_White_Space}*\(
                )
            - regex: '(?-u:\b)(WHERE|AND|OR|SET|VALUES|IN|LIKE|HAVING)(?-u:\b)[^"]*''\{[^{}]*\}'''
rule:
    kind: 'macro_invocation, binary_expression, compound_assignment_expr, call_expression'
    all:
        - {matches: {rust-text-assembly: {text: {kind: &literal 'string_literal, raw_string_literal', matches: sql-text}, head: {kind: *literal, matches: sql-text}}}}
        - {pattern: $SQL}
message: '`$SQL` interpolates values into SQL text'
note: 'Bind each value through `sqlx::query!` for a fixed statement, `sea_query` for a varying one, `sqlx::QueryBuilder::push_bind` for a value list'
