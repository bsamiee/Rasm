# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-declared-type
language: csharplang
arguments: [type]
rule:
    kind: identifier
    pattern: {context: 'class $DECLARED;', selector: identifier}
    inside:
        stopBy: end
        any:
            - kind: method_declaration, local_function_statement, lambda_expression, anonymous_method_expression, constructor_declaration, operator_declaration, conversion_operator_declaration, indexer_declaration, class_declaration, record_declaration, struct_declaration
              has:
                kind: parameter_list, bracketed_parameter_list
                has:
                    kind: parameter
                    all:
                        - has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}
                        - has: {field: type, matches: type}
            - kind: block, switch_section
              has:
                kind: local_declaration_statement
                has:
                    kind: variable_declaration
                    all:
                        - has: {field: type, matches: type}
                        - has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}}
            - kind: block, switch_section
              has:
                stopBy: {kind: 'block, lambda_expression, anonymous_method_expression, local_function_statement'}
                kind: declaration_expression, declaration_pattern
                all:
                    - has: {field: type, matches: type}
                    - has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}
            - kind: foreach_statement
              all:
                - has: {field: type, matches: type}
                - has: {field: left, pattern: {context: 'class $DECLARED;', selector: identifier}}
            - kind: catch_clause
              has:
                kind: catch_declaration
                all:
                    - has: {field: type, matches: type}
                    - has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}
