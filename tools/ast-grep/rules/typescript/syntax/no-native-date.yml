# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-date
language: tsx
severity: error
rule:
    any:
        - kind: new_expression
          all:
            - has: {field: constructor, regex: '^(globalThis\.)?Date$', matches: syntax-global-reference}
            - has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}
        - kind: call_expression
          has: {field: function, regex: '^(globalThis\.)?Date\.(parse|UTC)$', matches: syntax-global-reference}
message: 'The time value is built through the native Date, the form of `DateTime.make` at the boundary'
note: '`DateTime.unsafeMake` takes an input with established validity'
