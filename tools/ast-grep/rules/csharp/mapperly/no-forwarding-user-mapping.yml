# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-user-mapping
language: csharp
severity: error
utils:
    forward:
        any:
            - pattern: $OWNER.$MEMBER($SOURCE)
              has: {field: function, pattern: $CALLEE}
              not: {has: {field: function, matches: csharp-throwing-factory}}
            - pattern: $MEMBER($SOURCE)
              has: {field: function, pattern: $CALLEE}
              inside:
                stopBy: end
                kind: declaration_list
                has:
                    kind: method_declaration
                    all:
                        - has: {field: name, pattern: $MEMBER}
                        - not: {has: {field: name, pattern: $NAME}}
rule:
    kind: method_declaration
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: parameters, has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $SOURCE}}, not: {has: {kind: parameter, nthChild: 2}}}
        - has:
            field: body
            any:
                - kind: arrow_expression_clause
                  has: {matches: forward}
                - kind: block
                  has: {kind: return_statement, nthChild: 1, has: {matches: forward}}
                  not: {has: {nthChild: 2}}
        - not: {has: {kind: modifier, regex: '^partial$'}}
        - matches: csharp-mapping-method
constraints:
    OWNER: {regex: '^(global::)?(@?[A-Z]\w*(<.+>)?\.)*@?[A-Z]\w*(<.+>)?$'}
message: 'Mapping method `$NAME` passes `$SOURCE` to `$CALLEE` unchanged'
note: 'Reference the owner member directly through its `[UserMapping]` with `[UseStaticMapper(typeof(<owner>))]` or through `Use = nameof(@<owner>.<member>)`, and delete the forwarding method'
