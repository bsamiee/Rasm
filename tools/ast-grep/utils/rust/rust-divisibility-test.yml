# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-divisibility-test
language: rustlang
arguments: [dividend, divisor]
utils:
    zero:
        kind: integer_literal
        regex: '^0(_?[iu](8|16|32|64|128|size))?$'
    remainder:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^%$'}
                - has: {field: right, matches: divisor}
                - has: {field: left, matches: dividend}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^(rem_euclid|wrapping_rem|strict_rem)$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: divisor}, not: {has: {nthChild: 2}}}
                - has: {field: function, has: {field: value, matches: dividend}}
rule:
    any:
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^(==|!=)$'}
            - any:
                - all: [{has: {field: right, matches: zero}}, {has: {field: left, matches: remainder}}]
                - all: [{has: {field: left, matches: zero}}, {has: {field: right, matches: remainder}}]
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^is_multiple_of$'}}
            - has: {field: arguments, has: {nthChild: 1, matches: divisor}, not: {has: {nthChild: 2}}}
            - has: {field: function, has: {field: value, matches: dividend}}
