# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-typed-parameter
language: pythonlang
arguments: [type]
utils:
    parameter:
        kind: typed_parameter, typed_default_parameter
        all:
            - any: [{has: {kind: identifier, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, pattern: $PARAMETER}}, {has: {field: name, pattern: $PARAMETER}}]
            - has: {field: type, matches: type}
    binding:
        kind: 'identifier, typed_parameter, list_splat_pattern, dictionary_splat_pattern, default_parameter, typed_default_parameter, assignment, augmented_assignment, for_statement, for_in_clause, named_expression, as_pattern, function_definition, class_definition, type_alias_statement, delete_statement, global_statement, aliased_import, dotted_name'
        any:
            - matches: {python-binding: {name: {pattern: $PARAMETER}}}
            - kind: global_statement
              has: {kind: identifier, pattern: $PARAMETER}
            - kind: aliased_import
              has: {field: alias, pattern: $PARAMETER}
            - kind: dotted_name
              pattern: $PARAMETER
              any:
                - inside: {kind: import_statement}
                - inside: {kind: import_from_statement}
                  not: {inside: {kind: import_from_statement, field: module_name}}
    bound:
        has:
            stopBy: {kind: 'function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
            matches: binding
    enclosing-scope:
        any:
            - inside:
                kind: for_in_clause
                not: &preceding-iterable {follows: {kind: for_in_clause, stopBy: end}}
                field: right
                stopBy: &scope {kind: 'function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
                inside:
                    kind: list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
                    not: {inside: {kind: lambda, field: body, matches: bound}}
                    matches: enclosing-scope
            - not: {inside: {kind: for_in_clause, not: *preceding-iterable, field: right, stopBy: *scope}}
              inside:
                any: &lexical-scope
                    - kind: block
                      inside: {kind: function_definition}
                    - inside: {kind: lambda, field: body}
                    - kind: list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
                stopBy: {any: *lexical-scope}
                all: [{matches: parameter-scope}]
    parameter-scope:
        any:
            - kind: block
              inside:
                kind: function_definition
                any:
                    - all:
                        - has: {field: parameters, has: {matches: parameter}}
                        - not:
                            has:
                                field: body
                                has: {stopBy: *scope, matches: binding}
                    - all: [{not: {matches: bound}}, {matches: enclosing-scope}]
            - inside:
                kind: lambda
                field: body
                not: {matches: bound}
                matches: enclosing-scope
            - kind: list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
              not: {matches: bound}
              matches: enclosing-scope
rule:
    kind: identifier
    all:
        - pattern: $PARAMETER
        - not:
            any:
                - matches: {python-binding: {name: {pattern: $PARAMETER}}}
                - nthChild: {position: 1, ofRule: {not: {kind: comment}}}
                  inside: {kind: 'typed_parameter, list_splat_pattern, dictionary_splat_pattern'}
                - inside: {kind: 'default_parameter, typed_default_parameter', field: name}
                - inside: {kind: 'assignment, augmented_assignment, for_statement, for_in_clause', field: left}
                - inside: {kind: 'named_expression, function_definition', field: name}
                - inside:
                    kind: type
                    stopBy: {not: {kind: generic_type}}
                    inside: {kind: type_alias_statement, field: left}
                - inside: {kind: delete_statement, stopBy: {kind: 'attribute, subscript'}}
                - inside: {kind: attribute, field: attribute}
                - inside: {kind: keyword_argument, field: name}
                - inside: {kind: 'import_statement, import_from_statement, global_statement, nonlocal_statement', stopBy: end}
        - any:
            - all: [{any: *lexical-scope}, {matches: parameter-scope}]
            - all: [{not: {any: *lexical-scope}}, {matches: enclosing-scope}]
        - not:
            inside:
                kind: class_definition
                stopBy: {any: [{any: *lexical-scope}, {kind: class_definition}]}
                matches: bound
