id: no-destination-folder-over-glob
valid:
    # The tree kept through a DestinationFiles transform
    - |
      <Copy SourceFiles="@(Asset)" DestinationFiles="@(Asset->'$(IntermediateOutputPath)assets/%(RecursiveDir)%(Filename)%(Extension)')" />
    # Flat file list into one folder
    - |
      <Copy SourceFiles="$(StageRoot)manifest.yml" DestinationFolder="$(IntermediateOutputPath)stage/" />
    # One-level glob, no tree to keep
    - |
      <Copy SourceFiles="$(StageRoot)*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
    # Item holding the parameters as metadata, nothing copies
    - |
      <ItemGroup><_Stage Include="native" SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
        </ItemGroup>
invalid:
    # Recursive glob flattened into one folder
    - |
      <Copy SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
    # Move flattening the tree the same way
    - |
      <Move SourceFiles="$(StageRoot)runtimes/**/*.dylib" DestinationFolder="$(IntermediateOutputPath)native/" />
