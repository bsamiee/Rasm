# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-output-separator
language: swiftlang
severity: error
rule:
    kind: call_expression
    pattern: $READ
    all:
        - has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^strings$'}}}
        - has:
            kind: call_suffix
            has:
                kind: value_arguments
                not:
                    all:
                        - has: {kind: value_argument, has: {field: name, regex: '^separatedBy$'}}
                        - has: {kind: value_argument, has: {field: name, regex: '^bufferingPolicy$'}}
        - inside: {kind: source_file, stopBy: end, has: {kind: import_declaration, regex: '^import\s+Subprocess$'}}
        - not: {inside: {stopBy: {kind: for_statement}, matches: swift-output-discarding-loop}}
message: '`$READ` reads child output under the default separator set and 128 KiB line limit'
note: 'Pass the protocol''s separator and limit as `separatedBy:` and `bufferingPolicy:`, `.unicodeScalarSequence(["\n"])` and `.unbounded` for a newline-delimited stream'
