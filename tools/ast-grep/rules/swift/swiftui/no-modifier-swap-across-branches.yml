# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-modifier-swap-across-branches
language: swift
severity: error
utils:
    action-call:
        kind: call_expression
        has:
            kind: call_suffix
            any:
                - has: {kind: lambda_literal}
                - has:
                    kind: value_arguments
                    has:
                        kind: value_argument
                        any:
                            - has: {field: value, kind: lambda_literal}
                            - has: {field: name, regex: '^action$'}
    call-arm:
        matches: {swift-single-statement: {first: {pattern: '$VIEW($$$)', not: {matches: action-call}}}}
    modified-arm:
        kind: statements
        matches:
            swift-single-statement:
                first:
                    kind: call_expression
                    has:
                        nthChild: 1
                        kind: navigation_expression
                        all:
                            - has: {field: target, pattern: $VIEW}
                            - not: {has: {field: suffix, regex: '^\.alignmentGuide$'}}
    plain-arm:
        kind: statements
        matches: {swift-single-statement: {first: {pattern: $VIEW}}}
rule:
    any:
        - pattern: 'if $C { $VIEW($$$A) } else { $VIEW($$$B) }'
          all:
            - not: {pattern: 'if $C { $E } else { $E }'}
            - not: {has: {kind: statements, has: {matches: action-call}}}
        - kind: if_statement
          all:
            - not: {has: {kind: if_statement}}
            - has: {matches: modified-arm}
            - has: {matches: plain-arm}
        - kind: switch_statement
          all:
            - has: {kind: switch_entry, has: {matches: call-arm, pattern: $FIRST}}
            - has: {kind: switch_entry, has: {matches: call-arm, not: {pattern: $FIRST}}}
            - not: {has: {kind: switch_entry, not: {has: {matches: call-arm}}}}
    inside: {matches: swift-view-builder, stopBy: end}
message: '`$VIEW` takes other arguments or modifiers per branch and resets its state at every condition change'
note: 'Keep one `<view>` and pass the branch condition as a modifier or argument value (`.tint`, `.disabled`, `.opacity`, a ternary argument), each per-branch view holds its own identity'
