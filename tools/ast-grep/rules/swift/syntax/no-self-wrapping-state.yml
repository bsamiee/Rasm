# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-self-wrapping-state
language: swiftlang
severity: error
utils:
    wrap:
        kind: call_expression
        all:
            - has:
                nthChild: 1
                any:
                    - {kind: prefix_expression, has: {field: target, pattern: $CASE}}
                    - {kind: navigation_expression, has: {field: suffix, has: {field: suffix, pattern: $CASE}}}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {stopBy: end, kind: simple_identifier, pattern: $STATE}}}
    equality:
        any:
            - kind: equality_expression
            - {kind: infix_expression, has: {field: op, regex: '^[!=]=$'}}
    fixpoint:
        kind: 'while_statement, repeat_while_statement'
        has: {stopBy: end, matches: equality, has: {kind: simple_identifier, pattern: $STATE}}
    recursive-case:
        kind: simple_identifier
        pattern: $CASE
        all:
            - inside: {kind: enum_entry, inside: {kind: enum_class_body, inside: {kind: class_declaration, has: {field: name, pattern: $OWNER}}}}
            - precedes:
                kind: enum_type_parameters
                has:
                    stopBy: end
                    kind: user_type
                    has: {kind: type_identifier, pattern: $OWNER}
                    not: {has: {kind: type_identifier, nthChild: 2}}
    fixpoint-next:
        kind: 'while_statement, repeat_while_statement'
        has: {stopBy: end, matches: equality, has: {kind: simple_identifier, any: [{pattern: $STATE}, {pattern: $NEXT}]}}
rule:
    any:
        - kind: assignment
          all:
            - has: {field: operator, regex: '^=$'}
            - has: {field: target, has: {kind: simple_identifier, pattern: $STATE}}
            - has: {field: result, matches: wrap}
            - inside: {stopBy: {matches: swift-function-scope}, matches: fixpoint}
        - kind: property_declaration
          all:
            - has: {field: name, has: {field: bound_identifier, pattern: $NEXT}}
            - inside:
                kind: statements
                has: {kind: assignment, all: [{has: {field: operator, regex: '^=$'}}, {has: {field: target, has: {kind: simple_identifier, pattern: $STATE}}}, {has: {field: result, kind: simple_identifier, pattern: $NEXT}}]}
            - has: {field: value, matches: wrap}
            - inside: {stopBy: {matches: swift-function-scope}, matches: fixpoint-next}
    inside:
        kind: source_file
        stopBy: end
        has: {stopBy: end, matches: recursive-case}
message: 'Each pass nests `$STATE` inside `.$CASE`, the loop waiting for `$STATE` to stop changing never ends'
note: 'Map each pass into a finite lattice, joining the parts (`union`, `formUnion`, the set of roots) or wrapping only a value holding no earlier wrap'
