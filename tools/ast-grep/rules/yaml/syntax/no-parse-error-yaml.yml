# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yaml
severity: error
utils:
    in-error:
        inside: {kind: ERROR, stopBy: end}
    opening:
        any:
            - has: {stopBy: end, all: [{not: {has: {pattern: $$_}}}, {not: {regex: '^$'}}, {pattern: $$TOKEN}]}
            - pattern: $$TOKEN
rule:
    any:
        - kind: ERROR
          all:
            - not: {matches: in-error}
            - matches: opening
        - kind: stream
          has:
            stopBy: end
            all:
                - regex: '^$'
                - pattern: $$MISSING
                - not: {matches: in-error}
                - inside: {matches: opening}
labels:
    TOKEN: {style: primary, message: Opens the span}
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: '`$TOKEN` opens a span the grammar failed to parse'
note: Write a form tree-sitter-yaml parses
