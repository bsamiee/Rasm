syntax = "proto3";

package rasm.contracts.compute;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "rasm/contracts/artifact/artifact.proto";
import "rasm/contracts/geometry/tessellation.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

// What the durable tier did with this unit: a bound lane that landed both objects, found byte-identical existing
// objects, answered from a prior result with no kernel run, refused, or had no lane bound at all.
enum Spill {
  SPILL_UNSPECIFIED = 0;
  SPILL_UNBOUND = 1;
  SPILL_LANDED = 2;
  SPILL_REPLAYED = 3;
  SPILL_REFUSED = 4;
  SPILL_MATCHED = 5;
}

enum GeomSetting {
  GEOM_SETTING_UNSPECIFIED = 0;
  GEOM_SETTING_WELD = 1;
  GEOM_SETTING_WORLD_COORDS = 2;
  GEOM_SETTING_DEFAULT_MATERIALS = 3;
  GEOM_SETTING_GENERATE_UVS = 4;
  // Presence passes IfcOpenShell `disable-opening-subtractions=true`, filling host opening voids.
  GEOM_SETTING_DISABLE_OPENING_SUBTRACTIONS = 5;
  GEOM_SETTING_ELEMENT_GUIDS = 6;
}

enum Dimensionality {
  DIMENSIONALITY_UNSPECIFIED = 0;
  DIMENSIONALITY_CURVES = 1;
  DIMENSIONALITY_SURFACES_AND_SOLIDS = 2;
  DIMENSIONALITY_CURVES_SURFACES_AND_SOLIDS = 3;
}

// --- [TESSELLATION] -----------------------------------------------------------------------

message ElementScope {
  repeated string global_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 65536
    unique: true
    items: {
      string: {
        len: 22
        pattern: "^[0-9A-Za-z_$]{22}$"
      }
    }
  }];
}

message EntityScope {
  repeated string ifc_types = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 65536
    unique: true
    items: {
      string: {pattern: "^Ifc[A-Za-z0-9_]+$"}
    }
  }];
}

message TessellationScope {
  oneof kind {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty whole_model = 1;
    ElementScope elements = 2;
    EntityScope entities = 3;
    EntityScope exclude_entities = 4;
  }
}

// The IFC tessellation request: one sealed IFC source artifact, the policy that folds its content key, and the
// scope, settings, and tolerance the kernel reads. IFC is the sole source this service admits; STEP and IGES
// tessellate through `rasm.contracts.cad.CadService.Tessellate`.
message TessellateRequest {
  // Ordinals 3 and 6 are GEOM_SETTING_DEFAULT_MATERIALS and GEOM_SETTING_ELEMENT_GUIDS. Enum values compare as
  // ordinals here because a qualified enum path is a spelling not every branch's CEL environment resolves.
  option (buf.validate.message).cel = {
    id: "tessellation.required-settings"
    message: "default materials and element GUIDs are required"
    expression: "3 in this.geom_settings && 6 in this.geom_settings"
  };

  reserved 1;
  reserved "source";
  rasm.contracts.geometry.TessellationPolicy policy = 2 [(buf.validate.field).required = true];
  reserved 3;
  reserved "angle_tolerance_rad";
  double tolerance_m = 4 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  // The unique set is bounded by the vocabulary: six defined settings, two of them mandatory.
  repeated GeomSetting geom_settings = 5 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 6
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  Dimensionality dimensionality = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  TessellationScope scope = 7 [(buf.validate.field).required = true];
  rasm.contracts.artifact.ArtifactRef source_artifact = 8 [(buf.validate.field).required = true];
}

// The IFC source's own declared schema and project labels.
message Semantic {
  string schema = 1;
  string project = 2;
}

// Counts and identities alone; the GLB body rides the artifact service under `artifact`. `content_key` is the
// policy-folded semantic request key, while `artifact` carries the emitted bytes' digest and exact extent.
message TessellateResponse {
  bytes content_key = 1 [(buf.validate.field).bytes.len = 16];
  // element_count counts decoded default-scene mesh placements; triangle_count counts logical-mesh primitive triangles once.
  uint64 element_count = 2;
  uint64 triangle_count = 3;
  Semantic semantic = 4 [(buf.validate.field).required = true];
  reserved 5;
  reserved "artifact_hash";
  Spill spill = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  rasm.contracts.artifact.ArtifactRef artifact = 7 [(buf.validate.field).required = true];
}

// --- [SERVICES] ---------------------------------------------------------------------------

service ComputeService {
  rpc Tessellate(TessellateRequest) returns (TessellateResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
