id: no-second-sentence
valid:
    - |
      message: The item holds a period, the value is one sentence
      note: Write the item, and keep the fact after a comma
    - |
      note: Set `Directory.Build.props` once
    - |
      message: The item vs. the other item
    - |
      # The item. The other item
      id: <id>
    - |
      rule:
          regex: 'x\. Y'
    - |
      note: Write the item, e.g. the other item
    - |
      note: 'Write `a ? b : c` Once'
invalid:
    - |
      message: Is the item set? The other item follows
    - |
      message: The item is set! The other item follows
    - |
      message: The item is set. `Other` holds the value
    - |
      message: The item is set. $NAME holds the value
    - |
      message: The item is set. "Other" holds the value
    - |
      message: The item holds a period. The other item follows
    - |
      note: 'Write `Item`. Keep the other item'
    - |
      note: |
        Write the item.
        Keep the other item
    - |
      note: >-
        Write the item. Keep
        the other item
    - |
      labels: {ITEM: {style: primary, message: 'The item. The other item'}}
    - |
      "note": Write the item. Keep the other item
    - |
      message: "The item holds a period. The other item follows"
