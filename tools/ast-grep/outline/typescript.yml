    - id: shape
      rule: {kind: object_type, regex: "\n"}
      fix: '{…}'
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: $, by: .}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, shape]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ' +$', by: ''}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic:
