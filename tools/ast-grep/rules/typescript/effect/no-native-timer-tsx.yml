# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    promise-timer:
        regex: '^(set(Timeout|Interval|Immediate)|scheduler)$'
    callback-timer:
        regex: '^(setImmediate|clear(Timeout|Interval|Immediate)|nextTick)$'
    host-import:
        any:
            - matches: {typescript-import-reference: {source: {regex: '^(node:)?timers/promises$'}, exported: {matches: promise-timer}}}
            - matches: {typescript-import-reference: {source: {regex: '^(node:)?(timers|process)$'}, exported: {matches: callback-timer}}}
    listener-callback:
        matches: typescript-function-boundary
        inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, kind: member_expression, has: {field: property, regex: '^(addEventListener|once|on)$'}}
rule:
    any:
        - kind: call_expression
          all:
            - has:
                field: function
                pattern: $NAME
                any:
                    - kind: identifier
                      any:
                        - regex: '^(setImmediate|queueMicrotask|clear(Timeout|Interval|Immediate))$'
                          matches: typescript-global-reference
                        - any: [{matches: promise-timer}, {matches: callback-timer}]
                          matches: host-import
                    - kind: member_expression
                      all:
                        - has: {field: property, regex: '^(set(Timeout|Interval|Immediate)|clear(Timeout|Interval|Immediate)|queueMicrotask|timeout|nextTick|wait|yield)$'}
                        - any:
                            - regex: '^((window|self)\.set(Timeout|Interval)|((globalThis|window|self)\.)?(setImmediate|queueMicrotask|clear(Timeout|Interval|Immediate)|AbortSignal\.timeout|process\.nextTick))$'
                              matches: typescript-global-reference
                            - matches: host-import
                            - all: [{has: {field: property, regex: '^(wait|yield)$'}}, {has: {field: object, matches: host-import}}]
            - not:
                all:
                    - has: {field: function, regex: 'clear(Timeout|Interval|Immediate)$'}
                    - inside: {matches: listener-callback, stopBy: {matches: typescript-function-boundary}}
        - kind: import_specifier
          pattern: $NAME
          all:
            - has: {field: alias, kind: identifier}
            - any:
                - all:
                    - has: {field: name, matches: promise-timer}
                    - inside: {kind: import_statement, stopBy: end, has: {field: source, regex: '^.(node:)?timers/promises.$'}}
                - all:
                    - has: {field: name, matches: callback-timer}
                    - inside: {kind: import_statement, stopBy: end, has: {field: source, regex: '^.(node:)?(timers|process).$'}}
message: '`$NAME` drives host timer outside the effect runtime'
note: 'Schedule through `Effect.sleep`, `Effect.repeat` with a `Schedule`, or `Effect.yieldNow`, with interruption in place of each clear call'
