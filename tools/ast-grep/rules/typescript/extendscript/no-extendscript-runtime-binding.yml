# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-extendscript-runtime-binding
language: tsx
severity: error
files: ['libs/typescript/creative-cloud/extendscript/runtime.ts']
rule:
    any:
        - kind: import_statement
          not: {regex: '^import type '}
          has: {field: source, pattern: $NAME}
        - kind: lexical_declaration, variable_declaration
          all:
            - any: [{inside: {kind: program}}, {inside: {kind: export_statement, inside: {kind: program}}}]
            - has: {kind: variable_declarator, has: {field: name, pattern: $NAME, not: {regex: '^runtime$'}}}
        - kind: function_declaration, generator_function_declaration, class_declaration, enum_declaration
          all:
            - any: [{inside: {kind: program}}, {inside: {kind: export_statement, inside: {kind: program}}}]
            - has: {field: name, pattern: $NAME}
        - kind: identifier
          pattern: $NAME
          regex: '^(\$|File)$'
          inside: {stopBy: end, kind: variable_declarator, has: {field: name, regex: '^runtime$'}}
message: '`$NAME` is unbound where `runtime` runs as source text'
note: 'Declare every value inside `runtime`, import types alone, and read host globals through `read`'
