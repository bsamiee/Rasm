# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    descriptor-binding:
        any:
            - kind: property_declaration
              all:
                - has: {kind: pattern, has: {field: bound_identifier, pattern: $DESCRIPTOR}, precedes: {stopBy: {kind: pattern}, kind: type_annotation, regex: '^:[\t-\r ]*((System|SystemPackage)(\.|::))?FileDescriptor$'}}
            - kind: parameter
              all:
                - has: {field: name, pattern: $DESCRIPTOR}
                - has: {kind: user_type, regex: '^((System|SystemPackage)(\.|::))?FileDescriptor$'}
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, kind: simple_identifier, regex: '^defer$'}
        - has: {stopBy: end, kind: navigation_expression, all: [{has: {field: target, kind: simple_identifier, pattern: $DESCRIPTOR}}, {has: {field: suffix, has: {field: suffix, regex: '^close$'}}}]}
        - inside:
            kind: 'function_declaration, lambda_literal'
            stopBy: {kind: 'function_declaration, lambda_literal'}
            all:
                - not: {has: {stopBy: {kind: 'function_declaration, lambda_literal'}, kind: await_expression}}
                - has: {stopBy: end, matches: descriptor-binding}
message: '`defer` closes `$DESCRIPTOR` around a synchronous body'
note: 'Run the body inside `<descriptor>.closeAfter { }`'
