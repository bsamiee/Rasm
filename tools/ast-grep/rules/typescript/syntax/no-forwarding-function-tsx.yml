# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    overloaded-constructor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(make|subscriptionRef|fn|fnSync)$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Atom$'}}}}
    receiver-static:
        has: {field: object, regex: '^(Promise|(Int8|Uint8|Uint8Clamped|Int16|Uint16|Int32|Uint32|Float16|Float32|Float64|BigInt64|BigUint64)Array)$', matches: typescript-global-reference}
    receiver-instance:
        has: {field: object, kind: identifier, matches: {typescript-constant-value: {value: {kind: 'regex, new_expression'}}}}
    root-declaration:
        any:
            - {kind: lexical_declaration, has: {kind: variable_declarator, has: {field: name, pattern: $ROOT}}}
            - {kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $ROOT}}
    inner-declaration:
        any:
            - {kind: lexical_declaration, has: {kind: variable_declarator, has: {field: name, pattern: $INNER}}}
            - {kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $INNER}}
    named-callee:
        any:
            - kind: identifier
              pattern: $ROOT
              not:
                any:
                    - inside:
                        matches: typescript-function-boundary
                        stopBy: {matches: typescript-function-boundary}
                        any:
                            - has: {field: name, pattern: $ROOT}
                            - has: {field: parameter, kind: identifier, pattern: $ROOT}
                            - has: {field: parameters, has: {stopBy: end, kind: identifier, pattern: $ROOT}}
                    - all:
                        - inside: {matches: typescript-function-boundary, stopBy: {matches: typescript-function-boundary}, not: {inside: {matches: typescript-function-boundary, stopBy: end}}}
                        - inside:
                            stopBy: end
                            inside: {kind: program}
                            precedes: {stopBy: end, any: [{matches: root-declaration}, {kind: export_statement, has: {matches: root-declaration}}]}
            - kind: member_expression
              not: {any: [{has: {kind: optional_chain}}, {matches: overloaded-constructor}, {matches: receiver-static}, {matches: receiver-instance}]}
              has: {field: object, matches: named-callee, regex: '^[A-Z]'}
    inner-callee:
        any:
            - kind: identifier
              pattern: $INNER
              not:
                any:
                    - inside:
                        matches: typescript-function-boundary
                        stopBy: {matches: typescript-function-boundary}
                        any:
                            - has: {field: name, pattern: $INNER}
                            - has: {field: parameter, kind: identifier, pattern: $INNER}
                            - has: {field: parameters, has: {stopBy: end, kind: identifier, pattern: $INNER}}
                    - all:
                        - inside: {matches: typescript-function-boundary, stopBy: {matches: typescript-function-boundary}, not: {inside: {matches: typescript-function-boundary, stopBy: end}}}
                        - inside:
                            stopBy: end
                            inside: {kind: program}
                            precedes: {stopBy: end, any: [{matches: inner-declaration}, {kind: export_statement, has: {matches: inner-declaration}}]}
            - kind: member_expression
              not: {any: [{has: {kind: optional_chain}}, {matches: overloaded-constructor}, {matches: receiver-static}, {matches: receiver-instance}]}
              has: {field: object, matches: inner-callee, regex: '^[A-Z]'}
    parameter-1: {kind: required_parameter, nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, has: {field: pattern, kind: identifier, pattern: $A}}
    parameter-2: {kind: required_parameter, nthChild: {position: 2, ofRule: *code}, has: {field: pattern, kind: identifier, pattern: $B}}
    parameter-3: {kind: required_parameter, nthChild: {position: 3, ofRule: *code}, has: {field: pattern, kind: identifier, pattern: $C}}
    parameter-4: {kind: required_parameter, nthChild: {position: 4, ofRule: *code}, has: {field: pattern, kind: identifier, pattern: $D}}
    parameters-1:
        any:
            - has: {field: parameter, kind: identifier, pattern: $A}
            - has: {field: parameters, has: {matches: parameter-1}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
    parameters-2:
        has: {field: parameters, all: [{has: {matches: parameter-1}}, {has: {matches: parameter-2}}], not: {has: {nthChild: {position: 3, ofRule: *code}}}}
    parameters-3:
        has: {field: parameters, all: [{has: {matches: parameter-1}}, {has: {matches: parameter-2}}, {has: {matches: parameter-3}}], not: {has: {nthChild: {position: 4, ofRule: *code}}}}
    parameters-4:
        has: {field: parameters, all: [{has: {matches: parameter-1}}, {has: {matches: parameter-2}}, {has: {matches: parameter-3}}, {has: {matches: parameter-4}}], not: {has: {nthChild: {position: 5, ofRule: *code}}}}
    parameters-rest:
        has: {field: parameters, has: {kind: required_parameter, nthChild: {position: 1, ofRule: *code}, has: {field: pattern, kind: rest_pattern, has: {kind: identifier, pattern: $A}}}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
    parameter-read:
        any: [{kind: identifier, pattern: $A}, {has: {stopBy: end, kind: identifier, pattern: $A}}]
    forwarded-1:
        pattern: $BODY
        any:
            - pattern: $F($A)
              has: {field: function, matches: named-callee}
            - pattern: $F($G($A))
              all:
                - has: {field: function, matches: named-callee}
                - has: {field: arguments, has: {kind: call_expression, has: {field: function, matches: inner-callee}}}
            - kind: identifier
              pattern: $A
            - pattern: '$M.$OP($A, $$$REST)'
              has: {field: function, matches: effect-dual-operation}
              not: {has: {field: arguments, has: {not: {nthChild: {position: 1, ofRule: *code}}, matches: parameter-read}}}
    forwarded-2:
        all: [{pattern: $BODY}, {pattern: '$F($A, $B)'}, {has: {field: function, matches: named-callee}}]
    forwarded-3:
        all: [{pattern: $BODY}, {pattern: '$F($A, $B, $C)'}, {has: {field: function, matches: named-callee}}]
    forwarded-4:
        all: [{pattern: $BODY}, {pattern: '$F($A, $B, $C, $D)'}, {has: {field: function, matches: named-callee}}]
    forwarded-rest:
        all: [{pattern: $BODY}, {pattern: $F(...$A)}, {has: {field: function, matches: named-callee}}]
    indexed-callback:
        inside:
            kind: arguments
            inside:
                kind: call_expression
                has:
                    field: function
                    kind: member_expression
                    all:
                        - has: {field: property, regex: '^(map|flatMap|filter|filterMap|forEach|some|every|find|findIndex|findLast|findLastIndex|findFirst|reduce|reduceRight|partition|validate|replace|replaceAll)$'}
                        - any:
                            - has: {field: object, not: {matches: {effect-module: {name: {regex: '.'}}}}}
                            - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)(Array|Chunk|Iterable|Record|HashMap)$'}}}}
                            - all:
                                - has: {field: property, regex: '^(forEach|filter|filterMap|findFirst|reduce|partition|validate)$'}
                                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
    forwarded-body:
        any:
            - kind: identifier
            - pattern: '$M.$OP($A, $$$REST)'
              has: {field: function, matches: effect-dual-operation}
    host-arguments-dropped:
        all:
            - matches: indexed-callback
            - not: {matches: parameters-rest}
            - not: {has: {field: body, any: [{matches: forwarded-body}, {kind: statement_block, has: {kind: return_statement, has: {matches: forwarded-body}}}]}}
    single-statement:
        kind: statement_block
        not: {has: {nthChild: {position: 2, ofRule: *code}}}
    result-1:
        any: [{matches: forwarded-1}, {matches: single-statement, has: {kind: return_statement, has: {matches: forwarded-1}}}]
    result-2:
        any: [{matches: forwarded-2}, {matches: single-statement, has: {kind: return_statement, has: {matches: forwarded-2}}}]
    result-3:
        any: [{matches: forwarded-3}, {matches: single-statement, has: {kind: return_statement, has: {matches: forwarded-3}}}]
    result-4:
        any: [{matches: forwarded-4}, {matches: single-statement, has: {kind: return_statement, has: {matches: forwarded-4}}}]
    result-rest:
        any: [{matches: forwarded-rest}, {matches: single-statement, has: {kind: return_statement, has: {matches: forwarded-rest}}}]
rule:
    kind: arrow_function, function_expression, function_declaration, method_definition
    all:
        - not: {has: {regex: '^async$', not: {kind: 'identifier, property_identifier'}}}
        - not: {has: {field: parameters, has: {kind: optional_parameter}}}
        - not: {has: {field: parameters, has: {kind: required_parameter, has: {field: value, pattern: $_}}}}
        - any:
            - all: [{matches: parameters-1}, {has: {field: body, matches: result-1}}]
            - all: [{matches: parameters-2}, {has: {field: body, matches: result-2}}]
            - all: [{matches: parameters-3}, {has: {field: body, matches: result-3}}]
            - all: [{matches: parameters-4}, {has: {field: body, matches: result-4}}]
            - all: [{matches: parameters-rest}, {has: {field: body, matches: result-rest}}]
        - not: {matches: host-arguments-dropped}
transform:
    HEAD: {replace: {source: $BODY, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: 'Function forwards its parameters unchanged to `$HEAD`'
note: 'Pass `<callee>` itself, `flow(<inner>, <callee>)` for a nested call, data-last `<Module>.<op>(<args>)`, or `Function.identity`; delete a `Proxy` trap forwarding to its own `Reflect` member'
