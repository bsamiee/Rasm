# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-call-python
language: python
severity: error
utils:
    scope:
        kind: 'expression_statement, return_statement, if_statement, elif_clause, else_clause, for_statement, while_statement, with_statement, assert_statement, raise_statement, delete_statement, function_definition, class_definition, decorated_definition, block, module, match_statement, case_clause, try_statement, except_clause, finally_clause, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'
    nested-scope:
        kind: 'lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'
    constant:
        any:
            - kind: 'integer, float, string, true, false, none'
            - kind: unary_operator
              has: {matches: constant}
            - kind: binary_operator
              not: {has: {pattern: $_, not: {matches: constant}}}
            - kind: identifier
              regex: '^_?[A-Z][A-Z0-9_]*$'
            - kind: attribute
              regex: '^[A-Z]\w*\.[A-Z][A-Z0-9_]*$'
            - kind: keyword_argument
              has: {field: value, matches: constant}
    stateful-callee:
        regex: '^(next|anext|input|print|iter|aiter|list|dict|set|bytearray|object|open|reversed|enumerate|zip|map|filter|range|memoryview|deque|defaultdict|OrderedDict|Counter|(\w+\.)*(choice|choices|random|randint|randrange|uniform|shuffle|sample|getrandbits|randbytes|token_bytes|token_hex|token_urlsafe|now|today|utcnow|time|monotonic|perf_counter|urandom|uuid1|uuid4|read|readline|readlines|write|pop|popleft|popitem|append|extend|insert|remove|discard|update|setdefault|send|recv|copy))$'
    holds-call:
        not: {matches: nested-scope}
        any:
            - pattern: $CALL
            - has: {stopBy: {matches: nested-scope}, pattern: $CALL}
    then-arm-conditional:
        kind: conditional_expression
        all: [{has: {nthChild: 2, pattern: $TEST}}, {has: {nthChild: 1, matches: holds-call}}]
    then-arm-earlier:
        any: [{matches: then-arm-conditional}, {has: {stopBy: end, matches: then-arm-conditional}}]
    else-arm-conditional:
        kind: conditional_expression
        all: [{has: {nthChild: 2, pattern: $TEST}}, {has: {nthChild: 3, matches: holds-call}}]
    else-arm-earlier:
        any: [{matches: else-arm-conditional}, {has: {stopBy: end, matches: else-arm-conditional}}]
    opposite-arm:
        any:
            - nthChild: 3
              inside:
                kind: conditional_expression
                has: {nthChild: 2, pattern: $TEST}
                any:
                    - follows: {stopBy: end, matches: then-arm-earlier}
                    - inside: {stopBy: {matches: scope}, not: {matches: scope}, follows: {stopBy: end, matches: then-arm-earlier}}
            - nthChild: 1
              inside:
                kind: conditional_expression
                has: {nthChild: 2, pattern: $TEST}
                any:
                    - follows: {stopBy: end, matches: else-arm-earlier}
                    - inside: {stopBy: {matches: scope}, not: {matches: scope}, follows: {stopBy: end, matches: else-arm-earlier}}
    repeat-site:
        all:
            - not: {matches: scope}
            - not: {inside: {kind: assert_statement}}
            - not:
                all:
                    - nthChild: 3
                    - inside: {kind: conditional_expression}
                    - not: {follows: {stopBy: end, nthChild: 2, matches: holds-call}}
            - follows: {stopBy: end, matches: holds-call}
rule:
    kind: call
    pattern: $CALL
    all:
        - has: {field: arguments, has: {pattern: $_, not: {matches: constant}}}
        - has: {field: function, kind: 'identifier, attribute', not: {matches: stateful-callee}}
        - not: {has: {kind: 'await, yield, named_expression, lambda', stopBy: end}}
        - not: {any: [{matches: opposite-arm}, {inside: {stopBy: {matches: scope}, matches: opposite-arm}}]}
        - any:
            - matches: repeat-site
            - inside: {stopBy: {matches: scope}, matches: repeat-site}
message: '`$CALL` is evaluated twice in one expression'
note: 'Bind the call by an assignment before the statement, or by `(<name> := <call>)` at its first evaluated read inside a condition, lambda, or comprehension'
