# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-undivided-declaration-python
language: python
severity: error
rule:
    inside: {kind: module}
    any:
        - kind: function_definition, class_definition
          has: {field: name, pattern: $NAME}
        - kind: decorated_definition
          has: {field: definition, has: {field: name, pattern: $NAME}}
        - kind: type_alias_statement
          has: {field: left, pattern: $NAME}
        - kind: expression_statement
          has: {kind: assignment, has: {field: left, pattern: $NAME}}
    not: {follows: {stopBy: end, matches: text-section-divider}}
message: Declaration `$NAME` sits above every section divider
note: Open the section of its kind with `# --- [<SECTION>] ` dashed to column 90 above it, every declaration sits under a divider
