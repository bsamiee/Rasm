id: no-parse-error-swift
valid:
    - func f() {}
    - 'let x: Int = 1'
    - 'func f() { if let a = unsafe b { } }'
    - 'func f() { while unsafe p.pointee != 0 { } }'
    - 'func f() { switch try b { default: break } }'
    - 'let f: (Int) -> sending Int'
    - 'class C: nonisolated Q {}'
    - 'extension V where N == 3 {}'
    - "@abi(func old() -> Int)\nfunc new() -> Int { 1 }"
    - "@specialized(where T == Int)\nfunc f<T>(_ x: T) {}"
    - "@_lifetime(borrow x)\nfunc f(_ x: borrowing Span<Int>) -> Span<Int> { x }"
    - 'Swift::print(1)'
    - "struct S {\n#if DEBUG\n    @MainActor\n#endif\n    func f() {}\n}"
invalid:
    - func f( {}
    - 'let x: = 1'
    - 'func f() { switch try { default: break } }'
    - 'let x = Swift::'
