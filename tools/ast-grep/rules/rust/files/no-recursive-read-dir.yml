# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-recursive-read-dir
language: rust
severity: error
utils:
    owner:
        kind: function_item
        has: {field: name, pattern: $NAME}
    self-call:
        kind: call_expression
        has:
            field: function
            any:
                - {kind: identifier, pattern: $NAME}
                - kind: scoped_identifier
                  all: [{has: {field: path, regex: '^Self$'}}, {has: {field: name, pattern: $NAME}}]
                - kind: field_expression
                  all: [{has: {field: value, kind: self}}, {has: {field: field, pattern: $NAME}}]
    worklist-pop:
        kind: call_expression
        has: {field: function, kind: field_expression, all: [{has: {field: value, kind: identifier, pattern: $QUEUE}}, {has: {field: field, regex: '^(pop|pop_front|pop_back)$'}}]}
    worklist-push:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(push|push_back|push_front|extend)$'}}, {has: {field: value, kind: identifier, pattern: $QUEUE}}]}
            - inside: {stopBy: {kind: function_item}, matches: owner, has: {field: body, has: {stopBy: end, matches: worklist-pop}}}
    descent:
        any:
            - matches: self-call
            - matches: worklist-push
rule:
    kind: call_expression
    pattern: $READ
    all:
        - any:
            - has: {field: function, regex: '^((((::)?(std|tokio|async_std)::)?fs::|(::)?fs_err::(tokio::)?)read_dir|read_dir)$'}
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^read_dir$'}}
                - has: {field: arguments, not: {has: {pattern: $_}}}
        - inside: {stopBy: {kind: function_item}, matches: owner}
        - any:
            - inside:
                kind: for_expression
                field: value
                stopBy: {kind: 'block, function_item, closure_expression'}
                has: {field: body, has: {stopBy: {kind: function_item}, matches: descent, pattern: $STEP}}
            - inside:
                kind: call_expression
                stopBy: {kind: 'block, function_item'}
                has: {field: arguments, has: {kind: closure_expression, has: {field: body, any: [{matches: descent, pattern: $STEP}, {has: {stopBy: {kind: function_item}, matches: descent, pattern: $STEP}}]}}}
            - inside:
                kind: arguments
                stopBy: {kind: 'block, function_item, closure_expression'}
                inside: {matches: worklist-push, pattern: $STEP}
            - inside:
                kind: let_declaration
                stopBy: {kind: 'block, function_item, closure_expression'}
                has: {field: pattern, kind: identifier, pattern: $ENTRIES}
                precedes:
                    stopBy: end
                    kind: expression_statement
                    has: {kind: while_expression, all: [{has: {field: condition, has: {stopBy: end, pattern: $ENTRIES}}}, {has: {field: body, has: {stopBy: {kind: function_item}, matches: descent, pattern: $STEP}}}]}
labels:
    READ: {style: primary, message: 'Lists one directory level'}
    STEP: {style: secondary, message: 'Descends into each entry'}
message: '`$READ` walks a directory tree by hand from each entry'
note: 'Iterate `ignore::WalkBuilder::new(<root>).standard_filters(false).build()`, setting builder options for depth, links, order, and parallel walks'
