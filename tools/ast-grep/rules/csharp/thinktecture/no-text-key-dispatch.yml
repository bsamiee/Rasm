# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    text-constant:
        any:
            - kind: string_literal, verbatim_string_literal, raw_string_literal
            - kind: identifier
              pattern: $KEY
              inside:
                kind: compilation_unit
                stopBy: end
                has:
                    stopBy: end
                    kind: field_declaration, local_declaration_statement
                    all:
                        - has: {kind: modifier, regex: '^const$'}
                        - has:
                            kind: variable_declaration
                            all:
                                - has: {field: type, matches: {csharp-type-name: {name: {regex: '^(string|String)$'}}}}
                                - has: {kind: variable_declarator, has: {field: name, pattern: $KEY}}
    text-pattern:
        any:
            - kind: constant_pattern
              has: {matches: text-constant}
            - kind: or_pattern
              has: {field: left, matches: text-pattern}
            - kind: parenthesized_pattern
              has: {matches: text-pattern}
    constant-pattern:
        kind: constant_pattern, or_pattern, parenthesized_pattern
    name-subject:
        any:
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^ToString$'}}
                - has:
                    field: arguments
                    any:
                        - not: {has: {kind: argument}}
                        - has: {kind: argument, nthChild: 1, regex: '^"[GgFf]"$'}
                          not: {has: {kind: argument, nthChild: 2}}
            - matches: csharp-nameof-call
            - kind: invocation_expression
              matches: {csharp-owner-call: {type: {regex: '^Enum$'}, member: {regex: '^GetName$'}}}
    text-switch:
        any:
            - kind: switch_expression
              all:
                - has: {nthChild: 1, pattern: $SUBJECT}
                - has: {kind: switch_expression_arm, pattern: $FIRST, has: {nthChild: 1, matches: text-pattern}}
                - has: {kind: switch_expression_arm, not: {pattern: $FIRST}, has: {nthChild: 1, matches: constant-pattern}}
                - not: {has: {nthChild: 1, matches: name-subject}}
            - kind: switch_statement
              all:
                - has: {field: value, pattern: $SUBJECT}
                - has:
                    field: body
                    all:
                        - has: {kind: switch_section, pattern: $FIRST, has: {matches: text-pattern}}
                        - has: {kind: switch_section, not: {pattern: $FIRST}, has: {matches: constant-pattern}}
                - not: {has: {field: value, matches: name-subject}}
    key-read:
        any:
            - kind: member_access_expression
              all: [{has: {field: expression, kind: identifier}}, {has: {field: name, regex: '^Key$'}}]
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: expression, kind: identifier}}, {has: {field: name, regex: '^ToValue$'}}]}
                - matches: csharp-argumentless-call
    text-operand:
        any:
            - matches: text-constant
            - matches: name-subject
    text-key-comparison:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(==|!=)$'}
                - any:
                    - all: [{has: {field: left, matches: key-read}}, {has: {field: right, matches: text-operand}}]
                    - all: [{has: {field: right, matches: key-read}}, {has: {field: left, matches: text-operand}}]
            - kind: invocation_expression
              all:
                - matches: {csharp-named-call: {name: {regex: '^Equals$'}}}
                - has: {stopBy: end, matches: key-read}
                - has: {stopBy: end, matches: text-operand}
    key-scan:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(First|FirstOrDefault|Single|SingleOrDefault|Last|LastOrDefault|Find|FindIndex|Where|Any|Filter|Exists)$'}}, {has: {field: expression, pattern: $SUBJECT}}]}
            - not: {has: {field: function, has: {field: expression, matches: thinktecture-smart-enum-items}}}
            - has: {field: arguments, has: {kind: argument, has: {kind: lambda_expression, has: {field: body, matches: text-key-comparison}}}}
rule:
    kind: switch_expression, switch_statement, invocation_expression
    any:
        - matches: text-switch
        - matches: key-scan
    not:
        inside:
            stopBy: end
            kind: method_declaration
            all:
                - has: {field: name, regex: '^Validate$'}
                - inside: {stopBy: end, kind: 'class_declaration, struct_declaration, record_declaration', has: {kind: attribute_list, has: {kind: attribute, has: {field: name, regex: '^ObjectFactory'}}}}
message: '`$SUBJECT` dispatches on text keys'
note: 'Declare a `[SmartEnum<string>]` item per key holding its case, parse through generated `TryGet` or `Validate`, write `Key`'
