id: no-json-module
valid:
    # The corrected form, the msgspec codec
    - |
      import msgspec

      data = msgspec.json.decode(raw, type=Item)
    # The msgspec submodule named json
    - |
      import msgspec.json
    # Attribute named like the module on another object
    - |
      body = response.json()
    # Package with the module name as a prefix
    - |
      import jsonschema
invalid:
    # The instance, the module imported whole
    - |
      import json
    # Member imported from the module
    - |
      from json import loads
    # Submodule of the package
    - |
      from json.decoder import JSONDecodeError
    # The attribute read as spelled
    - |
      data = json.loads(raw)
    # The module imported under an alias
    - |
      import json as j
    # The attribute chain rooted at the module, reported once at its outermost link
    - |
      raise json.decoder.JSONDecodeError(message, raw, 0)
    # The module second in an import of two names
    - |
      import os, json
