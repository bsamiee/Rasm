# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: fin-match-to-if-fail
language: csharp
severity: off
rule:
    any:
        - pattern: {context: "class C { object F() => $RESULT.Match(Succ: $IDENTITY, Fail: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $RESULT.Match(Fail: $FALLBACK, Succ: $IDENTITY); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $RESULT.Match($IDENTITY, Fail: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $RESULT.Match(Succ: $IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - all:
            - pattern: {context: "class C { object F() => $RESULT.Match($IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
            - not:
                has:
                    field: arguments
                    kind: argument_list
                    has:
                        kind: argument
                        has: {field: name, kind: identifier}
constraints:
    IDENTITY: {matches: csharp-identity-callback}
fix: "$RESULT.IfFail($FALLBACK)"
message: Use `IfFail` for an unchanged success value and a failure handler
note: Write IfFail with the failure handler on a Fin<A> Match that Roslyn resolves to result A, and keep Match for a wider result
