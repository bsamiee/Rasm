# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-answer-by-hand
language: csharp
severity: error
files: ['libs/dotnet/rhino/**', 'apps/rhino/**']
utils:
    discarded:
        any:
            - inside: {kind: expression_statement}
            - inside:
                kind: assignment_expression
                has: {field: left, regex: '^_$'}
    constant:
        any:
            - kind: integer_literal, real_literal, boolean_literal, character_literal, string_literal, verbatim_string_literal, raw_string_literal, null_literal, default_expression
            - kind: prefix_unary_expression
              regex: '^-\s*[0-9.]+[a-zA-Z]*$'
            - kind: identifier
            - kind: member_access_expression
              not: {has: {stopBy: end, kind: 'invocation_expression, object_creation_expression, implicit_object_creation_expression, element_access_expression, conditional_access_expression'}}
            - kind: parenthesized_expression
              has: {matches: constant}
    error-parameter:
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: $ERROR
                    - kind: parameter_list
                      all:
                        - has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $ERROR}}
                        - not: {has: {kind: parameter, nthChild: 2}}
            - not: {has: {kind: modifier, regex: '^async$'}}
    reject-call:
        kind: invocation_expression
        all:
            - has:
                field: function
                pattern: $REJECT
                not:
                    any:
                        - pattern: $ERROR
                        - has: {stopBy: end, kind: identifier, pattern: $ERROR}
            - has:
                field: arguments
                all:
                    - has: {kind: argument, nthChild: 1, regex: '^\w+$', has: {kind: identifier, pattern: $ERROR}}
                    - not: {has: {kind: argument, nthChild: 2}}
    fallback-return:
        kind: return_statement
        all:
            - any:
                - has: {matches: constant, pattern: $CONSTANT}
                - has: {pattern: $LAZY, not: {any: [{matches: constant}, {kind: comment}]}}
            - not: {has: {stopBy: end, kind: identifier, pattern: $ERROR}}
    reject-block:
        kind: block
        all:
            - has: {nthChild: 1, kind: expression_statement, has: {matches: reject-call}}
            - has: {nthChild: 2, matches: fallback-return}
            - not: {has: {nthChild: 3}}
            - not: {has: {kind: comment}}
    fallback-handler:
        kind: lambda_expression, anonymous_method_expression
        all:
            - matches: error-parameter
            - any:
                - has: {field: body, matches: reject-block}
                - has: {kind: block, matches: reject-block}
    lift-handler:
        kind: lambda_expression
        all:
            - pattern: $UNIT
            - matches: error-parameter
            - has:
                field: body
                kind: invocation_expression
                all:
                    - has: {field: function, regex: '^((global::)?(LanguageExt\.)?IO\s*\.\s*)lift$'}
                    - has:
                        field: arguments
                        all:
                            - has:
                                kind: argument
                                nthChild: 1
                                has:
                                    kind: lambda_expression
                                    all:
                                        - has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
                                        - has: {field: body, matches: reject-call}
                            - not: {has: {kind: argument, nthChild: 2}}
    identity:
        any:
            - kind: identifier
              regex: '^identity$'
            - kind: member_access_expression
              regex: '^(global::)?(LanguageExt\.)?Prelude\s*\.\s*identity$'
            - kind: lambda_expression
              all:
                - has:
                    field: parameters
                    any:
                        - kind: implicit_parameter
                          pattern: $SUCCESS
                        - kind: parameter_list
                          all:
                            - has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $SUCCESS}}
                            - not: {has: {kind: parameter, nthChild: 2}}
                - has: {field: body, kind: identifier, pattern: $SUCCESS}
    discard-value:
        kind: lambda_expression
        all:
            - has: {field: parameters, any: [{kind: implicit_parameter, regex: '^_$'}, {kind: parameter_list, all: [{has: {kind: parameter, nthChild: 1, regex: '^_$'}}, {not: {has: {kind: parameter, nthChild: 2}}}]}]}
            - has: {field: body, matches: constant, pattern: $CONSTANT, all: [{pattern: $DISCARDED}]}
    single-argument:
        has:
            field: arguments
            not: {has: {kind: argument, nthChild: 2}}
    fun-reject:
        kind: invocation_expression
        all:
            - pattern: $UNIT
            - has: {field: function, regex: '^((global::)?(LanguageExt\.)?Prelude\s*\.\s*)?fun$'}
            - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, pattern: $REJECT}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    ran:
        any:
            - kind: invocation_expression
              pattern: $EFFECT.RunSafe()
            - kind: parenthesized_expression
              has: {matches: ran}
            - kind: identifier
              pattern: $FIN
              inside:
                stopBy: end
                kind: method_declaration, local_function_statement, constructor_declaration, accessor_declaration, lambda_expression
                has:
                    stopBy: end
                    kind: variable_declarator
                    all:
                        - has: {field: name, pattern: $FIN}
                        - has: {nthChild: {position: 1, reverse: true}, kind: invocation_expression, pattern: $_RUN.RunSafe()}
    recovery:
        any:
            - all:
                - matches: single-argument
                - has: {field: arguments, has: {kind: argument, has: {matches: fallback-handler}}}
            - all:
                - matches: single-argument
                - has: {field: arguments, has: {kind: argument, has: {matches: fun-reject}}}
    run-call:
        kind: invocation_expression
        all:
            - has: {field: arguments, not: {has: {kind: argument}}}
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Run|RunSafe)$'}}
    recovered:
        any:
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^As$'}}, {has: {field: expression, matches: recovered}}]}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Catch|IfFail)$'}}, {has: {field: expression, pattern: $EFFECT}}]}
                - has: {field: arguments, has: {kind: argument, nthChild: {position: 1, reverse: true}, has: {matches: lift-handler}}}
                - any:
                    - matches: single-argument
                    - all:
                        - has: {field: function, has: {field: name, regex: '^Catch$'}}
                        - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, pattern: $ALWAYS}}, {not: {has: {kind: argument, nthChild: 3}}}]}
rule:
    kind: invocation_expression
    all:
        - any:
            - all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^IfFail$'}}, {has: {field: expression, matches: ran}}]}
                - matches: recovery
            - all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Match$'}}, {has: {field: expression, matches: ran}}]}
                - has:
                    field: arguments
                    all:
                        - not: {has: {kind: argument, nthChild: 3}}
                        - any:
                            - all:
                                - has: {kind: argument, regex: '^Fail\s*:', has: {matches: fallback-handler}}
                                - has: {kind: argument, regex: '^Succ\s*:', has: {matches: identity}}
                            - all:
                                - has: {kind: argument, nthChild: 2, not: {regex: '^\w+\s*:[^:]'}, has: {matches: fallback-handler}}
                                - has: {kind: argument, nthChild: 1, not: {regex: '^\w+\s*:[^:]'}, has: {matches: identity}}
                            - all:
                                - has: {kind: argument, regex: '^Fail\s*:', has: {matches: fallback-handler}}
                                - has: {kind: argument, regex: '^Succ\s*:', has: {matches: discard-value}}
                            - all:
                                - has: {kind: argument, nthChild: 2, not: {regex: '^\w+\s*:[^:]'}, has: {matches: fallback-handler}}
                                - has: {kind: argument, nthChild: 1, not: {regex: '^\w+\s*:[^:]'}, has: {matches: discard-value}}
            - all:
                - matches: run-call
                - has: {field: function, has: {field: name, regex: '^Run$'}}
                - has:
                    field: function
                    has:
                        field: expression
                        kind: invocation_expression
                        all:
                            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^IfFail$'}}, {has: {field: expression, pattern: $EFFECT}}]}
                            - matches: recovery
            - all:
                - matches: run-call
                - has: {field: function, has: {field: expression, matches: recovered}}
                - any:
                    - all:
                        - has: {field: function, has: {field: name, regex: '^RunSafe$'}}
                        - matches: discarded
                    - has: {field: function, has: {field: name, regex: '^Run$'}}
        - not: {inside: {stopBy: end, kind: ERROR}}
        - not: {has: {stopBy: end, kind: ERROR}}
        - not: {matches: {csharp-owner-body: {type: {regex: '^Answers$'}, member: {regex: '^Answer$'}}}}
constraints:
    ALWAYS: {matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}}
transform:
    OPEN:
        replace:
            source: $LAZY
            replace: '(?s)^.*$'
            by: Some(
    CLOSE:
        replace:
            source: $LAZY
            replace: '(?s)^.*$'
            by: )
    THUNK:
        replace:
            source: $LAZY
            replace: '(?s)^.*$'
            by: '() => '
    BARE:
        replace:
            source: $CONSTANT
            replace: '^\(+\s*((?s).*?)\s*\)+$'
            by: '$1'
    LIFTED:
        replace:
            source: $FIN
            replace: '(?s)^(.+)$'
            by: IO.lift($1)
    DISCARD:
        replace:
            source: $DISCARDED
            replace: '(?s)^(.+)$'
            by: '.Map(static _ => $1)'
    UNIT_FALLBACK:
        replace:
            source: $UNIT
            replace: '(?s)^.*$'
            by: unit
fix: Answers.Answer($OPEN$EFFECT$DISCARD$LIFTED$CLOSE, $REJECT, $THUNK$BARE$LAZY$UNIT_FALLBACK)
message: "`$EFFECT` runs and routes its failure to `$REJECT` by hand"
note: Use `Answers.Answer(<effect>, <reject>, <constant>)`, `Answers.Answer(Some(<effect>), <reject>, () => <fallback>)` for a fallback that evaluates, and `<effect>.Map(_ => <constant>)` as the effect where success answers the same constant
