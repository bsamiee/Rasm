# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    source-step:
        any:
            - kind: closure_expression
              all:
                - has: {field: parameters, has: {any: [{kind: identifier, pattern: $X}, {kind: reference_pattern, has: {kind: identifier, pattern: $X}}]}}
                - has: {field: body, any: [{pattern: $X.source()}, {pattern: (*$X).source()}, {pattern: 'Error::source($X)'}, {pattern: 'Error::source(*$X)'}]}
            - kind: scoped_identifier
              regex: '^((::)?(std|core)::error::)?Error::source$'
    successors:
        kind: call_expression
        all:
            - has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?successors$'}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: Some($E)}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: source-step}}, {not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}
    cursor-loop:
        kind: while_expression
        all:
            - has: {field: condition, kind: let_condition, all: [{has: {field: pattern, kind: tuple_struct_pattern, all: [{has: {field: type, regex: '^Some$'}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $CAUSE}}]}}, {has: {field: value, kind: identifier, pattern: $CURRENT}}]}
            - has:
                field: body
                has:
                    stopBy: {kind: closure_expression}
                    kind: assignment_expression
                    all:
                        - has: {field: left, pattern: $CURRENT}
                        - has: {field: right, pattern: $CAUSE.source()}
rule:
    kind: 'call_expression, while_expression'
    any:
        - matches: successors
        - matches: cursor-loop
message: '`$E$CURRENT` walks its error source chain by hand'
note: 'Iterate `<error>.sources()` on the `&dyn Error` (`#![feature(error_iter)]`)'
