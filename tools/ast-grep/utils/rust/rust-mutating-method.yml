# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-mutating-method
language: rust
rule:
    kind: field_identifier
    any:
        - matches: rust-growing-method
        - regex: '^(clear|remove|try_remove|remove_matches|swap_remove|retain|retain_mut|extract_if|truncate|drain|split_off|split_off_first|split_off_last|sort|sort_by|sort_by_key|sort_unstable|dedup|dedup_by|dedup_by_key|replace|take|take_if|swap|fill|reverse|resize|reserve|entry|or_insert|or_insert_with|or_default|get_or_insert|get_or_insert_with|get_or_insert_default|pop|pop_if|pop_back|pop_back_if|pop_front|pop_front_if|pop_first|pop_last|send|write|write_all|flush)$'
