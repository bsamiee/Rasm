syntax = "proto3";

package rasm.store;

import "google/protobuf/empty.proto";

// --- [MODELS] --------------------------------------------------------------------------

message PostgresStore {
    string id = 1;
    string host = 2;
    uint32 port = 3;
    string database = 4;
    string username = 5;
    string password = 6;
    // Connections `username` holds at once, at most.
    uint32 connection_limit = 7;
}

message BucketStore {
    string id = 1;
    // Serves path-style requests alone.
    string endpoint = 2;
    string region = 3;
    string bucket = 4;
    string access_key_id = 5;
    string secret_access_key = 6;
    string session_token = 7;
    uint32 credentials_ttl_seconds = 8;
}

message ClickhouseStore {
    string id = 1;
    string host = 2;
    uint32 http_port = 3;
    string database = 4;
    string username = 5;
    string password = 6;
}

message CacheStore {
    string id = 1;
    string host = 2;
    uint32 port = 3;
    uint32 database = 4;
    string username = 5;
    string password = 6;
    // `username` publishes and subscribes on channels with this prefix alone.
    string channel_prefix = 7;
}

message SessionLease {
    uint32 ttl_seconds = 1;
}

message SessionRequest {
    string session = 1;
}

message StoreRequest {
    string id = 1;
}

message TemplateRequest {
    string session = 1;
    string digest = 2;
}

// --- [SERVICES] ------------------------------------------------------------------------

// A session owns the stores created in it.
//
// A session ends on `EndSession`, when the lease of its last hold runs out, or when the lease of its
// last call runs out with no hold ever opened.
// A store ends with its session once no client holds a connection to it.
// `INVALID_ARGUMENT` from any rpc taking `session` or `digest`: one is empty, longer than 64 bytes, or holds a control character.
// `UNAVAILABLE` from any rpc: a backing server refused the operation.
// `UNIMPLEMENTED` from any rpc of one kind: the service runs with no server of that kind.
// `RESOURCE_EXHAUSTED` from any rpc returning a store: its kind holds its limit of live stores.
// A create first waits the service's own bound for a store to end, where the service holds the limit (PostgreSQL connections, a ClickHouse database limit); a shorter deadline ends the wait with its own status.
service StoreService {
    // Holds `session` while the stream stays open.
    // Sends one lease when the hold starts, its `ttl_seconds` counting from the end of the stream.
    rpc HoldSession(SessionRequest) returns (stream SessionLease);

    // Returns the lease of `session` with no hold, its `ttl_seconds` counting from this call.
    rpc RenewSession(SessionRequest) returns (SessionLease);

    // Succeeds when no session has that name.
    rpc EndSession(SessionRequest) returns (google.protobuf.Empty);

    rpc CreatePostgres(SessionRequest) returns (PostgresStore);

    rpc CreateBucket(SessionRequest) returns (BucketStore);

    rpc CreateClickhouse(SessionRequest) returns (ClickhouseStore);

    rpc CreateCache(SessionRequest) returns (CacheStore);

    // Returns bucket store `id` with new session credentials.
    // `NOT_FOUND`: no bucket store holds `id`.
    rpc RenewBucket(StoreRequest) returns (BucketStore);

    // Keeps store `id` past the end of its session, until `DropStore` or one `RenewSession` lease after this call.
    // `NOT_FOUND`: no store holds `id`.
    rpc KeepStore(StoreRequest) returns (google.protobuf.Empty);

    // Succeeds when no store holds `id`.
    // `FAILED_PRECONDITION`: a client still holds a connection to the store, which then ends with its session.
    rpc DropStore(StoreRequest) returns (google.protobuf.Empty);

    // Returns the store `session` builds template `digest` in, and the end of that store abandons the build.
    // `ALREADY_EXISTS`: a sealed template or an open build holds `digest`.
    rpc OpenPostgresTemplate(TemplateRequest) returns (PostgresStore);

    // Returns the store `session` builds template `digest` in, and the end of that store abandons the build.
    // `ALREADY_EXISTS`: a sealed template or an open build holds `digest`.
    rpc OpenClickhouseTemplate(TemplateRequest) returns (ClickhouseStore);

    // Seals build store `id` as the template of its digest and ends the store.
    // `NOT_FOUND`: no open build holds `id`.
    rpc SealTemplate(StoreRequest) returns (google.protobuf.Empty);

    // Returns a clone of sealed template `digest` in `session`, after an open build of it ends.
    // `NOT_FOUND`: no sealed template holds `digest`.
    rpc ClonePostgresTemplate(TemplateRequest) returns (PostgresStore);

    // Returns a clone of sealed template `digest` in `session`, after an open build of it ends.
    // `NOT_FOUND`: no sealed template holds `digest`.
    rpc CloneClickhouseTemplate(TemplateRequest) returns (ClickhouseStore);
}
