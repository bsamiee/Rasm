# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-result-match-for-map
language: python
severity: error
utils:
    ok-pattern:
        kind: class_pattern
        has: {kind: dotted_name, pattern: $RESULT_CLASS}
        all:
            - any:
                - has: {kind: case_pattern, has: {kind: keyword_pattern, has: {kind: dotted_name, regex: '^[A-Za-z_]\w*$'}}}
                - has: {kind: case_pattern, has: {kind: keyword_pattern, regex: '^ok\s*=\s*_$'}}
                - not: {has: {kind: case_pattern, has: {kind: keyword_pattern, regex: '^ok\s*='}}}
            - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']ok["'']$|ok\s*=)'}}}}
    ok-arm:
        kind: case_clause
        all:
            - has: {kind: case_pattern, has: {matches: ok-pattern}}
            - not: {has: {field: guard, kind: if_clause}}
            - any:
                - has: {kind: case_pattern, has: {kind: class_pattern, has: {kind: case_pattern}}}
                - follows: {matches: python-result-error-arm}
rule:
    kind: match_statement
    all:
        - nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}
        - has: {field: subject, pattern: $SUBJECT}
        - inside: {kind: function_definition, stopBy: end}
        - not: {inside: {kind: try_statement, has: {kind: finally_clause}, stopBy: {kind: function_definition}}}
        - has:
            field: body
            kind: block
            all:
                - has: {matches: python-result-error-arm, has: {kind: case_pattern, has: {kind: class_pattern, has: {kind: dotted_name, pattern: $RESULT_CLASS}}}}
                - not: {has: {kind: case_clause, nthChild: {position: 3, ofRule: {kind: case_clause}}}}
        - has:
            field: body
            has:
                matches: ok-arm
                has:
                    field: consequence
                    kind: block
                    has: {matches: python-result-ok-return}
                    not: {has: {nthChild: 2}}
        - not: {has: {kind: comment, stopBy: end}}
labels:
    SUBJECT: {style: primary, message: Result transformation}
message: Match over `$SUBJECT` repeats error propagation around an Ok transformation
note: Return `<subject>.map(<transformation>)` for a synchronous Ok value, and keep the match where it narrows the value or maps the error
