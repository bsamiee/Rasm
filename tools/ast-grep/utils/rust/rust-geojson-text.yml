# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-geojson-text
language: rust
utils:
    parsed:
        any:
            - inside: {field: value, kind: field_expression, has: {field: field, regex: '^parse$'}}
            - inside:
                kind: arguments
                inside: {kind: call_expression, has: {field: function, regex: '(^|::|\.)(from_str|from_slice|from_reader|parse)$'}}
    type-name:
        kind: string_literal
        regex: '^"(Feature|FeatureCollection|GeometryCollection|Point|MultiPoint|LineString|MultiLineString|Polygon|MultiPolygon)"$'
rule:
    kind: 'string_literal, raw_string_literal'
    all:
        - any:
            - matches: type-name
              follows: {regex: '^:$', follows: {kind: string_literal, regex: '^"type"$'}}
            - matches: type-name
              inside: {kind: arguments, all: [{has: {nthChild: 1, kind: string_literal, regex: '^"type"$'}}, {not: {has: {nthChild: 3}}}]}
            - regex: '\\?"type\\?"\s*:\s*\\?"(Feature|FeatureCollection|GeometryCollection|Point|MultiPoint|LineString|MultiLineString|Polygon|MultiPolygon)\\?"'
        - not: {matches: parsed}
        - not: {matches: rust-test-scope}
