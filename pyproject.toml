# --- [UV] -------------------------------------------------------------------------------

[tool.uv]
default-groups           = "all"
environments             = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
prerelease               = "allow"
no-build-package         = ["epdx"]                              # `epdx` sdist lacks `project.version`
extra-build-dependencies = { pyroscope-io = ["cmake"] }          # `pyroscope-io` build.rs runs cmake its sdist leaves undeclared

[[tool.uv.index]]
name        = "pypi"
url         = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/" # `uv publish --index pypi` uploads here and skips a file the index already holds
explicit    = true

[tool.uv.workspace]
members = [
    "apps/cli/foundry",
    "apps/cli/tests/foundry",
    "libs/python/data/records",
    "libs/python/graphics/typography",
    "libs/python/runtime/cli",
    "libs/python/runtime/telemetry",
    "libs/python/runtime/tests/telemetry",
    "tests/python/support",
    "tools/refurb",
    "tools/tests/refurb",
]

[tool.uv.sources]
rasm-cli        = { workspace = true }
rasm-foundry    = { workspace = true }
rasm-records    = { workspace = true }
rasm-refurb     = { workspace = true }
rasm-telemetry  = { workspace = true }
rasm-testing    = { workspace = true }
rasm-typography = { workspace = true }

[tool.uv.config-settings-package.cachebox]
build-args = "--features=pyo3/abi3-py39"

[tool.uv.config-settings-package.manifold3d]
"cmake.define.MANIFOLD_USE_BUILTIN_TBB" = "ON"

[tool.uv.config-settings-package.pyarrow]
"cmake.define.PYARROW_GANDIVA" = "OFF" # PyPI wheels omit Gandiva, which Arrow's conda configuration enables

# --- [PIXI] -----------------------------------------------------------------------------

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "27.0" }, "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.environments.default]
no-default-feature = true

[tool.pixi.environments.default.dependencies]
hdf5               = "2.2.*"
icu                = "78.*"   # 79 fails the solve: every libxml2 build libpdal-core 2.10 requires links ICU below 79
libpdal-core       = "2.10.*"
librdkafka         = "2.16.*" # Headers and library the `confluent-kafka` sdist builds against on CPython 3.15
llvm-openmp        = "*"
libmagic           = "*"
libpango           = "*"
libharfbuzz        = "*"
fontconfig         = "*"
libglib            = "*"
libarrow           = "25.*"
libarrow-acero     = "25.*"
libarrow-compute   = "25.*"
libarrow-dataset   = "25.*"
libarrow-flight    = "25.*"
libarrow-substrait = "25.*"
libparquet         = "25.*"

[tool.pixi.environments.default.target.unix.activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
HDF5_DIR          = "$CONDA_PREFIX"
CPATH             = "$CONDA_PREFIX/include"
LDFLAGS           = "-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"

[tool.pixi.environments.default.target.osx.tasks]
python = { cmd = "python", env = { DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib:$HOME/lib:/usr/local/lib:/lib:/usr/lib" } } # `pixi run` loses activation `DYLD_*` rows through the SIP-protected `/usr/bin/env` that captures them, and a set variable replaces dyld's default fallback list, restated after the Pixi folder

[tool.pixi.environments.default.target.linux.tasks]
python = { cmd = "python", env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" } } # An activation row reaches every `pixi run` child ahead of system libraries, sdist builds included

[tool.pixi.environments.default.target.win.activation.env]
ICU_VERSION                = "78"
CMAKE_PREFIX_PATH          = "%CONDA_PREFIX%\\Library"
HDF5_DIR                   = "%CONDA_PREFIX%\\Library"
INCLUDE                    = "%CONDA_PREFIX%\\Library\\include;%INCLUDE%"
LIB                        = "%CONDA_PREFIX%\\Library\\lib;%LIB%"
WEASYPRINT_DLL_DIRECTORIES = "%CONDA_PREFIX%\\Library\\bin"

[tool.pixi.environments.cpp]
no-default-feature = true
platforms          = ["osx-arm64-macos-27-0", "linux-64", "linux-aarch64"] # conda-forge holds no C++ standard library for win-64

[tool.pixi.environments.cpp.dependencies]
clangxx     = "23.*"
clang-tools = "23.*"
lld         = "23.*"
compiler-rt = "23.*"
ninja       = "*"
catch2      = "3.*"
python      = "*"
fmt         = "*"

[tool.pixi.environments.cpp.pypi-dependencies]
gersemi = "*"

[tool.pixi.environments.cpp.target.osx.dependencies]
libcxx-devel = "23.*" # Headers and `std` module of the libc++ every conda-forge macOS library links, Linux libraries link the libstdc++ `clangxx` brings

[tool.pixi.environments.cpp.activation.env]
CC                = "$CONDA_PREFIX/bin/clang"
CXX               = "$CONDA_PREFIX/bin/clang++"
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
cache-dir   = ".cache/ruff"
preview     = true
line-length = 200
src         = ["apps/cli/*", "apps/cli/tests/*", "libs/python/*/*", "libs/python/*/tests/*", "tests/python/support", "tools/refurb", "tools/tests/*"]
format      = { exclude = ["*.md"], docstring-code-format = true, skip-magic-trailing-comma = true }

[tool.ruff.lint]
select                    = ["ALL"]
ignore                    = [
    "missing-trailing-comma",                                                                                                                                                                    # `skip-magic-trailing-comma` removes commas COM812 adds
    "too-many-public-methods",                                                                                                                                                                   # Member counts push one-caller helper extraction
    "too-many-arguments",                                                                                                                                                                        # Argument counts push one-caller parameter records and wrappers
    "too-many-positional-arguments",                                                                                                                                                             # Positional counts do not establish a domain record or keyword contract
    "too-many-return-statements",                                                                                                                                                                # Return counts push one-caller helper extraction, `match` arms return per case
    "too-many-branches",                                                                                                                                                                         # Branch counts push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "too-many-locals",                                                                                                                                                                           # Local counts push one-caller helper extraction
    "too-many-statements",                                                                                                                                                                       # Statement counts push one-caller helper extraction
    "too-many-statements-in-try-clause",                                                                                                                                                         # Statement counts do not establish exception scope for native effects and typed refusals
    "complex-structure",                                                                                                                                                                         # Complexity scores push one-caller helper extraction, ast-grep `no-fourth-nesting-level-python` bounds nesting
    "raw-string-in-exception",                                                                                                                                                                   # Moves message into a local only the raise reads
    "f-string-in-exception",                                                                                                                                                                     # Moves message into a local only the raise reads
    "raise-vanilla-args",                                                                                                                                                                        # Pushes an exception class per message, raises stay for defects
    "typing-only-first-party-import",                                                                                                                                                            # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "typing-only-third-party-import",                                                                                                                                                            # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "typing-only-standard-library-import",                                                                                                                                                       # Fixes mark always-loaded modules `lazy`, multi-name `TYPE_CHECKING` imports raise `NameError` in cyclopts `App.command`
    "suspicious-subprocess-import",                                                                                                                                                              # Reports every `subprocess` import, process boundaries call it
    "missing-copyright-notice",                                                                                                                                                                  # Files hold no license header
    "float-equality-comparison",                                                                                                                                                                 # Authored controls compare against exact identity values (`0.0`, `1.0`)
    "zip-without-explicit-strict",                                                                                                                                                               # `strict=True` asserts lengths the code constructs
    "batched-without-explicit-strict",                                                                                                                                                           # `strict=True` asserts lengths the code constructs
    "subprocess-without-shell-equals-true",                                                                                                                                                      # Reports every argument-vector `subprocess` call
    "start-process-with-partial-path",                                                                                                                                                           # Commands name tools mise places on `PATH`
    "os-path-abspath",                                                                                                                                                                           # `os.path.abspath` drops `..` without following symlinks, a combination no `pathlib` member has
    "function-uses-loop-variable",                                                                                                                                                               # Reports closures `Result` and `Option` combinators call before the loop advances
    "logging-string-format",                                                                                                                                                                     # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "logging-percent-format",                                                                                                                                                                    # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "logging-string-concat",                                                                                                                                                                     # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "logging-f-string",                                                                                                                                                                          # refurb RASM103 owns the form over structlog calls of any receiver name, `%`, `str()` and `join` included
    "reimplemented-operator",                                                                                                                                                                    # Rewrites to `operator` functions typeshed types as returning `Any`, `banned-api` rejects the getters
    "lambda-assignment",                                                                                                                                                                         # Pushes a `def` statement for a callback each `match` arm binds
    "compare-with-tuple",                                                                                                                                                                        # PLR1714 reports the form as a set membership PLR6201 accepts
    "blocking-http-call-in-async-function",                                                                                                                                                      # `banned-api` rejects every client it names
    "blocking-http-call-httpx-in-async-function",                                                                                                                                                # `banned-api` rejects `httpx`
    "blocking-sleep-in-async-function",                                                                                                                                                          # `banned-api` rejects `time.sleep`
    "request-without-timeout",                                                                                                                                                                   # `banned-api` rejects every client it names
    "no-explicit-stacklevel",                                                                                                                                                                    # `banned-api` rejects `warnings.warn`
    "multiple-starts-ends-with",                                                                                                                                                                 # refurb FURB102 owns the form
    "repeated-append",                                                                                                                                                                           # Nominal receiver types do not prove exact builtin list mutation
    "len-test",                                                                                                                                                                                  # refurb FURB115 owns the form
    "for-loop-writes",                                                                                                                                                                           # refurb FURB122 owns the form
    "readlines-in-for",                                                                                                                                                                          # refurb FURB129 owns the form
    "delete-full-slice",                                                                                                                                                                         # refurb FURB131 covers attribute receivers
    "check-and-remove-from-set",                                                                                                                                                                 # Nominal receiver types do not prove exact builtin mutation, hashing, or equality
    "for-loop-set-mutations",                                                                                                                                                                    # Nominal receiver types do not prove exact builtin set mutation
    "slice-copy",                                                                                                                                                                                # refurb FURB145 owns the form
    "unnecessary-enumerate",                                                                                                                                                                     # refurb FURB148 owns the form, comprehensions included
    "true-false-comparison",                                                                                                                                                                     # refurb FURB149 reports `is` and `==` on bool-typed operands alone
    "hashlib-digest-hex",                                                                                                                                                                        # refurb FURB181 covers attribute receivers
    "undefined-name",                                                                                                                                                                            # ty `unresolved-reference` owns undefined names
    "any-type",                                                                                                                                                                                  # mypy `disallow_any_explicit` owns explicit `Any` in every position
]
flake8-bandit             = { check-typed-exception = true }
flake8-boolean-trap       = { extend-allowed-calls = ["expression.Result.Ok", "expression.Some", "iter"] }
flake8-import-conventions = { extend-aliases = { "dask.array" = "da", "dask.dataframe" = "dd", datetime = "datetime", scipy = "sp", sympy = "sym", xarray = "xr" }, banned-from = ["builtins"] }
flake8-pytest-style       = { parametrize-names-type = "csv", raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError"] }
flake8-type-checking      = { runtime-evaluated-base-classes = ["msgspec.Struct"] }
isort                     = { combine-as-imports = true, force-sort-within-sections = true, order-by-type = false, split-on-trailing-comma = false }
pycodestyle               = { max-line-length = 300 }
pydocstyle                = { convention = "google" }
pydoclint                 = { ignore-one-line-docstrings = true }
task-tags                 = ["---", "TODO", "FIXME", "XXX"]                                                                                                                                      # `# --- [<LABEL>]` dividers open with `---`, commented-out-code skips comments opening with a task tag
pylint                    = { allow-dunder-method-names = ["__name__", "__version__"], allow-magic-value-types = ["str", "bytes", "int"] }                                                       # Protocol properties type module attributes, which ty matches to a property alone

[tool.ruff.lint.per-file-ignores]
"**/tests/**"                                                           = ["assert"]
"libs/python/runtime/tests/telemetry/conftest.py"                       = ["banned-api", "pytest-fixture-autouse"]                                                # Copies structlog `tests/conftest.py:23,26,74` and CPython `Lib/test/test_logging.py:117`: autouse fixtures over `logging.getLogger()` and the root logger
"libs/python/runtime/tests/telemetry/suite/test_environment_carrier.py" = ["import-private-name"]                                                                 # Copies opentelemetry-api `tests/propagators/test__envcarrier.py:14-16`: the environment setter lives in private `_envcarrier` alone
"libs/python/runtime/tests/telemetry/suite/test_instrumented.py"        = ["banned-api", "hardcoded-temp-file", "import-private-name", "pytest-raises-too-broad"] # Copies `test_configurator_file_routing.py:47,57` path `/tmp/otel.yaml`, `test_proto_span_exporter.py:46,230,242`, and CPython `Lib/test/test_logging.py:3580`: a private variable name, `assertRaises(RuntimeError)` with no message, and `logging.getLogger`
"libs/python/runtime/tests/telemetry/suite/test_instrumented_logs.py"   = ["error-instead-of-exception", "import-private-name", "logging-exc-info"]               # Copies opentelemetry-instrumentation-structlog `tests/test_structlog.py:12,17-21,164,188,209`: `logger.error(..., exc_info=...)` inside `except`, and the logs API and SDK in private modules alone
"libs/python/runtime/tests/telemetry/suite/test_logger.py"              = ["banned-api"]                                                                          # Copies structlog `tests/test_stdlib.py:247,290,311,323` and CPython `Lib/test/test_logging.py:117`: `logging.getLogger("Test")` and the root logger
"libs/python/runtime/tests/telemetry/suite/test_otlp_http.py"           = ["banned-api", "import-private-name", "private-member-access"]                          # Copies `test_proto_span_exporter.py:32-35,265,447-450,644,747`: `_DEFAULT_TIMEOUT` of private `_common`, `exporter._client._transport`, `_endpoint`, `_compression`, `_client._headers`, `_client._timeout`, and `time.sleep`
"libs/python/runtime/tests/telemetry/suite/test_record.py"              = ["banned-api", "error-instead-of-exception", "import-private-name"]                     # Copies opentelemetry-instrumentation-logging `tests/test_handler.py:247,780` and opentelemetry-instrumentation `tests/test_log_utils.py:6`: `logging.getLogger("foo")`, `logger.error(..., exc_info=False)` inside `except`, and `SeverityNumber` in private `opentelemetry._logs` alone
"libs/python/runtime/tests/telemetry/suite/test_rotation.py"            = ["banned-api", "blind-except", "private-member-access"]                                 # Copies concurrent-log-handler `tests/test_concurrent_rotation_multiprocess.py:43,46,62,98` and `tests/test_fork_deadlock.py:80,105`: `clh._do_lock`, `os._exit`, `except Exception`, and `logging.getLogger`
"libs/python/runtime/tests/telemetry/suite/test_settings.py"            = ["banned-api"]                                                                          # Copies CPython `Lib/test/test_logging.py:198-202`: `logging.getLogger("ERR")` and `logging.LoggerAdapter`
"libs/python/runtime/tests/telemetry/suite/test_span_export.py"         = ["banned-api"]                                                                          # Copies opentelemetry-sdk `tests/trace/export/test_export.py:49`: `time.sleep`
"libs/python/runtime/tests/telemetry/suite/test_unhandled.py"           = ["banned-api", "import-private-name"]                                                   # Copies opentelemetry-instrumentation-exceptions `tests/test_exceptions.py:6,14-18,329-333`: `asyncio.BaseEventLoop` and `SeverityNumber` in private `opentelemetry._logs` alone
"libs/python/runtime/telemetry/rasm_telemetry/_entries.py"              = ["banned-api"]                                                                          # Holds the stdlib logger under each bound logger, the `logging.getLogger` call every other module leaves to it
"libs/python/runtime/telemetry/rasm_telemetry/export.py"                = ["import-private-name"]                                                                 # opentelemetry-api holds the entry point lookup the SDK caches in private `_importlib_metadata` alone
"libs/python/runtime/telemetry/rasm_telemetry/process.py"               = ["banned-api", "import-private-name", "private-member-access"]                          # Composition root the `logging` rows name, opentelemetry-api holds environment carriers and its cached entry point lookup, the SDK its exporter name resolution, and system-metrics its default table in private members alone
"libs/python/blender/bpy/rasm_bpy/data/_extension/reports.py"           = ["import-private-name"]                                                                 # opentelemetry-semantic-conventions holds `process.exit.code` in `_incubating` alone
"libs/python/blender/rendering/rasm_rendering/_batch/supervision.py"    = ["import-private-name"]                                                                 # opentelemetry-api holds `EnvironmentSetter` in private `_envcarrier` alone

[tool.ruff.lint.flake8-tidy-imports]
ban-lazy             = ["abc", "os", "sys"] # Interpreter startup loads them before any module runs
