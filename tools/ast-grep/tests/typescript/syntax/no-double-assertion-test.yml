id: no-double-assertion
valid:
    - 'const row = Schema.decodeUnknownSync(Row)(value);'
    - 'const row = value as Row;'
    - 'const held = value as unknown;'
    - "const kind = 'row' as const;"
    - 'const row = value as any as Row;'
    - 'const row = (value as Row) satisfies Row;'
    - 'const held = (value as Row) as unknown;'
    - 'const row = value as { id: string } as Row;'
    - 'const held = value as {};'
    - 'const row = value as string as Row;'
invalid:
    - 'const row = value as {} as Row;'
    - 'const row = value as object as Row;'
    - 'const row = (value as {}) as Row;'
    - 'const row = value as unknown as Row;'
    - 'const row = value as never as Row;'
    - 'const row = (value as unknown) as Row;'
    - 'const row = {} as unknown as Row;'
    - 'const rows = value as unknown as readonly Row[];'
    - 'use(value as unknown as Row);'
    - 'const row = value as { /* none */ } as Row;'
    - 'const row = (value as unknown as Row)!;'
