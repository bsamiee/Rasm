# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-result-combinator-by-hand
language: python
severity: error
utils:
    result-pattern:
        kind: class_pattern
        has: {kind: dotted_name, regex: '^([A-Za-z_]\w*\.)*Result$'}
    ok-call:
        kind: call
        has: {field: function, regex: '^(Result(\[.*\])?\.)?Ok$'}
    error-call:
        kind: call
        has: {field: function, regex: '^(Result(\[.*\])?\.)?Error$'}
    error-keyword:
        kind: keyword_pattern
        pattern:
            context: |
                match _:
                    case Result(error=$E): pass
            selector: keyword_pattern
    error-head:
        kind: case_clause
        all:
            - has:
                kind: case_pattern
                has:
                    matches: result-pattern
                    has: {kind: dotted_name, pattern: $RESULT_CLASS}
                    all:
                        - has: {kind: case_pattern, has: {matches: error-keyword}}
                        - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']error["'']$|error\s*=)'}}}}
            - not: {has: {field: guard, kind: if_clause}}
    error-arm:
        matches: error-head
        has:
            field: consequence
            kind: block
            not: {has: {nthChild: 2}}
            has: {kind: return_statement, has: {matches: error-call, has: {field: arguments, has: {kind: identifier, pattern: $E}, not: {has: {nthChild: 2}}}}}
    mapped-error-arm:
        matches: error-head
        has:
            field: consequence
            kind: block
            not: {has: {nthChild: 2}}
            has:
                kind: return_statement
                has:
                    matches: error-call
                    not: {has: {kind: 'await, named_expression, yield', stopBy: end}}
                    has:
                        field: arguments
                        not: {has: {nthChild: 2}}
                        has: {pattern: $FAILURE, not: {kind: identifier}, has: {kind: identifier, pattern: $E, stopBy: end}}
    named-head:
        kind: case_clause
        all:
            - has:
                kind: case_pattern
                has:
                    kind: class_pattern
                    has: {kind: dotted_name, pattern: $RESULT_CLASS}
                    all:
                        - has: {kind: case_pattern, has: {kind: keyword_pattern, has: {kind: dotted_name, pattern: $V}}}
                        - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']ok["'']$|ok\s*=)'}}}}
            - not: {has: {field: guard, kind: if_clause}}
    constant-head:
        kind: case_clause
        all:
            - has:
                kind: case_pattern
                has:
                    kind: class_pattern
                    has: {kind: dotted_name, pattern: $RESULT_CLASS}
                    all:
                        - has: {kind: case_pattern, has: {kind: keyword_pattern}}
                        - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']ok["'']|ok\s*=\s*_)$'}}}}
            - not: {has: {field: guard, kind: if_clause}}
    value-return:
        kind: return_statement
        not: {has: {kind: 'await, named_expression, yield', stopBy: end}}
        any:
            - has: {matches: ok-call, has: {field: arguments, not: {has: {nthChild: 2}}, has: {pattern: $VALUE, any: [{kind: identifier, pattern: $V}, {has: {kind: identifier, pattern: $V, stopBy: end}}]}}}
            - has:
                kind: call
                pattern: $STEP
                not: {any: [{matches: ok-call}, {matches: error-call}]}
                has: {field: arguments, has: {kind: identifier, pattern: $V, stopBy: end}}
    constant-return:
        kind: return_statement
        not: {has: {kind: 'await, named_expression, yield', stopBy: end}}
        has: {matches: ok-call, has: {field: arguments, not: {has: {nthChild: 2}}, has: {pattern: $CONSTANT}}}
    passing:
        kind: block
        not: {has: {nthChild: 2}}
        has: {any: [{kind: pass_statement}, {kind: expression_statement, has: {kind: ellipsis}}]}
    named-ok-arm:
        matches: named-head
        has: {field: consequence, kind: block, not: {has: {nthChild: 2}}, has: {matches: value-return}}
    identity-ok-arm:
        matches: named-head
        has:
            field: consequence
            kind: block
            not: {has: {nthChild: 2}}
            has: {kind: return_statement, has: {matches: ok-call, has: {field: arguments, has: {kind: identifier, pattern: $V}, not: {has: {nthChild: 2}}}}}
    constant-ok-arm:
        matches: constant-head
        has: {field: consequence, kind: block, not: {has: {nthChild: 2}}, has: {matches: constant-return}}
    wildcard-arm:
        kind: case_clause
        all:
            - has: {kind: case_pattern, regex: '^_$'}
            - not: {has: {field: guard, kind: if_clause}}
            - nthChild: {position: 1, reverse: true, ofRule: {kind: case_clause}}
            - has: {field: consequence, kind: block, not: {has: {nthChild: 2}}, has: {kind: return_statement, has: {pattern: $SUBJECT}}}
    last:
        nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}
rule:
    kind: match_statement
    all:
        - inside: {kind: function_definition, stopBy: end}
        - not: {inside: {kind: try_statement, has: {kind: finally_clause}, stopBy: {kind: function_definition}}}
        - not: {has: {kind: comment, stopBy: end}}
        - has: {field: subject, pattern: $SUBJECT, kind: 'identifier, attribute, call, subscript, parenthesized_expression, await'}
        - has: {field: body, kind: block, not: {has: {kind: case_clause, nthChild: {position: 3, ofRule: {kind: case_clause}}}}}
        - any:
            - all:
                - matches: last
                - has:
                    field: body
                    all:
                        - any: [{has: {matches: named-ok-arm}}, {has: {matches: constant-ok-arm}}]
                        - any: [{has: {matches: error-arm}}, {has: {matches: wildcard-arm}}]
            - all:
                - has: {field: body, all: [{has: {matches: named-head, has: {field: consequence, matches: passing}}}, {has: {matches: error-arm}}]}
                - precedes: {matches: value-return}
            - all:
                - has: {field: body, all: [{has: {matches: constant-head, has: {field: consequence, matches: passing}}}, {has: {matches: error-arm}}]}
                - precedes: {matches: constant-return}
            - all:
                - matches: last
                - has: {field: body, all: [{has: {matches: mapped-error-arm}}, {any: [{has: {matches: identity-ok-arm}}, {has: {matches: wildcard-arm}}]}]}
        - any:
            - all:
                - has: {field: body, all: [{has: {matches: identity-ok-arm}}, {any: [{has: {matches: error-arm}}, {has: {matches: wildcard-arm}}]}]}
                - has: {field: subject, pattern: $PLAIN}
            - has: {field: subject, pattern: $MAPPED}
rewriters:
    - id: awaited
      rule: {kind: await, pattern: $AWAITED, inside: {kind: match_statement}}
      fix: ($AWAITED)
    - id: identity
      rule: {kind: identifier, pattern: $V}
      fix: ''
    - id: point-free
      rule:
        kind: call
        pattern: $F($V)
        has: {field: function, kind: 'identifier, attribute', not: {any: [{pattern: $V}, {has: {kind: identifier, pattern: $V, stopBy: end}}]}}
      fix: $F
    - id: mapper
      rule: {pattern: $BODY}
      fix: 'lambda $V: $BODY'
    - id: error-point-free
      rule:
        kind: call
        pattern: $F($E)
        has: {field: function, kind: 'identifier, attribute', not: {any: [{pattern: $E}, {has: {kind: identifier, pattern: $E, stopBy: end}}]}}
      fix: $F
    - id: error-mapper
      rule: {pattern: $BODY}
      fix: 'lambda $E: $BODY'
transform:
    HEAD: rewrite($MAPPED, rewriters=[awaited])
    MAPPER: rewrite($VALUE, rewriters=[identity, point-free, mapper])
    MAP_TAIL: {replace: {source: $MAPPER, replace: '(?s)^(.+)$', by: '.map($1)'}}
    CONSTANT_TAIL: {replace: {source: $CONSTANT, replace: '(?s)^(.+)$', by: '.map(lambda _: $1)'}}
    BINDER: rewrite($STEP, rewriters=[point-free, mapper])
    BIND_TAIL: {replace: {source: $BINDER, replace: '(?s)^(.+)$', by: '.bind($1)'}}
    ERROR_MAPPER: rewrite($FAILURE, rewriters=[error-point-free, error-mapper])
    ERROR_TAIL: {replace: {source: $ERROR_MAPPER, replace: '(?s)^(.+)$', by: '.map_error($1)'}}
fix:
    template: return $HEAD$PLAIN$MAP_TAIL$CONSTANT_TAIL$BIND_TAIL$ERROR_TAIL
    expandEnd: {kind: return_statement}
message: 'Match over `$SUBJECT` spells a Result combinator by hand'
note: 'Use `<subject>.map(<f>)` for an `Ok(<value>)` return, `<subject>.bind(<f>)` for a returned Result, and `<subject>.map_error(<f>)` for an `Error(<value>)` return, each combinator passes the other case through unchanged'
labels:
    SUBJECT: {style: primary, message: Result the combinator runs on}
