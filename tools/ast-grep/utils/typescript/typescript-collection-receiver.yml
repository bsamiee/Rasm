# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-collection-receiver
language: tsx
arguments: [collection]
utils:
    collection-type:
        kind: type_annotation
        has: {kind: generic_type, has: {field: name, kind: type_identifier, matches: collection}}
    construction:
        kind: new_expression
        has: {field: constructor, kind: identifier, matches: collection}
    built:
        any:
            - matches: construction
            - matches: typescript-expression-wrapper
              has: {nthChild: 1, matches: built}
    collection-declared:
        any: [{has: {field: type, matches: collection-type}}, {has: {field: value, matches: built}}]
    receiver-binding:
        any:
            - kind: variable_declarator
              has: {field: name, pattern: $RECEIVER}
            - kind: required_parameter, optional_parameter
              has: {field: pattern, pattern: $RECEIVER}
    collection-binding:
        all: [{matches: receiver-binding}, {matches: collection-declared}]
    receiver-scope:
        any:
            - kind: statement_block, program
              has: {stopBy: &declaration {not: {kind: 'lexical_declaration, variable_declaration, export_statement'}}, matches: receiver-binding}
            - matches: typescript-function-boundary
              any:
                - has: {field: parameter, pattern: $RECEIVER}
                - has: {field: parameters, has: {matches: receiver-binding}}
            - kind: for_in_statement
              has: {field: left, pattern: $RECEIVER}
            - kind: catch_clause
              has: {field: parameter, pattern: $RECEIVER}
    collection-scope:
        any:
            - kind: statement_block, program
              has: {stopBy: *declaration, matches: collection-binding}
            - matches: typescript-function-boundary
              has: {field: parameters, has: {matches: collection-binding}}
rule:
    any:
        - kind: identifier
          pattern: $RECEIVER
          all:
            - inside: {stopBy: end, matches: collection-scope}
            - not: {inside: {stopBy: end, matches: receiver-scope, not: {matches: collection-scope}, inside: {stopBy: end, matches: collection-scope}}}
        - kind: member_expression
          all:
            - has: {field: object, kind: this}
            - has: {field: property, pattern: $FIELD}
            - inside:
                kind: class_body
                stopBy: end
                has:
                    kind: public_field_definition
                    all:
                        - has: {field: name, pattern: $FIELD}
                        - matches: collection-declared
