# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-infallible-unwrap
language: rust
severity: error
rule:
    kind: 'call_expression, match_expression'
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - any:
            - all: [{pattern: '$R.unwrap_or_else(|$E| match $E {})'}, {pattern: $OK}]
            - all: [{pattern: 'match $R { Ok($V) => $V, Err($E) => match $E {} }'}, {pattern: $OK}]
            - all: [{pattern: 'match $R { Err($E) => match $E {}, Ok($V) => $V }'}, {pattern: $OK}]
            - all: [{pattern: 'match $R { Ok($V) => match $V {}, Err($E) => $E }'}, {pattern: $ERR}]
            - all: [{pattern: 'match $R { Err($E) => $E, Ok($V) => match $V {} }'}, {pattern: $ERR}]
transform:
    OK_NAME: {replace: {source: $OK, replace: '^[\s\S]+$', by: 'into_ok'}}
    ERR_NAME: {replace: {source: $ERR, replace: '^[\s\S]+$', by: 'into_err'}}
fix: $R.$OK_NAME$ERR_NAME()
message: '`$R` unwraps an uninhabited case through an empty `match`'
note: 'Call `<result>.into_ok()` for an `Err` type of `!` and `<result>.into_err()` for an `Ok` type of `!`, each unwraps with no `match` and fails to compile once the other side becomes inhabited'
