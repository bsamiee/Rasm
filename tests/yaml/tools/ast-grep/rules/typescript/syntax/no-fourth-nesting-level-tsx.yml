id: no-fourth-nesting-level-tsx
valid:
    - |
      function f(xs: number[]) {
          for (const x of xs) {
              if (x > 0) {
                  while (x > 1) {
                      g(x);
                  }
              }
          }
      }
invalid:
    - |
      function f(xs: number[]) {
          for (const x of xs) {
              if (x > 0) {
                  while (x > 1) {
                      if (x > 2) {
                          g(x);
                      }
                  }
              }
          }
      }
    - |
      function f(xs: number[][]) {
          for (const row of xs) {
              if (row.length > 0) {
                  row.forEach((x) => {
                      log(x);
                      return x > 1 ? x : 0;
                  });
              }
          }
      }
