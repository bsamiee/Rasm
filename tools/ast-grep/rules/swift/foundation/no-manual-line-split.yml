# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    newline-text:
        any:
            - pattern: 'UInt8(ascii: "\n")'
            - pattern: 'Character("\n")'
            - kind: line_string_literal
              regex: '^"((\\r)?\\n|\\u\{0*[aA]\})"$'
            - kind: 'prefix_expression, navigation_expression'
              regex: '^(CharacterSet)?\.newlines$'
    newline-byte:
        any:
            - kind: hex_literal
              regex: '^0x0*[aA]$'
            - pattern: '10'
    newline:
        any:
            - matches: newline-text
            - all:
                - matches: newline-byte
                - inside: {kind: for_statement, stopBy: end, has: {kind: type_annotation, has: {field: name, regex: '^(UInt8|Int8|CChar)$'}}}
    newline-search:
        kind: call_expression
        all:
            - has: {kind: navigation_expression, has: {field: suffix, regex: '^\.(split|firstIndex|lastIndex|components|firstRange|ranges)$'}}
            - has:
                kind: call_suffix
                has:
                    kind: value_arguments
                    has:
                        kind: value_argument
                        has:
                            field: value
                            any:
                                - matches: newline-text
                                - all:
                                    - matches: newline-byte
                                    - inside: {kind: for_statement, stopBy: end, has: {field: item, follows: {regex: '^await$'}}}
rule:
    any:
        - kind: call_expression
          all:
            - has: {kind: navigation_expression, all: [{has: {field: target, pattern: $BYTES}}, {has: {field: suffix, regex: '^\.(split|components)$'}}]}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, kind: line_string_literal, regex: '^"((\\r)?\\n|\\u\{0*[aA]\})"$'}}}}
        - kind: for_statement
          all:
            - has: {field: collection, pattern: $BYTES}
            - has: {field: item, has: {field: bound_identifier, pattern: $B}}
            - not: {has: {stopBy: end, kind: call_expression, all: [{has: {kind: navigation_expression, regex: '^[^(]+\.decode$'}}, {has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: {position: 2, ofRule: {kind: value_argument}}, has: {field: name, regex: '^from$'}}}}}]}}
            - has:
                kind: statements
                has:
                    stopBy: end
                    any:
                        - kind: equality_expression
                          all:
                            - has: {pattern: $B}
                            - has: {matches: newline}
                        - kind: switch_statement
                          all:
                            - has: {pattern: $B}
                            - has: {kind: switch_entry, has: {kind: switch_pattern, has: {matches: newline, stopBy: end}}}
                        - pattern: $B.isNewline
                        - pattern: $_.newlines.contains($B)
                        - all:
                            - matches: newline-search
                            - any:
                                - has: {stopBy: end, pattern: $B}
                                - all:
                                    - has: {kind: navigation_expression, has: {field: target, pattern: $BUF}}
                                    - inside:
                                        kind: statements
                                        stopBy: end
                                        has:
                                            stopBy: end
                                            any: [{pattern: '$BUF.append($$$)'}, {pattern: '$BUF += $_'}]
                                            has:
                                                stopBy: end
                                                any:
                                                    - pattern: $B
                                                    - kind: simple_identifier
                                                      pattern: $PIECE
                                                      inside:
                                                        kind: statements
                                                        stopBy: end
                                                        has:
                                                            kind: property_declaration
                                                            all:
                                                                - has: {kind: pattern, has: {field: bound_identifier, pattern: $PIECE}, precedes: {stopBy: {kind: pattern}, follows: {regex: '^=$'}, any: [{pattern: $B}, {has: {stopBy: end, pattern: $B}}]}}
message: '`$BYTES` splits lines by hand'
note: 'Read JSON with Encoding `jsonLines` or Subprocess `strings(separatedBy: .unicodeScalarSequence(["\n"]))`, text with `lines` or `\.isNewline`'
