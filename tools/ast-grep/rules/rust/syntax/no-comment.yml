# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-comment
language: rust
severity: error
utils:
    section:
        kind: line_comment
        all:
            - regex: '^// --- \[[A-Z][A-Z0-9_]*\] -+$'
            - regex: '^.{90}$'
            - inside: {kind: source_file}
    family:
        kind: line_comment
        regex: '^// --- \[[A-Z][A-Z0-9_]*\]$'
rule:
    kind: 'line_comment, block_comment'
    not: {any: [{matches: section}, {matches: family}]}
fix: ''
message: Comment states a fact outside a section or family divider
note: 'Delete the comment and state its fact in a name, a type, or the `reason` of an `#[expect]`, Rust files hold `// --- [<SECTION>] ---` dividers ending at column 90 and `// --- [<FAMILY>]` subsections alone'
