# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-telemetry-tests"
version         = "0.0.0"
requires-python = ">=3.15"

dependencies = [
    # --- [CORE]

    "anyio",                                       # Event loop thread the trace service runs on, and the worker thread of an export a test interrupts
    "msgspec",                                     # Call record of the trace service and the script entries of a collector
    "pytest",                                      # Fixtures, parameters, captured logs, and environment variables of a child process
    "rasm-telemetry[otlp-grpc,otlp-http,process]", # Collector exporter and the instrumented process scope the cases export through
    "rasm-testing[hosting]",                       # HTTP server a test hosts, its answers, and the requests it received

    # --- [PROTOCOL]

    "googleapis-common-protos",                    # `google.rpc` Status of a refused OTLP/HTTP export and RetryInfo of a throttled OTLP/gRPC export
    "grpcio",                                      # Trace service a test hosts, status codes, and trailing metadata
    "opentelemetry-api",                           # Names of the variables selecting each signal's exporter
    "opentelemetry-exporter-otlp-proto-common",    # Span encoding each received request is compared with
    "opentelemetry-exporter-otlp-proto-http",      # OTLP/HTTP span exporter the collector returns
    "opentelemetry-proto",                         # Export request, response, and partial success messages of the trace service
    "opentelemetry-sdk",                           # Finished spans, export results, and the `OTEL_EXPORTER_OTLP_*` variable names
]
