id: rust-use
language: rustlang
role: item
symbolType: module
utils:
    argument: {pattern: $ARGUMENT}
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    not: {has: {kind: visibility_modifier}}
    any:
        - has: {field: argument, has: {field: path, matches: argument}}
        - has: {field: argument, kind: use_wildcard, has: {kind: 'crate, identifier, metavariable, scoped_identifier, self, super', matches: argument}}
        - has: {field: argument, matches: argument}
        - has: {field: name, matches: argument}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    NAME: {replace: {source: $ARGUMENT, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: false
---
id: rust-reexport
language: rustlang
role: item
symbolType: module
utils:
    argument: {pattern: $ARGUMENT}
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    has: {kind: visibility_modifier}
    any:
        - has: {field: argument, matches: argument}
        - has: {field: name, matches: argument}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    NAME: {replace: {source: $ARGUMENT, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: true
---
id: rust-mod
language: rustlang
role: item
symbolType: module
rule:
    kind: mod_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - {id: mod-body, rule: {kind: declaration_list, inside: {kind: mod_item, field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [mod-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-function
language: rustlang
role: item
symbolType: function
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    pattern: $DECLARATION
    not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}
    has: {field: name, pattern: $NAME}
rewriters:
    - {id: function-body, rule: {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-method
language: rustlang
role: item
symbolType: method
utils:
    owner: {pattern: $OWNER}
    owner-head:
        any:
            - {kind: 'type_identifier, primitive_type', matches: owner}
            - {kind: scoped_type_identifier, has: {field: name, matches: owner}}
            - {kind: generic_type, has: {field: type, matches: owner-head}}
            - {kind: 'reference_type, pointer_type', has: {field: type, matches: owner-head}}
            - {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    pattern: $DECLARATION
    inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, any: [{matches: owner-head}, {matches: owner}]}}]}}
    has: {field: name, pattern: $NAME}
rewriters:
    - {id: function-body, rule: {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $OWNED::$NAME
signature: $SIGNATURE
isExported:
    any:
        - has: {kind: visibility_modifier}
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}
---
id: rust-type
language: rustlang
role: item
symbolType: struct
rule:
    kind: 'struct_item, union_item, type_item, associated_type'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}
rewriters:
    - {id: struct-body, rule: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item', field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [struct-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-associated-type
language: rustlang
role: item
symbolType: typeParameter
utils:
    owner: {pattern: $OWNER}
    owner-head:
        any:
            - {kind: 'type_identifier, primitive_type', matches: owner}
            - {kind: scoped_type_identifier, has: {field: name, matches: owner}}
            - {kind: generic_type, has: {field: type, matches: owner-head}}
            - {kind: 'reference_type, pointer_type', has: {field: type, matches: owner-head}}
            - {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}
rule:
    kind: 'associated_type, type_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, any: [{matches: owner-head}, {matches: owner}]}}]}}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $OWNED::$NAME
signature: $SIGNATURE
isExported:
    any:
        - has: {kind: visibility_modifier}
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}
---
id: rust-enum
language: rustlang
role: item
symbolType: enum
rule:
    kind: enum_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - {id: enum-body, rule: {kind: enum_variant_list, inside: {kind: enum_item, field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [enum-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-trait
language: rustlang
role: item
symbolType: interface
rule:
    kind: 'trait_item, trait_alias'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - {id: trait-body, rule: {kind: declaration_list, inside: {kind: trait_item, field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trait-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-impl
language: rustlang
role: item
symbolType: object
utils:
    target: {pattern: $TARGET}
    target-head:
        any:
            - {kind: 'type_identifier, primitive_type', matches: target}
            - {kind: scoped_type_identifier, has: {field: name, matches: target}}
            - {kind: generic_type, has: {field: type, matches: target-head}}
            - {kind: 'reference_type, pointer_type', has: {field: type, matches: target-head}}
            - {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: target-head}}
rule:
    kind: impl_item
    pattern: $DECLARATION
    not: {has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}
    has: {field: type, any: [{matches: target-head}, {matches: target}]}
rewriters:
    - {id: impl-body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    NAME: {replace: {source: $TARGET, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [impl-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: rust-trait-impl
language: rustlang
role: item
symbolType: object
utils:
    implemented: {pattern: $IMPLEMENTED}
    trait-head:
        any:
            - {kind: type_identifier, matches: implemented}
            - {kind: scoped_type_identifier, has: {field: name, matches: implemented}}
            - {kind: generic_type, has: {field: type, matches: trait-head}}
    target: {pattern: $TARGET}
    target-head:
        any:
            - {kind: 'type_identifier, primitive_type', matches: target}
            - {kind: scoped_type_identifier, has: {field: name, matches: target}}
            - {kind: generic_type, has: {field: type, matches: target-head}}
            - {kind: 'reference_type, pointer_type', has: {field: type, matches: target-head}}
            - {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: target-head}}
rule:
    kind: impl_item
    pattern: $DECLARATION
    all:
        - has: {field: trait, any: [{matches: trait-head}, {matches: implemented}]}
        - has: {field: type, any: [{matches: target-head}, {matches: target}]}
rewriters:
    - {id: impl-body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    NAME: {replace: {source: $TARGET, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [impl-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $IMPLEMENTED for $NAME
signature: $SIGNATURE
isExported: true
---
id: rust-const
language: rustlang
role: item
symbolType: constant
utils:
    owner: {pattern: $OWNER}
    owner-head:
        any:
            - {kind: 'type_identifier, primitive_type', matches: owner}
            - {kind: scoped_type_identifier, has: {field: name, matches: owner}}
            - {kind: generic_type, has: {field: type, matches: owner-head}}
            - {kind: 'reference_type, pointer_type', has: {field: type, matches: owner-head}}
            - {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}
rule:
    kind: const_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    any:
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, any: [{matches: owner-head}, {matches: owner}]}}]}}
        - kind: const_item
rewriters:
    - id: value
      rule:
        kind: 'array_expression, assignment_expression, async_block, attributed_expression, await_expression, become_expression, binary_expression, block, boolean_literal, break_expression, builtin_expression, call_expression, char_literal, closure_expression, compound_assignment_expr, const_block, continue_expression, field_expression, float_literal, for_expression, gen_block, generic_function, identifier, if_expression, index_expression, integer_literal, loop_expression, macro_invocation, match_expression, metavariable, move_expression, parenthesized_expression, range_expression, raw_string_literal, reference_expression, return_expression, scoped_identifier, self, string_literal, struct_expression, try_block, try_expression, tuple_expression, type_cast_expression, unary_expression, unit_expression, unsafe_block, while_expression, yeet_expression, yield_expression'
        inside: {kind: const_item, field: value}
      fix: {template: ' ', expandStart: {regex: '^=$'}, expandEnd: {regex: '^;$'}}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    QUALIFIED: {replace: {source: $OWNER, replace: '$', by: '::'}}
    QUALIFIER: {replace: {source: $QUALIFIED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isExported:
    any:
        - has: {kind: visibility_modifier}
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}
---
id: rust-static
language: rustlang
role: item
symbolType: variable
rule:
    kind: static_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: value
      rule:
        kind: 'array_expression, assignment_expression, async_block, attributed_expression, await_expression, become_expression, binary_expression, block, boolean_literal, break_expression, builtin_expression, call_expression, char_literal, closure_expression, compound_assignment_expr, const_block, continue_expression, field_expression, float_literal, for_expression, gen_block, generic_function, identifier, if_expression, index_expression, integer_literal, loop_expression, macro_invocation, match_expression, metavariable, move_expression, parenthesized_expression, range_expression, raw_string_literal, reference_expression, return_expression, scoped_identifier, self, string_literal, struct_expression, try_block, try_expression, tuple_expression, type_cast_expression, unary_expression, unit_expression, unsafe_block, while_expression, yeet_expression, yield_expression'
        inside: {kind: static_item, field: value}
      fix: {template: ' ', expandStart: {regex: '^=$'}, expandEnd: {regex: '^;$'}}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-let
language: rustlang
role: item
symbolType: variable
rule:
    kind: let_declaration
    has: {field: pattern, pattern: $NAME}
    inside: {kind: 'source_file, declaration_list'}
name: $NAME
isExported: false
---
id: rust-macro
language: rustlang
role: item
symbolType: function
rule:
    kind: macro_definition
    has: {field: name, pattern: $NAME}
    all:
        - has: {regex: '^(?:macro_rules!|macro)$', pattern: $$KEYWORD}
        - any: [{has: {kind: visibility_modifier, pattern: $VISIBILITY}}, {kind: macro_definition}]
rewriters: [{id: spaced, rule: {kind: visibility_modifier, pattern: $V}, fix: '$V '}]
transform:
    PREFIX: {rewrite: {source: $VISIBILITY, rewriters: [spaced]}}
name: $NAME
signature: $PREFIX$KEYWORD $NAME
isExported:
    any:
        - has: {kind: visibility_modifier}
        - follows:
            kind: attribute_item
            has: {kind: attribute, has: {kind: identifier, regex: '^macro_export$'}}
            stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}
---
id: rust-macro-invocation
language: rustlang
role: item
symbolType: event
rule:
    kind: macro_invocation
    has: {field: macro, pattern: $NAME}
    inside: {any: [{kind: 'source_file, declaration_list'}, {kind: expression_statement, inside: {kind: source_file}}]}
name: $NAME
signature: $NAME!
isExported: false
---
id: rust-foreign-block
language: rustlang
role: item
symbolType: namespace
rule:
    kind: foreign_mod_item
    pattern: $DECLARATION
    has: {kind: extern_modifier, pattern: $NAME}
rewriters:
    - {id: foreign-body, rule: {kind: declaration_list, inside: {kind: foreign_mod_item, field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [foreign-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: rust-nested-function
language: rustlang
role: member
parentRuleIds: [rust-mod, rust-function, rust-method, rust-impl, rust-trait-impl, rust-trait]
symbolType: function
utils:
    scoped:
        inside:
            kind: 'declaration_list, block'
            not: {inside: {kind: 'impl_item, trait_item, foreign_mod_item'}}
            inside: {stopBy: end, kind: 'mod_item, function_item', any: [{has: {field: name, pattern: $OWNER}, inside: {kind: 'declaration_list, block'}}, {kind: 'mod_item, function_item'}]}
    named: {pattern: $NAME}
    declared: {pattern: $DECLARATION, any: [{matches: scoped}, {inside: {kind: declaration_list, inside: {kind: foreign_mod_item, matches: scoped}}}]}
    exposed: {not: {inside: {stopBy: end, any: [{kind: block}, {kind: mod_item, inside: {kind: 'declaration_list, block'}}, {kind: trait_item}], not: {has: {kind: visibility_modifier}}}}}
    visible: {any: [{has: {kind: visibility_modifier}}, {inside: {field: name, has: {kind: visibility_modifier}}}]}
rule:
    any:
        - kind: 'identifier, metavariable'
          matches: named
          inside: {kind: function_item, field: name, matches: declared}
        - kind: 'function_signature_item, delegation_item'
          matches: declared
          has: {field: name, matches: named}
rewriters:
    - {id: function-body, rule: {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {all: [{matches: visible}, {matches: exposed}]}
---
id: rust-nested-method
language: rustlang
role: member
parentRuleIds: [rust-mod, rust-function, rust-method, rust-impl, rust-trait-impl, rust-trait]
symbolType: method
utils:
    owner: {pattern: $OWNER}
    owner-head:
        any:
            - {kind: 'type_identifier, primitive_type', matches: owner}
            - {kind: scoped_type_identifier, has: {field: name, matches: owner}}
            - {kind: generic_type, has: {field: type, matches: owner-head}}
            - {kind: 'reference_type, pointer_type', has: {field: type, matches: owner-head}}
            - {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}
    owned:
        inside:
            kind: declaration_list
            inside:
                inside: {kind: 'declaration_list, block'}
                any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, has: {field: type, any: [{matches: owner-head}, {matches: owner}]}}]
    named: {pattern: $NAME}
    declared: {pattern: $DECLARATION, matches: owned}
    exposed: {not: {inside: {stopBy: end, any: [{kind: block}, {kind: mod_item, inside: {kind: 'declaration_list, block'}}, {kind: trait_item}], not: {has: {kind: visibility_modifier}}}}}
    visible: {any: [{has: {kind: visibility_modifier}}, {inside: {field: name, has: {kind: visibility_modifier}}}]}
    implied: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}}
rule:
    any:
        - kind: 'identifier, metavariable'
          matches: named
          inside: {kind: function_item, field: name, matches: declared}
        - kind: 'function_signature_item, delegation_item'
          matches: declared
          has: {field: name, matches: named}
rewriters:
    - {id: function-body, rule: {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}, fix: ' '}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $OWNED::$NAME
signature: $SIGNATURE
isPublic: {all: [{any: [{matches: visible}, {matches: implied}, {inside: {field: name, matches: implied}}]}, {matches: exposed}]}
---
id: rust-nested-type
language: rustlang
role: member
parentRuleIds: [rust-mod, rust-function, rust-method, rust-impl, rust-trait-impl, rust-trait]
symbolType: struct
utils:
    scoped:
        inside:
            kind: 'declaration_list, block'
            not: {inside: {kind: 'impl_item, trait_item, foreign_mod_item'}}
            inside: {stopBy: end, kind: 'mod_item, function_item', any: [{has: {field: name, pattern: $OWNER}, inside: {kind: 'declaration_list, block'}}, {kind: 'mod_item, function_item'}]}
    named: {pattern: $NAME}
    declared: {pattern: $DECLARATION, any: [{matches: scoped}, {inside: {kind: declaration_list, inside: {kind: foreign_mod_item, matches: scoped}}}]}
    exposed: {not: {inside: {stopBy: end, any: [{kind: block}, {kind: mod_item, inside: {kind: 'declaration_list, block'}}, {kind: trait_item}], not: {has: {kind: visibility_modifier}}}}}
    visible: {any: [{has: {kind: visibility_modifier}}, {inside: {field: name, has: {kind: visibility_modifier}}}]}
rule:
    any:
        - kind: type_identifier
          matches: named
          inside: {kind: 'struct_item, union_item', field: name, matches: declared}
        - kind: 'type_item, associated_type'
          matches: declared
          has: {field: name, matches: named}
rewriters:
