# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: sql
severity: error
utils:
    ordered-subquery:
        kind: select_clause
        has: {field: order_by, kind: order_by_clause}
    ordered-cte:
        kind: with_clause
        pattern: $WITH
        has:
            kind: cte_definition
            all:
                - has: {field: name, pattern: $CTE}
                - has: {field: body, matches: ordered-subquery}
rule:
    kind: function_call
    pattern: $AGGREGATE
    all:
        - any: [{matches: sql-string-aggregate}, {has: {field: name, regex: '(?i-u)^["`\[]?(json_group_array|json_group_object|jsonb_group_array|jsonb_group_object)["`\]]?$'}}]
        - has: {field: arguments, kind: normal_function_arguments, not: {has: {kind: order_by_clause}}}
        - not: {has: {field: over, kind: over_clause}}
        - inside:
            kind: result_column_list
            stopBy: {kind: 'select_statement, select_clause'}
            precedes:
                kind: from_clause
                stopBy: {not: {kind: 'line_comment, block_comment'}}
                has:
                    kind: table_or_subquery
                    stopBy: {kind: select_clause}
                    any:
                        - has: {matches: ordered-subquery}
                        - all:
                            - not: {has: {regex: '^\($'}}
                            - has:
                                kind: qualified_table_name
                                all:
                                    - not: {has: {field: schema, pattern: $_}}
                                    - has: {field: name, pattern: $CTE}
                            - inside:
                                kind: &scope 'select_statement, select_clause, insert_statement, update_statement, delete_statement'
                                stopBy: end
                                has: {field: with, matches: ordered-cte}
                            - not:
                                inside:
                                    kind: *scope
                                    stopBy: end
                                    all:
                                        - has:
                                            field: with
                                            not: {pattern: $WITH}
                                            has: {kind: cte_definition, has: {field: name, pattern: $CTE}}
                                        - inside:
                                            kind: *scope
                                            stopBy: end
                                            has: {field: with, pattern: $WITH}
message: '`$AGGREGATE` takes ordered rows without an aggregate `order by` clause'
note: 'Order aggregate inputs inside the call and retain subquery ordering that selects limited rows'
