# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: call_expression
    all:
        - has: {field: function, pattern: $DEFAULT, matches: {effect-module-member: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^withDecodingDefault(Key)?$'}}}}
        - has:
            field: arguments
            has:
                nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}
                kind: call_expression
                any:
                    - has: {field: function, kind: call_expression, has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^encode(Unknown)?Effect$'}}}}}
                    - all:
                        - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^succeed$'}}}}
                        - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, kind: call_expression, has: {field: function, kind: call_expression, has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^encode(Unknown)?Sync$'}}}}}}}
message: '`$DEFAULT` encodes a decoded default that each absent key decodes again'
note: 'Call `Schema.withDecodingDefaultTypeKey(Effect.succeed(<value>))` or `Schema.withDecodingDefaultType` with the decoded value'
