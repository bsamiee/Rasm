cpal = { version = "0.18.2", default-features = false }   # Audio device input and output
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "filter", "software-scaling", "software-resampling"] } # Video and audio mux, demux, and encode
libmpv2 = { version = "6.0.0", default-features = false } # Media playback through mpv
lofty = { version = "0.25.4", default-features = false, features = ["id3v2_compression_support"] } # Audio metadata tags
