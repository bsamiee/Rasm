# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-encoded-literal
language: csharp
severity: error
rule:
    kind: invocation_expression
    all:
        - has: {field: function, regex: '^((global::)?System\.)?(Text\.)?Encoding\.UTF8\.(GetBytes|GetByteCount)$'}
        - has:
            field: arguments
            all:
                - has: {kind: argument, has: {kind: 'string_literal, verbatim_string_literal, raw_string_literal'}}
                - not: {has: {kind: argument, nthChild: 2}}
        - pattern: $CALL
message: '`$CALL` encodes a constant string at run time'
note: 'Write the bytes as a `"..."u8` literal, `.ToArray()` where an array is required and `.Length` for the count'
