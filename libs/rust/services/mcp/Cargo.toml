# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-mcp"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["mcp", "rmcp", "server"]
categories           = ["network-programming", "artificial-intelligence"]
description          = "MCP service parts over rmcp: one service shared by many connections, a stdio proxy forwarding message envelopes to one upstream server, request tracing, and a routed server framework with elicitation"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [FEATURES] -------------------------------------------------------------------------

[features]
proxy     = ["dep:backon", "dep:bytes", "dep:memchr", "dep:serde_path_to_error", "dep:serde_with", "dep:jiff", "serde_json/raw_value", "tokio-util/time", "rmcp/client"]
telemetry = ["dep:opentelemetry", "dep:rasm-telemetry"]
app       = ["dep:arc-swap", "dep:nonempty-collections", "dep:validated", "dep:derive-where", "dep:bytes", "dep:data-encoding", "dep:serde_path_to_error", "dep:serde_urlencoded", "dep:jsonschema", "dep:uuid", "dep:form_urlencoded", "dep:matchit", "dep:percent-encoding", "dep:url", "rmcp/elicitation"]

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
backon                             = { workspace = true, optional = true }
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
arc-swap                           = { workspace = true, optional = true }
nonempty-collections               = { workspace = true, optional = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true, optional = true }
derive-where                       = { workspace = true, optional = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
bytes                              = { workspace = true, optional = true }
memchr                             = { workspace = true, optional = true }
data-encoding                      = { workspace = true, optional = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true, optional = true }
serde_urlencoded                   = { workspace = true, optional = true }
serde_with                         = { workspace = true, optional = true }
jsonschema                         = { workspace = true, optional = true }
jiff                               = { workspace = true, optional = true }
uuid                               = { workspace = true, optional = true }
form_urlencoded                    = { workspace = true, optional = true }
matchit                            = { workspace = true, optional = true }
percent-encoding                   = { workspace = true, optional = true }
url                                = { workspace = true, optional = true }
rmcp                               = { workspace = true, default-features = false, features = ["server"] }
opentelemetry                      = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
rasm-telemetry                     = { workspace = true, optional = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
