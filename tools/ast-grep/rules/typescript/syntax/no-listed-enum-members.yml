# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    literal-union:
        kind: union_type
        not: {has: {stopBy: end, pattern: $_, not: {kind: 'union_type, literal_type, string, string_fragment, escape_sequence'}}}
    member:
        kind: string
        inside: {kind: literal_type}
rule:
    kind: type_alias_declaration
    pattern: $DECLARATION
    all:
        - has: {field: value, matches: literal-union}
        - has: {field: name, pattern: $NAME}
        - inside:
            kind: program
            stopBy: end
            has:
                pattern: $STATEMENT
                has:
                    stopBy: end
                    kind: array
                    pattern: $LIST
                    all:
                        - has: {nthChild: 2, kind: string}
                        - not: {has: {pattern: $_, not: {kind: 'string, comment'}}}
                        - not:
                            has:
                                kind: string
                                pattern: $ITEM
                                not: {inside: {kind: program, stopBy: end, has: {stopBy: &top {not: {kind: export_statement}}, pattern: $DECLARATION, has: {field: value, has: {stopBy: end, matches: member, pattern: $ITEM}}}}}
                        - not:
                            inside:
                                kind: program
                                stopBy: end
                                has:
                                    stopBy: *top
                                    pattern: $DECLARATION
                                    has:
                                        field: value
                                        has:
                                            stopBy: end
                                            matches: member
                                            pattern: $MEMBER
                                            not: {inside: {kind: program, stopBy: end, has: {pattern: $STATEMENT, has: {stopBy: end, pattern: $LIST, has: {kind: string, pattern: $MEMBER}}}}}
message: '`$LIST` lists every member of `$NAME` again'
note: 'Declare members once in `Schema.Literals([...])` or `<list> = [...] as const`, and derive `typeof <schema>.Type` or `(typeof <list>)[number]`'
labels:
    LIST: {style: primary, message: Listed members}
