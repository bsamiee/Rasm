# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lifted-callback-result
language: tsx
severity: error
utils:
    succeed-module:
        matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Stream|Channel|Sink|Result))?$'}, exported: {regex: '^(Effect|Stream|Channel|Sink|Result)$'}}}
    option-module:
        matches: {syntax-import-reference: {source: {regex: '^effect(/Option)?$'}, exported: {regex: '^Option$'}}}
    constant-module:
        matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Option))?$'}, exported: {regex: '^(Effect|Option)$'}}}
    lifted-body:
        kind: call_expression, member_expression
        any:
            - has: {field: function, pattern: $M.succeed, has: {field: object, matches: succeed-module}}
            - has: {field: function, pattern: $M.some, has: {field: object, matches: option-module}}
            - pattern: $M.void
              has: {field: object, matches: constant-module}
    void-callback:
        kind: arrow_function, function_expression
        has:
            field: body
            any:
                - pattern: $M.void
                - kind: statement_block
                  has: {kind: return_statement, has: {pattern: $M.void}}
    lifting-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: '^async$'}}
        has:
            field: body
            any:
                - matches: lifted-body
                - kind: parenthesized_expression
                  has: {matches: lifted-body}
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: lifted-body}}
                  not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    lifted-value:
        matches: lifted-body
        not: {pattern: $_.void}
    point-free-lift:
        kind: member_expression
        any:
            - pattern: $M.succeed
              has: {field: object, matches: succeed-module}
            - pattern: $M.some
              has: {field: object, matches: option-module}
    identity-body:
        matches: lifted-value
        any: [{pattern: $_.$_($N)}, {pattern: $_.$_<$$$_>($N)}]
    identity-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: '^async$'}}
        any:
            - has: {field: parameter, kind: identifier, pattern: $N}
            - has:
                field: parameters
                has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $N}}
                not: {has: {nthChild: 2}}
        has:
            field: body
            any:
                - matches: identity-body
                - kind: parenthesized_expression
                  has: {matches: identity-body}
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: identity-body}}
                  not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    identity-step:
        any: [{matches: identity-callback}, {matches: point-free-lift}]
        not: {has: {kind: comment, stopBy: end}}
    recovered:
        kind: call_expression
        any: [{pattern: $M.$LIFT($V)}, {pattern: $M.$LIFT<$$$_>($V)}]
        not: {has: {field: arguments, has: {kind: spread_element}}}
    recovering-handler:
        kind: arrow_function, function_expression
        all:
            - not: {has: {regex: '^async$'}}
            - not: {has: {field: return_type, kind: type_annotation}}
            - not: {has: {field: parameters, has: {nthChild: 2}}}
            - has:
                field: body
                any:
                    - matches: recovered
                    - kind: parenthesized_expression
                      has: {matches: recovered}
                    - kind: statement_block
                      has: {kind: return_statement, has: {matches: recovered}}
                      not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
rule:
    kind: call_expression
    pattern: $CALL
    any:
        - all:
            - has: {field: function, pattern: $M.$F, has: {field: property, regex: '^(flatMap|andThen)$'}}
            - has:
                field: arguments
                has:
                    nthChild: {position: 1, reverse: true}
                    any:
                        - matches: lifting-callback
                        - matches: point-free-lift
                        - matches: lifted-value
                          has: {field: function, has: {field: object, matches: constant-module}}
                          inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, has: {field: property, regex: '^andThen$'}}}}
        - all:
            - has:
                field: function
                kind: member_expression
                pattern: $M.$F
                all:
                    - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Stream))?$'}, exported: {regex: '^(Effect|Stream)$'}}}}
                    - has: {field: property, regex: '^catch$'}
            - has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, matches: recovering-handler, pattern: $HANDLER}}
            - not: {has: {field: type_arguments, kind: type_arguments}}
            - not: {has: {kind: comment, stopBy: end}}
constraints:
    LIFT: {regex: '^(succeed|fail)$'}
rewriters:
    - id: recover-unlift-object
      rule: {matches: recovered, inside: {pattern: $HANDLER, field: body}, has: {field: arguments, has: {kind: object}}}
      fix: ($V)
    - id: recover-unlift
      rule: {matches: recovered, inside: {pattern: $HANDLER, stopBy: end}}
      fix: $V
    - id: recover
      rule: {kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^catch$'}}}, {has: {field: arguments, pattern: $ARGUMENTS}}]}
      transform:
        SUCCEEDED: replace($LIFT, replace='^succeed$', by='orElseSucceed')
        OPERATION: replace($SUCCEEDED, replace='^fail$', by='mapError')
        HANDLED: rewrite($ARGUMENTS, rewriters=[recover-unlift-object, recover-unlift])
      fix: $M.$OPERATION$HANDLED
    - id: identity-first
      rule:
        any: [{pattern: '$M.$_($SELF, $H)'}, {pattern: '$M.$_<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, matches: identity-step}}
      fix: $SELF
    - id: identity-last
      rule:
        any: [{pattern: $M.$OP($H)}, {pattern: $M.$OP<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, matches: identity-step}}
      fix: $M.$OP($H)
    - id: as-first
      rule:
        any: [{pattern: '$M.andThen($SELF, $H)'}, {pattern: '$M.andThen<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, matches: lifted-value}}
      transform:
        VALUE: rewrite($H, rewriters=[unlift-object, unlift])
      fix: $M.as($SELF, $VALUE)
    - id: as-last
      rule:
        any: [{pattern: $M.andThen($H)}, {pattern: $M.andThen<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, matches: lifted-value}}
      transform:
        VALUE: rewrite($H, rewriters=[unlift-object, unlift])
      fix: $M.as($VALUE)
    - id: return-type
      rule: {kind: type_annotation, inside: {matches: lifting-callback, field: return_type}}
      fix: ''
    - id: unlift-object
      rule:
        matches: lifted-body
        any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]
        has: {field: arguments, has: {kind: object}}
      fix: ($V)
    - id: unlift
      rule:
        matches: lifted-body
        any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]
      fix: $V
    - id: void-first
      rule:
        any: [{pattern: '$M.$_($SELF, $H)'}, {pattern: '$M.$_<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, matches: void-callback, not: {has: {kind: comment, stopBy: end}}}}
      fix: $M.asVoid($SELF)
    - id: void-last
      rule:
        any: [{pattern: $M.$_($H)}, {pattern: $M.$_<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, matches: void-callback, not: {has: {kind: comment, stopBy: end}}}}
      fix: $M.asVoid
    - id: map-first
      rule:
        any: [{pattern: '$M.$_($SELF, $H)'}, {pattern: '$M.$_<$$$_>($SELF, $H)'}]
        has: {field: arguments, has: {pattern: $H, not: {matches: void-callback}}}
      transform:
        BODY: rewrite($H, rewriters=[return-type, unlift-object, unlift])
      fix: $M.map($SELF, $BODY)
    - id: map-last
      rule:
        any: [{pattern: $M.$_($H)}, {pattern: $M.$_<$$$_>($H)}]
        has: {field: arguments, has: {pattern: $H, not: {matches: void-callback}}}
      transform:
        BODY: rewrite($H, rewriters=[return-type, unlift-object, unlift])
      fix: $M.map($BODY)
transform:
    MAPPED: rewrite($CALL, rewriters=[recover, as-first, as-last, identity-first, identity-last, void-first, void-last, map-first, map-last])
fix: $MAPPED
message: '`$M.$F` callback lifts its result back into `$M`'
note: '`<module>.map` transforms the value, `<module>.as` sets a constant, `<module>.asVoid` drops it, and `<module>.orElseSucceed` or `<module>.mapError` replaces a `catch` handler, each without a second lift'
labels: {CALL: {style: primary}}
