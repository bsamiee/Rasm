# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
files: ['libs/dotnet/ui/Rasm.UI/**', 'tests/dotnet/Rasm.Tests/**']
rule:
    kind: cast_expression
    pattern: $CAST
    all:
        - has: {field: type, regex: '^SKColor$'}
        - inside:
            kind: argument
            inside:
                kind: argument_list
                inside:
                    kind: invocation_expression
                    matches: {csharp-owner-call: {type: {regex: '^(SKColorFilter|SKImageFilter|SKShader)$'}, member: {regex: ^Create}}}
                    not: {matches: {csharp-named-call: {name: {regex: 'Lit(?:Diffuse|Specular)$'}}}}
message: '`$CAST` quantizes a float color to 8 bits for a Skia filter or shader'
note: '`SKColorFilter.CreateColorMatrix` takes floats; `SKShader.CreateColor(color, space)` takes `SKColorF`; lighting filters take `SKColor`'
