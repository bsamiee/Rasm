# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-parameter
language: python
arguments: [name]
rule:
    any:
        - kind: identifier
          matches: name
        - kind: typed_parameter, list_splat_pattern, dictionary_splat_pattern
          has:
            nthChild: 1
            any:
                - kind: identifier
                  matches: name
                - kind: list_splat_pattern, dictionary_splat_pattern
                  has: {kind: identifier, matches: name}
        - kind: default_parameter, typed_default_parameter
          has: {field: name, matches: name}
