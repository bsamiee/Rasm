# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-duration-unit-factor
language: rust
arguments: [path, count, secs, millis, micros, nanos]
utils:
    variable:
        any:
            - kind: 'identifier, field_identifier, self'
            - has: {stopBy: end, kind: 'identifier, field_identifier, self'}
    operand:
        all:
            - not: {kind: 'integer_literal, float_literal'}
            - matches: variable
            - any:
                - kind: parenthesized_expression
                  has: {nthChild: 1, matches: count}
                - matches: count
                  not: {kind: parenthesized_expression}
    product:
        kind: binary_expression
        has: {field: operator, regex: '^\*$'}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: scoped_identifier, all: [{has: {field: path, regex: '(^|::)Duration$', matches: path}}, {has: {field: name, regex: '^from_(secs|millis|micros|nanos)$'}}]}
        - has: {field: arguments, not: {has: {nthChild: 2}}}
        - any:
            - all:
                - has: {field: function, has: {field: name, regex: '^from_secs$'}}
                - has:
                    field: arguments
                    has:
                        nthChild: 1
                        matches: product
                        any:
                            - all: [{has: {field: right, kind: integer_literal, regex: &secs '^(6_*0|3_*6_*0_*0)(_?u64)?$', matches: secs}}, {has: {field: left, matches: operand}}]
                            - all: [{has: {field: left, kind: integer_literal, regex: *secs, matches: secs}}, {has: {field: right, matches: operand}}]
            - all:
                - has: {field: function, has: {field: name, regex: '^from_millis$'}}
                - has:
                    field: arguments
                    has:
                        nthChild: 1
                        matches: product
                        any:
                            - all: [{has: {field: right, kind: integer_literal, regex: &millis '^(1_*0_*0_*0|6_*0_*0_*0_*0|3_*6_*0_*0_*0_*0_*0)(_?u64)?$', matches: millis}}, {has: {field: left, matches: operand}}]
                            - all: [{has: {field: left, kind: integer_literal, regex: *millis, matches: millis}}, {has: {field: right, matches: operand}}]
            - all:
                - has: {field: function, has: {field: name, regex: '^from_micros$'}}
                - has:
                    field: arguments
                    has:
                        nthChild: 1
                        matches: product
                        any:
                            - all: [{has: {field: right, kind: integer_literal, regex: &micros '^(1_*0_*0_*0|1_*0_*0_*0_*0_*0_*0|6_*0_*0_*0_*0_*0_*0_*0|3_*6_*0_*0_*0_*0_*0_*0_*0_*0)(_?u64)?$', matches: micros}}, {has: {field: left, matches: operand}}]
                            - all: [{has: {field: left, kind: integer_literal, regex: *micros, matches: micros}}, {has: {field: right, matches: operand}}]
            - all:
                - has: {field: function, has: {field: name, regex: '^from_nanos$'}}
                - has:
                    field: arguments
                    has:
                        nthChild: 1
                        matches: product
                        any:
                            - all: [{has: {field: right, kind: integer_literal, regex: &nanos '^(1_*0_*0_*0|1_*0_*0_*0_*0_*0_*0|1_*0_*0_*0_*0_*0_*0_*0_*0_*0|6_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0|3_*6_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0)(_?u64)?$', matches: nanos}}, {has: {field: left, matches: operand}}]
                            - all: [{has: {field: left, kind: integer_literal, regex: *nanos, matches: nanos}}, {has: {field: right, matches: operand}}]
