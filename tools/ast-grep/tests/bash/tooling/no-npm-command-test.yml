id: no-npm-command
valid:
    - pnpm install
    - nx run rasm:check
    - echo npm
    - printf '%s' npx
    - '# npm install'
    - command -v npm
    - command -pv npm
    - env -u npm node
    - exec -a npm node
    - env NAME=npm node
    - env tool npm
    - command tool npm
    - exec tool npm
    - '"/opt/my tools/npm-helper" install'
    - sudo -u npm node
    - sudo --user npm node
    - sudo -l npm install
    - sudo -E -l npm install
    - command -p -v npm
    - sudo -p npm node
    - printf command npm install
invalid:
    - npm install
    - npx nx run rasm:check
    - cd app && npm ci
    - if true; then npm test; fi
    - '"npm" install'
    - '''npx'' nx --version'
    - /usr/bin/npm install
    - npx.cmd nx --version
    - npm.cmd install
    - NODE_ENV=test npm install
    - exec npm install
    - '"/usr/bin/npm" install'
    - command npm install
    - command -p npm install
    - exec -- npx nx lint
    - env npm install
    - env -i NODE_ENV=test npm install
    - '"/opt/my tools/npm" install'
    - '''/opt/my tools/npx'' nx lint'
    - env -- "/opt/my tools/npm" install
    - sudo npm install -g tool
    - sudo -u root -E npm install
    - env -u NAME npm install
    - exec -c npm install
    - exec -a name npm install
    - time npm install
    - time -p npm install
    - sudo env NODE_ENV=test npm install
    - command -p command npm install
    - /usr/bin/env npm install
    - time NAME=x npm install
    - sudo -S npm install
    - env -i -u NAME npm install
    - sudo -E -u root npm install
    - env -v npm install
    - exec -l npm install
