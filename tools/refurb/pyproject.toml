# --- [PROJECT] --------------------------------------------------------------------------

[project]
name              = "rasm-refurb"
version           = "0.1.0"
description       = "Refurb checks over mypy types Ruff lacks, loaded by refurb as a plugin"
readme            = "README.md"
license           = "MIT"
license-files     = ["LICENSE"]
authors           = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers       = ["Private :: Do Not Upload"]
requires-python   = ">=3.13"
import-names      = ["rasm.refurb"]
import-namespaces = ["rasm"]

dependencies = [
    "expression",   # `Option` and `Result`, whose fullnames RASM101 reads
    "msgspec",      # `msgspec.Struct` and `msgspec.field`, whose fullnames RASM102 reads
    "mypy",         # Nodes and types of the build refurb hands each check
    "rasm-records", # Words of a check class name its finding name derives from
    "refurb",       # Check host, visitor, and `get_mypy_type`
    "structlog",    # Bound logger types the log-field check reads
]

[project.entry-points."refurb.plugins"]
rasm = "rasm.refurb"

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/tools/refurb"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rasm.refurb"
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table
