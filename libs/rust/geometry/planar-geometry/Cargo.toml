# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-planar-geometry"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords             = ["polyline", "offset", "boolean", "geometry", "2d"]
categories           = ["mathematics", "algorithms", "graphics"]
description          = "Planar polylines with arcs and regions: offsets, booleans, clipping, and triangulation"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
nutype               = { workspace = true }
nalgebra             = { workspace = true }
cavalier_contours    = { workspace = true }
spade                = { workspace = true }
geo-types            = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
