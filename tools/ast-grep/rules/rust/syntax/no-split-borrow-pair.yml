# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-split-borrow-pair
language: rust
severity: error
rule:
    kind: let_declaration
    all:
        - matches: rust-split-borrow-pair
        - pattern: 'let ($HEAD, $TAIL) = $V.split_at_mut($AT);'
message: '`$V.split_at_mut($AT)` splits the slice to borrow one element from each half'
note: 'Write `let [<a>, <b>] = <slice>.get_disjoint_mut([<i>, <j>])?`, `get_disjoint_mut` returns both mutable references and an error for overlapping or out-of-range indices. Indexes into the halves become indexes into the slice'
