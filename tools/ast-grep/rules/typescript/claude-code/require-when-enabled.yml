# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Require the exact case object and synchronous empty arm; an async empty arm changes the returned value.
id: require-when-enabled
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
utils:
    option-member:
        any:
            - {kind: member_expression}
            - {kind: subscript_expression}
        has: {field: object, matches: claude-code-options-object}
    claude-code-options-object:
        kind: identifier
        any:
            - {regex: ^options$}
            - pattern: $OPTIONS
              inside:
                stopBy: end
                matches: syntax-function-boundary
                has:
                    field: parameters
                    has:
                        kind: required_parameter
                        all:
                            - {has: {field: pattern, kind: identifier, pattern: $OPTIONS}}
                            - {has: {field: type, kind: type_annotation, has: {kind: type_identifier, regex: ^Options$}}}
rule:
    kind: call_expression
    pattern: $MATCH
    all:
        - {not: {has: {stopBy: end, kind: comment}}}
        - has:
            field: function
            kind: member_expression
            all:
                - has:
                    field: object
                    kind: call_expression
                    all:
                        - {has: {field: function, regex: ^fromBoolean$}}
                        - has:
                            field: arguments
                            has: {pattern: $FLAG, any: [{matches: option-member}, {has: {stopBy: end, matches: option-member}}]}
                - {has: {field: property, regex: ^match$}}
        - {has: {field: type_arguments, pattern: {context: match<void>(), selector: type_arguments}}}
        - has:
            field: arguments
            has:
                kind: object
                not: {has: {nthChild: 3}}
                all:
                    - has:
                        kind: pair
                        all:
                            - {has: {field: key, regex: ^some$}}
                            - has:
                                field: value
                                kind: arrow_function
                                pattern: $REGISTER
                                has: {field: parameters, kind: formal_parameters, not: {has: {pattern: $_}}}
                    - has:
                        kind: pair
                        all:
                            - {has: {field: key, regex: ^none$}}
                            - has:
                                field: value
                                kind: arrow_function
                                all:
                                    - {has: {field: parameters, kind: formal_parameters, not: {has: {pattern: $_}}}}
                                has:
                                    field: body
                                    any:
                                        - {kind: undefined}
                                        - {pattern: void 0}
                                        - kind: statement_block
                                          not:
                                            has: {pattern: $_, not: {kind: return_statement, not: {has: {pattern: $_, not: {kind: undefined}}}}}
                                not: {has: {regex: ^async$}}
fix: whenEnabled($FLAG, $REGISTER)
message: The registration under `$FLAG` is gated by a match with an empty none arm, and `whenEnabled` is the gate
note: Gate the registration through `whenEnabled(options.<option>, () => register(on))` from host/options.ts
labels: {MATCH: {style: primary}}
