# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-mcp-bridge"
version.workspace    = true
categories           = ["command-line-utilities", "network-programming"]
edition.workspace    = true
keywords             = ["mcp", "modelcontextprotocol", "stdio", "streamable-http", "proxy"]
license.workspace    = true
repository.workspace = true
description          = "Bridges a stdio MCP server to loopback Streamable HTTP, hiding tools by glob"

# --- [BIN] ------------------------------------------------------------------------------

[[bin]]
name  = "rasm-mcp-bridge"
path  = "main.rs"
test  = false
bench = false

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
tokio      = { workspace = true }
tokio-util = { workspace = true }
thiserror  = { workspace = true }
globset    = { workspace = true }
rmcp       = { workspace = true }
tracing    = { workspace = true }
clap       = { workspace = true }
rasm-mcp   = { workspace = true }
