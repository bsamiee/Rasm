# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-coined-identifier-tsx
language: tsx
severity: error
utils:
    declared:
        any:
            - kind: identifier
              any:
                - inside: {kind: 'variable_declarator, function_declaration, generator_function_declaration, function_expression, generator_function, function_signature, enum_declaration, internal_module', field: name}
                - inside: {kind: 'required_parameter, optional_parameter', field: pattern}
                - inside: {kind: arrow_function, field: parameter}
                - inside: {kind: 'object_pattern, array_pattern', stopBy: {kind: 'variable_declarator, required_parameter, optional_parameter'}}
                - inside: {kind: rest_pattern}
                - inside: {kind: for_in_statement, field: left}
                - inside: {kind: catch_clause, field: parameter}
                - inside: {kind: 'import_specifier, export_specifier', field: alias}
                - inside: {kind: 'import_clause, namespace_import'}
            - kind: type_identifier
              inside: {kind: 'type_alias_declaration, interface_declaration, class_declaration, abstract_class_declaration, class, type_parameter', field: name}
            - kind: property_identifier, private_property_identifier
              inside: {kind: 'method_definition, public_field_definition, property_signature, method_signature, abstract_method_signature, enum_assignment', field: name}
            - kind: statement_identifier
              inside: {kind: labeled_statement, field: label}
            - kind: property_identifier
              any:
                - inside: {kind: enum_body}
                - inside: {kind: pair, field: key}
            - kind: shorthand_property_identifier_pattern
rule:
    all:
        - matches: declared
        - matches: text-coined-word
    pattern: $NAME
    not: {inside: {kind: ambient_declaration, stopBy: end}}
message: Declared name `$NAME` holds a coined term
note: Name the declaration after its host API member, language term, or domain word, a coined term names nothing a reader can look up
