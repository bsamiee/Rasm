# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-read-from-pipeline
language: bash
severity: error
utils:
    # A loop, or a read, mapfile, or readarray command, the stage that assigns from the pipe
    reading-stage:
        any:
            - kind: while_statement
            - kind: command
              has: {field: name, regex: '^(read|mapfile|readarray)$'}
    substitution: {any: [{kind: command_substitution}, {kind: process_substitution}]}
rule:
    kind: pipeline
    pattern: $PIPE
    all:
        # A redirect after the stage binds to the whole pipeline and sits outside it
        - has: {matches: reading-stage, pattern: $STAGE}
        # lastpipe runs the last stage in the current shell
        - not: {inside: {stopBy: end, kind: program, has: {stopBy: end, kind: command, regex: '^shopt\s+-s\s.*\blastpipe\b'}}}
        # As the last statement of a command or process substitution, every assignment vanishes with the substitution's own
        # subshell, and a statement after the pipeline inside the substitution reads what the stage lost
        - not:
              all:
                  - inside: {stopBy: end, matches: substitution}
                  - not:
                        any:
                            - precedes: {stopBy: end, pattern: $_}
                            - inside: {stopBy: {matches: substitution}, not: {matches: substitution}, precedes: {stopBy: end, pattern: $_}}
transform:
    # The text before the stage, the stage opens with a loop keyword or a reading builtin behind an optional assignment prefix
    PRODUCER:
        replace:
            source: $PIPE
            replace: '\s*\|&?\s*(while|until|(read|mapfile|readarray)\b|[A-Za-z_][A-Za-z0-9_]*=\S*\s+(read|mapfile|readarray)\b)[\s\S]*$'
            by: ''
    # The bar before the stage, |& merges standard error into the pipe
    BAR:
        replace:
            source: $PIPE
            replace: '^[\s\S]*?\s*(\|&?)\s*(while|until|(read|mapfile|readarray)\b|[A-Za-z_][A-Za-z0-9_]*=\S*\s+(read|mapfile|readarray)\b)[\s\S]*$'
            by: '$1'
    MERGE: replace($BAR, replace='^\|$', by='')
    STDERR: replace($MERGE, replace='^\|&$', by=' 2>&1')
    # The stages after a loop, empty when the loop is last, then empty when a reading builtin is the last stage
    AFTER_LOOP: replace($PIPE, replace='^[\s\S]*?\s*\|&?\s*(while|until)\b[\s\S]*\bdone\b', by='')
    CONSUMER: replace($AFTER_LOOP, replace='^[\s\S]*\|&?\s*([A-Za-z_][A-Za-z0-9_]*=\S*\s+)?(read|mapfile|readarray)\b[^|]*$', by='')
fix: $STAGE < <($PRODUCER$STDERR)$CONSUMER
message: The pipeline runs its reading stage in a subshell, and every variable the stage assigns vanishes when it ends
note: Read the producer through process substitution, `<loop or read> < <(<producer>)`, or set `shopt -s lastpipe`
