    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: visibility_modifier}
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}
---
id: rust-assoc-const
language: rustlang
role: member
parentRuleIds: [rust-impl, rust-trait-impl, rust-trait]
symbolType: constant
rule:
    kind: const_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}
rewriters:
    - id: value
      rule:
        kind: 'array_expression, assignment_expression, async_block, attributed_expression, await_expression, become_expression, binary_expression, block, boolean_literal, break_expression, builtin_expression, call_expression, char_literal, closure_expression, compound_assignment_expr, const_block, continue_expression, field_expression, float_literal, for_expression, gen_block, generic_function, identifier, if_expression, index_expression, integer_literal, loop_expression, macro_invocation, match_expression, metavariable, move_expression, parenthesized_expression, range_expression, raw_string_literal, reference_expression, return_expression, scoped_identifier, self, string_literal, struct_expression, try_block, try_expression, tuple_expression, type_cast_expression, unary_expression, unit_expression, unsafe_block, while_expression, yeet_expression, yield_expression'
        inside: {kind: const_item, field: value}
      fix: {template: ' ', expandStart: {regex: '^=$'}, expandEnd: {regex: '^;$'}}
    - {id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: visibility_modifier}
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}
---
id: rust-foreign-function
language: rustlang
role: member
parentRuleIds: [rust-foreign-block]
symbolType: function
rule:
    kind: 'function_item, function_signature_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: foreign_mod_item}}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-foreign-static
language: rustlang
role: member
parentRuleIds: [rust-foreign-block]
symbolType: variable
rule:
    kind: static_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: foreign_mod_item}}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-foreign-type
language: rustlang
role: member
parentRuleIds: [rust-foreign-block]
symbolType: struct
rule:
    kind: 'type_item, associated_type'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: foreign_mod_item}}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-type-field
language: rustlang
role: member
parentRuleIds: [rust-type]
symbolType: field
rule:
    kind: field_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item'}}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-enum-variant
language: rustlang
role: member
parentRuleIds: [rust-enum]
symbolType: enumMember
rule:
    kind: enum_variant
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: enum_variant_list, inside: {kind: enum_item}}
rewriters: [{id: comment, rule: {kind: 'line_comment, block_comment'}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [comment]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: rust-member-macro-invocation
language: rustlang
role: member
parentRuleIds: [rust-impl, rust-trait-impl, rust-trait, rust-mod, rust-function, rust-method, rust-foreign-block]
symbolType: event
rule:
    kind: macro_invocation
    has: {field: macro, pattern: $NAME}
    inside: {kind: declaration_list}
name: $NAME
signature: $NAME!
isPublic: false
