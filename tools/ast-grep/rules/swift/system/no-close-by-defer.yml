# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
rule:
    kind: defer_statement
    all:
        - has:
            stopBy: end
            kind: navigation_expression
            all:
                - has: {field: target, kind: simple_identifier, pattern: $DESCRIPTOR, matches: {swift-typed-use: {type: {regex: '^((System|SystemPackage)(\.|::))?FileDescriptor$'}}}}
                - has: {field: suffix, has: {field: suffix, regex: '^close$'}}
        - inside:
            kind: 'function_declaration, lambda_literal'
            stopBy: {kind: 'function_declaration, lambda_literal'}
            not: {has: {stopBy: {kind: 'function_declaration, lambda_literal'}, kind: await_expression}}
message: '`defer` closes `$DESCRIPTOR` around a synchronous body'
note: 'Run the body inside `<descriptor>.closeAfter { }`'
