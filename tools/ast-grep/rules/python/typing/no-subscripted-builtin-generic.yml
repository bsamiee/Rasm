# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-subscripted-builtin-generic
language: python
severity: error
metadata: {python-below: '3.14'}
rule:
    pattern: $G
    matches:
        python-evaluated-subscript:
            value:
                any:
                    - matches: {python-builtin-name: {name: {regex: '^(classmethod|memoryview|staticmethod)$'}}}
                    - matches: {python-member-use: {module: {regex: '^(_?(abc|ctypes|sqlite3)|types)$'}, name: {regex: '^(abstractclassmethod|abstractstaticmethod|py_object|Binary|UnionType)$'}}}
message: '`$G` defines no `__class_getitem__` at this file''s Python target, evaluated subscripts raise `TypeError`'
note: 'Use `A | B` for `types.UnionType`, the value''s `collections.abc` protocol (`Callable`, `Buffer`), or a quoted annotation'
