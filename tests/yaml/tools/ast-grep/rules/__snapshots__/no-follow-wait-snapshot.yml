id: no-follow-wait
snapshots:
  tail --follow=name app.log | head -n 1:
    labels:
    - source: tail --follow=name app.log
      message: Follower keeps waiting after its reader exits
      style: primary
      start: 0
      end: 26
  tail -F app.log 2>/dev/null | grep -q ready:
    labels:
    - source: tail -F app.log 2>/dev/null
      message: Follower keeps waiting after its reader exits
      style: primary
      start: 0
      end: 27
  tail -f app.log | grep -m 1 ready:
    labels:
    - source: tail -f app.log
      message: Follower keeps waiting after its reader exits
      style: primary
      start: 0
      end: 15
  tail -f app.log | read -r line:
    labels:
    - source: tail -f app.log
      message: Follower keeps waiting after its reader exits
      style: primary
      start: 0
      end: 15
