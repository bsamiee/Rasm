# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-string-test-of-number-by-hand
language: bash
severity: error
rule:
    kind: test_command
    pattern: $TEST
    has:
        stopBy: end
        matches: bash-numeric-comparison
        any:
            - inside: {kind: binary_expression} # Joined to another test by && or ||, no-string-test-of-number owns the whole-test form
            - inside: {kind: parenthesized_expression} # Grouped, under a join or a negation
            - has: {field: left, kind: unary_expression, regex: '^!'}
message: '`$TEST` compares a number as a string beside another test or under `!`'
note: 'Give each number comparison its own arithmetic command, `((<name> == <n>)) && [[ <test> ]]`, and negate by operator, `((<name> != <n>))`'
