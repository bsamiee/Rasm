# --- [PACKAGE] --------------------------------------------------------------------------

# --- [IDENTITY]

[package]
name              = "rasm-lints-tests"
edition.workspace = true

# --- [NX]

[package.metadata.nx]
implicitDependencies = ["rasm_lints"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [EXAMPLE]

[[example]]
name = "assertions_outside_tests"
path = "expansions/assertions_outside_tests.rs"

[[example]]
name       = "duplicate_trait_constant_exported"
crate-type = ["lib"]

[[example]]
name = "interior_mutable_static"
path = "expansions/interior_mutable_static.rs"

[[example]]
name       = "macro_alias_exported"
crate-type = ["lib"]

[[example]]
name = "macro_matching"
path = "expansions/macro_matching.rs"

[[example]]
name = "orphan_module_target"
path = "examples/orphan_module_target/suite.rs"

[[example]]
name       = "manual_path_is_empty_no_std"
crate-type = ["lib"]

[[example]]
name       = "manual_reference_impl_exported"
crate-type = ["lib"]

[[example]]
name       = "manual_upcast_exported"
crate-type = ["lib"]

[[example]]
name       = "needless_reference_field_exported"
crate-type = ["lib"]

[[example]]
name       = "reexported_dependency"
crate-type = ["lib"]

[[example]]
name       = "single_reader_exported"
crate-type = ["lib"]

[[example]]
name       = "untyped_error_exported"
crate-type = ["lib"]

# --- [TEST]

[[test]]
name = "expansions"
path = "expansions/main.rs"
test = false

[[test]]
name = "ui"
path = "ui/main.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dev-dependencies]
strum                              = { workspace = true }
itertools                          = { workspace = true }
dunce                              = { workspace = true }
cargo_metadata                     = { workspace = true }
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
rayon                              = { workspace = true }
anyhow                             = { workspace = true }
nonempty-collections               = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
uuid                               = { workspace = true }
fs-err                             = { workspace = true, features = ["tokio"] }
rmcp                               = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
tracing                            = { workspace = true }
clap                               = { workspace = true }
nuts-rs                            = { workspace = true }
insta                              = { workspace = true, features = ["glob"] }
rasm-lints-auxiliary               = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
