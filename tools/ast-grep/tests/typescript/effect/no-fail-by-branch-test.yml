id: no-fail-by-branch
valid:
    # The guard names the predicate and the error beside each other
    - |
      Effect.filterOrFail(work, (held) => held.ok, () => new PolicyError({ reason: 'rejected' }))
    # Local guarded through the lift
    - |
      Effect.liftPredicate(report, (held) => held.verdict !== 'regression', () => error)
    # Option as the Effect it is, the failure renamed in place
    - |
      Effect.mapError(found, () => new MissingError({ name }))
    # Both arms run effects, the branch selects between two operations
    - |
      Effect.if(ready, { onTrue: () => run, onFalse: () => wait })
    # One arm fails and the other runs an operation, the branch is a dispatch
    - |
      Effect.if(ready, { onTrue: () => run, onFalse: () => Effect.fail(error) })
    # Both arms pass values through, the branch selects a value
    - |
      Effect.if(seen, { onTrue: () => Effect.succeed([]), onFalse: () => Effect.succeed(rows) })
    # Option matched into an operation and a failure, a dispatch
    - |
      Option.match(found, { onNone: () => Effect.fail(error), onSome: (item) => write(item) })
    # Exit with a reporting failure arm and a point-free success arm
    - |
      Exit.match(exit, { onFailure: report, onSuccess: Effect.succeed })
    # Match on a module outside the effect package, the rule reads the effect data types alone
    - |
      Item.match(item, { onLeaf: () => Effect.fail(error), onNode: () => Effect.void })
    # Layer match with layer arms, the rule reads the effect constructors alone
    - |
      Layer.match(layer, { onFailure: () => Layer.fail(error), onSuccess: Layer.succeedContext })
    # Block-bodied arm with a statement before the return, the arm runs an operation
    - |
      Effect.if(holds, { onTrue: () => { report(); return Effect.fail(error); }, onFalse: () => Effect.void })
    # Array match with a failing empty arm beside an arm that runs an operation, a dispatch
    - |
      Array.match(rows, { onEmpty: () => Effect.fail(error), onNonEmpty: (rows) => write(rows) })
    # Block-bodied passing arm with a statement before the return, the arm runs an operation
    - |
      Effect.if(holds, { onTrue: () => Effect.fail(error), onFalse: () => { report(); return Effect.succeed(value); } })
    # Effect constant outside the pass set as the arm, Effect.interrupt runs an operation
    - |
      Effect.if(holds, { onTrue: () => Effect.fail(error), onFalse: () => Effect.interrupt })
    # Two-step chain with a failing arm beside an arm that runs an operation, a dispatch
    - |
      Match.value(kind).pipe(Match.when("a", () => Effect.fail(error)), Match.orElse(() => run))
invalid:
    # The instance, a boolean result inspected to fail
    - |
      Effect.if(holds, { onTrue: () => Effect.fail(new PolicyError({ reason: 'counterexample' })), onFalse: () => Effect.void })
    # The value passes through the other arm
    - |
      Effect.if(report.verdict === 'regression', { onTrue: () => Effect.fail(error), onFalse: () => Effect.succeed(report) })
    # The mirrored arms
    - |
      Effect.if(valid, { onTrue: () => Effect.succeed(value), onFalse: () => Effect.fail(error) })
    # The same branch spelled as Boolean.match
    - |
      Boolean.match(flag, { onFalse: () => Effect.succeed(value), onTrue: () => Effect.fail(error) })
    # Branch inside a flatMap over the inspected value
    - |
      Effect.flatMap(work, (holds) => Effect.if(holds, { onTrue: () => Effect.fail(error), onFalse: () => Effect.void }))
    # Option re-lifted into the Effect it is
    - |
      Option.match(found, { onNone: () => Effect.fail(new MissingError({ name })), onSome: (item) => Effect.succeed(item) })
    # Either re-lifted through point-free constructors
    - |
      Either.match(decoded, { onLeft: Effect.fail, onRight: Effect.succeed })
    # Exit re-lifted with its cause
    - |
      Exit.match(exit, { onFailure: (cause) => Effect.failCause(cause), onSuccess: Effect.succeed })
    # Exit re-lifted through point-free constructors, the cause arm as the constructor itself
    - |
      Exit.match(exit, { onFailure: Effect.failCause, onSuccess: Effect.succeed })
    # Option match with a presence arm that yields Effect.void
    - |
      Option.match(found, { onNone: () => Effect.fail(error), onSome: () => Effect.void })
    # Exit re-lifted through matchEffect, the effect-returning match spelling
    - |
      Exit.matchEffect(exit, { onFailure: Effect.failCause, onSuccess: Effect.succeed })
    # Effect matched into a renamed failure and the value, the shape Effect.mapError states
    - |
      Effect.matchEffect(work, { onFailure: () => Effect.fail(error), onSuccess: Effect.succeed })
    # Micro matched into a renamed failure and the value through the Micro constructors
    - |
      Micro.matchEffect(work, { onFailure: () => Micro.fail(error), onSuccess: Micro.succeed })
    # Option re-lifted into a Micro with its cause, the presence arm yields Micro.void
    - |
      Option.match(found, { onNone: () => Micro.failCause(cause), onSome: () => Micro.void })
    # STM matched into a renamed failure and the value through the STM constructors
    - |
      STM.matchSTM(transaction, { onFailure: () => STM.fail(error), onSuccess: (value) => STM.succeed(value) })
    # Either re-lifted into an STM through the point-free failure and the void pass
    - |
      Either.match(decoded, { onLeft: STM.fail, onRight: () => STM.void })
    # Defect in one arm, the guard is Effect.filterOrDie
    - |
      Effect.if(holds, { onTrue: () => Effect.die(new Error('counterexample')), onFalse: () => Effect.void })
    # Defect message in one arm, the guard is Effect.filterOrDieMessage
    - |
      Effect.if(holds, { onTrue: () => Effect.dieMessage('counterexample'), onFalse: () => Effect.succeed(value) })
    # Micro defect beside the Micro pass
    - |
      Boolean.match(flag, { onFalse: () => Micro.succeed(value), onTrue: () => Micro.die(error) })
    # STM defect passed point-free
    - |
      Either.match(decoded, { onLeft: STM.die, onRight: STM.succeed })
    # Exit re-lifted through the cause match, the failure arm receives the cause it fails with
    - |
      Exit.matchCauseEffect(exit, { onFailure: Effect.failCause, onSuccess: Effect.succeed })
    # Effect matched through matchCause into a renamed failure and the value
    - |
      Effect.matchCause(work, { onFailure: () => Effect.fail(error), onSuccess: Effect.succeed })
    # Two-step chain over the boolean, Match.when fails and Match.orElse passes nothing through
    - |
      Match.value(holds).pipe(Match.when(true, () => Effect.fail(error)), Match.orElse(() => Effect.void))
    # Two-step chain through the pipe function with the point-free failure and the lifted value
    - |
      pipe(Match.value(holds), Match.when(true, Effect.fail), Match.orElse(() => Effect.succeed(value)))
    # Sync defect thunk beside the pass, the orDieWith slot of Effect.filterOrDie takes the thunk
    - |
      Effect.if(holds, { onTrue: () => Effect.dieSync(() => new Error('x')), onFalse: () => Effect.void })
    # Sync failure thunk beside the lifted value, the orFailWith slot of Effect.filterOrFail takes the thunk
    - |
      Effect.if(holds, { onTrue: () => Effect.succeed(value), onFalse: () => Effect.failSync(() => error) })
    # Micro sync failure passed point-free beside the Micro pass
    - |
      Either.match(decoded, { onLeft: Micro.failSync, onRight: Micro.succeed })
    # Block-bodied failing arm with the one return, the constructor is the answer
    - |
      Effect.if(holds, { onTrue: () => { return Effect.fail(error); }, onFalse: () => Effect.void })
    # Block-bodied passing arm with the one return
    - |
      Effect.if(holds, { onTrue: () => Effect.fail(error), onFalse: () => { return Effect.succeed(value); } })
    # STM branch, the guard is STM.filterOrFail
    - |
      STM.if(holds, { onTrue: () => STM.fail(error), onFalse: () => STM.void })
    # Array matched into a failure on the empty case, the guard is Effect.liftPredicate under Array.isNonEmptyArray
    - |
      Array.match(rows, { onEmpty: () => Effect.fail(new EmptyError({ name })), onNonEmpty: Effect.succeed })
    # Array matched at its left end
    - |
      Array.matchLeft(rows, { onEmpty: () => Effect.fail(error), onNonEmpty: (head) => Effect.succeed(head) })
