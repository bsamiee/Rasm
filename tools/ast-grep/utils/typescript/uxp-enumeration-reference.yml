# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: uxp-enumeration-reference
language: tsx
rule:
    any:
        - matches: {syntax-import-reference: {source: {regex: '^(adobe:)?indesign$'}, exported: {regex: '^[A-Z]'}}}
        - kind: identifier
          regex: '^[A-Z]'
          pattern: $ENUMERATION
          inside:
            kind: statement_block, program
            stopBy: end
            has:
                kind: lexical_declaration
                has:
                    kind: variable_declarator
                    all:
                        - has: {field: name, kind: object_pattern, has: {kind: shorthand_property_identifier_pattern, pattern: $ENUMERATION}}
                        - has: {field: value, kind: identifier, pattern: $MODULE}
                        - inside:
                            kind: program
                            stopBy: end
                            has:
                                kind: import_statement
                                all:
                                    - has: {field: source, regex: '^.(adobe:)?indesign.$'}
                                    - has: {kind: import_clause, has: {kind: identifier, pattern: $MODULE}}
