# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: sql
severity: error
utils:
    leading-slice:
        kind: function_call
        all:
            - has: {field: name, regex: '(?i-u)^["`\[]?substr(ing)?["`\]]?$'}
            - has:
                field: arguments
                kind: normal_function_arguments
                all:
                    - not: {has: {nthChild: {position: 4, ofRule: &named {not: {kind: 'line_comment, block_comment'}}}}}
                    - has: {nthChild: {position: 3, ofRule: *named}}
                    - has: {nthChild: {position: 2, ofRule: *named}, kind: numeric_literal, regex: '^1$'}
    prefix-length:
        kind: function_call
        all:
            - has: {field: name, regex: '(?i-u)^["`\[]?length["`\]]?$'}
            - has: {field: arguments, has: {nthChild: &first {position: 1, ofRule: *named}, pattern: $PREFIX}}
    base-length:
        kind: function_call
        all:
            - has: {field: name, regex: '(?i-u)^["`\[]?length["`\]]?$'}
            - has: {field: arguments, has: {nthChild: *first, pattern: $BASE}}
    separated-length:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\+$'}
            - any:
                - all: [{has: {field: left, matches: base-length}}, {has: {field: right, kind: numeric_literal, regex: '^1$'}}]
                - all: [{has: {field: right, matches: base-length}}, {has: {field: left, kind: numeric_literal, regex: '^1$'}}]
    separated-prefix:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\|\|$'}
            - has: {field: left, pattern: $BASE}
            - has: {field: right, kind: string_literal, regex: "^'([^']|'')'$"}
rule:
    kind: binary_expression
    pattern: $TEST
    all:
        - has: {field: operator, regex: '^(==?|<>|!=)$'}
        - any:
            - all: [{has: {field: left, matches: leading-slice}}, {has: {field: right, pattern: $PREFIX}}]
            - all: [{has: {field: right, matches: leading-slice}}, {has: {field: left, pattern: $PREFIX}}]
        - any:
            - has: {matches: leading-slice, has: {field: arguments, has: {nthChild: &last {position: 1, reverse: true, ofRule: *named}, matches: prefix-length}}}
            - all:
                - has: {matches: leading-slice, has: {field: arguments, has: {nthChild: *last, matches: separated-length}}}
                - has: {matches: separated-prefix}
message: '`$TEST` compares `$PREFIX` with a prefix-length slice'
note: 'Use `instr(<subject>, <prefix>) = 1` under binary text comparison while preserving expression evaluation'
