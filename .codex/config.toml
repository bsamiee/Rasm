# --- [CODEX] ----------------------------------------------------------------------------

# --- [PERMISSIONS]

approval_policy = "never"
sandbox_mode    = "danger-full-access"

# --- [AGENTS]

[agents]
max_concurrent_threads_per_session = 30

# --- [APPS]

[apps._default]
default_tools_approval_mode = "approve"

# --- [NOTICE]

[notice]
hide_full_access_warning = true

# --- [SHELL_ENVIRONMENT]

[shell_environment_policy]
inherit = "core"
