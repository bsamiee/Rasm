# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# The rewrite run-in-callback-to-composed-effect fixes a run that is the whole answer of a map, sync, or promise callback
id: no-run-in-effect-callback
language: tsx
severity: error
utils:
    runtime-member:
        kind: member_expression
        all:
            - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro|Runtime)$'}}}}
            - has: {field: property, regex: '^(runPromise|runPromiseExit|runSync|runSyncExit|runFork|runCallback)$'}
    effect-owner:
        kind: call_expression
        any:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: "^(map|flatMap|sync|suspend|promise|try|tryPromise|gen|fn|fnUntraced|mapOut)$"}
                    - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro|STM|Stream|Layer|Channel|Sink)$'}}}}
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: "^(update|modify)$"}
                    - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Ref$'}}}}
            - has: {field: function, kind: call_expression, matches: effect-owner}
    callback:
        matches: syntax-function-boundary
        any:
            - inside: {kind: arguments, inside: {matches: effect-owner}}
            - inside: {kind: pair, field: value, inside: {kind: object, inside: {kind: arguments, inside: {matches: effect-owner}}}}
rule:
    kind: call_expression
    pattern: $RUN
    all:
        - any:
            - has: {field: function, matches: runtime-member}
              any:
                - has: {field: function, has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro)$'}}}}}
                - has: {field: arguments, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
            - has:
                field: function
                kind: call_expression
                has:
                    field: function
                    matches: runtime-member
                    has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Runtime$'}}}}
        - inside: {matches: callback, stopBy: {matches: syntax-function-boundary}}
message: An Effect callback starts a separate runtime instead of composing its computation
note: Return the effect through the callback's combinator or yield it inside Effect.gen, and run effects at the host boundary alone
labels:
    RUN: {style: primary}
