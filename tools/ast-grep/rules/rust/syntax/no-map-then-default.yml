# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-map-then-default
language: rust
severity: error
utils:
    default-value:
        any:
            - kind: 'call_expression, scoped_identifier'
              regex: '^(\w+::)*([A-Z]\w*(::<[^>]*>)?::default|(String|Vec|VecDeque|BTreeMap|BTreeSet|HashMap|HashSet|BinaryHeap|LinkedList|OsString|PathBuf)::new)(\(\))?$'
            - kind: macro_invocation
              regex: '^vec!\s*(\(\s*\)|\[\s*\]|\{\s*\})$'
            - kind: closure_expression
              all:
                - has: {field: parameters, regex: '^\|\s*(_\w*)?\s*\|$'}
                - has: {field: body, matches: default-value}
rule:
    kind: call_expression
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - any:
            - pattern: $O.map($F).unwrap_or_default()
            - pattern: $O.map_or($D, $F)
            - pattern: $O.map_or_else($D, $F)
constraints:
    D: {matches: default-value}
fix: $O.map_or_default($F)
message: '`$O` maps its value and falls back to the default in two calls'
note: 'Call `<option or result>.map_or_default(<fn>)` (`Option` and `Result`, Rust 1.98), which returns `Default::default()` for `None` or `Err`, a literal fallback (`0`, `""`, `false`) states its value and stays as written'
