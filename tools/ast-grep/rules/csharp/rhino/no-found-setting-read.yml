# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-found-setting-read
language: csharp
severity: error
files: ['**/rhino/**']
rewriters:
    - id: found-read
      rule:
        pattern: Answers.Found($STORE.$READ($ENTRY, out $TYPE $V), $V)
      constraints:
        READ: {regex: '^TryGet(Bool|Integer|UnsignedInteger|Double|String|Color)$'}
      transform:
        KIND: {replace: {source: $READ, replace: '^TryGet', by: ''}}
      fix: SettingType.$KIND.Read($STORE, $ENTRY)
    - id: found-optional-color
      rule:
        pattern: Answers.Found($STORE.TryGetColor($ENTRY, out $_ $V), Optional($V))
      fix: SettingType.Color.Read($STORE, $ENTRY)
    - id: found-enum
      rule:
        any:
            - pattern: Answers.Found($STORE.TryGetEnumValue($ENTRY, out $TYPE $V), $V)
            - pattern: Answers.Found($STORE.TryGetEnumValue<$TYPE>($ENTRY, out $_ $V), $V)
      fix: SettingType.Enumeration<$TYPE>().Read($STORE, $ENTRY)
rule:
    kind: invocation_expression
    pattern: $SITE
    all:
        - matches: csharp-setting-found-read
        - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {has: {field: function, has: {field: name, pattern: $MEMBER}}}}}
        - not: {inside: {stopBy: end, kind: class_declaration, has: {field: name, regex: '^SettingType$'}}}
transform:
    ROW:
        rewrite: {source: $SITE, rewriters: [found-read, found-optional-color, found-enum]}
fix: $ROW
message: '`Answers.Found` over `$MEMBER` reads a `PersistentSettings` value outside its `SettingType` row'
note: Use `SettingType.<Kind>.Read(<settings>, <key>)`, `SettingType.Enumeration<T>()` for an enum, the row parses stored text once and fails with `TypeMismatch` where a typed `TryGet*` retypes the key and reads an integer as a bool
