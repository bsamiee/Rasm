symbolType: enumMember
rule:
    inside: {kind: enum_body}
    any:
        - {kind: enum_assignment, has: {field: name, pattern: $NAME}}
        - {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', pattern: $NAME}
name: $NAME
signature: $NAME
---
id: typescript-member-error
language: tsxlang
role: member
parentRuleIds: [typescript-function, typescript-suite, typescript-class, typescript-interface, typescript-type, typescript-constant, typescript-variable, typescript-assignment, typescript-export, typescript-enum]
symbolType: 'null'
rule: {kind: ERROR, not: {has: {stopBy: end, kind: 'method_definition, method_signature, abstract_method_signature, call_signature, construct_signature, index_signature, property_signature, public_field_definition, required_parameter, optional_parameter, class_static_block, pair, shorthand_property_identifier, spread_element, enum_body, enum_assignment, export_statement, expression_statement, function_declaration, generator_function_declaration, function_signature, class_declaration, abstract_class_declaration'}}}
name: ERROR
signature: ''
isPublic: false
