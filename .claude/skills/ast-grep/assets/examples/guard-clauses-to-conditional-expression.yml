# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: guard-clauses-to-conditional-expression
language: python
severity: error
utils:
    guard-if:
        all:
            - pattern: |
                if $C:
                    return $R
            - not: {has: {any: [{kind: elif_clause}, {kind: else_clause}]}} # An if carrying alternatives is no guard, the bare pattern would swallow them
rule:
    all:
        - pattern:
            context: |
                def _anchor():
                    $$$GUARDS
                    return $FINAL
            selector: block
        - has: {kind: if_statement}
        - not: # Totality closure: every statement is a guard-if or a return, a body carrying any other statement (a binding, an effect) is never flattened
            has:
                not:
                    any:
                        - matches: guard-if
                        - kind: return_statement
rewriters:
    - id: arm
      rule: {matches: guard-if}
      fix: '($R) if $C else'
transform:
    ARMS:
        rewrite:
            rewriters: [arm]
            source: $$$GUARDS
            joinBy: ' '
fix: 'return $ARMS ($FINAL)' # Parentheses hold tuple and starred returns together across the chain
message: Guard clauses spell a conditional chain as statements
note: Collapse to an expression, `return (<r1>) if <c1> else (<r2>) if <c2> else (<final>)`
