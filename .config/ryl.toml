# --- [RYL] ------------------------------------------------------------------------------

cache-dir   = ".cache/ryl"
exclude     = [".config/mise/locks/", "pnpm-lock.yaml"] # Package managers generate the excluded lock files
lint.strict = true                                      # Warnings fail checks

# --- [LINT_RULES] -----------------------------------------------------------------------

[lint.rules]
# --- [SELECTION]

ALL = "enable" # New rules take effect after an upgrade

# --- [FORMATTING]

# `oxfmt` owns YAML layout and quoting and writes one space before inline comments
braces         = "disable"
comments       = { min-spaces-from-content = 1 }
indentation    = "disable"
line-length    = "disable"
quoted-strings = "disable"

# --- [DOCUMENT_STRUCTURE]

document-end   = { present = false } # Documents end at the next `---` or end of file
document-start = "disable"           # Keep `---` only between documents in multi-document ast-grep catalogs
key-ordering   = "disable"           # Keys follow domain order from `CLAUDE.md`
yaml-directive = "disable"           # Value rules keep YAML 1.1 and 1.2 readers in agreement without a `%YAML` directive

# --- [PORTABILITY]

anchors        = { forbid-ambiguous-anchor-alias-names = true, forbid-duplicated-anchors = true, forbid-unused-anchors = true }     # Unambiguous anchor names parse consistently across YAML readers
float-values   = { forbid-inf = true, forbid-nan = true, forbid-scientific-notation = true, require-numeral-before-decimal = true } # Floats parse consistently across JSON and YAML readers
key-duplicates = { check-canonical = true, forbid-duplicated-merge-keys = true }                                                    # Compare canonical key values and report conflicts between merged mappings
tags           = { forbid-removed-types = true, forbid-unsafe-tags = true }                                                         # Reject types removed in YAML 1.2 and tags that construct language objects

# --- [TOOL_COMPATIBILITY]

schema-dependent-values = { forbid-single-letter-booleans = false } # ast-grep reads metavariable keys like `Y` as YAML 1.2 strings
truthy                  = { check-keys = false }                    # GitHub Actions uses `on` as a mapping key

# --- [SCHEMAS]

[[lint.rules.schema.schemas]]
files = [".github/ISSUE_TEMPLATE/config.yml"]
url   = "https://www.schemastore.org/github-issue-config.json"

[[lint.rules.schema.schemas]]
files = [".github/ISSUE_TEMPLATE/*.yml", "!.github/ISSUE_TEMPLATE/config.yml"]
url   = "https://www.schemastore.org/github-issue-forms.json"
