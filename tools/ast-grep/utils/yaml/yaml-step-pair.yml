# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: yaml-step-pair
language: yaml
utils:
    step-slot:
        kind: block_sequence_item, flow_sequence
        inside: {matches: yaml-steps-pair, stopBy: {kind: 'block_mapping_pair, flow_pair'}}
rule:
    kind: block_mapping_pair, flow_pair
    inside:
        any:
            - {kind: flow_sequence, matches: step-slot}
            - {kind: 'block_mapping, flow_mapping', inside: {kind: 'block_node, flow_node', inside: {matches: step-slot}}}
