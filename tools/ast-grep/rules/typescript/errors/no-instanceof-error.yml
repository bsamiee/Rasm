# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-instanceof-error
language: tsx
severity: error
ignores:
    - apps/web/portfolio/**
    - libs/typescript/creative-cloud/indesign/**
    - libs/typescript/creative-cloud/uxp/**
    - libs/typescript/web/hosting/**
    - libs/typescript/web/media/**
    - libs/typescript/web/ui/**
    - plugins/function-hooks/**
rule:
    any:
        - pattern: $VALUE instanceof $ERROR
        - pattern: $ERROR.prototype.isPrototypeOf($VALUE)
        - pattern: $OBJECT.prototype.isPrototypeOf.call($ERROR.prototype, $VALUE)
constraints:
    ERROR: {regex: '^((globalThis|window|self)\.)?Error$', matches: typescript-global-reference}
    OBJECT: {regex: '^((globalThis|window|self)\.)?Object$', matches: typescript-global-reference}
fix: $ERROR.isError($VALUE)
message: 'Error test on `$VALUE` walks the `$ERROR.prototype` chain of the running realm alone'
note: 'Call `Error.isError(<value>)`, which tests the internal error slot in every realm and rejects an object inheriting `Error.prototype` without the slot'
