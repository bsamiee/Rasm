# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-log-configuration-outside-composition-root
language: python
severity: error
files:
    - libs/python/**
    - apps/blender/**
rule:
    kind: call
    pattern: $CALL
    has:
        field: function
        any:
            - matches: {python-member-use: {module: {regex: '^structlog$'}, name: {regex: '^(configure|configure_once|reset_defaults)$'}}}
            - matches: {python-member-use: {module: {regex: '^structlog\.stdlib$'}, name: {regex: '^recreate_defaults$'}}}
            - kind: attribute
              not: {matches: python-shadowed-name}
              all:
                - has: {field: attribute, regex: '^recreate_defaults$'}
                - has: {field: object, matches: {python-submodule: {parent: {regex: '^structlog$'}, child: {regex: '^stdlib$'}}}}
message: '`$CALL` sets process-wide structlog configuration from library or extension code'
note: 'Configure structlog in each process entry module, and call `structlog.get_logger` elsewhere'
