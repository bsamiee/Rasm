# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-environment-variable-read
language: python
severity: error
ignores:
    - .claude/skills/use-blender/scripts/*.py
    - .claude/skills/use-rhino/scripts/{canvas,document,file3dm,records}.py
    - tools/interface/{roles,report,units,render,aliases,frame}.py
    - tools/interface/rhino/{window,markup}.py
    - tools/interface/blender/rows.py
    - tools/interface/*/script/**
    - tools/interface/blender/extension/**
utils:
    mapping: {matches: {python-member-use: {module: {regex: '^os$'}, name: {regex: '^environb?$'}}}}
    written:
        any:
            - inside: {kind: attribute, field: object, has: {field: attribute, regex: '^(update|clear)$'}}
            - inside:
                kind: subscript
                field: value
                any:
                    - inside:
                        kind: 'assignment, augmented_assignment'
                        field: left
                        stopBy: {not: {kind: 'pattern_list, tuple_pattern, list_pattern'}}
                    - inside: {kind: delete_statement}
            - inside: {kind: augmented_assignment, field: left}
    relayed:
        any:
            - kind: attribute
              has: {field: attribute, regex: '^environb?$'}
            - kind: identifier
              regex: '^environb?$'
        not: {matches: mapping}
    forwarded:
        any:
            - inside: {kind: 'argument_list, keyword_argument, dictionary_splat'}
            - inside: {kind: binary_operator, has: {field: operator, regex: '^\|$'}}
            - inside: {kind: keyword_argument, stopBy: end, has: {field: name, regex: '^env$'}}
rule:
    pattern: $READ
    any:
        - kind: call
          has: {field: function, matches: {python-member-use: {module: {regex: '^os$'}, name: {regex: '^getenvb?$'}}}}
        - kind: identifier, attribute
          matches: mapping
          not: {any: [{matches: written}, {matches: forwarded}]}
        - kind: subscript
          has: {field: value, matches: relayed}
          not: {any: [{inside: {kind: 'assignment, augmented_assignment', field: left, stopBy: {not: {kind: 'pattern_list, tuple_pattern, list_pattern'}}}}, {inside: {kind: delete_statement}}]}
        - kind: call
          has: {field: function, kind: attribute, all: [{has: {field: object, matches: relayed}}, {has: {field: attribute, regex: '^(get|setdefault|pop)$'}}]}
message: '`$READ` reads an environment variable outside typed settings'
note: 'Use one frozen pydantic model per application (`BaseSettings` loaded at the boundary, or `model_validate` over a passed mapping), pydantic validates every variable once and reports every missing one together'
