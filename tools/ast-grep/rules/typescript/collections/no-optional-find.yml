# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-optional-find
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/**']
rule:
    kind: member_expression
    all:
        - has: {kind: optional_chain}
        - has:
            field: object
            kind: call_expression
            pattern: $FIND
            all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^(find|findLast)$'}}
                - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
                - not: {has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}}}
message: '`$FIND` reads an absent element as `undefined` through optional chaining'
note: 'Map `Array.findFirst(<list>, <predicate>)` or `Array.findLast` through `Option.map` and fold absence once'
