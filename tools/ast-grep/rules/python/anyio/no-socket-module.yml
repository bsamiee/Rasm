# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-socket-module
language: python
severity: error
utils:
    socket-member:
        regex: '^(socket|create_connection|create_server|getaddrinfo|getnameinfo|gethostbyname|gethostbyname_ex|gethostbyaddr|getfqdn)$'
rule:
    kind: call
    pattern: $CALL
    has: {field: function, matches: {python-member-use: {module: {regex: '^socket$'}, name: {matches: socket-member}}}}
message: '`$CALL` uses the blocking socket module'
note: 'Use the anyio networking function'
