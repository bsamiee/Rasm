# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-placeholder-no-op
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    empty-block:
        kind: block
        not: {has: {pattern: $_, not: {kind: comment}}}
    case-arm:
        inside:
            kind: argument
            inside:
                kind: argument_list
                inside: {kind: invocation_expression, has: {field: function, regex: '(^|\.)\s*(Switch|Match)(\s*<.+>)?$'}}
rule:
    any:
        - kind: member_access_expression
          pattern: $PLACEHOLDER
          regex: '^((global::)?Thinktecture\s*\.\s*)?Empty\s*\.\s*(Action(\s*<.+>)?|Disposable|AsyncDisposable)$'
          not:
            all:
                - has: {field: name, regex: '^Action\b'}
                - inside: {kind: invocation_expression, field: function}
        - kind: lambda_expression, anonymous_method_expression
          pattern: $PLACEHOLDER
          all:
            - has: {matches: empty-block}
            - not: {matches: case-arm}
        - kind: method_declaration
          all:
            - has: {field: name, regex: '^Dispose$', pattern: $PLACEHOLDER}
            - has: {field: body, matches: empty-block}
message: '`$PLACEHOLDER` stands in for an absent callback or resource'
note: Use `Option<IDisposable>` or `Option<Action>` the consumer matches, a `DisposalOps.Using` scope around the inner body in the arm that acquires, or `Answers.ToResult(<fin>)` where the caller keeps the error, a no-op value hides absence from the type
