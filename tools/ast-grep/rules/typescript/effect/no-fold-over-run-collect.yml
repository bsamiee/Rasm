# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fold-over-run-collect
language: tsxlang
severity: error
utils:
    collect-member:
        kind: member_expression
        all:
            - has: {field: property, regex: '^runCollect$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '\bStream$'}}}}
    collected:
        any:
            - kind: call_expression
              has: {field: function, matches: collect-member}
            - kind: yield_expression
              has: {kind: call_expression, has: {field: function, matches: collect-member}}
            - kind: parenthesized_expression
              has: {matches: collected}
    array-fold:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(head|last|reduce|join)$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '\bArray$'}}}}
    fold:
        any:
            - matches: array-fold
            - kind: call_expression
              has: {field: function, matches: array-fold}
            - kind: arrow_function
              all:
                - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $XS}}}
                - has:
                    field: body
                    any:
                        - pattern: $XS.length
                        - pattern: $XS.join($$$_)
                        - pattern: $XS.reduce($$$_)
                        - pattern: $XS[0]
                        - pattern: $XS.at($_)
    fold-step:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^map$'}}}}
            - has: {field: arguments, has: {matches: fold, nthChild: {position: 1, reverse: true}}}
    copy:
        any:
            - kind: call_expression
              all:
                - has:
                    field: function
                    any:
                        - {matches: typescript-global-reference, regex: '^(globalThis\.)?Array\.from$'}
                        - kind: member_expression
                          all:
                            - has: {field: property, regex: '^fromIterable$'}
                            - has: {field: object, matches: {effect-module: {name: {regex: '\bArray$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: collected}}, {not: {has: {nthChild: 2}}}]}
            - kind: array
              all:
                - has: {nthChild: 1, kind: spread_element, has: {matches: collected}}
                - not: {has: {nthChild: 2}}
rule:
    any:
        - matches: copy
          pattern: $COPY
        - pattern: $FOLD
          any:
            - kind: call_expression
              all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^map$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: collected}}, {has: {nthChild: 2, matches: fold}}]}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: collected}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: fold-step}}
            - matches: collect-member
              inside: {kind: arguments}
              precedes: {matches: fold-step, stopBy: {not: {regex: '^,$'}}}
transform:
    COPY_SPREAD: {replace: {source: $COPY, replace: '(?s)^\[\s*\.\.\..*$', by: '[...]'}}
    COPY_HEAD: {replace: {source: $COPY_SPREAD, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
    FOLD_HEAD: {replace: {source: $FOLD, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$COPY_HEAD$FOLD_HEAD` recomputes by hand what a `Stream` destructor returns'
note: 'Read the `Array` `Stream.runCollect` returns, or fold the stream through `Stream.mkString`, `runCount`, `runHead`, `runLast`, or `runFold`'
