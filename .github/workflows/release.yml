name: Release

on:
    workflow_dispatch:
        inputs:
            specifier:
                description: Version or semver keyword every released project takes, empty reads conventional commits
                type: string
            first-release:
                description: No release tag exists yet
                type: boolean
                default: false
            dry-run:
                description: Previews the version, tag, and GitHub release, changes nothing and skips attach and publish
                type: boolean
                default: true
            publish:
                description: Publishes every package to its registry or store after the release
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    release:
        runs-on: xcode-27
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            UV_LOCKED: "true"
            APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
            APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
            DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
            ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
            ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
            ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
            - uses: ./.github/actions/setup
            - run: nx release ${SPECIFIER:+"${SPECIFIER}"} --skip-publish --first-release=${{ inputs.first-release }} --dry-run=${{ inputs.dry-run }}
              env:
                  SPECIFIER: ${{ inputs.specifier }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            - if: ${{ !inputs.dry-run }}
              run: nx run-many --targets=attach --configuration=release
            - if: ${{ inputs.publish && !inputs.dry-run }}
              run: nx release publish --first-release=${{ inputs.first-release }}
              env:
                  PNPM_CONFIG_NPMRC_AUTH_FILE: ${{ github.workspace }}/.config/npmrc
                  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
                  UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
                  BLENDER_EXTENSIONS_TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
                  SPARKLE_FEED_BUCKET: ${{ vars.SPARKLE_FEED_BUCKET }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
