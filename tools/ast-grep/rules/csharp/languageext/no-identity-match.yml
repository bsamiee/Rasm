# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-identity-match
language: csharp
severity: error
utils:
    identity-callback:
        any:
            - regex: '^(global::)?(LanguageExt\.)?Prelude\.identity$'
            - all:
                - regex: '^identity$'
                - inside: {kind: compilation_unit, stopBy: end, has: {kind: using_directive, regex: '^using\s+static\s+(global::)?LanguageExt\.Prelude\s*;$'}}
                - not:
                    inside:
                        stopBy: end
                        kind: class_declaration, struct_declaration, record_declaration, interface_declaration, method_declaration, constructor_declaration, local_function_statement, lambda_expression, anonymous_method_expression, property_declaration, accessor_declaration, operator_declaration
                        has:
                            stopBy: end
                            any:
                                - kind: variable_declarator
                                  has: {field: name, regex: '^identity$'}
                                - kind: parameter
                                  has: {field: name, regex: '^identity$'}
            - matches:
                csharp-unary-callback:
                    parameter: {pattern: $VALUE}
                    body:
                        any:
                            - pattern: $VALUE
                            - pattern:
                                context: 'class C { object F() => M(x => { return $VALUE; }); }'
                                selector: block
                                strictness: cst
rule:
    any:
        - pattern:
            context: "class C { object F() => $RESULT.Match(Succ: $IDENTITY, Fail: $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $RESULT.Match(Fail: $FALLBACK, Succ: $IDENTITY); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $RESULT.Match($IDENTITY, Fail: $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $RESULT.Match(Succ: $IDENTITY, $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $OPTION.Match(Some: $IDENTITY, None: $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $OPTION.Match(None: $FALLBACK, Some: $IDENTITY); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $OPTION.Match($IDENTITY, None: $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $OPTION.Match(Some: $IDENTITY, $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $CALLEE($INPUT, Some: $IDENTITY, None: $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $CALLEE($INPUT, None: $FALLBACK, Some: $IDENTITY); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $CALLEE($INPUT, $IDENTITY, None: $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
        - pattern:
            context: "class C { object F() => $CALLEE($INPUT, Some: $IDENTITY, $FALLBACK); }"
            selector: invocation_expression
            strictness: cst
constraints:
    CALLEE: {regex: '^((global::)?(LanguageExt\.)?Prelude\.)?match$'}
    IDENTITY: {matches: identity-callback}
transform:
    FIN: {replace: {source: $RESULT, replace: '(?s)^(.*)$', by: '${1}.IfFail'}}
    OPTION_HEAD: {replace: {source: $OPTION, replace: '(?s)^(.*)$', by: '${1}.IfNone'}}
    CALL: {replace: {source: $CALLEE, replace: 'match$', by: 'ifNone'}}
    FIRST: {replace: {source: $INPUT, replace: '(?s)^(.*)$', by: '${1}, '}}
fix: "$FIN$OPTION_HEAD$CALL($FIRST$FALLBACK)"
message: "`Match` returns one case's value unchanged and handles the other case alone"
note: "`<fin>.IfFail(<handler>)` returns the success value or the handler's value, `<option>.IfNone(<fallback>)` the Some value or the fallback"
