# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
files: ['libs/dotnet/ui/Rasm.UI/**', 'tests/dotnet/Rasm.Tests/**']
utils:
    edge:
        kind: 'property_declaration, parameter'
        has: {field: name, regex: '^(Left|Top|Right|Bottom)$'}
    edges:
        kind: argument_list
        all:
            - has: {kind: argument, nthChild: 1, has: {any: [{kind: identifier, regex: '^Left$'}, {kind: cast_expression, has: {field: value, kind: identifier, regex: '^Left$'}}]}}
            - has: {kind: argument, nthChild: 2, has: {any: [{kind: identifier, regex: '^Top$'}, {kind: cast_expression, has: {field: value, kind: identifier, regex: '^Top$'}}]}}
            - has: {kind: argument, nthChild: 3, has: {any: [{kind: identifier, regex: '^Right$'}, {kind: cast_expression, has: {field: value, kind: identifier, regex: '^Right$'}}]}}
            - has: {kind: argument, nthChild: 4, has: {any: [{kind: identifier, regex: '^Bottom$'}, {kind: cast_expression, has: {field: value, kind: identifier, regex: '^Bottom$'}}]}}
            - not: {has: {kind: argument, nthChild: 5}}
    rebuilt:
        any:
            - kind: object_creation_expression
              all:
                - has: {field: type, regex: '^SKRect$'}
                - has: {kind: argument_list, matches: edges}
            - kind: implicit_object_creation_expression
              all:
                - has: {kind: argument_list, matches: edges}
                - inside: {kind: arrow_expression_clause, inside: {kind: property_declaration, has: {field: type, regex: '^SKRect$'}}}
rule:
    kind: 'class_declaration, record_declaration, struct_declaration'
    all:
        - has: {field: name, pattern: $NAME}
        - has: {stopBy: end, matches: edge, has: {field: name, regex: '^Left$'}}
        - has: {stopBy: end, matches: edge, has: {field: name, regex: '^Top$'}}
        - has: {stopBy: end, matches: edge, has: {field: name, regex: '^Right$'}}
        - has: {stopBy: end, matches: edge, has: {field: name, regex: '^Bottom$'}}
        - has: {field: body, has: {stopBy: end, matches: rebuilt}}
message: '`$NAME` holds four edges and rebuilds an `SKRect` from them'
note: 'Hold one validated `SKRect` member, its `Create`, `Offset`, `Inflate`, and `Contains` state the edge arithmetic'
