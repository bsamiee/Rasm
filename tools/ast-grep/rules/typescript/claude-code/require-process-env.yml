# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-process-env
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    # Init object naming env as a pair or a shorthand, or spreading an object that can carry it
    env-init:
        kind: object
        has:
            any:
                - {kind: pair, has: {field: key, regex: "^['\"]?env['\"]?$"}}
                - {kind: shorthand_property_identifier, regex: '^env$'}
                - {kind: spread_element}
rule:
    matches: claude-code-process-run
    all:
        # The environment's own source, mise env --json runs before the session row holds an environment
        - not: {has: {field: arguments, has: {kind: array, has: {nthChild: 1, kind: string, regex: "^['\"]mise['\"]$"}}}}
        # A second argument naming env, or an init built elsewhere that the shape cannot read
        - not: {has: {field: arguments, has: {nthChild: 2, any: [{matches: env-init}, {not: {kind: object}}]}}}
message: The child runs without `env`, the environment `mise env --json` answered into the session row
note: >-
    Pass the session row's environment as the init, `$.process.run(argv, { env: session.env })`, the row read through
    `decodeSession` in the hook body
