id: no-dirname-substitution-by-hand
valid:
    # One parameter argument, no-dirname-substitution rewrites it
    - |
      root=$(dirname "$file")
    # One bare parameter argument, no-dirname-substitution rewrites it
    - |
      root=$(dirname $file)
    # The expansion form
    - |
      stem=${file##*/}
      stem=${stem%.yml}
    # Another command in a substitution
    - |
      root=$(realpath "$file")
    # Another command with an option and a parameter
    - |
      root=$(realpath -e "$file")
    # One braced parameter argument, no-dirname-substitution rewrites it
    - |
      root=$(dirname "${file}")
    # One array element argument, no-dirname-substitution rewrites it
    - |
      here=$(dirname "${BASH_SOURCE[0]}")
    # One element indexed from the end, no-dirname-substitution rewrites it
    - |
      name=$(basename "${paths[-1]}")
invalid:
    # A nested substitution as the path
    - |
      root=$(dirname "$(realpath "$f")")
    # An option before the parameter of basename
    - |
      name=$(basename -- "$f")
    # A quoted suffix
    - |
      stem=$(basename "$f" ".yml")
    # The instance, a suffix argument
    - |
      stem=$(basename "$file" .yml)
    # A literal path
    - |
      root=$(dirname /a/b/c)
    # An option before the parameter
    - |
      root=$(dirname -- "$file")
    # Text beside the parameter in the string
    - |
      root=$(dirname "$file/x")
    # Two path arguments
    - |
      names=$(basename -a "$first" "$second")
    # An operator beside the name, the expansion result is the path
    - |
      root=$(dirname "${file%/x}")
    # A whole array, one path per element
    - |
      root=$(dirname "${files[@]}")
