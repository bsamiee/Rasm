# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-descriptor-syscall
language: swiftlang
severity: error
utils:
    arguments:
        kind: value_arguments
        inside: {kind: call_suffix}
rule:
    kind: call_expression
    pattern: $SITE
    any:
        - all:
            - has: {nthChild: 1, kind: simple_identifier, regex: '^open$'}
            - has: {kind: call_suffix, has: {matches: arguments, has: {kind: value_argument, nthChild: 2, regex: '^O_[A-Z_]+'}}}
        - all:
            - has: {nthChild: 1, kind: simple_identifier, regex: '^(read|write|pread|pwrite)$'}
            - has: {kind: call_suffix, has: {matches: arguments, has: {kind: value_argument, nthChild: 3}}}
        - all:
            - has: {nthChild: 1, kind: simple_identifier, regex: '^(close|fsync)$'}
            - has: {kind: call_suffix, has: {matches: arguments, all: [{has: {kind: value_argument, nthChild: 1}}, {not: {has: {kind: value_argument, nthChild: 2}}}]}}
        - has: {nthChild: 1, kind: simple_identifier, regex: '^(ftruncate|lseek|dup|dup2)$'}
        - all:
            - has: {nthChild: 1, kind: simple_identifier, regex: '^(pipe|stat|lstat|fstat)$'}
            - has: {kind: call_suffix, has: {matches: arguments, has: {kind: value_argument, regex: '^&'}}}
message: '`$SITE` calls a C descriptor function that System wraps in `FileDescriptor` or `FilePath`'
note: 'Call the `FileDescriptor` or `FilePath` member from System'
