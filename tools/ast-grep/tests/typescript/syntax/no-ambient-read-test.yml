id: no-ambient-read
valid:
    - 'function read() { return Math.random(); } namespace Math { export const random = source; }'
    # Runtime declarations retain their bindings through export and namespace syntax
    - 'export const Math = source; Math.random();'
    - 'abstract class Date { static now() { return 1; } } Date.now();'
    - 'namespace Math { export const random = source; } Math.random();'
    # A bigint-named member alone does not establish the hrtime export.
    - 'import { uptime as clock } from "node:process"; clock.bigint();'
    # Other exports of the same native modules do not read clocks or randomness.
    - 'import { createHash } from "node:crypto"; createHash("sha256");'
    - 'import { platform } from "node:os"; platform();'
    - 'import { cwd } from "node:process"; cwd();'
    # Matching export names from domain modules identify different operations.
    - 'import { randomBytes } from "./random"; randomBytes(8);'
    - 'import { uptime } from "./metrics"; uptime();'
    - 'import { hrtime } from "./clock"; hrtime();'
    - 'import { hrtime as clock } from "./clock"; clock.bigint();'
    - 'import { performance as clock } from "./clock"; clock.now();'
    # Function object methods do not invoke the native clock.
    - 'import { hrtime as clock } from "node:process"; clock.toString();'
    - 'import { uptime as clock } from "node:process"; clock.toString();'
    - 'import { performance as clock } from "node:perf_hooks"; clock.toString();'
    - 'import { constants as clock } from "node:perf_hooks"; clock.now();'
    # A caller-supplied service has no ambient native identity.
    - 'function current(crypto: { randomUUID(): string }) { return crypto.randomUUID(); }'
    - 'import { crypto } from "./services"; crypto.randomUUID();'
    # Web Crypto does not export the Node-only randomBytes function.
    - 'crypto.randomBytes(8);'
    # Another argument-free constructor does not read the clock
    - 'const index = new Map();'
    # The clock service
    - 'const now = yield* Clock.currentTimeMillis;'
    # The DateTime read of now
    - 'const now = yield* DateTime.now;'
    # The random service
    - 'const value = yield* Random.next;'
    # Date built from an input, no-native-date reports it
    - "const cutoff = new Date('2026-01-01');"
    # Parse over an input, no-native-date reports it
    - "const cutoff = Date.parse('2026-01-01');"
    # Member named like the clock on another object
    - 'const now = clock.now();'
    # Math member outside the random source
    - 'const rounded = Math.round(value);'
    # Date as a type annotation
    - 'const held: Date = cutoff;'
    # Member named env on another object
    - 'const home = settings.env.HOME;'
    # Temporal built from an input
    - 'const at = Temporal.Instant.from(text);'
    # The environment variable read through Config
    - "const home = yield* Config.string('HOME');"
    # One environment variable, Biome noProcessEnv reports the process.env read
    - 'const home = process.env.HOME;'
    # The environment as a whole, Biome noProcessEnv reports it
    - 'const env = process.env;'
    # The environment through globalThis, Biome noProcessEnv reports it
    - 'const home = globalThis.process.env.HOME;'
invalid:
    # UUIDv7 belongs to Node crypto, not the Web Crypto global.
    - 'import { randomUUIDv7 } from "node:crypto"; randomUUIDv7();'
    # Imported host APIs preserve identity across aliases and module receivers.
    - 'import { randomBytes as bytes } from "node:crypto"; bytes(8);'
    - 'import { uptime as elapsed } from "node:os"; elapsed();'
    - 'import { hrtime } from "node:process"; hrtime();'
    - 'import { hrtime as clock } from "node:process"; clock.bigint();'
    - 'import { performance as clock } from "node:perf_hooks"; clock.now();'
    # The current time as a string, the constructor called without new
    - 'const now = Date();'
    # The Temporal clock
    - 'const now = Temporal.Now.instant();'
    # Random integer
    - 'import * as crypto from "node:crypto"; const roll = crypto.randomInt(10);'
    # Random bytes
    - 'import crypto from "node:crypto"; const salt = crypto.randomBytes(8);'
    # The process uptime
    - 'const alive = process.uptime();'
    # The host uptime
    - 'import os from "node:os"; const alive = os.uptime();'
    # The instance, the clock read through Date.now
    - 'const now = Date.now();'
    # The current time as a Date
    - 'const now = new Date();'
    # The constructor without parentheses
    - 'const now = new Date;'
    # The random source
    - 'const salt = Math.random();'
    # Random id
    - 'const id = crypto.randomUUID();'
    # Random bytes
    - 'const bytes = crypto.getRandomValues(new Uint8Array(8));'
    # The high-resolution clock
    - 'const started = performance.now();'
    # The process clock
    - 'const started = process.hrtime.bigint();'
    # The clock through globalThis
    - 'const now = globalThis.Date.now();'
    # The random source through globalThis
    - 'const id = globalThis.crypto.randomUUID();'
