# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-combine-view-wrapper
language: swiftlang
severity: error
rule:
    pattern: $SITE
    any:
        - kind: attribute
          regex: '^@(SwiftUI\.)?(StateObject|ObservedObject|EnvironmentObject)$'
        - kind: call_expression
          has: {nthChild: 1, regex: '^(SwiftUI\.)?(StateObject|ObservedObject)(\.init)?$'}
        - kind: call_expression
          has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, regex: '^\.environmentObject$'}}
message: '`$SITE` holds or injects a Combine `ObservableObject` through a SwiftUI wrapper'
note: 'Hold the model in `@State`, inject it through `.environment(_:)` and `@Environment`, and pass it as a plain or `@Bindable` property'
