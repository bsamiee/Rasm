# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-machine-path-literal-csharp
language: csharplang
severity: error
rule:
    kind: 'string_literal, verbatim_string_literal, raw_string_literal, interpolated_string_expression'
    all:
        - pattern: $PATH
        - regex: '(^[$@]*"+|[\s=:;,]|file://)(~/|/(Applications|Users|home|root|Volumes|opt|nix/store|Library|System/Volumes|private|tmp|mnt|media|snap)(/|"|$)|/usr/local/|/var/folders/|[A-Za-z]:(\\{1,2}|/)(Program Files( \(x86\))?|Users|ProgramData|Windows)([\\/]|"|$))'
message: '`$PATH` names a location in one machine''s install, user, or volume folders'
note: 'Read the location at run time from its owner (host API, bundle id, package resolver, `Environment.GetFolderPath`) or a parameter'
