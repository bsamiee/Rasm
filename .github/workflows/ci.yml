name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NX_MAX_CACHE_SIZE: 1GB

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - &checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                lfs: true
                persist-credentials: false
            - &setup
              id: setup
              uses: ./.github/actions/setup
              with:
                image-license: ${{ secrets.SIXLABORSLICENSEKEY }}
            - run: nx run-many -t typecheck:clippy lint:dylint --projects=rasm
            - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: bash eng/scripts/ci.sh run check test test:integration
              env:
                NO_PREVIOUS_BUILD: ${{ steps.setup.outputs.no-previous-build }}
                IMAGE_LICENSE: ${{ steps.setup.outputs.image-license }}
            - &save-task-cache
              uses: actions/cache/save@v6
              if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'push' }}
              with:
                path: ${{ steps.setup.outputs.task-paths }}
                key: ${{ steps.setup.outputs.task-key }}
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                name: diagnostics-${{ github.job }}
                path: |
                    .artifacts/dotnet/binlog
                    .artifacts/dotnet/test
                    .artifacts/python/test
                    .artifacts/typescript/vitest
                include-hidden-files: true
                retention-days: 14

    macos:
        runs-on: xcode-27
        timeout-minutes: 60
        steps:
            - *checkout
            - *setup
            - id: rhino
              run: bash eng/scripts/ci.sh rhino-download
            - id: rhino-install
              uses: mcneel/setup-rhino3d@v3.0.0
              with:
                download-url: ${{ steps.rhino.outputs.url }}
                email-address: b.samiee93@gmail.com
            - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: bash eng/scripts/ci.sh run check test
              env:
                NO_PREVIOUS_BUILD: ${{ steps.setup.outputs.no-previous-build }}
                RHINO_READY: ${{ steps.rhino-install.outcome == 'success' }}
                IMAGE_LICENSE: ${{ steps.setup.outputs.image-license }}
                RhinoInstallPath: ${{ steps.rhino.outputs.path }}
            - *save-task-cache
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                name: diagnostics-${{ github.job }}
                path: |
                    .artifacts/dotnet/binlog
                    .artifacts/dotnet/test
                    .artifacts/swift/test
                    .artifacts/typescript/vitest
                    .artifacts/xcode/build
                include-hidden-files: true
                retention-days: 14
