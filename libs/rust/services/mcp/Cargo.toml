# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-mcp"
edition.workspace = true
description       = "MCP host on the daemon: endpoint sessions, routed app servers, elicitation, and a stdio upstream proxy"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
