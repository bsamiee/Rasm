# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-python
language: python
severity: error
utils:
    function:
        kind: function_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
    control:
        any:
            - kind: if_statement, for_statement, while_statement, match_statement
            - kind: conditional_expression
              not:
                any:
                    - nthChild: 3
                      inside: {kind: conditional_expression}
                    - inside: {kind: parenthesized_expression, nthChild: 3, inside: {kind: conditional_expression}}
    boundary: {any: [{matches: control}, {matches: function}]}
rule:
    matches: control
    inside:
        matches: control
        stopBy: {matches: boundary}
        inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                stopBy: {matches: boundary}
                not: {inside: {matches: control, stopBy: {matches: function}}}
message: Control flow reaches a fourth nesting level
note: Rebuild nested decisions or loops with a match, comprehension or pipeline over their inputs
