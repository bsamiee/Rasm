    "trimesh",
    "usd-core; python_version<'3.15'",                    # [ARTIFACTS]: USD/USDZ scene packaging; the release declares Requires-Python <3.15 and ships no sdist, so `pxr` imports live from the Forge python-overlay `.pth`
