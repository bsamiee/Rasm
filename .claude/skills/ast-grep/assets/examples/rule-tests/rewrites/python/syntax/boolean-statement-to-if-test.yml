id: boolean-statement-to-if
valid:
    # The target form
    - |
      if ready:
          run()
    # Name on the right drops no effect, ruff useless-expression reports it
    - 'ready and value'
    # Operator as a bound value
    - 'result = ready and run()'
    # Operator as a returned value
    - |
      def step(ready):
          return ready and run()
    # Multi-line parenthesized form, the template cannot re-indent the effect
    - |
      (
          ready
          and run()
      )
invalid:
    # The and form
    - 'ready and run()'
    # The or form
    - 'ready or run()'
    # Boolean test under the or form takes parentheses under the negation
    - 'ready and armed or run()'
    # Parentheses around the operator leave under the join
    - '(ready and run())'
    # Awaited effect inside a function body, the template re-indents by the statement's column
    - |
      async def main(ready):
          ready or await finish()
