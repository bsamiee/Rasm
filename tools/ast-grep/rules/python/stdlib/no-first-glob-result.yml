# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-first-glob-result
language: python
severity: error
utils:
    query:
        kind: call
        pattern: $SEARCH
        has: {field: function, regex: '(^|\.)(glob|rglob|iglob|iterdir|listdir|scandir)$'}
    searched:
        any:
            - matches: query
            - kind: generator_expression, list_comprehension
              has: {kind: for_in_clause, has: {field: right, matches: query}}
    listed:
        any:
            - matches: searched
            - kind: call
              all:
                - has: {field: function, regex: '^(list|tuple)$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: searched}}, {not: {has: {nthChild: 2}}}]}
            - kind: list, tuple
              all:
                - has: {nthChild: 1, kind: list_splat, has: {matches: searched}}
                - not: {has: {nthChild: 2}}
    exit:
        kind: return_statement, break_statement
rule:
    any:
        - matches: {python-first-item: {source: {matches: searched, any: [{matches: query, pattern: $SEARCH}, {has: {stopBy: end, matches: query, pattern: $SEARCH}}]}}}
        - kind: subscript
          all:
            - has: {field: value, matches: listed}
            - has: {field: subscript, regex: '^-1$'}
        - kind: call
          all:
            - has: {field: function, kind: attribute, all: [{has: {field: object, matches: listed}}, {has: {field: attribute, regex: '^pop$'}}]}
            - has: {field: arguments, not: {has: {nthChild: 2}}}
        - kind: assignment
          all:
            - has: {field: left, kind: 'pattern_list, list_pattern, tuple_pattern', has: {nthChild: 1, kind: list_splat_pattern}, not: {has: {nthChild: 3}}}
            - has: {field: right, matches: listed}
        - kind: for_statement
          all:
            - has: {field: right, matches: searched}
            - has: {field: body, has: {matches: exit}}
            - not: {has: {field: alternative, kind: else_clause}}
message: 'Path taken from `$SEARCH` depends on filesystem order'
note: 'Build the known path directly, or `match` listed results against `case [<path>]`'
