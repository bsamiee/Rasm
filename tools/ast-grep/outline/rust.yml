    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: foreign_mod_item}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: ';$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-type-field
language: rustlang
role: member
parentRuleIds: [rust-type]
symbolType: field
rule:
    kind: field_declaration
    has: {field: name, pattern: $NAME}
    inside: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item'}}
name: $NAME
isPublic: {has: {kind: visibility_modifier}}
---
id: rust-enum-variant
language: rustlang
role: member
parentRuleIds: [rust-enum]
symbolType: enumMember
rule:
    kind: enum_variant
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: enum_variant_list, inside: {kind: enum_item}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\p{White_Space}*\n\p{White_Space}*', by: ' '}}
name: $NAME
signature: $SIGNATURE
