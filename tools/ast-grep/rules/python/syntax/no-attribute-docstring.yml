# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-attribute-docstring
language: python
severity: error
utils:
    literal:
        any:
            - kind: string, concatenated_string
              not: {has: {stopBy: end, kind: string_start, regex: '(?i)[bft]'}}
            - kind: parenthesized_expression
              has: {matches: literal}
    string-statement:
        kind: expression_statement
        any:
            - has: {matches: literal}
            - has: {kind: assignment, all: [{has: {field: left, kind: identifier, regex: '^_$'}}, {has: {field: right, matches: literal}}]}
rule:
    matches: string-statement
    not:
        any:
            - has: {pattern: $_, nthChild: 2}
            - has: {stopBy: end, kind: comment}
            - precedes: {regex: '^;$'}
              not: {follows: {regex: '^;$'}}
    follows:
        stopBy: {not: {any: [{kind: comment}, {regex: '^;$'}, {matches: string-statement}]}}
        any:
            - kind: expression_statement
              has: {kind: assignment, has: {field: left, pattern: $NAME}}
            - kind: type_alias_statement
              has: {field: left, pattern: $NAME}
fix:
    template: ''
    expandStart: {regex: '^;$'}
message: 'String after `$NAME` is a docstring Python never attaches'
note: 'Names and annotated types state what an assignment or type alias holds'
