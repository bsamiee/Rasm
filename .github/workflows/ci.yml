name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - uses: nrwl/nx-set-shas@v5
            - uses: ./.github/actions/setup
            - run: nx affected -t check test:integration e2e --configuration ci --exclude='rasm,tag:host:macos,tag:host:rhino,tag:host:claude'
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                name: diagnostics-${{ github.job }}
                path: |
                    .artifacts/dotnet/binlog
                    .artifacts/typescript/vitest
                    .artifacts/playwright-report
                    .artifacts/playwright-test
                include-hidden-files: true
                retention-days: 14

    macos:
        runs-on: xcode-27
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - uses: nrwl/nx-set-shas@v5
            - uses: ./.github/actions/setup
            - uses: mcneel/setup-rhino3d@v3.0.0
              with:
                email-address: b.samiee93@gmail.com
                release-version: wip
            - run: nx run rasm:check
            - run: nx affected -t check --exclude='!tag:host:macos,!tag:host:rhino' --configuration ci
            - uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                name: diagnostics-${{ github.job }}
                path: .artifacts/dotnet/binlog
                include-hidden-files: true
                retention-days: 14
