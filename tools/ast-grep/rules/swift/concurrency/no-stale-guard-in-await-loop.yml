# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swift
severity: error
utils:
    loop-state:
        kind: simple_identifier, navigation_expression
        all:
            - pattern: $STATE
            - not: { inside: { kind: 'navigation_expression, navigation_suffix' } }
            - not: { all: [{ nthChild: 1 }, { inside: { kind: call_expression } }] }
            - inside:
                  kind: 'for_statement, while_statement'
                  stopBy: end
                  has:
                      kind: statements
                      has:
                          kind: assignment
                          stopBy: end
                          has: { field: target, has: { pattern: $STATE } }
    await-loop:
        any:
            - kind: for_statement
              has: { field: item, has: { field: bound_identifier, pattern: $L }, follows: { regex: '^await$' } }
            - kind: while_statement
              all:
                  - has: { field: bound_identifier, pattern: $L }
                  - has: { kind: await_expression, has: { field: expr, pattern: $_.next() } }
rule:
    kind: 'for_statement, while_statement'
    all:
        - matches: await-loop
        - any:
              - has:
                    kind: where_clause
                    pattern: $GUARD
                    all:
                        - has: { matches: loop-state, stopBy: end }
                        - not: { has: { pattern: $L, stopBy: end } }
              - has:
                    kind: statements
                    has:
                        kind: 'guard_statement, if_statement'
                        nthChild: 1
                        pattern: $GUARD
                        all:
                            - has: { kind: statements, has: { kind: control_transfer_statement, regex: '^(break|return)(?-u:\b)' } }
                            - has: { matches: loop-state, stopBy: end, inside: { kind: 'guard_statement, if_statement', stopBy: { kind: statements } } }
                            - not: { has: { pattern: $L, stopBy: end } }
        - not: { has: { field: collection, kind: call_expression, all: [{ has: { nthChild: 1, regex: '^(Observation(\.|::))?Observations$' } }, { has: { stopBy: end, pattern: $STATE } }] } }
        - not:
              has:
                  kind: statements
                  has:
                      kind: if_statement
                      not: { nthChild: 1 }
                      has: { kind: statements, has: { kind: control_transfer_statement, regex: '^break$' } }
transform:
    HEAD: { replace: { source: $GUARD, replace: '(?s)\n.*$', by: '' } }
message: '`$HEAD` reads `$STATE` from the previous iteration and awaits one more `$L` before exiting, end the loop body with `if <finished> { break }` after setting `$STATE`, or finish the input sequence'
