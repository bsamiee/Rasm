id: require-context-on-rewrite
valid:
    # The correction, the rewrite and the context line in one hook
    - |
      on('tool.call', async ($, e, next) => {
          const result = await next({ ...e, command: rewritten });
          return { ...result, context: [...(result.context ?? []), 'Ran pnpm in place of npm'] };
      });
    # Unchanged event passed to the chain
    - |
      on('tool.call', ($, e, next) => next(e));
    # Spread with no pair beside it, no field changes
    - |
      on('tool.call', ($, e, next) => next({ ...e }));
    # Rewrite in another event's hook, its result holds no context
    - |
      on('prompt.submit', ($, e, next) => next({ ...e, text: redact(e.text) }));
    # Deny returned in place of the chain
    - |
      on('tool.call', ($, e, next) => ({ deny: 'git stash hides uncommitted work' }));
    # Context named as a shorthand
    - |
      on('tool.call', async ($, e, next) => {
          const context = ['Ran rg instead of grep'];
          const result = await next({ ...e, command });
          return { ...result, context };
      });
    # Context named as a string key
    - |
      on('tool.call', async ($, e, next) => {
          const result = await next({ ...e, command });
          return { ...result, 'context': ['Ran rg instead of grep'] };
      });
    # Spread of a local in place of the event, the object is no copy of e
    - |
      on('tool.call', ($, e, next) => next({ ...row, command }));
    # Local passed to the chain holds no rewrite
    - |
      on('tool.call', ($, e, next) => {
          const copy = e;
          return next(copy);
      });
    # Call on a function other than the chain
    - |
      on('tool.call', ($, e, next) => {
          log({ ...e, command });
          return next(e);
      });
    # Hook registered through a function other than on
    - |
      register('tool.call', ($, e, next) => next({ ...e, command }));
    # Copy through a call other than Object.assign, the object is no copy the rule reads
    - |
      on('tool.call', ($, e, next) => next(merge(e, { command })));
    # Hook bound to a name with the context line on the result
    - |
      const hook = async ($, e, next) => {
          const result = await next({ ...e, command });
          return { ...result, context: ['Ran pnpm in place of npm'] };
      };
      on('tool.call', hook);
    # Context named through a member read on the result
    - |
      on('tool.call', async ($, e, next) => {
          const result = await next({ ...e, command });
          return { ...result, context: [...result.context, line] };
      });
invalid:
    # The instance, the npm rewrite without its context line
    - |
      on('tool.call', async ($, e, next) => {
          const rewritten = command.replace(npmPrefix, `${packageManager} `);
          return next({ ...e, command: rewritten });
      });
    # Matched registration
    - |
      on('tool.call', { tool: 'Bash' }, ($, e, next) => next({ ...e, command: restore(e.command) }));
    # Function expression hook
    - |
      on('tool.call', function ($, e, next) { return next({ ...e, command }); });
    # Rewrite inside a nested closure
    - |
      on('tool.call', ($, e, next) => {
          const run = () => next({ ...e, command });
          return run();
      });
    # Shorthand beside the spread
    - |
      on('tool.call', ($, e, next) => next({ ...e, command }));
    # Double-quoted event name
    - |
      on("tool.call", ($, e, next) => next({ ...e, command }));
    # Copy held in a local and passed later
    - |
      on('tool.call', async ($, e, next) => {
          const copy = { ...e, command: restore(e.command) };
          return next(copy);
      });
    # Chain parameter under another name
    - |
      on('tool.call', ($, event, chain) => chain({ ...event, command }));
    # String literal in the rewrite, a string other than context names nothing
    - |
      on('tool.call', ($, e, next) => next({ ...e, command: 'ls' }));
    # Second spread beside the event's spread, the patch changes fields
    - |
      on('tool.call', ($, e, next) => next({ ...e, ...patch }));
    # Object.assign copy with a changed field
    - |
      on('tool.call', ($, e, next) => next(Object.assign({}, e, { command: 'ls' })));
    # Nested copy of a member beside the event's spread
    - |
      on('tool.call', ($, e, next) => next({ ...e, input: { ...e.input, command } }));
    # Copy held in a local under a nested block and passed later
    - |
      on('tool.call', async ($, e, next) => {
          if (ready) {
              const copy = { ...e, command };
              return next(copy);
          }
          return next(e);
      });
    # Hook registered through a parameter typed On
    - |
      const arm = (register: On): void => {
          register('tool.call', ($, e, next) => next({ ...e, command }));
      };
    # Hook bound to a name before the registration
    - |
      const hook = ($, e, next) => next({ ...e, command });
      on('tool.call', hook);
    # Hook bound to a name under a matched registration
    - |
      const hook = ($, e, next) => next({ ...e, command });
      on('tool.call', { tool: 'Bash' }, hook);
    # Copy passed to the chain inside a then callback
    - |
      on('tool.call', ($, e, next) => load(e).then(() => next({ ...e, command })));
