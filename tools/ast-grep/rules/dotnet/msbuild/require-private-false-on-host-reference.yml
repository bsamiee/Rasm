# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-false-on-host-reference
language: xml
severity: error
rule:
    pattern: _REFERENCE
    all:
        - matches: {msbuild-element: {name: {regex: '^Reference$'}}}
        - has:
            matches: msbuild-tag
            has: {matches: {msbuild-attribute: {name: {regex: '^Include$'}, value: {regex: '^["''](RhinoCommon|Eto|@\(_RhinoHostAssembly\))["'']$'}}}}
        - matches: {msbuild-metadata: {name: {regex: '^HintPath$'}, value: {any: [{kind: AttValue}, {kind: CharData}]}}}
        - not:
            any:
                - all:
                    - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^Private$'}, value: {regex: '(?i)^["'']\s*false\s*["'']$'}}}}}
                    - not:
                        has:
                            kind: content
                            has:
                                matches: {msbuild-element: {name: {regex: '^Private$'}}}
                                not: {has: {kind: content, regex: '(?i)^\s*false\s*$'}}
                - has:
                    kind: content
                    has:
                        kind: element
                        nthChild: {position: 1, reverse: true, ofRule: {matches: {msbuild-element: {name: {regex: '^Private$'}}}}}
                        all:
                            - has: {kind: content, regex: '(?i)^\s*false\s*$'}
                            - not: {has: {kind: STag, has: {kind: Attribute}}}
transform:
    FIXED: rewrite($REFERENCE, rewriters=[add-metadata, remove-metadata])
fix: $FIXED
rewriters:
    - id: remove-metadata
      rule:
        any:
            - kind: Attribute
              has: {kind: Name, regex: '^Private$'}
              inside: {matches: msbuild-tag, inside: {pattern: _REFERENCE}}
            - matches: {msbuild-element: {name: {regex: '^Private$'}}}
              inside: {kind: content, inside: {pattern: _REFERENCE}}
      fix: ''
    - id: add-metadata
      rule:
        matches: msbuild-tag
        pattern: _TAG
        has: {kind: Name, regex: '^Reference$'}
      transform:
        STRIPPED: rewrite($TAG, rewriters=[remove-metadata])
        FIXED:
            replace:
                source: $STRIPPED
                replace: '\s*(/?>)$'
                by: ' Private="false"$1'
      fix: $FIXED
message: The Reference with a HintPath copies the host-supplied assembly into the output and the host loads that copy
note: Add Private="false", and reference a package or project output through PackageReference or ProjectReference
