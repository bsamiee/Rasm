id: no-set-and-undefine-target-framework
valid:
    # A single-targeting reference
    - |
      <ProjectReference Include="../Tool/Tool.csproj" />
    # The incompatible-framework form with the undefine alone
    - |
      <ProjectReference Include="../Tool/Tool.csproj" SkipGetTargetFrameworkProperties="true" UndefineProperties="TargetFramework" ReferenceOutputAssembly="false" />
    # A custom item holds both names as metadata, SetTargetFramework does nothing outside ProjectReference
    - |
      <ItemGroup><_HostProject Include="../Tool/Tool.csproj" SetTargetFramework="TargetFramework=net10.0" UndefineProperties="TargetFramework" /></ItemGroup>
    # The incompatible-framework form with the set alone
    - |
      <ProjectReference Include="../Tool/Tool.csproj" SkipGetTargetFrameworkProperties="true" SetTargetFramework="TargetFramework=net10.0" />
invalid:
    # Both metadata on one reference
    - |
      <ProjectReference Include="../Tool/Tool.csproj" SkipGetTargetFrameworkProperties="true" SetTargetFramework="TargetFramework=net10.0" UndefineProperties="TargetFramework" />
    # Both metadata in the child-element form
    - |
      <ProjectReference Include="../Tool/Tool.csproj"><SetTargetFramework>TargetFramework=net10.0</SetTargetFramework><UndefineProperties>TargetFramework</UndefineProperties></ProjectReference>
