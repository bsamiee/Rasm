# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    log-message:
        matches: os-log-call
        any:
            - pattern: $_L.$_V($MSG)
            - pattern: '$_L.log(level: $_E, $MSG)'
    nameless-literal:
        kind: 'line_string_literal, multi_line_string_literal, raw_string_literal'
        not:
            has:
                kind: 'line_str_text, multi_line_str_text, raw_str_part, raw_str_end_part'
                not: {regex: '(?i)^[^a-z]*((trace|debug|info|notice|warning|error|critical|fault|failed|failure|exception)s?(?-u:\b)[^a-z]*)*$'}
    earlier-site:
        any:
            - matches: log-message
            - has: {stopBy: end, matches: log-message}
rule:
    kind: call_expression
    all:
        - matches: log-message
        - not: {inside: {stopBy: end, kind: function_declaration, has: {field: name, regex: '^log$'}, inside: {stopBy: end, kind: class_declaration, has: {kind: inheritance_specifier, regex: 'LogHandler$'}}}}
        - has: {nthChild: 1, pattern: $LOGGER}
        - any:
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, matches: nameless-literal}}}}
            - follows: {stopBy: end, matches: earlier-site}
            - inside: {stopBy: end, follows: {stopBy: end, matches: earlier-site}}
message: '`$LOGGER` logs `$MSG`, a message naming no operation or repeating an earlier log call'
note: 'Name the operation and its subject in each message, and log a shared failure once where its paths join'
