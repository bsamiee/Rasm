# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-answering-value
language: python
severity: error
utils:
    answer:
        any:
            - kind: return_statement
            - kind: expression_statement
              has:
                any:
                    - kind: assignment
                      has: {field: left, kind: identifier}
                    - kind: yield
    answering-handler:
        kind: except_clause
        all:
            - has: {field: value, pattern: $_}
            - not: {has: {regex: '^\*$'}}
            - has:
                kind: block
                all:
                    - has: {matches: answer}
                    - not: {has: {pattern: $_, not: {any: [{matches: answer}, {kind: comment}]}}}
    awaited-statement:
        kind: expression_statement
        all:
            - any:
                - has: {kind: await}
                - has: {kind: assignment, has: {field: right, kind: await}}
            - has: {stopBy: end, kind: await, has: {kind: call}}
            - not: {has: {stopBy: end, kind: call, not: {inside: {kind: await}}}}
            - not: {has: {stopBy: end, kind: call, has: {stopBy: end, kind: call}}}
    caught-handler:
        kind: except_clause
        all:
            - has:
                field: value
                kind: as_pattern
                all:
                    - has: {field: alias, has: {kind: identifier, pattern: $CAUGHT}}
                    - not: {has: {kind: tuple}}
            - has:
                kind: block
                all:
                    - has: {nthChild: 1, kind: return_statement, has: {kind: call, has: {stopBy: end, kind: identifier, pattern: $CAUGHT}}}
                    - not: {has: {nthChild: 2}}
rule:
    kind: try_statement
    all:
        - not: {has: {kind: finally_clause}}
        - has: {kind: except_clause}
        - not: {has: {kind: except_clause, not: {matches: answering-handler}}}
        - not:
            has:
                kind: except_clause
                has:
                    field: value
                    any:
                        - matches: builtins-stop-iteration
                        - has: {stopBy: end, matches: builtins-stop-iteration}
        - not:
            all:
                - has: {field: body, kind: block, all: [{has: {nthChild: 1, matches: awaited-statement}}, {not: {has: {nthChild: 2}}}]}
                - not: {has: {kind: except_clause, not: {matches: caught-handler}}}
message: '`try` answers a value from every handler'
note: 'Call `expression.extra.result.catch(<callee>, exception=<error>)(<arguments>)` over a raising call, one awaited call takes `try` with each handler returning `Error(<caught>)`'
