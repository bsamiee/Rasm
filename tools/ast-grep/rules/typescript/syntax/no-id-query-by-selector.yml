# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - not: {has: {field: type_arguments, kind: type_arguments, not: {regex: '^<HTMLElement>$'}}}
        - has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^querySelector$'}
                - has:
                    field: object
                    all: [{regex: '^((globalThis|window|self)\.)?document$'}, {matches: typescript-global-reference}]
        - has:
            field: arguments
            all:
                - not: {has: {nthChild: 2}}
                - has:
                    nthChild: 1
                    any:
                        - pattern: '`#${$CSS.escape($ID)}`'
                        - pattern: "'#' + $CSS.escape($ID)"
                        - pattern: '"#" + $CSS.escape($ID)'
constraints:
    CSS: {regex: '^((globalThis|window|self)\.)?CSS$', matches: typescript-global-reference}
    ID:
        kind: string, template_string
        has: {kind: string_fragment, regex: '^[^\x00]+$'}
        not: {has: {kind: 'escape_sequence, template_substitution'}}
message: '`$CALL` finds one element through a selector built from an id'
note: 'Call `getElementById(<id>)` on the same document with id unescaped'
