# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: no-internal-module-import
language: typescript
severity: error
files: ['apps/**', 'libs/**'] # The consumer layers
ignores: ['**/internal/**'] # The internal modules import each other
rule:
    kind: import_statement # The explicit kind beside the util call keeps kind pruning
    all:
        - pattern: $STMT # The whole statement, the fix keeps `type`, a default clause, and a namespace clause as written
        - matches:
            import-from: # utils/import-from.yml, every declared argument is filled and $SOURCE binds inside the argument rule
                source: {pattern: $SOURCE, regex: '/internal(/|$)'}
                clause: {pattern: $CLAUSE}
transform:
    FIXED:
        replace: {source: $STMT, replace: "/internal[^\"']*", by: ''} # Cuts the internal path down to the package root
fix: $FIXED
message: '`$CLAUSE` is imported from the internal module `$SOURCE`'
note: Import the package root, it exports every stable name
labels:
    SOURCE: {style: primary, message: The internal path} # A capture an argument rule binds is a rule capture
