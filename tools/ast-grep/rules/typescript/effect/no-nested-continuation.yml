# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-continuation
language: tsx
severity: error
utils:
    continuation:
        kind: call_expression
        all:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(andThen|catch|catchIf|catchTag|flatMap|map|matchEffect|orElse|tap|tapError)$'}}}}
            - has: {field: arguments, has: {kind: arrow_function, pattern: $_}}
rule:
    pattern: $CALL
    matches: continuation
    has:
        field: arguments
        has:
            kind: arrow_function
            has:
                field: body
                any:
                    - {matches: continuation, pattern: $INNER}
                    - not: {matches: typescript-function-boundary}
                      has: {stopBy: {matches: typescript-function-boundary}, matches: continuation, pattern: $INNER}
message: 'Continuation callback starts another continuation at `$INNER`'
note: 'Yield dependent steps in one `Effect.gen` or `Effect.fn` body, and chain recovery nested in a recovery callback as one flat pipe'
labels:
    CALL: {style: primary}
    INNER: {style: secondary}
