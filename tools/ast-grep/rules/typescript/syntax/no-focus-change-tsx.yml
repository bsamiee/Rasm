# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
files: ['libs/**', 'tools/**', 'plugins/**', 'apps/creative-cloud/**', '.claude/**', '.codex/**']
utils:
    program:
        kind: string
        nthChild: 1
        inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|\.)(spawn|spawnSync|execFile|execFileSync)$|^(ChildProcess\.)?make$'}}}
    activating-script:
        regex: '(?-u:\b)activate(?-u:\b)|(?-u:\b)set[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]+frontmost(?-u:\b)|AXRaise'
    activating-line:
        all:
            - any:
                - kind: template_string
                  inside: {kind: call_expression, field: arguments, has: {field: function, regex: '(?s)(^|\.)make(\(.*\))?$'}}
                - kind: 'string, template_string'
                  nthChild: 1
                  inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|\.)(exec|execSync)$'}}}
            - any:
                - regex: '^[`''"][\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*(/usr/bin/)?open([\p{White_Space}\x{200B}\x{2060}\x{FEFF}]|[`''"])'
                  not: {regex: '^[`''"][\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*(/usr/bin/)?open([\p{White_Space}\x{200B}\x{2060}\x{FEFF}]+([^-[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*|-[^-[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*|--([^a[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*|a[^r[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*|ar[^g[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*|arg[^s[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*|args[^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]+|ar|arg|a)?))*?[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]+(-[eftFWRnjh]*g[A-Za-z]*|--background)([\p{White_Space}\x{200B}\x{2060}\x{FEFF}]|[`''"])'}
                - regex: '^[`''"][\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*(/usr/bin/)?osascript[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]'
                  matches: activating-script
rule:
    kind: call_expression
    pattern: $SITE
    any:
        - all:
            - has: {field: arguments, has: {matches: program, regex: '^[''"](/usr/bin/)?open[''"]$'}}
            - not: {has: {field: arguments, has: {nthChild: 2, not: {kind: 'object, array'}}}}
            - not:
                has:
                    field: arguments
                    has:
                        nthChild: 2
                        kind: array
                        has:
                            any:
                                - kind: spread_element
                                - kind: string
                                  regex: '^[''"](-[eftFWRnjh]*g[A-Za-z]*|--background)[''"]$'
                                  not: {follows: {stopBy: end, regex: '^[''"]--args[''"]$'}}
        - all:
            - has: {field: arguments, has: {matches: program, regex: '^[''"](/usr/bin/)?osascript[''"]$'}}
            - has: {field: arguments, has: {nthChild: 2, kind: array, has: {kind: 'string, template_string', matches: activating-script}}}
        - has: {field: arguments, any: [{matches: activating-line}, {has: {matches: activating-line}}]}
message: '`$SITE` takes focus from the frontmost application'
note: '`watch-apps launch <app>` opens apps unfocused, run it by `ChildProcess.make`, drop AppleScript `activate`, `AXRaise`, and `frontmost` writes'
