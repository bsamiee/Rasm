# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-for-of-loop
language: tsx
severity: error
rule:
    kind: for_in_statement
    has: {field: right, pattern: $ITERABLE}
message: '`for` loop over `$ITERABLE` iterates by statement'
note: '`Array.map`, `Array.reduce`, or `Effect.forEach` over `<iterable>` returns the results, `Effect.forEach` with `discard` runs a side effect'
