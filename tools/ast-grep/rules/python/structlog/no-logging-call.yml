# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-logging-call
language: python
severity: error
rule:
    # The configuration, factory, and root-logger members, a level constant or the Handler type feeds the structlog stdlib integration
    matches:
        python-module-member:
            module: {regex: '^logging$'}
            name: {regex: '^(basicConfig|getLogger|log|debug|info|warning|error|critical|fatal|exception)$', pattern: $NAME}
message: '`logging.$NAME` runs the stdlib logging pipeline outside the structured one structlog owns'
note: >-
    Log through `structlog.get_logger(__name__).<level>(<event>, <key>=<value>)`, configured once at the composition root by
    `structlog.configure(processors=[...])` with the OpenTelemetry processor
