# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    effect-member:
        kind: member_expression
        has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
    failure-constructor:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(try|tryPromise|fail|failSync|failCause|failCauseSync|filterOrFail|mapError|mapBoth)$'}
                - matches: effect-member
    failure-pipe:
        kind: call_expression
        any:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^pipe$'}
                    - has: {field: object, matches: failure-constructor}
            - all:
                - has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, matches: failure-constructor}}
    predicate:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(isSuccess|isFailure)$'}
            - matches: effect-member
    boolean-handler:
        matches: {typescript-constant-function: {result: {kind: 'true, false'}}}
    boolean-pair:
        kind: pair
        all:
            - has: {field: key, regex: '^onSuccess$'}
            - has: {field: value, matches: boolean-handler}
rule:
    any:
        - kind: member_expression
          all:
            - matches: predicate
            - inside: {kind: arguments, inside: {matches: failure-pipe}}
            - pattern: $CALL
        - kind: call_expression
          all:
            - has: {field: function, matches: predicate, pattern: $CALL}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, matches: failure-constructor}}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^match$'}}, {matches: effect-member}], pattern: $CALL}
            - has:
                field: arguments
                has:
                    kind: object
                    has:
                        kind: pair
                        all:
                            - has: {field: key, regex: '^onFailure$'}
                            - has: {field: value, matches: boolean-handler}
            - any:
                - not: {has: {field: arguments, has: {kind: object, has: {matches: boolean-pair}}}}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, matches: failure-constructor}}
                - inside: {kind: arguments, inside: {matches: failure-pipe}}
message: '`$CALL` collapses a typed failure into a boolean'
note: 'Return the effect with its typed failure for a `_tag` match'
