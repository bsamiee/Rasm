# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-quoted-conditional-argument
language: bash
severity: error
rule:
    kind: simple_expansion, expansion, command_substitution
    pattern: $VALUE
    matches: bash-string-expansion
    inside:
        kind: concatenation
        has: {kind: word, regex: "^(-[A-Za-z]|--?[A-Za-z][A-Za-z0-9-]*=)$", nthChild: 1}
        inside:
            kind: expansion
            has: {field: operator, regex: '^:?\+$'}
            inside: {kind: 'command, array', stopBy: {not: {kind: concatenation}}}
labels: {VALUE: {style: primary}}
fix: '"$VALUE"'
message: 'Option value `$VALUE` word-splits and glob-expands inside the alternative'
note: 'Quote the value inside the alternative, `${<condition>:+--option="$<value>"}`'
