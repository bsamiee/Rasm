# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sortedness-by-windows
language: rust
severity: error
utils:
    order:
        regex: '^(<|<=|>|>=)$'
    forward:
        kind: binary_expression
        all:
            - has: {field: left, kind: index_expression, pattern: '$W[0]'}
            - has: {field: right, kind: index_expression, pattern: '$W[1]'}
            - has: {field: operator, pattern: $$OP, matches: order}
    backward:
        kind: binary_expression
        all:
            - has: {field: left, kind: index_expression, pattern: '$W[1]'}
            - has: {field: right, kind: index_expression, pattern: '$W[0]'}
            - has: {field: operator, pattern: $$ROP, matches: order}
    pair-forward:
        kind: binary_expression
        all:
            - has: {field: left, pattern: $A}
            - has: {field: right, pattern: $B}
            - has: {field: operator, pattern: $$OP, matches: order}
    pair-backward:
        kind: binary_expression
        all:
            - has: {field: left, pattern: $B}
            - has: {field: right, pattern: $A}
            - has: {field: operator, pattern: $$ROP, matches: order}
rule:
    kind: call_expression
    all:
        - any:
            - all:
                - pattern: $S.windows(2).all(|$W| $BODY)
                - has: {field: arguments, has: {kind: closure_expression, has: {field: body, any: [{matches: forward}, {matches: backward}]}}}
            - all:
                - any:
                    - pattern: '$S.array_windows::<2>().all(|[$A, $B]| $BODY)'
                    - pattern: '$S.array_windows::<2>().all(|&[$A, $B]| $BODY)'
                    - pattern: '$S.array_windows().all(|[$A, $B]| $BODY)'
                    - pattern: '$S.array_windows().all(|&[$A, $B]| $BODY)'
                - has: {field: arguments, has: {kind: closure_expression, has: {field: body, any: [{matches: pair-forward}, {matches: pair-backward}]}}}
transform:
    FORWARD_SORTED: {replace: {source: $OP, replace: '^<=$', by: 'is_sorted()'}}
    FORWARD: {replace: {source: $FORWARD_SORTED, replace: '^(<|>|>=)$', by: 'is_sorted_by(|left, right| left ${1} right)'}}
    BACKWARD_SORTED: {replace: {source: $ROP, replace: '^>=$', by: 'is_sorted()'}}
    BACKWARD_LESS: {replace: {source: $BACKWARD_SORTED, replace: '^>$', by: 'is_sorted_by(|left, right| left < right)'}}
    BACKWARD_GREATER: {replace: {source: $BACKWARD_LESS, replace: '^<$', by: 'is_sorted_by(|left, right| left > right)'}}
    BACKWARD: {replace: {source: $BACKWARD_GREATER, replace: '^<=$', by: 'is_sorted_by(|left, right| left >= right)'}}
fix: $S.$FORWARD$BACKWARD
message: '`$S` checks adjacent order through a window per element pair'
note: 'Call `<slice>.is_sorted()` for ascending `<=` order and `<slice>.is_sorted_by(|left, right| left <op> right)` for any other comparison'
