# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-add-record
language: tsx
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^add$'}, not: {has: {field: object, regex: '(^|\.)documents$'}}}
        - has: {field: arguments, has: {kind: object, has: {kind: pair}}}
    inside: {kind: program, stopBy: end, matches: {uxp-host-file: {module: {regex: '^(adobe:)?indesign$'}}}}
message: '`$CALL` passes a record to `add`, where InDesign drops each refused nested value and refuses a top-level one as "Invalid parameter." or "Data is out of range." naming no field'
note: 'Call `add` with its required arguments alone, then write each field as its own `Object.assign(<member>, { [<key>]: <value> })` under `Effect.validate`, where a refused field throws with its expected type and range; `documents.add` keeps its `documentPreferences` record, the one form that sets a page under 73 pt'
