                    |despite\ the\ fact\ that|need\ to|have\ to|enables\ you\ to|allows\ you\ to|as\ needed|as\ necessary
                    |as\ appropriate|out\ of\ the\ box|under\ the\ hood|gracefully\ handles
                    |perform\ an\ analysis\ of|make\ a\ decision|provide\ support\ for|conduct\ a\ review\ of
                    |carry\ out\ validation\ of|take\ into\ consideration|give\ an\ indication\ of|is\ responsible\ for
                    |serves\ as|acts\ as|functions\ as|allows\ for|provides\ the\ ability|is\ able\ to|has\ the\ ability\ to
                    |is\ used\ to|in\ charge\ of
                    |set\ up|spin\ up|kick\ off|tear\ down|reach\ out|figure\ out|hook\ up|wire\ up|pull\ in|put\ together
