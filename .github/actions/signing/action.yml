name: Signing
description: Imports the Apple signing identities the job's APPLE_DEVELOPMENT_P12 and DEVELOPER_ID_P12 variables hold into a keychain under the runner's per-job temp folder, and places it first in the user's search list

runs:
    using: composite
    steps:
        - shell: bash
          run: |-
              keychain="${RUNNER_TEMP}/app-signing.keychain-db"
              password="$(uuidgen)"
              security create-keychain -p "${password}" "${keychain}"
              security set-keychain-settings -lut 21600 "${keychain}"
              security unlock-keychain -p "${password}" "${keychain}"
              for identity in APPLE_DEVELOPMENT_P12 DEVELOPER_ID_P12; do
                  passphrase="${identity}_PASSWORD"
                  [[ -n "${!identity}" ]] || continue
                  printf "%s" "${!identity}" | base64 --decode -o "${RUNNER_TEMP}/${identity}.p12"
                  security import "${RUNNER_TEMP}/${identity}.p12" -P "${!passphrase}" -A -t cert -f pkcs12 -k "${keychain}"
              done
              security set-key-partition-list -S apple-tool:,apple: -k "${password}" "${keychain}"
              security list-keychains -d user | xargs security list-keychains -d user -s "${keychain}"
