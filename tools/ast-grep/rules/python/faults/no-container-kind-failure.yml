# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-container-kind-failure
language: python
severity: error
utils:
    container-name:
        regex: '^([\w.]+\.)?(tuple|list|set|frozenset|Sequence|MutableSequence|Collection|AbstractSet|MutableSet)$'
    failure-name:
        regex: '^([\w.]+\.)?\w*(Fault|Error|Failure|Exception)$'
    failure-container:
        any:
            - kind: generic_type
              all:
                - has: {nthChild: 1, matches: container-name}
                - has:
                    kind: type_parameter
                    all:
                        - has: {kind: type, matches: failure-name}
                        - not: {has: {kind: type, not: {any: [{matches: failure-name}, {has: {kind: ellipsis}}]}}}
            - kind: subscript
              all:
                - has: {field: value, matches: container-name}
                - has: {field: subscript, matches: failure-name}
                - not: {has: {field: subscript, not: {any: [{matches: failure-name}, {kind: ellipsis}]}}}
    failure-alias:
        kind: identifier
        pattern: $ALIAS
        inside:
            kind: module
            stopBy: end
            has:
                stopBy: {kind: 'function_definition, class_definition, type_alias_statement, expression_statement'}
                any:
                    - kind: type_alias_statement
                      all:
                        - has: {field: left, has: {kind: identifier, pattern: $ALIAS}}
                        - has: {field: right, has: {matches: failure-container}}
                    - kind: expression_statement
                      has:
                        stopBy: {not: {kind: assignment}}
                        kind: assignment
                        all:
                            - has: {field: left, pattern: $ALIAS}
                            - has: {field: right, matches: failure-container}
    union-node:
        any:
            - kind: union_type
            - kind: binary_operator
              has: {field: operator, regex: '^\|$'}
            - kind: generic_type
              has: {nthChild: 1, regex: '^(Union|Optional)$'}
            - kind: subscript
              has: {field: value, regex: '^([\w.]+\.)?(Union|Optional)$'}
    failure-union:
        matches: union-node
        all:
            - not: {inside: {stopBy: {not: {kind: 'type, type_parameter'}}, matches: union-node}}
            - has:
                stopBy: {not: {any: [{kind: 'type, type_parameter'}, {matches: union-node}]}}
                any: [{matches: failure-container}, {matches: failure-alias}]
    failure-module:
        inside: {kind: module, stopBy: end, has: {stopBy: end, matches: failure-union}}
rule:
    pattern: $SHAPE
    any:
        - matches: failure-union
        - kind: call
          all:
            - has:
                field: arguments
                has:
                    nthChild: 2
                    any:
                        - matches: container-name
                        - kind: 'tuple, binary_operator'
                          has: {stopBy: {not: {kind: 'tuple, binary_operator, parenthesized_expression'}}, matches: container-name}
            - has: {field: function, matches: {python-builtin-name: {name: {regex: '^isinstance$'}}}}
            - matches: failure-module
        - kind: case_pattern
          all:
            - has:
                any:
                    - kind: class_pattern
                      has: {kind: dotted_name, matches: container-name}
                    - kind: 'list_pattern, tuple_pattern'
                      not: {has: {kind: case_pattern, not: {has: {kind: splat_pattern}}}}
            - matches: failure-module
message: '`$SHAPE` tells failure from success by container kind, a nominal `Faults` failure arm tells them apart by class'
note: 'Use a frozen `Faults` record over the non-empty fault tuple as the failure arm and `case Faults():` as its test'
