# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-mesh"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords             = ["mesh", "geometry", "solids", "cad"]
categories           = ["graphics", "mathematics", "algorithms"]
description          = "Mesh solids: import with repair, extrusion, hulls, booleans, sections, reduction, and measures"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon           = { workspace = true }
thiserror       = { workspace = true }
derive_more     = { workspace = true }
itertools       = { workspace = true }
bounded-integer = { workspace = true }
nutype          = { workspace = true }
nalgebra        = { workspace = true }
manifold-rust   = { workspace = true }
meshopt         = { workspace = true }
parry3d-f64     = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
