# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    callee:
        any:
            - {kind: identifier, pattern: $ROOT}
            - {kind: member_expression, has: {field: object, matches: callee}}
rule:
    kind: program
    all:
        - not: {has: {pattern: $_, not: {kind: 'hash_bang_line, comment, import_statement, expression_statement'}}}
        - not: {has: {kind: expression_statement, nthChild: {position: 2, ofRule: {kind: expression_statement}}}}
        - has:
            kind: expression_statement
            has:
                stopBy: {not: {kind: 'await_expression, unary_expression'}}
                kind: call_expression
                pattern: $CALL
                all:
                    - has: {field: arguments, not: {has: {pattern: $_, not: {kind: comment}}}}
                    - has: {field: function, pattern: $F, matches: callee}
        - has: {kind: import_statement, has: {kind: import_clause, has: {stopBy: end, kind: identifier, pattern: $ROOT}}}
message: 'Module forwards to `$F`'
note: 'Point build input at the package entry and delete forwarding module'
labels:
    CALL: {style: primary, message: Forwarded call}
