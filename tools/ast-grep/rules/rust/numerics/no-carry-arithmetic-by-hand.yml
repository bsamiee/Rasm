# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-carry-arithmetic-by-hand
language: rust
severity: error
utils:
    carry:
        kind: identifier
        regex: '(?i)(^|_)carry$'
    width:
        kind: integer_literal
        regex: '^(32|64)(_?[iu](8|16|32|64|128|size))?$'
    high-half:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^>>$'}
                - has: {field: left, pattern: $T}
                - has: {field: right, matches: width}
            - kind: 'parenthesized_expression, type_cast_expression'
              has: {matches: high-half}
    low-half:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^&$'}
                - has: {field: left, pattern: $T}
                - has: {field: right, kind: integer_literal, regex: '(?i)^0x(f{4}_?){2}(_?(f{4}_?){2})?(_?u(32|64|128))?$'}
            - kind: type_cast_expression
              all:
                - has: {field: value, pattern: $T}
                - has: {field: type, regex: '^u(32|64)$'}
rule:
    kind: 'let_declaration, assignment_expression, compound_assignment_expr'
    pattern: $CARRY
    all:
        - any:
            - all: [{has: {field: pattern, matches: carry}}, {has: {field: value, matches: high-half}}]
            - all: [{kind: assignment_expression}, {has: {field: left, matches: carry}}, {has: {field: right, matches: high-half}}]
            - all:
                - kind: compound_assignment_expr
                - has: {field: left, matches: carry, pattern: $T}
                - has: {field: operator, regex: '^>>=$'}
                - has: {field: right, matches: width}
        - inside:
            stopBy: {kind: 'function_item, closure_expression'}
            kind: 'function_item, closure_expression'
            has: {field: body, has: {stopBy: end, matches: low-half}}
        - not: {matches: rust-test-scope}
message: '`$CARRY` propagates a carry between machine-word limbs by hand'
note: 'Hold the number as a dashu integer, `dashu::Natural` (`dashu::integer::UBig`) for unsigned and `dashu::Integer` (`dashu::integer::IBig`) for signed values, dashu operators add, multiply, and divide across limbs and propagate the carry'
