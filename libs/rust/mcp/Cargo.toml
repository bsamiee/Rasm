# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-mcp"
version.workspace    = true
categories           = ["network-programming", "web-programming::http-server"]
edition.workspace    = true
keywords             = ["mcp", "modelcontextprotocol", "rmcp", "streamable-http"]
license.workspace    = true
repository.workspace = true
description          = "Streamable HTTP MCP server with routers, argument validation, and request telemetry"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-util                         = { workspace = true }
tokio-stream                       = { workspace = true }
arc-swap                           = { workspace = true }
nonempty-collections               = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive-where                       = { workspace = true }
derive_more                        = { workspace = true }
serde                              = { workspace = true }
serde_path_to_error                = { workspace = true }
serde_json                         = { workspace = true }
serde_urlencoded                   = { workspace = true }
jsonschema                         = { workspace = true }
schemars                           = { workspace = true }
bounded-integer                    = { workspace = true }
percent-encoding                   = { workspace = true }
form_urlencoded                    = { workspace = true }
uuid                               = { workspace = true }
axum                               = { workspace = true }
matchit                            = { workspace = true }
rmcp                               = { workspace = true }
opentelemetry                      = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-subscriber                 = { workspace = true }
tracing-opentelemetry              = { workspace = true }
clap                               = { workspace = true }
rasm-telemetry                     = { workspace = true }
