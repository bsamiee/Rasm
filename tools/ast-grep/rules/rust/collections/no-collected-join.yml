# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-collected-join
language: rustlang
severity: error
utils:
    literal-separator:
        has: {stopBy: end, kind: string_literal, pattern: $S}
rule:
    kind: call_expression
    any:
        - all: [{pattern: '$I.intersperse($S.to_owned()).collect::<String>()'}, {matches: literal-separator}]
        - all: [{pattern: '$I.intersperse($S.to_string()).collect::<String>()'}, {matches: literal-separator}]
        - all: [{pattern: '$I.intersperse(String::from($S)).collect::<String>()'}, {matches: literal-separator}]
        - all: [{pattern: '$I.intersperse(Cow::from($S)).collect::<String>()'}, {matches: literal-separator}]
        - all: [{pattern: '$I.intersperse(Cow::Borrowed($S)).collect::<String>()'}, {matches: literal-separator}]
        - pattern: $I.map(ToString::to_string).collect::<Vec<$_>>().join($S)
        - all: [{pattern: '$I.intersperse($S).collect::<String>()'}, {matches: literal-separator}]
        - pattern: $I.map(String::from).collect::<Vec<$_>>().join($S)
        - pattern: $I.map(str::to_owned).collect::<Vec<$_>>().join($S)
        - pattern: $I.map(str::to_string).collect::<Vec<$_>>().join($S)
        - pattern: $I.map(ToOwned::to_owned).collect::<Vec<$_>>().join($S)
        - pattern: $I.map(String::as_str).collect::<Vec<$_>>().join($S)
        - pattern: '$I.map(|$X| $X.to_string()).collect::<Vec<$_>>().join($S)'
        - pattern: '$I.map(|$X| $X.to_owned()).collect::<Vec<$_>>().join($S)'
        - all: [{pattern: '$I.collect::<Vec<$_>>().join($S)'}, {has: {stopBy: end, pattern: '$_.map(|$X| $X.as_str())'}}]
        - pattern: '$J.map(|$_| format!($$$)).collect::<Vec<$_>>().join($T)'
        - all: [{pattern: '$I.collect::<Vec<$_>>().join($S)'}, {matches: literal-separator}]
constraints:
    S: {not: {regex: '^""$'}}
    T: {not: {regex: '^""$'}}
message: '`$I$J` joins items through `intersperse` or an intermediate `Vec`'
note: 'Call `<iterator>.join(<separator>)`, or `format_with(<separator>, |<item>, sink| ..)` over a `format!` map (`use itertools::Itertools as _;`)'
