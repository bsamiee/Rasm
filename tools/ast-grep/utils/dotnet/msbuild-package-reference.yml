# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: msbuild-package-reference
language: xml
arguments: [id]
rule:
    kind: element
    has:
        matches: msbuild-tag
        all:
            - has: {kind: Name, regex: '^PackageReference$'}
            - has: {kind: Attribute, all: [{has: {kind: Name, regex: '^Include$'}}, {has: {kind: AttValue, matches: id}}]}
