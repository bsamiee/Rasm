# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: no-chained-pipe
language: typescript
severity: error
rule:
    pattern: $X.pipe($$$FIRST).pipe($$$REST) # The method chain, the free form pipe(pipe(value, step), next) is another shape with its own template
    not: # The outermost chain reports once, an inner chain is the object of a later .pipe
        inside: {kind: member_expression, field: object, has: {field: property, regex: '^pipe$'}}
fix: $X.pipe($$$FIRST, $$$REST) # Folds one link per pass, scan -U runs until stderr prints no Applied line
message: Two pipe calls chain where one variadic pipe holds every step
note: Pass every step to one `pipe`, `value.pipe(step, next)`
