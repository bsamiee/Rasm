# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-whole-tree-argv
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    # Parameter discarded under an underscore, the edited path the row never reads
    discarded-path:
        kind: identifier
        regex: '^_'
    # Function of the row that discards the path and runs a test or scan with no filter, in any function spelling
    whole-tree-function:
        matches: syntax-function-boundary
        all:
            - any:
                  - has: {field: parameter, matches: discarded-path}
                  - has: {field: parameters, has: {nthChild: 1, kind: required_parameter, has: {field: pattern, matches: discarded-path}}}
            # A test or scan command word in the argv, the runs that take a path or a filter
            - has: {field: body, has: {stopBy: end, kind: string, pattern: $WORD, regex: "^['\"](test|scan)['\"]$"}}
            # A filter or a file list in either spelling bounds the run
            - not: {has: {field: body, has: {stopBy: end, any: [{kind: string}, {kind: template_string}], regex: "^['\"`](--filter|--files|-f)"}}}
rule:
    any:
        - kind: pair
          all:
              - has: {field: key, regex: "^['\"]?argv['\"]?$"}
              - has: {field: value, matches: whole-tree-function}
        # The method spelling of the row
        - kind: method_definition
          all:
              - has: {field: name, regex: '^argv$'}
              - matches: whole-tree-function
message: The `argv` row runs `$WORD` over the whole tree and discards the edited path
note: Bound the run to the edited path, `--filter '^<id>$'` over the ids the file holds or the path itself
