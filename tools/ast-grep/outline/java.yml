    inside: {kind: formal_parameters, inside: {kind: record_declaration, field: parameters}}
    any:
        - has: {field: name, pattern: $NAME}
        - has: {kind: variable_declarator, has: {field: name, pattern: $NAME}}
name: $NAME
signature: $DECLARATION
