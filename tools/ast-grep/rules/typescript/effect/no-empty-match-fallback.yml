# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-match-fallback
language: tsx
severity: error
utils:
    module-member:
        kind: member_expression
        has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}
    function-reference:
        any:
            - kind: member_expression
              has: {field: object, matches: {effect-module: {name: {regex: '\bFunction$'}}}}
            - kind: identifier
              matches: {syntax-import-reference: {source: {regex: '^effect/Function$'}, exported: {regex: '^(constant|const(Undefined|Null|Void))$'}}}
    empty-value:
        any:
            - kind: 'array, object'
              not: {has: {pattern: $_}}
            - kind: 'undefined, null'
            - kind: 'string, template_string'
              not: {has: {kind: 'string_fragment, template_substitution'}}
            - kind: unary_expression
              regex: '^void\s'
              has: {field: argument, kind: number}
            - kind: parenthesized_expression
              has: {matches: empty-value}
            - matches: module-member
              has: {field: property, regex: '^(void|empty)$'}
            - kind: call_expression
              all:
                - has: {field: function, matches: module-member, has: {field: property, regex: '^(none|empty)$'}}
                - not: {has: {field: arguments, has: {pattern: $_}}}
            - kind: call_expression
              all:
                - has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^succeed$'}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: empty-value}}, {not: {has: {nthChild: 2}}}]}
rule:
    kind: call_expression
    all:
        - has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^orElse$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\bMatch$'}}}}
        - has:
            field: arguments
            has:
                any:
                    - matches: {effect-constant-handler: {result: {matches: empty-value, pattern: $D}}}
                    - kind: call_expression
                      all:
                        - has: {field: function, matches: function-reference, regex: '(^|\.)constant$'}
                        - has: {field: arguments, has: {matches: empty-value, pattern: $D}}
                    - matches: function-reference
                      regex: '(^|\.)const(Undefined|Null|Void)$'
                      pattern: $D
                    - matches: module-member
                      has: {field: property, regex: '^(none|empty)$'}
                      pattern: $D
message: '`Match.orElse` yields `$D` for every case the arms miss'
note: '`Match.exhaustive` after a `Match.when` or `Match.tag` arm per missed case closes the union and fails the type check on an uncovered case'
