# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yamllang
severity: error
files: ['sgconfig.yml', 'tools/ast-grep/outline/**', 'tools/ast-grep/rules/**', 'tools/ast-grep/utils/**']
utils:
    perl-scalar:
        kind: plain_scalar, single_quote_scalar, double_quote_scalar, block_scalar
        regex: '\\'
        all:
            - any:
                - kind: plain_scalar, single_quote_scalar, block_scalar
                  not: {regex: '^(?:[^\\]|\\[^sSwWdDbB<>]|\(\?[A-Za-z]*-[A-Za-z]*u[A-Za-z]*:(?:[^\\()]|\\(?s:.))*\))*$'}
                - kind: double_quote_scalar
                  not: {regex: '^(?:[^\\]|\\[^\\]|\\\\\\\\|\\\\\\[^\\]|\\\\[^\\sSwWdDbB<>]|\(\?[A-Za-z]*-[A-Za-z]*u[A-Za-z]*:(?:[^\\()]|\\(?s:.))*\))*$'}
            - not: {regex: '^(?:["'']|[|>][-+0-9]*[\t\n\v\f\r ]+)?\(\?[A-Za-z]*-[A-Za-z]*u[A-Za-z]*\)'}
    regex-value:
        kind: block_node, flow_node
        inside: {kind: 'block_mapping_pair, flow_pair', has: {field: key, has: {regex: '^["'']?(?:regex|replace)["'']?$'}}}
rule:
    any:
        - all:
            - matches: perl-scalar
            - any: [{regex: '^(?:["'']|[|>][-+0-9]*[\t\n\v\f\r ]+)?replace\('}, {inside: {matches: regex-value}}]
        - kind: alias
          inside:
            all: [{matches: regex-value}, {matches: {yaml-resolved-value: {value: {has: {matches: perl-scalar}}}}}]
message: Unicode Perl class compiles two to ten times slower than its ASCII class and states no grammar fact
note: 'Write `[\t\n\v\f\r ]`, `[0-9A-Za-z_]`, `[0-9]` or `(?-u:\b)` over ASCII tokens, else a class the grammar''s `word` and `extras` derive'
