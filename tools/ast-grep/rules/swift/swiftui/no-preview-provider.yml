# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-preview-provider
language: swiftlang
severity: error
rule:
    kind: inheritance_specifier
    regex: '^(SwiftUI\.)?PreviewProvider$'
message: '`PreviewProvider` conformance declares a type whose `previews` property holds the preview'
note: 'Write `#Preview("<name>") { <view> }` at file scope, one macro per preview'
