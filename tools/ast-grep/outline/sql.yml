id: sql-table
language: sql
role: item
symbolType: struct
rule:
    kind: create_table_statement, create_virtual_table_statement
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
transform:
    JOINED: {replace: {source: $DECLARATION, replace: '\s+', by: ' '}}
    SIGNATURE: {replace: {source: $JOINED, replace: '(?is)^(create .*?)\s*(?:\(|\bas\b).*$', by: '$1'}}
name: $NAME
signature: $SIGNATURE
---
id: sql-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table]
rule:
    kind: column_definition
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
    inside: {kind: create_table_statement}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-view
language: sql
role: item
symbolType: interface
rule:
    kind: create_view_statement
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
rewriters:
    - id: body
      rule: {kind: select_clause, inside: {kind: create_view_statement, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    JOINED: {replace: {source: $HEADER, replace: '\s+', by: ' '}}
    SIGNATURE: {replace: {source: $JOINED, replace: '(?i)\s*(\bas)?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-index
language: sql
role: item
symbolType: key
rule:
    kind: create_index_statement
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-trigger
language: sql
role: item
symbolType: event
rule:
    kind: create_trigger_statement
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
transform:
    JOINED: {replace: {source: $DECLARATION, replace: '\s+', by: ' '}}
    SIGNATURE: {replace: {source: $JOINED, replace: '(?i) begin\b.*$', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-macro
language: sql
role: item
symbolType: function
rule:
    kind: ERROR
    pattern: _DECLARATION
    regex: '(?i)^create\s+(or\s+replace\s+)?(temp(orary)?\s+)?macro\s'
transform:
    NAME: {replace: {source: $DECLARATION, replace: '(?is)^create\s+(?:or\s+replace\s+)?(?:temp(?:orary)?\s+)?macro\s+([\w.]+).*$', by: '$1'}}
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-statement
language: sql
role: item
symbolType: operator
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement, alter_table_statement, drop_table_statement, drop_view_statement, drop_index_statement, drop_trigger_statement
    pattern: _DECLARATION
    all:
        - inside: {kind: source_file}
        - any:
            - has: {field: target, pattern: _NAME}
            - has: {field: name, pattern: _NAME}
            - has: {field: from, has: {field: source, has: {kind: qualified_table_name, pattern: _NAME}}}
        - any:
            - has: {field: with, kind: with_clause}
            - not:
                inside:
                    kind: source_file
                    has: {kind: 'create_table_statement, create_view_statement, create_index_statement, create_trigger_statement, create_virtual_table_statement'}
rewriters:
    - id: with-clause
      rule: {kind: with_clause}
      fix: ''
transform:
    WITHOUT_WITH_CLAUSE: rewrite($DECLARATION, rewriters=[with-clause])
    TRIMMED: {replace: {source: $WITHOUT_WITH_CLAUSE, replace: '^\s+', by: ''}}
    JOINED: {replace: {source: $TRIMMED, replace: '\s+', by: ' '}}
    SIGNATURE: {replace: {source: $JOINED, replace: '(?i)^(insert (?:or \w+ )?into [\w."]+(?: ?\([^)]*\))?|replace into [\w."]+(?: ?\([^)]*\))?|update (?:or \w+ )?[\w."]+|delete from [\w."]+|(?:drop|alter) \w+ (?:if exists )?[\w."]+)[\s\S]*$', by: '$1'}}
name: $NAME
signature: $SIGNATURE
---
id: sql-cte
language: sql
role: member
symbolType: variable
parentRuleIds: [sql-table, sql-view, sql-statement]
rule:
    kind: cte_definition
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
rewriters:
    - id: body
      rule: {kind: select_clause, inside: {kind: cte_definition, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    WITHOUT_PARENTHESES: {replace: {source: $HEADER, replace: '\s*\(\s*\)\s*$', by: ''}}
    SIGNATURE: {replace: {source: $WITHOUT_PARENTHESES, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
