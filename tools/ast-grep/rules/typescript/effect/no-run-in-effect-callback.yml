# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-run-in-effect-callback
language: tsx
severity: error
utils:
    run-invocation:
        kind: call_expression
        has:
            field: function
            any:
                - matches: {syntax-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)$'}}}
                - kind: member_expression
                  all:
                    - has: {field: object, matches: effect-effect-module}
                    - has: {field: property, regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)$'}
                - kind: call_expression
                  has:
                    field: function
                    any:
                        - matches: {syntax-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)With$'}}}
                        - kind: member_expression
                          all:
                            - has: {field: object, matches: effect-effect-module}
                            - has: {field: property, regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)With$'}
    effect-combinator:
        kind: call_expression
        any:
            - has:
                field: function
                kind: member_expression
                all:
                    - has:
                        field: object
                        matches:
                            effect-module:
                                name:
                                    regex: |-
                                        (?x)\b(Effect|Stream|Layer|Channel|Sink|Schedule|Ref|SynchronizedRef|SubscriptionRef|TxRef|Cache|ScopedCache
                                        |Pool|RcMap|RcRef|Resource|ScopedRef|PubSub|Queue|Deferred|Fiber|FiberMap|FiberSet|FiberHandle|Request
                                        |RequestResolver|Logger|Metric)$
                    - not:
                        all:
                            - has: {field: object, matches: effect-effect-module}
                            - has: {field: property, regex: '^run'}
            - has: {field: function, kind: call_expression, matches: effect-combinator}
    callback:
        matches: syntax-function-boundary
        any:
            - inside: {kind: arguments}
            - inside: {kind: pair, field: value, inside: {kind: object, inside: {kind: arguments}}}
            - kind: method_definition
              inside: {kind: object, inside: {kind: arguments}}
    run-call:
        kind: call_expression
        all:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: object, pattern: $M, matches: effect-effect-module}
                    - has: {field: property, regex: '^(runSync|runPromise)$'}
            - has: {field: arguments, has: {pattern: $EFFECT}, not: {has: {nthChild: 2}}}
    run-callback:
        kind: arrow_function, function_expression
        not: {has: {regex: '^async$'}}
        has:
            field: body
            any:
                - matches: run-call
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: run-call}}
                  not: {has: {nthChild: 2}}
    fixable-call:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: object, matches: effect-effect-module}}
            - not: {has: {field: type_arguments, kind: type_arguments}}
            - not: {has: {field: arguments, has: {nthChild: 3}}}
            - not: {has: {kind: comment, stopBy: end}}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - matches: effect-combinator
        - has:
            field: arguments
            has:
                stopBy: {not: {kind: 'object, pair'}}
                matches: callback
                has: {stopBy: {matches: syntax-function-boundary}, matches: run-invocation, pattern: $RUN}
rewriters:
    - id: effect-argument
      rule: {matches: run-call}
      fix: $EFFECT
    - id: map-first
      rule:
        pattern: '$M.map($SELF, $H)'
        matches: fixable-call
        has: {field: arguments, has: {nthChild: 2, matches: run-callback}}
      transform: {BODY: 'rewrite($H, rewriters=[effect-argument])'}
      fix: $M.flatMap($SELF, $BODY)
    - id: map-last
      rule:
        pattern: $M.map($H)
        matches: fixable-call
        has: {field: arguments, has: {nthChild: 1, matches: run-callback}}
      transform: {BODY: 'rewrite($H, rewriters=[effect-argument])'}
      fix: $M.flatMap($BODY)
    - id: suspend
      rule:
        pattern: $M.$OWNER($H)
        matches: fixable-call
        has: {field: arguments, has: {nthChild: 1, matches: run-callback}}
      constraints: {OWNER: {regex: '^(sync|promise)$'}}
      transform: {BODY: 'rewrite($H, rewriters=[effect-argument])'}
      fix: $M.suspend($BODY)
transform:
    COMPOSED: rewrite($CALL, rewriters=[map-first, map-last, suspend])
fix: $COMPOSED
message: '`$RUN` starts a separate runtime inside an effect callback'
note: 'Return the effect from its callback, `flatMap` in place of `map` and `suspend` in place of `sync` or `promise`, the enclosing runtime then supplies interruption and context'
labels:
    RUN: {style: primary}
