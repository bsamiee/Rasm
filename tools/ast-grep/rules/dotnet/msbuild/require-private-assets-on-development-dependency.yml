# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-assets-on-development-dependency
language: xml
severity: error
utils:
    development-reference:
        any:
            - all:
                - matches: {msbuild-element: {name: {regex: '^PackageReference$'}}}
                - has:
                    matches: msbuild-tag
                    has:
                        matches:
                            msbuild-attribute:
                                name: {regex: '^Include$'}
                                value: {regex: '^["''][A-Za-z0-9.]*(?i:\.(analyzers?|sourcegenerators?|generators?|codefixes))["'']$|^["''][A-Za-z0-9.]*[a-z0-9](Analyzers?|SourceGenerators?)["'']$'}
            - all:
                - matches: {msbuild-element: {name: {regex: '^ProjectReference$'}}}
                - matches: {msbuild-metadata: {name: {regex: '^OutputItemType$'}, value: {regex: '^["'']?\s*Analyzer\s*["'']?$'}}}
    all-assets:
        any:
            - regex: '(?i)^["'']?\s*all\s*["'']?$'
            - all:
                - regex: '(?i)^["'']?\s*(?:(?:compile|runtime|contentFiles|build|buildMultitargeting|buildTransitive|analyzers|native)\s*;\s*)*(?:compile|runtime|contentFiles|build|buildMultitargeting|buildTransitive|analyzers|native)\s*;?\s*["'']?$'
                - regex: '(?i)(^["'']?|;)\s*compile\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*runtime\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*contentFiles\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*build\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*buildMultitargeting\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*buildTransitive\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*analyzers\s*(;|["'']?$)'
                - regex: '(?i)(^["'']?|;)\s*native\s*(;|["'']?$)'
    private-assets-element:
        matches: {msbuild-element: {name: {regex: '^PrivateAssets$'}}}
    private-assets-all:
        kind: element
        any:
            - all:
                - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^PrivateAssets$'}, value: {matches: all-assets}}}}}
                - not:
                    has:
                        kind: content
                        has:
                            matches: private-assets-element
                            not: {has: {kind: content, matches: all-assets}}
            - has:
                kind: content
                has:
                    matches: private-assets-element
                    nthChild: {position: 1, reverse: true, ofRule: {matches: private-assets-element}}
                    all:
                        - has: {kind: content, matches: all-assets}
                        - not: {has: {kind: STag, has: {kind: Attribute}}}
rule:
    pattern: _REFERENCE
    matches: development-reference
    not: {matches: private-assets-all}
rewriters:
    - id: remove-metadata
      rule:
        any:
            - kind: Attribute
              has: {kind: Name, regex: '^PrivateAssets$'}
              inside: {matches: msbuild-tag, inside: {pattern: _REFERENCE}}
            - matches: private-assets-element
              inside: {kind: content, inside: {pattern: _REFERENCE}}
      fix: ''
    - id: add-metadata
      rule:
        matches: msbuild-tag
        pattern: _TAG
        has: {kind: Name, regex: '^(Package|Project)Reference$'}
      transform:
        STRIPPED: rewrite($TAG, rewriters=[remove-metadata])
        FIXED:
            replace:
                source: $STRIPPED
                replace: '(\s*/?>)$'
                by: ' PrivateAssets="all"$1'
      fix: $FIXED
transform:
    FIXED: rewrite($REFERENCE, rewriters=[add-metadata, remove-metadata])
fix: $FIXED
message: Development dependency flows to every referencing project
note: Set `PrivateAssets="all"` on the reference
