# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-swift
language: swiftlang
severity: error
rule:
    matches: swift-nesting-level
    pattern: $SCOPE
    not: {inside: {kind: ERROR, stopBy: end}}
    inside:
        matches: swift-nesting-level
        stopBy: {matches: swift-function-scope}
        inside:
            matches: swift-nesting-level
            stopBy: {matches: swift-function-scope}
            inside:
                matches: swift-nesting-level
                stopBy: {matches: swift-function-scope}
                not: {inside: {matches: swift-nesting-level, stopBy: {matches: swift-function-scope}}}
message: Control flow reaches a fourth nesting level
note: Rebuild nested decisions or loops with a switch or a collection transform over their inputs
labels:
    SCOPE: {style: primary}
