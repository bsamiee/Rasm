# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-attributes-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
rule:
    any:
        - kind: member_access_expression
          all:
            - has: {field: name, regex: '^CreateDefaultAttributes$'}
            - has: {field: expression, pattern: $DOC}
        - kind: conditional_access_expression
          all:
            - has: {field: condition, pattern: $DOC}
            - has: {kind: member_binding_expression, has: {field: name, regex: '^CreateDefaultAttributes$'}}
    inside: {kind: invocation_expression, field: function}
message: '`$DOC.CreateDefaultAttributes` builds default object attributes by hand'
note: Pass the method group `<doc>.CreateDefaultAttributes` as the defaults of `TableOps.WithAttributes(<defaults>, <attributes>, <body>)` with `None` for each defaulted object, and `WithAttributes` disposes each attributes object it creates after `<body>`
