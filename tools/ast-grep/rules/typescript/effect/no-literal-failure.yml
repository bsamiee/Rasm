# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-literal-failure
language: tsx
severity: error
ignores: ['**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
utils:
    untagged-error:
        any:
            - kind: string, number, true, false, null, undefined, regex
            - kind: unary_expression
              regex: '^[+-]'
              has: {field: argument, kind: number}
            - kind: template_string
            - kind: as_expression, satisfies_expression, parenthesized_expression
              has: {matches: untagged-error}
            - kind: new_expression
              has: {field: constructor, matches: syntax-global-reference, regex: '^(globalThis\.)?(Error|TypeError|RangeError|SyntaxError|ReferenceError|EvalError|URIError|AggregateError)$'}
    untagged-thunk:
        kind: arrow_function, function_expression, method_definition
        has:
            field: body
            any:
                - matches: untagged-error
                  pattern: $ERROR
                - kind: statement_block
                  has:
                    kind: return_statement
                    has: {matches: untagged-error, pattern: $ERROR}
                    stopBy: {matches: syntax-function-boundary}
    strict-constructor:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^fail$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Micro|STM|Stream|Layer|Channel|Sink|Exit|Cause|Deferred|TDeferred|Request|Fiber|Take))?$'}, exported: {regex: '^(Effect|Micro|STM|Stream|Layer|Channel|Sink|Exit|Cause|Deferred|TDeferred|Request|Fiber|Take)$'}}}}
            - all:
                - has: {field: property, regex: '^left$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Either)?$'}, exported: {regex: '^Either$'}}}}
    lazy-constructor:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^failSync$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Micro|STM|Stream|Layer|Channel|Sink|Deferred))?$'}, exported: {regex: '^(Effect|Micro|STM|Stream|Layer|Channel|Sink|Deferred)$'}}}}
            - all:
                - has: {field: property, regex: '^orElseFail$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|STM|Stream))?$'}, exported: {regex: '^(Effect|STM|Stream)$'}}}}
            - all:
                - has: {field: property, regex: '^mapError$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Micro|STM|Stream|Layer|Channel|Sink|Exit))?$'}, exported: {regex: '^(Effect|Micro|STM|Stream|Layer|Channel|Sink|Exit)$'}}}}
            - all:
                - has: {field: property, regex: '^(mapLeft|fromOption)$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Either)?$'}, exported: {regex: '^Either$'}}}}
    filter-constructor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^filterOrFail$'}
            - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Micro|STM))?$'}, exported: {regex: '^(Effect|Micro|STM)$'}}}}
    options-callee:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^(try|tryPromise|tryMap|tryMapPromise)$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Effect)?$'}, exported: {regex: '^Effect$'}}}}
            - all:
                - has: {field: property, regex: '^(try|tryPromise)$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Micro)?$'}, exported: {regex: '^Micro$'}}}}
            - all:
                - has: {field: property, regex: '^try$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(STM|Either))?$'}, exported: {regex: '^(STM|Either)$'}}}}
            - all:
                - has: {field: property, regex: '^mapBoth$'}
                - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|STM|Exit|Stream|Either))?$'}, exported: {regex: '^(Effect|STM|Exit|Stream|Either)$'}}}}
    failure-member:
        any:
            - kind: pair
              all:
                - has: {field: key, regex: '^(catch|onFailure|onLeft)$'}
                - has: {field: value, matches: untagged-thunk}
            - kind: method_definition
              has: {field: name, regex: '^(catch|onFailure|onLeft)$'}
              matches: untagged-thunk
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: arguments, has: {matches: untagged-error, pattern: $ERROR}}
            - has: {field: function, pattern: $FAIL, matches: strict-constructor}
        - all:
            - has: {field: arguments, has: {matches: untagged-thunk}}
            - has: {field: function, pattern: $FAIL, matches: lazy-constructor}
        - all:
            - has:
                field: arguments
                all:
                    - has: {matches: untagged-thunk, nthChild: {position: 1, reverse: true}}
                    - any:
                        - has: {nthChild: 3}
                        - has: {nthChild: 1, kind: 'arrow_function, function_expression'}
            - has: {field: function, pattern: $FAIL, matches: filter-constructor}
        - all:
            - has: {field: arguments, has: {kind: object, has: {matches: failure-member}}}
            - has: {field: function, pattern: $FAIL, matches: options-callee}
message: '`$FAIL` fails with `$ERROR`, a value with no `_tag`'
note: 'Fail with a `Data.TaggedError` instance, `Effect.catchTag` recovers it by `_tag`'
