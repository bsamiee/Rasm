# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-mcp"
version.workspace    = true
categories           = ["network-programming", "web-programming::http-server"]
edition.workspace    = true
keywords             = ["mcp", "modelcontextprotocol", "rmcp", "streamable-http", "oauth"]
license.workspace    = true
repository.workspace = true
description          = "MCP server foundation over Streamable HTTP: routers, resources, validation, telemetry, authorization"

# --- [LIB] ------------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-util                         = { workspace = true }
tokio-stream                       = { workspace = true }
nonempty-collections               = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
serde                              = { workspace = true }
serde_path_to_error                = { workspace = true }
serde_json                         = { workspace = true }
jsonschema                         = { workspace = true }
bounded-integer                    = { workspace = true }
percent-encoding                   = { workspace = true }
url                                = { workspace = true }
axum                               = { workspace = true }
matchit                            = { workspace = true }
tower                              = { workspace = true }
tower-oauth2-resource-server       = { workspace = true }
rmcp                               = { workspace = true }
opentelemetry                      = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
tracing-subscriber                 = { workspace = true }
json-subscriber                    = { workspace = true }
opentelemetry-appender-tracing     = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
tracing-opentelemetry              = { workspace = true }
clap                               = { workspace = true }
