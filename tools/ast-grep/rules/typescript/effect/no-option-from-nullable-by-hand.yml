# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-option-from-nullable-by-hand
language: tsx
severity: error
utils:
    nullable-schema:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^(NullOr|UndefinedOr|NullishOr)$'}}}}
    nullable-decode:
        kind: call_expression
        any:
            - has: {field: arguments, has: {matches: nullable-schema}}
            - has: {field: function, kind: call_expression, has: {field: arguments, has: {matches: nullable-schema}}}
    lift:
        kind: member_expression
        pattern: $OPTION.$FROM
        matches: {effect-module-member: {module: {regex: '\bOption$'}, member: {regex: '^from(Null|Undefined|Nullish)Or$'}}}
    lifting:
        any:
            - matches: lift
            - kind: arrow_function
              all:
                - any:
                    - has: {field: parameter, kind: identifier, pattern: $VALUE}
                    - has: {field: parameters, all: [{has: {nthChild: 1, kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $VALUE}}}, {not: {has: {nthChild: 2}}}]}
                - has:
                    field: body
                    kind: call_expression
                    all:
                        - has: {field: arguments, all: [{has: {nthChild: 1, kind: identifier, pattern: $VALUE}}, {not: {has: {nthChild: 2}}}]}
                        - has: {field: function, matches: lift}
    map:
        kind: member_expression
        matches: {effect-module-member: {module: {regex: '\b(Effect|Result)$'}, member: {regex: '^map$'}}}
    mapped-lift:
        kind: call_expression
        all:
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: lifting}}, {not: {has: {nthChild: 2}}}]}
            - has: {field: function, matches: map}
rule:
    kind: call_expression
    pattern: $HAND
    any:
        - all:
            - has: {field: function, matches: map}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: nullable-decode}}, {has: {nthChild: 2, matches: lifting}}]}
        - all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: nullable-decode}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: mapped-lift}}
        - all:
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: nullable-decode}}, {has: {nthChild: 2, matches: mapped-lift}}]}
            - has: {field: function, matches: effect-pipe-function}
        - all:
            - has: {field: function, matches: lift}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: nullable-decode}, {kind: yield_expression, has: {matches: nullable-decode}}]}}
transform:
    CODEC: {replace: {source: $FROM, replace: '^from', by: OptionFrom}}
message: '`$OPTION.$FROM` over a decoded nullable schema restates `Schema.$CODEC`'
note: 'Decode `Schema.OptionFrom<NullOr|UndefinedOr|NullishOr>(<schema>)` and remove the `Option` conversion'
