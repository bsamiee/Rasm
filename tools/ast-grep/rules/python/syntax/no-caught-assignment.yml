# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-caught-assignment
language: python
severity: error
utils:
    rejection:
        matches: {python-builtin-name: {name: {regex: '^(TypeError|ValueError|AttributeError|KeyError|IndexError|LookupError|OverflowError|RuntimeError|Exception|BaseException)$'}}}
    caught-type:
        any:
            - matches: rejection
            - kind: 'tuple, parenthesized_expression'
              has: {matches: caught-type}
            - kind: as_pattern
              has: {nthChild: 1, matches: caught-type}
    written-value:
        any:
            - kind: 'identifier, integer, float, true, false, none'
            - matches: python-plain-string
            - kind: 'attribute, unary_operator, tuple, list'
              not: {has: {stopBy: end, kind: 'call, subscript, interpolation, binary_operator, await'}}
    held-path:
        kind: 'identifier, attribute'
        not: {has: {stopBy: end, kind: 'call, subscript'}}
    target:
        any:
            - kind: attribute
              has: {field: object, matches: held-path}
            - kind: subscript
              all:
                - has: {field: value, matches: held-path}
                - has: {field: subscript, matches: written-value}
    member-write:
        kind: expression_statement
        any:
            - has:
                kind: assignment
                all:
                    - has: {field: left, matches: target}
                    - has: {field: right, matches: written-value}
            - has:
                kind: call
                all:
                    - has: {field: function, matches: {python-builtin-name: {name: {regex: '^setattr$'}}}}
                    - has: {field: arguments, has: {nthChild: 3, matches: written-value}}
    exit:
        any:
            - kind: 'break_statement, continue_statement, pass_statement, comment'
            - kind: return_statement
              not: {has: {pattern: $_, not: {matches: written-value}}}
    write-block:
        kind: block
        all:
            - has: {matches: member-write, pattern: $WRITE}
            - not: {has: {not: {any: [{matches: member-write}, {matches: exit}]}}}
    swallowing-handler:
        kind: except_clause
        all:
            - any:
                - has: {field: value, matches: caught-type}
                - not: {has: {field: value, pattern: $_}}
            - not: {has: {kind: block, has: {stopBy: end, kind: raise_statement}}}
            - not:
                all:
                    - has: {field: value, kind: as_pattern, has: {field: alias, has: {kind: identifier, pattern: $ERROR}}}
                    - has: {kind: block, has: {stopBy: end, kind: identifier, pattern: $ERROR}}
rule:
    kind: try_statement
    all:
        - has: {field: body, matches: write-block}
        - has: {matches: swallowing-handler}
message: '`$WRITE` catches its own error to test whether its target accepts the value'
note: 'Use the target owner''s declaration to check the value before writing, `bpy.types.UILayout.enum_item_name(<owner>, <name>, <value>)` for a Blender enum, `bl_rna.properties[<name>]` (`hard_min`, `hard_max`, `is_readonly`) for a Blender range or read-only member, and `<value> in <enum>.__members__` for an enum name, a checked write states the value it keeps'
