# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-stl-text
language: rust
rule:
    kind: string_literal
    regex: '^b?"\s*(facet normal|outer loop|endfacet|endloop|endsolid)\b'
    not:
        inside:
            kind: macro_invocation
            stopBy: {kind: 'function_item, closure_expression'}
            has: {field: macro, regex: '^((std|core|alloc)::)?(write|writeln|format|format_args|print|println|eprint|eprintln)$'}
