# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-normalized-property
language: xml
severity: error
rule:
    matches:
        msbuild-property-value:
            name: {regex: '^[A-Za-z]'}
            text:
                regex: "^\\s*\\$\\((\\[MSBuild\\]::(NormalizeDirectory|NormalizePath|EnsureTrailingSlash)|\\[System\\.IO\\.Path\\]::(GetFullPath|TrimEndingDirectorySeparator))\\(\\s*'?\\$\\([A-Za-z_][A-Za-z0-9_]*\\)'?\\s*\\)\\)\\s*$"
    not:
        inside:
            kind: element
            stopBy: end
            has:
                matches: msbuild-tag
                has: {matches: {msbuild-attribute: {name: {regex: '^TreatAsLocalProperty$'}, value: {regex: '[^"''\s]'}}}}
message: 'The public property normalizes itself, the form of a _ prefixed private property holding the normalized value'
note: 'A global property from -p or an MSBuild task skips the assignment'
