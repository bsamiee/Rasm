# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rustc-trait-of-assoc-test
language: rust
rule:
    kind: call_expression
    any:
        - pattern: $_TCX.trait_of_assoc($_ITEM).is_some_and(|$_T| $BODY)
        - pattern: $_SRC.and_then(|$_M| $_TCX.trait_of_assoc($_M)).is_some_and(|$_T| $BODY)
constraints:
    BODY:
        matches: item-test
utils:
    item-test:
        any:
            - pattern: $_T.is_diag_item($$$)
            - pattern: $_T.is_lang_item($$$)
            - pattern: $_T.opt_diag_name($$$)
            - pattern: $_TCX.is_diagnostic_item($_NAME, $_T)
            - pattern: $_TCX.is_lang_item($_T, $_ITEM)
            - pattern: $_TCX.get_diagnostic_name($_T)
            - kind: binary_expression
              all:
                - has: {field: left, matches: item-test}
                - has: {field: right, matches: item-test}
