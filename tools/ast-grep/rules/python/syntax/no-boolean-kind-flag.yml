# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-boolean-kind-flag
language: python
severity: error
utils:
    bool-literal:
        kind: case_pattern
        any:
            - has: {kind: 'true, false'}
            - has: {kind: union_pattern, not: {has: {pattern: $_, not: {kind: 'true, false'}}}}
            - has: {kind: tuple_pattern, not: {has: {nthChild: 2}}, has: {matches: bool-literal}}
    bool-element:
        kind: case_pattern
        any:
            - matches: bool-literal
            - regex: '^_$'
    bool-sequence:
        all:
            - has: {kind: case_pattern, nthChild: 2}
            - has: {matches: bool-literal}
            - not: {has: {kind: case_pattern, not: {matches: bool-element}}}
    bool-tuple:
        kind: case_clause
        any:
            - matches: bool-sequence
            - has: {kind: case_pattern, has: {kind: 'tuple_pattern, list_pattern', matches: bool-sequence}}
rule:
    kind: match_statement
    has: {field: body, has: {matches: bool-tuple}}
message: 'Match selects on a tuple of booleans'
note: 'Select by an `if` chain over the tests, or by an enum member per reachable combination'
