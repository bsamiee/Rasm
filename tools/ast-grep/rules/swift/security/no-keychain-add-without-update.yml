# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-keychain-add-without-update
language: swift
severity: error
rule:
    pattern: $ARGS
    any:
        - matches: {swift-security-arguments: {subcommand: {regex: '^"add-(generic|internet)-password"$'}}}
          not: {has: {kind: line_string_literal, regex: '^"-U"$'}}
        - kind: line_string_literal
          regex: '^"add-(generic|internet)-password '
          not: {regex: '\s-U(\s|\\n|"$)'}
transform:
    LISTED: {replace: {source: $ARGS, replace: '"(add-(?:generic|internet)-password)"', by: '"$1", "-U"'}}
    UPDATED: {replace: {source: $LISTED, replace: '^"(add-(?:generic|internet)-password) ', by: '"$1 -U '}}
fix: $UPDATED
message: '`$ARGS` adds a keychain item without `-U` and exits 45 with errSecDuplicateItem once the item exists'
note: 'Pass `-U` to update an existing item in place with its ACL and partition list'
