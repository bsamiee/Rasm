# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-run
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    tried-shape:
        any:
            - pattern: {context: 'class C { object F() => $_EFFECT.Try(); }', selector: invocation_expression, strictness: cst}
            - pattern: {context: 'class C { object F() => $_EFFECT.Try().As(); }', selector: invocation_expression, strictness: cst}
            - kind: parenthesized_expression
              has: {matches: tried-shape}
    tried-local:
        kind: identifier
        pattern: $LOCAL
        inside:
            stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, anonymous_method_expression, accessor_declaration, constructor_declaration, operator_declaration'}
            kind: method_declaration, local_function_statement, lambda_expression, anonymous_method_expression, accessor_declaration, constructor_declaration, operator_declaration
            has:
                stopBy: {kind: 'local_function_statement, lambda_expression, anonymous_method_expression'}
                kind: variable_declarator
                all:
                    - has: {field: name, pattern: $LOCAL}
                    - has: {nthChild: 2, matches: tried-shape}
    local-run:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^runFin$'}
                - has: {field: expression, matches: tried-local}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^Run$'}}, {has: {field: expression, matches: tried-local}}]}
                - matches: csharp-bare-call
    direct:
        any:
            - matches: {languageext-tried-run: {effect: {pattern: $EFFECT}}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^As$'}}, {has: {field: expression, matches: direct}}]}
                - matches: csharp-bare-call
            - kind: parenthesized_expression
              has: {matches: direct}
    kept:
        any:
            - matches: local-run
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^As$'}}, {has: {field: expression, matches: kept}}]}
                - matches: csharp-bare-call
            - kind: parenthesized_expression
              has: {matches: kept}
rule:
    kind: invocation_expression
    all:
        - pattern: {context: 'class C { object F() => $IO.$RUN($$$ENV); }', selector: invocation_expression, strictness: cst}
        - any:
            - all:
                - has: {field: function, has: {field: expression, matches: direct}}
                - has: {field: function, has: {field: name, pattern: $DIRECT}}
            - all:
                - has: {field: function, has: {field: expression, matches: kept}}
                - has: {field: function, has: {field: name, pattern: $KEPT}}
                - has: {field: function, has: {field: expression, pattern: $KEPT_IO}}
constraints:
    RUN: {regex: '^Run(Async)?$'}
transform:
    SAFE: {replace: {source: $DIRECT, replace: '^Run', by: 'RunSafe'}}
    RECEIVER: {replace: {source: $EFFECT, replace: '(?s)^(.+)$', by: '${1}.'}}
    KEPT_RECEIVER: {replace: {source: $KEPT_IO, replace: '(?s)^(.+)$', by: '${1}.'}}
fix: $RECEIVER$SAFE$KEPT_RECEIVER$KEPT($$$ENV)
message: '`$IO.$RUN` spells `RunSafe` through `Try` and `Run`'
note: 'Call `RunSafe` or `RunSafeAsync` on the effect with same environment argument'
