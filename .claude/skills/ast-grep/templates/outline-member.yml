id: <member-extractor-id>
language: <language>
role: member
parentRuleIds: [<item-extractor-id>, <sibling-item-extractor-id>]
symbolType: <lsp-symbol-kind>
rule:
    kind: <member-kind>
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside:
        kind: <container-kind>
        inside: {kind: <item-kind>}
transform:
    BODYLESS: {replace: {source: $DECLARATION, replace: '\s*(\{[\s\S]*$|=>[\s\S]*$|;\s*$)', by: ''}}
    LINE: {replace: {source: $BODYLESS, replace: '\s*\n\s*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[\s;]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic: {not: {has: {kind: <visibility-kind>, regex: '<private-marker>'}}}
