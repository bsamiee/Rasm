# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-promise
language: tsx
severity: error
# The plugin loader refuses the effect import, and a spec drives a promise-based host API (a FastCheck scheduler) as its boundary
ignores: ['.claude/plugins/**', '**/*.spec.ts']
rule:
    any:
        # The constructor over an executor
        - kind: new_expression
          has: {field: constructor, pattern: $NAME, regex: '^(globalThis\.)?Promise$'}
        # Every static, the combinators and the constructors of a settled promise
        - kind: call_expression
          has: {field: function, pattern: $NAME, regex: '^(globalThis\.)?Promise\.(all|allSettled|any|race|resolve|reject|withResolvers|try)$'}
message: '`$NAME` builds a promise where the effect is the composed value'
note: >-
    Compose effects, `Effect.all(effects, { concurrency })`, `Effect.race`, `Effect.succeed`, `Effect.fail`,
    `Effect.async(resume)` for a callback source, and `Deferred` for a resolver another fiber completes
