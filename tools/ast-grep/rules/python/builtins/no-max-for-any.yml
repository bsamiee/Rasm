# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-max-for-any
language: python
severity: error
utils:
    plain-body: {has: {field: body, not: {kind: 'conditional_expression, boolean_operator, lambda, comparison_operator, named_expression, not_operator'}}}
    extremum-name:
        matches: {python-builtin-name: {name: {regex: '^(max|min)$'}}}
    extremum:
        kind: call
        all:
            - has: {field: function, matches: extremum-name}
            - has:
                field: arguments
                any:
                    - kind: generator_expression
                      matches: plain-body
                    - kind: argument_list
                      has:
                        nthChild: 1
                        any:
                            - kind: list_comprehension
                              matches: plain-body
                            - not: {kind: 'list_comprehension, set_comprehension, dictionary_comprehension, generator_expression, keyword_argument, list_splat, dictionary_splat'}
                      not: {has: {nthChild: 2}}
    evaluated:
        any:
            - kind: 'call, await, named_expression, yield'
            - has: {kind: 'call, await, named_expression, yield', stopBy: end}
    nonempty-literal:
        kind: 'list, tuple, set'
        has: {pattern: $_, not: {kind: 'list_splat, comment'}}
    fixable-extremum:
        has:
            field: arguments
            any: [{kind: generator_expression}, {has: {kind: list_comprehension}}]
        not:
            any:
                - has: {stopBy: end, kind: for_in_clause, not: {has: {field: right, matches: nonempty-literal}}}
                - has: {stopBy: end, kind: if_clause}
    quantifier-shadowed:
        inside:
            kind: module, function_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
            stopBy: end
            has:
                stopBy: {kind: 'function_definition, class_definition, lambda, list_comprehension, set_comprehension, dictionary_comprehension, generator_expression'}
                matches: {python-binding: {name: {regex: '^(any|all)$'}}}
rule:
    kind: comparison_operator
    pattern: $CMP
    all:
        - not: {has: {nthChild: 3}}
        - has: {field: operators, pattern: $$OP}
        - any:
            - all:
                - has: {nthChild: 1, matches: extremum, pattern: $LEFT}
                - has: {nthChild: 2, pattern: $BOUND}
            - all:
                - has: {nthChild: 2, matches: extremum, pattern: $RIGHT}
                - has: {nthChild: 1, pattern: $BOUND}
        - any:
            - pattern: $FIXABLE
              not: {matches: quantifier-shadowed}
              any:
                - has: {nthChild: 1, matches: fixable-extremum, has: {stopBy: end, kind: 'generator_expression, list_comprehension', pattern: $LEFT_GEN}}
                - has: {nthChild: 2, matches: fixable-extremum, has: {stopBy: end, kind: 'generator_expression, list_comprehension', pattern: $RIGHT_GEN}}
            - pattern: $KEPT
constraints:
    BOUND: {not: {any: [{regex: '[<>]'}, {matches: evaluated}]}}
    OP: {regex: '^(<|<=|>|>=)$'}
rewriters:
    - id: compare-left
      rule: {pattern: $BODY, inside: {kind: 'generator_expression, list_comprehension', field: body}}
      fix: $BODY $OP $BOUND
    - id: compare-right
      rule: {pattern: $BODY, inside: {kind: 'generator_expression, list_comprehension', field: body}}
      fix: $BOUND $OP $BODY
    - id: any-quantifier
      rule:
        kind: comparison_operator
        any:
            - all: [{has: {nthChild: 1, kind: call, has: {field: function, regex: '^max$'}}}, {has: {field: operators, regex: '^>=?$'}}]
            - all: [{has: {nthChild: 1, kind: call, has: {field: function, regex: '^min$'}}}, {has: {field: operators, regex: '^<=?$'}}]
            - all: [{has: {nthChild: 2, kind: call, has: {field: function, regex: '^max$'}}}, {has: {field: operators, regex: '^<=?$'}}]
            - all: [{has: {nthChild: 2, kind: call, has: {field: function, regex: '^min$'}}}, {has: {field: operators, regex: '^>=?$'}}]
      fix: any
    - id: all-quantifier
      rule: {kind: comparison_operator}
      fix: all
transform:
    COMPARED_LEFT: rewrite($LEFT_GEN, rewriters=[compare-left])
    COMPARED_RIGHT: rewrite($RIGHT_GEN, rewriters=[compare-right])
    CLAUSES_LEFT: {replace: {source: $COMPARED_LEFT, replace: '(?s)^\[(.*)\]$', by: '($1)'}}
    CLAUSES_RIGHT: {replace: {source: $COMPARED_RIGHT, replace: '(?s)^\[(.*)\]$', by: '($1)'}}
    QUANTIFIER: rewrite($FIXABLE, rewriters=[any-quantifier, all-quantifier])
fix: $QUANTIFIER$CLAUSES_LEFT$CLAUSES_RIGHT$KEPT
message: '`$CMP` compares an extremum to a bound'
note: 'Use `any` or `all` over the comparison per element'
