# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-split-outcome
language: rust
severity: error
utils:
    flag-tuple:
        kind: tuple_type
        has: {kind: primitive_type, regex: '^bool$'}
rule:
    any:
        - kind: 'function_item, function_signature_item'
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: return_type, any: [{matches: flag-tuple}, {has: {stopBy: end, matches: flag-tuple}}]}
            - not: {matches: rust-fixed-signature}
        - kind: field_declaration
          all:
            - has: {field: name, pattern: $NAME}
            - has: {field: type, any: [{matches: flag-tuple}, {has: {stopBy: end, matches: flag-tuple}}]}
message: '`$NAME` splits one outcome into a flag beside its value'
note: 'Hold one `Result<<value>, <error>>`, `Option<<value>>`, or an enum with a variant per outcome and match its case, a flag held beside a value allows a success with no value. The `split_outcome` dylint owns struct fields: a failure beside a success, and a `bool` restating whether an `Option` holds a value'
