id: require-strict-mode
valid:
    - | # Strict mode at file level
      #!/usr/bin/env bash
      set -euo pipefail
      echo "hello"
    - | # Split across lines
      #!/usr/bin/env bash
      set -eu
      set -o pipefail
      echo "hello"
    - | # Long options
      #!/usr/bin/env bash
      set -o errexit -o nounset -o pipefail
      echo "hello"
invalid:
    - | # No strict mode
      #!/usr/bin/env bash
      echo "hello"
    - | # Errexit alone
      #!/usr/bin/env bash
      set -e
      echo "hello"
    - | # Nounset and pipefail without errexit
      #!/usr/bin/env bash
      set -uo pipefail
      echo "hello"
    - | # Errexit and pipefail without nounset
      #!/usr/bin/env bash
      set -eo pipefail
      echo "hello"
    - | # Errexit and nounset without pipefail
      #!/usr/bin/env bash
      set -eu
      echo "hello"
    - |- # Strict mode buried in a function is not file-level strictness
      #!/usr/bin/env bash
      run() {
        set -euo pipefail
        echo "hello"
      }
      run
