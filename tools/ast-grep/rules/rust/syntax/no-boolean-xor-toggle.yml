# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-boolean-xor-toggle
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $A.fetch_xor(true, $O)
fix: $A.fetch_not($O)
message: '`$A` toggles its flag through `fetch_xor(true, ..)`'
note: 'Call `<atomic bool>.fetch_not(<ordering>)`, `fetch_not` names the negation and returns the previous value like `fetch_xor`'
