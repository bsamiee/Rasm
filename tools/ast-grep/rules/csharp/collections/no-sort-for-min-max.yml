# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sort-for-min-max
language: csharp
severity: error
utils:
    sorted:
        kind: invocation_expression
        any:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(OrderBy|OrderByDescending|Order|OrderDescending)$', pattern: $SORT}}
            - has: {field: function, kind: generic_name, has: {kind: identifier, regex: '^Sort$', pattern: $SORT}}
    sorted-seq:
        any:
            - matches: sorted
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(ToSeq|AsIterable)$'}}, {has: {field: expression, matches: sorted}}]}
                - has: {field: arguments, not: {has: {kind: argument}}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: identifier, regex: '^toSeq$'}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, has: {matches: sorted}}}, {not: {has: {kind: argument, nthChild: 2}}}]}
rule:
    any:
        - kind: invocation_expression
          all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(First|FirstOrDefault|Last|LastOrDefault)$', pattern: $END}}, {has: {field: expression, matches: sorted-seq}}]}
            - has: {field: arguments, not: {has: {kind: argument}}}
        - kind: member_access_expression
          all:
            - has: {field: name, regex: '^(Head|Last)$', pattern: $END}
            - has: {field: expression, matches: sorted-seq}
            - not: {inside: {kind: invocation_expression, field: function}}
message: '`$SORT` sorts the whole sequence for `$END` to read one end'
note: 'Call `MinBy(<key>)` or `MaxBy(<key>)` with its comparer in place of a keyed sort, `Min()` or `Max()` in place of `Order()` or `OrderDescending()`'
