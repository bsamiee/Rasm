# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    rendered:
        any:
            - kind: template_string
              has: {kind: template_substitution, nthChild: {position: 2, ofRule: {kind: template_substitution}}}
            - kind: call_expression
              has: {field: function, regex: '^((globalThis|window|self)\.)?JSON\.stringify$', matches: typescript-global-reference}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: object, kind: array}}, {has: {field: property, regex: '^join$'}}]}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\+$'}
                - has: {field: right, kind: &operand 'identifier, member_expression, call_expression, subscript_expression'}
                - has: {field: left, kind: binary_expression, has: {stopBy: {not: {kind: binary_expression}}, kind: *operand}}
                - has: {stopBy: {not: {kind: binary_expression}}, kind: 'string, template_string'}
            - matches: typescript-expression-wrapper
              has: {matches: rendered}
    hashed-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)(Mutable)?Hash(Map|Set)$'}}}
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(get|set|has|delete|getOrInsert|getOrInsertComputed|add)$'}}
            - has: {field: arguments, has: {nthChild: 1, matches: rendered, pattern: $KEY}}
            - has: {field: function, has: {field: object, pattern: $COLLECTION, matches: {typescript-collection-receiver: {collection: {regex: '^(Readonly)?(Map|Set)$'}}}}}
        - all:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^(get|set|has|remove|add|modify|modifyAt)$'}
                    - has: {field: object, pattern: $COLLECTION, matches: hashed-module}
            - any:
                - has: {field: arguments, has: {nthChild: 1, matches: rendered, pattern: $KEY}}
                - all:
                    - has: {field: arguments, has: {nthChild: 2, matches: rendered, pattern: $KEY}}
                    - not: {all: [{has: {field: function, has: {field: property, regex: '^(set|modify|modifyAt)$'}}}, {not: {has: {field: arguments, has: {nthChild: 3}}}}]}
        - all:
            - has: {field: function, pattern: $COLLECTION, matches: {effect-module-member: {module: {regex: '(?-u:\b)(Array|Iterable)$'}, member: {regex: '^groupBy$'}}}}
            - has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, kind: arrow_function, has: {field: body, matches: rendered, pattern: $KEY}}}
message: '`$KEY` renders a composite key of `$COLLECTION` to text'
note: 'Key a `HashMap` or `HashSet` by `[<a>, <b>]` or `{ ... }`, or nest one `Map` or `Array.groupBy` per component'
