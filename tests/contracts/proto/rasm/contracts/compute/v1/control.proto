syntax = "proto3";

package rasm.contracts.compute.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

// Rank ascends with severity; each level retains strictly fewer faculties than the one before it.
enum DegradationLevel {
  DEGRADATION_LEVEL_UNSPECIFIED = 0;
  DEGRADATION_LEVEL_FULL = 1;
  DEGRADATION_LEVEL_REDUCED_REMOTE = 2;
  DEGRADATION_LEVEL_LOCAL_ONLY = 3;
  DEGRADATION_LEVEL_READ_ONLY = 4;
  DEGRADATION_LEVEL_SUSPENDED = 5;
}

// Band values are the drain order; a higher band drains after a lower one.
enum DrainBand {
  DRAIN_BAND_UNSPECIFIED = 0;
  DRAIN_BAND_INTERACTION = 100;
  DRAIN_BAND_COMPUTE = 200;
  DRAIN_BAND_STORES = 300;
  DRAIN_BAND_TELEMETRY = 400;
}

enum DeadlineOutcome {
  DEADLINE_OUTCOME_UNSPECIFIED = 0;
  DEADLINE_OUTCOME_MET = 1;
  DEADLINE_OUTCOME_ESCALATED = 2;
  DEADLINE_OUTCOME_FORCED = 3;
}

enum RuntimePhase {
  RUNTIME_PHASE_UNSPECIFIED = 0;
  RUNTIME_PHASE_BOOT = 1;
  RUNTIME_PHASE_READY = 2;
  RUNTIME_PHASE_RUNNING = 3;
  RUNTIME_PHASE_DEGRADED = 4;
  RUNTIME_PHASE_DRAINING = 5;
  RUNTIME_PHASE_UNLOADED = 6;
  RUNTIME_PHASE_FAULTED = 7;
  RUNTIME_PHASE_SUPPORT_CAPTURE = 8;
}

// --- [DEGRADATION] ------------------------------------------------------------------------

message SetDegradationRequest {
  DegradationLevel level = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}

// The resolved level alone — the one column a caller reads back.
message SetDegradationResponse {
  DegradationLevel level = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// --- [DRAIN] ------------------------------------------------------------------------------

// `cooperative` is the caller's REMAINING allotment, never the budget it started with; nested seams inherit the
// minimum.
message DrainRuntimeRequest {
  google.protobuf.Duration cooperative = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {}
  ];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}

message DrainStep {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  DrainBand band = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Duration allotted = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  google.protobuf.Duration consumed = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  DeadlineOutcome outcome = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// A straggling step is evidence the caller reads, never a timeout it infers.
message DrainRuntimeResponse {
  repeated DrainStep steps = 1 [(buf.validate.field).repeated.max_items = 65536];
  RuntimePhase final_phase = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp at = 3 [(buf.validate.field).required = true];
  google.protobuf.Duration elapsed = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {}
  ];
  bytes correlation = 5 [(buf.validate.field).bytes.len = 16];
}

// --- [SERVICES] ---------------------------------------------------------------------------

service ControlService {
  rpc SetDegradation(SetDegradationRequest) returns (SetDegradationResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc DrainRuntime(DrainRuntimeRequest) returns (DrainRuntimeResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
