# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-divider-over-imports-csharp
language: csharp
severity: error
rule:
    kind: comment
    regex: '^// --- \[IMPORTS\]'
    any:
        - precedes: {pattern: $NEXT}
        - pattern: $_
message: Divider `[IMPORTS]` names no section
note: Delete the divider, `using` directives precede every section divider
fix:
    template: $NEXT
    expandEnd: {pattern: $NEXT}
