# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-backslash-path
language: xml
severity: error
rule:
    pattern: _VALUE
    matches: msbuild-path-value
    regex: '[A-Za-z0-9_.):*]\\([A-Za-z0-9_.$*(@%]|\s*["'']?\s*$)'
transform:
    SLASHED: {replace: {source: $VALUE, replace: '([A-Za-z0-9_.):*])\\([A-Za-z0-9_.$*(@%])', by: '$1/$2'}}
    SLASHED_AGAIN: {replace: {source: $SLASHED, replace: '([A-Za-z0-9_.):*])\\([A-Za-z0-9_.$*(@%])', by: '$1/$2'}}
    TRAILED: {replace: {source: $SLASHED_AGAIN, replace: '([A-Za-z0-9_.):*])\\(\s*["'']?\s*)$', by: '$1/$2'}}
fix: $TRAILED
message: Path holds a backslash separator, MSBuild on Unix converts it in a property whose first segment exists on disk and in an item a task receives alone
note: Write `/`, MSBuild reads it on every operating system
