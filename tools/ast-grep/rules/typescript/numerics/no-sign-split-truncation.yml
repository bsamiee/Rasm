# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sign-split-truncation
language: tsx
severity: error
utils:
    zero:
        kind: number
        regex: '^0(\.0*)?$'
    below-zero:
        any:
            - kind: binary_expression
              any:
                - all: [{has: {field: operator, regex: '^<=?$'}}, {has: {field: left, pattern: $N}}, {has: {field: right, matches: zero}}]
                - all: [{has: {field: operator, regex: '^>=?$'}}, {has: {field: left, matches: zero}}, {has: {field: right, pattern: $N}}]
            - kind: parenthesized_expression
              has: {matches: below-zero}
    above-zero:
        any:
            - kind: binary_expression
              any:
                - all: [{has: {field: operator, regex: '^>=?$'}}, {has: {field: left, pattern: $N}}, {has: {field: right, matches: zero}}]
                - all: [{has: {field: operator, regex: '^<=?$'}}, {has: {field: left, matches: zero}}, {has: {field: right, pattern: $N}}]
            - kind: parenthesized_expression
              has: {matches: above-zero}
    math-ceil:
        kind: member_expression
        regex: '^((globalThis|window|self)\.)?Math\.ceil$'
        matches: typescript-global-reference
        has: {field: object, pattern: $MATH}
    math-floor:
        kind: member_expression
        regex: '^((globalThis|window|self)\.)?Math\.floor$'
        matches: typescript-global-reference
        has: {field: object, pattern: $MATH}
    negated:
        kind: unary_expression
        all: [{has: {field: operator, regex: '^-$'}}, {has: {field: argument, pattern: $N}}]
    ceiling:
        any:
            - kind: call_expression
              all:
                - has: {field: function, matches: math-ceil}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $N}}, {not: {has: {nthChild: 2}}}]}
            - kind: unary_expression
              all:
                - has: {field: operator, regex: '^-$'}
                - has:
                    field: argument
                    kind: call_expression
                    all:
                        - has: {field: function, matches: math-floor}
                        - has: {field: arguments, all: [{has: {nthChild: 1, matches: negated}}, {not: {has: {nthChild: 2}}}]}
            - kind: parenthesized_expression
              has: {matches: ceiling}
    flooring:
        any:
            - kind: call_expression
              all:
                - has: {field: function, matches: math-floor}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $N}}, {not: {has: {nthChild: 2}}}]}
            - kind: unary_expression
              all:
                - has: {field: operator, regex: '^-$'}
                - has:
                    field: argument
                    kind: call_expression
                    all:
                        - has: {field: function, matches: math-ceil}
                        - has: {field: arguments, all: [{has: {nthChild: 1, matches: negated}}, {not: {has: {nthChild: 2}}}]}
            - kind: parenthesized_expression
              has: {matches: flooring}
    sign:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, regex: '^((globalThis|window|self)\.)?Math\.sign$', matches: typescript-global-reference, has: {field: object, pattern: $MATH}}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $N}}, {not: {has: {nthChild: 2}}}]}
    floored-magnitude:
        kind: call_expression
        all:
            - has: {field: function, matches: math-floor}
            - has:
                field: arguments
                all:
                    - not: {has: {nthChild: 2}}
                    - has:
                        nthChild: 1
                        kind: call_expression
                        all:
                            - has: {field: function, kind: member_expression, regex: '^((globalThis|window|self)\.)?Math\.abs$', matches: typescript-global-reference, has: {field: object, pattern: $MATH}}
                            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $N}}, {not: {has: {nthChild: 2}}}]}
rule:
    any:
        - kind: ternary_expression
          any:
            - all: [{has: {field: condition, matches: below-zero}}, {has: {field: consequence, matches: ceiling}}, {has: {field: alternative, matches: flooring}}]
            - all: [{has: {field: condition, matches: above-zero}}, {has: {field: consequence, matches: flooring}}, {has: {field: alternative, matches: ceiling}}]
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\*$'}
            - any:
                - all: [{has: {field: left, matches: sign}}, {has: {field: right, matches: floored-magnitude}}]
                - all: [{has: {field: left, matches: floored-magnitude}}, {has: {field: right, matches: sign}}]
fix: $MATH.trunc($N)
message: '`ceil` and `floor` truncate `$N` by its sign'
note: 'Call `Math.trunc(<n>)`'
