# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-unary-function
language: tsxlang
arguments: [parameter, result]
rule:
    kind: arrow_function
    all:
        - not: {has: {regex: '^async$', not: {kind: identifier}}}
        - any:
            - has: {field: parameter, kind: identifier, matches: parameter}
            - has:
                field: parameters
                all:
                    - has: {kind: required_parameter, has: {field: pattern, kind: identifier, matches: parameter}, not: {has: {field: value, pattern: $_}}}
                    - not: {has: {nthChild: {position: 2, ofRule: {kind: 'required_parameter, optional_parameter'}}}}
        - has: {field: body, matches: result}
