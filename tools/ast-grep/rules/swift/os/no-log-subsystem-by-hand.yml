# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, pattern: $TYPE, regex: '^(os(\.|::))?(Logger|OSLog|OSSignposter)(\.init)?$'}
        - has:
            kind: call_suffix
            has:
                kind: value_arguments
                any:
                    - not: {has: {kind: value_argument}}
                    - has:
                        kind: value_argument
                        all:
                            - has: {field: name, regex: '^subsystem$'}
                            - not: {has: {field: value, regex: '^(Program\.current\.)?identifier$'}}
message: '`$TYPE` spells a subsystem at its call site or logs under the empty default'
note: 'Log through `Logging.Logger(label:)`, and pass `Program.current.identifier` from `CurrentProcess` as the subsystem of an `OSSignposter`'
