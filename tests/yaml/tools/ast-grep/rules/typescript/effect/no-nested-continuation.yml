id: no-nested-continuation
valid:
    - |
      import { Effect } from "effect";
      const a = Effect.flatMap(task, (n) => load(n));
    - |
      import { Effect } from "effect";
      const a = Effect.gen(function* () {
          const n = yield* task;
          return yield* Effect.map(load(n), (m) => m + n);
      });
invalid:
    - |
      import { Effect } from "effect";
      const a = Effect.flatMap(task, (n) => Effect.map(load(n), (m) => m + n));
    - |
      import { Effect } from "effect";
      const a = Effect.catchTag(task, "Missing", (e) => {
          const fallback = recover(e);
          return Effect.tap(fallback, (v) => Effect.log(v));
      });
