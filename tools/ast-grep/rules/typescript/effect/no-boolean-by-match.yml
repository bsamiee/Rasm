# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-boolean-by-match
language: tsx
severity: error
utils:
    # Arm answering one boolean literal, a thunk, a block with the one return, or the Function constants passed point-free
    true-arm:
        any:
            - {kind: arrow_function, has: {field: body, kind: 'true'}}
            - {kind: arrow_function, has: {field: body, kind: statement_block, has: {kind: return_statement, has: {kind: 'true'}}, not: {has: {nthChild: 2}}}}
            - pattern: constTrue
            - pattern: Function.constTrue
    false-arm:
        any:
            - {kind: arrow_function, has: {field: body, kind: 'false'}}
            - {kind: arrow_function, has: {field: body, kind: statement_block, has: {kind: return_statement, has: {kind: 'false'}}, not: {has: {nthChild: 2}}}}
            - pattern: constFalse
            - pattern: Function.constFalse
    # Case record with one arm answering true and the other false
    boolean-cases:
        kind: object
        all:
            - has: {kind: pair, has: {field: value, matches: true-arm}}
            - has: {kind: pair, has: {field: value, matches: false-arm}}
    # Pair holding the true arm, the rewriters read its key as the case the predicate names
    true-pair:
        kind: pair
        all:
            - has: {field: key, pattern: $KEY}
            - has: {field: value, matches: true-arm}
    boolean-match:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: object, regex: '^(Boolean|Option|Either|Exit|Effect)$'}
                - has: {field: property, regex: '^(match|matchCause)$'}
rule:
    matches: boolean-match
    pattern: $CALL
    all:
        - has: {field: arguments, has: {matches: boolean-cases}}
        # The data-last boolean match is the identity step of a pipe, no predicate names it
        - not: {pattern: Boolean.match($_)}
rewriters:
    - id: true-key
      rule: {matches: true-pair}
      fix: $KEY
    # Boolean matched to itself is the boolean, or its negation under the operand rules of the not operator
    - id: flag
      rule:
          pattern: 'Boolean.match($V, $_)'
          has: {field: arguments, has: {kind: object, has: {matches: true-pair}}}
      constraints: {KEY: {regex: '^onTrue$'}}
      fix: $V
    - id: flag-not-operand
      rule: {pattern: 'Boolean.match($V, $_)'}
      constraints: {V: {matches: syntax-negation-operand}}
      fix: '!$V'
    - id: flag-not-compound
      rule: {pattern: 'Boolean.match($V, $_)'}
      fix: '!($V)'
    # The match and matchCause spellings share the key that names the predicate
    - id: carrier-first
      rule: {pattern: '$M.$_($V, $C)'}
      transform:
          CASE: {rewrite: {source: $C, rewriters: [true-key], joinBy: ''}}
          PRED: replace($CASE, replace='^on(\w+)$', by='is$1')
      fix: $M.$PRED($V)
    - id: carrier-last
      rule: {pattern: $M.$_($C)}
      transform:
          CASE: {rewrite: {source: $C, rewriters: [true-key], joinBy: ''}}
          PRED: replace($CASE, replace='^on(\w+)$', by='is$1')
      fix: $M.$PRED
transform:
    PREDICATE: rewrite($CALL, rewriters=[flag, flag-not-operand, flag-not-compound, carrier-first, carrier-last])
fix: $PREDICATE
message: The match answers a boolean the carrier's own predicate states
note: >-
    Read the case through its predicate, `Option.isSome(option)`, `Either.isRight(either)`, `Exit.isSuccess(exit)`,
    `Effect.isSuccess(effect)`, and a boolean matched to itself is the boolean
