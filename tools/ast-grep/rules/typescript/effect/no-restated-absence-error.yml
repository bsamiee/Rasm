# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    rebuild:
        kind: arrow_function
        has:
            field: body
            kind: new_expression
            all:
                - has: {field: constructor, matches: {effect-module-member: {module: {regex: '(?-u:\b)Cause$'}, member: {regex: '^NoSuchElementError$'}}}}
                - not: {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}}}}
    mapper:
        kind: arrow_function, function_expression
        has: {field: parameters, kind: formal_parameters, not: {has: {kind: 'required_parameter, optional_parameter'}}}
    lift:
        kind: member_expression
        pattern: $LIFT
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^(fromOption|fromNullishOr)$'}}}
    option-lift:
        matches: lift
        has: {field: property, regex: '^fromOption$'}
    lifted:
        kind: call_expression
        all:
            - has: {field: function, matches: lift}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}]}
    option-lifted:
        matches: lifted
        has: {field: function, has: {field: property, regex: '^fromOption$'}}
    map-error:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^mapError$'}}}
    map-step:
        kind: call_expression
        all:
            - has: {field: function, matches: map-error}
            - has: {field: arguments, not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}}
    rebuild-step:
        matches: map-step
        has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: rebuild}}
    mapper-step:
        matches: map-step
        has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: mapper}}
    step-chain:
        kind: arguments
        inside:
            kind: call_expression
            has:
                field: function
                any:
                    - {kind: member_expression, has: {field: property, regex: '^pipe$'}}
                    - matches: {effect-function: {name: {regex: '^(flow|pipe)$'}}}
    previous-step:
        any:
            - matches: lift
            - matches: lifted
              nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}
              inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}}}
    previous-option-step:
        matches: previous-step
        any:
            - has: {field: property, regex: '^fromOption$'}
            - has: {field: function, has: {field: property, regex: '^fromOption$'}}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^(fromOption|fromNullishOr|mapError|pipe)$'}}
        - any:
            - all:
                - has: {field: function, matches: option-lift}
                - has: {field: arguments, all: [{not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'comment, html_comment'}}}}}}, {has: {nthChild: {position: 1, reverse: true, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: rebuild}}]}
            - all:
                - has: {field: function, matches: map-error}
                - has:
                    field: arguments
                    all:
                        - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'comment, html_comment'}}}}}
                        - any:
                            - all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: lifted}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: rebuild}}]
                            - all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: option-lifted}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: mapper}}]
            - all:
                - has: {field: function, has: {field: property, regex: '^pipe$'}}
                - any:
                    - all: [{has: {field: function, has: {field: object, matches: lifted}}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: rebuild-step}}}]
                    - all: [{has: {field: function, has: {field: object, matches: option-lifted}}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, matches: mapper-step}}}]
            - all:
                - inside: {matches: step-chain}
                - any:
                    - all: [{matches: rebuild-step}, {follows: {stopBy: {pattern: $_}, matches: previous-step}}]
                    - all: [{matches: mapper-step}, {follows: {stopBy: {pattern: $_}, matches: previous-option-step}}]
message: '`$LIFT` absence error is rebuilt or mapped outside its `onNone` argument'
note: 'Pass the mapper as `onNone` argument of `Effect.fromOption`, and delete a rebuilt `NoSuchElementError`'
