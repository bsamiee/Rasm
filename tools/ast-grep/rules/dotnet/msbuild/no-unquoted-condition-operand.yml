# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unquoted-condition-operand
language: xml
severity: error
rule:
    kind: Attribute
    pattern: _CONDITION
    any:
        - regex: |-
            (?x) ^ Condition \s* = \s* " \s*
            (?: (?: [$@%]\([A-Za-z_][A-Za-z0-9_.]*\) | [A-Za-z0-9_./:-]+ | &quot;[^"'<>&]*&quot; ) \s* (?:==|!=) \s* (?: '[^'"&]*' | [$@%]\([A-Za-z_][A-Za-z0-9_.]*\) | [A-Za-z0-9_./:-]+ | &quot;[^"'<>&]*&quot; )
            | '[^'"&]*' \s* (?:==|!=) \s* (?: [$@%]\([A-Za-z_][A-Za-z0-9_.]*\) | [A-Za-z0-9_./:-]+ | &quot;[^"'<>&]*&quot; ) )
            \s* " $
        - regex: |-
            (?x) ^ Condition \s* = \s* ' \s*
            (?: [$@%]\([A-Za-z_][A-Za-z0-9_.]*\) | [A-Za-z0-9_./:-]+ | "[^"'<>&]*" ) \s* (?:==|!=) \s* (?: [$@%]\([A-Za-z_][A-Za-z0-9_.]*\) | [A-Za-z0-9_./:-]+ | "[^"'<>&]*" )
            \s* ' $
transform:
    ENTITY: {replace: {source: $CONDITION, replace: '^(Condition\s*=\s*".*?)&quot;([^"''<>&]*)&quot;(.*)$', by: "$1'$2'$3"}}
    ENTITY_AGAIN: {replace: {source: $ENTITY, replace: '^(Condition\s*=\s*".*?)&quot;([^"''<>&]*)&quot;(.*)$', by: "$1'$2'$3"}}
    LEFT:
        replace:
            source: $ENTITY_AGAIN
            replace: "^(Condition\\s*=\\s*\"\\s*)((?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))(\\s*(?:==|!=)\\s*(?:'[^'\\\"&]*'|[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+)\\s*\")$"
            by: "$1'$2'$3"
    RIGHT:
        replace:
            source: $LEFT
            replace: "^(Condition\\s*=\\s*\"\\s*'[^'\\\"&]*'\\s*(?:==|!=)\\s*)((?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))(\\s*\")$"
            by: "$1'$2'$3"
    STRIPPED: {replace: {source: $RIGHT, replace: '^(Condition\s*=\s*''.*?)"([^"''<>&]*)"(.*)$', by: '$1$2$3'}}
    STRIPPED_AGAIN: {replace: {source: $STRIPPED, replace: '^(Condition\s*=\s*''.*?)"([^"''<>&]*)"(.*)$', by: '$1$2$3'}}
    SINGLE:
        replace:
            source: $STRIPPED_AGAIN
            replace: "^(Condition\\s*=\\s*)'(\\s*)([$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+)(\\s*(?:==|!=)\\s*)([$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+)(\\s*)'$"
            by: "$1\"$2'$3'$4'$5'$6\""
fix: $SINGLE
message: Condition compares an operand outside single quotes
note: 'Quote both operands, `Condition="''$(<Property>)'' == ''<value>''"`'
