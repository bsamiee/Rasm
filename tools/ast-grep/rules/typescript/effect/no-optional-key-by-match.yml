# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    empty-object:
        any:
            - kind: object
              not: {has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}}}
            - kind: parenthesized_expression
              has: {matches: empty-object}
    absent:
        any:
            - matches: {typescript-constant-function: {result: {matches: empty-object}}}
            - kind: call_expression
              all:
                - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: empty-object}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
                - has: {field: function, matches: {effect-function: {name: {regex: '^constant$'}}}}
    optional-match:
        kind: call_expression
        all:
            - has: {field: function, pattern: $MATCH, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^match$'}}}}
            - has:
                field: arguments
                has:
                    nthChild: {position: 1, reverse: true, ofRule: *code}
                    kind: object
                    all:
                        - has: {kind: pair, all: [{has: {field: key, regex: '^onNone$'}}, {has: {field: value, matches: absent}}]}
                        - has:
                            kind: pair
                            all:
                                - has: {field: key, regex: '^onSome$'}
                                - has: {field: value, kind: arrow_function, has: {field: body, kind: parenthesized_expression, has: {kind: object, has: {kind: 'pair, shorthand_property_identifier', nthChild: {position: 1, ofRule: *code}, not: {has: {kind: computed_property_name}}}, not: {has: {nthChild: {position: 2, ofRule: *code}}}}}}
rule:
    kind: spread_element
    has:
        nthChild: {position: 1, ofRule: *code}
        kind: call_expression
        any:
            - matches: optional-match
            - all:
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: optional-match}}
                - has:
                    field: function
                    any:
                        - {kind: member_expression, has: {field: property, regex: '^pipe$'}}
                        - matches: {effect-function: {name: {regex: '^pipe$'}}}
message: '`$MATCH` spreads `{}` or one key to write an optional key by hand'
note: 'Spread `Record.getSomes({ <key>: <option> })`, mapping the option first where its key holds a derived value'
