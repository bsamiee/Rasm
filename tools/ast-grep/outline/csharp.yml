id: csharp-using
language: csharplang
role: item
symbolType: module
rule:
    kind: using_directive, extern_alias_directive
    pattern: $DECLARATION
    has: {pattern: $NAME}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '[;\s]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: false
---
id: csharp-file-reference
language: csharplang
role: item
symbolType: module
rule:
    kind: file_based_directive
    regex: '^#:\s*(sdk|package|project|ref)\s+\S'
    pattern: $DECLARATION
transform:
    NAME: {replace: {source: $DECLARATION, replace: '^#:\s*\w+\s+|\s+$', by: ''}}
name: $NAME
signature: $DECLARATION
isImport: true
isExported: false
---
id: csharp-file-property
language: csharplang
role: item
symbolType: property
rule:
    kind: file_based_directive
    regex: '^#:\s*property\s+\S'
    pattern: $DECLARATION
transform:
    NAME: {replace: {source: $DECLARATION, replace: '^#:\s*\w+\s+|\s+$', by: ''}}
name: $NAME
signature: $DECLARATION
isExported: false
---
id: csharp-file-selection
language: csharplang
role: item
symbolType: file
rule:
    kind: file_based_directive
    regex: '^#:\s*(include|exclude)\s+\S'
    pattern: $DECLARATION
transform:
    NAME: {replace: {source: $DECLARATION, replace: '^#:\s*\w+\s+|\s+$', by: ''}}
name: $NAME
signature: $DECLARATION
isImport: {regex: '^#:\s*include\s'}
isExported: false
---
id: csharp-interface
language: csharplang
role: item
symbolType: interface
rule:
    kind: interface_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: declaration_list, inside: {kind: interface_declaration, field: body}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '[;\s]+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    all:
        - &public
          any:
              - has: {kind: modifier, regex: '^public$'}
              - inside: {kind: interface_declaration, stopBy: {kind: &owner 'class_declaration, record_declaration, struct_declaration, interface_declaration'}}
                not: {has: {kind: modifier, regex: '^(private|protected|internal)$'}}
        - not: {inside: {stopBy: end, kind: *owner, not: *public}}
---
id: csharp-class
