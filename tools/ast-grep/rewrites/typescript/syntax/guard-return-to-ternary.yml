# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: guard-return-to-ternary
language: tsx
severity: off
utils:
    # Expression the ternary template cannot hold without parentheses, a comma or an assignment binds looser than the operator
    low-precedence:
        any: [{kind: sequence_expression}, {kind: assignment_expression}, {kind: augmented_assignment_expression}]
rule:
    kind: if_statement
    not:
        any:
            - has: {kind: comment}
            - has: {field: alternative, kind: else_clause}
    all:
        # Keep conditions whose unwrapped ternary or yield changes the expression grouping
        - has:
            field: condition
            kind: parenthesized_expression
            not: {has: {kind: comment}}
            has: {pattern: $C, not: {any: [{matches: low-precedence}, {kind: ternary_expression}, {kind: yield_expression}]}}
        # The guard's value, bare or as the block's one return, an object literal parses as a ternary arm without parentheses
        - has:
            field: consequence
            any:
                - kind: return_statement
                  not: {has: {kind: comment}}
                  has: {pattern: $A, not: {matches: low-precedence}}
                - kind: statement_block
                  not: {has: {nthChild: 2}} # The required return is the only named child
                  has: {kind: return_statement, not: {has: {kind: comment}}, has: {pattern: $A, not: {matches: low-precedence}}}
        # The neighbor default refuses a comment between the guard and the return, the join drops it
        - precedes: {kind: return_statement, not: {has: {kind: comment}}, has: {pattern: $B, not: {matches: low-precedence}}}
fix:
    template: 'return $C ? $A : $B;'
    expandEnd: {kind: return_statement}
message: The guard and the return after it choose one value through two statements
note: >-
    Return the choice as one expression, `return condition ? value : other`. Keep direct guards when they state the control flow clearly; this rewrite is an optional expression conversion
