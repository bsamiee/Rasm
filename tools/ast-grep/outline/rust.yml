id: rust-use
language: rustlang
role: item
symbolType: module
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    not: {has: {kind: visibility_modifier}}
    any:
        - has: {field: argument, has: {field: path, pattern: $NAME}}
        - has: {field: argument, kind: use_wildcard, has: {kind: 'crate, identifier, metavariable, scoped_identifier, self, super', pattern: $NAME}}
        - has: {field: argument, pattern: $NAME}
        - has: {field: name, pattern: $NAME}
transform:
    TRIMMED: {replace: {source: $DECLARATION, replace: ';$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\p{White_Space}*\n\p{White_Space}*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: false
---
id: rust-reexport
language: rustlang
role: item
symbolType: module
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    has: {kind: visibility_modifier}
    any:
        - has: {field: argument, pattern: $ARGUMENT}
        - has: {field: name, pattern: $ARGUMENT}
transform:
    NAME: {replace: {source: $ARGUMENT, replace: '\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    TRIMMED: {replace: {source: $DECLARATION, replace: ';$', by: ''}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\p{White_Space}*\n\p{White_Space}*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: true
---
id: rust-mod
language: rustlang
role: item
symbolType: module
rule:
    kind: mod_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters: [{id: mod-body, rule: {kind: declaration_list, inside: {kind: mod_item, field: body}}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [mod-body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\p{White_Space}*;?$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-function
language: rustlang
role: item
symbolType: function
rule:
    kind: 'function_item, function_signature_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}
rewriters: [{id: function-body, rule: {kind: block, inside: {kind: function_item, field: body}}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}
---
id: rust-method
language: rustlang
role: item
symbolType: method
rule:
    kind: 'function_item, function_signature_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}
rewriters: [{id: function-body, rule: {kind: block, inside: {kind: function_item, field: body}}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [function-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: ' ?;?$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported:
    any:
        - has: {kind: visibility_modifier}
        - inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, pattern: $_}}]}}
---
id: rust-type
language: rustlang
role: item
symbolType: struct
rule:
    kind: 'struct_item, union_item, type_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}
rewriters: [{id: struct-body, rule: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item', field: body}}, fix: ''}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [struct-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
