# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-timer
language: tsx
severity: error
utils:
    listener-callback:
        matches: syntax-function-boundary
        inside:
            kind: arguments
            inside:
                kind: call_expression
                has: {field: function, kind: member_expression, has: {field: property, regex: '^(addEventListener|once|on)$'}}
rule:
    kind: call_expression
    not:
        all:
            - has: {field: function, regex: 'clear(Timeout|Interval|Immediate)$'}
            - inside: {matches: listener-callback, stopBy: {matches: syntax-function-boundary}}
    has:
        field: function
        pattern: $NAME
        any:
            - matches: syntax-global-reference
              regex: '^(globalThis\.)?(setTimeout|setInterval|setImmediate|queueMicrotask|clearTimeout|clearInterval|clearImmediate|AbortSignal\.timeout|process\.nextTick)$'
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?timers(/promises)?$'}
                    exported: {regex: '^(setTimeout|setInterval|setImmediate|clearTimeout|clearInterval|clearImmediate)$'}
            - matches:
                syntax-import-reference:
                    source: {regex: '^(node:)?process$'}
                    exported: {regex: '^nextTick$'}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^(wait|yield)$'}
                - has:
                    field: object
                    matches:
                        syntax-import-reference:
                            source: {regex: '^(node:)?timers/promises$'}
                            exported: {regex: '^scheduler$'}
message: '`$NAME` schedules on the host timer outside the effect runtime'
note: '`Effect.sleep` replaces a timeout, `Effect.repeat` with a `Schedule` an interval, `Effect.yieldNow` a microtask, interruption a clear call'
