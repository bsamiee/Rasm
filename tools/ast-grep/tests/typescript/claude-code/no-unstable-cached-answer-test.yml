id: no-unstable-cached-answer
valid:
    # The correction, the changing value read in the event that changes it and the cached answer invalidated from there
    - |
      on('turn.complete', async ($, e, next) => {
          await $.store.set('turn', $.session.turnCount());
          $.ui.invalidate('prompt.context');
          return next(e);
      });
    # Clock read in a tool.call hook, an uncached event
    - |
      on('tool.call', async ($, e, next) => {
          const started = Date.now();
          return next(e);
      });
    # Clock read in a matched tool.call hook
    - |
      on('tool.call', { tool: 'Bash' }, async ($, e, next) => {
          const started = $.clock.now();
          return next(e);
      });
    # Clock read outside any hook
    - |
      const started = Date.now();
    # Session member stable within the session
    - |
      on('prompt.context', async ($, e, next) => {
          const cwd = await $.session.cwd();
          return next(e);
      });
    # Store read, the store changes through writes the plugin makes and invalidates
    - |
      on('prompt.context', async ($, e, next) => {
          const rows = await $.store.get('findings');
          return next(e);
      });
    # Date built from a literal, stable
    - |
      on('prompt.section', async ($, e, next) => {
          const cutoff = new Date('2026-01-01');
          return next(e);
      });
    # Date static over a literal, stable
    - |
      on('tool.describe', async ($, e, next) => {
          const cutoff = Date.parse('2026-01-01');
          return next(e);
      });
    # Date as a type annotation
    - |
      on('prompt.section', async ($, e, next) => {
          const held: Date = cutoff;
          return next(e);
      });
    # Constructor other than Date without an argument
    - |
      on('prompt.context', async ($, e, next) => {
          const seen = new Map();
          return next(e);
      });
    # Same member path on an object other than the engine interface
    - |
      on('prompt.context', async ($, e, next) => {
          const rows = await api.session.messages();
          return next(e);
      });
    # Registration through a function other than on
    - |
      register('prompt.context', async ($, e, next) => {
          const now = Date.now();
          return next(e);
      });
    # Tool table, it changes at registration alone
    - |
      on('prompt.context', async ($, e, next) => {
          const tools = await $.tool.list();
          return next(e);
      });
    # Spawn through the agent noun, a run and no read of the subagent list
    - |
      on('prompt.context', async ($, e, next) => {
          const spawned = await $.agent.spawn({ prompt });
          return next(e);
      });
    # Environment read in a cached hook, the environment holds for the session
    - |
      on('prompt.context', async ($, e, next) => {
          const home = process.env.HOME;
          return next(e);
      });
    # Session id, stable for the session
    - |
      on('prompt.section', async ($, e, next) => {
          const id = await $.session.id();
          return next(e);
      });
invalid:
    # Subagent list, grows every spawn
    - |
      on('prompt.context', async ($, e, next) => {
          const agents = await $.agent.list();
          return next(e);
      });
    # The instance, the clock read in a prompt.context hook
    - |
      on('prompt.context', async ($, e, next) => {
          const now = Date.now();
          return next(e);
      });
    # Date constructed without an argument in a prompt.section hook
    - |
      on('prompt.section', async ($, e, next) => {
          const now = new Date();
          return next(e);
      });
    # Randomness in a tool.describe hook
    - |
      on('tool.describe', async ($, e, next) => {
          const salt = Math.random();
          return next(e);
      });
    # Random id
    - |
      on('prompt.context', async ($, e, next) => {
          const id = crypto.randomUUID();
          return next(e);
      });
    # Random bytes
    - |
      on('prompt.context', async ($, e, next) => {
          const bytes = crypto.getRandomValues(new Uint8Array(8));
          return next(e);
      });
    # High-resolution clock
    - |
      on('prompt.context', async ($, e, next) => {
          const started = performance.now();
          return next(e);
      });
    # Engine clock
    - |
      on('prompt.context', async ($, e, next) => {
          const started = $.clock.now();
          return next(e);
      });
    # Turn count, moves every turn
    - |
      on('prompt.context', async ($, e, next) => {
          const turn = await $.session.turnCount();
          return next(e);
      });
    # Session messages, grow every turn
    - |
      on('prompt.section', async ($, e, next) => {
          const rows = await $.session.messages();
          return next(e);
      });
    # Read inside a closure the hook holds, the same answer
    - |
      on('tool.describe', async ($, e, next) => {
          const stamp = (): number => Date.now();
          return next(e);
      });
    # Function-expression hook
    - |
      on('prompt.context', async function ($, e, next) {
          const now = Date.now();
          return next(e);
      });
    # Matched registration on a cached event
    - |
      on('tool.describe', { tool: 'Bash' }, async ($, e, next) => {
          const now = Date.now();
          return next(e);
      });
    # Date constructed without parentheses
    - |
      on('prompt.context', async ($, e, next) => {
          const now = new Date;
          return next(e);
      });
    # Random through globalThis
    - |
      on('prompt.context', async ($, e, next) => {
          const id = globalThis.crypto.randomUUID();
          return next(e);
      });
    # Cached hook registered through a parameter typed On
    - |
      const arm = (register: On): void => {
          register('prompt.context', async ($, e, next) => {
              const now = Date.now();
              return next(e);
          });
      };
    # Cached hook bound to a name before the registration
    - |
      const hook = async ($, e, next) => {
          const now = Date.now();
          return next(e);
      };
      on('prompt.context', hook);
    # Temporal clock
    - |
      on('prompt.context', async ($, e, next) => {
          const now = Temporal.Now.instant();
          return next(e);
      });
    # Process uptime
    - |
      on('tool.describe', async ($, e, next) => {
          const up = process.uptime();
          return next(e);
      });
    # Engine clock read inside a nested hook-shaped closure
    - |
      on('prompt.section', async ($, e, next) => {
          const stamp = async ($, e, next) => $.clock.now();
          return next(e);
      });
