# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-infra-tests"
edition.workspace = true
description       = "Containers for tests: servers started from the images a Compose file states, each returned with its connected driver, and conformance tools built from a Dockerfile and run to their exit against a host port"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[test]]
name = "suite"
path = "suite.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
tokio                  = { workspace = true }
thiserror              = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
serde_path_to_error    = { workspace = true }
oci-spec               = { workspace = true }
http                   = { workspace = true }
aws-sdk-s3             = { workspace = true }
clickhouse             = { workspace = true }
redis                  = { workspace = true }
sqlx                   = { workspace = true, features = ["postgres"] }
rdkafka                = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }

[target."cfg(windows)".dependencies]
rdkafka = { workspace = true, features = ["cmake-build"] } # librdkafka configures through CMake on Windows, through its own script elsewhere

[dev-dependencies]
backon  = { workspace = true }
futures = { workspace = true }
claims  = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
