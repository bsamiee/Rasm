# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unconditional-upsert
language: sql
severity: error
rule:
    kind: upsert_clause
    pattern: _UPSERT
    all:
        - not: {has: {field: where, kind: where_clause}}
        - not: {has: {kind: set_assignment, not: {has: {field: value, kind: column_reference, has: {field: table, regex: '(?i)^excluded$'}}}}}
        - matches: {sql-update-upsert: {row: {pattern: _TABLE}}}
rewriters:
    - id: stored
      rule: {kind: set_assignment, has: {field: column, pattern: _COLUMN}}
      fix: $TABLE.$COLUMN
    - id: incoming
      rule: {kind: set_assignment, has: {field: value, pattern: _VALUE}}
      fix: $VALUE
transform:
    STORED: {rewrite: {source: $UPSERT, rewriters: [stored], joinBy: ', '}}
    INCOMING: {rewrite: {source: $UPSERT, rewriters: [incoming], joinBy: ', '}}
fix: '$UPSERT WHERE ($STORED) IS DISTINCT FROM ($INCOMING)'
message: '`$UPSERT` rewrites rows that already hold every incoming value'
note: 'End the update with `where (<table>.<column>, ...) is distinct from (excluded.<column>, ...)`, so an unchanged row writes nothing, returns no row, fires no update trigger, and costs D1 no written row'
