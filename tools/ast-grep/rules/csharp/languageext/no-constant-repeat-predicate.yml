# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    predicate:
        any:
            - has: {field: arguments, has: {kind: argument, has: {field: name, regex: '^predicate$'}, pattern: $PREDICATE}}
            - all:
                - not: {has: {field: arguments, has: {kind: argument, has: {field: name, regex: '^predicate$'}}}}
                - has: {field: arguments, has: {kind: argument, nthChild: {position: 1, reverse: true}, matches: csharp-positional-argument, pattern: $PREDICATE}}
    named-or-outer-reading:
        any:
            - has: {field: arguments, has: {kind: argument, pattern: $PREDICATE, has: {kind: identifier, not: {inside: {kind: argument, field: name}}}}}
            - has: {field: arguments, has: {kind: argument, pattern: $PREDICATE, has: {matches: outer-read}}}
    outer-read:
        kind: lambda_expression, anonymous_method_expression
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: $READ_PARAMETER
                    - kind: parameter_list
                      has: {kind: parameter, has: {field: name, pattern: $READ_PARAMETER}}
            - has:
                stopBy: end
                kind: identifier
                not:
                    any:
                        - pattern: $READ_PARAMETER
                        - inside: {kind: member_access_expression, field: name}
                        - inside: {kind: parameter}
rule:
    kind: invocation_expression
    all:
        - any:
            - has: {field: function, has: {field: name, regex: '^(Repeat|Retry)(While|Until)(IO)?([\p{White_Space}\x{FEFF}]*<.+>)?$', pattern: $NAME}}
            - has: {field: function, pattern: $NAME, matches: {csharp-type-name: {name: {regex: '^(repeat|retry)(While|Until)$'}}}}
        - matches: predicate
        - any:
            - all:
                - has: {field: function, regex: '(?s)While(IO)?([\p{White_Space}\x{FEFF}]*<[^()]*>)?$'}
                - has: {field: arguments, has: {kind: argument, pattern: $PREDICATE, matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}}}
            - all:
                - has: {field: function, regex: '(?s)Until(IO)?([\p{White_Space}\x{FEFF}]*<[^()]*>)?$'}
                - has:
                    field: arguments
                    has:
                        kind: argument
                        pattern: $PREDICATE
                        matches: {csharp-constant-lambda: {value: {regex: '^(false|default([\p{White_Space}\x{FEFF}]*\([\p{White_Space}\x{FEFF}]*((global::)?System\.)?(bool|Boolean)[\p{White_Space}\x{FEFF}]*\))?)$'}}}
        - not: {matches: named-or-outer-reading}
message: '`$NAME` takes a predicate that never stops the loop'
note: 'Call the method without its `While` or `Until` suffix and predicate argument'
