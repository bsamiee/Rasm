syntax = "proto3";

package rasm.contracts.benchmark.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "rasm/contracts/benchmark/v1/fingerprint.proto";

enum BenchModality {
  BENCH_MODALITY_UNSPECIFIED = 0;
  BENCH_MODALITY_FN = 1;
  BENCH_MODALITY_ITER = 2;
  BENCH_MODALITY_YIELD = 3;
}

enum BenchPolarity {
  BENCH_POLARITY_UNSPECIFIED = 0;
  BENCH_POLARITY_MINIMIZE = 1;
  BENCH_POLARITY_MAXIMIZE = 2;
}

enum PayloadBand {
  PAYLOAD_BAND_UNSPECIFIED = 0;
  PAYLOAD_BAND_MICRO = 1;
  PAYLOAD_BAND_SMALL = 2;
  PAYLOAD_BAND_MEDIUM = 3;
  PAYLOAD_BAND_LARGE = 4;
}

enum BenchRung {
  BENCH_RUNG_UNSPECIFIED = 0;
  BENCH_RUNG_MIN = 1;
  BENCH_RUNG_MAX = 2;
  BENCH_RUNG_AVG = 3;
  BENCH_RUNG_P25 = 4;
  BENCH_RUNG_P50 = 5;
  BENCH_RUNG_P75 = 6;
  BENCH_RUNG_P95 = 7;
  BENCH_RUNG_P99 = 8;
  BENCH_RUNG_P999 = 9;
  BENCH_RUNG_STD_DEV = 10;
}

message BenchInputWire {
  uint64 payload_bytes = 1;
  PayloadBand band = 2 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  string dtype = 3 [(buf.validate.field).string.min_len = 1];
  repeated uint64 shape = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.uint64.gt = 0
  ];
  repeated uint64 strides = 5 [(buf.validate.field).repeated.items.uint64.gt = 0];
  uint32 batch = 6 [(buf.validate.field).uint32.gt = 0];
  double density = 7 [(buf.validate.field).double = {
    finite: true
    gt: 0
    lte: 1
  }];

  option (buf.validate.message).cel = {
    id: "bench_input.strides_rank"
    message: "strides carry one entry per shape axis"
    expression: "this.strides.size() == this.shape.size()"
  };
}

message ChromeTraceWire {
  bytes content = 1 [(buf.validate.field).bytes.len = 16];
  uint64 start_ns = 2;
}

message BenchmarkExportWire {
  bytes content = 1 [(buf.validate.field).bytes.len = 16];
  string exporter = 2 [(buf.validate.field).string.min_len = 1];
}

message EpContextWire {
  bytes content = 1 [(buf.validate.field).bytes.len = 16];
  string ep = 2 [(buf.validate.field).string.min_len = 1];
}

message ProfileArtifactWire {
  oneof kind {
    option (buf.validate.oneof).required = true;

    ChromeTraceWire chrome_trace = 1;
    BenchmarkExportWire benchmark_export = 2;
    EpContextWire ep_context = 3;
  }
}

message BenchKernelWire {
  BenchInputWire input = 1 [(buf.validate.field).required = true];
  string substrate = 2 [(buf.validate.field).string.min_len = 1];
  string family = 3 [(buf.validate.field).string.min_len = 1];
  string case = 4 [(buf.validate.field).string.min_len = 1];
  string route = 5 [(buf.validate.field).string.min_len = 1];
  string provider = 6 [(buf.validate.field).string.min_len = 1];
  optional bytes corpus = 7 [(buf.validate.field).bytes.len = 16];
  optional string artifact_key = 8 [(buf.validate.field).string.min_len = 1];
  double equivalence_max_deviation = 9 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  string tolerance_class = 10 [(buf.validate.field).string.min_len = 1];
  repeated ProfileArtifactWire artifacts = 11;
}

message BenchAggregate {
  double avg = 1 [(buf.validate.field).double.finite = true];
  double min = 2 [(buf.validate.field).double.finite = true];
  double max = 3 [(buf.validate.field).double.finite = true];
  double total = 4 [(buf.validate.field).double.finite = true];
}

message RungCell {
  BenchRung rung = 1 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  double value = 2 [(buf.validate.field).double.finite = true];
}

message BenchBandWire {
  uint32 sample_count = 1 [(buf.validate.field).uint32.gt = 0];
  repeated RungCell rungs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
  optional uint32 ticks = 3;
  repeated double samples = 4 [(buf.validate.field).repeated.items.double.finite = true];
  BenchAggregate gc = 5;
  BenchAggregate heap = 6;
  map<string, double> counters = 7 [(buf.validate.field).map.values.double.finite = true];
}

// `unit` is open like the sibling `counters` keys: a harness measures whatever its subject exposes, so no roster
// closes the vocabulary.
message BenchMetric {
  string label = 1 [(buf.validate.field).string.min_len = 1];
  string unit = 2 [(buf.validate.field).string.min_len = 1];
  BenchModality modality = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  BenchPolarity polarity = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  oneof subject {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty probe = 5;
    BenchKernelWire kernel = 6;
  }
  BenchBandWire band = 7 [(buf.validate.field).required = true];
  optional uint32 warmups = 8;
  optional uint64 allocated_bytes = 9;
  optional uint64 operations = 10 [(buf.validate.field).uint64.gt = 0];
}

message BenchmarkClaimWire {
  string suite = 1 [(buf.validate.field).string.min_len = 1];
  HostFingerprintWire host = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp minted = 3 [(buf.validate.field).required = true];
  repeated BenchMetric metrics = 4 [(buf.validate.field).repeated.min_items = 1];
}
