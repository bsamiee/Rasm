# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-enum-scan-lookup
language: python
severity: error
utils:
    scan:
        kind: generator_expression
        all:
            - not: {has: {kind: 'for_in_clause, if_clause', nthChild: 4}}
            - any:
                - pattern: ($M for $M in $E if $M == $V)
                - pattern: ($M for $M in $E if $V == $M)
                - pattern: ($M for $M in $E if $M.$KEY == $V)
                - pattern: ($M for $M in $E if $V == $M.$KEY)
rule:
    kind: call
    pattern: $SCAN
    all:
        - has: {field: function, kind: identifier, regex: '^next$'}
        - any:
            - has: {field: arguments, kind: generator_expression, matches: scan}
            - has: {field: arguments, kind: argument_list, has: {nthChild: 1, matches: scan}}
constraints:
    E: {kind: identifier, regex: '^_?[A-Z][A-Za-z0-9]*[a-z][A-Za-z0-9]*$'}
    KEY: {regex: '^(value|name)$'}
message: '`$SCAN` scans the members of `$E` for one member'
note: 'Look the member up by value with `<enum>(<value>)` or by name with `<enum>[<name>]`, testing a value first with `<value> in <enum>`, an enum class maps each value and name to its member'
