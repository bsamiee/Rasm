# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-placeholder-no-op-csharp
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    empty-block:
        kind: block
        not: {has: {pattern: $_, not: {kind: comment}}}
    smart-enum:
        kind: class_declaration
        matches: {csharp-attributed: {name: {regex: '^SmartEnum(Attribute)?$'}}}
    case-arm:
        inside:
            kind: argument
            inside:
                kind: argument_list
                any:
                    - inside: {kind: invocation_expression, has: {field: function, regex: '(^|\.)\s*(Switch|Match)(\s*<.+>)?$'}}
                    - inside:
                        kind: 'object_creation_expression, implicit_object_creation_expression'
                        inside:
                            kind: variable_declarator
                            inside: {kind: variable_declaration, inside: {kind: field_declaration, inside: {kind: declaration_list, inside: {matches: smart-enum}}}}
    completed-task:
        any:
            - kind: default_expression
            - matches: {csharp-owner-member: {type: {regex: '^(ValueTask|Task)$'}, member: {regex: '^CompletedTask$'}}}
            - kind: object_creation_expression
              all:
                - has: {field: type, matches: {csharp-type-name: {name: {regex: '^ValueTask$'}}}}
                - not: {has: {field: arguments, has: {kind: argument}}}
            - kind: implicit_object_creation_expression
              not: {has: {kind: argument_list, has: {kind: argument}}}
    completed-body:
        any:
            - matches: empty-block
            - kind: arrow_expression_clause
              has: {matches: completed-task}
            - kind: block
              matches: csharp-single-return
              has: {kind: return_statement, has: {matches: completed-task}}
    unit-result:
        any:
            - matches: completed-task
              not: {kind: implicit_object_creation_expression}
            - kind: identifier, member_access_expression
              matches: {csharp-type-name: {name: {regex: '^unit(IO|Eff)?$'}}}
            - matches: {csharp-owner-member: {type: {regex: '^Unit$'}, member: {regex: '^Default$'}}}
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    any:
                        - matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^pure$'}}}
                        - matches: {csharp-owner-member: {type: {regex: '^Eff$'}, member: {regex: '^(Pure|Success)$'}}}
                        - matches: {csharp-type-name: {name: {regex: '^(Pure|SuccessEff)$'}}}
                - has: {field: arguments, has: {kind: argument, has: {matches: unit-result}}, not: {has: {kind: argument, nthChild: 2}}}
    unit-body:
        any:
            - has: {field: body, matches: unit-result}
            - has:
                kind: block
                matches: csharp-single-return
                has: {kind: return_statement, has: {matches: unit-result}}
    member-value:
        any:
            - inside: {kind: assignment_expression, field: right, inside: {kind: initializer_expression}}
            - inside: {kind: with_initializer}
            - inside: {kind: argument, inside: {kind: argument_list, inside: {kind: 'object_creation_expression, implicit_object_creation_expression'}}}
rule:
    any:
        - kind: lambda_expression, anonymous_method_expression
          pattern: $PLACEHOLDER
          all:
            - has: {matches: empty-block}
            - not: {matches: case-arm}
        - kind: lambda_expression, anonymous_method_expression
          pattern: $PLACEHOLDER
          all:
            - matches: unit-body
            - matches: member-value
        - kind: method_declaration
          all:
            - has: {field: name, regex: '^Dispose$', pattern: $PLACEHOLDER}
            - has: {field: body, matches: empty-block}
        - kind: method_declaration
          all:
            - has: {field: name, regex: '^DisposeAsync$', pattern: $PLACEHOLDER}
            - has: {field: body, matches: completed-body}
message: '`$PLACEHOLDER` stands in for an absent callback or resource'
note: 'Hold optional callbacks in `init` members with defaults, hooks in a `Seq` consumers run, resources under `use` or `Bracket`'
