                        (?x)^(aggregate|aggregateWithin|as|bind|bindEffect|bindTo|broadcast|broadcastN|buffer|bufferArray|catch|catchCause
                        |catchCauseFilter|catchCauseIf|catchDefect|catchFilter|catchIf|catchReason|catchReasons|catchTag|catchTags|changesWith
