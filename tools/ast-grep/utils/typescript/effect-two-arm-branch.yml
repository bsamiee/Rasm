# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Two-arm branch over a carrier, Effect.if or a match with an onX pair, cause spellings included, Layer.match and Fiber.match take other arms
id: effect-two-arm-branch
language: tsx
rule:
    kind: call_expression
    has:
        field: function
        kind: member_expression
        any:
            - regex: '^(Effect|STM)\.if$'
            # Array.match and its ends split the empty case from the non-empty one, Chunk and List export no match
            - regex: '^Array\.(match|matchLeft|matchRight)$'
            - all:
                  - has: {field: object, regex: '^(Boolean|Option|Either|Exit|Effect|Micro|STM)$'}
                  - has: {field: property, regex: '^(match|matchEffect|matchSTM|matchCause|matchCauseEffect)$'}
