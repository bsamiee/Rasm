# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    spinner: {matches: {swift-chain-root: {root: {kind: simple_identifier, regex: '^ProgressView$'}}}}
    control-root: {kind: simple_identifier, regex: '(Button|Link|Picker|Field)$|^(Toggle|Menu|TextEditor|Slider|Stepper|ControlGroup)$'}
    control: {matches: {swift-chain-root: {root: {matches: control-root}}}}
    spinner-arm:
        matches: {swift-single-statement: {first: {matches: spinner, pattern: $SPINNER}}}
    control-arm:
        kind: statements
        all:
            - has: {nthChild: 1, matches: {swift-chain-root: {root: {matches: control-root, pattern: $CONTROL}}}}
            - not: {has: {pattern: $_, not: {any: [{matches: control}, {kind: comment}]}}}
    bound-read:
        all:
            - any:
                - has: {field: bound_identifier, pattern: $BOUND}
                - has:
                    kind: 'pattern, switch_pattern'
                    has: {stopBy: end, kind: simple_identifier, follows: {kind: value_binding_pattern}, pattern: $BOUND}
            - has: {kind: statements, not: {matches: spinner-arm}, has: {stopBy: end, pattern: $BOUND}}
    lone-control:
        kind: if_statement
        all:
            - not: {has: {regex: '^else$'}}
            - has: {kind: statements, matches: control-arm}
rule:
    any:
        - kind: if_statement
          all:
            - has: {matches: spinner-arm}
            - has: {matches: control-arm}
            - not: {has: {kind: if_statement}}
            - not: {matches: bound-read}
        - kind: switch_statement
          all:
            - has: {kind: switch_entry, has: {matches: spinner-arm}}
            - has: {kind: switch_entry, has: {matches: control-arm}, not: {matches: bound-read}}
        - kind: if_statement
          all:
            - not: {has: {regex: '^else$'}}
            - has: {kind: statements, matches: spinner-arm}
            - any:
                - all:
                    - pattern: 'if $C { $$$_ }'
                    - any:
                        - precedes: {stopBy: end, matches: lone-control, pattern: 'if !$C { $$$_ }'}
                        - follows: {stopBy: end, matches: lone-control, pattern: 'if !$C { $$$_ }'}
                - all:
                    - pattern: 'if !$C { $$$_ }'
                    - any:
                        - precedes: {stopBy: end, matches: lone-control, pattern: 'if $C { $$$_ }'}
                        - follows: {stopBy: end, matches: lone-control, pattern: 'if $C { $$$_ }'}
    inside: {matches: swiftui-view-builder, stopBy: end}
message: '`$SPINNER` replaces `$CONTROL` while its operation runs and resets the control''s identity'
note: 'Bind effectful conditions once, keep `<control>` visible with `.disabled(<busy>).overlay { if <busy> { ProgressView() } }`'
