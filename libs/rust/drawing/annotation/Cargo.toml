# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-annotation"
version.workspace    = true
edition.workspace    = true
description          = "Annotation every Rasm drawing set composes on rasm-linework: rich text set from caller fonts into glyph runs and outlines, length, angle, area and slope notation over uom quantities and exact decimals, dimensions and feature control frames, leaders, marks, SVG symbols with text slots, legends and tables, each with its masks"
repository.workspace = true
license.workspace    = true
keywords             = ["drawing", "annotation", "dimension", "typesetting", "cad"]
categories           = ["graphics", "text-processing"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [TESTS]
[[test]]
name = "operations"
path = "../../../../tests/rust/drawing/annotation/operations.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
nonempty-collections       = { workspace = true }
validated                  = { workspace = true }
derive_more                = { workspace = true }
stacksafe                  = { workspace = true }
enum-map                   = { workspace = true }
itertools                  = { workspace = true }
nutype                     = { workspace = true }
uom                        = { workspace = true }
rust_decimal               = { workspace = true }
color                      = { workspace = true }
colorgrad                  = { workspace = true }
fontdb                     = { workspace = true }
fontique                   = { workspace = true }
linebender_resource_handle = { workspace = true }
parlance                   = { workspace = true }
parley                     = { workspace = true }
skrifa                     = { workspace = true }
kurbo                      = { workspace = true }
linesweeper                = { workspace = true }
usvg                       = { workspace = true }
rasm-linework              = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
