# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-weather"
version.workspace    = true
edition.workspace    = true
description          = "Weather a site receives: EPW and GRIB2 series resampled to any step, ASHRAE design conditions, climate summaries, degree days, running means, wind roses and profiles, psychrometrics and thermal comfort, Perez and CIE sky matrices over Reinhart patches"
repository.workspace = true
license.workspace    = true
keywords             = ["weather", "epw", "climate", "comfort", "sky"]
categories           = ["science::geo"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [TEST]
[[test]]
name = "series"
path = "../../../../tests/rust/geospatial/weather/series.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
dashu                = { workspace = true }
bounded-integer      = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
csv                  = { workspace = true }
serde                = { workspace = true }
serde_with           = { workspace = true }
jiff                 = { workspace = true }
nalgebra             = { workspace = true }
ndarray              = { workspace = true }
ndarray-interp       = { workspace = true }
statrs               = { workspace = true }
gauss-quad           = { workspace = true }
uom                  = { workspace = true }
grib                 = { workspace = true }
solar-positioning    = { workspace = true }
thermalcomfort       = { workspace = true }
twofloat             = { workspace = true }
rasm-proximity       = { workspace = true }
rasm-stats           = { workspace = true }
rasm-site            = { workspace = true }
rasm-solar           = { workspace = true }
rasm-analysis        = { workspace = true }

# --- [TESTING]
[dev-dependencies]
approx = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
