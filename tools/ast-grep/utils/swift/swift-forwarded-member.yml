# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-forwarded-member
language: swiftlang
arguments: [read]
utils:
    member-read:
        any:
            - kind: navigation_expression
              matches: read
              has: {field: target, matches: swift-member-reference, not: {kind: 'self_expression, super_expression'}}
            - kind: 'await_expression, try_expression, control_transfer_statement'
              has: {matches: member-read}
            - kind: tuple_expression
              not: {has: {regex: '^,$'}}
              has: {field: value, matches: member-read}
rule:
    matches: swift-sole-statement
    has: {matches: member-read}
