    any:
        - kind: field_declaration
          matches: variable
          not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}
          has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}}
        - kind: variable_declarator
          has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}
          inside: {kind: field_declaration, matches: variable}
name: $NAME
signature: $SIGNATURE
isExported: {any: [{matches: public}, {inside: {kind: field_declaration, matches: public}}]}
