# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: sql
severity: error
rule:
    all:
        - any:
            - {kind: &membership 'in_subquery_expression, in_table_expression', has: {regex: &negated '(?i-u)^not$'}}
            - kind: unary_expression
              all:
                - has: {field: operator, regex: *negated}
                - has: {field: operand, any: [{kind: *membership}, {kind: parenthesized_expression, has: {kind: *membership}}]}
        - pattern: $NODE
message: '`$NODE` can become NULL when a compared value is NULL'
note: 'Preserve nullable operand behavior when replacing the comparison with `not exists`'
