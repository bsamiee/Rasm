[mcp_servers.adobe]
command = "node"
args = ["apps/creative-cloud/mcp/main.ts"]

[mcp_servers.roslyn-codelens]
command = "dotnet"
args = ["dnx", "RoslynCodeLens.Mcp", "Workspace.slnx"]
required = true
startup_timeout_sec = 120
tool_timeout_sec = 300
default_tools_approval_mode = "approve"

[mcp_servers.rhino-mcp-platform]
command = "rhino-mcp-router"
startup_timeout_sec = 20
tool_timeout_sec = 180

[mcp_servers.lldb]
command = "xcrun"
args = ["lldb-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.blender]
command = "blender-mcp"
tool_timeout_sec = 300
default_tools_approval_mode = "approve"

[mcp_servers.mcp-for-blender]
command = "mcp-for-blender"
tool_timeout_sec = 180
default_tools_approval_mode = "approve"
