# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-mcp"
version.workspace    = true
edition.workspace    = true
description          = "Typed MCP servers over Streamable HTTP"
repository.workspace = true
license.workspace    = true
keywords             = ["mcp", "modelcontextprotocol", "rmcp", "streamable-http"]
categories           = ["network-programming", "web-programming::http-server"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
arc-swap                           = { workspace = true }
nonempty-collections               = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive-where                       = { workspace = true }
derive_more                        = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
serde_urlencoded                   = { workspace = true }
jsonschema                         = { workspace = true }
schemars                           = { workspace = true }
bounded-integer                    = { workspace = true }
uuid                               = { workspace = true }
axum                               = { workspace = true }
form_urlencoded                    = { workspace = true }
matchit                            = { workspace = true }
percent-encoding                   = { workspace = true }
rmcp                               = { workspace = true }
opentelemetry                      = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-opentelemetry              = { workspace = true }
tracing-subscriber                 = { workspace = true }
clap                               = { workspace = true }
rasm-telemetry                     = { workspace = true }
rasm-command                       = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
