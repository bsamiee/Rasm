---
id: swift-member-subscript
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-actor, swift-extension, swift-protocol]
symbolType: method
rule:
    kind: subscript_declaration
    pattern: $DECLARATION
    any:
        - has: {stopBy: end, kind: setter_specifier, pattern: $SETTER}
        - pattern: $GETTER
          not: {has: {stopBy: end, kind: setter_specifier}}
transform:
    HEADER: {replace: {source: $DECLARATION, replace: '\s*\{[\s\S]*$', by: ''}}
    UNTRAILED: {replace: {source: $HEADER, replace: ',(\s*\n\s*[)\]>])', by: '$1'}}
    LINE: {replace: {source: $UNTRAILED, replace: '\s*\n\s*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '(\()\s+|\s+(\))', by: '$1$2'}}
    GET: {replace: {source: $GETTER, replace: '(?s)^.*$', by: ' { get }'}}
    SET: {replace: {source: $SETTER, replace: '(?s)^.*$', by: ' { get set }'}}
name: subscript
signature: $SIGNATURE$GET$SET
isPublic: {not: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}}}
