# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-formatted-sql
language: rust
severity: error
rule:
    kind: macro_invocation
    pattern: $SQL
    all:
        - matches: {rust-std-macro: {name: {regex: '^(format|format_args|write|writeln)$'}}}
        - has:
            kind: token_tree
            has:
                kind: 'string_literal, raw_string_literal'
                all:
                    - regex: '^r?#*"\s*(SELECT\s|INSERT\s+INTO\s|UPDATE\s+\S+\s+SET\s|DELETE\s+FROM\s|WITH\s+(RECURSIVE\s+)?\S+\s+AS\s|CREATE\s+(UNIQUE\s+)?(TABLE|INDEX|VIEW)\s|ALTER\s+TABLE\s|DROP\s+(TABLE|INDEX|VIEW)\s)'
                    - regex: '(^|[^{])\{[A-Za-z0-9_:}]'
message: '`$SQL` formats values into SQL text'
note: 'Write constant statements through `sqlx::query!` or `sqlx::query_as!` with each value bound, build statements of varying shape with `sea_query::Query` or `sea_query::Table` from typed table definitions, and bind value lists through `sqlx::QueryBuilder`, the database reads each value typed and the statement holds no injected text'
