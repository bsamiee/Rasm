# --- [ENV] ------------------------------------------------------------------------------

[env]
BLENDER_PATH = """{% if env.BLENDER_PATH | default(value="") %}{{ env.BLENDER_PATH }}{% else %}{{ exec(command="if command -v blender; then :; fi", cache_key="blender-path", cache_duration="1d") }}{% endif %}"""

# --- [DAEMONS] --------------------------------------------------------------------------

[daemons.docker]
ready_cmd = { run = ["docker", "version"], timeout = "1m" }
run       = "exec docker events"
