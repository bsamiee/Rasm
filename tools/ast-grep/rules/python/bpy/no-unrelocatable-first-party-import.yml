# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unrelocatable-first-party-import
language: python
severity: error
files:
    - libs/python/**
    - apps/blender/**
rule:
    pattern: $MODULE
    matches: python-imported-module
    regex: '^blender(\.|$)'
    not: {inside: {kind: import_from_statement, field: module_name}}
message: '`$MODULE` import stays absolute through extension packing and resolves to nothing in an installed extension'
note: 'Write `from blender.<module> import <member>`'
