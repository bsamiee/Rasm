# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['apps/roslyn/**']
utils:
    extension-class:
        matches: {csharp-type-name: {name: {regex: '^StringExtensions$'}}}
    bounded-range:
        kind: range_expression
        has: {regex: '^[^^]', follows: {regex: '^\.\.$'}}
    length-argument:
        kind: argument
        any:
            - all: [{nthChild: 2}, {matches: csharp-positional-argument}]
            - has: {field: name, regex: '^length$'}
    trim-cut:
        kind: invocation_expression
        any:
            - all:
                - has:
                    field: function
                    matches: {csharp-accessed-name: {name: {regex: '^TrimOrNullify$'}}}
                    not: {has: {field: expression, matches: extension-class}}
                - has: {field: arguments, has: {kind: argument}}
            - all:
                - has:
                    field: function
                    matches: {csharp-accessed-name: {name: {regex: '^TrimOrNullify$'}}}
                    has: {field: expression, matches: extension-class}
                - has: {field: arguments, has: {kind: argument, nthChild: 2}}
    slice-cut:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-accessed-name: {name: {regex: '^(?:Substring|AsSpan|AsMemory)$'}}}}
            - has:
                field: arguments
                any:
                    - has: {matches: length-argument}
                    - has: {kind: argument, has: {matches: bounded-range}}
    remove-cut:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-accessed-name: {name: {regex: '^Remove$'}}}}
            - has: {field: arguments, all: [{has: {kind: argument}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    take-cut:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-accessed-name: {name: {regex: '^(?:Take|TakeLast)$'}}}}
            - has: {field: arguments, has: {kind: argument}}
    range-cut:
        kind: element_access_expression
        has: {field: subscript, has: {kind: argument, has: {matches: bounded-range}}}
    cut:
        any:
            - matches: trim-cut
            - matches: slice-cut
            - matches: remove-cut
            - matches: take-cut
            - matches: range-cut
rule:
    kind: invocation_expression, element_access_expression
    pattern: $CUT
    all:
        - inside: {stopBy: end, kind: method_declaration, matches: thinktecture-factory-validation}
        - matches: cut
message: '`$CUT` truncates the key inside `ValidateFactoryArguments` and collapses distinct inputs into one value'
note: 'Assign `validationError` when the key exceeds its length limit'
