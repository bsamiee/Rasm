id: no-unparsed-run-step
valid:
    - |
      jobs:
          a:
              steps:
                  - run: echo plain
                    shell: bash
    - |
      jobs:
          a:
              steps:
                  - run: |
                        Write-Output block
                    shell: pwsh
    - |
      jobs:
          a:
              steps:
                  - run: echo ${{ inputs.name }}
                    shell: bash
invalid:
    - |
      jobs:
          a:
              steps:
                  - run: |
                        echo block
                    shell: bash
    - |
      jobs:
          a:
              steps:
                  - run: "echo quoted"
                    shell: bash
    - |
      jobs:
          a:
              steps:
                  - run: echo multi
                        line
                    shell: bash
    - |
      jobs:
          a:
              steps:
                  - run: echo alias
                    *k : v
    - |
      defaults:
          run: {shell: bash}
      jobs:
          a:
              steps:
                  - run: echo escaped
                    "\x73hell": pwsh
