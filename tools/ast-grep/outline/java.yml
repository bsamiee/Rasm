id: java-package
language: javalang
role: item
symbolType: package
rule:
    kind: package_declaration
    pattern: $DECLARATION
    has: {kind: 'scoped_identifier, identifier', pattern: $NAME}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}])+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: java-import
language: javalang
role: item
symbolType: module
rule: {kind: import_declaration, pattern: $DECLARATION}
transform:
    NAME: {replace: {source: $DECLARATION, replace: '^import[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+(?:static[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]+)?|(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}])+$', by: ''}}
name: $NAME
isImport: true
isExported: false
---
id: java-module
language: javalang
role: item
symbolType: module
rule:
    kind: module_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: 'class_body, interface_body, annotation_type_body, enum_body, module_body, constructor_body, block', inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, module_declaration, method_declaration, constructor_declaration, compact_constructor_declaration', field: body}}
      fix: ''
transform:
