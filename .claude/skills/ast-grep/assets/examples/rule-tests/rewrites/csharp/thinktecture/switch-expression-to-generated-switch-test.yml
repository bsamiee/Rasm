id: switch-expression-to-generated-switch
valid:
    # Already on the generated Switch
    - |
      public static class S {
          public static Fin<Outcome> Done(Request request, Ledger ledger) =>
              request.Switch(open: static o => ledger.Open(o.Code), close: static c => ledger.Close(c.Code));
      }
    # When-guarded arm refuses the fix
    - |
      public static class S {
          public static int Guarded(Request request) =>
              request switch { Request.Open o when o.Code.Live => 1, Request.Close c => 0 };
      }
    # Discard arm refuses the fix
    - |
      public static class S {
          public static int Fallback(Request request) =>
              request switch { Request.Open o => 1, _ => 0 };
      }
    # Awaited subject rebinds under member access, the primary-expression guard refuses it
    - |
      public static class S {
          public static Fin<Outcome> Waited(Task<Request> t, Ledger ledger) =>
              await t switch { Request.Open o => ledger.Open(o.Code), Request.Close c => ledger.Close(c.Code) };
      }
    # Cast subject rebinds the same way
    - |
      public static class S {
          public static int Cast(object raw) =>
              (Request)raw switch { Request.Open o => 1, Request.Close c => 0 };
      }
    # Null-conditional subject, the member call returns null where the switch throws
    - |
      public static class S {
          public static int Optional(Envelope? envelope) =>
              envelope?.Request switch { Request.Open o => 1, Request.Close c => 0 };
      }
    # Comment among the arms, the join drops it
    - |
      public static class S {
          public static int Noted(Request request) =>
              request switch {
                  Request.Open o => 1, // the common arm
                  Request.Close c => 0,
              };
      }
invalid:
    # Namespace-qualified case keeps its last segment as the argument name
    - |
      public static class S {
          public static int Qualified(Request request) =>
              request switch { Contracts.Request.Open o => 1, Contracts.Request.Close c => 0 };
      }
    # Member-access subject
    - |
      public static class S {
          public static int Member(Envelope envelope) =>
              envelope.Request switch { Request.Open o => 1, Request.Close c => 0 };
      }
    # Invocation subject
    - |
      public static class S {
          public static int Loaded(Ledger ledger) =>
              ledger.Load() switch { Request.Open o => 1, Request.Close c => 0 };
      }
    # Element-access subject
    - |
      public static class S {
          public static int Indexed(Request[] requests) =>
              requests[0] switch { Request.Open o => 1, Request.Close c => 0 };
      }
    # Parenthesized cast subject, the primary form of the refused cast
    - |
      public static class S {
          public static int Wrapped(object raw) =>
              ((Request)raw) switch { Request.Open o => 1, Request.Close c => 0 };
      }
    # Unguarded qualified patterns on a language switch
    - |
      public static class S {
          public static Fin<Outcome> Dispatch(Request request, Ledger ledger) =>
              request switch {
                  Request.Open o => ledger.Open(o),
                  Request.Amend a => ledger.Amend(a),
                  Request.Close c => ledger.Close(c),
              };
      }
