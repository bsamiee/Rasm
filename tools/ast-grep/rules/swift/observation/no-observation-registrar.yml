# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observation-registrar
language: swiftlang
severity: error
rule:
    kind: property_declaration
    any:
        - has: {kind: type_annotation, has: {field: name, regex: '^(Observation\.)?ObservationRegistrar$'}}
        - has: {field: value, kind: call_expression, has: {nthChild: 1, regex: '^(Observation\.)?ObservationRegistrar$'}}
message: 'Stored `ObservationRegistrar` restates access and mutation tracking that `@Observable` generates'
note: 'Mark the class `@Observable` and delete its registrar with each `access(_:keyPath:)` and `withMutation(of:keyPath:_:)` call'
