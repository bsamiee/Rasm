id: field-items-to-length
valid:
    - |
      from pydantic import Field
      class Model:
          Field = factory
          value = Field(min_items=3)
    - |
      def build(pydantic):
          return pydantic.fields.Field(min_items=3)
    - |
      from pydantic import Field
      for (Field, other), rest in factories:
          Field(min_items=3)
    - |
      def unrelated():
          from pydantic import Field
      def build():
          return Field(min_items=3)
    - |
      from pydantic import Field
      for Field in factories:
          Field(min_items=3)
    - |
      from pydantic import Field
      for Field, other in factories:
          Field(min_items=3)
    - |
      from pydantic import Field
      Field, other = factories
      Field(min_items=3)
    - |
      from pydantic import Field
      [Field(min_items=3) for Field in factories]
    - |
      from pydantic import Field
      with factory() as Field:
          Field(min_items=3)
    - |
      from pydantic import Field
      try: work()
      except Error as Field:
          Field(min_items=3)
    - |
      from pydantic import Field
      if Field := factory():
          Field(min_items=3)
    - |
      from pydantic import Field
      def Field(**kwargs): return kwargs
      Field(min_items=3)
    - |
      from pydantic import Field
      class Field: pass
      Field(min_items=3)
    - "pydantic.Field(min_length=1)"
    - "other.Field(min_items=1)"
    - "pydantic.Field(min_items=1, min_length=2)"
    - "pydantic.Field(max_length=None, max_items=2)"
    - "pydantic.Field(max_items=2, **options)"
    - |
      from pydantic import Field
      def field(Field):
          return Field(min_items=1)
    - "pydantic.ConfigDict(min_items=1)"
    - |
      from pydantic import ConfigDict
      ConfigDict(min_items=1)
    - |
      from pydantic import Field
      def create():
          Field = factory
          return Field(min_items=1)
invalid:
    - "pydantic.Field(min_items=1)"
    - "pydantic.Field(max_items=3)"
    - 'pydantic.Field(min_items=minimum(), description="Names")'
    - |
      import pydantic as pd
      pd.Field(max_items=3)
    - |
      from pydantic import Field as field
      field(min_items=1)
    - |
      from pydantic import Field
      Field(
          min_items=1,  # Require a name
          description="Names",
      )
    - |
      import pydantic
      def unrelated():
          pydantic = factory
      value = pydantic.Field(min_items=1)
    - "wrap(pydantic.Field(min_items=1), min_length=2)"
    - "wrap(pydantic.Field(max_items=3), max_length=4)"
    - "pydantic.fields.Field(min_items=1)"
    - |
      from pydantic.fields import Field
      Field(max_items=3)
