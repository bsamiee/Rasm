            - The implementation-law section grades at operator depth: a [STACKING] bullet names the exact member-level seam — this package's output flowing into the named sibling member, the sibling anchored by its catalogue path — and one within-library row naming the composing owner; a bare package-name row ("integrates with numpy"), a seam lacking a member on either end, or "(none)" where the language-substrate tier carries an obvious composing sibling is shallow stacking demanding the member-level seam, and a seam citing a member the sibling catalogue does not carry is a phantom seam. A [RAIL_LAW] Reject row names the exact hand-rolled form THIS package forecloses — a Reject pasting unchanged between unrelated packages is the byte-copy defect — and [TOPOLOGY] carries only behavioral law a signature cannot show. Positively: a catalogue whose stacking spells a canonical chained rail across sibling catalogues at member grain is the demanded strong form worth naming.
