# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-earth-radius
language: rust
rule:
    kind: float_literal
    regex: |-
        (?x)^(
            6_?371(\.0*)?
            | 6_?371\.0_?088\d*
            | 6_?371_?0(00(\.0*)? | 08\.8\d*)
            | 6_?378\.137\d*
            | 6_?378_?137(\.0*)?
            | 6_?356\.752\d*
            | 6_?356_?752(\.\d+)?
            | 298\.257_?223_?563\d*
            | 3_?958\.(8|761_?3)\d*
            | 6(\.371|\.378_?137)e[36]
            | 6_?371e3
        )(_?f(32|64))?$
