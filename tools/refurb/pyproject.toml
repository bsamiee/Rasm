# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-refurb"
version         = "0.1.0"
description     = "Refurb checks over mypy types Ruff lacks, loaded by refurb as a plugin"
classifiers     = ["Private :: Do Not Upload"]
requires-python = ">=3.13"

dependencies = [
    "expression",   # `Option` and `Result`, whose fullnames RASM101 reads
    "msgspec",      # `msgspec.Struct` and `msgspec.field`, whose fullnames RASM102 reads
    "mypy",         # Nodes and types of the build refurb hands each check
    "rasm-records", # Words of a check class name its finding name derives from
    "refurb",       # Check host, visitor, and `get_mypy_type`
    "structlog",    # Bound logger types the log-field check reads
]

[project.entry-points."refurb.plugins"]
rasm = "rasm_refurb"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
