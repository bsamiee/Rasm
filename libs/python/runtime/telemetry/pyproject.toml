# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-telemetry"
version         = "0.0.0"
description     = "Log settings, entries as JSON records in rotated files over structlog and stdlib handlers, child process output and unhandled exceptions as entries, and OpenTelemetry instrumentation of a process or a threadless host"
license         = "MIT"
authors         = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers     = ["Intended Audience :: Developers", "Operating System :: OS Independent", "Topic :: System :: Logging", "Topic :: System :: Monitoring", "Typing :: Typed"]
requires-python = ">=3.13"

dependencies = [
    # --- [ENTRIES]

    "concurrent-log-handler",             # Size and time rotation with retention under one lock file every appending process takes
    "structlog",                          # Bound loggers over stdlib loggers, context-local fields, the formatter of stdlib handlers, and its timestamp, call site, exception, and JSON processors

    # --- [TRACES]

    "opentelemetry-api",                  # Current span ids of each entry, a no-op without the SDK
    "opentelemetry-instrumentation",      # Stdlib level to OpenTelemetry severity number of each record
    "opentelemetry-semantic-conventions", # Code, exception, and service attribute names of each record
]

[project.optional-dependencies]
export        = [
    "opentelemetry-sdk",                            # Tracer provider outside the process-wide one, resource detectors, and the span processor exporting on flush
]
process       = [
    "opentelemetry-distro",                         # Configurator installing tracer, meter, and logger providers over the exporters `OTEL_*` variables name
    "opentelemetry-instrumentation-structlog",      # Processor emitting each entry of the log as an OpenTelemetry log record
    "rasm-telemetry[export]",                       # Providers the scope shuts down, the resource of each exported signal, and the tracer provider giving spans their ids
]
otlp-http     = [
    "opentelemetry-exporter-otlp-proto-http",       # OTLP exporters over HTTP, `otlp_proto_http` and `otlp` under the `http/protobuf` protocol, and the collector of a host plug-in
    "rasm-telemetry[export]",                       # Span processor and provider a collector's exporter joins
]
otlp-grpc     = [
    "opentelemetry-exporter-otlp-proto-grpc",       # OTLP exporters over gRPC, `otlp_proto_grpc` and `otlp` under the `grpc` protocol
]
configuration = [
    "opentelemetry-configuration",                  # Declarative SDK configuration `OTEL_CONFIG_FILE` names
]
metrics       = [
    "opentelemetry-instrumentation-system-metrics", # Process and CPython metrics over psutil, registered while metrics export
]

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/libs/python/runtime/telemetry"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table
