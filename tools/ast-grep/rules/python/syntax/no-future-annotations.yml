# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-future-annotations
language: python
severity: error
utils:
    annotations-feature: {kind: dotted_name, regex: '^annotations$', inside: {kind: future_import_statement}}
rule:
    kind: future_import_statement
    pattern: $IMPORT
    has: {matches: annotations-feature}
rewriters:
    - id: kept
      rule: {kind: dotted_name, pattern: $FEATURE, not: {matches: annotations-feature}}
      fix: $FEATURE
transform:
    KEPT: rewrite($IMPORT, rewriters=[kept], joinBy=', ')
    OUT: replace($KEPT, replace='^.+$', by='from __future__ import ${0}')
fix: $OUT
message: 'The future import stores annotations as strings in place of deferred evaluation, the form of the module without the import'
note: 'Python 3.14 evaluates annotations lazily, and a consumer reading `__annotations__` resolves each name at read time'
