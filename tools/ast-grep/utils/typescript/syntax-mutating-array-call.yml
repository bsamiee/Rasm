# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Call of an array method that writes the array in place, the object is free and the caller pins it or reports every one
id: syntax-mutating-array-call
language: tsx
rule:
    kind: call_expression
    has:
        field: function
        kind: member_expression
        all:
            - has: {field: property, regex: '^(push|pop|shift|unshift|splice|sort|reverse|fill|copyWithin)$'}
            # PascalCase object is a module, Array.sort and Chunk.reverse of the effect package answer a new value
            - not: {has: {field: object, kind: identifier, regex: '^[A-Z][A-Za-z0-9]*$'}}
