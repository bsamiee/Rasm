# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharp
severity: error
rule:
    kind: invocation_expression
    pattern: $CALL
    has: { field: function, kind: member_access_expression, has: { field: name, regex: '^BeginUndoRecord$' } }
    any:
        - inside: { kind: expression_statement }
        - inside: { kind: assignment_expression, field: right, has: { field: left, regex: '^_$' } }
message: '`$CALL` discards the undo record serial `EndUndoRecord` takes'
note: 'Hold the serial and pass it to `EndUndoRecord` on every exit, through `use(<begin>, <end>)` or a `finally`'
