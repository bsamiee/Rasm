id: no-constant-column
valid:
    # The column varies across rows
    - 'const rows = [{ name: "dev", imported: true }, { name: "prd", imported: false }];'
    # One row holds no column
    - 'const single = [{ name: "dev", imported: true }];'
    # Second row without the pair
    - 'const rows = [{ name: "dev", kind: "environment" }, { name: "prd" }];'
    # The repeated value is a reference
    - 'const rows = [{ name: "dev", slug: slug }, { name: "prd", slug: slug }];'
    # Template with a substitution repeated on every row
    - 'const rows = [{ name: "dev", path: `${root}/dev` }, { name: "prd", path: `${root}/dev` }];'
    # String row beside an object row
    - 'const mixed = [{ name: "dev", imported: true }, "prd"];'
    # String element after two rows that repeat the pair
    - 'const mixed = [{ name: "dev", imported: true }, { name: "prd", imported: true }, "raw"];'
    # Scalar pair beside the object rows, the container is a record
    - 'const targets = { lint: { cache: true, command: "lint" }, format: { cache: true, command: "format" }, name: "tools" };'
    # Second object row without the pair
    - 'const targets = { lint: { cache: true, command: "lint" }, format: { command: "format" } };'
    # One object row, no second row repeats the pair
    - 'const targets = { lint: { cache: true, command: "lint" } };'
    # Spread row beside the rows, the hidden rows decide the column
    - 'const rows = [...base, { name: "dev", imported: true }, { name: "prd", imported: true }];'
    # Object value repeated on every row, each row owns its object
    - 'const rows = [{ name: "dev", opts: { cache: true } }, { name: "prd", opts: { cache: true } }];'
invalid:
    # Rows in an array under a pair
    - 'const table = { rows: [{ name: "dev", imported: true }, { name: "prd", imported: true }] };'
    # The instance, one literal pair on every array row
    - 'const rows = [{ name: "dev", imported: true }, { name: "prd", imported: true }];'
    # The pair in a different position per row, with extra keys
    - 'const rows = [{ imported: true, name: "dev" }, { name: "prd", imported: true, slug: "p" }];'
    # String column
    - 'const rows = [{ name: "dev", kind: "environment" }, { name: "prd", kind: "environment" }];'
    # Template column without a substitution
    - 'const rows = [{ name: "dev", glob: `*.ts` }, { name: "prd", glob: `*.ts` }];'
    # Number column
    - 'const rows = [{ name: "dev", retries: 3 }, { name: "prd", retries: 3 }];'
    # Negative number column
    - 'const rows = [{ name: "dev", offset: -1 }, { name: "prd", offset: -1 }];'
    # False column
    - 'const rows = [{ name: "dev", imported: false }, { name: "prd", imported: false }];'
    # Null column
    - 'const rows = [{ name: "dev", owner: null }, { name: "prd", owner: null }];'
    # Undefined column
    - 'const rows = [{ name: "dev", owner: undefined }, { name: "prd", owner: undefined }];'
    # Regex column
    - 'const rows = [{ name: "dev", match: /^v/ }, { name: "prd", match: /^v/ }];'
    # Comment before the first array row
    - |
      const rows = [
          // Rows per environment
          { name: "dev", imported: true },
          { name: "prd", imported: true },
      ];
    # The object-of-objects container
    - 'const targets = { lint: { cache: true, command: "lint" }, format: { cache: true, command: "format" } };'
    # Comment before the first object row
    - |
      const targets = {
          // Targets per tool
          lint: { cache: true, command: "lint" },
          format: { cache: true, command: "format" },
      };
