# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/csharp_rule.json
id: fin-match-to-if-fail
language: csharp
severity: off
rule:
    any:
        - pattern: {context: "class C { object F() => $RESULT.Match(Succ: $IDENTITY, Fail: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $RESULT.Match(Fail: $FALLBACK, Succ: $IDENTITY); }", selector: invocation_expression, strictness: cst}
        - all:
            - pattern: {context: "class C { object F() => $RESULT.Match($IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
            - not:
                has:
                    field: arguments
                    kind: argument_list
                    has:
                        kind: argument
                        has: {field: name, kind: identifier}
constraints:
    IDENTITY:
        matches:
            csharp-unary-callback:
                parameter: {pattern: $VALUE}
                body:
                    any:
                        - pattern: $VALUE
                        - pattern:
                            context: 'class C { object F() => M(x => { return $VALUE; }); }'
                            selector: block
                            strictness: cst
fix: "$RESULT.IfFail($FALLBACK)"
message: Use `IfFail` for an unchanged success value and a failure handler
note: Select LanguageExt Fin<A> calls through Roslyn. The Match result must be A, and the existing failure handler must select Func<Error, A> overload of IfFail. Keep wider result conversions with Match.
