# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-article-summary-tsx
language: tsx
severity: error
rule:
    kind: comment
    pattern: $DOC
    regex: '^/\*\*\s*(\*\s*)?(The|A|An)\s+\S'
    not: {inside: {kind: ambient_declaration, stopBy: end}}
transform:
    ARTICLE: {replace: {source: $DOC, replace: '^/\*\*\s*(?:\*\s*)?(The|A|An)\s[\s\S]*$', by: '$1'}}
message: 'Doc comment summary opens with the article `$ARTICLE`'
note: 'Open the summary with the member''s verb or returned noun, an article states no fact'
