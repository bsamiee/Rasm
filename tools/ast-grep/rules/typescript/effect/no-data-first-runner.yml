# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    dual-runner:
        kind: member_expression
        any:
            - all:
                - has: {field: property, regex: '^runMain$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)(NodeRuntime|BunRuntime|BrowserRuntime)$'}}}}
            - all:
                - has: {field: property, regex: '^run$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Command$'}}}}
    effect-runner:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(runPromise|runPromiseExit|runSync|runSyncExit|runFork|runCallback)$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
    context-runner:
        kind: call_expression
        all:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)With$'}
                    - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
            - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
    piped-program:
        kind: call_expression
        has: {field: arguments, has: {nthChild: 1}}
        any:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^pipe$'}}
            - has: {field: function, kind: identifier, matches: effect-pipe-function}
    runner-call:
        kind: call_expression
        all:
            - has: {field: function, pattern: $RUN, any: [{matches: dual-runner}, {matches: effect-runner}, {matches: context-runner}]}
            - any:
                - pattern: $RUN($_PROGRAM)
                - pattern: '$RUN($_PROGRAM, $_OPTIONS)'
                  has: {field: function, matches: dual-runner}
            - has: {field: arguments, has: {nthChild: 1, matches: piped-program}}
rule:
    kind: call_expression
    all:
        - any:
            - all:
                - matches: runner-call
                - not: {inside: {kind: member_expression, field: object, has: {field: property, regex: '^pipe$'}}}
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: runner-call}}]}
                - has: {field: arguments, has: {nthChild: 1}}
message: '`$RUN` wraps the pipe it runs'
note: 'Write `<program>.pipe(<steps>, <runner>)`, with `<runner>(<options>)` for a runner taking options'
