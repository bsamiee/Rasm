# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-union-find-by-hand
language: rust
severity: error
rule:
    kind: assignment_expression
    all:
        - has: {field: left, kind: index_expression, pattern: '$P[$X]'}
        - any:
            - has:
                field: right
                kind: call_expression
                all:
                    - any:
                        - has: {field: function, kind: field_expression, has: {field: field, pattern: $F}}
                        - has: {field: function, kind: identifier, pattern: $F}
                    - has: {field: arguments, has: {pattern: '$P[$X]'}}
                    - inside: {kind: function_item, stopBy: {kind: 'function_item, closure_expression'}, has: {field: name, pattern: $F}}
            - all:
                - has: {field: right, pattern: '$P[$P[$X]]'}
                - inside: {kind: while_expression, stopBy: {kind: 'function_item, closure_expression'}, has: {field: condition, pattern: '$P[$X] != $X'}}
message: '`$P[$X]` compresses a disjoint-set parent path by hand'
note: 'Hold the sets as `petgraph::unionfind::UnionFind<usize>` and call `find_mut(x)` for the compressing lookup and `union(x, y)` to merge, `into_labeling()` labels every element with its set'
