# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-replace-chain-by-hand
language: rust
severity: error
utils:
    literal-replace:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^replace$'}}
            - has: {field: arguments, all: [{has: {nthChild: 1, kind: 'string_literal, char_literal, raw_string_literal'}}, {has: {nthChild: 2, kind: 'string_literal, raw_string_literal'}}], not: {has: {nthChild: 3}}}
    replace-receiver:
        has: {field: function, has: {field: value, matches: literal-replace}}
    char-run:
        matches: literal-replace
        all:
            - has: {field: arguments, all: [{has: {nthChild: 1, kind: char_literal}}, {has: {nthChild: 2, pattern: $TO}}]}
            - has: {field: function, has: {field: value, any: [{not: {matches: literal-replace}}, {matches: char-run}]}}
    escaped-replace:
        any: [{matches: rust-entity-escape}, {matches: rust-html-tag-scan}, {matches: rust-json-pointer-escape}, {matches: rust-template-replace}]
rule:
    matches: literal-replace
    pattern: $CHAIN
    all:
        - has: {field: function, has: {field: value, all: [{matches: literal-replace}, {matches: replace-receiver}]}}
        - not: {inside: {kind: field_expression, has: {field: field, regex: '^replace$'}, inside: {matches: literal-replace}}}
        - not: {matches: char-run}
        - not: {any: [{matches: escaped-replace}, {has: {stopBy: end, matches: escaped-replace}}]}
message: '`$CHAIN` rewrites the text once per literal needle'
note: 'Build `aho_corasick::AhoCorasick::new([<needles>])?` once at the owner and call `replace_all(<text>, &[<replacements>])`, one pass replaces every needle where each chained `replace` copies the text and rescans what an earlier replacement wrote. Clippy `collapsible_str_replace` owns a chain of char needles sharing one replacement'
