# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
files: ['libs/**', 'tools/**', 'plugins/**', 'apps/creative-cloud/**', '.claude/**', '.codex/**']
rule:
    kind: command
    all:
        - any:
            - has: {field: name, regex: '^(/usr/bin/)?open$'}
            - all:
                - has: {field: name, regex: '^(exec|command)$'}
                - has: {kind: word, nthChild: 2, regex: '^(/usr/bin/)?open$'}
        - not:
            has:
                kind: 'word, string, raw_string, concatenation'
                not: {follows: {stopBy: end, regex: '^--args$'}}
                any:
                    - regex: '^[''"]?(-[eftFWRnjh]*g[A-Za-z]*|--background)[''"]?$'
                    - has: {stopBy: end, kind: special_variable_name, regex: '^[@*]$'}
                    - has: {stopBy: end, kind: subscript, has: {field: index, regex: '^[@*]$'}}
message: Open call supplies no fixed background option
note: Pass `-g`, `open` then launches through LaunchServices with no activation
