# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "mcp-muxer"
edition.workspace = true
description       = "Shares one stdio MCP server process per server key across every harness session through a per-user daemon"
publish           = false

# --- [TARGETS] --------------------------------------------------------------------------

[[bin]]
name = "mcp-muxer"
path = "main.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true, features = ["io-std"] }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
dirs                               = { workspace = true }
which                              = { workspace = true }
rustix                             = { workspace = true }
nonempty-collections               = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
derive_more                        = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
jiff                               = { workspace = true }
camino                             = { workspace = true }
fs-err                             = { workspace = true, features = ["tokio"] }
rmcp                               = { workspace = true, default-features = false, features = ["server", "transport-child-process"] }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-subscriber                 = { workspace = true }
clap                               = { workspace = true }
rasm-command                       = { workspace = true }
rasm-mcp                           = { workspace = true, features = ["proxy"] }
rasm-process                       = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
