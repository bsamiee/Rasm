# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-float-money
language: rust
severity: error
utils:
    money-name:
        regex: '(?i)(^|_)(prices?|subtotals?|tax(es)?|fees?)$'
    float:
        kind: primitive_type
        regex: '^f(32|64)$'
rule:
    kind: 'const_item, static_item, field_declaration, parameter, let_declaration'
    pattern: $DECLARATION
    all:
        - any: [{has: {field: name, matches: money-name}}, {has: {field: pattern, kind: identifier, matches: money-name}}]
        - has: {field: type, any: [{matches: float}, {has: {stopBy: end, matches: float}}]}
        - not: {inside: {kind: parameters, inside: {matches: rust-fixed-signature}}}
        - not: {inside: {stopBy: end, matches: rust-serde-record}}
message: '`$DECLARATION` holds money as a binary float'
note: 'Type the amount as `rust_decimal::Decimal`, decimal fractions of a currency unit hold exactly and rounding follows `round_dp_with_strategy`. A float field of a `Serialize` or `Deserialize` struct stays as written, `Decimal` serializes as a string under the catalog `serde-with-str` feature'
