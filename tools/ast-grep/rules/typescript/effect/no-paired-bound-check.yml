# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    schema-module:
        matches: {effect-module: {name: {regex: '(?-u:\b)Schema$'}}}
    composer:
        kind: call_expression
        any:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(check|pipe|makeFilterGroup)$'}}
            - has: {field: function, matches: effect-pipe-function}
    link:
        any:
            - matches: composer
            - kind: member_expression
              inside: {field: function, matches: composer}
            - kind: arguments
              inside: {matches: composer}
            - kind: array
              inside: {kind: arguments, inside: {matches: composer, has: {field: function, has: {field: property, regex: '^makeFilterGroup$'}}}}
    chain:
        matches: composer
        not: {inside: {matches: link}}
    upper:
        kind: call_expression
        pattern: $UPPER
        has: {field: function, kind: member_expression, has: {field: object, matches: schema-module}}
rule:
    pattern: $LOWER
    any:
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^is(MinLength|NonEmpty|MinSize|MinProperties|MinCodePoints|GreaterThan(OrEqualTo)?(Date|BigInt|BigDecimal)?)$'}}
            - has: {field: function, has: {field: object, matches: schema-module}}
            - any:
                - all:
                    - has: {field: function, has: {field: property, regex: '^is(MinLength|NonEmpty)$'}}
                    - inside: {stopBy: &walk {not: {matches: link}}, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isMaxLength$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isMinSize$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isMaxSize$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isMinProperties$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isMaxProperties$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isMinCodePoints$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isMaxCodePoints$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?Date$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?Date$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?BigInt$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?BigInt$'}}}, {matches: upper}]}}
                - all:
                    - has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?BigDecimal$'}}
                    - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?BigDecimal$'}}}, {matches: upper}]}}
        - kind: member_expression
          all:
            - has: {field: property, regex: '^NonEmptyString$'}
            - has: {field: object, matches: schema-module}
            - inside: {stopBy: *walk, matches: chain, has: {stopBy: *walk, kind: call_expression, all: [{has: {field: function, has: {field: property, regex: '^isMaxLength$'}}}, {matches: upper}]}}
message: '`$LOWER` and `$UPPER` state one range of one schema as two checks'
note: 'Replace both with the `Schema.isBetween*` check of their measure, `Schema.isBetween` for numbers'
