# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-exit-status-binding
language: bash
severity: error
utils:
    # The status parameter bare or as the whole of a double-quoted string
    status-value:
        any:
            - kind: simple_expansion
              has: {kind: special_variable_name, regex: '^\?$'}
            - kind: string
              has: {kind: simple_expansion, has: {kind: special_variable_name, regex: '^\?$'}}
              not: {has: {nthChild: 2}}
    assignment:
        kind: variable_assignment
        all:
            - has: {field: name, kind: variable_name, pattern: $RC}
            - has: {field: value, matches: status-value}
    # The plain assignment, or one under local, declare, or typeset
    status-binding:
        any:
            - matches: assignment
            - kind: declaration_command
              has: {matches: assignment}
    # A statement that expands the bound name, the assignment's own name excluded
    reader:
        has: {stopBy: end, kind: variable_name, pattern: $RC, not: {inside: {kind: variable_assignment, field: name}}}
rule:
    matches: status-binding
    all:
        # The next statement reads the name, the stopper walks past the ; between statements and past a comment to the first statement
        - precedes: {stopBy: {pattern: $_, not: {kind: comment}}, pattern: $_, matches: reader}
        # A second reader after the first keeps the binding, $? is gone once the first reader ran
        - not:
              inside:
                  has:
                      pattern: $_
                      matches: reader
                      follows: {stopBy: end, pattern: $_, matches: reader, follows: {stopBy: end, matches: status-binding}}
message: '`$RC` binds `$?` for one read'
note: Read `$?` in the statement that follows the command, `case $? in`, or `(($? == 0))`
