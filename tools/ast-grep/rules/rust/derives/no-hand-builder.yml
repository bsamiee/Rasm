# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-hand-builder
language: rust
severity: error
utils:
    setter:
        kind: function_item
        all:
            - has: {field: parameters, all: [{has: {kind: self_parameter, regex: '^mut\s+self$'}}, {has: {kind: parameter, has: {field: pattern, kind: identifier, pattern: $V}}}]}
            - has:
                field: body
                all:
                    - has: {nthChild: {position: 1, ofRule: {matches: rust-statement-slot}}, kind: expression_statement, has: {any: [{pattern: self.$F = Some($V)}, {pattern: self.$F = Some($V.into())}]}}
                    - has: {nthChild: {position: 2, ofRule: {matches: rust-statement-slot}}, kind: self}
                    - not: {has: {nthChild: {position: 3, ofRule: {matches: rust-statement-slot}}}}
rule:
    kind: impl_item
    all:
        - not: {has: {field: trait, pattern: $_}}
        - has: {field: type, any: [{kind: generic_type, has: {field: type, pattern: $B}}, {pattern: $B}], regex: '^\w*Builder\b'}
        - has: {field: body, all: [{has: {matches: setter, nthChild: {position: 3, ofRule: {matches: setter}}}}, {has: {kind: function_item, has: {field: name, regex: '^(build|finish)$'}}}]}
message: '`$B` sets each member through a hand-written setter before `build`'
note: 'Derive `bon::Builder` on the built type, or put `#[bon::builder]` on its constructor, and delete the builder, bon generates one setter per member and checks required members at compile time. `no-small-builder` owns a builder of at most two fields'
