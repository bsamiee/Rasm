# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-implicit-set-shas-workflow-id
language: yaml
severity: error
files: [".github/**"]
utils:
    workflow-id-input:
        kind: block_mapping_pair, flow_pair
        all:
            - has: {field: key, regex: '^(with|"with"|''with'')$'}
            - has:
                field: value
                any:
                    - has: {kind: alias}
                    - has:
                        kind: block_mapping, flow_mapping
                        has:
                            kind: block_mapping_pair, flow_pair
                            all:
                                - has: {field: key, regex: '^(workflow-id|"workflow-id"|''workflow-id'')$'}
                                - has: {field: value, not: {regex: '^(""|''''|~|null|Null|NULL)$'}}
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - has: {field: key, regex: '^(uses|"uses"|''uses'')$'}
        - has:
            field: value
            pattern: $ACTION
            regex: '^(nrwl/nx-set-shas@v(?:[2-9]|[1-9][0-9])(?:\.[0-9]+){0,2}|"nrwl/nx-set-shas@v(?:[2-9]|[1-9][0-9])(?:\.[0-9]+){0,2}"|''nrwl/nx-set-shas@v(?:[2-9]|[1-9][0-9])(?:\.[0-9]+){0,2}'')$'
        - inside:
            matches: github-step
            not: {has: {matches: workflow-id-input}}
labels: {ACTION: {style: primary}}
message: '`$ACTION` without `workflow-id` looks the current run up by `GITHUB_RUN_ID`, a run the hosted runner alone holds'
note: 'Set `with: {workflow-id: <workflow file>}` to the file name of the workflow, the runs query then needs no run lookup'
