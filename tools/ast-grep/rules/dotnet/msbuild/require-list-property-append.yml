# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-list-property-append
language: xml
severity: error
rule:
    pattern: _PROPERTY
    matches: {msbuild-property: {name: {regex: "^(NoWarn|(MSBuild)?Warnings(AsErrors|NotAsErrors|AsMessages)|DefineConstants|DefaultItemExcludes|InterceptorsNamespaces|InterceptorsPreviewNamespaces)$"}}}
    not:
        any:
            - matches: {msbuild-property-keeps-value: {name: {regex: "^NoWarn$"}, reference: {regex: '\$\(NoWarn[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^WarningsAsErrors$"}, reference: {regex: '\$\(WarningsAsErrors[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^WarningsNotAsErrors$"}, reference: {regex: '\$\(WarningsNotAsErrors[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^WarningsAsMessages$"}, reference: {regex: '\$\(WarningsAsMessages[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^MSBuildWarningsAsErrors$"}, reference: {regex: '\$\(MSBuildWarningsAsErrors[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^MSBuildWarningsNotAsErrors$"}, reference: {regex: '\$\(MSBuildWarningsNotAsErrors[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^MSBuildWarningsAsMessages$"}, reference: {regex: '\$\(MSBuildWarningsAsMessages[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^DefineConstants$"}, reference: {regex: '\$\(DefineConstants[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^DefaultItemExcludes$"}, reference: {regex: '\$\(DefaultItemExcludes[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^InterceptorsNamespaces$"}, reference: {regex: '\$\(InterceptorsNamespaces[).]'}}}
            - matches: {msbuild-property-keeps-value: {name: {regex: "^InterceptorsPreviewNamespaces$"}, reference: {regex: '\$\(InterceptorsPreviewNamespaces[).]'}}}
transform:
    APPENDED: {replace: {source: $PROPERTY, replace: '^(<([A-Za-z]+)(?:\s+[^\s=/>]+\s*=\s*(?:"[^"]*"|''[^'']*''))*\s*>\s*)', by: "$1$$($2);"}}
    FILLED: {replace: {source: $APPENDED, replace: '^<([A-Za-z]+)((?:\s+[^\s=/>]+\s*=\s*(?:"[^"]*"|''[^'']*''))*)\s*/>$', by: "<$1$2>$$($1);</$1>"}}
fix: $FILLED
message: 'The list property replaces earlier entries, the form of $(Name); at the start of the value'
