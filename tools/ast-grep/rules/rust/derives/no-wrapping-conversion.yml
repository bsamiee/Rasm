# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-wrapping-conversion
language: rust
severity: error
utils:
    sole-value:
        kind: block
        not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
    conversion:
        kind: function_item
        all:
            - has: {field: name, regex: '^from$'}
            - has: {field: parameters, has: {kind: parameter, has: {field: pattern, kind: identifier, pattern: $P}}}
            - has: {field: body, matches: sole-value}
rule:
    kind: impl_item
    all:
        - has: {field: trait, kind: generic_type, all: [{has: {field: type, regex: '^(((std|core)::)?convert::)?From$'}}, {has: {field: type_arguments, has: {nthChild: 1, pattern: $A}}}]}
        - has: {field: type, any: [{kind: generic_type, has: {field: type, pattern: $B}}, {pattern: $B}]}
        - has: {field: body, all: [{has: {matches: conversion}}, {not: {has: {kind: function_item, nthChild: {position: 2, ofRule: {kind: function_item}}}}}]}
        - any:
            - all:
                - has: {field: body, has: {matches: conversion, has: {field: body, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, pattern: $P.0}}}}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: struct_item, has: {field: name, pattern: $A}}}
            - all:
                - has: {field: body, has: {matches: conversion, has: {field: body, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, any: [{pattern: 'Self::$V($P)'}, {pattern: '$B::$V($P)'}]}}}}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $B}}}
        - not: {inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: {rust-error-type: {name: {pattern: $B}}}}}}
message: '`From<$A>` for `$B` wraps its argument in a variant or unwraps a newtype field by hand'
note: 'Derive `derive_more::From` on the target enum with `#[from]` on the variant, or `derive_more::Into` on the source newtype that `.0` reads, and delete the impl, the derive states the conversion from the declaration. `no-from-impl-by-hand` owns a conversion into a single-field struct. A body that checks or scales the value and an error type thiserror converts through `#[from]` stay as written'
