# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-capture-of-function-output
language: bash
severity: error
utils:
    # A call of the function by the name its definition binds
    call:
        kind: command
        has: {field: name, kind: command_name, has: {kind: word, pattern: $F}}
    # A call as a pipeline stage, bare or under its own redirect
    stage:
        any:
            - matches: call
            - kind: redirected_statement
              has: {field: body, matches: call}
    # A builtin writing to standard output, not into a variable and not under a redirect of its output
    printing-command:
        kind: command
        all:
            - has: {field: name, regex: '^(printf|echo)$'}
            - not: {has: {field: argument, regex: '^-v$'}} # The field pin reads the first argument alone
            - not: {inside: {stopBy: end, kind: redirected_statement, field: body, has: {field: redirect, kind: file_redirect, regex: '^(1?>|&>)'}}}
rule:
    kind: function_definition
    all:
        - has: {field: name, kind: word, pattern: $F}
        - has: {field: body, has: {stopBy: end, matches: printing-command}}
        - inside: # Any ancestor holding a reading call, no program kind because an unparsed construct makes the root an ERROR node
              stopBy: end
              has:
                  stopBy: end
                  any:
                      - kind: command_substitution
                        has: {stopBy: end, matches: call}
                      # The reading form alone, >( ) feeds the call and its output goes to the caller's output
                      - kind: process_substitution
                        regex: '^<'
                        has: {stopBy: end, matches: call}
                      # The last stage of a pipeline writes to the caller's output, an earlier one is read by the next
                      - kind: pipeline
                        has: {matches: stage, not: {nthChild: {position: 1, reverse: true}}}
message: '`$F` returns its result by printing it, and every caller forks to read it'
note: Take the result variable as a nameref parameter, `local -n out=$1`, assign it in the body, and call `<name> <variable> <args>`
