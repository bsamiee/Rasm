id: bash-function
language: bashlang
role: item
symbolType: function
rule: {kind: function_definition, has: {field: name, pattern: $NAME}}
name: $NAME
isExported: {not: {inside: {any: [{kind: 'subshell, process_substitution, pipeline, coproc_command'}, {kind: command_substitution, not: {has: {field: operator, pattern: $$_OP}}}], stopBy: end}}}
---
id: bash-function-function
language: bashlang
role: member
parentRuleIds: [bash-function]
symbolType: function
utils:
    scope: {inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
rule: {kind: word, pattern: $NAME, inside: {kind: function_definition, field: name, matches: scope}}
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
name: $QUALIFIER$NAME
isPublic: {not: {inside: {kind: function_definition, inside: {any: [{kind: 'subshell, process_substitution, pipeline, coproc_command'}, {kind: command_substitution, not: {has: {field: operator, pattern: $$_OP}}}], stopBy: {kind: function_definition}}}}}
---
id: bash-source
language: bashlang
role: item
symbolType: module
utils:
    argument: {not: {kind: 'command_name, variable_assignment, file_redirect, herestring_redirect, heredoc_redirect, comment'}}
    wrapped: {kind: word, regex: '^(source|\.)$', nthChild: 2, follows: {kind: command_name, regex: '^(builtin|command)$'}}
    option:
        any:
            - follows: {kind: command_name, not: {regex: '^(builtin|command)$'}}
            - follows: {matches: wrapped}
            - follows: {kind: 'word, string, raw_string', regex: '^["'']?-p[^"'']+["'']?$', matches: option}
            - follows: {matches: argument, follows: {kind: 'word, string, raw_string', regex: '^["'']?-p["'']?$', matches: option}}
rule:
    kind: command
    all:
        - any:
            - has: {field: name, regex: '^(source|\.)$'}
            - has: {matches: wrapped}
        - has:
            matches: argument
            pattern: $NAME
            any:
                - {not: {regex: '^["'']?-'}, matches: option}
                - follows: {kind: 'word, string, raw_string', regex: '^["'']?--["'']?$', matches: option}
name: $NAME
isImport: true
isExported: false
---
id: bash-function-source
language: bashlang
role: member
parentRuleIds: [bash-function]
symbolType: module
utils:
    argument: {not: {kind: 'command_name, variable_assignment, file_redirect, herestring_redirect, heredoc_redirect, comment'}}
    scope: {inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    wrapped: {kind: word, regex: '^(source|\.)$', nthChild: 2, follows: {kind: command_name, regex: '^(builtin|command)$'}}
    option:
        any:
            - follows: {kind: command_name, not: {regex: '^(builtin|command)$'}}
            - follows: {matches: wrapped}
            - follows: {kind: 'word, string, raw_string', regex: '^["'']?-p[^"'']+["'']?$', matches: option}
            - follows: {matches: argument, follows: {kind: 'word, string, raw_string', regex: '^["'']?-p["'']?$', matches: option}}
rule:
    kind: command
    all:
        - matches: scope
        - any:
            - has: {field: name, regex: '^(source|\.)$'}
            - has: {matches: wrapped}
        - has:
            matches: argument
            pattern: $NAME
            any:
                - {not: {regex: '^["'']?-'}, matches: option}
                - follows: {kind: 'word, string, raw_string', regex: '^["'']?--["'']?$', matches: option}
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
name: $QUALIFIER$NAME
isPublic: false
---
id: bash-variable
language: bashlang
role: item
symbolType: variable
utils:
    assignment: {kind: variable_assignment, not: {any: [{has: {regex: '^\+=$', pattern: $$_OP}}, {has: {field: name, kind: subscript}}]}}
    reply-binding:
        any:
            - {kind: variable_name, regex: '^REPLY$'}
            - kind: variable_assignment
              has: {field: name, any: [{kind: variable_name, regex: '^REPLY$'}, {kind: subscript, has: {field: name, regex: '^REPLY$'}}]}
rule:
    any:
        - matches: assignment
          not: {inside: {kind: 'variable_assignments, declaration_command, command, expansion, arithmetic_expansion, binary_expression, c_style_for_statement'}}
        - {kind: variable_assignments, has: {matches: assignment}}
        - kind: declaration_command
          has: {any: [{kind: variable_name}, {kind: variable_assignment, not: {has: {regex: '^\+=$', pattern: $$_OP}}}]}
          not:
            any:
                - has: {kind: 'word, string, raw_string', regex: '^["'']?[-+][a-zA-Z]*[fF]'}
                - all:
                    - has: {regex: '^(declare|typeset|local)$'}
                    - has: {kind: 'word, string, raw_string', regex: '^["'']?[-+][a-zA-Z]*p'}
                - all:
                    - has: {regex: '^export$'}
                    - has: {kind: 'word, string, raw_string', regex: '^["'']?-[a-zA-Z]*n'}
    pattern: $DECLARATION
rewriters:
    - id: binding
      rule:
        any:
            - kind: variable_assignment
              inside: {kind: declaration_command}
              not: {has: {regex: '^\+=$', pattern: $$_OP}}
              has:
                field: name
                any:
                    - {kind: variable_name, pattern: $BINDING_NAME}
                    - {kind: subscript, has: {field: name, pattern: $BINDING_NAME}}
            - kind: variable_assignment
              has: {field: name, kind: variable_name, pattern: $BINDING_NAME}
              not: {any: [{inside: {kind: declaration_command}}, {has: {regex: '^\+=$', pattern: $$_OP}}]}
            - {kind: variable_name, inside: {kind: declaration_command}, pattern: $BINDING_NAME}
      fix: $BINDING_NAME
transform:
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [binding], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[binding])
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r ]*\\?\n[\t-\r ]*', by: ' '}}
name: $NAMES
signature: $SIGNATURE
isExported:
    not:
        any:
            - inside: {any: [{kind: 'subshell, process_substitution, pipeline, coproc_command'}, {kind: command_substitution, not: {has: {field: operator, pattern: $$_OP}}}], stopBy: end}
            - kind: declaration_command
              all:
                - has: {regex: '^(local|declare|typeset)$'}
                - not: {has: {kind: 'word, string, raw_string', regex: '^["'']?-[a-zA-Z]*g'}}
                - inside: {kind: command_substitution, has: {field: operator, pattern: $$_OP}, stopBy: end}
            - all:
                - inside: {kind: command_substitution, has: {field: operator, regex: '\|$'}, stopBy: end}
                - not: {all: [{kind: declaration_command}, {has: {regex: '^(declare|typeset)$'}}, {has: {kind: 'word, string, raw_string', regex: '^["'']?-[a-zA-Z]*g'}}]}
                - any:
                    - matches: reply-binding
                    - kind: variable_assignments, declaration_command
                      not: {has: {kind: 'variable_assignment, variable_name', not: {matches: reply-binding}}}
---
id: bash-function-variable
language: bashlang
role: member
parentRuleIds: [bash-function]
symbolType: variable
utils:
    assignment: {kind: variable_assignment, not: {any: [{has: {regex: '^\+=$', pattern: $$_OP}}, {has: {field: name, kind: subscript}}]}}
    scope: {inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
rule:
    matches: scope
    any:
        - matches: assignment
          not: {inside: {kind: 'variable_assignments, declaration_command, command, expansion, arithmetic_expansion, binary_expression, c_style_for_statement'}}
        - {kind: variable_assignments, has: {matches: assignment}}
        - kind: declaration_command
          has: {any: [{kind: variable_name}, {kind: variable_assignment, not: {has: {regex: '^\+=$', pattern: $$_OP}}}]}
          not:
            any:
                - has: {kind: 'word, string, raw_string', regex: '^["'']?[-+][a-zA-Z]*[fF]'}
                - all:
                    - has: {regex: '^(declare|typeset|local)$'}
                    - has: {kind: 'word, string, raw_string', regex: '^["'']?[-+][a-zA-Z]*p'}
                - all:
                    - has: {regex: '^export$'}
                    - has: {kind: 'word, string, raw_string', regex: '^["'']?-[a-zA-Z]*n'}
    pattern: $DECLARATION
rewriters:
    - id: binding
      rule:
        any:
            - kind: variable_assignment
              inside: {kind: declaration_command}
              not: {has: {regex: '^\+=$', pattern: $$_OP}}
              has:
                field: name
                any:
                    - {kind: variable_name, pattern: $BINDING_NAME}
                    - {kind: subscript, has: {field: name, pattern: $BINDING_NAME}}
            - kind: variable_assignment
              has: {field: name, kind: variable_name, pattern: $BINDING_NAME}
              not: {any: [{inside: {kind: declaration_command}}, {has: {regex: '^\+=$', pattern: $$_OP}}]}
            - {kind: variable_name, inside: {kind: declaration_command}, pattern: $BINDING_NAME}
      fix: $BINDING_NAME
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [binding], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[binding])
    SIGNATURE: {replace: {source: $HEADER, replace: '[\t-\r ]*\\?\n[\t-\r ]*', by: ' '}}
name: $QUALIFIER$NAMES
signature: $SIGNATURE
isPublic:
    not:
        any:
            - inside: {any: [{kind: 'subshell, process_substitution, pipeline, coproc_command'}, {kind: command_substitution, not: {has: {field: operator, pattern: $$_OP}}}], stopBy: {kind: function_definition}}
            - kind: declaration_command
              has: {regex: '^(local|declare|typeset)$'}
              not: {has: {kind: 'word, string, raw_string', regex: '^["'']?-[a-zA-Z]*g'}}
---
id: bash-coprocess
language: bashlang
role: item
symbolType: variable
rule: {kind: coproc_command, has: {field: name, pattern: $NAME}}
name: $NAME
