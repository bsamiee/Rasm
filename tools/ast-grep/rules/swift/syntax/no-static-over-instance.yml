# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-static-over-instance
language: swift
severity: error
utils:
    own-type:
        kind: user_type
        any:
            - pattern: $TYPE
            - regex: '^Self$'
rule:
    kind: function_declaration
    all:
        - any:
            - has: {kind: modifiers, has: {kind: property_modifier, regex: '^static$'}}
            - has: {regex: '^class$'}
        - has: {field: name, kind: simple_identifier, pattern: $NAME}
        - inside: {kind: 'class_body, enum_class_body', inside: {kind: class_declaration, has: {field: name, pattern: $TYPE}}}
        - has: {kind: parameter, pattern: $RECEIVER, has: {matches: own-type}}
        - not: {has: {kind: parameter, not: {pattern: $RECEIVER}, has: {matches: own-type}}}
message: '`$NAME` is a type member taking `$RECEIVER`, a value of the enclosing `$TYPE`'
note: 'Drop `static` and `<receiver>`, read `self` in its body, add `mutating` for an `inout` receiver, and call the member on each value'
