# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-plain-text-secret
language: rust
severity: error
utils:
    secret-name:
        regex: '^(\w+_)?(password|passphrase|secret|secret_key|api_?key|access_token|refresh_token|auth_token|bearer_token|session_token|id_token|private_key)$'
    text-type:
        regex: '^(Option<\s*)?((::)?(std::)?(string::)?String|(Box|Arc|Rc)<\s*str\s*>|(std::borrow::)?Cow<\s*''\w+\s*,\s*str\s*>)(\s*>)?$'
rule:
    kind: 'field_declaration, parameter, let_declaration'
    pattern: $DECLARATION
    all:
        - any: [{has: {field: name, matches: secret-name}}, {has: {field: pattern, kind: identifier, matches: secret-name}}]
        - has: {field: type, matches: text-type}
        - not: {inside: {kind: parameters, inside: {matches: rust-fixed-signature}}}
message: '`$DECLARATION` holds a secret as plain text'
note: 'Type the value `secrecy::SecretString` and call `expose_secret()` at the use, `SecretString` redacts `Debug`, zeroizes on drop, and builds through `From<String>` for clap and `Deserialize` for serde. A request body borrows the `&str` `expose_secret()` returns'
