id: no-os-environ
valid:
    # The corrected form, the typed settings read once
    - |
      from pydantic_settings import BaseSettings

      class Settings(BaseSettings):
          api_key: str

      settings = Settings()
    # Another member of the module
    - |
      import os

      pid = os.getpid()
    # The member name imported from another module
    - |
      from settings import environ
    # Attribute named like the member on another object
    - |
      variables = process.environ
    # Alias of another module, the alias import proves nothing for os
    - |
      import settings as system

      home = system.environ["HOME"]
invalid:
    # The instance, the mapping read as spelled
    - |
      import os

      home = os.environ.get("CACHE_DIR")
    # The getter read as spelled
    - |
      import os

      home = os.getenv("HOME")
    # The member imported from the module
    - |
      from os import environ
    # The member second in the name list of a from-import
    - |
      from os import getpid, getenv
    # The member imported under an alias
    - |
      from os import environ as variables
    # The attribute read through the alias the import binds
    - |
      import os as system

      home = system.environ["HOME"]
