# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-testing"
edition.workspace = true
description       = "Test fixtures kept after a failed test: folders"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[test]]
name = "testing"
path = "main.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures      = { workspace = true }
derive-where = { workspace = true }
derive_more  = { workspace = true }
assert_fs    = { workspace = true }

[dev-dependencies]
tokio  = { workspace = true }
claims = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
rstest = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
