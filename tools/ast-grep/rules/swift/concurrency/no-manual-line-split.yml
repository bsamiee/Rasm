# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-manual-line-split
language: swift
severity: error
utils:
    newline:
        any:
            - kind: hex_literal
              regex: '^0x0[aA]$'
            - kind: integer_literal
              regex: '^10$'
            - pattern: 'UInt8(ascii: "\n")'
            - pattern: 'Character("\n")'
            - kind: line_string_literal
              regex: '^"(\\r)?\\n"$'
            - kind: 'prefix_expression, navigation_expression'
              regex: '^(CharacterSet)?\.newlines$'
    newline-search:
        kind: call_expression
        all:
            - has: {kind: navigation_expression, has: {field: suffix, regex: '^\.(split|firstIndex|lastIndex|components|firstRange|ranges)$'}}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, matches: newline}}}}
rule:
    kind: for_statement
    all:
        - has: {field: collection, regex: '(^|\.)(bytes|characters|unicodeScalars|standardOutput|standardError)$', pattern: $BYTES}
        - has: {field: item, has: {field: bound_identifier, pattern: $B}}
        - has:
            kind: statements
            has:
                stopBy: end
                any:
                    - kind: equality_expression
                      all:
                        - has: {pattern: $B}
                        - has: {matches: newline}
                    - kind: switch_statement
                      all:
                        - has: {pattern: $B}
                        - has: {kind: switch_entry, has: {kind: switch_pattern, has: {matches: newline, stopBy: end}}}
                    - matches: newline-search
message: '`for` over `$BYTES` splits `$B` into lines at a newline by hand'
note: 'Iterate `lines` of `FileHandle.AsyncBytes`, `URL.AsyncBytes`, or `URLSession.AsyncBytes`, or `strings()` of swift-subprocess `SubprocessOutputSequence`'
