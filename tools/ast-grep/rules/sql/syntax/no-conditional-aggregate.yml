# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-conditional-aggregate
language: sql
severity: error
rule:
    kind: invocation
    all:
        - matches: {sql-aggregate: {name: {regex: '(?i)^(min|max|sum|total|avg|count|group_concat|string_agg)$', pattern: _AGG}}}
        - has:
            field: parameter
            kind: term
            has:
                field: value
                any:
                    - pattern: {context: 'select case when _COND then _VALUE end', selector: case}
                    - pattern: {context: 'select case when _COND then _VALUE else null end', selector: case}
                    - pattern: {context: 'select iif(_COND, _VALUE, null)', selector: invocation}
                    - pattern: {context: 'select iif(_COND, _VALUE)', selector: invocation}
                    - pattern: {context: 'select if(_COND, _VALUE, null)', selector: invocation}
                    - pattern: {context: 'select if(_COND, _VALUE)', selector: invocation}
        - any:
            - has: {kind: term, pattern: _SEPARATOR, nthChild: 3}
            - not: {has: {kind: term, nthChild: 3}}
transform:
    SEPARATOR_PARAMETER: {replace: {source: $SEPARATOR, replace: '^(.+)$', by: ', $1'}}
fix: $AGG($VALUE$SEPARATOR_PARAMETER) filter (where $COND)
message: '`$AGG` folds a conditional that answers null outside `$COND`'
note: 'Use `<aggregate>(<value>) filter (where <condition>)`'
