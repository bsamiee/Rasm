# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
files: ['**/main.ts', '**/main.tsx']
ignores: ['tests/**']
rule:
    kind: export_statement
    all:
        - inside: {kind: program}
        - not: {regex: '^export[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]+default(?-u:\b)'}
message: 'Program root exports a value'
note: 'Move the value into a module beside `main.ts` and import it there, `main.ts` holding composition and the run'
