# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-calendar-arithmetic
language: rust
severity: error
rule:
    kind: 'binary_expression, call_expression, array_expression, match_pattern'
    pattern: $SITE
    matches: rust-calendar-rule
message: '`$SITE` restates a Gregorian calendar rule by hand'
note: 'Call `in_leap_year`, `days_in_month`, or `day_of_year` on a `jiff::civil::Date`, `Date` holds the leap and month-length rules a literal table or remainder test repeats'
