banned-module-level-imports = [
    "adbc_driver_flightsql",
    "adbc_driver_snowflake",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "tensorstore",
    "xarray",
    "xrspatial",
]

