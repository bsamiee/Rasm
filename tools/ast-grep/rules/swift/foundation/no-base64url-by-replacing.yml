# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-base64url-by-replacing
language: swiftlang
severity: error
rule:
    kind: call_expression
    any:
        - pattern: '$DATA.base64EncodedString().replacing($FROM, with: $_)'
        - pattern: '$DATA.base64EncodedString().replacingOccurrences(of: $FROM, with: $_)'
constraints:
    FROM: {regex: '^"[+/=]"$'}
message: 'Text replacement converts `$DATA.base64EncodedString()` to the URL alphabet or strips its padding'
note: 'Pass `.base64URLAlphabet` or `.omitPaddingCharacter` to `<data>.base64EncodedString(options:)`'
