id: rust-member-trait
role: member
parentRuleIds: [rust-mod, rust-function-owner, rust-method-owner, rust-impl, rust-trait-impl]
symbolType: interface
variants: [trait]
rule:
    any:
        - {kind: 'trait_item, trait_alias', not: {matches: holding}, all: [{any: [{kind: trait_item}, {not: {matches: broken}}]}, {matches: declared}, {matches: enclosing}, {matches: declaration}], has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}}
        - {kind: type_identifier, all: [{inside: {kind: trait_item, field: name, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {matches: declaration}]}}, {pattern: {context: 'struct $NAME;', selector: type_identifier}}]}
    matches: attributed
name: $QUALIFIER$NAME
signature: $ATTRIBUTED$SIGNATURE
isPublic: {all: [{matches: visible}, {matches: exposed}]}
