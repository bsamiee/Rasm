# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: template_string
    pattern: $TEMPLATE
    all:
        - not: {has: {kind: 'string_fragment, escape_sequence'}}
        - has: {kind: template_substitution, nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, has: {pattern: $VALUE}}
        - not: {has: {kind: template_substitution, nthChild: {position: 2, ofRule: *code}}}
        - any:
            - inside: {kind: member_expression, field: object}
            - inside: {kind: template_substitution}
message: '`$TEMPLATE` converts `$VALUE` to a string through a template'
note: 'Call `String(<value>)`, an untagged template substitutes `<value>` itself'
