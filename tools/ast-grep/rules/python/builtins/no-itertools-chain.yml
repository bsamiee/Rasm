# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-itertools-chain
language: python
severity: error
ignores: ['.claude/skills/use-blender/scripts/*.py', '.claude/skills/use-rhino/scripts/*.py', 'tools/interface/**']
utils:
    chain-function:
        matches: {python-member-use: {module: {regex: '^itertools$'}, name: {regex: '^chain$'}}}
    chain-head:
        any:
            - matches: chain-function
            - kind: list_splat
              has: {matches: chain-function}
    fixed-chain:
        kind: call
        all:
            - has: {field: function, matches: chain-head}
            - has:
                field: arguments
                any:
                    - kind: generator_expression
                    - kind: argument_list
                      has: {pattern: $_}
                      not: {has: {kind: 'list_splat, dictionary_splat, keyword_argument'}}
    spread-chain:
        kind: call
        any:
            - all:
                - has: {field: function, kind: attribute, all: [{has: {field: object, matches: chain-head}}, {has: {field: attribute, regex: '^from_iterable$'}}]}
                - has:
                    field: arguments
                    any:
                        - kind: generator_expression
                        - kind: argument_list
                          has: {nthChild: 1, not: {kind: 'list_splat, dictionary_splat, keyword_argument'}}
                          not: {has: {nthChild: 2}}
            - all:
                - has: {field: function, matches: chain-head}
                - has: {field: arguments, kind: argument_list, has: {kind: list_splat}, not: {has: {kind: 'dictionary_splat, keyword_argument'}}}
    chain-call:
        any: [{matches: fixed-chain}, {matches: spread-chain}]
    collector:
        matches: {python-builtin-name: {name: {regex: '^(list|set|tuple)$'}}}
    wrapper:
        matches: {python-builtin-name: {name: {regex: '^(frozenset|sorted)$'}}}
    display-head:
        any:
            - kind: list_splat
            - kind: attribute
              has: {field: object, kind: list_splat}
    bare-source:
        not: {kind: 'conditional_expression, lambda, named_expression'}
    single-source:
        has: {field: arguments, any: [{kind: generator_expression}, {not: {has: {nthChild: 2}}}]}
rule:
    pattern: $M
    not: {matches: python-commented}
    any:
        - kind: call
          all:
            - has: {field: function, matches: collector}
            - has: {field: arguments, kind: argument_list, has: {nthChild: 1, matches: chain-call, pattern: $K}, not: {has: {nthChild: 2}}}
        - kind: call
          matches: chain-call
          pattern: $K
          nthChild: 1
          inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: wrapper}}}
        - kind: list_splat
          has: {matches: chain-call, pattern: $K}
        - kind: 'list, set'
          has: {nthChild: 1, matches: chain-call, has: {field: function, matches: display-head}, pattern: $K}
          not: {has: {nthChild: 2}}
rewriters:
    - id: star
      rule: {pattern: $ITEM}
      fix: '*$ITEM'
    - id: fixed-items
      rule: {kind: call, matches: fixed-chain, pattern: '$CHAIN($$$ITEMS)', has: {field: arguments, kind: argument_list}}
      transform:
        STARRED: rewrite($$$ITEMS, rewriters=[star], joinBy=', ')
      fix: $STARRED
    - id: generator-items
      rule: {kind: call, matches: fixed-chain, has: {field: arguments, kind: generator_expression, pattern: $GENERATOR}}
      fix: '*$GENERATOR'
    - id: bare-from-iterable
      rule:
        kind: call
        all:
            - has: {field: function, kind: attribute, has: {field: attribute, regex: '^from_iterable$'}}
            - has: {field: arguments, any: [{kind: generator_expression, pattern: $SOURCE}, {has: {nthChild: 1, matches: bare-source, pattern: $SOURCE}}]}
      fix: '*iterable for iterable in $SOURCE'
    - id: from-iterable
      rule:
        kind: call
        all:
            - has: {field: function, kind: attribute, has: {field: attribute, regex: '^from_iterable$'}}
            - has: {field: arguments, has: {nthChild: 1, pattern: $SOURCE}}
      fix: '*iterable for iterable in ($SOURCE)'
    - id: bare-sole-splat
      rule: {kind: call, has: {field: arguments, not: {has: {nthChild: 2}}, has: {kind: list_splat, has: {matches: bare-source, pattern: $SOURCE}}}}
      fix: '*iterable for iterable in $SOURCE'
    - id: sole-splat
      rule: {kind: call, has: {field: arguments, not: {has: {nthChild: 2}}, has: {kind: list_splat, has: {pattern: $SOURCE}}}}
      fix: '*iterable for iterable in ($SOURCE)'
    - id: mixed-splat
      rule: {kind: call, has: {field: arguments, pattern: $SOURCES}}
      fix: '*iterable for iterable in $SOURCES'
    - id: list-collector
      rule: {kind: call, has: {field: function, regex: '^list$'}}
      fix: '[|]'
    - id: set-collector
      rule: {kind: call, has: {field: function, regex: '^set$'}}
      fix: '{|}'
    - id: tuple-spread
      rule:
        kind: call
        all:
            - has: {field: function, regex: '^tuple$'}
            - has: {field: arguments, has: {matches: spread-chain}}
      fix: 'tuple(|)'
    - id: tuple-single
      rule:
        kind: call
        all:
            - has: {field: function, regex: '^tuple$'}
            - has: {field: arguments, has: {matches: single-source}}
      fix: '(|,)'
    - id: tuple-fixed
      rule: {kind: call, has: {field: function, regex: '^tuple$'}}
      fix: '(|)'
    - id: wrapped-set
      rule: {kind: call, matches: fixed-chain, inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^frozenset$'}}}}
      fix: '{|}'
    - id: wrapped-list
      rule: {kind: call, matches: fixed-chain}
      fix: '[|]'
    - id: wrapped-sole
      rule: {kind: call, inside: {kind: argument_list, not: {has: {nthChild: 2}}}}
      fix: '|'
    - id: wrapped-spread
      rule: {kind: call}
      fix: '(|)'
    - id: splat-spread
      rule: {kind: list_splat, has: {matches: spread-chain}}
      fix: '*(|)'
    - id: splat-fixed
      rule: {kind: list_splat}
      fix: '|'
    - id: display-list
      rule: {kind: list}
      fix: '[|]'
    - id: display-set
      rule: {kind: set}
      fix: '{|}'
transform:
    BODY: rewrite($K, rewriters=[fixed-items, generator-items, bare-from-iterable, from-iterable, bare-sole-splat, sole-splat, mixed-splat])
    WRAP: rewrite($M, rewriters=[list-collector, set-collector, tuple-spread, tuple-single, tuple-fixed, wrapped-set, wrapped-list, wrapped-sole, wrapped-spread, splat-spread, splat-fixed, display-list, display-set])
    OPEN: {replace: {source: $WRAP, replace: '^(.*)\|.*$', by: '$1'}}
    CLOSE: {replace: {source: $WRAP, replace: '^.*\|(.*)$', by: '$1'}}
fix: $OPEN$BODY$CLOSE
message: '`$M` collects iterables through a chain object'
note: 'Unpack each iterable into the display, `[*<a>, *<b>]`, or into a comprehension, `[*<iterable> for <iterable> in <iterables>]`'
