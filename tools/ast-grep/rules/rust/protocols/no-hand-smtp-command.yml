# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-hand-smtp-command
language: rust
severity: error
rule:
    kind: string_literal
    pattern: $COMMAND
    regex: '^b?"(MAIL FROM:|RCPT TO:|EHLO |HELO )'
    any:
        - inside: {kind: token_tree, inside: {kind: macro_invocation, has: {field: macro, regex: '^((::)?(std|core|alloc)::)?(format|format_args|write|writeln)$'}}}
        - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^(write|write_all|send|extend_from_slice|push_str)$'}}}}
message: '`$COMMAND` writes an SMTP command by hand'
note: 'Build mail with `lettre::Message::builder()` and send it with `AsyncSmtpTransport::send`, the transport writes envelope commands, negotiates TLS and authentication, and reads each reply code'
