# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-string-default-java
language: java
severity: error
utils:
    empty-string:
        kind: string_literal
        not: {has: {kind: 'string_fragment, escape_sequence'}}
    empty-default:
        any:
            - matches: empty-string
            - kind: method_invocation
              all:
                - has: {field: name, regex: '^(orElse|getOrDefault|requireNonNullElse|getProperty|toString|get)$'}
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, matches: empty-string}}
            - kind: method_invocation
              all:
                - has: {field: name, regex: '^(orElseGet|requireNonNullElseGet)$'}
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, kind: lambda_expression, has: {field: body, matches: empty-string}}}
            - kind: ternary_expression
              any: [{has: {field: consequence, matches: empty-string}}, {has: {field: alternative, matches: empty-string}}]
    subject:
        any:
            - {kind: identifier, pattern: $NAME}
            - {kind: field_access, all: [{has: {field: object, kind: this}}, {has: {field: field, pattern: $NAME}}]}
    tested:
        any:
            - kind: method_invocation
              all: [{has: {field: name, regex: '^(isEmpty|isBlank)$'}}, {has: {field: object, matches: subject}}]
            - kind: method_invocation
              all:
                - has: {field: name, regex: '^(equals|contentEquals|equalsIgnoreCase)$'}
                - any:
                    - all: [{has: {field: object, matches: subject}}, {has: {field: arguments, has: {matches: empty-string}}}]
                    - all: [{has: {field: object, matches: empty-string}}, {has: {field: arguments, has: {matches: subject}}}]
                    - all: [{has: {field: object, regex: '^(java\.util\.)?Objects$'}}, {has: {field: arguments, has: {matches: subject}}}, {has: {field: arguments, has: {matches: empty-string}}}]
            - kind: binary_expression
              all:
                - has: {kind: method_invocation, all: [{has: {field: name, regex: '^length$'}}, {has: {field: object, matches: subject}}]}
                - has: {kind: decimal_integer_literal, regex: '^0$'}
rule:
    matches: empty-default
    all:
        - any:
            - inside:
                kind: variable_declarator
                field: value
                has: {field: name, pattern: $NAME}
                inside: {kind: 'field_declaration, local_variable_declaration', has: {field: type, regex: '^(String|var)$'}}
            - inside: {kind: assignment_expression, field: right, all: [{has: {field: operator, pattern: $$_OPERATOR, regex: '^=$'}}, {has: {field: left, matches: subject}}]}
        - inside:
            kind: method_declaration, constructor_declaration, compact_constructor_declaration, lambda_expression, static_initializer, class_body
            stopBy: {kind: 'method_declaration, constructor_declaration, compact_constructor_declaration, lambda_expression, static_initializer, class_body'}
            has: {stopBy: end, matches: tested}
message: '`$NAME` defaults to an empty string standing for absence'
note: Declare `Optional<String>` and test its presence, an empty string stays a value
