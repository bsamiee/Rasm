# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-option-item-test-by-hand
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - any:
            - pattern: $X.is_some_and(|$I| $I.$TEST($CX, $NAME))
            - pattern: $X.is_some_and(|&$I| $I.$TEST($CX, $NAME))
        - not: {matches: rust-trait-of-assoc-test}
constraints:
    TEST: {regex: '^(is_diag_item|is_lang_item)$'}
fix: $X.$TEST($CX, $NAME)
message: '`$X.is_some_and(..)` opens the `Option` only to call `$TEST` on its value'
note: 'Call the test on the `Option` itself (`use clippy_utils::res::MaybeDef as _;`), `MaybeDef` for `Option<T>` answers `false` for `None`'
