# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-stray-text-in-group
language: xml
severity: error
utils:
    # Text with a character outside whitespace, or a reference the parser splits from the text around it
    stray: {any: [{kind: CharData, regex: '\S'}, {kind: EntityRef}, {kind: CharRef}]}
rule:
    pattern: _TEXT
    matches: stray
    # Container names can also name properties or metadata, where text is the value
    not:
        any:
            - inside:
                kind: content
                inside:
                    kind: element
                    inside:
                        kind: content
                        inside:
                            any:
                                - matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}
                                - kind: element
                                  inside:
                                    kind: content
                                    inside: {matches: {msbuild-element: {name: {regex: '^(ItemGroup|ItemDefinitionGroup)$'}}}}
            - inside:
                matches: {msbuild-element: {name: {regex: '^ProjectExtensions$'}}}
                stopBy: end
    any:
        # Containers of MSBuild, solution, and NuGet configuration files hold elements alone
        - inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: "^(Project|PropertyGroup|ItemGroup|ItemDefinitionGroup|Target|Choose|When|Otherwise|Solution|Folder|configuration|packageSources|disabledPackageSources|packageSourceMapping|packageSource|config)$"}}}}}
        # Items hold metadata elements and no text, an item under ItemGroup is the second container level
        - inside:
            kind: content
            inside:
                kind: element
                inside:
                    kind: content
                    inside: {matches: {msbuild-element: {name: {regex: '^ItemGroup$'}}}}
transform:
    # The text up to its last non-whitespace character, the whitespace before the next node stays
    STRIPPED: {replace: {source: $TEXT, replace: '(?s)^.*\S', by: ''}}
fix: $STRIPPED
message: Text sits between the elements of a group, MSBuild rejects it with MSB4025 or reads it as a value
note: Delete the stray characters and keep the whitespace between the elements
