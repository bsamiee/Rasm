# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-rust
language: rust
severity: error
utils:
    state-write:
        any:
            - kind: call_expression
              has:
                field: function
                kind: field_expression
                all:
                    - has: {field: value, kind: identifier, pattern: $STATE}
                    - has: {field: field, matches: rust-growing-method}
            - kind: 'compound_assignment_expr, assignment_expression'
              has: {field: left, kind: identifier, pattern: $STATE}
    valued-return:
        kind: return_expression
        has: {pattern: $FOUND, not: {kind: call_expression, all: [{has: {field: function, regex: '^Some$'}}, {has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $ELEMENT}, not: {has: {nthChild: 2}}}}]}}
    valued-break:
        kind: break_expression
        has: {pattern: $FOUND, not: {kind: label}}
    pushing-fold:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(fold|try_fold)$'}}
            - has: {field: arguments, has: {nthChild: 1, matches: rust-default-value}}
            - has:
                field: arguments
                has:
                    nthChild: 2
                    kind: closure_expression
                    all:
                        - has: {field: parameters, has: {nthChild: 1, regex: '^mut\s+\w+$', has: {kind: identifier, pattern: $STATE}}}
                        - has: {field: body, kind: block, all: [{has: {kind: expression_statement, has: {nthChild: 1, matches: element-write}}}, {has: {nthChild: {position: 1, reverse: true, ofRule: {matches: rust-statement}}, any: [{pattern: $STATE}, {pattern: Ok($STATE)}, {pattern: Some($STATE)}]}}]}
    element-write:
        kind: call_expression
        has: {field: function, kind: field_expression, all: [{has: {field: value, kind: identifier, pattern: $STATE}}, {has: {field: field, regex: '^(push|push_back|push_front|insert)$'}}]}
rule:
    any:
        - matches: rust-statement-loop
          any:
            - kind: for_expression
              has: {field: pattern, any: [{kind: identifier, pattern: $ELEMENT}, {kind: reference_pattern, has: {kind: identifier, pattern: $ELEMENT}}, {pattern: $ELEMENT}]}
            - not: {kind: for_expression}
          has:
            field: body
            has:
                stopBy: {kind: 'loop_expression, while_expression, for_expression, closure_expression'}
                any:
                    - matches: state-write
                    - matches: valued-return
                    - matches: valued-break
        - matches: pushing-fold
labels:
    STATE: {style: secondary, message: 'Written each pass'}
    FOUND: {style: secondary, message: 'Returned from inside the loop'}
message: 'Loop or `fold` computes its result statement by statement'
note: 'Build the value with one adapter chain: `.map(<f>).collect()` builds, `.filter(<test>)` keeps, `.sum()` or `.fold(<initial>, <f>)` accumulates, `.max()`, `.min()`, or `.reduce(<f>)` selects an extreme, `.any`, `.all`, `.find`, `.position`, or `.find_map` stops at the first match, and a fallible traversal over independent elements collects into `validated::Validated`'
