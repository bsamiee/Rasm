# --- [PACKAGE] --------------------------------------------------------------------------

# --- [IDENTITY]
[package]
name                 = "rasm-mcp-bridge"
version.workspace    = true
categories           = ["command-line-utilities", "network-programming"]
edition.workspace    = true
keywords             = ["mcp", "modelcontextprotocol", "stdio", "streamable-http", "proxy"]
license.workspace    = true
repository.workspace = true
description          = "Bridges a stdio MCP server to Streamable HTTP"

# --- [NX]
[package.metadata.nx.targets."test:integration"]
command = "cargo nextest run --locked --package {projectName} --run-ignored only"

# --- [TARGETS] --------------------------------------------------------------------------

# --- [BIN]
[[bin]]
name  = "rasm-mcp-bridge"
path  = "main.rs"
test  = false
bench = false

# --- [TEST]
[[test]]
name = "transport"
path = "../../tests/rust/tools/bridge/transport.rs"

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-util                         = { workspace = true }
tokio-stream                       = { workspace = true }
thiserror                          = { workspace = true }
rmcp                               = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
clap                               = { workspace = true }
rasm-mcp                           = { workspace = true }

# --- [TESTING]
[target."cfg(unix)".dev-dependencies]
process-wrap         = { workspace = true }
nonempty-collections = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
serde                = { workspace = true }
serde_path_to_error  = { workspace = true }
serde_json           = { workspace = true }
reqwest              = { workspace = true }
opentelemetry        = { workspace = true }
opentelemetry-otlp   = { workspace = true }
opentelemetry-proto  = { workspace = true }
testcontainers       = { workspace = true }
