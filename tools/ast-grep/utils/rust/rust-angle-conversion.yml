# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-angle-conversion
language: rustlang
utils:
    factor:
        kind: float_literal
        any:
            - regex: '^5_?7\.2_?9_?5[0-9_]*(_?f(16|32|64|128))?$'
            - regex: '^0\.0_?1_?7_?4_?5_?3[0-9_]*(_?f(16|32|64|128))?$'
rule:
    kind: 'binary_expression, call_expression'
    any:
        - matches:
            rust-scaled-ratio:
                numerator: {matches: rust-angle-turn, regex: 'PI$'}
                denominator: {matches: rust-angle-turn, regex: '^180'}
        - matches:
            rust-scaled-ratio:
                numerator: {matches: rust-angle-turn, regex: '^180'}
                denominator: {matches: rust-angle-turn, regex: 'PI$'}
        - matches:
            rust-scaled-ratio:
                numerator: {matches: rust-angle-turn, regex: 'TAU$'}
                denominator: {matches: rust-angle-turn, regex: '^360'}
        - matches:
            rust-scaled-ratio:
                numerator: {matches: rust-angle-turn, regex: '^360'}
                denominator: {matches: rust-angle-turn, regex: 'TAU$'}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\*$'}
            - any: [{has: {field: left, matches: factor}}, {has: {field: right, matches: factor}}]
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^/$'}
            - has: {field: right, matches: factor}
        - pattern: $_VALUE.mul_add($_FACTOR, $_OFFSET)
          has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: factor}}
