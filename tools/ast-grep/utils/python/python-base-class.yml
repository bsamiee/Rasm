# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-base-class
language: python
arguments: [superclasses]
utils:
    declaration:
        kind: class_definition
        all:
            - has: {field: name, pattern: $BASE}
            - has: {field: superclasses, matches: superclasses}
rule:
    kind: identifier
    pattern: $BASE
    inside:
        stopBy: end
        all:
            - inside: {kind: 'module, block'}
            - follows:
                stopBy: end
                kind: 'class_definition, decorated_definition'
                any:
                    - matches: declaration
                    - has: {kind: class_definition, matches: declaration}
