id: no-string-test-of-number
valid:
    # The corrected form
    - ((h == 1)) || finding
    # Two strings
    - '[[ $s == abc ]] && x=1'
    # A pattern, the star makes a word
    - '[[ $x == 1* ]] && x=1'
    # A regex match
    - '[[ $v =~ ^1$ ]] && x=1'
    # A unary test
    - '[ -z "$h" ] || finding'
    # Two expansions, no number
    - '[[ $a -eq $b ]] && x=1'
    # A file test operator beside a number
    - '[[ $f -nt 1 ]] && x=1'
    # Two comparisons joined, no-string-test-of-number-by-hand owns the form
    - '[[ $h -eq 1 && $j -eq 2 ]]'
    # A negated comparison, no-string-test-of-number-by-hand owns the form
    - '[[ ! $h -eq 1 ]]'
    # The test builtin with a unary operator
    - test -n "$h"
    # The test builtin joining two comparisons by -a, shellcheck SC2166's
    - test "$h" = 1 -a "$j" = 2
    # A single-quoted word, no number
    - "[[ $s == 'abc' ]]"
    # expr compares by its own operators
    - x=$(expr "$h" = 1)
    # The test builtin with a file operator beside a number
    - test "$f" -nt 1
    # A parenthesized comparison, no-string-test-of-number-by-hand owns the form
    - '[[ ( $h -eq 1 ) ]]'
    # A word opening with a digit
    - '[[ $h == 1a ]]'
    # A hexadecimal literal is a word
    - '[[ $h == 0x1f ]]'
invalid:
    # An array element keeps its braces
    - '[[ ${arr[0]} == 1 ]]'
    # A positional parameter keeps its $
    - '[[ $1 -eq 1 ]]'
    # A command substitution as the operand
    - '[[ $(wc -l <f) -eq 0 ]]'
    # A quoted parameter under [[ ]]
    - '[[ "$h" == 1 ]]'
    # An expansion with an operator keeps its braces
    - '[[ ${h:-0} -gt 1 ]]'
    # The test as a loop condition
    - 'while [[ $i -lt 10 ]]; do ((i++)); done'
    # A negative number on the left
    - '[[ -1 -eq $x ]]'
    # The test builtin with the number on the left
    - test 1 -lt "$n"
    # The test builtin spelled by name
    - test "$h" = 1
    # The test builtin with a quoted number
    - test "$h" -ge "1"
    # A double-quoted number
    - '[[ $h == "1" ]]'
    # A single-quoted number
    - "[[ $h == '1' ]]"
    # A negative number
    - '[[ $x == -1 ]]'
    # A lexical operator against a number, 10 sorts before 9
    - '[[ $n > 9 ]]'
    # The instance, = against a number under [ ]
    - '[ "$h" = 1 ] || finding'
    # == under [[ ]]
    - '[[ $h == 1 ]] && x=1'
    # An arithmetic operator under [ ]
    - '[ "$n" -ge 1 ] && x=1'
    # A special parameter keeps its $
    - '[[ $# -eq 2 ]]'
    # Braces and quotes leave
    - '[ "${c}" != 0 ]'
    # The number on the left
    - '[[ 1 -lt $n ]]'
