# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-clap-name-literal
language: rust
severity: error
utils:
    key:
        kind: identifier
        pattern: $KEY
        regex: '^(long|id|name)$'
        follows: {regex: '^[,(]$'}
    keyed:
        any:
            - follows: {regex: '^=$', follows: {matches: key}}
              inside: {kind: token_tree, inside: {kind: attribute, field: arguments}}
            - inside:
                kind: token_tree
                regex: '^\('
                follows: {matches: key}
                inside: {kind: token_tree, inside: {kind: attribute, field: arguments}}
    semantic-group:
        kind: attribute_item
        regex: '(?s)^#\[\s*group\s*\(.*\b(required|multiple|requires|requires_all|conflicts_with|conflicts_with_all)\b'
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $NAME
    all:
        - regex: '^r?#*"[A-Za-z][A-Za-z0-9]*([-_][A-Za-z0-9]+)*"#*$'
        - not: {regex: '^r?#*"(self|Self|super|crate)"#*$'}
        - matches: keyed
        - inside:
            kind: attribute
            stopBy: {kind: attribute}
            any:
                - has: {nthChild: 1, kind: identifier, regex: '^(arg|clap|command|value)$'}
                - all:
                    - has: {nthChild: 1, kind: identifier, regex: '^group$'}
                    - not:
                        inside:
                            kind: attribute_item
                            any:
                                - matches: semantic-group
                                - precedes: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: semantic-group}
                                - follows: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: semantic-group}
        - not: {matches: rust-test-scope}
message: '`$KEY` spells `$NAME` in place of the name clap derives from the item or package'
note: 'Name the item or package after the literal, delete the key or `long`''s value, with `#[value(rename_all)]` on `ValueEnum`, `#[group(skip)]` on `Args`'
