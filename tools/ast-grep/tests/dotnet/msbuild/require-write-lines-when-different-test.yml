id: require-write-lines-when-different
valid:
    - |
      <WriteLinesToFile File="version.txt" Lines="$(Version)" Overwrite="true" WriteOnlyWhenDifferent="true" />
    - |
      <OtherTask Overwrite="true" />
    - |
      <WriteLinesToFile File="log.txt" Lines="body" />
    - |
      <WriteLinesToFile File="log.txt" Lines="body" Overwrite="false" />
    - |
      <WriteLinesToFile File="log.txt" Lines="body" Overwrite="$(Replace)" />
    - |
      <WriteLinesToFile File="log.txt" Lines="body" Other="true" />
    - |
      <WriteLinesToFile File="stamp.txt" Lines="stamp" Overwrite="true" WriteOnlyWhenDifferent="false" />
    - |
      <WriteLinesToFile File="version.txt" Lines="$(Version)" Overwrite="true" WriteOnlyWhenDifferent="$(Compare)" />
    - |
      <WriteLinesToFile File="item.txt" Lines="body" Overwrite="true" WriteOnlyWhenDifferent='true' />
invalid:
    - |
      <WriteLinesToFile File="version.txt" Lines="$(Version)" Overwrite="true" />
    - |
      <WriteLinesToFile File="version.txt" Lines="$(Version)" Overwrite = 'True'/>
    - |
      <WriteLinesToFile File="version.txt" Lines='text WriteOnlyWhenDifferent="false" suffix' Condition="'$(Count)' > '0'" Overwrite="true"></WriteLinesToFile>
    - |
      <WriteLinesToFile File="item.txt" Lines="body" Overwrite="true"></WriteLinesToFile>
    - |
      <WriteLinesToFile Overwrite="true" File="item.txt" Lines="body" />
    - |
      <WriteLinesToFile File="item.txt" Lines="body" Overwrite="yes" />
