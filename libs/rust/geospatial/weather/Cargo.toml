# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-weather"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["weather", "epw", "grib2", "climate"]
categories           = ["science::geo", "parser-implementations"]
description          = "Weather at a site: EPW and GRIB2 series, design conditions, psychrometrics, comfort, and sky matrices"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
csv                  = { workspace = true }
serde                = { workspace = true }
serde_with           = { workspace = true }
bounded-integer      = { workspace = true }
jiff                 = { workspace = true }
gauss-quad           = { workspace = true }
nalgebra             = { workspace = true }
ndarray              = { workspace = true }
ndarray-interp       = { workspace = true }
statrs               = { workspace = true }
basin                = { workspace = true }
uom                  = { workspace = true }
grib                 = { workspace = true }
solar-positioning    = { workspace = true }
thermalcomfort       = { workspace = true }
rasm-proximity       = { workspace = true, optional = true }
rasm-site            = { workspace = true }
rasm-solar-geometry  = { workspace = true }

# --- [FEATURES] -------------------------------------------------------------------------

[features]
default   = ["proximity"]
proximity = ["dep:rasm-proximity", "rasm-solar-geometry/proximity"]

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
