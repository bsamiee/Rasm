# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-plain-text-secret
language: rust
severity: error
utils:
    secret-name:
        regex: '(?i)^(\w+_)?(password|passphrase|passcode|secret|secret_key|api_?key|credentials?|bearer|authorization|private_key|(access|refresh|auth|bearer|session|id|api|oauth|jwt)_token)(_(bytes|text|str|string|value|raw|plain))?$'
    owned-text-type:
        regex: '^(Option<\s*)?((::)?(std::)?(string::)?String|((::)?(std::)?(boxed::|sync::|rc::)?)?(Box|Arc|Rc)<\s*str\s*>|((::)?(std::)?borrow::)?Cow<\s*''\w+\s*,\s*str\s*>)(\s*>)?$'
    text-type:
        any:
            - matches: owned-text-type
            - regex: '^(Option<\s*)?(&\s*(''\w+\s+)?(mut\s+)?(str|String|\[\s*u8\s*\])|((::)?(std::)?(vec::)?)?Vec<\s*u8\s*>|\[\s*u8\s*;[^\]]+\]|(Box|Arc|Rc)<\s*\[\s*u8\s*\]\s*>|((::)?bytes::)?Bytes)(\s*>)?$'
    token-name:
        regex: '^token$'
rule:
    kind: 'field_declaration, parameter, let_declaration, const_item, static_item'
    pattern: $DECLARATION
    all:
        - any:
            - all:
                - any: [{has: {field: name, matches: secret-name}}, {has: {field: pattern, kind: identifier, matches: secret-name}}]
                - has: {field: type, matches: text-type}
            - all:
                - any: [{has: {field: name, matches: token-name}}, {has: {field: pattern, kind: identifier, matches: token-name}}]
                - has: {field: type, matches: owned-text-type}
        - not: {inside: {kind: parameters, inside: {matches: rust-trait-or-extern-function}}}
message: '`$DECLARATION` holds a secret as plain text'
note: 'Type the value `secrecy::SecretString`, or `secrecy::SecretSlice<u8>` for bytes, read it from configuration at the boundary in place of a literal, and call `expose_secret()` at each use'
