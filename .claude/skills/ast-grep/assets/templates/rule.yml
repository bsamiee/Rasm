# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Lint rule under ruleDirs, one rule per file with the id as the file stem, every field the scan reads
id: <rule-id> # Imperative grammar, no-<construct> or require-<shape>, unique across the tree, the file stem when omitted
language: <language>
severity: error # Omitted is hint, off skips the scan and the tests, and error alone makes the scan exit 1
files: ['<scope-glob>'] # Relative to sgconfig.yml without a ./ prefix, a glob with no directory takes an implied **/ prefix
ignores: ['<boundary-glob>'] # Tested before files and the one exclusion channel, a !-negated glob inside files matches nothing
utils:
    <util-id>: # The shape every sibling shares, referenced through matches, a global util of the same id is shadowed
        any:
            - {kind: <kind-a>}
            - {kind: <kind-b>}
rule:
    all: # Explicit all keeps list order, the clause binding a capture comes before the clauses that re-match it
        - pattern: <code with $VAR and $$$ARGS>
        - matches: <util-id>
        - has: {kind: <kind>, field: <role>, stopBy: end}
        - not: {inside: {kind: <exempting-kind>, stopBy: end}}
constraints:
    <VAR>: {regex: '<grammar>'} # Runs after the whole rule on a single-node capture, a $$$ name parses and never runs
rewriters:
    - id: <rewriter-id> # Tried on the captured nodes and their descendants, rewrite($$$ARGS, rewriters=[<rewriter-id>]) joins their fixes
      rule: {pattern: $ITEM, kind: <kind>}
      fix: <per-item template referencing $ITEM>
transform:
    <NEW>: <op>($VAR, <key>=<value>) # replace, substring, convert, or rewrite, a call with no key keeps the comma, substring($VAR,)
fix: <template referencing $VAR and $NEW> # String, {template, expandStart, expandEnd, title}, or a list of them, -U takes the first
message: <one line naming the violation, captures and transform variables interpolate>
note: <the correction as the shape to produce, no capture interpolates>
labels:
    <VAR>: {style: primary, message: '<span fact>'} # Rule or constraints captures alone, two labels leave the snapshot order random
