# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-java
language: java
severity: error
utils:
    scope: {any: [{matches: java-control-flow}, {kind: lambda_expression}, {matches: java-declaration-scope}]}
    conditioned:
        any:
            - inside: {kind: 'if_statement, while_statement, do_statement, for_statement, switch_expression, ternary_expression', field: condition, stopBy: &scope {matches: scope}}
            - inside: {kind: for_statement, field: init, stopBy: *scope}
            - inside: {kind: for_statement, field: update, stopBy: *scope}
            - inside: {kind: enhanced_for_statement, field: value, stopBy: *scope}
    nested-body:
        any:
            - has: {field: body, kind: block, has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
            - has: {field: body, any: [{matches: java-control-flow}, {has: {matches: java-control-flow, stopBy: {kind: lambda_expression}}}]}
    level:
        any:
            - matches: java-control-flow
              not: {matches: conditioned}
            - kind: lambda_expression
              all:
                - inside: {matches: java-control-flow, stopBy: {matches: java-declaration-scope}}
                - not: {matches: conditioned}
                - matches: nested-body
    boundary: {any: [{matches: level}, {matches: java-declaration-scope}]}
rule:
    matches: level
    pattern: $SCOPE
    inside:
        matches: level
        stopBy: {matches: boundary}
        inside:
            matches: level
            stopBy: {matches: boundary}
            inside:
                matches: level
                stopBy: {matches: boundary}
                not: {inside: {matches: level, stopBy: {matches: java-declaration-scope}}}
transform:
    HEAD: {replace: {source: $SCOPE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level'
note: 'Rebuild nested decisions, loops, or lambdas as a `switch` or a stream pipeline over their inputs'
