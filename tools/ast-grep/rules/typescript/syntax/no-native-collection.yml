# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-collection
language: tsx
severity: error
ignores: ['.claude/plugins/*/hooks/**']
rule:
    any:
        - kind: new_expression
          all:
            - has: {field: constructor, pattern: $NAME, regex: '^(globalThis\.)?(Map|Set)$', matches: syntax-global-reference}
            - not:
                any:
                    - inside:
                        kind: arguments
                        stopBy: {not: {any: [{matches: syntax-expression-wrapper}, {kind: 'object, pair, array'}]}}
                    - all:
                        - has: {field: constructor, regex: 'Set$'}
                        - inside: {kind: spread_element, inside: {kind: array, not: {has: {nthChild: 2}}}}
        - kind: call_expression
          has: {field: function, pattern: $NAME, regex: '^(globalThis\.)?(Map|Object)\.groupBy$', matches: syntax-global-reference}
message: '`$NAME` builds a native collection without structural key equality'
note: '`HashMap` and `HashSet` compare keys by `Equal`, `Array.groupBy` groups into a record'
