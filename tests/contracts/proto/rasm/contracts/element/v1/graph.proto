syntax = "proto3";

package rasm.contracts.element.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "rasm/contracts/element/v1/evidence.proto";
import "rasm/contracts/element/v1/substance.proto";
import "rasm/contracts/element/v1/value.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_OCCURRENCE = 1;
  OBJECT_KIND_TYPE = 2;
}

enum ReleaseVersion {
  RELEASE_VERSION_UNSPECIFIED = 0;
  RELEASE_VERSION_IFC2X3 = 1;
  RELEASE_VERSION_IFC4 = 2;
  RELEASE_VERSION_IFC4X1 = 3;
  RELEASE_VERSION_IFC4X3 = 4;
  RELEASE_VERSION_IFC4X3_ADD2 = 5;
  RELEASE_VERSION_IFC5 = 6;
}

enum ChangeAction {
  CHANGE_ACTION_UNSPECIFIED = 0;
  CHANGE_ACTION_NOCHANGE = 1;
  CHANGE_ACTION_MODIFIED = 2;
  CHANGE_ACTION_ADDED = 3;
  CHANGE_ACTION_DELETED = 4;
  CHANGE_ACTION_NOTDEFINED = 5;
}

enum ObjectState {
  OBJECT_STATE_UNSPECIFIED = 0;
  OBJECT_STATE_READWRITE = 1;
  OBJECT_STATE_READONLY = 2;
  OBJECT_STATE_LOCKED = 3;
  OBJECT_STATE_READWRITELOCKED = 4;
  OBJECT_STATE_READONLYLOCKED = 5;
}

enum RepresentationKind {
  REPRESENTATION_KIND_UNSPECIFIED = 0;
  REPRESENTATION_KIND_BODY = 1;
  REPRESENTATION_KIND_AXIS = 2;
  REPRESENTATION_KIND_FOOT_PRINT = 3;
  REPRESENTATION_KIND_BOX = 4;
  REPRESENTATION_KIND_ANNOTATION = 5;
  REPRESENTATION_KIND_SURFACE = 6;
  REPRESENTATION_KIND_PROFILE = 7;
  REPRESENTATION_KIND_CLEARANCE = 8;
  REPRESENTATION_KIND_COG = 9;
  REPRESENTATION_KIND_LIGHTING = 10;
  REPRESENTATION_KIND_REFERENCE = 11;
}

// --- [OBJECT] -----------------------------------------------------------------------------

message ClassificationWire {
  string system = 1 [(buf.validate.field).string.min_len = 1];
  string code = 2 [(buf.validate.field).string.min_len = 1];
  string edition = 3;
  optional string source = 4;
  google.type.Date edition_date = 5;
  optional string title = 6;
}

message OwnerHistoryWire {
  string owning_user = 1;
  string owning_application = 2;
  google.protobuf.Timestamp created = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp modified = 4;
  ChangeAction change_action = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ObjectState state = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message SchemaSpanWire {
  ReleaseVersion introduced_in = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional ReleaseVersion removed_in = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// The rigid frame: the origin, the local Z axis, and the local X reference direction. It stays OUT of the canonical
// bytes at its owner.
message PlacementWire {
  VectorWire location = 1 [(buf.validate.field).required = true];
  VectorWire axis = 2 [(buf.validate.field).required = true];
  VectorWire ref_direction = 3 [(buf.validate.field).required = true];
}

message RepresentationWire {
  RepresentationKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bytes key = 2 [(buf.validate.field).bytes.len = 16];
}

// `object_type` is the user-defined label pairing with `predefined_type` and is absent otherwise.
message ObjectWire {
  option (buf.validate.message).cel = {
    id: "object.representation-keys"
    message: "representation kinds must be unique"
    expression: "this.representations.map(row, row.kind).unique()"
  };

  ObjectKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string external_id = 2 [(buf.validate.field).string.pattern = "^[0-9A-Za-z_$]{22}$"];
  ClassificationWire classification = 3 [(buf.validate.field).required = true];
  repeated ClassificationWire classifications = 4;
  string predefined_type = 5;
  string name = 6;
  string tag = 7;
  repeated RepresentationWire representations = 8 [(buf.validate.field).repeated.max_items = 11];
  OwnerHistoryWire history = 9;
  SchemaSpanWire span = 10 [(buf.validate.field).required = true];
  optional string object_type = 11;
  PlacementWire placement = 12;
}

// --- [BAGS] -------------------------------------------------------------------------------

message PropertySetWire {
  string set_name = 1 [(buf.validate.field).string.min_len = 1];
  repeated NamedValueWire values = 2;
  InheritanceMode inheritance = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  EvidenceGrade source_rank = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// An unstated qualifier crosses absent and an explicitly empty spelling crosses as a present empty string.
message GroupIdentityWire {
  optional string discrimination = 1;
  optional string quality = 2;
  optional string usage = 3;
}

message GroupWire {
  string prefix = 1 [(buf.validate.field).string.min_len = 1];
  GroupIdentityWire identity = 2 [(buf.validate.field).required = true];
}

// An empty `groups` roster is an ungrouped bag.
message QuantitySetWire {
  string set_name = 1 [(buf.validate.field).string.min_len = 1];
  repeated NamedMeasureWire values = 2;
  InheritanceMode inheritance = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  EvidenceGrade source_rank = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated GroupWire groups = 5;
}

// Neutral scene-linear PBR scalars behind the content key every appearance producer reproduces.
message AppearanceWire {
  bytes appearance_key = 1 [(buf.validate.field).bytes.len = 16];
  double base_color_r = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double base_color_g = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double base_color_b = 4 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double metallic = 5 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double roughness = 6 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  double opacity = 7 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  bool transmissive = 8;
}

// --- [NODE] -------------------------------------------------------------------------------

// `content_address` is the address minted over the node under the active header tolerance, verbatim from the
// producer and never re-derived by a peer.
message NodeWire {
  bytes id = 1 [(buf.validate.field).bytes.len = 16];
  oneof payload {
    option (buf.validate.oneof).required = true;

    ObjectWire object = 2;
    MaterialWire material = 3;
    PropertySetWire property_set = 4;
    QuantitySetWire quantity_set = 5;
    AssessmentWire assessment = 6;
    AppearanceWire appearance = 7;
    CoverageWire coverage = 8;
    ObservationWire observation = 9;
  }
  bytes content_address = 10 [(buf.validate.field).bytes.len = 16];
}
