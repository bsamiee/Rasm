# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-srgb-transfer
language: rust
utils:
    transfer-power:
        kind: call_expression
        all:
            - pattern: $C.powf($E)
            - has: {field: arguments, has: {matches: srgb-exponent}}
    srgb-exponent:
        any:
            - kind: float_literal
              regex: '^2\.4(_?f(32|64))?$'
            - kind: binary_expression
              regex: '^1(\.0*)?(_?f(32|64))?\s*/\s*2\.4(_?f(32|64))?$'
            - kind: parenthesized_expression
              has: {matches: srgb-exponent}
    srgb-scale:
        kind: float_literal
        regex: '^1\.055(_?f(32|64))?$'
rule:
    any:
        - kind: float_literal
          regex: '^0\.0(4045|031308)(_?f(32|64))?$'
        - kind: call_expression
          all:
            - matches: transfer-power
            - has: {field: function, has: {field: value, has: {stopBy: end, matches: srgb-scale}}}
        - kind: binary_expression
          all:
            - not: {inside: {kind: 'binary_expression, parenthesized_expression'}}
            - has: {stopBy: {not: {kind: 'binary_expression, parenthesized_expression'}}, matches: transfer-power}
            - has: {stopBy: {not: {kind: 'binary_expression, parenthesized_expression'}}, matches: srgb-scale}
