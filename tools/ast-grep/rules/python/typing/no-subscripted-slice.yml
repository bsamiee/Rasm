# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-subscripted-slice
language: python
severity: error
metadata: {python-below: '3.15'}
rule:
    pattern: $G
    matches: {python-evaluated-subscript: {value: {matches: {python-builtin-name: {name: {regex: '^slice$'}}}}}}
message: '`$G` has no `__class_getitem__` below Python 3.15 and raises `TypeError` when subscripted'
note: 'Annotate `slice` unsubscripted or through `type <Alias> = slice[<args>]`'
