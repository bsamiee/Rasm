# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-apply-without-receiver
language: tsx
severity: error
utils:
    reflect-apply:
        has: {field: function, regex: '^((globalThis|window|self)\.)?Reflect\.apply$', matches: typescript-global-reference}
rule:
    kind: call_expression
    not: {has: {field: arguments, has: {kind: comment, stopBy: end}}}
    any:
        - matches: reflect-apply
          any:
            - pattern: $_($F, $RECEIVER, [$$$LISTED])
            - pattern: $_($F, $RECEIVER, $SPREAD)
              not: {has: {field: arguments, has: {nthChild: 3, kind: array}}}
        - pattern: $F.call($RECEIVER, $$$LISTED)
constraints:
    RECEIVER: {regex: '^(undefined|null)$'}
rewriters:
    - id: bare
      rule: {kind: 'identifier, member_expression, subscript_expression, call_expression, new_expression, parenthesized_expression', pattern: $NODE}
      fix: $NODE
    - id: wrapped
      rule: {pattern: $NODE}
      fix: ($NODE)
    - id: spread
      rule: {pattern: $NODE}
      fix: '...$NODE'
transform:
    CALLEE: rewrite($F, rewriters=[bare, wrapped])
    SPREADS: rewrite($SPREAD, rewriters=[spread])
fix: $CALLEE($$$LISTED$SPREADS)
message: '`$F` is called through `Reflect.apply` or `call` with no receiver'
note: 'Call `<function>(<arguments>)`, spreading a held argument list as `<function>(...<arguments>)`'
