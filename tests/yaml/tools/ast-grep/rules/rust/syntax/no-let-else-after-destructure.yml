id: no-let-else-after-destructure
valid:
    - |
      fn f(p: Pair) -> u32 {
          let Pair { left: Some(left), right } = p else { return 0; };
          left + right
      }
    - |
      fn f(p: Pair) -> u32 {
          let Pair { left, right } = p;
          let Some(left) = left else { return right; };
          left + right
      }
    - |
      fn f(p: Pair) -> u32 {
          let Pair { left, right } = p;
          let Some(other) = right else { return 0; };
          other
      }
invalid:
    - |
      fn f(p: Pair) -> u32 {
          let Pair { left, right } = p;
          let Some(left) = left else { return 0; };
          left + right
      }
    - |
      fn f(p: (Option<u32>, u32)) -> u32 {
          let (first, second) = p;
          let Some(first) = first else { panic!("missing") };
          first + second
      }
