# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-type-alias
language: python
severity: error
rule:
    matches: {python-module-member: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^TypeAlias$', pattern: $NAME}}}
message: '`$NAME` annotates an alias the type statement declares'
note: Write `type <Name> = <expression>`
