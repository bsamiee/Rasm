# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-function-returning-gen
language: tsxlang
severity: error
utils:
    gen-call:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^gen$'}}, {has: {field: object, pattern: $M, matches: {effect-module: {name: {regex: '\bEffect$'}}}}}]}
            - has:
                field: arguments
                all:
                    - not: {has: {nthChild: 2}}
                    - has: {nthChild: 1, kind: generator_function, not: {has: {field: parameters, has: {pattern: $_}}}}
    wrapped-gen:
        kind: call_expression
        all:
            - has: {field: arguments, all: [{not: {has: {nthChild: 2}}}, {has: {nthChild: 1, matches: gen-call}}]}
            - has: {field: function, kind: member_expression, has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Layer|Channel|Sink)$'}}}}}
    gen-effect:
        any:
            - matches: gen-call
            - matches: wrapped-gen
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, any: [{matches: gen-call}, {matches: wrapped-gen}]}}]}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^withSpan$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '\bEffect$'}}}}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: gen-call}}
    trailing-gen:
        kind: statement_block
        has: {kind: return_statement, nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}, has: {matches: gen-effect}}
    returned-gen:
        any: [{matches: gen-effect}, {matches: trailing-gen}]
    fixture-arrow:
        kind: arrow_function
        has: {field: parameters, has: {nthChild: 1, kind: required_parameter, has: {field: pattern, kind: object_pattern}}}
        inside: {kind: call_expression, stopBy: end, has: {field: function, kind: member_expression, has: {field: property, regex: '^extend$'}}}
rule:
    any:
        - kind: arrow_function
          all:
            - has: {field: body, matches: returned-gen}
            - not: {has: {regex: '^async$'}}
            - not: {matches: fixture-arrow}
        - kind: function_declaration, generator_function_declaration, function_expression
          all:
            - has: {field: body, matches: trailing-gen}
            - not: {kind: function_expression, not: {inside: {kind: 'variable_declarator, public_field_definition, pair', field: value}}}
        - kind: method_definition
          all:
            - has: {field: body, matches: trailing-gen}
            - not: {regex: '^(?:(?:static|public|private|protected|override|readonly|async)\s+)*(?:get|set)\s+[\w#\[]'}
message: 'Function returns `$M.gen` in place of declaring `$M.fn`'
note: 'Declare `Effect.fnUntraced(<generator>)`; use `Function.flow` for host runners and `Effect.fn(<name>)` for tracing'
