# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-standalone-brand
language: tsx
severity: error
rule:
    any:
        # The brand constructor at any depth of a declarator's initializer, a pipe step, a type argument call, or a refinement
        - all:
              - kind: call_expression
              - has: {field: function, regex: '^(Schema\.brand|Brand\.(nominal|refined|all))$'}
              - inside: {kind: variable_declarator, stopBy: end, has: {field: name, pattern: $NAME}}
        # The branded type declared as an alias, the type the nominal and refined constructors read
        - all:
              - kind: generic_type
              - has: {field: name, regex: '^Brand\.(Brand|Branded)$'}
              - inside: {kind: type_alias_declaration, stopBy: end, has: {field: name, pattern: $NAME}}
message: '`$NAME` declares a brand on its own, apart from the schema that owns the field'
note: >-
    Declare the brand as the field refinement of its owning Schema class, `id: Schema.String.pipe(Schema.brand("ItemId"))`
    under `class Item extends Schema.Class<Item>("Item")({ ... })`, and read the branded type through the class
