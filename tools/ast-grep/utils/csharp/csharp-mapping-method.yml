# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-mapping-method
language: csharp
utils:
    mapper-class:
        kind: class_declaration
        has:
            kind: attribute_list
            has:
                kind: attribute
                has: {field: name, regex: '^(global::)?(Riok\.Mapperly\.Abstractions\.)?Mapper(Attribute)?$'}
    user-mapping:
        has:
            kind: attribute_list
            has:
                kind: attribute
                has: {field: name, regex: '^(global::)?(Riok\.Mapperly\.Abstractions\.)?(User|Named)Mapping(Attribute)?$'}
    generated-mapping:
        all:
            - has: {kind: modifier, regex: '^partial$'}
            - not: {has: {field: body, pattern: $_}}
            - inside: {kind: declaration_list, inside: {matches: mapper-class}}
    use-argument:
        kind: attribute_argument
        has: {field: name, regex: '^Use$'}
    use-nameof:
        kind: invocation_expression
        has: {field: function, regex: '^nameof$'}
    use-helper:
        all:
            - has: {field: name, pattern: $HELPER}
            - any:
                - inside:
                    kind: declaration_list
                    inside:
                        kind: class_declaration
                        has:
                            stopBy: {kind: 'block, arrow_expression_clause'}
                            matches: use-argument
                            has:
                                any:
                                    - {matches: use-nameof, has: {field: arguments, has: {kind: argument, has: {kind: identifier, pattern: $HELPER}}}}
                                    - {kind: string_literal, has: {kind: string_literal_content, pattern: $HELPER}}
                - inside:
                    kind: compilation_unit
                    stopBy: end
                    has:
                        stopBy: {kind: 'block, arrow_expression_clause'}
                        matches: use-argument
                        has: {matches: use-nameof, has: {field: arguments, has: {kind: argument, has: {kind: member_access_expression, has: {field: name, pattern: $HELPER}}}}}
rule:
    kind: method_declaration
    any:
        - matches: user-mapping
        - matches: generated-mapping
        - matches: use-helper
