# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-copy-task-into-output
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^(Copy|Move)$'}}}
        - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^Destination(Folder|Files)$'}, value: {regex: '\$\((OutDir|OutputPath|TargetDir)\)'}}}}}
        - not: {has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^SourceFiles$'}, value: {regex: '^["'']\s*@\('}}}}}}
message: Task writes into the project output alone
note: Declare a `None` or `Content` item with `CopyToOutputDirectory`
