# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-homogeneous-tuple-type
language: swiftlang
severity: error
rule:
    kind: tuple_type
    pattern: $TUPLE
    all:
        - has: {kind: tuple_type_item, nthChild: 3}
        - has: {kind: tuple_type_item, nthChild: 1, has: {field: name, pattern: $T}}
        - not: {has: {kind: tuple_type_item, any: [{has: {nthChild: 2}}, {not: {has: {field: name, pattern: $T}}}]}}
        - not: {inside: {kind: function_type, field: params}}
message: '`$TUPLE` repeats `$T` in every unlabeled element'
note: '`[<count> of <element>]` stores a fixed count of one element type inline, read by subscript and iterated through `indices`, element reads `.0` become `[0]` and destructuring becomes subscripts. Pairs stay tuples, `Dictionary(uniqueKeysWithValues:)`, `merging`, and `zip` take and yield 2-tuples'
