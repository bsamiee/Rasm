# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-throwing-factory
language: csharplang
utils:
    total-factory-owner:
        matches: {csharp-type-name: {name: {regex: '^@?(?:(?:KeyValuePair|Tuple|ValueTuple|String)$|Immutable[A-Z]|Frozen[A-Z])'}}}
    converter-owner:
        matches: {csharp-type-name: {name: {regex: '^@?(Convert|BitConverter|XmlConvert)$'}}}
    factory-name:
        matches: {csharp-simple-name: {name: {regex: '^(?:Create|Parse|ParseExact|Get)$'}}}
rule:
    kind: member_access_expression
    any:
        - all:
            - has:
                field: expression
                any:
                    - matches: csharp-static-owner
                    - {kind: predefined_type, regex: '^(?:bool|byte|sbyte|char|short|ushort|int|uint|long|ulong|float|double|decimal)$'}
                not: {matches: total-factory-owner}
            - has: {field: name, matches: factory-name}
        - all:
            - has: {field: expression, matches: converter-owner}
            - has: {field: name, regex: '^To[A-Z]'}
