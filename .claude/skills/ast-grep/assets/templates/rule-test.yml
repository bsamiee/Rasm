# Test document under testDir, bound to its rule by id, one document per rule and one violation per case
id: <rule-id> # Tests with an id that names no rule print Configuration not found! and the run stays green
valid:
    # The correction the note states, code holding key: value text takes the block scalar or the run exits 8
    - |
      <corrected snippet>
    # Near miss per not: arm, per constraints boundary, and per stopBy bound
    - |
      <near-miss snippet>
invalid:
    # The instance the rule was derived from, the snapshot records the first match's labels and fix alone
    - |
      <violating snippet>
    # Sibling per any: branch, carrier, container, and spelling, ast-grep test -U writes the snapshots
    - |
      <sibling snippet>
