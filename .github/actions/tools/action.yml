name: Tools
description: Removes untracked files, then mise bootstrap installs the mise tools, inside a job container the Unreal rows alone under .cache of the checkout, and runs task bootstrap, which checks the Nx remote cache and installs pnpm packages

runs:
    using: composite
    steps:
        - shell: bash
          run: git clean -ffd
        - if: ${{ job.container.id != '' }}
          shell: bash
          run: |
              kept="${GITHUB_WORKSPACE}/.cache"
              tools="cmake,conda:pkgconf,dotnet,gh,github:llvm/llvm-project,github:microsoft/vcpkg-tool,hk,ninja,node,pkl,pnpm,rust,uv"
              printf "%s\n" "MISE_DATA_DIR=${kept}/mise" "RUSTUP_HOME=${kept}/mise/rustup" "CARGO_HOME=${kept}/mise/cargo" "PNPM_CONFIG_STORE_DIR=${kept}/pnpm" "MISE_ENABLE_TOOLS=${tools}" >> "${GITHUB_ENV}"
        - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
          with:
              bootstrap: true
              bootstrap_args: --only tools,task
              cache: ${{ runner.environment == 'github-hosted' }}
