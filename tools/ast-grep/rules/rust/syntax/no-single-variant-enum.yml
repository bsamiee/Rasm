# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: enum_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, all: [{has: {kind: enum_variant}}, {not: {has: {kind: enum_variant, nthChild: {position: 2, ofRule: {kind: enum_variant}}}}}]}
        - not: {matches: {rust-attributed: {attribute: {any: [{has: {kind: attribute, has: {field: path, regex: '^(serde|repr)$'}}}, {matches: {rust-derive: {trait: {regex: '^(ValueEnum|EnumString)$'}}}}]}}}}
        - not: {has: {field: body, has: {kind: attribute_item, has: {kind: attribute, has: {field: path, pattern: serde}}}}}
message: '`$NAME` declares one variant'
note: 'Declare a struct named for the variant holding its fields and attributes'
