id: swift-import
language: swiftlang
role: item
symbolType: module
rule:
    kind: import_declaration
    has: {kind: identifier, pattern: $NAME}
name: $NAME
isImport: true
isExported: {has: {kind: modifiers, has: {any: [{kind: visibility_modifier, regex: '^(?:public|package)$'}, {kind: attribute, regex: '^@_exported$'}]}}}
---
id: swift-class
language: swiftlang
role: item
symbolType: class
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: source_file}
    all:
        - has: {field: declaration_kind, regex: class}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: class_declaration, field: body}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
---
id: swift-struct
language: swiftlang
role: item
symbolType: struct
rule:
    pattern: $DECLARATION
    inside: {kind: source_file}
    has: {field: name, pattern: $NAME}
    any:
        - {kind: class_declaration, has: {field: declaration_kind, regex: struct}}
        - kind: typealias_declaration
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: class_declaration, field: body}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
---
id: swift-enum
language: swiftlang
role: item
symbolType: enum
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: source_file}
    all:
        - has: {field: body, kind: enum_class_body}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: enum_class_body, inside: {kind: class_declaration, field: body}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
---
id: swift-object
language: swiftlang
role: item
symbolType: object
utils:
    exported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: source_file}
    all:
        - has: {field: declaration_kind, regex: '^(?:actor|extension)$'}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: class_declaration, field: body}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {any: [{matches: exported}, {has: {field: body, has: {matches: exported}}}]}
---
id: swift-protocol
language: swiftlang
role: item
symbolType: interface
rule:
    kind: protocol_declaration
    pattern: $DECLARATION
    inside: {kind: source_file}
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: protocol_body, inside: {kind: protocol_declaration, field: body}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
---
id: swift-function
language: swiftlang
role: item
symbolType: function
rule:
    kind: 'function_declaration, macro_declaration'
    pattern: $DECLARATION
    inside: {kind: source_file}
    has: {kind: 'function_name, referenceable_operator', pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: function_body, inside: {kind: function_declaration, field: body}}
      fix: "\n"
    - id: definition
      rule: {kind: macro_definition, inside: {kind: macro_declaration, field: definition}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, definition, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
---
id: swift-constant
language: swiftlang
role: item
symbolType: constant
rule:
    kind: pattern
    has: {kind: 'simple_identifier, wildcard_pattern', pattern: $NAME}
    any: [{precedes: {kind: type_annotation, stopBy: {kind: pattern}, pattern: $ANNOTATION}}, {kind: pattern}]
    inside:
        kind: property_declaration
        stopBy: {kind: 'property_declaration, statements'}
        inside: {kind: source_file}
        has: {kind: value_binding_pattern, regex: let, pattern: $BINDING}
        any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: property_declaration}]
rewriters:
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    MODIFIED: {rewrite: {source: $MODIFIERS, rewriters: [closure, comment]}}
    PREFIX: {replace: {source: $MODIFIED, replace: '(.)$|[\t-\r ]*\n[\t-\r ]*', by: '$1 '}}
    ANNOTATED: {rewrite: {source: $ANNOTATION, rewriters: [comment]}}
    OPENED: {replace: {source: $ANNOTATED, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    TYPE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $PREFIX$BINDING $NAME$TYPE
isExported: {inside: {kind: property_declaration, stopBy: {kind: 'property_declaration, statements'}, has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}}
---
id: swift-variable
language: swiftlang
role: item
symbolType: variable
rule:
    kind: pattern
    has: {kind: 'simple_identifier, wildcard_pattern', pattern: $NAME}
    all:
        - any: [{precedes: {kind: type_annotation, stopBy: {kind: pattern}, pattern: $ANNOTATION}}, {kind: pattern}]
        - any: [{precedes: {kind: computed_property, stopBy: {kind: pattern}, pattern: $COMPUTED}}, {kind: pattern}]
    inside:
        kind: property_declaration
        stopBy: {kind: 'property_declaration, statements'}
        inside: {kind: source_file}
        has: {kind: value_binding_pattern, regex: var, pattern: $BINDING}
        any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: property_declaration}]
rewriters:
    - id: accessor
      rule: {kind: 'computed_getter, computed_setter, computed_modify', has: {kind: 'getter_specifier, setter_specifier, modify_specifier', pattern: $SPEC}}
      fix: $SPEC
    - id: initializer
      rule: {kind: computed_init}
      fix: init
    - id: implicit
      rule: {kind: computed_property, has: {kind: statements}}
      fix: '{ get }'
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    MODIFIED: {rewrite: {source: $MODIFIERS, rewriters: [closure, comment]}}
    PREFIX: {replace: {source: $MODIFIED, replace: '(.)$|[\t-\r ]*\n[\t-\r ]*', by: '$1 '}}
    ANNOTATED: {rewrite: {source: $ANNOTATION, rewriters: [comment]}}
    OPENED: {replace: {source: $ANNOTATED, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    TYPE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
    ACCESSORS: {rewrite: {source: $COMPUTED, rewriters: [accessor, initializer, implicit, comment]}}
    REQUIREMENTS: {replace: {source: $ACCESSORS, replace: '^(.)|[\t-\r ]*\n[\t-\r ]*', by: ' $1'}}
name: $NAME
signature: $PREFIX$BINDING $NAME$TYPE$REQUIREMENTS
isExported: {inside: {kind: property_declaration, stopBy: {kind: 'property_declaration, statements'}, has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}}
---
id: swift-operator
language: swiftlang
role: item
symbolType: operator
rule:
    kind: 'operator_declaration, precedence_group_declaration'
    pattern: $DECLARATION
    inside: {kind: source_file}
    has: {kind: 'referenceable_operator, simple_identifier', pattern: $NAME}
rewriters:
    - id: attributes
      rule: {kind: precedence_group_attributes, inside: {kind: precedence_group_declaration}}
      fix: {template: "\n", expandStart: {regex: '^\{$'}, expandEnd: {regex: '^\}$'}}
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [attributes, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: swift-macro-expansion
language: swiftlang
role: item
symbolType: event
rule:
    kind: 'macro_invocation, diagnostic'
    pattern: $DECLARATION
    inside: {kind: source_file}
    any: [{has: {kind: simple_identifier, pattern: $NAME}}, {pattern: $NAME}]
rewriters:
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    NAMED: {replace: {source: $NAME, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $NAMED
signature: $SIGNATURE
isExported: false
---
id: swift-member-struct
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol, swift-function]
symbolType: struct
utils:
    visible: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(?:public|open|package)$'}}}
    exposed:
        any:
            - matches: visible
            - inside: {kind: protocol_body}
            - inside: {kind: class_body, inside: {kind: class_declaration, matches: visible, has: {field: declaration_kind, regex: extension}}}
              not: {has: {kind: modifiers, has: {kind: visibility_modifier}}}
    public:
        matches: exposed
        not:
            inside:
                stopBy: end
                any:
                    - kind: statements
                    - kind: 'class_declaration, protocol_declaration'
                      not:
                        any:
                            - matches: exposed
                            - has: {field: declaration_kind, regex: extension}
                              not: {has: {kind: modifiers, has: {kind: visibility_modifier}}}
    owned:
        any:
            - inside: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', any: [{inside: {kind: source_file}}, {has: {field: name, pattern: $OWNER}}]}}
            - inside: {kind: statements}
rule:
    any:
        - kind: type_name
          pattern: $NAME
          inside: {kind: class_declaration, field: name, pattern: $DECLARATION, matches: owned, has: {field: declaration_kind, regex: struct}}
        - kind: typealias_declaration
          pattern: $DECLARATION
          matches: owned
          has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: class_declaration, field: body}}
      fix: "\n"
    - id: closure
      rule: {kind: lambda_literal}
      fix: '{ ... }'
    - id: comment
      rule: {kind: 'comment, multiline_comment'}
      fix: "\n"
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    OPENED: {replace: {source: $HEADER, replace: '([(<\[])[\t-\r ]*\n[\t-\r ]*|,?[\t-\r ]*\n[\t-\r ]*([)>\],]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $OPENED, replace: '[\t-\r ]*\n[\t-\r ]*', by: ' '}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {any: [{matches: public}, {inside: {kind: class_declaration, field: name, matches: public}}]}
---
id: swift-member-enum
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol, swift-function]
symbolType: enum
