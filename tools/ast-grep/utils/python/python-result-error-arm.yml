# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-result-error-arm
language: python
utils:
    result-pattern:
        kind: class_pattern
        has: {kind: dotted_name, regex: '^([A-Za-z_]\w*\.)*Result$'}
    error-keyword:
        kind: keyword_pattern
        pattern:
            context: |
                match _:
                    case Result(error=$E): pass
            selector: keyword_pattern
rule:
    kind: case_clause
    all:
        - has:
            kind: case_pattern
            has:
                matches: result-pattern
                all:
                    - has: {kind: case_pattern, has: {matches: error-keyword}}
                    - not: {has: {kind: case_pattern, not: {has: {kind: keyword_pattern, regex: '^(tag\s*=\s*["'']error["'']$|error\s*=)'}}}}
        - not: {has: {field: guard, kind: if_clause}}
        - has:
            field: consequence
            kind: block
            all:
                - has:
                    kind: return_statement
                    has:
                        kind: call
                        all:
                            - has: {field: function, regex: '^(Result\.)?Error$'}
                            - has: {field: arguments, has: {kind: identifier, pattern: $E}, not: {has: {nthChild: 2}}}
                - not: {has: {nthChild: 2}}
