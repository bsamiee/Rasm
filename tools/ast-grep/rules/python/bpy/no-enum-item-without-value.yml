# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: python
severity: error
rule:
    kind: tuple
    pattern: $ITEM
    any:
        - pattern: ($I.identifier, $I.name, $I.description)
        - pattern: ($I.identifier, $I.name, $I.description, $I.icon)
    inside:
        kind: 'generator_expression, list_comprehension, set_comprehension'
        field: body
        has:
            kind: for_in_clause
            matches: { python-attribute-iteration: { target: { kind: identifier, pattern: $I }, attribute: { regex: '^enum_items(_static(_ui)?)?$' } } }
message: '`$ITEM` drops `$I.value`, and Blender numbers each item by position, build `($I.identifier, $I.name, $I.description, $I.icon, $I.value)`'
