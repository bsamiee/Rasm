# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fetch-outside-boundary
language: tsx
severity: error
ignores: ['**/*.config.ts', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
utils:
    global-receiver: {matches: syntax-global-reference, regex: '^(globalThis|window|self)(\.(globalThis|window|self))*$'}
rule:
    all:
        - {kind: call_expression}
        - has:
            field: function
            any:
                - {matches: syntax-global-reference, regex: ^fetch$}
                - kind: member_expression
                  all:
                    - has: {field: object, matches: global-receiver}
                    - has: {field: property, regex: ^fetch$}
                - kind: subscript_expression
                  all:
                    - has: {field: object, matches: global-receiver}
                    - has: {field: index, kind: string, regex: '^[''"]fetch[''"]$'}
        - not:
            inside:
                stopBy: {matches: syntax-function-boundary}
                matches: effect-promise-boundary
message: 'The platform fetch runs outside the boundary and answers an untyped promise, the form of `HttpClient` from the context or `Effect.tryPromise` at the boundary'
note: '`HttpClient` carries typed errors, retries, and spans'
