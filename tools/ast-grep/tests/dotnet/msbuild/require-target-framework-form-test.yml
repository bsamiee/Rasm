id: require-target-framework-form
valid:
    # One framework
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>netstandard2.0</TargetFramework></PropertyGroup></Project>
    # List
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFrameworks>net10.0;netstandard2.0</TargetFrameworks></PropertyGroup></Project>
    # List held by a property, the count is unknown here
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFrameworks>$(LibraryFrameworks)</TargetFrameworks></PropertyGroup></Project>
    # The root default guards on both forms and sets the singular alone
    - |
      <Project><PropertyGroup><TargetFramework Condition="'$(TargetFramework)' == '' and '$(TargetFrameworks)' == ''">net10.0</TargetFramework>
        </PropertyGroup></Project>
    # Reference metadata naming the singular, no property
    - |
      <Project><ItemGroup><ProjectReference Include="../Tool/Tool.csproj"><SetTargetFramework>TargetFramework=net10.0</SetTargetFramework>
        </ProjectReference></ItemGroup></Project>
    # Both properties in one file, the sibling require-target-framework-form-by-hand reports it
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework>
        <TargetFrameworks>net10.0;netstandard2.0</TargetFrameworks></PropertyGroup></Project>
    # Both properties in one file under a condition, the sibling reports it
    - |
      <Project><PropertyGroup><TargetFrameworks>net10.0;netstandard2.0</TargetFrameworks>
        <TargetFramework Condition="'$(Legacy)' == 'true'">net48</TargetFramework></PropertyGroup></Project>
    # Both properties with a list in the singular, the sibling reports the pair and a rename here duplicates the plural
    - |
      <Project><PropertyGroup><TargetFramework>net10.0;netstandard2.0</TargetFramework>
        <TargetFrameworks>net10.0;netstandard2.0</TargetFrameworks></PropertyGroup></Project>
invalid:
    # List in the singular, the fix renames the tag to the plural
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0;netstandard2.0</TargetFramework></PropertyGroup></Project>
    # One framework in the plural, the fix renames the tag to the singular
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFrameworks>net10.0</TargetFrameworks></PropertyGroup></Project>
    # Conditioned list in the singular, the fix keeps the attribute
    - |
      <Project><PropertyGroup><TargetFramework Condition="'$(Multi)' == 'true'">net10.0;netstandard2.0</TargetFramework></PropertyGroup></Project>
    # Padded framework in the plural, the fix keeps the padding
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFrameworks>
        net10.0
      </TargetFrameworks></PropertyGroup></Project>
    # Comment before the list in the singular, the fix keeps the comment
    - |
      <Project><PropertyGroup><TargetFramework><!-- both --> net10.0;netstandard2.0</TargetFramework></PropertyGroup></Project>
    # Comment before one framework in the plural, the fix keeps the comment
    - |
      <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFrameworks><!-- one --> net10.0</TargetFrameworks></PropertyGroup></Project>
