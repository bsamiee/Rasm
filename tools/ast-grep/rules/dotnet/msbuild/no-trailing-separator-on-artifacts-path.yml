# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-trailing-separator-on-artifacts-path
language: xml
severity: error
rule:
    kind: CharData
    pattern: _VALUE
    inside:
        kind: content
        # A split value needs XML-aware evaluation before a text edit can preserve it.
        not: {has: {not: {kind: CharData}}}
        inside: {matches: {msbuild-property: {name: {regex: '^ArtifactsPath$'}}}}
    any:
        # Literal paths and plain property references; function arguments are not path text.
        - regex: '^\s*(?:[^$]|\$\([A-Za-z_][A-Za-z0-9_]*\))*[\\/]\s*$'
        - regex: '^\s*\$\(\[MSBuild\]::(?:NormalizeDirectory|EnsureTrailingSlash)\(\s*''[^'']*''(?:\s*,\s*''[^'']*'')*\s*\)\)\s*$'
        - regex: '^\s*\$\(\[MSBuild\]::NormalizePath\(\s*(?:''[^'']*''\s*,\s*)*''[^'']*[\\/]''\s*\)\)\s*$'
    # Removing a filesystem root separator changes the path's meaning.
    not: {regex: '^\s*(?:[\\/]+|[A-Za-z]:[\\/]+)\s*$|''(?:[\\/]+|[A-Za-z]:[\\/]+)''\s*\)\)\s*$'}
transform:
    TRIMMED:
        replace:
            source: $VALUE
            replace: '[\\/]+(\s*$|''\s*\)\)\s*$)'
            by: '$1'
    NORMALIZED:
        replace:
            source: $TRIMMED
            replace: '^(\s*\$\(\[MSBuild\]::)NormalizeDirectory\('
            by: '$1NormalizePath('
    UNSLASHED:
        replace:
            source: $NORMALIZED
            replace: '^(\s*\$\()\[MSBuild\]::EnsureTrailingSlash\('
            by: '$1[System.IO.Path]::TrimEndingDirectorySeparator('
fix: $UNSLASHED
message: ArtifactsPath supplies a trailing separator before the SDK appends its output segments
note: Write the path without a trailing separator, NormalizePath and TrimEndingDirectorySeparator keep the function's path operation
