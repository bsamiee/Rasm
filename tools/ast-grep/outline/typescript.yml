id: typescript-function-value
language: tsxlang
role: item
symbolType: function
utils:
    effect-root-binding:
        any:
            - kind: identifier, undefined, shorthand_property_identifier_pattern
              pattern: $OUTLINE_EFFECT_ROOT
            - kind: object_pattern, array_pattern, rest_pattern
              has: {matches: effect-root-binding}
            - kind: assignment_pattern, object_assignment_pattern
              has: {field: left, matches: effect-root-binding}
            - kind: pair_pattern
              has: {field: value, matches: effect-root-binding}
    effect-namespace-root:
        any:
            - kind: identifier
              pattern: $OUTLINE_EFFECT_ROOT
            - kind: nested_identifier, member_expression
              has: {field: object, matches: effect-namespace-root}
    effect-root-declaration:
        any:
            - kind: lexical_declaration, variable_declaration, using_declaration
              has: {kind: variable_declarator, has: {field: name, matches: effect-root-binding}}
            - kind: function_declaration, generator_function_declaration, class_declaration, abstract_class_declaration, enum_declaration
              has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
            - kind: internal_module, module
              has: {field: name, matches: effect-namespace-root}
            - kind: expression_statement
              has: {matches: effect-root-declaration}
            - kind: export_statement, ambient_declaration
              has: {matches: effect-root-declaration}
            - kind: import_alias
              has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_EFFECT_ROOT}
            - kind: import_statement
              has: {kind: import_require_clause, has: {kind: identifier, nthChild: 1, pattern: $OUTLINE_EFFECT_ROOT}}
    effect-root:
        kind: identifier
        pattern: $OUTLINE_EFFECT_ROOT
        not:
            inside:
                kind: statement_block
                stopBy: end
                has: {matches: effect-root-declaration}
    effect-namespace-import:
        kind: import_clause
        has: {kind: namespace_import, has: {kind: identifier, pattern: $OUTLINE_EFFECT_ROOT}}
    effect-import:
        kind: import_statement
        all:
            - not: {has: {regex: '^type$', not: {kind: identifier}}}
            - any:
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                    - has:
                        kind: import_clause
                        has:
                            kind: named_imports
                            has:
                                kind: import_specifier
                                all:
                                    - has:
                                        field: name
                                        any:
                                            - regex: '^Effect$'
                                            - kind: string
                                              not: {has: {kind: escape_sequence}}
                                              has: {kind: string_fragment, regex: '^Effect$'}
                                    - any:
                                        - has: {field: alias, pattern: $OUTLINE_EFFECT_ROOT}
                                        - has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
                                          not: {has: {field: alias, pattern: $_}}
                                    - not: {has: {regex: '^type$', not: {kind: identifier}}}
                - all:
                    - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Effect$'}}
                    - has: {matches: effect-namespace-import}
    effect-module:
        any:
            - kind: identifier
              all:
                  - matches: effect-root
                  - inside: {kind: program, stopBy: end, has: {matches: effect-import}}
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^Effect$'}
                  - has: {field: object, matches: effect-root}
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect$'}}
                                - has: {matches: effect-namespace-import}
    effect-function:
        any:
            - kind: member_expression
              all:
                  - has: {field: property, regex: '^fn(Untraced)?$'}
                  - has: {field: object, matches: effect-module}
            - kind: identifier
              all:
                  - matches: effect-root
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            kind: import_statement
                            all:
                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
                                - has: {field: source, not: {has: {kind: escape_sequence}}, has: {kind: string_fragment, regex: '^effect/Effect$'}}
                                - has:
                                    kind: import_clause
                                    has:
                                        kind: named_imports
                                        has:
                                            kind: import_specifier
                                            all:
                                                - has:
                                                    field: name
                                                    any:
                                                        - regex: '^fn(Untraced)?$'
                                                        - kind: string
                                                          not: {has: {kind: escape_sequence}}
                                                          has: {kind: string_fragment, regex: '^fn(Untraced)?$'}
                                                - any:
                                                    - has: {field: alias, pattern: $OUTLINE_EFFECT_ROOT}
                                                    - has: {field: name, pattern: $OUTLINE_EFFECT_ROOT}
                                                      not: {has: {field: alias, pattern: $_}}
                                                - not: {has: {regex: '^type$', not: {kind: identifier}}}
    function-value:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              has:
                field: function
                any:
                    - matches: effect-function
                    - kind: call_expression
                      has: {field: function, matches: effect-function}
            - kind: as_expression, satisfies_expression, parenthesized_expression, non_null_expression
              has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: function-value}
rule:
    kind: variable_declarator
    pattern: $DECLARATION
    all:
        - inside:
            kind: lexical_declaration, variable_declaration, using_declaration
            has: {regex: '^(const|let|var|using|await)$', pattern: $$KIND}
            inside:
                any:
                    - kind: program
                    - kind: statement_block
                      inside:
                          any:
                              - kind: internal_module, module
                              - kind: ambient_declaration
                                has: {regex: '^global$', not: {pattern: $_}}
                stopBy: {not: {kind: 'export_statement, ambient_declaration'}}
        - has: {field: name, kind: identifier, pattern: $NAME}
        - has: {field: value, matches: function-value}
rewriters:
    - id: block
      rule: {kind: statement_block, inside: {kind: 'arrow_function, function_expression, generator_function', field: body}}
      fix: '{…}'
    - id: expression
      rule: {pattern: $_, not: {kind: statement_block}, inside: {kind: arrow_function, field: body}}
      fix: …
transform:
    PREFIX: {replace: {source: $KIND, replace: '^await$', by: 'await using'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [block, expression]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $PREFIX $SIGNATURE
isExported:
    any:
        - inside:
            kind: ambient_declaration
            stopBy: {not: {kind: 'object_pattern, array_pattern, rest_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, variable_declarator, lexical_declaration, variable_declaration, using_declaration, statement_block, internal_module, module, expression_statement'}}
        - inside:
            kind: export_statement, ambient_declaration
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration'}}
        - inside:
            kind: program
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration, export_statement, ambient_declaration'}}
            has:
                kind: export_statement
                not: {has: {field: source, pattern: $_}}
                any:
                    - has: {kind: export_clause, has: {kind: export_specifier, has: {field: name, pattern: $NAME}}}
                    - has: {kind: identifier, pattern: $NAME}
                      any:
                          - has: {regex: '^default$'}
                          - has: {regex: '^=$'}

