cargo_metadata = "0.23.1"                                            # Cargo workspace, dependency graph, and compiler message reads
tame-index     = { version = "0.26.3", features = ["sparse"] }       # Crate versions and feature tables read from crates.io sparse index
quote          = "1.0.47"                                            # Rust token generation
syn            = { version = "3.0.9", features = ["full", "visit"] } # Rust syntax trees that code generation builds
prettyplease   = "0.3.0"                                             # Generated Rust syntax formatted as checked-in source

# --- [LINTING]
clippy_utils   = { git = "https://github.com/rust-lang/rust-clippy", rev = "aa80f9e2cf8e01661a1b679f65d3831b05b58c16" } # Type, path, and diagnostic queries over compiler HIR for lint passes
dylint_linting = "6.2.0"                                                                                                # Late lint declarations and registration entry dylint driver loads

# --- [TESTING]
approx                 = { version = "0.6.0-rc2", features = ["vec_impl", "derive"] }                                                                                                                        # Tolerance comparisons in float assertions
assert_fs              = "1.1.4"                                                                                                                                                                             # Temporary directory fixtures with path predicates
criterion              = { version = "0.8.2", features = ["async_tokio"] }                                                                                                                                   # Statistical benchmarks with saved baselines
insta                  = "1.49.0"                                                                                                                                                                            # Inline and file snapshot assertions
proptest               = { version = "1.12.0", features = ["attr-macro"] }                                                                                                                                   # Property tests with shrinking and persisted failures
proptest-derive        = "0.9.0"                                                                                                                                                                             # Strategies derived from record types
rstest                 = "0.27.0"                                                                                                                                                                            # Fixtures, parameterized cases, and per-test timeouts
similar-asserts        = "2.0.0"                                                                                                                                                                             # Diffed assertion failures over large values
testcontainers         = { version = "0.28.0", default-features = false, features = ["aws-lc-rs", "http_wait_plain", "watchdog"] }                                                                           # Disposable service containers with HTTP readiness waits and removal on termination signals, default `ring` adds ring beside aws-lc-rs
tracing-test           = "0.2.6"                                                                                                                                                                             # Captured spans and events asserted in tests
wiremock               = "0.6.5"                                                                                                                                                                             # HTTP doubles on loopback server
insta-cmd              = "0.7.0"                                                                                                                                                                             # Binary runs snapshotted with exit code and output
proptest-state-machine = "0.9.0"                                                                                                                                                                             # Model-based tests over operation sequences
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["aws-lc-rs", "localstack", "minio", "kafka", "nats", "rabbitmq", "mosquitto", "hashicorp_vault", "postgres", "redis"] } # Prebuilt service definitions that integration tests start, default `ring` adds ring beside aws-lc-rs

# --- [MEMBERS]
rasm-mcp       = { path = "libs/rust/mcp", version = "1.0.0" }       # MCP server foundation over Streamable HTTP every Rasm MCP product and the bridge serve through
rasm-telemetry = { path = "libs/rust/telemetry", version = "1.0.0" } # Subscriber, per-signal OTLP exporters, resource, and panic hook every Rasm executable runs its entry under

# --- [LINTS] ----------------------------------------------------------------------------

# --- [RUST]
[workspace.lints.rust]
ambiguous_negative_literals   = "warn"                            # `-1.abs()` negating method result in place of literal
closure_returning_async_block = "warn"                            # Closures returning `async` block, async closure is the direct form
dead_code_pub_in_binary       = "warn"                            # `pub` items of binary crates nothing reads, removals delete every mention
deprecated_in_future          = "warn"                            # Items marked deprecated from future release
deref_into_dyn_supertrait     = "warn"                            # `Deref` impls from `dyn` subtrait to supertrait object, trait upcasting shadows each
impl_trait_redundant_captures = "warn"                            # `use<..>` listing every in-scope parameter, edition 2024 `impl Trait` captures each by default
let_underscore_drop           = "warn"                            # `let _ =` dropping values with destructors at once, acquisition and release pair in one resource scope
macro_use_extern_crate        = "warn"                            # `#[macro_use] extern crate`, `use` paths import each macro from its owner
missing_debug_implementations = "warn"                            # Public types without `Debug`, boundary tracing records values with `?`
non_ascii_idents              = "warn"                            # Non-ASCII identifiers
redundant_imports             = "warn"                            # Imports the prelude or earlier `use` provides
redundant_lifetimes           = "warn"                            # Lifetime parameters that bounds make equal to another named lifetime
rust_2018_idioms              = { level = "warn", priority = -1 } # Hidden path lifetimes, inferable outlives bounds, and unused `extern crate` items
single_use_lifetimes          = "warn"                            # Named lifetimes used once, `'_` states lifetime no second position shares
unnameable_types              = "warn"                            # Types and traits public signatures expose but consumers cannot name
unreachable_pub               = "warn"                            # `pub` items unreachable from crate root, `pub(crate)` states their reach
unsafe_code                   = "forbid"                          # Unsafe code and unsafe attributes with no override, unsafe operations stay inside owning crates
unused_import_braces          = "warn"                            # `use a::{b}` braces around one import, code keeps the direct form
unused_lifetimes              = "warn"                            # Lifetime parameters nothing reads, removals delete every mention
unused_macro_rules            = "warn"                            # `macro_rules!` rules nothing invokes, removals delete every mention
unused_qualifications         = "warn"                            # Qualified paths to names in scope, code calls owning APIs in the direct form

# --- [GROUPS]
[workspace.lints.clippy]
cargo    = { level = "warn", priority = -1 } # Missing package metadata, duplicate crate versions, negative or redundant feature names, and wildcard requirements
nursery  = { level = "warn", priority = -1 } # Lints under development, code smells are fixed as found
pedantic = { level = "warn", priority = -1 } # Strict lints with occasional false positives, code smells are fixed as found

# --- [PARTIALITY]
exit                   = "warn" # `process::exit` outside `main`, boundary translates results into exit codes
expect_used            = "warn" # `expect` on `Option` and `Result`, consumers compose without unwrapping
indexing_slicing       = "warn" # Index and slice expressions that can panic, absence stays `Option`
infinite_loop          = "warn" # Endless loops in functions not returning `!`, signatures state divergence
missing_assert_message = "warn" # Assertions without message, each failure in a test or `const` block names its broken invariant
panic                  = "warn" # `panic!` calls, expected failures use the result type
string_slice           = "warn" # Every string slice, `str::get` returns `Option` in place of panicking off char boundary
todo                   = "warn" # `todo!` placeholders, work runs to completion
unimplemented          = "warn" # `unimplemented!` placeholders, work runs to completion
unreachable            = "warn" # `unreachable!` calls, invalid states stay unrepresentable at construction
unwrap_used            = "warn" # `unwrap` on `Option` and `Result`, consumers compose without unwrapping

# --- [OUTPUT]
dbg_macro      = "warn" # `dbg!` calls, telemetry goes through tracing at boundaries
pointer_format = "warn" # `{:p}` and `Debug` output holding raw or function pointers, addresses vary per run and expose memory layout
print_stderr   = "warn" # `eprint!` and `eprintln!`, domain functions write only their return value
print_stdout   = "warn" # `print!` and `println!`, domain functions write only their return value
use_debug      = "warn" # `{:?}` in format strings, text people read renders through `Display`

# --- [ATTRIBUTES]
cfg_not_test          = "warn" # `#[cfg(not(test))]` code, tests run what product runs
redundant_test_prefix = "warn" # `test_` prefixes on `#[test]` functions, each fact is stated once

# --- [RESULTS]
assertions_on_result_states = "warn" # `assert!(r.is_ok())` and `assert!(r.is_err())`, failures print no `Result` contents
let_underscore_must_use     = "warn" # `let _ =` on must-use values, control flow matches every result case
let_underscore_untyped      = "warn" # `let _ =` without type, each discard names dropped type
map_err_ignore              = "warn" # `map_err(|_| ..)` closures dropping source error, boundary mappings keep it
try_err                     = "warn" # `Err(x)?` in place of `return Err(x)` outside `try` blocks, `?` marks a call that can fail
unused_result_ok            = "warn" # `.ok()` calls discarding `Result`, control flow matches every result case

# --- [EXPRESSIONS]
deref_by_slicing                     = "warn" # `&v[..]` full-range slices, deref is the direct form
if_then_some_else_none               = "warn" # `if` choosing `Some` or `None`, `bool::then` states it as one expression
iter_over_hash_type                  = "warn" # `for` loops over `HashMap` or `HashSet`, result order stays deterministic
map_with_unused_argument_over_ranges = "warn" # `(0..n).map(|_| x)`, `repeat_n` states count directly
mixed_read_write_in_expression       = "warn" # Reads and writes of one variable ordered by operand evaluation order
pathbuf_init_then_push               = "warn" # `PathBuf` creation followed by `push`, paths build in one expression
redundant_type_annotations           = "warn" # Annotations restating initializer's type, inferred types stand
semicolon_outside_block              = "warn" # `{ f(); }` block statements, `{ f() };` is the direct form

# --- [PATTERNS]
ref_patterns             = "warn" # `ref` bindings, matching on borrowed scrutinee is the direct form
unnecessary_rest_pattern = "warn" # `..` capturing no field, patterns state exactly fields they bind

# --- [NUMERICS]
arithmetic_side_effects    = "warn" # Integer `+`, `-`, `*`, `/`, and `%` that can overflow or divide by zero, `checked_*` returns absence and `strict_*` names the panic
default_numeric_fallback   = "warn" # Literals falling back to `i32` or `f64`, each literal takes its type from its use or suffix
float_cmp_const            = "warn" # `==` and `!=` against nonzero float constants, comparisons state their tolerance
host_endian_bytes          = "warn" # `to_ne_bytes` and `from_ne_bytes`, encodings name their endianness
lossy_float_literal        = "warn" # Whole-number float literals their type cannot hold exactly
modulo_arithmetic          = "warn" # `%` over signed or float operands taking dividend's sign, `rem_euclid` states sign rule
non_zero_suggestions       = "warn" # `NonZero` values widened through plain integer, `NonZero::from` keeps invariant
precedence_bits            = "warn" # Shifts mixed with `&`, `|`, or `^` without parentheses
suspicious_xor_used_as_pow = "warn" # `2 ^ 8` read as power, `pow` states exponentiation
unseparated_literal_suffix = "warn" # `1u32` suffixes, `1_u32` is the one spelling Clippy's suggestions write

# --- [STRINGS]
needless_raw_strings = "warn" # `r"..."` literals with nothing to escape, code keeps the direct form
str_to_string        = "warn" # `str::to_string` calls, `to_owned` names conversion directly
string_add           = "warn" # `String + &str`, asymmetric `Add` that `push_str` replaces
string_lit_chars_any = "warn" # `"abc".chars().any(..)` membership tests, `matches!` states set directly

# --- [OWNERSHIP]
clone_on_ref_ptr = "warn" # `.clone()` on `Rc`, `Arc`, and `Weak`, `Arc::clone(&x)` names the shared handle it copies
empty_drop       = "warn" # Empty `Drop` impls, removals delete every mention
mem_forget       = "warn" # `mem::forget` on values with destructors, release runs on every path
rc_buffer        = "warn" # `Rc` or `Arc` over growable buffers, shared values publish as immutable `str` or slices

# --- [DECLARATIONS]
empty_enum_variants_with_brackets = "warn" # `Variant()` and `Variant {}` with no fields, `Variant` is the direct form
empty_structs_with_brackets       = "warn" # `struct S {}` and `struct S();`, `struct S;` is the direct form
inline_trait_bounds               = "warn" # Bounds inside function `<..>`, every bound sits in the `where` clause
multiple_inherent_impl            = "warn" # Inherent `impl` blocks split across crate, members stay in their type's section
same_name_method                  = "warn" # Inherent methods sharing trait method names, each call site names one member

# --- [VISIBILITY]
partial_pub_fields    = "warn" # Structs mixing public and private fields, types are plain data or guard their invariant whole
pub_without_shorthand = "warn" # `pub(in super)` visibility paths, `pub(super)` is the direct form

# --- [MODULES]
absolute_paths           = "warn" # Crate-rooted paths past two segments, preamble imports name each item
alloc_instead_of_core    = "warn" # Paths through `alloc` to items `core` owns, `core` names owner
inline_modules           = "warn" # Inline `mod` blocks outside tests, each module takes its own file
mod_module_files         = "warn" # `mod.rs` files, each module file takes its module's name
pub_use                  = "warn" # Every `pub use` re-export, items sit in owning public module
unnecessary_self_imports = "warn" # `use m::{self}` imports, code keeps the direct form
unused_trait_names       = "warn" # `use Trait` imported for its methods alone, `as _` states import serves method resolution

# --- [NAMING]
error_impl_error           = "warn" # Error types named `Error`, each names raising package
min_ident_chars            = "warn" # Single-character identifiers outside coordinate axes `w`, `x`, `y`, and `z`
module_name_repetitions    = "warn" # Item names repeating their module's name, paths state module once
renamed_function_params    = "warn" # Trait impls renaming trait parameters, trait owns each parameter name
shadow_unrelated           = "warn" # Names rebound to unrelated values, one name holds one concept
single_char_lifetime_names = "warn" # Single-character lifetime names, each lifetime names its purpose

# --- [ALLOWED]
future_not_send                     = "allow" # Demands `Sync` on generic parameters an async fn borrows, return-type notation binds `Send` at the spawning use site
literal_string_with_formatting_args = "allow" # Flags inline snapshot literals quoting a fixture's format string, insta reads snapshots from literals
manual_assert                       = "allow" # Rewrites a flagged `panic!` into a run-time assertion, expected failures use the result type
missing_errors_doc                  = "allow" # Names and types state each contract in place of doc comments
missing_panics_doc                  = "allow" # Names and types state each contract in place of doc comments
option_if_let_else                  = "allow" # Rewrites `match` and `if let` over `Option` into `map_or` or `map_or_else`, control flow selects by pattern matching result cases
redundant_pub_crate                 = "allow" # Demands `pub` on items in private modules where rustc `unreachable_pub` demands `pub(crate)`
significant_drop_tightening         = "allow" # Demands `drop` of lock guards before scope end, acquisition and release pair in one resource scope
too_many_lines                      = "allow" # Caps functions at 100 lines, data dependency decides composition in place of line count
useless_format                      = "allow" # Reports `format!` sites ast-grep `no-display-format` owns for every `Display` value and placeholder-free literal

# --- [CARGO]
[workspace.lints.cargo]
pedantic                      = { level = "warn", priority = -1 } # Binary names off kebab case and `readme` keys restating inferred file, each fact is stated once
non_kebab_case_features       = "warn"                            # Feature names off kebab case, one spelling beside kebab-case package and binary names
non_kebab_case_packages       = "warn"                            # Package names off kebab case, Nx project, package, and installed binary share one spelling
unused_workspace_dependencies = "allow"                           # Flags catalog rows held for future members, Cargo resolves inherited rows alone

# --- [PROFILES] -------------------------------------------------------------------------

[profile.dev]
debug = "line-tables-only" # Backtraces show file and line with no variable or parameter info

[profile.dev.package."*"]
debug = false # Non-member backtrace frames lack file and line

[profile.dist]
inherits        = "release" # `cargo dylint` builds lint libraries under unwinding `release`
lto             = "fat"     # Optimization across every crate at longer link time
codegen-units   = 1         # Serial codegen for code that can run faster
panic           = "abort"   # Service manager restarts process after defect panic in place of tokio catching each task panic
overflow-checks = true      # Integer overflow panics as defect in place of wrapping to wrong value
trim-paths      = "object"  # Panic locations and tracing file fields name `/cargo/registry` and `/rustc` in place of builder's home directory
