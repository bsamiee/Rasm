# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-const-context
language: rustlang
rule:
    inside:
        stopBy: {kind: 'function_item, closure_expression, const_item, static_item, const_block'}
        any:
            - kind: 'const_item, static_item, const_block'
            - kind: function_item
              has: {kind: function_modifiers, regex: '(?-u:\b)const(?-u:\b)'}
            - kind: function_item
              inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item', field: body, has: {field: constness, regex: '^const$'}}}
