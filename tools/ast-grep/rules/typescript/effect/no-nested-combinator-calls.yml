# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-combinator-calls
language: tsxlang
severity: error
utils:
    member-call:
        kind: call_expression
        has: {field: function, kind: member_expression}
    module-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}
    one-argument:
        has: {field: arguments, all: [{has: {nthChild: 1}}, {not: {has: {nthChild: 2}}}]}
    step:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$', not: {regex: '\bSchema$'}}}}}}
            - any:
                - matches: one-argument
                - has: {field: function, matches: effect-dual-operation}
    unary-step:
        all: [{matches: step}, {matches: one-argument}]
    data-first-step:
        matches: step
        has:
            field: arguments
            has: {nthChild: 1, matches: module-call}
        any:
            - matches: unary-step
            - has: {field: arguments, has: {nthChild: 2}}
rule:
    pattern: $CALL
    any:
        - kind: call_expression
          all:
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^pipe$'}
                    - has: {field: object, matches: step, all: [{has: {field: function, pattern: $OUTER}}, {has: {field: arguments, all: [{has: {nthChild: 1, matches: module-call}}, {has: {nthChild: 2}}]}}]}
            - not: {has: {kind: comment, stopBy: end}}
        - all:
            - matches: member-call
            - has: {field: arguments, has: {nthChild: 1, matches: member-call, has: {field: arguments, has: {nthChild: 1, matches: member-call, has: {field: arguments, has: {nthChild: 1, matches: member-call}}}}}}
            - matches: data-first-step
            - has: {field: function, pattern: $OUTER}
            - has:
                field: arguments
                has:
                    nthChild: 1
                    matches: data-first-step
                    has: {field: arguments, has: {nthChild: 1, matches: data-first-step}}
            - not:
                all:
                    - nthChild: 1
                    - inside: {kind: arguments, inside: {matches: data-first-step}}
            - not: {has: {kind: comment, stopBy: end}}
            - not: {has: {kind: type_arguments, stopBy: end}}
message: '`$OUTER` nests data-first module calls four deep or under a `.pipe`'
note: 'Write `pipe(<value>, <step>, <step>, <step>)`'
labels:
    CALL: {style: primary}
