    "geoarrow-rust-core",                                                         # GeoArrow geometry array memory model under GeoRust compute kernels
    "geoarrow-rust-io; sys_platform != 'linux' or platform_machine != 'aarch64'", # GeoArrow vector IO without GDAL, no release publishes an sdist or a cp315 linux aarch64 wheel
    "geopandas",                                                                  # Geospatial frames
