# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    raw-value:
        kind: navigation_expression
        pattern: $VALUE
        has: {field: suffix, has: {field: suffix, regex: '^rawValue$'}}
rule:
    pattern: $SITE
    any:
        - kind: equality_expression
        - {kind: infix_expression, has: {field: op, regex: '^[!=]=$'}}
    all:
        - any:
            - all: [{has: {field: lhs, matches: raw-value}}, {has: {field: rhs, matches: swift-plain-string}}]
            - all: [{has: {field: lhs, matches: swift-plain-string}}, {has: {field: rhs, matches: raw-value}}]
message: '`$SITE` compares the raw value `$VALUE` with a string literal'
note: 'Compare typed value with the case (`<value> == .<case>`), or with `<Type>(rawValue: <text>)` for a raw-representable struct'
