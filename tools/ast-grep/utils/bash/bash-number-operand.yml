# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# An integer literal as a test operand, bare, negated, or inside either quote style
id: bash-number-operand
language: bash
rule:
    any:
        - kind: number
        - kind: unary_expression
          regex: '^-[0-9]+$'
        - kind: string
          regex: '^"-?[0-9]+"$'
        - kind: raw_string
          regex: "^'-?[0-9]+'$"
