# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-eval
language: bash
severity: error
ignores: ["**/*.json"]
rule:
    kind: command
    pattern: $CMD
    any:
        - has: {matches: {bash-invoked-name: {name: {regex: '^(\\|["''])?eval["'']?$'}, runner: {regex: '^(builtin|command|time)$'}}}}
        - all:
            - has: {matches: {bash-invoked-name: {name: {matches: shell-name}, runner: {regex: '^(?:\S+/)?(command|env|exec|sudo|time)$'}}}, pattern: $SHELL}
            - has: {matches: bash-expanding-word, follows: {kind: word, regex: '^-[a-zA-Z]*c[a-zA-Z]*$', follows: {pattern: $SHELL, stopBy: {not: {matches: shell-option}}}}}
utils:
    shell-name: {regex: '^(\\|["''])?(?:[^\s"'']+/)?(bash|sh|dash|ksh|zsh)["'']?$'}
    shell-option:
        kind: word
        any:
            - regex: '^([-+][a-zA-Z]+|--[a-z-]+)$'
            - follows: {kind: word, regex: '^(-[a-zA-Z]*[oO]|\+O|--(rcfile|init-file))$'}
message: '`$CMD` parses its arguments as shell code a second time'
note: Build the command in an array, `cmd=(<word> ...)` then `"${cmd[@]}"`, read a name through `${!name}`, and pass a value to `bash -c` as `$1`
