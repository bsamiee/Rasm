# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-string-tag-branch-rust
language: rust
severity: error
utils:
    tag:
        not: {inside: {kind: match_pattern, field: condition, stopBy: end}}
        any:
            - kind: string_literal
            - {kind: identifier, regex: '^[A-Z][A-Z0-9_]+$'}
    text-const:
        kind: const_item
        all:
            - has: {field: name, pattern: $FIRST}
            - has: {field: type, kind: reference_type, has: {field: type, regex: '^str$'}}
    tag-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^==$'}
            - has: {field: left, pattern: $SUBJECT}
            - has: {field: right, kind: string_literal}
    decoding-arm:
        kind: match_arm
        all:
            - has: {field: pattern, has: {stopBy: end, matches: tag}}
            - has: {field: value, matches: rust-variant-value}
    tag-arm:
        kind: match_arm
        has: {field: pattern, has: {stopBy: end, matches: tag}}
rule:
    not: {matches: rust-text-decoder}
    any:
        - kind: match_expression
          all:
            - has: {field: value, pattern: $SUBJECT}
            - has: {field: body, has: {kind: match_arm, has: {field: pattern, has: {stopBy: end, matches: tag, pattern: $FIRST}}}}
            - has: {field: body, has: {kind: match_arm, has: {field: pattern, has: {stopBy: end, matches: tag, not: {pattern: $FIRST}}}}}
            - any:
                - has: {field: body, has: {stopBy: end, kind: string_literal, pattern: $FIRST}}
                - inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: text-const}}
            - has: {field: body, has: {matches: tag-arm, not: {matches: decoding-arm}}}
        - kind: if_expression
          all:
            - not: {inside: {kind: else_clause}}
            - has: {field: condition, matches: tag-test}
            - has: {field: alternative, has: {kind: if_expression, has: {field: condition, matches: tag-test}}}
            - not: {has: {field: consequence, matches: rust-variant-value}}
        - kind: macro_invocation
          all:
            - has: {field: macro, regex: '^matches$'}
            - has: {kind: token_tree, has: {nthChild: 1, pattern: $SUBJECT}}
            - has: {kind: token_tree, has: {kind: string_literal, precedes: {regex: '^\|$', precedes: {kind: string_literal}}}}
        - kind: call_expression
          all:
            - has:
                field: function
                kind: field_expression
                all:
                    - has: {field: field, regex: '^contains$'}
                    - has: {field: value, kind: array_expression, has: {kind: string_literal, precedes: {stopBy: end, kind: string_literal}}, not: {has: {pattern: $_, not: {kind: string_literal}}}}
            - has: {field: arguments, has: {pattern: $SUBJECT}}
message: 'Branch over `$SUBJECT` selects its arm by string literal'
note: 'Declare the tokens as variants of an enum with `FromStr`, `#[derive(Deserialize)]`, or `#[derive(ValueEnum)]`, decode the text once at the boundary, and match the variants, a branch with every literal arm yielding a variant is that decode'
