# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, pattern: $WORK}
        - any:
            - all:
                - matches: swift-unstructured-task
                - has: {nthChild: 1, regex: '\.(detached|immediateDetached)$'}
            - has:
                nthChild: 1
                kind: navigation_expression
                regex: '^(Dispatch(\.|::)DispatchQueue\.global\([^)]*\)\.async|Foundation(\.|::)(Thread\.detachNewThread|OperationQueue\(\)\.addOperation))$'
            - all:
                - has: {nthChild: 1, kind: 'navigation_expression, identifier', regex: '^Foundation(\.|::)Thread$'}
                - has:
                    kind: call_suffix
                    any:
                        - has: {kind: lambda_literal}
                        - has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^block$'}}}
message: '`$WORK` runs work outside the calling task''s cancellation, priority, and isolation'
note: 'Run work as a child task through `async let` or `group.addTask`, or as an `@concurrent` function or actor method its caller awaits'
