# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    input-type:
        any:
            - kind: reference_type
              all:
                - not: {has: {kind: mutable_specifier}}
                - has: {field: type, any: [{kind: primitive_type, regex: '^str$'}, {kind: array_type, not: {has: {field: length, pattern: $_}}, has: {field: element, regex: '^(u8|char)$'}}]}
            - kind: generic_type
              regex: '^(Vec\p{Pattern_White_Space}*<\p{Pattern_White_Space}*(char|u8)\p{Pattern_White_Space}*>|Box\p{Pattern_White_Space}*<\p{Pattern_White_Space}*(str|\[\p{Pattern_White_Space}*(u8|char)\p{Pattern_White_Space}*\])\p{Pattern_White_Space}*>|(Arc|Rc)\p{Pattern_White_Space}*<\p{Pattern_White_Space}*(str|\[\p{Pattern_White_Space}*u8\p{Pattern_White_Space}*\])\p{Pattern_White_Space}*>)$'
            - kind: type_identifier
              regex: '^String$'
    self-field:
        kind: field_expression
        all:
            - has: {field: value, kind: self}
            - has: {field: field, pattern: $POS}
    input-field:
        kind: field_expression
        all:
            - has: {field: value, kind: self}
            - has: {field: field, pattern: $INPUT}
    positioned-read:
        any:
            - kind: index_expression
              all:
                - has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, any: [{matches: input-field}, {has: {stopBy: end, matches: input-field}}]}
                - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, any: [{matches: self-field}, {has: {stopBy: end, matches: self-field}}]}
            - kind: call_expression
              all:
                - has: {field: function, has: {stopBy: end, matches: input-field}}
                - has: {field: arguments, has: {stopBy: end, matches: self-field}}
rule:
    kind: struct_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, has: {kind: field_declaration, all: [{has: {field: name, pattern: $INPUT}}, {has: {field: type, matches: input-type}}]}}
        - has: {field: body, has: {kind: field_declaration, all: [{has: {field: name, pattern: $POS}}, {has: {field: type, kind: primitive_type, regex: '^usize$'}}]}}
        - inside:
            kind: source_file
            stopBy: end
            has:
                stopBy: end
                kind: impl_item
                all:
                    - has: {field: type, any: [{pattern: $NAME}, {kind: generic_type, has: {field: type, pattern: $NAME}}]}
                    - has: {field: body, has: {stopBy: end, kind: 'compound_assignment_expr, assignment_expression', has: {field: left, matches: self-field}}}
                    - has: {field: body, has: {stopBy: end, matches: positioned-read}}
message: '`$NAME` walks `$INPUT` by hand through index field `$POS`'
note: 'Parse the input through `winnow` parsers over `&str` (`LocatingSlice` for spans, `Partial` for streamed input), or `binrw` for binary layouts'
