# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-type-argument
language: tsx
severity: error
utils:
    effect-namespace:
        matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}
    defaulted:
        kind: predefined_type
        regex: '^never$'
        inside:
            kind: type_arguments
            inside: {kind: generic_type, has: {field: name, kind: nested_type_identifier, has: {field: module, matches: effect-namespace}}}
        any:
            - nthChild: n+2
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        regex: |-
                            (?x)^(
                                Effect\.Effect|Stream\.Stream|Layer\.Layer|Request\.Request|Result\.Result
                                |Fiber\.Fiber|Deferred\.Deferred|Pool\.Pool|RcRef\.RcRef|Resource\.Resource|LayerRef\.LayerRef
                                |Exit\.(Exit|Success)|Queue\.(Queue|Enqueue|Dequeue)|Take\.Take|Sink\.End
                                |TxQueue\.(TxQueue|TxEnqueue|TxDequeue)|TxDeferred\.TxDeferred
                                |Schema\.(Decoder|Encoder|ConstraintDecoder|ConstraintEncoder|withDecodingDefault(Type)?(Key)?)
                                |AsyncResult\.(AsyncResult|Initial|Success|Failure)|Atom\.(AtomRuntime|PullResult)
                                |RpcClient\.(RpcClient|FromGroup)|HttpApiClient\.(Client|ForApi)|EntityResource\.EntityResource
                                |PersistedQueue\.PersistedQueue|PersistedCache\.PersistedCache
                            )$
            - nthChild: n+3
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        regex: |-
                            (?x)^(
                                Cache\.Cache|ScopedCache\.ScopedCache|RcMap\.RcMap|LayerMap\.LayerMap|Schedule\.Schedule|Sink\.Sink
                                |Schema\.(Codec|ConstraintCodec|decodeTo)|SchemaGetter\.Getter|SchemaTransformation\.Transformation
                                |Atom\.AtomResultFn|CircuitBreaker\.Classifier
                            )$
            - nthChild: n+4
              inside: {kind: type_arguments, inside: {kind: generic_type, has: {field: name, regex: '^(Pull\.Pull|Filter\.FilterEffect)$'}}}
            - nthChild: n+7
              inside: {kind: type_arguments, inside: {kind: generic_type, has: {field: name, regex: '^Channel\.Channel$'}}}
rule:
    kind: generic_type
    all:
        - has: {field: type_arguments, pattern: $ARGUMENTS, has: {nthChild: {position: 1, reverse: true}, matches: defaulted}}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: default
      rule:
        matches: defaulted
        not: {precedes: {stopBy: end, pattern: $_, not: {regex: '^never$'}}}
      fix: ''
transform:
    DROPPED: rewrite($ARGUMENTS, rewriters=[default])
    KEPT: {replace: {source: $DROPPED, replace: '(\s*,)+\s*>', by: '>'}}
fix: $NAME$KEPT
message: '`$ARGUMENTS` restates the `never` defaults of its trailing type parameters'
note: 'Omit each trailing type argument equal to its `never` default'
