# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-itertools-chain
language: python
severity: error
rule:
    kind: call
    pattern: $CALL
    not:
        any:
            - matches: python-shadowed-name
            - has: {kind: comment, stopBy: end}
    any:
        - pattern: $COLLECT($INNER)
          has:
            field: arguments
            has:
                kind: call
                all:
                    - has: {field: function, pattern: $F}
                    - has: {field: arguments, kind: generator_expression, pattern: $GENERATOR}
        - pattern: $COLLECT($F.from_iterable($ITERABLES))
        - pattern: $COLLECT($F($$$ARGS))
          has:
            field: arguments
            has:
                kind: call
                has:
                    field: arguments
                    all:
                        - has: {pattern: $_}
                        - not: {has: {kind: 'keyword_argument, dictionary_splat'}}
constraints:
    F: {matches: {python-member-use: {module: {regex: '^itertools$'}, name: {regex: '^chain$'}}}}
    COLLECT: {kind: identifier, regex: "^(list|set)$"}
rewriters:
    - id: list-brackets
      rule: {kind: identifier, regex: '^list$'}
      fix: '[]'
    - id: set-brackets
      rule: {kind: identifier, regex: '^set$'}
      fix: '{}'
transform:
    ITER: {replace: {source: $ITERABLES, replace: "(?s)^(.+)$", by: "($1)"}}
    GROUP: {replace: {source: $$$ARGS, replace: '(?s)^(.+?)(?:,\s*)?$', by: "($1,)"}}
    GENERATOR_GROUP: {replace: {source: $GENERATOR, replace: "(?s)^(.+)$", by: "($1,)"}}
    BRACKETS: rewrite($COLLECT, rewriters=[list-brackets, set-brackets])
    OPEN: substring($BRACKETS, startChar=0, endChar=1)
    CLOSE: substring($BRACKETS, startChar=1, endChar=2)
fix: "$OPEN*iterable for iterable in $ITER$GROUP$GENERATOR_GROUP$CLOSE"
message: '`$CALL` concatenates iterables through a chain object'
note: 'Use `[*iterable for iterable in (<a>, <b>)]`'
