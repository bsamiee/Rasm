# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-spinner-for-control
language: swift
severity: error
utils:
    spinner: {kind: call_expression, regex: '^ProgressView\('}
    spinner-arm:
        matches: {swift-single-statement: {first: {matches: spinner, pattern: $SPINNER}}}
    control-arm:
        matches: {swift-single-statement: {first: {not: {matches: spinner}, pattern: $CONTROL}}}
    bound-read:
        all:
            - any:
                - has: {field: bound_identifier, pattern: $BOUND}
                - has:
                    kind: 'pattern, switch_pattern'
                    has: {stopBy: end, kind: simple_identifier, follows: {kind: value_binding_pattern}, pattern: $BOUND}
            - has: {kind: statements, not: {matches: spinner-arm}, has: {stopBy: end, pattern: $BOUND}}
rule:
    any:
        - kind: if_statement
          all:
            - has: {matches: spinner-arm}
            - has: {matches: control-arm}
            - not: {has: {kind: if_statement}}
            - not: {matches: bound-read}
        - kind: switch_statement
          all:
            - has: {kind: switch_entry, has: {matches: spinner-arm}}
            - has: {kind: switch_entry, has: {matches: control-arm}, not: {matches: bound-read}}
    inside: {matches: swift-view-builder, stopBy: end}
message: '`$SPINNER` removes `$CONTROL` while its operation runs and resets the control''s identity'
note: 'Keep `<control>` in place under `.disabled(<condition>).overlay { if <condition> { ProgressView() } }`'
