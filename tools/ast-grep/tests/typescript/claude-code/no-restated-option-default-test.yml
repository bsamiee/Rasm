id: no-restated-option-default
valid:
    # The option read as narrowed
    - 'const manager = options.packageManager;'
    # Option passed to an engine call
    - "$.store.set('manager', options.packageManager);"
    # Comparison against a string value, a real comparison and no restated type
    - "const isPnpm = options.packageManager === 'pnpm';"
    # Default over another object
    - "const manager = config.packageManager ?? 'pnpm';"
    # Conjunction over the option reads the value
    - 'const held = options.speak && ready;'
    # Raw options inside options(raw), the one refinement over the host's values
    - "const manager = raw.packageManager ?? 'pnpm';"
    # Boolean compared against another option, no literal
    - 'const same = options.speak === options.classify;'
    # Conjunction against a literal reads the value, no comparison
    - 'const held = options.speak && true;'
    # Defined check over the option, the sibling no-restated-option-default-by-hand reports it
    - 'const held = options.packageManager !== undefined;'
    # Ternary with a consequent other than the option, a real selection
    - "const line = options.speak ? summary : '';"
    # Default over a parameter typed other than Options
    - "const manager = (settings: Raw): string => settings.packageManager ?? 'pnpm';"
    # Ternary with the negated option as its condition and another consequence
    - "const line = !options.speak ? '' : summary;"
    # Option compared against a boolean held in a name
    - 'const same = options.speak === DEFAULT;'
invalid:
    # Nullish default over the option
    - "const manager = options.packageManager ?? 'pnpm';"
    # Logical default over the option
    - "const manager = options.packageManager || 'pnpm';"
    # The instance, a boolean option compared against true
    - 'const speak = options.speak === true;'
    # Compared against false, the negation is the value
    - 'const quiet = options.speak === false;'
    # Unequal to true
    - 'const quiet = options.speak !== true;'
    # Unequal to false
    - 'const speak = options.speak !== false;'
    # Subscript read of the option
    - "const manager = options['packageManager'] ?? 'pnpm';"
    # Default inside a call argument
    - "run(options.packageManager ?? 'pnpm');"
    # Ternary with the option as its own consequent, the alternative is the default
    - "const manager = options.packageManager ? options.packageManager : 'pnpm';"
    # Default over a parameter typed Options under another name
    - "const manager = (settings: Options): string => settings.packageManager ?? 'pnpm';"
    # Ternary with the negated option as its condition and the option as its alternative
    - "const manager = !options.packageManager ? 'pnpm' : options.packageManager;"
    # Nullish default inside parentheses
    - "const manager = (options.packageManager ?? 'pnpm');"
    # Default over an optional chain read of the option
    - "const manager = options?.packageManager ?? 'pnpm';"
    # Boolean comparison inside a conjunction
    - 'const held = options.speak === true && ready;'
    # Nullish default over the option under a return
    - "const manager = (): string => { return options.packageManager ?? 'pnpm'; };"
    # Ternary with the option as its own consequent under a subscript read
    - "const manager = options['packageManager'] ? options['packageManager'] : 'pnpm';"
