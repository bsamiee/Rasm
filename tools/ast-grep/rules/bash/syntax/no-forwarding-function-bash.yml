# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-function-bash
language: bash
severity: error
utils:
    single-command-body:
        kind: compound_statement
        has: {kind: command}
        not:
            any:
                - has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}
                - has: {regex: '^&$'}
rule:
    kind: function_definition
    not: {has: {field: redirect, pattern: $$_REDIRECT}}
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            field: body
            matches: single-command-body
            has:
                kind: command
                pattern: $CALL
                all:
                    - has: {field: name, regex: '^[A-Za-z0-9_./-]+$'}
                    - has:
                        kind: string
                        regex: '^"\$(\{@\}|@)"$'
                        nthChild: {position: 1, reverse: true}
                        follows: {kind: command_name}
message: '`$NAME` forwards every argument unchanged to `$CALL`'
note: Delete the function and call the forwarded command at each call site
