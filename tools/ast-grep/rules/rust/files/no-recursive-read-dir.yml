# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-recursive-read-dir
language: rust
severity: error
utils:
    read-dir:
        kind: call_expression
        any:
            - has: {field: function, regex: '^(((::)?(std|tokio|async_std)::)?fs::|(::)?fs_err::(tokio::)?)read_dir$'}
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^(read_dir|fs_err_read_dir)$'}}
                - has: {field: arguments, not: {has: {pattern: $_}}}
    entry-iteration:
        any:
            - kind: for_expression
              has: {field: value, any: [{matches: read-dir}, {has: {stopBy: end, matches: read-dir}}]}
            - kind: while_expression
              has: {field: condition, has: {stopBy: end, kind: field_identifier, regex: '^next_entry$'}}
            - kind: closure_expression
              inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: field_expression, has: {field: value, any: [{matches: read-dir}, {has: {stopBy: end, matches: read-dir}}]}}}}
    self-call:
        kind: call_expression
        all:
            - has:
                field: function
                any:
                    - {kind: identifier, pattern: $NAME}
                    - kind: scoped_identifier
                      all: [{has: {field: path, regex: '^Self$'}}, {has: {field: name, pattern: $NAME}}]
                    - kind: field_expression
                      all: [{has: {field: value, kind: self}}, {has: {field: field, pattern: $NAME}}]
            - inside: {stopBy: {kind: function_item}, matches: entry-iteration}
            - inside: {stopBy: {kind: function_item}, kind: function_item, has: {field: name, pattern: $NAME}}
    worklist-push:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(push|push_back|push_front)$'}}, {has: {field: value, kind: identifier, pattern: $NAME}}]}
            - inside: {stopBy: {kind: function_item}, matches: entry-iteration}
            - inside:
                stopBy: {kind: function_item}
                kind: while_expression
                has:
                    field: condition
                    kind: let_condition
                    has: {field: value, kind: call_expression, has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $NAME}}, {has: {field: field, regex: '^(pop|pop_front|pop_back)$'}}]}}
rule:
    kind: call_expression
    pattern: $CALL
    any:
        - matches: self-call
        - matches: worklist-push
message: '`$CALL` walks a directory tree by hand, recursing through `$NAME` into each `read_dir` entry'
note: 'Iterate `ignore::WalkBuilder::new(<root>).standard_filters(false).build()`, the walk yields the root and every entry beneath it as `Result<ignore::DirEntry, ignore::Error>`. `max_depth`, `follow_links`, `sort_by_file_name`, and `build_parallel` cover the cases a hand walk codes. `standard_filters(true)` adds `.gitignore` and hidden-file rules'
