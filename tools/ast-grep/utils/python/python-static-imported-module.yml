# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-static-imported-module
language: python
rule:
    kind: dotted_name
    any:
        - inside: {kind: import_statement}
        - inside: {kind: aliased_import, field: name, inside: {kind: import_statement}}
        - inside: {kind: import_from_statement, field: module_name, pattern: $FROM}
