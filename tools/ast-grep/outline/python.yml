id: python-import
language: pythonlang
role: item
symbolType: module
utils:
    exports: {kind: expression_statement, has: {kind: 'assignment, augmented_assignment, call', any: [{has: {field: left, pattern: __all__}}, {has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, regex: '^(?:extend|append)$'}}]}}]}}
    declared: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    checked: {any: [{inside: {kind: block, stopBy: {kind: block}, any: [{inside: {kind: 'if_statement, elif_clause', field: consequence, all: [{has: {regex: '^(?:el)?if$', pattern: $$CLAUSE}}, {has: {field: condition, pattern: $GUARD}}]}}, {inside: {kind: else_clause, field: body, has: {regex: '^else$', pattern: $$CLAUSE}}}]}}, {not: {kind: ERROR}}]}
    listed: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports, has: {kind: string_content, stopBy: end, pattern: $EXPORT}}}}
    imported: {not: {inside: {kind: import_from_statement, field: module_name}}}
    bound: {any: [{kind: dotted_name, has: {nthChild: 1, pattern: $EXPORT}}, {kind: aliased_import, has: {field: alias, pattern: $EXPORT}}]}
    redundant: {kind: aliased_import, all: [{has: {field: alias, pattern: $ALIAS, not: {matches: private}}}, {has: {field: name, pattern: $ALIAS}}]}
    sibling: {kind: import_from_statement, all: [{has: {field: module_name, kind: relative_import, not: {has: {kind: dotted_name}}}}, {has: {kind: dotted_name, matches: imported, not: {matches: private}}}]}
rule:
    kind: 'import_statement, import_from_statement, future_import_statement'
    all:
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}
        - any:
              - {kind: import_statement, pattern: $LIST}
              - has: {field: module_name, pattern: $MODULE}
              - has: {regex: '^__future__$', pattern: $$FUTURE}
        - matches: checked
        - pattern: $DECLARATION
rewriters:
    - {id: statement, rule: {kind: 'import_statement, import_from_statement, future_import_statement'}, fix: '$CLAUSE $GUARD: $DECLARATION'}
    - {id: root, rule: {kind: dotted_name, has: {nthChild: 1, pattern: $ROOT}}, fix: $ROOT}
    - {id: prefix, rule: {kind: import_prefix, pattern: $PREFIX}, fix: $PREFIX}
transform:
    MODULES: {rewrite: {source: $LIST, rewriters: [root], joinBy: ', '}}
    ROOT: {rewrite: {source: $MODULE, rewriters: [prefix, root], joinBy: ''}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [statement]}}
    LINE: {replace: {source: $HEADER, replace: '(?:\\?[\t-\r \x{200B}\x{2060}\x{FEFF}]|#[^\n]*)+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ',? ([)\]}])|([(\[{]) |^(?: :)? +|^(else) (:)| -> (:)$| +$', by: $1$2$3$4$5}}
name: $MODULES$ROOT$FUTURE
signature: $SIGNATURE
isImport: true
isExported:
    any:
        - all: [{any: [{has: {matches: redundant}}, {has: {kind: wildcard_import}}, {matches: sibling}]}, {not: {matches: declared}}]
        - all: [{matches: declared}, {has: {all: [{matches: bound}, {matches: imported}, {matches: listed}]}}]
---
id: python-type-alias
language: pythonlang
role: item
symbolType: struct
utils:
    exports: {kind: expression_statement, has: {kind: 'assignment, augmented_assignment, call', any: [{has: {field: left, pattern: __all__}}, {has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, regex: '^(?:extend|append)$'}}]}}]}}
    declared: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports}}}
    listed: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    checked: {any: [{inside: {kind: block, stopBy: {kind: block}, any: [{inside: {kind: 'if_statement, elif_clause', field: consequence, all: [{has: {regex: '^(?:el)?if$', pattern: $$CLAUSE}}, {has: {field: condition, pattern: $GUARD}}]}}, {inside: {kind: else_clause, field: body, has: {regex: '^else$', pattern: $$CLAUSE}}}]}}, {not: {kind: ERROR}}]}
    hidden-name: {has: {field: left, matches: private}}
    alias-type: {any: [{pattern: TypeAlias}, {kind: attribute, has: {field: attribute, pattern: TypeAlias}}]}
    alias-call: {kind: call, has: {field: function, any: [{kind: identifier, regex: '^(?:NewType|TypeAliasType)$'}, {kind: attribute, has: {field: attribute, regex: '^(?:NewType|TypeAliasType)$'}}]}}
rule:
    all:
        - any:
              - {kind: type_alias_statement, has: {field: left, has: {any: [{kind: identifier, pattern: $NAME}, {kind: generic_type, has: {kind: identifier, pattern: $NAME}}]}}}
              - kind: assignment
                all:
                    - any: [{has: {field: type, has: {matches: alias-type}}}, {has: {field: right, matches: alias-call}}]
                    - has: {field: left, kind: identifier, pattern: $NAME}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}
        - matches: checked
rewriters:
    - {id: statement, rule: {kind: identifier, inside: {stopBy: end, kind: 'type_alias_statement, assignment', pattern: $STATEMENT}}, transform: {TEXT: {rewrite: {source: $STATEMENT, rewriters: [comment]}}}, fix: '$CLAUSE $GUARD: $TEXT'}
    - {id: comment, rule: {kind: comment}, fix: ''}
transform:
    HEADER: {rewrite: {source: $NAME, rewriters: [statement]}}
    LINE: {replace: {source: $HEADER, replace: '\\?[\t-\r \x{200B}\x{2060}\x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ',? ([)\]}])|([(\[{]) |^(?: :)? +|^(else) (:)| -> (:)$| +$', by: $1$2$3$4$5}}
name: $NAME
signature: $SIGNATURE
isExported: {any: [{all: [{not: {matches: hidden-name}}, {not: {matches: declared}}]}, {matches: listed}]}
---
id: python-type-parameter
language: pythonlang
role: item
symbolType: typeParameter
utils:
    exports: {kind: expression_statement, has: {kind: 'assignment, augmented_assignment, call', any: [{has: {field: left, pattern: __all__}}, {has: {field: function, kind: attribute, all: [{has: {field: object, pattern: __all__}}, {has: {field: attribute, regex: '^(?:extend|append)$'}}]}}]}}
    declared: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports}}}
    listed: {inside: {kind: 'module, ERROR', stopBy: end, regex: __all__, has: {stopBy: {not: {kind: 'block, if_statement, elif_clause, else_clause, try_statement, except_clause, finally_clause'}}, matches: exports, has: {kind: string_content, stopBy: end, pattern: $NAME}}}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    checked: {any: [{inside: {kind: block, stopBy: {kind: block}, any: [{inside: {kind: 'if_statement, elif_clause', field: consequence, all: [{has: {regex: '^(?:el)?if$', pattern: $$CLAUSE}}, {has: {field: condition, pattern: $GUARD}}]}}, {inside: {kind: else_clause, field: body, has: {regex: '^else$', pattern: $$CLAUSE}}}]}}, {not: {kind: ERROR}}]}
    hidden-name: {has: {field: left, matches: private}}
    variable-call: {kind: call, has: {field: function, any: [{kind: identifier, regex: '^(?:TypeVar|ParamSpec|TypeVarTuple)$'}, {kind: attribute, has: {field: attribute, regex: '^(?:TypeVar|ParamSpec|TypeVarTuple)$'}}]}}
rule:
    kind: assignment
    all:
        - has: {field: right, matches: variable-call}
        - has: {field: left, kind: identifier, pattern: $NAME}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {kind: identifier, regex: '^$'}, {kind: 'argument_list, parameters, parenthesized_expression, tuple, generator_expression, parenthesized_list_splat, tuple_pattern, class_pattern', not: {regex: '\)$'}}, {kind: 'type_parameter, subscript, list, list_comprehension, list_pattern', not: {regex: '\]$'}}, {kind: 'set, dictionary, set_comprehension, dictionary_comprehension, dict_pattern, interpolation', not: {regex: '\}$'}}]}}
        - matches: checked
rewriters:
    - {id: statement, rule: {kind: identifier, inside: {stopBy: end, kind: 'type_alias_statement, assignment', pattern: $STATEMENT}}, transform: {TEXT: {rewrite: {source: $STATEMENT, rewriters: [comment]}}}, fix: '$CLAUSE $GUARD: $TEXT'}
    - {id: comment, rule: {kind: comment}, fix: ''}
transform:
    HEADER: {rewrite: {source: $NAME, rewriters: [statement]}}
    LINE: {replace: {source: $HEADER, replace: '\\?[\t-\r \x{200B}\x{2060}\x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: ',? ([)\]}])|([(\[{]) |^(?: :)? +|^(else) (:)| -> (:)$| +$', by: $1$2$3$4$5}}
name: $NAME
signature: $SIGNATURE
isExported: {any: [{all: [{not: {matches: hidden-name}}, {not: {matches: declared}}]}, {matches: listed}]}
