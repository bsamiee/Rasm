# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-arithmetic-comparison-in-test
language: bash
severity: error
utils:
    numeric-operator: {kind: test_operator, regex: '^-(eq|ne|lt|le|gt|ge)$'}
    named-parameter: {matches: {bash-parameter: {name: {kind: 'variable_name, subscript'}}}}
    parameter-operand:
        any:
            - matches: named-parameter
            - kind: simple_expansion
              has: {kind: special_variable_name}
            - kind: expansion
              has: {field: operator, regex: '^#$'}
    numeric-operand:
        any:
            - matches: parameter-operand
            - kind: string
              has: {matches: parameter-operand}
              not: {has: {nthChild: 2}}
            - kind: number
            - kind: unary_expression
              has: {kind: number}
            - kind: word
            - kind: arithmetic_expansion
    comparison:
        kind: binary_expression
        all:
            - has: {field: operator, matches: numeric-operator}
            - has: {field: left, matches: numeric-operand}
            - has: {field: right, matches: numeric-operand}
    test-comparison:
        kind: command
        all:
            - has: {field: name, regex: '^test$'}
            - has: {matches: numeric-operand, nthChild: 2}
            - has: {kind: word, regex: '^-(eq|ne|lt|le|gt|ge)$', nthChild: 3}
            - has: {matches: numeric-operand, nthChild: 4}
            - not: {has: {nthChild: 5}}
    numeric-expression:
        any:
            - matches: comparison
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(&&|\|\|)$'}
                - has: {field: left, matches: numeric-expression}
                - has: {field: right, matches: numeric-expression}
            - kind: unary_expression
              has: {matches: numeric-expression}
            - kind: parenthesized_expression
              has: {matches: numeric-expression}
rule:
    pattern: $TEST
    any:
        - kind: test_command
          has: {pattern: $EXPRESSION, matches: numeric-expression}
        - matches: test-comparison
          pattern: $EXPRESSION
    not: {inside: {matches: bash-sh-program, stopBy: end}}
rewriters:
    - id: name
      rule:
        kind: simple_expansion, expansion
        matches: named-parameter
        pattern: $PARAMETER
        not: {regex: '^\$\{?[0-9]+\}?$'}
      transform:
        NAME: {replace: {source: $PARAMETER, replace: '^\$\{?|\}?$', by: ''}}
      fix: $NAME
    - id: unquote
      rule:
        kind: string
        pattern: $QUOTED
      transform:
        INNER: rewrite($QUOTED, rewriters=[name])
        UNQUOTED: {replace: {source: $INNER, replace: '^"|"$', by: ''}}
      fix: $UNQUOTED
    - id: compare
      rule:
        any:
            - matches: comparison
              all:
                - has: {field: left, pattern: $LEFT}
                - has: {field: operator, pattern: $OPERATOR}
                - has: {field: right, pattern: $RIGHT}
            - matches: test-comparison
              all:
                - has: {pattern: $LEFT, nthChild: 2}
                - has: {pattern: $OPERATOR, nthChild: 3}
                - has: {pattern: $RIGHT, nthChild: 4}
      transform:
        L: rewrite($LEFT, rewriters=[unquote, name])
        R: rewrite($RIGHT, rewriters=[unquote, name])
        EQ: replace($OPERATOR, replace='^-eq$', by='==')
        NE: replace($EQ, replace='^-ne$', by='!=')
        LT: replace($NE, replace='^-lt$', by='<')
        LE: replace($LT, replace='^-le$', by='<=')
        GT: replace($LE, replace='^-gt$', by='>')
        OP: replace($GT, replace='^-ge$', by='>=')
      fix: $L $OP $R
transform:
    BODY: rewrite($EXPRESSION, rewriters=[compare])
fix: (( $BODY ))
message: '`$TEST` compares integers through a `test` operator'
note: Compare in an arithmetic command with parameter names, `(( <left> == <right> ))`
