# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-python-nesting-level
language: python
severity: error
utils:
    callback:
        kind: lambda
        all:
            - any:
                - inside: {kind: argument_list}
                - inside: {kind: keyword_argument, inside: {kind: argument_list}}
            - has: {field: parameters, kind: lambda_parameters}
    control: {kind: 'if_statement, for_statement, while_statement, match_statement, try_statement, with_statement'}
    boundary: {any: [{matches: control}, {kind: 'function_definition, lambda'}]}
rule:
    any:
        - matches: callback
          all:
            - inside:
                matches: callback
                stopBy: end
                inside:
                    matches: callback
                    stopBy: end
                    inside: {matches: callback, stopBy: end}
            - not:
                has: {matches: callback, stopBy: end}
        - matches: control
          inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                stopBy: {matches: boundary}
                inside:
                    matches: control
                    stopBy: {matches: boundary}
                    not: {inside: {matches: control, stopBy: {kind: 'function_definition, lambda'}}}
message: Python execution exceeds three nested callback or control levels
note: Reduce the operation through guards, pattern matching, comprehensions, or the owning composition operation, and keep dependent evaluation
