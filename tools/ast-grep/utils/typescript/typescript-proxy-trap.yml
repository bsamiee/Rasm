# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-proxy-trap
language: tsxlang
utils:
    handler:
        kind: object
        nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}
        inside:
            kind: arguments
            inside: {kind: new_expression, has: {field: constructor, regex: '(^|\.)Proxy$', matches: typescript-global-member}}
rule:
    any:
        - inside: {kind: pair, field: value, inside: {kind: object, matches: handler}}
        - kind: method_definition
          inside: {kind: object, matches: handler}
