# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-record-rebuild-by-fields
language: python
severity: error
utils:
    struct-field:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has: {field: left, kind: identifier, pattern: $A}
                - has: {field: type, kind: type}
    own-struct:
        kind: class_definition
        all:
            - has: {field: name, pattern: $C}
            - has: {field: superclasses, has: {regex: '^(msgspec\.)?Struct$'}}
            - has: {field: body, has: {matches: struct-field}}
    field-read:
        kind: attribute
        all:
            - has: {field: object, kind: identifier, pattern: $X}
            - has: {field: attribute, pattern: $A}
            - inside: {kind: module, stopBy: end, has: {matches: own-struct}}
            - any:
                - all:
                    - has: {field: object, regex: '^self$'}
                    - inside: {kind: class_definition, stopBy: end, has: {field: name, pattern: $C}}
                - inside:
                    kind: function_definition
                    stopBy: end
                    has:
                        field: parameters
                        has:
                            kind: typed_parameter
                            all:
                                - has: {kind: identifier, pattern: $X}
                                - has: {field: type, kind: type, pattern: $C}
    replace-import:
        any:
            - kind: import_from_statement
              all:
                - has: {field: module_name, regex: '^copy$'}
                - any:
                    - has: {kind: dotted_name, regex: '^replace$', pattern: $REPLACE}
                    - has: {kind: aliased_import, all: [{has: {field: name, regex: '^replace$'}}, {has: {field: alias, pattern: $REPLACE}}]}
            - kind: import_statement
              any:
                - has: {kind: dotted_name, regex: '^copy$', pattern: $COPY}
                - has: {kind: aliased_import, all: [{has: {field: name, regex: '^copy$'}}, {has: {field: alias, pattern: $COPY}}]}
rule:
    kind: call
    all:
        - has: {field: function, kind: identifier, pattern: $C}
        - has:
            field: arguments
            all:
                - has:
                    any:
                        - matches: field-read
                        - kind: keyword_argument
                          has: {field: value, matches: field-read}
                - has: {pattern: $_, not: {pattern: $X.$_}}
        - any:
            - pattern: $FIXABLE
              all:
                - inside: {kind: module, stopBy: end, has: {matches: replace-import}}
                - has: {field: arguments, pattern: $ARGS, not: {has: {pattern: $_, not: {any: [{pattern: $X.$_}, {kind: keyword_argument}, {kind: comment}]}}}}
                - has: {field: arguments, has: {stopBy: end, kind: identifier, all: [{pattern: $X}, {pattern: $RECORD}]}}
            - pattern: $UNFIXED
rewriters:
    - id: changed-keyword
      rule:
        kind: keyword_argument
        pattern: $KEYWORD
        not: {all: [{has: {field: name, pattern: $K}}, {has: {field: value, pattern: $X.$K}}]}
      fix: $KEYWORD
transform:
    KEPT: rewrite($ARGS, rewriters=[changed-keyword], joinBy=', ')
    MODULE_CALLEE: {replace: {source: $COPY, replace: '^(.+)$', by: '$1.replace'}}
    PREFIX: {replace: {source: $RECORD, replace: '^(.+)$', by: '($1, '}}
    TAIL: {replace: {source: $RECORD, replace: '^.+$', by: ')'}}
fix: $REPLACE$MODULE_CALLEE$PREFIX$KEPT$TAIL$UNFIXED
message: '`$C(...)` rebuilds `$X` by spelling its fields'
note: 'Use `replace(<record>, <field>=<value>)` from `copy`'
