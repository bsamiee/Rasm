# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-spread-schema-fields
language: tsxlang
severity: error
rule:
    kind: spread_element
    all:
        - has: {nthChild: 1, kind: member_expression, pattern: $FIELDS, has: {field: property, regex: '^fields$'}}
        - inside:
            kind: object
            nthChild: 1
            inside:
                kind: arguments
                inside:
                    kind: call_expression
                    any:
                        - has: {field: function, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^(Struct|TaggedStruct)$'}}}}
                        - has: {field: function, kind: call_expression, has: {field: function, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^(Class|TaggedClass|ErrorClass|TaggedError)$'}}}}}
message: '`...$FIELDS` copies a schema''s fields into a new field record'
note: 'Extend the schema with `<schema>.mapFields(Struct.assign({ <fields> }))`'
