# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-validation-python
language: python
severity: error
utils:
    typed-parameter:
        kind: identifier
        pattern: $VALUE
        inside:
            kind: function_definition
            stopBy: {kind: 'function_definition, lambda'}
            has:
                field: parameters
                has:
                    kind: typed_parameter, typed_default_parameter
                    all:
                        - any: [{has: {kind: identifier, nthChild: 1, pattern: $VALUE}}, {has: {field: name, pattern: $VALUE}}]
                        - has: {field: type, pattern: $TYPE}
    typed-local:
        kind: identifier
        pattern: $VALUE
        inside:
            kind: function_definition, module
            stopBy: end
            has:
                stopBy: {kind: 'function_definition, class_definition, lambda'}
                kind: assignment
                all:
                    - has: {field: left, pattern: $VALUE}
                    - has: {field: type, pattern: $TYPE}
    typed-value:
        kind: identifier
        any: [{matches: typed-parameter}, {matches: typed-local}]
rule:
    kind: call
    pattern: $CALL
    all:
        - has: {field: function, kind: 'identifier, attribute', pattern: $TYPE, not: {regex: '^(float|complex|bytes|list|dict|set|bytearray)$'}}
        - has: {field: arguments, kind: argument_list, not: {has: {nthChild: 2}}, has: {nthChild: 1, matches: typed-value}}
        - any:
            - {has: {field: function, regex: '^(str|int)$'}, pattern: $UNFIXED}
            - {inside: {kind: assignment, field: right, has: {field: left, pattern: $VALUE}}, pattern: $UNFIXED}
            - has: {field: arguments, has: {nthChild: 1, pattern: $KEPT}}
fix: $KEPT$UNFIXED
message: '`$CALL` converts `$VALUE` to `$TYPE`, the type its annotation declares'
note: 'Use `<value>` with no rebinding to its own name, and keep a `str` or `int` conversion where its source can pass a subclass the conversion changes (a `(str, Enum)` member, a `bool`)'
