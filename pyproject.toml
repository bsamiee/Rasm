# --- [PROJECT] --------------------------------------------------------------------------

[project]
name = "rasm"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "expression",                                         # Results, options, fault unions, and effect chains of every rasm package
    "httpx2",                                             # HTTP of batch render targets and notices
    "msgspec",                                            # Records, tagged unions, field bounds, and JSON, TOML, and MessagePack codecs
    "numpy",                                              # Arrays of image planes, previews, and analysis, bundled in Blender's Python
    "opencolorio",                                        # Color processors, config authoring, and LUT bakes, bundled in Blender's Python as PyOpenColorIO
    "openimageio; python_full_version < '3.15'",          # Image IO and analysis, bundled in Blender's Python as OpenImageIO, no cp315 wheel and the sdist omits the testsuite its CMake copies
    "psdtags",                                            # Photoshop layer records of layered documents
    "tifffile",                                           # Linear Raw DNG and the TIFF container of layered documents
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

