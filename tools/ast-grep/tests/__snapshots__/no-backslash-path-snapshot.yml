id: no-backslash-path
snapshots:
  ? |
    <Compile Include="$(A)\$(B)\*.cs" />
  : fixed: |
      <Compile Include="$(A)/$(B)/*.cs" />
    labels:
    - source: '"$(A)\$(B)\*.cs"'
      style: primary
      start: 17
      end: 33
  ? |
    <Compile Include="Generated\**\*.cs" />
  : fixed: |
      <Compile Include="Generated/**/*.cs" />
    labels:
    - source: '"Generated\**\*.cs"'
      style: primary
      start: 17
      end: 36
  ? |
    <Compile Include="a\b\c.cs" />
  : fixed: |
      <Compile Include="a/b/c.cs" />
    labels:
    - source: '"a\b\c.cs"'
      style: primary
      start: 17
      end: 27
  ? |
    <Exec Command="build" WorkingDirectory="tools\bin" />
  : fixed: |
      <Exec Command="build" WorkingDirectory="tools/bin" />
    labels:
    - source: '"tools\bin"'
      style: primary
      start: 39
      end: 50
  ? |
    <Import Project="$(MSBuildThisFileDirectory)..\..\build\common.props" />
  : fixed: |
      <Import Project="$(MSBuildThisFileDirectory)../../build/common.props" />
    labels:
    - source: '"$(MSBuildThisFileDirectory)..\..\build\common.props"'
      style: primary
      start: 16
      end: 69
  ? |
    <MakeDir Directories="$(OutDir)logs\" />
  : fixed: |
      <MakeDir Directories="$(OutDir)logs/" />
    labels:
    - source: '"$(OutDir)logs\"'
      style: primary
      start: 21
      end: 37
  ? |
    <None Include="assets/item.txt" PackagePath="content\assets" />
  : fixed: |
      <None Include="assets/item.txt" PackagePath="content/assets" />
    labels:
    - source: '"content\assets"'
      style: primary
      start: 44
      end: 60
  ? |
    <Project Path="libs\dotnet\Item\Item.csproj" />
  : fixed: |
      <Project Path="libs/dotnet/Item/Item.csproj" />
    labels:
    - source: '"libs\dotnet\Item\Item.csproj"'
      style: primary
      start: 14
      end: 44
  ? |
    <PropertyGroup><ToolPath>$(MSBuildThisFileDirectory)tools\mytool\mytool.exe</ToolPath></PropertyGroup>
  : fixed: |
      <PropertyGroup><ToolPath>$(MSBuildThisFileDirectory)tools/mytool/mytool.exe</ToolPath></PropertyGroup>
    labels:
    - source: $(MSBuildThisFileDirectory)tools\mytool\mytool.exe
      style: primary
      start: 25
      end: 75
  ? |
    <PropertyGroup><ToolPath>$([System.IO.Path]::Combine('$(A)', 'lib\item.dll'))</ToolPath></PropertyGroup>
  : fixed: |
      <PropertyGroup><ToolPath>$([System.IO.Path]::Combine('$(A)', 'lib/item.dll'))</ToolPath></PropertyGroup>
    labels:
    - source: $([System.IO.Path]::Combine('$(A)', 'lib\item.dll'))
      style: primary
      start: 25
      end: 77
  ? |
    <PropertyGroup><ToolsDir>tools\bin\</ToolsDir></PropertyGroup>
  : fixed: |
      <PropertyGroup><ToolsDir>tools/bin/</ToolsDir></PropertyGroup>
    labels:
    - source: tools\bin\
      style: primary
      start: 25
      end: 35
  ? |
    <Reference Include="Tool"><HintPath>..\packages\tool\lib\tool.dll</HintPath><Private>false</Private></Reference>
  : fixed: |
      <Reference Include="Tool"><HintPath>../packages/tool/lib/tool.dll</HintPath><Private>false</Private></Reference>
    labels:
    - source: ..\packages\tool\lib\tool.dll
      style: primary
      start: 36
      end: 65
