syntax = "proto3";

package rasm.contracts.event;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// --- [EXTENSIONS] -------------------------------------------------------------------------

// The estate CloudEvents profile. Generic extension capability remains SDK-owned; this message carries only
// attributes with a producer/consumer pair in the estate.
message Extensions {
  option (buf.validate.message).cel = {
    id: "extensions.traceparent"
    message: "traceparent must carry a valid W3C base header"
    expression: "!has(this.traceparent) || (!this.traceparent.matches('^ff-') && !this.traceparent.matches('^[0-9a-f]{2}-0{32}-') && !this.traceparent.matches('^[0-9a-f]{2}-[0-9a-f]{32}-0{16}-') && (!this.traceparent.matches('^00-') || size(this.traceparent) == 55))"
  };
  option (buf.validate.message).cel = {
    id: "extensions.tracestate"
    message: "tracestate requires traceparent"
    expression: "!has(this.tracestate) || has(this.traceparent)"
  };
  reserved 8, 11 to 15, 17 to 27;
  reserved "severity", "correlation", "deprecation", "authcontext", "dssematerial", "dataregulation", "datacategory", "severitytext", "severitynumber", "authtype", "authid", "authclaims", "deprecated", "deprecationfrom", "deprecationsunset", "deprecationmigration";

  optional string traceparent = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}(-.*)?$"];
  // The registered W3C propagator owns tracestate and baggage grammar, budgets, mutation, and restart semantics.
  optional string tracestate = 2;
  optional string baggage = 3;
  optional string partitionkey = 4 [(buf.validate.field).string.min_len = 1];
  // Estate profile over the standard string attribute: producers left-pad uint64 decimal to D20 lexical order.
  optional string sequence = 5 [(buf.validate.field).string.pattern = "^[0-9]{20}$"];
  optional uint32 sampledrate = 6 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 2147483647
  }];
  optional string dataref = 7 [(buf.validate.field).string = {
    min_len: 1
    uri_ref: true
  }];
  // Producer creation time for this CloudEvent, distinct from occurrence time and receiver arrival time.
  optional google.protobuf.Timestamp recordedtime = 9;
  optional google.protobuf.Timestamp expirytime = 10;
  optional string dataclassification = 16 [(buf.validate.field).string.min_len = 1];
}
