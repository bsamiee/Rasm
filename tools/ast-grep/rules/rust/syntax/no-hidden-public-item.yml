# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-hidden-public-item
language: rust
severity: error
utils:
    hidden:
        kind: attribute
        any:
            - all:
                - has: {nthChild: 1, kind: identifier, regex: '^doc$'}
                - has: {field: arguments, has: {kind: identifier, regex: '^hidden$'}}
            - all:
                - has: {nthChild: 1, kind: identifier, regex: '^cfg_attr$'}
                - has: {field: arguments, has: {kind: token_tree, follows: {kind: identifier, regex: '^doc$'}, has: {kind: identifier, regex: '^hidden$'}}}
    exported:
        kind: visibility_modifier
        regex: '^pub$'
    public:
        any:
            - has: {matches: exported}
            - kind: enum_variant
              inside: {kind: enum_variant_list, inside: {kind: enum_item, has: {matches: exported}}}
            - kind: 'function_signature_item, function_item, associated_type, const_item, type_item'
              inside: {kind: declaration_list, inside: {kind: trait_item, has: {matches: exported}}}
            - kind: macro_definition
              matches: {rust-attributed: {attribute: {regex: '^#\[\s*macro_export\b'}}}
rule:
    kind: attribute_item
    pattern: $ATTRIBUTE
    all:
        - has: {matches: hidden}
        - precedes:
            stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}
            kind: 'function_item, function_signature_item, struct_item, enum_item, union_item, trait_item, const_item, static_item, type_item, mod_item, use_declaration, field_declaration, enum_variant, associated_type, macro_definition'
            matches: public
            any:
                - has: {field: name, pattern: $NAME}
                - has: {field: argument, pattern: $NAME}
transform:
    WHOLE:
        replace:
            source: $ATTRIBUTE
            replace: '(?s)^#\[\s*(cfg_attr\s*\(.*,\s*)?doc\s*\(\s*hidden\s*\)\s*\)?\s*\]$'
            by: ''
    LISTED:
        replace:
            source: $WHOLE
            replace: ',\s*doc\s*\(\s*hidden\s*\)|doc\s*\(\s*hidden\s*\)\s*,\s*'
            by: ''
    FIXED:
        replace:
            source: $LISTED
            replace: '\bhidden\s*,\s*|,\s*hidden\b'
            by: ''
fix: $FIXED
message: '`$ATTRIBUTE` hides `$NAME` from the API it belongs to'
note: 'Narrow the item to `pub(crate)` or `pub(super)` where the crate alone reads it, else keep it in the documented API, `#[doc(hidden)]` keeps the item callable from every dependent while `missing_docs` and semver checks skip it'
