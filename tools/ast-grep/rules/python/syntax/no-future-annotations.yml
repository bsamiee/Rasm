# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-future-annotations
language: python
severity: error
ignores:
    - .claude/skills/use-blender/scripts/*.py
    - .claude/skills/use-rhino/scripts/{canvas,document,file3dm,records}.py
    - tools/interface/{roles,report,units,render,aliases,frame}.py
    - tools/interface/rhino/{window,markup}.py
    - tools/interface/blender/rows.py
    - tools/interface/*/script/**
    - tools/interface/blender/extension/**
utils:
    annotations-feature: {kind: dotted_name, regex: '^annotations$', inside: {kind: future_import_statement}}
rule:
    kind: future_import_statement
    pattern: $IMPORT
    has: {matches: annotations-feature}
    any:
        - precedes: {pattern: $NEXT}
        - pattern: $_
rewriters:
    - id: kept
      rule: {kind: dotted_name, pattern: $FEATURE, not: {matches: annotations-feature}}
      fix: $FEATURE
transform:
    KEPT: rewrite($IMPORT, rewriters=[kept], joinBy=', ')
    OUT: {replace: {source: $KEPT, replace: '^.+$', by: "from __future__ import ${0}\n"}}
fix:
    template: $OUT$NEXT
    expandEnd: {pattern: $NEXT}
message: '`$IMPORT` stores annotations as strings'
note: 'Use annotations without the `annotations` future import, Python 3.14 and later defer annotation evaluation by default'
