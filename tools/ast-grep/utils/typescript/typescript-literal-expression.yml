# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-literal-expression
language: tsxlang
rule:
    any:
        - kind: 'object, array, string, number, true, false, null, undefined, template_string, unary_expression, regex'
        - matches: typescript-expression-wrapper
    not:
        has:
            stopBy: end
            kind: |-
                identifier, shorthand_property_identifier, this, call_expression, new_expression, member_expression, subscript_expression,
                spread_element, template_substitution, arrow_function, function_expression, await_expression, yield_expression,
                assignment_expression, augmented_assignment_expression, update_expression
