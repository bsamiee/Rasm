# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-module-reference
language: tsxlang
arguments: [source]
utils:
    module-import:
        kind: import_statement
        has: {field: source, all: [{has: {kind: string_fragment, matches: source}}, {not: {has: {kind: escape_sequence}}}]}
    module-name:
        pattern: $IMPORTED
        matches: typescript-import-binding
        inside: {kind: 'import_clause, namespace_import'}
    type-position:
        inside: {kind: 'nested_type_identifier, type_query', stopBy: {not: {kind: 'nested_identifier, member_expression'}}}
rule:
    kind: identifier, undefined
    pattern: $IMPORTED
    all:
        - any:
            - matches: type-position
              inside: {kind: program, stopBy: end, has: {all: [{matches: module-import}, {has: {stopBy: end, matches: module-name}}]}}
            - not: {matches: type-position}
              inside: {kind: program, stopBy: end, has: {all: [{matches: module-import}, {not: {has: {regex: '^type$', not: {pattern: $_}}}}, {has: {stopBy: end, matches: module-name}}]}}
        - not: {matches: {typescript-local-binding: {owner: {pattern: $_}}}}
