# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-binary-header-read
language: rust
utils:
    magic:
        kind: string_literal
        regex: '^b"(\\x[0-9A-Fa-f]{2}|\\.|[^"\\]){2,}"$'
        not: {matches: rust-format-signature}
    magic-test:
        any:
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^(starts_with|strip_prefix|ends_with)$'}}}}
            - inside: {kind: binary_expression, has: {field: operator, regex: '^(==|!=)$'}}
            - inside: {kind: match_pattern}
    endian-read:
        kind: call_expression
        has: {field: function, kind: scoped_identifier, has: {field: name, regex: '^from_(le|be)_bytes$'}}
    magic-site:
        matches: magic
        all:
            - matches: magic-test
            - inside: {kind: function_item, stopBy: {kind: function_item}, has: {field: body, has: {stopBy: end, matches: endian-read}}}
rule:
    any:
        - matches: magic-site
        - matches: endian-read
          inside: {kind: function_item, stopBy: {kind: function_item}, has: {field: body, has: {stopBy: end, matches: magic-site}}}
