id: no-version-on-package-reference
valid:
    - |
      <ItemGroup Label="Test Dependencies"><PackageReference Include="coverlet.MTP" /></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="MinVer" PrivateAssets="all" /></ItemGroup>
    - |
      <ItemGroup Label="Testing"><PackageVersion Include="CsCheck" Version="4.8.0" /></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="MinVer"><PrivateAssets>all</PrivateAssets></PackageReference></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="Item" Condition="'$(Version)' == ''" /></ItemGroup>
    - |
      <ItemGroup><PackageDownload Include="Item" Version="[1.0.0]" /></ItemGroup>
invalid:
    - |
      <ItemGroup><PackageReference Include="CsCheck" Version="4.8.0" /></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="CsCheck" VersionOverride="4.7.0" /></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="CsCheck" Version="4.8.0"><PrivateAssets>all</PrivateAssets></PackageReference></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="CsCheck"><Version>4.8.0</Version></PackageReference></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="CsCheck"><Version Condition="'$(Pin)' == 'true'">4.8.0</Version></PackageReference></ItemGroup>
    - |
      <PackageReference Include = "CsCheck" Note=' Version="kept" >' Version = "4.8.0" />
    - |
      <PackageReference Include="CsCheck"><!-- <Version>keep</Version> --><Version Condition="'$(Pin)' > '0'">4.8.0</Version></PackageReference>
    - |
      <PackageReference Include="CsCheck"><Version /></PackageReference>
    - |
      <ItemGroup><PackageReference Update="Item" Version="1.0.0" /></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="Item" Version="" /></ItemGroup>
    - |
      <ItemGroup><PackageReference Include="Item"><VersionOverride>1.0.0</VersionOverride></PackageReference></ItemGroup>
    - |
      <ItemGroup><PackageReference Include='Item' Version='1.0.0' /></ItemGroup>
