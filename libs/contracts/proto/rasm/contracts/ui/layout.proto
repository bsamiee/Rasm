syntax = "proto3";

package rasm.contracts.ui;

import "buf/validate/validate.proto";

// --- [VOCABULARIES] ---------------------------------------------------------------------

enum LayoutRelation {
  LAYOUT_RELATION_UNSPECIFIED = 0;
  LAYOUT_RELATION_EQ = 1;
  LAYOUT_RELATION_LE = 2;
  LAYOUT_RELATION_GE = 3;
}

enum LayoutStrength {
  LAYOUT_STRENGTH_UNSPECIFIED = 0;
  LAYOUT_STRENGTH_REQUIRED = 1;
  LAYOUT_STRENGTH_STRONG = 2;
  LAYOUT_STRENGTH_MEDIUM = 3;
  LAYOUT_STRENGTH_WEAK = 4;
}

// --- [LAYOUT] ---------------------------------------------------------------------------

message LayoutVarWire {
  string owner = 1 [(buf.validate.field).string.min_len = 1];
  string edge = 2 [(buf.validate.field).string.min_len = 1];
}

message LayoutTermWire {
  LayoutVarWire variable = 1 [(buf.validate.field).required = true];
  double coefficient = 2 [(buf.validate.field).double = {
    finite: true
    not_in: [0]
  }];
}

message LayoutExprWire {
  repeated LayoutTermWire terms = 1 [(buf.validate.field).repeated.max_items = 4096];
  double constant = 2 [(buf.validate.field).double.finite = true];
}

message LayoutConstraintWire {
  LayoutExprWire left = 1 [(buf.validate.field).required = true];
  LayoutRelation relation = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  LayoutExprWire right = 3 [(buf.validate.field).required = true];
  LayoutStrength strength = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// An edit declares a registered variable at a strength; a value drives one to a number. Folding both onto
// one nullable row would admit an edit carrying a value or a suggestion carrying a strength, neither of
// which a receiving tableau can act on.
message LayoutEdit {
  LayoutVarWire variable = 1 [(buf.validate.field).required = true];
  LayoutStrength strength = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1
    ]
  }];
}

message LayoutValue {
  LayoutVarWire variable = 1 [(buf.validate.field).required = true];
  double value = 2 [(buf.validate.field).double.finite = true];
}

// An under-constrained solve admits many valid assignments, so parity is a producer contract: a receiver
// re-solving the four ordered inputs in the received order reaches the producing assignment. Variable identity
// stays the owner/edge pair in every sequence; only a solver adapter may derive a private handle name. Solved
// positions never cross. Uniqueness projects each pair onto one length-framed key; the two referential rules stay
// a cross product, since CEL carries no set primitive to linearize them, bounded by the roster ceilings alone.
message LayoutProgram {
  option (buf.validate.message).cel = {
    id: "appui_layout.introduction_unique"
    message: "introduced layout variables must be unique"
    expression: "this.introduction.map(v, string(size(v.owner)) + ':' + v.owner + v.edge).unique()"
  };
  option (buf.validate.message).cel = {
    id: "appui_layout.variables_introduced"
    message: "every referenced layout variable must be introduced"
    expression: "this.constraints.all(c, c.left.terms.all(t, this.introduction.exists(v, v.owner == t.variable.owner && v.edge == t.variable.edge)) && c.right.terms.all(t, this.introduction.exists(v, v.owner == t.variable.owner && v.edge == t.variable.edge))) && this.edits.all(e, this.introduction.exists(v, v.owner == e.variable.owner && v.edge == e.variable.edge)) && this.suggestions.all(s, this.introduction.exists(v, v.owner == s.variable.owner && v.edge == s.variable.edge)) && this.measurements.all(m, this.introduction.exists(v, v.owner == m.variable.owner && v.edge == m.variable.edge))"
  };
  option (buf.validate.message).cel = {
    id: "appui_layout.edits_unique"
    message: "layout edit variables must be unique"
    expression: "this.edits.map(e, string(size(e.variable.owner)) + ':' + e.variable.owner + e.variable.edge).unique()"
  };
  option (buf.validate.message).cel = {
    id: "appui_layout.suggestions_unique"
    message: "layout suggestion variables must be unique"
    expression: "this.suggestions.map(s, string(size(s.variable.owner)) + ':' + s.variable.owner + s.variable.edge).unique()"
  };
  option (buf.validate.message).cel = {
    id: "appui_layout.measurements_unique"
    message: "layout measurement variables must be unique"
    expression: "this.measurements.map(m, string(size(m.variable.owner)) + ':' + m.variable.owner + m.variable.edge).unique()"
  };
  option (buf.validate.message).cel = {
    id: "appui_layout.measurements_editable"
    message: "layout measurements must target an explicit or suggested edit variable"
    expression: "this.measurements.all(m, this.edits.exists(e, e.variable.owner == m.variable.owner && e.variable.edge == m.variable.edge) || this.suggestions.exists(s, s.variable.owner == m.variable.owner && s.variable.edge == m.variable.edge))"
  };

  repeated LayoutConstraintWire constraints = 1 [(buf.validate.field).repeated.max_items = 4096];
  repeated LayoutVarWire introduction = 2 [(buf.validate.field).repeated.max_items = 4096];
  repeated LayoutEdit edits = 3 [(buf.validate.field).repeated.max_items = 4096];
  repeated LayoutValue suggestions = 4 [(buf.validate.field).repeated.max_items = 4096];
  repeated LayoutValue measurements = 5 [(buf.validate.field).repeated.max_items = 4096];
  string surface = 6 [(buf.validate.field).string.min_len = 1];
}
