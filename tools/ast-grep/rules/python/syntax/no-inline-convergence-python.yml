# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-inline-convergence-python
language: python
severity: error
files:
    - tools/interface/**/*.py
ignores:
    - tools/interface/blender/extension/**
utils:
    write:
        kind: expression_statement
        pattern: $WRITE
        has:
            any:
                - {kind: assignment, has: {field: left, kind: 'attribute, subscript'}}
                - kind: call
rule:
    kind: if_statement
    all:
        - has:
            field: condition
            kind: comparison_operator
            pattern: $TEST
            all:
                - has: {field: operators, regex: '^(!=|is\s+not)$'}
                - not: {has: {nthChild: 3}}
                - not: {has: {kind: none}}
        - not: {has: {kind: 'elif_clause, else_clause'}}
        - has:
            field: consequence
            all:
                - has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, matches: write}
                - not: {has: {not: {any: [{kind: comment}, {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}, {kind: expression_statement, has: {kind: yield}}]}}}
message: '`$WRITE` converges `$TEST` by hand outside `converged`'
note: 'Use `yield from converged(Row(label=<label>, read=<read>, write=<write>, target=<target>), <plain>)`, `Action(act=<step>)` for a step that reaches the target without receiving it, `converged` alone compares, writes on difference, and returns change lines. Each site takes a manual rewrite, the label names a report entry no matched node holds'
