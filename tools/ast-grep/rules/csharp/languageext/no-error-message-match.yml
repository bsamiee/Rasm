# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-error-message-match
language: csharp
severity: error
utils:
    error-value:
        any:
            - kind: identifier
              pattern: $ERROR
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^InnerException$'}
                - has: {field: expression, matches: error-value}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^GetBaseException$'}}, {has: {field: expression, matches: error-value}}]}
                - has: {field: arguments, not: {has: {kind: argument}}}
    message-text:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^Message$'}
                - has: {field: expression, matches: error-value}
            - kind: conditional_access_expression
              all:
                - has: {field: condition, matches: error-value}
                - has: {kind: member_binding_expression, has: {field: name, regex: '^Message$'}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^ToString$'}}, {has: {field: expression, matches: error-value}}]}
                - has: {field: arguments, not: {has: {kind: argument}}}
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    kind: member_access_expression
                    all:
                        - has: {field: name, regex: '^(Trim|TrimStart|TrimEnd|ToLower|ToLowerInvariant|ToUpper|ToUpperInvariant|Normalize|AsSpan|AsMemory|Substring)$'}
                        - has: {field: expression, matches: message-text}
            - kind: parenthesized_expression
              has: {matches: message-text}
            - kind: interpolated_string_expression
              has: {kind: interpolation, has: {any: [{matches: error-value}, {matches: message-text}]}}
            - kind: identifier
              pattern: $TEXT
              inside:
                stopBy: end
                any:
                    - kind: block
                      has:
                        kind: local_declaration_statement
                        has:
                            kind: variable_declaration
                            has:
                                kind: variable_declarator
                                all:
                                    - has: {field: name, pattern: $TEXT}
                                    - has: {kind: 'member_access_expression, conditional_access_expression, invocation_expression, parenthesized_expression, interpolated_string_expression', matches: message-text}
                    - kind: binary_expression, conditional_expression, if_statement, while_statement, arrow_expression_clause, return_statement, expression_statement
                      has:
                        stopBy: end
                        kind: is_pattern_expression
                        all:
                            - has: {field: expression, kind: 'member_access_expression, conditional_access_expression, invocation_expression, parenthesized_expression, interpolated_string_expression', matches: message-text}
                            - has: {field: pattern, kind: declaration_pattern, has: {field: name, pattern: $TEXT}}
    element-error:
        kind: lambda_expression, anonymous_method_expression
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: $ERROR
                    - kind: parameter_list
                      has: {kind: parameter, has: {field: name, pattern: $ERROR}}
                      not: {has: {kind: parameter, nthChild: 2}}
            - inside:
                kind: argument
                inside:
                    kind: argument_list
                    inside:
                        kind: invocation_expression
                        has: {field: function, kind: member_access_expression, has: {field: expression, kind: member_access_expression, has: {field: name, regex: '^(Inner|Exception)$'}}}
    text-pattern:
        any:
            - kind: constant_pattern
              has: {kind: 'string_literal, verbatim_string_literal, raw_string_literal, interpolated_string_expression'}
            - kind: 'or_pattern, and_pattern, negated_pattern, parenthesized_pattern'
              has: {matches: text-pattern}
    catch-variable:
        kind: catch_clause
        has: {kind: catch_declaration, has: {field: name, pattern: $ERROR}}
    text-comparison:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(==|!=)$'}
                - not: {has: {kind: null_literal}}
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Contains|StartsWith|EndsWith|Equals|IndexOf|LastIndexOf|IndexOfAny|CompareTo)$'}}
            - kind: invocation_expression
              has: {field: function, regex: '^((global::)?System\.)?(string\.(Equals|Compare|CompareOrdinal)|((Text\.)?RegularExpressions\.)?Regex\.(IsMatch|Match|Matches))$'}
            - kind: is_pattern_expression
              has: {field: pattern, matches: text-pattern}
            - kind: switch_expression
              has: {kind: switch_expression_arm, has: {matches: text-pattern}}
rule:
    all:
        - any:
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Contains|StartsWith|EndsWith|Equals|IndexOf|LastIndexOf|CompareTo)$'}}
                - has: {field: function, has: {field: expression, kind: 'string_literal, verbatim_string_literal, raw_string_literal'}}
                - has: {field: arguments, has: {kind: argument, has: {matches: message-text}}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: identifier, pattern: $RELAY}
                - has: {field: arguments, has: {kind: argument, has: {matches: message-text}}}
                - inside:
                    stopBy: end
                    kind: compilation_unit
                    has:
                        stopBy: end
                        kind: method_declaration, local_function_statement
                        all:
                            - has: {field: name, pattern: $RELAY}
                            - has: {field: parameters, has: {kind: parameter, has: {field: type, regex: '^((global::)?System\.)?(string|String)\??$'}}}
                            - has: {field: body, has: {stopBy: end, matches: text-comparison}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(==|!=)$'}
                - has: {matches: message-text}
                - not: {has: {kind: null_literal}}
            - kind: invocation_expression
              has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^(Contains|StartsWith|EndsWith|Equals|IndexOf|LastIndexOf|IndexOfAny|CompareTo)$'}
                    - has: {field: expression, matches: message-text}
            - kind: invocation_expression
              all:
                - has: {field: function, regex: '^((global::)?System\.)?(string\.(Equals|Compare|CompareOrdinal)|((Text\.)?RegularExpressions\.)?Regex\.(IsMatch|Match|Matches))$'}
                - has: {field: arguments, has: {kind: argument, has: {matches: message-text}}}
            - kind: is_pattern_expression
              all:
                - has: {field: expression, matches: message-text}
                - has: {field: pattern, matches: text-pattern}
            - kind: switch_expression
              all:
                - has: {nthChild: 1, matches: message-text}
                - has: {kind: switch_expression_arm, has: {matches: text-pattern}}
            - kind: switch_statement
              all:
                - has: {field: value, matches: message-text}
                - has: {kind: switch_body, has: {kind: switch_section, has: {matches: text-pattern}}}
        - inside:
            stopBy: end
            any:
                - matches: catch-variable
                - matches: element-error
                - matches: {csharp-error-owner: {name: {pattern: $ERROR}, type: {regex: '^((global::)?(LanguageExt\.Common\.)?Error|((global::)?[\w.]+\.)?\w*Exception)$'}}}
message: Error or exception `$ERROR` is classified by its message text
note: Use `HasCode`, `IsType<E>`, `Is`, `HasException<E>`, or an exception type pattern
