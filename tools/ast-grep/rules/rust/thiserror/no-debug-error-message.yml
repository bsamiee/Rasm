# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-debug-error-message
language: rust
severity: error
rule:
    kind: string_literal
    regex: '(^|[^{])(\{\{)*\{[^{}]*:[^{}]*\?\}'
    inside:
        kind: token_tree
        inside: {kind: attribute, field: arguments, has: {nthChild: 1, kind: identifier, regex: '^error$'}, inside: {kind: attribute_item}}
message: '`#[error]` message renders a value through `Debug`'
note: 'Render each value through `Display`, Clippy `use_debug` never reads the format string the thiserror expansion holds. A collection renders through an argument such as `.items.iter().format(", ")` (`itertools::Itertools::format`)'
