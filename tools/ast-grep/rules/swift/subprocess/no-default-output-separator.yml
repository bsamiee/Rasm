# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    decoding:
        has: {stopBy: end, kind: navigation_suffix, regex: '^\.decode$'}
rule:
    kind: call_expression
    pattern: $READ
    all:
        - has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^strings$'}}}
        - has: {kind: call_suffix, has: {kind: value_arguments, not: {has: {kind: value_argument, has: {field: name, regex: '^separatedBy$'}}}}}
        - any:
            - inside: {kind: for_statement, stopBy: {kind: 'for_statement, statements, lambda_literal'}, has: {kind: statements, matches: decoding}}
            - inside: {kind: call_expression, stopBy: {kind: 'statements, lambda_literal'}, has: {kind: call_suffix, has: {kind: lambda_literal, matches: decoding}}}
        - inside: {kind: source_file, stopBy: end, has: {kind: import_declaration, regex: '^import[\t-\r ]+Subprocess$'}}
message: '`$READ` splits decoded output at U+2028 and U+2029 besides newlines'
note: 'Pass `separatedBy: .unicodeScalarSequence(["\n"])` for newline-delimited records'
