id: unquoted-replacement-to-quoted
snapshots:
  result="${value//pattern/$replacement}":
    fixed: result="${value//pattern/"$replacement"}"
    labels:
    - source: $replacement
      style: primary
      start: 25
      end: 37
  result=${value/#pattern/$replacement}:
    fixed: result=${value/#pattern/"$replacement"}
    labels:
    - source: $replacement
      style: primary
      start: 24
      end: 36
  result=${value/%pattern/$replacement}:
    fixed: result=${value/%pattern/"$replacement"}
    labels:
    - source: $replacement
      style: primary
      start: 24
      end: 36
  result=${value//@JOB@/${root}}:
    fixed: result=${value//@JOB@/"${root}"}
    labels:
    - source: ${root}
      style: primary
      start: 22
      end: 29
  result=${value//pattern/"$first"$second}:
    fixed: result=${value//pattern/"$first""$second"}
    labels:
    - source: $second
      style: primary
      start: 32
      end: 39
  result=${value//pattern/$(produce)}:
    fixed: result=${value//pattern/"$(produce)"}
    labels:
    - source: $(produce)
      style: primary
      start: 24
      end: 34
  result=${value//pattern/$1}:
    fixed: result=${value//pattern/"$1"}
    labels:
    - source: $1
      style: primary
      start: 24
      end: 26
  result=${value//pattern/$replacement}:
    fixed: result=${value//pattern/"$replacement"}
    labels:
    - source: $replacement
      style: primary
      start: 24
      end: 36
  result=${value//pattern/${!name}}:
    fixed: result=${value//pattern/"${!name}"}
    labels:
    - source: ${!name}
      style: primary
      start: 24
      end: 32
  result=${value//pattern/${replacement:-none}}:
    fixed: result=${value//pattern/"${replacement:-none}"}
    labels:
    - source: ${replacement:-none}
      style: primary
      start: 24
      end: 44
  result=${value//pattern/${replacements[$index]:-none}}:
    fixed: result=${value//pattern/"${replacements[$index]:-none}"}
    labels:
    - source: ${replacements[$index]:-none}
      style: primary
      start: 24
      end: 53
  result=${value//pattern/${replacements[$index]}}:
    fixed: result=${value//pattern/"${replacements[$index]}"}
    labels:
    - source: ${replacements[$index]}
      style: primary
      start: 24
      end: 47
  result=${value//pattern/${replacements[0]}}:
    fixed: result=${value//pattern/"${replacements[0]}"}
    labels:
    - source: ${replacements[0]}
      style: primary
      start: 24
      end: 42
  result=${value//pattern/&$suffix}:
    fixed: result=${value//pattern/&"$suffix"}
    labels:
    - source: $suffix
      style: primary
      start: 25
      end: 32
  result=${value//pattern/prefix$replacement}:
    fixed: result=${value//pattern/prefix"$replacement"}
    labels:
    - source: $replacement
      style: primary
      start: 30
      end: 42
  result=${value/pattern/$replacement}:
    fixed: result=${value/pattern/"$replacement"}
    labels:
    - source: $replacement
      style: primary
      start: 23
      end: 35
  result=${values[@]/#/$root/}:
    fixed: result=${values[@]/#/"$root"/}
    labels:
    - source: $root
      style: primary
      start: 21
      end: 26
