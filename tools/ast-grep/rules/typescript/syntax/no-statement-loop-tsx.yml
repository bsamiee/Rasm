# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-tsx
language: tsx
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
          not: {has: {regex: '^await$'}}
        - kind: for_statement, while_statement, do_statement
transform:
    HEAD: {replace: {source: $LOOP, replace: '(?s)\s*\{?\s*\n.*$', by: ''}}
message: '`$HEAD` iterates by statement'
note: 'Call an array or iterator helper, `Array.unfold(<state>, <step>)` for an advancing state, `Effect.forEach(<list>, <f>)`, or `Effect.whileLoop`'
labels:
    LOOP: {style: primary}
