# --- [PROJECT] --------------------------------------------------------------------------

name: rasm

# --- [DEFAULTS] -------------------------------------------------------------------------

x-server: &server {logging: {driver: local}, oom_score_adj: -500, restart: on-failure}
x-app: &app {logging: {driver: local}, oom_score_adj: 500, profiles: [app], restart: on-failure}
x-probe: &probe {interval: 5m, start_interval: 1s, start_period: 5m}
x-postgres: &postgres {<<: *server, image: rasm-postgres}
x-backup: &backup {AWS_ACCESS_KEY_ID: "${BACKUP_ACCESS_KEY_ID:-}", AWS_ENDPOINT_URL: "${BACKUP_ENDPOINT:-}", AWS_REGION: "${BACKUP_REGION:-}", AWS_SECRET_ACCESS_KEY: "${BACKUP_SECRET_ACCESS_KEY:-}"}
x-bucket: &bucket
    entrypoint: [sh, -c, '{ aws s3api head-bucket --bucket "$$0" 2>/dev/null || aws s3 mb "s3://$$0"; } && aws s3api put-bucket-lifecycle-configuration --bucket "$$0" --lifecycle-configuration "$$1"']
    image: "amazon/aws-cli:2.39.7"
    logging: {driver: local}
    profiles: [deployed]
    restart: "no"
x-litestream: &litestream {<<: *app, configs: [{source: litestream, target: /etc/litestream.yml}], environment: *backup, image: "litestream/litestream:0.5.18-scratch"}

# --- [SERVICES] -------------------------------------------------------------------------

services:

    # --- [STORES]

    postgres:
        <<: *postgres
        build:
            additional_contexts: {postgres: "docker-image://postgres:19rc1-trixie"}
            dockerfile_inline: |
                FROM postgres
                RUN apt-get update && apt-get install --yes --no-install-recommends ca-certificates pgbackrest pgbouncer postgresql-$${PG_MAJOR}-cron postgresql-$${PG_MAJOR}-hypopg postgresql-$${PG_MAJOR}-partman postgresql-$${PG_MAJOR}-pgaudit postgresql-$${PG_MAJOR}-pgvector postgresql-$${PG_MAJOR}-postgis-3 && rm -rf /var/lib/apt/lists/*
                ENV PGBACKREST_PG1_PATH=$${PGDATA}
        command: [postgres, -c, "shared_preload_libraries=pg_stat_statements,auto_explain,pg_plan_advice,pgaudit,pg_cron", -c, auto_explain.log_format=json, -c, auto_explain.log_min_duration=1s, -c, temp_file_limit=10GB,
            -c, "synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}", -c, "archive_mode=${POSTGRES_ARCHIVE_MODE:-off}", -c, "archive_command=${POSTGRES_ARCHIVE_COMMAND:-}", -c, "pgaudit.log=${POSTGRES_AUDIT_LOG:-none}", -c, "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"]
        configs: [{source: postgres-init, target: /docker-entrypoint-initdb.d/extensions.sql}]
        environment: &postgres-environment {PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: 4GiB, PGBACKREST_COMPRESS_TYPE: zst, PGBACKREST_PROCESS_MAX: "4", PGBACKREST_REPO1_BLOCK: "y", PGBACKREST_REPO1_BUNDLE: "y", PGBACKREST_REPO1_PATH: /postgres,
            PGBACKREST_REPO1_RETENTION_FULL: "${BACKUP_RETENTION_DAYS:-30}", PGBACKREST_REPO1_RETENTION_FULL_TYPE: time, PGBACKREST_REPO1_S3_BUCKET: "${BACKUP_BUCKET:-}", PGBACKREST_REPO1_S3_ENDPOINT: "${BACKUP_HOST:-}",
            PGBACKREST_REPO1_S3_KEY: "${BACKUP_ACCESS_KEY_ID:-}", PGBACKREST_REPO1_S3_KEY_SECRET: "${BACKUP_SECRET_ACCESS_KEY:-}", PGBACKREST_REPO1_S3_REGION: "${BACKUP_REGION:-}", PGBACKREST_REPO1_S3_URI_STYLE: path, PGBACKREST_REPO1_TYPE: s3,
            PGBACKREST_STANZA: postgres, PGBACKREST_START_FAST: "y", PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}", POSTGRES_USER: postgres,
            POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --locale-provider=builtin --builtin-locale=PG_UNICODE_FAST}
        healthcheck: {<<: *probe, test: [CMD, pg_isready, --host, /var/run/postgresql]}
        labels: {docker-volume-backup.archive-pre: "gosu postgres sh -c 'pgbackrest backup --type=$$([ \"$$(date +%u)\" = 1 ] && echo full || echo incr)'"}
        ports: [{app_protocol: postgresql, host_ip: 127.0.0.1, target: 5432}]
        stop_grace_period: 2m
        volumes: [postgres:/var/lib/postgresql, postgres-socket:/var/run/postgresql]
    pgbouncer:
        <<: *postgres
        command: [pgbouncer, /etc/pgbouncer/pgbouncer.ini]
        configs: [{source: pgbouncer, target: /etc/pgbouncer/pgbouncer.ini}, {source: pgbouncer-users, target: /etc/pgbouncer/userlist.txt}]
        depends_on: {postgres: {condition: service_healthy}}
        healthcheck: {<<: *probe, test: [CMD, pg_isready, --host, 127.0.0.1, --port, "6432"]}
        ports: [{app_protocol: postgresql, host_ip: 127.0.0.1, target: 6432}]
        user: postgres
        volumes: [postgres-socket:/var/run/postgresql]
    clickhouse:
        <<: *server
        configs: [{source: clickhouse, target: /etc/clickhouse-server/config.d/rasm.xml}, {source: clickhouse-users, target: /etc/clickhouse-server/users.d/rasm.xml}]
        environment: {CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1", CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-clickhouse}", CLICKHOUSE_READER_MEMORY: "${CLICKHOUSE_READER_MEMORY:-0}", CLICKHOUSE_READER_PASSWORD: "${CLICKHOUSE_READER_PASSWORD:-clickhouse-reader}", CLICKHOUSE_USER: default}
        healthcheck: {<<: *probe, test: [CMD, clickhouse, client, --query, SELECT 1]}
        image: clickhouse/clickhouse-server:26.10.3.7
        ports: [{host_ip: 127.0.0.1, target: 9000}, {app_protocol: http, host_ip: 127.0.0.1, target: 8123}]
        stop_grace_period: 2m
        ulimits: {nofile: 262144}
        volumes: [clickhouse:/var/lib/clickhouse]
    otelcol:
        <<: *server
        configs: [{source: otelcol, target: /etc/otelcol-contrib/config.yaml}]
        depends_on: {clickhouse: {condition: service_healthy}}
        environment: {CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-clickhouse}"}
        image: otel/opentelemetry-collector-contrib:0.165.0
        ports: [{app_protocol: grpc, host_ip: 127.0.0.1, published: "4317", target: 4317}, {app_protocol: http, host_ip: 127.0.0.1, published: "4318", target: 4318}]
        user: "0"
        volumes: [otelcol:/var/lib/otelcol/file_storage]
    storage:
        <<: *server
        environment: {RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}", RUSTFS_CONSOLE_ENABLE: "false", RUSTFS_REGION: &region us-east-1, RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"}
        healthcheck: {<<: *probe, test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/health/ready]}
        image: rustfs/rustfs:1.0.4
        ports: [{app_protocol: http, host_ip: 127.0.0.1, target: 9000}]
        volumes: [storage:/data]

    # --- [PLATFORM]

    traefik:
        <<: *server
        environment: {TRAEFIK_CERTIFICATESRESOLVERS_ACME_ACME_STORAGE: /var/lib/traefik/acme.json, TRAEFIK_CERTIFICATESRESOLVERS_ACME_ACME_TLSCHALLENGE: "true", TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80", TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443", TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS: "true", TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER: "${TRAEFIK_CERTRESOLVER:-}", TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT: 30m, TRAEFIK_PING: "true", TRAEFIK_PROVIDERS_DOCKER: "true", TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"}
        healthcheck: {<<: *probe, test: [CMD, traefik, healthcheck]}
        image: traefik:v3.8.0-rc.1
        ports: ["80:80", "443:443"]
        profiles: [platform]
        volumes: [/var/run/docker.sock:/var/run/docker.sock:ro, traefik:/var/lib/traefik]
    authelia:
        <<: *server
        configs: [{source: authelia, target: /config/configuration.yml}, {source: authelia-users, target: /config/users.yml}]
        environment: {AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:-authelia-session}", AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:-authelia-storage-encryption}"}
        healthcheck: {<<: *probe, test: [CMD, /app/healthcheck.sh]}
        image: authelia/authelia:4.39.28
        labels: {traefik.enable: "true", traefik.http.routers.authelia.rule: "Host(`auth.${PLATFORM_DOMAIN:-rasm.localhost}`)", traefik.http.routers.authelia.entrypoints: websecure, traefik.http.middlewares.authelia.chain.middlewares: "authelia-strip,authelia-check",
            traefik.http.middlewares.authelia-strip.headers.customrequestheaders.Remote-User: "", traefik.http.middlewares.authelia-strip.headers.customrequestheaders.Remote-Email: "",
            traefik.http.middlewares.authelia-check.forwardauth.address: "http://authelia:9091/api/authz/forward-auth", traefik.http.middlewares.authelia-check.forwardauth.authResponseHeaders: "Remote-User,Remote-Email"}
        profiles: [platform]
        volumes: [authelia:/var/lib/authelia]
    grafana-database:
        <<: *postgres
        command: [sh, -c, 'psql --tuples-only --command "SELECT 1 FROM pg_database WHERE datname = ''grafana''" | grep --quiet 1 || createdb grafana']
        depends_on: {postgres: {condition: service_healthy}}
        environment: {PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}"}
        profiles: [platform]
        restart: "no"
        user: postgres
        volumes: [postgres-socket:/var/run/postgresql]
    grafana:
        <<: *server
        configs: [{source: grafana-datasources, target: /etc/grafana/provisioning/datasources/clickhouse.yaml}, {source: grafana-dashboards, target: /etc/grafana/provisioning/dashboards/clickhouse.yaml}]
        depends_on: {grafana-database: {condition: service_completed_successfully}}
        environment: {CLICKHOUSE_READER_PASSWORD: "${CLICKHOUSE_READER_PASSWORD:-clickhouse-reader}", GF_AUTH_PROXY_ENABLED: "true", GF_AUTH_PROXY_HEADER_NAME: Remote-User, GF_AUTH_PROXY_HEADERS: "Email:Remote-Email",
            GF_DATABASE_HOST: "postgres:5432", GF_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-postgres}", GF_DATABASE_TYPE: postgres, GF_DATABASE_USER: postgres, GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.4,
            GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true", GF_SERVER_ROOT_URL: "https://grafana.${PLATFORM_DOMAIN:-rasm.localhost}", GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin}
        healthcheck: {<<: *probe, test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/api/health]}
        image: grafana/grafana:13.3.0
        labels: {traefik.enable: "true", traefik.http.routers.grafana.entrypoints: websecure, traefik.http.routers.grafana.middlewares: authelia, traefik.http.routers.grafana.rule: "Host(`grafana.${PLATFORM_DOMAIN:-rasm.localhost}`)"}
        profiles: [platform]
        volumes: [grafana:/var/lib/grafana]

    # --- [DEPLOYED]

    backup:
        <<: *server
        environment: {AWS_ACCESS_KEY_ID: "${BACKUP_ACCESS_KEY_ID:-}", AWS_ENDPOINT: "${BACKUP_HOST:-}", AWS_S3_BUCKET_NAME: "${BACKUP_BUCKET:-}", AWS_S3_PATH: volumes, AWS_SECRET_ACCESS_KEY: "${BACKUP_SECRET_ACCESS_KEY:-}", BACKUP_PRUNING_PREFIX: backup-, BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}",
            EXEC_FORWARD_OUTPUT: "true"}
        depends_on: {backup-bucket: {condition: service_completed_successfully}, postgres-stanza: {condition: service_completed_successfully}}
        image: offen/docker-volume-backup:v2.50.1
        profiles: [deployed]
        volumes: [/var/run/docker.sock:/var/run/docker.sock:ro, authelia:/backup/authelia:ro]
    clickhouse-backup:
        <<: *server
        command: [watch]
        depends_on: {backup-bucket: {condition: service_completed_successfully}, clickhouse: {condition: service_healthy}}
        environment: {BACKUPS_TO_KEEP_LOCAL: "-1", BACKUPS_TO_KEEP_REMOTE: "${BACKUP_RETENTION_DAYS:-30}", CLICKHOUSE_HOST: clickhouse, CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-clickhouse}", REMOTE_STORAGE: s3, S3_ACCESS_KEY: "${BACKUP_ACCESS_KEY_ID:-}", S3_BUCKET: "${BACKUP_BUCKET:-}",
            S3_ENDPOINT: "${BACKUP_ENDPOINT:-}", S3_FORCE_PATH_STYLE: "true", S3_PATH: clickhouse, S3_REGION: "${BACKUP_REGION:-}", S3_SECRET_KEY: "${BACKUP_SECRET_ACCESS_KEY:-}", WATCH_BACKUP_NAME_TEMPLATE: "{type}-{time:20060102150405}",
            WATCH_SCHEDULES: "name=daily,full=@monthly,increment=@daily"}
        image: altinity/clickhouse-backup:2.8.3
        profiles: [deployed]
        volumes: [clickhouse:/var/lib/clickhouse]

    backup-bucket:
        <<: *bucket
        command: ["${BACKUP_BUCKET:-backup}", '{"Rules": [{"ID": "versions", "Status": "Enabled", "Filter": {"Prefix": ""}, "NoncurrentVersionExpiration": {"NoncurrentDays": 1}, "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 1}}]}']
        environment: *backup
    postgres-stanza: {<<: *postgres, command: [pgbackrest, stanza-create], depends_on: {backup-bucket: {condition: service_completed_successfully}, postgres: {condition: service_healthy}}, environment: *postgres-environment, profiles: [deployed], restart: "no", user: postgres, volumes: [postgres:/var/lib/postgresql, postgres-socket:/var/run/postgresql]}
    nx-cache-bucket:
        <<: *bucket
        command: [&nx-cache nx-cache, '{"Rules": [{"ID": "age", "Status": "Enabled", "Filter": {"Prefix": ""}, "Expiration": {"Days": 7}}]}']
        depends_on: {storage: {condition: service_healthy}}
        environment: &storage-client {AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY:-rustfsadmin}", AWS_ENDPOINT_URL: &storage-endpoint "http://storage:9000", AWS_REGION: *region, AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"}
    nx-cache:
        <<: *server
        build:
            additional_contexts: {distroless: "docker-image://gcr.io/distroless/cc-debian13:nonroot"}
            dockerfile_inline: |
                FROM scratch AS amd64
                ADD --checksum=sha256:18fa55033d5f0d1b18fc192b75ca35f39d2cb81938bbc559f7a9f5b686f4046f --chmod=755 https://github.com/nxcite/nx-cache-server/releases/download/v1.4.5/nx-cache-aws-v1.4.5-linux-x86_64 /nx-cache-aws
                FROM scratch AS arm64
                ADD --checksum=sha256:a20a6bdee0b869d7e8ade7319030f94b72c69358b47f08fbc3bd331d9dc66e5c --chmod=755 https://github.com/nxcite/nx-cache-server/releases/download/v1.4.5/nx-cache-aws-v1.4.5-linux-arm64 /nx-cache-aws
                FROM $${TARGETARCH} AS release
                FROM distroless
                COPY --from=release /nx-cache-aws /
                ENTRYPOINT ["/nx-cache-aws"]
        depends_on: {nx-cache-bucket: {condition: service_completed_successfully}}
        environment: {<<: *storage-client, READ_ONLY_ACCESS_TOKEN: "${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:-nx-cache-read}", S3_BUCKET_NAME: *nx-cache, S3_ENDPOINT_URL: *storage-endpoint, SERVICE_ACCESS_TOKEN: "${NX_CACHE_WRITE_TOKEN:-nx-cache-write}"}
        image: rasm-nx-cache
        labels: {traefik.enable: "true", traefik.http.routers.nx-cache.entrypoints: websecure, traefik.http.routers.nx-cache.rule: "Host(`nx-cache.${PLATFORM_DOMAIN:-rasm.localhost}`)", traefik.http.services.nx-cache.loadbalancer.server.port: "3000"}
        profiles: [deployed]

    # --- [APP]

    app:
        <<: *app
        build:
            additional_contexts: {node: "docker-image://dhi.io/node:${NODE_VERSION}"}
            dockerfile_inline: |
                FROM scratch AS assets
                FROM node
                ARG ASSETS
                WORKDIR /app
                COPY --from=assets . $${ASSETS}
                COPY . .
        cpus: 1
        entrypoint: [node]
        environment: {OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4318"}
        extra_hosts: [host.docker.internal:host-gateway]
        mem_limit: 1g
    litestream-restore: {<<: *litestream, command: [restore, -config, /etc/litestream.yml, -if-db-not-exists, -if-replica-exists, -integrity-check, quick, /data/database.sqlite], restart: "no"}
    litestream: {<<: *litestream, command: [replicate, -config, /etc/litestream.yml]}
    cache:
        <<: *app
        command: [valkey-server, --save, "", --maxmemory-policy, allkeys-lfu]
        healthcheck: {<<: *probe, test: [CMD, valkey-cli, ping]}
        image: valkey/valkey:9.2.0-rc2-trixie
        ports: [{app_protocol: redis, host_ip: 127.0.0.1, target: 6379}]

    # --- [TOOLS]

    verapdf: {image: "verapdf/cli:v1.30.3", network_mode: none, profiles: [tools]}

# --- [CONFIGS] --------------------------------------------------------------------------

configs:
    postgres-init: {content: "CREATE ROLE store NOLOGIN CREATEROLE;\n\\connect template1\nCREATE EXTENSION pg_stat_statements;\nCREATE EXTENSION vector;\n"}
    pgbouncer:
        content: |
            [databases]
            * = host=/var/run/postgresql
            [users]
            postgres = pool_mode=session max_user_connections=5
            [pgbouncer]
            listen_addr = *
            auth_type = scram-sha-256
            auth_file = /etc/pgbouncer/userlist.txt
            auth_user = postgres
            admin_users = postgres
            pool_mode = transaction
            max_client_conn = 1000
            default_pool_size = 3
            max_user_connections = 90
            server_idle_timeout = 10
            autodb_idle_timeout = 60
    pgbouncer-users: {content: "\"postgres\" \"${POSTGRES_PASSWORD:-postgres}\"\n"}
    clickhouse:
        content: |
            <clickhouse>
                <cache_size_to_ram_max_ratio>0.2</cache_size_to_ram_max_ratio>
                <concurrent_threads_scheduler>max_min_fair</concurrent_threads_scheduler>
                <merge_tree><default_compression_codec>ZSTD(3)</default_compression_codec></merge_tree>
                <query_log><ttl>event_date + INTERVAL 30 DAY DELETE</ttl></query_log>
                <part_log><ttl>event_date + INTERVAL 30 DAY DELETE</ttl></part_log>
                <asynchronous_metric_log remove="1"/><metric_log remove="1"/><query_metric_log remove="1"/><text_log remove="1"/><trace_log remove="1"/>
                <storage_configuration><disks><default><keep_free_space_bytes>10737418240</keep_free_space_bytes></default></disks></storage_configuration>
            </clickhouse>
    clickhouse-users:
        content: |
            <clickhouse>
                <profiles><reader><readonly>1</readonly><max_memory_usage from_env="CLICKHOUSE_READER_MEMORY"/><constraints><max_execution_time><changeable_in_readonly/></max_execution_time></constraints></reader></profiles>
                <users>
                    <reader><password from_env="CLICKHOUSE_READER_PASSWORD"/><profile>reader</profile><grants><query>GRANT SELECT ON *.*</query></grants></reader>
                </users>
            </clickhouse>
    otelcol:
        content: |
            extensions: {file_storage: {}}
            receivers: {otlp: {protocols: {grpc: {endpoint: "0.0.0.0:4317"}, http: {endpoint: "0.0.0.0:4318"}}}}
            processors: {memory_limiter: {check_interval: 1s, limit_mib: 512}}
            exporters: {clickhouse: {endpoint: "tcp://clickhouse:9000", username: default, password: "$${env:CLICKHOUSE_PASSWORD}", database: otel, ttl: 2160h, sending_queue: {storage: file_storage, batch: {flush_timeout: 5s}}, retry_on_failure: {max_elapsed_time: 0}}}
            service:
                extensions: [file_storage]
                pipelines: {logs: &otelcol-pipeline {receivers: [otlp], processors: [memory_limiter], exporters: [clickhouse]}, metrics: *otelcol-pipeline, traces: *otelcol-pipeline}
    authelia:
        content: |
            access_control: {default_policy: one_factor}
            authentication_backend: {file: {path: /config/users.yml}, password_reset: {disable: true}}
            notifier: {filesystem: {filename: /var/lib/authelia/notification.txt}}
            ntp: {disable_startup_check: true}
            session: {cookies: [{domain: "${PLATFORM_DOMAIN:-rasm.localhost}", authelia_url: "https://auth.${PLATFORM_DOMAIN:-rasm.localhost}"}]}
            storage: {local: {path: /var/lib/authelia/db.sqlite3}}
    authelia-users: {content: "users: {owner: {displayname: Owner, email: \"${OWNER_EMAIL:-}\", password: \"${AUTHELIA_OWNER_PASSWORD_HASH:-$$argon2id$$v=19$$m=65536,t=3,p=4$$zmt3mCR+EL+Uztmb1lGodA$$r1md2sKE/sApAFxtq/Dod8SCo7vuQxthluI4elOHsUw}\"}}\n"}
    grafana-datasources:
        content: |
            apiVersion: 1
            datasources:
                - name: ClickHouse
                  uid: clickhouse
                  type: grafana-clickhouse-datasource
                  jsonData: {host: clickhouse, port: 9000, protocol: native, username: reader, defaultDatabase: otel, logs: {defaultDatabase: otel, defaultTable: otel_logs, otelEnabled: true, otelVersion: latest}, traces: {defaultDatabase: otel, defaultTable: otel_traces, otelEnabled: true, otelVersion: latest}}
                  secureJsonData: {password: $$CLICKHOUSE_READER_PASSWORD}
    grafana-dashboards: {content: "apiVersion: 1\nproviders: [{name: clickhouse, options: {path: /var/lib/grafana/plugins/grafana-clickhouse-datasource/dashboards}}]\n"}
    litestream: {content: "dbs: [{path: /data/database.sqlite, replica: {url: \"$${LITESTREAM_REPLICA_URL}\", endpoint: \"$${AWS_ENDPOINT_URL}\"}}]\n"}

# --- [VOLUMES] --------------------------------------------------------------------------

volumes: {authelia: {}, clickhouse: {}, grafana: {}, otelcol: {}, postgres: {}, postgres-socket: {}, storage: {}, traefik: {}}
