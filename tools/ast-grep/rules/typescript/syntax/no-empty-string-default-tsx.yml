# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-string-default-tsx
language: tsx
severity: error
utils:
    empty-string:
        any:
            - kind: string
              not: {has: {kind: string_fragment}}
            - kind: template_string
              not: {has: {kind: 'string_fragment, template_substitution'}}
    indexed-element:
        pattern: $ELEMENT
        any:
            - kind: subscript_expression
              has: {field: index, any: [{kind: number}, {kind: unary_expression, has: {field: argument, kind: number}}]}
            - kind: call_expression
              has: {field: function, kind: member_expression, has: {field: property, regex: '^(at|find|findLast|pop|shift)$'}}
    concatenation:
        any:
            - kind: binary_expression
              has: {field: operator, regex: '^\+$'}
            - kind: template_substitution
rule:
    any:
        - kind: binary_expression
          all:
            - has: {field: left, matches: indexed-element}
            - has: {field: operator, regex: '^(\?\?|\|\|)$'}
            - has: {field: right, matches: empty-string}
            - not: {inside: {matches: concatenation, stopBy: {not: {kind: parenthesized_expression}}}}
        - kind: 'assignment_pattern, object_assignment_pattern'
          all:
            - inside: {kind: 'array_pattern, object_pattern, pair_pattern'}
            - has: {field: left, pattern: $ELEMENT}
            - has: {field: right, matches: empty-string}
            - not: {inside: {kind: 'required_parameter, optional_parameter', stopBy: {not: {kind: 'array_pattern, object_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, rest_pattern'}}}}
message: '`$ELEMENT` defaults to an empty string standing for an absent element'
note: 'Keep an absent element as `undefined` in its type or as the `Option` `Array.head` returns, an empty string passes as a real value'
