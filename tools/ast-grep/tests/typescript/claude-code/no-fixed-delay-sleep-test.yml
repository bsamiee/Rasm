id: no-fixed-delay-sleep
valid:
    # The instance, a delay a source states under its named constant with the source comment, and the abort signal
    - |
      // The server applies a .cs write 200 ms after the watcher event (RoslynCodeLens FileChangeTracker.cs:251, a one-shot
      // Timer with 200 ms) and every tool reads the stale compilation inside that window
      const _WATCHER_SETTLE_MS = 206;
      await $.clock.sleep(_WATCHER_SETTLE_MS, { signal: next.signal });
    # Source comment on the line directly above the declaration
    - |
      // The watcher settles 200 ms after the event, FileChangeTracker.cs:251
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Signal spread from an init built elsewhere
    - |
      // FileChangeTracker.cs:251 states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { ...init });
    # The remaining wait computed from the write's time, a parameter as the duration with the signal
    - |
      const waited = await _settle(input, at, $.clock.now(), (ms) => $.clock.sleep(ms, { signal: next.signal }));
    # A call as the duration, the wait read from state, with the signal
    - |
      await $.clock.sleep(settleWait(some(at), $.clock.now()), { signal: next.signal });
    # Name bound to a computed wait, no literal
    - |
      const wait = settleWait(some(at), $.clock.now());
      await $.clock.sleep(wait, { signal });
    # Sleep on another object, the engine interface alone is $
    - |
      await timer.clock.sleep(200);
    # Another clock verb with a literal
    - |
      $.clock.after(200, tick);
    # Another noun with a sleep verb
    - |
      await $.process.sleep(200);
    # Init built elsewhere as a value, the shape cannot read the signal it carries
    - |
      // FileChangeTracker.cs:251 states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, init);
    # Block comment naming the source line
    - |
      /* FileChangeTracker.cs:251 states the timer */
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Exported constant under the source comment
    - |
      // FileChangeTracker.cs:251 states the timer
      export const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Exported constant under a run of comments with the source line on the first, the walk passes the later comment
    - |
      // The watcher settles 200 ms after the event, FileChangeTracker.cs:251
      // and the constant adds a margin
      export const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
invalid:
    # Literal duration
    - |
      await $.clock.sleep(200);
    # Literal duration beside the signal, the number states no source
    - |
      await $.clock.sleep(200, { signal: next.signal });
    # Negative literal
    - |
      await $.clock.sleep(-1);
    # Name declared with no comment
    - |
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Name declared under a comment naming no source line
    - |
      // The watcher settles after the event
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Sourced name with no signal, the sleep outlives the call it waits for
    - |
      // FileChangeTracker.cs:251 states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS);
    # Sourced name with an init naming no signal
    - |
      // FileChangeTracker.cs:251 states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { reason });
    # Sourced name with an init pair under another key
    - |
      // FileChangeTracker.cs:251 states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { timeoutMs: bound });
    # Constant declared inside the hook body with no comment
    - |
      on('tool.call', async ($, e, next) => {
          const _SETTLE_MS = 206;
          await $.clock.sleep(_SETTLE_MS, { signal: next.signal });
          return next(e);
      });
    # Source comment separated from the declaration by a statement
    - |
      // FileChangeTracker.cs:251 states the timer
      const _OTHER = 1;
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Member read as the duration with no signal
    - |
      await $.clock.sleep(options.delay);
    # Parameter as the duration with no signal
    - |
      const wait = (ms) => $.clock.sleep(ms);
    # Constant declared as a signed literal with no comment
    - |
      const _SETTLE_MS = -1;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Sleep inside a hook with a literal
    - |
      on('tool.call', async ($, e, next) => {
          await $.clock.sleep(50, { signal: next.signal });
          return next(e);
      });
    # Comment naming the file with no line number
    - |
      // FileChangeTracker.cs states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Comment naming a line with no file extension
    - |
      // FileChangeTracker:251 states the timer
      const _SETTLE_MS = 206;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Literal arithmetic as the duration
    - |
      await $.clock.sleep(2 * 100, { signal });
    # Constant declared as literal arithmetic with no comment
    - |
      const _SETTLE_MS = 200 + 6;
      await $.clock.sleep(_SETTLE_MS, { signal });
    # Hexadecimal literal duration beside the signal
    - |
      await $.clock.sleep(0xc8, { signal });
    # Constant declared through let with no comment
    - |
      let _settle = 206;
      await $.clock.sleep(_settle, { signal });
    # Literal arithmetic with a parenthesized operand
    - |
      await $.clock.sleep(2 * (100 + 3), { signal });
