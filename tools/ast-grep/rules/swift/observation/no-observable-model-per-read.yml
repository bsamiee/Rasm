# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observable-model-per-read
language: swift
severity: error
utils:
    observable: {kind: modifiers, has: {kind: attribute, regex: '^@Observable$'}}
rule:
    kind: property_declaration
    all:
        - has: {kind: type_annotation, has: {kind: array_type, has: {kind: user_type, pattern: $T}}}
        - has:
            kind: computed_property
            has:
                kind: statements
                has:
                    nthChild: 1
                    any:
                        - pattern: '$S.$MAP { $E in $T($$$A) }'
                        - pattern: '$S.$MAP { $T($$$A) }'
                        - pattern: '$S.$MAP($T.init)'
                        - pattern: '$S.$MAP($T.init($$$L))'
        - inside:
            kind: class_body
            inside: {kind: class_declaration, has: {matches: observable}}
        - inside:
            kind: source_file
            stopBy: end
            has:
                kind: class_declaration
                all:
                    - has: {matches: observable}
                    - has: {field: name, pattern: $T}
constraints:
    MAP: {regex: '^(map|compactMap)$'}
message: '`$T` hands observers a new untracked object per element of `$S` on every read'
note: 'Store an array of per-item `@Observable` models'
