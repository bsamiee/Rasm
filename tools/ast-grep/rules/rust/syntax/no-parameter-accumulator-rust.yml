# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parameter-accumulator-rust
language: rust
severity: error
utils:
    out-type:
        any:
            - kind: primitive_type
            - {kind: type_identifier, regex: '^String$'}
            - kind: generic_type
              has: {field: type, regex: '(^|::)(Option|Vec|VecDeque|BTreeMap|BTreeSet|HashMap|HashSet|IndexMap|IndexSet)$'}
    out-parameter:
        kind: parameter
        all:
            - has: {field: pattern, kind: identifier, pattern: $P}
            - has: {field: type, kind: reference_type, all: [{has: {kind: mutable_specifier}}, {has: {field: type, matches: out-type}}]}
    target:
        any:
            - {kind: identifier, pattern: $P}
            - {kind: unary_expression, regex: '^\*', has: {kind: identifier, pattern: $P}}
            - {kind: parenthesized_expression, has: {matches: target}}
    write:
        any:
            - kind: 'assignment_expression, compound_assignment_expr'
              has: {field: left, matches: target}
            - kind: call_expression
              has:
                field: function
                kind: field_expression
                all:
                    - has: {field: value, matches: target}
                    - has: {field: field, regex: '^(push|push_mut|push_str|push_back|push_back_mut|push_front|push_front_mut|insert|insert_mut|insert_str|try_insert|extend|append|clear|remove|try_remove|remove_matches|retain|retain_mut|extract_if|truncate|drain|split_off|split_off_first|split_off_last|sort|sort_by|sort_by_key|sort_unstable|dedup|replace|take|take_if|get_or_insert|get_or_insert_with|get_or_insert_default|entry|pop|pop_if|pop_back|pop_back_if|pop_front|pop_front_if|resize|swap_remove|reserve)$'}
rule:
    kind: parameter
    matches: out-parameter
    inside:
        kind: parameters
        inside:
            kind: function_item
            all:
                - has: {field: name, pattern: $NAME}
                - not: {matches: rust-trait-or-extern-function}
                - has: {field: body, has: {stopBy: end, matches: write, pattern: $WRITE}}
message: '`$WRITE` writes the result of `$NAME` into its parameter `$P`'
note: 'Return the value, or a `Result` holding it, and let the caller bind it'
