id: echo-expansion-to-printf
valid:
    - echo "done"
    - echo "$x" "$y"
    - echo $x
    - echo "$x"y
    - echo -ne "$x"
    - echo -E "$x"
    - echo -n -e "$x"
    - echo "$x" -n
    - echo -n
    - echo $y "$x"
    - X=1 echo "$x"
    - cat "$file"
    - "printf '%s\\n' \"$x\""
    - echo "$@"
    - echo "${values[@]}"
    - echo "${!prefix@}"
    - echo "${@:2}"
invalid:
    - echo "$x"
    - echo -n "$x"
    - echo -e "$x\n$y"
    - echo "$x" >&2
    - echo "$(date)"
    - echo "$*"
    - echo "${values[*]}"
    - echo "user@$host"
    - y=$(echo "$x")
    - 'echo "value: ${count}"'
    - |
      report() {
          echo "$1" | sort
      }
