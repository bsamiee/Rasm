# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-star-literal-glob
language: rust
rule:
    kind: call_expression
    all:
        - has:
            field: function
            kind: field_expression
            all:
                - has: {field: field, regex: '^(strip_prefix|strip_suffix|starts_with|ends_with|split|splitn|rsplit|split_once|rsplit_once|contains|find|replace|trim_start_matches|trim_end_matches)$'}
                - has: {field: value, regex: '(?i)(^|[^a-z0-9])(pat|pattern|glob|wildcard)s?(\.as_str\(\)|\.as_ref\(\))?$'}
        - has:
            field: arguments
            has:
                nthChild: 1
                any:
                    - {kind: string_literal, regex: '\*', not: {regex: '\.\*'}}
                    - {kind: char_literal, regex: '^''\*''$'}
