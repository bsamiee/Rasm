# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-map-over-from-boolean-by-hand
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    # The body of liftPredicate is the one two-call form, the walk stops at the nearest binding
    not: {inside: {stopBy: {any: [{kind: variable_declarator}, {kind: function_declaration}]}, matches: claude-code-option-operation}}
    any:
        # Thunk over a value with no literal or cast type, the sibling no-map-over-from-boolean names the type it reads off the value
        - pattern: map(() => $X)(fromBoolean($C))
          not: {has: {field: function, has: {field: arguments, has: {kind: arrow_function, has: {field: body, matches: syntax-typed-value}}}}}
        # Thunk passed point-free, a name, a member, or a call producing it, the value sits in its body
        - pattern: map($F)(fromBoolean($C))
          has: {field: function, has: {field: arguments, has: {any: [{kind: identifier}, {kind: member_expression}, {kind: call_expression}]}}}
message: The constant is mapped over the boolean Option through a form no fix types, the value's type comes from the site
note: Lift the value under the condition with its type, `liftPredicate<T>(() => condition)(value)`, `T` the value's type as the site declares it
