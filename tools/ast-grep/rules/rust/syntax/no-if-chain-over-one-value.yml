# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-if-chain-over-one-value
language: rust
severity: error
utils:
    variant-value:
        any:
            - {kind: scoped_identifier, has: {field: name, regex: '^[A-Z]'}}
            - kind: struct_expression
            - kind: call_expression
              any:
                - has: {field: function, kind: scoped_identifier, has: {field: name, regex: '^[A-Z]'}}
                - all:
                    - has: {field: function, kind: identifier, regex: '^(Some|Ok|Box)$'}
                    - has: {field: arguments, has: {nthChild: 1, matches: variant-value}}
            - kind: 'return_expression, parenthesized_expression, reference_expression'
              has: {matches: variant-value}
            - kind: block
              has: {nthChild: {position: 1, reverse: true}, any: [{matches: variant-value}, {kind: expression_statement, has: {matches: variant-value}}]}
    enum-variant:
        kind: identifier
        regex: '^[A-Z]([A-Za-z0-9]*[a-z][A-Za-z0-9]*)?$'
        not:
            any:
                - regex: '^(Some|None|Ok|Err|Self)$'
                - precedes: {regex: '^::$'}
    pattern-operand:
        any:
            - kind: 'integer_literal, char_literal, boolean_literal, float_literal'
            - {kind: scoped_identifier, has: {field: name, regex: '^[A-Z][A-Z0-9_]+$'}}
            - {kind: identifier, regex: '^[A-Z][A-Z0-9_]+$'}
            - kind: unary_expression
              regex: '^-'
              has: {kind: 'integer_literal, float_literal'}
            - kind: call_expression
              all:
                - has: {field: function, kind: identifier, regex: '^(Some|Ok|Err)$'}
                - not: {has: {field: arguments, has: {pattern: $_, not: {matches: pattern-operand}}}}
    text-operand:
        kind: 'string_literal, raw_string_literal'
    equality:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^==$'}
            - has: {field: left, pattern: $VALUE}
    constant-condition:
        any:
            - matches: equality
              has: {field: right, matches: pattern-operand}
            - kind: macro_invocation
              all:
                - has: {field: macro, regex: '^matches$'}
                - not: {has: {kind: token_tree, has: {stopBy: end, matches: enum-variant}}}
                - any:
                    - pattern: matches!($VALUE, $$$_)
                    - pattern: matches!($VALUE.$FIELD, $$$_)
                    - pattern: matches!(*$VALUE, $$$_)
            - kind: let_condition
              all:
                - has: {field: value, pattern: $VALUE}
                - not: {has: {field: pattern, any: [{matches: enum-variant}, {has: {stopBy: end, matches: enum-variant}}]}}
    text-condition:
        matches: equality
        has: {field: right, matches: text-operand}
    constant-test:
        kind: if_expression
        has: {field: condition, matches: constant-condition}
    text-test:
        kind: if_expression
        has: {field: condition, matches: text-condition}
    chained:
        has: {field: alternative, kind: else_clause, has: {kind: if_expression, any: [{matches: constant-test}, {matches: text-test}]}}
rule:
    kind: if_expression
    all:
        - not: {inside: {kind: else_clause}}
        - any:
            - all:
                - matches: constant-test
                - matches: chained
            - all:
                - matches: text-test
                - matches: chained
                - any:
                    - matches: rust-text-decoder
                    - has: {field: consequence, matches: variant-value}
message: '`if` chain tests `$VALUE` branch by branch'
note: 'Write one `match` over the value with an arm per constant or pattern (`match <value> { <pattern> => .., <pattern> => .. }`), the compiler then checks the arms for overlap and exhaustiveness. The `string_tag` dylint owns a chain over text literals outside a decoder, and a chain over variants of an enum other than `Option` and `Result` stays, Clippy `wildcard_enum_match_arm` rejects the `_` arm its match needs'
