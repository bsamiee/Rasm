# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-this-parameter
language: csharp
severity: error
rule:
    kind: parameter
    pattern: $RECEIVER
    has: {kind: modifier, regex: '^this$'}
message: '`$RECEIVER` declares an extension method through a `this` parameter'
note: 'Declare the member in an `extension(<type> <name>)` block holding the receiver''s type parameters, constraints, and `ref` or `in` modifier'
