id: require-strict-mode
valid:
    - | # Strict mode at file level
      #!/usr/bin/env bash
      set -euo pipefail
      echo "hello"
invalid:
    - | # No strict mode
      #!/usr/bin/env bash
      echo "hello"
    - |- # Strict mode buried in a function is not file-level strictness
      #!/usr/bin/env bash
      run() {
        set -euo pipefail
        echo "hello"
      }
      run
