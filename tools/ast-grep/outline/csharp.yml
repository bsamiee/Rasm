---
id: csharp-function
language: csharplang
role: item
symbolType: function
utils:
    enclosing: {kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    tooling: {kind: attribute, has: {field: name, regex: '(?:^|[.:])(?:Debugger.+|StackTraceHidden|ExcludeFromCodeCoverage|(?:Unconditional)?SuppressMessage|EditorBrowsable)(?:Attribute)?$'}}
    public: {any: [{has: {kind: modifier, regex: 'public|protected', stopBy: {not: {kind: preproc_if}}}, not: {has: {kind: modifier, regex: private, stopBy: {not: {kind: preproc_if}}}}}, {has: {kind: explicit_interface_specifier}}, {inside: {stopBy: {matches: enclosing}, kind: interface_declaration}, not: {has: {kind: modifier, regex: 'private|internal', stopBy: {not: {kind: preproc_if}}}}}]}
    visible: {matches: public, not: {inside: {stopBy: end, matches: enclosing, not: {matches: public}}}}
rule:
    any: [{kind: delegate_declaration}, {kind: local_function_statement, inside: {kind: 'global_statement, compilation_unit, ERROR', stopBy: {not: {kind: 'preproc_if, preproc_elif, preproc_else'}}}}]
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}
rewriters:
    - id: parameters
      rule: {kind: parameter_list, inside: {kind: 'local_function_statement, delegate_declaration'}, pattern: {context: 'record R($$$PARAMETERS);', selector: parameter_list}}
      transform: {KEPT: {rewrite: {source: $$$PARAMETERS, rewriters: [default, tool-list, tool, attributed, trivia]}}}
      fix: ($KEPT)
    - {id: default, rule: {not: {kind: ERROR}, inside: {kind: parameter, field: value}}, fix: …}
    - {id: body, rule: {kind: 'block, arrow_expression_clause', inside: {kind: 'constructor_declaration, conversion_operator_declaration, destructor_declaration, local_function_statement, method_declaration, operator_declaration', field: body}}, fix: ''}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body, parameters, tool-list, tool, attributed, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*|#(?:if|endif)[^\n]*|#el(?:if|se)(?s:.)*?#endif', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $NAME
signature: $SIGNATURE
isExported: {kind: delegate_declaration, matches: visible}
---
id: csharp-variable
language: csharplang
role: item
symbolType: variable
utils:
    declared: {kind: local_declaration_statement, pattern: $DECLARATION, not: {has: {kind: modifier, regex: const}}, inside: {kind: 'global_statement, compilation_unit, ERROR', stopBy: {not: {kind: 'preproc_if, preproc_elif, preproc_else'}}}}
    named: {has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}
rule:
    any:
        - {kind: local_declaration_statement, matches: declared, has: {kind: variable_declaration, not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}, has: {kind: variable_declarator, matches: named}}}
        - {kind: variable_declarator, any: [{matches: named}, {has: {kind: tuple_pattern, pattern: $NAME}}], inside: {kind: variable_declaration, inside: {matches: declared}}}
rewriters:
    - {id: before, rule: {kind: variable_declarator, precedes: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}}, fix: {template: "\n", expandEnd: {regex: '^,$'}}}
    - {id: after, rule: {kind: variable_declarator, follows: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}}, fix: {template: "\n", expandStart: {regex: '^,$'}}}
    - {id: value, rule: {kind: variable_declarator, not: {has: {kind: bracketed_argument_list}}, any: [{has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}}, {has: {kind: tuple_pattern, pattern: $DECLARED}}]}, fix: $DECLARED}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[before, after, value, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*|#(?:if|endif)[^\n]*|#el(?:if|se)(?s:.)*?#endif', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: csharp-constant
language: csharplang
role: item
symbolType: constant
utils:
    declared: {kind: local_declaration_statement, pattern: $DECLARATION, has: {kind: modifier, regex: const}, inside: {kind: 'global_statement, compilation_unit, ERROR', stopBy: {not: {kind: 'preproc_if, preproc_elif, preproc_else'}}}}
    named: {has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}
