# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-refusal-by-hand
language: tsx
severity: error
utils:
    composed:
        kind: call_expression
        has: {field: function, matches: {syntax-import-reference: {source: {regex: 'composition\.ts$'}, exported: {regex: '^(pass|deny)$'}}}}
    passed:
        matches: composed
        has: {field: function, regex: '^pass$'}
    denied:
        matches: composed
        has: {field: function, regex: '^deny$'}
    empty-test:
        any:
            - kind: binary_expression
              regex: '\.(size|length)\s*(===\s*0|<\s*1)$|^0\s*===\s*[\w.]+\.(size|length)$'
            - kind: unary_expression
              regex: '^!\s*[\w.]+\.(size|length)$'
            - kind: parenthesized_expression
              has: {matches: empty-test}
    present-test:
        any:
            - kind: binary_expression
              regex: '\.(size|length)\s*(>\s*0|!==\s*0|>=\s*1)$|^0\s*(<|!==)\s*[\w.]+\.(size|length)$'
            - kind: member_expression
              regex: '\.(size|length)$'
            - kind: parenthesized_expression
              has: {matches: present-test}
rule:
    kind: ternary_expression
    any:
        - all:
            - has: {field: condition, matches: empty-test}
            - has: {field: consequence, matches: passed}
            - has: {field: alternative, matches: denied}
        - all:
            - has: {field: condition, matches: present-test}
            - has: {field: consequence, matches: denied}
            - has: {field: alternative, matches: passed}
message: Policy passes or denies over a list of reasons by hand
note: Return `refuse(<reasons>, <actions>)` from `composition.ts`, `refuse` passes on an empty list and drops repeated reasons
