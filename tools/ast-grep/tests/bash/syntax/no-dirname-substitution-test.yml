id: no-dirname-substitution
valid:
    - $(basename a/i)f true
    - $(basename a/if) true
    - out=$(other path/file)
    - out=$(dirname path/file suffix)
    - out=$(dirname path/file; printf other)
    - root=$(dirname -- "$path")
    - stem=$(basename "$path" .yml)
    - stem=$(basename a/b.yml .yml)
    - root=$(dirname -z a/b)
    - stem=$(basename -- a/b.yml .yml)
    - name=$(basename "${paths[$i]}")
    - root=$(dirname "${BASH_SOURCE[0]}")
    - root=$(dirname "$path/x")
    - root=$(dirname "$path")
    - root=`dirname "$path"`
    - root=$(dirname $0)
    - root=$(dirname)
    - root=$(dirname a/)
    - root=$(dirname /)
    - root=$(dirname //a)
    - name=$(basename "a b")
    - name=$(basename "${paths[@]}")
    - name=$(basename a/../b/)
invalid:
    - root=$(dirname /a/b/c)
    - name=$(basename /a/b/c)
    - root=$(dirname file.txt)
    - name=$(basename file.txt)
    - root=$(dirname /file)
    - root=$(dirname ./file)
    - root=$(dirname 'a/b')
    - name=$(basename "a/b")
    - name=`basename a/b`
    - root=$(dirname -- a/b)
    - root="$(dirname a/b)/x"
