id: no-ambient-read-tsx
valid:
    - |
      import { Clock, Effect } from "effect";
      const now = Effect.flatMap(Clock.Clock, (clock) => clock.currentTimeMillis);
    - |
      const performance = { now: () => 1 };
      const t = performance.now();
    - |
      import { Clock, Layer } from "effect";
      const layer = Layer.succeed(Clock.Clock, { currentTimeNanosUnsafe: () => process.hrtime.bigint() });
invalid:
    - const t = performance.now();
    - const ids = xs.map(Math.random);
    - |
      import { randomUUID } from "node:crypto";
      const id = randomUUID();
    - const stamp = Date();
    - const started = globalThis.performance.timeOrigin;
