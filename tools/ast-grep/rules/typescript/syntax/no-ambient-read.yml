# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-ambient-read
language: tsx
severity: error
utils:
    service-adapter:
        kind: call_expression
        any:
            - has: {field: function, kind: member_expression, has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Clock|Random))?$'}, exported: {regex: '^(Clock|Random)$'}}}}}
            - has:
                field: function
                kind: member_expression
                all:
                    - has: {field: property, regex: '^(withClock|setClock|withRandom|setRandom)$'}
                    - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Layer))?$'}, exported: {regex: '^(Effect|Layer)$'}}}}
            - has:
                field: arguments
                has:
                    nthChild: 1
                    kind: member_expression
                    all:
                        - has: {field: property, regex: '^(Clock|Random)$'}
                        - has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/(Clock|Random))?$'}, exported: {regex: '^(Clock|Random)$'}}}}
rule:
    not: {inside: {kind: arguments, stopBy: end, inside: {matches: service-adapter}}}
    any:
        - kind: new_expression
          has: {field: constructor, regex: '^(globalThis\.)?Date$', matches: syntax-global-reference}
          not: {has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}}
        - kind: call_expression
          has:
            field: function
            any:
                - matches: syntax-global-reference
                  regex: '^(globalThis\.)?(Date|Date\.now|Temporal\.Now\.\w+|Math\.random|crypto\.(randomUUID|getRandomValues)|performance\.now|process\.hrtime(\.bigint)?|process\.uptime)$'
                - matches:
                    syntax-import-reference:
                        source: {regex: '^(node:)?crypto$'}
                        exported: {regex: '^(randomUUID|randomUUIDv7|getRandomValues|randomBytes|randomInt|randomFill|randomFillSync)$'}
                - matches:
                    syntax-import-reference:
                        source: {regex: '^(node:)?(os|process)$'}
                        exported: {regex: '^uptime$'}
                - matches:
                    syntax-import-reference:
                        source: {regex: '^(node:)?process$'}
                        exported: {regex: '^hrtime$'}
                - kind: member_expression
                  all:
                    - has: {field: property, regex: '^bigint$'}
                    - has:
                        field: object
                        matches:
                            syntax-import-reference:
                                source: {regex: '^(node:)?process$'}
                                exported: {regex: '^hrtime$'}
                - kind: member_expression
                  all:
                    - has: {field: property, regex: '^now$'}
                    - has:
                        field: object
                        matches:
                            syntax-import-reference:
                                source: {regex: '^(node:)?perf_hooks$'}
                                exported: {regex: '^performance$'}
    pattern: $READ
message: '`$READ` reads host time or randomness as an ambient value'
note: '`Clock` and `Random` services or an argument supply the value, the adapter supplying the service reads the host'
labels:
    READ: {style: primary}
