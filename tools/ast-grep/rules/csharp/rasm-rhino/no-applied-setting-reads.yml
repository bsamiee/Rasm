# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-applied-setting-reads
language: csharplang
severity: error
files: ['**/rhino/**']
utils:
    read:
        kind: invocation_expression
        has:
            field: function
            kind: member_access_expression
            has: {field: name, regex: '^Current$'}
rule:
    kind: tuple_expression
    pattern: $READS
    all:
        - inside: {kind: member_access_expression, field: expression, has: {field: name, regex: '^Apply$'}}
        - has: {kind: argument, nthChild: 1, has: {matches: read}}
        - not: {has: {kind: argument, not: {has: {matches: read}}}}
message: '`$READS` builds a settings record from separate reads'
note: 'Read the record as one JSON string through `PersistentSettings.TryGetString(<key>, out string json)` and `JsonSerializer.Deserialize<T>(json)`'
