# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-case-name-switch
language: swift
severity: error
utils:
    own-name:
        kind: switch_entry
        any:
            - pattern: {context: 'switch x { case .$N: return "$N" }', selector: switch_entry}
            - pattern: {context: 'switch x { case .$N: "$N" }', selector: switch_entry}
rule:
    kind: switch_statement
    all:
        - has: {field: expr, pattern: $SUBJECT}
        - has: {kind: switch_entry, follows: {kind: switch_entry, stopBy: end}}
        - not: {has: {kind: switch_entry, not: {matches: own-name}}}
message: '`switch` over `$SUBJECT` spells each case name again as a string literal'
note: 'Give the enum of `$SUBJECT` a `String` raw type and read `$SUBJECT.rawValue`, an enum with associated values or raw values other than its case names keeps the switch'
