# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# Report only, the match is the fourth control level and its replacement depends on the three enclosing levels, no template
id: no-fourth-shell-control-level
language: bash
severity: error
ignores: ["**/*.json"]
utils:
    control: {kind: 'if_statement, for_statement, c_style_for_statement, while_statement, case_statement'}
    boundary: {any: [{matches: control}, {kind: function_definition}]}
rule:
    matches: control
    inside:
        matches: control
        stopBy: {matches: boundary}
        inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                stopBy: {matches: boundary}
                not: {inside: {matches: control, stopBy: {kind: function_definition}}}
message: Shell control flow exceeds three nested levels
note: Reduce the operation itself through guards, case dispatch, array expansion, or a bulk tool operation, without helpers that hide the depth
