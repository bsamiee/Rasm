# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-event-mutation
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    # Member or index of the event at any depth, the object walk ends at the hook's second parameter
    event-member:
        any: [{kind: member_expression}, {kind: subscript_expression}]
        has: {field: object, any: [{pattern: $E}, {matches: event-member}]}
    # Callee that writes its first argument, each throws on a frozen object
    writing-callee:
        regex: '^(Object\.(assign|defineProperty|defineProperties|setPrototypeOf)|Reflect\.(set|defineProperty|deleteProperty|setPrototypeOf))$'
    # Write shapes with no capture, the walk to the hook runs on these alone
    write:
        any:
            - kind: assignment_expression
            - kind: augmented_assignment_expression
            - kind: update_expression
            - kind: unary_expression
              has: {field: operator, regex: '^delete$'}
            - kind: call_expression
              has: {field: function, matches: writing-callee}
            - matches: syntax-mutating-array-call
            - kind: for_in_statement
    # Scope between the mutation and the hook that rebinds the event's name, a nested function, a catch, a loop, or a nested block
    rebinding-scope:
        any:
            # The name in a parameter's pattern, plain or destructured, a default value under a parameter reads the event
            - matches: syntax-function-boundary
              all:
                  - has:
                        field: parameters
                        has:
                            has: {field: pattern, stopBy: end, any: [{kind: identifier}, {kind: shorthand_property_identifier_pattern}], pattern: $E}
                  - not: {matches: {claude-code-hook: {event: {pattern: $_}}}}
            - kind: catch_clause
              has: {field: parameter, kind: identifier, pattern: $E}
            # The loop variable, plain or destructured
            - kind: for_in_statement
              has: {field: left, any: [{kind: identifier, pattern: $E}, {has: {stopBy: end, any: [{kind: identifier}, {kind: shorthand_property_identifier_pattern}], pattern: $E}}]}
            - kind: for_statement
              has: {field: initializer, has: {kind: variable_declarator, has: {field: name, pattern: $E}}}
            # The hook's own block cannot redeclare its parameter
            - kind: statement_block
              has: {any: [{kind: lexical_declaration}, {kind: variable_declaration}], has: {kind: variable_declarator, has: {field: name, pattern: $E}}}
rule:
    all:
        - matches: write
        # The hook binds $E first, the event parameter under any name
        - inside:
              stopBy: end
              matches: {claude-code-hook: {event: {pattern: $_}}}
              has: {field: parameters, has: {nthChild: 2, has: {pattern: $E}}}
        - any:
              # Assignment or compound assignment into a member of the event, direct or as a destructuring target
              - any: [{kind: assignment_expression}, {kind: augmented_assignment_expression}]
                has:
                    field: left
                    any:
                        - matches: event-member
                        # Members under a default value of the pattern are reads
                        - any: [{kind: array_pattern}, {kind: object_pattern}]
                          has: {stopBy: end, matches: event-member, not: {inside: {stopBy: end, kind: assignment_pattern, field: right}}}
              # Increment or decrement of a member
              - kind: update_expression
                has: {field: argument, matches: event-member}
              - kind: unary_expression
                has: {field: argument, matches: event-member}
              # Object.assign, a property definition, or a prototype change on the event or one of its members
              - kind: call_expression
                has: {field: arguments, has: {nthChild: 1, any: [{pattern: $E}, {matches: event-member}]}}
              # Mutating array method on a member, a frozen array throws on each in a module's strict code
              - matches: syntax-mutating-array-call
                has: {field: function, has: {field: object, matches: event-member}}
              # Loop assigning each element into a member of the event
              - kind: for_in_statement
                has: {field: left, matches: event-member}
        - not: {inside: {stopBy: end, matches: rebinding-scope}}
message: The hook mutates the event `$E`, frozen to every depth, the write throws and skips the hook
note: 'Pass a copy to the chain, `next({ ...e, field: value })`, and read `e` alone'
