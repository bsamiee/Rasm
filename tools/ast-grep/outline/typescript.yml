            stopBy: {not: {kind: 'object_pattern, array_pattern, rest_pattern, pair_pattern, assignment_pattern, object_assignment_pattern, variable_declarator, lexical_declaration, variable_declaration, using_declaration, statement_block, internal_module, module, expression_statement'}}
        - inside:
            kind: export_statement, ambient_declaration
            stopBy: {not: {kind: 'lexical_declaration, variable_declaration, using_declaration'}}
        - inside:
