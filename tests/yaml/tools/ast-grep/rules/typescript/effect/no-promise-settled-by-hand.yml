id: no-promise-settled-by-hand
valid:
    - |
      import { Effect } from "effect";
      const read = Effect.tryPromise(() => fetchText());
    - |
      import { Effect } from "effect";
      const read = Effect.callback<number>((resume) => {
          resume(Effect.succeed(1));
      });
invalid:
    - |
      import { Effect } from "effect";
      const read = Effect.callback<string>((resume) => {
          fetchText().then((text) => resume(Effect.succeed(text)));
      });
    - |
      import { Queue, Stream } from "effect";
      const lines = Stream.callback<string>((queue) => {
          source.next().then((line) => Queue.offer(queue, line)).finally(() => Queue.end(queue));
      });
