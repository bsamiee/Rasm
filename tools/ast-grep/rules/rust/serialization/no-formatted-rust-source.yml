# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    item-text:
        kind: 'string_literal, raw_string_literal'
        regex: |-
            (?x)^r?\#*"(\\n|\p{White_Space})*((\#\[[^\]"]*\]|\{[\p{XID_Continue}:]*\})(\\n|\p{White_Space})*)*(pub(\([\p{XID_Continue}\p{White_Space}]+\))?\p{White_Space}+)?((async|const|unsafe)\p{White_Space}+)*(
                fn\p{White_Space}+[\p{XID_Continue}{}:]+\p{White_Space}*[(<]
                |(struct|enum|trait|union)\p{White_Space}+[\p{XID_Continue}{}:]+\p{White_Space}*(\{([{}\p{White_Space}"]|\\n)|<|\(|;)
                |mod\p{White_Space}+[\p{XID_Continue}{}:]+\p{White_Space}*(\{([{}\p{White_Space}"]|\\n)|;)
                |impl(?-u:\b)[^"]*\{
                |impl(<[^>"]*>)?\p{White_Space}+[\p{XID_Continue}{}:<>]+\p{White_Space}+for\p{White_Space}+[\p{XID_Continue}{}:]+
                |(const|static)\p{White_Space}+[\p{XID_Continue}{}:]+\p{White_Space}*:
                |type\p{White_Space}+[\p{XID_Continue}{}:]+\p{White_Space}*(<[^>"]*>)?\p{White_Space}*=
                |use\p{White_Space}+[\p{XID_Continue}{}:]+::
            )
    item-head:
        any:
            - matches: item-text
            - kind: 'string_literal, raw_string_literal'
              regex: '^r?#*"(\\n|\p{White_Space})*(#\[[^\]"]*\](\\n|\p{White_Space})*)*(pub(\([\p{XID_Continue}\p{White_Space}]+\))?\p{White_Space}+)?((async|unsafe)\p{White_Space}+)*((fn|struct|enum|trait|union|mod|impl|const|static|type)|impl(?-u:\b)[^"]*\p{White_Space}for)\p{White_Space}+"#*$'
    owned-head:
        any:
            - matches: item-head
            - kind: call_expression
              any:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(to_owned|to_string|into)$'}}, {has: {field: value, matches: item-head}}]}
                - all: [{has: {field: function, regex: '^((::)?(std|alloc)::)?(string::)?String::from$'}}, {has: {field: arguments, has: {nthChild: 1, matches: item-head}}}]
rule:
    pattern: $SOURCE
    any:
        - kind: macro_invocation
          all:
            - matches: {rust-std-macro: {name: {regex: '^(format|format_args|write|writeln|print|println)$'}}}
            - has: {kind: token_tree, has: {all: [{matches: item-text}, {regex: '(^|[^{])\{[A-Za-z0-9_:}]'}]}}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^\+$'}
            - has: {field: left, matches: owned-head}
        - kind: compound_assignment_expr
          all:
            - has: {field: operator, regex: '^\+=$'}
            - has: {field: right, matches: item-head}
        - kind: call_expression
          any:
            - all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^push_str$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: item-head}}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(concat|join)$'}}, {has: {field: value, kind: array_expression, has: {nthChild: 1, matches: item-head}}}]}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^replacen?$'}}, {has: {field: value, matches: item-text}}]}
message: '`$SOURCE` builds Rust source as text'
note: 'Build the item as `quote!` tokens, parse them with `syn::parse2::<syn::File>`, and print with `prettyplease::unparse`'
