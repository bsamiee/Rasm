# Workflow of one repository event, the jobs hold commands alone and the Nx targets hold the build logic
name: <Name>

on:
    <event>: # pull_request, push with branches, or schedule with cron, the event that requires the work
    workflow_dispatch:
        inputs:
            <input>:
                description: <purpose> # Typed input the jobs read through the inputs context
                default: <value>

permissions: # The keys the jobs call, every unnamed key is none
    contents: read
    actions: read # The run lookup of nx-set-shas

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }} # One group per workflow and ref
    cancel-in-progress: ${{ github.event_name == 'pull_request' }} # Newer pull request runs replace the running one

defaults:
    run:
        shell: bash # bash -eo pipefail on every run step, a composite step declares its own shell

jobs:
    <job>:
        runs-on: <runner> # ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025, or a matrix.runner expression
        timeout-minutes: <minutes>
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0 # Tags and merge bases for nx affected and the release versions
                filter: tree:0 # Treeless clone, trees fetched on demand
                persist-credentials: false # The token stays out of .git/config, the release checkout alone keeps it
            - uses: nrwl/nx-set-shas@v5
              with:
                workflow-id: <workflow file> # The file name of the workflow, without it the action looks the current run up
            - uses: ./.github/actions/setup
            - run: nx affected -t <target> --exclude='*,!tag:language:<language>' # The language tag selects the projects
            - run: <command> "$VALUE" # Expressions reach the script through env, GitHub substitutes them into the text otherwise
              env:
                VALUE: ${{ inputs.<input> }}
            - uses: actions/upload-artifact@v7
              with:
                name: <artifact> # One name per matrix entry where a matrix exists, the runtime identifier in the name
                path: .artifacts/<area>/<output>

    # The one status check the ruleset requires, a skipped or cancelled job fails it
    required:
        needs: [<job>]
        if: always()
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions: {}
        steps:
            - run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
              env:
                NEEDS: ${{ toJSON(needs) }}
