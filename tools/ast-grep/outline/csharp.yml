        - {kind: event_declaration, all: [{matches: accessed}, {not: {matches: nesting}}]}
        - {kind: event_field_declaration, matches: declared, has: {kind: variable_declaration, not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}, has: {kind: variable_declarator, matches: named}}, all: [{not: {matches: nesting}}]}
        - {kind: variable_declarator, matches: named, all: [{inside: {kind: variable_declaration, has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}, inside: {kind: event_field_declaration, matches: declared}}}, {not: {matches: nesting}}]}
        - {kind: modifier, nthChild: {position: 1, ofRule: {kind: modifier}}, inside: {any: [{kind: event_declaration, all: [{matches: accessed}, {matches: nesting}]}, {kind: event_field_declaration, all: [{matches: declared}, {has: {kind: variable_declaration, not: {has: {kind: variable_declarator, nthChild: {position: 2, ofRule: {kind: variable_declarator}}}}, has: {kind: variable_declarator, matches: named}}}, {matches: nesting}]}]}}
rewriters:
    - {id: broken, rule: {kind: ERROR}, fix: "\n"}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {kind: attribute, matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: branch, rule: {kind: 'preproc_else, preproc_elif'}, fix: ''}
    - {id: before, rule: {kind: variable_declarator, precedes: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}}, fix: {template: "\n", expandEnd: {regex: '^,$'}}}
    - {id: after, rule: {kind: variable_declarator, follows: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}}, fix: {template: "\n", expandStart: {regex: '^,$'}}}
    - {id: value, rule: {kind: variable_declarator, not: {has: {kind: bracketed_argument_list}}, has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}}, fix: $DECLARED}
    - id: lineage
      rule:
        kind: identifier
        pattern: {context: 'class $SELF;', selector: identifier}
        inside: {field: name, matches: enclosing, any: [{inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: {context: 'class $UP;', selector: identifier}}, inside: {stopBy: end, matches: enclosing}}}, {matches: enclosing}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}}
      fix: $ABOVE$SELF.
    - {id: accessor, rule: {kind: 'block, arrow_expression_clause', inside: {kind: accessor_declaration, field: body}}, fix: {template: "\n;", expandEnd: {regex: ';'}}}
transform:
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*|#(?:if|endif)[^\n]*', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    HEADER: rewrite($DECLARATION, rewriters=[before, after, value, accessor, tool-list, tool, attributed, branch, broken, trivia])
name: $QUALIFIER$EXPLICIT$NAME
signature: $SIGNATURE
isPublic: {any: [{kind: 'event_declaration, event_field_declaration', matches: visible}, {inside: {kind: 'event_declaration, event_field_declaration', matches: visible}}, {inside: {kind: variable_declaration, inside: {matches: visible}}}]}
---
id: csharp-member-case
language: csharplang
role: member
symbolType: enumMember
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-enum, csharp-function]
utils:
    enclosing: {kind: 'class_declaration, enum_declaration, interface_declaration, record_declaration, struct_declaration, union_declaration'}
    tooling: {kind: attribute, has: {field: name, regex: '(?:^|[.:])(?:Debugger.+|StackTraceHidden|ExcludeFromCodeCoverage|(?:Unconditional)?SuppressMessage|EditorBrowsable|StringSyntax)(?:Attribute)?$'}}
    public: {any: [{has: {kind: modifier, regex: 'public|protected', stopBy: {not: {kind: preproc_if}}}, not: {has: {kind: modifier, regex: private, stopBy: {not: {kind: preproc_if}}}}}, {has: {kind: explicit_interface_specifier}}, {inside: {stopBy: {matches: enclosing}, kind: interface_declaration}, not: {has: {kind: modifier, regex: 'private|internal', stopBy: {not: {kind: preproc_if}}}}}]}
    owned: {any: [{inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: {context: 'class $OWNER;', selector: identifier}}, inside: {stopBy: end, matches: enclosing}}}, {not: {kind: ERROR}}]}
    nesting: {has: {stopBy: end, kind: 'local_function_statement, ERROR'}}
rule:
    all:
        - any:
            - {kind: enum_member_declaration, pattern: $DECLARATION, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}, all: [{not: {matches: nesting}}]}
            - {kind: attribute_list, nthChild: {position: 1, ofRule: {kind: attribute_list}}, inside: {kind: enum_member_declaration, pattern: $DECLARATION, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}, matches: nesting}}
            - {kind: 'alias_qualified_name, array_type, function_pointer_type, generic_name, identifier, implicit_type, nullable_type, pointer_type, predefined_type, qualified_name, ref_type, scoped_type, tuple_type', pattern: $CASE, inside: {kind: union_case_list}}
        - matches: owned
rewriters:
    - {id: broken, rule: {kind: ERROR}, fix: "\n"}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
    - {id: tool-list, rule: {kind: attribute_list, not: {has: {kind: attribute, not: {matches: tooling}}}}, fix: "\n"}
    - {id: tool, rule: {kind: attribute, matches: tooling}, fix: {template: "\n", expandStart: {regex: '^,$'}, expandEnd: {regex: '^,$', not: {follows: {regex: '^,$', stopBy: end}}}}}
    - {id: attributed, rule: {kind: attribute_argument_list, has: {kind: attribute_argument}}, fix: '(…)'}
    - {id: branch, rule: {kind: 'preproc_else, preproc_elif'}, fix: ''}
    - id: lineage
      rule:
        kind: identifier
        pattern: {context: 'class $SELF;', selector: identifier}
        inside: {field: name, matches: enclosing, any: [{inside: {stopBy: end, matches: enclosing, has: {field: name, pattern: {context: 'class $UP;', selector: identifier}}, inside: {stopBy: end, matches: enclosing}}}, {matches: enclosing}]}
      transform: {ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}}
      fix: $ABOVE$SELF.
    - {id: value, rule: {not: {kind: ERROR}, inside: {kind: enum_member_declaration, field: value}}, fix: {template: "\n", expandStart: {regex: "^=$"}}}
transform:
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*|#(?:if|endif)[^\n]*', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
    CLEAN: {replace: {source: $CASE, replace: '(?:;|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}])+$|[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*\n[\t-\r\x{85}\p{Zs}\x{2028}\x{2029}\x{FEFF}]*', by: ''}}
    HEADER: rewrite($DECLARATION, rewriters=[value, tool-list, tool, attributed, branch, broken, trivia])
name: $QUALIFIER$NAME$CLEAN
signature: $SIGNATURE$CLEAN
isPublic: {not: {inside: {stopBy: end, matches: enclosing, inside: {stopBy: end, matches: enclosing}, not: {matches: public}}}}
