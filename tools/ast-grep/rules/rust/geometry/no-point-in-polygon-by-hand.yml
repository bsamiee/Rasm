# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-point-in-polygon-by-hand
language: rust
severity: error
rule:
    kind: binary_expression
    all:
        - has: {field: operator, regex: '^!=$'}
        - any:
            - pattern: ($A > $Y) != ($B > $Y)
            - pattern: ($A >= $Y) != ($B >= $Y)
            - pattern: ($A < $Y) != ($B < $Y)
            - pattern: ($A <= $Y) != ($B <= $Y)
constraints:
    Y: {not: {kind: 'integer_literal, float_literal, unary_expression'}}
message: '`$A` and `$B` straddle `$Y` in a hand-written ray-casting crossing test'
note: 'Build a `geo::Polygon` and call `geo::Contains::contains(&polygon, &point)`, or `geo::Intersects::intersects` when a boundary point counts as inside'
