# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exec-build
language: xml
severity: error
files: ['**/*.{csproj,props,targets}']
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^Exec$'}}}
        - matches:
            msbuild-metadata:
                name: {regex: '^Command$'}
                value: {regex: '(?i)^["'']\s*(?:&quot;)?(?:[^\s"''&]*[\\/])?(?:dotnet(?:\.exe)?(?:&quot;)?\s+(?:build|msbuild|pack|publish|restore|test|run)\b|msbuild(?:\.exe)?(?:&quot;)?(?:\s|["'']$))', pattern: _COMMAND}
transform:
    COMMAND_TEXT: {replace: {source: $COMMAND, replace: '^["'']|["'']$', by: ''}}
message: '`Exec` starts a build process `$COMMAND_TEXT` the engine neither schedules nor logs'
note: Order the project through `ProjectReference` with `ReferenceOutputAssembly="false"`, or call its target through the `MSBuild` task
