# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-declaration-in-barrel
language: tsxlang
severity: error
files: ['**/index.ts']
rule:
    kind: import_statement, export_statement, expression_statement, lexical_declaration, variable_declaration, function_declaration, generator_function_declaration, class_declaration, abstract_class_declaration, type_alias_declaration, interface_declaration, enum_declaration, ambient_declaration, internal_module, import_alias
    all:
        - inside: {kind: program}
        - not: {kind: export_statement, all: [{has: {field: source, kind: string}}, {has: {kind: export_clause}}]}
message: 'Barrel holds a statement other than a named re-export'
note: 'Declare the value in its module and re-export it with `export { Name } from`'
