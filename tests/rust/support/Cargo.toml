# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-testing"
version.workspace = true
edition.workspace = true
description       = "Test fixtures kept after a failed test: folders and SQLite files"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[test]]
name              = "suite"
path              = "suite.rs"
required-features = ["sqlite"]

# --- [FEATURES] -------------------------------------------------------------------------

[features]
sqlite = ["dep:sqlx", "dep:libsqlite3-sys", "dep:sqlite-vec"]

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures        = { workspace = true }
derive-where   = { workspace = true }
derive_more    = { workspace = true }
sqlx           = { workspace = true, optional = true, features = ["sqlite-bundled", "sqlite-load-extension"] }
libsqlite3-sys = { workspace = true, optional = true }
sqlite-vec     = { workspace = true, optional = true }
assert_fs      = { workspace = true }

[dev-dependencies]
rasm-testing = { workspace = true, features = ["sqlite"] } # Own `sqlite` feature for the suite, which `required-features` gates
tokio        = { workspace = true }
claims       = { workspace = true }
fs-err       = { workspace = true, features = ["tokio"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
