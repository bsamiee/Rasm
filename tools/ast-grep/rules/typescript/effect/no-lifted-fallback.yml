# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lifted-fallback
language: tsx
severity: error
utils:
    constant-success:
        matches:
            effect-constant-handler:
                result:
                    not: {has: {field: arguments, has: {kind: spread_element}}}
                    any: [{pattern: $M.succeed($_)}, {pattern: $M.succeed<$$$_>($_)}]
    constant-failure:
        matches:
            effect-constant-handler:
                result:
                    not: {has: {field: arguments, has: {kind: spread_element}}}
                    any: [{pattern: $M.fail($_)}, {pattern: $M.fail<$$$_>($_)}]
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, pattern: $M.$RECOVER}
        - any:
            - all:
                - has: {field: function, has: {field: property, regex: '^orElse$'}}
                - has: {field: function, has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|STM|Stream)$'}}}}}
            - all:
                - has: {field: function, has: {field: property, regex: '^catchAll$'}}
                - has: {field: function, has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro|STM|Stream)$'}}}}}
        - any:
            - has: {field: arguments, has: {matches: constant-success}}
            - all:
                - has: {field: arguments, has: {matches: constant-failure}}
                - has: {field: function, has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|STM|Stream)$'}}}}}
    not:
        any:
            - has: {field: type_arguments, kind: type_arguments}
            - has: {kind: comment, stopBy: end}
            - has:
                field: arguments
                has:
                    kind: arrow_function, function_expression
                    has: {field: return_type, kind: type_annotation}
rewriters:
    - id: empty-parameters
      rule: {kind: formal_parameters}
      fix: ()
    - id: empty-parameter
      rule: {kind: identifier, inside: {kind: arrow_function, field: parameter}}
      fix: ()
    - id: unlift-object
      rule: {any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}], has: {field: arguments, has: {kind: object}}}
      fix: ($V)
    - id: unlift
      rule: {any: [{pattern: $_.$_($V)}, {pattern: $_.$_<$$$_>($V)}]}
      fix: $V
    - id: succeed-first
      rule: {pattern: '$M.$_($SELF, $H)', has: {field: arguments, has: {pattern: $H, matches: constant-success}}}
      transform:
        FALLBACK: rewrite($H, rewriters=[empty-parameters, empty-parameter, unlift-object, unlift])
      fix: $M.orElseSucceed($SELF, $FALLBACK)
    - id: succeed-last
      rule: {pattern: $M.$_($H), has: {field: arguments, has: {pattern: $H, matches: constant-success}}}
      transform:
        FALLBACK: rewrite($H, rewriters=[empty-parameters, empty-parameter, unlift-object, unlift])
      fix: $M.orElseSucceed($FALLBACK)
    - id: fail-first
      rule: {pattern: '$M.$_($SELF, $H)'}
      transform:
        FALLBACK: rewrite($H, rewriters=[empty-parameters, empty-parameter, unlift-object, unlift])
      fix: $M.orElseFail($SELF, $FALLBACK)
    - id: fail-last
      rule: {pattern: $M.$_($H)}
      transform:
        FALLBACK: rewrite($H, rewriters=[empty-parameters, empty-parameter, unlift-object, unlift])
      fix: $M.orElseFail($FALLBACK)
transform:
    RECOVERED: rewrite($CALL, rewriters=[succeed-first, succeed-last, fail-first, fail-last])
fix: $RECOVERED
message: '`$M.$RECOVER` fallback lifts a constant'
note: '`<module>.orElseSucceed(self, () => value)` or `<module>.orElseFail(self, () => error)` lifts the thunk result'
