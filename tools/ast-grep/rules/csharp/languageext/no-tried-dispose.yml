# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-tried-dispose
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: invocation_expression
    pattern: $RELEASE
    any:
        - pattern: Try.lift($X.Dispose).Run()
        - pattern: Try.lift(() => $X.Dispose()).Run()
        - pattern: Try.lift(() => { $X.Dispose(); return unit; }).Run()
message: '`$RELEASE` releases `$X` through `Try`'
note: 'Acquire through `use` and release at the owning `Bracket`, `Finally(IO.lift(<release>))` for a release holding no handle'
