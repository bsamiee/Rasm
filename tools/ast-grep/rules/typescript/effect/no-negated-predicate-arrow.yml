# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-negated-predicate-arrow
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/**']
rule:
    kind: arrow_function
    all:
        - any: [{pattern: '($X) => !$F($X)'}, {pattern: '$X => !$F($X)'}]
        - not: {inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: '^(filter|partition)$'}}}}}
        - has:
            field: body
            has:
                field: argument
                has:
                    field: function
                    any:
                        - kind: identifier
                        - kind: member_expression
                          has: {field: object, matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}
message: '`$F` is negated through an arrow over its one argument'
note: 'Pass `Predicate.not(<predicate>)`'
