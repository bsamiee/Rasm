                        |runForEach|runForEachArray|runForEachWhile|runIntoPubSub|runIntoQueue|scan|scanEffect|schedule|share|sliding
                        |slidingSize|split|switchMap|take|takeRight|takeUntil|takeUntilEffect|takeWhile|takeWhileEffect|takeWhileFilter|tap
                        |tapBoth|tapCause|tapDefect|tapError|tapErrorTag|tapSink|throttle|throttleEffect|timeout|timeoutOrElse
                        |toAsyncIterableWith|toPubSub|toPubSubTake|toQueue|toReadableStream|toReadableStreamEffect|toReadableStreamWith
                        |transduce|unwrapReason|updateContext|updateService|when|withExecutionPlan|zip|zipFlatten|zipLatest|zipLatestWith
                        |zipLeft|zipRight|zipWith|zipWithArray)$
        - matches:
            effect-module-member:
                module: {regex: '\bString$'}
                member:
                    regex: |-
                        (?x)^(at|charAt|charCodeAt|codePointAt|concat|noCase|search|split|stripMarginWith|takeLeft|takeRight)$
        - matches:
            effect-module-member:
                module: {regex: '\bStruct$'}
                member:
                    regex: |-
                        (?x)^(assign|evolve|evolveEntries|evolveKeys|get|map|mapOmit|mapPick|omit|pick|renameKeys)$
        - matches:
            effect-module-member:
                module: {regex: '\b(SubscriptionRef|SynchronizedRef)$'}
