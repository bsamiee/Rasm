# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-add-record
language: tsx
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^add$'}, not: {has: {field: object, regex: '(^|\.)documents$'}}}
        - has: {field: arguments, has: {kind: object, has: {kind: pair}}}
    inside: {kind: program, stopBy: end, matches: {uxp-host-file: {module: {regex: '^(adobe:)?indesign$'}}}}
transform:
    HEAD: {replace: {source: $CALL, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$HEAD` sets keys from a record with no error naming a refused key'
note: 'Call `add` with its required arguments alone, then set each key through `Object.assign(<target>, { [<key>]: <value> })` under `Effect.validate`'
