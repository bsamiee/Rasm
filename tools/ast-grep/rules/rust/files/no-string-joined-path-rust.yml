# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-string-joined-path-rust
language: rust
severity: error
utils:
    literal:
        kind: 'string_literal, raw_string_literal, char_literal, integer_literal, float_literal, boolean_literal'
    slash:
        any:
            - {kind: string_literal, regex: '^"(/|/[^/"][^"]*|[^"]*[^:/"]/)"$'}
            - {kind: char_literal, regex: '^''/''$'}
    path-name:
        regex: '(?i)(^|_)(path|dir|directory|file|root|folder)$'
        not: {regex: '(?i)(^|_)(url|uri|route|endpoint|request)_'}
    rooted-format:
        has: {kind: token_tree, has: {nthChild: 1, kind: string_literal, regex: '^"/'}}
    joined:
        any:
            - matches: rust-interpolating-format
              has: {kind: token_tree, has: {nthChild: 1, kind: string_literal, regex: '(\}|^")/|/(\{|"$)', not: {regex: '://'}}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\+$'}
                - not: {inside: {kind: binary_expression, field: left}}
                - has: {stopBy: end, matches: slash, inside: {kind: binary_expression, has: {field: operator, regex: '^\+$'}}}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^join$'}}, {has: {field: value, kind: array_expression, has: {pattern: $_, not: {matches: literal}}}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: slash}, not: {has: {nthChild: 2}}}
    path-call:
        kind: call_expression
        has:
            field: function
            any:
                - regex: '(Path(Buf)?::(new|from)|fs::\w+|File::(open|create|create_new))$'
                - regex: 'OpenOptions[\s\S]*\.open$'
                - kind: field_expression
                  all: [{has: {field: field, regex: '^(join|push)$'}}, {has: {field: value, matches: path-name}}]
    pushed-slash:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(push_str|push)$'}}, {has: {field: value, matches: path-name}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: slash}, not: {has: {nthChild: 2}}}
rule:
    pattern: $JOINED
    any:
        - matches: joined
          any:
            - inside: {kind: arguments, inside: {matches: path-call}}
            - inside: {kind: reference_expression, inside: {kind: arguments, inside: {matches: path-call}}}
        - matches: joined
          not: {matches: rooted-format}
          any:
            - inside: {kind: let_declaration, has: {field: pattern, kind: identifier, matches: path-name}}
            - inside: {kind: assignment_expression, has: {field: left, matches: path-name}}
        - matches: pushed-slash
message: '`$JOINED` joins a file-system path with a `/` literal'
note: 'Join through `<base>.join(<segment>)` on a `Path` or `PathBuf`, or `[<a>, <b>].iter().collect::<PathBuf>()`'
