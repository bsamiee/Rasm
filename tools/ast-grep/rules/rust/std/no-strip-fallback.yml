# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    kind: call_expression
    all:
        - pattern: $S.$STRIP($P).unwrap_or($S)
constraints:
    STRIP: {regex: '^strip_(prefix|suffix)$'}
message: '`$S.$STRIP($P)` falls back to `$S`'
note: 'Call `<value>.trim_prefix(<pattern>)` or `<value>.trim_suffix(<pattern>)`'
