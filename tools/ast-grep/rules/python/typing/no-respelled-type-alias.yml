# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-respelled-type-alias
language: python
severity: error
utils:
    type-expression:
        any:
            - inside: {kind: type, stopBy: end}
            - inside:
                kind: subscript
                field: subscript
                has: {field: value, regex: '^((\w+\.)*[A-Z][a-z]\w*|dict|frozenset|list|set|tuple|type)$'}
rule:
    kind: binary_operator, union_type, generic_type, subscript
    all:
        - pattern: $SPELLING
        - matches: type-expression
        - not: {inside: {kind: type, inside: {kind: type_alias_statement, field: right}}}
        - inside:
            stopBy: end
            inside: {kind: module}
            follows:
                stopBy: end
                kind: type_alias_statement
                all:
                    - has: {field: left, has: {kind: identifier, pattern: $ALIAS}}
                    - has: {field: right, has: {pattern: $SPELLING}}
fix: $ALIAS
message: '`$SPELLING` spells the value of type alias `$ALIAS`'
note: 'Use the alias name, the type has one spelling'
