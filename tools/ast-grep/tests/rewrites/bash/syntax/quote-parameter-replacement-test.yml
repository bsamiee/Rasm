id: quote-parameter-replacement
valid:
    - result=${value:-prefix$replacement}
    - result=${value//${pattern}/literal}
    - result=${value//pattern/"$replacement"}
    - result="${value//pattern/"${replacement}"}"
    - result=${value//pattern/\&}
    - result=${value//pattern/&suffix}
    - result=${value//$pattern/literal}
    - result=${value/$pattern}
    - result=${value:-$replacement}
    - result=${values[$index]//pattern/literal}
    - result=${value//pattern/${replacements[@]}}
invalid:
    - result=${value/pattern/$replacement}
    - result=${value//pattern/$replacement}
    - result=${value/#pattern/$replacement}
    - result=${value/%pattern/$replacement}
    - result=${value//@JOB@/${root}}
    - result=${values[@]/#/$root/}
    - result=${value//pattern/prefix$replacement}
    - result="${value//pattern/$replacement}"
    - result=${value//pattern/&$suffix}
    - result=${value//pattern/${replacements[0]}}
