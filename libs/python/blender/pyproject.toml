# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "blender"
version         = "1.0.0"
description     = "Shared extension code with bpy behind one boundary"
requires-python = ">=3.13"

dependencies = [
    # --- [CORE]
    "expression",        # Results, options, and collections of every library package
    "msgspec",           # Records, tagged unions, field bounds, and JSON, TOML, and MessagePack codecs
    "structlog",         # Structured logging through typed bound loggers holding each extension's context
    "typing-extensions", # Runtime `TypeForm` schemas where `typing` lacks `TypeForm`
    "typing-inspection", # Annotation metadata and generic type-alias inspection
    "tzdata",            # IANA time zones for zoneinfo on platforms without a database

    # --- [STORAGE]
    "atomicwrites",      # Atomic preset moves that preserve occupied destinations
    "cbor2",             # Canonical binary content hashing with unbounded integers

    # --- [MATHEMATICS]
    "numpy",             # Arrays for image planes, previews, and analysis
    "scipy",             # Color algebra, vector quadrature, FFT sizing, and zoom

    # --- [IMAGING]
    "colour-science",    # CIE observer datasets
    "opencolorio",       # Color processing, config authoring, and LUT baking
    "openimageio",       # Image IO and analysis
    "psdtags",           # Photoshop layer records for layered documents
    "scikit-image",      # Structural similarity over image comparison planes
    "tifffile",          # Linear Raw DNG and TIFF containers for layered documents

    # --- [NETWORK]
    "httpx2",            # HTTP for batch render targets and notices
    "tenacity",          # Batch target retries over configured domain retry policies
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# --- [HATCH] ----------------------------------------------------------------------------

[tool.hatch.build]
dev-mode-dirs = [".."] # Editable installs expose the folder holding the import root

[tool.hatch.build.targets.wheel]
only-include = ["bpy", "imaging", "records", "rendering"] # Import packages under the `blender` root, the manifest left out

[tool.hatch.build.targets.wheel.sources]
"" = "blender"

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.flake8-self]
extend-ignore-names = ["_PropertyDeferred"] # Blender names deferred `bpy.props` definitions by this class alone

# --- [DEPTRY] ---------------------------------------------------------------------------

[tool.deptry]
experimental_namespace_package = true # The `blender` import root is a namespace package holding no top-level module

[tool.deptry.per_rule_ignores]
DEP001 = ["_bl_rna_utils", "_blendfile_header", "_bpy_internal", "_bpy_types", "bl_keymap_utils", "bl_operators", "bl_ui", "blf", "bmesh", "bpy", "bpy_extras", "cycles", "gpu", "gpu_extras", "idprop", "mathutils", "rna_keymap_ui"] # Modules Blender supplies to host code
DEP002 = ["tzdata"]                                                                                                                                                                                                                    # zoneinfo reads tzdata data files
