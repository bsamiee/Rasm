id: no-dirname-substitution
snapshots:
  name=$(basename "a/b"):
    fixed: name=b
    labels:
    - source: $(basename "a/b")
      style: primary
      start: 5
      end: 22
    - source: basename
      style: secondary
      start: 7
      end: 15
    - source: '"a/b"'
      style: secondary
      start: 16
      end: 21
    - source: basename "a/b"
      style: secondary
      start: 7
      end: 21
  name=$(basename /a/b/c):
    fixed: name=c
    labels:
    - source: $(basename /a/b/c)
      style: primary
      start: 5
      end: 23
    - source: basename
      style: secondary
      start: 7
      end: 15
    - source: /a/b/c
      style: secondary
      start: 16
      end: 22
    - source: basename /a/b/c
      style: secondary
      start: 7
      end: 22
  name=$(basename file.txt):
    fixed: name=file.txt
    labels:
    - source: $(basename file.txt)
      style: primary
      start: 5
      end: 25
    - source: basename
      style: secondary
      start: 7
      end: 15
    - source: file.txt
      style: secondary
      start: 16
      end: 24
    - source: basename file.txt
      style: secondary
      start: 7
      end: 24
  name=`basename a/b`:
    fixed: name=b
    labels:
    - source: '`basename a/b`'
      style: primary
      start: 5
      end: 19
    - source: basename
      style: secondary
      start: 6
      end: 14
    - source: a/b
      style: secondary
      start: 15
      end: 18
    - source: basename a/b
      style: secondary
      start: 6
      end: 18
  root="$(dirname a/b)/x":
    fixed: root="a/x"
    labels:
    - source: $(dirname a/b)
      style: primary
      start: 6
      end: 20
    - source: dirname
      style: secondary
      start: 8
      end: 15
    - source: a/b
      style: secondary
      start: 16
      end: 19
    - source: dirname a/b
      style: secondary
      start: 8
      end: 19
  root=$(dirname 'a/b'):
    fixed: root=a
    labels:
    - source: $(dirname 'a/b')
      style: primary
      start: 5
      end: 21
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: '''a/b'''
      style: secondary
      start: 15
      end: 20
    - source: dirname 'a/b'
      style: secondary
      start: 7
      end: 20
  root=$(dirname -- a/b):
    fixed: root=a
    labels:
    - source: $(dirname -- a/b)
      style: primary
      start: 5
      end: 22
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: a/b
      style: secondary
      start: 18
      end: 21
    - source: dirname -- a/b
      style: secondary
      start: 7
      end: 21
  root=$(dirname ./file):
    fixed: root=.
    labels:
    - source: $(dirname ./file)
      style: primary
      start: 5
      end: 22
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: ./file
      style: secondary
      start: 15
      end: 21
    - source: dirname ./file
      style: secondary
      start: 7
      end: 21
  root=$(dirname /a/b/c):
    fixed: root=/a/b
    labels:
    - source: $(dirname /a/b/c)
      style: primary
      start: 5
      end: 22
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: /a/b/c
      style: secondary
      start: 15
      end: 21
    - source: dirname /a/b/c
      style: secondary
      start: 7
      end: 21
  root=$(dirname /file):
    fixed: root=/
    labels:
    - source: $(dirname /file)
      style: primary
      start: 5
      end: 21
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: /file
      style: secondary
      start: 15
      end: 20
    - source: dirname /file
      style: secondary
      start: 7
      end: 20
  root=$(dirname file.txt):
    fixed: root=.
    labels:
    - source: $(dirname file.txt)
      style: primary
      start: 5
      end: 24
    - source: dirname
      style: secondary
      start: 7
      end: 14
    - source: file.txt
      style: secondary
      start: 15
      end: 23
    - source: dirname file.txt
      style: secondary
      start: 7
      end: 23
