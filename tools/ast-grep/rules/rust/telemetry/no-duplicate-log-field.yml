# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-duplicate-log-field
language: rust
severity: error
utils:
    name-end:
        regex: '^(=|,|\)|\})$'
    repeated-field:
        matches: tracing-field-start
        pattern: $NAME
        any:
            - all:
                - precedes: {matches: name-end}
                - precedes: {stopBy: end, matches: tracing-field-start, pattern: $NAME, precedes: {matches: name-end}}
            - all:
                - precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $B, precedes: {matches: name-end}}}
                - precedes: {stopBy: end, matches: tracing-field-start, pattern: $NAME, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $B, precedes: {matches: name-end}}}}
            - all:
                - precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $B, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $C, precedes: {matches: name-end}}}}}
                - precedes: {stopBy: end, matches: tracing-field-start, pattern: $NAME, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $B, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $C, precedes: {matches: name-end}}}}}}
            - all:
                - precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $B, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $C, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $D, precedes: {matches: name-end}}}}}}}
                - precedes: {stopBy: end, matches: tracing-field-start, pattern: $NAME, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $B, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $C, precedes: {regex: '^\.$', precedes: {kind: identifier, pattern: $D, precedes: {matches: name-end}}}}}}}}
            - all:
                - regex: '^message$'
                - precedes: {matches: name-end}
                - inside: {stopBy: {kind: macro_invocation}, matches: tracing-event-macro}
                - precedes: {stopBy: end, matches: tracing-event-message}
rule:
    any:
        - matches: tracing-macro
          has: {kind: token_tree, has: {stopBy: end, matches: repeated-field}}
        - kind: attribute_item
          has: {kind: attribute, has: {stopBy: end, matches: tracing-instrument-fields, has: {matches: repeated-field}}}
transform:
    TAIL: {replace: {source: $B, replace: '^(.*)$', by: '.$1'}}
    TAIL2: {replace: {source: $C, replace: '^(.*)$', by: '.$1'}}
    TAIL3: {replace: {source: $D, replace: '^(.*)$', by: '.$1'}}
message: 'Event or span records `$NAME$TAIL$TAIL2$TAIL3` twice'
note: 'Delete or rename the repeated field, a trailing format string records field `message`'
