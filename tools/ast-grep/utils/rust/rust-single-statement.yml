# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-single-statement
language: rust
arguments: [first]
rule:
    kind: block
    all:
        - has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, matches: first}
        - not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}
