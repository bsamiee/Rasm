# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-future-annotations
language: python
severity: error
rule:
    kind: future_import_statement
    all:
        - has: {field: name, kind: dotted_name, regex: '^annotations$'} # The annotations feature, ruff removes every other name
        - not: {has: {nthChild: 2}} # The deletion drops a second name with the statement, ruff unnecessary-future-import reports it
fix: ''
message: Future import of annotations, Python 3.15 evaluates annotations lazily without it
note: Delete the import, `requires-python` of the root pyproject.toml is 3.15 and its annotations evaluate lazily
