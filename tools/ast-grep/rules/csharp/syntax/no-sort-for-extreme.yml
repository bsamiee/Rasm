# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sort-for-extreme
language: csharp
severity: error
rule:
    kind: invocation_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^First$'}}
        - has: {field: arguments, not: {has: {kind: argument}}}
        - has:
            field: function
            has:
                field: expression
                kind: invocation_expression
                has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(OrderBy|OrderByDescending|Order|OrderDescending)$'}}
message: '`$CALL` sorts the whole sequence to read one end of it'
note: 'Call `MinBy(<key>)` for `OrderBy(<key>).First()`, `MaxBy(<key>)` for `OrderByDescending(<key>).First()`, and `Min()` or `Max()` for `Order()` or `OrderDescending()`, one pass with no sort, comparer arguments carried over; these skip the null keys a sort places first'
