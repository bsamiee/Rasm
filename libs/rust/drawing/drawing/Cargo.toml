# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-drawing"
version           = "0.1.0"
edition.workspace = true
publish           = false
description       = "Vector drawing model: colors, pens, linetypes, hatches, regions, text, glyph runs, elements, and pages in a stated unit"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                      = { workspace = true }
stacksafe                  = { workspace = true }
nonempty-collections       = { workspace = true }
thiserror                  = { workspace = true }
validated                  = { workspace = true }
derive_more                = { workspace = true }
enum-map                   = { workspace = true }
itertools                  = { workspace = true }
nutype                     = { workspace = true }
strict-num                 = { workspace = true }
typed_floats               = { workspace = true }
nalgebra                   = { workspace = true }
geo                        = { workspace = true }
geo-types                  = { workspace = true }
color                      = { workspace = true }
linebender_resource_handle = { workspace = true }
parlance                   = { workspace = true }
uom                        = { workspace = true }
kurbo                      = { workspace = true }
linesweeper                = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
