# --- [TY] -------------------------------------------------------------------------------

[tool.ty]
environment = { python-platform = "all" }
src         = { exclude = ["libs/python/blender", "apps/blender"] }    # 3.13 uv roots, each checked through its own `[tool.ty]`, kept out of the project an editor's ty server opens at this root
analysis    = { allowed-unresolved-imports = ["uharfbuzz.**"] }        # uharfbuzz re-exports its compiled `_harfbuzz` module, which ships no stub
rules       = { all = "error", unused-type-ignore-comment = "ignore" } # mypy `unused-ignore` owns unused `type: ignore` comments

# --- [MYPY] -----------------------------------------------------------------------------

[tool.mypy]
cache_dir               = "$MYPY_CONFIG_FILE_DIR/.cache/mypy"
strict                  = true
warn_unreachable        = true
exclude_gitignore       = true
disallow_any_explicit   = true
disallow_any_unimported = true
strict_bytes            = true
plugins                 = ["pydantic.mypy"]                                                                                                                                                                                                                                                                                                                                                                          # Typed `__init__` and `model_construct` of each pydantic model, frozen models under a settings base, and no explicit `Any` in a synthesized signature
untyped_calls_exclude   = ["_skimage2.transform._geometric.ProjectiveTransform", "fontTools", "OpenImageIO.ColorConfig", "opentelemetry.distro", "opentelemetry.exporter.otlp.proto.http.trace_exporter", "opentelemetry.instrumentation.structlog", "opentelemetry.sdk._configuration", "opentelemetry.sdk._logs._internal.export.in_memory_log_exporter", "opentelemetry.test.mock_test_classes", "ots", "ufo2ft"] # Definitions these packages ship unannotated, OpenImageIO types `ColorConfig` methods from 3.2.2, after the release Blender bundles
enable_error_code       = ["deprecated", "exhaustive-match", "explicit-override", "narrowed-type-not-subtype", "redundant-expr", "redundant-self", "truthy-bool", "truthy-iterable", "unused-awaitable"]
disable_error_code      = ["abstract", "arg-type", "assert-type", "assignment", "attr-defined", "call-arg", "call-overload", "import", "import-not-found", "index", "name-defined", "no-redef", "operator", "override", "redundant-cast", "return", "return-value", "type-arg", "union-attr", "unused-coroutine", "valid-type"]                                                                                      # ty owns each defect these codes report, ruff PGH003 owns suppressions without a code
overrides               = [{ module = ["fontTools.*", "ots.*", "pathops.*", "sysexits", "ttfautohint.*", "ufo2ft.*"], follow_untyped_imports = true }, { module = ["pathops"], implicit_reexport = true }, { module = ["PyOpenColorIO.PyOpenColorIO.ColorSpaceHelpers", "PyOpenColorIO.PyOpenColorIO.DisplayViewHelpers"], follow_imports = "skip", follow_imports_for_stubs = true }]                               # OpenColorIO binds `AddColorSpace` and `AddDisplayView` with a required parameter after a defaulted one, which no stub states

# --- [REFURB] ---------------------------------------------------------------------------

[tool.refurb]
enable_all = true
quiet      = true
disable    = [
    "FURB100",    # Arbitrary slices of `str(path)` need not remove its suffix, `Path.with_suffix` changes the result
    "FURB101",    # Ruff runs FURB101
    "FURB103",    # Ruff runs FURB103
    "FURB104",    # Ruff PTH109 reports the form
    "FURB105",    # Ruff runs FURB105
    "FURB106",    # `expandtabs` differs from its replacement unless tabs lead the string
    "FURB107",    # Rewrites to `contextlib.suppress` `banned-api` rejects, Ruff SIM105 and S110 report swallowed exceptions
    "FURB108",    # Ruff PLR1714 reports the form
    "FURB109",    # Rewrites to a tuple membership Ruff PLR6201 rejects
    "FURB110",    # Ruff runs FURB110
    "FURB111",    # Ruff PLW0108 reports the form
    "FURB112",    # Ruff C408 reports the form
    "FURB113",    # Named receiver types do not prove exact builtin list mutation
    "FURB114",    # Ruff SIM208 reports the form
    "FURB116",    # Ruff runs FURB116
    "FURB117",    # Ruff PTH123 reports the form
    "FURB118",    # Rewrites to `operator` functions typeshed types as returning `Any`, `banned-api` rejects the getters
    "FURB119",    # Ruff RUF010 reports the form
    "FURB120",    # Crashes on argument lists the mypy cache drops (`'FuncItem' arguments undefined`), RASM102 reports same-module restated defaults
    "FURB121",    # Ruff SIM101 reports the form
    "FURB124",    # Chained `x is y is z` compares outer operands mypy comparison-overlap rejects when types differ
    "FURB125",    # Ruff PLR1711 reports the form
    "FURB126",    # Dropping a trailing `case _` arm fails mypy exhaustive-match
    "FURB128",    # Ruff PLR1712 reports the form
    "FURB130",    # Ruff SIM118 reports the form
    "FURB132",    # Named receiver types do not prove exact builtin mutation, hashing, or equality
    "FURB134",    # Ruff UP033 reports the form
    "FURB135",    # Ruff PERF102 reports the form
    "FURB136",    # Ruff runs FURB136
    "FURB137",    # Ruff C400, C401, C409, and C419 report the form
    "FURB138",    # Ruff PERF401 reports the form
    "FURB140",    # Starmap suggestion ignores comprehension `if` filters, Ruff's FURB140 checks them
    "FURB141",    # Ruff PTH110 reports the form
    "FURB142",    # Named receiver types do not prove exact builtin set mutation
    "FURB144",    # Ruff PTH107 and PTH108 report the form
    "FURB146",    # Ruff PTH112, PTH113, PTH114, and PTH117 report the form
    "FURB147",    # Ruff PTH118 reports the form, FURB147 rejects `posixpath.join` on archive and URL paths
    "FURB150",    # Ruff PTH102 and PTH103 report the form
    "FURB151",    # `Path.touch` keeps an existing file's content, the replaced `open` truncates it
    "FURB152",    # Ruff runs FURB152
    "FURB153",    # Ruff PTH201 reports the form
    "FURB154",    # Ruff runs FURB154
    "FURB155",    # Ruff PTH116 and PTH202 through PTH205 report the form
    "FURB156",    # Ruff runs FURB156
    "FURB157",    # Ruff runs FURB157
    "FURB160",    # Ruff PLW0127 reports the form
    "FURB161",    # Ruff runs FURB161
    "FURB162",    # Ruff runs FURB162
    "FURB163",    # Ruff runs FURB163
    "FURB164",    # Ruff runs FURB164
    "FURB166",    # Ruff runs FURB166
    "FURB167",    # Ruff runs FURB167
    "FURB168",    # Ruff runs FURB168
    "FURB169",    # Ruff runs FURB169
    "FURB171",    # Ruff runs FURB171
    "FURB172",    # `Path.suffix` differs from `endswith` for multi-part extensions and dotfiles
    "FURB173",    # Merged literal `{...} | d` infers its own value type, mypy rejects it at target parameter type
    "FURB176",    # Ruff DTZ003 and DTZ004 report the form
    "FURB177",    # Ruff runs FURB177
    "FURB179",    # `chain.from_iterable` rewrite joins heterogeneous tuple elements to `object`
    "FURB180",    # Ruff runs FURB180
    "FURB183",    # `str(value)` calls `__str__`, formatting calls `__format__`
    "FURB184",    # Matches names with no type or binding check, chaining drops annotations and reused bindings
    "FURB186",    # In-place sorting changes list identity and aliases, functional code retains `sorted`
    "FURB187",    # In-place reversal changes list identity and aliases, Ruff's reverse-copy rule preserves a copied result
    "FURB188",    # Ruff runs FURB188
    "FURB189",    # Ruff runs FURB189
    "FURB190",    # Unbound `str` methods lose receiver overrides and reject bytes accepted by an untyped lambda
    "FURB192",    # Ruff runs FURB192
]

# --- [VULTURE] --------------------------------------------------------------------------

[tool.vulture]
ignore_names      = ["[!_]*", "_*_"] # Public names are API, `_x_` and `__x__` names are hooks the runtime calls
ignore_decorators = ["@*.register"]  # `functools.singledispatch` calls registered handlers through its dispatcher
exclude           = [".venv/"]       # Third-party packages of a virtual environment a member folder holds

# --- [PYTEST] ---------------------------------------------------------------------------

[tool.pytest]
strict                    = true
cache_dir                 = "$PYTEST_CACHE_DIR"
collect_imported_tests    = false
empty_parameter_set_mark  = "fail_at_collect"
addopts                   = [
    "--disable-plugin-autoload",                # Loads the plugins named below alone, never every `pytest11` entry point the environment holds
    "-p",
    "hypothesispytest",
    "-p",
    "pytest_cov",
    "-p",
    "pytester",                                 # Inner pytest runs for the suites of pytest plugins
    "-p",
    "randomly",
    "-p",
    "rasm_testing.hosting",                     # Hosted HTTP servers of `tests/python/support`
    "-p",
    "rasm_testing.sqlite",                      # SQLite database of `tests/python/support`
    "-p",
    "pytest_socket",                            # Named by its module, the entry point name `socket` being the standard library module the hosting plugin imports first
    "-p",
    "timeout",
    "--tb=short",
    "--import-mode=importlib",
    "--disable-socket",
    "--allow-unix-socket",
]
filterwarnings            = ["error"]
timeout                   = "30"
tmp_path_retention_policy = "failed"            # Keeps the folders of failed tests alone, as the SQLite fixture keeps the file of a failed test

# --- [COVERAGE] -------------------------------------------------------------------------

[tool.coverage]
run    = { branch = true, parallel = true, relative_files = true, data_file = ".artifacts/coverage/.coverage" }
report = { show_missing = true, skip_covered = true, exclude_also = ["assert_never\\("] }

# --- [TOMBI] ----------------------------------------------------------------------------

[tool.tombi.files]
exclude = [".config/mise/locks/**", "assets/**"]

[tool.tombi.format.rules]
indent-width                    = 4
key-value-equals-sign-alignment = true
trailing-comment-alignment      = true
trailing-comment-space-width    = 1

[tool.tombi.extensions."tombi-toml/cargo".lsp.inlay-hint.default-features]
enabled = false

[tool.tombi.extensions."tombi-toml/pyproject".lsp.inlay-hint.dependency-version]
enabled = false

[tool.tombi.schema.format.rules]
table-keys-order.enabled   = false
array-values-order.enabled = false

[[tool.tombi.schemas]]
path    = "https://www.schemastore.org/cargo.json" # Bundled copy lacks the artifact dependency fields SchemaStore holds
include = ["**/Cargo.toml"]
