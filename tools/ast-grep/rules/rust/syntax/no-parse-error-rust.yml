# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    empty-raw-string:
        kind: string_content
        inside: {kind: raw_string_literal}
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: empty-raw-string
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: source_file
          has: {stopBy: end, all: [{regex: '^$'}, {pattern: $$MISSING}, {not: {matches: unreported}}]}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: 'Grammar failed to parse the span'
note: 'Fix invalid syntax, or extend the grammar in tools/ast-grep/grammars/rust for valid syntax it rejects'
