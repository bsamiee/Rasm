# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-crate-capability-process
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - has: {field: function, regex: '^((::)?((std|tokio|async_std)::)?process::)?Command::new$|^((::)?process_wrap::(std|tokio)::)?CommandWrap::with_new$'}
        - has: {field: arguments, has: {nthChild: 1, kind: string_literal, pattern: $PROGRAM}}
        - any:
            - has: {field: arguments, has: {nthChild: 1, regex: '^"(tar|gzip|gunzip|zip|unzip|7z|7zz|zstd|xz|bzip2|brotli|curl|wget|ssh|scp|sftp|openssl|ffmpeg|ffprobe|magick|convert|vips|pdftotext|pdftoppm|typst|resvg|rsvg-convert|mmdc|vl-convert|sqlite3|psql|jq|less|more|secret-tool)(\.exe)?"$'}}
            - all:
                - has: {field: arguments, has: {nthChild: 1, regex: '^"cargo(\.exe)?"$'}}
                - inside: {stopBy: {kind: function_item}, kind: function_item, has: {stopBy: end, kind: string_literal, regex: '^"metadata"$'}}
            - all:
                - has: {field: arguments, has: {nthChild: 1, regex: '^"security"$'}}
                - inside: {stopBy: {kind: function_item}, kind: function_item, has: {stopBy: end, kind: string_literal, regex: '^"(find|add|delete)-(generic|internet)-password"$'}}
message: 'Program `$PROGRAM` runs as a child process for a capability a catalog crate holds in process'
note: 'Call the crate in place of the program: `tar` with `flate2` (tar, gzip, gunzip), `zip` (zip, unzip), `sevenz-rust2` (7z), `zstd`, `lzma-rust2` (xz), `bzip2`, `brotli`, `reqwest` (curl, wget), `russh` and `russh-sftp` (ssh, scp, sftp), `aws-lc-rs`, `rcgen`, and `x509-parser` (openssl), `ffmpeg-next` (ffmpeg, ffprobe), `image` or `libvips` (magick, convert, vips), `pdf_oxide` (pdftotext), `hayro` (pdftoppm), `typst`, `resvg` (resvg, rsvg-convert), `mermaid-rs-renderer` (mmdc), `vl-convert-rs` (vl-convert), `rusqlite` (sqlite3), `sqlx` (psql), `serde_json` (jq), `cargo_metadata::MetadataCommand` (cargo metadata), `minus` (less, more), `keyring` (security password items, secret-tool), each returns typed values and errors where the child returns exit codes and text'
