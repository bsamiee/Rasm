id: no-builder-by-hand
valid:
    - |
      impl ConfigBuilder {
          pub fn a(mut self, a: u32) -> Self {
              self.a = a;
              self
          }
          pub fn b(mut self, b: u32) -> Self {
              self.b = b;
              self
          }
          pub fn build(self) -> Config {
              Config { a: self.a, b: self.b }
          }
      }
    - |
      impl Config {
          pub fn a(mut self, a: u32) -> Self {
              self.a = a;
              self
          }
          pub fn b(mut self, b: u32) -> Self {
              self.b = b;
              self
          }
          pub fn c(mut self, c: u32) -> Self {
              self.c = c;
              self
          }
      }
invalid:
    - |
      impl ConfigBuilder {
          pub fn a(mut self, a: u32) -> Self {
              self.a = a;
              self
          }
          pub fn b(mut self, b: u32) -> Self {
              self.b = b;
              self
          }
          pub fn c(mut self, c: String) -> Self {
              self.c = Some(c);
              self
          }
          pub fn build(self) -> Config {
              Config { a: self.a, b: self.b, c: self.c }
          }
      }
    - |
      impl<T> Request<T> {
          pub fn host(self, host: String) -> Self {
              Self { host, ..self }
          }
          pub fn port(self, port: u16) -> Self {
              Self { port, ..self }
          }
          pub fn body(self, body: T) -> Self {
              Self { body: Some(body), ..self }
          }
          pub fn finish(self) -> Sent {
              send(self)
          }
      }
