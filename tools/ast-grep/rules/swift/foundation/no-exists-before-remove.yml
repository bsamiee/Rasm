# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exists-before-remove
language: swift
severity: error
utils:
    subject-path:
        any:
            - pattern: $SUBJECT.path
            - pattern: $SUBJECT.path()
            - pattern: '$SUBJECT.path(percentEncoded: $_)'
            - pattern: $SUBJECT
    exists-arguments:
        has:
            kind: call_suffix
            has:
                kind: value_arguments
                has: {kind: value_argument, nthChild: 1, has: {field: value, matches: subject-path}}
    exists-check:
        pattern: '$MANAGER.fileExists(atPath: $_)'
        all:
            - not: {regex: '^!'}
            - matches: exists-arguments
            - has: {kind: navigation_expression, has: {field: target, pattern: $MANAGER, not: {kind: prefix_expression}}}
    absent-check:
        pattern: '$_.fileExists(atPath: $_)'
        all:
            - regex: '^!'
            - matches: exists-arguments
    removal:
        any:
            - pattern: '$MANAGER.removeItem(at: $SUBJECT)'
            - pattern: '$MANAGER.removeItem(atPath: $SUBJECT.path)'
            - pattern: '$MANAGER.removeItem(atPath: $SUBJECT.path())'
            - pattern: '$MANAGER.removeItem(atPath: $SUBJECT.path(percentEncoded: $_))'
            - pattern: '$MANAGER.removeItem(atPath: $SUBJECT)'
            - pattern: '$MANAGER.trashItem(at: $SUBJECT, resultingItemURL: $$_)'
    exit-body:
        matches: {swift-single-statement: {first: {kind: control_transfer_statement}}}
rule:
    pattern: $SITE
    any:
        - kind: ternary_expression
          all:
            - has: {field: condition, matches: exists-check}
            - has: {field: if_true, has: {matches: removal, stopBy: end}}
        - kind: guard_statement
          all:
            - has: {field: condition, matches: exists-check}
            - precedes: {has: {matches: removal, stopBy: end}, stopBy: end}
        - kind: if_statement
          all:
            - has: {field: condition, matches: exists-check}
            - has: {kind: statements, has: {matches: removal, stopBy: end}}
        - kind: if_statement
          all:
            - has: {field: condition, matches: absent-check}
            - not: {has: {regex: '^else$'}}
            - has: {kind: statements, matches: exit-body}
            - precedes: {has: {matches: removal, stopBy: end}, stopBy: end}
        - kind: for_statement
          all:
            - has: {kind: where_clause, has: {matches: exists-check}}
            - has: {kind: statements, has: {matches: removal, stopBy: end}}
message: '`fileExists` before removing `$SUBJECT` repeats a check removal makes and races the filesystem'
note: 'Remove unconditionally inside the function that maps a missing file to `.success(nil)` and every other error to `.failure`'
