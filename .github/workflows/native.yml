name: Native

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, runner: macos-26 }
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: win-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - id: cache
        uses: ./.github/actions/native-cache
        with:
          rid: ${{ matrix.rid }}
      - if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - run: pnpm exec nx run-many -t stage
      - if: always() && steps.cache.outputs.vcpkg-key != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/vcpkg-archives
            .cache/vcpkg-downloads
          key: ${{ steps.cache.outputs.vcpkg-key }}
      - if: always() && steps.cache.outputs.releases-key != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/energyplus
            .cache/ktx
            .cache/sqlitevec
            .cache/duckdbextensions
            .cache/tools
          key: ${{ steps.cache.outputs.releases-key }}
      - if: always() && matrix.rid == 'osx-arm64' && steps.cache.outputs.emgucv-key != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/emgucv/artifacts
          key: ${{ steps.cache.outputs.emgucv-key }}
      - run: tar -czf "$RUNNER_TEMP/native-stage-${{ matrix.rid }}.tar.gz" native/*/stage
        working-directory: .artifacts
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/native-stage-${{ matrix.rid }}.tar.gz
          archive: false

  pack:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: native-stage-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-stage
      - run: mkdir -p .artifacts && for archive in "$RUNNER_TEMP"/native-stage/*.tar.gz; do tar -xzf "$archive" -C .artifacts; done
      - run: pnpm exec nx run-many -t pack --excludeTaskDependencies
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-local
          path: .artifacts/nuget
