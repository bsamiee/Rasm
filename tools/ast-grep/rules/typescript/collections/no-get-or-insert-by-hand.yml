# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores:
    - libs/typescript/creative-cloud/indesign/**
    - libs/typescript/creative-cloud/uxp/**
utils:
    stable-key:
        any:
            - kind: identifier, this, string, number, true, false, null, undefined
            - kind: unary_expression
              all: [{has: {field: operator, regex: '^[+-]$'}}, {has: {field: argument, kind: number}}]
            - matches: typescript-expression-wrapper
              has: {nthChild: 1, matches: stable-key}
    suspension-or-eval:
        any:
            - kind: await_expression, yield_expression
            - kind: call_expression
              has:
                field: function
                any:
                    - {kind: identifier, regex: '^eval$'}
                    - matches: typescript-expression-wrapper
                      has: {stopBy: {not: {matches: typescript-expression-wrapper}}, kind: identifier, regex: '^eval$'}
rule:
    any:
        - kind: expression_statement
          has:
            nthChild: 1
            any:
                - pattern: '$MAP.has($KEY) || $MAP.set($KEY, $VALUE)'
                - pattern: '!$MAP.has($KEY) && $MAP.set($KEY, $VALUE)'
        - kind: if_statement
          all:
            - has: {field: condition, has: {nthChild: 1, pattern: '!$MAP.has($KEY)'}}
            - not: {has: {field: alternative, kind: else_clause}}
            - has:
                field: consequence
                any:
                    - kind: expression_statement
                    - kind: statement_block
                      has: {kind: expression_statement}
                      not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
                has: {stopBy: {kind: call_expression}, kind: call_expression, pattern: '$MAP.set($KEY, $VALUE)'}
constraints:
    MAP: {kind: identifier, matches: {typescript-collection-receiver: {collection: {regex: '^Map$'}}}}
    KEY: {matches: stable-key}
    VALUE:
        not:
            any:
                - matches: suspension-or-eval
                - not: {matches: typescript-function-boundary}
                  has: {stopBy: {matches: typescript-function-boundary}, matches: suspension-or-eval}
message: '`$MAP.set` inserts under `$KEY` behind its own membership test'
note: 'Call `<map>.getOrInsertComputed(<key>, () => <value>)`, or `<map>.getOrInsert(<key>, <value>)` for a value that costs nothing to evaluate'
