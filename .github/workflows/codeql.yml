name: CodeQL

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: 20 14 * * 1

permissions:
    security-events: write

defaults:
    run:
        shell: bash

jobs:
    analyze:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {language: actions}
                    - {language: csharp, build-mode: manual}
                    - {language: javascript-typescript}
                    - {language: python}
                    - {language: swift, build-mode: manual}
        runs-on: ${{ (matrix.language == 'swift' && 'xcode-27') || 'ubuntu-26.04' }}
        timeout-minutes: 120
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.language }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - uses: actions/checkout@v7
              with:
                persist-credentials: false
            - uses: ./.github/actions/setup
              if: matrix.build-mode == 'manual'
            - uses: github/codeql-action/init@v4
              with:
                languages: ${{ matrix.language }}
                build-mode: ${{ matrix.build-mode }}
            - run: nx run-many -t build -p tag:language:dotnet --exclude='tag:host:rhino'
              if: matrix.language == 'csharp'
            - run: nx run-many -t build -p tag:language:swift --configuration ci
              if: matrix.language == 'swift'
            - uses: github/codeql-action/analyze@v4
              with:
                category: /language:${{ matrix.language }}
            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() && matrix.language == 'csharp' }}
              with:
                name: diagnostics-${{ github.job }}-${{ matrix.language }}
                path: .artifacts/dotnet/binlog
                include-hidden-files: true
                retention-days: 14
