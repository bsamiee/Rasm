# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: languageext-atom-cell
language: csharplang
utils:
    atom-type:
        matches: {csharp-type-name: {name: {regex: '^(?:Atom|AtomHashMap|AtomSeq|AtomQue|Ref|VersionHashMap)$'}}}
    atom-call:
        kind: invocation_expression
        has: {field: function, matches: {csharp-type-name: {name: {regex: '^(?:Atom|AtomHashMap|AtomSeq|AtomQue|Ref|VersionHashMap|atomIO)$'}}}}
    atom-creation:
        any:
            - matches: atom-call
            - kind: invocation_expression
              all:
                - matches: {csharp-owner-call: {type: {regex: '^IO$'}, member: {regex: '^(?:lift|pure)$'}}}
                - has: {field: arguments, has: {kind: argument, nthChild: 1, has: {any: [{matches: atom-call}, {kind: lambda_expression, has: {field: body, matches: atom-call}}]}}}
    atom-element-type:
        any:
            - kind: array_type
              has: {field: type, matches: atom-type}
            - matches: {csharp-generic-type: {name: {kind: identifier}, list: {has: {matches: atom-type}}}}
    callback-parameter:
        kind: identifier
        inside:
            stopBy: end
            kind: 'lambda_expression, anonymous_method_expression, local_function_statement'
            has: {field: parameters, any: [{kind: implicit_parameter, pattern: {context: 'var f = $CELL => 0;', selector: implicit_parameter}}, {has: {kind: parameter, has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}}}]}
    query-binding:
        any:
            - kind: from_clause
              has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
            - kind: let_clause
              has: {kind: identifier, nthChild: 1, pattern: {context: 'class $CELL;', selector: identifier}}
    typed-local:
        matches: {csharp-declared-type: {type: {matches: atom-type}}}
    local-binding:
        matches: {csharp-declared-type: {type: {pattern: $_}}}
    typed-elements:
        matches: {csharp-declared-type: {type: {matches: atom-element-type}}}
    atom-member:
        any:
            - kind: field_declaration
              has: {kind: variable_declaration, all: [{has: {field: type, matches: atom-type}}, {has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}}}]}
            - kind: property_declaration
              all:
                - has: {field: type, matches: atom-type}
                - has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
            - kind: parameter
              all:
                - has: {field: type, matches: atom-type}
                - has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
              inside: {kind: parameter_list, inside: {kind: &owner-type 'class_declaration, struct_declaration, record_declaration, interface_declaration'}}
    plain-member:
        any:
            - kind: field_declaration
              has: {kind: variable_declaration, all: [{not: {has: {field: type, matches: atom-type}}}, {has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}}}]}
            - kind: property_declaration
              all:
                - not: {has: {field: type, matches: atom-type}}
                - has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
            - kind: parameter
              all:
                - not: {has: {field: type, matches: atom-type}}
                - has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
              inside: {kind: parameter_list, inside: {kind: *owner-type}}
    atom-elements:
        any:
            - kind: 'parameter, property_declaration'
              all:
                - has: {field: type, matches: atom-element-type}
                - has: {field: name, pattern: {context: 'class $ELEMENTS;', selector: identifier}}
            - kind: variable_declaration
              all:
                - has: {field: type, matches: atom-element-type}
                - has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $ELEMENTS;', selector: identifier}}}
    elements-name:
        any:
            - kind: identifier
              pattern: {context: 'class $ELEMENTS;', selector: identifier}
            - kind: member_access_expression
              has: {field: name, pattern: {context: 'class $ELEMENTS;', selector: identifier}}
    elements:
        all:
            - matches: elements-name
            - any:
                - matches: typed-elements
                - all:
                    - not: {matches: local-binding}
                    - not:
                        kind: identifier
                        inside:
                            stopBy: end
                            kind: 'lambda_expression, anonymous_method_expression, local_function_statement'
                            has: {field: parameters, any: [{kind: implicit_parameter, pattern: {context: 'var f = $ELEMENTS => 0;', selector: implicit_parameter}}, {has: {kind: parameter, has: {field: name, pattern: {context: 'class $ELEMENTS;', selector: identifier}}}}]}
                    - inside:
                        stopBy: {kind: *owner-type}
                        kind: *owner-type
                        any:
                            - has: {field: body, has: {any: [{kind: property_declaration, matches: atom-elements}, {kind: field_declaration, has: {kind: variable_declaration, matches: atom-elements}}]}}
                            - has: {kind: parameter_list, has: {kind: parameter, matches: atom-elements}}
    own-name:
        any:
            - kind: identifier
              pattern: {context: 'class $CELL;', selector: identifier}
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^this$'}
                - has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
    own-cell:
        all:
            - matches: own-name
            - any:
                - matches: typed-local
                - kind: identifier
                  inside:
                    stopBy: end
                    inside: {kind: query_expression}
                    follows:
                        stopBy: end
                        matches: query-binding
                        any:
                            - has: {field: type, matches: atom-type}
                            - has: {matches: atom-creation}
                - all:
                    - inside:
                        stopBy: {kind: *owner-type}
                        kind: *owner-type
                        any:
                            - has: {field: body, has: {matches: atom-member}}
                            - has: {kind: parameter_list, has: {matches: atom-member}}
                    - not: {matches: local-binding}
                    - not: {kind: identifier, matches: callback-parameter}
                    - not: {kind: identifier, inside: {stopBy: end, inside: {kind: query_expression}, follows: {stopBy: end, matches: query-binding}}}
    element-parameter:
        kind: identifier
        pattern: {context: 'class $CELL;', selector: identifier}
        inside:
            stopBy: end
            kind: lambda_expression
            has: {field: parameters, any: [{kind: implicit_parameter, pattern: {context: 'var f = $CELL => 0;', selector: implicit_parameter}}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}}}]}
            inside:
                kind: argument
                inside:
                    kind: argument_list
                    inside: {kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: elements}}}
rule:
    any:
        - matches: atom-creation
        - matches: own-cell
        - matches: {csharp-block-local: {declarator: {has: {nthChild: 2, matches: languageext-atom-cell}}}}
        - matches: element-parameter
        - kind: member_access_expression
          all:
            - not: {has: {field: expression, regex: '^this$'}}
            - has: {field: name, pattern: {context: 'class $CELL;', selector: identifier}}
            - inside:
                kind: compilation_unit
                stopBy: end
                all:
                    - has: {stopBy: &container {not: {kind: 'compilation_unit, global_statement, namespace_declaration, declaration_list, class_declaration, struct_declaration, record_declaration, interface_declaration, union_declaration, extension_declaration, extension_body, parameter_list, preproc_if, preproc_elif, preproc_else'}}, matches: atom-member}
                    - not: {has: {stopBy: *container, matches: plain-member}}
        - kind: element_access_expression
          has: {field: expression, matches: elements}
        - kind: parenthesized_expression
          has: {matches: languageext-atom-cell}
