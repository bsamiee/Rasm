# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-digit-string-structure
language: python
severity: error
utils:
    rendered-digit:
        any:
            - kind: call
              has: {field: function, regex: '^str$'}
            - kind: string
              regex: '^[fF]'
              has: {kind: interpolation}
              not: {has: {kind: 'string_content, interpolation', nthChild: {position: 2, ofRule: {kind: 'string_content, interpolation'}}}}
    joined-source:
        any:
            - kind: generator_expression
              has: {field: body, matches: rendered-digit}
            - kind: argument_list
              has: {kind: 'list_comprehension, generator_expression', has: {field: body, matches: rendered-digit}}
            - kind: argument_list
              has: {kind: call, pattern: 'map(str, $_)'}
              not: {has: {nthChild: 2}}
    joined-string:
        kind: assignment
        all:
            - has: {field: left, kind: identifier, pattern: $S}
            - has:
                field: right
                kind: call
                all:
                    - has: {field: function, regex: '^"{2}\.join$|^''{2}\.join$'}
                    - has: {field: arguments, matches: joined-source}
    digit:
        kind: string
        regex: '^["'']\d["'']$'
    indexed-string:
        kind: subscript
        has: {field: value, kind: identifier, pattern: $S}
rule:
    pattern: $READ
    any:
        - kind: call
          any:
            - pattern: int($S[$I])
            - all:
                - has: {field: function, kind: attribute, all: [{has: {field: object, any: [{kind: identifier, pattern: $S}, {matches: indexed-string}]}}, {has: {field: attribute, regex: '^(count|find|rfind|index|rindex)$'}}]}
                - has: {field: arguments, has: {matches: digit}}
        - kind: comparison_operator
          all:
            - has: {matches: digit}
            - any:
                - all:
                    - has: {field: operators, regex: '^(not\s+)?in$'}
                    - has: {kind: identifier, pattern: $S, nthChild: 2}
                - all:
                    - has: {field: operators, regex: '^[!=]=$'}
                    - has: {matches: indexed-string}
    inside:
        kind: function_definition
        stopBy: end
        has: {stopBy: {matches: python-function-boundary}, matches: joined-string}
message: '`$READ` reads a digit back from the numbers `$S` renders into one string'
note: 'Hold the values in a `list[int]` and index or count the list'
