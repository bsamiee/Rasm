# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lifted-condition
language: tsx
severity: error
utils:
    # Predicate that returns its argument, identity typed as Predicate<A> compiles for a boolean A alone, the lifted value is the condition
    identity-predicate:
        any:
            - pattern: identity
            - pattern: Function.identity
            - kind: arrow_function
              all:
                  - has: {field: parameters, has: {kind: required_parameter, has: {kind: identifier, pattern: $HELD}}}
                  - has: {field: body, kind: identifier, pattern: $HELD}
rule:
    kind: call_expression
    all:
        # The lifts of one value under a predicate, the element filters (Array.filter, Effect.filter) hold no guarded value
        - has:
              field: function
              any:
                  - pattern: Option.liftPredicate
                  - pattern: Option.filter
                  - pattern: Either.liftPredicate
                  - pattern: Effect.liftPredicate
                  - pattern: Array.liftPredicate
        - has: {field: arguments, has: {matches: identity-predicate}}
message: The lifted value is the condition itself, and the value the condition guards sits elsewhere
note: >-
    Lift the guarded value, `Option.liftPredicate(value, () => condition)` for one value, `Array.filter(values, () => condition)`
    for elements, a host activation option (`apply`) for a plugin
