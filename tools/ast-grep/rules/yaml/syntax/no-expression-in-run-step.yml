# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yaml
severity: error
files: ['.github/workflows/**', '**/action.{yml,yaml}']
utils:
    node: {kind: 'block_node, flow_node'}
    expression-source:
        matches: node
        has: {kind: 'plain_scalar, single_quote_scalar, double_quote_scalar, block_scalar', regex: '\$\{\{'}
    expression-pair:
        any:
            - matches: {yaml-resolved-pair: {key: {regex: '^["'']?(?:run|shell)["'']?$'}, value: {matches: expression-source}}}
            - matches:
                yaml-resolved-pair:
                    key: {regex: '^["'']?with["'']?$'}
                    value: {has: {kind: 'block_mapping, flow_mapping', has: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?(?i-u:script)["'']?$'}, value: {matches: expression-source}}}}}}
              inside: {has: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?uses["'']?$'}, value: {has: {regex: '^["'']?(?i-u:actions/github-script)@'}}}}}}
    expression-step-value:
        matches: {yaml-resolved-value: {value: {has: {kind: 'block_mapping, flow_mapping', has: {matches: expression-pair}}}}}
rule:
    any:
        - all: [{matches: expression-pair}, {matches: yaml-step-pair}]
        - matches: {yaml-resolved-pair: {key: {regex: '^["'']?shell["'']?$'}, value: {matches: expression-source}}}
          inside:
            kind: block_mapping, flow_mapping
            inside:
                matches: node
                inside:
                    matches: {yaml-resolved-pair: {key: {regex: '^["'']?run["'']?$'}, value: {matches: node}}}
                    inside: {kind: 'block_mapping, flow_mapping', inside: {matches: node, inside: {matches: {yaml-resolved-pair: {key: {regex: '^["'']?defaults["'']?$'}, value: {matches: node}}}}}}
        - kind: alias
          inside:
            kind: flow_node
            any:
                - matches: expression-step-value
                  inside: {kind: 'block_sequence_item, flow_sequence', inside: {matches: yaml-steps-pair, stopBy: {kind: 'block_mapping_pair, flow_pair'}}}
                - inside: {matches: yaml-steps-pair, field: value}
                  matches:
                    yaml-resolved-value:
                        value:
                            has:
                                kind: block_sequence, flow_sequence
                                has:
                                    any:
                                        - {kind: block_sequence_item, has: {matches: expression-step-value}}
                                        - {kind: flow_node, matches: expression-step-value}
                                        - {kind: flow_pair, matches: expression-pair}
message: GitHub interpolates expressions into executable code
note: 'Read expressions from step `env` as `"$NAME"` in bash, `$env:NAME` in pwsh, or `process.env.NAME` in github-script, and write `shell` as a literal'
