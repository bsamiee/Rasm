# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-function-javascript
language: javascript
severity: error
utils:
    forwarded:
        kind: call_expression
        pattern: $CALL
        has: {field: function, kind: identifier}
    forwarding-body:
        any:
            - matches: forwarded
            - kind: statement_block
              not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
              has: {kind: 'return_statement, expression_statement', has: {matches: forwarded}}
rule:
    kind: function_declaration, function_expression, arrow_function, method_definition
    all:
        - not: {regex: '^(static\s+)?(async\s|get\s+[\w$\[#]|set\s+[\w$\[#]|\*)'}
        - has: {field: body, matches: forwarding-body}
        - any:
            - all:
                - has: {field: parameters, pattern: {context: 'function f($$$P) {}', selector: formal_parameters}}
                - has: {stopBy: end, all: [{kind: call_expression}, {pattern: $CALL}, {pattern: $F($$$P)}]}
            - all:
                - has: {field: parameters, pattern: {context: 'function f($$$P, ...$A) {}', selector: formal_parameters}}
                - has: {stopBy: end, all: [{kind: call_expression}, {pattern: $CALL}, {pattern: '$F($$$P, ...$A)'}]}
            - all:
                - has: {field: parameter, kind: identifier, pattern: $A}
                - has: {stopBy: end, all: [{kind: call_expression}, {pattern: $CALL}, {pattern: $F($A)}]}
        - not: {has: {field: name, pattern: $F}}
        - not: {has: {field: parameters, has: {stopBy: end, kind: identifier, pattern: $F}}}
        - not: {has: {field: parameter, pattern: $F}}
message: 'Function forwards its parameters unchanged to `$F`'
note: 'Call or pass `$F` in place of the function where its callers pass no further arguments'
