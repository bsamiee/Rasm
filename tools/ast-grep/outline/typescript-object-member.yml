id: typescript-object-member
language: tsx
role: member
parentRuleIds: [tsx-export-const, tsx-export-const-typed, tsx-top-level-const, tsx-top-level-const-typed, tsx-export-let, tsx-export-let-typed, tsx-top-level-let, tsx-top-level-let-typed]
symbolType: property
utils:
    declared-value:
        inside:
            kind: variable_declarator
            field: value
            inside:
                kind: lexical_declaration
                any:
                    - inside: {kind: program}
                    - inside: {kind: export_statement, inside: {kind: program}}
            stopBy:
                not: {kind: 'as_expression, satisfies_expression, parenthesized_expression'}
    schema-module:
        kind: identifier
        pattern: $MODULE
        inside:
            kind: program
            stopBy: end
            has:
                kind: import_statement
                not: {has: {regex: '^type$'}}
                any:
                    - all:
                        - has: {field: source, regex: '^["'']effect(/index)?["'']$'}
                        - has:
                            stopBy: end
                            kind: import_specifier
                            has: {kind: identifier, nthChild: {position: 1, ofRule: {kind: identifier}}, regex: '^Schema$'}
                            all:
                                - has: {kind: identifier, pattern: $MODULE, nthChild: {position: 1, ofRule: {kind: identifier}, reverse: true}}
                                - not: {has: {regex: '^type$'}}
                    - all:
                        - has: {field: source, regex: '^["'']effect/Schema["'']$'}
                        - has: {stopBy: end, kind: namespace_import, has: {kind: identifier, pattern: $MODULE}}
    struct-import:
        kind: identifier
        pattern: $STRUCT
        inside:
            kind: program
            stopBy: end
            has:
                kind: import_statement
                not: {has: {regex: '^type$'}}
                all:
                    - has: {field: source, regex: '^["'']effect/Schema["'']$'}
                    - has:
                        stopBy: end
                        kind: import_specifier
                        has: {kind: identifier, nthChild: {position: 1, ofRule: {kind: identifier}}, regex: '^Struct$'}
                        all:
                            - has: {kind: identifier, pattern: $STRUCT, nthChild: {position: 1, ofRule: {kind: identifier}, reverse: true}}
                            - not: {has: {regex: '^type$'}}
rule:
    any:
        - kind: pair
          has: {field: key, pattern: $NAME}
        - kind: shorthand_property_identifier
          pattern: $NAME
    pattern: $DECLARATION
    inside:
        kind: object
        any:
            - matches: declared-value
            - nthChild: {position: 1, ofRule: {not: {kind: comment}}}
              inside:
                kind: arguments
                inside:
                    kind: call_expression
                    matches: declared-value
                    has:
                        field: function
                        any:
                            - kind: member_expression
                              all:
                                - has: {field: property, regex: '^Struct$'}
                                - has: {field: object, matches: schema-module}
                            - matches: struct-import
name: $NAME
signature: $DECLARATION
isPublic: true
