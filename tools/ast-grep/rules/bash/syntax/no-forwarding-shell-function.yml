# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# Report only, deleting the function leaves its callers, the probe fails with run: command not found
id: no-forwarding-shell-function
language: bash
severity: error
ignores: ["**/*.json"]
rule:
    kind: function_definition
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            field: body
            kind: compound_statement
            matches: bash-single-command-body
            has:
                kind: command
                pattern: $CALL
                all:
                    - has: {field: name, kind: command_name, regex: '^[A-Za-z_][A-Za-z0-9_-]*$'}
                    - has: {field: argument, regex: '^"\$(\{@\}|@)"$'}
                not: {has: {nthChild: 3}}
message: 'The function `$NAME` forwards every argument unchanged to `$CALL`'
note: Call the owning command directly, and keep adapters that select, join, reorder, default, or add arguments
