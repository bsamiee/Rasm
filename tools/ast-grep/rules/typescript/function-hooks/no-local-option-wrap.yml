# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-local-option-wrap
language: tsx
severity: error
files: ['plugins/function-hooks/**']
utils:
    constructor:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(some|none|fromNullable)$'}
            - has: {field: object, kind: identifier, matches: {typescript-import-reference: {source: {regex: 'monads\.ts$'}, exported: {regex: '^Option$'}}}}
    constructed:
        any:
            - kind: call_expression
              has: {field: function, matches: constructor, has: {field: property, regex: '^(some|fromNullable)$'}}
            - kind: member_expression
              matches: constructor
              has: {field: property, regex: '^none$'}
            - kind: ternary_expression
              all: [{has: {field: consequence, matches: constructed}}, {has: {field: alternative, matches: constructed}}]
            - kind: 'parenthesized_expression, await_expression'
              has: {matches: constructed}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^then$'}}
                - has: {field: arguments, has: {matches: typescript-function-boundary}}
                - not: {has: {field: arguments, has: {matches: typescript-function-boundary, not: {matches: returning-constructed}}}}
    returning-constructed:
        matches: typescript-function-boundary
        any:
            - has: {field: body, matches: constructed}
            - has:
                field: body
                kind: statement_block
                all:
                    - has: {stopBy: {matches: typescript-function-boundary}, kind: return_statement}
                    - not: {has: {stopBy: {matches: typescript-function-boundary}, kind: return_statement, not: {has: {matches: constructed}}}}
    unwrapped:
        any:
            - inside: {kind: member_expression, field: object, has: {field: property, regex: '^values$'}}
            - inside: {kind: member_expression, field: object, has: {field: property, regex: '^(match|map|toArray)$'}, inside: {kind: call_expression, field: function}}
rewriters:
    - id: present-value
      rule: {kind: call_expression, pattern: $F($A), has: {field: function, matches: constructor, has: {field: property, regex: '^some$'}}}
      fix: $A
    - id: nullable-value
      rule: {kind: call_expression, pattern: $F($A), has: {field: function, matches: constructor, has: {field: property, regex: '^fromNullable$'}}}
      fix: $A ?? undefined
    - id: absent-value
      rule: {kind: member_expression, matches: constructor, has: {field: property, regex: '^none$'}}
      fix: undefined
    - id: listed
      rule: {any: [{kind: call_expression, pattern: $O.toArray()}, {kind: member_expression, pattern: $O.values}]}
      fix: '($O === undefined ? [] : [$O])'
    - id: matched
      rule: {kind: call_expression, pattern: '$O.match($SOME, $NONE)'}
      fix: '($O === undefined ? ($NONE)() : ($SOME)($O))'
    - id: mapped
      rule: {kind: call_expression, pattern: $O.map($MAP)}
      fix: '($O === undefined ? Option.none : Option.some(($MAP)($O)))'
    - id: rest
      rule: {pattern: $S, follows: {stopBy: end, pattern: $DECLARATION}}
      transform:
        REWRITTEN: {rewrite: {source: $S, rewriters: [listed, matched, mapped]}}
      fix: $REWRITTEN
    - id: declared
      rule:
        pattern: $DECLARATION
        all:
            - has: {field: kind, pattern: $$KIND}
            - has: {kind: variable_declarator, all: [{has: {field: name, pattern: $O}}, {has: {field: value, pattern: $VALUE}}]}
            - inside: {kind: statement_block, pattern: $BLOCK}
      transform:
        UNWRAPPED: {rewrite: {source: $VALUE, rewriters: [present-value, nullable-value, absent-value]}}
        REST: {rewrite: {source: $BLOCK, rewriters: [rest], joinBy: "\n"}}
      fix: "$KIND $O = $UNWRAPPED;\n$REST"
rule:
    kind: lexical_declaration
    pattern: $DECLARATION
    all:
        - has: {field: kind, pattern: $$KIND}
        - has: {kind: variable_declarator, all: [{has: {field: name, kind: identifier, pattern: $O}}, {not: {has: {field: type, kind: type_annotation}}}, {has: {field: value, matches: constructed, pattern: $VALUE}}]}
        - not: {has: {kind: variable_declarator, nthChild: 2}}
        - inside: {kind: statement_block, pattern: $BLOCK}
        - not: {precedes: {stopBy: end, has: {stopBy: end, pattern: $O, not: {matches: unwrapped}}}}
transform:
    DECLARED: {rewrite: {source: $DECLARATION, rewriters: [declared]}}
message: '`$O` wraps a value in an `Option` its own function unwraps'
note: 'Keep the plain value and compare it with `undefined`'
fix:
    template: $DECLARED
    expandEnd: {stopBy: end, pattern: $_LAST, inside: {kind: statement_block}, nthChild: {position: 1, reverse: true}}
