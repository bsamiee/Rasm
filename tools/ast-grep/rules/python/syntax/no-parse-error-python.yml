# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
rule:
    any:
        - kind: ERROR
          not: {inside: {kind: ERROR, stopBy: end}}
        - kind: module
          has: {stopBy: end, all: [{regex: '^$'}, {pattern: $$MISSING}, {not: {inside: {kind: ERROR, stopBy: end}}}]}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: Fix invalid syntax or update the Python grammar
