# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    codec:
        kind: call_expression
        has: {field: function, pattern: $FN, matches: {effect-schema-codec: {name: {regex: '(Effect|Option|Sync)$'}}}}
    literal-argument:
        kind: arguments
        has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, matches: typescript-literal-expression}
rule:
    any:
        - kind: call_expression
          all:
            - has: {field: function, matches: codec}
            - has: {field: arguments, matches: literal-argument}
        - kind: call_expression
          all:
            - has: {field: arguments, has: {nthChild: {position: 2, ofRule: *code}, matches: codec}}
            - has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}
            - has: {field: arguments, matches: literal-argument}
        - kind: variable_declarator
          all:
            - has: {field: name, kind: identifier, pattern: $CODEC}
            - has: {field: value, matches: codec}
            - inside:
                kind: 'program, statement_block'
                stopBy: {kind: 'program, statement_block'}
                has: {stopBy: end, kind: call_expression, all: [{has: {field: function, kind: identifier, pattern: $CODEC}}, {has: {field: arguments, matches: literal-argument}}]}
message: '`$FN` runs a codec over a literal'
note: 'Call `<schema>.make`, `makeOption`, or `makeEffect` with a `Type` value; write an encode as its `Encoded` literal'
