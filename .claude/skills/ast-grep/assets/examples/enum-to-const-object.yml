# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json
id: enum-to-const-object
language: typescript
severity: error
ignores: ['*.d.ts'] # A declaration file is ambient without the keyword
rule:
    kind: enum_declaration
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, pattern: $BODY}
        - not: {has: {field: body, has: {kind: property_identifier}}} # Valueless member has no value to fold, no fix
        - not: {inside: {kind: export_statement}} # Exported member, hand repair covers the API break
        - not: {inside: {kind: ambient_declaration, stopBy: end}} # declare enum, or an enum in a declare namespace, refuses an initializer
        - not: {regex: '^const'} # const enum has no emit, an object adds a runtime value the enum never had
rewriters:
    - id: enum-row
      rule:
        kind: enum_assignment
        all:
            - has: {field: name, pattern: $KEY}
            - has: {field: value, pattern: $VALUE} # typescript_rule.json omits the value field, the cst proves it and the editor warning is noise
      fix: '$KEY: $VALUE'
transform:
    ROWS:
        rewrite:
            rewriters: [enum-row]
            source: $BODY
            joinBy: ', '
fix: |-
    const $NAME = { $ROWS } as const;
    type $NAME = (typeof $NAME)[keyof typeof $NAME];
message: Enum declares constants through emit-bearing syntax
note: The constants become an `as const` object with its value union derived, runtime values, key space, and value space survive verbatim
