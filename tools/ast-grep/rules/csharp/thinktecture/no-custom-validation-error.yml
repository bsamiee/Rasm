# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-custom-validation-error
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: generic_name
    pattern: $TEST
    regex: '^IsType\s*<\s*((global::)?Thinktecture\.)?ValidationError\s*>$'
    inside: {kind: member_access_expression, field: name}
message: '`$TEST` tests the error type in place of its code'
note: 'Test `HasCode(ErrorCodes.ValidationFailed)` after `<type>.Validated`, the one `Invalid` error `[ValidationError<Invalid>]` raises carries the code'
