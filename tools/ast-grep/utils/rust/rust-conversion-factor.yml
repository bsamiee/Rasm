# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-conversion-factor
language: rust
rule:
    kind: float_literal
    not: {matches: rust-test-scope}
    regex: |-
        (?x)^(
            0\.3048 | 304\.8 | 3\.2808\d*
            | 25\.4 | 2\.54 | 0\.0254 | 39\.370\d* | 0\.03937\d*
            | 1\.609344 | 1609\.344
            | 0\.45359237 | 453\.59237 | 2\.2046\d*
            | 4\.44822\d*
            | 6894\.7[56]\d*
            | 273\.15
        )0*(_?f(32|64))?$
