# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-type-name
language: csharplang
arguments: [name]
utils:
    leaf:
        any:
            - kind: predefined_type
              matches: name
            - matches: {csharp-simple-name: {name: {matches: name}}}
    named:
        any:
            - matches: leaf
            - kind: qualified_name, alias_qualified_name, member_access_expression
              has: {field: name, matches: leaf}
rule:
    any:
        - matches: named
        - kind: nullable_type
          has: {field: type, matches: named}
