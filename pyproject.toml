    "pysubs2",                                            # [ARTIFACTS]: subtitle parse/convert/retime/restyle model
    "pyvips",                                             # [ARTIFACTS]: fused decode, downscale, ICC, smartcrop; source API mode over the Forge vips — HEVC/HEIF, JXL, and EXR the binary wheel excludes
    "scikit-image",                                       # [ARTIFACTS]: image processing; sdist builds at the floor under the pythran dependency-metadata gast override below
    "simpleidml",                                         # [ARTIFACTS]: IDML package mutation and composition
    "tifffile",                                           # [ARTIFACTS]: TIFF container IO and extratag authoring
    # --- [TYPOGRAPHY_COLOR]
    "blackrenderer",                                      # [ARTIFACTS]: COLRv1 color-glyph SVG rasterization
    "coloraide",                                          # [ARTIFACTS]: oklch gamut mapping and CVD filters
    "colour-cxf",                                         # [ARTIFACTS]: CxF3 spot/spectral color exchange
    "colour-science",                                     # [ARTIFACTS]: CIE, spectral, and appearance color models
    "fonttools",                                          # [ARTIFACTS]: font subsetting, instancing, and shaping metadata
    "opencolorio",                                        # [ARTIFACTS]: OCIO config, colorspace, and CPU/GPU processor transforms over the ACES scene-linear working space
    "opentype-feature-freezer",                           # [ARTIFACTS]: freeze OpenType features into the default glyph set
    "PyICU",                                              # [ARTIFACTS]: ICU locale line-break/bidi/collation; sdist-only, icu rides the Forge scientific substrate
    "pyphen",                                             # [ARTIFACTS]: language-aware hyphenation dictionaries
    "python-bidi",                                        # [ARTIFACTS]: UAX 9 bidi reorder pass before HarfBuzz shaping
    "uharfbuzz",                                          # [ARTIFACTS]: HarfBuzz text-shaping bindings
    "uniseg",                                             # [ARTIFACTS]: Unicode line, word, and grapheme segmentation
    "vharfbuzz",                                          # [ARTIFACTS]: HarfBuzz shaping QA and buffer-diff
    # --- [GRAPHS_VECTOR]
    "drawpyo",                                            # [ARTIFACTS]: draw.io / diagrams.net export
    "drawsvg",                                            # [ARTIFACTS]: hierarchical named-layer SVG authoring
    "ezdxf",                                              # [ARTIFACTS]: DXF read/write/render for export/dxf
    "fast-sugiyama",                                      # [ARTIFACTS]: fast Sugiyama layered placement replacing grandalf placement
    "grandalf",                                           # [ARTIFACTS]: Sugiyama and routed diagram layout (fallback until fast-sugiyama parity lands)
    "igraph",                                             # [DATA]: C-core Leiden/Louvain/Infomap community detection
    "kiwisolver",                                         # [ARTIFACTS]: Cassowary constraint layout solver promoted to a direct surface
    "latex2mathml",                                       # [ARTIFACTS]: LaTeX-to-MathML front-end ziamath drives; composed directly at the commands.FUNCTIONS operator registry
    "networkx",
    "pyelk",                                              # [ARTIFACTS]: ELK layered/orthogonal/ports/nesting diagram layout
    "resvg-py",                                           # [ARTIFACTS]: in-process SVG-to-PNG rasterization (embedded Rust resvg)
    "rustworkx",                                          # [DATA_ARTIFACTS]: graph algorithms
    "schemdraw",                                          # [ARTIFACTS]: native-SVG schematic diagrams
    "skia-pathops",                                       # [ARTIFACTS]: vector boolean/offset/stroke-to-outline
    "svgelements",                                        # [ARTIFACTS]: SVG geometry, transform, and parse helpers
    "ziafont",                                            # [ARTIFACTS]: font glyph text-to-SVG-path
    "ziamath",                                            # [ARTIFACTS]: math-to-SVG rendering
    # --- [CODES_METADATA]
    "c2pa-python",                                        # [ARTIFACTS]: cross-format C2PA content credentials
    "puremagic",                                          # [ARTIFACTS]: pure-Python format sniffer, default detect path beside libmagic
    "pyexiftool",                                         # [ARTIFACTS]: richest cross-format descriptive metadata read/write over the exiftool binary, replaces abandoned exif
    "python-barcode",                                     # [ARTIFACTS]: linear barcode symbologies beside the segno QR arm
    "python-magic",                                       # [ARTIFACTS]: libmagic broad-database fallback behind the puremagic in-process default detect sniffer (retained for niche leaf signatures magic_data.json lacks, never the default path)
    "segno",                                              # [ARTIFACTS]: QR and Micro-QR vector codes
    "zxing-cpp",                                          # [ARTIFACTS]: 2D matrix codes encode and decode
]

[dependency-groups]
dev = [
    "annotated-types",              # typed constraint metadata pydantic consumes; Field stubs cap multiple_of at int | float
    "brotli-stubs",
    "coverage",
    "dirty-equals",
    "grimp",
    "hypothesis",
    "import-linter",
    "inline-snapshot",
    "moto[server]",
    "mypy",
    "pandas-stubs",
    "protoc-gen-connectrpc",        # Connect-Python stub generator; buf drives it from .venv/bin
    "protoc-gen-py<0.2",            # connectrpc 0.11.1 pins protobuf-py==0.1.1 exact, so the generator pairs at 0.1.1; drop the bound when connectrpc bumps
    "pyarrow-stubs",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-timeout",
    "pytest-xdist",
    "ruff>=0.16.2",
    "s3fs",                         # object-store testkit backend over moto S3
    "scipy-stubs",
    "sniffio",                      # async-flavor detection the testkit env double imports directly
    "sqlfluff",                     # SQL format/lint rail; squawk keeps the migration-safety lane
    "squawk-cli",
    "ty",
    "types-geopandas",
    "types-lxml",
    "types-networkx",
    "types-openpyxl",
    "types-protobuf",
    "types-psutil",
    "types-pyphen",
    "types-reportlab",
    "types-shapely",
    "validate-pyproject[all]",
]
mutation = ["mutmut"]

# --- [UV] -------------------------------------------------------------------------------

[tool.uv.sources]
# 0.22.9 imports typing.no_type_check_decorator (removed in 3.15); the pinned rev is current main past the fix, unreleased as of 0.22.9.
beartype = { git = "https://github.com/beartype/beartype.git", rev = "f927b66f79dfb7f595457a85c82398601c17b2f1" }

[tool.uv]
package = false
default-groups = ["dev", "mutation"]

# TOML 1.0 confines an inline table to one line, so the per-package build knobs ride their own table rather than a multi-line brace `taplo` refuses to parse.
[tool.uv.config-settings-package]
scipy = { setup-args = "-Duse-pythran=false" }

# opencolorio drives cmake from a setuptools shim that reads CMAKE_ARGS off the environment, so the knob is a build variable rather than a config setting.
# OCIO's oglapphelpers target compiles ObjC++ over Metal/AppKit under its own -Werror,-Wunguarded-availability-new; the macOS 26 SDK declares symbols newer
# than any deployment target names, so the app helpers never build here and the python binding never needs them. Package scope keeps the flag off every other sdist.
[tool.uv.extra-build-variables]
opencolorio = { CMAKE_ARGS = "-DOCIO_BUILD_APPS=OFF" }

# colour-cxf 0.1.1 declares Requires-Python <3.14 (no 3.15 support): corrected static metadata drops the spurious cap so it resolves on the >=3.15 floor with its runtime deps intact.
[[tool.uv.dependency-metadata]]
name = "colour-cxf"
version = "0.1.1"
requires-python = ">=3.10"
requires-dist = ["typing-extensions<5,>=4", "xsdata>25.4"]

# pythran 0.18.1 pins gast~=0.6.0, whose 3.15 AST shim raises on the required node fields CPython 3.15 introduced; gast 0.7.0 fixes it and beniget 0.4.2.post1
# admits gast>=0.5.0, so only the pythran pin blocks the scikit-image pythran targets (both compile clean under gast 0.7.0, probed live). The override rewrites
# that one pin for the build-env resolution; it is version-pinned, so a pythran release past 0.18.1 resolves natively and retires this block on its own bump.
[[tool.uv.dependency-metadata]]
name = "pythran"
version = "0.18.1"
requires-python = ">=3.7"
requires-dist = ["ply>=3.4", "setuptools", "gast~=0.7.0", "numpy", "beniget~=0.4.0"]

# colour-science 0.4.7 declares Requires-Python <3.15. PEP 440 sorts 3.15.0b3 below 3.15.0, so the cap is inert on the current Forge interpreter and bites the
# instant that interpreter reaches a final 3.15.x: corrected static metadata drops the cap ahead of the flake bump and mirrors the real dependency set whole.
[[tool.uv.dependency-metadata]]
name = "colour-science"
version = "0.4.7"
requires-python = ">=3.11"
requires-dist = [
    "numpy<3,>=2.0.0",
    "biblib-simple; extra == 'docs'",
    "pydata-sphinx-theme; extra == 'docs'",
    "restructuredtext-lint; extra == 'docs'",
    "sphinx; extra == 'docs'",
    "sphinxcontrib-bibtex; extra == 'docs'",
    "trimesh<5,>=4; extra == 'meshing'",
    "imageio<3,>=2; extra == 'optional'",
    "matplotlib>=3.9; extra == 'optional'",
    "networkx<4,>=3.3; extra == 'optional'",
    "opencolorio<3,>=2; python_version < '3.14' and extra == 'optional'",
    "openimageio<4,>=3; extra == 'optional'",
    "pandas<3,>=2.2; extra == 'optional'",
    "pydot<4,>=3; extra == 'optional'",
    "scipy<2,>=1.13.0; extra == 'optional'",
    "tqdm<5,>=4; extra == 'optional'",
    "xxhash<4,>=3; extra == 'optional'",
]
provides-extras = ["docs", "meshing", "optional"]

# pytensor 2.35.1 is the newest numba-free pytensor — 2.36+ hard-require numba, which ships no cp315 wheel — and its Requires-Python <3.14 cap is
# spurious on the current interpreter (probed live: imports and compiles functions): corrected static metadata drops the cap and mirrors the real
# dependency set, so the pymc 5 constellation stays cold-resolvable instead of riding a lock fossil.
[[tool.uv.dependency-metadata]]
name = "pytensor"
version = "2.35.1"
requires-python = ">=3.11"
requires-dist = [
    "setuptools>=59.0.0",
    "scipy<2,>=1",
    "numpy>=2.0",
    "filelock>=3.15",
    "etuples",
    "logical-unification",
    "miniKanren",
    "cons",
    "jax; extra == 'jax'",
    "jaxlib; extra == 'jax'",
    "numba>=0.57; extra == 'numba'",
    "llvmlite; extra == 'numba'",
]
provides-extras = ["jax", "numba"]

# substrait 0.30.0 declares Requires-Python <3.15 on a pure-Python py3-none-any wheel (spurious cap): corrected static metadata drops it so the typed Plan IR resolves on the >=3.15 floor with its protobuf runtime deps intact.
[[tool.uv.dependency-metadata]]
name = "substrait"
version = "0.30.0"
requires-python = ">=3.10"
requires-dist = [
    "protobuf<7,>=5",
    "substrait-protobuf==0.99.0",
    "substrait-antlr==0.99.0; extra == 'extensions'",
    "pyyaml; extra == 'extensions'",
    "sqloxide; extra == 'sql'",
    "deepdiff; extra == 'sql'",
]
provides-extras = ["extensions", "sql"]

# --- [TY] -------------------------------------------------------------------------------

[tool.ty.environment]
python-platform = "all"
python-version = "3.15"
root = [".", "libs/python/contracts/src"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.src]
exclude = [
    ".archive",
    ".artifacts",
    ".cache",
    ".claude/worktrees",
    ".history",
    ".nx",
    ".scratch",
    ".tmp",
    ".venv",
    "_archive",
    "_tmp",
    "coverage",
    "dist",
    "node_modules",
    "scratch",
    "test-results",
    "tmp",
]

[tool.ty.rules]
all = "error"

# The generated tree stays typechecked; the two ignores are `protoc-gen-connectrpc` emission shapes (`path` overridden without `@override`, `codecs: Iterable[Codec]` unparameterized), carved path-scoped, never a tree exclude.
[[tool.ty.overrides]]
include = ["libs/python/contracts/src/**"]

[tool.ty.overrides.rules]
missing-override-decorator = "ignore"
missing-type-argument = "ignore"

[tool.ty.terminal]
error-on-warning = true

# --- [MYPY] -----------------------------------------------------------------------------

# `ty` is the binding type gate; mypy is advisory for `tools/assay`, `tests`, and the generated contracts tree.
# Mypy-only divergences stay in overrides because `ty` rejects inline type-ignore comments.
[tool.mypy]
files = ["libs/python/contracts/src", "tools/assay", "tests"]
mypy_path = ["libs/python/contracts/src"] # the generated source root carries no py.typed under buf's clean sweep, so mypy reads it as a search root
python_version = "3.15"
cache_dir = ".cache/mypy"
strict = true
pretty = true
warn_unreachable = true
explicit_package_bases = true
warn_unused_configs = true
disallow_any_explicit = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
disable_error_code = ["prop-decorator"] # mypy cannot model pydantic computed_field over @property; ty checks the same surface without the gap
exclude = [
    "(^|/)(\\.archive|_archive|scratch|\\.scratch|_tmp|\\.tmp|\\.cache|\\.history)/",
    "^\\.artifacts/",
    "^\\.claude/worktrees/",
    "^\\.git/",
    "^\\.nx/",
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^coverage/",
    "^test-results/",
    "^node_modules/",
    "^tmp/",
]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# `tests/**` stays `ty`-clean; these relaxations isolate strict-mypy lag around TypeForm, sentinel, Callable, match, and ctor narrowing.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false
disallow_any_unimported = false
warn_unreachable = false
disable_error_code = ["func-returns-value", "attr-defined", "type-arg", "override", "arg-type"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "fsspec", "fsspec.*", "jsonschema", "jsonschema.*", "s3fs"] # backend and validator imports lack py.typed coverage
ignore_missing_imports = true

# The mypy twin of the ty override: the same two `protoc-gen-connectrpc` emission shapes, carved module-scoped on the generated tree alone.
[[tool.mypy.overrides]]
module = "rasm.contracts.*"
disable_error_code = ["explicit-override", "type-arg"]

# --- [PYTEST] ---------------------------------------------------------------------------

# `pytest-benchmark` and `pytest-xdist` stay in separate sessions under `filterwarnings = ["error"]`.
# Do not add `-n` to default `addopts`; parallel runs must unload benchmark config explicitly.
[tool.pytest]
minversion = "9.0"
strict = true
cache_dir = ".cache/pytest"
testpaths = ["tests"]
pythonpath = [".", "libs/python/contracts/src"] # the generated `rasm.contracts` source root: pytest prepends it, ty/mypy read it through their own root rows; no dist, no `.pth`
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
collect_imported_tests = false
empty_parameter_set_mark = "fail_at_collect"
addopts = [
    "-p",
    "tests.python._testkit.runtime",                           # testkit runtime plugin: profiles register at import; OTel wiring and marker auto-application ride session fixtures and collection hooks
    "-x",
    "--tb=short",
    "--import-mode=importlib",
    "-m",
    "not benchmark",
    "--disable-socket",
    "--allow-unix-socket",
    "--benchmark-storage=file://.artifacts/python/benchmarks", # benchmark artifacts route through the Assay catalog URI
    "--benchmark-autosave",                                    # feeds the sustained-regression series; writes only when benchmarks ran
    "--hypothesis-profile=rasm",
]
filterwarnings = [
    "error",
    "ignore:Not saving anything:pytest_benchmark.logger.PytestBenchmarkWarning", # autosave no-op in sessions whose benchmarks are deselected
]
timeout = "30" # pytest-timeout registers this option as a string; pytest 9 TOML mode rejects a native int
required_plugins = [
    "anyio",
    "hypothesis",
    "inline-snapshot",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-timeout",
    "pytest-xdist",
]
markers = [
    "benchmark: benchmark measurement tests",
    "mutation: mutation-testing acceptance and survivor-triage tests",
    "network: tests that need real INET sockets lifted (loopback servers or egress); excluded from mutation lanes",
    "property: property-based tests",
    "subprocess: tests that spawn the real CLI in a child interpreter; excluded from mutation lanes (children run the unmutated tree)",
]

# --- [INLINE_SNAPSHOT] ------------------------------------------------------------------

[tool.inline-snapshot]
default-flags = ["short-report"]       # reports mismatches without mutating snapshots
storage-dir = ".cache/inline-snapshot"

# --- [COVERAGE] -------------------------------------------------------------------------

[tool.coverage.run]
branch = true
relative_files = true # subprocess coverage combines through relative repo paths
source = ["tools/assay"]
data_file = ".cache/coverage/.coverage"
core = "sysmon" # CPython 3.15 beta lacks coverage's compiled C tracer
patch = [
    "subprocess",
] # children auto-measure via COVERAGE_PROCESS_CONFIG + shipped pth; forces parallel data files, so reporting requires a combine step

[tool.coverage.report]
fail_under = 90  # sysmon captures fewer arcs than the unavailable C core; 90 keeps the floor real instead of binding on precision-0 rounding
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "assert_never\\(", "\\.\\.\\.$", "if __name__ == .__main__.:"]

[tool.coverage.json]
output = ".artifacts/python/coverage/coverage.json"
pretty_print = true

[tool.coverage.html]
directory = ".artifacts/python/coverage/html"

[tool.coverage.xml]
output = ".artifacts/python/coverage/coverage.xml"

[tool.coverage.lcov]
output = ".artifacts/python/coverage/coverage.lcov"

# --- [MUTMUT] ---------------------------------------------------------------------------

[tool.mutmut]
source_paths = ["tools/assay"] # Mutation runs through the Assay-staged workdir; retired `.cache/mut-venv` and requirements fallbacks stay retired.
pytest_add_cli_args_test_selection = [
    "tests/python/tools/assay",
] # `type_check_command` stays unset: the prefilter aborts on any pre-existing checker diagnostic; tests are the kill mechanism.
pytest_add_cli_args = [
    "--hypothesis-profile=rasm-mutation",
    "-o",
    "required_plugins=",                                # mutmut disables pytest-randomly, so this invocation waives the required-plugins guard
    "-m",
    "not benchmark and not network and not subprocess", # subprocess tests execute the unmutated CLI outside mutmut's copied tree
]
do_not_mutate = ["tools/assay/__init__.py", "tools/assay/rails/mutation_gate.py"]
mutate_only_covered_lines = true # mutation run supplies absolute-keyed coverage data for mutmut's covered-line map
max_stack_depth = -1 # disables mutmut's strict stack walk over importlib pseudo-filenames
# Per-mutant wall/CPU cap = (estimated suite time + timeout_constant) * timeout_multiplier, replacing the lax 15x default.
# Concurrency has no config key: --max-children is CLI-only (assay-governed); a bare run defaults to cpu_count.
timeout_multiplier = 4.0
timeout_constant = 5.0

# --- [IMPORT_LINTER] --------------------------------------------------------------------

# Canonical invocation: `lint-imports --cache-dir .cache/grimp` — import-linter has no config-file cache option, and the default litters the repo root.
[tool.importlinter]
root_packages = ["tools.assay"]
exclude_type_checking_imports = true # TYPE_CHECKING-only edges (e.g. store's AssaySettings annotation) are not runtime layer violations.

[[tool.importlinter.contracts]]
name = "assay strata: model -> diagnostics -> store -> settings/aspect -> _logging -> catalog -> routing -> govern -> remote -> exec -> oracle -> rails -> registry -> automation -> __main__"
type = "layers"
containers = ["tools.assay"]
layers = [
    "__main__",
    "automation",
    "composition.registry",
    "rails",
    "oracle",
    "core.exec",
    "core.remote",
    "core.govern",
    "core.routing",
    "composition.catalog",
    "_logging",
    "composition.settings | core.aspect",
    "composition.store",
    "diagnostics",
    "core.model",
]

[[tool.importlinter.contracts]]
name = "rails are peer-independent"
type = "independence"
modules = [
    "tools.assay.rails.api",
    "tools.assay.rails.bridge",
    "tools.assay.rails.code",
    "tools.assay.rails.contracts",
    "tools.assay.rails.docs",
    "tools.assay.rails.health",
    "tools.assay.rails.mutation_gate",
    "tools.assay.rails.package",
    "tools.assay.rails.provision",
    "tools.assay.rails.static",
    "tools.assay.rails.test",
]
# Named debt: package rides bridge's apphost lease/client seam until a neutral client owner exists.
ignore_imports = ["tools.assay.rails.package -> tools.assay.rails.bridge"]

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
cache-dir = ".cache/ruff"
preview = true
line-length = 150
required-version = ">=0.16.2"
target-version = "py315"
extend-exclude = [
    "**/.archive/**",
    "**/.artifacts/**",
    "**/.cache/**",
    "**/.claude/worktrees/**",
    "**/.history/**",
    "**/.scratch/**",
    "**/.tmp/**",
    "**/_archive/**",
    "**/_tmp/**",
    "**/coverage/**",
    "**/scratch/**",
    "**/test-results/**",
    "libs/python/contracts/src/**",
]

[tool.ruff.format]
exclude = ["*.md"]               # Markdown fences: the linter skips *.md natively; fence layout is design-doc law, so the formatter skips them too.
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- [FORMATTER]
    "missing-trailing-comma",                    # ruff format owns trailing commas
    "single-line-implicit-string-concatenation", # ruff format owns implicit string concatenation
    # --- [MATCH_DISPATCH]
    "unnecessary-assign",                        # named intermediates keep flow pipelines readable
    "superfluous-else-return",                   # explicit match dispatch keeps exhaustive arms visible
    "superfluous-else-raise",                    # explicit error branches keep ROP rails visible
    "if-else-block-instead-of-if-exp",           # match/case owns dispatch, not ternaries
    "if-with-same-arms",                         # match/case owns dispatch, not merged if arms
    # --- [DENSITY]
    "too-many-return-statements",                # a total match over a closed tagged union returns per arm; a return cap pressures the doctrine's own dispatch form
    "too-many-branches",                         # one dispatch surface owns every branch; a branch cap pressures arm extraction
    "too-many-locals",                           # dense dispatch surfaces own their locals; a variable cap pressures fragmentation
    "too-many-statements",                       # one surface owns every arm; a statement cap never justifies splitting a closed union
    "too-many-boolean-expressions",              # dense dispatch predicates stay on the owning surface; a boolean-expression cap pressures fragmentation
    # --- [ERROR_RAILS]
    "raw-string-in-exception",                   # frozen errors carry inline messages
    "f-string-in-exception",                     # error constructors carry formatted context
    "raise-vanilla-args",                        # domain errors carry descriptive messages
    "raise-within-try",                          # `@safe` ROP boundaries may raise inside the guarded call
    "error-instead-of-exception",                # structlog `.error()` is valid outside exception handlers
    # --- [TYPE_RESOLUTION]
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    # --- [DOCSTRINGS]
    "docstring-extraneous-exception",            # Raises sections may document propagated helper exceptions; DOC501 still requires direct raises
    # --- [SEMANTIC_ORDER]
    "unsorted-dunder-all",                       # semantic public-surface order beats alphabetical `__all__`
    "unsorted-dunder-slots",                     # semantic slot order beats alphabetical `__slots__`
    # --- [WORKFLOW]
    "missing-todo-link",                         # TODO links are not required for local maintenance notes
    "line-contains-todo",                        # TODO comments are accepted source markers
    "implicit-namespace-package",                # monorepo packages may be implicit namespaces
    "missing-copyright-notice",                  # top-level LICENSE owns copyright notice
    # --- [SECTION_DIVIDERS]
    "commented-out-code",                        # compact `# --- [LABEL]` subsection dividers are source structure
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"**/.claude/**" = [
    "banned-api",
    "boolean-type-hint-positional-argument",
    "complex-structure",
    "hardcoded-password-string",
    "line-too-long",
    "literal-membership",
    "os-getcwd",
    "shebang-not-executable",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/**" = [
    "assert",
    "pytest-composite-assertion",
    "magic-value-comparison",
    "too-many-arguments",
    "unused-function-argument",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "private-member-access",
    "import-private-name",
] # PLC2701: specs import the private-by-design _testkit package
"**/conftest.py" = ["module-import-not-at-top-of-file"]
"tests/python/_testkit/runtime.py" = ["module-import-not-at-top-of-file"] # Hypothesis environment gates must precede imports

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "beartype.BeartypeConf",
    "msgspec.Meta",
    "msgspec.field",
    "pydantic.ConfigDict",
    "pydantic.Field",
    "pydantic.PrivateAttr",
    "stamina.retry",
]

[tool.ruff.lint.flake8-builtins]
ignorelist = [
    "format",
    "hash",
    "id",
    "input",
    "list",
    "quit",
    "type",
] # CLI verb vocabulary: a rail handler's own name is the verb the registry dispatches on

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
