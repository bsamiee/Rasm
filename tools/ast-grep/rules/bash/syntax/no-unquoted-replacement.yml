# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unquoted-replacement
language: bash
severity: error
rule:
    kind: simple_expansion, expansion, command_substitution
    pattern: $VALUE
    matches: bash-string-expansion
    any:
        - follows: {regex: '^/$'}
          inside: {kind: expansion}
        - inside:
            kind: concatenation
            follows: {regex: '^/$'}
            inside: {kind: expansion}
labels: {VALUE: {style: primary}}
fix: '"$VALUE"'
message: 'Replacement `$VALUE` expands unquoted, `&` in its value inserts the matched text under `patsub_replacement`'
note: Quote the replacement, `${<name>//<pattern>/"$<replacement>"}`
