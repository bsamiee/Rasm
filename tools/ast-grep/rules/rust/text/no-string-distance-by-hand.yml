# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-string-distance-by-hand
language: rust
severity: error
utils:
    min-call:
        kind: call_expression
        any:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^min$'}}
            - has: {field: function, regex: '^((::)?(std|core)::)?(cmp::)?min$'}
    inner-min:
        any:
            - matches: min-call
            - kind: parenthesized_expression
              has: {matches: inner-min}
    three-way:
        any:
            - matches: min-call
              any:
                - has: {field: function, kind: field_expression, has: {field: value, matches: inner-min}}
                - has: {field: arguments, has: {matches: inner-min}}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^min$'}}
                - has: {field: arguments, not: {has: {pattern: $_}}}
                - has:
                    field: function
                    has:
                        field: value
                        kind: call_expression
                        has:
                            field: function
                            kind: field_expression
                            all:
                                - has: {field: field, regex: '^(iter|into_iter)$'}
                                - has: {field: value, kind: array_expression, has: {nthChild: 3}}
    unit-cost:
        any:
            - kind: call_expression
              all:
                - has: {field: function, regex: '^(u8|u16|u32|u64|usize|i8|i16|i32|i64|isize)::from$'}
                - has: {field: arguments, has: {nthChild: 1, kind: binary_expression, has: {field: operator, regex: '^!=$'}}}
            - kind: type_cast_expression
              has: {field: value, kind: parenthesized_expression, has: {kind: binary_expression, has: {field: operator, regex: '^!=$'}}}
            - kind: if_expression
              all:
                - has: {field: condition, kind: binary_expression, has: {field: operator, regex: '^(==|!=)$'}}
                - has: {field: consequence, regex: '^\{\s*[01]\s*\}$'}
                - has: {field: alternative, has: {kind: block, regex: '^\{\s*[01]\s*\}$'}}
    edit-recurrence:
        all:
            - matches: three-way
            - not: {inside: {kind: field_expression, has: {field: field, regex: '^min$'}}}
            - not: {inside: {kind: arguments, inside: {matches: min-call}}}
            - inside: {kind: function_item, stopBy: {kind: function_item}, has: {stopBy: {kind: function_item}, matches: unit-cost}}
    chars:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(chars|bytes|iter)$'}}
            - has: {field: arguments, not: {has: {pattern: $_}}}
    zipped-chars:
        kind: call_expression
        any:
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^zip$'}}, {has: {field: value, matches: chars}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: chars}}
            - all:
                - has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?zip$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: chars}}, {has: {nthChild: 2, matches: chars}}]}
    side:
        any:
            - kind: identifier
            - kind: unary_expression
              regex: '^\*'
              has: {kind: identifier}
            - kind: field_expression
              has: {field: field, regex: '^[01]$'}
    differs:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^!=$'}
                - has: {field: left, matches: side}
                - has: {field: right, matches: side}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^ne$'}}, {has: {field: value, matches: side}}]}
                - has: {field: arguments, has: {nthChild: 1, any: [{matches: side}, {kind: reference_expression, has: {field: value, matches: side}}]}}
            - kind: parenthesized_expression
              has: {matches: differs}
    pair-step:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: value, matches: zipped-chars}}
            - any:
                - all:
                    - has: {field: function, has: {field: field, regex: '^filter$'}}
                    - has: {field: arguments, has: {nthChild: 1, kind: closure_expression, has: {field: body, matches: differs}}}
                - all:
                    - has: {field: function, has: {field: field, regex: '^map$'}}
                    - has:
                        field: arguments
                        has:
                            nthChild: 1
                            kind: closure_expression
                            has:
                                field: body
                                any:
                                    - kind: call_expression
                                      all:
                                        - has: {field: function, regex: '^(u8|u16|u32|u64|usize)::from$'}
                                        - has: {field: arguments, has: {nthChild: 1, matches: differs}}
                                    - kind: type_cast_expression
                                      all: [{has: {field: value, matches: differs}}, {has: {field: type, regex: '^(u8|u16|u32|u64|usize)$'}}]
    tally:
        kind: field_expression
        all: [{has: {field: field, regex: '^(count|sum)$'}}, {has: {field: value, matches: pair-step}}]
    differing-count:
        all:
            - has: {field: function, any: [{matches: tally}, {kind: generic_function, has: {field: function, matches: tally}}]}
            - has: {field: arguments, not: {has: {pattern: $_}}}
rule:
    kind: call_expression
    pattern: $CHAIN
    any:
        - matches: edit-recurrence
        - matches: differing-count
message: '`$CHAIN` computes a string distance by hand'
note: 'Call `strsim::levenshtein(<a>, <b>)` or `strsim::generic_levenshtein(&<a>, &<b>)` for edits, `strsim::osa_distance` or `damerau_levenshtein` when a transposition joins the minimum, and `strsim::hamming(<a>, <b>)` for differing positions'
