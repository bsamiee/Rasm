# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-tuple-patch-mapping
language: csharplang
severity: error
utils:
    original-value:
        kind: parameter
        matches: {csharp-attributed: {name: {regex: '^MappingTargetOriginalValue(Attribute)?$'}}}
rule:
    kind: method_declaration
    all:
        - has: {field: name, pattern: $NAME}
        - any:
            - all:
                - has: {kind: modifier, regex: '^partial$'}
                - has: {field: parameters, has: {kind: parameter, nthChild: 1, has: {field: type, kind: tuple_type}}}
                - inside: {kind: declaration_list, inside: {matches: mapperly-mapper-class}}
            - has: {field: parameters, has: {matches: original-value}}
message: '`$NAME` patches a host object through Mapperly from a tuple or an original value'
note: 'Write the edit as `Seq<Func<<host>, IO<Unit>>>` closures folded in order, each `h => IO.lift(() => h.<member> = <value>)`'
