# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nullable-return
language: tsx
severity: error
ignores: ['**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
utils:
    no-value-type:
        any:
            - {kind: predefined_type, regex: '^void$'}
            - {kind: literal_type, has: {kind: undefined}}
    value-annotation:
        kind: type_annotation
        not:
            has:
                any:
                    - matches: no-value-type
                    - kind: generic_type
                      all:
                        - has: {field: name, regex: '^Promise$'}
                        - has:
                            field: type_arguments
                            has: {matches: no-value-type}
    value-function:
        matches: syntax-function-boundary
        has: {field: return_type, matches: value-annotation}
        not:
            kind: generator_function, generator_function_declaration, method_definition
            all:
                - has: {regex: '^\*$'}
                - has:
                    field: return_type
                    has:
                        kind: generic_type
                        all:
                            - has: {field: name, regex: '^(Async)?Generator$'}
                            - has:
                                field: type_arguments
                                has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, matches: no-value-type}
    undefined-value:
        any:
            - kind: undefined
            - kind: unary_expression
              has: {field: operator, regex: '^void$'}
    null-result:
        any:
            - kind: 'null'
            - kind: parenthesized_expression
              has: {matches: null-result}
            - kind: ternary_expression
              any: [{has: {field: consequence, matches: null-result}}, {has: {field: alternative, matches: null-result}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^(\?\?|\|\||&&)$'}}, {has: {field: right, matches: null-result}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^&&$'}}, {has: {field: left, matches: null-result}}]
    undefined-result:
        any:
            - matches: undefined-value
            - kind: parenthesized_expression
              has: {matches: undefined-result}
            - kind: ternary_expression
              any: [{has: {field: consequence, matches: undefined-result}}, {has: {field: alternative, matches: undefined-result}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^(\?\?|\|\||&&)$'}}, {has: {field: right, matches: undefined-result}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^&&$'}}, {has: {field: left, matches: undefined-result}}]
rule:
    any:
        - kind: return_statement
          has: {matches: null-result}
        - kind: arrow_function
          has: {field: body, matches: null-result}
        - kind: return_statement
          has: {matches: undefined-result}
          inside: {matches: value-function, stopBy: {matches: syntax-function-boundary}}
        - kind: arrow_function
          all:
            - has: {field: body, matches: undefined-result}
            - has: {field: return_type, matches: value-annotation}
message: 'Function returns `null` or `undefined` for absence'
note: 'Return `Option`, `Option.none()` inside and `Option.fromNullable(value)` at the boundary'
