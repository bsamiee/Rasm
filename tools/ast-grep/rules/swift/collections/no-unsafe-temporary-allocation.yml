# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unsafe-temporary-allocation
language: swiftlang
severity: error
rule:
    kind: call_expression
    has:
        nthChild: 1
        any:
            - {kind: simple_identifier, regex: '^withUnsafeTemporaryAllocation$'}
            - {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^withUnsafeTemporaryAllocation$'}}}
message: '`withUnsafeTemporaryAllocation` hands its closure an unsafe pointer to the temporary buffer'
note: 'Call `withTemporaryAllocation(of:capacity:)` for an `OutputSpan<T>` or `withTemporaryAllocation(byteCount:alignment:)` for an `OutputRawSpan`'
