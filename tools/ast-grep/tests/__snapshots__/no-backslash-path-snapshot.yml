id: no-backslash-path
snapshots:
  ? |
    <Compile Include="Generated\**\*.cs" />
  : fixed: |
      <Compile Include="Generated/**/*.cs" />
    labels:
    - source: '"Generated\**\*.cs"'
      style: primary
      start: 17
      end: 36
  ? |
    <Compile Include="a\b\c.cs" />
  : fixed: |
      <Compile Include="a/b/c.cs" />
    labels:
    - source: '"a\b\c.cs"'
      style: primary
      start: 17
      end: 27
  ? |
    <Import Project="$(MSBuildThisFileDirectory)..\..\build\common.props" />
  : fixed: |
      <Import Project="$(MSBuildThisFileDirectory)../../build/common.props" />
    labels:
    - source: '"$(MSBuildThisFileDirectory)..\..\build\common.props"'
      style: primary
      start: 16
      end: 69
  ? |
    <Project Path="libs\dotnet\interop\Rasm.Interop\Rasm.Interop.csproj" />
  : fixed: |
      <Project Path="libs/dotnet/interop/Rasm.Interop/Rasm.Interop.csproj" />
    labels:
    - source: '"libs\dotnet\interop\Rasm.Interop\Rasm.Interop.csproj"'
      style: primary
      start: 14
      end: 68
  ? |
    <PropertyGroup><ToolPath>$(MSBuildThisFileDirectory)tools\mytool\mytool.exe</ToolPath></PropertyGroup>
  : fixed: |
      <PropertyGroup><ToolPath>$(MSBuildThisFileDirectory)tools/mytool/mytool.exe</ToolPath></PropertyGroup>
    labels:
    - source: $(MSBuildThisFileDirectory)tools\mytool\mytool.exe
      style: primary
      start: 25
      end: 75
  ? |
    <Reference Include="Tool"><HintPath>..\packages\tool\lib\tool.dll</HintPath><Private>false</Private></Reference>
  : fixed: |
      <Reference Include="Tool"><HintPath>../packages/tool/lib/tool.dll</HintPath><Private>false</Private></Reference>
    labels:
    - source: ..\packages\tool\lib\tool.dll
      style: primary
      start: 36
      end: 65
