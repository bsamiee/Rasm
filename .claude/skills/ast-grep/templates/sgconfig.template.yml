# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/project.json
ruleDirs:
    - rules
    - rewrites
utilDirs:
    - utils
testConfigs:
    - testDir: rule-tests
languageGlobs:
    <language>: ["<glob>"]
customLanguages:
    <name>:
        libraryPath: <parser-dylib>
        extensions: ["<ext>"]
        expandoChar: <char>
        metaVarChar: <char>
        languageSymbol: <dylib-symbol>
        outlineRules: <outline-rules>.yml
languageInjections:
    - hostLanguage: <host-language>
      rule:
        kind: <content-kind>
        pattern: $CONTENT
        inside: {matches: <owner-util>}
      utils:
        <owner-util>: {kind: <owner-kind>}
      injected: <embedded-language>
