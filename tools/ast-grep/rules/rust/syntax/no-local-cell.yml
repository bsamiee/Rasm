# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-local-cell
language: rust
severity: error
utils:
    explicit-cell:
        regex: '^((::)?(std|core)::)?cell::(Ref)?Cell$'
    imported-cell:
        any:
            - regex: '^Cell$'
              inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: use_declaration, regex: '\bcell::(\{(\s*|[^}]*[,\s]))?Cell\b'}}
            - regex: '^RefCell$'
              inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: use_declaration, regex: '\bcell::(\{(\s*|[^}]*[,\s]))?RefCell\b'}}
    cell-name:
        any: [{matches: explicit-cell}, {matches: imported-cell}]
    cell-type:
        any:
            - {kind: 'type_identifier, scoped_type_identifier', matches: cell-name}
            - {kind: generic_type, has: {field: type, matches: cell-name}}
    cell-constructor:
        kind: scoped_identifier
        all:
            - has: {field: name, regex: '^(new|default|from)$'}
            - has:
                field: path
                any:
                    - {kind: 'identifier, scoped_identifier', matches: cell-name}
                    - {kind: generic_type, has: {field: type, matches: cell-name}}
    shared-use:
        any:
            - kind: identifier
              pattern: $NAME
              not:
                any:
                    - inside: {kind: let_declaration, field: pattern}
                    - inside: {kind: field_expression, field: value, inside: {kind: call_expression, field: function}}
            - kind: 'closure_expression, async_block'
              has: {stopBy: end, kind: identifier, pattern: $NAME}
    mutable-use:
        any:
            - inside: {stopBy: {not: {kind: parenthesized_expression}}, kind: 'assignment_expression, compound_assignment_expr', field: left}
            - inside: {stopBy: {not: {kind: parenthesized_expression}}, kind: reference_expression, regex: '^&\s*mut\b'}
            - inside: {kind: match_expression, field: value, has: {field: body, regex: '\bref\s+mut\b'}}
            - inside: {kind: let_condition, field: value, has: {field: pattern, regex: '\bref\s+mut\b'}}
            - inside: {kind: parenthesized_expression, inside: {kind: field_expression, field: value}}
            - inside: {kind: parenthesized_expression, inside: {kind: call_expression, field: function}}
            - inside: {kind: parenthesized_expression, nthChild: 1, inside: {kind: index_expression}}
rule:
    any:
        - kind: let_declaration
          pattern: $SITE
          all:
            - has: {field: pattern, kind: identifier, pattern: $NAME}
            - any:
                - has: {field: type, matches: cell-type}
                - has: {field: value, kind: call_expression, has: {field: function, matches: cell-constructor}}
            - not: {inside: {kind: block, has: {stopBy: end, matches: shared-use}}}
        - kind: unary_expression
          pattern: $SITE
          all:
            - pattern: '*$C.borrow_mut()'
            - not: {matches: mutable-use}
message: '`$SITE` holds an unshared local in a cell or reads a cell through `borrow_mut`'
note: 'Bind the value with `let mut <name>` in the scope that owns it and read a cell through `*<cell>.borrow()`, a cell moves the borrow check to run time and the local-cell form takes no template'
