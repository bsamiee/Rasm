# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-graph-successor
language: csharp
arguments: [node]
utils:
    relation:
        regex: '(?i)(parents|predecessors|successors|dependencies|dependents|deps|importers|imports|callers|callees|references|referrers|neighbors|neighbours|supertypes|superclasses|supertraits|bases|edges|incoming|outgoing)$'
    lookup:
        kind: element_access_expression
        has: {field: subscript, has: {kind: argument, has: {matches: node}}}
    read:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, matches: relation}
                - has: {field: expression, any: [{matches: node}, {matches: lookup}]}
            - kind: invocation_expression
              all:
                - has: {field: function, any: [{kind: identifier, matches: relation}, {has: {field: name, any: [{matches: relation}, {kind: generic_name, has: {kind: identifier, matches: relation}}]}}]}
                - any:
                    - has: {field: arguments, has: {kind: argument, has: {matches: node}}}
                    - has: {field: function, kind: member_access_expression, has: {field: expression, matches: node}}
    chain:
        any:
            - matches: read
            - {kind: invocation_expression, has: {field: function, kind: member_access_expression, has: {field: expression, matches: chain}}}
            - {kind: member_access_expression, has: {field: expression, matches: chain}}
            - {kind: parenthesized_expression, has: {matches: chain}}
rule:
    kind: member_access_expression, invocation_expression, parenthesized_expression
    matches: chain
