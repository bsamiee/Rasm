id: require-catch-on-process-run
valid:
    # The correction, the catch on the run's own promise
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { env }).catch(abort);
          return next(e);
      });
    # Catch after a then on the run's promise
    - |
      on('tool.call', async ($, e, next) => {
          const lines = await $.process.run(argv, { env }).then(scanHits).catch(() => []);
          return next(e);
      });
    # Catch on the Promise.all around the run
    - |
      on('skill.prompt', async ($, e, next) => {
          const [version, grammar] = await Promise.all([$.process.run(['ast-grep', '--version'], { env }), $.fs.exists(path)]).catch(abortAll);
          return next(e);
      });
    # Run inside a closure of the hook, the catch on the run
    - |
      on('tool.call', async ($, e, next) => {
          const runs = await Promise.all(rows.map((row) => $.process.run(row.argv(path), { env }).catch(abort)));
          return next(e);
      });
    # Try with a handler around the run
    - |
      on('tool.call', async ($, e, next) => {
          try {
              const run = await $.process.run(argv, { env });
          } catch (error) {
              $.ui.log('run failed');
          }
          return next(e);
      });
    # Run in the session.start hook, the session's own facts, a child that cannot start is a defect and the hook throws
    - |
      on('session.start', async ($, e, next) => {
          const home = await $.process.run(['printenv', 'HOME'], { env });
          return next(e);
      });
    # The environment's own source in session.start
    - |
      on('session.start', async ($, e, next) => {
          const answered = await $.process.run(['mise', 'env', '--json']);
          return next(e);
      });
    # Catch on another engine call, no run in the hook
    - |
      on('tool.call', async ($, e, next) => {
          const present = await $.fs.exists(path).catch(() => false);
          return next(e);
      });
    # Two-argument then on the run's promise, the second argument is the rejection handler
    - |
      on('tool.call', async ($, e, next) => {
          const lines = await $.process.run(argv, { env }).then(scanHits, () => []);
          return next(e);
      });
    # Promise.allSettled around the run, a settled list never rejects
    - |
      on('skill.prompt', async ($, e, next) => {
          const settled = await Promise.allSettled([$.process.run(argv, { env }), $.fs.exists(path)]);
          return next(e);
      });
    # Two-argument then on the Promise.all around the run, the run sits under its object
    - |
      on('skill.prompt', async ($, e, next) => {
          const facts = await Promise.all([$.process.run(argv, { env }), $.fs.exists(path)]).then(settle, abortAll);
          return next(e);
      });
    # Run inside the fulfilled handler of a then, the catch after the then covers it
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.fs.exists(path).then(() => $.process.run(argv, { env })).catch(abort);
          return next(e);
      });
    # Run in a turn.complete hook, no result the model reads
    - |
      on('turn.complete', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run in an agent.offer hook, the offer holds no run line the model reads
    - |
      on('agent.offer', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Hook bound to a name with the catch on the run
    - |
      const hook = async ($, e, next) => {
          const run = await $.process.run(argv, { env }).catch(abort);
          return next(e);
      };
      on('tool.call', hook);
invalid:
    # The instance, the run awaited with no catch in tool.call
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run inside a Promise.all with no catch in skill.prompt
    - |
      on('skill.prompt', async ($, e, next) => {
          const [version, grammar] = await Promise.all([$.process.run(['ast-grep', '--version'], { env }), $.fs.exists(path)]);
          return next(e);
      });
    # Run inside a closure of the hook with no catch
    - |
      on('tool.call', async ($, e, next) => {
          const runs = await Promise.all(rows.map((row) => $.process.run(row.argv(path), { env })));
          return next(e);
      });
    # Then on the run's promise with no catch
    - |
      on('tool.call', async ($, e, next) => {
          const lines = await $.process.run(argv, { env }).then(scanHits);
          return next(e);
      });
    # Run inside the catch handler of another call, its own promise uncaught
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.fs.readFile(path).catch(() => $.process.run(argv, { env }));
          return next(e);
      });
    # Try with a finally alone around the run
    - |
      on('tool.call', async ($, e, next) => {
          try {
              const run = await $.process.run(argv, { env });
          } finally {
              $.ui.log('ran');
          }
          return next(e);
      });
    # Run under a matched tool.call hook
    - |
      on('tool.call', { tool: 'Edit' }, async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run in the prompt.context hook, the block the model reads
    - |
      on('prompt.context', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run in the prompt.submit hook, the rewritten text reaches the model
    - |
      on('prompt.submit', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Two-argument then on another promise, the run sits in its fulfilled arm
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.fs.exists(path).then(() => $.process.run(argv, { env }), () => undefined);
          return next(e);
      });
    # Run discarded through void with no catch
    - |
      on('tool.call', async ($, e, next) => {
          void $.process.run(argv, { env });
          return next(e);
      });
    # Run inside the catch handler of a try, its own promise uncaught
    - |
      on('tool.call', async ($, e, next) => {
          try {
              await load(path);
          } catch (error) {
              await $.process.run(argv, { env });
          }
          return next(e);
      });
    # Run under Promise.race with no catch
    - |
      on('tool.call', async ($, e, next) => {
          const first = await Promise.race([$.process.run(argv, { env }), timeout]);
          return next(e);
      });
    # Run in a hook registered through a parameter typed On
    - |
      const arm = (register: On): void => {
          register('tool.call', async ($, e, next) => {
              const run = await $.process.run(argv, { env });
              return next(e);
          });
      };
    # Hook bound to a name before the registration
    - |
      const hook = async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      };
      on('tool.call', hook);
    # Finally alone on the run's promise
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { env }).finally(cleanup);
          return next(e);
      });
    # Run in the tool.describe hook
    - |
      on('tool.describe', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run in the agent.spawn hook
    - |
      on('agent.spawn', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run in the prompt.section hook
    - |
      on('prompt.section', async ($, e, next) => {
          const run = await $.process.run(argv, { env });
          return next(e);
      });
    # Run under Promise.any with no catch
    - |
      on('tool.call', async ($, e, next) => {
          const first = await Promise.any([$.process.run(argv, { env }), other]);
          return next(e);
      });
