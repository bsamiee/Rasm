# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-enumerate-filter-index
language: rust
severity: error
utils:
    index-read:
        any:
            - pattern: $IDX
            - has: {stopBy: end, kind: identifier, pattern: $IDX}
    index-free-test:
        not:
            has:
                stopBy: end
                any:
                    - kind: field_expression
                      all: [{has: {field: field, regex: '^then(_some)?$'}}, {has: {field: value, matches: index-read}}]
                    - kind: if_expression
                      has: {field: condition, matches: index-read}
    index-free-filter:
        has: {field: function, has: {field: value, has: {field: arguments, has: {nthChild: 1, kind: closure_expression, regex: '^(move\s+)?\|\s*&?\(\s*_\s*,'}}}}
rule:
    kind: call_expression
    pattern: $CHAIN
    any:
        - all:
            - any:
                - pattern: $I.enumerate().filter($F).map(|($IDX, _)| $IDX)
                - pattern: $I.enumerate().filter($F).map(|$T| $T.0)
            - matches: index-free-filter
        - all:
            - any:
                - pattern: $I.enumerate().filter_map(|($IDX, $ITEM)| $TEST.then_some($IDX))
                - pattern: '$I.enumerate().filter_map(|($IDX, $ITEM)| $TEST.then(|| $IDX))'
                - pattern: $I.enumerate().flat_map(|($IDX, $ITEM)| $TEST.then_some($IDX))
                - pattern: '$I.enumerate().flat_map(|($IDX, $ITEM)| $TEST.then(|| $IDX))'
                - pattern: '$I.enumerate().filter_map(|($IDX, $ITEM)| if $TEST { Some($IDX) } else { None })'
            - matches: index-free-test
message: '`$CHAIN` enumerates `$I` to keep indexes of elements that pass a test'
note: 'Call `<iterator>.positions(<test>)` (`use itertools::Itertools as _;`) with the test taking each element by value'
