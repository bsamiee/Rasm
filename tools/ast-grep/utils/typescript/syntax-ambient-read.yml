# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Read of the host clock or random source through a global, a value the process supplies and no argument names, process.env is Biome noProcessEnv's
id: syntax-ambient-read
language: tsx
rule:
    any:
        # The current time as a Date, the constructor without an argument
        - kind: new_expression
          has: {field: constructor, regex: '^(globalThis\.)?Date$'}
          not: {has: {field: arguments, has: {pattern: $_}}}
        # The clock, the high-resolution clock, the uptime, and the random source, spelled direct or through globalThis
        - kind: call_expression
          has:
              field: function
              regex: "^(globalThis\\.)?(Date|Date\\.now|Temporal\\.Now\\.\\w+|Math\\.random|crypto\\.(randomUUID|randomUUIDv7|getRandomValues|\
                  randomBytes|randomInt|randomFill|randomFillSync)|performance\\.now|process\\.hrtime(\\.bigint)?|process\\.uptime|os\\.uptime)$"
