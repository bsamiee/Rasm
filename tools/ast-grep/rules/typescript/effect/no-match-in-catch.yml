# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-match-in-catch
language: tsx
severity: error
utils:
    error-handler:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            pattern: $HANDLER
            all:
                - has: {field: property, regex: '^(catch|catchEager|catchCause|catchIf|catchFilter|tapError|tapCause|mapError|mapErrorEager)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Layer)$'}}}}
    callback-parameter:
        kind: arrow_function, function_expression
        any:
            - has: {field: parameter, kind: identifier, pattern: $E}
            - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $E}}}
    selector:
        kind: member_expression
        any:
            - all: [{has: {field: property, regex: '^(value|valueTags)$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '\bMatch$'}}}}}]
            - all: [{has: {field: property, regex: '^isTagged$'}}, {has: {field: object, matches: {effect-module: {name: {regex: '\bPredicate$'}}}}}]
    selection:
        any:
            - kind: call_expression
              all:
                - has: {field: function, any: [{matches: selector}, {kind: call_expression, has: {field: function, matches: selector}}]}
                - has: {field: arguments, has: {nthChild: 1, any: [{kind: identifier, pattern: $E}, {pattern: $E._tag}]}}
            - kind: switch_statement
              has: {field: value, has: {pattern: $E._tag}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^[!=]==?$'}
                - has: {pattern: $E._tag}
            - kind: binary_expression
              all:
                - has: {field: left, kind: identifier, pattern: $E}
                - has: {field: operator, regex: '^instanceof$'}
rule:
    matches: error-handler
    has:
        field: arguments
        has:
            matches: callback-parameter
            nthChild: {position: 1, reverse: true}
            has: {stopBy: {matches: syntax-function-boundary}, matches: selection}
message: '`$HANDLER` selects the failure by hand inside its callback'
note: '`catchTag`, `catchTags`, `tapErrorTag`, or `catchIf` of the same module selects the failure by `_tag` or predicate before its callback runs'
