        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Request$'}, member: {regex: '^(complete|completeEffect|fail|failCause|succeed)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)RequestResolver$'}
                member:
                    regex: |-
                        (?x)^(around|asCache|batchN|grouped|persisted|race|setDelay|setDelayEffect|withCache|withSpan)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Result$'}
