# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-copy-task-into-output
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^(Copy|Move)$'}}}
        - has: {matches: msbuild-tag, has: {matches: {msbuild-attribute: {name: {regex: '^Destination(Folder|Files)$'}, value: {regex: '\$\((OutDir|OutputPath|TargetDir|BaseOutputPath|PublishDir)\)'}}}}}
message: Task writes a file into the project's build or publish output, where no referencing project receives it
note: Declare a `None` or `Content` item with `CopyToOutputDirectory` or `CopyToPublishDirectory`
