# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-throw-on-absence
language: tsx
severity: error
utils:
    absence-test:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^===?$'}
                - any:
                    - has: {kind: 'undefined, null'}
                    - all: [{has: {kind: unary_expression, has: {field: operator, regex: '^typeof$'}}}, {has: {kind: string, regex: '^.undefined.$'}}]
            - kind: unary_expression
              all:
                - has: {field: operator, regex: '^!$'}
                - has:
                    field: argument
                    any:
                        - kind: identifier, member_expression, subscript_expression
                        - kind: call_expression
                          all:
                            - has: {field: function, kind: member_expression, has: {field: property, regex: '^has$'}}
                            - has: {field: arguments, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\|\|$'}
                - has: {matches: absence-test}
            - kind: parenthesized_expression
              has: {matches: absence-test}
    throwing:
        any:
            - kind: throw_statement
            - kind: statement_block
              has: {kind: throw_statement}
              not: {has: {nthChild: 2}}
rule:
    kind: if_statement
    pattern: $IF
    all:
        - has: {field: condition, matches: absence-test}
        - has: {field: consequence, matches: throwing}
message: '`throw` stands in for the failure case of an absent value'
note: 'Return the reason as a value through `Effect.fromOption` or `Effect.fail` with a tagged variant, and state an absence construction rules out as a defect with `Option.getOrThrow`'
labels:
    IF: {style: primary}
