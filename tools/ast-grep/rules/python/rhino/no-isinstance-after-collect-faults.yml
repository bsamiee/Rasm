# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-isinstance-after-collect-faults
language: python
severity: error
utils:
    collected:
        kind: call
        all:
            - has: {field: function, regex: '^collect_faults$'}
            - has: {field: arguments, has: {kind: identifier, pattern: $X}}
rule:
    kind: boolean_operator
    pattern: $TEST
    all:
        - has: {field: operator, regex: '^or$'}
        - has:
            field: right
            kind: call
            all:
                - has: {field: function, regex: '^isinstance$'}
                - has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $X}}
                - has: {field: arguments, has: {nthChild: 2, regex: '^(Faults?|\(\s*Faults?\s*,\s*Faults?\s*\))$'}}
        - has:
            field: left
            any:
                - matches: collected
                - has: {stopBy: end, matches: collected}
message: '`$TEST` repeats the fault test `collect_faults` ran on `$X`'
note: 'Use one `match` over the independent results with a success case naming each value and `case failed: return Faults.of(*failed)`, a success pattern narrows each value'
