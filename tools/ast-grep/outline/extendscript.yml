        kind: object
        any:
            - inside: {kind: variable_declarator, field: value, inside: {kind: 'variable_declaration, lexical_declaration', matches: scope}}
            - inside: {kind: assignment_expression, field: right, inside: {kind: expression_statement, matches: scope}}
            - inside: {stopBy: {not: {kind: ternary_expression}}, kind: return_statement, matches: scope}
            - inside: {kind: pair, field: value, inside: {matches: held}}
    owned:
        matches: held
        any:
            - inside: {kind: pair, field: value, has: {field: key, pattern: $OWNER}}
            - inside: {kind: 'variable_declarator, assignment_expression', matches: bound}
            - kind: object
    modular:
        inside:
            stopBy: {kind: 'function_declaration, function_expression'}
            kind: function_expression
            inside: {stopBy: {not: {kind: 'parenthesized_expression, member_expression, call_expression, new_expression'}}, kind: 'variable_declarator, assignment_expression'}
    bound:
        matches: scope
        any:
            - all: [{matches: modular}, {any: [{has: {field: name, pattern: $OWNER}}, {has: {field: left, pattern: $OWNER}}]}]
            - pattern: $_
    carried:
        inside:
            stopBy: {kind: 'function_declaration, function_expression'}
            any:
                - {kind: function_declaration, matches: bound}
                - matches: invoked
                - {kind: function_expression, inside: {stopBy: {not: {kind: parenthesized_expression}}, kind: 'variable_declarator, assignment_expression', matches: bound}}
    stored:
        kind: 'member_expression, subscript_expression'
        not: {has: {field: object, kind: this}}
        matches: modular
        inside: {kind: assignment_expression, field: left, inside: {kind: expression_statement, inside: {kind: statement_block, inside: {matches: invoked}}}}
        any:
            - regex: '^\$\.global[.\[]'
            - all:
                - has: {stopBy: end, kind: identifier, pattern: $ROOT}
                - inside:
                    stopBy: {kind: function_expression}
                    kind: function_expression
                    any:
                        - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, pattern: $ROOT}}}
                        - has: {field: body, has: {stopBy: {kind: 'function_declaration, function_expression'}, kind: 'variable_declarator, function_declaration', has: {field: name, pattern: $ROOT}}}
    published:
        any:
            - has:
                stopBy: {kind: 'function_declaration, function_expression'}
                kind: return_statement
                any:
                    - has: {stopBy: {not: {kind: ternary_expression}}, pattern: $ROOT, not: {inside: {kind: ternary_expression, field: condition}}}
                    - has: {stopBy: {kind: function_expression}, kind: pair, has: {field: value, pattern: $ROOT}}
            - has:
                kind: expression_statement
                has:
                    kind: assignment_expression
                    all:
                        - has: {field: left, any: [{regex: '^\$\.global[.\[]'}, {has: {field: object, kind: this}}]}
                        - has: {field: right, pattern: $ROOT}
            - all:
                - has: {stopBy: {kind: 'function_declaration, function_expression'}, kind: return_statement, has: {kind: identifier, pattern: $TABLE}}
                - any:
                    - has: {kind: expression_statement, has: {kind: assignment_expression, all: [{has: {field: left, has: {field: object, pattern: $TABLE}}}, {has: {field: right, pattern: $ROOT}}]}}
                    - has: {kind: 'variable_declaration, lexical_declaration', has: {kind: variable_declarator, all: [{has: {field: name, pattern: $TABLE}}, {has: {field: value, has: {stopBy: {kind: function_expression}, kind: pair, has: {field: value, pattern: $ROOT}}}}]}}
    concealed:
        any:
            - kind: 'member_expression, subscript_expression'
              not: {any: [{has: {field: object, kind: this}}, {inside: {stopBy: end, kind: statement_block, matches: published}}]}
            - inside:
                stopBy: {kind: 'function_declaration, variable_declarator'}
                kind: 'function_declaration, variable_declarator'
                all:
                    - has: {field: name, pattern: $ROOT}
                    - matches: modular
                    - not: {inside: {stopBy: end, kind: statement_block, matches: published}}
rule:
    any:
        - kind: 'property_identifier, string, number'
          pattern: $NAME
          inside:
            kind: pair
            field: key
            has: {field: value, matches: literal}
            inside: {matches: owned}
        - kind: 'member_expression, subscript_expression'
          all:
            - has: {field: object, kind: this}
            - any: [{has: {field: property, pattern: $NAME}}, {has: {field: index, pattern: $NAME}}]
            - inside: {kind: assignment_expression, field: left, has: {field: right, matches: literal}}
            - matches: carried
        - matches: stored
          pattern: $NAME
          inside: {kind: assignment_expression, field: left, has: {field: right, matches: literal}}
rewriters:
    - {id: parameter, rule: {kind: 'required_parameter, optional_parameter', pattern: $PARAMETER}, fix: $PARAMETER}
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    PARAMETERS: {rewrite: {source: $PARAMS, rewriters: [parameter], joinBy: ', '}}
name: $QUALIFIER$NAME
signature: $QUALIFIER$NAME($PARAMETERS)
isPublic:
    any:
        - regex: '^\$\.global[.\[]'
        - not: {matches: concealed}
---
id: extendscript-member-field
language: extendscript
role: member
parentRuleIds: [extendscript-module, extendscript-class, extendscript-object]
symbolType: field
utils:
    scope: {inside: {stopBy: {kind: 'program, function_declaration, function_expression'}, any: [{kind: program}, {matches: invoked}]}}
    invoked: {kind: function_expression, matches: scope, inside: {stopBy: {not: {kind: 'parenthesized_expression, member_expression'}}, kind: 'call_expression, new_expression'}}
    literal:
        any:
            - kind: function_expression
            - {kind: parenthesized_expression, has: {matches: literal}}
    held:
        kind: object
        any:
            - inside: {kind: variable_declarator, field: value, inside: {kind: 'variable_declaration, lexical_declaration', matches: scope}}
            - inside: {kind: assignment_expression, field: right, inside: {kind: expression_statement, matches: scope}}
            - inside: {stopBy: {not: {kind: ternary_expression}}, kind: return_statement, matches: scope}
            - inside: {kind: pair, field: value, inside: {matches: held}}
    owned:
        matches: held
        any:
            - inside: {kind: pair, field: value, has: {field: key, pattern: $OWNER}}
            - inside: {kind: 'variable_declarator, assignment_expression', matches: bound}
            - kind: object
    modular:
        inside:
            stopBy: {kind: 'function_declaration, function_expression'}
            kind: function_expression
            inside: {stopBy: {not: {kind: 'parenthesized_expression, member_expression, call_expression, new_expression'}}, kind: 'variable_declarator, assignment_expression'}
    bound:
        matches: scope
        any:
            - all: [{matches: modular}, {any: [{has: {field: name, pattern: $OWNER}}, {has: {field: left, pattern: $OWNER}}]}]
            - pattern: $_
    carried:
        inside:
            stopBy: {kind: 'function_declaration, function_expression'}
            any:
                - {kind: function_declaration, matches: bound}
                - matches: invoked
                - {kind: function_expression, inside: {stopBy: {not: {kind: parenthesized_expression}}, kind: 'variable_declarator, assignment_expression', matches: bound}}
    stored:
        kind: 'member_expression, subscript_expression'
        not: {has: {field: object, kind: this}}
        matches: modular
        inside: {kind: assignment_expression, field: left, inside: {kind: expression_statement, inside: {kind: statement_block, inside: {matches: invoked}}}}
        any:
            - regex: '^\$\.global[.\[]'
            - all:
                - has: {stopBy: end, kind: identifier, pattern: $ROOT}
                - inside:
                    stopBy: {kind: function_expression}
                    kind: function_expression
                    any:
                        - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, pattern: $ROOT}}}
                        - has: {field: body, has: {stopBy: {kind: 'function_declaration, function_expression'}, kind: 'variable_declarator, function_declaration', has: {field: name, pattern: $ROOT}}}
    published:
        any:
            - has:
                stopBy: {kind: 'function_declaration, function_expression'}
                kind: return_statement
                any:
                    - has: {stopBy: {not: {kind: ternary_expression}}, pattern: $ROOT, not: {inside: {kind: ternary_expression, field: condition}}}
                    - has: {stopBy: {kind: function_expression}, kind: pair, has: {field: value, pattern: $ROOT}}
            - has:
                kind: expression_statement
                has:
                    kind: assignment_expression
                    all:
                        - has: {field: left, any: [{regex: '^\$\.global[.\[]'}, {has: {field: object, kind: this}}]}
                        - has: {field: right, pattern: $ROOT}
            - all:
                - has: {stopBy: {kind: 'function_declaration, function_expression'}, kind: return_statement, has: {kind: identifier, pattern: $TABLE}}
                - any:
                    - has: {kind: expression_statement, has: {kind: assignment_expression, all: [{has: {field: left, has: {field: object, pattern: $TABLE}}}, {has: {field: right, pattern: $ROOT}}]}}
                    - has: {kind: 'variable_declaration, lexical_declaration', has: {kind: variable_declarator, all: [{has: {field: name, pattern: $TABLE}}, {has: {field: value, has: {stopBy: {kind: function_expression}, kind: pair, has: {field: value, pattern: $ROOT}}}}]}}
    concealed:
        any:
            - kind: 'assignment_expression, member_expression, subscript_expression'
              not: {any: [{has: {field: left, has: {field: object, kind: this}}}, {inside: {stopBy: end, kind: statement_block, matches: published}}]}
            - inside:
                stopBy: {kind: 'function_declaration, variable_declarator'}
                kind: 'function_declaration, variable_declarator'
                all:
                    - has: {field: name, pattern: $ROOT}
                    - matches: modular
                    - not: {inside: {stopBy: end, kind: statement_block, matches: published}}
rule:
    any:
        - kind: 'property_identifier, string, number'
          pattern: $NAME
          inside: {kind: pair, field: key, has: {field: value, kind: object}, inside: {matches: owned}}
        - kind: pair
          all:
            - has: {field: key, pattern: $NAME}
            - has: {field: value, not: {any: [{kind: object}, {matches: literal}]}}
            - not: {all: [{has: {field: value, pattern: $NAME}}, {inside: {kind: object, inside: {stopBy: {not: {kind: ternary_expression}}, kind: return_statement}}}]}
          inside: {matches: owned}
        - kind: assignment_expression
          all:
            - has: {field: left, all: [{has: {field: object, kind: this}}, {any: [{has: {field: property, pattern: $NAME}}, {has: {field: index, pattern: $NAME}}]}]}
            - has: {field: right, not: {matches: literal}}
            - matches: carried
        - kind: assignment_expression
          all:
            - has: {field: left, matches: stored, pattern: $NAME}
            - has: {field: right, not: {any: [{kind: object}, {matches: literal}]}}
        - matches: stored
          pattern: $NAME
          inside: {kind: assignment_expression, field: left, has: {field: right, kind: object}}
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
name: $QUALIFIER$NAME
isPublic:
    any:
        - regex: '^\$\.global[.\[]'
        - not: {matches: concealed}
