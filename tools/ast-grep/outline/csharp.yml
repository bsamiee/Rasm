id: csharp-member-parameter
language: csharplang
role: member
symbolType: property
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-union]
utils:
    public:
        any:
            - has: {kind: modifier, regex: '^(public|protected)$'}
