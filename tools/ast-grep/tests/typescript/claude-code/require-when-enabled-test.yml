id: require-when-enabled
valid:
    - |
      const value = fromBoolean(options.dispatch).match({ some: () => 1, none: () => undefined });
    - |
      await fromBoolean(options.dispatch).match({ some: () => serve(), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: (enabled) => serve(enabled), none: () => undefined });
    - |
      fromBoolean(options.speak).match<void>({ some: register, none: () => undefined });
    - |
      fromBoolean(options.dispatch).match({ some: () => _serve(on), none: () => undefined });
    - |
      whenEnabled(options.dispatch, () => _serve(on));
    - |
      const whenEnabled = (enabled: boolean, register: () => void): void => fromBoolean(enabled).match<void>({ some: register, none: () => undefined });
    - |
      fromBoolean(context.length > 0).match<void>({ some: () => $.ui.notice(e.tool_use_id, context.join(' ')), none: () => undefined });
    - |
      const line = fromBoolean(options.speak).match<string>({ some: () => summary, none: () => '' });
    - |
      fromBoolean(options.speak).match<void>({ some: () => speak(on), none: () => log(on) });
    - |
      const line = fromBoolean(options.speak).match<string>({ some: () => summary, none: () => undefined });
    - |
      fromNullable(options.packageManager).match<void>({ some: () => _rewrite(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).fold<void>({ some: () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), other: () => undefined });
    - |
      await fromBoolean(options.classify).match<Promise<void>>({ some: () => classify(), none: () => undefined });
    - |
      fromBoolean(!ready).match<void>({ some: () => _serve(on), none: () => undefined });
    - |
      const gate = (on: On, settings: Raw): void => fromBoolean(settings.dispatch).match<void>({ some: () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => log() });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => _plain(on) });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => { log(); } });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => { return log(); } });
    - "fromBoolean(options.dispatch).match<void>({some: () => serve(), none: (x = effect()) => undefined});"
    - "fromBoolean(options.dispatch).match<void>({some: () => serve(), none: () => undefined, ...overrides});"
    - "fromBoolean(options.dispatch).match<void>({some: () => serve(), /* retain */ none: () => undefined});"
    - "fromBoolean(options.dispatch).match<void>({some: () => serve(), none: /* retain */ () => undefined});"
    - "fromBoolean(options.dispatch).match<undefined>({ some: () => _serve(on), none: () => undefined });"
    - "fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none() { return undefined; } });"
    - "fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: function () {} });"
    - "fromBoolean(options.dispatch).match<void>({some: () => serve(), none: async () => undefined});"
invalid:
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options['classify']).match<void>({ some: () => _classify(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ none: () => undefined, some: () => _dispatch(on) });
    - |
      fromBoolean(!options.dispatch).match<void>({ some: () => _plain(on), none: () => undefined });
    - |
      const gate = (on: On, settings: Options): void => fromBoolean(settings.dispatch).match<void>({ some: () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => {} });
    - |
      fromBoolean(options.dispatch && interactive).match<void>({ some: () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => { _serve(on); }, none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => void 0 });
    - |
      fromBoolean(!options.dispatch && interactive).match<void>({ some: () => _plain(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: (): void => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: (): undefined => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => { return; } });
    - |
      fromBoolean(options?.dispatch).match<void>({ some: () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: async () => _serve(on), none: () => undefined });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => { return undefined; } });
    - |
      fromBoolean(options.dispatch).match<void>({ some: () => _serve(on), none: () => { return void 0; } });
