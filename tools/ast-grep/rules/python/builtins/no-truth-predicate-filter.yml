# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
utils:
    truth-function:
        matches:
            python-unparenthesized:
                value:
                    any:
                        - matches: {python-builtin-name: {name: {regex: '^bool$'}}}
                        - matches: {python-member-use: {module: {regex: '^operator$'}, name: {regex: '^truth$'}}}
    truth-value:
        any:
            - {kind: identifier, pattern: $PARAMETER}
            - kind: parenthesized_expression
              has: {matches: truth-value}
            - kind: call
              all:
                - has: {field: function, matches: truth-function}
                - has:
                    field: arguments
                    kind: argument_list
                    has: {matches: truth-value}
                    not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    truth-predicate:
        any:
            - matches: truth-function
            - kind: lambda
              all:
                - has:
                    field: parameters
                    kind: lambda_parameters
                    has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, kind: identifier, pattern: $PARAMETER}
                    not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
                - has: {field: body, matches: truth-value}
    filter-function:
        matches:
            python-unparenthesized:
                value:
                    any:
                        - matches: {python-builtin-name: {name: {regex: '^filter$'}}}
                        - matches: {python-member-use: {module: {regex: '^itertools$'}, name: {regex: '^filterfalse$'}}}
rule:
    pattern: {context: 'f($PREDICATE, $ITERABLE)', selector: argument_list}
    all:
        - not: {has: {kind: 'keyword_argument, list_splat, dictionary_splat'}}
        - inside: {kind: call, field: arguments, has: {field: function, matches: filter-function, pattern: $FILTER}}
    not: {has: {kind: comment, stopBy: end}}
constraints:
    PREDICATE: {matches: {python-unparenthesized: {value: {matches: truth-predicate}}}}
fix: '(None, $ITERABLE)'
message: 'Truth predicate passed to `$FILTER` repeats the test a `None` predicate applies'
note: 'Pass `None` as the predicate'
