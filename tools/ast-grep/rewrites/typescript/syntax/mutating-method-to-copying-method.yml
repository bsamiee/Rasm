# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: mutating-method-to-copying-method
language: tsx
severity: off
utils:
    # Receiver no other binding holds, an array literal or the fresh array a copying method, a clone, or a static constructor answers
    fresh-array:
        any:
            - kind: array
            - kind: call_expression
              has:
                  field: function
                  any:
                      # Array methods that answer a new array, the iterator methods keys, values, and entries answer no array
                      - kind: member_expression
                        has:
                            field: property
                            regex: '^(map|flatMap|filter|slice|concat|flat|toSorted|toReversed|toSpliced|with|split|toArray)$'
                      - regex: '^(Array\.(from|of)|Object\.(keys|values|entries)|structuredClone)$'
rule:
    matches: syntax-mutating-array-call
    all:
        - has: {field: function, all: [{has: {field: object, pattern: $RECEIVER, matches: fresh-array}}, {has: {field: property, pattern: $METHOD}}]}
        - has: {field: arguments, pattern: $ARGS}
        # Method with no copying counterpart keeps its finding under no-array-mutation, splice answers the removed elements and toSpliced the rest
        - not: {has: {field: function, has: {field: property, regex: '^(push|pop|shift|unshift|fill|copyWithin|splice)$'}}}
transform:
    # One stage per method, each miss keeps the text and the next stage reads it
    SORTED: replace($METHOD, replace='^sort$', by='toSorted')
    COPYING: replace($SORTED, replace='^reverse$', by='toReversed')
fix: $RECEIVER.$COPYING$ARGS
message: '`$METHOD` writes a fresh array in place where its copying counterpart answers the same array'
note: Sort or reverse through the copying method, `[...rows].toSorted(compare)`, and the receiver keeps its own order
