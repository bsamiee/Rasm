id: no-nested-combinator-calls
valid:
    - |
      import { Effect, pipe } from "effect";
      const a = pipe(Effect.succeed(1), Effect.map(f), Effect.tap(g), Effect.asVoid);
    - |
      import { Effect } from "effect";
      const a = Effect.tap(Effect.map(Effect.succeed(1), f), g);
    - |
      import { Effect } from "effect";
      const a = Effect.succeed(1).pipe(Effect.map(f));
invalid:
    - |
      import { Effect } from "effect";
      const a = Effect.map(Effect.succeed(1), (n) => n + 1).pipe(Effect.asVoid);
    - |
      import { Effect } from "effect";
      const a = Effect.asVoid(Effect.tap(Effect.map(Effect.succeed(1), f), g));
