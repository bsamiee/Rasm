# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-result-type
language: swiftlang
rule:
    kind: user_type
    any:
        - pattern: {context: 'func f() -> Swift.Result<$$$TYPES> {}', selector: user_type}
        - pattern: {context: 'func f() -> Swift::Result<$$$TYPES> {}', selector: user_type}
