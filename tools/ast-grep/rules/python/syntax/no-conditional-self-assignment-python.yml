# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-conditional-self-assignment-python
language: python
severity: error
utils:
    kept:
        any:
            - pattern: $T if $_ else $_
            - pattern: $_ if $_ else $T
            - pattern: $T or $_
            - pattern: $_ or $T
            - pattern: $T and $_
            - pattern: $_ and $T
            - {kind: parenthesized_expression, has: {matches: kept}}
    self-write:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has: {field: left, kind: 'attribute, subscript', pattern: $T}
                - not: {has: {field: type, kind: type}}
                - has: {field: right, matches: kept}
rule:
    any:
        - matches: self-write
          pattern: $STMT
          not: {matches: python-multiline-string}
        - kind: string_start
          pattern: $UNFIXED
          inside: {kind: string, regex: '\n', inside: {stopBy: end, matches: self-write}}
rewriters:
    - id: written-when-false
      rule: {any: [{pattern: '$T = $T if $C else $V'}, {pattern: '$T = ($T if $C else $V)'}]}
      constraints: {C: {not: {kind: comparison_operator, not: {has: {nthChild: 3}}, has: {field: operators, regex: '^[!=]=$'}}}}
      transform: {NOT: {rewrite: {source: $C, rewriters: [chain, is-not, is, not-in, in, not, compound, condition]}}}
      fix: |-
        if $NOT:
            $T = $V
    - id: written-when-true
      rule: {any: [{pattern: '$T = $V if $C else $T'}, {pattern: '$T = ($V if $C else $T)'}]}
      fix: |-
        if $C:
            $T = $V
    - id: written-when-falsy
      rule: {any: [{pattern: '$T = $T or $V'}, {pattern: '$T = ($T or $V)'}]}
      fix: |-
        if not $T:
            $T = $V
    - id: written-when-truthy
      rule: {any: [{pattern: '$T = $T and $V'}, {pattern: '$T = ($T and $V)'}]}
      fix: |-
        if $T:
            $T = $V
    - id: written-when-name-truthy
      rule: {any: [{pattern: '$T = $V or $T'}, {pattern: '$T = ($V or $T)'}]}
      constraints: {V: {kind: identifier}}
      fix: |-
        if $V:
            $T = $V
    - id: written-when-name-falsy
      rule: {any: [{pattern: '$T = $V and $T'}, {pattern: '$T = ($V and $T)'}]}
      constraints: {V: {kind: identifier}}
      fix: |-
        if not $V:
            $T = $V
    - {id: chain, rule: {kind: comparison_operator, has: {nthChild: 3}, pattern: $A}, fix: 'not $A'}
    - {id: is-not, rule: {pattern: '$A is not $B'}, fix: '$A is $B'}
    - {id: is, rule: {pattern: '$A is $B'}, fix: '$A is not $B'}
    - {id: not-in, rule: {pattern: '$A not in $B'}, fix: '$A in $B'}
    - {id: in, rule: {pattern: '$A in $B'}, fix: '$A not in $B'}
    - {id: not, rule: {pattern: 'not $A'}, fix: $A}
    - {id: compound, rule: {kind: boolean_operator, pattern: $A}, fix: 'not ($A)'}
    - {id: condition, rule: {pattern: $A}, fix: 'not $A'}
transform:
    OUT: rewrite($STMT, rewriters=[written-when-false, written-when-true, written-when-falsy, written-when-truthy, written-when-name-truthy, written-when-name-falsy])
fix: $OUT$UNFIXED
message: '`$T` receives its own value in one conditional arm'
note: 'Use an `if` that assigns `<target>` on the arm that changes it, no write repeats its current value'
