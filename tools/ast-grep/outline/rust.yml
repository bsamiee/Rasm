id: rust-use
language: rustlang
role: item
symbolType: module
utils:
    argument: {pattern: $ARGUMENT}
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    any:
        - has: {field: argument, kind: use_as_clause, has: {field: path, any: [{has: {field: path, matches: argument}}, {matches: argument}]}}
        - has: {field: argument, has: {field: path, matches: argument}}
        - has: {field: argument, kind: use_wildcard, has: {matches: argument}}
        - has: {field: argument, matches: argument}
        - has: {field: name, matches: argument}
rewriters:
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    PATH: {rewrite: {source: $ARGUMENT, rewriters: [annotation]}}
    FOLDED: {replace: {source: $PATH, replace: '\p{Pattern_White_Space}+', by: ' '}}
    NAME: {replace: {source: $FOLDED, replace: '[ ,;]+$|,? ([)\]}>])|([(\[{]) ', by: $1$2}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]}>])|([(\[{]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-mod
language: rustlang
role: item
symbolType: module
rule:
    kind: mod_item
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
rewriters:
    - {id: body, rule: {kind: declaration_list, inside: {kind: mod_item, field: body}}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {substring: {source: $LINE, endChar: -1}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-function
language: rustlang
role: item
symbolType: function
utils:
    nesting: {has: {field: body, has: {stopBy: end, kind: 'ERROR, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, impl_item, macro_definition, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}}}
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    all: [{not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}}, {not: {matches: nesting}}]
rewriters:
    - {id: body, rule: {any: [{kind: function_contract}, {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}]}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-function-owner
language: rustlang
role: item
symbolType: function
utils:
    nesting: {has: {field: body, has: {stopBy: end, kind: 'ERROR, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, impl_item, macro_definition, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}}}
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    all: [{not: {inside: {kind: declaration_list, inside: {kind: 'impl_item, trait_item'}}}}, {matches: nesting}]
rewriters:
    - {id: body, rule: {any: [{kind: function_contract}, {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}]}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-method
language: rustlang
role: item
symbolType: method
utils:
    owner: {pattern: $OWNER}
    owner-head: {any: [{kind: 'type_identifier, primitive_type', matches: owner}, {kind: scoped_type_identifier, has: {field: name, matches: owner}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: owner-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}, {matches: owner}]}
    trait-name: {pattern: $TRAIT}
    trait-head: {any: [{kind: type_identifier, matches: trait-name}, {kind: scoped_type_identifier, has: {field: name, matches: trait-name}}, {kind: generic_type, has: {field: type, matches: trait-head}}, {matches: trait-name}]}
    traited: {pattern: $TRAITED}
    traited-head: {any: [{kind: 'type_identifier, primitive_type', matches: traited}, {kind: scoped_type_identifier, has: {field: name, matches: traited}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: traited-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: traited-head}}, {matches: traited}]}
    owned: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, all: [{has: {field: trait, matches: trait-head}}, {has: {field: type, matches: traited-head}}]}, {kind: impl_item, has: {field: type, matches: owner-head}}]}}}
    implied: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}}
    nesting: {has: {field: body, has: {stopBy: end, kind: 'ERROR, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, impl_item, macro_definition, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}}}
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    all: [{matches: owned}, {not: {matches: nesting}}]
rewriters:
    - {id: body, rule: {any: [{kind: function_contract}, {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}]}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: " "}}
    QUALIFIER: {replace: {source: $OWNED, replace: '^(?s)(.+)$', by: '$1::'}}
    TYPE_LINE: {replace: {source: $TRAITED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    OPEN: {replace: {source: $TYPE_LINE, replace: '^(?s)(.+)$', by: '<$1'}}
    CLOSE: {replace: {source: $TRAIT, replace: '^(?s)(.+)$', by: ' as $1>::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $QUALIFIER$OPEN$CLOSE$NAME
signature: $SIGNATURE
isExported: {any: [{has: {kind: visibility_modifier, regex: '^pub$'}}, {matches: implied}]}
---
id: rust-method-owner
language: rustlang
role: item
symbolType: method
utils:
    owner: {pattern: $OWNER}
    owner-head: {any: [{kind: 'type_identifier, primitive_type', matches: owner}, {kind: scoped_type_identifier, has: {field: name, matches: owner}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: owner-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}, {matches: owner}]}
    trait-name: {pattern: $TRAIT}
    trait-head: {any: [{kind: type_identifier, matches: trait-name}, {kind: scoped_type_identifier, has: {field: name, matches: trait-name}}, {kind: generic_type, has: {field: type, matches: trait-head}}, {matches: trait-name}]}
    traited: {pattern: $TRAITED}
    traited-head: {any: [{kind: 'type_identifier, primitive_type', matches: traited}, {kind: scoped_type_identifier, has: {field: name, matches: traited}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: traited-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: traited-head}}, {matches: traited}]}
    owned: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, all: [{has: {field: trait, matches: trait-head}}, {has: {field: type, matches: traited-head}}]}, {kind: impl_item, has: {field: type, matches: owner-head}}]}}}
    implied: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}}
    nesting: {has: {field: body, has: {stopBy: end, kind: 'ERROR, const_item, delegation_item, enum_item, extern_crate_declaration, foreign_mod_item, function_item, impl_item, macro_definition, mod_item, static_item, struct_item, trait_alias, trait_item, type_item, union_item, use_declaration'}}}
rule:
    kind: 'function_item, function_signature_item, delegation_item'
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    all: [{matches: owned}, {matches: nesting}]
rewriters:
    - {id: body, rule: {any: [{kind: function_contract}, {kind: block, inside: {kind: 'function_item, delegation_item', field: body}}]}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: " "}}
    QUALIFIER: {replace: {source: $OWNED, replace: '^(?s)(.+)$', by: '$1::'}}
    TYPE_LINE: {replace: {source: $TRAITED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    OPEN: {replace: {source: $TYPE_LINE, replace: '^(?s)(.+)$', by: '<$1'}}
    CLOSE: {replace: {source: $TRAIT, replace: '^(?s)(.+)$', by: ' as $1>::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $QUALIFIER$OPEN$CLOSE$NAME
signature: $SIGNATURE
isExported: {any: [{has: {kind: visibility_modifier, regex: '^pub$'}}, {matches: implied}]}
---
id: rust-type
language: rustlang
role: item
symbolType: struct
utils:
    owner: {pattern: $OWNER}
    owner-head: {any: [{kind: 'type_identifier, primitive_type', matches: owner}, {kind: scoped_type_identifier, has: {field: name, matches: owner}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: owner-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}, {matches: owner}]}
    trait-name: {pattern: $TRAIT}
    trait-head: {any: [{kind: type_identifier, matches: trait-name}, {kind: scoped_type_identifier, has: {field: name, matches: trait-name}}, {kind: generic_type, has: {field: type, matches: trait-head}}, {matches: trait-name}]}
    traited: {pattern: $TRAITED}
    traited-head: {any: [{kind: 'type_identifier, primitive_type', matches: traited}, {kind: scoped_type_identifier, has: {field: name, matches: traited}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: traited-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: traited-head}}, {matches: traited}]}
    owned: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, all: [{has: {field: trait, matches: trait-head}}, {has: {field: type, matches: traited-head}}]}, {kind: impl_item, has: {field: type, matches: owner-head}}]}}}
    implied: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}}
rule:
    kind: 'struct_item, union_item, type_item, associated_type'
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}
    any: [{matches: owned}, {kind: 'struct_item, union_item, type_item, associated_type'}]
rewriters:
    - {id: body, rule: {kind: field_declaration_list, inside: {kind: 'struct_item, union_item', field: body}}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: " "}}
    QUALIFIER: {replace: {source: $OWNED, replace: '^(?s)(.+)$', by: '$1::'}}
    TYPE_LINE: {replace: {source: $TRAITED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    OPEN: {replace: {source: $TYPE_LINE, replace: '^(?s)(.+)$', by: '<$1'}}
    CLOSE: {replace: {source: $TRAIT, replace: '^(?s)(.+)$', by: ' as $1>::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $QUALIFIER$OPEN$CLOSE$NAME
signature: $SIGNATURE
isExported: {any: [{has: {kind: visibility_modifier, regex: '^pub$'}}, {matches: implied}]}
---
id: rust-enum
language: rustlang
role: item
symbolType: enum
rule:
    kind: enum_item
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}
rewriters:
    - {id: body, rule: {kind: enum_variant_list, inside: {kind: enum_item, field: body}}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-trait
language: rustlang
role: item
symbolType: interface
rule:
    kind: 'trait_item, trait_alias'
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'struct $NAME;', selector: type_identifier}}
rewriters:
    - {id: body, rule: {kind: declaration_list, inside: {kind: trait_item, field: body}}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-impl
language: rustlang
role: item
symbolType: object
utils:
    target-name: {pattern: $TARGET}
    target: {any: [{kind: 'type_identifier, primitive_type', matches: target-name}, {kind: scoped_type_identifier, has: {field: name, matches: target-name}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: target}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: target}}, {matches: target-name}]}
rule:
    kind: impl_item
    pattern: $DECLARATION
    not: {has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}
    has: {field: type, matches: target}
rewriters:
    - {id: body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    NAME: {replace: {source: $TARGET, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: rust-trait-impl
language: rustlang
role: item
symbolType: object
utils:
    implemented-name: {pattern: $IMPLEMENTED}
    implemented: {any: [{kind: type_identifier, matches: implemented-name}, {kind: scoped_type_identifier, has: {field: name, matches: implemented-name}}, {kind: generic_type, has: {field: type, matches: implemented}}, {matches: implemented-name}]}
    target-name: {pattern: $TARGET}
    target: {any: [{kind: 'type_identifier, primitive_type', matches: target-name}, {kind: scoped_type_identifier, has: {field: name, matches: target-name}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: target}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: target}}, {matches: target-name}]}
rule:
    kind: impl_item
    pattern: $DECLARATION
    all:
        - has: {field: trait, matches: implemented}
        - has: {field: type, matches: target}
        - any: [{has: {regex: '^!$', not: {kind: never_type}, pattern: $$NEGATION}}, {kind: impl_item}]
rewriters:
    - {id: body, rule: {kind: declaration_list, inside: {kind: impl_item, field: body}}, fix: ' '}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment'}, fix: ''}
transform:
    NAME: {replace: {source: $TARGET, replace: '\p{Pattern_White_Space}+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: <$NAME as $NEGATION$IMPLEMENTED>
signature: $SIGNATURE
isExported: true
---
id: rust-const
language: rustlang
role: item
symbolType: constant
utils:
    owner: {pattern: $OWNER}
    owner-head: {any: [{kind: 'type_identifier, primitive_type', matches: owner}, {kind: scoped_type_identifier, has: {field: name, matches: owner}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: owner-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: owner-head}}, {matches: owner}]}
    trait-name: {pattern: $TRAIT}
    trait-head: {any: [{kind: type_identifier, matches: trait-name}, {kind: scoped_type_identifier, has: {field: name, matches: trait-name}}, {kind: generic_type, has: {field: type, matches: trait-head}}, {matches: trait-name}]}
    traited: {pattern: $TRAITED}
    traited-head: {any: [{kind: 'type_identifier, primitive_type', matches: traited}, {kind: scoped_type_identifier, has: {field: name, matches: traited}}, {kind: 'generic_type, reference_type, pointer_type', has: {field: type, matches: traited-head}}, {kind: 'dynamic_type, abstract_type', has: {field: trait, matches: traited-head}}, {matches: traited}]}
    owned: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item, has: {field: name, matches: owner}}, {kind: impl_item, all: [{has: {field: trait, matches: trait-head}}, {has: {field: type, matches: traited-head}}]}, {kind: impl_item, has: {field: type, matches: owner-head}}]}}}
    implied: {inside: {kind: declaration_list, inside: {any: [{kind: trait_item}, {kind: impl_item, has: {field: trait, kind: 'type_identifier, scoped_type_identifier, generic_type'}}]}}}
rule:
    kind: const_item
    pattern: $DECLARATION
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
    any: [{matches: owned}, {kind: const_item}]
rewriters:
    - {id: value, rule: {pattern: $VALUE, inside: {kind: 'const_item, static_item, let_declaration, field_declaration, enum_variant', field: value}}, fix: {template: ' ', expandStart: {regex: '^=$', stopBy: end}, expandEnd: {regex: '^;$'}}}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment', not: {follows: {regex: '^=$', stopBy: {not: {kind: 'line_comment, block_comment'}}}}}, fix: ''}
transform:
    OWNED: {replace: {source: $OWNER, replace: '\p{Pattern_White_Space}+', by: " "}}
    QUALIFIER: {replace: {source: $OWNED, replace: '^(?s)(.+)$', by: '$1::'}}
    TYPE_LINE: {replace: {source: $TRAITED, replace: '\p{Pattern_White_Space}+', by: ' '}}
    OPEN: {replace: {source: $TYPE_LINE, replace: '^(?s)(.+)$', by: '<$1'}}
    CLOSE: {replace: {source: $TRAIT, replace: '^(?s)(.+)$', by: ' as $1>::'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $QUALIFIER$OPEN$CLOSE$NAME
signature: $SIGNATURE
isExported: {not: {has: {field: name, regex: '^_$'}}, any: [{has: {kind: visibility_modifier, regex: '^pub$'}}, {matches: implied}]}
---
id: rust-static
language: rustlang
role: item
symbolType: variable
rule:
    pattern: $DECLARATION
    any:
        - {kind: static_item, has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}}
        - {kind: let_declaration, has: {field: pattern, pattern: $NAME}, inside: {kind: 'source_file, ERROR, declaration_list'}}
rewriters:
    - {id: value, rule: {pattern: $VALUE, inside: {kind: 'const_item, static_item, let_declaration, field_declaration, enum_variant', field: value}}, fix: {template: ' ', expandStart: {regex: '^=$', stopBy: end}, expandEnd: {regex: '^;$'}}}
    - {id: annotation, rule: {kind: 'attribute_item, line_comment, block_comment', not: {follows: {regex: '^=$', stopBy: {not: {kind: 'line_comment, block_comment'}}}}}, fix: ''}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, annotation]}}
    LINE: {replace: {source: $HEADER, replace: '\p{Pattern_White_Space}+', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[ ,;]+$|,? ([)\]>])|([(\[<]) ', by: $1$2}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier, regex: '^pub$'}}
---
id: rust-macro
language: rustlang
role: item
symbolType: function
rule:
    kind: macro_definition
    has: {field: name, pattern: {context: 'mod $NAME;', selector: identifier}}
    all:
        - has: {regex: '^(?:macro_rules!|macro)$', pattern: $$KEYWORD}
