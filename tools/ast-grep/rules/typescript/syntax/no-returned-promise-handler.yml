# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-returned-promise-handler
language: tsx
severity: error
rule:
    kind: call_expression
    has:
        field: function
        kind: member_expression
        has: {field: property, pattern: $HANDLER, regex: '^(then|catch|finally)$'}
    inside:
        kind: return_statement
        inside:
            matches: syntax-function-boundary
            not: {has: {regex: '^async$'}}
            stopBy: {matches: syntax-function-boundary}
message: 'Non-async function returns a `$HANDLER` chain'
note: '`async` body awaits the promise, the handler callback becomes the statements after `await`'
labels:
    HANDLER: {style: primary, message: Handler the `await` replaces}
