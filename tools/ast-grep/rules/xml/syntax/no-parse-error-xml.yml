# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: xml
severity: error
utils:
    unreported:
        inside: {kind: ERROR, stopBy: end}
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: document
          has:
              stopBy: end
              all:
                  - regex: '^$'
                  - pattern: $$MISSING
                  - not: {matches: unreported}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: Fix malformed XML, or extend tree-sitter-xml for accepted syntax
