# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-result-call
language: rust
rule:
    kind: call_expression
    any:
        - all:
            - has:
                field: function
                any:
                    - {kind: field_expression, has: {field: field, regex: '^(parse|try_into)$'}}
                    - {kind: generic_function, has: {field: function, kind: field_expression, has: {field: field, regex: '^(parse|try_into)$'}}}
            - has: {field: arguments, not: {has: {pattern: $_}}}
        - has:
            field: function
            kind: 'scoped_identifier, generic_function'
            regex: '::(from_str|from_str_radix|try_from|from_utf8|from_utf16|from_slice|from_value|from_reader)(::<[\s\S]*>)?$'
