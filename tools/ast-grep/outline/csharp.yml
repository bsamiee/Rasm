id: csharp-file-selection
language: csharplang
role: item
symbolType: file
rule:
    kind: file_based_directive
    has: {field: kind, regex: '^(?:include|exclude)$'}
    all: [{has: {field: name, pattern: $NAME}}]
name: $NAME
isImport: {has: {field: kind, regex: '^include$'}}
isExported: false
