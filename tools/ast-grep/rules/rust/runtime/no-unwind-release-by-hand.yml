# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
rule:
    any:
        - kind: let_declaration
          all:
            - regex: '(?-u:\b)catch_unwind(?-u:\b)'
            - has: {field: value, has: {stopBy: end, pattern: catch_unwind}}
            - precedes: {stopBy: end, has: {stopBy: end, pattern: resume_unwind}}
        - kind: call_expression
          has: {field: function, kind: field_expression, has: {field: field, regex: '^shutdown_background$'}}
message: 'Release runs by hand beside a call that can unwind'
note: 'Pair acquisition and release through `DropGuard::new(<value>, <release>)`, and `DropGuard::dismiss` returns the value once work commits'
