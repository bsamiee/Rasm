# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsx
severity: error
utils:
    unbound-parameter:
        kind: type_identifier
        pattern: $TYPE
        all:
            - inside:
                  stopBy: end
                  kind: 'arrow_function, function_expression, function_declaration, generator_function, generator_function_declaration, method_definition, function_signature, method_signature, function_type'
                  pattern: $OWNER
                  has: { field: type_parameters, has: { kind: type_parameter, all: [{ has: { field: name, pattern: $TYPE } }, { not: { has: { field: constraint, kind: constraint } } }] } }
            - inside: { stopBy: end, pattern: $OWNER, not: { has: { field: parameters, has: { stopBy: end, kind: type_identifier, pattern: $TYPE } } } }
rule:
    kind: type_predicate
    pattern: $PREDICATE
    all:
        - inside: { kind: 'type_predicate_annotation, asserts_annotation', stopBy: { not: { kind: asserts } } }
        - has: { field: type, any: [{ matches: unbound-parameter }, { has: { stopBy: end, matches: unbound-parameter } }] }
message: '`$PREDICATE` narrows to `$TYPE`, a type parameter only its caller chooses, key the narrowed type by an argument over a type table, `<K extends keyof <Table>>(key: K, value: unknown): value is <Table>[K]`'
