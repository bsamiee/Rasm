[project]
name = "interface"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = [
    "anyio",     # Structured concurrency for application sessions and host downloads
    "attrs",     # Frozen records of Blender's catalog and package rows, read by the host and Blender's Python alike
    "cyclopts",  # CLI parser from typed signatures
    "httpx",     # HTTP client for package, library, and site downloads
    "mcp",       # MCP client for the applications' servers
    "msgspec",   # Struct types with JSON and TOML codecs for rows and reports
    "psd-tools", # Photoshop settings file action descriptors
    "psutil",    # Process lookup and exit waits for application instances
    "pyproj",    # Site origin projected into its UTM coordinate system
    "pyyaml",    # YAML parser msgspec decodes yak package manifests through
    "tifffile",  # GeoTIFF tie point and pixel scale reads of the site survey files
]

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../pyproject.toml"
per-file-target-version = { "!{cli,host,*/apply,adobe/rows,adobe/stores,adobe/workspaces,blender/content,blender/packages,blender/sessions,blender/userpref,rhino/packages,rhino/stores}.py" = "py313" }
