# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-python
language: python
severity: error
utils:
    type-parameter-default:
        kind: ERROR
        has: {regex: '^=$'}
        inside:
            stopBy: {kind: type_parameter}
            kind: type_parameter
            inside:
                any:
                    - kind: class_definition
                    - kind: function_definition
                    - {kind: generic_type, inside: {kind: type, inside: {kind: type_alias_statement, field: left}}}
    unpacked-body:
        kind: ERROR
        any:
            - has: {kind: identifier, regex: '^for$'}
              inside:
                stopBy: {kind: 'list_splat, dictionary_splat'}
                any:
                    - kind: list_splat
                      inside:
                        stopBy: {kind: &starred 'list, set, tuple, parenthesized_expression, argument_list, list_comprehension, set_comprehension, generator_expression'}
                        kind: *starred
                    - {kind: dictionary_splat, inside: {kind: &mapped 'dictionary, dictionary_comprehension'}}
            - has: {nthChild: 1, kind: identifier, regex: '^for$'}
              any:
                - {follows: {kind: list_splat}, inside: {kind: *starred}}
                - {follows: {kind: dictionary_splat}, inside: {kind: *mapped}}
    unpacked-clause:
        kind: ERROR
        follows: {stopBy: end, any: [{matches: unpacked-body}, {has: {stopBy: end, matches: unpacked-body}}]}
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: type-parameter-default
            - matches: unpacked-body
            - matches: unpacked-clause
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: module
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span every other rule skips
note: Write a form the grammar parses
