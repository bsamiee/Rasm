# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-primitive-domain-value
language: rust
severity: error
utils:
    number-type:
        kind: primitive_type
        regex: '^(u8|u16|u32|u64|u128|usize|i8|i16|i32|i64|i128|isize|f32|f64)$'
    text-type:
        any:
            - {kind: type_identifier, regex: '^String$'}
            - {kind: reference_type, has: {field: type, kind: primitive_type, regex: '^str$'}}
    duration-name:
        regex: '(?i)(^|_)(secs|seconds|ms|millis|milliseconds|us|micros|ns|nanos|mins|minutes|hours|timeout|interval|delay|ttl|duration|elapsed)$'
    path-name:
        regex: '(?i)(^|_)(path|dir|directory|file|folder)$'
    timestamp-name:
        regex: '(?i)(^|_)((created|updated|modified|expires|issued|started|finished|deleted)_at|timestamp|since_epoch|epoch_(secs|seconds|ms|millis|nanos))$'
    date-name:
        regex: '(?i)(^|_)(date|time|datetime)$'
    quantity-name:
        regex: '(?i)(_(mm|km|ft|kg|lbs|deg|rad|kpa|mpa|psi|kw|kwh|hz|khz|mhz|pct)|(^|_)(percent|millimet(er|re)s|centimet(er|re)s|met(er|re)s|kilomet(er|re)s|feet|inches|kilograms|degrees|radians|pascals|watts|kilowatts|joules|celsius|kelvin|fahrenheit|hertz))$'
    byte-name:
        regex: '(?i)(^|_)(bytes|kb|kib|mb|mib|gb|gib)$'
    serde-item:
        inside: {stopBy: end, matches: rust-serde-record}
    number-declared:
        has: {field: type, matches: number-type}
rule:
    kind: 'const_item, static_item, field_declaration, parameter'
    all:
        - any: [{has: {field: name, pattern: $NAME}}, {has: {field: pattern, kind: identifier, pattern: $NAME}}]
        - any:
            - all:
                - any: [{has: {field: name, matches: duration-name}}, {has: {field: pattern, kind: identifier, matches: duration-name}}]
                - matches: number-declared
            - all:
                - any: [{has: {field: name, matches: byte-name}}, {has: {field: pattern, kind: identifier, matches: byte-name}}]
                - matches: number-declared
                - not: {has: {field: type, regex: '^f(32|64)$'}}
            - all:
                - any: [{has: {field: name, matches: path-name}}, {has: {field: pattern, kind: identifier, matches: path-name}}]
                - has: {field: type, matches: text-type}
            - all:
                - kind: 'field_declaration, parameter'
                - any: [{has: {field: name, matches: timestamp-name}}, {has: {field: pattern, kind: identifier, matches: timestamp-name}}]
                - matches: number-declared
            - all:
                - any: [{has: {field: name, matches: date-name}}, {has: {field: pattern, kind: identifier, matches: date-name}}]
                - has: {field: type, matches: text-type}
            - all:
                - kind: 'field_declaration, parameter'
                - any: [{has: {field: name, matches: quantity-name}}, {has: {field: pattern, kind: identifier, matches: quantity-name}}]
                - has: {field: type, kind: primitive_type, regex: '^f64$'}
                - not: {matches: serde-item}
        - not: {inside: {kind: parameters, inside: {matches: rust-trait-or-extern-function}}}
        - not: {inside: {stopBy: end, kind: 'struct_item, enum_item, union_item', matches: {rust-attributed: {attribute: {regex: '^#\[\s*repr\b'}}}}}
message: '`$NAME` holds a duration, byte size, path, instant, date, or physical quantity as a plain number or string'
note: 'Type the declaration as `core::time::Duration` for a span, `bytesize::ByteSize` for a byte count, `PathBuf` or `&Path` for a location, `jiff::Timestamp` for an instant, `jiff::civil::Date`, `Time`, or `DateTime` for calendar text, and a `uom::si::f64` quantity (`Length`, `Mass`, `Angle`, `Pressure`, `Power`, `Energy`, `ThermodynamicTemperature`, `Frequency`, `Ratio`) for a unit-suffixed `f64`, with `#[serde_as(as = "TimestampSeconds<i64>")]` for an integer timestamp on the wire'
