id: swift-import
language: swiftlang
role: item
symbolType: module
rule:
    kind: import_declaration
    pattern: $DECLARATION
    has: {kind: identifier, pattern: $NAME}
name: $NAME
signature: $DECLARATION
isImport: true
isExported:
    has:
        kind: modifiers
        any:
            - has: {kind: visibility_modifier, regex: '^(public|package)$'}
            - has: {kind: attribute, has: {kind: user_type, regex: '^_exported$'}}

---
id: swift-class
language: swiftlang
role: item
symbolType: class
rule:
    kind: &declaration class_declaration
    pattern: $DECLARATION
    inside: &scope {kind: source_file}
    all:
        - has: {field: declaration_kind, regex: '^class$'}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: *declaration, inside: *scope}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package)$'}}}

