# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    length:
        kind: member_expression
        all:
            - has: {field: property, regex: '^length$'}
            - has: {field: object, any: [{kind: parenthesized_expression, has: {pattern: $LIST, not: {kind: sequence_expression}}}, {pattern: $LIST}]}
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, pattern: $ASSERT, all: [{has: {field: object, regex: '^assert$'}}, {has: {field: property, regex: '^(deepStrictEqual|strictEqual|deepEqual|equal)$'}}]}
        - has: {field: arguments, not: {has: {nthChild: {position: 3, ofRule: &code {not: {kind: 'comment, html_comment'}}}}}}
        - any:
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, matches: length}}, {has: {nthChild: {position: 2, ofRule: *code}, pattern: $_COUNT}}]}
            - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: *code}, kind: number, pattern: $_COUNT}}, {has: {nthChild: {position: 2, ofRule: *code}, matches: length}}]}
        - inside: {kind: program, stopBy: end, has: {kind: import_statement, regex: '(?-u:\b)assert(?-u:\b)', has: {field: source, regex: '^[''"](@effect/vitest|vitest|chai)[''"]$'}}}
message: '`$ASSERT` compares the length of `$LIST` as a number'
note: 'Call `assert.lengthOf(<list>, <count>)` for a failure message that prints the list'
