id: fin-match-to-if-fail
valid:
    - "class C { int F() => result.IfFail(error => Recover(error)); }"
    - "class C { int F() => result.Match(Succ: x => x + 1, Fail: error => Recover(error)); }"
    - "class C { int F() => result.Match(Succ: x => other, Fail: error => Recover(error)); }"
    - "class C { int F() => result.Match<int>(Succ: x => x, Fail: error => Recover(error)); }"
    - "class C { int F() => result.Match(Succ: x => { Observe(); return x; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: x => { return x; Observe(); }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: x => { return other; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: x => { /* retain */ return x; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: (x, y) => x, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: (ref int x) => x, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: (int x = 1) => x, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: async (x) => { return x; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Some: x => x, None: () => 0); }"
invalid:
    - "class C { int F() => result.Match(Succ: x => x, Fail: error => Recover(error)); }"
    - "class C { int F() => result.Match(Fail: error => Recover(error), Succ: static x => x); }"
    - "class C { int F() => result.Match(x => x, Recover()); }"
    - "class C { int F() => result.Match(static (x) => x, error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: x => { return x; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: static (x) => { return x; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: static (int x) => { return x; }, Fail: error => Recover(error)); }"
    - "class C { int F() => value.Match(Succ: (int x) => x, Fail: error => Recover(error)); }"
