# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-html-tag-scan
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $SCAN
    matches: rust-html-tag-scan
message: '`$SCAN` reads HTML by searching tag text'
note: 'Parse with `scraper::Html::parse_document` and select with `scraper::Selector::parse`, strip markup with `ammonia::Builder::empty().clean(html).to_string()`, and convert to Markdown with `htmd::convert`, tag text misses attributes, case, comments, and nesting the parsers read'
