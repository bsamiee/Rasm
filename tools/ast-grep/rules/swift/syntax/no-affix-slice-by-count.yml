# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-affix-slice-by-count
language: swiftlang
severity: error
utils:
    count-difference:
        has: {kind: call_suffix, has: {stopBy: end, kind: additive_expression, has: {field: lhs, pattern: µR.count}}}
rule:
    all:
        - pattern: $SLICE
        - any:
            - all:
                - any:
                    - pattern: µR.dropFirst(µµµ)
                    - pattern: µR.removeFirst(µµµ)
                    - pattern: 'µR[µR.index(µR.startIndex, offsetBy: µµµ)...]'
                    - {pattern: µR.suffix(µµµ), matches: count-difference}
                - matches: {swift-guarded-branch: {condition: {any: [{pattern: µR.hasPrefix(µAFFIX)}, {pattern: 'µR.starts(with: µAFFIX)'}]}}}
            - all:
                - any:
                    - pattern: µR.dropLast(µµµ)
                    - pattern: µR.removeLast(µµµ)
                    - pattern: 'µR[..<µR.index(µR.endIndex, offsetBy: µµµ)]'
                    - {pattern: µR.prefix(µµµ), matches: count-difference}
                - matches: {swift-guarded-branch: {condition: {pattern: µR.hasSuffix(µAFFIX)}}}
rewriters:
    - id: trimmed-copy
      rule:
        any:
            - pattern: $R.dropFirst($AFFIX.count)
            - pattern: '$R[$R.index($R.startIndex, offsetBy: $AFFIX.count)...]'
            - pattern: $R.suffix($R.count - $AFFIX.count)
      fix: $R.trimmingPrefix($AFFIX)
    - id: trimmed-in-place
      rule: {pattern: $R.removeFirst($AFFIX.count)}
      fix: $R.trimPrefix($AFFIX)
transform:
    TRIMMED: {rewrite: {source: $SLICE, rewriters: [trimmed-copy, trimmed-in-place]}}
fix: $TRIMMED
message: '`$SLICE` removes the tested affix `$AFFIX` by a count that restates its length'
note: 'Drop the affix by one match: `<text>.trimmingPrefix(<affix>)`, `trimPrefix(<affix>)`, or `<text>.replacing(/<affix>\z/, with: "")` to keep text without it unchanged, or `<text>.wholeMatch(of: /<affix>(.*)/)?.1` to yield `nil` for text without it'
