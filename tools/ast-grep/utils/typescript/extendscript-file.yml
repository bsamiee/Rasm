# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: extendscript-file
language: tsxlang
rule:
    kind: program
    any:
        - matches: {typescript-module-importer: {module: {regex: '^@rasm/atelier-extendscript/host$'}}}
        - has: {kind: import_statement, all: [{has: {regex: '^type$'}}, {has: {field: source, regex: '^.@rasm/atelier-protocol.$'}}]}
