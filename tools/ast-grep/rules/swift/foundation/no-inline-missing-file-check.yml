# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-inline-missing-file-check
language: swiftlang
severity: error
utils:
    read-if-present:
        kind: function_declaration
        all:
            - has: {kind: parameter, has: {kind: function_type, regex: '\bthrows\b'}}
            - has: {kind: user_type, has: {stopBy: end, kind: optional_type}}
rule:
    kind: simple_identifier
    regex: '^(file(Read)?NoSuchFile|noSuchFileOrDirectory|ENOENT|NSFile(Read)?NoSuchFileError|fileDoesNotExist|(kCF|NS)URLErrorFileDoesNotExist)$'
    pattern: $SITE
    any:
        - inside: {stopBy: end, kind: 'pattern, switch_pattern'}
        - inside: {stopBy: &owner {kind: 'statements, lambda_literal'}, kind: 'if_statement, guard_statement, while_statement', has: {field: condition, regex: '^case$'}}
        - inside: {stopBy: *owner, kind: 'equality_expression, comparison_expression'}
        - inside: {stopBy: *owner, kind: call_expression, has: {nthChild: 1, regex: '\.contains$'}}
    not: {inside: {stopBy: end, matches: read-if-present}}
message: '`$SITE` classifies a missing file outside the read-if-present function'
note: 'Read through one function that runs the throwing operation and returns `Result<Value?, any Error>`, `.success(nil)` for a missing file'
