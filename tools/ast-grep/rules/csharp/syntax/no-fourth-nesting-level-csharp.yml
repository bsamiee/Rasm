# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-csharp
language: csharp
severity: error
utils:
    function:
        kind: method_declaration, constructor_declaration, destructor_declaration, operator_declaration, conversion_operator_declaration, accessor_declaration, local_function_statement, lambda_expression, anonymous_method_expression
    control:
        any:
            - kind: for_statement, foreach_statement, while_statement, do_statement, switch_statement, switch_expression
            - kind: if_statement
              not: {inside: {kind: if_statement, field: alternative}}
            - kind: conditional_expression
              not: {inside: {kind: conditional_expression, field: alternative, stopBy: {not: {kind: parenthesized_expression}}}}
    boundary: {any: [{matches: control}, {matches: function}]}
rule:
    matches: control
    pattern: $SCOPE
    inside:
        matches: control
        stopBy: {matches: boundary}
        inside:
            matches: control
            stopBy: {matches: boundary}
            inside:
                matches: control
                pattern: $OUTER
                stopBy: {matches: boundary}
                not: {inside: {matches: control, stopBy: {matches: function}}}
labels:
    SCOPE: {style: primary, message: 'Fourth nesting level'}
    OUTER: {style: secondary, message: 'First nesting level'}
message: Control flow reaches a fourth nesting level
note: 'Rebuild the nested decisions or loops as one switch expression, query expression, or pipeline over their inputs'
