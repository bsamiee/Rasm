id: no-mapfile-status-loop
valid:
    - while runner mapfile -t rows; do process "${rows[@]}"; done
    - while builtin read -r row; do process "$row"; done
    - while builtin mapfile -C callback rows; do process "${rows[@]}"; done
    - while IFS= read -r row; do process "$row"; done
    - while mapfile -tn 64 rows && ((${#rows[@]})); do process "${rows[@]}"; done
    - while mapfile -tn 64 rows; ((${#rows[@]})); do process "${rows[@]}"; done
    - while mapfile -tn 64 rows; do ((${#rows[@]})) || break; process "${rows[@]}"; done
    - while mapfile -tn 64 rows; do if ((${#rows[@]} == 0)); then break; fi; process "${rows[@]}"; done
    - while mapfile -t rows; do break 1; done
    - while mapfile -tn 64 rows && [[ ${#rows[@]} -gt 0 ]]; do process "${rows[@]}"; done
    - while readarray -t rows; do return; done
    - while readarray -t rows; do exit 0; done
    - while mapfile -C callback -t rows; do process "${rows[@]}"; done
    - while readarray -tC callback rows; do process "${rows[@]}"; done
    - while mapfile "${options[@]}" rows; do process "${rows[@]}"; done
    - until mapfile -t rows; do recover; done
    - mapfile -t rows < input
    - while mapfile -t rows; do for x in a; do break 2; done; done
    - while mapfile -t rows; do for x in a; do for y in b; do break 2; done; done; done
    - while mapfile -t rows; do for x in a; do break "$levels"; done; done
    - while mapfile -t rows; do produce | break; done
    - while mapfile -t rows; do produce | exit; done
    - while command -v mapfile rows; do process "${rows[@]}"; done
invalid:
    - while mapfile -t rows; do process "${rows[@]}"; done
    - while readarray -tn 64 rows; do process "${rows[@]}"; done
    - while mapfile -t rows < input; do process "${rows[@]}"; done
    - while mapfile -t rows; do process "${rows[@]}"; done < input
    - while mapfile -t -u 3 rows; do process "${rows[@]}"; done
    - while mapfile -t rows; do while pending; do break; done; process "${rows[@]}"; done
    - |
      while mapfile -t rows; do
          # Process the next batch
          process "${rows[@]}"
      done
    - while mapfile -t rows; do f() { return; }; process "${rows[@]}"; done
    - while builtin mapfile -t rows; do process "${rows[@]}"; done
    - while builtin readarray -tn 64 rows; do process "${rows[@]}"; done
    - while mapfile -t rows; do for x in a; do break; done; process "${rows[@]}"; done
    - while mapfile -t rows; do (exit); process "${rows[@]}"; done
    - while mapfile -t rows; do output=$(exit); process "${rows[@]}"; done
    - while mapfile -t rows; do exit | consume; done
    - while mapfile -t rows; do { break; } | consume; done
    - while mapfile -t rows; do exit & done
    - while command mapfile -t rows; do process "${rows[@]}"; done
    - while command -p readarray -tn 64 rows; do process "${rows[@]}"; done
