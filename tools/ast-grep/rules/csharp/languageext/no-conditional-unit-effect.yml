# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-conditional-unit-effect
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    unit-value:
        any:
            - matches: {csharp-type-name: {name: {regex: '^unit$'}}}
            - matches: {csharp-owner-member: {type: {regex: '^Unit$'}, member: {regex: '^Default$'}}}
            - kind: default_expression
              regex: '^default$'
            - kind: default_expression
              has: {field: type, matches: {csharp-type-name: {name: {regex: '^Unit$'}}}}
    unit-argument:
        has: {field: arguments, has: {kind: argument, has: {matches: unit-value}}, not: {has: {kind: argument, nthChild: 2}}}
    unit-effect:
        any:
            - matches: {csharp-type-name: {name: {regex: '^unit(IO|Eff)$'}}}
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    any:
                        - matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^pure$'}}}
                        - matches: {csharp-owner-member: {type: {regex: '^Eff$'}, member: {regex: '^(Pure|Success)$'}}}
                        - matches: {csharp-type-name: {name: {regex: '^SuccessEff$'}}}
                - matches: unit-argument
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^As$'}}, {has: {field: expression, matches: unit-effect}}]}
                - matches: csharp-bare-call
            - kind: cast_expression
              has: {field: value, matches: unit-effect}
            - kind: parenthesized_expression
              has: {matches: unit-effect}
    other-effect:
        pattern: $_
        not: {any: [{matches: unit-effect}, {kind: throw_expression}]}
    lone-return:
        any:
            - kind: return_statement
            - matches: csharp-single-return
    unit-return:
        matches: lone-return
        any:
            - {kind: return_statement, has: {matches: unit-effect}}
            - {kind: block, has: {kind: return_statement, has: {matches: unit-effect}}}
    other-return:
        matches: lone-return
        any:
            - {kind: return_statement, has: {matches: other-effect}}
            - {kind: block, has: {kind: return_statement, has: {matches: other-effect}}}
    bool-arm:
        kind: switch_expression_arm
        not: {has: {kind: when_clause}}
    fallthrough:
        not: {has: {field: alternative, pattern: $_}}
    option-branch:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^Iter$'}}
            - has:
                field: function
                has:
                    field: expression
                    kind: invocation_expression
                    all:
                        - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Filter|Where)$'}}
                        - has: {field: function, has: {field: expression, kind: invocation_expression, matches: {csharp-named-call: {name: {regex: '^Some$'}}}}}
                        - has: {field: arguments, has: {kind: argument, pattern: $CONDITION}, not: {has: {kind: argument, nthChild: 2}}}
rule:
    any:
        - kind: invocation_expression
          all:
            - matches: {csharp-owner-call: {type: {regex: '^IO$'}, member: {regex: '^lift$'}}}
            - has:
                field: arguments
                not: {has: {kind: argument, nthChild: 2}}
                has:
                    kind: argument
                    has:
                        kind: lambda_expression
                        all:
                            - matches: csharp-parameterless
                            - has: {field: body, matches: option-branch}
        - kind: conditional_expression
          all:
            - has: {field: condition, pattern: $CONDITION}
            - any:
                - all: [{has: {field: consequence, matches: unit-effect}}, {has: {field: alternative, matches: other-effect}}]
                - all: [{has: {field: consequence, matches: other-effect}}, {has: {field: alternative, matches: unit-effect}}]
        - kind: if_statement
          all:
            - has: {field: condition, pattern: $CONDITION}
            - any:
                - all:
                    - has: {field: consequence, matches: unit-return}
                    - any: [{has: {field: alternative, matches: other-return}}, {all: [{matches: fallthrough}, {precedes: {matches: other-return}}]}]
                - all:
                    - has: {field: consequence, matches: other-return}
                    - any: [{has: {field: alternative, matches: unit-return}}, {all: [{matches: fallthrough}, {precedes: {matches: unit-return}}]}]
        - kind: switch_expression
          all:
            - has: {nthChild: 1, pattern: $CONDITION}
            - not: {has: {kind: switch_expression_arm, nthChild: 4}}
            - any:
                - all:
                    - has: {matches: bool-arm, nthChild: 2, has: {kind: constant_pattern, regex: '^true$'}}
                    - has: {matches: bool-arm, nthChild: 3, has: {kind: 'constant_pattern, discard', regex: '^(false|_)$'}}
                - all:
                    - has: {matches: bool-arm, nthChild: 2, has: {kind: constant_pattern, regex: '^false$'}}
                    - has: {matches: bool-arm, nthChild: 3, has: {kind: 'constant_pattern, discard', regex: '^(true|_)$'}}
            - any:
                - all:
                    - has: {matches: bool-arm, nthChild: 2, has: {nthChild: 2, matches: unit-effect}}
                    - has: {matches: bool-arm, nthChild: 3, has: {nthChild: 2, matches: other-effect}}
                - all:
                    - has: {matches: bool-arm, nthChild: 2, has: {nthChild: 2, matches: other-effect}}
                    - has: {matches: bool-arm, nthChild: 3, has: {nthChild: 2, matches: unit-effect}}
message: 'Branch on `$CONDITION` pairs a no-op `Unit` effect with another effect'
note: 'Write `when(<condition>, <effect>).As()`, or `unless(<condition>, <effect>).As()` where the effect runs on `false`'
