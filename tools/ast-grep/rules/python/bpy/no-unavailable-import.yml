# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unavailable-import
language: python
severity: error
files:
    - libs/python/rasm/**
    - apps/*/blender/**
utils:
    available:
        regex: |-
            (?x)^(abc|antigravity|argparse|array|ast|asyncio|atexit|base64|bdb|binascii|bisect|builtins|bz2|cProfile|calendar
            |cmath|cmd|code|codecs|codeop|collections|colorsys|compileall|concurrent|configparser|contextlib|contextvars
            |copy|copyreg|csv|ctypes|curses|dataclasses|datetime|dbm|decimal|difflib|dis|doctest|email|encodings|ensurepip
            |enum|errno|faulthandler|fcntl|filecmp|fileinput|fnmatch|fractions|ftplib|functools|gc|genericpath|getopt
            |getpass|gettext|glob|graphlib|grp|gzip|hashlib|heapq|hmac|html|http|imaplib|importlib|inspect|io|ipaddress
            |itertools|json|keyword|linecache|locale|logging|lzma|mailbox|marshal|math|mimetypes|mmap|modulefinder|msvcrt
            |multiprocessing|netrc|nt|ntpath|nturl2path|numbers|opcode|operator|optparse|os|pathlib|pdb|pickle|pickletools
            |pkgutil|platform|plistlib|poplib|posix|posixpath|pprint|profile|pstats|pty|pwd|py_compile|pyclbr|pydoc
            |pydoc_data|pyexpat|queue|quopri|random|re|readline|reprlib|resource|rlcompleter|runpy|sched|secrets|select
            |selectors|shelve|shlex|shutil|signal|site|smtplib|socket|socketserver|sqlite3|sre_compile|sre_constants
            |sre_parse|ssl|stat|statistics|string|stringprep|struct|subprocess|symtable|sys|sysconfig|syslog|tabnanny
            |tarfile|tempfile|termios|textwrap|this|threading|time|timeit|token|tokenize|tomllib|trace|traceback
            |tracemalloc|tty|types|typing|unicodedata|unittest|urllib|uuid|venv|warnings|wave|weakref|webbrowser|winreg
            |winsound|wsgiref|xml|xmlrpc|zipapp|zipfile|zipimport|zlib|zoneinfo
            |numpy|OpenImageIO|PyOpenColorIO
            |expression|httpx2|msgspec|psdtags|tifffile)(\.\w+)*$
rule:
    pattern: $M
    matches: python-imported-module
    not:
        any:
            - kind: dotted_name
              has: {kind: identifier, nthChild: {position: 1, ofRule: {kind: identifier}}, matches: available}
            - kind: string_content
              matches: available
            - matches: python-blender-module
            - kind: dotted_name
              has: {kind: identifier, nthChild: {position: 1, ofRule: {kind: identifier}}, regex: '^rasm$'}
              inside: {kind: import_from_statement, field: module_name}
            - matches: typing-type-checking-block
message: '`$M` resolves in no packed extension, so its import fails inside Blender'
note: 'Use the standard library, a Blender module, bundled numpy, OpenColorIO, or OpenImageIO, a `[project] dependencies` package, or `from rasm.<module> import <name>`, the rasm form pack rewrites to the extension copy'
