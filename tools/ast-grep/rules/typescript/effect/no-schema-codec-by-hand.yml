# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    schema-member:
        kind: member_expression
        has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Schema$'}}}}
    transformation:
        matches: {effect-module: {name: {regex: '(?-u:\b)SchemaTransformation$'}}}
    decode-to:
        kind: call_expression
        has: {field: function, matches: schema-member, has: {field: property, regex: '^decodeTo$'}}
    scalar:
        matches: decode-to
        pattern: $S.decodeTo($S.$_TARGET, $_ST.$_T)
        has:
            field: arguments
            all:
                - has:
                    nthChild: 1
                    has: {field: property, regex: '^(URL|Number|Finite|BigInt|Date|BigDecimal|ByteSize|Uint8Array|String|TimeZoneNamed|TimeZone|DateTimeUtc|DateTimeZoned|Duration)$'}
                - has:
                    nthChild: 2
                    all:
                        - has:
                            field: property
                            regex: |-
                                (?x)^(
                                    numberFromString | bigintFromString | bigDecimalFromString | urlFromString
                                  | dateFromString | dateFromMillis | dateTimeUtcFromString | dateTimeZonedFromString
                                  | durationFromString | durationFromNanos | durationFromMillis
                                  | byteSizeFromString | byteSizeFromBigInt | byteSizeFromNumber
                                  | uint8ArrayFromBase64String | stringFromBase64String | stringFromBase64UrlString | stringFromHexString | stringFromUriComponent
                                  | timeZoneNamedFromString | timeZoneFromString
                                )$
                        - has: {field: object, matches: transformation}
    option:
        kind: call_expression
        pattern: $S.$_WRAP($_X).pipe($S.decodeTo($S.Option($_), $_ST.$_OPTION()))
        all:
            - has: {field: function, has: {field: object, has: {field: function, matches: schema-member, has: {field: property, regex: '^(NullOr|UndefinedOr|NullishOr|optionalKey|optional)$'}}}}
            - has: {field: arguments, has: {matches: decode-to, has: {field: arguments, has: {nthChild: 2, has: {field: function, all: [{has: {field: property, regex: '^optionFrom(NullOr|UndefinedOr|NullishOr|OptionalKey|Optional)$'}}, {has: {field: object, matches: transformation}}]}}}}}
    container:
        kind: call_expression
        any:
            - pattern: $S.String.pipe($S.decodeTo($_X, $_ST.fromJsonString($$$_OPTIONS)))
            - pattern: $S.FormData.pipe($S.decodeTo($_X, $_ST.fromFormData))
            - pattern: $S.URLSearchParams.pipe($S.decodeTo($_X, $_ST.fromURLSearchParams))
            - pattern: $_X.pipe($S.encodeTo($S.String, $_ST.fromJsonString($$$_OPTIONS)))
            - pattern: $_X.pipe($S.encodeTo($S.FormData, $_ST.fromFormData))
            - pattern: $_X.pipe($S.encodeTo($S.URLSearchParams, $_ST.fromURLSearchParams))
        has:
            field: arguments
            has:
                kind: call_expression
                all:
                    - has: {field: function, matches: schema-member}
                    - has: {field: arguments, has: {nthChild: 2, any: [{has: {field: object, matches: transformation}}, {has: {field: function, has: {field: object, matches: transformation}}}]}}
rule:
    kind: call_expression
    any:
        - matches: option
        - matches: scalar
        - matches: container
message: '`Schema` composition restates a codec constructor'
note: 'Pass the `Schema` codec in place of its `decodeTo` or `encodeTo` composition'
