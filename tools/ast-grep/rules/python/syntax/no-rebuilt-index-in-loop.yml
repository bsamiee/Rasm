# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-rebuilt-index-in-loop
language: python
severity: error
rule:
    kind: comparison_operator
    all:
        - matches: python-invariant-index-test
        - has: {nthChild: 2, pattern: $INDEX}
message: 'Loop rebuilds `$INDEX` for every item from a source that does not change between items'
note: 'Build the set or mapping once before the loop and test each item against it'
