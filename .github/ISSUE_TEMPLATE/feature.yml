name: Feature
description: Propose a capability for a product or library
labels: [enhancement]
body:
    - type: input
      id: product
      attributes:
        label: Product
        description: App or library folder under apps/ or libs/
        placeholder: libs/typescript/web/ui
      validations:
        required: true
    - type: textarea
      id: problem
      attributes:
        label: Problem
        description: Task the product cannot do today and the workaround in use
      validations:
        required: true
    - type: textarea
      id: proposal
      attributes:
        label: Proposal
        description: Behavior that solves the problem, with host APIs or packages it uses
