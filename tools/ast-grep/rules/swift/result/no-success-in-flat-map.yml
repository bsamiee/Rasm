# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-success-in-flat-map
language: swift
severity: error
utils:
    lifted-body:
        kind: statements
        all:
            - has:
                nthChild: 1
                any:
                    - {kind: call_expression, pattern: $LIFTED}
                    - {kind: control_transfer_statement, has: {field: result, kind: call_expression, pattern: $LIFTED}}
            - not: {has: {nthChild: 2}}
    unlifted:
        kind: call_expression
        pattern: $LIFTED
        has: {kind: call_suffix, has: {kind: value_arguments, all: [{has: {kind: value_argument, not: {has: {kind: value_argument_label}}, has: {field: value, pattern: $VALUE}}}, {not: {has: {nthChild: 2}}}]}}
    lifting-call:
        kind: call_expression
        all:
            - has: {kind: navigation_expression, all: [{has: {field: target, pattern: $RECEIVER}}, {has: {field: suffix, has: {field: suffix, pattern: $METHOD}}}]}
            - has: {kind: call_suffix, all: [{has: {kind: lambda_literal, has: {matches: lifted-body}}}, {not: {has: {kind: value_arguments}}}]}
    sole-parameter:
        kind: lambda_literal
        any:
            - has:
                kind: lambda_function_type
                has:
                    kind: lambda_function_type_parameters
                    has: {kind: lambda_parameter, has: {field: name, pattern: $PARAMETER}}
                    not: {has: {nthChild: 2}}
            - all:
                - not: {has: {kind: lambda_function_type}}
                - has: {stopBy: end, kind: simple_identifier, regex: '^\$0$', pattern: $PARAMETER}
                - not: {has: {stopBy: end, kind: simple_identifier, regex: '^\$[1-9]'}}
    parameter-argument:
        kind: value_arguments
        all:
            - has:
                kind: value_argument
                all:
                    - has: {field: value, kind: simple_identifier, pattern: $PARAMETER}
                    - any: [{has: {kind: value_argument_label, pattern: $LABEL}}, {not: {has: {kind: value_argument_label}}}]
            - not: {has: {nthChild: 2}}
    named-wrap:
        kind: call_expression
        pattern: $VALUE
        all:
            - has: {nthChild: 1, pattern: $WRAPPER, regex: '^([A-Z]\w*(\.\w+)*|[a-z_]\w*)$'}
            - has: {kind: call_suffix, not: {has: {kind: lambda_literal}}, has: {matches: parameter-argument}}
    case-wrap:
        kind: call_expression
        pattern: $VALUE
        all:
            - has: {nthChild: 1, kind: prefix_expression, has: {field: target, kind: simple_identifier, pattern: $CASE}}
            - has: {kind: call_suffix, not: {has: {kind: lambda_literal}}, has: {matches: parameter-argument}}
    result-type:
        kind: user_type
        regex: '^Result<'
        has:
            kind: type_arguments
            all:
                - has: {nthChild: 1, pattern: $SUCCESS_TYPE}
                - has: {nthChild: 2, pattern: $FAILURE_TYPE}
    typed-result:
        any:
            - inside: {kind: control_transfer_statement, inside: {matches: result-owner, stopBy: {kind: 'lambda_literal, function_declaration, init_declaration, property_declaration'}}}
            - nthChild: 1
              inside: {kind: statements, not: {has: {nthChild: 2}}, inside: {kind: 'function_body, computed_property, computed_getter', inside: {matches: result-owner}}}
            - inside: {kind: property_declaration, has: {kind: type_annotation, has: {field: name, matches: result-type}}}
    result-owner:
        any:
            - {kind: function_declaration, has: {matches: result-type}}
            - {kind: property_declaration, has: {kind: type_annotation, has: {field: name, matches: result-type}}}
rule:
    matches: lifting-call
    pattern: $CALL
    any:
        - all:
            - has: {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^flatMap$'}}}
            - has: {kind: call_suffix, has: {kind: lambda_literal, has: {kind: statements, has: {stopBy: end, pattern: $LIFTED, regex: '^\.success\('}}}}
        - all:
            - has: {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^flatMapError$'}}}
            - has: {kind: call_suffix, has: {kind: lambda_literal, has: {kind: statements, has: {stopBy: end, pattern: $LIFTED, regex: '^\.failure\('}}}}
rewriters:
    - id: named-reference
      rule:
        pattern: $CALL
        has: {kind: call_suffix, has: {matches: sole-parameter, has: {kind: statements, has: {stopBy: end, matches: unlifted, has: {kind: call_suffix, has: {stopBy: end, matches: named-wrap}}}}}}
      transform:
        MAPPED: {replace: {source: $METHOD, replace: '^flatM', by: 'm'}}
        INIT: {replace: {source: $WRAPPER, replace: '^((?:\w+\.)*[A-Z]\w*)$', by: '$1.init'}}
        LABELED: {replace: {source: $LABEL, replace: '^(.+)$', by: '($1:)'}}
      fix: '$RECEIVER.$MAPPED($INIT$LABELED)'
    - id: success-case-reference
      rule:
        pattern: $CALL
        all:
            - has: {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^flatMap$'}}}
            - matches: typed-result
            - has: {kind: call_suffix, has: {matches: sole-parameter, has: {kind: statements, has: {stopBy: end, matches: unlifted, has: {kind: call_suffix, has: {stopBy: end, matches: case-wrap}}}}}}
      transform:
        LABELED: {replace: {source: $LABEL, replace: '^(.+)$', by: '($1:)'}}
      fix: '$RECEIVER.map($SUCCESS_TYPE.$CASE$LABELED)'
    - id: failure-case-reference
      rule:
        pattern: $CALL
        all:
            - has: {kind: navigation_expression, has: {field: suffix, has: {field: suffix, regex: '^flatMapError$'}}}
            - matches: typed-result
            - has: {kind: call_suffix, has: {matches: sole-parameter, has: {kind: statements, has: {stopBy: end, matches: unlifted, has: {kind: call_suffix, has: {stopBy: end, matches: case-wrap}}}}}}
      transform:
        LABELED: {replace: {source: $LABEL, replace: '^(.+)$', by: '($1:)'}}
      fix: '$RECEIVER.mapError($FAILURE_TYPE.$CASE$LABELED)'
    - id: plain-method
      rule:
        kind: simple_identifier
        regex: '^flatMap(Error)?$'
        inside: {kind: navigation_suffix, inside: {kind: navigation_expression, inside: {pattern: $CALL}}}
      transform:
        MAPPED: {replace: {source: $METHOD, replace: '^flatM', by: 'm'}}
      fix: $MAPPED
    - id: unreturned-value
      rule:
        kind: control_transfer_statement
        has: {field: result, matches: unlifted}
      fix: $VALUE
    - id: unlifted-value
      rule: {matches: unlifted}
      fix: $VALUE
transform:
    MAPPED_CALL: {rewrite: {source: $CALL, rewriters: [named-reference, success-case-reference, failure-case-reference, plain-method, unreturned-value, unlifted-value]}}
fix: $MAPPED_CALL
message: '`$METHOD` callback lifts its result back into the Result with `$LIFTED`'
note: '`map` replaces `flatMap { value in .success(<value>) }` and `mapError` replaces `flatMapError { error in .failure(<error>) }`, a callback that wraps its parameter passes the wrapper as a value (`map(Wrapper.init)`, `mapError(Failure.case)`, `mapError(Failure.case(label:))`)'
