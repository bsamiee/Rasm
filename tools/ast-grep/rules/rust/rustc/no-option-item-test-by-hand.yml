# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-option-item-test-by-hand
language: rust
severity: error
files: [tools/dylint/**]
rule:
    kind: call_expression
    all:
        - any:
            - pattern: $X.is_some_and(|$I| $I.$TEST($CX, $NAME))
            - pattern: $X.is_some_and(|&$I| $I.$TEST($CX, $NAME))
        - has: {field: arguments, has: {kind: closure_expression, has: {field: parameters, has: {kind: 'identifier, reference_pattern', pattern: $PARAM}}}}
        - not: {matches: rust-trait-of-assoc-test}
constraints:
    TEST: {regex: '^(is_diag_item|is_lang_item)$'}
transform:
    REFERENCE: {replace: {source: $PARAM, replace: '^[^&].*$', by: ''}}
    COPIED: {replace: {source: $REFERENCE, replace: '^&.*$', by: '.copied()'}}
fix: $X$COPIED.$TEST($CX, $NAME)
message: '`$X.is_some_and(..)` opens the `Option` only to call `$TEST` on its value'
note: 'Call the test on the `Option` through `MaybeDef` (`use clippy_utils::res::MaybeDef as _;`), after `copied()` for an `Option<&T>`'
