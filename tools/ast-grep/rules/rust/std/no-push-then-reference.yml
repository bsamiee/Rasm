# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    code: {not: {kind: 'line_comment, block_comment'}}
    loop-scope: {kind: 'closure_expression, for_expression, while_expression, loop_expression'}
rule:
    kind: 'expression_statement, let_declaration, call_expression, try_expression'
    all:
        - follows: {kind: expression_statement, has: {nthChild: {position: 1, ofRule: {matches: code}}, pattern: $V.$PUSH($$$ARGS)}}
        - inside: {kind: block}
        - any:
            - all:
                - follows: {has: {nthChild: {position: 1, ofRule: {matches: code}}, pattern: $V.push($X)}}
                - any: [{pattern: $V.last_mut()}, {has: {stopBy: {matches: loop-scope}, pattern: $V.last_mut()}}]
            - all:
                - follows: {has: {nthChild: {position: 1, ofRule: {matches: code}}, pattern: $V.push_back($X)}}
                - any: [{pattern: $V.back_mut()}, {has: {stopBy: {matches: loop-scope}, pattern: $V.back_mut()}}]
            - all:
                - follows: {has: {nthChild: {position: 1, ofRule: {matches: code}}, pattern: $V.push_front($X)}}
                - any: [{pattern: $V.front_mut()}, {has: {stopBy: {matches: loop-scope}, pattern: $V.front_mut()}}]
            - all:
                - follows: {has: {nthChild: {position: 1, ofRule: {matches: code}}, pattern: '$V.insert($I, $X)'}}
                - has: {stopBy: {matches: loop-scope}, pattern: '&mut $V[$I]'}
message: '`$V.$PUSH` adds an element the next statement borrows back through a second lookup'
note: 'Bind the `&mut T` that `push_mut`, `insert_mut`, `push_back_mut`, or `push_front_mut` returns and read it at each use'
