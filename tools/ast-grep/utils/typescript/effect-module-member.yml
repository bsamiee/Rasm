# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-module-member
language: tsx
arguments: [module, member]
utils:
    module-object:
        matches: {effect-module: {name: {matches: module}}}
rule:
    kind: member_expression
    all:
        - has: {field: property, matches: member}
        - has: {field: object, matches: module-object}
