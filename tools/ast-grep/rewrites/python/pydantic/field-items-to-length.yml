# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: field-items-to-length
language: python
severity: off
rule:
    kind: identifier
    pattern: $NAME
    inside:
        kind: keyword_argument
        field: name
        inside:
            kind: argument_list
            inside: {matches: python-pydantic-field-call}
            not: {has: {kind: dictionary_splat}}
    any:
        - regex: "^min_items$"
          not:
            inside:
                kind: argument_list
                stopBy: {kind: argument_list}
                has: {kind: keyword_argument, has: {field: name, regex: "^min_length$"}}
        - regex: "^max_items$"
          not:
            inside:
                kind: argument_list
                stopBy: {kind: argument_list}
                has: {kind: keyword_argument, has: {field: name, regex: "^max_length$"}}
transform:
    LENGTH: {replace: {source: $NAME, replace: "_items$", by: "_length"}}
fix: $LENGTH
message: "`$NAME` restates a Pydantic length constraint through its deprecated name"
note: Rename the keyword without changing its value, order, comments, or generated JSON Schema
labels: {NAME: {style: primary, message: Field constraint}}
