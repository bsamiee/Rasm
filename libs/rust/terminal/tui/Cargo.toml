# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-tui"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["tui", "terminal", "keymap"]
categories           = ["command-line-interface"]
description          = "Terminal user interface session with suspend, keymap rows, and a log pane"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
nonempty-collections               = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
serde                              = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-log                        = { workspace = true }
tracing-subscriber                 = { workspace = true }
anstream                           = { workspace = true }
anstyle                            = { workspace = true }
clap                               = { workspace = true }
crossterm                          = { workspace = true }
ratatui                            = { workspace = true }
ratatui-core                       = { workspace = true }
tui-logger                         = { workspace = true }
rasm-cli                           = { workspace = true }
rasm-telemetry                     = { workspace = true, features = ["process"] }

[target."cfg(unix)".dependencies]
rustix = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
