# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-never-arm
language: tsx
severity: error
files: ['**/.claude/plugins/**']
rule:
    any:
        # An arm of a case record, the definition of absurd sits under a declarator and stays out
        - any: [{kind: arrow_function}, {kind: function_expression}]
          inside: {kind: pair, field: value}
        # The method spelling of an arm
        - kind: method_definition
          inside: {kind: object}
    has: {field: parameters, has: {any: [{kind: required_parameter}, {kind: optional_parameter}], has: {field: type, has: {kind: predefined_type, regex: '^never$'}}}}
message: The arm over `never` is written inline, and `absurd` is the one arm a type rules out
note: 'Name `absurd` from composition/decision.ts as the arm, `{ deny: absurd, answer: absurd }`'
