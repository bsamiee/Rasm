# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-byte-hash-constant
language: rust
utils:
    fnv-constant:
        regex: |-
            (?xi)^(?:0x[0_]*(?:
                c_*b_*f_*2_*9_*c_*e_*4_*8_*4_*2_*2_*2_*3_*2_*5
                |1_*0_*0_*0_*0_*0_*0_*0_*1_*b_*3
                |8_*1_*1_*c_*9_*d_*c_*5
                |1_*0_*0_*0_*1_*9_*3
            )
                |1_*4_*6_*9_*5_*9_*8_*1_*0_*3_*9_*3_*4_*6_*6_*5_*6_*0_*3_*7
                |1_*0_*9_*9_*5_*1_*1_*6_*2_*8_*2_*1_*1
                |2_*1_*6_*6_*1_*3_*6_*2_*6_*1
                |1_*6_*7_*7_*7_*6_*1_*9
            )(?:_*[ui](?:32|64|128))?$
    djb2-seed:
        regex: '^5_*3_*8_*1(_*[ui](32|64|128|size))?$'
    thirty-three:
        kind: integer_literal
        regex: '^33(_*[ui](32|64|128|size))?$'
    five:
        kind: integer_literal
        regex: '^5(_*[ui](32|64|128|size))?$'
    shifted:
        any:
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^<<$'}}, {has: {field: right, matches: five}}]
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^wrapping_shl$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: five}}
            - kind: parenthesized_expression
              has: {matches: shifted}
    djb2-step:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^wrapping_mul$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: thirty-three}}
            - kind: 'binary_expression, compound_assignment_expr'
              all: [{has: {field: operator, regex: '^\*=?$'}}, {has: {field: right, matches: thirty-three}}]
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^\+$'}}, {has: {field: left, matches: shifted}}]
            - kind: call_expression
              has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^wrapping_add$'}}, {has: {field: value, matches: shifted}}]}
    djb2-function:
        kind: function_item
        has: {stopBy: end, matches: djb2-step}
rule:
    kind: integer_literal
    any:
        - matches: fnv-constant
        - all:
            - matches: djb2-seed
            - any:
                - inside: {stopBy: {kind: function_item}, matches: djb2-function}
                - inside:
                    kind: 'const_item, static_item'
                    stopBy: end
                    all:
                        - has: {field: name, pattern: $SEED}
                        - inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: djb2-function, has: {stopBy: end, kind: identifier, pattern: $SEED}}}
