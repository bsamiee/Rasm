# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    string-parameter:
        kind: identifier, undefined
        pattern: $X
        all:
            - inside:
                stopBy: end
                matches: typescript-function-boundary
                pattern: $OWNER
                has: {field: parameters, has: {kind: required_parameter, all: [{has: {field: pattern, pattern: $X}}, {has: {field: type, has: {kind: predefined_type, regex: '^string$'}}}]}}
            - matches: {typescript-local-binding: {owner: {pattern: $OWNER}}}
rule:
    kind: template_string
    pattern: $CONVERSION
    all:
        - not: {has: {kind: 'string_fragment, escape_sequence'}}
        - has: {kind: template_substitution, has: {matches: string-parameter}}
        - not: {has: {kind: template_substitution, nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
fix: $X
message: '`$CONVERSION` converts `string` parameter `$X` to `string`'
note: 'Read the parameter directly'
