# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lifted-fallback
language: tsx
severity: error
utils:
    lifted:
        kind: call_expression
        any: [{pattern: $M.$LIFT($V)}, {pattern: $M.$LIFT<$$$_>($V)}]
        not: {has: {field: arguments, has: {kind: spread_element}}}
    lifting-handler:
        kind: arrow_function, function_expression
        all:
            - not: {has: {regex: '^async$'}}
            - not: {has: {field: return_type, kind: type_annotation}}
            - not: {has: {field: parameters, has: {nthChild: 2}}}
            - has:
                field: body
                any:
                    - matches: lifted
                    - kind: parenthesized_expression
                      has: {matches: lifted}
                    - kind: statement_block
                      has: {kind: return_statement, has: {matches: lifted}}
                      not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has:
            field: function
            kind: member_expression
            all:
                - has: {field: object, pattern: $M, matches: {syntax-import-reference: {source: {regex: '^effect(/(Effect|Stream))?$'}, exported: {regex: '^(Effect|Stream)$'}}}}
                - has: {field: property, regex: '^catch$'}
        - has: {field: arguments, pattern: $ARGUMENTS, has: {nthChild: {position: 1, reverse: true}, matches: lifting-handler, pattern: $H}}
        - not: {has: {field: type_arguments, kind: type_arguments}}
        - not: {has: {kind: comment, stopBy: end}}
constraints:
    LIFT: {regex: '^(succeed|fail)$'}
rewriters:
    - id: unlift-object
      rule: {matches: lifted, inside: {pattern: $H, field: body}, has: {field: arguments, has: {kind: object}}}
      fix: ($V)
    - id: unlift
      rule: {matches: lifted, inside: {pattern: $H, stopBy: end}}
      fix: $V
transform:
    SUCCEEDED: replace($LIFT, replace='^succeed$', by='orElseSucceed')
    OPERATION: replace($SUCCEEDED, replace='^fail$', by='mapError')
    HANDLED: rewrite($ARGUMENTS, rewriters=[unlift-object, unlift])
fix: $M.$OPERATION$HANDLED
message: '`$M.catch` handler lifts its result back into `$M`'
note: '`<module>.orElseSucceed(self, (error) => value)` recovers with the value, `<module>.mapError(self, (error) => failure)` replaces the failure'
