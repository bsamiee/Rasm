# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: <rule-id>
language: <language>
severity: error
rule:
    all:
        - pattern: <code with $VAR and $$$ARGS, or $NODE alone binding the matched node, document included, for a transform>
        - has: {kind: <kind>, field: <role>}
        - not: {inside: {kind: <exempting-kind>, stopBy: end}}
message: <violation with captured or transformed values>
note: <required form and its reason>
