# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-http-client-module
language: python
severity: error
rule:
    pattern: $USE
    any:
        - matches: {python-module-use: {module: {regex: '^(http\.client|urllib\.request|urllib3|requests)(\.[\w.]+)?$'}}}
        - kind: dotted_name
          matches: {python-module-member: {module: {regex: "^http$"}, name: {regex: "^client$"}}}
        - kind: dotted_name
          matches: {python-module-member: {module: {regex: "^urllib$"}, name: {regex: "^request$"}}}
message: '`$USE` sends HTTP through a client outside httpx, the form of `httpx.Client` or `httpx.AsyncClient`'
