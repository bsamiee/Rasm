# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-traceback-print
language: python
severity: error
utils:
    exception-class:
        any:
            - matches: {python-module-member: {module: {regex: "^traceback$"}, name: {regex: "^TracebackException$"}}}
            - matches: {python-imported-name: {module: {regex: "^traceback$"}, name: {regex: "^TracebackException$"}}}
rule:
    pattern: $USE
    any:
        - matches: {python-module-member: {module: {regex: "^traceback$"}, name: {regex: "^print_(exc|exception|stack|last|tb|list)$"}}}
        - kind: call
          has:
            field: function
            kind: attribute
            all:
                - has: {field: attribute, regex: "^print$"}
                - has:
                    field: object
                    kind: call
                    has:
                        field: function
                        any:
                            - matches: exception-class
                            - kind: attribute
                              all:
                                - has: {field: attribute, regex: "^from_exception$"}
                                - has: {field: object, matches: exception-class}
message: '`$USE` writes the traceback to stderr outside the structured pipeline, the form of `logger.exception(<event>)` inside the handler or `exc_info=<exception>` outside it'
note: '`stack_info=True` attaches the current stack to an event'
