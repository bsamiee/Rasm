# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-manual-validate-conversion
language: csharp
severity: error
utils:
    raw-argument:
        kind: argument
        nthChild: 1
        not: {has: {regex: '^(out|ref|in)$'}}
    provider-argument:
        kind: argument
        nthChild: 2
        any:
            - has: {field: name, regex: '^provider$'}
            - all:
                - not: {has: {field: name, pattern: $_}}
                - has:
                    any:
                        - kind: null_literal
                        - kind: default_expression
                        - kind: identifier
                          regex: '^(provider|formatProvider|culture)$'
                        - kind: member_access_expression
                          matches: {csharp-owner-member: {type: {regex: '^(CultureInfo|NumberFormatInfo|DateTimeFormatInfo)$'}, member: {regex: '^'}}}
    out-argument:
        kind: argument
        has: {regex: '^out$'}
    keyed-crossing:
        any:
            - all:
                - has:
                    field: function
                    any:
                        - kind: identifier
                          regex: '^Validate$'
                        - kind: member_access_expression
                          has: {field: name, regex: '^Validate$'}
                - has:
                    field: arguments
                    all:
                        - has: {matches: raw-argument}
                        - has: {matches: provider-argument}
                        - has: {nthChild: 3, matches: out-argument}
                        - not: {has: {kind: argument, nthChild: 4}}
            - all:
                - has:
                    field: function
                    any:
                        - kind: identifier
                          regex: '^TryCreate$'
                        - kind: member_access_expression
                          has: {field: name, regex: '^TryCreate$'}
                - has:
                    field: arguments
                    all:
                        - has: {matches: raw-argument}
                        - has: {nthChild: 2, matches: out-argument}
                        - not: {has: {kind: argument, nthChild: 3, not: {matches: out-argument}}}
                        - not: {has: {kind: argument, nthChild: 4}}
    refusal-crossing:
        all:
            - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Error$'}, member: {regex: '^New$'}}}}
            - has:
                field: arguments
                all:
                    - has: {kind: argument, nthChild: 1, has: {matches: {csharp-owner-member: {type: {regex: '^ErrorCodes$'}, member: {regex: '^ValidationFailed$'}}}}}
                    - has: {kind: argument, nthChild: 2, has: {kind: member_access_expression, has: {field: name, regex: '^Message$'}}}
                    - not: {has: {kind: argument, nthChild: 3}}
rule:
    kind: invocation_expression
    pattern: $CROSSING
    any:
        - all:
            - matches: keyed-crossing
            - not:
                any:
                    - inside: {stopBy: end, matches: csharp-validation-hook}
                    - inside: {stopBy: end, kind: method_declaration, has: {field: name, regex: '^Validated?$'}}
        - all:
            - matches: refusal-crossing
            - not: {matches: {csharp-owner-body: {type: {regex: '^Admission$'}, member: {regex: '^Admitted$'}}}}
message: "`$CROSSING` converts a Thinktecture validation answer into a result by hand"
note: Use `<type>.Validated(<raw>)` for a single-key type, `Admission.Validated<T, TKey>(<raw>)` for generic code and types with more than one object factory, and `Admission.Admitted(<type>.Validate(<arguments>, out <type>? value), value)` for a hand-called `Validate`, deleting any helper with the conversion as its body
