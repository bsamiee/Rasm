# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    closure: {kind: 'arrow_function, function_expression, generator_function, function_declaration, generator_function_declaration'}
    scope: {any: [{matches: typescript-control-flow}, {matches: closure}, &declaration {kind: 'function_declaration, generator_function_declaration, method_definition'}]}
    conditioned:
        any:
            - inside: {kind: 'if_statement, while_statement, do_statement, for_statement, ternary_expression', field: condition, stopBy: &scope {matches: scope}}
            - inside: {kind: for_statement, field: initializer, stopBy: *scope}
            - inside: {kind: for_statement, field: increment, stopBy: *scope}
            - inside: {kind: for_in_statement, field: right, stopBy: *scope}
            - inside: {kind: switch_statement, field: value, stopBy: *scope}
    nested-body:
        any:
            - has: {field: body, kind: statement_block, has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}
            - has: {field: body, any: [{matches: typescript-control-flow}, {has: {matches: typescript-control-flow, stopBy: {matches: closure}}}]}
    level:
        any:
            - matches: typescript-control-flow
              not: {matches: conditioned}
            - matches: closure
              all:
                - inside: {matches: typescript-control-flow, stopBy: *declaration}
                - not: {matches: conditioned}
                - matches: nested-body
    boundary: {any: [{matches: level}, *declaration]}
rule:
    kind: &levels 'for_statement, for_in_statement, while_statement, do_statement, switch_statement, if_statement, ternary_expression, arrow_function, function_expression, generator_function, function_declaration, generator_function_declaration'
    all:
        - inside: {stopBy: end, kind: *levels, inside: {stopBy: end, kind: *levels, inside: {stopBy: end, kind: *levels}}}
        - matches: level
        - inside:
            matches: level
            stopBy: {matches: boundary}
            inside:
                matches: level
                stopBy: {matches: boundary}
                inside:
                    matches: level
                    stopBy: {matches: boundary}
                    not: {inside: {matches: level, stopBy: *declaration}}
        - pattern: $SCOPE
transform:
    HEAD: {replace: {source: $SCOPE, replace: '(?s)[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\{?[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level'
note: 'Rebuild nested decisions, loops, or callbacks as one match, lookup, or pipeline over their inputs, with no extracted helper'
labels:
    SCOPE: {style: primary, message: Fourth nesting level}
