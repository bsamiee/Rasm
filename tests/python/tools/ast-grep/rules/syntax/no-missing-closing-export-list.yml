id: no-missing-closing-export-list
valid:
    - |
      def main() -> None: ...


      if __name__ == "__main__":
          main()
    - |
      def pytest_configure(config: Config) -> None: ...
    - |
      def test_read() -> None:
          assert read() == 1
    - |
      class TestRead:
          def test_read(self) -> None: ...
    - |
      import pytest


      @pytest.fixture
      def sample() -> int:
          return 1
    - |
      import pytest


      @pytest.fixture(params=["3.15"])
      def sample(request: pytest.FixtureRequest) -> str:
          return request.param
    - |
      def read() -> int: ...


      __all__ = ["read"]
invalid:
    - |
      def read() -> int: ...
    - |
      def read() -> int: ...


      __all__ = names()
