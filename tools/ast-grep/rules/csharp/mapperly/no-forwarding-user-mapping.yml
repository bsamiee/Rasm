# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-user-mapping
language: csharp
severity: error
utils:
    selected:
        kind: method_declaration
        has:
            kind: attribute_list
            has:
                kind: attribute
                all:
                    - has: {field: name, regex: '^(global::)?(Riok\.Mapperly\.Abstractions\.)?UserMapping(Attribute)?$'}
                    - has: {kind: attribute_argument_list, has: {kind: attribute_argument, all: [{has: {field: name, regex: '^Default$'}}, {has: {kind: boolean_literal, regex: '^false$'}}]}}
    declared-owner:
        any:
            - kind: identifier
              pattern: $TYPE
            - kind: member_access_expression
              has: {field: name, pattern: $TYPE}
        inside:
            stopBy: end
            kind: compilation_unit
            has: {stopBy: end, kind: 'class_declaration, struct_declaration, record_declaration, interface_declaration', has: {field: name, pattern: $TYPE}}
    forward:
        any:
            - pattern: $OWNER.$MEMBER($SOURCE)
              has: {field: function, pattern: $CALLEE}
              not: {has: {field: function, matches: csharp-throwing-factory}}
              any:
                - inside: {stopBy: end, matches: selected}
                - has: {field: function, has: {field: expression, matches: declared-owner}}
            - pattern: $MEMBER($SOURCE)
              has: {field: function, pattern: $CALLEE}
              inside:
                stopBy: end
                kind: declaration_list
                has:
                    kind: method_declaration
                    all:
                        - has: {field: name, pattern: $MEMBER}
                        - not: {has: {field: name, pattern: $NAME}}
rule:
    kind: method_declaration
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: parameters, has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $SOURCE}}, not: {has: {kind: parameter, nthChild: 2}}}
        - has:
            field: body
            any:
                - kind: arrow_expression_clause
                  has: {matches: forward}
                - kind: block
                  has: {kind: return_statement, nthChild: 1, has: {matches: forward}}
                  not: {has: {nthChild: 2}}
        - not: {has: {kind: modifier, regex: '^partial$'}}
        - matches: csharp-mapping-method
constraints:
    OWNER: {regex: '^(global::)?(@?[A-Z]\w*(<.+>)?\.)*@?[A-Z]\w*(<.+>)?$'}
message: 'Mapping method `$NAME` passes `$SOURCE` to `$CALLEE` unchanged'
note: 'Select the owner member through `Use = nameof(@<owner>.<member>)` in place of a `Default = false` forward, or mark a member the repository declares `[UserMapping]` with `[UseStaticMapper(typeof(<owner>))]` for another type, and delete the forwarding method'
