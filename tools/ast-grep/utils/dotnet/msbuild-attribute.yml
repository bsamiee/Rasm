# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: msbuild-attribute # Attribute with a name and a value that pass the slot rules, the value regex sees its delimiters and pins them as ["']
language: xml
arguments: [name, value]
rule:
    kind: Attribute
    all:
        - has: {kind: Name, matches: name}
        - has: {kind: AttValue, matches: value}
