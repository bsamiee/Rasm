# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
rule:
    kind: class_definition
    all:
        - has: {field: name, pattern: $NAME}
        - any:
            - matches: msgspec-struct-frozen-default
            - matches: {msgspec-struct-frozen-option: {value: {kind: 'false'}}}
message: '`$NAME` is a mutable `msgspec.Struct`'
note: 'Declare `frozen=True` on a record, and hold changing state in a slotted class owning its release'
