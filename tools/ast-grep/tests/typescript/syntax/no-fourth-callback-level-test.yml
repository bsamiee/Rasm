id: no-fourth-callback-level
valid:
    # Three callback levels, the fourth arrow is a zero-parameter thunk under Effect.sync
    - 'const three = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.sync(() => z))));'
    # Pair values of an Effect.if branch sit under a pair and add no level
    - 'const branch = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.if(z, { onTrue: () => x, onFalse: () => y }))));'
    # Lazy default and liftPredicate condition as zero-parameter thunks
    - 'const lazy = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Option.getOrElse(z, () => Option.liftPredicate(y, () => x)))));'
    # Method shorthand of an object argument sits under the object and adds no level
    - 'const method = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.if(z, { onTrue(w) { return w; }, onFalse: () => y }))));'
    # Curried return chain under a body, no level added
    - 'const curried = (a) => (b) => (c) => (d) => a;'
    # Variable initializer under a declarator, the pipeline holds data-last steps
    - 'const step = (x) => x.pipe(Array.map((y) => y), Option.map((z) => z), Effect.map((w) => w));'
    # Dependent steps as one yield* each inside Effect.gen
    - |
      const dependent = Effect.gen(function* () {
          const first = yield* Effect.map(xs, (x) => x);
          const second = yield* Effect.map(first, (y) => y);
          return second;
      });
invalid:
    # The instance, an arrow with parenthesized parameters at the fourth level
    - 'const four = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, (w) => w))));'
    # Unparenthesized parameter at every level
    - 'const bare = Effect.map(xs, x => Array.map(x, y => Option.map(y, z => Effect.map(z, w => w))));'
    # Async arrow at the fourth level
    - 'const asynchronous = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, async (w) => w))));'
    # Function expression at the fourth level
    - 'const expression = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, function (w) { return w; }))));'
    # Generator function at the fourth level
    - 'const generator = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, function* (w) { yield w; }))));'
    # Destructured parameter at the fourth level
    - 'const destructured = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, ({ w }) => w))));'
    # Optional parameter at the fourth level
    - 'const optional = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, (w?) => w))));'
    # Arrow wrapped in parentheses at the fourth level
    - 'const wrapped = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, ((w) => w)))));'
    # Arrow under an as cast at the fourth level
    - 'const cast = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, ((w) => w) as Step))));'
    # Arrow under a satisfies check at the fourth level
    - 'const checked = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, ((w) => w) satisfies Step))));'
    # Arrow under a non-null assertion at the fourth level
    - 'const asserted = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, ((w) => w)!))));'
    # Function expression and generator in the middle of the chain
    - 'const mixed = Effect.map(xs, (x) => Array.map(x, function (y) { return Option.map(y, function* (z) { yield Effect.map(z, (w) => w); }); }));'
    # Fifth level, reported once at the innermost callback
    - 'const five = Effect.map(xs, (x) => Array.map(x, (y) => Option.map(y, (z) => Effect.map(z, (w) => Effect.map(w, (v) => v)))));'
