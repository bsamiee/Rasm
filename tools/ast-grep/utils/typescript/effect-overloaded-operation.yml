id: effect-overloaded-operation
language: tsxlang
rule:
    kind: member_expression
    any:
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Array$'}
                member:
                    regex: |-
                        (?x)^(Array
                        |copy
                        |isArray
                        |liftPredicate)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Atom$'}
                member:
                    regex: |-
                        (?x)^(context
                        |fn
                        |fnSync
                        |make
                        |subscriptionRef)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Chunk$'}, member: {regex: '^(isChunk)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Config$'}
                member:
                    regex: |-
                        (?x)^(Array
                        |Record)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Context$'}, member: {regex: '^(Service)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Csv$'}
                member:
                    regex: |-
                        (?x)^(decode
                        |decodeString
                        |encode
                        |encodeString)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Data$'}, member: {regex: '^(taggedEnum)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Effect$'}
                member:
                    regex: |-
                        (?x)^(annotateCurrentSpan
                        |annotateLogsScoped
                        |effectify
                        |fn
                        |fnUntraced
                        |fnUntracedEager
                        |gen
                        |try
                        |tryPromise
                        |useSpan)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)(FiberHandle|FiberMap|FiberSet)$'}, member: {regex: '^(run)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Filter$'}
                member:
                    regex: |-
                        (?x)^(fromPredicate
                        |reason
                        |tagged)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Function$'}
                member:
                    regex: |-
                        (?x)^(dual
                        |flow
                        |pipe)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)GraphQLProtocol$'}
                member:
                    regex: |-
                        (?x)^(layerHttp
                        |makeHttp)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)HashMap$'}, member: {regex: '^(isHashMap)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)HashSet$'}, member: {regex: '^(isHashSet)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Hooks$'}, member: {regex: '^(useAtomValue)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)HttpApiEndpoint$'}
                member:
                    regex: |-
                        (?x)^(delete
                        |get
                        |head
                        |options
                        |patch
                        |post
                        |put
                        |query)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)HttpApiSchema$'}
                member:
                    regex: |-
                        (?x)^(StreamSse
                        |Upgrade
                        |WithHeaders
                        |status)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)HttpMethod$'}, member: {regex: '^(hasBody)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)HttpRouter$'}, member: {regex: '^(middleware)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)HttpServerResponse$'}, member: {regex: '^(html)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Jwk$'}
                member:
                    regex: |-
                        (?x)^(exportPkcs8
                        |exportSpki)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)LanguageModel$'}
                member:
                    regex: |-
                        (?x)^(generateText
                        |streamText)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Latch$'}, member: {regex: '^(whenOpen)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Layer$'}
                member:
                    regex: |-
                        (?x)^(effect
                        |mock
                        |succeed
                        |sync)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Match$'}, member: {regex: '^(typeTags)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)McpClient$'}, member: {regex: '^(toolkit)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)McpServer$'}
                member:
                    regex: |-
                        (?x)^(middleware
                        |registerResource
                        |resource
                        |visibility)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Metric$'}
                member:
                    regex: |-
                        (?x)^(counter
                        |gauge)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)NetAddress$'}, member: {regex: '^(toCanonical)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)(NodeSdk|WebSdk)$'}, member: {regex: '^(layer)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)(PartitionedSemaphore|Semaphore)$'}
                member:
                    regex: |-
                        (?x)^(withPermit
                        |withPermits
                        |withPermitsIfAvailable)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Prompt$'}, member: {regex: '^(Custom)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)RateLimiter$'}, member: {regex: '^(sleep)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)(ChildProcess|Command|RcMap)$'}, member: {regex: '^(make)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)RegExp$'}, member: {regex: '^(RegExp)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Response$'}
                member:
                    regex: |-
                        (?x)^(AllParts
                        |Part
                        |StreamPart)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Result$'}, member: {regex: '^(try)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Schedule$'}, member: {regex: '^(cron)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Schema$'}
                member:
                    regex: |-
                        (?x)^(Graph
                        |decodeTo
                        |encodeTo)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)SchemaGetter$'}
                member:
                    regex: |-
                        (?x)^(parseJson
                        |passthrough)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)SchemaTransformation$'}, member: {regex: '^(passthrough)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)SecureRandom$'}
                member:
                    regex: |-
                        (?x)^(uuidV4Unsafe
                        |uuidV7Unsafe)$
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)Sink$'}
                member:
                    regex: |-
                        (?x)^(find
                        |takeWhile)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Statement$'}, member: {regex: '^(csv)$'}}}
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)TxPriorityQueue$'}, member: {regex: '^(fromIterable)$'}}}
        - matches:
            effect-module-member:
                module: {regex: '(?-u:\b)TxSemaphore$'}
                member:
                    regex: |-
                        (?x)^(withPermit
                        |withPermits)$
        - matches: {effect-module-member: {module: {regex: '(?-u:\b)Unify$'}, member: {regex: '^(unify)$'}}}
