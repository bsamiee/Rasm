# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/**']
utils:
    sorting:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(sort|sortWith|sortBy)$'}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Array$'}, member: {regex: '^(sort|sortWith|sortBy)$'}}}
    sorted:
        kind: call_expression
        any:
            - has: {field: function, pattern: $SORT, matches: sorting}
            - has: {field: function, kind: call_expression, has: {field: function, pattern: $SORT, matches: sorting}}
    native-sorted:
        kind: call_expression
        has: {field: function, kind: member_expression, pattern: $SORT, has: {field: property, regex: '^(sort|toSorted)$'}}
    end:
        kind: member_expression
        all:
            - has: {field: property, regex: '^(head|headNonEmpty|last|lastNonEmpty|take|takeRight)$'}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Array$'}, member: {regex: '^(head|headNonEmpty|last|lastNonEmpty|take|takeRight)$'}}}
rule:
    any:
        - kind: call_expression
          all:
            - has: {field: function, matches: end}
            - any:
                - has: {field: arguments, has: {nthChild: 1, matches: sorted}, not: {has: {nthChild: 2}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: sorted}}, {has: {nthChild: 2, regex: '^1$'}}, {not: {has: {nthChild: 3}}}]}
            - not: {all: [{has: {field: function, has: {field: property, regex: '^take'}}}, {not: {has: {field: arguments, has: {nthChild: 2}}}}]}
        - kind: member_expression
          all:
            - matches: end
            - not: {has: {field: property, regex: '^take'}}
            - inside: {kind: arguments}
            - follows: {stopBy: {not: {regex: '^,$'}}, kind: call_expression, has: {field: function, pattern: $SORT, matches: sorting}, not: {has: {field: arguments, has: {nthChild: 2}}}}
        - kind: call_expression
          all:
            - any: [{matches: native-sorted}, {matches: sorted}]
            - matches: typescript-extremum-read
message: '`$SORT` sorts a whole list to read one extremum'
note: 'Call `Array.min(<list>, <order>)` or `Array.max` on a list `Array.isReadonlyArrayNonEmpty` or `Option.liftPredicate` narrows to non-empty'
