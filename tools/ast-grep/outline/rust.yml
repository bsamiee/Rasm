          all: [{inside: {kind: impl_item, field: type, all: [{matches: holding}, {matches: declared}, {matches: enclosing}, {inside: {stopBy: end, kind: impl_item}}, {any: [{has: {regex: '^!$', not: {kind: never_type}, pattern: $$NEGATION}}, {kind: impl_item}]}, {any: [{has: {field: trait, matches: implemented}}, {kind: impl_item}]}, {matches: declaration}]}}, {matches: target}]
