# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-expression-in-run-step
language: yaml
severity: error
files: ['.github/workflows/**', '**/action.{yml,yaml}']
utils:
    key:
        kind: plain_scalar, single_quote_scalar, double_quote_scalar
        pattern: $KEY
    expression-source:
        regex: '\$\{\{'
        any:
            - kind: flow_node
            - kind: block_node
              has: {kind: block_scalar}
    input:
        kind: block_mapping_pair, flow_pair
        has: {field: key, regex: '^(with|"with"|''with'')$'}
rule:
    kind: block_mapping_pair, flow_pair
    all:
        - has:
            field: value
            any:
                - matches: expression-source
                - kind: flow_node
                  has: {kind: alias, has: {kind: alias_name, pattern: $ANCHOR}}
                  inside:
                    kind: document
                    stopBy: end
                    has:
                        stopBy: end
                        matches: expression-source
                        has: {kind: anchor, has: {kind: anchor_name, pattern: $ANCHOR}}
        - any:
            - all:
                - has: {field: key, regex: '^(run|"run"|''run'')$', has: {matches: key, stopBy: end}}
                - not: {inside: {matches: input, stopBy: end}}
            - all:
                - has: {field: key, regex: '^(script|"script"|''script'')$', has: {matches: key, stopBy: end}}
                - inside:
                    matches: input
                    stopBy: end
                    inside:
                        kind: block_mapping, flow_mapping
                        has:
                            kind: block_mapping_pair, flow_pair
                            all:
                                - has: {field: key, regex: '^(uses|"uses"|''uses'')$'}
                                - has: {field: value, regex: '^["'']?actions/github-script@'}
message: '`$KEY` holds a `${{ }}` expression GitHub splices into code text before a shell or script parses it'
note: 'Set step `env: {<NAME>: ''${{ <expression> }}''}` and read `"$<NAME>"` in bash, `$env:<NAME>` in pwsh, or `process.env.<NAME>` in `script`'
