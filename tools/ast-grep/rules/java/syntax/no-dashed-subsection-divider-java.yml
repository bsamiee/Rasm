# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-dashed-subsection-divider-java
language: java
severity: error
rule:
    kind: line_comment
    pattern: $DIVIDER
    inside: {matches: java-member-list}
    matches: text-section-divider
transform:
    FAMILY: {replace: {source: $DIVIDER, replace: '\s+-+$', by: ''}}
message: Family divider `$DIVIDER` inside an owner holds the dashes of a section divider
note: Use `// --- [<FAMILY>]`, dashes to column 90 mark a file-level section
fix: $FAMILY
