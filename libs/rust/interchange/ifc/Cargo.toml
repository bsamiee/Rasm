# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-ifc"
edition.workspace = true
description       = "IFC5 models: IFCX layers and imports, composition, schema validation, spatial and systems graphs, alignments, and geometry"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path = "lib.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures              = { workspace = true }
tokio                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
derive_more          = { workspace = true }
strum                = { workspace = true }
hashbrown            = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
bytes                = { workspace = true }
data-encoding        = { workspace = true }
serde                = { workspace = true, features = ["rc"] }
serde_json           = { workspace = true }
serde_path_to_error  = { workspace = true }
serde_with           = { workspace = true }
nutype               = { workspace = true }
jiff                 = { workspace = true }
fs-err               = { workspace = true, features = ["tokio"] }
aws-lc-rs            = { workspace = true }
reqwest              = { workspace = true }
url                  = { workspace = true }
gauss-quad           = { workspace = true }
nalgebra             = { workspace = true }
uom                  = { workspace = true }
petgraph             = { workspace = true }
parry3d-f64          = { workspace = true }
pcd-rs               = { workspace = true }
color                = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
