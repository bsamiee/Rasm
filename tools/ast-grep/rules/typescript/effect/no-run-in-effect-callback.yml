# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    run-invocation:
        kind: call_expression
        has:
            field: function
            any:
                - matches: {typescript-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)$'}}}
                - kind: member_expression
                  all:
                    - has: {field: property, regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)$'}
                    - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
                - kind: call_expression
                  has:
                    field: function
                    any:
                        - matches: {typescript-import-reference: {source: {regex: '^effect/Effect$'}, exported: {regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)With$'}}}
                        - kind: member_expression
                          all:
                            - has: {field: property, regex: '^run(Promise|PromiseExit|Sync|SyncExit|Fork|Callback)With$'}
                            - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
    effect-combinator:
        kind: call_expression
        any:
            - has:
                field: function
                kind: member_expression
                all:
                    - has:
                        field: object
                        matches:
                            effect-module:
                                name:
                                    regex: |-
                                        (?x)(?-u:\b)(Effect|Stream|Layer|Channel|Sink|Schedule|Ref|SynchronizedRef|SubscriptionRef|TxRef|Cache|ScopedCache
                                        |Pool|RcMap|RcRef|Resource|ScopedRef|PubSub|Queue|Deferred|Fiber|FiberMap|FiberSet|FiberHandle|Request
                                        |RequestResolver|Logger|Metric)$
                    - not:
                        all:
                            - has: {field: property, regex: '^run'}
                            - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Effect$'}}}}
            - has: {field: function, kind: call_expression, matches: effect-combinator}
    callback:
        matches: typescript-function-boundary
        any:
            - inside: {kind: arguments}
            - inside: {kind: pair, field: value, inside: {kind: object, inside: {kind: arguments}}}
            - kind: method_definition
              inside: {kind: object, inside: {kind: arguments}}
rule:
    kind: call_expression
    all:
        - has:
            field: arguments
            has:
                stopBy: {not: {kind: 'object, pair'}}
                matches: callback
                has:
                    stopBy: {matches: typescript-function-boundary}
                    matches: run-invocation
                    pattern: $RUN
                    not: {inside: {matches: effect-generator-function, stopBy: end}}
        - matches: effect-combinator
transform:
    RUN_HEAD: {replace: {source: $RUN, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$RUN_HEAD` starts a separate runtime inside an effect callback'
note: 'Return the effect from its callback, through `flatMap` in place of `map` and `suspend` in place of `sync` or `promise`'
labels:
    RUN: {style: primary}
