# --- [PACKAGE] --------------------------------------------------------------------------

# --- [IDENTITY]
[package]
name              = "lints"
edition.workspace = true
description       = "Lints over types and resolved paths Clippy cannot see"
publish           = false

# --- [RUST_ANALYZER]
[package.metadata.rust-analyzer]
rustc_private = true

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path       = "lib.rs"
test       = false
doctest    = false
bench      = false
crate-type = ["cdylib"]

# --- [EXAMPLE]
[[example]]
name       = "foreign_error_return"
crate-type = ["lib"]

[[example]]
name       = "forwarding_newtype_exported"
crate-type = ["lib"]

[[example]]
name       = "needless_boxed_future_exported"
crate-type = ["lib"]

[[example]]
name       = "needless_reference_field_exported"
crate-type = ["lib"]

[[example]]
name       = "optional_channel_sender_exported"
crate-type = ["lib"]

[[example]]
name       = "primitive_domain_binding_exported"
crate-type = ["lib"]

[[example]]
name       = "single_reader_exported"
crate-type = ["lib"]

[[example]]
name       = "unparsed_field_exported"
crate-type = ["lib"]

[[example]]
name       = "untyped_error_exported"
crate-type = ["lib"]

# --- [TEST]
[[test]]
name = "ui"
path = "../../tests/rust/tools/dylint/main.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
derive-where   = { workspace = true }
derive_more    = { workspace = true }
strum          = { workspace = true }
itertools      = { workspace = true }
clippy_utils   = { workspace = true }
dylint_linting = { workspace = true }

# --- [TESTING]
[dev-dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
tokio-util                         = { workspace = true }
anyhow                             = { workspace = true }
nonempty-collections               = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
indexmap                           = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
uuid                               = { workspace = true }
fs-err                             = { workspace = true }
rmcp                               = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
tracing                            = { workspace = true }
clap                               = { workspace = true }
cargo_metadata                     = { workspace = true }
insta                              = { workspace = true }
rasm-mcp                           = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
