# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-copy-task-into-output
language: xml
severity: error
rule:
    all:
        # Copy and Move take the same destination parameters
        - matches: {msbuild-element: {name: {regex: '^(Copy|Move)$'}}}
        - matches: {msbuild-metadata: {name: {regex: '^Destination(Folder|Files)$'}, value: {regex: '\$\((OutDir|OutputPath|TargetDir)\)'}}}
message: >-
    The Copy or Move task into the output directory reaches the project's own bin alone, a referencing project and dotnet publish never receive
    the file
note: Declare the file as a None or Content item with CopyToOutputDirectory
