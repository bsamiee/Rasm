# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-box-overlap-by-hand
language: rust
severity: error
utils:
    comparison:
        kind: binary_expression
        has: {field: operator, regex: '^(<|<=|>|>=)$'}
    nested:
        matches: comparison
        all:
            - has:
                kind: field_expression
                all:
                    - has: {field: field, pattern: $X}
                    - has: {field: value, kind: field_expression, all: [{has: {field: field, regex: '^mins?$'}}, {has: {field: value, pattern: $A}}]}
            - has:
                kind: field_expression
                all:
                    - has: {field: field, pattern: $X}
                    - has: {field: value, kind: field_expression, all: [{has: {field: field, regex: '^maxs?$'}}, {has: {field: value, pattern: $B, not: {pattern: $A}}}]}
    nested-mirror:
        matches: comparison
        all:
            - has: {kind: field_expression, all: [{has: {field: field, pattern: $X}}, {has: {field: value, kind: field_expression, all: [{has: {field: field, regex: '^mins?$'}}, {has: {field: value, pattern: $B}}]}}]}
            - has: {kind: field_expression, all: [{has: {field: field, pattern: $X}}, {has: {field: value, kind: field_expression, all: [{has: {field: field, regex: '^maxs?$'}}, {has: {field: value, pattern: $A}}]}}]}
    flat:
        matches: comparison
        all:
            - has: {kind: field_expression, all: [{has: {field: field, regex: '^(min_?[xyz]|[xyz]_?min|left|top)$', pattern: $LO}}, {has: {field: value, pattern: $A}}]}
            - has: {kind: field_expression, all: [{has: {field: field, regex: '^(max_?[xyz]|[xyz]_?max|right|bottom)$', pattern: $HI}}, {has: {field: value, pattern: $B, not: {pattern: $A}}}]}
    flat-mirror:
        matches: comparison
        all:
            - has: {kind: field_expression, all: [{has: {field: field, pattern: $LO}}, {has: {field: value, pattern: $B}}]}
            - has: {kind: field_expression, all: [{has: {field: field, pattern: $HI}}, {has: {field: value, pattern: $A}}]}
    joined:
        kind: binary_expression
        has: {field: operator, regex: '^(&&|\|\|)$'}
    extent-comparison:
        matches: comparison
        has: {kind: field_expression, regex: '\.(mins?|maxs?)\.\w+$|\.(min_?[xyz]|[xyz]_?min|max_?[xyz]|[xyz]_?max|left|right|top|bottom)$'}
    low-extent:
        kind: field_expression
        regex: '\.mins?\.\w+$|\.(min_?[xyz]|[xyz]_?min|left|top)$'
    high-extent:
        kind: field_expression
        regex: '\.maxs?\.\w+$|\.(max_?[xyz]|[xyz]_?max|right|bottom)$'
    interval:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^(<|<=)$'}
            - has:
                field: left
                kind: call_expression
                all:
                    - has:
                        field: function
                        kind: field_expression
                        all:
                            - has: {field: field, regex: '^max$'}
                            - has:
                                field: value
                                matches: low-extent
                                any:
                                    - {regex: '\.mins?\.\w+$', has: {field: value, has: {field: value, pattern: $A}}}
                                    - {not: {regex: '\.mins?\.\w+$'}, has: {field: value, pattern: $A}}
                    - has:
                        field: arguments
                        has:
                            nthChild: 1
                            matches: low-extent
                            any:
                                - {regex: '\.mins?\.\w+$', has: {field: value, has: {field: value, pattern: $B}}}
                                - {not: {regex: '\.mins?\.\w+$'}, has: {field: value, pattern: $B}}
            - has: {field: right, kind: call_expression, all: [{has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^min$'}}, {has: {field: value, matches: high-extent}}]}}, {has: {field: arguments, has: {nthChild: 1, matches: high-extent}}}]}
rule:
    kind: binary_expression
    any:
        - matches: joined
          not: {inside: {matches: joined, has: {field: right, matches: extent-comparison}}}
          any:
            - all:
                - has: {field: right, matches: nested}
                - has: {field: left, any: [{matches: nested-mirror}, {matches: joined, has: {field: right, matches: nested-mirror}}]}
            - all:
                - has: {field: right, matches: flat}
                - has: {field: left, any: [{matches: flat-mirror}, {matches: joined, has: {field: right, matches: flat-mirror}}]}
        - matches: interval
message: 'Expression compares extents of boxes `$A` and `$B` by hand to test overlap'
note: 'Hold the boxes as `parry3d_f64::bounding_volume::Aabb` with `BoundingVolume::intersects`, `rstar::AABB` with `Envelope::intersects`, or `geo::Rect` with `geo::Intersects::intersects`'
