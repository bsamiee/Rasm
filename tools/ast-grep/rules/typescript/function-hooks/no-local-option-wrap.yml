# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-local-option-wrap
language: tsx
severity: error
files: ['plugins/*/hooks/**']
utils:
    constructor:
        kind: identifier
        matches: {syntax-import-reference: {source: {regex: 'composition\.ts$'}, exported: {regex: '^(fromUndefined|some|none)$'}}}
    constructed:
        any:
            - kind: call_expression
              has: {field: function, matches: constructor, regex: '^(fromUndefined|some)$'}
            - kind: identifier
              matches: constructor
              regex: '^none$'
            - kind: ternary_expression
              all: [{has: {field: consequence, matches: constructed}}, {has: {field: alternative, matches: constructed}}]
            - kind: 'parenthesized_expression, await_expression'
              has: {matches: constructed}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^then$'}}
                - has: {field: arguments, has: {matches: syntax-function-boundary}}
                - not: {has: {field: arguments, has: {matches: syntax-function-boundary, not: {matches: returning-constructed}}}}
    returning-constructed:
        matches: syntax-function-boundary
        any:
            - has: {field: body, matches: constructed}
            - has:
                field: body
                kind: statement_block
                all:
                    - has: {stopBy: {matches: syntax-function-boundary}, kind: return_statement}
                    - not: {has: {stopBy: {matches: syntax-function-boundary}, kind: return_statement, not: {has: {matches: constructed}}}}
    tested:
        kind: binary_expression
        any:
            - pattern: "$O.kind === 'some'"
            - pattern: "$O.kind !== 'some'"
            - pattern: "$O.kind === 'none'"
            - pattern: "$O.kind !== 'none'"
rewriters:
    - id: unwrapped-value
      rule: {kind: call_expression, pattern: $F($A), has: {field: function, matches: constructor}}
      fix: $A
    - id: unwrapped-absence
      rule: {kind: identifier, matches: constructed}
      fix: undefined
    - id: present
      rule: {kind: binary_expression, any: [{pattern: "$O.kind === 'some'"}, {pattern: "$O.kind !== 'none'"}]}
      fix: $O !== undefined
    - id: absent
      rule: {kind: binary_expression, any: [{pattern: "$O.kind === 'none'"}, {pattern: "$O.kind !== 'some'"}]}
      fix: $O === undefined
    - id: read
      rule: {kind: member_expression, pattern: $O.value}
      fix: $O
    - id: rest
      rule: {pattern: $S, follows: {stopBy: end, pattern: $DECLARATION}}
      transform:
        REWRITTEN: {rewrite: {source: $S, rewriters: [present, absent, read]}}
      fix: $REWRITTEN
    - id: declared
      rule:
        pattern: $DECLARATION
        all:
            - has: {field: kind, pattern: $$KIND}
            - has: {kind: variable_declarator, all: [{has: {field: name, pattern: $O}}, {has: {field: value, pattern: $VALUE}}]}
            - inside: {kind: statement_block, pattern: $BLOCK}
      transform:
        UNWRAPPED: {rewrite: {source: $VALUE, rewriters: [unwrapped-value, unwrapped-absence]}}
        REST: {rewrite: {source: $BLOCK, rewriters: [rest], joinBy: "\n"}}
      fix: "$KIND $O = $UNWRAPPED;\n$REST"
    - id: inline-present
      rule: {kind: binary_expression, any: [{pattern: "$O.kind === 'some'"}, {pattern: "$O.kind !== 'none'"}]}
      fix: ($E) !== undefined
    - id: inline-absent
      rule: {kind: binary_expression, any: [{pattern: "$O.kind === 'none'"}, {pattern: "$O.kind !== 'some'"}]}
      fix: ($E) === undefined
rule:
    any:
        - kind: lexical_declaration
          pattern: $DECLARATION
          all:
            - has: {field: kind, pattern: $$KIND}
            - has: {kind: variable_declarator, all: [{has: {field: name, kind: identifier, pattern: $O}}, {not: {has: {field: type, kind: type_annotation}}}, {has: {field: value, matches: constructed, pattern: $VALUE}}]}
            - not: {has: {kind: variable_declarator, nthChild: 2}}
            - inside: {kind: statement_block, pattern: $BLOCK}
            - not: {precedes: {stopBy: end, has: {stopBy: end, pattern: $O, not: {any: [{inside: {kind: member_expression, field: object, pattern: $O.value}}, {inside: {kind: member_expression, field: object, inside: {matches: tested}}}]}}}}
        - kind: binary_expression
          pattern: $INLINE
          all:
            - matches: tested
            - has: {field: left, has: {field: object, kind: call_expression, pattern: $_F($E), has: {field: function, matches: constructor, regex: '^fromUndefined$'}}}
transform:
    DECLARED: {rewrite: {source: $DECLARATION, rewriters: [declared]}}
    TESTED: {rewrite: {source: $INLINE, rewriters: [inline-present, inline-absent]}}
message: '`$O` wraps a value in an Option the function unwraps without passing on, an `undefined` test reads it directly'
note: 'Option carries absence across a function boundary, absence that stays inside one function reads as `<value> === undefined` and the value itself'
fix:
    template: $DECLARED$TESTED
    expandEnd: {stopBy: end, pattern: $_LAST, inside: {kind: statement_block}, nthChild: {position: 1, reverse: true}}
