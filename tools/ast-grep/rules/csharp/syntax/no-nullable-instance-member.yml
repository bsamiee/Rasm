# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nullable-instance-member
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    serializer-attributes:
        kind: attribute_list
        has:
            kind: attribute
            has:
                field: name
                regex: |-
                    (?x)^(global::)?((System\.(Text\.Json\.Serialization|Runtime\.Serialization|Xml\.Serialization)|MessagePack|Newtonsoft\.Json)\.)?
                    (Json\w*|DataMember|Key|Xml\w*)(Attribute)?$
                not: {regex: 'Ignore'}
    declared-parameter:
        kind: attribute_list
        has: {kind: attribute, has: {field: name, regex: '^((global::)?System\.ComponentModel\.DataAnnotations\.)?(Display|Range)(Attribute)?$'}}
    stored-record:
        kind: record_declaration
        inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                any:
                    - kind: attribute
                      has: {field: name, regex: '^JsonSerializable(Attribute)?$'}
                    - kind: invocation_expression
                      has: {field: function, regex: '^ArchivableDictionaries\.Json\b'}
    atomic-ref:
        kind: argument
        regex: '^ref\s'
        inside: {kind: argument_list, inside: {kind: invocation_expression, matches: {csharp-owner-call: {type: {regex: '^(Interlocked|Volatile)$'}, member: {regex: '^'}}}}}
    atomic-field:
        all:
            - has: {kind: variable_declarator, has: {field: name, pattern: $FIELD}}
            - inside:
                stopBy: end
                kind: declaration_list
                all:
                    - has: {stopBy: end, kind: identifier, pattern: $FIELD, inside: {stopBy: end, matches: atomic-ref}}
                    - not:
                        has:
                            stopBy: end
                            kind: identifier
                            pattern: $FIELD
                            not:
                                any:
                                    - inside: {stopBy: end, kind: field_declaration}
                                    - inside: {stopBy: end, matches: atomic-ref}
rule:
    matches: csharp-instance-member
    all:
        - has:
            field: type
            pattern: $TYPE
            any:
                - kind: nullable_type
                - kind: 'generic_name, qualified_name'
                  matches: {csharp-type-name: {name: {regex: '^Nullable$'}}}
        - not:
            any:
                - has: {matches: serializer-attributes}
                - has: {matches: declared-parameter}
                - inside: {stopBy: end, matches: stored-record}
                - matches: atomic-field
                - inside: {stopBy: end, matches: csharp-json-serializable-record}
                - inside: {kind: field_declaration, has: {matches: serializer-attributes}}
                - inside: {kind: 'parameter_list, declaration_list', inside: {matches: languageext-error-record}}
                - inside: {kind: field_declaration, inside: {kind: declaration_list, inside: {matches: languageext-error-record}}}
message: 'Member typed `$TYPE` states absence with null'
note: 'Hold `Option<T>` converted once at the boundary through `Optional`, declared parameters and stored records keep nullable shape System.Text.Json reads'
