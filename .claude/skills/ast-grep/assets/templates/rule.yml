# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: <rule-id> # Imperative grammar: no-<construct> / require-<shape>, defaults to the filename stem when omitted
language: <language>
severity: error
files: ['<scope-glob>'] # Relative to sgconfig.yml without a ./ prefix, string glob or {glob, caseInsensitive}
ignores: ['<boundary-glob>'] # Tested before files and the one exclusion channel, a !-negated glob inside files: is inert
utils:
    <util-id>:
        any:
            - {kind: <kind-a>}
            - {kind: <kind-b>}
rule:
    all: # Explicit all: capture order matters, the defining pattern comes first
        - pattern: <code with $VAR and $$$ARGS>
        - matches: <util-id>
        - has: {kind: <kind>, field: <role>, stopBy: end}
        - not: {inside: {kind: <exempting-kind>, stopBy: end}}
constraints:
    <VAR>: {regex: '<grammar>'} # Post-rule filter on a single-node capture
transform:
    <NEW>: <op>($VAR, <key>=<value>) # op: replace | substring | convert | rewrite
fix: <template referencing $VAR and $NEW> # Only when the repair is mechanical
message: <one line naming the violation>
note: <the exact repair, the shape to produce>
labels:
    <VAR>: {style: primary, message: '<span fact>'} # rule/constraints vars only, a rule carrying fix: renders the diff
metadata:
    <key>: <routing-fact> # Appears under --json --include-metadata
---
id: <sibling-rule-id> # One topic file carries the rule family, rules split by ---
language: <language>
severity: error
rule: <rule>
message: <why>
note: <repair>
