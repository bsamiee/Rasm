# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: generic_name
    pattern: $TEST
    regex: '^IsType[\p{White_Space}\x{FEFF}]*<[\p{White_Space}\x{FEFF}]*((global::)?Thinktecture\.)?ValidationError[\p{White_Space}\x{FEFF}]*>$'
    inside: {kind: member_access_expression, field: name}
message: '`$TEST` tests the Thinktecture default error in place of the package error'
note: 'Declare `[ValidationError<T>]` with the package error type and branch on its `Reason`'
