# --- [PROJECT] --------------------------------------------------------------------------

[project]
name = "rasm-contracts"
version = "0.1.0"
description = "Rasm wire contracts: generated protobuf-py bindings and Connect service surfaces."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "connectrpc",   # generated Connect service ABCs and clients
    "protobuf-py",  # Buf protobuf runtime under the generated _pb.py bindings
]

# --- [BUILD] ----------------------------------------------------------------------------

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]  # The whole package is emission: gen/python is the one source root, and rasm/contracts is a PEP 420 portion beneath it.
module-root = "gen/python"
module-name = "rasm.contracts"
namespace = true
