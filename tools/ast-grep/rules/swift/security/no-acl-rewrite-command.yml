# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-acl-rewrite-command
language: swift
severity: error
rule:
    any:
        - all:
            - matches: {swift-security-arguments: {subcommand: {regex: '^"add-(generic|internet)-password"$', pattern: $COMMAND}}}
            - has: {kind: line_string_literal, regex: '^"-(T|A)"$'}
        - kind: line_string_literal
          all:
            - has: {kind: line_str_text, regex: '^add-(generic|internet)-password( |$)', pattern: $COMMAND}
            - has: {kind: line_str_text, regex: '(^| )-(T|A)( |$)'}
        - kind: line_str_text
          regex: 'set-(generic-password|internet-password|key)-partition-list'
          pattern: $COMMAND
message: '`$COMMAND` rewrites an item ACL or partition list the owning program''s next write restores'
note: 'Write through `add-generic-password -U` with no `-T` or `-A` and leave partition lists to the owning program'
