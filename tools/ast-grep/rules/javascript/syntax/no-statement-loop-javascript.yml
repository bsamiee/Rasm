# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-javascript
language: javascript
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
          not: {has: {regex: '^await$'}}
        - kind: for_statement, while_statement, do_statement
message: Loop iterates by statement
note: 'Call `<list>.map(<f>)` or `<list>.flatMap(<f>)` for values per element, `<list>.reduce(<f>, <initial>)` to fold elements into one value, or `<list>.forEach(<f>)` for a host call per element'
labels:
    LOOP: {style: primary}
