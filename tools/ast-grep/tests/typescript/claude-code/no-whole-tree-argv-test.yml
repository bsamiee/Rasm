id: no-whole-tree-argv
valid:
    # The path in the argv, the scan over the edited file
    - |
      const SCAN = [{ match: _isFamily, argv: (path): readonly string[] => ['ast-grep', 'scan', '--json=compact', path] }];
    # The stem in a filter, the test over the edited rule alone
    - |
      const SCAN = [{ match: _isTree, argv: (path): readonly string[] => ['ast-grep', 'test', '--include-off', '--filter', `^${stem(path)}$`] }];
    # A filter over ids the row computes, the path discarded
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'test', '--include-off', '--filter', callers] }];
    # Files flag with the path discarded
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'scan', '--files', changed] }];
    # Command outside test and scan with the path discarded
    - |
      const SCAN = [{ match: _isTree, argv: (_path): readonly string[] => ['ast-grep', '--version'] }];
    # Key outside argv
    - |
      const SCAN = [{ match: _isTree, lines: (_path): readonly string[] => ['ast-grep', 'test'] }];
    # Path parameter read under a plain name in a block body
    - |
      const SCAN = [{ match: _isTree, argv: (path): readonly string[] => { return ['ast-grep', 'test', '--filter', stem(path)]; } }];
    # Second parameter discarded, the path itself read
    - |
      const SCAN = [{ match: _isFamily, argv: (path, _facts): readonly string[] => ['ast-grep', 'scan', '--json=compact', path] }];
    # Filter inside a block body with the path discarded
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => { return ['ast-grep', 'test', '--filter', callers]; } }];
    # Filter spelled in a template with the path discarded
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'test', `--filter=${callers}`] }];
    # Short filter flag with the path discarded
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'test', '-f', callers] }];
    # Attached filter value
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'test', '--filter=^no-eval$'] }];
    # Method spelling under a key outside argv
    - |
      const SCAN = [{ match: _isTree, lines(_path): readonly string[] { return ['ast-grep', 'test']; } }];
invalid:
    # The instance, a util edit runs every test
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'test', '--include-off'] }];
    # Untyped discarded parameter
    - |
      const SCAN = [{ match: _isUtil, argv: (_path) => ['ast-grep', 'test', '--include-off'] }];
    # Bare discarded parameter
    - |
      const SCAN = [{ match: _isUtil, argv: _path => ['ast-grep', 'test'] }];
    # Scan over the whole tree
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'scan', '--json=compact'] }];
    # Underscore alone as the parameter
    - |
      const SCAN = [{ match: _isUtil, argv: (_): readonly string[] => ['ast-grep', 'test'] }];
    # Block body returning the whole-tree argv
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => { return ['ast-grep', 'test', '--include-off']; } }];
    # String key
    - |
      const SCAN = [{ match: _isUtil, 'argv': (_path): readonly string[] => ['ast-grep', 'test'] }];
    # Function expression as the row's argv
    - |
      const SCAN = [{ match: _isUtil, argv: function (_path): readonly string[] { return ['ast-grep', 'test']; } }];
    # Method spelling of the row's argv
    - |
      const SCAN = [{ match: _isUtil, argv(_path): readonly string[] { return ['ast-grep', 'test']; } }];
    # Scan over a literal directory with the path discarded
    - |
      const SCAN = [{ match: _isUtil, argv: (_path): readonly string[] => ['ast-grep', 'scan', 'tools'] }];
