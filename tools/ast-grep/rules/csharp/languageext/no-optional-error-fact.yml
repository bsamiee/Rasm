# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-optional-error-fact
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    optional-name:
        any: [{matches: {csharp-type-name: {name: {regex: '^Option$'}}}}, {kind: nullable_type}]
    optional:
        any:
            - matches: optional-name
            - kind: nullable_type
            - kind: tuple_type
              has: {kind: tuple_element, has: {field: type, matches: optional-name}}
            - kind: identifier
              pattern: $HOLDER
              inside:
                stopBy: end
                kind: compilation_unit
                has:
                    stopBy: end
                    kind: record_declaration
                    all:
                        - has: {field: name, pattern: $HOLDER}
                        - has: {kind: parameter_list, has: {kind: parameter, has: {field: type, matches: optional-name}}}
    error-members:
        kind: declaration_list
        inside: {kind: record_declaration, matches: languageext-error-record, has: {field: name, pattern: $RECORD}}
    package-fact:
        kind: parameter
        any:
            - all:
                - has: {field: name, regex: '^Index$'}
                - has: {field: type, regex: '^Option<int>$'}
                - inside: {kind: parameter_list, has: {kind: parameter, has: {field: name, regex: '^Reason$'}}}
            - all:
                - has: {field: type, regex: '^Option<Error>$'}
                - has: {field: name, pattern: $CAUSE}
                - inside:
                    kind: parameter_list
                    inside:
                        kind: record_declaration
                        has: {kind: base_list, has: {kind: primary_constructor_base_type, has: {kind: argument_list, has: {kind: argument, has: {kind: identifier, pattern: $CAUSE}}}}}
rule:
    any:
        - kind: parameter
          all:
            - has: {field: type, matches: optional}
            - has: {field: name, pattern: $FACT}
            - not: {matches: package-fact}
            - inside: {kind: parameter_list, inside: {kind: record_declaration, matches: languageext-error-record, has: {field: name, pattern: $RECORD}}}
        - kind: property_declaration
          all:
            - has: {field: type, matches: optional}
            - has: {field: name, pattern: $FACT}
            - inside: {matches: error-members}
        - kind: field_declaration
          all:
            - has: {kind: variable_declaration, all: [{has: {field: type, matches: optional}}, {has: {kind: variable_declarator, has: {field: name, pattern: $FACT}}}]}
            - inside: {matches: error-members}
message: 'Error record `$RECORD` holds optional field `$FACT` other than `Option<int> Index` or a forwarded `Option<Error>` cause'
note: 'Fold the field into `Subject` or a `Reason` item of the one package error record'
