# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: builtins-getattr-call
language: python
arguments: [object]
utils:
    getattr-function:
        matches: {python-builtin-name: {name: {regex: '^getattr$'}}}
rule:
    kind: call
    all:
        - has: {field: function, regex: 'getattr$', matches: getattr-function}
        - has: {field: arguments, kind: argument_list, has: {nthChild: 1, matches: object}}
