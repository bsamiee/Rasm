# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    option-map:
        kind: call_expression
        has: {field: function, pattern: $MAP, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^(andThen|flatMap|map|tap)$'}}}}
rule:
    kind: expression_statement
    has:
        nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}
        kind: call_expression
        any:
            - matches: option-map
            - all:
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: *code}, matches: option-map}}
                - has:
                    field: function
                    any:
                        - {kind: member_expression, has: {field: property, regex: '^pipe$'}}
                        - matches: {effect-function: {name: {regex: '^pipe$'}}}
message: '`$MAP` runs a side effect and discards the `Option` it returns'
note: 'Call `Option.match(<option>, { onNone: Function.constVoid, onSome: <effect> })`'
