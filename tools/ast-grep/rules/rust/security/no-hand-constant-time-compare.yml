# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-hand-constant-time-compare
language: rust
severity: error
rule:
    kind: 'call_expression, compound_assignment_expr'
    pattern: $COMPARE
    matches: rust-constant-time-compare
message: '`$COMPARE` compares two byte sequences by OR-ing their XOR by hand'
note: 'Call `aws_lc_rs::constant_time::verify_slices_are_equal(<a>, <b>)`, the function returns `Ok(())` for equal slices in time independent of their contents and `Err` for unequal lengths `zip` truncates to a shared prefix'
