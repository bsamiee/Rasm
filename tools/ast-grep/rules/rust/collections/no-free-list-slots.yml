# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-free-list-slots
language: rust
severity: error
utils:
    optional-slots:
        kind: field_declaration
        has:
            field: type
            kind: generic_type
            all:
                - has: {field: type, regex: '^((std::)?vec::)?Vec$'}
                - has: {field: type_arguments, has: {nthChild: 1, kind: generic_type, has: {field: type, regex: '^((std|core)::option::)?Option$'}}}
    free-list:
        kind: field_declaration
        all:
            - has: {field: name, regex: '(?i)^((\w+_)?(free|vacant|vacancies|holes|gaps|recycled|reusable|spare|available|unused|released|empty)(_?(list|slots?|indices|indexes|ids|keys|stack|queue))?|(free|vacant|recycled|reusable|spare|available|unused|released|empty)_\w+)$', pattern: $FREE}
            - has:
                field: type
                kind: generic_type
                all:
                    - has: {field: type, regex: '^((std::)?collections::(\w+::)?|(std::)?vec::)?(Vec|VecDeque|BTreeSet|BinaryHeap|HashSet)$'}
                    - has: {field: type_arguments, has: {nthChild: 1, any: [{kind: primitive_type, regex: '^(usize|u32|u64)$'}, {kind: generic_type, regex: '^((std::)?cmp::)?Reverse<\s*(usize|u32|u64)\s*>$'}]}}
rule:
    kind: struct_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, all: [{has: {matches: optional-slots}}, {has: {matches: free-list}}]}
labels:
    NAME: {style: primary, message: 'Arena written by hand'}
    FREE: {style: secondary, message: 'Free list of reusable indexes'}
message: '`$NAME` keeps optional slots and a free list `$FREE` of reusable indexes by hand'
note: 'Hold `slotmap::SlotMap<K, T>`, `insert` returns a generational key and `remove` frees its slot'
