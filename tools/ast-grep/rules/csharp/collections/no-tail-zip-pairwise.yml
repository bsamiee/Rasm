# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
rule:
    kind: invocation_expression
    pattern: $PAIRS
    any:
        - pattern: $ITEMS.Zip($ITEMS.Tail)
        - pattern: $ITEMS.Zip($ITEMS.Tail, $JOIN)
message: '`$PAIRS` pairs each element of `$ITEMS` with its successor by hand'
note: 'Call SuperLinq `<items>.Window(2, pair => …)` with the span selector, one buffer per window'
