syntax = "proto3";

package rasm.contracts.render.v1;

import "buf/validate/validate.proto";
import "rasm/contracts/artifact/v1/artifact.proto";
import "rasm/contracts/render/v1/view.proto";
import "rasm/contracts/spatial/v1/vector.proto";

enum ResidencyKind {
  RESIDENCY_KIND_UNSPECIFIED = 0;
  RESIDENCY_KIND_MESHLET_CLUSTER = 1;
  RESIDENCY_KIND_QUANTIZED_VERTEX = 2;
  RESIDENCY_KIND_POINT_SPLAT = 3;
  RESIDENCY_KIND_GAUSSIAN_SPLAT = 4;
}

enum StreamMode {
  STREAM_MODE_UNSPECIFIED = 0;
  STREAM_MODE_ATTRIBUTES = 1;
  STREAM_MODE_TRIANGLES = 2;
  STREAM_MODE_INDICES = 3;
  STREAM_MODE_RAW = 4;
}

enum StreamFilter {
  STREAM_FILTER_UNSPECIFIED = 0;
  STREAM_FILTER_NONE = 1;
  STREAM_FILTER_OCTAHEDRAL = 2;
  STREAM_FILTER_QUATERNION = 3;
  STREAM_FILTER_EXPONENTIAL = 4;
}

message SphereWire {
  rasm.contracts.spatial.v1.Point3 center = 1 [(buf.validate.field).required = true];
  double radius = 2 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

message MeshoptStream {
  string stream = 1 [(buf.validate.field).string.min_len = 1];
  StreamMode mode = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  StreamFilter filter = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint64 byte_offset = 4;
  uint64 byte_length = 5;
  uint64 count = 6;
  uint32 byte_stride = 7 [(buf.validate.field).uint32.gt = 0];
  uint32 codec_version = 8;
}

message Meshlet {
  option (buf.validate.message).cel = {
    id: "meshlet.parent"
    message: "parent identity and error are present together"
    expression: "has(this.parent) == has(this.parent_error)"
  };
  option (buf.validate.message).cel = {
    id: "meshlet.parent_error"
    message: "parent error cannot be below child error"
    expression: "!has(this.parent_error) || this.parent_error >= this.error"
  };

  uint32 vertex_offset = 1;
  uint32 triangle_offset = 2;
  uint32 vertex_count = 3;
  uint32 triangle_count = 4;
  rasm.contracts.spatial.v1.Point3 center = 5 [(buf.validate.field).required = true];
  double radius = 6 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  rasm.contracts.spatial.v1.Point3 cone_apex = 7 [(buf.validate.field).required = true];
  rasm.contracts.spatial.v1.UnitDirection3 cone_axis = 8 [(buf.validate.field).required = true];
  double cone_cutoff = 9 [(buf.validate.field).double = {
    finite: true
    gte: -1
    lte: 1
  }];
  uint32 level = 10;
  uint32 shell = 11;
  double error = 12 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  // Radians per object-space unit, measured per cluster at encode.
  double curvature = 13 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  // The realized shared-boundary-vertex count the build strategy produced.
  uint32 cut = 14;
  optional uint32 parent = 15;
  optional double parent_error = 16 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

message ResidencyTileWire {
  ResidencyKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 2, 3, 4;
  reserved "content_key", "blob_key", "bytes";
  uint32 resident_count = 5;
  uint32 harmonic_degree = 6 [(buf.validate.field).uint32.lte = 3];
  SphereWire bounds = 7 [(buf.validate.field).required = true];
  repeated MeshoptStream streams = 8 [(buf.validate.field).repeated.max_items = 65536];
  repeated Meshlet meshlets = 9 [(buf.validate.field).repeated.max_items = 65536];
  rasm.contracts.artifact.v1.ArtifactRef artifact = 10 [(buf.validate.field).required = true];
}

message GeometryResidency {
  uint32 version = 1 [(buf.validate.field).uint32.gt = 0];
  ViewpointWire viewpoint = 2 [(buf.validate.field).required = true];
  repeated ResidencyTileWire tiles = 3 [(buf.validate.field).repeated.max_items = 65536];
  uint64 vram_budget = 4;
}
