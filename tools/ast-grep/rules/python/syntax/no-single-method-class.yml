# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-method-class
language: python
severity: error
utils:
    init: {kind: function_definition, has: {field: name, regex: '^__init__$'}}
    method:
        kind: function_definition
        any:
            - not: {has: {field: name, regex: '^__.*__$'}}
            - has: {field: name, regex: '^__call__$'}
    static-method:
        kind: decorated_definition
        has: {kind: decorator, regex: '^@(staticmethod|classmethod)$'}
        not: {has: {kind: function_definition, has: {field: name, regex: '^__.*__$'}}}
    record-method:
        kind: function_definition
        has: {field: name, regex: '^__(repr|rich_repr|eq|ne|hash|lt|le|gt|ge|copy|replace)__$'}
    field-value:
        any:
            - kind: identifier, integer, float, true, false, none
            - kind: unary_operator
              has: {kind: 'integer, float'}
            - matches: python-plain-string
            - kind: list, tuple, set, dictionary, expression_list, pair
              not: {has: {pattern: $_, not: {matches: field-value}}}
    self-field:
        kind: attribute
        has: {field: object, kind: identifier, regex: '^self$'}
    self-assignment:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has:
                    field: left
                    any:
                        - matches: self-field
                        - kind: pattern_list
                          has: {matches: self-field}
                          not: {has: {pattern: $_, not: {matches: self-field}}}
                - has: {field: right, matches: field-value}
    single-operation:
        all:
            - has: {matches: method}
            - not: {has: {nthChild: {position: 2, ofRule: {not: {any: [{matches: python-docstring-or-comment}, {matches: init}]}}}}}
    static-operations:
        all:
            - has: {matches: static-method}
            - not: {has: {not: {any: [{matches: python-docstring-or-comment}, {matches: static-method}]}}}
    field-assignments:
        all:
            - has:
                matches: init
                has:
                    field: body
                    all:
                        - has: {matches: self-assignment}
                        - not: {has: {not: {any: [{matches: python-docstring-or-comment}, {matches: self-assignment}]}}}
            - not:
                has:
                    not:
                        any:
                            - matches: python-docstring-or-comment
                            - matches: init
                            - matches: record-method
                            - {kind: decorated_definition, has: {matches: record-method}}
                            - {kind: expression_statement, has: {kind: assignment}}
rule:
    kind: class_definition
    all:
        - matches: python-plain-class
        - has: {field: name, pattern: $NAME}
        - any:
            - has: {field: body, matches: field-assignments}
            - all:
                - has: {field: body, any: [{matches: single-operation}, {matches: static-operations}]}
                - not:
                    inside:
                        kind: module
                        stopBy: end
                        has: {kind: class_definition, stopBy: end, has: {field: superclasses, has: {any: [{pattern: $NAME}, {kind: subscript, has: {field: value, pattern: $NAME}}]}}}
        - not: {has: {kind: identifier, regex: '^__class__$', stopBy: end}}
message: '`$NAME` is a plain class holding one method, static or class methods alone, or record members written by hand'
note: 'Use a frozen `msgspec.Struct` for the fields and a module function per operation, a record and a function state what the class spells by hand'
labels:
    NAME: {style: primary, message: Plain class}
