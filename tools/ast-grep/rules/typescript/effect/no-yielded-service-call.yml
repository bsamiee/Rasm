# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-yielded-service-call
language: tsxlang
severity: error
rule:
    kind: call_expression
    all:
        - has:
            field: function
            kind: member_expression
            has:
                field: object
                kind: parenthesized_expression
                has: {nthChild: 1, kind: yield_expression, regex: '^yield\s*\*', has: {nthChild: 1, pattern: $SERVICE, any: [{kind: identifier, regex: '^[A-Z]'}, {kind: member_expression, has: {field: property, regex: '^[A-Z]'}}]}}
        - inside: {kind: yield_expression, regex: '^yield\s*\*'}
message: '`$SERVICE` is yielded whole to call one member'
note: 'Call `<Service>.use((service) => service.<member>(...))`'
