name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    affected:
        runs-on: [self-hosted, host]
        timeout-minutes: 30
        outputs:
            base: ${{ steps.shas.outputs.base }}
            head: ${{ steps.shas.outputs.head }}
            engines: ${{ steps.unreal.outputs.engines }}
            unreal: ${{ steps.listed.outputs.unreal }}
        env:
            GH_TOKEN: &github ${{ github.token }}
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: &server ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: &token ${{ github.event_name == 'push' && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - id: shas
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
            - &tools
              uses: ./.github/actions/tools
            - run: nx sync:check
            - run: nx conformance:check
            - id: unreal
              uses: ./.github/actions/unreal
            - id: listed
              env:
                  PROJECTS: ${{ steps.unreal.outputs.projects }}
              run: |
                  unreal="$(nx show projects --affected --json | jq --compact-output --argjson unreal "${PROJECTS}" 'map(select(IN($unreal[])))')"
                  printf "unreal=%s\n" "${unreal}" >> "${GITHUB_OUTPUT}"

    linux:
        needs: affected
        runs-on: [self-hosted, host]
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: &base ${{ needs.affected.outputs.base }}
            NX_HEAD: &head ${{ needs.affected.outputs.head }}
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
        steps:
            - run: rm -rf .artifacts/nextest .artifacts/playwright .artifacts/vitest
            - *checkout
            - *tools
            - run: playwright install --with-deps --only-shell chromium
            - run: nx affected --targets=check,test,build --exclude='tag:os:*,!tag:os:linux,!tag:os:all'
            - &reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.job }}-reports
                  if-no-files-found: ignore
                  path: |
                      .artifacts/nextest/*/junit.xml
                      .artifacts/playwright
                      .artifacts/vitest

    macos:
        needs: affected
        runs-on: xcode-27
        timeout-minutes: 120
        env:
            GH_TOKEN: *github
            NX_BASE: *base
            NX_HEAD: *head
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.cache/pnpm
        steps:
            - *checkout
            - id: pnpm
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.PNPM_CONFIG_STORE_DIR }}
                  key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-${{ runner.os }}-
            - id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |
                      .cache/nx/workspace-data
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                  key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'apps/nx/**', '!apps/nx/tests/**') }}
                  restore-keys: nx-${{ runner.os }}-
            - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: latest
            - *tools
            - if: ${{ steps.pnpm.outputs.cache-hit != 'true' }}
              run: pnpm store prune
            - if: ${{ steps.pnpm.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.PNPM_CONFIG_STORE_DIR }}
                  key: ${{ steps.pnpm.outputs.cache-primary-key }}
            - run: nx build @rasm/nx-apple-darwin-arm64
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:darwin,!tag:os:all'
              env:
                  APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
                  APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
            - if: ${{ !cancelled() && steps.graph.outcome == 'success' && steps.graph.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: ${{ steps.graph.outputs.cache-primary-key }}
            - *reports

    unreal:
        needs: affected
        if: ${{ needs.affected.outputs.unreal != '[]' && needs.affected.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.affected.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
            NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: *token
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: 'false'
        steps:
            - *checkout
            - *tools
            - run: nx run-many --targets=check,test,build --projects="${PROJECTS}"
              env:
                  PROJECTS: ${{ join(fromJSON(needs.affected.outputs.unreal), ',') }}
