# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-traceback-print
language: python
severity: error
ignores: ['.claude/skills/use-blender/scripts/*.py', '.claude/skills/use-rhino/scripts/*.py', 'tools/interface/**']
utils:
    exception-class: {matches: {python-member-use: {module: {regex: "^traceback$"}, name: {regex: "^TracebackException$"}}}}
    formatted-traceback:
        kind: call
        has: {field: function, matches: {python-member-use: {module: {regex: "^traceback$"}, name: {regex: "^format_(exc|exception|stack|tb|list|exception_only)$"}}}}
    output-sink:
        kind: call
        has:
            field: function
            any:
                - matches: {python-builtin-name: {name: {regex: '^print$'}}}
                - kind: attribute
                  has: {field: attribute, regex: '^(write|writelines)$'}
                - kind: attribute
                  all:
                    - has: {field: attribute, regex: "^(log|debug|info|warning|warn|error|critical|fatal|exception|msg)$"}
                    - not: {has: {field: object, matches: python-stdlib-logger}}
rule:
    pattern: $USE
    any:
        - matches: {python-member-use: {module: {regex: "^traceback$"}, name: {regex: "^print_(exc|exception|stack|last|tb|list)$"}}}
        - kind: call
          has:
            field: function
            kind: attribute
            all:
                - has: {field: attribute, regex: "^print$"}
                - has:
                    field: object
                    kind: call
                    has:
                        field: function
                        any:
                            - matches: exception-class
                            - kind: attribute
                              all:
                                - has: {field: attribute, regex: "^from_exception$"}
                                - has: {field: object, matches: exception-class}
        - matches: formatted-traceback
          inside: {stopBy: end, kind: argument_list, inside: {matches: output-sink}}
message: '`$USE` prints the traceback outside structlog'
note: 'Use `logger.exception(<event>)` inside the handler, `exc_info=<exception>` outside it, and `stack_info=True` for the current stack'
