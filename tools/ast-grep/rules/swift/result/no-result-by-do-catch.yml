# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-result-by-do-catch
language: swift
severity: error
utils:
    failure-statement:
        any:
            - pattern: {context: 'func f() { return .failure($$$_) }', selector: control_transfer_statement}
            - pattern: '$_.resume(returning: .failure($$$_))'
            - pattern: '$_ = .failure($$$_)'
    recovered-statement:
        any:
            - pattern: {context: 'func f() { return .success($$$_) }', selector: control_transfer_statement}
            - pattern: '$_.resume(returning: .success($$$_))'
            - kind: assignment
    failure-catch:
        kind: catch_block
        all:
            - not: {has: {kind: pattern, not: {has: {field: bound_identifier, kind: simple_identifier}, not: {has: {kind: 'pattern, user_type'}}}}}
            - not: {has: {kind: where_clause}}
            - has: {kind: statements, matches: {swift-single-statement: {first: {matches: failure-statement}}}}
    recovering-catch:
        kind: catch_block
        all:
            - has: {kind: pattern}
            - has: {kind: statements, matches: {swift-single-statement: {first: {matches: recovered-statement}}}}
    result-success-body:
        kind: statements
        pattern: $BODY
        all:
            - has: {nthChild: {position: 1, reverse: true}, pattern: {context: 'func f() { return .success($_) }', selector: control_transfer_statement}}
            - not:
                has:
                    stopBy: {kind: 'lambda_literal, function_declaration'}
                    kind: control_transfer_statement
                    not: {all: [{nthChild: {position: 1, reverse: true}}, {inside: {kind: statements, pattern: $BODY}}]}
    one-failure-catch:
        all:
            - has: {matches: failure-catch}
            - not: {has: {kind: catch_block, nthChild: {position: 2, ofRule: {kind: catch_block}}}}
    classifying-catch:
        kind: catch_block
        has: {kind: statements, matches: {swift-single-statement: {first: {matches: failure-statement}}}}
    success-last:
        kind: do_statement
        matches: one-failure-catch
        has: {kind: statements, matches: result-success-body}
    error-use: {kind: simple_identifier, regex: '^error$'}
    caught-name:
        kind: catch_block
        any:
            - has: {kind: pattern, has: {field: bound_identifier, pattern: $CAUGHT}}
            - all:
                - not: {has: {kind: pattern}}
                - has: {kind: statements, has: {stopBy: end, matches: error-use, pattern: $CAUGHT}}
            - all:
                - not: {any: [{has: {kind: pattern}}, {has: {kind: statements, has: {stopBy: end, matches: error-use}}}]}
                - has: {kind: catch_keyword, pattern: $$KEYWORD}
    to-result:
        matches: success-last
        all:
            - has: {kind: statements, pattern: $BODY}
            - has:
                kind: catch_block
                matches: caught-name
                has: {kind: statements, has: {pattern: {context: 'func f() { return .failure($FAILURE) }', selector: control_transfer_statement}}}
            - not: {has: {kind: comment, precedes: {kind: comment}}}
            - any:
                - has: {kind: comment, pattern: $LEAD, precedes: {kind: statements}}
                - not: {has: {kind: comment, precedes: {kind: statements}}}
            - any:
                - has: {kind: statements, has: {kind: await_expression, stopBy: {kind: 'lambda_literal, function_declaration'}, pattern: $AWAITED}}
                - pattern: $SYNC
    caught-argument:
        kind: value_arguments
        all:
            - has:
                kind: value_argument
                all:
                    - has: {field: value, kind: simple_identifier, pattern: $CAUGHT}
                    - any:
                        - has: {kind: value_argument_label, pattern: $LABEL}
                        - not: {has: {kind: value_argument_label}}
            - not: {has: {nthChild: 2}}
    point-free-failure:
        kind: call_expression
        all:
            - has: {nthChild: 1, pattern: $CALLEE, regex: '^([A-Z]\w*(\.\w+)*|[a-z_]\w*)$'}
            - has: {kind: call_suffix, has: {matches: caught-argument}}
    returned:
        any:
            - all:
                - nthChild: 1
                - nthChild: {position: 1, reverse: true}
                - inside: {kind: statements, inside: {kind: 'function_body, lambda_literal, computed_property, computed_getter'}}
            - pattern: $KEPT
    case-failure:
        kind: call_expression
        all:
            - has: {nthChild: 1, kind: prefix_expression, has: {field: target, kind: simple_identifier, pattern: $CASE}}
            - has: {kind: call_suffix, not: {has: {kind: lambda_literal}}, has: {matches: caught-argument}}
    result-type:
        kind: user_type
        regex: '^Result<'
        has: {kind: type_arguments, has: {nthChild: 2, pattern: $FAILURE_TYPE}}
    typed-owner:
        inside:
            stopBy: {kind: 'lambda_literal, function_declaration, init_declaration, property_declaration'}
            any:
                - {kind: function_declaration, has: {matches: result-type}}
                - {kind: property_declaration, has: {kind: type_annotation, has: {matches: result-type}}}
    to-case:
        matches: to-result
        all:
            - matches: typed-owner
            - has:
                kind: catch_block
                any:
                    - has: {kind: pattern}
                    - has: {kind: statements, has: {stopBy: end, matches: error-use}}
                has:
                    kind: statements
                    has:
                        kind: control_transfer_statement
                        has:
                            field: result
                            kind: call_expression
                            has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, matches: case-failure}}}}
    to-identity:
        matches: to-result
        has:
            kind: catch_block
            any:
                - has: {kind: pattern}
                - has: {kind: statements, has: {stopBy: end, matches: error-use}}
            has:
                kind: statements
                has:
                    kind: control_transfer_statement
                    has:
                        field: result
                        kind: call_expression
                        has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, kind: simple_identifier, pattern: $CAUGHT}}}}
    to-point-free:
        matches: to-result
        has:
            kind: catch_block
            has:
                kind: statements
                has:
                    kind: control_transfer_statement
                    has:
                        field: result
                        kind: call_expression
                        has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, matches: point-free-failure}}}}
rule:
    kind: do_statement
    pattern: $DO
    any:
        - matches: success-last
        - matches: one-failure-catch
          not: {has: {kind: statements, matches: result-success-body}}
        - all:
            - has: {kind: catch_block, nthChild: {position: 2, ofRule: {kind: catch_block}}}
            - not: {has: {kind: catch_block, not: {matches: classifying-catch}}}
        - all:
            - has: {matches: failure-catch}
            - has: {matches: recovering-catch}
rewriters:
    - id: result-point-free
      rule: {matches: to-point-free, all: [{matches: returned}]}
      transform:
        OPEN_ASYNC: {replace: {source: $AWAITED, replace: '^[\s\S]*$', by: 'await Result'}}
        OPEN_SYNC: {replace: {source: $SYNC, replace: '^[\s\S]*$', by: 'Result'}}
        RETURN: {replace: {source: $KEPT, replace: '(?s)^.*$', by: 'return '}}
        VOID: {replace: {source: $BODY, replace: '\s*return \.success\(\(\)\)\s*$', by: ''}}
        SOLE: {replace: {source: $VOID, replace: '^return \.success\(([\s\S]*)\)\s*$', by: '$1'}}
        INNER: {replace: {source: $SOLE, replace: '^([\s\S]*)\breturn \.success\(([\s\S]*)\)\s*$', by: '${1}return ${2}'}}
        LEAD_LINE: {replace: {source: $LEAD, replace: '$', by: "\n"}}
        INIT: {replace: {source: $CALLEE, replace: '^((?:\w+\.)*[A-Z]\w*)$', by: '$1.init'}}
        LABELED: {replace: {source: $LABEL, replace: '^(.+)$', by: '($1:)'}}
      fix: |-
        $RETURN$OPEN_ASYNC$OPEN_SYNC {
            $LEAD_LINE$INNER
        }.mapError($INIT$LABELED)
    - id: result-case
      rule: {matches: to-case, all: [{matches: returned}]}
      transform:
        OPEN_ASYNC: {replace: {source: $AWAITED, replace: '^[\s\S]*$', by: 'await Result'}}
        OPEN_SYNC: {replace: {source: $SYNC, replace: '^[\s\S]*$', by: 'Result'}}
        RETURN: {replace: {source: $KEPT, replace: '(?s)^.*$', by: 'return '}}
        VOID: {replace: {source: $BODY, replace: '\s*return \.success\(\(\)\)\s*$', by: ''}}
        SOLE: {replace: {source: $VOID, replace: '^return \.success\(([\s\S]*)\)\s*$', by: '$1'}}
        INNER: {replace: {source: $SOLE, replace: '^([\s\S]*)\breturn \.success\(([\s\S]*)\)\s*$', by: '${1}return ${2}'}}
        LEAD_LINE: {replace: {source: $LEAD, replace: '$', by: "\n"}}
        LABELED: {replace: {source: $LABEL, replace: '^(.+)$', by: '($1:)'}}
      fix: |-
        $RETURN$OPEN_ASYNC$OPEN_SYNC {
            $LEAD_LINE$INNER
        }.mapError($FAILURE_TYPE.$CASE$LABELED)
    - id: result-typed-throws
      rule: {matches: to-identity, all: [{matches: typed-owner}, {matches: returned}]}
      constraints:
        FAILURE_TYPE: {not: {regex: '^(any\s+)?(Swift\.)?Error$'}}
      transform:
        OPEN_ASYNC: {replace: {source: $AWAITED, replace: '^[\s\S]*$', by: 'await Result'}}
        OPEN_SYNC: {replace: {source: $SYNC, replace: '^[\s\S]*$', by: 'Result'}}
        ASYNC: {replace: {source: $AWAITED, replace: '^[\s\S]*$', by: ' async'}}
        RETURN: {replace: {source: $KEPT, replace: '(?s)^.*$', by: 'return '}}
        VOID: {replace: {source: $BODY, replace: '\s*return \.success\(\(\)\)\s*$', by: ''}}
        SOLE: {replace: {source: $VOID, replace: '^return \.success\(([\s\S]*)\)\s*$', by: '$1'}}
        INNER: {replace: {source: $SOLE, replace: '^([\s\S]*)\breturn \.success\(([\s\S]*)\)\s*$', by: '${1}return ${2}'}}
        LEAD_LINE: {replace: {source: $LEAD, replace: '$', by: "\n"}}
      fix: |-
        $RETURN$OPEN_ASYNC$OPEN_SYNC { ()$ASYNC throws($FAILURE_TYPE) in
            $LEAD_LINE$INNER
        }
    - id: result-identity
      rule: {matches: to-identity, all: [{matches: returned}]}
      transform:
        OPEN_ASYNC: {replace: {source: $AWAITED, replace: '^[\s\S]*$', by: 'await Result'}}
        OPEN_SYNC: {replace: {source: $SYNC, replace: '^[\s\S]*$', by: 'Result'}}
        RETURN: {replace: {source: $KEPT, replace: '(?s)^.*$', by: 'return '}}
        VOID: {replace: {source: $BODY, replace: '\s*return \.success\(\(\)\)\s*$', by: ''}}
        SOLE: {replace: {source: $VOID, replace: '^return \.success\(([\s\S]*)\)\s*$', by: '$1'}}
        INNER: {replace: {source: $SOLE, replace: '^([\s\S]*)\breturn \.success\(([\s\S]*)\)\s*$', by: '${1}return ${2}'}}
        LEAD_LINE: {replace: {source: $LEAD, replace: '$', by: "\n"}}
      fix: |-
        $RETURN$OPEN_ASYNC$OPEN_SYNC {
            $LEAD_LINE$INNER
        }
    - id: result-map-error-closure
      rule: {matches: to-result, all: [{matches: returned}]}
      transform:
        OPEN_ASYNC: {replace: {source: $AWAITED, replace: '^[\s\S]*$', by: 'await Result'}}
        OPEN_SYNC: {replace: {source: $SYNC, replace: '^[\s\S]*$', by: 'Result'}}
        RETURN: {replace: {source: $KEPT, replace: '(?s)^.*$', by: 'return '}}
        VOID: {replace: {source: $BODY, replace: '\s*return \.success\(\(\)\)\s*$', by: ''}}
        SOLE: {replace: {source: $VOID, replace: '^return \.success\(([\s\S]*)\)\s*$', by: '$1'}}
        INNER: {replace: {source: $SOLE, replace: '^([\s\S]*)\breturn \.success\(([\s\S]*)\)\s*$', by: '${1}return ${2}'}}
        UNUSED: {replace: {source: $KEYWORD, replace: '(?s)^.*$', by: '_'}}
        LEAD_LINE: {replace: {source: $LEAD, replace: '$', by: "\n"}}
      fix: |-
        $RETURN$OPEN_ASYNC$OPEN_SYNC {
            $LEAD_LINE$INNER
        }.mapError { $CAUGHT$UNUSED in $FAILURE }
transform:
    FIXED: {rewrite: {source: $DO, rewriters: [result-point-free, result-case, result-typed-throws, result-identity, result-map-error-closure]}}
fix: $FIXED
message: '`do` builds a Result by statements with `.failure` returned from `catch`'
note: 'Use `Result { <throwing statements> }` (`await Result` when the body awaits) with `.mapError(<case or classifier>)` for a classifying `catch`, `throws(<Failure>)` for one returning the error unchanged, `.flatMap` for statements past the `catch`, and `.flatMapError` for a recovering `catch`, the `Result` initializer states the same cases in one expression'
