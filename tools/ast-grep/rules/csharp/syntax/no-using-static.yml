# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-using-static
language: csharp
severity: error
rule:
    kind: using_directive
    pattern: $DIRECTIVE
    has: {regex: '^static$'}
message: '`$DIRECTIVE` hides the owning type name at every use'
note: Qualify each call with its owning type, the MSBuild global using supplies `LanguageExt.Prelude`
