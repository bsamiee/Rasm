overrides:
    '@pulumi/pulumi': 'catalog:'
    vite>yaml: 'catalog:'
    '@vitejs/plugin-react>oxc-transform-react': 'catalog:'
    stylelint-plugin-use-baseline>stylelint: 'catalog:'
    '@types/ssh2>@types/node': 'catalog:'
    '@pulumi/hostinger>typescript': 'catalog:' # Generated SDKs require TypeScript 4, a second `@pulumi/pulumi` peer variant splits its `Output` type
    '@pulumi/minio>typescript': 'catalog:'
    '@effect/opentelemetry>@opentelemetry/resources': 'catalog:'
    '@effect/opentelemetry>@opentelemetry/sdk-logs': 'catalog:'
    '@effect/opentelemetry>@opentelemetry/sdk-metrics': 'catalog:'
    '@opentelemetry/api': 'catalog:' # OpenTelemetry 2 under `@pulumi/pulumi` peers below 1.10, a second copy splits every `vitest` snapshot
    '@axe-core/playwright>playwright-core': '>=1.0.0' # Declared `>= 1.0.0`, pnpm's prerelease peer check reads a spaced operator as an exact version
    tree-sitter: '-' # Node bindings the grammar packages name as peers, the build compiles their C sources alone
    tree-sitter-cli: '-' # The CLI comes from mise, pinned in `.config/mise.lock`

