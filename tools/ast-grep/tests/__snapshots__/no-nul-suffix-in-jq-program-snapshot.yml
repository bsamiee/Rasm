id: no-nul-suffix-in-jq-program
snapshots:
  /usr/bin/jq -j '.[] + "\u0000"' records:
    labels:
    - source: /usr/bin/jq -j '.[] + "\u0000"' records
      style: primary
      start: 0
      end: 39
    - source: /usr/bin/jq
      style: secondary
      start: 0
      end: 11
    - source: '''.[] + "\u0000"'''
      style: secondary
      start: 15
      end: 31
  command jq -j '.[] + "\u0000"' records:
    labels:
    - source: command jq -j '.[] + "\u0000"' records
      style: primary
      start: 0
      end: 38
    - source: jq
      style: secondary
      start: 8
      end: 10
    - source: '''.[] + "\u0000"'''
      style: secondary
      start: 14
      end: 30
  jq -j '"\(.ruleId),\(.file)\u0000"':
    labels:
    - source: jq -j '"\(.ruleId),\(.file)\u0000"'
      style: primary
      start: 0
      end: 35
    - source: jq
      style: secondary
      start: 0
      end: 2
    - source: '''"\(.ruleId),\(.file)\u0000"'''
      style: secondary
      start: 6
      end: 35
  jq -j '(.ruleDirs[], .utilDirs[]) + "\u0000"' <<<"$config":
    labels:
    - source: jq -j '(.ruleDirs[], .utilDirs[]) + "\u0000"' <<<"$config"
      style: primary
      start: 0
      end: 58
    - source: jq
      style: secondary
      start: 0
      end: 2
    - source: '''(.ruleDirs[], .utilDirs[]) + "\u0000"'''
      style: secondary
      start: 6
      end: 45
  jq -js 'map(.file) | unique[] | . + "\u0000"':
    labels:
    - source: jq -js 'map(.file) | unique[] | . + "\u0000"'
      style: primary
      start: 0
      end: 45
    - source: jq
      style: secondary
      start: 0
      end: 2
    - source: '''map(.file) | unique[] | . + "\u0000"'''
      style: secondary
      start: 7
      end: 45
  jq -nj --arg lang "$lang" '[inputs] | .[] | tostring + "\u0000"' records:
    labels:
    - source: jq -nj --arg lang "$lang" '[inputs] | .[] | tostring + "\u0000"' records
      style: primary
      start: 0
      end: 72
    - source: jq
      style: secondary
      start: 0
      end: 2
    - source: '''[inputs] | .[] | tostring + "\u0000"'''
      style: secondary
      start: 26
      end: 64
  scan | jq -j '"\(.file)\u0000"' | while IFS= read -r -d '' file; do count "$file"; done:
    labels:
    - source: jq -j '"\(.file)\u0000"'
      style: primary
      start: 7
      end: 31
    - source: jq
      style: secondary
      start: 7
      end: 9
    - source: '''"\(.file)\u0000"'''
      style: secondary
      start: 13
      end: 31
  time jq -j '.[] + "\u0000"' records:
    labels:
    - source: time jq -j '.[] + "\u0000"' records
      style: primary
      start: 0
      end: 35
    - source: jq
      style: secondary
      start: 5
      end: 7
    - source: '''.[] + "\u0000"'''
      style: secondary
      start: 11
      end: 27
