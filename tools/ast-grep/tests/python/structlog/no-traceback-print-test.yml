id: no-traceback-print
valid:
    # The corrected form, the exception logged inside the handler
    - |
      import structlog

      try:
          load(path)
      except OSError:
          structlog.get_logger(__name__).exception("load failed", path=str(path))
    # Formatting member of the module, its text is a value
    - |
      import traceback

      text = traceback.format_exc()
    # Attribute named like the member on another object
    - |
      reporter.print_exc()
    - 'structlog.get_logger().error("failed", exc_info=error)'
    - 'structlog.get_logger().info("stack", stack_info=True)'
invalid:
    # The instance, the attribute read as spelled
    - |
      import traceback

      traceback.print_exc()
    # The member imported from the module
    - |
      from traceback import print_exception
    # The attribute read through the alias the import binds
    - |
      import traceback as tb

      tb.print_stack()
