# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-promise-outside-boundary
language: tsx
severity: error
ignores: ['**/*.config.ts', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
rule:
    all:
        - any:
            - kind: await_expression
            - kind: for_in_statement
              has: {regex: '^await$'}
        - not: {inside: {stopBy: {matches: syntax-function-boundary}, matches: effect-promise-boundary}}
message: 'Await or for-await consumes a promise outside its conversion callback, the form of `Effect.tryPromise` or `Effect.promise` at the boundary and `Stream.fromAsyncIterable` for an async iterable'
