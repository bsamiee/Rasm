# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-membership-test
language: csharp
utils:
    tested:
        has: {field: name, regex: '^(Contains|ContainsKey|TryGetValue|GetValueOrDefault|GetOrAdd|Find|FindOrAdd)$'}
    marked:
        has: {field: name, regex: '^(Add|TryAdd)$'}
rule:
    any:
        - kind: invocation_expression
          any:
            - has: {field: function, kind: member_access_expression, matches: tested}
            - all:
                - has: {field: function, kind: member_access_expression, matches: marked}
                - not: {inside: {kind: expression_statement}}
        - kind: member_access_expression
          any: [{matches: tested}, {matches: marked}]
          inside: {kind: argument}
