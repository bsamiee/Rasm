# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-command-new
language: rust
rule:
    kind: call_expression
    has: {field: function, kind: scoped_identifier, regex: '^((::)?((std|tokio|async_std|async_process|smol)::)?process::)?Command::new$|^((::)?process_wrap::(std|tokio)::)?CommandWrap::with_new$'}
