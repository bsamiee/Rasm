# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-out-declaration
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    bool-type:
        matches: {csharp-type-name: {name: {regex: '^(bool|Boolean)$'}}}
    interface-member:
        has: {field: name, regex: '^(TryFormat|TryGetValue|TryParse)$'}
        inside: {kind: declaration_list, inside: {has: {kind: base_list, regex: '\bI(ReadOnly)?Dictionary\s*<|\bI(Utf8)?(Span)?(Parsable|Formattable)\b'}}}
    out-parameter:
        kind: parameter
        has: {kind: modifier, regex: '^out$'}
    flag-parameter:
        kind: parameter
        all:
            - has: {kind: modifier, regex: '^out$'}
            - has: {field: type, matches: bool-type}
    try-pattern:
        kind: method_declaration
        all:
            - has: {field: name, regex: '^Try'}
            - has: {field: returns, matches: bool-type}
            - has: {field: parameters, has: {kind: parameter, nthChild: {position: 1, reverse: true}, matches: out-parameter}}
            - not: {has: {field: parameters, has: {kind: parameter, not: {nthChild: {position: 1, reverse: true}}, matches: out-parameter}}}
    result-type:
        matches: {csharp-type-name: {name: {regex: '^(Option|Fin|IO)$'}}}
    host-delegate-adapter:
        any:
            - kind: method_declaration
              has: {field: returns, matches: result-type}
            - kind: local_function_statement
              has: {field: type, matches: result-type}
        has: {field: parameters, has: {kind: parameter, has: {field: type, any: [{pattern: $NAME}, {has: {pattern: $NAME, stopBy: end}}]}}}
rule:
    all:
        - has: {field: name, pattern: $NAME}
        - any:
            - kind: 'delegate_declaration, local_function_statement'
              any:
                - all: [{has: {field: type, matches: bool-type}}, {has: {field: parameters, has: {matches: out-parameter}}}]
                - has: {field: parameters, has: {matches: flag-parameter}}
              not: {kind: delegate_declaration, inside: {kind: compilation_unit, stopBy: end, has: {matches: host-delegate-adapter, stopBy: end}}}
            - kind: method_declaration
              any:
                - all: [{has: {field: returns, matches: bool-type}}, {has: {field: parameters, has: {matches: out-parameter}}}]
                - has: {field: parameters, has: {matches: flag-parameter}}
              not:
                any:
                    - has: {kind: modifier, regex: '^(override|extern)$'}
                    - has: {kind: explicit_interface_specifier}
                    - matches: interface-member
                    - all: [{matches: csharp-visible-member}, {not: {matches: try-pattern}}]
message: '`$NAME` returns presence as a `bool` beside an `out` parameter'
note: 'Return `Option<T>` or `Fin<T>` outside overrides, `extern` imports, and BCL interface members'
