# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-shadowed-nameref-target
language: bash
severity: error
rule:
    kind: variable_name
    pattern: $LOCAL
    inside:
        kind: declaration_command
        stopBy: {not: {kind: variable_assignment}}
        inside:
            kind: function_definition
            stopBy: end
            all:
                - has: {field: name, pattern: $FUNCTION}
                - has: {stopBy: end, kind: declaration_command, has: {kind: word, regex: '^-[a-zA-Z]*n'}}
                - inside:
                    kind: program
                    stopBy: end
                    has:
                        stopBy: end
                        kind: command
                        all:
                            - has: {field: name, pattern: $FUNCTION}
                            - has: {kind: word, pattern: $LOCAL}
message: 'Local `$LOCAL` shadows the variable a caller passes to `$FUNCTION` by name, the nameref binds the local'
note: Rename the local to a name no caller passes
