id: no-string-test-of-number
snapshots:
  '[ "$h" = 1 ] || finding':
    fixed: ((h == 1)) || finding
    labels:
    - source: '[ "$h" = 1 ]'
      style: primary
      start: 0
      end: 12
    - source: '"$h"'
      style: secondary
      start: 2
      end: 6
    - source: =
      style: secondary
      start: 7
      end: 8
    - source: '1'
      style: secondary
      start: 9
      end: 10
    - source: '"$h" = 1'
      style: secondary
      start: 2
      end: 10
  '[ "$n" -ge 1 ] && x=1':
    fixed: ((n >= 1)) && x=1
    labels:
    - source: '[ "$n" -ge 1 ]'
      style: primary
      start: 0
      end: 14
    - source: '"$n"'
      style: secondary
      start: 2
      end: 6
    - source: -ge
      style: secondary
      start: 7
      end: 10
    - source: '1'
      style: secondary
      start: 11
      end: 12
    - source: '"$n" -ge 1'
      style: secondary
      start: 2
      end: 12
  '[ "${c}" != 0 ]':
    fixed: ((c != 0))
    labels:
    - source: '[ "${c}" != 0 ]'
      style: primary
      start: 0
      end: 15
    - source: '"${c}"'
      style: secondary
      start: 2
      end: 8
    - source: '!='
      style: secondary
      start: 9
      end: 11
    - source: '0'
      style: secondary
      start: 12
      end: 13
    - source: '"${c}" != 0'
      style: secondary
      start: 2
      end: 13
  '[[ "$h" == 1 ]]':
    fixed: ((h == 1))
    labels:
    - source: '[[ "$h" == 1 ]]'
      style: primary
      start: 0
      end: 15
    - source: '"$h"'
      style: secondary
      start: 3
      end: 7
    - source: ==
      style: secondary
      start: 8
      end: 10
    - source: '1'
      style: secondary
      start: 11
      end: 12
    - source: '"$h" == 1'
      style: secondary
      start: 3
      end: 12
  '[[ $# -eq 2 ]]':
    fixed: (($# == 2))
    labels:
    - source: '[[ $# -eq 2 ]]'
      style: primary
      start: 0
      end: 14
    - source: $#
      style: secondary
      start: 3
      end: 5
    - source: -eq
      style: secondary
      start: 6
      end: 9
    - source: '2'
      style: secondary
      start: 10
      end: 11
    - source: $# -eq 2
      style: secondary
      start: 3
      end: 11
  '[[ $(wc -l <f) -eq 0 ]]':
    fixed: (($(wc -l <f) == 0))
    labels:
    - source: '[[ $(wc -l <f) -eq 0 ]]'
      style: primary
      start: 0
      end: 23
    - source: $(wc -l <f)
      style: secondary
      start: 3
      end: 14
    - source: -eq
      style: secondary
      start: 15
      end: 18
    - source: '0'
      style: secondary
      start: 19
      end: 20
    - source: $(wc -l <f) -eq 0
      style: secondary
      start: 3
      end: 20
  '[[ $1 -eq 1 ]]':
    fixed: (($1 == 1))
    labels:
    - source: '[[ $1 -eq 1 ]]'
      style: primary
      start: 0
      end: 14
    - source: $1
      style: secondary
      start: 3
      end: 5
    - source: -eq
      style: secondary
      start: 6
      end: 9
    - source: '1'
      style: secondary
      start: 10
      end: 11
    - source: $1 -eq 1
      style: secondary
      start: 3
      end: 11
  '[[ $h == "1" ]]':
    fixed: ((h == 1))
    labels:
    - source: '[[ $h == "1" ]]'
      style: primary
      start: 0
      end: 15
    - source: $h
      style: secondary
      start: 3
      end: 5
    - source: ==
      style: secondary
      start: 6
      end: 8
    - source: '"1"'
      style: secondary
      start: 9
      end: 12
    - source: $h == "1"
      style: secondary
      start: 3
      end: 12
  '[[ $h == ''1'' ]]':
    fixed: ((h == 1))
    labels:
    - source: '[[ $h == ''1'' ]]'
      style: primary
      start: 0
      end: 15
    - source: $h
      style: secondary
      start: 3
      end: 5
    - source: ==
      style: secondary
      start: 6
      end: 8
    - source: '''1'''
      style: secondary
      start: 9
      end: 12
    - source: $h == '1'
      style: secondary
      start: 3
      end: 12
  '[[ $h == 1 ]] && x=1':
    fixed: ((h == 1)) && x=1
    labels:
    - source: '[[ $h == 1 ]]'
      style: primary
      start: 0
      end: 13
    - source: $h
      style: secondary
      start: 3
      end: 5
    - source: ==
      style: secondary
      start: 6
      end: 8
    - source: '1'
      style: secondary
      start: 9
      end: 10
    - source: $h == 1
      style: secondary
      start: 3
      end: 10
  '[[ $n > 9 ]]':
    fixed: ((n > 9))
    labels:
    - source: '[[ $n > 9 ]]'
      style: primary
      start: 0
      end: 12
    - source: $n
      style: secondary
      start: 3
      end: 5
    - source: '>'
      style: secondary
      start: 6
      end: 7
    - source: '9'
      style: secondary
      start: 8
      end: 9
    - source: $n > 9
      style: secondary
      start: 3
      end: 9
  '[[ $x == -1 ]]':
    fixed: ((x == -1))
    labels:
    - source: '[[ $x == -1 ]]'
      style: primary
      start: 0
      end: 14
    - source: $x
      style: secondary
      start: 3
      end: 5
    - source: ==
      style: secondary
      start: 6
      end: 8
    - source: '-1'
      style: secondary
      start: 9
      end: 11
    - source: $x == -1
      style: secondary
      start: 3
      end: 11
  '[[ ${arr[0]} == 1 ]]':
    fixed: ((${arr[0]} == 1))
    labels:
    - source: '[[ ${arr[0]} == 1 ]]'
      style: primary
      start: 0
      end: 20
    - source: ${arr[0]}
      style: secondary
      start: 3
      end: 12
    - source: ==
      style: secondary
      start: 13
      end: 15
    - source: '1'
      style: secondary
      start: 16
      end: 17
    - source: ${arr[0]} == 1
      style: secondary
      start: 3
      end: 17
  '[[ ${h:-0} -gt 1 ]]':
    fixed: ((${h:-0} > 1))
    labels:
    - source: '[[ ${h:-0} -gt 1 ]]'
      style: primary
      start: 0
      end: 19
    - source: ${h:-0}
      style: secondary
      start: 3
      end: 10
    - source: -gt
      style: secondary
      start: 11
      end: 14
    - source: '1'
      style: secondary
      start: 15
      end: 16
    - source: ${h:-0} -gt 1
      style: secondary
      start: 3
      end: 16
  '[[ -1 -eq $x ]]':
    fixed: ((-1 == x))
    labels:
    - source: '[[ -1 -eq $x ]]'
      style: primary
      start: 0
      end: 15
    - source: '-1'
      style: secondary
      start: 3
      end: 5
    - source: -eq
      style: secondary
      start: 6
      end: 9
    - source: $x
      style: secondary
      start: 10
      end: 12
    - source: -1 -eq $x
      style: secondary
      start: 3
      end: 12
  '[[ 1 -lt $n ]]':
    fixed: ((1 < n))
    labels:
    - source: '[[ 1 -lt $n ]]'
      style: primary
      start: 0
      end: 14
    - source: '1'
      style: secondary
      start: 3
      end: 4
    - source: -lt
      style: secondary
      start: 5
      end: 8
    - source: $n
      style: secondary
      start: 9
      end: 11
    - source: 1 -lt $n
      style: secondary
      start: 3
      end: 11
  test "$h" -ge "1":
    fixed: ((h >= 1))
    labels:
    - source: test "$h" -ge "1"
      style: primary
      start: 0
      end: 17
    - source: test
      style: secondary
      start: 0
      end: 4
    - source: '"$h"'
      style: secondary
      start: 5
      end: 9
    - source: -ge
      style: secondary
      start: 10
      end: 13
    - source: '"1"'
      style: secondary
      start: 14
      end: 17
    - source: '"1"'
      style: secondary
      start: 14
      end: 17
  test "$h" = 1:
    fixed: ((h == 1))
    labels:
    - source: test "$h" = 1
      style: primary
      start: 0
      end: 13
    - source: test
      style: secondary
      start: 0
      end: 4
    - source: '"$h"'
      style: secondary
      start: 5
      end: 9
    - source: =
      style: secondary
      start: 10
      end: 11
    - source: '1'
      style: secondary
      start: 12
      end: 13
    - source: '1'
      style: secondary
      start: 12
      end: 13
  test 1 -lt "$n":
    fixed: ((1 < n))
    labels:
    - source: test 1 -lt "$n"
      style: primary
      start: 0
      end: 15
    - source: test
      style: secondary
      start: 0
      end: 4
    - source: '1'
