# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sequenced-independent-check
language: csharp
severity: error
utils:
    result-type:
        regex: '^((global::)?LanguageExt\s*\.\s*)?(Fin|Validation)\s*<'
    result-member:
        kind: method_declaration, local_function_statement
        has: {field: returns, matches: result-type}
    result-query:
        kind: query_expression
        any:
            - inside: {kind: arrow_expression_clause, inside: {matches: result-member}}
            - inside:
                kind: return_statement
                inside:
                    stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, anonymous_method_expression'}
                    matches: result-member
    result-call:
        kind: invocation_expression
        any:
            - matches: {csharp-file-method-call: {declaration: {has: {field: returns, matches: result-type}}}}
            - has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^(Map|Bind|MapFail|BindFail|BiMap|As)(\s*<.+>)?$'}
                    - has: {field: expression, matches: result-call}
    step:
        kind: from_clause
        any:
            - has: {matches: csharp-check-call}
            - has: {matches: result-call}
            - inside: {matches: result-query}
    outcome:
        kind: invocation_expression
        any:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^FromResult$'}}
            - all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^Unless(\s*<.+>)?$'}}
                - has:
                    field: arguments
                    has:
                        kind: argument
                        nthChild: 1
                        has:
                            kind: identifier
                            pattern: $FLAG
                            inside:
                                stopBy: end
                                any:
                                    - kind: 'method_declaration, local_function_statement'
                                      has: {field: parameters, has: {kind: parameter, all: [{has: {field: type, regex: '^bool$'}}, {has: {field: name, pattern: $FLAG}}]}}
                                    - kind: block
                                      has: {kind: local_declaration_statement, has: {kind: variable_declaration, all: [{has: {field: type, regex: '^bool$'}}, {has: {kind: variable_declarator, has: {field: name, pattern: $FLAG}}}]}}
rule:
    kind: from_clause
    all:
        - has: {field: name, pattern: $LATER}
        - matches: step
        - follows:
            stopBy: {not: {kind: 'let_clause, comment'}}
            kind: from_clause
            all:
                - has: {field: name, pattern: $EARLIER}
                - matches: step
                - not: {has: {stopBy: end, matches: outcome}}
        - not: {matches: csharp-check-dependent-step}
message: '`$LATER` reads nothing `$EARLIER` binds or tests and runs only after `$EARLIER` succeeds, a failed `$EARLIER` hides the `$LATER` error'
note: Use `(<check>, <check>).Apply(<combine>).As()` or `Seq(<checks>).Traverse(identity).As()` over independent checks and one bind for dependent steps, `Fin` apply joins the error of every failed check
