# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-repeated-literal-in-function
language: python
severity: error
rule:
    kind: string
    all:
        - pattern: $LIT
        - regex: '(?s)^.{12,}$' # Twelve characters with the prefix and the quotes, a shorter literal names a key or a flag
        # Metavariables unify a string holding an escape by its structure, its text is not compared
        - not: {has: {any: [{kind: escape_sequence}, {kind: escape_interpolation}], stopBy: end}}
        - not: {inside: {kind: pair, field: key}} # Dictionary keys name a field, the structure repeats and no value does
        - inside: # The statement holding the literal, an ancestor directly under a block, with the walk stopped at the owning def
              stopBy: {kind: function_definition} # Lambdas hold no statement, their literal belongs to the statement around them
              all:
                  # The def itself follows its siblings and owns none of their literals
                  - not: {kind: function_definition}
                  - inside: {kind: block, inside: {kind: function_definition}} # Block a def owns, a class body binds no local
                  - follows: {stopBy: end, has: {stopBy: end, kind: string, pattern: $LIT}} # Earlier statement of the same body holds the literal
message: String literal `$LIT` repeats an earlier literal of the same function
note: Bind the literal once as a local, `<name> = <literal>`, or take it as a parameter, and read the name at each site
