id: require-const-assertion
valid:
    - 'const S = { a: 1 } as const satisfies Item;'
    - 'const S = ({ a: 1 } as const) satisfies Item;'
    - const T = load() satisfies Item;
    - const T = P satisfies Item;
    - const Y = 'a' satisfies Name;
    - 'const U = () => { const V = { a: 1 } satisfies Item; return V; };'
    - 'const W = load({ a: 1 } satisfies Item);'
    - 'const Z = { row: { a: 1 } satisfies Item };'
    - 'let X = { a: 1 } satisfies Item;'
invalid:
    - "const PERMISSIONS = { allowed: 'selected', config: { patterns: ['a@*'] } } satisfies Omit<Item, 'repository'>;"
    - export const Q = ['a'] satisfies readonly string[];
    - 'const R = ({ a: 1 }) satisfies Item;'
    - const E = {} satisfies Item;
    - 'const X = { A: { p: 1 } } satisfies Record<string, Item>;'
    - 'const R = ({ a: 1 } satisfies Item);'
