# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-combinator-calls
language: tsx
severity: error
utils:
    # Module call that pipes over its first argument, a Schema or FastCheck call has no data-last form and nests as a declaration
    step:
        matches: effect-module-call
        not: {has: {field: function, has: {field: object, regex: '^(Schema|FastCheck)$'}}}
    # Step over any module call (the origin, FastCheck.sample included) with a second argument, a one-argument call wraps a value
    data-first-step:
        matches: step
        has:
            field: arguments
            all:
                - has: {nthChild: 1, matches: effect-module-call}
                - has: {nthChild: 2}
rule:
    all:
        - matches: step
        - has:
              field: arguments
              has:
                  nthChild: 1
                  matches: data-first-step
        # The outermost call of a chain reports once, an inner call sits as the first argument of another step
        - not:
              all:
                  - nthChild: 1
                  - inside: {kind: arguments, inside: {matches: step}}
message: Module calls nest three deep as data-first arguments and read from the inside out
note: >-
    Start the chain from the value and pipe each step in order, `value.pipe(Module.step(rest), Module.next(rest))`
    or `pipe(value, Module.step(rest), Module.next(rest))`
