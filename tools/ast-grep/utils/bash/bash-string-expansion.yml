# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: bash-string-expansion
language: bashlang
rule:
    any:
        - kind: simple_expansion, expansion
          has:
            any:
                - kind: variable_name, subscript
                - kind: special_variable_name
                  regex: '^[@*_]$'
          not:
            has: {field: operator, regex: '^#$', precedes: {kind: 'variable_name, subscript, special_variable_name'}}
        - kind: command_substitution
