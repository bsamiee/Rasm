name: Release

on:
    workflow_dispatch:
        inputs:
            projects:
                description: Nx project filter for the projects to release, every project with releasable commits when empty

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    queue: max

defaults:
    run:
        shell: bash

jobs:
    native:
        uses: ./.github/workflows/native.yml

    release:
        needs: native
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        environment: release
        permissions:
            attestations: write
            contents: write
            id-token: write
        env:
            PROJECTS: ${{ inputs.projects }}
        steps:
            - uses: actions/checkout@v7 # zizmor: ignore[artipacked] nx release pushes the tags under the persisted token
              with:
                fetch-depth: 0
                filter: tree:0
            - uses: ./.github/actions/setup
            - uses: actions/download-artifact@v8
              with:
                name: nuget-local
                path: .artifacts/nuget
            - run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            - run: nx release --skip-publish ${PROJECTS:+--projects="$PROJECTS"}
              env:
                GITHUB_TOKEN: ${{ github.token }}
            - id: nuget
              uses: NuGet/login@v1
              with:
                user: ${{ vars.NUGET_USER }}
            - run: nx release publish ${PROJECTS:+--projects="$PROJECTS"}
              env:
                NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
            - run: dotnet nuget push '.artifacts/nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
              env:
                NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
            # nx release publish packs the managed packages and builds the Python distributions, the attestation follows the pushes
            - uses: actions/attest@v4
              with:
                subject-path: |
                    .artifacts/nuget/*.nupkg
                    .artifacts/dotnet/package/release/*.nupkg
                    .artifacts/python/dist/*/*
