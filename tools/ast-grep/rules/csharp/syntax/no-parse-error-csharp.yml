# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-csharp
language: csharp
severity: error
utils:
    parameters-with-modifiers:
        kind: tuple_expression
        has: {kind: argument, regex: '^(out|ref|in)\s'}
    lambda-head-with-modifiers:
        any:
            - matches: parameters-with-modifiers
            - {kind: 'arrow_expression_clause, assignment_expression', has: {matches: parameters-with-modifiers}}
    lambda-with-modifiers-error:
        kind: ERROR
        any:
            - {regex: '^(=>|\()\s*\([^()]*\)(\s*=>\s*\{\s*\w+(\s*=\s*\w+)?)?$', has: {matches: lambda-head-with-modifiers}}
            - {regex: '^=>\s*(\{\s*)?\w+$', follows: {matches: lambda-head-with-modifiers}}
    lambda-with-modifiers:
        any:
            - matches: lambda-with-modifiers-error
            - {kind: ERROR, regex: '^[)}]$', inside: {kind: compilation_unit}, follows: {stopBy: end, has: {stopBy: end, matches: lambda-with-modifiers-error}}}
            - inside: {kind: initializer_expression, inside: {kind: arrow_expression_clause, follows: {matches: lambda-with-modifiers-error}}}
            - kind: implicit_parameter
              inside: {kind: lambda_expression, has: {field: type, kind: tuple_type, regex: '\bref\s+readonly\s'}}
    typed-slice-error:
        kind: ERROR
        regex: '^[A-Za-z_][\w.]*(<[^>]*>)?(\[\])*\??\s+[A-Za-z_]\w*'
        inside: {kind: list_pattern}
        follows: {regex: '^\.\.$'}
    typed-slice:
        any:
            - matches: typed-slice-error
            - {regex: '^$', inside: {kind: list_pattern, has: {matches: typed-slice-error}}}
    extension-head:
        kind: identifier
        regex: '^extension$'
        inside: {regex: '^extension\s*[<(]'}
    type-level:
        any:
            - kind: &types 'declaration_list, compilation_unit, class_declaration, struct_declaration, record_declaration'
            - {kind: ERROR, inside: {kind: *types}}
    extension-header:
        kind: 'constructor_declaration, method_declaration, property_declaration, field_declaration, global_statement, ERROR'
        all:
            - inside: {matches: type-level}
            - has: {stopBy: {kind: &bodies 'block, arrow_expression_clause'}, matches: extension-head}
    extension-body:
        follows: {matches: extension-header, not: {regex: '\}$'}}
    extension-region:
        any: [{matches: extension-header}, {matches: extension-body}]
    member-body:
        kind: *bodies
        inside:
            kind: 'method_declaration, local_function_statement, property_declaration, accessor_declaration, constructor_declaration, operator_declaration, indexer_declaration'
            not: {matches: extension-header}
            inside: {stopBy: end, matches: extension-region}
    extension-member:
        any:
            - matches: extension-region
            - all:
                - inside: {stopBy: end, matches: extension-region}
                - not: {inside: {stopBy: end, matches: member-body}}
            - {kind: ERROR, regex: '^\}$', inside: {kind: compilation_unit}, follows: {stopBy: end, has: {stopBy: end, matches: extension-head}}}
    ref-compound-assignment:
        kind: ERROR
        regex: '^=$'
        inside: {kind: binary_expression, has: {field: left, kind: invocation_expression}}
        follows: {regex: '^([-+*/%&|^]|<<|>>>?|\?\?)$'}
    ref-return-call:
        kind: invocation_expression
        all:
            - has: {field: function, kind: identifier, pattern: $REF_CALL}
            - inside:
                stopBy: end
                kind: compilation_unit
                has: {stopBy: end, kind: method_declaration, all: [{has: {field: name, pattern: $REF_CALL}}, {has: {field: returns, kind: ref_type}}]}
    ref-assignment:
        kind: ERROR
        regex: '^=\s'
        any:
            - inside: {kind: expression_statement, has: {matches: ref-return-call}}
            - inside: {kind: member_access_expression, has: {field: expression, matches: ref-return-call}}
            - inside: {kind: conditional_expression, has: {field: condition, matches: ref-return-call}}
            - follows: {kind: argument, has: {kind: lambda_expression, has: {field: body, matches: ref-return-call}}}
    file-directives:
        kind: ERROR
        regex: '^#:[^\n]*(\n(#:[^\n]*|[ \t]*))*$'
        inside: {kind: compilation_unit}
    file-directives-head:
        kind: global_statement
        regex: '^\w+[^\n]*(\n(#:[^\n]*|[ \t]*))*\nusing [^;\n]*;$'
        follows: {matches: file-directives}
    target-named-element:
        kind: ERROR
        regex: '^(assembly|module|field|event|method|param|property|return|type|typevar)\s*[,.]'
        inside: {kind: collection_expression}
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: target-named-element
            - matches: file-directives
            - inside: {matches: file-directives-head, stopBy: end}
            - matches: lambda-with-modifiers
            - matches: typed-slice
            - matches: extension-member
            - matches: ref-compound-assignment
            - matches: ref-assignment
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: compilation_unit
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: 'Write a form tree-sitter-c-sharp parses'
