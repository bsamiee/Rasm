# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
utils:
    block:
        kind: extension_declaration
        all:
            - not: {has: {kind: type_parameter_list}}
            - has: {kind: receiver_parameter, pattern: $RECEIVER}
rule:
    all:
        - matches: block
        - follows: {stopBy: end, kind: extension_declaration, matches: block}
message: '`extension` block repeats receiver `$RECEIVER` an earlier block of the class declares'
note: 'Move its members into the earlier `extension` block of `<receiver>`, one subsection divider per family'
