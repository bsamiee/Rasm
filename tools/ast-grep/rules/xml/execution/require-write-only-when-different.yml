# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-write-only-when-different
language: xml
severity: error
files: ['**/*.{csproj,props,targets}']
rule:
    matches: msbuild-tag
    pattern: _TAG
    all:
        - has: {kind: Name, regex: '^WriteLinesToFile$'}
        - has: {matches: {msbuild-attribute: {name: {regex: '^File$'}, value: {pattern: _FILE}}}}
        - not: {has: {kind: Attribute, has: {kind: Name, regex: '^WriteOnlyWhenDifferent$'}}}
        - not: {inside: {stopBy: end, all: [{matches: {msbuild-element: {name: {regex: '^Target$'}}}}, {matches: {msbuild-metadata: {name: {regex: '^Outputs$'}, value: {kind: AttValue}}}}]}}
        - any:
            - has: {matches: {msbuild-attribute: {name: {regex: '^Overwrite$'}, value: {regex: '(?i)^["'']\s*(true|on|yes|!false|!off|!no)\s*["'']$'}}}}
            - all:
                - has: {kind: Name, pattern: _APPENDING}
                - not: {has: {kind: Attribute, has: {kind: Name, regex: '^Overwrite$'}}}
                - has: {matches: {msbuild-attribute: {name: {regex: '^File$'}, value: {pattern: _FILE}}}}
                - not:
                    inside:
                        kind: element
                        follows:
                            stopBy: end
                            any:
                                - matches: {msbuild-element: {name: {regex: '^Exec$'}}}
                                - has: {matches: msbuild-tag, has: {kind: Attribute, has: {kind: AttValue, pattern: _FILE}}}
transform:
    FILE_TEXT: {replace: {source: $FILE, replace: '^["'']|["'']$', by: ''}}
    HEAD: replace($TAG, replace='\s*/?>$', by='')
    CLOSE: replace($TAG, replace='(?s)^.*?(\s*/?>)$', by='$1')
    OVERWRITE: replace($APPENDING, replace='^.+$', by=' Overwrite="true"')
fix: $HEAD$OVERWRITE WriteOnlyWhenDifferent="true"$CLOSE
message: '`WriteLinesToFile` writes `$FILE_TEXT` on every build, unchanged `Lines` included'
note: Set `Overwrite="true"` and `WriteOnlyWhenDifferent="true"`, or append after a same-target task writing the file
