# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-table-lookup-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    unique-table:
        kind: member_access_expression
        has: {field: name, regex: '^(Linetypes|Layers|Groups|Fonts|DimStyles|HatchPatterns|InstanceDefinitions|SectionStyles|PageViewGroups)$'}
    table-read:
        any:
            - kind: member_access_expression
              all:
                - has: {field: expression, matches: unique-table}
                - has: {field: name, regex: '^(Find|FindId|FindIndex|FindName|Count)$'}
            - kind: element_access_expression
              has: {field: expression, matches: unique-table}
    other-lookup:
        kind: member_access_expression
        has: {field: name, regex: '^Find\w+$', not: {regex: '^Find(Id|Index|Name)$'}}
    find-call:
        kind: invocation_expression
        all:
            - has:
                field: function
                any:
                    - kind: identifier, generic_name
                      matches: {csharp-type-name: {name: {regex: '^Find$'}}}
                    - matches: {csharp-owner-member: {type: {regex: '^TableOps$'}, member: {regex: '^Find$'}}}
            - not: {has: {field: arguments, has: {kind: argument, has: {kind: lambda_expression, has: {stopBy: end, matches: other-lookup}}}}}
rule:
    kind: lambda_expression
    all:
        - not: {has: {field: parameters, kind: parameter_list, has: {kind: parameter, nthChild: 2}}}
        - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $KEY}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $KEY}}}]}
        - has: {field: body, any: [{matches: table-read}, {has: {stopBy: end, matches: table-read}}]}
        - inside: {kind: argument, inside: {kind: argument_list, inside: {matches: find-call}}}
message: 'Lambda over `$KEY` looks a document table row up by hand'
note: Use `TableOps.Find<T>(<table>, <address>, <includeDeleted>)`, which resolves an id, an index, or a unique name through the document manifest
