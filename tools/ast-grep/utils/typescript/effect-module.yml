# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-module
language: tsx
arguments: [name]
rule:
    any:
        - matches: {syntax-import-reference: {source: {regex: '^(effect|@effect/[\w-]+)(/[a-z][\w-]*)?$'}, exported: {matches: name}}}
        - matches: {syntax-import-reference: {source: {regex: '^(effect|@effect/[\w-]+)(/[a-z][\w-]*)?/[A-Z]\w*$', matches: name}, exported: {regex: '^\*$'}}}
