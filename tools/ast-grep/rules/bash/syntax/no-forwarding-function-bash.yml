# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-function-bash
language: bash
severity: error
utils:
    arguments: {kind: string, regex: '^"\$(\{@\}|@)"$'}
    literal:
        any:
            - kind: command_name, word, raw_string
            - kind: string
              not: {has: {kind: 'simple_expansion, expansion, command_substitution, arithmetic_expansion'}}
            - matches: arguments
rule:
    kind: function_definition
    not: {has: {field: redirect, pattern: $$_REDIRECT}}
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            field: body
            kind: compound_statement, subshell
            not:
                any:
                    - has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}
                    - has: {regex: '^&$'}
            has:
                kind: command
                pattern: $CALL
                all:
                    - has: {field: name, regex: '^[A-Za-z0-9_./-]+$'}
                    - has: {matches: arguments}
                    - not: {has: {not: {matches: literal}}}
                    - not: {has: {matches: arguments, follows: {matches: arguments, stopBy: end}}}
message: '`$NAME` passes its arguments and fixed words unchanged to `$CALL`'
note: Call `<command>` at each call site and set fixed options in its tool configuration file
