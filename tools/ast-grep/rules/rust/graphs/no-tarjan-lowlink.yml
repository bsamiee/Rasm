# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-tarjan-lowlink
language: rust
severity: error
rule:
    kind: 'identifier, field_identifier'
    regex: '^(?i)low_?links?$'
    pattern: $NAME
    any:
        - inside: {field: name, kind: field_declaration}
        - inside: {field: pattern, kind: 'let_declaration, parameter'}
        - inside: {field: pattern, kind: mut_pattern, inside: {field: pattern, kind: 'let_declaration, parameter'}}
message: '`$NAME` holds Tarjan lowlink state by hand'
note: 'Hold the graph as a `petgraph::Graph` and call `petgraph::algo::tarjan_scc(&graph)` for strongly connected components, `petgraph::algo::bridges` for cut edges, or `petgraph::algo::articulation_points::articulation_points` for cut vertices'
