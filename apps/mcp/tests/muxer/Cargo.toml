# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "mcp-muxer-tests"
version.workspace = true
edition.workspace = true

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[test]]
name = "suite"
path = "suite/main.rs"

[[bin]]
name = "mcp-fixture"
path = "fixture/main.rs"
test = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
tokio                              = { workspace = true, features = ["io-std"] }
tokio-util                         = { workspace = true }
futures                            = { workspace = true }
sysinfo                            = { workspace = true }
nonempty-collections               = { workspace = true }
serde                              = { workspace = true }
serde_json                         = { workspace = true }
serde_path_to_error                = { workspace = true }
schemars                           = { workspace = true }
jiff                               = { workspace = true }
fs-err                             = { workspace = true, features = ["tokio"] }
rmcp                               = { workspace = true, features = ["client", "server", "macros", "elicitation", "transport-io", "transport-child-process"] }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-subscriber                 = { workspace = true }
clap                               = { workspace = true }
escargot                           = { workspace = true }
rasm-cli                           = { workspace = true }
rasm-telemetry                     = { workspace = true, features = ["process"] }

[dev-dependencies]
backon         = { workspace = true }
tokio          = { workspace = true, features = ["test-util"] }
claims         = { workspace = true }
rstest         = { workspace = true }
hdrhistogram   = { workspace = true }
rasm-mcp-tests = { workspace = true }
rasm-testing   = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
