# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-asyncio-module
language: python
severity: error
rule:
    pattern: $USE
    matches: {python-module-use: {module: {regex: '^asyncio(\.[\w.]+)?$'}}}
message: '`$USE` calls asyncio directly, the form of the anyio member such as `anyio.run`, `anyio.sleep`, `anyio.create_task_group`, or `anyio.Lock`'
note: 'anyio runs on asyncio or trio and its members honour the cancel scope on both backends'
