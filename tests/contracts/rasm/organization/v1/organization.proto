// rasm/organization/v1/organization.proto — the corpus-homed descriptor source the DESCRIPTOR_DRIFT contract gates.
// Model-organization family: the ORGANIZATION_WIRE document (OrganizationWire + EntityWire/ContainmentWire/
// ViewOverrideWire) a host-boundary producer projects from its own document organization. Every name here states
// the HOST-FREE organizational concept and the producer's own layer vocabulary translates at the projection, so a
// peer decode binds to model organization rather than to one host's layer model. Field order transcribes the durable
// roster at csharp:Rasm.Rhino/Document/layers#ORGANIZATION_PROJECTION verbatim while numbers only append past the
// last; removals reserve name and number. Enum-valued columns cross as their closed-vocabulary key strings and
// structural variation crosses as a oneof, so no proto enum arm stands beside a producer-owned roster.
syntax = "proto3";

package rasm.organization.v1;

option csharp_namespace = "Rasm.Organization";

// One organizational entity: a named, ordered position in the containment tree. `key` is the 16-byte big-endian
// content key over the count-framed ancestor label chain, so one organizational address keys identically in every
// source document and a federated read unions two documents instead of forking them. `name` is the entity's own
// leaf label alone — the ancestor chain is the containment walk, never a separator-joined path a peer re-splits.
// `ordinal` is the DENSE sibling rank the producer's own sibling order resolved, never a sparse host sort column
// whose ties a peer would have to re-break under the producer's string comparison.
message EntityWire {
  bytes key = 1;
  string name = 2;
  uint32 ordinal = 3;
  bool visible = 4;
  bool locked = 5;
}

// One containment fact. The target's KEY SPACE is the whole discriminant: `entity` nests one organizational entity
// inside another under this document's own keys, `member` binds a federation external key a peer joins onto its own
// entity model. A third containment relation is one arm here, never a relation column standing beside two
// same-typed target slots that erase which space a decoder resolves the target in.
message ContainmentWire {
  bytes container = 1;
  oneof target {
    bytes entity = 2;
    string member = 3;
  }
}

// One per-view presentation override. Row PRESENCE is the evidence that a view carries settings at all, and
// `visible` is the producer's resolved answer under those settings; an unprobed view lands no row, so absence reads
// unmeasured rather than as a fabricated default. Colour and print product stay producer-side evidence: a colour
// crossing a detached payload is the one crossing every branch's colour rail already forecloses.
message ViewOverrideWire {
  bytes entity = 1;
  string view = 2;
  bool visible = 3;
}

// The organization document. `authority` names the key issuer every `member` and `view` string resolves against, so
// a peer joins by federation key and never by a host handle. `current` carries explicit presence because a document
// electing no current entity and a document electing the zero key are two states an empty byte string merges.
message OrganizationWire {
  bytes source_key = 1;
  string authority = 2;
  repeated EntityWire entities = 3;
  repeated ContainmentWire containment = 4;
  repeated ViewOverrideWire overrides = 5;
  optional bytes current = 6;
}
