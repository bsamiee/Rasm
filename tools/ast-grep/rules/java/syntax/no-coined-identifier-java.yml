# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-coined-identifier-java
language: java
severity: error
utils:
    declared:
        any:
            - kind: identifier
              any:
                - inside:
                    kind: >-
                        variable_declarator, method_declaration, class_declaration, interface_declaration, enum_declaration, record_declaration, annotation_type_declaration, annotation_type_element_declaration, formal_parameter, catch_formal_parameter, enhanced_for_statement, resource, enum_constant
                    field: name
                - inside: {kind: lambda_expression, field: parameters}
                - inside: {kind: inferred_parameters}
            - kind: type_identifier
              inside: {kind: type_parameter}
rule:
    all:
        - matches: declared
        - matches: text-coined-word
    pattern: $NAME
message: Declared name `$NAME` holds a coined term
note: Use the host API member or language term the declaration matches, or the decided domain word
