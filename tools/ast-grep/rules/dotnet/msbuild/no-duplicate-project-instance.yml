# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-duplicate-project-instance
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^MSBuild$'}}}
        - has:
            matches: msbuild-tag
            all:
                - has: {matches: {msbuild-attribute: {name: {regex: '^Projects$'}, value: {regex: '\$\((MSBuildProjectFullPath|MSBuildProjectFile)\)'}}}}
                - has: {matches: {msbuild-attribute: {name: {regex: '^(Properties|RemoveProperties)$'}, value: {regex: '[^"''\s]'}}}}
message: The MSBuild task calls its own project under another global property set, a second instance runs every target again over the same bin and obj
note: Run the target in the same instance through DependsOnTargets
