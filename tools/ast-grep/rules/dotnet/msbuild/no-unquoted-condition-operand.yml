# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unquoted-condition-operand
language: xml
severity: error
rule:
    kind: Attribute
    pattern: _CONDITION
    # Complete simple comparisons only: operators inside quoted values remain data.
    any:
        - regex: "^(Condition\\s*=\\s*\"\\s*)((?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))(\\s*(?:==|!=)\\s*(?:'[^'\\\"]*'|(?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))\\s*\")$"
        - regex: "^(Condition\\s*=\\s*\"\\s*'[^'\\\"]*'\\s*(?:==|!=)\\s*)((?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))(\\s*\")$"
transform:
    LEFT:
        replace:
            source: $CONDITION
            replace: "^(Condition\\s*=\\s*\"\\s*)((?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))(\\s*(?:==|!=)\\s*(?:'[^'\\\"]*'|(?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))\\s*\")$"
            by: "$1'$2'$3"
    RIGHT:
        replace:
            source: $LEFT
            replace: "^(Condition\\s*=\\s*\"\\s*'[^'\\\"]*'\\s*(?:==|!=)\\s*)((?:[$@%]\\([A-Za-z_][A-Za-z0-9_.]*\\)|[A-Za-z0-9_./:-]+))(\\s*\")$"
            by: "$1'$2'$3"
fix: $RIGHT
message: The simple condition compares an operand without quotes
note: Quote the operand without changing literals, function arguments, or boolean grouping
