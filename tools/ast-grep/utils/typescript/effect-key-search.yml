# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# List searched for a key through includes or either overload of Array.contains or Iterable.contains, the list slot holds the key list
id: effect-key-search
language: tsx
arguments: [list, key]
utils:
    # Data-last contains(key) applied through the pipe method or the pipe function, one step alone keeps the list as the searched value
    contains-step:
        kind: call_expression
        all:
            - has: {field: function, matches: contains-callee}
            - has: {field: arguments, has: {matches: key}}
    # Array.contains and Iterable.contains share the dual signature, Array.containsWith reads an equivalence Record.has has no slot for
    contains-callee:
        kind: member_expression
        regex: '^(Array|Iterable)\.contains$'
rule:
    kind: call_expression
    any:
        - pattern: $_.includes($_)
          all:
              - has: {field: function, has: {field: object, matches: list}}
              - has: {field: arguments, has: {matches: key}}
        # Data-first overload, the key list precedes the key
        - all:
              - has: {field: function, matches: contains-callee}
              - has: {field: arguments, all: [{has: {nthChild: 1, matches: list}}, {has: {nthChild: 2, matches: key}}]}
        - pattern: $_.pipe($_)
          all:
              - has: {field: function, has: {field: object, matches: list}}
              - has: {field: arguments, has: {matches: contains-step}}
        # Swapped operands fail the type check, the pattern pins two arguments and the type checker orders them
        - pattern: pipe($_, $_)
          has: {field: arguments, all: [{has: {matches: list}}, {has: {matches: contains-step}}]}
        # Data-last overload applied to the list directly, the curried call the pipe spellings unfold
        - pattern: $_($_)
          all:
              - has: {field: function, matches: contains-step}
              - has: {field: arguments, has: {matches: list}}
