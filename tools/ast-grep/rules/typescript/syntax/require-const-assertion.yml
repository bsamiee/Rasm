# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-const-assertion
language: tsx
severity: error
utils:
    literal-value:
        any:
            - kind: 'object, array'
            - kind: parenthesized_expression
              has: {matches: literal-value}
    mutable-sequence-type:
        any:
            - kind: 'array_type, tuple_type'
              not: {inside: {kind: readonly_type}}
            - kind: generic_type
              has: {field: name, regex: '^Array$'}
rule:
    kind: satisfies_expression
    pattern: $VALUE satisfies $TYPE
    inside: {kind: variable_declarator, field: value, stopBy: {not: {kind: parenthesized_expression}}, inside: {matches: typescript-module-constant}}
    not: {has: {nthChild: 2, any: [{matches: mutable-sequence-type}, {has: {stopBy: end, matches: mutable-sequence-type}}]}}
constraints:
    VALUE: {matches: literal-value}
fix: $VALUE as const satisfies $TYPE
message: '`satisfies $TYPE` alone widens literal types of a module constant'
note: 'Write `as const satisfies <type>`'
