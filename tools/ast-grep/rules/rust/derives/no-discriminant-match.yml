# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discriminant-match
language: rust
severity: error
utils:
    variant-value:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: identifier, regex: '^(Ok|Some)$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, kind: scoped_identifier, has: {field: path, any: [{regex: '^Self$'}, {pattern: $T}]}}}, {not: {has: {nthChild: 2}}}]}
            - kind: block
              all:
                - has: {nthChild: 1, matches: variant-value}
                - not: {has: {nthChild: 2}}
    literal-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, regex: '^-?\d\w*$'}
            - has: {field: value, matches: variant-value}
    fallback-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, regex: '^(_|[a-z_]\w*)$'}
            - has: {field: value, regex: '^\{?\s*(Err\s*\(|None\b)'}
rule:
    kind: match_expression
    all:
        - inside:
            kind: function_item
            stopBy: {kind: 'function_item, closure_expression'}
            inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: type, kind: type_identifier, pattern: $T}}}
        - inside: {kind: source_file, stopBy: end, has: {stopBy: end, kind: enum_item, has: {field: name, pattern: $T}}}
        - has:
            field: body
            all:
                - has: {kind: match_arm, nthChild: {position: 1, reverse: true, ofRule: {kind: match_arm}}, matches: fallback-arm}
                - has: {kind: match_arm, matches: literal-arm}
                - not: {has: {kind: match_arm, not: {any: [{matches: literal-arm}, {matches: fallback-arm}]}}}
                - not: {has: {matches: literal-arm, has: {field: value, pattern: $SAME}, precedes: {stopBy: end, matches: literal-arm, has: {field: value, pattern: $SAME}}}}
message: '`$T` decodes an integer through a literal arm per variant'
note: 'Give the enum variants the arm literals as discriminants under `#[repr(<int>)]` and derive `derive_more::TryFrom` with `#[try_from(repr)]` for a `TryFrom` impl or `strum::FromRepr` for `from_repr` returning `Option`, the discriminants state the table the arms repeat.'
