# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: extendscript
severity: error
utils:
    probed: {inside: {kind: unary_expression, has: {field: operator, regex: '^typeof$'}}}
    builtin:
        kind: member_expression
        pattern: $MEMBER
        not: {any: [{inside: {kind: assignment_expression, field: left}}, {matches: probed}]}
rule:
    any:
        - kind: identifier
          pattern: $MEMBER
          regex: '^(?:JSON|Map|Set|WeakMap|WeakSet|WeakRef|FinalizationRegistry|Promise|Proxy|Reflect|Symbol|BigInt|Intl|ArrayBuffer|SharedArrayBuffer|Atomics|DataView|(?:Int8|Uint8|Uint8Clamped|Int16|Uint16|Int32|Uint32|Float16|Float32|Float64|BigInt64|BigUint64)Array|globalThis|console|setTimeout|setInterval|clearTimeout|clearInterval|queueMicrotask|structuredClone|fetch|Iterator|AggregateError|URL|TextEncoder|TextDecoder|Temporal|SuppressedError|DisposableStack|AsyncDisposableStack|WebAssembly)$'
          not: {matches: probed}
          matches: extendscript-global-reference
        - matches: builtin
          all:
            - has: {field: object, kind: identifier, regex: '^(?:Object|Array|Number|String|Math|Date|RegExp|Error)$', matches: extendscript-global-reference}
            - has: {field: property, regex: '^(?:keys|values|entries|assign|hasOwn|create|defineProperty|defineProperties|getPrototypeOf|setPrototypeOf|getOwnPropertyNames|getOwnPropertyDescriptor|getOwnPropertyDescriptors|getOwnPropertySymbols|freeze|seal|isFrozen|isSealed|isExtensible|preventExtensions|is|fromEntries|groupBy|isArray|from|fromAsync|of|parseInt|parseFloat|isInteger|isFinite|isNaN|isSafeInteger|MAX_SAFE_INTEGER|MIN_SAFE_INTEGER|EPSILON|fromCodePoint|raw|trunc|sign|cbrt|log2|log10|log1p|expm1|hypot|sinh|cosh|tanh|asinh|acosh|atanh|fround|f16round|imul|clz32|sumPrecise|now|escape|isError)$'}
        - matches: builtin
          inside: {kind: call_expression, field: function}
          has: {field: property, regex: &method '^(?:map|filter|forEach|reduce|reduceRight|some|every|findIndex|findLast|findLastIndex|flat|flatMap|includes|at|copyWithin|toReversed|toSorted|toSpliced|trim|trimStart|trimEnd|trimLeft|trimRight|startsWith|endsWith|padStart|padEnd|repeat|replaceAll|matchAll|codePointAt|normalize|isWellFormed|toWellFormed|bind|toISOString|toJSON|__defineGetter__|__defineSetter__|__lookupGetter__|__lookupSetter__)$'}
        - kind: subscript_expression
          pattern: $MEMBER
          inside: {kind: call_expression, field: function}
          has: {field: index, kind: string, has: {kind: string_fragment, regex: *method}}
        - matches: builtin
          inside: {kind: call_expression, field: function}
          all:
            - has: {field: object, kind: array}
            - has: {field: property, regex: &arrayed '^(?:find|fill|indexOf|lastIndexOf|keys|values|entries|with)$'}
        - matches: builtin
          all:
            - has: {field: property, regex: *method}
            - has: {field: object, kind: member_expression, all: [{has: {field: object, kind: identifier, regex: '^(?:Object|Array|String|Function|Date)$', matches: extendscript-global-reference}}, {has: {field: property, regex: '^prototype$'}}]}
        - matches: builtin
          all:
            - has: {field: property, regex: *arrayed}
            - has: {field: object, kind: member_expression, all: [{has: {field: object, kind: identifier, regex: '^Array$', matches: extendscript-global-reference}}, {has: {field: property, regex: '^prototype$'}}]}
        - matches: builtin
          all:
            - has: {field: object, kind: regex}
            - has: {field: property, regex: '^(?:flags|sticky|unicode|dotAll|hasIndices)$'}
message: '`$MEMBER` names a member ExtendScript lacks'
note: Use ES3 loops, own-key `for...in`, `charAt`, `slice`, and functions
