parentRuleIds: [bash-function]
symbolType: variable
utils:
    scope: {inside: {kind: function_definition, stopBy: {kind: function_definition}, any: [{all: [{inside: {kind: function_definition, stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
rule: {kind: word, pattern: $NAME, inside: {kind: coproc_command, field: name, matches: scope}}
