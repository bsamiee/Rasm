# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-typing-cast
language: python
severity: error
utils:
    cast-function:
        matches: {python-member-use: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^cast$'}}}
    argument:
        not: {kind: comment}
    operand:
        any:
            - inside: {kind: attribute, field: object}
            - inside: {kind: call, field: function}
            - inside: {kind: subscript, field: value}
            - inside: {kind: 'await, binary_operator, boolean_operator, comparison_operator, conditional_expression, dictionary_splat, for_in_clause, if_clause, list_splat, not_operator, unary_operator'}
    grouped:
        any:
            - kind: await, binary_operator, boolean_operator, comparison_operator, conditional_expression, not_operator, unary_operator
              inside: {kind: call, stopBy: {kind: call}, matches: operand}
            - kind: lambda, named_expression
              inside: {kind: call, stopBy: {kind: call}, not: {inside: {kind: argument_list}}}
            - regex: '\n'
              inside: {kind: call, stopBy: {kind: call}, not: {inside: {kind: 'argument_list, parenthesized_expression'}}}
    value:
        pattern: $VALUE
        not: {kind: 'list_splat, dictionary_splat'}
        any:
            - {pattern: $GROUPED, inside: {kind: argument_list, stopBy: {kind: argument_list}, pattern: $COMMENTED, has: {kind: comment, stopBy: end}}}
            - {pattern: $GROUPED, matches: grouped}
            - {not: {matches: grouped}}
rewriters:
    - id: argument-comment
      rule: {kind: comment, pattern: $COMMENT}
      fix: $COMMENT
    - id: cast-value
      rule: {pattern: $VALUE, inside: {kind: argument_list, stopBy: {kind: argument_list}, pattern: $ARGS}}
      fix: $VALUE
rule:
    kind: call
    pattern: $CALL
    all:
        - inside: {kind: module, stopBy: end, regex: '\bcast\b'}
        - has:
            field: arguments
            pattern: $ARGS
            not: {has: {nthChild: {position: 3, ofRule: {matches: argument}}}}
            has:
                any:
                    - {nthChild: {position: 2, ofRule: {matches: argument}}, not: {kind: keyword_argument}, matches: value}
                    - {kind: keyword_argument, all: [{has: {field: name, regex: '^val$'}}, {has: {field: value, matches: value}}]}
        - has:
            field: function
            any:
                - matches: cast-function
                - kind: identifier
                  matches: {python-assigned-name: {value: {matches: cast-function}}}
transform:
    BODY: {rewrite: {source: $ARGS, rewriters: [argument-comment, cast-value], joinBy: "\n"}}
    OPEN: {replace: {source: $GROUPED, replace: '(?s)^.+$', by: '('}}
    BREAK: {replace: {source: $COMMENTED, replace: '(?s)^.+$', by: "\n"}}
    CLOSE: {replace: {source: $GROUPED, replace: '(?s)^.+$', by: ')'}}
fix: $OPEN$BODY$BREAK$CLOSE
message: '`$CALL` asserts a type the checker cannot infer'
note: 'Use a value typed where it is produced, or a `TypeIs` function that narrows it, a cast overrides the checker with no runtime check'
