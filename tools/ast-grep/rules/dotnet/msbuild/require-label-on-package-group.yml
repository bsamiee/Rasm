# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Report only, a placeholder label evaluates because MSBuild reads no Label, and the group's responsibility is text the file does not hold
id: require-label-on-package-group
language: xml
severity: error
files: ['Directory.Packages.props']
rule:
    matches: {msbuild-element: {name: {regex: '^ItemGroup$'}}}
    has: {kind: content, has: {matches: {msbuild-element: {name: {regex: '^(PackageVersion|GlobalPackageReference)$'}}}}}
    not: {matches: {msbuild-metadata: {name: {regex: '^Label$'}, value: {regex: '^("\S[^"]*"|''\S[^'']*'')$'}}}}
message: The PackageVersion group has no Label naming its responsibility
note: Add Label="<Group>" to the ItemGroup, the rows sit under the group that owns them
