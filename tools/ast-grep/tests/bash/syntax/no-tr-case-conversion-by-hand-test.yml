id: no-tr-case-conversion-by-hand
valid:
    # Lower case by expansion
    - |
      lang=${BASH_REMATCH[1],,}
    # One parameter into tr inside a substitution, no-tr-case-conversion rewrites it
    - |
      lang=$(printf '%s' "$lang" | tr '[:upper:]' '[:lower:]')
    # One parameter by here string inside a substitution, no-tr-case-conversion rewrites it
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<"$lang")
    # tr deleting characters
    - |
      printf '%s' "$name" | tr -d ' '
    # tr between other sets
    - |
      printf '%s' "$name" | tr ' ' '_'
    # awk over another field
    - |
      awk '{print tolower($1)}' <<<"$line"
    # tr squeezing repeats while converting, a second operation
    - |
      out=$(printf '%s' "$name" | tr -s '[:upper:]' '[:lower:]')
    # awk over a file operand
    - |
      names=$(awk '{print tolower($0)}' names.txt)
    # sed over a file operand
    - |
      names=$(sed 's/.*/\L&/' names.txt)
    # One bare parameter by here string inside a substitution, no-tr-case-conversion rewrites it
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<$lang)
    # One braced parameter by here string inside a substitution, no-tr-case-conversion rewrites it
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<"${lang}")
    # One array element by here string inside a substitution, no-tr-case-conversion rewrites it
    - |
      lang=$(tr '[:upper:]' '[:lower:]' <<<"${BASH_REMATCH[1]}")
    # One array element into tr inside a substitution, no-tr-case-conversion rewrites it
    - |
      lang=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
    # sed converting one match, no conversion of the line
    - |
      out=$(sed 's/a/\U&/' <<<"$name")
    # sed converting every match of a part over a file operand
    - |
      out=$(sed 's/x/\L&/g' file)
    # sed upper over a file operand
    - |
      out=$(sed 's/.*/\U&/' file)
invalid:
    # tr at statement level over a here string
    - |
      tr '[:upper:]' '[:lower:]' <<<"$name"
    # Double-quoted classes upward over a command's output
    - |
      out=$(cmd | tr "[:lower:]" "[:upper:]")
    # Double-quoted classes over a command's output
    - |
      lang=$(cmd | tr "[:upper:]" "[:lower:]")
    # The conversion before the writer inside a substitution, its input is the outer stdin
    - |
      out=$(tr '[:upper:]' '[:lower:]' | printf '%s' "$name")
    # A stage between the writer and the conversion, no-tr-case-conversion leaves it
    - |
      out=$(printf '%s' "$name" | sed 's/ //g' | tr '[:upper:]' '[:lower:]')
    # The instance, tr over a command's output
    - |
      lang=$(cmd | tr '[:upper:]' '[:lower:]')
    # tr at statement level over one parameter
    - |
      printf '%s\n' "$name" | tr '[:upper:]' '[:lower:]'
    # tr upward over a file
    - |
      tr a-z A-Z < names.txt
    # awk toupper over a command's output
    - |
      first=$(cmd | awk '{print toupper($0)}')
    # A third pipeline stage after the conversion
    - |
      out=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | head -1)
    # sed with the GNU lower-case replacement over a command's output
    - |
      lang=$(cmd | sed 's/.*/\L&/')
    # Bracketed range spelling over a file
    - |
      tr '[A-Z]' '[a-z]' < names.txt
    # An operator beside the name in the here string, the expansion result is the input
    - |
      out=$(tr '[:upper:]' '[:lower:]' <<<"${lang%x}")
