# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    one:
        pattern: '1'
    count:
        kind: member_expression
        has: {field: property, regex: '^(length|size)$'}
    count-test:
        kind: binary_expression
        any:
            - all: [{has: {field: operator, regex: '^(===|!==|==|!=)$'}}, {any: [{all: [{has: {field: left, matches: one}}, {has: {field: right, pattern: $COUNT}}]}, {all: [{has: {field: right, matches: one}}, {has: {field: left, pattern: $COUNT}}]}]}]
            - all: [{has: {field: operator, regex: '^(>|<=)$'}}, {has: {field: right, matches: one}}, {has: {field: left, pattern: $COUNT}}]
            - all: [{has: {field: operator, regex: '^(<|>=)$'}}, {has: {field: left, matches: one}}, {has: {field: right, pattern: $COUNT}}]
    category:
        kind: member_expression
        has: {field: property, regex: '^(zero|one|two|few|many|other)$'}
    text:
        any:
            - kind: 'string, template_string'
            - matches: category
    plural-form:
        any:
            - kind: 'string, template_string'
              regex: '(?:[^s]s|ren)[''"`]$'
            - matches: category
    plural-rules:
        pattern: new Intl.PluralRules($$$)
    category-select:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^select$'}
                - has:
                    field: object
                    any:
                        - matches: plural-rules
                        - matches: {typescript-constant-value: {value: {matches: plural-rules}}}
    category-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^(===|!==|==|!=)$'}
            - has: {kind: string}
            - has: {matches: category-select}
rule:
    pattern: $FORM
    any:
        - kind: ternary_expression
          any:
            - all:
                - has: {field: condition, matches: count-test}
                - has: {field: consequence, matches: text}
                - has: {field: alternative, matches: text}
                - any:
                    - has: {field: consequence, matches: plural-form}
                    - has: {field: alternative, matches: plural-form}
                    - inside: {kind: template_substitution, inside: {kind: template_string, has: {kind: template_substitution, has: {pattern: $COUNT}}}}
            - has: {field: condition, matches: category-test}
        - kind: template_substitution
          all:
            - has: {kind: 'member_expression, identifier', pattern: $COUNT}
            - precedes:
                kind: string_fragment
                pattern: $TEXT
                regex: '^[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+(?:[a-z][[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]-]*[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+)?[a-z]*[^s[\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]]s(?-u:\b)'
                not: {regex: '^[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+(?:[a-z][[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]-]*[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+)?(?:is|was|has|does|this|its|as|us|yes|plus|less|thus|always|across|equals|exceeds|means|remains|contains|needs)(?-u:\b)'}
            - any:
                - has: {matches: count}
                - has: {kind: identifier, matches: {typescript-constant-value: {value: {matches: count}}}}
    not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
transform:
    NOUN: {replace: {source: $TEXT, replace: '(?s)^([\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+(?:[a-z][[^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]-]*[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]+)?[a-z]*s)(?-u:\b).*$', by: '$1'}}
message: '`$FORM$NOUN` hard-codes the plural form of a count'
note: 'Index `Intl.LDMLPluralRule` phrases by `new Intl.PluralRules(<locale>).select(<count>)`'
