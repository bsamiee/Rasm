# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: discarded-parameter-to-underscore-parameter
language: python
severity: off
utils:
    # Body holding a statement beside the discard, a body of the discard alone has no statement left, the docstring counts and a comment does not
    second-statement: {kind: block, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
    # The discard statement, an assignment of the name to the underscore or a deletion of the name alone
    discard:
        any:
            - kind: expression_statement
              has: {kind: assignment, pattern: _ = $P, has: {field: right, kind: identifier}}
            - kind: delete_statement
              has: {kind: identifier, pattern: $P} # The one deleted name, a list of names sits under an expression_list
rule:
    kind: function_definition
    pattern: $FN
    all:
        - has: {field: body, has: {matches: discard}}
        - has: {field: parameters, has: {matches: {python-parameter: {name: {pattern: $P}}}}}
        - has: {field: body, matches: second-statement}
        # The parameter stays in use under a second discard of the same name or a read of the name elsewhere in the body
        - not: {has: {field: body, has: {kind: identifier, pattern: $P, stopBy: end, not: {inside: {matches: discard, stopBy: end}}}}}
rewriters:
    - id: drop-discard # The statement leaves, ruff format removes the blank line it leaves at the top of the body
      rule: {matches: discard}
      fix: ''
    - id: underscore-name # The parameter's own identifier, bare under the parameters or named inside a typed, defaulted, or splat parameter
      rule:
          kind: identifier
          pattern: $P
          any: # Identifiers in an annotation or a default sit under a type or a value node and keep their name
              - inside: {kind: parameters}
              - inside: {matches: {python-parameter: {name: {pattern: $P}}}, inside: {kind: parameters}}
      fix: _$P
transform:
    OUT: rewrite($FN, rewriters=[drop-discard, underscore-name])
    CLEAN: replace($OUT, replace='(?m)\n[ \t]+$', by='') # The dropped statement leaves a whitespace line, formatted code holds none
fix: $CLEAN
message: The body discards parameter `$P` to silence the unused-argument report
note: Name the parameter with a leading underscore, `_<name>`, and drop the discard
