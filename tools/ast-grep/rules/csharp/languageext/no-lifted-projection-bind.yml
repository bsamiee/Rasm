# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
ignores: ['apps/roslyn/**']
utils:
    overload-return:
        any: [{pattern: void}, {matches: {csharp-generic-type: {name: {regex: '^(?:Fin|Either)$'}, list: {kind: type_argument_list}}}}]
    declared-value:
        kind: invocation_expression
        all:
            - has: {field: function, kind: identifier, pattern: {context: 'class $METHOD;', selector: identifier}}
            - inside:
                stopBy: end
                kind: compilation_unit
                all:
                    - has:
                        stopBy: end
                        any:
                            - kind: method_declaration, local_function_statement
                              all:
                                - has: {field: name, pattern: {context: 'class $METHOD;', selector: identifier}}
                                - not: {has: {field: type_parameters, kind: type_parameter_list}}
                                - not: {has: {field: type, matches: overload-return}}
                    - not:
                        has:
                            stopBy: end
                            any:
                                - kind: method_declaration, local_function_statement
                                  all:
                                    - has: {field: name, pattern: {context: 'class $METHOD;', selector: identifier}}
                                    - any: [{has: {field: type_parameters, kind: type_parameter_list}}, {has: {field: type, matches: overload-return}}]
    lifted-thunk:
        kind: invocation_expression
        all:
            - matches: {csharp-owner-call: {type: {regex: '^IO$'}, member: {regex: '^lift$'}}}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 2}}
                    - has:
                        kind: argument
                        has:
                            kind: lambda_expression
                            all:
                                - not: {has: {field: type, pattern: $_}}
                                - not: {has: {kind: modifier, regex: '^async$'}}
                                - matches: csharp-parameterless
                                - has:
                                    field: body
                                    any:
                                        - kind: 'object_creation_expression, tuple_expression'
                                        - matches: declared-value
    lifted-value:
        kind: invocation_expression
        all:
            - has: {field: function, any: [{matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^pure$'}}}}, {matches: {csharp-owner-member: {type: {regex: '^Fin$'}, member: {regex: '^Succ$'}}}}, {matches: {csharp-type-name: {name: {regex: '^(Pure|FinSucc)$'}}}}]}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 2}}
                    - has: {kind: argument, matches: csharp-positional-argument}
rule:
    kind: from_clause
    all:
        - has: {field: name, pattern: {context: 'class $RANGE;', selector: identifier}}
        - not: {has: {field: type, pattern: $_}}
        - precedes: {kind: select_clause, has: {kind: identifier, pattern: {context: 'class $RANGE;', selector: identifier}}}
        - follows: {stopBy: end, kind: from_clause}
        - has: {kind: invocation_expression, pattern: $SOURCE, any: [{matches: lifted-thunk}, {matches: lifted-value}]}
message: 'Last `from` binds `$RANGE` to `$SOURCE` and selects it unchanged'
note: 'Replace the last `from` and its `select` with `select <value>`'
