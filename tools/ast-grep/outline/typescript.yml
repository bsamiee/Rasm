      fix: (…)
transform:
    OWNER: {replace: {source: $MODULE, replace: $, by: .}}
    LABEL: {replace: {source: $NAME, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [block, call]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n(?s:.*?)(?:\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*([)\]}>`"'';,]*)|)$', by: …$1}}
