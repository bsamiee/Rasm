# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-option-nullable-by-hand
language: csharp
severity: error
utils:
    type-named:
        any:
            - kind: identifier
              pattern: $TYPE_NAME
            - kind: generic_name
              has: {kind: identifier, pattern: $TYPE_NAME}
            - kind: qualified_name
              has: {field: name, matches: type-named}
    type-declared:
        inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                any:
                    - kind: class_declaration, interface_declaration, delegate_declaration
                      has: {field: name, pattern: $TYPE_NAME}
                    - kind: record_declaration
                      all:
                        - has: {field: name, pattern: $TYPE_NAME}
                        - not: {has: {regex: '^struct$'}}
    type-constrained:
        inside:
            stopBy: end
            kind: method_declaration, local_function_statement, class_declaration, struct_declaration, record_declaration, interface_declaration, delegate_declaration
            has:
                kind: type_parameter_constraints_clause
                all:
                    - has: {kind: identifier, pattern: $TYPE_NAME}
                    - has: {kind: type_parameter_constraint, regex: '^class\s*\??$'}
    reference-type:
        any:
            - kind: nullable_type
              has: {field: type, matches: reference-type}
            - kind: predefined_type
              regex: '^(string|object|dynamic)$'
            - kind: identifier, generic_name, qualified_name
              all:
                - matches: type-named
                - matches: type-declared
            - kind: identifier
              all:
                - matches: type-named
                - matches: type-constrained
    receiver:
        any:
            - kind: identifier
              pattern: $NAME
            - kind: member_access_expression
              has: {field: name, pattern: $NAME}
    declaration:
        any:
            - kind: parameter, property_declaration, declaration_expression
              has: {field: name, pattern: $NAME}
            - kind: variable_declaration
              has: {kind: variable_declarator, has: {field: name, pattern: $NAME}}
    element-type:
        any:
            - kind: nullable_type
              has: {field: type, matches: element-type}
            - kind: qualified_name
              has: {field: name, pattern: $TYPE}
            - not: {kind: qualified_name}
              pattern: $TYPE
    option-type:
        kind: generic_name
        all:
            - has: {kind: identifier, regex: '^Option$'}
            - has: {kind: type_argument_list, all: [{has: {nthChild: 1, matches: element-type}}, {not: {has: {nthChild: 2}}}]}
    member:
        kind: method_declaration, local_function_statement, constructor_declaration, accessor_declaration, operator_declaration, lambda_expression, anonymous_method_expression, property_declaration, indexer_declaration
    option-declaration:
        matches: declaration
        has: {field: type, matches: option-type}
    reference-declaration:
        matches: option-declaration
        has: {field: type, has: {kind: type_argument_list, has: {nthChild: 1, matches: reference-type}}}
    other-declaration:
        matches: declaration
        not: {has: {field: type, matches: option-type}}
    held:
        all:
            - matches: receiver
            - any:
                - all:
                    - inside: {stopBy: end, matches: member, has: {stopBy: end, matches: option-declaration}}
                    - not: {inside: {stopBy: end, matches: member, has: {stopBy: end, matches: other-declaration}}}
                - all:
                    - not: {inside: {stopBy: end, matches: member, has: {stopBy: end, matches: declaration}}}
                    - inside:
                        stopBy: end
                        kind: compilation_unit
                        all:
                            - has: {stopBy: end, matches: option-declaration}
                            - not: {has: {stopBy: end, matches: other-declaration}}
    reference-held:
        all:
            - matches: held
            - any:
                - inside: {stopBy: end, matches: member, has: {stopBy: end, matches: reference-declaration}}
                - all:
                    - not: {inside: {stopBy: end, matches: member, has: {stopBy: end, matches: declaration}}}
                    - inside: {stopBy: end, kind: compilation_unit, has: {stopBy: end, matches: reference-declaration}}
    case-read:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^Case$'}
                - has: {field: expression, matches: held}
            - kind: parenthesized_expression
              has: {matches: case-read}
    empty:
        any:
            - kind: null_literal, default_expression
            - kind: cast_expression
              has: {field: value, kind: null_literal}
            - kind: postfix_unary_expression
              regex: '!$'
              has: {matches: empty}
            - kind: parenthesized_expression
              has: {matches: empty}
    identity:
        any:
            - kind: identifier
              regex: '^identity$'
            - kind: lambda_expression
              all:
                - has:
                    field: parameters
                    any:
                        - kind: implicit_parameter
                          pattern: $IDENTITY_PARAMETER
                        - kind: parameter_list
                          all:
                            - has: {kind: parameter, nthChild: 1, has: {field: name, pattern: $IDENTITY_PARAMETER}}
                            - not: {has: {kind: parameter, nthChild: 2}}
                - has: {field: body, kind: identifier, pattern: $IDENTITY_PARAMETER}
    absent:
        kind: lambda_expression
        all:
            - has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
            - has: {field: body, matches: empty}
    conversion:
        kind: as_expression, cast_expression, conditional_expression, invocation_expression
        all:
            - any:
                - kind: as_expression
                  all:
                    - has: {field: right, not: {kind: nullable_type}, matches: element-type}
                    - has: {field: left, matches: case-read}
                - kind: cast_expression
                  all:
                    - has: {field: type, matches: element-type}
                    - has: {field: value, matches: case-read}
                - kind: conditional_expression
                  all:
                    - has:
                        field: condition
                        kind: is_pattern_expression
                        all:
                            - has: {field: pattern, kind: declaration_pattern, all: [{has: {field: type, matches: element-type}}, {has: {field: name, pattern: $BOUND}}]}
                            - has: {field: expression, matches: case-read}
                    - has: {field: consequence, kind: identifier, pattern: $BOUND}
                    - has: {field: alternative, matches: empty}
                - kind: conditional_expression
                  any:
                    - all:
                        - has: {field: condition, kind: member_access_expression, all: [{has: {field: name, regex: '^IsSome$'}}, {has: {field: expression, matches: held}}]}
                        - has: {field: consequence, kind: cast_expression, all: [{has: {field: type, matches: element-type}}, {has: {field: value, matches: receiver}}]}
                        - has: {field: alternative, matches: empty}
                    - all:
                        - has: {field: condition, kind: member_access_expression, all: [{has: {field: name, regex: '^IsNone$'}}, {has: {field: expression, matches: held}}]}
                        - has: {field: alternative, kind: cast_expression, all: [{has: {field: type, matches: element-type}}, {has: {field: value, matches: receiver}}]}
                        - has: {field: consequence, matches: empty}
                - kind: invocation_expression
                  all:
                    - has:
                        field: function
                        kind: member_access_expression
                        all:
                            - has: {field: name, kind: generic_name, regex: '^Match\s*<', has: {kind: type_argument_list, has: {nthChild: 1, matches: element-type}}}
                            - has: {field: expression, matches: held}
                    - has:
                        field: arguments
                        all:
                            - has: {kind: argument, nthChild: 1, has: {matches: identity}}
                            - has: {kind: argument, nthChild: 2, has: {matches: absent}}
                            - not: {has: {kind: argument, nthChild: 3}}
                - kind: invocation_expression
                  all:
                    - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^IfNone$'}}, {has: {field: expression, matches: held}}]}
                    - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, has: {matches: empty}}}, {not: {has: {kind: argument, nthChild: 2}}}]}
            - not: {has: {stopBy: end, kind: comment}}
            - not: {inside: {stopBy: end, kind: ERROR}}
            - not: {has: {stopBy: end, kind: ERROR}}
    reference-conversion:
        all:
            - matches: conversion
            - any:
                - kind: as_expression
                  has: {stopBy: end, matches: held, pattern: $REFERENCE}
                - has: {stopBy: end, matches: reference-held, pattern: $REFERENCE}
    value-conversion:
        kind: 'cast_expression, conditional_expression, invocation_expression'
        all:
            - matches: conversion
            - not: {has: {stopBy: end, matches: reference-held}}
            - has: {stopBy: end, matches: held, pattern: $VALUE}
            - not: {has: {stopBy: end, kind: default_expression}}
            - not: {kind: cast_expression, has: {field: type, not: {kind: nullable_type}}}
    unnamed:
        kind: argument
        not: {has: {field: name, kind: identifier}}
    some-argument:
        kind: argument
        any:
            - has: {field: name, kind: identifier, regex: '^Some$'}
            - all: [{nthChild: {position: 1, ofRule: {kind: argument}}}, {matches: unnamed}]
    null-value:
        any:
            - kind: null_literal
            - kind: cast_expression
              has: {field: value, kind: null_literal}
            - kind: postfix_unary_expression
              regex: '!$'
              has: {matches: null-value}
            - kind: parenthesized_expression
              has: {matches: null-value}
    none-argument:
        kind: argument
        all:
            - any:
                - has: {field: name, kind: identifier, regex: '^None$'}
                - all: [{nthChild: {position: 2, ofRule: {kind: argument}}}, {matches: unnamed}]
            - has:
                nthChild: {position: 1, reverse: true}
                kind: lambda_expression
                all:
                    - has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
                    - has: {field: body, matches: null-value}
    lifted-conversion:
        kind: invocation_expression
        all:
            - has: {field: arguments, all: [{has: {matches: none-argument}}, {not: {has: {kind: argument, nthChild: {position: 3, ofRule: {kind: argument}}}}}]}
            - any:
                - all:
                    - has: {field: function, kind: member_access_expression, all: [{has: {field: name, kind: identifier, regex: '^Match$'}}, {has: {field: expression, pattern: $BARE}}]}
                    - has: {field: arguments, has: {all: [{matches: some-argument}, {matches: {csharp-unary-callback: {parameter: {pattern: $PARAMETER}, body: {pattern: $PARAMETER}}}}]}}
                - all:
                    - has:
                        field: function
                        kind: member_access_expression
                        all:
                            - has: {field: expression, pattern: $LIFTED}
                            - has:
                                field: name
                                any:
                                    - kind: identifier
                                      regex: '^Match$'
                                    - kind: generic_name
                                      all:
                                        - has: {kind: identifier, regex: '^Match$'}
                                        - has: {kind: type_argument_list, pattern: $TYPE_ARGUMENTS, not: {has: {nthChild: 2}}}
                    - has: {field: arguments, has: {matches: some-argument, has: {nthChild: {position: 1, reverse: true}, pattern: $SOME}}}
rule:
    any:
        - matches: reference-conversion
        - matches: value-conversion
        - matches: lifted-conversion
transform:
    REFERENCE_READ: {replace: {source: $REFERENCE, replace: '(?s)^(.*)$', by: '${1}.ValueUnsafe()'}}
    VALUE_READ: {replace: {source: $VALUE, replace: '(?s)^(.*)$', by: '${1}.ToNullable()'}}
    BARE_READ: {replace: {source: $BARE, replace: '(?s)^(.*)$', by: '${1}.ValueUnsafe()'}}
    LIFTED_MAP: {replace: {source: $LIFTED, replace: '(?s)^(.*)$', by: '${1}.Map'}}
    SOME_READ: {replace: {source: $SOME, replace: '(?s)^(.*)$', by: '(${1}).ValueUnsafe()'}}
fix: $REFERENCE_READ$VALUE_READ$BARE_READ$LIFTED_MAP$TYPE_ARGUMENTS$SOME_READ
message: '`$REFERENCE$VALUE$BARE$LIFTED` converts an `Option` to a nullable by hand'
note: Use `<option>.ValueUnsafe()` from `LanguageExt.UnsafeValueAccess` for a reference element, `<option>.ToNullable()` for a value element, and `<option>.Map<T?>(<some>).ValueUnsafe()` where `Some` maps the value or the element kind is unknown
