# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-cross-product
language: rust
utils:
    term:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^-$'}
            - any:
                - pattern: $A.$X * $B.$Y - $B.$X * $A.$Y
                - pattern: $A.$X * $B.$Y - $A.$Y * $B.$X
                - pattern: $B.$Y * $A.$X - $B.$X * $A.$Y
                - pattern: $B.$Y * $A.$X - $A.$Y * $B.$X
            - not: {pattern: $_.$X * $_.$X - $_}
    paired:
        inside:
            kind: function_item
            stopBy: {kind: function_item}
            all:
                - has:
                    stopBy: end
                    kind: 'let_declaration, parameter'
                    has:
                        field: pattern
                        any:
                            - pattern: {context: 'let [$AX, $AY] = v;', selector: slice_pattern}
                            - pattern: {context: 'let ($AX, $AY) = v;', selector: tuple_pattern}
                - has:
                    stopBy: end
                    kind: 'let_declaration, parameter'
                    has:
                        field: pattern
                        any:
                            - pattern: {context: 'let [$BX, $BY] = v;', selector: slice_pattern}
                            - pattern: {context: 'let ($BX, $BY) = v;', selector: tuple_pattern}
    local-term:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^-$'}
            - any:
                - all: [{pattern: $AX * $BY - $BX * $AY}, {matches: paired}]
                - all: [{pattern: $AX * $BY - $AY * $BX}, {matches: paired}]
                - all: [{pattern: $BY * $AX - $BX * $AY}, {matches: paired}]
                - all: [{pattern: $BY * $AX - $AY * $BX}, {matches: paired}]
    term-sum:
        kind: call_expression
        all:
            - any:
                - pattern: $I.map($F).sum()
                - pattern: $I.map($F).sum::<$T>()
            - has: {stopBy: end, kind: closure_expression, pattern: $F, has: {field: body, matches: term}}
rule:
    any:
        - matches: term-sum
        - matches: term
          not: {inside: {stopBy: end, matches: term-sum}}
        - matches: local-term
constraints:
    X: {regex: '^(x|y|z|0|1|2)$'}
    Y: {regex: '^(x|y|z|0|1|2)$'}
