# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-workbooks"
version           = "0.1.0"
edition.workspace = true
publish           = false
description       = "Spreadsheet workbooks read as XLS, XLSX, XLSB, and ODS and written as XLSX"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
thiserror        = { workspace = true }
derive_more      = { workspace = true }
serde            = { workspace = true }
jiff             = { workspace = true }
secrecy          = { workspace = true }
calamine         = { workspace = true }
msoffice-crypto  = { workspace = true }
ironcalc         = { workspace = true }
rust_xlsxwriter  = { workspace = true }
umya-spreadsheet = { workspace = true }
roxmltree        = { workspace = true }
zip              = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
