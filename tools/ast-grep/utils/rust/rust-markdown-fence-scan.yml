# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-markdown-fence-scan
language: rust
utils:
    fence:
        kind: string_literal
        regex: '^"(```|~~~)[^"]*"$'
rule:
    any:
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^(starts_with|strip_prefix|trim_start_matches)$'}}
            - has: {field: arguments, has: {nthChild: 1, matches: fence}}
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^(==|!=)$'}
            - any: [{has: {field: left, matches: fence}}, {has: {field: right, matches: fence}}]
        - kind: string_literal
          matches: fence
          inside: {kind: match_pattern, stopBy: end}
