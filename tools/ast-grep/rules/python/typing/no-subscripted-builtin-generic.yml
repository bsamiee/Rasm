# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-subscripted-builtin-generic
language: python
severity: error
metadata: {python-below: '3.14'}
rule:
    pattern: $G
    matches:
        python-evaluated-subscript:
            value:
                any:
                    - matches: {python-builtin-name: {name: {regex: '^(classmethod|memoryview|staticmethod)$'}}}
                    - matches: {python-member-use: {module: {regex: '^(_?(abc|ctypes|sqlite3)|types)$'}, name: {regex: '^(abstractclassmethod|abstractstaticmethod|py_object|Binary|UnionType)$'}}}
message: '`$G` has no `__class_getitem__` below Python 3.14 and raises `TypeError` when subscripted'
note: 'Write `<a> | <b>` for `types.UnionType`, else its `collections.abc` protocol or `type <Alias> = <class>[<args>]`'
