# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-single-reader-python
language: python
severity: error
utils:
    module-statement:
        kind: expression_statement
        inside: {kind: module}
    class-member:
        inside: {kind: block, inside: {kind: class_definition, field: body, any: [{inside: {kind: module}}, {inside: {kind: decorated_definition, inside: {kind: module}}}]}}
    folded:
        any:
            - matches: python-plain-string
            - kind: integer, float, true, false, none, ellipsis
            - kind: 'unary_operator, binary_operator, parenthesized_expression, tuple, expression_list'
              not: {has: {pattern: $_, not: {any: [{matches: folded}, {kind: comment}]}}}
    member:
        kind: attribute
        not: {has: {stopBy: end, kind: call}}
    literal:
        any:
            - matches: folded
            - matches: member
            - kind: identifier, lambda
            - kind: 'boolean_operator, not_operator, comparison_operator, conditional_expression, parenthesized_expression'
              not: {has: {pattern: $_, not: {any: [{matches: literal}, {kind: comment}]}}}
    table:
        any:
            - kind: dictionary
              not:
                any:
                    - has: {pattern: $_, not: {any: [{kind: comment}, {kind: pair, all: [{has: {field: key, any: [{matches: folded}, {matches: member}]}}, {has: {field: value, matches: literal}}]}]}}
                    - has: {kind: pair, nthChild: {position: 9, ofRule: {kind: pair}}}
            - kind: set
              not: {has: {pattern: $_, not: {any: [{matches: folded}, {matches: member}, {kind: comment}]}}}
            - kind: call
              all:
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^frozenset$'}}}}
                - has: {field: arguments, all: [{has: {kind: 'set, tuple, list', not: {has: {pattern: $_, not: {any: [{matches: folded}, {matches: member}, {kind: comment}]}}}}}, {not: {has: {nthChild: 2}}}]}
    lookup:
        any:
            - inside: {kind: subscript, field: value}
            - inside: {kind: attribute, field: object, has: {field: attribute, regex: '^get$'}, inside: {kind: call, field: function}}
            - follows: {pattern: $$OPERATOR, regex: '^(not\s+)?in$'}
    reference:
        kind: identifier
        pattern: $NAME
        not:
            any:
                - inside: {kind: attribute, field: attribute}
                - inside: {kind: keyword_argument, field: name}
                - inside: {kind: assignment, field: left, inside: {matches: module-statement}}
    mention:
        kind: identifier
        pattern: $NAME
        not:
            any:
                - inside: {kind: keyword_argument, field: name}
                - inside: {kind: function_definition, field: name}
    rebinding:
        kind: identifier
        pattern: $NAME
        any:
            - inside: {kind: 'parameters, lambda_parameters, list_splat_pattern, dictionary_splat_pattern, as_pattern_target, pattern_list, tuple_pattern, list_pattern, global_statement, nonlocal_statement, dotted_name'}
            - inside: {kind: 'default_parameter, typed_default_parameter, named_expression, function_definition, class_definition', field: name}
            - inside: {kind: aliased_import, field: alias}
            - inside: {kind: typed_parameter}
              nthChild: 1
            - inside: {kind: as_pattern}
              nthChild: {position: 1, reverse: true}
            - inside: {kind: augmented_assignment, field: left}
            - inside: {kind: 'assignment, for_statement, for_in_clause', field: left, not: {inside: {matches: module-statement}}}
    assigned:
        kind: expression_statement
        has: {kind: assignment, has: {field: left, pattern: $NAME}}
    function-owner:
        not: {inside: {stopBy: end, kind: function_definition}}
        any:
            - kind: function_definition
              not: {inside: {kind: decorated_definition}}
            - kind: decorated_definition
              has: {field: definition, kind: function_definition}
    statement-owner:
        kind: 'expression_statement, if_statement, for_statement, while_statement, try_statement, with_statement, match_statement, assert_statement, delete_statement, raise_statement'
        not: {any: [{inside: {stopBy: end, kind: function_definition}}, {has: {stopBy: end, kind: function_definition}}]}
        any:
            - inside: {kind: module}
            - matches: class-member
    owner:
        any:
            - matches: function-owner
            - matches: statement-owner
    entry:
        any:
            - has: {field: name, pattern: $ENTRY}
            - has: {field: definition, has: {field: name, pattern: $ENTRY}}
        inside: {kind: module, has: {stopBy: end, matches: statement-owner, has: {stopBy: end, kind: identifier, pattern: $ENTRY}}}
    reader:
        pattern: $READER
        all:
            - matches: owner
            - not: {matches: entry}
    caller:
        kind: function_definition, decorated_definition
        pattern: $READER
        all:
            - matches: function-owner
            - not: {any: [{has: {field: name, pattern: $NAME}}, {has: {field: definition, has: {field: name, pattern: $NAME}}}]}
            - not: {matches: entry}
    scoped:
        inside: {stopBy: end, kind: block, inside: {kind: function_definition, field: body}}
    holds-reference:
        any:
            - matches: reference
            - has: {stopBy: end, matches: reference}
    later-reference:
        matches: reference
        any:
            - follows: {stopBy: end, matches: holds-reference}
            - inside: {stopBy: end, follows: {stopBy: end, matches: holds-reference}}
    level:
        kind: block
        not: {inside: {kind: 'class_definition, match_statement', field: body}}
    nested-1: {has: {stopBy: end, matches: level}}
    nested-2: {has: {stopBy: end, all: [{matches: level}, {matches: nested-1}]}}
    nested-3: {has: {stopBy: end, all: [{matches: level}, {matches: nested-2}]}}
    enclosed-1: {inside: {stopBy: end, matches: level}}
    enclosed-2: {inside: {stopBy: end, all: [{matches: level}, {matches: enclosed-1}]}}
    enclosed-3: {inside: {stopBy: end, all: [{matches: level}, {matches: enclosed-2}]}}
    inner-level:
        matches: level
        not: {inside: {kind: function_definition, field: body, not: {inside: {stopBy: end, kind: function_definition}}}}
    deep-site:
        inside:
            stopBy: end
            all:
                - matches: inner-level
                - inside: {stopBy: end, all: [{matches: inner-level}, {inside: {stopBy: end, matches: inner-level}}]}
    exported:
        kind: expression_statement
        has:
            kind: assignment
            all:
                - has: {field: left, regex: '^__all__$'}
                - has: {field: right, has: {kind: string, has: {kind: string_content, pattern: $NAME}}}
rule:
    any:
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME, not: {regex: '^__\w+__$'}}
            - any:
                - has: {field: right, matches: literal}
                - all:
                    - has: {field: right, kind: dictionary, matches: table}
                    - inside: {kind: module, stopBy: end, not: {has: {stopBy: end, matches: reference, any: [{not: {matches: lookup}}, {matches: deep-site}]}}}
                - all:
                    - has: {field: right, kind: 'set, call', matches: table}
                    - inside: {kind: module, stopBy: end, not: {has: {stopBy: end, matches: reference, not: {matches: lookup}}}}
            - inside:
                matches: module-statement
                not:
                    any:
                        - follows: {stopBy: end, matches: assigned}
                        - precedes: {stopBy: end, matches: assigned}
            - inside:
                kind: module
                stopBy: end
                all:
                    - not: {has: {matches: exported}}
                    - has: {stopBy: end, kind: identifier, pattern: $NAME, matches: reference, inside: {stopBy: end, matches: reader}}
                    - not: {has: {stopBy: end, matches: reference, not: {inside: {stopBy: end, pattern: $READER, matches: owner}}}}
                    - not: {has: {stopBy: end, matches: rebinding}}
                    - not: {has: {stopBy: end, matches: reference, inside: {stopBy: end, kind: type}}}
                    - not:
                        all:
                            - has: {stopBy: end, matches: reference, not: {matches: scoped}}
                            - has: {stopBy: end, matches: later-reference}
        - kind: function_definition
          pattern: $DECLARATION
          all:
            - has: {field: name, pattern: $NAME, not: {regex: '_$'}}
            - any:
                - inside: {kind: module}
                - all:
                    - has: {field: name, regex: '^__?[A-Za-z0-9]'}
                    - any:
                        - matches: class-member
                        - inside: {kind: decorated_definition, matches: class-member, not: {has: {kind: decorator, not: {regex: '^@(staticmethod|classmethod)$'}}}}
            - any:
                - all:
                    - not: {has: {field: body, matches: nested-1}}
                    - inside: {kind: module, stopBy: end, has: {stopBy: end, matches: mention, inside: {stopBy: end, matches: caller, not: {matches: enclosed-3}}}}
                - all:
                    - has: {field: body, matches: nested-1}
                    - not: {has: {field: body, matches: nested-2}}
                    - inside: {kind: module, stopBy: end, has: {stopBy: end, matches: mention, inside: {stopBy: end, matches: caller, not: {matches: enclosed-2}}}}
                - all:
                    - has: {field: body, matches: nested-2}
                    - not: {has: {field: body, matches: nested-3}}
                    - inside: {kind: module, stopBy: end, has: {stopBy: end, matches: mention, inside: {stopBy: end, matches: caller, not: {matches: enclosed-1}}}}
            - inside:
                kind: module
                stopBy: end
                all:
                    - not: {has: {matches: exported}}
                    - not:
                        has:
                            stopBy: end
                            kind: identifier
                            pattern: $NAME
                            any:
                                - all: [{matches: mention}, {not: {inside: {stopBy: end, pattern: $READER, matches: function-owner}}}]
                                - all: [{matches: rebinding}, {not: {inside: {kind: function_definition, pattern: $DECLARATION}}}]
message: '`$NAME` has one reader'
note: 'Move the declaration into its reader as a nested `def`, a `match` for a mapping of up to eight rows, an `in` set display, or an inline literal'
labels:
    READER: {style: secondary, message: Only reader}
