# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: csharplang
severity: error
rule:
    kind: generic_name
    pattern: $TYPE
    regex: '^(Action[\p{White_Space}\x{FEFF}]*<[\p{White_Space}\x{FEFF}]*((global::)?System\.)?IDisposable[\p{White_Space}\x{FEFF}]*>|Func[\p{White_Space}\x{FEFF}]*<[\p{White_Space}\x{FEFF}]*((global::)?System\.)?IDisposable[\p{White_Space}\x{FEFF}]*,[\p{White_Space}\x{FEFF}]*(Unit|IO[\p{White_Space}\x{FEFF}]*<[\p{White_Space}\x{FEFF}]*Unit[\p{White_Space}\x{FEFF}]*>)[\p{White_Space}\x{FEFF}]*>)$'
message: '`$TYPE` passes a release callback'
note: 'Acquire through `use` and release at the owning operation''s `Bracket`, lifetime-long acquisitions run on owner''s `EnvIO`'
