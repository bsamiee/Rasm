# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-detached-task
language: swift
severity: error
rule:
    kind: call_expression
    has: {kind: navigation_expression, regex: '^Task\.detached$'}
message: '`Task.detached` launches work no parent''s cancellation, priority, or isolation reaches'
note: 'Add the work as a child task through `group.addTask` or `async let`'
