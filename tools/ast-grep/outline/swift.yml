---
id: swift-member-property
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-actor, swift-extension]
symbolType: property
utils:
    hidden: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}
rule:
    any:
        - kind: property_declaration
          pattern: $DECLARATION
          has: {field: name, kind: pattern, has: {field: bound_identifier, pattern: $NAME}}
          not: {has: {kind: pattern, follows: {kind: pattern, stopBy: end}}}
          any:
            - has: {kind: computed_property, has: {kind: computed_setter, pattern: $SETTER}}
            - has: {kind: computed_property, pattern: $GETTER, not: {has: {kind: computed_setter}}}
            - not: {has: {kind: computed_property}}
        - kind: simple_identifier
          pattern: $NAME
          inside:
            kind: pattern
            any:
                - inside: {kind: property_declaration, pattern: $BINDINGS}
                - inside: {kind: pattern, inside: {kind: property_declaration, pattern: $BINDINGS}}
transform:
    HEADER: {replace: {source: $DECLARATION, replace: '\s*(=|\{)[\s\S]*$', by: ''}}
    UNTRAILED: {replace: {source: $HEADER, replace: ',(\s*\n\s*[)\]>])', by: '$1'}}
    SIGNATURE: {replace: {source: $UNTRAILED, replace: '\s*\n\s*', by: ' '}}
    GET: {replace: {source: $GETTER, replace: '(?s)^.*$', by: ' { get }'}}
    SET: {replace: {source: $SETTER, replace: '(?s)^.*$', by: ' { get set }'}}
    BINDINGS_HEADER: {replace: {source: $BINDINGS, replace: '\s*\{[\s\S]*$', by: ''}}
    BINDINGS_UNTRAILED: {replace: {source: $BINDINGS_HEADER, replace: ',(\s*\n\s*[)\]>])', by: '$1'}}
    BINDINGS_LINE: {replace: {source: $BINDINGS_UNTRAILED, replace: '\s*\n\s*', by: ' '}}
name: $NAME
signature: $SIGNATURE$GET$SET$BINDINGS_LINE
isPublic:
    not:
        any:
            - has: {matches: hidden}
            - inside: {kind: property_declaration, stopBy: end, has: {matches: hidden}}

