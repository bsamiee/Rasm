# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    affix:
        kind: regex
        all:
            - has:
                field: pattern
                pattern: $PATTERN
                regex: '^(?:\^(?:[^\^$\\.*+?()\[\]{}|/]|\\[\^$\\.*+?()\[\]{}|/nrtvf]|\\x[0-9A-Fa-f]{2}|\\u(?:[0-9A-CEFa-cef][0-9A-Fa-f]{3}|[Dd][0-7][0-9A-Fa-f]{2}))+|(?:[^\^$\\.*+?()\[\]{}|/]|\\[\^$\\.*+?()\[\]{}|/nrtvf]|\\x[0-9A-Fa-f]{2}|\\u(?:[0-9A-CEFa-cef][0-9A-Fa-f]{3}|[Dd][0-7][0-9A-Fa-f]{2}))+\$)$'
            - not: {has: {field: flags, regex: '[gimy]'}}
    relay:
        kind: lexical_declaration
        all:
            - has: {field: kind, regex: '^const$'}
            - has: {kind: variable_declarator, all: [{has: {field: name, pattern: $RE}}, {has: {field: value, matches: affix}}]}
    source:
        any:
            - matches: affix
            - kind: identifier
              pattern: $RE
              inside:
                kind: program, statement_block
                stopBy: end
                has: {any: [{matches: relay}, {kind: export_statement, has: {matches: relay}}]}
    access:
        pattern: $$_ACCESS
        regex: '^\??\.$'
    condition:
        any:
            - inside: {field: condition, kind: 'if_statement, while_statement, do_statement, for_statement, ternary_expression'}
            - inside: {kind: unary_expression, has: {field: operator, regex: '^!$'}}
            - inside: {kind: binary_expression, has: {field: operator, regex: '^(&&|\|\|)$'}, matches: condition}
            - inside: {kind: parenthesized_expression, matches: condition}
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '^((globalThis|window|self)\.)?Boolean$', matches: typescript-global-reference}}}
    regex-call:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(test|exec)$'}}
            - has:
                field: arguments
                not: {has: {nthChild: 2}}
                any:
                    - has: {nthChild: 1, pattern: $RECEIVER, kind: &member 'identifier, this, member_expression, subscript_expression, call_expression, parenthesized_expression, non_null_expression, string, template_string'}
                    - pattern: $RECEIVER
                      all: [{has: {nthChild: 1, not: {kind: *member}}}, {not: {has: {kind: spread_element}}}, {not: {has: {regex: '^,$'}}}]
            - has: {field: function, all: [{has: {matches: access}}, {has: {field: object, matches: source}}]}
    text-call:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(match|search)$'}}
            - has: {field: arguments, not: {has: {nthChild: 2}}}
            - has: {field: function, all: [{has: {field: object, pattern: $RECEIVER}}, {has: {matches: access}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: source}}
rule:
    pattern: $NODE
    any:
        - kind: call_expression
          all:
            - matches: regex-call
            - any: [{has: {field: function, has: {field: property, regex: '^test$'}}}, {matches: condition}]
        - kind: call_expression
          all:
            - has: {field: function, has: {field: property, regex: '^match$'}}
            - matches: text-call
            - matches: condition
        - kind: binary_expression
          all:
            - has: {field: operator, regex: '^[!=]==?$'}
            - has: {field: right, kind: 'null'}
            - has:
                field: left
                any:
                    - all: [{has: {field: function, has: {field: property, regex: '^exec$'}}}, {matches: regex-call}]
                    - all: [{has: {field: function, has: {field: property, regex: '^match$'}}}, {matches: text-call}]
        - kind: binary_expression
          all:
            - has: {field: left, kind: call_expression, has: {field: function, has: {field: property, regex: '^search$'}}}
            - has: {field: left, matches: text-call}
            - any:
                - all: [{has: {field: operator, regex: '^(!==?|===?|>)$'}}, {has: {field: right, regex: '^-[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*1$'}}]
                - all: [{has: {field: operator, regex: '^(>=|<)$'}}, {has: {field: right, regex: '^0$'}}]
                - all:
                    - has: {field: operator, regex: '^(!==?|===?)$'}
                    - has: {field: right, regex: '^0$'}
                    - inside: {kind: program, stopBy: end, has: {stopBy: end, kind: regex_pattern, pattern: $PATTERN, regex: '^\^'}}
    not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
message: '`$NODE` tests a fixed prefix or suffix through a regular expression'
note: 'Call `<text>.startsWith(<string>)` or `<text>.endsWith(<string>)`'
