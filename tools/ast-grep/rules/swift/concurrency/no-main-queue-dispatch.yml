# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-main-queue-dispatch
language: swiftlang
severity: error
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, pattern: $DISPATCH}
        - any:
            - has:
                nthChild: 1
                kind: navigation_expression
                regex: '^((Dispatch\.)?DispatchQueue\.main\.(async|sync|asyncAndWait)|(Foundation\.)?(RunLoop\.main\.perform|OperationQueue\.main\.addOperation))$'
            - all:
                - has: {nthChild: 1, kind: simple_identifier, regex: '^CFRunLoopPerformBlock$'}
                - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 1, regex: '^CFRunLoopGetMain\(\)$'}}}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, nthChild: 1, has: {field: name, regex: '^onMainThread$'}}}}
message: '`$DISPATCH` hands work to the main thread outside actor isolation checking'
note: 'Declare the caller or callee `@MainActor`, start work from synchronous code as `Task { @MainActor in <work> }`, or await `MainActor.run` for `sync`'
