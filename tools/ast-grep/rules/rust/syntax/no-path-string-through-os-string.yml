# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-path-string-through-os-string
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $P.into_os_string().into_string()
fix: $P.into_string()
message: '`$P` converts to `String` through an intermediate `OsString`'
note: 'Call `<path buf>.into_string()` on a `PathBuf`, `into_string` returns the path as the error for non-UTF-8 content in place of its `OsString`'
