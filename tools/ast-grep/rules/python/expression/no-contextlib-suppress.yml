# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-contextlib-suppress
language: python
severity: error
rule:
    matches: {python-module-member: {module: {regex: '^contextlib$'}, name: {regex: '^suppress$', pattern: $NAME}}}
message: '`$NAME` hides the failure it catches, the form of a `Result` returned from the call or an `Error(<failure>)` mapped in a boundary adapter'
