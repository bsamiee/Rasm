# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-string-by-data-encoding
language: swift
severity: error
rule:
    any:
        - pattern: 'String(data: $D, encoding: .utf8)'
        - pattern: 'String(data: $D, encoding: String.Encoding.utf8)'
        - pattern: 'String(bytes: $D, encoding: .utf8)'
        - pattern: 'String(bytes: $D, encoding: String.Encoding.utf8)'
fix: 'String(validating: $D, as: UTF8.self)'
message: '`String(data:encoding:)` with `.utf8` round-trips through Foundation'
note: '`String(validating: <data>, as: UTF8.self)` of the standard library returns the same optional'
