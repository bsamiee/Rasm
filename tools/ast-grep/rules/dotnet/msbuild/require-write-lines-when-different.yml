# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-write-lines-when-different
language: xml
severity: error
rule:
    matches: msbuild-tag
    pattern: _TAG
    all:
        - has: {kind: Name, regex: '^WriteLinesToFile$'}
        - has: {matches: {msbuild-attribute: {name: {regex: '^Overwrite$'}, value: {regex: '(?i)^["'']\s*(true|on|yes|!false|!off|!no)\s*["'']$'}}}}
        - not: {has: {kind: Attribute, has: {kind: Name, regex: '^WriteOnlyWhenDifferent$'}}}
transform:
    RESULT: replace($TAG, replace='(/?>)$', by=' WriteOnlyWhenDifferent="true"$1')
fix: $RESULT
message: '`WriteLinesToFile` with `Overwrite` updates the timestamp when the content is unchanged'
note: Add `WriteOnlyWhenDifferent="true"`
