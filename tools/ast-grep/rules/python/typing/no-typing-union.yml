# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-typing-union
language: python
severity: error
rule:
    matches: {python-module-member: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^(Optional|Union)$', pattern: $NAME}}}
message: '`$NAME` spells a union the `|` operator writes'
note: Write `<a> | <b>`, `<type> | None` for absence, or `Option` and `Result` from expression for fallibility
