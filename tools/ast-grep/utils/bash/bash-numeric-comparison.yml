# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# A comparison inside [ ] or [[ ]] with a number on either side, the string and the arithmetic operator spellings alike
id: bash-numeric-comparison
language: bash
rule:
    kind: binary_expression
    all:
        - has: {field: operator, regex: '^(=|==|!=|<|>|-eq|-ne|-lt|-le|-gt|-ge)$'}
        - any:
              - has: {field: left, matches: bash-number-operand}
              - has: {field: right, matches: bash-number-operand}
