# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-asserted-row-type
language: tsx
severity: error
rule:
    any:
        - kind: instantiation_expression
          all:
            - has: {kind: identifier, regex: '^sql$'}
            - has: {field: type_arguments, kind: type_arguments, pattern: $TYPE}
            - inside: {kind: call_expression, stopBy: {kind: call_expression}, has: {field: arguments, kind: template_string}}
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, regex: '^sql$'}}, {has: {field: property, regex: '^unsafe$'}}]}
            - has: {field: type_arguments, kind: type_arguments, pattern: $TYPE}
message: '`$TYPE` asserts a row shape the client never checks'
note: 'Decode rows through `SqlSchema.findAll`, `findOne`, `findOneOption`, or `findNonEmpty` with a `Result` schema and an untyped `execute` statement'
