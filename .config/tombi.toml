# --- [FILES] ----------------------------------------------------------------------------

[files]
exclude = [".config/mise/locks/**", "assets/**"]

# --- [FORMAT] ---------------------------------------------------------------------------

[format.rules]
indent-width                    = 4
key-value-equals-sign-alignment = true
trailing-comment-alignment      = true
trailing-comment-space-width    = 1

# --- [EXTENSIONS] -----------------------------------------------------------------------

[extensions."tombi-toml/cargo".lsp.inlay-hint.default-features]
enabled = false

[extensions."tombi-toml/pyproject".lsp.inlay-hint.dependency-version]
enabled = false

# --- [SCHEMAS] --------------------------------------------------------------------------

[schema.format.rules]
table-keys-order.enabled   = false
array-values-order.enabled = false

[[schemas]]
path    = "https://www.schemastore.org/cargo.json" # Bundled copy lacks the artifact dependency fields SchemaStore holds
include = ["**/Cargo.toml"]

[[schemas]]
path    = "https://mise.jdx.dev/schema/mise.json"
include = [".config/mise.*.toml"]

[[schemas]]
path    = "https://pixi.sh/latest/schema/manifest/schema.json" # SchemaStore's row reads the schema of Pixi's unreleased main branch
include = ["pixi.toml"]
