# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: extendscript-global-reference
language: extendscript
utils:
    scope: {kind: 'program, function_declaration, function_expression'}
    hoisted:
        any:
            - kind: variable_declarator
              has: {field: name, pattern: $GLOBAL}
            - kind: function_declaration
              has: {field: name, pattern: $GLOBAL}
            - kind: for_in_statement
              all: [{has: {field: kind, regex: '^var$'}}, {has: {field: left, pattern: $GLOBAL}}]
            - kind: assignment_expression
              has: {field: left, pattern: $GLOBAL}
rule:
    kind: identifier
    pattern: $GLOBAL
    not:
        inside:
            stopBy: end
            any:
                - kind: function_declaration, function_expression
                  any:
                    - has: {field: name, pattern: $GLOBAL}
                    - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, pattern: $GLOBAL}}}
                - kind: catch_clause
                  has: {field: parameter, pattern: $GLOBAL}
                - matches: scope
                  has: {stopBy: {kind: 'function_declaration, function_expression'}, matches: hoisted}
