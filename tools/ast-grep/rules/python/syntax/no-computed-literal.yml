# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-computed-literal
language: python
severity: error
utils:
    printable-escape:
        kind: escape_sequence
        regex: '^\\(x|u00|U000000)(2[0-9A-Fa-f]|[3-6][0-9A-Fa-f]|7[0-9A-Ea-e])$|^\\(0?[4-7][0-7]|1[0-6][0-7]|17[0-6])$|^\\N\{(?i:(LATIN (SMALL|CAPITAL) LETTER [A-Z]|DIGIT [A-Z]+|SPACE|(EXCLAMATION|QUOTATION|QUESTION) MARK|(NUMBER|DOLLAR|PERCENT|PLUS|EQUALS|LESS-THAN|GREATER-THAN) SIGN|AMPERSAND|APOSTROPHE|(LEFT|RIGHT) (PARENTHESIS|SQUARE BRACKET|CURLY BRACKET)|ASTERISK|COMMA|HYPHEN-MINUS|FULL STOP|(REVERSE )?SOLIDUS|COLON|SEMICOLON|COMMERCIAL AT|(CIRCUMFLEX|GRAVE) ACCENT|LOW LINE|VERTICAL LINE|TILDE))\}$'
    literal:
        any:
            - kind: 'integer, float, true, false, none'
            - matches: python-plain-string
            - kind: 'unary_operator, parenthesized_expression, tuple, list, set, dictionary, pair'
              not: {has: {pattern: $_, not: {matches: literal}}}
    literal-arguments:
        kind: argument_list
        not: {has: {pattern: $_, not: {any: [{matches: literal}, {kind: keyword_argument, has: {field: value, matches: literal}}]}}}
    text:
        any:
            - matches: python-plain-string
            - kind: parenthesized_expression
              has: {pattern: $_, matches: text}
    concatenation:
        kind: binary_operator
        all:
            - has: {field: operator, regex: '^\+$'}
            - has: {field: right, matches: text}
            - has: {field: left, any: [{matches: text}, {matches: concatenation}]}
    native-literal-call:
        any:
            - {pattern: str($A), has: {field: arguments, has: {kind: 'string, concatenated_string', not: {matches: python-bytes-literal}}}}
            - {pattern: int($A), has: {field: arguments, has: {any: [{kind: integer}, {kind: unary_operator, has: {field: argument, kind: integer}}]}}}
            - {pattern: float($A), has: {field: arguments, has: {any: [{kind: float}, {kind: unary_operator, has: {field: argument, kind: float}}]}}}
            - {pattern: bool($A), has: {field: arguments, has: {kind: 'true, false'}}}
rule:
    pattern: $S
    any:
        - {kind: string, not: {matches: python-bytes-literal}, has: {kind: string_content, has: {matches: printable-escape}}}
        - {kind: string, has: {kind: interpolation}, not: {has: {stopBy: end, kind: 'interpolation, format_expression', not: {has: {field: expression, matches: literal}}}}}
        - {matches: concatenation, not: {inside: {kind: binary_operator, matches: concatenation}}}
        - kind: call
          all:
            - has: {field: function, kind: attribute, all: [{has: {field: object, any: [{matches: text}, {regex: '^(str|bytes)$'}]}}, {not: {has: {field: attribute, regex: '^(join|split|rsplit)$'}}}]}
            - has: {field: arguments, matches: literal-arguments}
        - kind: call
          all:
            - has: {field: function, kind: identifier, regex: '^(ascii|bin|bool|bytes|chr|float|format|hex|int|oct|repr|str)$'}
            - has: {field: arguments, matches: literal-arguments, has: {pattern: $_}}
            - not: {matches: native-literal-call}
            - not: {all: [{has: {field: function, regex: '^bytes$'}}, {not: {has: {field: arguments, has: {nthChild: 1, kind: string, not: {matches: python-bytes-literal}}}}}]}
            - not: {all: [{has: {field: function, regex: '^chr$'}}, {not: {has: {field: arguments, all: [{has: {nthChild: 1, kind: integer, regex: '^(3[2-9]|[4-9]\d|1[01]\d|12[0-6]|0[xX](2[0-9a-fA-F]|[3-6][0-9a-fA-F]|7[0-9a-eA-E]))$'}}, {not: {has: {nthChild: 2}}}]}}}]}
            - not: {all: [{has: {field: function, regex: '^float$'}}, {has: {field: arguments, has: {nthChild: 1, has: {kind: string_content, regex: '(?i)^\s*[+-]?(inf(inity)?|nan)\s*$'}}}}]}
        - kind: subscript
          all:
            - has: {field: value, kind: 'string, concatenated_string, parenthesized_expression, tuple, list, dictionary', matches: literal}
            - has: {field: subscript, any: [{matches: literal}, {kind: slice, not: {has: {pattern: $_, not: {matches: literal}}}}]}
message: '`$S` computes a literal from literals'
note: 'Use one literal holding the result, a reader sees the value without evaluating code'
