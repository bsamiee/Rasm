id: require-catch-on-try
valid:
    - 'import { Effect } from "effect"; const parsed = Effect.try({ try: () => parse(raw), catch: (cause) => new ParseError({ cause }) });'
    - 'import { Effect } from "effect"; const loaded = Effect.tryPromise({ try: () => load(path), catch: (cause) => new LoadError({ cause }) });'
    - 'import { Either } from "effect"; const parsed = Either.try({ try: () => parse(raw), catch: (cause) => new ParseError({ cause }) });'
    - 'import { Micro } from "effect"; const parsed = Micro.try({ try: () => parse(raw), catch: (cause) => new ParseError({ cause }) });'
    - const parsed = Item.try(() => parse(raw));
    - import { Effect } from "effect"; const parsed = Effect.sync(() => parse(raw));
    - 'import { Effect } from "effect"; const parsed = Effect.try({ ...options, catch: (cause) => new ParseError({ cause }) });'
    - import { Effect } from "effect"; const parsed = Effect.try(run);
    - import { Effect } from "effect"; const loaded = Effect.tryPromise(client.load);
    - 'import { ParseResult } from "effect"; const parsed = ParseResult.try({ try: () => parse(raw), catch: (cause) => new ParseError({ cause }) });'
    - const Effect = adapter; Effect.try(() => parse(raw));
    - import type { Effect } from "effect"; Effect.try(() => parse(raw));
    - import { Effect } from "effect"; function run(Effect) { return Effect.try(() => parse(raw)); }
    # Missing member or unsupported overload belongs to the compiler; it establishes no conversion boundary.
    - import { Micro } from "effect"; Micro.try(() => parse(raw));
    # Missing member or unsupported overload belongs to the compiler; it establishes no conversion boundary.
    - import { Either } from "effect"; Either.tryPromise(() => load());
invalid:
    - import { Effect } from "effect"; const parsed = Effect.try(() => parse(raw));
    - import { Effect } from "effect"; const loaded = Effect.tryPromise(() => load(path));
    - import { Either } from "effect"; const parsed = Either.try(() => parse(raw));
    - import { Effect } from "effect"; const parsed = Effect.try(function () { return parse(raw); });
    - import { Effect } from "effect"; const loaded = Effect.tryPromise((signal) => load(path, signal));
    - import { STM } from "effect"; const parsed = STM.try(() => parse(raw));
    - import { Effect as E } from "effect"; E.try(() => parse(raw));
    - import * as E from "effect/Effect"; E.tryPromise(async () => load());
    - import { Effect } from "effect"; Effect.try((() => parse(raw)));
