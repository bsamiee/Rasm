id: no-alias-declaration
valid:
    - 'let current = 1; export const initial = current; current = 2; console.log(initial, current);'
    - 'import { current } from "./state"; export const initial = current;'
    - 'const table = load(); let rows = table; rows = reload();'
    - 'const rows = table; function read() { const table = load(); }'
    - 'export const rows = load(table);'
    - 'const TABLE = load(); const rows: Readonly<Record<string, Row>> = TABLE;'
    - 'const isSecrets: (value: unknown) => value is Secrets = isStringRecord;'
    - 'const read = (): Row => { const held = row; return held; };'
    - 'function read(): Row { const held = row; return held; }'
    - 'const limit = Infinity;'
    - 'const missing = NaN;'
    - 'const host = globalThis;'
    - 'const empty = undefined;'
    - 'const rows = table.rows;'
    - 'const rows = table as Rows;'
    - 'const { rows } = table;'
    - 'type Row = Schema.Row;'
    - 'type Rows = readonly Row[];'
    - 'type Kind = Row | Column;'
    - 'type Id<T> = T;'
    - 'const self = this;'
    - 'export { table };'
    - "export { Row as SchemaRow } from './schema';"
    - 'export { table as default };'
    - 'const { rows = table } = load(); const held = table;'
    - 'function build() { function load() {} } const run = load;'
    - 'const Base = class Item {}; const run = Item;'
invalid:
    - 'export { table as rows };'
    - 'export { table as rows, other };'
    - 'export type { Row as Item };'
    - 'const MS_PER_HOUR = 3600000; const tick = MS_PER_HOUR;'
    - 'const table = load(); export const rows = table;'
    - 'export const table = load(); const rows = table;'
    - 'type Row = Item;'
    - 'export type Row = Item;'
    - 'export { type Row as Item };'
    - 'const { table } = load(); const rows = table;'
    - 'const [table] = load(); const rows = table;'
    - 'function load() {} const run = load;'
    - 'export class Item {} const Row = Item;'
    - 'const { raw: table } = load(); const rows = table;'
    - 'const { rows: [table] } = load(); const held = table;'
    - 'const [...table] = load(); const rows = table;'
    - 'const [table = fallback] = load(); const rows = table;'
