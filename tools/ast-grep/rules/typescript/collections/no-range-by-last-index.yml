# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-range-by-last-index
language: tsx
severity: error
rule:
    kind: call_expression
    all:
        - pattern: '$RANGE(0, $N - 1)'
        - has: {field: function, matches: {effect-module-member: {module: {regex: '\bArray$'}, member: {regex: '^range$'}}}}
message: '`$RANGE(0, $N - 1)` returns `[0]` when `$N` is 0'
note: 'Call `Array.makeBy(<count>, (index) => <value>)` to build a sequence from a length'
