# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-filter-over-lifted-value
language: tsx
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    not: {has: {stopBy: end, kind: comment}}
    any:
        - all:
            - any:
                - pattern: "$MODULE.filterOrFail($MODULE.succeed($_), $_, $_)"
                - pattern: "$MODULE.succeed($_).pipe($MODULE.filterOrFail($_, $_))"
                - pattern: "$MODULE.succeed($_).pipe($MODULE.filterOrFail($_, $_), $$$)"
                - pattern: "$PIPE($MODULE.succeed($_), $MODULE.filterOrFail($_, $_))"
                - pattern: "$PIPE($MODULE.succeed($_), $MODULE.filterOrFail($_, $_), $$$)"
            - has:
                stopBy: end
                kind: identifier
                pattern: $MODULE
                matches: {effect-module-reference: {module: {regex: "^(effect/)?Effect$"}}}
        - all:
            - any:
                - pattern: "$MODULE.filterOrLeft($MODULE.right($_), $_, $_)"
                - pattern: "$MODULE.right($_).pipe($MODULE.filterOrLeft($_, $_))"
                - pattern: "$MODULE.right($_).pipe($MODULE.filterOrLeft($_, $_), $$$)"
                - pattern: "$PIPE($MODULE.right($_), $MODULE.filterOrLeft($_, $_))"
                - pattern: "$PIPE($MODULE.right($_), $MODULE.filterOrLeft($_, $_), $$$)"
            - has:
                stopBy: end
                kind: identifier
                pattern: $MODULE
                matches: {effect-module-reference: {module: {regex: "^(effect/)?Either$"}}}
        - all:
            - any:
                - pattern: "$MODULE.filter($MODULE.some($_), $_)"
                - pattern: "$MODULE.some($_).pipe($MODULE.filter($_))"
                - pattern: "$MODULE.some($_).pipe($MODULE.filter($_), $$$)"
                - pattern: "$PIPE($MODULE.some($_), $MODULE.filter($_))"
                - pattern: "$PIPE($MODULE.some($_), $MODULE.filter($_), $$$)"
            - has:
                stopBy: end
                kind: identifier
                pattern: $MODULE
                matches: {effect-module-reference: {module: {regex: "^(effect/)?Option$"}}}
constraints:
    PIPE: {matches: {effect-module-reference: {module: {regex: "^pipe$"}}}}
rewriters:
    - id: direct
      rule: {pattern: "$M.$FILTER($M.$LIFT($VALUE), $$$ARGS)"}
      fix: $M.liftPredicate($VALUE, $$$ARGS)
    - id: pipe
      rule:
        any:
            - pattern: "$M.$LIFT($VALUE).pipe($M.$FILTER($$$ARGS))"
            - pattern: "$PIPE($M.$LIFT($VALUE), $M.$FILTER($$$ARGS))"
              has: {field: function, kind: identifier}
      fix: $M.liftPredicate($VALUE, $$$ARGS)
    - id: pipe-function-steps
      rule:
        pattern: "$PIPE($M.$LIFT($VALUE), $M.$FILTER($$$ARGS), $$$REST)"
        has: {field: function, kind: identifier}
      fix: $PIPE($VALUE, $M.liftPredicate($$$ARGS), $$$REST)
    - id: pipe-method-steps
      rule:
        pattern: "$M.$LIFT($VALUE).pipe($M.$FILTER($$$ARGS), $$$REST)"
      fix: $M.liftPredicate($VALUE, $$$ARGS).pipe($$$REST)
transform:
    LIFT: rewrite($CALL, rewriters=[direct, pipe, pipe-function-steps, pipe-method-steps])
labels: {CALL: {style: primary}}
fix: $LIFT
message: '`$MODULE` lifts a value and filters it in one expression'
note: '`<module>.liftPredicate(value, predicate, orFailWith)` lifts by the predicate, `Option.liftPredicate` takes no `orFailWith`'
