# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: 'off'
utils:
    schema-module:
        matches: { effect-module: { name: { regex: '(?-u:\b)Schema$' } } }
    schema-source:
        matches: { effect-module-source: { name: { regex: '(?-u:\b)Schema$' } } }
    extractor:
        kind: nested_type_identifier
        all:
            - has: { field: name, regex: &view '^(Type|Encoded|Iso|DecodingServices|EncodingServices)$' }
            - has:
                  field: module
                  any:
                      - { kind: nested_identifier, regex: '\.(Schema|Codec)$', has: { field: object, matches: schema-module } }
                      - { kind: identifier, matches: { typescript-import-reference: { source: { matches: schema-source }, exported: { regex: '^(Schema|Codec)$' } } } }
    constructor-view:
        kind: nested_type_identifier
        all:
            - has: { field: name, regex: *view }
            - has:
                  field: module
                  any:
                      - { kind: nested_identifier, regex: '\.(Struct|Record|Tuple|TupleWithRest|StructWithRest|TemplateLiteral|TemplateLiteralParser)$', has: { field: object, matches: schema-module } }
                      - { kind: identifier, matches: { typescript-import-reference: { source: { matches: schema-source }, exported: { regex: '^(Struct|Record|Tuple|TupleWithRest|StructWithRest|TemplateLiteral|TemplateLiteralParser)$' } } } }
    module:
        any:
            - matches: effect-namespace
            - kind: identifier
              pattern: $MODULE
              inside: { kind: program, stopBy: end, has: { kind: import_statement, has: { stopBy: end, kind: namespace_import, has: { kind: identifier, pattern: $MODULE } } } }
            - kind: call_expression
              has: { field: function, kind: import }
    non-schema:
        any:
            - kind: this
            - kind: identifier
              pattern: $ROOT
              any:
                  - matches: { typescript-local-binding: { owner: { not: { kind: program } } } }
                  - matches: { typescript-constant-value: { value: { matches: typescript-literal-expression } } }
                  - inside:
                        kind: program
                        stopBy: end
                        has:
                            stopBy: { not: { kind: 'export_statement, ambient_declaration, expression_statement' } }
                            kind: enum_declaration, internal_module, function_declaration, generator_function_declaration
                            has: { field: name, pattern: $ROOT }
            - kind: member_expression
              has: { field: object, matches: non-schema }
    member-holder:
        kind: identifier
        pattern: $HOLDER
        any:
            - matches:
                  typescript-constant-value:
                      value:
                          any:
                              - kind: &literal 'object, array, string, template_string, number, true, false, null, regex, arrow_function, function_expression, generator_function'
                              - matches: typescript-expression-wrapper
                                has: { stopBy: { not: { matches: typescript-expression-wrapper } }, kind: *literal }
            - inside:
                  kind: program
                  stopBy: end
                  has:
                      stopBy: { not: { kind: 'export_statement, ambient_declaration' } }
                      kind: class_declaration, abstract_class_declaration
                      all: [{ has: { field: name, pattern: $HOLDER } }, { not: { has: { kind: class_heritage } } }]
    viewed:
        kind: member_expression
        has: { kind: property_identifier, regex: *view, pattern: $VIEW }
    operand:
        any:
            - kind: type_query
              all:
                  - not: { has: { any: [{ matches: non-schema }, { matches: module }, { matches: member-holder }] } }
                  - not: { has: { stopBy: &chained { not: { kind: member_expression } }, kind: member_expression, has: { kind: property_identifier, regex: *view } } }
            - kind: parenthesized_type
              has: { matches: operand }
            - kind: lookup_type
              all:
                  - has: { nthChild: &first { position: 1, ofRule: { not: { kind: 'comment, html_comment' } } }, matches: operand }
                  - has: { kind: literal_type, has: { kind: string } }
    query:
        any:
            - kind: type_query
              has: { stopBy: *chained, matches: viewed, not: { has: { field: object, any: [{ matches: non-schema }, { matches: module }, { matches: member-holder }] } } }
            - kind: lookup_type
              all:
                  - has: { stopBy: { not: { kind: union_type } }, kind: literal_type, has: { kind: string, has: { kind: string_fragment, regex: *view, pattern: $VIEW } } }
                  - has: { nthChild: *first, matches: operand }
            - kind: generic_type
              all:
                  - has: { field: name, any: [{ matches: extractor }, { matches: constructor-view }], has: { field: name, pattern: $VIEW } }
                  - has: { field: type_arguments, has: { stopBy: end, kind: type_query } }
    restated:
        any:
            - matches: query
            - kind: parenthesized_type
              has: { matches: restated }
    restating-clause:
        kind: extends_type_clause
        all:
            - has: { matches: query }
            - not: { has: { pattern: $_, not: { any: [{ matches: query }, { kind: 'comment, html_comment' }] } } }
            - inside: { kind: interface_declaration, not: { has: { field: body, has: { pattern: $_, not: { kind: 'comment, html_comment' } } } } }
rule:
    any:
        - kind: type_alias_declaration
          all:
              - has: { field: value, matches: restated }
              - has: { field: name, pattern: $ALIAS }
        - kind: interface_declaration
          all:
              - has: { matches: restating-clause }
              - has: { field: name, pattern: $ALIAS }
        - matches: query
          pattern: $QUERY
          not:
              any:
                  - inside: { kind: type_alias_declaration, stopBy: { not: { kind: parenthesized_type } } }
                  - inside: { matches: restating-clause }
        - kind: generic_type
          pattern: $EXTRACTOR
          all:
              - has: { field: name, matches: extractor, has: { field: name, pattern: $MEMBER } }
              - not: { has: { field: type_arguments, has: { stopBy: end, kind: type_query } } }
              - has:
                    field: type_arguments
                    has:
                        nthChild: *first
                        any:
                            - { kind: 'type_identifier, nested_type_identifier, generic_type, lookup_type, array_type, tuple_type, object_type, parenthesized_type, predefined_type, this_type', pattern: $NARROW }
                            - { pattern: $WIDE }
transform:
    FLAT: { replace: { source: $QUERY, replace: &break '[\t-\r ]*\n[\t-\r ]*', by: '' } }
    QUERIED: { replace: { source: $FLAT, replace: '^(.+)$', by: '`${1}` queries a schema for a type, ' } }
    RESTATED: { replace: { source: $ALIAS, replace: '^(.+)$', by: '`${1}` restates a type queried from a schema, delete `${1}` and at each use ' } }
    DECODED: { replace: { source: $VIEW, replace: '^Type$', by: "name a record by its class, a shape a record holds by `<Owner>['<field>']`, or annotate nothing where `match`, a decoder, or a generic over the schema infers it" } }
    ENCODED: { replace: { source: $DECODED, replace: '^Encoded$', by: 'type undecoded input `unknown` and decode it, or annotate nothing where an encoder, a decoder, or a transformation of the schema infers it' } }
    REBUILT: { replace: { source: $ENCODED, replace: '^(Iso|DecodingServices|EncodingServices)$', by: 'annotate nothing where an operation over the schema infers `${1}`' } }
    EXTRACTED: { replace: { source: $EXTRACTOR, replace: *break, by: '' } }
    EXTRACTION: { replace: { source: $EXTRACTED, replace: '^(.+)$', by: '`${1}` extracts a schema view in place of `' } }
    NARROWED: { replace: { source: $NARROW, replace: *break, by: '' } }
    WIDENED: { replace: { source: $WIDE, replace: *break, by: '' } }
    GROUPED: { replace: { source: $WIDENED, replace: '^(.+)$', by: '(${1})' } }
    INDEXED: { replace: { source: $MEMBER, replace: '^(.+)$', by: "['${1}']`" } }
message: '$RESTATED$QUERIED$REBUILT$EXTRACTION$NARROWED$GROUPED$INDEXED'
note: "Record schemas are classes that are their own type, `Schema.Opaque` over a struct for plain objects and `Schema.Class` where instances hold members, and type parameters constrained to a schema read `<S>['<view>']`; an alias, a renamed sibling class, or a class declared only to name a type restates a query"
