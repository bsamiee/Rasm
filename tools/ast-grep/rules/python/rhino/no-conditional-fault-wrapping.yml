# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-conditional-fault-wrapping
language: python
severity: error
utils:
    fault:
        kind: call
        pattern: $FAULT
        has: {field: function, regex: '^Fault$'}
    one-fault:
        kind: 'tuple, list'
        has: {matches: fault}
        not: {has: {nthChild: 2}}
    empty:
        kind: 'tuple, list'
        not: {has: {pattern: $_}}
    lifted-fault:
        kind: call
        any:
            - all:
                - has: {field: function, regex: '^Faults\.of$'}
                - has: {field: arguments, has: {nthChild: 1, matches: fault}, not: {has: {nthChild: 2}}}
            - all:
                - has: {field: function, regex: '^Faults$'}
                - has: {field: arguments, has: {nthChild: 1, matches: one-fault}, not: {has: {nthChild: 2}}}
    joiner-argument:
        inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^(collect_faults|Faults\.of)$'}}}
    catch-all:
        kind: case_clause
        all:
            - has: {kind: case_pattern, has: {kind: dotted_name, not: {has: {nthChild: 2}}, has: {kind: identifier, pattern: $FAILED}}}
            - not: {has: {kind: case_pattern, nthChild: 2}}
            - not: {has: {kind: if_clause}}
            - has: {field: consequence, has: {kind: return_statement, has: {kind: call, pattern: 'Faults.of(*$FAILED)'}}}
    joined-match:
        kind: match_statement
        all:
            - has: {field: body, has: {matches: catch-all}}
            - not: {has: {field: body, has: {kind: case_clause, has: {kind: case_pattern, has: {stopBy: end, kind: class_pattern, has: {kind: dotted_name, regex: '^Faults$'}}}}}}
    joined-subject:
        any:
            - inside: {matches: joined-match}
            - inside: {kind: tuple, inside: {matches: joined-match}}
    wrapped-conditional:
        kind: conditional_expression
        any:
            - all: [{has: {nthChild: 1, matches: one-fault}}, {has: {nthChild: 3, matches: empty}}]
            - all: [{has: {nthChild: 1, matches: empty}}, {has: {nthChild: 3, matches: one-fault}}]
    lifted-conditional:
        kind: conditional_expression
        any:
            - all: [{has: {nthChild: 1, matches: lifted-fault}}, {has: {nthChild: 3, kind: none}}]
            - all: [{has: {nthChild: 1, kind: none}}, {has: {nthChild: 3, matches: lifted-fault}}]
    records-import:
        kind: import_from_statement
        has:
            any:
                - {kind: dotted_name, regex: '^(collect_faults|Faults)$', not: {nthChild: 1}}
                - {kind: aliased_import, has: {field: name, regex: '^(collect_faults|Faults)$'}}
rule:
    pattern: $UNPACKING
    all:
        - any:
            - kind: list_splat
              matches: joiner-argument
              has:
                kind: parenthesized_expression
                has: {matches: wrapped-conditional, pattern: $WRAPPED}
            - matches: lifted-conditional
              any: [{matches: joiner-argument}, {matches: joined-subject}]
              pattern: $LIFTED
        - inside: {kind: module, stopBy: end, has: {matches: records-import}}
rewriters:
    - id: fault-first
      rule: {kind: conditional_expression, all: [{has: {nthChild: 1, matches: one-fault}}, {has: {nthChild: 2, pattern: $TEST}}]}
      fix: '$FAULT if $TEST else None'
    - id: fault-last
      rule: {kind: conditional_expression, all: [{has: {nthChild: 2, pattern: $TEST}}, {has: {nthChild: 3, matches: one-fault}}]}
      fix: 'None if $TEST else $FAULT'
    - id: bare-fault
      rule: {matches: lifted-fault}
      fix: $FAULT
transform:
    SPLAT: rewrite($WRAPPED, rewriters=[fault-first, fault-last])
    BARE: rewrite($LIFTED, rewriters=[bare-fault])
fix: $SPLAT$BARE
message: '`$UNPACKING` wraps the lone `$FAULT` in a collection or `Faults` under a condition'
note: 'Use `<fault> if <test> else None`, `collect_faults` and `Faults.of` lift a bare `Fault` and drop `None`'
