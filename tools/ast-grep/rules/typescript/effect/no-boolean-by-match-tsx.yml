# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    true-arm:
        any:
            - matches: {typescript-constant-function: {result: {kind: 'true'}}}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^constTrue$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Function$'}}}}
    false-arm:
        any:
            - matches: {typescript-constant-function: {result: {kind: 'false'}}}
            - kind: member_expression
              all:
                - has: {field: property, regex: '^constFalse$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)Function$'}}}}
    boolean-cases:
        kind: object
        all:
            - not: {has: {nthChild: 3}}
            - not: {has: {kind: pair, has: {field: key, not: {kind: property_identifier}}}}
            - has: {kind: pair, has: {field: value, matches: true-arm}}
            - has: {kind: pair, has: {field: value, matches: false-arm}}
    boolean-match:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: object, pattern: $M}
                - has: {field: property, regex: "^match$"}
rule:
    matches: boolean-match
    all:
        - has: {field: arguments, has: {matches: boolean-cases}}
        - not: {pattern: Boolean.match($_)}
        - not: {has: {field: type_arguments, kind: type_arguments}}
        - not: {has: {kind: comment, stopBy: end}}
constraints:
    M:
        any:
            - pattern: Boolean
              matches: {effect-module: {name: {regex: '(?-u:\b)Boolean$'}}}
            - not: {pattern: Boolean}
              matches: {effect-module: {name: {regex: '(?-u:\b)(Option|Result|Exit|Effect)$'}}}
message: '`$M.match` maps one case to `true` and the other to `false`'
note: 'Call `<module>.is<Case>(<value>)`, or write `<value>` or `!<value>` in place of `Boolean.match`'
