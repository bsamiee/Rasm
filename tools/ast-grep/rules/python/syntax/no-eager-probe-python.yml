# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-eager-probe-python
language: python
severity: error
utils:
    lazy-filter:
        any:
            - matches: {python-builtin-name: {name: {regex: '^(filter|map)$'}}}
            - matches: {python-member-use: {module: {regex: '^itertools$'}, name: {regex: '^filterfalse$'}}}
    materialized:
        any:
            - kind: 'list_comprehension, set_comprehension, dictionary_comprehension'
            - kind: call
              all:
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^(list|tuple|set|frozenset|dict|sorted)$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, any: [{kind: generator_expression}, {kind: call, has: {field: function, matches: lazy-filter}}]}}, {not: {has: {nthChild: 2}}}]}
    count:
        kind: call
        any:
            - all:
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^len$'}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: materialized}}, {not: {has: {nthChild: 2}}}]}
            - all:
                - has: {field: function, matches: {python-builtin-name: {name: {regex: '^sum$'}}}}
                - has: {field: arguments, kind: generator_expression, has: {field: body, regex: '^(1|True)$'}}
    condition:
        any:
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition}
            - inside: {kind: 'if_clause, assert_statement'}
            - nthChild: 2
              inside: {kind: conditional_expression}
            - inside: {kind: 'boolean_operator, parenthesized_expression', matches: condition}
    refurb-length-test:
        kind: comparison_operator
        all:
            - has: {nthChild: 1, kind: call, has: {field: function, matches: {python-builtin-name: {name: {regex: '^len$'}}}}}
            - not: {has: {field: operators, regex: '^<$'}}
            - matches: condition
    zero:
        kind: integer
        regex: '^0$'
    one:
        kind: integer
        regex: '^1$'
rule:
    pattern: $TEST
    any:
        - kind: comparison_operator
          all:
            - not: {has: {nthChild: 3}}
            - not: {matches: refurb-length-test}
            - any:
                - all: [{has: {nthChild: 1, matches: count}}, {has: {nthChild: 2, matches: zero}}, {has: {field: operators, regex: '^(>|!=|==|<=)$'}}]
                - all: [{has: {nthChild: 1, matches: count}}, {has: {nthChild: 2, matches: one}}, {has: {field: operators, regex: '^(>=|<)$'}}]
                - all: [{has: {nthChild: 2, matches: count}}, {has: {nthChild: 1, matches: zero}}, {has: {field: operators, regex: '^(<|!=|==|>=)$'}}]
                - all: [{has: {nthChild: 2, matches: count}}, {has: {nthChild: 1, matches: one}}, {has: {field: operators, regex: '^(<=|>)$'}}]
        - matches: materialized
          any:
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition}
            - inside: {kind: not_operator, field: argument}
            - inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: {python-builtin-name: {name: {regex: '^bool$'}}}}}}
        - kind: comparison_operator
          all:
            - has: {field: operators, regex: '^(not\s+)?in$'}
            - has: {nthChild: 2, matches: materialized}
            - not: {matches: python-invariant-index-test}
message: '`$TEST` builds every match to test whether one exists'
note: 'Call `any(<test> for <item> in <source>)`, negated for an emptiness test, with `<needle> == <item>` as `<test>` for membership'
