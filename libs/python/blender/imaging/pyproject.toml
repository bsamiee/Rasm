# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-imaging"
version         = "0.1.0"
description     = "Image science: OCIO color, film formation, OIIO and EXR files, lenses and panoramas, sampling, and metering"
requires-python = ">=3.13"

dependencies = [
    # --- [CORE]

    "expression",     # Results, options, and collections of every module
    "msgspec",        # Records, tagged unions, and field bounds
    "optype",         # Native operator protocols with operand promotion and result types
    "rasm-records",   # Fault model, field domains, and record files

    # --- [MATHEMATICS]

    "numpy",          # Arrays for image planes and analysis
    "scipy",          # Color algebra, vector quadrature, FFT sizing, and zoom

    # --- [IMAGING]

    "colour-science", # CIE observer datasets, transfer functions, and colorimetry
    "imagecodecs",    # In-memory JPEG encoding and decoding for compressed image generations
    "matplotlib",     # Colour imports its plotting API eagerly and mocks it into the shared interpreter without it
    "opencolorio",    # Color processing, config authoring, and LUT baking
    "openimageio",    # Image IO and analysis
    "psdtags",        # Photoshop layer records for layered documents
    "scikit-image",   # Structural similarity over image comparison planes
    "tifffile",       # Linear Raw DNG and TIFF containers for layered documents
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
