# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: javalang
severity: error
utils:
    tail:
        kind: identifier
        pattern: $NEXT
        inside: {kind: &method 'method_declaration, constructor_declaration', stopBy: {kind: *method}, has: {field: parameters, has: {kind: formal_parameter, has: {field: name, pattern: $NEXT}}}}
    holds-tail:
        any:
            - matches: tail
            - has: {stopBy: end, matches: tail}
    appended:
        kind: method_invocation
        any:
            - all:
                - has: {field: name, pattern: concat}
                - has: {field: arguments, has: {nthChild: {position: 1, reverse: true, ofRule: {not: &comment {kind: 'line_comment, block_comment'}}}, matches: holds-tail}}
                - not: {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: *comment}}, matches: holds-tail}}}
            - all:
                - has: {field: name, regex: '^(addAll|appendAll|plusAll)$'}
                - has: {field: object, kind: method_invocation, has: {field: name, regex: '^(add|append|plus)$'}}
                - has: {field: arguments, has: {matches: holds-tail}}
            - all:
                - has: {field: name, regex: '^(prepend|prependAll)$'}
                - has: {field: object, matches: tail}
    extended:
        any:
            - matches: appended
            - has: {stopBy: end, matches: appended}
            - kind: identifier
              pattern: $CHAIN
              inside:
                stopBy: {kind: *method}
                kind: &branch 'enhanced_for_statement, for_statement, while_statement, lambda_expression'
                has:
                    stopBy: end
                    kind: expression_statement
                    has: {kind: method_invocation, pattern: $CHAIN.addAll($$$), has: {field: arguments, has: {matches: holds-tail}}}
                    follows: {stopBy: end, kind: expression_statement, has: {kind: method_invocation, pattern: $CHAIN.add($$$)}}
    invocation:
        kind: method_invocation
        all:
            - has: {field: name, pattern: $NAME}
            - any:
                - not: {has: {field: object, pattern: $_OBJECT}}
                - has: {field: object, kind: this}
            - has: {field: arguments, has: {matches: extended}}
            - inside: {stopBy: {kind: *method}, kind: *branch}
    consumed:
        kind: method_invocation
        all:
            - has: {field: object, kind: identifier, pattern: $NEXT}
            - any:
                - has: {field: name, regex: '^(getFirst|peek|peekFirst|element|head|tail|subList|pop|poll|pollFirst|removeFirst)$'}
                - all: [{has: {field: name, pattern: get}}, {has: {field: arguments, has: {pattern: '0'}}}]
rule:
    kind: method_declaration
    regex: 'concat|All|prepend'
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, has: {stopBy: {kind: *method}, matches: invocation}}
        - has: {field: body, has: {stopBy: {kind: *method}, matches: consumed}}
message: '`$NAME` appends tail `$NEXT` to each branch call and reads the tail separately'
note: Process each branch alone and join the tail once after branches finish
