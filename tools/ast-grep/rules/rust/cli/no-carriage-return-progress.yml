# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-carriage-return-progress
language: rust
severity: error
utils:
    leading-return:
        kind: string_literal
        regex: '^b?"(\\r|\\x0[dD]|\\u\{0*[dD]\})([^\\"]|\\[^n])'
    lone-return:
        any:
            - kind: string_literal
              regex: '^b?"(\\r|\\x0[dD]|\\u\{0*[dD]\})"$'
            - kind: char_literal
              regex: '^b?''(\\r|\\x0[dD]|\\u\{0*[dD]\})''$'
    trailing-return:
        kind: string_literal
        regex: '([^\\]|^b?")(\\\\)*(\\r|\\x0[dD]|\\u\{0*[dD]\})"$'
rule:
    pattern: $REDRAW
    any:
        - kind: macro_invocation
          all:
            - matches: {rust-std-macro: {name: {regex: '^(e?print(ln)?|write(ln)?|format(_args)?)$'}}}
            - any:
                - has: {kind: token_tree, has: {any: [{matches: leading-return}, {matches: lone-return}]}}
                - all:
                    - has: {field: macro, regex: '(^|::)(e?print|write)$'}
                    - has: {kind: token_tree, has: {matches: trailing-return}}
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^write(_all)?$'}}
            - has: {field: arguments, has: {nthChild: 1, any: [{matches: leading-return}, {matches: lone-return}, {matches: trailing-return}]}}
message: '`$REDRAW` redraws a progress line with a carriage return'
note: 'Drive an `indicatif::ProgressBar`, or a span under `tracing_indicatif::IndicatifLayer` through `IndicatifSpanExt::pb_inc`'
