# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-machine-path-literal-rust
language: rust
severity: error
rule:
    kind: 'string_literal, raw_string_literal, macro_invocation, call_expression'
    pattern: $PATH
    matches: rust-machine-path
message: '`$PATH` hardcodes a path from one machine, one platform''s home layout, or the build checkout into the product'
note: 'Take the location as an argument the boundary resolves at run time (a `clap` value, `std::env::current_exe`) and append segments with `Path::join`, or embed checkout content at build time with `include_str!`, an installed binary runs where no checkout exists'
