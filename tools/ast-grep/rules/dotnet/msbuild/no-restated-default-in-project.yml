# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-restated-default-in-project
language: xml
severity: error
files: ['**/*.csproj']
rule:
    pattern: _PROPERTY
    # One arm per value, the names in each arm hold that value as the SDK default or the Directory.Build.props value
    any:
        - matches: {msbuild-property-value: {name: {regex: '^OutputType$'}, text: {regex: '(?i)^\s*Library\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: "^(EnableDefaultItems|EnableDefaultCompileItems|GenerateAssemblyInfo|Deterministic|\
                CheckForOverflowUnderflow|GenerateDocumentationFile|PublishRepositoryUrl|IncludeSymbols)$"}, text: {regex: '(?i)^\s*true\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^(Nullable|ImplicitUsings)$'}, text: {regex: '(?i)^\s*enable\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^DebugType$'}, text: {regex: '(?i)^\s*portable\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^TargetFramework$'}, text: {regex: '(?i)^\s*net10\.0\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^SatelliteResourceLanguages$'}, text: {regex: '(?i)^\s*en\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^(Authors|Company)$'}, text: {regex: '(?i)^\s*bsamiee\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^RepositoryType$'}, text: {regex: '(?i)^\s*git\s*$'}}}
        - matches: {msbuild-property-value: {name: {regex: '^SymbolPackageFormat$'}, text: {regex: '(?i)^\s*snupkg\s*$'}}}
fix:
    template: ''
    expandEnd: {kind: CharData, regex: '^\s*$'}
message: The project file restates an SDK default or a Directory.Build.props value
note: Delete the element, the root file stays the one owner and a root change reaches the project
