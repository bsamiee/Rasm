id: field-allow-mutation-to-frozen
valid:
    - "pydantic.Field(repr=False)"
    - |
      pydantic.Field(
          allow_mutation=  # Preserve this explanation
          False
      )
    - "other.Field(allow_mutation=False)"
    - "pydantic.Field(allow_mutation=True)"
    - "pydantic.Field(allow_mutation=None)"
    - "pydantic.Field(allow_mutation=0)"
    - "pydantic.Field(allow_mutation=condition())"
    - "pydantic.Field(allow_mutation=False, frozen=False)"
    - "pydantic.Field(frozen=True, allow_mutation=False)"
    - "pydantic.Field(allow_mutation=False, **options)"
    - "pydantic.ConfigDict(allow_mutation=False)"
    - |
      from pydantic import Field
      def build(Field):
          return Field(allow_mutation=False)
    - |
      from pydantic import Field
      class Model:
          Field = factory
          value = Field(allow_mutation=False)
    - |
      from pydantic import Field
      Field(allow_mutation=(  # Retain this explanation
          False
      ))
invalid:
    - "pydantic.Field(allow_mutation=False)"
    - "pydantic.fields.Field(allow_mutation=False)"
    - |
      import pydantic as pd
      pd.Field(allow_mutation=False, description="Name")
    - |
      from pydantic import Field as field
      field(default_factory=factory, allow_mutation=False)
    - |
      from pydantic.fields import Field
      Field(
          allow_mutation=False,  # Keep the field immutable
          description="Name",
      )
    - |
      from typing import Annotated
      from pydantic import Field
      Value = Annotated[int, Field(allow_mutation=False)]
    - |
      from pydantic import Field
      from pydantic_settings import BaseSettings
      class Settings(BaseSettings):
          value: int = Field(default=3, allow_mutation=False)
    - "wrap(pydantic.Field(allow_mutation=False), frozen=False)"
