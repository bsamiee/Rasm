# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-duration-scaling
language: rustlang
utils:
    variable:
        any:
            - kind: 'identifier, field_identifier, self'
            - has: {stopBy: end, kind: 'identifier, field_identifier, self'}
    operand:
        all:
            - not: {kind: 'integer_literal, float_literal'}
            - matches: variable
    product:
        kind: binary_expression
        has: {field: operator, regex: '^\*$'}
    mul-call:
        kind: call_expression
        has: {field: function, kind: field_expression, has: {field: field, regex: '^(saturating|strict|wrapping|unchecked)_mul$'}}
    scaled:
        any: [{matches: product}, {matches: mul-call}]
    seconds-literal:
        kind: integer_literal
        regex: '^(6_*0|3_*6_*0_*0)(_?u64)?$'
    millis-literal:
        kind: integer_literal
        regex: '^(1_*0_*0_*0|6_*0_*0_*0_*0|3_*6_*0_*0_*0_*0_*0)(_?u64)?$'
    micros-literal:
        kind: integer_literal
        regex: '^(1_*0_*0_*0|1_*0_*0_*0_*0_*0_*0|6_*0_*0_*0_*0_*0_*0_*0|3_*6_*0_*0_*0_*0_*0_*0_*0_*0)(_?u64)?$'
    nanos-literal:
        kind: integer_literal
        regex: '^(1_*0_*0_*0|1_*0_*0_*0_*0_*0_*0|1_*0_*0_*0_*0_*0_*0_*0_*0_*0|6_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0|3_*6_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0_*0)(_?u64)?$'
    thousand-literal:
        kind: 'integer_literal, float_literal'
        regex: '^(1_?000(\.0*)?|1(\.0*)?e3)(_?f(32|64))?$'
    scaled-constructor:
        kind: call_expression
        all:
            - has: {field: function, kind: scoped_identifier, all: [{has: {field: path, regex: '(^|::)Duration$'}}, {has: {field: name, regex: '^from_(secs|millis|micros|nanos)$'}}]}
            - has: {field: arguments, not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}
            - any:
                - all:
                    - has: {field: function, has: {field: name, regex: '^from_secs$'}}
                    - has:
                        field: arguments
                        has:
                            nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                            matches: scaled
                            any:
                                - all: [{has: {field: right, matches: seconds-literal}}, {has: {field: left, matches: operand}}]
                                - all: [{has: {field: left, matches: seconds-literal}}, {has: {field: right, matches: operand}}]
                                - all: [{matches: mul-call}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: seconds-literal}}}, {has: {field: function, has: {field: value, matches: operand}}}]
                - all:
                    - has: {field: function, has: {field: name, regex: '^from_millis$'}}
                    - has:
                        field: arguments
                        has:
                            nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                            matches: scaled
                            any:
                                - all: [{has: {field: right, matches: millis-literal}}, {has: {field: left, matches: operand}}]
                                - all: [{has: {field: left, matches: millis-literal}}, {has: {field: right, matches: operand}}]
                                - all: [{matches: mul-call}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: millis-literal}}}, {has: {field: function, has: {field: value, matches: operand}}}]
                - all:
                    - has: {field: function, has: {field: name, regex: '^from_micros$'}}
                    - has:
                        field: arguments
                        has:
                            nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                            matches: scaled
                            any:
                                - all: [{has: {field: right, matches: micros-literal}}, {has: {field: left, matches: operand}}]
                                - all: [{has: {field: left, matches: micros-literal}}, {has: {field: right, matches: operand}}]
                                - all: [{matches: mul-call}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: micros-literal}}}, {has: {field: function, has: {field: value, matches: operand}}}]
                - all:
                    - has: {field: function, has: {field: name, regex: '^from_nanos$'}}
                    - has:
                        field: arguments
                        has:
                            nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                            matches: scaled
                            any:
                                - all: [{has: {field: right, matches: nanos-literal}}, {has: {field: left, matches: operand}}]
                                - all: [{has: {field: left, matches: nanos-literal}}, {has: {field: right, matches: operand}}]
                                - all: [{matches: mul-call}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: nanos-literal}}}, {has: {field: function, has: {field: value, matches: operand}}}]
    seconds-read:
        kind: call_expression
        all:
            - has: {field: function, kind: field_expression, has: {field: field, regex: '^as_secs_f(32|64)$'}}
            - has: {field: arguments, not: {has: {pattern: $_}}}
    scaled-seconds:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\*$'}
            - any:
                - all: [{has: {field: left, matches: seconds-read}}, {has: {field: right, matches: thousand-literal}}]
                - all: [{has: {field: left, matches: thousand-literal}}, {has: {field: right, matches: seconds-read}}]
rule:
    kind: 'call_expression, binary_expression'
    any:
        - matches: scaled-constructor
        - matches: scaled-seconds
