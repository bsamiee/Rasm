# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-asyncio-module
language: python
severity: error
rule:
    pattern: $USE
    matches: {python-module-use: {module: {regex: '^asyncio(\.[\w.]+)?$'}}}
message: '`$USE` uses asyncio, the backend anyio runs on'
note: Call the anyio member, `anyio.run`, `anyio.sleep`, `anyio.create_task_group`, `anyio.Lock`, or `anyio.create_memory_object_stream`
