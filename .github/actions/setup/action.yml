name: Setup
description: Installs mise tools and workspace packages, selects Xcode and builds the nx-apple core on macOS, and returns the Nx remote cache server where it answers

inputs:
    cache-server:
        description: Nx self-hosted remote cache server, empty runs tasks without one
        default: ""

outputs:
    cache-server:
        description: Holds the remote cache server where it answers, empty otherwise
        value: ${{ steps.cache.outputs.server }}

runs:
    using: composite
    steps:
        - if: runner.os == 'macOS'
          run: printf 'DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer\n' >> "${GITHUB_ENV}"
          shell: bash
        - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        - run: pnpm install
          shell: bash
        - id: cache
          if: inputs.cache-server != ''
          run: curl --fail --silent --show-error --max-time 10 "${SERVER}/health" && printf 'server=%s\n' "${SERVER}" >> "${GITHUB_OUTPUT}" || printf '::warning::Nx remote cache is unreachable, tasks run without it\n'
          shell: bash
          env:
              SERVER: ${{ inputs.cache-server }}
        - if: runner.os == 'macOS'
          run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
          shell: bash
          env:
              NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ steps.cache.outputs.server }}
