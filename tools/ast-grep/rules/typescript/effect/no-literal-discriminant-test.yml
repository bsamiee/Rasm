# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-literal-discriminant-test
language: tsxlang
severity: error
rule:
    kind: binary_expression
    all:
        - has: {field: operator, regex: '^[!=]==?$'}
        - has: {field: right, kind: string, pattern: $LITERAL}
        - has: {field: left, kind: member_expression, pattern: $READ, has: {field: property, pattern: $KEY}}
        - inside:
            kind: program
            stopBy: end
            has:
                stopBy: end
                kind: pair
                all:
                    - has: {field: key, pattern: $KEY}
                    - has: {field: value, kind: call_expression, all: [{has: {field: function, regex: '^Schema\.Literal$'}}, {has: {field: arguments, has: {nthChild: 1, pattern: $LITERAL}}}]}
message: '`$READ` tests a literal discriminant by hand'
note: 'Join the cases with `Schema.toTaggedUnion(''<key>'')` and test through `isAnyOf` or fold through `match`'
