# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-sql
language: sql
severity: error
utils:
    query:
        any:
            - kind: cte_definition
            - kind: select_clause
              inside: {kind: 'table_or_subquery, subquery_expression, exists_expression, in_subquery_expression'}
    fourth-query:
        matches: query
        inside:
            matches: query
            stopBy: end
            inside:
                matches: query
                stopBy: end
                inside: {matches: query, stopBy: end}
    choice:
        any:
            - kind: case_expression
              not: {inside: {kind: case_expression, field: else, stopBy: {not: {kind: parenthesized_expression}}}}
            - matches: sql-choice-call
              not: {all: [{nthChild: 3}, {inside: {kind: normal_function_arguments, inside: {matches: sql-choice-call}}}]}
    scope: {kind: 'select_statement, select_clause, cte_definition'}
    boundary: {any: [{matches: choice}, {matches: scope}]}
rule:
    pattern: _SCOPE
    any:
        - matches: fourth-query
          not: {inside: {matches: fourth-query, stopBy: end}}
        - matches: choice
          inside:
            matches: choice
            stopBy: {matches: boundary}
            inside:
                matches: choice
                stopBy: {matches: boundary}
                inside:
                    matches: choice
                    stopBy: {matches: boundary}
                    not: {inside: {matches: choice, stopBy: {matches: scope}}}
transform:
    HEAD: {replace: {source: $SCOPE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` opens a fourth nesting level of its statement'
note: Rebuild the statement within three levels, a function holding the inner query keeps the fourth level one call away
