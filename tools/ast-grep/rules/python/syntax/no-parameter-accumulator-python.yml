# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parameter-accumulator-python
language: python
severity: error
utils:
    container-type:
        regex: '^["'']?([\w.]+(\[.*?\])?\s*\|\s*)*((typing|collections(\.abc)?|array|numpy(\.typing)?|np|npt)\.)?(list|set|dict|bytearray|memoryview|array|deque|defaultdict|OrderedDict|Counter|ChainMap|UserDict|UserList|MutableSequence|MutableSet|MutableMapping|ndarray|NDArray)\b'
    function-scope:
        kind: function_definition
        all:
            - has: {field: parameters, has: {matches: {python-parameter: {name: {pattern: $P}}}, has: {field: type, matches: container-type}}}
            - not: {has: {field: body, has: {stopBy: {kind: 'function_definition, lambda, class_definition'}, matches: {python-binding: {name: {pattern: $P}}}, not: {kind: augmented_assignment}}}}
    container-parameter:
        kind: identifier
        pattern: $P
        any:
            - matches: {python-typed-parameter: {type: {matches: container-type}}}
            - inside: {stopBy: {kind: 'function_definition, lambda'}, matches: function-scope}
    slot:
        kind: subscript
        has: {field: value, matches: written}
    written:
        any: [{matches: container-parameter}, {matches: slot}]
    assigned:
        any:
            - matches: slot
            - kind: 'pattern_list, tuple_pattern, list_pattern, list_splat_pattern, parenthesized_expression, expression_list'
              has: {matches: assigned}
    mutator:
        any:
            - matches: {python-member-use: {module: {regex: '^heapq$'}, name: {regex: '^(heappush|heappop|heapify|heapreplace|heappushpop)$'}}}
            - matches: {python-member-use: {module: {regex: '^bisect$'}, name: {regex: '^insort(_left|_right)?$'}}}
            - matches: {python-member-use: {module: {regex: '^random$'}, name: {regex: '^shuffle$'}}}
            - matches: {python-member-use: {module: {regex: '^numpy$'}, name: {regex: '^(copyto|put|place|putmask|put_along_axis|fill_diagonal)$'}}}
    parameter-call: {kind: call, has: {field: function, kind: attribute, has: {field: object, pattern: $P}}}
    released:
        all:
            - has: {stopBy: {kind: 'function_definition, lambda, class_definition'}, kind: finally_clause, has: {stopBy: end, matches: parameter-call}}
            - has: {stopBy: {kind: 'function_definition, lambda, class_definition'}, matches: parameter-call, not: {inside: {kind: finally_clause, stopBy: end}}}
rule:
    all:
        - pattern: $WRITE
          any:
            - kind: call
              has:
                field: function
                kind: attribute
                all:
                    - has: {field: attribute, regex: '^(append|appendleft|extend|extendleft|insert|add|update|setdefault|subtract|remove|discard|pop|popleft|popitem|clear|sort|reverse|rotate|move_to_end|difference_update|intersection_update|symmetric_difference_update|frombytes|fromlist|fromfile|fromunicode|fill|put|partition|resize)$'}
                    - has: {field: object, matches: written}
            - kind: call
              all:
                - has: {field: arguments, has: {nthChild: 1, matches: written}}
                - has: {field: function, matches: mutator}
            - kind: call
              all:
                - has: {field: function, kind: attribute, has: {field: attribute, regex: '^(foreach_get|readinto1?|recv_into|recvfrom_into)$'}}
                - has: {field: arguments, has: {matches: written}}
            - kind: call
              has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, regex: '^out$'}}, {has: {field: value, matches: written}}]}}
            - kind: augmented_assignment
              has: {field: left, matches: written}
            - kind: assignment
              has: {field: left, matches: assigned}
            - kind: delete_statement
              has: {matches: assigned}
        - not: {inside: {kind: function_definition, stopBy: {kind: function_definition}, has: {field: body, matches: released}}}
        - not:
            inside:
                kind: function_definition
                stopBy: end
                all:
                    - has: {field: name, regex: '^check$'}
                    - has:
                        field: parameters
                        has:
                            kind: typed_parameter
                            all:
                                - has: {nthChild: 1, pattern: $P}
                                - has: {field: type, regex: '^list\[', has: {stopBy: end, matches: {python-imported-name: {module: {regex: '^refurb\.error$'}, name: {regex: '^Error$'}}}}}
message: '`$WRITE` writes into container parameter `$P`'
note: 'Return a new container or `yield` its items'
