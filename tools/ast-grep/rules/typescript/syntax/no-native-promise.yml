# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-native-promise
language: tsx
severity: error
ignores: ['**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts', '**/*.config.ts']
rule:
    not: {inside: {matches: effect-promise-boundary, stopBy: {matches: syntax-function-boundary}}}
    any:
        - kind: new_expression
          has: {field: constructor, pattern: $NAME, regex: '^(globalThis\.)?Promise$', matches: syntax-global-reference}
        - kind: call_expression
          has: {field: function, pattern: $NAME, regex: '^(globalThis\.)?Promise\.(all|allSettled|any|race|resolve|reject|withResolvers|try)$', matches: syntax-global-reference}
message: '`$NAME` composes through a promise outside the host boundary'
note: 'Compose effects, `Effect.runPromise` adapts the result at the host boundary'
