# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-computed-operator-name
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    ops-module:
        matches: {python-member-use: {module: {regex: '^bpy$'}, name: {regex: '^ops$'}}}
    operators:
        any:
            - matches: ops-module
            - kind: attribute
              has: {field: object, matches: ops-module}
            - matches: {builtins-getattr-call: {object: {matches: ops-module}}}
rule:
    kind: call
    pattern: $ACCESS
    all:
        - matches: {builtins-getattr-call: {object: {matches: operators}}}
        - has: {field: arguments, has: {nthChild: 2, not: {matches: python-plain-string}}}
        - not: {inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^getattr$'}}}}
        - not: {inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: {python-builtin-name: {name: {regex: '^dir$'}}}}}}}
message: '`$ACCESS` reaches an operator by a computed name'
note: 'Call `bpy.ops.<module>.<name>` or a held operator, listing a submodule with `dir(getattr(bpy.ops, <module>))`'
