name: Deploy

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    repository_dispatch:
        types: [deploy]

concurrency:
    group: deploy
    cancel-in-progress: false

cache-mode: none

defaults:
    run:
        shell: bash

jobs:
    deploy:
        name: Deploy
        if: ${{ github.event_name == 'repository_dispatch' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.event != 'pull_request') }}
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        environment: deploy
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - uses: ./.github/actions/tools
            - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
            - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
              with:
                  oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
                  tags: tag:deploy
                  ping: ${{ vars.TAILSCALE_MACHINES }}
            - run: mkdir -p ~/.ssh && printf "%s\n" "Host *" "    StrictHostKeyChecking accept-new" >> ~/.ssh/config
            - run: mise bootstrap remote --all --only accounts,packages,files,services --yes
            - run: nx deploy @rasm/infra
              env: &doppler
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            - run: nx dry-run @rasm/infra --configuration=converged
              env: *doppler
            - if: ${{ always() }}
              run: docker buildx ls --format json | jq --raw-output 'select(.Driver == "docker-container") | .Name' | xargs --no-run-if-empty docker buildx rm --force
