# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Literal the file fixes when it is written, a string without a substitution, a signed number, a boolean, null, undefined, or a regex
id: syntax-literal-value
language: tsx
rule:
    any:
        - matches: syntax-string-literal
        - kind: number
        - kind: unary_expression
          has: {field: argument, kind: number}
        - kind: 'true'
        - kind: 'false'
        - kind: 'null'
        - kind: undefined
        - kind: regex
