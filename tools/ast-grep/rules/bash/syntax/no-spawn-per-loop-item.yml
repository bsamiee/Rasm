# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# Report only, the batch runs every operand after a failure under errexit and runs the tool with no operand on an empty set
id: no-spawn-per-loop-item
language: bash
severity: error
ignores: ["**/*.json"]
utils:
    # Extra literal operands would be repeated per item; option values are not paths.
    operand-tail:
        any:
            - follows: {kind: command_name}
            - follows:
                kind: word
                regex: '^--$'
                follows: {kind: command_name}
    subcommand-tail:
        any:
            - follows: {kind: word, follows: {kind: command_name}}
            - follows:
                kind: word
                regex: '^--$'
                follows: {kind: word, follows: {kind: command_name}}
rule:
    kind: command
    not: {has: {kind: variable_assignment}}
    all:
        - inside:
            kind: do_group
            matches: bash-single-command-body
            inside:
                kind: for_statement
                has: {field: variable, pattern: $ITEM}
        - has: {field: name, pattern: $NAME}
        - has:
            kind: string
            pattern: $OPERAND
            nthChild: {position: 1, reverse: true}
            matches: {bash-parameter: {name: {pattern: $ITEM}}}
        - any:
            - all:
                - has: {field: name, regex: '^(shellcheck|shfmt|actionlint|rm|rmdir|mkdir|touch|cat)$'}
                - has: {pattern: $OPERAND, matches: operand-tail}
            - all:
                - any:
                    - all:
                        - has: {field: name, regex: '^git$'}
                        - has: {field: argument, regex: '^(add|rm)$'}
                    - all:
                        - has: {field: name, regex: '^ast-grep$'}
                        - has: {field: argument, regex: '^scan$'}
                - has: {pattern: $OPERAND, matches: subcommand-tail}
message: 'The loop invokes `$NAME` separately for each `$ITEM` operand'
note: Pass independent operands together as one array, with `--` where the tool accepts it, and skip an empty set
