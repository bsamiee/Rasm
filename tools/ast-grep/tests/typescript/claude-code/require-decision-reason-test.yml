id: require-decision-reason
valid:
    - "on(\"tool.call\", ($, e, next) => { return { deny: 'git stash hides uncommitted work, keep the work as it is' }; });"
    - 'on("tool.call", ($, e, next) => { return { deny: `git ${word} is refused, run the direct command` }; });'
    - 'on("tool.call", ($, e, next) => { return { deny: `git stash is refused, keep the work as it is` }; });'
    - "on(\"tool.call\", ($, e, next) => { return { ...result, drop: 'The prompt held a secret value, it was replaced by its id' }; });"
    - "deny('mise x is refused, run node --version directly');"
    - "type Result = { deny?: undefined };"
    - "interface Refusal { deny: string; }"
    - "on(\"tool.call\", ($, e, next) => { return { denied: '' }; });"
    - 'on("tool.call", ($, e, next) => { return { other }; });'
    - "other('');"
    - "deny('yq r is the v3 form, run yq eval', '');"
    - "deny('yq r is the v3 form, run yq eval', row);"
    - 'on("tool.call", ($, e, next) => { return { deny: reason }; });'
    - "deny(row.deny);"
    - 'on("tool.call", ($, e, next) => { return { deny }; });'
    - 'on("tool.call", ($, e, next) => { return { drop: render(row) }; });'
    - "on(\"tool.call\", ($, e, next) => { return decision.kind === 'deny' ? { deny: decision.reason } : next(decision.e); });"
    - 'on("tool.call", ($, e, next) => { return { deny: strict ? render(row) : render(other) }; });'
    - 'on("tool.call", ($, e, next) => { return { deny: reason ?? fallback }; });'
    - "on(\"tool.call\", ($, e, next) => { return { 'deny': 'git stash hides uncommitted work, keep the work as it is' }; });"
    - 'on("tool.call", ($, e, next) => { return { deny: `${word} is refused` }; });'
    - "drop(`${word} was dropped`);"
    - 'on("tool.call", ($, e, next) => { return { deny: ` ${word} is refused` }; });'
    - 'on("tool.call", ($, e, next) => { return { ...result, drop: `${word}` }; });'
    - |-
      on("tool.call", ($, e, next) => { return { deny: `
      ${word} is refused` };
       });
    - 'on("tool.call", ($, e, next) => { return { deny: `\n${word} is refused` }; });'
    - 'on("tool.call", ($, e, next) => { return { deny: typeof problem }; });'
    - 'on("tool.call", ($, e, next) => { return { deny: "\\x41" }; });'
    - 'on("tool.call", ($, e, next) => { return { deny: "\x41" }; });'
    - 'on("tool.call", ($, e, next) => { return { deny: `\x41` }; });'
    - 'const selection = {deny: "", allow: true};'
    - 'on("tool.call", ($, e, next) => { const metadata = {deny: ""}; return next(e); });'
    - 'on("tool.call", ($, e, next) => { const render = () => ({deny: ""}); return next(e); });'
    - 'on("tool.call", ($, e, next) => ({result: {deny: ""}}));'
    - 'on("tool.call", ($, e, next) => (({deny: ""}) ? next(e) : next(e)));'
invalid:
    - "on(\"tool.call\", ($, e, next) => { return { deny: '' }; });"
    - 'on("tool.call", ($, e, next) => { return { deny: `` }; });'
    - "deny('');"
    - 'on("tool.call", ($, e, next) => { return { ...result, deny: `` }; });'
    - "on(\"tool.call\", ($, e, next) => { return { deny: ' ' }; });"
    - "drop(` `);"
    - "on(\"tool.call\", ($, e, next) => { return { 'deny': '' }; });"
    - 'on("tool.call", ($, e, next) => ({deny: ""}));'
    - 'on("prompt.submit", ($, e, next) => ready ? {drop: ""} : next(e));'
    - 'on("prompt.submit", ($, e, next) => ready ? next(e) : {drop: ""});'
    - 'on("tool.call", ($, e, next) => (({deny: ""} as Result)));'
    - 'on("tool.call", ($, e, next) => ({deny: ""} satisfies Result));'
    - 'on("tool.call", ($, e, next) => (({deny: ""})!));'
    - "const hook = ($, e, next) => ({ deny: '' }); on('tool.call', hook);"
    - "on('tool.call', ($, e, next) => { switch (e.tool) { case 'Bash': return { deny: '' }; default: return next(e); } });"
