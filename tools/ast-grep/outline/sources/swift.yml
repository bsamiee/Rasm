utils:
    visible: {has: {kind: modifiers, has: {kind: visibility_modifier, regex: 'public|open|package'}}}
    exposed: {any: [{matches: visible}, {inside: {kind: protocol_body}}, {inside: {kind: class_body, inside: {kind: class_declaration, matches: visible, has: {field: declaration_kind, regex: extension}}}, not: {has: {kind: modifiers, has: {kind: visibility_modifier}}}}]}
    open: {not: {inside: {stopBy: end, any: [{kind: statements}, {kind: 'class_declaration, protocol_declaration', not: {any: [{matches: exposed}, {has: {field: declaration_kind, regex: extension}, not: {has: {kind: modifiers, has: {kind: visibility_modifier}}}}]}}]}}}
    public: {all: [{matches: exposed}, {matches: open}]}
    owned: {inside: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', any: [{inside: {kind: 'source_file, ERROR'}}, {has: {field: name, pattern: $OWNER}}]}}}
    local:
        inside:
            kind: statements
            any:
                - inside:
                    stopBy: {any: [{kind: 'function_declaration, init_declaration, deinit_declaration, subscript_declaration, class_declaration'}, {kind: property_declaration, inside: {kind: 'class_body, enum_class_body'}}]}
                    any:
                        - {kind: function_declaration, inside: {kind: 'source_file, ERROR'}}
                        - {kind: 'function_declaration, init_declaration, deinit_declaration, subscript_declaration', has: {kind: 'function_name, init_keyword, deinit_keyword, subscript_keyword, referenceable_operator', pattern: $OWNER}}
                        - {kind: property_declaration, inside: {kind: 'class_body, enum_class_body'}, has: {field: name, pattern: $OWNER}}
                - kind: statements
    nested: {any: [{matches: owned}, {matches: local}]}
    hollow: {all: [{not: {has: {field: body, has: {pattern: $_, not: {kind: 'comment, multiline_comment, directive'}}}}}, {not: {has: {stopBy: end, kind: ERROR}}}]}
    leaf: {not: {has: {stopBy: end, any: [{kind: 'function_declaration, class_declaration, typealias_declaration', inside: {kind: statements}}, {kind: ERROR}]}}}
rewriters:
    - {id: body, rule: {kind: 'class_body, enum_class_body', inside: {kind: class_declaration, field: body}}, fix: "\n"}
    - {id: closure, rule: {kind: lambda_literal}, fix: '{…}'}
    - {id: comment, rule: {kind: 'comment, multiline_comment'}, fix: "\n"}
    - {id: definition, rule: {kind: macro_definition, inside: {kind: macro_declaration, field: definition}}, fix: "\n"}
    - {id: default, rule: {kind: parameter, pattern: $PARAMETER, precedes: {regex: '^=$'}}, fix: {template: '$PARAMETER = …', expandEnd: {not: {regex: '^=$'}, stopBy: end}}}
    - {id: value, rule: {kind: 'pattern, type_annotation', pattern: $BOUND, precedes: {regex: '^=$'}, not: {pattern: $DECLARATION}}, fix: {template: '$BOUND', expandEnd: {not: {regex: '^=$'}, stopBy: end}}}
    - {id: observer, rule: {kind: willset_didset_block}, fix: "\n"}
    - {id: accessor, rule: {kind: 'computed_getter, computed_setter, computed_modify', has: {kind: 'getter_specifier, setter_specifier, modify_specifier', pattern: $SPEC}}, fix: $SPEC}
    - {id: initializer, rule: {kind: computed_init}, fix: init}
    - {id: implicit, rule: {kind: computed_property, has: {kind: statements}}, fix: '{ get }'}
    - {id: attributes, rule: {kind: precedence_group_attributes, inside: {kind: precedence_group_declaration}}, fix: {template: "\n", expandStart: {regex: '\{'}, expandEnd: {regex: '\}'}}}
    - id: lineage
      rule:
        kind: 'type_name, function_name, init_keyword, deinit_keyword, subscript_keyword, referenceable_operator, pattern'
        pattern: $LEVEL
        any:
            - inside:
                kind: 'class_declaration, protocol_declaration, function_declaration, init_declaration, deinit_declaration, subscript_declaration, property_declaration'
                inside:
                    stopBy: {any: [{kind: 'class_declaration, protocol_declaration, function_declaration, init_declaration, deinit_declaration, subscript_declaration'}, {kind: property_declaration, inside: {kind: 'class_body, enum_class_body'}}]}
                    not: {inside: {kind: 'source_file, ERROR'}}
                    has: {kind: 'type_name, function_name, init_keyword, deinit_keyword, subscript_keyword, referenceable_operator, pattern', pattern: $UP}
            - pattern: $LEVEL
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage], joinBy: ''}}
      fix: $ABOVE$LEVEL.
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, closure, comment]}}
    LINES: {replace: {source: $HEADER, replace: '[\t-\r ]+$|[\t-\r ]*\n[\t-\r ]*', by: "\n"}}
    TRIMMED: {replace: {source: $LINES, replace: '([(\[<.])\n|,?\n([)\]>,]|$)', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
    PREFIX: {replace: {source: $MODIFIERS, replace: '(.)$|[\t-\r ]*\n[\t-\r ]*', by: '$1 '}}
    KEYWORD: {replace: {source: $BINDING, replace: '$', by: ' '}}
    WORD: {replace: {source: $DIAGNOSTIC, replace: '^#|\((?s:.*)', by: ''}}
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage], joinBy: ''}}
variants:
    function:
        rewriters:
            - {id: body, rule: {kind: function_body, inside: {kind: 'function_declaration, init_declaration, deinit_declaration', field: body}}, fix: "\n"}
    protocol:
        rewriters:
            - {id: body, rule: {kind: protocol_body, inside: {kind: protocol_declaration, field: body}}, fix: "\n"}
    stored:
        transform:
            HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, observer, closure, comment]}}
    item-function:
        transform:
            HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, definition, default, closure, comment]}}
    macro:
        transform:
            HEADER: {rewrite: {source: $DECLARATION, rewriters: [closure, comment]}}
    member-function:
        transform:
            HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, default, closure, comment]}}
---
id: swift-import
role: item
symbolType: module
rule:
    kind: import_declaration
    has: {kind: identifier, pattern: $NAME}
name: $NAME
isImport: true
isExported: {has: {kind: modifiers, has: {any: [{kind: visibility_modifier, regex: 'public|package'}, {kind: attribute, regex: '@_exported'}]}}}
---
id: swift-class
role: item
symbolType: class
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    all: [{has: {field: declaration_kind, regex: class}}, {has: {field: name, pattern: $NAME}}]
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: swift-struct
role: item
symbolType: struct
rule:
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    has: {field: name, pattern: $NAME}
    any: [{kind: class_declaration, has: {field: declaration_kind, regex: struct}}, {kind: typealias_declaration}]
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: swift-enum
role: item
symbolType: enum
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    all: [{has: {field: body, kind: enum_class_body}}, {has: {field: name, pattern: $NAME}}]
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: swift-object
role: item
symbolType: object
rule:
    kind: class_declaration
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    all: [{has: {field: declaration_kind, regex: 'actor|extension'}}, {has: {field: name, pattern: $NAME}}]
name: $NAME
signature: $SIGNATURE
isExported: {any: [{matches: visible}, {has: {field: body, has: {matches: visible}}}]}
---
id: swift-protocol
role: item
symbolType: interface
variants: [protocol]
rule:
    kind: protocol_declaration
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    has: {field: name, pattern: $NAME}
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: swift-function-leaf
role: item
symbolType: function
variants: [function, item-function]
rule:
    kind: 'function_declaration, macro_declaration'
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    has: {kind: 'function_name, referenceable_operator', pattern: $NAME}
    not: {has: {stopBy: end, any: [{kind: 'function_declaration, class_declaration, typealias_declaration', inside: {kind: statements}}, {kind: ERROR}]}}
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: swift-function
role: item
symbolType: function
variants: [function, item-function]
rule:
    kind: 'function_declaration, macro_declaration'
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    has: {kind: 'function_name, referenceable_operator', pattern: $NAME}
name: $NAME
signature: $SIGNATURE
isExported: {matches: visible}
---
id: swift-constant
role: item
symbolType: constant
variants: [stored]
rule:
    any:
        - kind: property_declaration
          pattern: $DECLARATION
          inside: {kind: 'source_file, ERROR'}
          all:
            - has: {kind: value_binding_pattern, regex: let}
            - has: {field: name, has: {kind: simple_identifier, pattern: $NAME}}
            - not: {has: {kind: pattern, nthChild: {position: 2, ofRule: {kind: pattern}}}}
        - kind: pattern
          pattern: $BINDER
          has: {kind: simple_identifier, pattern: $NAME}
          any: [{precedes: {kind: type_annotation, pattern: $DECLARATION, stopBy: {not: {any: [{kind: pattern}, {regex: '^,$'}]}}}}, {kind: pattern}]
          inside:
            kind: property_declaration
            stopBy: {kind: 'property_declaration, statements'}
            inside: {kind: 'source_file, ERROR'}
            all: [{has: {kind: value_binding_pattern, regex: let, pattern: $BINDING}}, {any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: property_declaration}]}]
name: $NAME
signature: $PREFIX$KEYWORD$BINDER$SIGNATURE
isExported: {any: [{matches: visible}, {inside: {kind: property_declaration, stopBy: {kind: 'property_declaration, statements'}, matches: visible}}]}
---
id: swift-variable
role: item
symbolType: variable
rule:
    any:
        - kind: property_declaration
          pattern: $DECLARATION
          inside: {kind: 'source_file, ERROR'}
          all:
            - has: {kind: value_binding_pattern, regex: var}
            - has: {field: name, has: {kind: simple_identifier, pattern: $NAME}}
            - not: {has: {kind: pattern, nthChild: {position: 2, ofRule: {kind: pattern}}}}
        - kind: pattern
          pattern: $BINDER
          has: {kind: simple_identifier, pattern: $NAME}
          any: [{precedes: {kind: type_annotation, pattern: $DECLARATION, stopBy: {not: {any: [{kind: pattern}, {regex: '^,$'}]}}}}, {kind: pattern}]
          inside:
            kind: property_declaration
            stopBy: {kind: 'property_declaration, statements'}
            inside: {kind: 'source_file, ERROR'}
            all: [{has: {kind: value_binding_pattern, regex: var, pattern: $BINDING}}, {any: [{has: {kind: modifiers, pattern: $MODIFIERS}}, {kind: property_declaration}]}]
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, observer, accessor, initializer, implicit, closure, comment]}}
name: $NAME
signature: $PREFIX$KEYWORD$BINDER$SIGNATURE
isExported: {any: [{matches: visible}, {inside: {kind: property_declaration, stopBy: {kind: 'property_declaration, statements'}, matches: visible}}]}
---
id: swift-operator
role: item
symbolType: operator
rule:
    kind: 'operator_declaration, precedence_group_declaration'
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    has: {kind: 'referenceable_operator, simple_identifier', pattern: $NAME}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [attributes, comment]}}
name: $NAME
signature: $SIGNATURE
---
id: swift-macro
role: item
symbolType: event
variants: [macro]
rule:
    kind: 'macro_invocation, diagnostic'
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR'}
    any: [{has: {kind: simple_identifier, pattern: $NAME}}, {kind: diagnostic, pattern: $DIAGNOSTIC}]
name: $NAME$WORD
signature: $SIGNATURE
isExported: false
---
id: swift-error
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, any: [{not: {has: {kind: 'simple_identifier, comment, multiline_comment'}}}, {not: {has: {stopBy: end, kind: 'import_declaration, class_declaration, protocol_declaration, typealias_declaration, function_declaration, macro_declaration, property_declaration, operator_declaration, precedence_group_declaration, macro_invocation, diagnostic'}}}]}
        - {kind: 'simple_identifier, comment, multiline_comment', all: [{inside: {kind: ERROR}}, {not: {follows: {kind: 'simple_identifier, comment, multiline_comment', stopBy: end}}}, {nthChild: {position: 1, ofRule: {kind: 'simple_identifier, comment, multiline_comment'}}}]}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: swift-member-struct
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol, swift-function]
symbolType: struct
utils:
    struct: {all: [{matches: nested}, {any: [{has: {field: declaration_kind, regex: struct}}, {kind: typealias_declaration}]}]}
