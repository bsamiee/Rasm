# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
# echo of one string alone, or printf of a %s format over one string alone, the command that writes a value into a pipe
id: bash-parameter-writer
language: bash
arguments: [value]
rule:
    kind: command
    any:
        - all:
              - has: {field: name, regex: '^echo$'}
              - has: {matches: value}
              - not: {has: {nthChild: 3}}
        - all:
              - has: {field: name, regex: '^printf$'}
              - has: {regex: '^["'']%s(\\n)?["'']$'}
              - has: {matches: value}
              - not: {has: {nthChild: 4}}
