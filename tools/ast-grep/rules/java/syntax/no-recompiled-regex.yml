# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-recompiled-regex
language: java
severity: error
utils:
    evaluation:
        kind: method_declaration, constructor_declaration, compact_constructor_declaration, lambda_expression, class_body
    static-final:
        kind: field_declaration
        has: {kind: modifiers, all: [{has: {regex: '^static$'}}, {has: {regex: '^final$'}}]}
rule:
    kind: method_invocation
    all:
        - matches: java-regex-compile
        - has: {field: name, pattern: $METHOD}
        - not:
            inside:
                stopBy: {matches: evaluation}
                any:
                    - matches: static-final
                    - kind: static_initializer, enum_constant, constant_declaration
message: '`$METHOD` recompiles a constant regex on every evaluation'
note: 'Call `matcher`, `split`, or `asPredicate` on a `static final Pattern`, or `String.replace` for a regex with no metacharacter'
