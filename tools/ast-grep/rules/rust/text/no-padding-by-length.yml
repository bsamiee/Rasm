# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-padding-by-length
language: rust
severity: error
utils:
    fill:
        pattern: $FILL
        any:
            - {kind: string_literal, regex: '^"([^"\\]|\\.)"$'}
            - kind: char_literal
    length:
        kind: call_expression
        all:
            - has: {field: arguments, not: {has: {pattern: $_}}}
            - has:
                field: function
                kind: field_expression
                any:
                    - has: {field: field, regex: '^len$'}
                    - all:
                        - has: {field: field, regex: '^count$'}
                        - has: {field: value, kind: call_expression, has: {field: function, kind: field_expression, has: {field: field, regex: '^chars$'}}}
    shortfall:
        any:
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^-$'}}, {has: {field: right, matches: length}}]
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: field, regex: '^(saturating_sub|checked_sub|wrapping_sub|abs_diff)$'}}
                - has: {field: arguments, has: {nthChild: 1, matches: length}}
            - kind: 'parenthesized_expression, try_expression'
              has: {matches: shortfall}
            - kind: call_expression
              has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^(unwrap|expect|unwrap_or|unwrap_or_default)$'}}, {has: {field: value, matches: shortfall}}]}
    relayed:
        kind: identifier
        pattern: $GAP
        inside:
            kind: function_item
            stopBy: {kind: function_item}
            has: {stopBy: {kind: function_item}, kind: let_declaration, all: [{has: {field: pattern, pattern: $GAP}}, {has: {field: value, matches: shortfall}}]}
    count:
        any: [{matches: shortfall}, {matches: relayed}]
rule:
    pattern: $PAD
    any:
        - kind: call_expression
          any:
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^repeat$'}}, {has: {field: value, matches: fill}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: count}}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^repeat$'}}, {has: {field: value, matches: fill, not: {regex: '^.\^.$'}}}]}
                - has: {field: arguments, has: {nthChild: 1, matches: length}}
            - all:
                - has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?repeat_n$'}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: fill}}, {has: {nthChild: 2, matches: count}}]}
            - all:
                - has:
                    field: function
                    kind: field_expression
                    all:
                        - has: {field: field, regex: '^take$'}
                        - has:
                            field: value
                            kind: call_expression
                            all:
                                - has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?repeat$'}
                                - has: {field: arguments, has: {nthChild: 1, matches: fill}}
                - has: {field: arguments, has: {nthChild: 1, matches: count}}
        - kind: tuple_expression
          all:
            - has: {kind: 'string_literal, raw_string_literal', regex: '\{[^{}]*:[^{}]*\$\}'}
            - has: {stopBy: end, matches: shortfall}
message: '`$PAD` pads text by byte or char count in place of display width'
note: 'Pad by `<column>.saturating_sub(<text>.width())` with `unicode_width::UnicodeWidthStr`'
