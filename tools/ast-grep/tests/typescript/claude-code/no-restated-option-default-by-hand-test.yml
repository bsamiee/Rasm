id: no-restated-option-default-by-hand
valid:
    # The option read as narrowed
    - 'const manager = options.packageManager;'
    # Option passed to an engine call beside a literal
    - "$.store.set('manager', options.packageManager);"
    # Call over the option and a non-literal
    - 'const manager = pick(options.packageManager, fallback);'
    # Call over the option alone
    - 'const manager = trim(options.packageManager);'
    # Call over the option, a literal, and a third argument
    - "const manager = withDefault(options.packageManager, 'pnpm', strict);"
    # Typeof over another object
    - "const held = typeof config.packageManager === 'string';"
    # Typeof over raw inside options(raw), the one refinement
    - "const held = typeof raw.packageManager === 'string';"
    # Negation over the option reads the value
    - 'const quiet = !options.speak;'
    # Two-argument call outside the fallback grammar, a store key built from the option
    - "const row = key('session', options.packageManager);"
    # Callee name outside the fallback grammar beside a literal
    - "const manager = pick(options.packageManager, 'pnpm');"
    # Defined check over another object
    - 'const held = config.packageManager !== undefined;'
    # Option compared against a string value, a real comparison
    - "const isPnpm = options.packageManager === 'pnpm';"
    # Presence of another object lifted into an Option
    - 'const owner = fromNullable(config.owner);'
    # Coercion of a value other than an option
    - 'const held = Boolean(ready);'
    # Typeof over a parameter typed other than Options
    - "const held = (settings: Raw): boolean => typeof settings.speak === 'boolean';"
    # Destructuring of the option without a default
    - 'const { speak } = options;'
    # Destructuring default over another object
    - 'const { speak = false } = config;'
    # Double negation of another value
    - 'const held = !!ready;'
    # String coercion of another value
    - 'const text = String(row.count);'
    # Presence of a key on another object
    - "const held = 'speak' in config;"
    # Destructuring default in a parameter typed other than Options
    - "const read = ({ packageManager = 'pnpm' }: Raw): string => packageManager;"
    # Presence of a key on another object through hasOwn
    - "const held = Object.hasOwn(config, 'speak');"
    # Presence of a key on another object through the hasOwnProperty method
    - "const held = config.hasOwnProperty('speak');"
    # Call outside the presence grammar over the options object and a key
    - "const value = read(options, 'speak');"
    # Method on the options object outside the presence grammar
    - 'const same = options.isPrototypeOf(row);'
invalid:
    # Typeof test over the option
    - "const held = typeof options.packageManager === 'string';"
    # Typeof over a subscript read
    - "const held = typeof options['speak'] === 'boolean';"
    # The instance, a fallback call over the option and a string
    - "const manager = stringOption(options.packageManager, 'pnpm');"
    # Fallback call with the literal first
    - 'const speak = withDefault(false, options.speak);'
    # Fallback call with a template literal
    - 'const manager = stringOption(options.packageManager, `pnpm`);'
    # Fallback call with a number
    - 'const limit = numberOption(options.limit, 3);'
    # Fallback call with a negative number
    - 'const offset = numberOption(options.offset, -1);'
    # Fallback call with true
    - 'const speak = withDefault(options.speak, true);'
    # Fallback call with null
    - 'const owner = withDefault(options.owner, null);'
    # Fallback call with undefined
    - 'const owner = withDefault(options.owner, undefined);'
    # Fallback call through a member callee inside the grammar
    - 'const owner = defaults.orElse(options.owner, null);'
    # Defined check over the option, the manifest default makes the check always true
    - 'const held = options.packageManager !== undefined;'
    # Null check over a subscript read of the option
    - "const missing = options['owner'] === null;"
    # Presence of the option lifted into an Option, the manifest default fills it
    - 'const owner = fromNullable(options.owner);'
    # Boolean coercion of the option, the host validated the type
    - 'const held = Boolean(options.speak);'
    # Typeof over a parameter typed Options under another name
    - "const held = (settings: Options): boolean => typeof settings.speak === 'boolean';"
    # Destructuring default over the option
    - 'const { speak = false } = options;'
    # Destructuring default under a renamed key
    - "const { packageManager: manager = 'pnpm' } = options;"
    # Double negation of the option, the boolean coerced by hand
    - 'const held = !!options.speak;'
    # String coercion of the option, the host validated the type
    - 'const manager = String(options.packageManager);'
    # Number coercion of the option
    - 'const limit = Number(options.limit);'
    # Destructuring default over a parameter typed Options
    - "const read = (settings: Options): string => { const { packageManager = 'pnpm' } = settings; return packageManager; };"
    # Loose null check over the option
    - 'const held = options.owner != null;'
    # Presence of the option through in
    - "const held = 'speak' in options;"
    # Presence of the option through hasOwn
    - "const held = Object.hasOwn(options, 'speak');"
    # Presence of the option through hasOwnProperty
    - "const held = options.hasOwnProperty('speak');"
    # Destructuring default in a parameter typed Options
    - "const read = ({ packageManager = 'pnpm' }: Options): string => packageManager;"
    # Typeof over an optional chain read of the option
    - "const held = typeof options?.speak === 'boolean';"
    # Presence of the option through Reflect.has
    - "const held = Reflect.has(options, 'speak');"
    # Presence of the option through the prototype's hasOwnProperty
    - "const held = Object.prototype.hasOwnProperty.call(options, 'speak');"
    # Presence of the option through propertyIsEnumerable
    - "const held = options.propertyIsEnumerable('speak');"
    # Presence of a dynamic key in the options object
    - 'const held = key in options;'
