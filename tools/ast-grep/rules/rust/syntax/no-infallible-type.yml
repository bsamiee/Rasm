# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-infallible-type
language: rust
severity: error
rule:
    any:
        - kind: type_identifier
          regex: '^Infallible$'
          not: {inside: {kind: scoped_type_identifier}}
        - kind: scoped_type_identifier
          regex: '^((::)?(std|core)::)?convert::Infallible$'
fix: '!'
message: '`Infallible` stands in for the never type `!`'
note: 'Write `!` (`#![feature(never_type)]`) and delete the unused `Infallible` import'
