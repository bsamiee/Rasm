# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    option-member:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^(orElse|liftPredicate)$'}}}
    lift-member:
        kind: member_expression
        all: [{has: {field: property, regex: '^liftPredicate$'}}, {matches: option-member}]
    lift:
        kind: call_expression
        any:
            - all:
                - has: {field: function, matches: lift-member}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $X}}, {has: {nthChild: 2}}]}
            - all:
                - has: {field: function, kind: call_expression, all: [{has: {field: function, matches: lift-member}}, {has: {field: arguments, not: {has: {nthChild: 2}}}}]}
                - has: {field: arguments, has: {nthChild: 1, pattern: $X}}
    lifted:
        any:
            - matches: lift
            - has: {stopBy: end, matches: lift}
    or-else:
        kind: call_expression
        has: {field: function, matches: option-member, has: {field: property, regex: '^orElse$'}}
    alternative:
        kind: arrow_function, function_expression
        nthChild: {position: 1, reverse: true}
        inside: {kind: arguments, inside: {matches: or-else, pattern: $ALT}}
rule:
    all:
        - matches: lift
        - inside: {stopBy: end, matches: alternative}
        - inside:
            stopBy: end
            kind: call_expression
            any:
                - all:
                    - pattern: $ALT
                    - has: {field: arguments, all: [{has: {nthChild: 1, matches: lifted}}, {has: {nthChild: 2}}]}
                - all:
                    - has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}
                    - has: {field: arguments, all: [{has: {nthChild: 1, matches: lifted}}, {has: {pattern: $ALT}}]}
                - all:
                    - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: lifted}}]}
                    - has: {field: arguments, has: {pattern: $ALT}}
message: '`Option.orElse` tests `$X` against one more predicate in a nested branch'
note: 'Use `Option.liftPredicate` with `Predicate.or`, or `Match.when` arms ending in `Match.option` when each branch maps'
