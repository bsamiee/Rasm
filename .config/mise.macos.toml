# --- [ENV] ------------------------------------------------------------------------------

[env]
ATELIER_PATH                          = "/Applications/Atelier.app/Contents/MacOS/Atelier"
COLIMA_HOME                           = "{{ xdg_data_home }}/rasm/colima"
DOCKER_CONFIG                         = "{{ xdg_data_home }}/rasm/docker"
DOCKER_HOST                           = "unix://{{ env.COLIMA_HOME }}/default/docker.sock"
PITCHFORK_SUPERVISOR_AUTO_START       = "false"
RHINO_MCP_URL                         = "http://127.0.0.1:{{ env.RHINO_MCP_PLATFORM_PORT }}/"
RHINO_TEST_PROFILE                    = "{{ env.HOME }}/Library/Application Support/Rasm/Rhino Tests"
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"

# --- [HOOKS] ----------------------------------------------------------------------------

[hooks]
postinstall = "eng/xcode-locations.sh"

# --- [DAEMONS] --------------------------------------------------------------------------

[daemons.docker]
ready_cmd   = { run = ["docker", "version"], timeout = "5m" }
run         = 'exec env -C "$COLIMA_HOME" colima start --foreground --activate=false --ssh-config=false --mount none --cpus 4 --memory 4'
stop_signal = { signal = "SIGTERM", timeout = "120s" }

[daemons.rhino-mcp-platform]
boot_start = true
env        = { RHINO_MCP_DEFAULT_VERSION = "9" }
port       = 7406
proxy      = false
ready_http = { status = [406], timeout = "5m", url = "http://127.0.0.1:7406/" }
retry      = true
run        = 'exec rasm-mcp-proxy -- "$HOME/Library/Application Support/McNeel/Rhinoceros/ai/bin/rhino-mcp-router"'
