# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    module-require:
        kind: call_expression
        all:
            - has: {field: arguments, pattern: {context: f(import.meta.url), selector: arguments}}
            - has: {field: function, matches: {typescript-import-reference: {source: {regex: '^(node:)?module$'}, exported: {regex: '^createRequire$'}}}}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^resolve$'}}
        - has:
            field: function
            has:
                field: object
                any:
                    - matches: module-require
                    - matches: {typescript-constant-value: {value: {matches: module-require}}}
message: '`$CALL` resolves from its module through a CommonJS `require`'
note: 'Call `fileURLToPath(import.meta.resolve(<specifier>))`'
