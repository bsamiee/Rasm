id: no-stamp-literal
valid:
    # The correction, the row built by stamp
    - |
      await $.store.set(key('loaded', session, e.skill), stamp(session, $.clock.now()));
    # The definition of stamp in host/store.ts
    - |
      const stamp = (session: string, at: number): Stamp => ({ session, at });
    # Decoder shape of the row passed to struct, the values are refinements
    - |
      const _isStamp: (value: unknown) => value is Stamp = struct({ session: isString, at: isNumber });
    # The notice row, session beside text
    - |
      await $.store.set(key('notice'), { session, text: `The editor spawn was refused: ${reason}` });
    # A third member makes another row
    - |
      await $.store.set(key('skill', e.skill), { session, at: $.clock.now(), loadedAt: now });
    # Session alone
    - |
      const row = { session };
    # At alone
    - |
      const row = { at: $.clock.now() };
    # Another shorthand beside at
    - |
      const row = { id, at: $.clock.now() };
    # Spread beside session and at, a third member
    - |
      const row = { session, at, ...rest };
    # Type literal holding the row's members, no value
    - |
      type Stamp = { session: string; at: number };
    # The definition of stamp as a function declaration
    - |
      function stamp(session: string, at: number): Stamp { return { session, at }; }
    # Comment inside the row, the count reads it as a third member and no fix keeps it
    - |
      await $.store.set(key('loaded', session, e.skill), { session, /* the write time */ at: now });
invalid:
    # The instance, the stamp literal written to the store
    - |
      await $.store.set(key('loaded', session, e.skill), { session, at: $.clock.now() });
    # Session as a pair
    - |
      await $.store.set(key('injected', session, name), { session: id, at: now });
    # At first, session shorthand
    - |
      await $.store.set(key('snapshot', session, vm), { at: $.clock.now(), session });
    # At first, session as a pair
    - |
      await $.store.set(key('dns', session, domain), { at: now, session: id });
    # The literal bound to a local before the write
    - |
      const row = { session, at: $.clock.now() };
    # Both members shorthand
    - |
      await $.store.set(key('loaded', session, e.skill), { session, at });
    # At shorthand beside a session pair
    - |
      await $.store.set(key('loaded', session, e.skill), { session: id, at });
    # At shorthand first
    - |
      await $.store.set(key('loaded', session, e.skill), { at, session });
    # At shorthand first beside a session pair
    - |
      await $.store.set(key('loaded', session, e.skill), { at, session: id });
    # String keys, the quoted spelling of the same row
    - |
      await $.store.set(key('loaded', session, e.skill), { 'session': session, 'at': now });
    # Stamp literal as the return value of a closure
    - |
      const row = (): Stamp => ({ session, at: $.clock.now() });
    # Row cast to the type
    - |
      const row = { session, at: $.clock.now() } as Stamp;
