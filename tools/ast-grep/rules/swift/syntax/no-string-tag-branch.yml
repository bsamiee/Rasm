# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-string-tag-branch
language: swift
severity: error
utils:
    tag:
        kind: line_string_literal
        not: {has: {kind: interpolated_expression}}
    tag-pattern:
        kind: switch_pattern
        has: {kind: pattern, has: {matches: tag}}
    tag-test:
        kind: equality_expression
        all:
            - has: {field: op, regex: '^==$'}
            - has: {field: lhs, pattern: $SUBJECT}
            - has: {field: rhs, matches: tag}
rule:
    any:
        - kind: switch_statement
          all:
            - has: {field: expr, pattern: $SUBJECT}
            - has: {kind: switch_entry, has: {matches: tag-pattern, pattern: $FIRST}}
            - has: {kind: switch_entry, has: {matches: tag-pattern, not: {pattern: $FIRST}}}
            - not:
                has:
                    kind: switch_entry
                    all:
                        - has: {kind: default_keyword}
                        - has: {kind: statements, has: {pattern: $SUBJECT, stopBy: end, not: {inside: {kind: line_string_literal, stopBy: end}}}}
        - kind: if_statement
          all:
            - not: {inside: {kind: if_statement}}
            - has: {field: condition, matches: tag-test, has: {field: rhs, pattern: $FIRST}}
            - has: {kind: if_statement, has: {field: condition, matches: tag-test, not: {has: {field: rhs, pattern: $FIRST}}}}
message: 'Branch over `$SUBJECT` selects its arm by string literal'
note: 'Declare the tokens as cases of an enum with `String` raw values, convert the text once at the boundary through its `Decodable` conformance or `init(rawValue:)`, and switch over the cases'
