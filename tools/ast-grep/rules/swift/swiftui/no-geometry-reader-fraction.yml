# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-geometry-reader-fraction
language: swift
severity: error
rule:
    pattern: 'GeometryReader { $G in $$$B }'
    has:
        stopBy: end
        kind: value_argument
        all:
            - has: {kind: value_argument_label, regex: '^(width|height|(min|ideal|max)(Width|Height))$'}
            - has:
                stopBy: end
                pattern: $SCALE
                any:
                    - pattern: $G.size.$AXIS * $F
                    - pattern: $F * $G.size.$AXIS
                    - pattern: $G.size.$AXIS / $F
                    - pattern: '$G.frame(in: $_).$AXIS * $F'
                    - pattern: '$F * $G.frame(in: $_).$AXIS'
                    - pattern: '$G.frame(in: $_).$AXIS / $F'
                    - pattern: '$G.frame(in: $_).size.$AXIS * $F'
                    - pattern: '$F * $G.frame(in: $_).size.$AXIS'
                    - pattern: '$G.frame(in: $_).size.$AXIS / $F'
        inside: {pattern: $_.frame($$$), stopBy: end}
constraints:
    AXIS: {regex: '^(width|height)$'}
message: '`$SCALE` sizes `.frame` from the `GeometryReader` proxy as a hand-written container fraction'
note: 'Read `configuration.fractionCompleted` in a `ProgressViewStyle`, or `containerRelativeFrame(_:) { length, _ in length * fraction }`'
