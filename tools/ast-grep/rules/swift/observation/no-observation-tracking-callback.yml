# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observation-tracking-callback
language: swiftlang
severity: error
rule:
    kind: call_expression
    has: {nthChild: 1, regex: '^(Observation\.)?withObservationTracking$'}
    not: {has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^options$'}}}}}
message: '`withObservationTracking` without `options:` reports one change per registration to `onChange`'
note: 'Iterate `for await <value> in Observations { <model>.<property> }`, or call `withContinuousObservation(options:apply:)` for a synchronous handler'
