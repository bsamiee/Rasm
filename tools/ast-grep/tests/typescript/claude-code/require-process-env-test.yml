id: require-process-env
valid:
    # The correction, the session row's environment as the init
    - |
      on('skill.prompt', async ($, e, next) => {
          const version = await $.process.run(['ast-grep', '--version'], { env: found.env });
          return next(e);
      });
    # Shorthand env
    - |
      on('session.start', async ($, e, next) => {
          const home = await $.process.run(['printenv', 'HOME'], { env });
          return next(e);
      });
    # Env beside a timeout
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { env: target.facts.env, timeoutMs });
          return next(e);
      });
    # String key
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { 'env': env });
          return next(e);
      });
    # Spread of an init built elsewhere, the object can carry env
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { ...init, timeoutMs });
          return next(e);
      });
    # Init as a value built elsewhere, the shape cannot read it
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, init);
          return next(e);
      });
    # The environment's own source, mise env --json runs before the session row exists
    - |
      on('session.start', async ($, e, next) => {
          const answered = await $.process.run(['mise', 'env', '--json']);
          return next(e);
      });
    # A run member on another object, the engine interface alone is $
    - |
      on('tool.call', async ($, e, next) => {
          const run = await runner.process.run(argv);
          return next(e);
      });
    # Another noun with a run verb
    - |
      on('tool.call', async ($, e, next) => {
          const started = await $.agent.run(argv);
          return next(e);
      });
    # Another verb of the process noun
    - |
      on('tool.call', async ($, e, next) => {
          const started = await $.process.spawn(argv);
          return next(e);
      });
    # Init cast to its type
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, init as ProcessRunInit);
          return next(e);
      });
    # Init spread from the rest of a list
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, ...inits);
          return next(e);
      });
    # mise as the first word in double quotes
    - |
      on('session.start', async ($, e, next) => {
          const answered = await $.process.run(["mise", "env", "--json"]);
          return next(e);
      });
invalid:
    # The instance, no init
    - |
      on('session.start', async ($, e, next) => {
          const home = await $.process.run(['printenv', 'HOME']);
          return next(e);
      });
    # Init without env
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { timeoutMs });
          return next(e);
      });
    # Empty init
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, {});
          return next(e);
      });
    # Env nested under another key, the init itself names none
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { options: { env } });
          return next(e);
      });
    # mise after the shell word, the argv opens with sh
    - |
      on('session.start', async ($, e, next) => {
          const answered = await $.process.run(['sh', '-c', 'mise env --json']);
          return next(e);
      });
    # mise as a later word, the argv opens with env
    - |
      on('session.start', async ($, e, next) => {
          const answered = await $.process.run(['env', 'mise']);
          return next(e);
      });
    # Argv as a value, no init
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv);
          return next(e);
      });
    # Run outside any hook with no init
    - |
      const version = $.process.run(['ast-grep', '--version']);
    # Init holding env under a nested spread, the init itself names none
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { timeoutMs, extra: { ...init } });
          return next(e);
      });
    # Argv opening with a spread before mise, no init
    - |
      on('session.start', async ($, e, next) => {
          const answered = await $.process.run([...prefix, 'mise', 'env', '--json']);
          return next(e);
      });
    # Env under a computed key, the init names none the shape reads
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { ['env']: env });
          return next(e);
      });
    # Init naming cwd and stdin alone
    - |
      on('tool.call', async ($, e, next) => {
          const run = await $.process.run(argv, { cwd, stdin: text });
          return next(e);
      });
