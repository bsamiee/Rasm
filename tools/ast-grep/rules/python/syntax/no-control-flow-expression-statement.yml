# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-control-flow-expression-statement
language: python
severity: error
utils:
    dropped:
        kind: conditional_expression, boolean_operator, list_comprehension, set_comprehension, dictionary_comprehension
    block-statement:
        kind: expression_statement
        all:
            - not: {follows: {regex: '^;$'}}
            - not: {precedes: {regex: '^;$'}}
            - any:
                - inside: {kind: module}
                - inside:
                    kind: block
                    inside: {regex: '^[^\n]*:[ \t]*(#[^\n]*)?\n'}
    fixable:
        not: {regex: '\n'}
        inside: {matches: block-statement, stopBy: {not: {kind: assignment}}}
    effect-operand:
        kind: boolean_operator
        has: {field: right, kind: 'call, await'}
        matches: fixable
    synchronous-loop:
        kind: list_comprehension, set_comprehension
        not: {has: {kind: for_in_clause, regex: '^async\b'}}
        matches: fixable
    free-variable:
        not:
            inside:
                kind: function_definition, module
                stopBy: {kind: function_definition}
                has:
                    stopBy: end
                    kind: identifier
                    pattern: $X
                    not:
                        inside:
                            kind: list_comprehension, set_comprehension, dictionary_comprehension, generator_expression
                            stopBy: end
                            has: {kind: for_in_clause, has: {field: left, pattern: $X}}
    filtered-loop-shape:
        all:
            - matches: synchronous-loop
            - any:
                - pattern: '[$BODY for $X in $XS if $COND]'
                - pattern: '{$BODY for $X in $XS if $COND}'
            - matches: free-variable
    loop-shape:
        all:
            - matches: synchronous-loop
            - any:
                - pattern: '[$BODY for $X in $XS]'
                - pattern: '{$BODY for $X in $XS}'
            - matches: free-variable
    rewritable:
        any:
            - matches: effect-operand
            - kind: conditional_expression
              matches: fixable
            - matches: filtered-loop-shape
            - matches: loop-shape
rule:
    kind: expression_statement
    pattern: $STMT
    any:
        - has: {stopBy: {not: {kind: parenthesized_expression}}, matches: dropped}
        - has:
            kind: assignment
            all:
                - has: {field: left, kind: identifier, regex: '^_$'}
                - has: {field: right, stopBy: {not: {kind: parenthesized_expression}}, matches: dropped}
rewriters:
    - id: discard-assignment
      rule:
        kind: assignment
        all:
            - has: {field: left, kind: identifier, regex: '^_$'}
            - has: {field: right, pattern: $DROPPED, matches: rewritable}
      transform:
        INNER: rewrite($DROPPED, rewriters=[and-statement, or-negated-statement, or-boolean-statement, or-statement, if-statement, else-boolean-statement, else-statement, if-else-statement, filtered-loop, loop])
      fix: $INNER
    - id: and-statement
      rule: {pattern: $TEST and $EFFECT, matches: effect-operand}
      fix: |-
        if $TEST:
            $EFFECT
    - id: or-negated-statement
      rule: {pattern: not $TEST or $EFFECT, matches: effect-operand}
      fix: |-
        if $TEST:
            $EFFECT
    - id: or-boolean-statement
      rule: {pattern: $TEST or $EFFECT, matches: effect-operand}
      constraints: {TEST: {kind: boolean_operator}}
      fix: |-
        if not ($TEST):
            $EFFECT
    - id: or-statement
      rule: {pattern: $TEST or $EFFECT, matches: effect-operand}
      fix: |-
        if not $TEST:
            $EFFECT
    - id: if-statement
      rule: {kind: conditional_expression, pattern: $EFFECT if $TEST else None, matches: fixable}
      fix: |-
        if $TEST:
            $EFFECT
    - id: else-boolean-statement
      rule: {kind: conditional_expression, pattern: None if $TEST else $EFFECT, matches: fixable}
      constraints: {TEST: {kind: boolean_operator}}
      fix: |-
        if not ($TEST):
            $EFFECT
    - id: else-statement
      rule: {kind: conditional_expression, pattern: None if $TEST else $EFFECT, matches: fixable}
      fix: |-
        if not $TEST:
            $EFFECT
    - id: if-else-statement
      rule: {kind: conditional_expression, pattern: $EFFECT if $TEST else $OTHER, matches: fixable}
      fix: |-
        if $TEST:
            $EFFECT
        else:
            $OTHER
    - id: filtered-loop
      rule: {matches: filtered-loop-shape}
      fix: |-
        for $X in $XS:
            if $COND:
                $BODY
    - id: loop
      rule: {matches: loop-shape}
      fix: |-
        for $X in $XS:
            $BODY
transform:
    OUT: rewrite($STMT, rewriters=[discard-assignment, and-statement, or-negated-statement, or-boolean-statement, or-statement, if-statement, else-boolean-statement, else-statement, if-else-statement, filtered-loop, loop])
fix: $OUT
message: Expression statement drops the value of a selection or iteration
note: Write the selection as an `if` statement and the iteration as a `for` loop
