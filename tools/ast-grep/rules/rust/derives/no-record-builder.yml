# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-record-builder
language: rust
severity: error
rule:
    kind: struct_item
    all:
        - has: {field: name, pattern: $NAME}
        - has: {field: body, kind: field_declaration_list}
        - matches: {rust-attributed: {attribute: {matches: {rust-derive: {trait: {regex: '^(Builder|TypedBuilder)$'}}}, pattern: $DERIVE}}}
labels:
    NAME: {style: primary, message: 'Record built through generated setters'}
    DERIVE: {style: secondary, message: 'Generates a builder'}
message: '`$NAME` derives a builder for a record a struct literal builds'
note: 'Replace the derive with field defaults (`#![feature(default_field_values)]`) and a struct literal `<Record> { <field>, .. }`'
