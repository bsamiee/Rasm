# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-testing"
version         = "0.0.0"
description     = "Test toolchain of every Python suite"
classifiers     = ["Private :: Do Not Upload"]
requires-python = ">=3.13"

dependencies = [
    "hypothesis",      # Property-based tests
    "pytest",          # Test collection, assertions, and fixtures
    "pytest-cov",      # Coverage collection
    "pytest-randomly", # Random test order and seeds
    "pytest-socket",   # Block unrequested network connections
    "pytest-timeout",  # Per-test deadline
]

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [] # Dependencies alone, no module
module-root = ""
