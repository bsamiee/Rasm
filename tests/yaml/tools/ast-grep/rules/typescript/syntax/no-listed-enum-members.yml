id: no-listed-enum-members
valid:
    - |
      const modes = ["a", "b"] as const;
      type Mode = (typeof modes)[number];
    - |
      type Mode = "a" | "b" | "c";
      const some = ["a", "b"];
    - |
      type Mode = "a" | "b";
      const other = ["a", "c"];
invalid:
    - |
      type Mode = "a" | "b";
      const modes = ["a", "b"];
    - |
      export type Mode = "a" | "b" | "c";
      export const modes: ReadonlyArray<Mode> = ["c", "b", "a"];
