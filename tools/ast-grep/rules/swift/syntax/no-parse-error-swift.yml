# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-swift
language: swiftlang
severity: error
utils:
    awaited-closure:
        any:
            - kind: await_expression
              has:
                field: expr
                all:
                    - has: {stopBy: end, kind: call_suffix, has: {kind: lambda_literal}}
                    - not: {has: {nthChild: 1, kind: prefix_expression, has: {field: operation, regex: '^!$'}}}
            - {kind: lambda_literal, follows: {follows: {regex: '^await$'}}}
    awaited-condition:
        kind: 'if_statement, ERROR'
        all:
            - has: {regex: '^if$'}
            - has:
                stopBy: end
                matches: awaited-closure
                not: {inside: {kind: statements, stopBy: {kind: 'if_statement, ERROR'}}}
    awaited-condition-recovery:
        any:
            - {kind: ERROR, matches: awaited-condition}
            - {kind: ERROR, has: {matches: awaited-condition}}
            - {kind: ERROR, follows: {stopBy: end, matches: awaited-condition}}
            - inside: {stopBy: end, matches: awaited-condition}
            - {regex: '^$', inside: {kind: 'class_body, function_body', has: {stopBy: end, matches: awaited-condition}}}
    empty-tuple:
        regex: '^$'
        inside: {stopBy: end, kind: tuple_expression, regex: '^\(\s*\)$'}
    linked-modifiers:
        kind: modifiers
        has: {kind: attribute, regex: '^@_silgen_name\('}
    linked-declaration:
        kind: ERROR
        regex: '^(?:[^={}/]|//[^\n]*)*$'
        any:
            - has: {matches: linked-modifiers}
            - inside: {kind: function_declaration, stopBy: {not: {kind: function_type}}, has: {matches: linked-modifiers}}
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: awaited-condition-recovery
            - matches: empty-tuple
            - matches: linked-declaration
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: source_file
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: >-
    Use a form the grammar parses, every other rule skips constructs inside a parse error. A regex literal opening `/^` or holding `\/` takes the extended delimiter `#/<pattern>/#`, which the grammar parses in every position. A negated awaited condition takes `!(await <expression>)` in place of `await !<expression>`. Unreported tree-sitter-swift grammar gaps are an `if` condition `await <expression> {` read as a trailing closure, the empty tuple `()` as a value, and bodiless `@_silgen_name` function declarations with header tokens of the declaration after them
