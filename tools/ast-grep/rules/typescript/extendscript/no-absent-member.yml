# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-extendscript-absent-member
language: tsx
severity: error
rule:
    pattern: $MEMBER
    any:
        - kind: member_expression
          has: {field: object, kind: identifier, regex: '^JSON$'}
        - kind: member_expression
          all:
            - has: {field: object, kind: identifier, regex: '^(Object|Array|Number|String|Math|Date)$'}
            - has: {field: property, regex: '^(keys|values|entries|assign|hasOwn|create|defineProperty|defineProperties|getPrototypeOf|setPrototypeOf|getOwnPropertyNames|getOwnPropertyDescriptor|freeze|seal|is|fromEntries|isArray|from|of|parseInt|parseFloat|isInteger|isFinite|isNaN|isSafeInteger|fromCodePoint|raw|trunc|sign|cbrt|log2|log10|hypot|now)$'}
        - kind: call_expression
          has:
            field: function
            kind: member_expression
            has: {field: property, regex: '^(map|filter|forEach|reduce|reduceRight|some|every|find|findIndex|findLast|findLastIndex|flat|flatMap|includes|fill|at|trim|trimStart|trimEnd|startsWith|endsWith|padStart|padEnd|repeat|replaceAll|codePointAt|normalize|bind|toISOString)$'}
        - {kind: spread_element, inside: {kind: object}}
        - {kind: rest_pattern, inside: {kind: object_pattern}}
    inside:
        kind: program
        stopBy: end
        any:
            - matches: {uxp-host-file: {module: {regex: '^@rasm/extendscript/'}}}
            - has: {kind: import_statement, regex: '^import type ', has: {field: source, regex: '^.@rasm/cep/contract.$'}}
message: '`$MEMBER` compiles to a member ExtendScript lacks, and swc lowers syntax alone'
note: 'Write the ES3 form: an index loop, `for...in` over own keys, `charAt` and `slice`, or `keys` and `assign` from `@rasm/extendscript/handle`'
