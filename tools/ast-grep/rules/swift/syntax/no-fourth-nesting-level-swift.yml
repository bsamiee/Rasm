# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-swift
language: swift
severity: error
utils:
    linted-function:
        kind: function_declaration
        inside:
            kind: function_declaration
            stopBy: end
            inside:
                kind: function_declaration
                stopBy: end
                inside: {kind: function_declaration, stopBy: end}
rule:
    matches: swift-nesting-level
    pattern: $SCOPE
    not: {any: [{matches: linted-function}, {inside: {kind: ERROR, stopBy: end}}]}
    inside:
        matches: swift-nesting-level
        stopBy: {matches: swift-nesting-boundary}
        inside:
            matches: swift-nesting-level
            stopBy: {matches: swift-nesting-boundary}
            inside:
                matches: swift-nesting-level
                stopBy: {matches: swift-nesting-boundary}
                not: {inside: {matches: swift-nesting-level, stopBy: {matches: swift-nesting-boundary}}}
message: Closure or control nesting reaches a fourth level
note: Flatten with a guard clause, one `switch` over combined cases, a chained step after a closure returning its value, or a sequence operation upstream (`compactMap`, `filter`, `first(where:)`, `contains(where:)`)
labels:
    SCOPE: {style: primary}
