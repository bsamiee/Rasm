# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: <rule-id>
language: <language>
severity: error
files: ["<folder cause covers, key omitted for syntax rules>/**"]
rule:
    kind: <rarest kind correction names>
    all:
        - has: {field: <role>, regex: '^<leaf text>$'}
        - pattern: <code with $VAR and $$$ARGS, or $NODE alone binding matched node, document included, for a transform>
        - inside: {kind: <owner kind>, stopBy: &owner {kind: '<owner kinds correction covers>'}}
        - not: {inside: {kind: <exempting-kind>, stopBy: *owner}}
message: <violation with captured or transformed values>
note: <required form and its reason>
