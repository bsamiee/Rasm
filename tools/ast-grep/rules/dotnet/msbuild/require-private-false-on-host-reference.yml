# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-false-on-host-reference
language: xml
severity: error
rule:
    pattern: _REFERENCE
    all:
        - matches: {msbuild-element: {name: {regex: '^Reference$'}}}
        - has:
            matches: msbuild-tag
            has: {matches: {msbuild-attribute: {name: {regex: '^Include$'}, value: {regex: '(?:^["'']|;)\s*(RhinoCommon|Rhino\.UI|Eto(\.(macOS|Wpf))?|Microsoft\.macOS|Grasshopper2?|GrasshopperIO|GH_IO|@\(_RhinoHostAssembly\))\s*[,;"'']'}}}}
        - matches: {msbuild-metadata: {name: {regex: '^HintPath$'}, value: {kind: 'AttValue, CharData'}}}
        - not: {matches: {msbuild-effective-metadata: {name: {regex: '^Private$'}, value: {regex: '(?i)^["'']?\s*false\s*["'']?$'}}}}
transform:
    FIXED: rewrite($REFERENCE, rewriters=[add-metadata, remove-metadata])
fix: $FIXED
rewriters:
    - id: remove-metadata
      rule:
        any:
            - kind: Attribute
              has: {kind: Name, regex: '^Private$'}
              inside: {matches: msbuild-tag, inside: {pattern: _REFERENCE}}
            - matches: {msbuild-element: {name: {regex: '^Private$'}}}
              inside: {kind: content, inside: {pattern: _REFERENCE}}
      fix: ''
    - id: add-metadata
      rule:
        matches: msbuild-tag
        pattern: _TAG
        has: {kind: Name, regex: '^Reference$'}
      transform:
        STRIPPED: rewrite($TAG, rewriters=[remove-metadata])
        FIXED:
            replace:
                source: $STRIPPED
                replace: '\s*(/?>)$'
                by: ' Private="false"$1'
      fix: $FIXED
message: The Reference with a HintPath copies the host-supplied assembly into the output and the host loads that copy
note: Add Private="false", and reference a package or project output through PackageReference or ProjectReference
