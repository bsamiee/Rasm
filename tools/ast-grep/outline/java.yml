name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {all: [{matches: exposed}, {matches: reachable}]}
---
id: java-member-initializer
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum]
symbolType: constructor
utils:
    scope:
        any:
            - kind: class_body, interface_body, annotation_type_body
              inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_constant', field: body}
            - kind: enum_body_declarations
rule:
    kind: static_initializer
    has: {pattern: $$NAME, regex: '^static$'}
    inside:
        matches: scope
        inside:
            kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant
            stopBy: end
            any:
                - has: {field: name, pattern: $OWNER}
                  not: {inside: {kind: program}}
                - pattern: $_
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
name: $QUALIFIER$NAME
signature: $NAME
isPublic: false
---
id: java-member-constant
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum]
symbolType: constant
utils:
    scope:
        any:
            - kind: class_body, interface_body, annotation_type_body
              inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_constant', field: body}
            - kind: enum_body_declarations
    exposed:
        any:
            - has: {kind: modifiers, has: {regex: '^(?:public|protected)$'}}
            - inside: {kind: 'interface_body, annotation_type_body'}
              not: {has: {kind: modifiers, has: {regex: '^private$'}}}
    reachable:
        all:
            - not: {inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration', stopBy: end, not: {matches: exposed}}}
            - not: {inside: {kind: program, stopBy: end, has: {kind: 'method_declaration, field_declaration'}}}
rule:
    kind: field_declaration, constant_declaration
    pattern: $DECLARATION
    any:
        - kind: constant_declaration
        - has: {kind: modifiers, all: [{has: {regex: '^static$'}}, {has: {regex: '^final$'}}]}
    inside:
        matches: scope
        inside:
            kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant
            stopBy: end
            any:
                - has: {field: name, pattern: $OWNER}
                  not: {inside: {kind: program}}
                - pattern: $_
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        inside: {kind: 'field_declaration, constant_declaration'}
        has: {field: name, pattern: $DECLARED}
      fix: $DECLARED
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [name], joinBy: ', '}}
    SIGNATURE: {replace: {source: $DECLARATION, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}])+$', by: ''}}
name: $QUALIFIER$NAMES
signature: $SIGNATURE
isPublic: {all: [{matches: exposed}, {matches: reachable}]}
---
id: java-member-field
language: javalang
role: member
parentRuleIds: [java-class, java-interface, java-enum]
symbolType: field
utils:
    scope:
        any:
            - kind: class_body, interface_body, annotation_type_body
              inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_constant', field: body}
            - kind: enum_body_declarations
    exposed:
        any:
            - has: {kind: modifiers, has: {regex: '^(?:public|protected)$'}}
            - inside: {kind: 'interface_body, annotation_type_body'}
              not: {has: {kind: modifiers, has: {regex: '^private$'}}}
    reachable:
        all:
            - not: {inside: {kind: 'class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration', stopBy: end, not: {matches: exposed}}}
            - not: {inside: {kind: program, stopBy: end, has: {kind: 'method_declaration, field_declaration'}}}
rule:
    kind: field_declaration
    pattern: $DECLARATION
    inside:
        matches: scope
        inside:
            kind: class_declaration, record_declaration, interface_declaration, annotation_type_declaration, enum_declaration, enum_constant
            stopBy: end
            any:
                - has: {field: name, pattern: $OWNER}
                  not: {inside: {kind: program}}
                - pattern: $_
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        inside: {kind: 'field_declaration, constant_declaration'}
        has: {field: name, pattern: $DECLARED}
      fix: $DECLARED
    - id: declarator
      rule:
        kind: variable_declarator
        inside: {kind: 'field_declaration, constant_declaration'}
        has: {field: name, pattern: $DECLARED}
        any:
            - has: {field: dimensions, pattern: $DIMENSIONS}
            - pattern: $_
      fix: $DECLARED$DIMENSIONS
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    NAMES: {rewrite: {source: $DECLARATION, rewriters: [name], joinBy: ', '}}
    HEADER: rewrite($DECLARATION, rewriters=[declarator])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}])+$', by: ''}}
name: $QUALIFIER$NAMES
signature: $SIGNATURE
isPublic: {all: [{matches: exposed}, {matches: reachable}]}
