id: no-json-parse
valid:
    - 'function decode(JSON: { parse(value: string): unknown }) { return JSON.parse("x"); }'
    - 'import { JSON } from "./codec"; JSON.parse(text);'
    - 'const row = yield* Schema.decodeUnknown(Schema.parseJson(Row))(text);'
    - 'const text = JSON.stringify(row);'
    - 'const row = Duration.parse(text);'
    - 'const raw = JSON.rawJSON("1");'
    - 'const parse = JSON.parse;'
invalid:
    - 'const row = JSON.parse(text);'
    - 'const row = JSON.parse(text, reviver);'
    - 'const row = globalThis.JSON.parse(text);'
    - 'use(JSON.parse(text));'
    - 'const row = JSON.parse(text) as Row;'
