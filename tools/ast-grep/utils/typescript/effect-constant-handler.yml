# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: effect-constant-handler
language: tsx
arguments: [answer]
rule:
    kind: arrow_function, function_expression
    all:
        - not: {regex: '^async\b'}
        - not: {has: {field: parameters, has: {pattern: $_, not: {kind: required_parameter, has: {field: pattern, kind: identifier}, not: {has: {field: value, pattern: $_}}}}}}
        - not: {has: {field: parameters, has: {nthChild: 2}}}
        - not:
            all:
                - any:
                    - has: {field: parameter, kind: identifier, pattern: $PARAMETER}
                    - has:
                        field: parameters
                        has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $PARAMETER}}
                - has:
                    field: body
                    has:
                        stopBy: end
                        pattern: $PARAMETER
                        kind: identifier, shorthand_property_identifier
        - not:
            kind: function_expression
            has:
                field: body
                has: {stopBy: end, kind: identifier, regex: '^arguments$'}
        - not:
            kind: function_expression
            all:
                - has: {field: name, pattern: $FUNCTION}
                - has:
                    field: body
                    has:
                        stopBy: end
                        pattern: $FUNCTION
                        kind: identifier, shorthand_property_identifier
        - has:
            field: body
            any:
                - matches: answer
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: answer}}
                  not: {has: {nthChild: 2}}
