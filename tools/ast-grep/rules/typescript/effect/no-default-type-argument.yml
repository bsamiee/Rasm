# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    defaulted:
        kind: predefined_type
        regex: '^never$'
        any:
            - nthChild: {position: n+2, ofRule: &type-argument {not: {kind: 'comment, html_comment'}}}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        any:
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^Effect$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Stream$'}, member: {regex: '^Stream$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Layer$'}, member: {regex: '^Layer$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Request$'}, member: {regex: '^Request$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Result$'}, member: {regex: '^Result$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Fiber$'}, member: {regex: '^Fiber$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Deferred$'}, member: {regex: '^Deferred$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Pool$'}, member: {regex: '^Pool$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)RcRef$'}, member: {regex: '^RcRef$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Resource$'}, member: {regex: '^Resource$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)LayerRef$'}, member: {regex: '^LayerRef$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Exit$'}, member: {regex: '^(Exit|Success)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Queue$'}, member: {regex: '^(Queue|Enqueue|Dequeue)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Sink$'}, member: {regex: '^End$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)TxQueue$'}, member: {regex: '^(TxQueue|TxEnqueue|TxDequeue)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)TxDeferred$'}, member: {regex: '^TxDeferred$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^(Decoder|Encoder|ConstraintDecoder|ConstraintEncoder|withDecodingDefault(Type)?(Key)?)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)AsyncResult$'}, member: {regex: '^(AsyncResult|Initial|Success|Failure)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Atom$'}, member: {regex: '^(AtomRuntime|PullResult)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)RpcClient$'}, member: {regex: '^(RpcClient|FromGroup)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)HttpApiClient$'}, member: {regex: '^(Client|ForApi)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)EntityResource$'}, member: {regex: '^EntityResource$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)PersistedQueue$'}, member: {regex: '^PersistedQueue$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)PersistedCache$'}, member: {regex: '^PersistedCache$'}}}
            - nthChild: {position: n+3, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        any:
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Cache$'}, member: {regex: '^Cache$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)ScopedCache$'}, member: {regex: '^ScopedCache$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)RcMap$'}, member: {regex: '^RcMap$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)LayerMap$'}, member: {regex: '^LayerMap$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Schedule$'}, member: {regex: '^Schedule$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Sink$'}, member: {regex: '^Sink$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Schema$'}, member: {regex: '^(Codec|ConstraintCodec|decodeTo)$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)SchemaGetter$'}, member: {regex: '^Getter$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)SchemaTransformation$'}, member: {regex: '^Transformation$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Atom$'}, member: {regex: '^AtomResultFn$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)CircuitBreaker$'}, member: {regex: '^Classifier$'}}}
            - nthChild: {position: n+4, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        any:
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Pull$'}, member: {regex: '^Pull$'}}}
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Filter$'}, member: {regex: '^FilterEffect$'}}}
            - nthChild: {position: n+7, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        any:
                            - matches: {effect-module-type: {module: {regex: '(?-u:\b)Channel$'}, member: {regex: '^Channel$'}}}
            - nthChild: {position: 2, ofRule: *type-argument}
              inside:
                kind: type_arguments
                inside:
                    kind: generic_type
                    has:
                        field: name
                        matches: {effect-module-type: {module: {regex: '(?-u:\b)Take$'}, member: {regex: '^Take$'}}}
rule:
    kind: predefined_type
    all:
        - matches: defaulted
        - nthChild: {position: 1, reverse: true, ofRule: *type-argument}
        - inside: {kind: type_arguments, inside: {kind: generic_type, has: {field: name, pattern: $NAME}}}
fix:
    template: ''
    expandStart:
        stopBy: {kind: comment}
        any:
            - regex: '^,$'
              not: {follows: {matches: defaulted}}
            - matches: defaulted
              follows: {kind: comment}
    expandEnd: {regex: '^,$'}
message: '`$NAME` restates a trailing `never` default'
note: 'Omit each trailing type argument equal to its `never` default'
