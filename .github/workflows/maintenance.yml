name: Maintenance

on:
    schedule:
        - cron: '0 9 * * 0'
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    advisories:
        name: Cargo advisories
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: $/.github/actions/tools
              with:
                  mise-env: ci-linux,ci-no-uv
            - run: nx run rasm:check--cargo-deny-advisories
              env:
                  NX_SKIP_NX_CACHE: 'true'
