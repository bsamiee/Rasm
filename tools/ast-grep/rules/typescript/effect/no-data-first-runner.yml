# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    dual-runner:
        any:
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)(BrowserRuntime|BunRuntime|NodeRuntime)$'}, member: {regex: '^runMain$'}}}
            - matches: {effect-module-member: {module: {regex: '(?-u:\b)Command$'}, member: {regex: '^run$'}}}
    piped-program:
        kind: call_expression
        has: {field: arguments, has: {nthChild: {position: 1, ofRule: &argument {not: {kind: comment}}}}}
        any:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^pipe$'}}
            - has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}
    runner-call:
        kind: call_expression
        all:
            - has: {field: function, pattern: $RUN, regex: '(?-u:\b)run', any: [{matches: dual-runner}, {matches: {effect-runner: {name: {regex: '^run'}}}}]}
            - any:
                - pattern: $RUN($_PROGRAM)
                - pattern: '$RUN($_PROGRAM, $_OPTIONS)'
                  has: {field: function, matches: dual-runner}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *argument}, matches: piped-program}}
rule:
    kind: call_expression
    all:
        - any:
            - all:
                - matches: runner-call
                - not: {inside: {kind: member_expression, field: object, has: {field: property, regex: '^pipe$'}}}
            - all:
                - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^pipe$'}}, {has: {field: object, matches: runner-call}}]}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *argument}}}
message: '`$RUN` wraps the pipe it runs'
note: 'Write `<program>.pipe(<steps>, <runner>)`, with `<runner>(<options>)` for a runner taking options'
