id: msbuild-item
language: xml
role: member
parentRuleIds: [msbuild-group]
symbolType: variable
rule:
    kind: element
    has:
        kind: STag, EmptyElemTag
        pattern: _TAG
        all:
            - has: {kind: Name, pattern: _NAME}
            - has:
                kind: Attribute
                all:
                    - has: {kind: Name, regex: "^(Include|Update|Remove)$"}
                    - has: {kind: AttValue, pattern: _VALUE}
    inside:
        kind: content
        inside:
            kind: element
            has:
                kind: STag
                has: {kind: Name, regex: "^ItemGroup$"}
name: "$NAME $VALUE"
signature: $TAG
isPublic: true
