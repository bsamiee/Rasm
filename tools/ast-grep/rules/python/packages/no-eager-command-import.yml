# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
rule:
    kind: call
    pattern: $CALL
    all:
        - has:
            field: function
            kind: attribute
            all:
                - has: {field: attribute, regex: '^command$'}
                - has:
                    field: object
                    kind: identifier
                    matches: {python-assigned-name: {value: {kind: call, has: {field: function, matches: {python-member-use: {module: {regex: '^cyclopts$'}, name: {regex: '^App$'}}}}}}}
        - has:
            field: arguments
            kind: argument_list
            has: {nthChild: 1, kind: identifier, pattern: $COMMAND, matches: {python-imported-name: {module: {regex: '.'}, name: {regex: '.'}}}}
            not: {has: {nthChild: 2}}
message: '`$CALL` imports `$COMMAND` before its command runs'
note: 'Register `<app>.command("<module>:<function>")` and remove the eager function import'
