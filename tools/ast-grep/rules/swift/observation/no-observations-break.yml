# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observations-break
language: swiftlang
severity: error
rule:
    kind: 'if_statement, guard_statement'
    pattern: $SITE
    all:
        - has: {kind: statements, has: {nthChild: 1, kind: control_transfer_statement, regex: '^break$'}, not: {has: {nthChild: 2}}}
        - inside:
            kind: statements
            inside:
                kind: for_statement
                has: {field: collection, kind: call_expression, has: {nthChild: 1, regex: '^(Observation\.)?Observations$'}}
message: '`$SITE` ends iteration of `Observations` on a condition read outside the tracked closure'
note: 'Build the sequence with `Observations.untilFinished { <model>.done ? .finish : .next(<model>.<property>) }` to read the ending condition under tracking'
