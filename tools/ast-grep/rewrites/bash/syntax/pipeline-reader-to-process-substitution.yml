# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: pipeline-reader-to-process-substitution
language: bash
severity: off
ignores: ["**/*.json"]
rule:
    all:
        - kind: pipeline
        - not: {regex: '^(?:!|time)(?:\s|$)'}
        - has:
            nthChild: {position: 1, reverse: true}
            any:
                - kind: while_statement
                - kind: command
                  has: {matches: {bash-invoked-name: {name: {regex: '^(read|mapfile|readarray)$'}, runner: {regex: '^(builtin|command)$'}}}}
                  not: {has: {kind: herestring_redirect}}
        - pattern: $PIPE
        - has:
            nthChild: {position: 1, reverse: true}
            pattern: $STAGE
            follows: {pattern: $$BAR}
rewriters:
    - id: keep-producer
      rule:
        pattern: $PRODUCER
        inside: {kind: pipeline}
        not: {nthChild: {position: 1, reverse: true}}
      fix: $PRODUCER
    - id: remove-reader
      rule:
        pattern: $STAGE
        kind: while_statement, command
        inside: {kind: pipeline}
      fix:
        template: ""
        expandStart: {pattern: $$BAR}
transform:
    BEFORE: rewrite($PIPE, rewriters=[keep-producer, remove-reader])
    PRODUCER: replace($BEFORE, replace='\s+$', by='')
    MERGE: replace($BAR, replace='^\|$', by='')
    STDERR: replace($MERGE, replace='^\|&$', by=' 2>&1')
fix: $STAGE < <($PRODUCER$STDERR)
message: The reader runs in a subshell as the last pipeline stage
note: Read in the current shell, `read -r value < <(producer)`, and keep the pipeline under lastpipe where the producer's status or completion is consumed
