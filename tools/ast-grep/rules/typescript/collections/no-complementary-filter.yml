# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-complementary-filter
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/**']
rule:
    kind: call_expression
    all:
        - has: {field: function, pattern: $FILTER}
        - matches: typescript-complementary-filter
message: '`$FILTER` keeps elements failing a predicate a sibling `filter` keeps'
note: 'Call `Array.partition(<list>, Filter.fromPredicate(<predicate>))` once for `[passes, fails]`'
