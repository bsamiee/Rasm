# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-throwing-factory
language: csharplang
utils:
    total-factory-owner:
        matches: { csharp-type-name: { name: { regex: '^@?(?:(?:KeyValuePair|Tuple|ValueTuple|String)$|Immutable[A-Z]|Frozen[A-Z])' } } }
    converter-owner:
        matches: { csharp-type-name: { name: { regex: '^@?(Convert|BitConverter|XmlConvert)$' } } }
    validated-owner:
        kind: identifier
        pattern: $OWNER
        inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                kind: class_declaration, record_declaration, struct_declaration
                all:
                    - has: { field: name, pattern: $OWNER }
                    - has: { kind: attribute_list, regex: '(?-u:\b)(?:ValueObject|ComplexValueObject|SmartEnum)(?-u:\b)' }
rule:
    kind: member_access_expression
    any:
        - all:
              - has:
                    field: expression
                    any:
                        - matches: csharp-static-owner
                        - { kind: predefined_type, regex: '^(?:bool|byte|sbyte|char|short|ushort|int|uint|long|ulong|float|double|decimal)$' }
                    not: { matches: total-factory-owner }
              - has: { field: name, matches: { csharp-simple-name: { name: { regex: '^(?:Parse|ParseExact)$' } } } }
        - all:
              - has: { field: expression, matches: validated-owner }
              - has: { field: name, matches: { csharp-simple-name: { name: { regex: '^(?:Create|Get)$' } } } }
        - all:
              - has: { field: expression, matches: converter-owner }
              - has: { field: name, regex: '^To[A-Z]' }
