# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-attribute-check
language: python
severity: error
utils:
    attribute-name:
        any:
            - {matches: python-identifier-string, not: {regex: '__call__'}}
            - matches: python-relayed-identifier-string
    default-callee:
        kind: 'identifier, attribute'
        matches: {builtins-attribute-function: {name: {regex: '^getattr(_static)?$'}}}
    boolean-callee:
        kind: 'identifier, attribute'
        matches: {builtins-attribute-function: {name: {regex: '^hasattr$'}}}
    partial-of-default:
        kind: call
        all:
            - has: {field: function, matches: functools-partial-callee}
            - has: {field: arguments, has: {nthChild: 1, matches: default-callee}}
    partial-of-boolean:
        kind: call
        all:
            - has: {field: function, matches: functools-partial-callee}
            - has: {field: arguments, has: {nthChild: 1, matches: boolean-callee}}
    object-partial-default:
        any:
            - {matches: partial-of-default, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}
            - matches: {python-assigned-name: {value: {matches: partial-of-default, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}}}
    name-partial-default:
        any:
            - {matches: partial-of-default, has: {field: arguments, has: {nthChild: 3, matches: attribute-name}, not: {has: {nthChild: 4}}}}
            - matches: {python-assigned-name: {value: {matches: partial-of-default, has: {field: arguments, has: {nthChild: 3, matches: attribute-name}, not: {has: {nthChild: 4}}}}}}
    object-partial-boolean:
        any:
            - {matches: partial-of-boolean, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}
            - matches: {python-assigned-name: {value: {matches: partial-of-boolean, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}}}
    getmembers-callee:
        kind: 'identifier, attribute'
        matches: {builtins-attribute-function: {name: {regex: '^getmembers(_static)?$'}}}
    listing:
        any:
            - matches: inspect-member-mapping
            - kind: call
              all:
                - has: {field: function, matches: {builtins-attribute-function: {name: {regex: '^dir$'}}}}
                - has: {field: arguments, kind: argument_list, has: {nthChild: 1}, not: {has: {nthChild: 2}}}
    name-comparison:
        kind: comparison_operator
        all:
            - has: {field: operators, regex: '^==$'}
            - has: {matches: python-identifier-string}
rule:
    pattern: $CHECK
    any:
        - kind: call
          all:
            - has: {field: function, kind: attribute, all: [{has: {field: attribute, regex: '^(get|setdefault)$'}}, {has: {field: object, matches: inspect-member-mapping}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: attribute-name}}
        - kind: subscript
          all:
            - has: {field: subscript, matches: attribute-name}
            - has: {field: value, matches: inspect-member-mapping}
            - matches: python-key-catch
        - kind: comparison_operator
          all:
            - has: {field: operators, regex: '^(not\s+)?in$'}
            - has: {nthChild: 1, matches: attribute-name}
            - has: {nthChild: 2, matches: listing}
            - not: {has: {nthChild: 3}}
        - kind: class_pattern
          all:
            - has: {kind: dotted_name, regex: '^(builtins\.)?object$'}
            - has: {kind: case_pattern, has: {kind: keyword_pattern}}
        - kind: dict_pattern
          all:
            - has: {field: key, matches: python-identifier-string}
            - inside: {stopBy: {kind: match_statement}, kind: match_statement, has: {field: subject, matches: inspect-member-mapping}}
        - kind: call
          all:
            - has: {field: arguments, has: {nthChild: 3}}
            - has: {field: arguments, has: {nthChild: 2, matches: attribute-name}}
            - has: {field: function, matches: default-callee}
        - kind: call
          all:
            - has: {field: arguments, has: {nthChild: 2, matches: attribute-name}}
            - has: {field: function, matches: boolean-callee}
        - kind: call
          all:
            - has: {field: arguments, has: {nthChild: 1}}
            - inside: {stopBy: end, kind: module, all: [{regex: '\bpartial\b'}, {regex: '\b(getattr|hasattr)'}]}
            - any:
                - all:
                    - has: {field: arguments, has: {nthChild: 2}}
                    - has: {field: function, matches: object-partial-default}
                    - has: {field: arguments, has: {nthChild: 1, matches: attribute-name}}
                - has: {field: function, matches: name-partial-default}
                - all:
                    - has: {field: function, matches: object-partial-boolean}
                    - has: {field: arguments, has: {nthChild: 1, matches: attribute-name}}
                - all:
                    - has: {field: arguments, has: {nthChild: 4}}
                    - matches: partial-of-default
                    - has: {field: arguments, has: {nthChild: 3, matches: attribute-name}}
                - all:
                    - has: {field: arguments, has: {nthChild: 3}}
                    - matches: partial-of-boolean
                    - has: {field: arguments, has: {nthChild: 3, matches: attribute-name}}
        - kind: call
          all:
            - any:
                - inside: {kind: for_in_clause, field: right, all: [{has: {field: left, has: {nthChild: 1, kind: identifier, pattern: $MEMBER}}}, {inside: {kind: 'list_comprehension, set_comprehension, dictionary_comprehension, generator_expression', has: {kind: if_clause, has: {stopBy: end, matches: name-comparison, has: {pattern: $MEMBER}}}}}]}
                - inside: {kind: for_statement, field: right, all: [{has: {field: left, has: {nthChild: 1, kind: identifier, pattern: $MEMBER}}}, {has: {field: body, has: {stopBy: end, matches: name-comparison, has: {pattern: $MEMBER}}}}]}
                - inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^filter$'}}, has: {kind: lambda, has: {field: body, matches: name-comparison}}}
            - has: {field: function, matches: getmembers-callee}
message: '`$CHECK` tests an object for an attribute by name'
note: 'Use `isinstance` or a class pattern narrowing to the declaring type before each attribute read, a name test hides declaring types from type checkers while a `vars` or `__dict__` test answers which namespace declares the member and stays'
