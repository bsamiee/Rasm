name: Native cache
description: Restores the vcpkg binary cache, the vcpkg downloads, the pinned release downloads, and the emgucv build output for one runtime identifier

inputs:
  rid:
    description: Runtime identifier the job stages
    required: true

outputs:
  vcpkg-key:
    description: Cache key of the vcpkg entry, the workflow saves it after the stage step under any outcome
    value: ${{ steps.vcpkg.outputs.cache-primary-key }}
  releases-key:
    description: Cache key of the release downloads entry, the workflow saves it after the stage step under any outcome
    value: ${{ steps.releases.outputs.cache-primary-key }}
  emgucv-key:
    description: Cache key of the emgucv entry, the workflow saves it after the stage step under any outcome
    value: ${{ steps.emgucv.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - id: vcpkg
      uses: actions/cache/restore@v6
      with:
        path: |
          .cache/vcpkg-archives
          .cache/vcpkg-downloads
        key: vcpkg-${{ inputs.rid }}-${{ hashFiles('eng/native/*/vcpkg.json') }}
    - id: releases
      uses: actions/cache/restore@v6
      with:
        path: |
          .cache/energyplus
          .cache/ktx
          .cache/sqlitevec
          .cache/duckdbextensions
          .cache/tools
        key: releases-${{ inputs.rid }}-${{ hashFiles('eng/native/*/release.json', 'eng/native/*/extensions.json') }}
    - id: emgucv
      uses: actions/cache/restore@v6
      with:
        path: .cache/emgucv/artifacts
        key: emgucv-${{ inputs.rid }}-${{ hashFiles('eng/native/emgucv/source.json') }}
