# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    generic-name:
        regex: '^(r#)?(utils?|helpers?|common|misc|stuff|types|models|traits|structs|enums|consts?|constants|prelude)$'
    generic-file:
        kind: string_literal
        regex: '^"([^"]*/)?(utils?|helpers?|common|misc|stuff|types|models|traits|structs|enums|consts?|constants|prelude)\.rs"$'
rule:
    any:
        - kind: mod_item
          all:
            - any:
                - has: {field: name, matches: generic-name, pattern: $NAME}
                - matches:
                    rust-attributed:
                        attribute:
                            has:
                                kind: attribute
                                any:
                                    - all:
                                        - has: {field: path, pattern: path}
                                        - has: {field: value, matches: generic-file, pattern: $NAME}
                                    - all:
                                        - has: {field: path, pattern: cfg_attr}
                                        - has: {field: arguments, has: {matches: generic-file, pattern: $NAME, follows: {regex: '^=$', follows: {pattern: path}}}}
            - not: {matches: {rust-attributed: {attribute: {matches: rust-test-attribute}}}}
        - kind: use_as_clause
          has: {field: alias, matches: generic-name, pattern: $NAME}
message: '`$NAME` names a kind of item or a catch-all in place of a domain'
note: 'Move each item into a module named for the domain that uses it'
