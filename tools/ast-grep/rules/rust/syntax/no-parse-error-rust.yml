# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-rust
language: rust
severity: error
utils:
    foreign-item:
        kind: ERROR
        regex: '^(safe|(pub(\s*\([^)]*\))?\s+)?type\s+\w+)$'
        inside: {kind: declaration_list, stopBy: {kind: declaration_list}, inside: {kind: foreign_mod_item}}
    macro-token:
        kind: ERROR
        regex: '^(~[~\s]*|\$)$'
        inside: {kind: 'token_tree, token_tree_pattern'}
    struct-where:
        kind: ERROR
        regex: '^where\b'
        inside: {kind: struct_item}
    unit-bound:
        kind: type_identifier
        inside: {kind: tuple_type, regex: '^\(\s*\)$', inside: {kind: where_predicate}}
    empty-raw-string:
        kind: string_content
        inside: {kind: raw_string_literal}
    try-type:
        kind: ERROR
        any:
            - regex: '^try\s+bikeshed\b'
            - {regex: '^bikeshed\b', inside: {kind: try_block}}
    trait-alias:
        kind: ERROR
        regex: '^((pub(\s*\([^)]*\))?\s+)?(unsafe\s+)?)?trait\s+\w+\s*(<[^=]*>)?\s*='
    field-default:
        kind: ERROR
        regex: '^='
        inside: {kind: field_declaration_list}
        follows: {kind: field_declaration}
    type-default:
        kind: ERROR
        has: {kind: trait_bounds}
        inside: {kind: type_item, inside: {kind: declaration_list, inside: {kind: trait_item}}}
    baseless-update:
        kind: ERROR
        regex: '^\.\.$'
        inside: {kind: field_initializer_list}
    return-notation:
        any:
            - kind: function_type
              inside: {kind: type_arguments}
              has: {field: parameters, regex: '^\(\s*\.\.'}
            - kind: ERROR
              regex: '^\(\s*\.\.\s*\)$'
              inside: {kind: where_predicate}
    impl-restriction:
        kind: ERROR
        regex: '^(pub(\s*\([^)]*\))?\s+)?impl\s*\(\s*(crate|self|super|in\s+[\w:]+)\s*\)(\s+(unsafe|auto))*$'
        precedes: {kind: trait_item}
    recovery-anchor:
        any:
            - matches: try-type
            - matches: trait-alias
    recovery-tail:
        any:
            - follows: {stopBy: &unit {kind: 'let_declaration, expression_statement, empty_statement, function_item, function_signature_item, struct_item, enum_item, union_item, impl_item, trait_item, const_item, static_item, type_item, mod_item, use_declaration, extern_crate_declaration, foreign_mod_item, macro_definition, attribute_item, inner_attribute_item'}, matches: recovery-anchor}
            - inside:
                stopBy: end
                not: {kind: 'block, declaration_list, let_declaration, function_item, function_signature_item, struct_item, enum_item, union_item, impl_item, trait_item, const_item, static_item, type_item, mod_item, foreign_mod_item, macro_definition'}
                follows: {stopBy: *unit, matches: recovery-anchor}
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: foreign-item
            - matches: macro-token
            - matches: struct-where
            - matches: unit-bound
            - matches: empty-raw-string
            - matches: recovery-anchor
            - matches: recovery-tail
            - matches: field-default
            - matches: type-default
            - matches: baseless-update
            - matches: return-notation
            - inside: {stopBy: end, matches: return-notation}
            - matches: impl-restriction
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: source_file
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: >-
    Use a form the grammar parses, every other rule skips constructs inside a parse error. Call a macro named after a primitive type by its path (`snapbox::str![..]`). Unreported tree-sitter-rust grammar gaps are `safe` items and foreign types of an `extern` block (`pub safe fn sqrt(x: f64) -> f64;`, `pub type Node;`), `~` and lone `$` tokens in a macro token tree, a `where` clause on a unit struct (`struct Marker where T: Send;`), the unit type bounded in a `where` clause (`(): Bound<T>`), the empty content of a raw string (`r""`), and the nightly forms `try bikeshed <type> { .. }` and `trait <name> = <bounds>;` with the recovery spread over the rest of their statement, a field default value (`retries: u8 = 3`), a bounded associated type default (`type Error: Bound = !;`), a struct literal closing on `..` with no base, return-type notation (`Store<get(..): Send>`, `where S::get(..): Send`), and an `impl` restriction on a trait (`pub impl(crate) trait Host`)
