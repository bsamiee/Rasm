name: Deploy

on:
    workflow_call: {}
    repository_dispatch:
        types: [deploy]
    schedule:
        - cron: '0 8 * * *'

concurrency:
    group: deploy
    cancel-in-progress: false
    queue: max

defaults:
    run:
        shell: bash

jobs:
    newest:
        name: Newest commit
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            sha: ${{ steps.main.outputs.sha }}
        steps:
            - id: main
              run: |-
                  sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
                  printf "sha=%s\n" "${sha}" >> "${GITHUB_OUTPUT}"
              env:
                  GH_TOKEN: ${{ github.token }}

    deploy:
        name: Deploy
        needs: newest
        if: ${{ needs.newest.outputs.sha == github.sha }}
        runs-on: ubuntu-26.04
        timeout-minutes: 120
        environment: deploy
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |-
                      .cache/nx/workspace-data/*
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                      !.cache/nx/workspace-data/task-cache.jsonl
                      !.cache/nx/workspace-data/xcode-packages
                  key: nx-${{ runner.os }}-
            - uses: $/.github/actions/tools
            - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
            - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
              with:
                  oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
                  audience: ${{ vars.TAILSCALE_AUDIENCE }}
                  tags: tag:deploy
            - run: mkdir -p ~/.ssh && printf "%s\n" "Host *" "    StrictHostKeyChecking accept-new" >> ~/.ssh/config
            - id: bootstrap
              run: mise bootstrap remote --all --only accounts,packages,files,services --yes
            - if: ${{ !cancelled() && steps.bootstrap.outcome != 'skipped' }}
              run: nx deploy @rasm/infra
              env: &doppler
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            - run: nx dry-run @rasm/infra --configuration=converged
              env: *doppler
            - if: ${{ !cancelled() && !endsWith(steps.graph.outputs.cache-matched-key, hashFiles('.cache/nx/workspace-data/*.hash')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: nx-${{ runner.os }}-${{ hashFiles('.cache/nx/workspace-data/*.hash') }}
            - if: ${{ always() }}
              run: docker buildx ls --format json | jq --raw-output 'select(.Driver == "docker-container") | .Name' | xargs --no-run-if-empty docker buildx rm --force
