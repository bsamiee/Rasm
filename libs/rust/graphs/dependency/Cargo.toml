# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-dependency"
version.workspace    = true
edition.workspace    = true
description          = "Evaluation graphs: cycle refusal naming every closing path, input wiring that extends or replaces and returns the replaced weights, keyed topological order and layers in either direction, invalidation reach, branded dependency-driven propagation with early cutoff, transitive reduction, condensation, simple cycles, tearing, and deadline-bounded critical path schedules"
repository.workspace = true
license.workspace    = true
keywords             = ["dependency-graph", "topological-sort", "invalidation", "critical-path", "scheduling"]
categories           = ["algorithms", "data-structures"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
thiserror            = { workspace = true }
itertools            = { workspace = true }
nonempty-collections = { workspace = true }
petgraph             = { workspace = true }
rustworkx-core       = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
