# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    error-name:
        kind: identifier
        matches: tracing-field-start
        pattern: $NAME
        regex: '^(error|err|e|cause|exception)$'
    report-value:
        matches: tracing-field-start
        pattern: $NAME
        not: {regex: '^\{\p{Pattern_White_Space}*(\p{XID_Continue}+::)*EXCEPTION_MESSAGE\p{Pattern_White_Space}*\}$'}
        precedes: {regex: '^=$', precedes: {stopBy: {regex: '^,$'}, kind: identifier, regex: '^Report$', precedes: {regex: '^::$', precedes: {kind: identifier, regex: '^new$'}}}}
    error-field:
        any:
            - matches: error-name
            - matches: report-value
    instrument-option:
        kind: identifier
        pattern: $NAME
        inside: {kind: token_tree, follows: {regex: '^(::)?(tracing::)?instrument$'}, inside: {kind: attribute, stopBy: end}}
        any:
            - regex: '^err$'
            - regex: '^ret$'
              not: {inside: {kind: token_tree, has: {kind: identifier, regex: '^err$'}}}
              inside: {kind: attribute_item, stopBy: end, precedes: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, kind: function_item, has: {field: return_type, regex: '(?-u:\b)Result(?-u:\b)'}}}
rule:
    any:
        - matches: tracing-macro
          has: {kind: token_tree, has: {stopBy: end, matches: error-field}}
        - kind: attribute_item
          has:
            kind: attribute
            any:
                - has: {stopBy: end, matches: instrument-option}
                - has: {stopBy: end, matches: tracing-instrument-fields, has: {matches: error-field}}
message: '`$NAME` records an error outside field `exception.message`'
note: 'Record `{ EXCEPTION_MESSAGE } = %std::error::Report::new(<error>)` with the `opentelemetry_semantic_conventions::attribute` constant'
