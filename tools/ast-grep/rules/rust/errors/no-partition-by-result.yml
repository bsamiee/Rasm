# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-partition-by-result
language: rust
severity: error
utils:
    result-test:
        any:
            - kind: scoped_identifier
              regex: '^((::)?(std|core)::)?(result::)?Result::is_(ok|err)$'
            - kind: closure_expression
              all:
                - has: {field: parameters, has: {kind: identifier, pattern: $ITEM}, not: {has: {nthChild: 2}}}
                - has:
                    field: body
                    any:
                        - kind: call_expression
                          all:
                            - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $ITEM}}, {has: {field: field, regex: '^is_(ok|err)$'}}]}
                            - has: {field: arguments, not: {has: {pattern: $_}}}
                        - kind: macro_invocation
                          all:
                            - has: {field: macro, regex: '^matches$'}
                            - has: {kind: token_tree, regex: '^\(\s*\w+\s*,\s*(Ok|Err)\s*\(\s*_\s*\)\s*\)$'}
rule:
    kind: call_expression
    pattern: $SITE
    all:
        - has:
            field: function
            any:
                - kind: field_expression
                  has: {field: field, regex: '^partition$'}
                - kind: generic_function
                  has: {field: function, kind: field_expression, has: {field: field, regex: '^partition$'}}
        - has: {field: arguments, all: [{has: {nthChild: 1, matches: result-test}}, {not: {has: {nthChild: 2}}}]}
message: '`$SITE` splits results by their case and leaves each half wrapped in `Ok` or `Err`'
note: 'Call `itertools::Itertools::partition_result` on the owned results (`<iter>.partition_result::<Vec<_>, Vec<_>, _, _>()`) and drop the unwraps after it, the method yields unwrapped values and errors. Every consumer of the two halves changes its element type'
