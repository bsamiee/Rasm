# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-malformed-divider-java
language: java
severity: error
rule:
    matches: java-divider-comment
    pattern: $DIVIDER
    all:
        - not: {any: [{matches: java-empty-divider}, {matches: java-parse-error-file}]}
        - any:
            - inside: {kind: program}
              pattern: $SECTION
              not: {all: [{matches: java-section-divider}, {regex: '^.{90}$'}]}
            - inside: {matches: java-member-list}
              pattern: $FAMILY
              not: {regex: '^// --- \[[A-Z0-9_]+\]$'}
transform:
    SECTION_LABEL: {replace: {source: $SECTION, replace: '^//\s*-*\s*\[\s*([^\]]*?)\s*\][\s\S]*$', by: '$1'}}
    SECTION_SNAKE: {convert: {source: $SECTION_LABEL, toCase: snakeCase}}
    SECTION_UPPER: {convert: {source: $SECTION_SNAKE, toCase: upperCase}}
    SECTION_PADDED: {replace: {source: $SECTION_UPPER, replace: '^(.+)$', by: '// --- [$1] ----------------------------------------------------------------------------------'}}
    SECTION_FORM: {substring: {source: $SECTION_PADDED, endChar: 90}}
    FAMILY_LABEL: {replace: {source: $FAMILY, replace: '^//\s*-*\s*\[\s*([^\]]*?)\s*\][\s\S]*$', by: '$1'}}
    FAMILY_SNAKE: {convert: {source: $FAMILY_LABEL, toCase: snakeCase}}
    FAMILY_UPPER: {convert: {source: $FAMILY_SNAKE, toCase: upperCase}}
    FAMILY_FORM: {replace: {source: $FAMILY_UPPER, replace: '^(.+)$', by: '// --- [$1]'}}
message: Divider `$DIVIDER` departs from the form of its level
note: Use `// --- [<SECTION>] ` dashed to column 90 at file level and `// --- [<FAMILY>]` inside an owner
fix: $SECTION_FORM$FAMILY_FORM
