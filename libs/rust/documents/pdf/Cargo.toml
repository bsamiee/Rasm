# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-pdf"
version.workspace    = true
edition.workspace    = true
description          = "PDF documents every Rasm app opens, authors, edits, reads and proofs on krilla, lopdf, pdf_oxide and hayro: drawing sets written from rasm-linework pages with layers, measure viewports, outlines, tags and PDF/A, UA and X standards, page fields, assembly, forms, redaction, revision overlays and PAdES signing, page walks for text, tables, images and paths, OCR, validation and tiled soft proofs"
repository.workspace = true
license.workspace    = true
keywords             = ["pdf", "drawing", "pdfa", "accessibility", "print"]
categories           = ["graphics", "rendering::data-formats"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
itertools            = { workspace = true }
derive-where         = { workspace = true }
derive_more          = { workspace = true }
nutype               = { workspace = true }
jiff                 = { workspace = true }
xot                  = { workspace = true }
secrecy              = { workspace = true }
reqwest              = { workspace = true }
uom                  = { workspace = true }
color                = { workspace = true }
moxcms               = { workspace = true }
fast_image_resize    = { workspace = true }
image                = { workspace = true }
image-compare        = { workspace = true }
tiff                 = { workspace = true }
fontdb               = { workspace = true }
kurbo                = { workspace = true }
linesweeper          = { workspace = true }
usvg                 = { workspace = true }
hayro                = { workspace = true }
hayro-svg            = { workspace = true }
hayro-syntax         = { workspace = true }
krilla               = { workspace = true }
krilla-svg           = { workspace = true }
lopdf                = { workspace = true }
pdf_oxide            = { workspace = true }
rasm-linework        = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
