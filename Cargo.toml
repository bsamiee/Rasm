ort = { version = "2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "tls-rustls-no-provider", "api-31", "coreml"] } # ONNX Runtime inference
safetensors = { version = "0.8.0", default-features = false, features = ["std"] } # Safetensors weights
tiktoken-rs = { version = "0.12.1", default-features = false } # tiktoken vocabularies
tokenizers = { version = "1.0.0-rc.2", default-features = false } # BPE, WordPiece, Unigram, and SentencePiece tokenizers
whisper-rs = { version = "0.16.0", default-features = false, features = ["metal"] } # Speech recognition
candle-core = { version = "0.11.0", default-features = false, features = ["metal"] } # Tensor computation on CPU and Metal
mistralrs = { version = "0.8.1", default-features = false, features = ["metal"] } # Local LLM inference with sampling and KV caching
# --- [BUILD]
cargo_metadata = { version = "0.23.1", default-features = false } # Cargo workspace and dependency graph reads
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] } # Rust token generation
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls", "proc-macro"] } # Rust syntax trees that code generation builds
prettyplease = { version = "0.3.0", default-features = false } # Generated Rust syntax formatted as checked-in source
# --- [LINTING]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "a7fb0ed8a7b593daa6fb8c3d5e161cd9e0d06fb8" } # Type, path, and diagnostic queries over compiler HIR for lint passes, its revision names the pinned nightly
dylint_linting = { version = "6.1.1" }                    # Late lint declarations and the registration entry the dylint driver loads
# --- [TESTING]
approx = { version = "0.6.0-rc2", default-features = false, features = ["array_impl", "tuple_impl", "vec_impl", "derive"] } # Tolerance comparisons in float assertions
assert_fs = { version = "1.1.4", default-features = false } # Temporary directory fixtures with path predicates
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] } # Statistical benchmarks with saved baselines
dylint_testing = { version = "6.1.1" }                    # Lint fixtures run through the dylint driver against their expected output
anyhow = { version = "1.0.104", default-features = false, features = ["std"] } # Opaque error type the `untyped_error` fixture returns for its lint to report
eyre = { version = "0.6.14", default-features = false }   # Opaque report type the `untyped_error` fixture returns for its lint to report
insta = { version = "1.49.0", default-features = false, features = ["json", "yaml", "redactions", "filters", "colors"] } # Snapshot assertions with redactions
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set", "fork", "timeout", "attr-macro"] } # Property tests with shrinking and persisted failures
proptest-derive = { version = "0.9.0", default-features = false } # Strategies derived from record types
rstest = { version = "0.27.0", default-features = false, features = ["async-timeout"] } # Fixtures, parameterized cases, and per-test timeouts
similar-asserts = { version = "2.0.0", default-features = false, features = ["unicode"] } # Diffed assertion failures over large values
testcontainers = { version = "0.28.0", default-features = false, features = ["aws-lc-rs"] } # Disposable service containers
tracing-test = { version = "0.2.6", default-features = false } # Captured spans and events asserted in tests
wiremock = { version = "0.6.5", default-features = false } # HTTP doubles on a loopback server
insta-cmd = { version = "0.7.0", default-features = false } # Binary runs snapshotted with exit code and output
proptest-state-machine = { version = "0.9.0", default-features = false, features = ["std"] } # Model-based tests over operation sequences
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["aws-lc-rs", "localstack", "minio", "kafka", "nats", "rabbitmq", "mosquitto", "hashicorp_vault", "postgres", "redis"] } # Prebuilt service definitions that integration tests start
# --- [MEMBERS]
mcp = { path = "libs/rust/mcp" }                          # MCP host, client, and telemetry every MCP service composes

# --- [LINTS] ----------------------------------------------------------------------------

[workspace.lints.rust]
ambiguous_negative_literals = "warn"                      # `-1.abs()` negating the method result in place of the literal
closure_returning_async_block = "warn"                    # Closures returning an `async` block, an async closure is the direct form
deprecated_in_future = "warn"                             # Items marked deprecated from a future release
deref_into_dyn_supertrait = "warn"                        # `Deref` impls from a `dyn` subtrait to its supertrait object, which trait upcasting shadows
impl_trait_redundant_captures = "warn"                    # `use<..>` listing every in-scope parameter, which edition 2024 `impl Trait` captures by default
let_underscore_drop = "warn"                              # `let _ =` dropping values with a destructor at once, acquisition and release pair in one resource scope
missing_debug_implementations = "warn"                    # Public types without `Debug`, boundary tracing records values with `?`
non_ascii_idents = "warn"                                 # Non-ASCII identifiers
redundant_imports = "warn"                                # Imports the prelude or an earlier `use` provides
redundant_lifetimes = "warn"                              # Lifetime parameters that bounds make equal to another named lifetime
rust_2018_idioms = { level = "warn", priority = -1 }      # Hidden lifetime parameters in paths, outlives bounds the compiler infers, and unused `extern crate` items
unnameable_types = "warn"                                 # Types and traits public signatures expose but consumers cannot name
unreachable_pub = "warn"                                  # `pub` items unreachable from crate root, `pub(crate)` states their reach
unsafe_code = "forbid"                                    # Unsafe code and unsafe attributes with no override, unsafe operations stay inside owning crates
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] } # `cfg` names rustc does not know, `dylint_lib` names the dylint library checking the crate
unused_import_braces = "warn"                             # `use a::{b}` braces around one import, code keeps the direct form
unused_macro_rules = "warn"                               # `macro_rules!` rules nothing invokes, removals delete every mention
unused_qualifications = "warn"                            # Qualified paths to names already in scope, code calls owning APIs in direct form

[workspace.lints.clippy]
# --- [GROUPS]
default = { level = "warn", priority = -1 }               # Default correctness, suspicious, style, complexity, and perf lints, code smells are fixed as found
cargo = { level = "warn", priority = -1 }                 # Missing package metadata, duplicate crate versions, negative or redundant feature names, and wildcard requirements
nursery = { level = "warn", priority = -1 }               # Lints under development, code smells are fixed as found
pedantic = { level = "warn", priority = -1 }              # Strict lints with occasional false positives, code smells are fixed as found
# --- [PARTIALITY]
as_conversions = "warn"                                   # Every `as` cast, TryFrom returns the reason a conversion fails
exit = "warn"                                             # `process::exit` outside `main`, the boundary translates results into exit codes
expect_used = "warn"                                      # `expect` on Option and Result, consumers compose without unwrapping
indexing_slicing = "warn"                                 # Index and slice expressions that can panic, absence stays an Option
infinite_loop = "warn"                                    # Endless loops in functions not returning `!`, signatures name return types directly
missing_assert_message = "warn"                           # Assertions outside tests without a message, each defect panic names its broken invariant
panic = "warn"                                            # `panic!` calls, expected failures use the result type
panic_in_result_fn = "warn"                               # `panic!` and assertions inside functions returning Result, expected failures use the result type
string_slice = "warn"                                     # Every string slice, `str::get` returns an Option in place of panicking off a char boundary
todo = "warn"                                             # `todo!` placeholders, work runs to completion
unimplemented = "warn"                                    # `unimplemented!` placeholders, work runs to completion
unreachable = "warn"                                      # `unreachable!` calls, invalid states stay unrepresentable at construction
unwrap_in_result = "warn"                                 # `unwrap` and `expect` inside functions returning Result, expected failures use the result type
unwrap_used = "warn"                                      # `unwrap` on Option and Result, consumers compose without unwrapping
# --- [OUTPUT]
dbg_macro = "warn"                                        # `dbg!` calls, telemetry goes through tracing at boundaries
print_stderr = "warn"                                     # `eprint!` and `eprintln!`, domain functions write only their return value
print_stdout = "warn"                                     # `print!` and `println!`, domain functions write only their return value
# --- [ATTRIBUTES]
allow_attributes = "warn"                                 # Outer `#[allow]` attributes, `#[expect]` warns once its lint stops firing
allow_attributes_without_reason = "warn"                  # `#[allow]` and `#[expect]` without `reason`, each suppression states why the code stands
cfg_not_test = "warn"                                     # `#[cfg(not(test))]` code, tests run what the product runs
redundant_test_prefix = "warn"                            # `test_` prefixes on `#[test]` functions, each fact is stated once
tests_outside_test_module = "warn"                        # `#[test]` functions outside a `#[cfg(test)]` module
# --- [RESULTS]
assertions_on_result_states = "warn"                      # `assert!(r.is_ok())` and `assert!(r.is_err())`, which print nothing a Result holds
let_underscore_must_use = "warn"                          # `let _ =` on must-use values, control flow matches every result case
map_err_ignore = "warn"                                   # `map_err(|_| ..)` closures dropping the source error, boundary mappings keep it
try_err = "warn"                                          # `Err(x)?` in place of `return Err(x)`, bodies construct every return case explicitly
unused_result_ok = "warn"                                 # `.ok()` calls discarding a Result, control flow matches every result case
# --- [EXPRESSIONS]
deref_by_slicing = "warn"                                 # `&v[..]` full-range slices, deref is the direct form
else_if_without_else = "warn"                             # `else if` chains with no final `else`, bodies construct every return case explicitly
if_then_some_else_none = "warn"                           # `if` choosing `Some` or `None`, `bool::then` states it as one expression
iter_over_hash_type = "warn"                              # `for` loops over `HashMap` or `HashSet`, result order stays deterministic
map_with_unused_argument_over_ranges = "warn"             # `(0..n).map(|_| x)`, `repeat_n` states the count directly
mixed_read_write_in_expression = "warn"                   # Reads and writes of one variable ordered by operand evaluation order
pathbuf_init_then_push = "warn"                           # `PathBuf` creation followed by `push`, paths build in one expression
redundant_type_annotations = "warn"                       # Annotations restating the initializer's type, inferred types stand
verbose_file_reads = "warn"                               # `read_to_end` and `read_to_string` on a `File`, `fs::read` and `fs::read_to_string` are the direct form
# --- [PATTERNS]
ref_patterns = "warn"                                     # `ref` bindings, matching on a borrowed scrutinee is the direct form
rest_pattern_accessible_field = "warn"                    # `..` over accessible fields, which leaves fields added later unhandled
unnecessary_rest_pattern = "warn"                         # `..` capturing no field, patterns state exactly the fields they bind
wildcard_enum_match_arm = "warn"                          # `_` arms in enum matches, every variant gets its own arm
# --- [NUMERICS]
float_cmp_const = "warn"                                  # `==` and `!=` against nonzero float constants, comparisons state their tolerance
host_endian_bytes = "warn"                                # `to_ne_bytes` and `from_ne_bytes`, encodings name their endianness
lossy_float_literal = "warn"                              # Whole-number float literals the type cannot hold exactly
precedence_bits = "warn"                                  # Shifts mixed with `&`, `|`, or `^` without parentheses
suspicious_xor_used_as_pow = "warn"                       # `2 ^ 8` read as a power, `pow` states exponentiation
# --- [STRINGS]
needless_raw_strings = "warn"                             # `r"..."` literals with nothing to escape, code keeps the direct form
str_to_string = "warn"                                    # `str::to_string` calls, `to_owned` names the conversion directly
string_add = "warn"                                       # `String + &str`, an asymmetric `Add` that `push_str` replaces
string_lit_chars_any = "warn"                             # `"abc".chars().any(..)` membership tests, `matches!` states the set directly
# --- [OWNERSHIP]
clone_on_ref_ptr = "warn"                                 # Method-call clones of `Rc`, `Arc`, or `Weak`, `Rc::clone` and `Arc::clone` show only the pointer copies
empty_drop = "warn"                                       # Empty `Drop` impls, removals delete every mention
mem_forget = "warn"                                       # `mem::forget` on values with a destructor, release runs on every path
rc_buffer = "warn"                                        # `Rc` or `Arc` over a growable buffer, shared values publish as immutable `str` or slices
# --- [DECLARATIONS]
empty_enum_variants_with_brackets = "warn"                # `Variant()` and `Variant {}` with no fields, `Variant` is the direct form
empty_structs_with_brackets = "warn"                      # `struct S {}` and `struct S();`, `struct S;` is the direct form
impl_trait_in_params = "warn"                             # `impl Trait` parameters, signatures name parameter types directly
inline_trait_bounds = "warn"                              # Bounds inside a function's `<..>`, every bound sits in the `where` clause
multiple_inherent_impl = "warn"                           # Inherent `impl` blocks split across a crate, a type's members stay in its section
same_name_method = "warn"                                 # Inherent methods sharing a trait method's name, each call site names one member
# --- [VISIBILITY]
field_scoped_visibility_modifiers = "warn"                # `pub(crate)` and `pub(super)` fields, construction stays with the type or its fields are plain data
partial_pub_fields = "warn"                               # Structs mixing public and private fields, a type is plain data or guards its invariant whole
pub_without_shorthand = "warn"                            # `pub(in super)` visibility paths, `pub(super)` is the direct form
# --- [MODULES]
absolute_paths = "warn"                                   # Crate-rooted paths past two segments, preamble imports name each item
inline_modules = "warn"                                   # Inline `mod` blocks outside tests, each module takes its own file
mod_module_files = "warn"                                 # `mod.rs` files, each module file takes its module's name
pub_use = "warn"                                          # Every `pub use` re-export, items sit in the public module that owns them
unnecessary_self_imports = "warn"                         # `use m::{self}` imports, code keeps the direct form
unused_trait_names = "warn"                               # `use Trait` imported for its methods alone, `as _` states the import serves method resolution
# --- [NAMING]
error_impl_error = "warn"                                 # Error types named `Error`, each names the package that raises it
min_ident_chars = "warn"                                  # Single-character identifiers outside the default `i`, `j`, `n`, `w`, `x`, `y`, and `z`
renamed_function_params = "warn"                          # Trait impls renaming trait parameters, the trait owns each parameter name
shadow_unrelated = "warn"                                 # Rebinding a name to an unrelated value, one name holds one concept
single_char_lifetime_names = "warn"                       # Single-character lifetime names, each lifetime names its purpose
# --- [ALLOWED]
literal_string_with_formatting_args = "allow"             # Reads `{name}` in MCP URI templates and axum routes as a missing `format!` beside a same-named binding
missing_errors_doc = "allow"                              # Code carries no comment beyond section dividers, names and types state each contract
missing_panics_doc = "allow"                              # Code carries no comment beyond section dividers, names and types state each contract
option_if_let_else = "allow"                              # Rewrites `match` and `if let` over Option into `map_or` or `map_or_else`, control flow selects by pattern matching result cases
redundant_pub_crate = "allow"                             # Demands `pub` on items in private modules where rustc `unreachable_pub` demands `pub(crate)`
significant_drop_tightening = "allow"                     # Demands `drop` of lock guards before scope end, acquisition and release pair in one resource scope
suboptimal_flops = "allow"                                # Fuses one product of a cross product or determinant into `mul_add`, breaking the zero cross product of parallel vectors
too_many_lines = "allow"                                  # Caps functions at 100 lines, data dependency decides composition in place of a line count

[workspace.lints.cargo]
pedantic = { level = "warn", priority = -1 }              # A `readme` key restating the inferred file and binary names off kebab case, each fact is stated once
unused_workspace_dependencies = "allow"                   # Flags catalog rows no member inherits, the catalog holds rows for future members and Cargo resolves inherited rows alone

# --- [PROFILES] -------------------------------------------------------------------------

[profile.dev]
debug = "line-tables-only"                                # Line tables alone, backtraces show file and line with no variable or parameter info

[profile.dev.package."*"]
debug = false                                             # Dependencies outside the workspace build with no debug info, their backtrace frames lack file and line

[profile.dist]
inherits = "release"                                      # Installed binaries build under `dist`, `release` stays the profile `cargo dylint` builds lint libraries under
lto = "fat"                                               # Optimization across every crate in the dependency graph for installed binaries, at longer link time
codegen-units = 1                                         # One code generation unit per crate, trading parallel codegen for code that can run faster
panic = "abort"                                           # Panics as defects abort the process for its service manager to restart in place of tokio catching each task panic
overflow-checks = true                                    # Integer overflow panics as a defect in release builds in place of wrapping to a wrong value
trim-paths = "object"                                     # Panic locations and tracing file fields name /cargo/registry and /rustc in place of the builder's home directory, 418 home paths to 0 in the installed binary
