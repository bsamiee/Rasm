# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pythonlang
severity: error
utils:
    pass-arm:
        kind: case_clause
        has:
            field: consequence
            matches: python-single-statement-block
            has: {any: [{kind: pass_statement}, {kind: expression_statement, has: {kind: ellipsis}, not: {has: {nthChild: 2}}}]}
    flat-arm:
        kind: case_clause
        not:
            any:
                - has: {kind: case_pattern, nthChild: {position: 2, ofRule: {kind: case_pattern}}}
                - has: {kind: case_pattern, has: {stopBy: end, any: [{kind: list_pattern}, {kind: tuple_pattern}, {kind: dict_pattern}, {kind: class_pattern, has: {kind: case_pattern}}]}}
    pass-match:
        kind: match_statement
        all:
            - has:
                field: body
                all:
                    - has: {matches: pass-arm}
                    - has: {kind: case_clause, nthChild: {position: 2, ofRule: {kind: case_clause}}}
                    - not: {has: {kind: case_clause, nthChild: {position: 3, ofRule: {kind: case_clause}}}}
                    - not: {has: {kind: case_clause, not: {matches: flat-arm}}}
rule:
    matches: pass-match
message: 'Two-arm `match` holds an arm that only passes'
note: 'Replace singleton identity cases with `if`, preserving matching and binding semantics for other patterns'
