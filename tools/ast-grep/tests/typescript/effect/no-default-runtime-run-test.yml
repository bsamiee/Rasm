id: no-default-runtime-run
valid:
    # The effect returned to the caller
    - 'const load = (path: string): Effect.Effect<Config, LoadError> => decode(path);'
    # The entry point
    - 'NodeRuntime.runMain(program.pipe(Effect.provide(NodeContext.layer)));'
    # A ManagedRuntime built at the root runs inside a host callback
    - 'const nodes = createNodesFromFiles((file) => runtime.runPromise(node(file)), files, options, context);'
    # A Runtime run with an explicit runtime
    - 'const started = Runtime.runPromise(fiberRuntime)(job);'
    # Run member on a value outside the module set
    - 'const value = runtime.runSync(work);'
    # Effect member outside the run set
    - 'const value = Effect.runtime();'
invalid:
    # The instance, a synchronous run on the default runtime
    - 'const value = Effect.runSync(work);'
    # Exit-answering synchronous run
    - 'const exit = Effect.runSyncExit(work);'
    # Promise run
    - 'const value = Effect.runPromise(work);'
    # Exit-answering promise run
    - 'const exit = Effect.runPromiseExit(work);'
    # Forked run
    - 'const fiber = Effect.runFork(work);'
    # Callback run
    - 'Effect.runCallback(work, { onExit: report });'
    # Micro sibling
    - 'const value = Micro.runSync(work);'
    # Micro promise run
    - 'const value = Micro.runPromise(work);'
    # Run inside a function body
    - 'const load = (path: string): Config => Effect.runSync(decode(path));'
