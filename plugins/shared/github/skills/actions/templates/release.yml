name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version the release tags, as semver with no leading v
                type: string
                required: true
            dry-run:
                description: Prints each release and publish command in place of running it, attesting nothing
                type: boolean
                default: true

run-name: ${{ format('Release {0}{1}', inputs.version, case(inputs.dry-run, ' (dry run)', '')) }}

concurrency:
    group: ${{ github.workflow }}
    queue: max

cache-mode: none

permissions: {}

env:
    VERSION: ${{ inputs.version }}
    DRY: ${{ case(inputs.dry-run, 'echo', '') }}

defaults:
    run:
        shell: bash

jobs:
    build:
        name: Build
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - run: '[[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]'
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: <build> "${VERSION}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release
                  path: <release files>
                  if-no-files-found: error
                  overwrite: true

    release:
        name: Release
        needs: build
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        environment:
            name: release
            deployment: false
        permissions:
            contents: write # creates the tag and the release
            id-token: write # signs attestations through Sigstore
            attestations: write # stores attestations
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release
                  path: release
            - if: ${{ !inputs.dry-run }}
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: release/*
            - run: |-
                  ${DRY} gh release create "v${VERSION}" release/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --generate-notes --draft
                  ${DRY} gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

    publish:
        name: Publish
        needs: release
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        environment:
            name: release
            deployment: false
        permissions:
            contents: read
            id-token: write # exchanges for registry credentials
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release
                  path: release
            - run: ${DRY} <publish> release/*
