# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-assigned-name
language: python
arguments: [value]
rule:
    kind: identifier
    pattern: $NAME
    inside:
        kind: module, function_definition
        stopBy: end
        has:
            stopBy: {kind: "function_definition, class_definition, lambda"}
            kind: assignment
            all:
                - has: {field: left, kind: identifier, pattern: $NAME}
                - has: {field: right, matches: value}
