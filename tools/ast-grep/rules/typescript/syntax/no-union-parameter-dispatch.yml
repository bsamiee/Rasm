# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-union-parameter-dispatch
language: tsx
severity: error
utils:
    declared-union:
        any:
            - kind: union_type
              has:
                any:
                    - kind: predefined_type
                      regex: '^(string|number|boolean|symbol)$'
                    - kind: type_identifier
                      regex: '^bigint$'
                    - kind: literal_type
                      has: {kind: 'string, number, true, false'}
                    - kind: array_type
                    - kind: readonly_type
                      has: {kind: array_type}
                    - kind: generic_type
                      has: {field: name, regex: '^(Readonly)?Array$'}
                    - matches: declared-union
            - kind: parenthesized_type
              has: {matches: declared-union}
    nullable-union:
        kind: union_type
        any:
            - regex: '^[^|]+\|\s*(undefined|null)$'
            - regex: '^(undefined|null)\s*\|[^|]+$'
    shape-test:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^[!=]==?$'}
                - has: {kind: unary_expression, all: [{has: {field: operator, regex: '^typeof$'}}, {has: {field: argument, kind: identifier, pattern: $PARAMETER}}]}
                - has: {kind: string}
            - kind: switch_statement
              has: {field: value, has: {kind: unary_expression, all: [{has: {field: operator, regex: '^typeof$'}}, {has: {field: argument, kind: identifier, pattern: $PARAMETER}}]}}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^isArray$'}}
                - has: {field: arguments, all: [{has: {nthChild: 1, kind: identifier, pattern: $PARAMETER}}, {not: {has: {nthChild: 2}}}]}
                - has:
                    field: function
                    any:
                        - all: [{regex: '^((globalThis|window|self)\.)?Array\.isArray$'}, {matches: typescript-global-reference}]
                        - matches: {effect-module-member: {module: {regex: '\bArray$'}, member: {regex: '^isArray$'}}}
            - kind: call_expression
              all:
                - has: {field: function, kind: member_expression, has: {field: property, regex: '^is(String|Number|Boolean|BigInt|Symbol)$'}}
                - has: {field: arguments, all: [{has: {nthChild: 1, kind: identifier, pattern: $PARAMETER}}, {not: {has: {nthChild: 2}}}]}
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bPredicate$'}, member: {regex: '^is(String|Number|Boolean|BigInt|Symbol)$'}}}}
    parameter-owner:
        matches: typescript-function-boundary
        has: {field: parameters, has: {kind: 'required_parameter, optional_parameter', has: {field: pattern, pattern: $PARAMETER}}}
rule:
    any:
        - kind: function_signature
          pattern: $SIGNATURE
          not: {inside: {kind: ambient_declaration, stopBy: end}}
        - kind: method_signature
          pattern: $SIGNATURE
          inside: {kind: class_body}
        - matches: shape-test
          inside:
            matches: parameter-owner
            stopBy: {matches: parameter-owner}
            all:
                - has:
                    field: parameters
                    has:
                        kind: required_parameter, optional_parameter
                        all:
                            - has: {field: pattern, pattern: $PARAMETER}
                            - has: {field: type, has: {matches: declared-union}, not: {has: {matches: nullable-union}}}
                - not: {has: {field: return_type, kind: 'type_predicate_annotation, asserts_annotation'}}
transform:
    OVERLOAD: {replace: {source: $SIGNATURE, replace: '(?s)^(?:function\s+)?([^(<]+).*$', by: '$1'}}
message: '`$PARAMETER$OVERLOAD` selects behavior by argument shape at runtime'
note: 'Decode the argument to one shape (`Schema.ArrayEnsure`), or declare one function per shape'
