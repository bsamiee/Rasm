id: require-exact-package-version-row
valid:
    - |
      <PackageVersion Include="CsCheck" Version="4.8.0" />
    - |
      <PackageVersion Include="LanguageExt.Core" Version="5.0.0-beta-77" />
    - |
      <PackageVersion Include="TextureCompressor" Version="[0.1.0]" />
    - |
      <GlobalPackageReference Include="Meziantou.Analyzer" Version="3.0.190" />
    - |
      <PropertyGroup><ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally></PropertyGroup>
    - |
      <PackageVersion Include='CsCheck' Version='4.8.0' />
    - |
      <PackageVersion Include="Item"><Version>4.8.0</Version></PackageVersion>
invalid:
    - |
      <PackageVersion Include='CsCheck' Version='4.*' />
    - |
      <PackageVersion Include="CsCheck" Version="4.*" />
    - |
      <PackageVersion Include="CsCheck" Version="[4.0,5.0)" />
    - |
      <PackageVersion Include="CsCheck" />
    - |
      <PackageVersion Update="CsCheck" Version="4.8.0" />
    - |
      <PackageVersion Include="CsCheck" Version="" />
    - |
      <GlobalPackageReference Include="Meziantou.Analyzer" Version="3.*" />
    - |
      <PackageVersion Include="" Version="4.8.0" />
    - |
      <PackageVersion Include="Item" Version="4.8.0-*" />
    - |
      <PackageVersion Include="Item" Version="[4.8.0, )" />
    - |
      <PackageVersion Include="Item"><Version>4.*</Version></PackageVersion>
    - |
      <GlobalPackageReference Update="Item" Version="4.8.0" />
