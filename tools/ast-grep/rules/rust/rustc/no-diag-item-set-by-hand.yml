# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-diag-item-set-by-hand
language: rust
severity: error
files: [tools/dylint/**]
rule:
    all:
        - any:
            - kind: call_expression
              any:
                - pattern: '[$$$NAMES].into_iter().any(|$N| $X.is_diag_item($CX, $N))'
                - pattern: '[$$$NAMES].iter().any(|&$N| $X.is_diag_item($CX, $N))'
                - pattern: '[$$$NAMES].into_iter().any(|$N| $X.is_lang_item($CX, $N))'
                - pattern: '[$$$NAMES].iter().any(|&$N| $X.is_lang_item($CX, $N))'
                - pattern: '[$$$NAMES].into_iter().any(|$N| $CX.is_diagnostic_item($N, $X))'
                - pattern: '[$$$NAMES].iter().any(|&$N| $CX.is_diagnostic_item($N, $X))'
            - kind: binary_expression
              any:
                - pattern: $X.is_diag_item($CX, $A) || $X.is_diag_item($CX, $B)
                - pattern: $X.is_lang_item($CX, $A) || $X.is_lang_item($CX, $B)
                - pattern: $CX.is_diagnostic_item($A, $X) || $CX.is_diagnostic_item($B, $X)
                - pattern: $CX.is_lang_item($X, $A) || $CX.is_lang_item($X, $B)
        - not: {inside: {stopBy: end, matches: rust-trait-of-assoc-test}}
message: '`$X` repeats one item lookup per name of a set'
note: 'Match one lookup against the set, `matches!(<value>.opt_diag_name(cx), Some(sym::A | sym::B))` or `tcx.as_lang_item` for lang items'
