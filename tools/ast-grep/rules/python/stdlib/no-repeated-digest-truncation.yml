# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-repeated-digest-truncation
language: python
severity: error
utils:
    hasher:
        kind: call
        any:
            - all:
                - has: {field: function, matches: {python-member-use: {module: {regex: '^hashlib$'}, name: {regex: '^new$'}}}}
                - has: {field: arguments, has: {nthChild: 1, pattern: $ALG}}
            - all:
                - has: {field: function, matches: {python-member-use: {module: {regex: '^hashlib$'}, name: {regex: '^file_digest$'}}}}
                - has: {field: arguments, has: {nthChild: 2, pattern: $ALG}}
            - has: {field: function, matches: {python-member-use: {module: {regex: '^hashlib$'}, name: {pattern: $ALG, not: {regex: '^(new|file_digest)$'}}}}}
    truncated:
        kind: subscript
        all:
            - has: {field: subscript, kind: slice}
            - pattern: $_H.$DIGEST()[$SLICE]
            - has:
                field: value
                has:
                    field: function
                    has:
                        field: object
                        any:
                            - matches: hasher
                            - kind: identifier
                              pattern: $HASHER
                              inside:
                                kind: function_definition, module
                                stopBy: end
                                has: {stopBy: {kind: 'function_definition, class_definition, lambda'}, kind: assignment, all: [{has: {field: left, pattern: $HASHER}}, {has: {field: right, matches: hasher}}]}
    earlier:
        inside:
            stopBy: end
            follows:
                stopBy: end
                any:
                    - {matches: truncated}
                    - has: {stopBy: end, matches: truncated}
rule:
    kind: subscript
    pattern: $TRUNCATION
    all:
        - matches: truncated
        - matches: earlier
constraints:
    DIGEST: {regex: '^(hex)?digest$'}
message: '`$TRUNCATION` truncates a `$ALG` digest to `[$SLICE]` a second time in the file'
note: 'Declare one function from bytes to the `<algorithm>` digest truncated to `<length>` and call it at every site'
