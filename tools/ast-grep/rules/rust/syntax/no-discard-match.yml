# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-discard-match
language: rust
severity: error
utils:
    binding:
        any:
            - kind: identifier
              regex: '^[a-z_]'
              not: {any: [{inside: {kind: 'tuple_struct_pattern, struct_pattern', field: type}}, {inside: {kind: scoped_identifier}}]}
            - kind: 'shorthand_field_identifier, ref_pattern, mut_pattern, captured_pattern'
    plain-value:
        any:
            - kind: block
              not: {has: {pattern: $_}}
            - kind: 'unit_expression, identifier, self, boolean_literal, integer_literal, float_literal, string_literal, char_literal'
rule:
    kind: match_expression
    all:
        - has: {field: value, pattern: $VALUE}
        - has:
            field: body
            all:
                - has:
                    kind: match_arm
                    all:
                        - has: {field: pattern, kind: match_pattern, all: [{has: {nthChild: 1, kind: or_pattern, pattern: $PATTERN}}, {not: {has: {field: condition, pattern: $_}}}, {not: {has: {stopBy: end, matches: binding}}}]}
                        - has: {field: value, matches: plain-value}
                - not: {has: {kind: match_arm, nthChild: {position: 2, ofRule: {kind: match_arm}}}}
message: '`match $VALUE` discards the value through one arm `$PATTERN`'
note: 'Write `let (<pattern>) = <value>;` followed by the arm value'
