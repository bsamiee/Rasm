id: no-kind-only-any
valid:
    - |
      rule:
          kind: alpha, beta
    - |
      rule:
          any:
              - kind: alpha
              - {kind: beta, has: {kind: item}}
    - |
      rule:
          any:
              - kind: alpha
              - kind: beta
                has: {kind: item}
    - |
      rule:
          any:
              - kind: alpha
              - matches: item-shape
    - |
      rule:
          all:
              - kind: alpha
              - kind: beta
    - |
      rule:
          kind: outer
          any: [{kind: alpha}, {kind: beta}]
    - |
      rule:
          any:
              - kind: alpha
              - pattern: $X
    - |
      rule: {any: [{kind: alpha}, {kind: beta, pattern: $X}]}
invalid:
    - |
      rule:
          any:
              - kind: alpha
              - kind: beta
    - |
      rule:
          any:
              - {kind: alpha}
              - {kind: beta}
    - |
      rule:
          has:
              any: [{kind: alpha}, {kind: beta}]
    - |
      rule:
          inside: {any: [{kind: alpha}, {kind: beta}], stopBy: end}
    - |
      rule:
          any:
              - kind: alpha
              - kind: 'beta, gamma'
    - |
      rule:
          nthChild: {position: 2, ofRule: {any: [{kind: alpha}, {kind: beta}]}}
    - |
      rule:
          has: {kind: item, stopBy: {any: [{kind: alpha}, {kind: beta}]}}
    - |
      rule:
          has:
              field: value
              any:
                  - kind: alpha
                  - kind: beta
    - |
      rule:
          any:
              - kind: alpha
              - kind: "beta, gamma"
    - |
      rule:
          "any":
              - kind: alpha
              - "kind": beta
    - |
      rule:
          not:
              any:
                  - kind: alpha
                  - kind: beta
