# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-shadowed-nameref-target
language: bash
severity: error
utils:
    nameref-option:
        kind: word
        regex: '^-[a-zA-Z]*n'
    positional-nameref:
        kind: declaration_command
        all:
            - has: {matches: nameref-option}
            - has: {kind: variable_assignment, has: {field: value, regex: '^"?\$\{?[1-9]\}?"?$'}}
    call:
        kind: command
        all:
            - has: {field: name, pattern: $FUNCTION}
            - has: {kind: word, pattern: $LOCAL}
rule:
    kind: variable_name
    pattern: $LOCAL
    inside:
        kind: declaration_command
        stopBy: {not: {kind: variable_assignment}}
        regex: '^(local|declare|typeset)\b'
        not: {has: {matches: nameref-option}}
        inside:
            kind: function_definition
            stopBy: end
            all:
                - has: {field: name, pattern: $FUNCTION}
                - has: {field: body, has: {stopBy: end, matches: positional-nameref}}
                - inside: {kind: program, stopBy: end, has: {stopBy: end, matches: call}}
message: 'Local `$LOCAL` of `$FUNCTION` shadows the caller variable `$LOCAL` its nameref targets'
note: 'Prefix each local of a function holding a nameref with the function name (`local -n _<function>_out=$1` beside `local _<function>_<name>`)'
