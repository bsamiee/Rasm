# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-char-boundary-loop
language: rust
severity: error
rule:
    kind: expression_statement
    all:
        - has:
            nthChild: 1
            kind: while_expression
            all:
                - has: {field: condition, pattern: '!$S.is_char_boundary($I)'}
                - has:
                    field: body
                    matches:
                        rust-single-statement:
                            first:
                                kind: expression_statement
                                has:
                                    nthChild: 1
                                    any:
                                        - kind: compound_assignment_expr
                                          all:
                                            - has: {field: left, kind: identifier, pattern: $I}
                                            - has: {field: operator, pattern: $$STEP}
                                            - has: {field: right, kind: integer_literal, regex: '^1(usize)?$'}
                                        - kind: assignment_expression
                                          all:
                                            - has: {field: left, kind: identifier, pattern: $I}
                                            - has:
                                                field: right
                                                kind: binary_expression
                                                all:
                                                    - has: {field: left, kind: identifier, pattern: $I}
                                                    - has: {field: operator, pattern: $$STEP}
                                                    - has: {field: right, kind: integer_literal, regex: '^1(usize)?$'}
transform:
    FLOOR: {replace: {source: $STEP, replace: '^-=?$', by: 'floor_char_boundary'}}
    ROUND: {replace: {source: $FLOOR, replace: '^\+=?$', by: 'ceil_char_boundary'}}
fix: '$I = $S.$ROUND($I);'
message: '`$I` steps one byte at a time to a char boundary of `$S`'
note: 'Assign `<index> = <text>.floor_char_boundary(<index>)` for a decrementing loop and `<text>.ceil_char_boundary(<index>)` for an incrementing one'
