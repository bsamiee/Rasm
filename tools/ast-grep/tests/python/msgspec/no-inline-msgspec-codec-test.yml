id: no-inline-msgspec-codec
valid:
    - |
      import msgspec.json as codec
      from msgspec.json import Encoder as codec
      codec.Encoder().encode(value)
    # A later import owns the alias, so its codec contract is unknown.
    - |
      import msgspec.json as codec
      from custom import codec
      codec.Encoder().encode(value)
    - |
      import msgspec.msgpack as codec
      import custom as codec
      codec.Decoder().decode(value)
    - |
      def unrelated():
          from msgspec import json
      def build():
          return json.Encoder().encode(value)
    - |
      from msgspec import json
      for json in factories:
          json.Encoder().encode(value)
    - |
      from msgspec import json
      for json, other in factories:
          json.Encoder().encode(value)
    - |
      from msgspec import json
      json, other = factories
      json.Encoder().encode(value)
    - |
      from msgspec import json
      [json.Encoder().encode(value) for json in factories]
    - |
      from msgspec import json
      with factory() as json:
          json.Encoder().encode(value)
    - |
      from msgspec import json
      try: work()
      except Error as json:
          json.Encoder().encode(value)
    - |
      from msgspec import json
      if json := factory():
          json.Encoder().encode(value)
    - |
      from msgspec import json
      def json(**kwargs): return kwargs
      json.Encoder().encode(value)
    - |
      from msgspec import json
      class json: pass
      json.Encoder().encode(value)
