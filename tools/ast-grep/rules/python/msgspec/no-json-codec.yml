# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-codec
language: python
severity: error
rule:
    any:
        - matches: {python-module-member: {module: {regex: '^json$'}, name: {regex: '^(dumps?|loads?|JSONEncoder|JSONDecoder)$', pattern: $NAME}}}
        - matches: {python-module-member: {module: {regex: '^json\.encoder$'}, name: {regex: '^JSONEncoder$', pattern: $NAME}}}
        - matches: {python-module-member: {module: {regex: '^json\.decoder$'}, name: {regex: '^JSONDecoder$', pattern: $NAME}}}
message: '`$NAME` uses the standard library JSON codec, the form of `msgspec.json.encode` and `msgspec.json.decode(<text>, type=<Type>)`'
note: '`json.JSONDecodeError` stays where an external API raises it'
