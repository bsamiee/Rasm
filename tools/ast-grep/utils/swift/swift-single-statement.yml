# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-single-statement
language: swiftlang
arguments: [first]
rule:
    kind: statements
    all:
        - not:
            has:
                all:
                    - &statement {pattern: $_, not: {kind: 'comment, multiline_comment'}}
                    - follows: {stopBy: end, all: [*statement]}
        - has: {all: [*statement, {matches: first}]}
