id: no-prose-matcher
valid:
    # The correction, a matcher on the tool
    - "on('tool.call', { tool: 'Bash' }, async ($, e, next) => next(e));"
    # Matcher on the component and the subagent type
    - "on('ui.render', { component: 'AbovePrompt' }, async ($, e, next) => next(e));"
    - "on('agent.spawn', { subagentType: /^fork$/ }, async ($, e, next) => next(e));"
    # RegExp on a key outside the prose set
    - "on('tool.call', { tool: /^mcp__hostinger__/ }, async ($, e, next) => next(e));"
    # Exact string on a prose key fires on the whole text alone
    - "on('prompt.submit', { text: 'run the checks' }, async ($, e, next) => next(e));"
    # One-of list of strings on a prose key
    - "on('prompt.submit', { text: ['a', 'b'] }, async ($, e, next) => next(e));"
    # RegExp on a prose key in an object outside a matcher
    - "const rows = { text: /secret/ };"
    # Name bound to an exact string on a prose key, the whole text alone fires
    - |
      const EXACT = 'run the checks';
      on('prompt.submit', { text: EXACT }, async ($, e, next) => next(e));
    # RegExp on a prose key in the matcher of another function
    - "register('prompt.submit', { text: /secret/ }, async ($, e, next) => next(e));"
    # String test on the command beside a deny, a command is no prose
    - |
      on('tool.call', async ($, e, next) => {
          if (e.command.includes('mise x')) {
              return { deny: 'mise x is refused, run the command directly' };
          }
          return next(e);
      });
    # String test on the prose in a hook that rewrites and denies nothing
    - |
      on('prompt.submit', async ($, e, next) => {
          const found = e.text.includes(secret);
          return next({ ...e, text: redact(e.text), context: [String(found)] });
      });
    # Test on a local copy of the prose, the object is the copy
    - |
      on('prompt.submit', async ($, e, next) => {
          const copy = { ...e };
          if (copy.text.includes('x')) {
              return { drop: 'dropped' };
          }
          return next(e);
      });
    # Comparison operator outside the equality set
    - |
      on('turn.complete', async ($, e, next) => {
          if (e.answer > 'm') {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Method outside the search set
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.trim()) {
              return { drop: 'empty' };
          }
          return next(e);
      });
    # Membership of the whole text in a list beside a deny, a method outside the RegExp test
    - |
      on('prompt.submit', async ($, e, next) => {
          if (BANNED.includes(e.text)) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Shorthand property that is no refusal beside a prose test
    - |
      on('prompt.submit', async ($, e, next) => {
          const text = redact(e.text);
          const found = e.text.includes(secret);
          return next({ ...e, text, context: [String(found)] });
      });
    # Test on a field of the first parameter, the event is the second
    - |
      on('prompt.submit', async ($, e, next) => {
          if ($.text.includes('x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Test on the prose in a hook registered through another function
    - |
      register('prompt.submit', async ($, e, next) => {
          if (e.text.includes('x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Test of the prose outside any hook
    - |
      const check = (e) => (e.text.includes('x') ? { deny: 'refused' } : e);
    # RegExp on a prose key in the matcher of a parameter typed other than On
    - |
      const arm = (register: Other): void => {
          register('prompt.submit', { text: /mise x/ }, async ($, e, next) => next(e));
      };
    # RegExp on a prose key in an object inside a matched hook body, no matcher
    - |
      on('tool.call', { tool: 'Bash' }, async ($, e, next) => {
          const rows = { text: /secret/ };
          return next(e);
      });
    # Empty check on the trimmed prose beside a drop, no prose is matched
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.trim() === '') {
              return { drop: 'The prompt was empty' };
          }
          return next(e);
      });
    # Length read on the prose beside a drop
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.length === 0) {
              return { drop: 'The prompt was empty' };
          }
          return next(e);
      });
    # Search on an index read of a field outside the prose set beside a deny
    - |
      on('tool.call', async ($, e, next) => {
          if (e['tool'].includes('mcp__')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # RegExp on a nested key outside the prose set
    - "on('tool.call', { tool: 'Edit', input: { file_path: /\\.cs$/ } }, async ($, e, next) => next(e));"
    # Equality against an empty template checks presence and matches no prose
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text === ``) {
              return { drop: 'The prompt was empty' };
          }
          return next(e);
      });
invalid:
    # RegExp on each prose key in a matcher
    - "on('prompt.submit', { text: /mise x/ }, async ($, e, next) => next(e));"
    - "on('tool.describe', { description: /secret/ }, async ($, e, next) => next(e));"
    - "on('turn.complete', { answer: /regression/ }, async ($, e, next) => next(e));"
    - "on('agent.spawn', { prompt: /stash/ }, async ($, e, next) => next(e));"
    - "on('tool.call', { content: /op:\\/\\// }, async ($, e, next) => next(e));"
    # RegExp constructor on a prose key
    - "on('prompt.submit', { text: new RegExp('mise x') }, async ($, e, next) => next(e));"
    # RegExp inside a one-of list
    - "on('prompt.submit', { text: ['exact', /mise/] }, async ($, e, next) => next(e));"
    # RegExp on a nested prose key
    - "on('tool.call', { tool: 'Write', input: { content: /op:\\/\\// } }, async ($, e, next) => next(e));"
    # Name bound to a RegExp in the file, the matcher reads the bound value
    - |
      const STASH = /stash/;
      on('prompt.submit', { text: STASH }, async ($, e, next) => next(e));
    # Each search method on the prose inside a hook holding a deny
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.includes('mise x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.startsWith('mise')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.endsWith('stash')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.match(/stash/)) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          const hits = [...e.text.matchAll(/stash/g)];
          return hits.length > 0 ? { deny: 'refused' } : next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.search(/stash/) >= 0) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.indexOf('mise x') >= 0) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.lastIndexOf('stash') !== -1) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # RegExp literal and a bound RegExp tested over the prose
    - |
      on('turn.complete', async ($, e, next) => {
          if (/regression/.test(e.answer)) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # RegExp executed over the prose
    - |
      on('turn.complete', async ($, e, next) => {
          if (/regression/.exec(e.answer) !== null) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    - |
      on('agent.spawn', async ($, e, next) => {
          if (STASH.test(e.prompt)) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Equality on the prose
    - |
      on('tool.describe', async ($, e, next) => {
          if (e.description === 'secret') {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Inequality with the prose on the right
    - |
      on('tool.describe', async ($, e, next) => {
          if ('secret' !== e.description) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Test on the prose in a hook holding a drop
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.includes('mise x')) {
              return { drop: 'dropped' };
          }
          return next(e);
      });
    # Test on the prose in a hook holding the deny shorthand
    - |
      on('prompt.submit', async ($, e, next) => {
          const deny = 'refused';
          return e.text.includes('x') ? { deny } : next(e);
      });
    # Test on the prose in a hook calling the deny constructor
    - |
      on('prompt.submit', ($, e, next) => (e.text.includes('x') ? deny('refused') : next(e)));
    # Test on the prose under the matched form with the parameter under another name
    - |
      on('tool.call', { tool: 'Write' }, async ($, input, next) => {
          if (input.content.includes('op://')) {
              return { deny: 'refused' };
          }
          return next(input);
      });
    # Test on the prose in a function-expression hook
    - |
      on('prompt.submit', function ($, e, next) {
          if (e.text.includes('x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Search method after a string method on the prose, the case-folded test
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.toLowerCase().includes('mise x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # RegExp on the edited text of an Edit matcher
    - "on('tool.call', { tool: 'Edit', input: { new_string: /op:\\/\\// } }, async ($, e, next) => next(e));"
    # Search on the sent message inside a hook holding a deny
    - |
      on('tool.call', { tool: 'SendMessage' }, async ($, e, next) => {
          if (e.message.includes('stash')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # RegExp on a prose key in the matcher of a registration through a parameter typed On
    - |
      const arm = (register: On): void => {
          register('prompt.submit', { text: /mise x/ }, async ($, e, next) => next(e));
      };
    # Search on a prose field nested under input, the tool.call event holds the edited text there
    - |
      on('tool.call', { tool: 'Write' }, async ($, e, next) => {
          if (e.input.content.includes('op://')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Matcher bound to a name before the registration
    - |
      const MATCH = { text: /mise x/ };
      on('prompt.submit', MATCH, async ($, e, next) => next(e));
    # Search on an index read of the prose
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e['text'].includes('mise x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Search on the words of the prose
    - |
      on('prompt.submit', async ($, e, next) => {
          if (e.text.split(' ').includes('stash')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Search on an index read of a prose field under input
    - |
      on('tool.call', { tool: 'Write' }, async ($, e, next) => {
          if (e.input['content'].includes('op://')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Hook bound to a name before the registration, the test on the prose beside a deny
    - |
      const hook = async ($, e, next) => {
          if (e.text.includes('mise x')) {
              return { deny: 'refused' };
          }
          return next(e);
      };
      on('prompt.submit', hook);
    # RegExp constructor called without new on a prose key
    - "on('prompt.submit', { text: RegExp('mise x') }, async ($, e, next) => next(e));"
    # Search on the prose under a local that destructures the event
    - |
      on('prompt.submit', async ($, e, next) => {
          const { text } = e;
          if (text.includes('mise x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Search on the refusal explanation of the turn
    - |
      on('turn.complete', async ($, e, next) => {
          if (e.refusal.explanation.includes('policy')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
    # Matcher spread from a base beside a prose RegExp
    - "on('prompt.submit', { ...BASE, text: /mise x/ }, async ($, e, next) => next(e));"
    # Search on the prose held in a local under another name
    - |
      on('prompt.submit', async ($, e, next) => {
          const prose = e.text;
          if (prose.includes('mise x')) {
              return { deny: 'refused' };
          }
          return next(e);
      });
