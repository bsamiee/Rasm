# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-undivided-declaration-java
language: java
severity: error
rule:
    kind: class_declaration, interface_declaration, enum_declaration, record_declaration, annotation_type_declaration
    has: {field: name, pattern: $NAME}
    inside: {kind: program}
    not: {follows: {stopBy: end, matches: java-section-divider}}
message: Declaration `$NAME` sits above every section divider
note: Open the section of its kind with `// --- [<SECTION>] ` dashed to column 90 above it
