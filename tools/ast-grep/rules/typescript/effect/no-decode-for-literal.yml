# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-decode-for-literal
language: tsx
severity: error
utils:
    literal-tree:
        any:
            - kind: 'object, array, string, number, true, false, null, undefined, template_string, unary_expression, regex'
            - matches: syntax-expression-wrapper
        not:
            has:
                stopBy: end
                kind: |-
                    identifier, shorthand_property_identifier, this, call_expression, new_expression, member_expression, subscript_expression,
                    spread_element, template_substitution, arrow_function, function_expression, await_expression, yield_expression,
                    assignment_expression, augmented_assignment_expression, update_expression
    codec:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, pattern: $FN, regex: '^(decode|encode)(Unknown)?(Sync|Exit|Option|Result|Effect|Promise)$'}
                - has: {field: object, pattern: $M, matches: {syntax-import-reference: {source: {regex: '^effect(/Schema)?$'}, exported: {regex: '^Schema$'}}}}
rule:
    kind: call_expression
    all:
        - has: {field: arguments, has: {nthChild: 1, matches: literal-tree}}
        - any:
            - has: {field: function, matches: codec}
            - all:
                - has: {field: function, kind: identifier, pattern: $CODEC}
                - inside: {kind: program, stopBy: end, has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $CODEC}}, {has: {field: value, matches: codec}}]}}
            - all:
                - has: {field: function, matches: {syntax-import-reference: {source: {regex: '^effect(/Function)?$'}, exported: {regex: '^pipe$'}}}}
                - has: {field: arguments, has: {nthChild: 2, matches: codec}}
message: '`$M.$FN` runs over a literal and checks nothing at run time'
note: 'Write the `Schema.<operation>` output as a literal of its output type inside its result type''s success constructor'
