# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/bash_rule.json
id: no-string-test-of-number
language: bash
severity: error
rule:
    any:
        # [ ] and [[ ]] alike, one comparison as the whole test, no-string-test-of-number-by-hand owns a joined or negated one
        - kind: test_command
          has:
              matches: bash-numeric-comparison
              all:
                  - has: {field: left, pattern: $L, not: {kind: unary_expression, regex: '^!'}}
                  - has: {field: operator, pattern: $$OP}
                  - has: {field: right, pattern: $R}
        # The test builtin spelled by name, the operands as its three arguments, the number among them
        - kind: command
          all:
              - has: {field: name, regex: '^test$'}
              - has: {nthChild: 2, pattern: $L}
              - has: {pattern: $$OP, regex: '^(=|==|!=|-eq|-ne|-lt|-le|-gt|-ge)$'}
              - has: {nthChild: 4, pattern: $R}
              - not: {has: {nthChild: 5}}
              - has: {matches: bash-number-operand}
transform:
    # Each operand loses its quotes, then a plain name loses its $ and braces, a special parameter keeps its $
    L1: {replace: {source: $L, replace: '^["''](.*)["'']$', by: '$1'}} # The object form, a quote inside the string form ends its argument
    L2: replace($L1, replace='^\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?$', by='$1')
    R1: {replace: {source: $R, replace: '^["''](.*)["'']$', by: '$1'}}
    R2: replace($R1, replace='^\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?$', by='$1')
    O1: replace($OP, replace='^(=|-eq)$', by='==')
    O2: replace($O1, replace='^-ne$', by='!=')
    O3: replace($O2, replace='^-lt$', by='<')
    O4: replace($O3, replace='^-le$', by='<=')
    O5: replace($O4, replace='^-gt$', by='>')
    O6: replace($O5, replace='^-ge$', by='>=')
fix: (($L2 $O6 $R2))
message: '`$L $OP $R` compares a number as a string'
note: Compare numbers in an arithmetic command, `((<name> == <n>))`, where `=` reads `==`, `-lt` reads `<`, and `<` and `>` keep their spelling
