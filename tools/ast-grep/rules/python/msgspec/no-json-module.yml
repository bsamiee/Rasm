# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-json-module
language: python
severity: error
rule:
    pattern: $USE
    matches: {python-module-use: {module: {regex: '^json(\.[\w.]+)?$'}}}
message: '`$USE` names the stdlib json codec, a decoder without a schema'
note: >-
    Encode with `msgspec.json.encode(<value>)`, decode with `msgspec.json.decode(<bytes>, type=<type>)`,
    and hold a reused codec as `msgspec.json.Encoder()` or `msgspec.json.Decoder(<type>)`
