id: no-hand-mat-view
valid:
  - 'Span<float> values = radii.GetSpan<float>();'
  - 'Span2D<T> view = new((void*)plane.DataPointer, plane.Rows, width, (plane.Step / sizeof(T)) - width);'
  - 'Span2D<float> view = new Span2D<float>(plane.DataPointer.ToPointer(), plane.Rows, plane.Cols, (int)(plane.Step / sizeof(float)) - plane.Cols);'
  - 'Span2D<float> view = rows.AsSpan(0, length).AsSpan2D(length, 3);'
invalid:
  - 'Span<float> values = new((void*)plane.DataPointer, plane.Rows * plane.Cols * 4);'
  - 'Span<byte> bytes = new Span<byte>(plane.DataPointer.ToPointer(), plane.Total.ToInt32() * plane.ElementSize);'
  - 'Span2D<T> view = plane.GetSpan<T>().AsSpan2D(plane.Rows, plane.Cols * plane.ElementSize / Unsafe.SizeOf<T>());'
  - 'ReadOnlySpan2D<float> view = plane.GetSpan<float>().AsReadOnlySpan2D(plane.Rows, plane.Cols);'
