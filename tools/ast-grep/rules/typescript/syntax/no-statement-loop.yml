# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop
language: tsx
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
        - kind: for_statement, while_statement, do_statement
message: Loop iterates by statement
note: '`Array.map`, `Array.reduce`, or `Effect.forEach` returns the results and `discard` runs an effect per element, `Array.unfold` or `Effect.whileLoop` runs until a condition'
labels:
    LOOP: {style: primary}
