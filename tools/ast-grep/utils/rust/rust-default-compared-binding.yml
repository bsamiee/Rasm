# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-default-compared-binding
language: rust
utils:
    zero-value:
        any:
            - matches: rust-empty-string
            - matches: rust-default-value
            - {kind: integer_literal, regex: '^0+(_?[iu](8|16|32|64|128|size))?$'}
            - {kind: float_literal, regex: '^0+\.0*(_?f(32|64))?$'}
            - {kind: boolean_literal, regex: '^false$'}
    retest:
        any:
            - kind: call_expression
              has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $NAME}}, {has: {field: field, regex: '^is_empty$'}}]}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(==|!=)$'}
                - has: {pattern: $NAME}
                - has: {matches: zero-value}
rule:
    inside:
        kind: let_declaration
        stopBy: {kind: block}
        has: {field: pattern, kind: identifier, pattern: $NAME}
        precedes:
            stopBy: {kind: let_declaration, has: {field: pattern, pattern: $NAME}}
            any: [{matches: retest}, {has: {stopBy: {kind: 'function_item, closure_expression'}, matches: retest}}]
