# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-stats"
version.workspace    = true
edition.workspace    = true
description          = "Statistics over named bounded spaces: mergeable summaries, dependence matrices, Monte Carlo, Latin hypercube, Sobol and factorial designs, confidence and bootstrap intervals, NUTS calibration and Guideline 14 grading, Saltelli and Morris sensitivity"
repository.workspace = true
license.workspace    = true
keywords             = ["statistics", "sampling", "sensitivity", "calibration", "mcmc"]
categories           = ["mathematics", "science"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [TEST]
[[test]]
name = "operations"
path = "../../../../tests/rust/numerics/stats/operations.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
anyhow               = { workspace = true }
average              = { workspace = true }
datasketches         = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }
nalgebra             = { workspace = true }
nonempty-collections = { workspace = true }
num-complex          = { workspace = true }
num-dual             = { workspace = true }
nuts-rs              = { workspace = true }
nutype               = { workspace = true }
rand                 = { workspace = true }
rayon                = { workspace = true }
rustfft              = { workspace = true }
serde                = { workspace = true }
serde_with           = { workspace = true }
sobol_burley         = { workspace = true }
statrs               = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }

# --- [TEST]
[dev-dependencies]
approx = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
