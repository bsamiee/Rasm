# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-paired-bound-check
language: tsx
severity: error
utils:
    bound:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/Schema)?$'}, exported: {regex: '^Schema$'}}}}
    composer:
        kind: call_expression
        any:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(check|pipe|makeFilterGroup)$'}}
            - has: {field: function, matches: {syntax-import-reference: {source: {regex: '^effect(/Function)?$'}, exported: {regex: '^pipe$'}}}}
    link:
        any:
            - matches: composer
            - kind: member_expression
              inside: {field: function, matches: composer}
            - kind: arguments
              inside: {matches: composer}
            - kind: array
              inside: {kind: arguments, inside: {matches: composer, has: {field: function, has: {field: property, regex: '^makeFilterGroup$'}}}}
    lower:
        matches: bound
        pattern: $LOWER
    upper:
        matches: bound
        pattern: $UPPER
rule:
    matches: composer
    all:
        - not: {inside: {matches: link}}
        - any:
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^is(MinLength|NonEmpty)$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isMaxLength$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isMinSize$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isMaxSize$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isMinProperties$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isMaxProperties$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isMinCodePoints$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isMaxCodePoints$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?Date$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?Date$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?BigInt$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?BigInt$'}}}
            - all:
                - has: {stopBy: {not: {matches: link}}, matches: lower, has: {field: function, has: {field: property, regex: '^isGreaterThan(OrEqualTo)?BigDecimal$'}}}
                - has: {stopBy: {not: {matches: link}}, matches: upper, has: {field: function, has: {field: property, regex: '^isLessThan(OrEqualTo)?BigDecimal$'}}}
message: '`$LOWER` and `$UPPER` state one range of one schema as two checks'
note: '`Schema.isBetweenLength`, `isBetweenSize`, `isBetweenProperties`, `isBetweenCodePoints`, `isBetween`, `isBetweenDate`, `isBetweenBigInt`, or `isBetweenBigDecimal` states both bounds in one check with one expected message and one arbitrary constraint'
