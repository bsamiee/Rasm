# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-formatted-event-value
language: rust
severity: error
utils:
    instrument-fields:
        kind: token_tree
        follows: {kind: identifier, regex: '^fields$'}
        inside: {kind: token_tree, inside: {kind: attribute, has: {nthChild: 1, regex: '^(::)?(tracing::)?instrument$'}}}
    rendering-call:
        kind: identifier
        any:
            - all: [{regex: '^(format|format_args)$'}, {precedes: {regex: '^!$'}}]
            - all:
                - regex: '^to_string$'
                - follows: {regex: '^\.$'}
                - precedes: {kind: token_tree, regex: '^\(\s*\)$', precedes: {stopBy: {not: {kind: 'line_comment, block_comment'}}, regex: '^(,|\)|\})$'}}
rule:
    kind: attribute_item
    has: {kind: attribute, has: {field: arguments, has: {matches: instrument-fields, has: {matches: rendering-call, pattern: $FORMAT}}}}
message: '`$FORMAT` renders a value to text before the `#[instrument]` span records it'
note: 'Record each value as its own field (`<name> = %<value>`, `<name> = ?<value>`), tracing formats a field only when a subscriber records it. The `formatted_event` dylint owns the events and spans tracing macros build'
