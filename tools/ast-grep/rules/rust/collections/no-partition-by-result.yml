# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-partition-by-result
language: rust
severity: error
utils:
    case-test:
        any:
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, any: [{pattern: $ITEM}, {pattern: $ITEM.as_ref()}, {pattern: '(*$ITEM)'}]}}, {has: {field: field, regex: '^is_(ok|err)$'}}]}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - kind: call_expression
              all:
                - has: {field: function, regex: '^((::)?(std|core)::)?(result::)?Result::is_(ok|err)$'}
                - has: {field: arguments, has: {nthChild: 1, any: [{pattern: $ITEM}, {pattern: '&$ITEM'}]}, not: {has: {nthChild: 2}}}
            - kind: macro_invocation
              all:
                - has: {field: macro, regex: '^((::)?(std|core)::)?matches$'}
                - has: {kind: token_tree, regex: '^\(\s*[*&]?\s*\w+\s*,\s*(&\s*)?(Ok|Err)\s*\(\s*(_|\.\.)\s*\)\s*\)$'}
            - kind: unary_expression
              has: {kind: call_expression, matches: case-test}
    result-test:
        any:
            - kind: scoped_identifier
              regex: '^((::)?(std|core)::)?(result::)?Result::is_(ok|err)$'
            - kind: closure_expression
              all:
                - has: {field: parameters, has: {stopBy: end, kind: identifier, pattern: $ITEM}, not: {has: {nthChild: 2}}}
                - has: {field: body, any: [{matches: case-test}, {kind: block, has: {nthChild: {position: 1, ofRule: {matches: rust-statement}}, matches: case-test}, not: {has: {nthChild: {position: 2, ofRule: {matches: rust-statement}}}}}]}
rule:
    kind: call_expression
    pattern: $SITE
    all:
        - has:
            field: function
            any:
                - kind: field_expression
                  has: {field: field, regex: '^partition$'}
                - kind: generic_function
                  has: {field: function, kind: field_expression, has: {field: field, regex: '^partition$'}}
        - has: {field: arguments, all: [{has: {nthChild: 1, matches: result-test}}, {not: {has: {nthChild: 2}}}]}
message: '`$SITE` splits results by their case and leaves each half wrapped in `Ok` or `Err`'
note: 'Call `<iterator>.partition_result::<Vec<_>, Vec<_>, _, _>()` (`use itertools::Itertools as _;`) on the owned results and delete the unwraps after it'
