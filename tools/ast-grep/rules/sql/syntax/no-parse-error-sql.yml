# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-sql
language: sql
severity: error
rule:
    any:
        - kind: ERROR
          not: {inside: {kind: ERROR, stopBy: end}}
        - kind: source_file
          has: {stopBy: end, pattern: __MISSING, regex: '^$', not: {inside: {kind: ERROR, stopBy: end}}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span every other rule skips
note: Write a form the grammar parses
