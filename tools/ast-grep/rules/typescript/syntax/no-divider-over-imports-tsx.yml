# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-divider-over-imports-tsx
language: tsx
severity: error
rule:
    kind: comment
    any:
        - regex: '^// --- \[IMPORTS\]'
          any:
            - precedes: {pattern: $NEXT}
            - pattern: $_
        - matches: text-section-divider
          precedes: {stopBy: end, kind: import_statement}
          pattern: $KEPT
fix:
    template: $NEXT$KEPT
    expandEnd: {pattern: $NEXT, follows: {kind: comment, regex: '^// --- \[IMPORTS\]'}}
message: Divider labels or precedes the imports
note: Imports form the preamble above every section, delete an `[IMPORTS]` divider and move any other divider below the last import
