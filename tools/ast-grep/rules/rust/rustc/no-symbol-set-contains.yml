# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
files: [tools/dylint/**]
rule:
    kind: call_expression
    pattern: $SET.contains(&$N)
constraints:
    SET:
        kind: array_expression
        regex: '^\[\p{Pattern_White_Space}*((sym|kw)::\p{XID_Continue}+\p{Pattern_White_Space}*,\p{Pattern_White_Space}*)+(sym|kw)::\p{XID_Continue}+\p{Pattern_White_Space}*,?\p{Pattern_White_Space}*\]$'
message: '`contains` tests `$N` against an array of `Symbol` constants'
note: 'Write `matches!(<value>, sym::A | sym::B)`, or match the or-pattern in a `match` arm or let-chain binding'
