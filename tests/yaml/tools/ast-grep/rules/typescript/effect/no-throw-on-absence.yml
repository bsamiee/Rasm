id: no-throw-on-absence
valid:
    - |
      function get(m: Map<string, number>, k: string) {
          const v = m.get(k);
          if (v === undefined) return 0;
          return v;
      }
    - |
      function check(v: number) {
          if (v > 1) throw new Error("large");
          return v;
      }
invalid:
    - |
      function get(m: Map<string, number>, k: string) {
          const v = m.get(k);
          if (v === undefined) throw new Error("missing");
          return v;
      }
    - |
      function get(m: Map<string, number>, k: string) {
          if (!m.has(k)) {
              throw new Error("missing");
          }
          return m.get(k);
      }
    - |
      function read(v: string | null) {
          if (v == null || typeof v === "undefined") throw new Error("missing");
          return v;
      }
