# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
utils:
    alternate:
        kind: expansion
        has: {field: operator, regex: '^:?\+$'}
        inside: {kind: 'command, array', stopBy: {not: {kind: concatenation}}}
rule:
    kind: simple_expansion, expansion, command_substitution
    matches: bash-string-expansion
    any:
        - inside: {matches: alternate}
        - inside: {kind: concatenation, inside: {matches: alternate}}
message: Unquoted alternate data can split words and expand globs
note: Quote expanded data while preserving existing literal quoting
