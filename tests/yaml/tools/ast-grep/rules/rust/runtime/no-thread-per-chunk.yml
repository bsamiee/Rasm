id: no-thread-per-chunk
valid:
    - |
      fn sum(data: &[u64]) -> u64 {
          data.par_chunks(1024).map(|c| c.iter().sum::<u64>()).sum()
      }
    - |
      fn run() -> usize {
          let h = std::thread::spawn(|| 1);
          h.join().unwrap()
      }
invalid:
    - |
      fn sum(data: &[u64]) -> u64 {
          std::thread::scope(|s| {
              let handles: Vec<_> = data.chunks(1024).map(|c| s.spawn(move || c.iter().sum::<u64>())).collect();
              handles.into_iter().map(|h| h.join().unwrap()).sum()
          })
      }
    - |
      fn run(data: Vec<u8>) {
          for chunk in data.chunks(64) {
              let owned = chunk.to_vec();
              std::thread::spawn(move || owned.len());
          }
      }
