# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: boolean-statement-to-if
language: python
severity: off
rule:
    all:
        - matches: python-block-statement
        - matches:
            python-discarded-expression:
                value:
                    kind: boolean_operator
                    has: {field: right, kind: 'call, await'}
    pattern: $STMT
constraints:
    STMT: {not: {regex: '\n'}}
rewriters:
    - id: and-statement
      rule: {kind: boolean_operator, pattern: $TEST and $EFFECT}
      fix: |-
        if $TEST:
            $EFFECT
    - id: or-negated-statement
      rule: {kind: boolean_operator, pattern: not $TEST or $EFFECT}
      fix: |-
        if $TEST:
            $EFFECT
    - id: or-boolean-statement
      rule: {kind: boolean_operator, pattern: $TEST or $EFFECT}
      constraints: {TEST: {kind: boolean_operator}}
      fix: |-
        if not ($TEST):
            $EFFECT
    - id: or-statement
      rule: {kind: boolean_operator, pattern: $TEST or $EFFECT}
      fix: |-
        if not $TEST:
            $EFFECT
transform:
    OUT: rewrite($STMT, rewriters=[and-statement, or-negated-statement, or-boolean-statement, or-statement], joinBy='')
fix: $OUT
message: Boolean operator as a statement runs its right operand for an effect and drops the value
note: Write the `if` statement, `if <test>:` for `and` and `if not <test>:` for `or`, with the effect in its body
