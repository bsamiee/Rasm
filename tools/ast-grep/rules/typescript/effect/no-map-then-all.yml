# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-map-then-all
language: tsx
severity: error
utils:
    all-member:
        matches: effect-effect-member
        has: {field: property, regex: '^all$'}
    array-map:
        kind: member_expression
        all:
            - has: {field: property, regex: '^map$'}
            - has: {field: object, matches: {effect-module: {name: {regex: '\bArray$'}}}}
    two-parameter-callback:
        not: {all: [{kind: 'arrow_function, function_expression'}, {has: {field: parameters, has: {nthChild: 3}}}]}
    mapped-list:
        kind: call_expression
        any:
            - all:
                - has:
                    field: function
                    kind: member_expression
                    all:
                        - has: {field: property, regex: '^map$'}
                        - has: {field: object, pattern: $XS, not: {matches: {effect-module: {name: {regex: '\b[A-Z]\w*$'}}}}}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $F}}, {not: {has: {nthChild: 2}}}]}
            - all:
                - has: {field: function, matches: array-map}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $XS}}, {has: {nthChild: 2, pattern: $F}}, {not: {has: {nthChild: 3}}}]}
    traversal-options:
        not: {kind: object, has: {kind: pair, has: {field: key, regex: '^mode$'}}}
rule:
    kind: call_expression
    any:
        - all:
            - has: {field: function, matches: all-member, pattern: $ALL}
            - has: {field: arguments, has: {nthChild: 1, matches: mapped-list}}
            - any:
                - pattern: $FIXABLE
                  all:
                    - has: {field: arguments, not: {has: {nthChild: 2, not: {matches: traversal-options}}}}
                    - has: {field: arguments, has: {nthChild: 1, has: {field: arguments, has: {pattern: $F, matches: two-parameter-callback}}}}
                    - not: {has: {kind: comment, stopBy: end}}
                - pattern: $KEPT
        - pattern: $KEPT
          has:
            field: arguments
            has:
                kind: call_expression
                has: {field: function, matches: array-map}
                not: {has: {field: arguments, has: {nthChild: 2}}}
                precedes: {matches: all-member, pattern: $ALL, stopBy: {not: {regex: '^,$'}}}
rewriters:
    - id: traverse
      rule: {kind: call_expression, pattern: '$M.all($LIST, $$$OPTIONS)'}
      transform: {LISTED: {replace: {source: $$$OPTIONS, replace: '(?s),\s*$', by: ''}}}
      fix: '$M.forEach($XS, $F, $LISTED)'
    - id: traverse-plain
      rule: {kind: call_expression, pattern: '$M.all($LIST)'}
      fix: '$M.forEach($XS, $F)'
transform:
    FIXED: rewrite($FIXABLE, rewriters=[traverse, traverse-plain])
fix: $FIXED$KEPT
message: '`$ALL` runs a list built by mapping each element to an effect'
note: '`Effect.forEach(<list>, <function>, <options>)` maps and runs the elements in one traversal that keeps order, `concurrency`, and `discard`, and `Effect.partition` or `Effect.validate` replaces `mode: "result"`'
