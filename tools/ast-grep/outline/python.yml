id: python-member-field
language: pythonlang
role: member
symbolType: field
parentRuleIds: [python-class, python-interface, python-enum, python-function]
utils:
    scope: {inside: {kind: class_definition, stopBy: {kind: 'class_definition, function_definition'}, any: [{all: [{inside: {kind: 'class_definition, function_definition', stopBy: end}}, {has: {field: name, pattern: $OWNER}}]}, {pattern: $_}]}}
    private: {regex: '^_(?:$|[^_]|_.*[^_]_?$)'}
    hidden: {inside: {kind: 'class_definition, function_definition', stopBy: end, has: {field: name, matches: private}}}
    unpacked: {kind: 'pattern_list, tuple_pattern, list_pattern, list_splat_pattern'}
    constructed: {inside: {kind: function_definition, stopBy: {kind: 'class_definition, function_definition'}, has: {field: name, any: [{pattern: __init__}, {pattern: __new__}, {pattern: __post_init__}]}, matches: scope}}
rule:
    kind: 'assignment, named_expression, identifier, attribute'
    any:
        - kind: assignment
          all:
            - has: {field: left, kind: identifier, pattern: $NAME}
            - not: {has: {field: right, kind: assignment}}
            - any: [{has: {field: type, pattern: $TYPE}}, {pattern: $_}]
            - matches: scope
        - kind: named_expression
          has: {field: name, pattern: $NAME}
          not: {inside: {kind: lambda, stopBy: end}}
          matches: scope
        - kind: identifier
          pattern: $NAME
          not: {pattern: _}
          inside:
            any:
                - {kind: assignment, all: [{has: {field: right, kind: assignment}}, {has: {field: left, pattern: $NAME}}]}
                - {kind: for_statement, has: {field: left, pattern: $NAME}}
                - {matches: unpacked, any: [{inside: {kind: 'assignment, for_statement', field: left}}, {inside: {matches: unpacked, stopBy: {not: {matches: unpacked}}, inside: {kind: 'assignment, for_statement', field: left}}}]}
                - {kind: dotted_name, not: {has: {nthChild: 2}}, inside: {kind: 'case_pattern, keyword_pattern'}}
                - {kind: splat_pattern}
                - {kind: as_pattern, inside: {kind: case_pattern}}
                - {kind: as_pattern_target, inside: {kind: as_pattern, inside: {kind: with_item}}}
                - {kind: 'tuple, list, parenthesized_expression, list_splat', inside: {kind: as_pattern_target, stopBy: {not: {kind: 'as_pattern_target, tuple, list, parenthesized_expression, list_splat'}}, inside: {kind: as_pattern, inside: {kind: with_item}}}}
          matches: scope
        - kind: attribute
          all:
            - has: {field: object, pattern: self}
            - has: {field: attribute, pattern: $NAME}
            - any:
                - inside: {kind: assignment, field: left, any: [{has: {field: type, pattern: $TYPE}}, {pattern: $_}]}
                - inside: {matches: unpacked, any: [{inside: {kind: assignment, field: left}}, {inside: {matches: unpacked, stopBy: {not: {matches: unpacked}}, inside: {kind: assignment, field: left}}}]}
            - matches: constructed
rewriters:
    - id: comment
      rule: {kind: comment}
      fix: ''
transform:
    QUALIFIER: {replace: {source: $OWNER, replace: '$', by: '.'}}
    BARE: {rewrite: {source: $TYPE, rewriters: [comment]}}
    TYPED: {replace: {source: $BARE, replace: '^(.)', by: ': $1'}}
    ANNOTATION: {replace: {source: $TYPED, replace: '[\t-\r \x{200B}\x{2060}\x{FEFF}]*(?:\\\r?)?\n[\t-\r \x{200B}\x{2060}\x{FEFF}]*', by: ' '}}
name: $QUALIFIER$NAME
signature: $NAME$ANNOTATION
isPublic: {not: {any: [{kind: identifier, matches: private}, {has: {field: left, matches: private}}, {has: {field: name, matches: private}}, {kind: attribute, has: {field: attribute, matches: private}}, {matches: hidden}]}}
