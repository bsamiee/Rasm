# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores: ['.claude/workflows/*.js', 'plugins/function-hooks/hooks/**']
rule:
    kind: arrow_function
    all:
        - any: [{pattern: '($X) => !$F($X)'}, {pattern: '$X => !$F($X)'}]
        - not: {inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: member_expression, has: {field: property, regex: '^(filter|partition)$'}}}}}
        - has:
            field: body
            has:
                field: argument
                has:
                    field: function
                    any:
                        - kind: identifier
                        - kind: member_expression
                          has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)[A-Z][^\x00-#%-/:-@\[-\^`{-~\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*$'}}}}
message: '`$F` is negated through an arrow over its one argument'
note: 'Pass `Predicate.not(<predicate>)`'
