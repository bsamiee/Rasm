# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-solar"
version.workspace    = true
edition.workspace    = true
description          = "Sun positions, events and lit paths at a site, Tregenza and Reinhart sky patches, incidence, sun hours, sky view and solar envelopes"
repository.workspace = true
license.workspace    = true
keywords             = ["solar", "sun", "daylight", "sky", "envelope"]
categories           = ["science::geo"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                = { workspace = true }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
derive_more          = { workspace = true }
nutype               = { workspace = true }
itertools            = { workspace = true }
jiff                 = { workspace = true }
nalgebra             = { workspace = true }
ndarray              = { workspace = true }
gauss-quad           = { workspace = true }
rstar                = { workspace = true }
uom                  = { workspace = true }
solar-positioning    = { workspace = true }
rasm-proximity       = { workspace = true }
rasm-site            = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
