overrides:
    # Providers' ^3 peer range excludes the catalog prerelease, and a second copy of the core fails resource registration
    '@pulumi/pulumi': 'catalog:'
    # cloudevents calls uuid.v4, an API uuid 14 keeps
    cloudevents>uuid: 14.0.2
    # Grammar packages misspell the optional marker of their tree-sitter peer, and the grammar target reads their C sources alone
    '@tree-sitter-grammars/tree-sitter-xml>tree-sitter': '-'
    '@derekstride/tree-sitter-sql>tree-sitter': '-'
    # Plugin peer range spans 7 and 8, auto-install takes the 7 release beside @babel/core 8 and its peer on core 7 goes unmet
    '@rolldown/plugin-babel>@babel/plugin-transform-runtime': 8.0.1
    # vite-plugin-inspect depends on kit ^0.4, whose devframe tree would sit beside the one the @vitejs/devtools row brings
    vite-plugin-inspect>@vitejs/devtools-kit: 'catalog:'
    # Peer ranges the catalog crosses on purpose, one row per consumer so no other package's regular dependency moves
    '@qualithm/arrow-flight-client>apache-arrow': 'catalog:'
    '@use-gesture/react>react': 'catalog:'
    '@google/model-viewer>three': 'catalog:'
    '@pulumi/pulumi>typescript': 'catalog:'
    '@effect/docgen>typescript': 'catalog:'
    'tsconfck>typescript': 'catalog:'
    '@nx/vitest>vitest': 'catalog:'
    '@effect/atom-react>scheduler': 'catalog:'
peerDependencyRules:
    # Peer ranges the catalog's newest rows step past, the consumer's declared range stays its own
    allowedVersions:
        'vite>yaml': '>=3.0.0-0'
        '@loaders.gl/core': '>=4.4.0'
allowBuilds:
    '@datadog/pprof': true
    '@derekstride/tree-sitter-sql': false
    '@modelcontextprotocol/inspector': true
    '@pulumi/command': true
    '@pulumi/docker': true
    '@pulumi/docker-build': true
    '@pulumi/kubernetes': true
    '@swc/core': true
    '@tree-sitter-grammars/tree-sitter-xml': false
    core-js: true
    esbuild: true
    nx: true
    protobufjs: true
