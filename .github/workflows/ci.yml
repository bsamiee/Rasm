name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - uses: nrwl/nx-set-shas@v5
            - uses: ./.github/actions/setup
            - run: nx run rasm:check
              env:
                DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
            - run: nx affected -t check --exclude='rasm,tag:host:macos,tag:host:rhino,tag:host:claude'
              env:
                DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    macos:
        runs-on: xcode-27
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
                filter: tree:0
                persist-credentials: false
            - uses: nrwl/nx-set-shas@v5
            - uses: ./.github/actions/setup
            - run: nx affected -t check --exclude='!tag:host:macos,!tag:host:rhino' --configuration ci
              env:
                DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    required:
        needs: [check, macos]
        if: always()
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions: {}
        steps:
            - run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
              env:
                NEEDS: ${{ toJSON(needs) }}
