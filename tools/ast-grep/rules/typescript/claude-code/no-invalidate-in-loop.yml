# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-invalidate-in-loop
language: tsx
severity: error
files: ['**/.claude/plugins/**']
utils:
    loop:
        any:
            - kind: for_statement
            - kind: for_in_statement
            - kind: while_statement
            - kind: do_statement
    # Call of an array method that runs its callback once per element, a loop spelled as a call, and the clock's every timer stays out
    per-element-call:
        kind: call_expression
        not: {matches: {claude-code-engine-call: {noun: {pattern: $_}}}}
        has:
            field: function
            kind: member_expression
            has:
                field: property
                regex: '^(forEach|map|flatMap|filter|reduce|reduceRight|some|every|find|findIndex|findLast|findLastIndex|sort|toSorted|from|groupBy)$'
    # The callback inline among the arguments, or bound to a name the call passes
    element-callback:
        matches: syntax-function-boundary
        any:
            - inside: {kind: arguments, inside: {matches: per-element-call}}
            - all:
                  - any:
                        - has: {field: name, pattern: $CALLBACK}
                        - inside: {kind: variable_declarator, has: {field: name, pattern: $CALLBACK}}
                  - inside:
                        kind: program
                        stopBy: end
                        has: {stopBy: end, matches: per-element-call, has: {field: arguments, has: {kind: identifier, pattern: $CALLBACK}}}
    # Invalidate of one named event, a map over a constant list of distinct views invalidates each once and passes a name
    invalidate-call:
        kind: call_expression
        matches: {claude-code-engine-call: {noun: {pattern: $_}}}
        all:
            # invalidate exists on the ui noun alone, the verb pins the call
            - has: {field: function, has: {field: property, regex: '^invalidate$'}}
            # The view name as a string or a template without a substitution, one literal in either spelling
            - has: {field: arguments, has: {any: [{kind: string}, {kind: template_string, not: {has: {kind: template_substitution}}}]}}
rule:
    # List order, the position walks run on the invalidate calls alone and an any key runs before matches
    all:
        - matches: invalidate-call
        - any:
              # Inside a loop with no function between, a closure inside the loop runs later and stands alone
              - inside: {matches: loop, stopBy: {matches: syntax-function-boundary}}
              # The nearest function is the ui.render hook itself, a redraw requested during the draw, an onPress closure inside it stands alone
              - inside:
                    matches: {claude-code-hook: {event: {kind: string, regex: "^['\"]ui\\.render['\"]$"}}}
                    stopBy: {matches: syntax-function-boundary}
              # The nearest function is a per-element callback
              - inside: {matches: element-callback, stopBy: {matches: syntax-function-boundary}}
message: The redraw is requested once per iteration or during the draw itself
note: "Request the redraw once after the loop, or from the event that changed the state, `onPress: () => $.ui.invalidate('ui.render')`"
