# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    properties-key:
        any:
            - kind: property_identifier
              regex: '^properties$'
            - kind: string, template_string
              regex: '^.properties.$'
rule:
    pattern: $WRITE
    any:
        - kind: assignment_expression
          has:
            field: left
            any:
                - {kind: member_expression, has: {field: property, matches: properties-key}}
                - {kind: subscript_expression, has: {field: index, matches: properties-key}}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^(Reflect\.(set|defineProperty)|Object\.defineProperty)$'}
            - has: {field: arguments, has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, matches: properties-key}}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^Object\.assign$'}
            - has:
                field: arguments
                has:
                    kind: object
                    not: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
                    has:
                        any:
                            - {kind: pair, has: {field: key, matches: properties-key}}
                            - {kind: shorthand_property_identifier, regex: '^properties$'}
    inside: {kind: program, stopBy: end, matches: {typescript-module-importer: {module: {regex: '^(adobe:)?indesign$'}}}}
transform:
    HEAD: {replace: {source: $WRITE, replace: '(?s)^([^(=]+?)[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*[(=].*$', by: '$1'}}
message: '`$HEAD` sets keys through `properties` and drops each refused key with no error'
note: 'Apply one-key `Object.assign` calls through `Effect.validate`, restoring temporary writes through `Effect.acquireRelease`'
