id: lift-fin-bind-to-lift
valid:
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(other)); }'
    - 'class C { object F() => IO.lift(Next); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(Other(fin))); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => Other.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(async fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => { Observe(); return IO.lift(fin); }); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(/* retain */ fin)); }'
    - 'class C { object F() => Other.lift<Fin<int>>(Next).Bind(fin => Other.lift(fin)); }'
    - 'class C { object F() => IO.lift<Other<int>>(Next).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Alias>(Next).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind((ref Fin<int> fin) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind((Fin<int> fin = null) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind((fin, other) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(object (Fin<int> fin) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind([Obsolete] (fin) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind((Fin<int> /* retain */ fin) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Finally<int>>(Next).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(Other.lift); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(() => other)); }'
    - 'class C { object F() => from fin in IO.lift<Fin<int>>(Next) from x in IO.lift(fin) select x + 1; }'
    - 'class C { object F() => from fin in IO.lift<Fin<int>>(Next) from x in IO.lift(fin) where x > 0 select x; }'
    - 'class C { object F() => from fin in IO.lift<Fin<int>>(Next) from x in IO.lift(other) select x; }'
    - 'class C { object F() => from fin in IO.lift<Fin<int>>(Next) from x in IO.lift(fin) select fin; }'
invalid:
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(() => Next()).Bind((fin) => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(static fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(static (fin) => IO.lift(fin)); }'
    - 'class C { object F() => LanguageExt.IO.lift<LanguageExt.Fin<int>>(Next).Bind(fin => LanguageExt.IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(() => Next(/* keep */)).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind((Fin<int> fin) => IO.lift(fin)); }'
    - 'class C { object F() => global::LanguageExt.IO.lift<global::LanguageExt.Fin<int>>(Next).Bind(fin => global::LanguageExt.IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(f: Next).Bind(f: fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift<int>(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>((EnvIO env) => Next()).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(fin)).Map(x => x); }'
    - 'class C { object F() => IO.lift<Fin <int>>(Next).Bind(fin => IO.lift(fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift(() => fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(fin => IO.lift<int>(() => fin)); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(IO.lift); }'
    - 'class C { object F() => IO.lift<Fin<int>>(Next).Bind(f: IO.lift); }'
    - 'class C { object F() => from fin in IO.lift<Fin<int>>(Next) from x in IO.lift(fin) select x; }'
    - 'class C { object F() => from fin in IO.lift<Fin<int>>(Next) from x in IO.lift<int>(fin) select x; }'
