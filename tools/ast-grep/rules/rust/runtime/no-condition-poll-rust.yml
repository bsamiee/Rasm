# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    timed-wait:
        any:
            - kind: await_expression
              has:
                nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}
                kind: call_expression
                any:
                    - has: {field: function, regex: '^((::)?(tokio::)?time::)?sleep(_until)?$|^((::)?(tokio::)?task::)?yield_now$'}
                    - has: {field: function, kind: field_expression, has: {field: field, regex: '^tick$'}}
                    - has: {field: function, matches: {rust-imported-name: {source: {has: {field: argument, regex: '^(::)?tokio::(time|task)::'}}, name: {regex: '^(sleep(_until)?|yield_now)$'}}}}
            - kind: call_expression
              has: {field: function, regex: '^((::)?std::)?thread::(sleep(_until)?|yield_now|park_timeout)$'}
            - kind: call_expression
              has: {field: function, matches: {rust-imported-name: {source: {has: {field: argument, regex: '^(::)?std::thread::'}}, name: {regex: '^(sleep(_until)?|yield_now|park_timeout)$'}}}}
    loop-exit:
        matches: rust-diverging
        not: {kind: continue_expression}
    status-probe:
        kind: call_expression
        has: {field: function, kind: field_expression, has: {field: field, regex: '^do_step_status$'}}
rule:
    kind: 'loop_expression, while_expression, for_expression'
    all:
        - has: {field: body, has: {stopBy: &scope {any: [{matches: rust-return-boundary}, {kind: 'loop_expression, while_expression, for_expression'}]}, matches: timed-wait, pattern: $SLEEP}}
        - not: {has: {field: body, has: {stopBy: *scope, matches: status-probe}}}
        - any:
            - kind: while_expression
              has: {field: condition, not: {has: {stopBy: end, kind: await_expression}}}
            - kind: 'loop_expression, for_expression'
              has: {field: body, has: {stopBy: *scope, matches: loop-exit}}
message: '`$SLEEP` wakes the loop to re-test its condition'
note: 'Await `Notify::notified`, `watch::Receiver::wait_for`, or `cancelled()`, block on `Condvar::wait_while`, tick in `run_until_cancelled(<tick>)`'
