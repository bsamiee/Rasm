name: Release

on:
    workflow_dispatch: {}

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    release:
        runs-on: xcode-27
        timeout-minutes: 120
        environment: release
        permissions:
            contents: write
            id-token: write
            packages: write
        env:
            DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
            RhinoInstallPath: /Applications/RhinoBETA.app # Folder `mcneel/setup-rhino3d` installs its `wip` release into, read by MSBuild as a property
            UV_LOCKED: "true"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0
            - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
            - run: pnpm install
            - run: nx build @rasm/nx-apple-darwin-arm64 --configuration=release
            - uses: mcneel/setup-rhino3d@b3faf87453962c0742ab2a5e72d3494505f660df # v3.0.0
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  release-version: wip
            - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - run: nx release --skip-publish
              env:
                  GH_TOKEN: ${{ github.token }}
            - run: nx run-many --targets=build --configuration=release --projects=tag:npm:public,tag:release
            - id: nuget
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              with:
                  user: ${{ secrets.NUGET_USER }}
            - run: nx release publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
                  YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
            - run: git diff --exit-code -- '*Cargo.lock' '*Package.resolved'
