# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    tagged:
        kind: call_expression
        has: {field: function, regex: '^sql(<[[\p{White_Space}\x{200B}\x{2060}\x{FEFF}][^\p{White_Space}\x{200B}\x{2060}\x{FEFF}]]*>)?$'}
    read:
        matches: tagged
        has: {field: arguments, kind: template_string, has: {nthChild: 1, kind: string_fragment, regex: '(?i)^[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*(select|with)(?-u:\b)'}}
    write:
        matches: tagged
        has: {field: arguments, kind: template_string, has: {nthChild: 1, kind: string_fragment, regex: '(?i)^[\p{White_Space}\x{200B}\x{2060}\x{FEFF}]*(insert|update|delete|merge)(?-u:\b)'}}
    value-substitution:
        kind: template_substitution
        not: {follows: {stopBy: end, kind: string_fragment, regex: '(?i)(?-u:\b)where(?-u:\b)'}}
    uses-read:
        matches: value-substitution
        has: {stopBy: end, kind: identifier, pattern: $READ}
    guarded-write:
        kind: call_expression
        has:
            field: arguments
            has:
                kind: template_substitution
                follows: {stopBy: end, kind: string_fragment, regex: '(?i)(?-u:\b)where(?-u:\b)'}
                has: {stopBy: end, kind: identifier, pattern: $READ}
rule:
    kind: lexical_declaration
    all:
        - has:
            kind: variable_declarator
            all:
                - has: {field: value, kind: 'yield_expression, subscript_expression', has: {stopBy: end, matches: read}}
                - has:
                    field: name
                    any:
                        - {kind: identifier, pattern: $READ}
                        - {kind: 'array_pattern, object_pattern', has: {stopBy: end, kind: 'identifier, shorthand_property_identifier_pattern', pattern: $READ}}
        - inside: {kind: statement_block, inside: {kind: 'generator_function, generator_function_declaration'}}
        - precedes:
            stopBy: end
            any:
                - has: {stopBy: end, matches: write, pattern: $WRITE, has: {field: arguments, has: {matches: uses-read}}, not: {matches: guarded-write}}
                - all:
                    - kind: lexical_declaration
                    - has: {kind: variable_declarator, all: [{has: {field: name, kind: identifier, pattern: $FRAGMENT}}, {has: {field: value, matches: tagged, has: {field: arguments, has: {matches: uses-read}}}}]}
                    - precedes: {stopBy: end, has: {stopBy: end, matches: write, pattern: $WRITE, has: {field: arguments, has: {matches: value-substitution, has: {kind: identifier, pattern: $FRAGMENT}}}, not: {matches: guarded-write}}}
labels:
    WRITE: {style: secondary, message: Write taking a value from the read}
message: '`$READ` holds a read the later write takes a value from'
note: 'Use a computed `UPDATE` or conflict update, or guard the write with `where revision = <expected>`'
