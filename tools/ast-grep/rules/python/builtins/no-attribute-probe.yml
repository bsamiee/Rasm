# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-attribute-probe
language: python
severity: error
utils:
    name-string:
        kind: string
        regex: '^[rRuU]?("|'')[A-Za-z_]\w*("|'')$'
        not: {regex: '__call__'}
    constant-name:
        kind: identifier
        pattern: $CONST
        inside: {stopBy: end, kind: module, has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $CONST}}, {has: {field: right, matches: name-string}}]}}}
    member-name:
        kind: attribute
        all:
            - has: {field: object, kind: identifier, pattern: $OWNER}
            - has: {field: attribute, pattern: $MEMBER}
            - inside:
                stopBy: end
                kind: module
                has:
                    kind: class_definition
                    all:
                        - has: {field: name, pattern: $OWNER}
                        - has: {field: body, has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $MEMBER}}, {has: {field: right, matches: name-string}}]}}}
    relay-parameter:
        any:
            - {kind: identifier, pattern: $RELAY}
            - {kind: typed_parameter, has: {kind: identifier, pattern: $RELAY}}
            - {kind: 'default_parameter, typed_default_parameter', has: {field: name, pattern: $RELAY}}
    relay-owner:
        any:
            - {kind: function_definition, has: {field: name, pattern: $FN}}
            - {kind: lambda, inside: {kind: assignment, field: right, has: {field: left, pattern: $FN}}}
    relay-call:
        kind: call
        has: {field: function, any: [{kind: identifier, pattern: $FN}, {kind: attribute, has: {field: attribute, pattern: $FN}}]}
    relayed-name:
        kind: identifier
        pattern: $RELAY
        inside:
            stopBy: end
            all:
                - matches: relay-owner
                - any:
                    - has: {field: parameters, has: {kind: 'default_parameter, typed_default_parameter', all: [{has: {field: name, pattern: $RELAY}}, {has: {field: value, matches: name-string}}]}}
                    - all:
                        - has: {field: parameters, has: {matches: relay-parameter}}
                        - inside: {stopBy: end, kind: module, has: {stopBy: end, matches: relay-call, has: {field: arguments, has: {kind: keyword_argument, all: [{has: {field: name, pattern: $RELAY}}, {has: {field: value, matches: name-string}}]}}}}
                    - all:
                        - not: {inside: {kind: block, inside: {kind: class_definition}}}
                        - any:
                            - all:
                                - has: {field: parameters, has: {nthChild: 1, matches: relay-parameter}}
                                - inside: {stopBy: end, kind: module, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: identifier, pattern: $FN}}, {has: {field: arguments, has: {nthChild: 1, matches: name-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 2, matches: relay-parameter}}
                                - inside: {stopBy: end, kind: module, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: identifier, pattern: $FN}}, {has: {field: arguments, has: {nthChild: 2, matches: name-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 3, matches: relay-parameter}}
                                - inside: {stopBy: end, kind: module, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: identifier, pattern: $FN}}, {has: {field: arguments, has: {nthChild: 3, matches: name-string}}}]}}
                    - all:
                        - inside: {kind: block, inside: {kind: class_definition}}
                        - any:
                            - all:
                                - has: {field: parameters, has: {nthChild: 2, matches: relay-parameter}}
                                - inside: {stopBy: end, kind: module, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: attribute, has: {field: attribute, pattern: $FN}}}, {has: {field: arguments, has: {nthChild: 1, matches: name-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 3, matches: relay-parameter}}
                                - inside: {stopBy: end, kind: module, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: attribute, has: {field: attribute, pattern: $FN}}}, {has: {field: arguments, has: {nthChild: 2, matches: name-string}}}]}}
                            - all:
                                - has: {field: parameters, has: {nthChild: 4, matches: relay-parameter}}
                                - inside: {stopBy: end, kind: module, has: {stopBy: end, kind: call, all: [{has: {field: function, kind: attribute, has: {field: attribute, pattern: $FN}}}, {has: {field: arguments, has: {nthChild: 3, matches: name-string}}}]}}
    probe-name:
        any:
            - matches: name-string
            - matches: constant-name
            - matches: member-name
            - matches: relayed-name
    imported-entry:
        any:
            - {kind: aliased_import, has: {field: alias, pattern: $CALLEE}}
            - {kind: dotted_name, has: {kind: identifier, pattern: $CALLEE}}
        inside: {kind: import_from_statement, has: {field: module_name, regex: '^(builtins|inspect)$'}}
    module-binding:
        any:
            - kind: import_statement
              has: {kind: aliased_import, all: [{has: {field: name, regex: '^(builtins|inspect)$'}}, {has: {field: alias, pattern: $MODULE}}]}
            - kind: expression_statement
              has:
                kind: assignment
                all:
                    - has: {field: left, pattern: $MODULE}
                    - has: {field: right, regex: '^(builtins|__builtins__|inspect|__import__\(\s*[''"](builtins|inspect)[''"]\s*\))$'}
    module-member:
        kind: attribute
        all:
            - has: {field: object, kind: identifier, pattern: $MODULE}
            - inside: {stopBy: end, kind: 'module, block', has: {matches: module-binding}}
    default-reference:
        any:
            - {kind: identifier, regex: '^getattr$'}
            - {kind: attribute, regex: '^((builtins|__builtins__)\.getattr|inspect\.getattr_static)$'}
            - {kind: identifier, pattern: $CALLEE, inside: {stopBy: end, kind: module, has: {kind: import_from_statement, has: {matches: imported-entry, regex: '^getattr(_static)?\b'}}}}
            - {matches: module-member, has: {field: attribute, regex: '^getattr(_static)?$'}}
    boolean-reference:
        any:
            - {kind: identifier, regex: '^hasattr$'}
            - {kind: attribute, regex: '^(builtins|__builtins__)\.hasattr$'}
            - {kind: identifier, pattern: $CALLEE, inside: {stopBy: end, kind: module, has: {kind: import_from_statement, has: {matches: imported-entry, regex: '^hasattr\b'}}}}
            - {matches: module-member, has: {field: attribute, regex: '^hasattr$'}}
    default-callee:
        any:
            - matches: default-reference
            - {kind: identifier, pattern: $RENAMED, inside: {stopBy: end, kind: 'module, block', has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $RENAMED}}, {has: {field: right, matches: default-reference}}]}}}}
    boolean-callee:
        any:
            - matches: boolean-reference
            - {kind: identifier, pattern: $RENAMED, inside: {stopBy: end, kind: 'module, block', has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $RENAMED}}, {has: {field: right, matches: boolean-reference}}]}}}}
    partial-of-default:
        kind: call
        all:
            - has: {field: function, regex: '^(functools\.)?partial$'}
            - has: {field: arguments, has: {nthChild: 1, matches: default-callee}}
    partial-of-boolean:
        kind: call
        all:
            - has: {field: function, regex: '^(functools\.)?partial$'}
            - has: {field: arguments, has: {nthChild: 1, matches: boolean-callee}}
    object-partial-default:
        any:
            - {matches: partial-of-default, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}
            - {kind: identifier, pattern: $RENAMED, inside: {stopBy: end, kind: 'module, block', has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $RENAMED}}, {has: {field: right, matches: partial-of-default, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}}]}}}}
    name-partial-default:
        any:
            - {matches: partial-of-default, has: {field: arguments, has: {nthChild: 3, matches: probe-name}, not: {has: {nthChild: 4}}}}
            - {kind: identifier, pattern: $RENAMED, inside: {stopBy: end, kind: 'module, block', has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $RENAMED}}, {has: {field: right, matches: partial-of-default, has: {field: arguments, has: {nthChild: 3, matches: probe-name}, not: {has: {nthChild: 4}}}}}]}}}}
    object-partial-boolean:
        any:
            - {matches: partial-of-boolean, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}
            - {kind: identifier, pattern: $RENAMED, inside: {stopBy: end, kind: 'module, block', has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $RENAMED}}, {has: {field: right, matches: partial-of-boolean, has: {field: arguments, has: {nthChild: 2}, not: {has: {nthChild: 3}}}}}]}}}}
    cast-reference:
        kind: identifier
        all:
            - inside: {stopBy: end, kind: module, has: {any: [{kind: import_statement, regex: '\btyping(_extensions)?\b'}, {kind: import_from_statement, has: {field: module_name, regex: '^typing(_extensions)?$'}}]}}
            - pattern: $RENAMED
            - inside: {stopBy: end, kind: 'module, block', has: {kind: expression_statement, has: {kind: assignment, all: [{has: {field: left, pattern: $RENAMED}}, {has: {field: right, regex: '^(\w+\.)?cast$'}}]}}}
    getmembers-callee:
        any:
            - {kind: identifier, regex: '^getmembers(_static)?$'}
            - {kind: attribute, regex: '^inspect\.getmembers(_static)?$'}
            - {matches: module-member, has: {field: attribute, regex: '^getmembers(_static)?$'}}
    namespace:
        any:
            - {kind: call, all: [{has: {field: function, regex: '^(builtins\.)?vars$'}}, {has: {field: arguments, has: {nthChild: 1}}}]}
            - {kind: attribute, has: {field: attribute, regex: '^__dict__$'}}
            - {kind: call, all: [{has: {field: function, regex: '^dict$'}}, {has: {field: arguments, has: {nthChild: 1, kind: call, has: {field: function, matches: getmembers-callee}}}}]}
    name-comparison:
        kind: comparison_operator
        all:
            - has: {field: operators, regex: '^==$'}
            - has: {matches: name-string}
    handler-names:
        kind: except_clause
        not: {has: {kind: block, has: {kind: raise_statement}}}
    broad-handler:
        matches: handler-names
        any:
            - not: {has: {field: value, regex: '.'}}
            - has: {field: value, any: [{regex: '^(Exception|BaseException)$'}, {has: {stopBy: end, kind: identifier, regex: '^(Exception|BaseException)$', not: {inside: {kind: as_pattern_target}}}}]}
    key-handler:
        matches: handler-names
        any:
            - not: {has: {field: value, regex: '.'}}
            - has: {field: value, any: [{regex: '^(KeyError|LookupError|Exception|BaseException)$'}, {has: {stopBy: end, kind: identifier, regex: '^(KeyError|LookupError|Exception|BaseException)$', not: {inside: {kind: as_pattern_target}}}}]}
    suppress-call:
        kind: call
        has: {field: function, regex: '^(contextlib\.)?suppress$'}
    broad-answer:
        any:
            - inside: {stopBy: end, kind: try_statement, field: body, has: {matches: broad-handler}}
            - inside: {stopBy: end, kind: with_statement, field: body, has: {kind: with_clause, has: {kind: with_item, has: {field: value, matches: suppress-call, has: {field: arguments, has: {regex: '^(Exception|BaseException)$'}}}}}}
    key-answer:
        any:
            - inside: {stopBy: end, kind: try_statement, field: body, has: {matches: key-handler}}
            - inside: {stopBy: end, kind: with_statement, field: body, has: {kind: with_clause, has: {kind: with_item, has: {field: value, matches: suppress-call, has: {field: arguments, has: {regex: '^(KeyError|LookupError|Exception|BaseException)$'}}}}}}
rule:
    any:
        - kind: call
          pattern: $PROBE
          all:
            - has: {field: function, kind: attribute, all: [{has: {field: attribute, regex: '^(get|setdefault)$'}}, {has: {field: object, matches: namespace}}]}
            - has: {field: arguments, has: {nthChild: 1, matches: probe-name}}
        - kind: subscript
          pattern: $PROBE
          all:
            - has: {field: value, matches: namespace}
            - matches: key-answer
            - has: {field: subscript, matches: probe-name}
        - kind: class_pattern
          pattern: $PROBE
          all:
            - has: {kind: dotted_name, regex: '^(builtins\.)?object$'}
            - has: {kind: case_pattern, has: {kind: keyword_pattern}}
        - kind: dict_pattern
          pattern: $PROBE
          all:
            - has: {field: key, matches: name-string}
            - inside: {stopBy: {kind: match_statement}, kind: match_statement, has: {field: subject, matches: namespace}}
        - kind: call
          pattern: $PROBE
          all:
            - has: {field: arguments, has: {nthChild: 3}}
            - has: {field: function, matches: default-callee}
            - has: {field: arguments, has: {nthChild: 2, matches: probe-name}}
        - kind: call
          pattern: $PROBE
          all:
            - has: {field: arguments, has: {nthChild: 2}}
            - has: {field: function, matches: boolean-callee}
            - has: {field: arguments, has: {nthChild: 2, matches: probe-name}}
        - kind: call
          pattern: $PROBE
          all:
            - has: {field: arguments, has: {nthChild: 1}}
            - any:
                - all:
                    - has: {field: arguments, has: {nthChild: 2}}
                    - has: {field: function, matches: object-partial-default}
                    - has: {field: arguments, has: {nthChild: 1, matches: probe-name}}
                - has: {field: function, matches: name-partial-default}
                - all:
                    - has: {field: function, matches: object-partial-boolean}
                    - has: {field: arguments, has: {nthChild: 1, matches: probe-name}}
                - all:
                    - has: {field: arguments, has: {nthChild: 4}}
                    - matches: partial-of-default
                    - has: {field: arguments, has: {nthChild: 3, matches: probe-name}}
                - all:
                    - has: {field: arguments, has: {nthChild: 3}}
                    - matches: partial-of-boolean
                    - has: {field: arguments, has: {nthChild: 3, matches: probe-name}}
        - kind: call
          pattern: $PROBE
          all:
            - any:
                - all:
                    - has: {field: function, kind: attribute, has: {field: attribute, regex: '^__getattribute__$'}}
                    - has: {field: arguments, has: {matches: probe-name}}
                - all:
                    - has: {field: function, regex: '^(operator\.)?attrgetter$'}
                    - has: {field: arguments, has: {nthChild: 1, matches: probe-name}}
                - all:
                    - has: {field: arguments, has: {nthChild: 2}}
                    - has: {field: function, any: [{matches: default-callee}, {matches: boolean-callee}]}
                    - has: {field: arguments, has: {nthChild: 2, matches: probe-name}}
            - matches: broad-answer
        - kind: call
          pattern: $PROBE
          all:
            - has: {field: function, matches: getmembers-callee}
            - any:
                - inside: {kind: for_in_clause, field: right, all: [{has: {field: left, has: {nthChild: 1, kind: identifier, pattern: $MEMBER}}}, {inside: {kind: 'list_comprehension, set_comprehension, dictionary_comprehension, generator_expression', has: {kind: if_clause, has: {stopBy: end, matches: name-comparison, has: {pattern: $MEMBER}}}}}]}
                - inside: {kind: for_statement, field: right, all: [{has: {field: left, has: {nthChild: 1, kind: identifier, pattern: $MEMBER}}}, {has: {field: body, has: {stopBy: end, matches: name-comparison, has: {pattern: $MEMBER}}}}]}
                - inside: {kind: argument_list, inside: {kind: call, has: {field: function, regex: '^filter$'}}, has: {kind: lambda, has: {field: body, matches: name-comparison}}}
        - kind: call
          pattern: $PROBE
          has: {field: function, matches: cast-reference}
        - kind: comparison_operator
          pattern: $PROBE
          all:
            - has: {field: operators, regex: '^(not\s+)?in$'}
            - has: {nthChild: {position: 1, reverse: true}, kind: call, has: {field: function, regex: '^(builtins\.)?dir$'}}
            - has: {nthChild: 1, matches: probe-name}
        - kind: identifier
          regex: '^AttributeError$'
          pattern: $PROBE
          any:
            - inside: {kind: except_clause, field: value}
            - inside: {kind: 'tuple, parenthesized_expression, as_pattern', inside: {kind: except_clause, field: value}}
            - inside: {kind: 'tuple, parenthesized_expression', inside: {kind: as_pattern, inside: {kind: except_clause, field: value}}}
            - inside: {kind: argument_list, inside: {matches: suppress-call}}
          not: {inside: {stopBy: {kind: except_clause}, kind: except_clause, has: {kind: block, has: {kind: raise_statement}}}}
message: '`$PROBE` answers a missing attribute in place of the type that declares it'
note: 'Read the attribute on the type that declares it, and select that type with `isinstance` or a class pattern'
