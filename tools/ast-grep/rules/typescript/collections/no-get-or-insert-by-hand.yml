# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-get-or-insert-by-hand
language: tsx
severity: error
ignores:
    - libs/typescript/creative-cloud/indesign/**
    - libs/typescript/creative-cloud/uxp/**
utils:
    absent:
        any:
            - kind: unary_expression
              pattern: '!$MAP.has($KEY)'
            - kind: binary_expression
              any: [{pattern: '$MAP.get($KEY) === undefined'}, {pattern: 'undefined === $MAP.get($KEY)'}]
rule:
    any:
        - kind: binary_expression
          any:
            - pattern: '$MAP.get($KEY) ?? ($MAP.set($KEY, $VALUE), $VALUE)'
            - pattern: '$MAP.get($KEY) ?? $MAP.set($KEY, $VALUE).get($KEY)'
        - kind: expression_statement
          pattern: $STATEMENT
          has:
            nthChild: 1
            any:
                - pattern: '$MAP.has($KEY) || $MAP.set($KEY, $VALUE)'
                - pattern: '!$MAP.has($KEY) && $MAP.set($KEY, $VALUE)'
        - kind: if_statement
          pattern: $STATEMENT
          all:
            - has: {field: condition, has: {nthChild: 1, matches: absent}}
            - not: {has: {field: alternative, kind: else_clause}}
            - has:
                field: consequence
                any:
                    - kind: expression_statement
                    - kind: statement_block
                      has: {kind: expression_statement}
                      not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
                has: {stopBy: {kind: call_expression}, kind: call_expression, pattern: '$MAP.set($KEY, $VALUE)'}
    has: {stopBy: end, kind: member_expression, has: {field: object, pattern: $MAP, matches: {typescript-collection-receiver: {collection: {regex: '^(Map|WeakMap)$'}}}}}
transform:
    TERMINATOR: {replace: {source: $STATEMENT, replace: '(?s)^.*$', by: ';'}}
fix: $MAP.getOrInsertComputed($KEY, () => $VALUE)$TERMINATOR
message: '`$MAP.set` inserts under `$KEY` behind its own membership test'
note: 'Call `<map>.getOrInsertComputed(<key>, () => <value>)`, or `<map>.getOrInsert(<key>, <value>)` for a value that costs nothing to evaluate'
