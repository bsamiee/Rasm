id: sql-table
language: sql
role: item
symbolType: struct
rule:
    kind: create_table
    pattern: _DECLARATION
    has: {kind: object_reference, pattern: _NAME}
rewriters:
    - id: body
      rule: {kind: 'column_definitions, create_query'}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    JOINED: {replace: {source: $HEADER, replace: '\s+', by: ' '}}
    SIGNATURE: {replace: {source: $JOINED, replace: '(?i)\s*(\bas)?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
---
id: sql-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table]
rule:
    kind: column_definition
    pattern: _DECLARATION
    has: {field: name, pattern: _NAME}
    inside: {kind: column_definitions, inside: {kind: create_table}}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
---
id: sql-view
language: sql
role: item
