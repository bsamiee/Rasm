# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-module-use
language: python
arguments: [module]
rule:
    any:
        - kind: dotted_name
          matches: module
          any:
            - inside: {kind: import_statement}
            - inside: {kind: aliased_import, field: name, inside: {kind: import_statement}}
            - inside: {kind: import_from_statement, field: module_name}
        - kind: attribute
          matches: {python-module-member: {module: {matches: module}, name: {kind: identifier}}}
          not: {inside: {kind: attribute, field: object}}
