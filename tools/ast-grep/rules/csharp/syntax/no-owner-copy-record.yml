# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-owner-copy-record
language: csharplang
severity: error
utils:
    owner-value:
        kind: identifier
        pattern: $VALUE
        inside:
            stopBy: {kind: &owner-type 'class_declaration, record_declaration, struct_declaration'}
            kind: *owner-type
            any:
                - has: {field: body, has: {kind: property_declaration, has: {field: name, pattern: $VALUE}}}
                - has: {field: body, has: {kind: field_declaration, has: {kind: variable_declaration, has: {kind: variable_declarator, has: {field: name, pattern: $VALUE}}}}}
                - has: {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $VALUE}}}
    copied-value:
        any:
            - matches: owner-value
            - kind: member_access_expression
              all:
                - has: {field: expression, regex: '^this$'}
                - has: {field: name, matches: owner-value}
    copy:
        kind: 'object_creation_expression, implicit_object_creation_expression'
        has:
            kind: argument_list
            all:
                - has: {kind: argument, nthChild: 2}
                - not: {has: {kind: argument, not: {has: {nthChild: 1, matches: copied-value}}}}
rule:
    kind: 'property_declaration, method_declaration'
    all:
        - has: {field: name, pattern: $NAME}
        - not: {has: {kind: modifier, regex: '^override$'}}
        - any:
            - has: {field: type, pattern: $TYPE}
            - has: {field: returns, pattern: $TYPE}
        - not: {inside: {stopBy: {kind: *owner-type}, kind: *owner-type, has: {field: name, pattern: $TYPE}}}
        - not:
            inside:
                stopBy: {kind: *owner-type}
                kind: *owner-type
                any:
                    - has: {kind: parameter_list, has: {kind: parameter, has: {kind: attribute_list}}}
                    - has: {field: body, has: {kind: property_declaration, has: {kind: attribute_list}}}
        - not:
            inside:
                stopBy: end
                kind: compilation_unit
                has:
                    stopBy: end
                    kind: object_creation_expression
                    all:
                        - has: {field: type, pattern: $TYPE}
                        - not: {inside: {stopBy: end, kind: 'method_declaration, property_declaration', has: {field: name, pattern: $NAME}}}
        - has: {kind: arrow_expression_clause, has: {nthChild: 1, matches: copy}}
message: '`$NAME` builds `$TYPE` from members of its owner alone'
note: 'Declare each member on one record and delete the copy, an attributed parameter record maps through Mapperly'
