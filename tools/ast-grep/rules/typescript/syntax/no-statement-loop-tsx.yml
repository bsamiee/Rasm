# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-statement-loop-tsx
language: tsx
severity: error
rule:
    pattern: $LOOP
    any:
        - kind: for_in_statement
          has: {field: operator, regex: '^of$'}
          not: {has: {regex: '^await$'}}
        - kind: for_statement, while_statement, do_statement
message: Loop iterates by statement
note: 'Call `<list>.map(<f>)`, `<list>.flatMap(<f>)`, or `<list>.reduce(<f>, <initial>)` for values from elements, the same iterator helpers on `Iterator.from(<iterable>)` for an iterable, `effect` `Array.unfold(<state>, <step>)` for values while a state advances, `Effect.forEach(<list>, <f>)` for an effect per element, `Effect.whileLoop` for an effect per state step, or `<list>.forEach(<f>)` for a host call per element outside the runtime'
labels:
    LOOP: {style: primary}
