# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Report only, the tagged error needs a class the file lacks, the probe fails with TS2304 Cannot find name 'LoadError'
id: no-literal-failure
language: tsx
severity: error
# A spec fails with a literal to drive the recovery under test
ignores: ['**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
utils:
    # Failure value no tag names, a literal in any spelling, a cast over one, or an untagged Error
    untagged-error:
        any:
            - kind: string, number, true, false, null, undefined, regex
            - kind: unary_expression
              regex: '^[+-]'
              has: {field: argument, kind: number}
            - kind: template_string
            - kind: as_expression
              has: {matches: untagged-error}
            - kind: new_expression
              has: {field: constructor, matches: syntax-global-reference, regex: '^(globalThis\.)?(Error|TypeError|RangeError|SyntaxError|ReferenceError|EvalError|URIError|AggregateError)$'}
    # A returned error belongs to this callback; nested callbacks do not supply its result.
    untagged-thunk:
        any: [{kind: arrow_function}, {kind: function_expression}]
        has:
            field: body
            any:
                - matches: untagged-error
                  pattern: $ERROR
                - kind: statement_block
                  has:
                    kind: return_statement
                    has: {matches: untagged-error, pattern: $ERROR}
                    stopBy: {kind: 'arrow_function, function_expression, generator_function, function_declaration, generator_function_declaration, method_definition'}
rule:
    kind: call_expression
    any:
        # Strict constructors receive the error value; Config.fail receives a message instead.
        - all:
            - has:
                field: function
                kind: member_expression
                pattern: $FAIL
                any:
                    - all:
                        - has: {field: property, regex: '^fail$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro|STM|Stream|Layer|Channel|Sink|Exit|Cause|Deferred|TDeferred|Request|Fiber|Take)$'}}}}
                    - all:
                        - has: {field: property, regex: '^left$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Either$'}}}}
            - has: {field: arguments, has: {matches: untagged-error, pattern: $ERROR}}
        # Lazy constructors and error mappers receive a callback that returns the error.
        - all:
            - has:
                field: function
                kind: member_expression
                pattern: $FAIL
                any:
                    - all:
                        - has: {field: property, regex: '^failSync$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro|STM|Stream|Layer|Channel|Sink|Deferred)$'}}}}
                    - all:
                        - has: {field: property, regex: '^orElseFail$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|STM|Stream)$'}}}}
                    - all:
                        - has: {field: property, regex: '^mapError$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?(Effect|Micro|STM|Stream|Layer|Channel|Sink|Exit)$'}}}}
                    - all:
                        - has: {field: property, regex: '^(mapLeft|fromOption)$'}
                        - has: {field: object, matches: {effect-module-reference: {module: {regex: '^(effect/)?Either$'}}}}
            - has: {field: arguments, has: {matches: untagged-thunk}}
message: '`$FAIL` fails with `$ERROR`, a value no tag names'
note: Fail with a tagged error, `Effect.fail(new LoadError({ path }))` over a `Data.TaggedError` class, and recover it by tag with `Effect.catchTag`
