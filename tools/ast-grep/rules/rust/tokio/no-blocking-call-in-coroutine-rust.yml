# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-blocking-call-in-coroutine-rust
language: rust
severity: error
files: ['libs/rust/**', 'tools/bridge/**']
utils:
    std-path:
        kind: scoped_identifier
        pattern: $CALLEE
        any:
            - regex: |-
                (?x)^(::)?(
                std::thread::(park|park_timeout)
                |futures::executor::block_on
                |std::fs::(\w+|File::(open|create|create_new))
                |std::io::(stdin|stdout|stderr|read_to_string|copy|(Read|Write|BufRead|Seek)::\w+)
                )$
            - all:
                - regex: '^(thread::(park|park_timeout)|executor::block_on|fs::(\w+|File::(open|create|create_new))|File::(open|create|create_new)|io::(stdin|stdout|stderr|read_to_string|copy|(Read|Write|BufRead|Seek)::\w+)|(Read|Write|BufRead|Seek)::\w+)$'
                - has: {stopBy: end, field: path, kind: identifier, matches: {rust-imported-name: {root: {regex: '^(std|futures)$'}, item: {regex: '^(thread|executor|fs|File|io|Read|Write|BufRead|Seek)$'}}}}
    imported-function:
        kind: identifier
        pattern: $CALLEE
        any:
            - matches: {rust-imported-name: {root: {regex: '^std$'}, item: {regex: '^(park|park_timeout|read_to_string|copy|read_dir|read_link|rename|remove_file|remove_dir|remove_dir_all|create_dir|create_dir_all|metadata|symlink_metadata|canonicalize|hard_link|set_permissions|stdin|stdout|stderr)$'}}}
            - matches: {rust-imported-name: {root: {regex: '^futures$'}, item: {regex: '^block_on$'}}}
    opener:
        kind: call_expression
        has:
            field: function
            any:
                - kind: scoped_identifier
                  any:
                    - regex: '^(::)?(std::fs::File::(open|create|create_new)|std::io::(stdin|stdout|stderr))$'
                    - all:
                        - regex: '^((fs::)?File::(open|create|create_new)|io::(stdin|stdout|stderr))$'
                        - has: {stopBy: end, field: path, kind: identifier, matches: {rust-imported-name: {root: {regex: '^std$'}, item: {regex: '^(fs|File|io)$'}}}}
                - kind: identifier
                  matches: {rust-imported-name: {root: {regex: '^std$'}, item: {regex: '^(stdin|stdout|stderr)$'}}}
                - kind: field_expression
                  all:
                    - has: {field: field, regex: '^open$'}
                    - has: {field: value, regex: '^((std::)?fs::)?(OpenOptions::new|File::options)\(\)'}
    std-handle-type:
        any:
            - regex: '(^|[^\w:])(std::)?(fs::File|io::(Stdin|Stdout|Stderr)(Lock)?|net::(TcpStream|TcpListener|UdpSocket))\b'
            - kind: type_identifier
              matches: {rust-imported-name: {root: {regex: '^std$'}, item: {regex: '^(File|Stdin|Stdout|Stderr|StdinLock|StdoutLock|StderrLock|TcpStream|TcpListener|UdpSocket)$'}}}
            - has: {stopBy: end, kind: type_identifier, matches: {rust-imported-name: {root: {regex: '^std$'}, item: {regex: '^(File|Stdin|Stdout|Stderr|StdinLock|StdoutLock|StderrLock|TcpStream|TcpListener|UdpSocket)$'}}}}
    std-handle:
        any:
            - matches: opener
            - kind: identifier
              pattern: $HANDLE
              inside:
                kind: 'function_item, closure_expression'
                stopBy: end
                any:
                    - has: {field: parameters, has: {kind: parameter, all: [{has: {field: pattern, any: [{pattern: $HANDLE}, {kind: mut_pattern, has: {pattern: $HANDLE}}]}}, {has: {field: type, matches: std-handle-type}}]}}
                    - has: {field: body, has: {stopBy: end, kind: let_declaration, all: [{has: {field: pattern, any: [{pattern: $HANDLE}, {kind: mut_pattern, has: {pattern: $HANDLE}}]}}, {any: [{has: {field: type, matches: std-handle-type}}, {has: {field: value, any: [{matches: opener}, {has: {stopBy: end, matches: opener}}]}}]}]}}
    blocking-method:
        kind: field_expression
        any:
            - has: {field: field, regex: '^(block_on|blocking_(recv|recv_many|send|lock|lock_owned|read|write))$', pattern: $CALLEE}
            - all:
                - has: {field: field, regex: '^open$', pattern: $CALLEE}
                - has: {field: value, regex: '^((std::)?fs::)?(OpenOptions::new|File::options)\(\)'}
            - all:
                - has: {field: field, regex: '^(read|read_to_end|read_to_string|read_exact|read_line|read_until|lines|bytes|write|write_all|write_fmt|flush|seek|sync_all|sync_data|set_len|lock)$', pattern: $CALLEE}
                - not: {inside: {kind: call_expression, inside: {kind: await_expression}}}
                - has: {field: value, matches: std-handle}
    blocking-callee:
        any:
            - matches: std-path
            - matches: blocking-method
            - kind: generic_function
              has: {field: function, any: [{matches: std-path}, {matches: imported-function}]}
            - matches: imported-function
    async-closure:
        kind: closure_expression
        regex: '^(static\s+)?async\b'
    offloaded-closure:
        kind: closure_expression
        inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|::|\.)(spawn|spawn_blocking|spawn_blocking_on|block_in_place|scope|install)$'}}}
    offloader-closure:
        kind: closure_expression
        inside:
            kind: arguments
            inside:
                kind: call_expression
                has:
                    field: function
                    kind: identifier
                    pattern: $OFFLOAD
                    inside:
                        kind: source_file
                        stopBy: end
                        has:
                            stopBy: end
                            kind: function_item
                            all:
                                - has: {field: name, pattern: $OFFLOAD}
                                - has: {field: body, has: {stopBy: end, kind: call_expression, has: {field: function, regex: '(^|::)spawn_blocking$'}}}
    async-scope:
        inside:
            stopBy: {any: [{kind: 'function_item, async_block'}, {matches: async-closure}, {matches: offloaded-closure}]}
            any:
                - kind: async_block
                - kind: function_item
                  has: {kind: function_modifiers, regex: '\basync\b'}
                - matches: async-closure
rule:
    kind: call_expression
    all:
        - has: {field: function, matches: blocking-callee}
        - matches: async-scope
        - not: {inside: {stopBy: {any: [{kind: 'function_item, async_block'}, {matches: async-closure}]}, matches: offloader-closure}}
message: '`$CALLEE` blocks the runtime worker thread polling an async body'
note: 'Await the Tokio counterpart (`tokio::fs`, `tokio::io::{stdin, stdout, stderr, copy}`, `AsyncReadExt` and `AsyncWriteExt` methods of `tokio::fs::File`, the `async` method beside each `blocking_*`, the future `block_on` wraps) or run the blocking body in `tokio::task::spawn_blocking(move || ..).await`'
