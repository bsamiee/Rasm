# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores:
    - libs/typescript/creative-cloud/indesign/**
    - libs/typescript/creative-cloud/uxp/**
utils:
    syntax-class:
        kind: regex
        all:
            - has: {field: flags, regex: '^[dimsuv]*g[dimsuv]*$'}
            - has:
                field: pattern
                all:
                    - regex: '^\[(?:[^\\\]^\p{L}\p{N}[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]]|\\[^\p{L}\p{N}[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]])(?:[^\\\]\p{L}\p{N}[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]]|\\[^\p{L}\p{N}[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]])*\]$'
                    - regex: '\.'
                    - regex: '\*'
                    - regex: '\+'
                    - regex: '\?'
                    - regex: '\$'
                    - regex: '\{'
                    - regex: '\}'
                    - regex: '\('
                    - regex: '\)'
                    - regex: '\|'
                    - regex: '^\[.+\^'
                    - regex: '^\[.+\['
                    - regex: '^\[(?:[^\\\]]|\\.)*\\\]'
                    - regex: '^\[(?:[^\\\]]|\\.)*\\\\'
    escaped-pattern:
        any:
            - matches: syntax-class
            - matches: {typescript-constant-value: {value: {matches: syntax-class}}}
    prefixed-match:
        any:
            - kind: template_string
              regex: '^`\\\\\$\{[^}]*\}`$'
              has: {kind: template_substitution, has: {pattern: $MATCH}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^\+$'}
                - has: {field: left, kind: string, regex: '^[''"]\\\\[''"]$'}
                - has: {field: right, pattern: $MATCH}
    escaping-replacement:
        any:
            - kind: string, template_string
              regex: '^[''"`]\\\\\$&[''"`]$'
            - kind: arrow_function, function_expression
              all:
                - any:
                    - has: {field: parameter, kind: identifier, pattern: $MATCH}
                    - has: {field: parameters, has: {kind: required_parameter, nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, has: {field: pattern, kind: identifier, pattern: $MATCH}}}
                - any:
                    - has: {field: body, matches: prefixed-match}
                    - has:
                        field: body
                        kind: statement_block
                        all:
                            - has: {kind: return_statement, nthChild: {position: 1, ofRule: *code}, has: {matches: prefixed-match}}
                            - not: {has: {nthChild: {position: 2, ofRule: *code}}}
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^replace(All)?$'}}
        - has:
            field: arguments
            all:
                - not: {has: {nthChild: {position: 3, ofRule: *code}}}
                - has: {nthChild: {position: 2, ofRule: *code}, matches: escaping-replacement}
                - has: {nthChild: {position: 1, ofRule: *code}, matches: escaped-pattern}
        - any:
            - has: {field: function, has: {field: object, matches: {effect-module: {name: {regex: '(?-u:\b)String$'}}}}}
            - has: {field: function, not: {has: {kind: optional_chain}}, has: {field: object, pattern: $_}}
    not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
transform:
    HEAD: {replace: {source: $CALL, replace: '(?s)^([^(]+)\(.*$', by: '$1'}}
message: '`$HEAD` escapes regular expression syntax characters by hand'
note: 'Call `RegExp.escape(<text>)`'
