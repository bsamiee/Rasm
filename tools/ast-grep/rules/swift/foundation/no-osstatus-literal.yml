# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-osstatus-literal
language: swift
severity: error
utils:
    status-literal:
        any:
            - kind: integer_literal
            - kind: hex_literal
            - kind: prefix_expression
              has: {field: target, any: [{kind: integer_literal}, {kind: hex_literal}]}
rule:
    pattern: $SITE
    any:
        - kind: property_declaration
          all:
            - has: {kind: type_annotation, has: {field: name, regex: '^(OSStatus|OSErr)$'}}
            - has: {field: value, matches: status-literal}
        - kind: call_expression
          all:
            - has: {nthChild: 1, regex: '^(OSStatus|OSErr)$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, not: {has: {field: name, kind: value_argument_label}}, has: {field: value, matches: status-literal}}}}
message: '`$SITE` restates an SDK status code as a literal'
note: 'Name the SDK constant (`errSecItemNotFound`, `noErr`), `import Security` declares the `errSec` codes'
