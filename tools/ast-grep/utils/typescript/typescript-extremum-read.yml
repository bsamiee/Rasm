# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-extremum-read
language: tsxlang
rule:
    any:
        - inside: {kind: subscript_expression, field: object, has: {field: index, regex: '^0$'}}
        - inside:
            kind: member_expression
            field: object
            has: {field: property, regex: '^at$'}
            inside: {kind: call_expression, field: function, has: {field: arguments, regex: '^\([\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*(0|-1)[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\)$'}}
        - inside:
            kind: subscript_expression
            field: object
            has:
                field: index
                kind: binary_expression
                all:
                    - has: {field: operator, regex: '^-$'}
                    - has: {field: right, regex: '^1$'}
                    - has: {field: left, kind: member_expression, has: {field: property, regex: '^length$'}}
