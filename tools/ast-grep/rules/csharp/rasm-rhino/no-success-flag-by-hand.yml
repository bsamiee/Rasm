# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-success-flag-by-hand
language: csharp
severity: error
files: ['**/rhino/**']
utils:
    always:
        any:
            - kind: boolean_literal
              regex: '^true$'
            - matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}
            - kind: invocation_expression
              all:
                - has: {field: function, matches: {csharp-type-name: {name: {regex: '^constant$'}}}}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, regex: '^true$'}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    never:
        any:
            - kind: boolean_literal
              regex: '^false$'
            - matches: {csharp-constant-lambda: {value: {regex: '^false$'}}}
            - kind: invocation_expression
              all:
                - has: {field: function, matches: {csharp-type-name: {name: {regex: '^constant$'}}}}
                - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, regex: '^false$'}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    pure-true:
        kind: lambda_expression
        all:
            - has: {field: parameters, any: [{kind: implicit_parameter}, {kind: parameter_list, all: [{has: {kind: parameter}}, {not: {has: {kind: parameter, nthChild: 2}}}]}]}
            - has: {field: body, kind: invocation_expression, all: [{has: {field: function, matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^pure$'}}}}}, {has: {field: arguments, regex: '^\(\s*true\s*\)$'}}]}
    pure-false:
        kind: lambda_expression
        all:
            - has: {field: parameters, any: [{kind: implicit_parameter}, {kind: parameter_list, all: [{has: {kind: parameter}}, {not: {has: {kind: parameter, nthChild: 2}}}]}]}
            - has: {field: body, kind: invocation_expression, all: [{has: {field: function, matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^pure$'}}}}}, {has: {field: arguments, regex: '^\(\s*false\s*\)$'}}]}
    true-mapped:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Map|Select|Bind)$'}}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 2}}
                    - has: {kind: argument, nthChild: 1, has: {any: [{matches: always}, {matches: pure-true}]}}
            - not: {all: [{has: {field: function, has: {field: name, regex: '^Bind$'}}}, {not: {has: {field: arguments, has: {kind: argument, has: {matches: pure-true}}}}}]}
            - not: {all: [{has: {field: function, has: {field: name, regex: '^(Map|Select)$'}}}, {has: {field: arguments, has: {kind: argument, has: {matches: pure-true}}}}]}
    false-mapped:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Map|Select|Bind)$'}}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 2}}
                    - has: {kind: argument, nthChild: 1, has: {any: [{matches: never}, {matches: pure-false}]}}
            - not: {all: [{has: {field: function, has: {field: name, regex: '^Bind$'}}}, {not: {has: {field: arguments, has: {kind: argument, has: {matches: pure-false}}}}}]}
            - not: {all: [{has: {field: function, has: {field: name, regex: '^(Map|Select)$'}}}, {has: {field: arguments, has: {kind: argument, has: {matches: pure-false}}}}]}
    inverted:
        matches: false-mapped
        has: {field: function, has: {field: expression, pattern: $EFFECT}}
    direct-slot:
        any:
            - matches: effect-slot
            - kind: parenthesized_expression
              has: {matches: direct-slot}
    inverted-slot:
        any:
            - matches: inverted
            - kind: parenthesized_expression
              has: {matches: inverted-slot}
    failed-true:
        matches: {csharp-constant-lambda: {value: {regex: '^true$'}}}
    lifted-true:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^lift$'}}}}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 2}}
                    - has:
                        kind: argument
                        nthChild: 1
                        has:
                            kind: lambda_expression
                            pattern: $LIFTED
                            all:
                                - has: {field: parameters, kind: parameter_list, not: {has: {kind: parameter}}}
                                - has:
                                    field: body
                                    kind: block
                                    all:
                                        - has: {kind: return_statement, nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}, regex: '^return\s+true\s*;$'}
                                        - not: {has: {stopBy: {kind: 'lambda_expression, local_function_statement, anonymous_method_expression'}, kind: return_statement, not: {regex: '^return\s+true\s*;$'}}}
                                        - has: {nthChild: 2, not: {kind: comment}}
                                        - not: {has: {stopBy: end, kind: 'lambda_expression, anonymous_method_expression, local_function_statement'}}
    flagged:
        any:
            - matches: true-mapped
              has: {field: function, has: {field: expression, pattern: $EFFECT}}
            - kind: query_expression
              all:
                - has: {kind: from_clause, nthChild: 1, has: {nthChild: {position: 1, reverse: true}, pattern: $EFFECT}}
                - has: {kind: select_clause, nthChild: 2, has: {kind: boolean_literal, regex: '^true$'}}
                - not: {has: {nthChild: 3}}
            - matches: lifted-true
    optional-slot-map:
        kind: invocation_expression
        pattern: $MAPPED
        all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Map|Select)$'}}
            - has:
                field: arguments
                all:
                    - not: {has: {kind: argument, nthChild: 2}}
                    - has: {kind: argument, nthChild: 1, has: {kind: lambda_expression, has: {field: body, not: {not: {matches: flagged}}}}}
    held:
        kind: identifier
        pattern: $LOCAL
    effect-slot:
        any:
            - matches: flagged
            - kind: parenthesized_expression
              has: {matches: effect-slot}
    lazy-slot:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-type-name: {name: {regex: '^Some$'}}}}
            - has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, has: {matches: effect-slot}}}, {not: {has: {kind: argument, nthChild: 2}}}]}
    failed-false:
        matches: {csharp-constant-lambda: {value: {any: [{regex: '^false$'}, {kind: default_expression}]}}}
    constant-absent:
        matches: {csharp-constant-lambda: {value: {kind: 'boolean_literal, default_expression'}}}
    slot:
        kind: argument
        any:
            - all:
                - not: {has: {field: name, kind: identifier}}
                - nthChild: 1
            - has: {field: name, regex: '^effect$'}
    site-slot:
        kind: argument
        all:
            - any:
                - all: [{not: {has: {field: name, kind: identifier}}}, {nthChild: {position: 1, reverse: true}}]
                - has: {field: name, regex: '^site$'}
            - has: {nthChild: {position: 1, reverse: true}, pattern: $SITE}
    failed-slot:
        kind: argument
        any:
            - all: [{not: {has: {field: name, kind: identifier}}}, {nthChild: {position: 2, reverse: true}}, {not: {nthChild: 1}}]
            - has: {field: name, regex: '^failed$'}
    absent-slot:
        kind: argument
        any:
            - all: [{not: {has: {field: name, kind: identifier}}}, {nthChild: 2}, {nthChild: {position: 3, reverse: true}}]
            - has: {field: name, regex: '^absent$'}
    answer:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Callbacks$'}, member: {regex: '^Answer$'}}}}
            - has:
                field: arguments
                all:
                    - has: {matches: site-slot}
                    - has: {kind: argument, nthChild: 3}
                    - not: {has: {kind: argument, nthChild: 5}}
                    - any:
                        - all:
                            - has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: optional-slot-map}}
                            - has: {matches: failed-slot, has: {matches: failed-false}}
                        - all:
                            - has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: direct-slot}}
                            - has: {matches: failed-slot, has: {matches: failed-false}}
                        - all:
                            - has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: inverted-slot}}
                            - has: {matches: failed-slot, has: {matches: failed-true}}
                        - all:
                            - has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: lazy-slot}}
                            - has: {matches: failed-slot, has: {matches: failed-false}}
                        - all:
                            - has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: held}}
                            - has: {matches: failed-slot, has: {matches: failed-false}}
                            - inside:
                                kind: invocation_expression
                                inside:
                                    kind: return_statement
                                    follows:
                                        kind: local_declaration_statement
                                        has: {stopBy: end, kind: variable_declarator, all: [{has: {field: name, pattern: $LOCAL}}, {has: {nthChild: {position: 1, reverse: true}, matches: effect-slot}}]}
    held-answer:
        has: {field: arguments, has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: held}}}
    optional-answer:
        has: {field: arguments, has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: optional-slot-map}}}
    read-absent:
        matches: optional-answer
        has: {field: arguments, has: {matches: absent-slot, has: {nthChild: {position: 1, reverse: true}, pattern: $ABSENT}}}
    inverted-answer:
        has: {field: arguments, has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: inverted-slot}}}
    read-inverted:
        has: {field: arguments, has: {matches: slot, has: {nthChild: {position: 1, reverse: true}, matches: inverted-slot, pattern: $INVERTED}}}
    in-order:
        not:
            has:
                field: arguments
                any:
                    - has: {kind: argument, nthChild: 1, has: {field: name, not: {regex: '^effect$'}}}
                    - has: {kind: argument, nthChild: 2, has: {field: name, not: {regex: '^(absent|site)$'}}}
                    - has: {kind: argument, nthChild: 3, has: {field: name, not: {regex: '^site$'}}}
    succeeded:
        kind: invocation_expression
        all:
            - has: {field: function, matches: {csharp-owner-member: {type: {regex: '^Callbacks$'}, member: {regex: '^Succeeded$'}}}}
            - matches: in-order
            - has:
                field: arguments
                all:
                    - has: {kind: argument, nthChild: 1, pattern: $EFFECT}
                    - any:
                        - all:
                            - has: {kind: argument, nthChild: 2, pattern: $SITE}
                            - not: {has: {kind: argument, nthChild: 3}}
                        - all:
                            - has: {kind: argument, nthChild: 2, matches: constant-absent}
                            - has: {kind: argument, nthChild: 3, pattern: $SITE}
                            - not: {has: {kind: argument, nthChild: 4}}
    dropped-flag:
        any:
            - matches: succeeded
            - matches: answer
              all:
                - not: {matches: held-answer}
                - any:
                    - not: {matches: optional-answer}
                    - has: {field: arguments, has: {all: [{matches: absent-slot}, {matches: constant-absent}]}}
    ignore-call:
        kind: invocation_expression
        has: {field: function, matches: {csharp-type-name: {name: {regex: '^ignore$'}}}}
    ignored:
        inside: {kind: argument, inside: {kind: argument_list, inside: {matches: ignore-call}}}
    discarded:
        any:
            - inside: {kind: assignment_expression, field: right, has: {field: left, regex: '^_$'}}
            - inside: {kind: expression_statement}
            - matches: ignored
rule:
    kind: invocation_expression, return_statement
    all:
        - any:
            - kind: invocation_expression
              pattern: $READ
              all:
                - matches: answer
                - not: {matches: held-answer}
                - not: {matches: discarded}
                - any: [{matches: read-absent}, {not: {matches: optional-answer}}]
                - any: [{matches: read-inverted}, {not: {matches: inverted-answer}}]
            - kind: return_statement
              pattern: $READ
              has: {all: [{matches: answer}, {matches: held-answer}]}
            - kind: invocation_expression
              pattern: $DISCARD
              all:
                - any:
                    - all: [{matches: discarded}, {not: {matches: ignored}}, {matches: dropped-flag}]
                    - all: [{matches: ignore-call}, {has: {field: arguments, all: [{has: {kind: argument, nthChild: 1, has: {matches: dropped-flag}}}, {not: {has: {kind: argument, nthChild: 2}}}]}}]
                - not:
                    inside:
                        kind: assignment_expression
                        inside: {kind: lambda_expression, field: body, has: {field: parameters, kind: parameter_list, all: [{has: {kind: parameter, nthChild: 2}}, {not: {has: {kind: parameter, nthChild: 3}}}]}}
        - not: {inside: {stopBy: end, kind: ERROR}}
        - not: {has: {stopBy: end, kind: ERROR}}
        - not: {matches: {csharp-owner-body: {type: {regex: '^Callbacks$'}, member: {regex: '^Succeeded$'}}}}
rewriters:
    - id: drop-identity
      rule:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Select)$'}}, {has: {field: expression, pattern: $IDENTITY_SOURCE}}]}
            - has:
                field: arguments
                has:
                    kind: argument
                    has:
                        kind: lambda_expression
                        all:
                            - has: {field: parameters, any: [{kind: implicit_parameter, pattern: $RUN}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $RUN}}}]}
                            - has:
                                field: body
                                kind: invocation_expression
                                all:
                                    - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Select|Bind)$'}}, {has: {field: expression, pattern: $RUN}}]}
                                    - has: {field: arguments, has: {kind: argument, has: {any: [{matches: always}, {matches: pure-true}]}}}
      fix: $IDENTITY_SOURCE
    - id: drop-flag
      rule:
        kind: return_statement
        regex: '^return\s+true\s*;$'
        inside: {kind: block, inside: {kind: lambda_expression}}
      fix: ''
    - id: drop-true
      rule:
        kind: invocation_expression
        all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(Map|Select|Bind)$'}}, {has: {field: expression, pattern: $TRUE_SOURCE}}]}
            - has: {field: arguments, has: {kind: argument, has: {any: [{matches: always}, {matches: pure-true}]}}}
      fix: $TRUE_SOURCE
transform:
    VOIDED:
        rewrite:
            source: $MAPPED
            rewriters: [drop-identity, drop-true]
    ABSENT_TAIL:
        replace:
            source: $ABSENT
            replace: '(?s)^(.+)$'
            by: '$1, '
    VOID_BODY:
        rewrite:
            source: $LIFTED
            rewriters: [drop-flag]
    VOID_LINE:
        replace:
            source: $VOID_BODY
            replace: '\n[ \t]*(\n[ \t]*\}$)'
            by: '$1'
    VOID_TAIL:
        replace:
            source: $VOID_LINE
            replace: ';[ \t]+\}$'
            by: '; }'
    VOID:
        replace:
            source: $VOID_TAIL
            replace: '(?s)^(.+)$'
            by: 'IO.lift($1)'
    OPEN:
        replace:
            source: $LOCAL
            replace: '(?s)^.*$'
            by: 'return '
    CLOSE:
        replace:
            source: $LOCAL
            replace: '(?s)^.*$'
            by: ';'
    NOT:
        replace:
            source: $INVERTED
            replace: '(?s)^.*$'
            by: '!'
    SUCCEEDED:
        replace:
            source: $READ
            replace: '(?s)^.*$'
            by: Callbacks.Succeeded(
    RUN:
        replace:
            source: $DISCARD
            replace: '(?s)^.*$'
            by: Callbacks.Run(
    BUILT:
        replace:
            source: $READ
            replace: '(?s)^.*$'
            by: built by hand
    DROPPED:
        replace:
            source: $DISCARD
            replace: '(?s)^.*$'
            by: discarded
fix:
    template: $OPEN$NOT$SUCCEEDED$RUN$EFFECT$VOID$VOIDED, $ABSENT_TAIL$SITE)$CLOSE
    expandStart: {stopBy: end, any: [{kind: local_declaration_statement}, {kind: identifier, regex: '^_$', inside: {kind: assignment_expression}}]}
message: 'Success flag at `$SITE` is $BUILT$DROPPED'
note: 'Call `Callbacks.Succeeded(<effect>, [<absent>,] <site>)`, negated for a failure flag, `Callbacks.Run(<effect>, <site>)` for a discarded flag'
