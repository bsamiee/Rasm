# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-offset-pagination
language: sql
severity: error
rule:
    kind: limit_clause
    pattern: _LIMIT
    any:
        - has: {regex: '(?i)^offset$', precedes: {pattern: _SKIP, not: {kind: numeric_literal}}}
        - all: [{has: {regex: '^,$'}}, {has: {nthChild: 1, pattern: _SKIP, not: {kind: numeric_literal}}}]
message: '`$LIMIT` reads and discards `$SKIP` rows per page'
note: 'Page by key with `where <key> > <last key> order by <key> limit <count>` on a unique `<key>`'
