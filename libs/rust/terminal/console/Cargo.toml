# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-console"
edition.workspace = true
description       = "Line-mode terminal output: grid, CSV, and JSON writers, pager, prompts, and progress bars"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures              = { workspace = true }
tokio                = { workspace = true }
nonempty-collections = { workspace = true }
sysexits             = { workspace = true }
thiserror            = { workspace = true }
validated            = { workspace = true }
indexmap             = { workspace = true }
itertools            = { workspace = true }
csv                  = { workspace = true }
serde                = { workspace = true }
serde-content        = { workspace = true }
serde_json           = { workspace = true }
tracing-subscriber   = { workspace = true }
anstream             = { workspace = true }
anstyle              = { workspace = true }
clap                 = { workspace = true }
comfy-table          = { workspace = true }
crossterm            = { workspace = true }
inquire              = { workspace = true }
minus                = { workspace = true }
tracing-indicatif    = { workspace = true }
rasm-cli             = { workspace = true }
rasm-telemetry       = { workspace = true, features = ["process"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
