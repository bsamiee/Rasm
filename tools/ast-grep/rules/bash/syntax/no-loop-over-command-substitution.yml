# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
utils:
    line-tool:
        kind: command
        any:
            - has: {field: name, regex: '^(?:\P{White_Space}*/)?(grep|fgrep|egrep|sed|cat|awk|cut|sort)$'}
            - all:
                - has: {field: name, regex: '^(command|builtin)$'}
                - has: {kind: word, nthChild: 2, regex: '^(?:\P{White_Space}*/)?(grep|fgrep|egrep|sed|cat|awk|cut|sort)$'}
    line-output-substitution:
        kind: command_substitution
        all:
            - follows: {regex: '^in$'}
            - precedes: {any: [{regex: '^;$'}, {kind: do_group}]}
            - not: {has: {nthChild: 2}}
            - any:
                - has: {matches: line-tool}
                - has: {kind: pipeline, not: {has: {pattern: $_, not: {matches: line-tool}}}}
                - has: {kind: command, has: {field: name, regex: '^(ls|find)$'}}
rule:
    kind: command_substitution, simple_expansion, expansion
    pattern: $SUB
    any:
        - kind: command_substitution
        - has: {kind: variable_name}
    inside: {kind: for_statement}
    follows: {stopBy: end, regex: '^in$'}
    not:
        any:
            - matches: line-output-substitution
            - inside:
                kind: program
                stopBy: end
                has:
                    kind: comment
                    regex: '^#!\p{White_Space}*(\P{White_Space}*/)?(?:env\p{White_Space}+(?:-S\p{White_Space}*|--split-string(?:=|\p{White_Space}+))?)?(sh|dash|ash)(\p{White_Space}|$)'
                    not: {follows: {stopBy: end, pattern: $_}}
message: '`for` word-splits and glob-expands `$SUB`'
note: 'Hold the items in an array, `mapfile -t <items> < <(<command>)` for command output, and loop over `"${<items>[@]}"`'
