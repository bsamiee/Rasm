# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-when-enabled
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
utils:
    option-member:
        kind: member_expression, subscript_expression
        has: {field: object, matches: claude-code-options-object}
    claude-code-options-object:
        kind: identifier
        any:
            - {regex: ^options$}
            - pattern: $OPTIONS
              inside:
                stopBy: end
                matches: syntax-function-boundary
                has:
                    field: parameters
                    has:
                        kind: required_parameter
                        all:
                            - {has: {field: pattern, kind: identifier, pattern: $OPTIONS}}
                            - {has: {field: type, kind: type_annotation, has: {kind: type_identifier, regex: ^Options$}}}
    flag-option:
        kind: call_expression
        all:
            - {has: {field: function, regex: ^fromBoolean$}}
            - has:
                field: arguments
                has: {pattern: $FLAG, any: [{matches: option-member}, {has: {stopBy: end, matches: option-member}}]}
    thunk:
        kind: arrow_function
        has: {field: parameters, kind: formal_parameters, not: {has: {pattern: $_}}}
    nothing:
        any: [{kind: undefined}, {pattern: void 0}]
    register-arm:
        kind: pair
        all:
            - {has: {field: key, regex: ^some$}}
            - {has: {field: value, matches: thunk, pattern: $REGISTER}}
    empty-arm:
        kind: pair
        all:
            - {has: {field: key, regex: ^none$}}
            - has:
                field: value
                matches: thunk
                not: {has: {regex: ^async$}}
                has:
                    field: body
                    any:
                        - matches: nothing
                        - kind: statement_block
                          not: {has: {pattern: $_, not: {kind: return_statement, not: {has: {pattern: $_, not: {matches: nothing}}}}}}
rule:
    kind: call_expression
    pattern: $MATCH
    all:
        - has:
            field: function
            kind: member_expression
            all:
                - {has: {field: property, regex: ^match$}}
                - {has: {field: object, matches: flag-option}}
        - {has: {field: type_arguments, pattern: {context: match<void>(), selector: type_arguments}}}
        - has:
            field: arguments
            has:
                kind: object
                not: {has: {nthChild: 3}}
                all:
                    - {has: {matches: register-arm}}
                    - {has: {matches: empty-arm}}
        - {not: {has: {stopBy: end, kind: comment}}}
fix: whenEnabled($FLAG, $REGISTER)
message: The registration under `$FLAG` is gated by a match with an empty none arm
note: Gate the registration through `whenEnabled(options.<option>, () => register(on))` from host/options.ts
labels: {MATCH: {style: primary}}
