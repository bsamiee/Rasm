# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-atom-creation
language: csharp
rule:
    kind: invocation_expression
    regex: '^((global::)?(LanguageExt\.)?IO\.(lift|pure)\s*(<.+>)?\s*\(\s*(static\s+)?(\(\s*\)\s*=>\s*)?)?(global::)?(LanguageExt\.)?(Prelude\.)?(Atom|AtomHashMap|AtomSeq|AtomQue|Ref|VersionHashMap|atomIO)\b'
