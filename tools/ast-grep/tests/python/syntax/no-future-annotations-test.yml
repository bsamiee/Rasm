id: no-future-annotations
valid:
    # The corrected form, the annotation stays and the import is gone
    - |
      def load(path: Path) -> Item:
          return Item(path)
    # Another future feature, ruff unnecessary-future-import reports it
    - from __future__ import barry_as_FLUFL
    # Annotations beside another feature, ruff removes the other name first and the sole form then reports
    - from __future__ import annotations, barry_as_FLUFL
    # Import of a module named for the feature
    - from typing import annotations
invalid:
    # The instance, the sole future import at the top of a module
    - |
      from __future__ import annotations

      import os
    # Parenthesized name
    - from __future__ import (annotations)
    # Trailing comment on the import, the deletion keeps the comment
    - |
      from __future__ import annotations  # Lazy

      import os
    # Parenthesized name with a trailing comma
    - |
      from __future__ import (
          annotations,
      )
