# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-testing"
edition.workspace = true
description       = "Test fixtures kept after a failed test: folders and SQLite files"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

[[test]]
name = "suite"
path = "suite.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures        = { workspace = true }
derive-where   = { workspace = true }
derive_more    = { workspace = true }
sqlx           = { workspace = true, features = ["sqlite-bundled", "sqlite-load-extension"] }
libsqlite3-sys = { workspace = true }
sqlite-vec     = { workspace = true }
assert_fs      = { workspace = true }

[dev-dependencies]
tokio  = { workspace = true }
claims = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
