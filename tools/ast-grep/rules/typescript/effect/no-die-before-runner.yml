# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-die-before-runner
language: tsx
severity: error
utils:
    die-handler:
        any:
            - matches: effect-effect-member
              has: {field: property, regex: '^die$'}
            - kind: arrow_function
              all:
                - has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $E}}}
                - has: {field: body, pattern: $_.die($E)}
    die-step:
        any:
            - matches: effect-effect-member
              has: {field: property, regex: '^orDie$'}
            - kind: call_expression
              all:
                - has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^catch$'}}
                - has: {field: arguments, all: [{has: {nthChild: 1, matches: die-handler}}, {not: {has: {nthChild: 2}}}]}
    die-call:
        kind: call_expression
        any:
            - all:
                - has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^orDie$'}}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $PROGRAM}}, {not: {has: {nthChild: 2}}}]}
            - all:
                - has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^catch$'}}
                - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $PROGRAM}}, {has: {nthChild: 2, matches: die-handler}}, {not: {has: {nthChild: 3}}}]}
    context-step:
        kind: call_expression
        has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^(provide|provideService|provideServiceEffect|provideContext)$'}}
    runner-step:
        any:
            - matches: effect-effect-member
              has: {field: property, regex: '^(runPromise|runSync)$'}
            - kind: call_expression
              has: {field: function, matches: effect-effect-member, has: {field: property, regex: '^(runPromiseWith|runSyncWith)$'}}
rule:
    pattern: $DIE
    any:
        - matches: die-step
          inside: {kind: arguments}
          precedes:
            stopBy: {not: {any: [{matches: context-step}, {regex: '^,$'}]}}
            matches: runner-step
            pattern: $RUN
        - matches: die-call
          nthChild: 1
          inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, matches: runner-step, pattern: $RUN}}}
fix:
    template: $PROGRAM
    expandEnd: {regex: '^,$', not: {inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, matches: runner-step}}}}}
message: '`$DIE` turns the failure into a defect that `$RUN` squashes to the same thrown value'
note: 'Run the program itself, `Effect.runPromise` and `Effect.runSync` accept any error type and throw a cause''s first failure or first defect alike'
