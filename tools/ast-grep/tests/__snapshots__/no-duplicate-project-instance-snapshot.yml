id: no-duplicate-project-instance
snapshots:
  ? |
    <MSBuild Projects="$(MSBuildProjectFile)" Targets="Publish" Properties="Configuration=Release" />
  : labels:
    - source: <MSBuild Projects="$(MSBuildProjectFile)" Targets="Publish" Properties="Configuration=Release" />
      style: primary
      start: 0
      end: 97
    - source: Projects="$(MSBuildProjectFile)"
      style: secondary
      start: 9
      end: 41
    - source: Properties="Configuration=Release"
      style: secondary
      start: 60
      end: 94
    - source: <MSBuild Projects="$(MSBuildProjectFile)" Targets="Publish" Properties="Configuration=Release" />
      style: secondary
      start: 0
      end: 97
  ? |
