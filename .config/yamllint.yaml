# --- [YAMLLINT] -------------------------------------------------------------------------

extends: default

ignore: [pnpm-lock.yaml]

rules:
    comments:
        level: error
        min-spaces-from-content: 1
    comments-indentation:
        level: error
    document-start: disable
    empty-values:
        level: error
    float-values:
        level: error
        forbid-inf: true
        forbid-nan: true
        forbid-scientific-notation: true
        require-numeral-before-decimal: true
    indentation: disable
    line-length: disable
    octal-values:
        level: error
    truthy:
        level: error
        check-keys: false
