# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-warning-emission
language: python
severity: error
rule:
    pattern: $USE
    any:
        - matches: {python-member-use: {module: {regex: '^warnings$'}, name: {regex: '^(warn|warn_explicit|deprecated)$'}}}
        - matches: {python-member-use: {module: {regex: '^typing_extensions$'}, name: {regex: '^deprecated$'}}}
message: '`$USE` emits a warning or declares a deprecated API'
note: 'Return an `expression.Result` for an expected failure and delete a replaced API'
