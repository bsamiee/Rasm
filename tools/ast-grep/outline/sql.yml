---
id: sql-statement
language: sql
role: item
symbolType: operator
rule:
    kind: statement
    pattern: _DECLARATION
    all:
        - inside: {kind: 'program, transaction'}
        - not: {precedes: {kind: ERROR, regex: '^\.'}}
        - has:
            stopBy: end
            pattern: _NAME
            regex: '\w'
            any:
                - kind: object_reference
                  inside:
                    kind: >-
                        insert, from, alter_table, alter_view, alter_index, alter_schema, alter_sequence, alter_type, alter_database, alter_role, drop_table, drop_view, drop_schema, drop_database, drop_role, drop_type, drop_sequence, drop_extension, drop_function
                    inside: {kind: statement}
                - kind: object_reference
                  inside: {kind: relation, inside: {kind: update}}
                - kind: identifier
                  inside: {kind: drop_index, field: name}
        - any:
            - has: {kind: cte}
            - not:
                inside:
                    kind: program
                    stopBy: end
                    has:
                        stopBy: end
                        kind: 'create_table, create_view, create_materialized_view, create_index, create_trigger, create_function, create_type, create_sequence, create_schema, create_database, create_extension, create_role'
rewriters:
    - id: clause
      rule: {kind: 'keyword_with, cte'}
      fix: ''
transform:
    BARE: rewrite($DECLARATION, rewriters=[clause])
    OPENED: {replace: {source: $BARE, replace: '^[\s,]+', by: ''}}
    JOINED: {replace: {source: $OPENED, replace: '\s+', by: ' '}}
    SIGNATURE: {replace: {source: $JOINED, replace: '(?i)^(insert (?:or \w+ )?into [\w."]+(?: ?\([^)]*\))?|update (?:or \w+ )?[\w."]+|delete from [\w."]+|(?:drop|alter) \w+ (?:if exists )?[\w."]+)[\s\S]*$', by: '$1'}}
name: $NAME
signature: $SIGNATURE
---
id: sql-cte
language: sql
role: member
symbolType: variable
parentRuleIds: [sql-table, sql-view, sql-statement]
rule:
    kind: cte
    pattern: _DECLARATION
    has: {kind: identifier, pattern: _NAME}
rewriters:
    - id: body
      rule: {kind: statement, inside: {kind: cte}}
      fix: ''
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    OPEN: {replace: {source: $HEADER, replace: '\s*\(\s*\)\s*$', by: ''}}
    SIGNATURE: {replace: {source: $OPEN, replace: '\s+', by: ' '}}
name: $NAME
signature: $SIGNATURE
