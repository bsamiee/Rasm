# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
files: ['plugins/function-hooks/**']
utils:
    result-class:
        matches: {typescript-import-reference: {source: {regex: 'monads\.ts$'}, exported: {regex: '^Result$'}}}
    constructed-result:
        any:
            - kind: call_expression
              has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(ok|fault)$'}}, {has: {field: object, matches: result-class}}]}
            - kind: new_expression
              has: {field: constructor, matches: result-class}
    fault-test:
        kind: binary_expression
        any: [{pattern: "$R.outcome.kind === 'fault'"}, {pattern: "$R.outcome.kind !== 'ok'"}]
    ok-test:
        kind: binary_expression
        any: [{pattern: "$R.outcome.kind === 'ok'"}, {pattern: "$R.outcome.kind !== 'fault'"}]
    propagated:
        any: [{pattern: $R}, {pattern: Result.fault(...$R.outcome.faults)}]
    propagating-return:
        kind: return_statement
        has: {nthChild: 1, matches: propagated}
    propagating-block:
        kind: statement_block
        all:
            - has: {nthChild: 1, matches: propagating-return}
            - not: {has: {nthChild: 2}}
    tail-statement:
        inside: {kind: statement_block, inside: {field: body, kind: 'arrow_function, function_expression, function_declaration, method_definition'}}
    foreign-use:
        pattern: $R
        not: {inside: {field: object, pattern: $R.outcome, inside: {field: object, pattern: $R.outcome.value}}}
    combinator:
        pattern: $G($R.outcome.value)
        inside:
            matches: typescript-function-boundary
            stopBy: {matches: typescript-function-boundary}
            has: {field: parameters, has: {kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $G}}}
    ternary-continuation:
        all:
            - pattern: Result.ok($_)
            - not: {has: {stopBy: {matches: typescript-function-boundary}, kind: await_expression}}
            - not: {any: [{matches: combinator}, {has: {stopBy: end, matches: combinator}}, {matches: foreign-use}, {has: {stopBy: end, matches: foreign-use}}]}
    single-return:
        kind: return_statement
        not: {precedes: {pattern: $_}}
        has: {nthChild: 1, matches: ternary-continuation}
    ok-tail:
        kind: return_statement
        all:
            - pattern: return Result.ok($_);
            - not: {precedes: {pattern: $_}}
            - not: {has: {stopBy: {matches: typescript-function-boundary}, kind: await_expression}}
    map-tail:
        all:
            - any:
                - has: {matches: ok-tail}
                - has: {kind: statement_block, has: {matches: ok-tail}}
            - not: {has: {stopBy: {matches: typescript-function-boundary}, kind: await_expression}}
    statement-continuation:
        all:
            - not: {has: {stopBy: end, matches: foreign-use}}
            - not: {has: {stopBy: {matches: typescript-function-boundary}, kind: await_expression}}
rule:
    not: {inside: {stopBy: end, kind: class_declaration, has: {field: name, regex: '^Result$'}}}
    any:
        - kind: ternary_expression
          all:
            - has: {field: condition, matches: fault-test}
            - has: {field: consequence, matches: propagated}
            - has: {field: alternative, matches: ternary-continuation}
        - kind: ternary_expression
          all:
            - has: {field: condition, matches: ok-test}
            - has: {field: alternative, matches: propagated}
            - has: {field: consequence, matches: ternary-continuation}
        - kind: if_statement
          all:
            - matches: tail-statement
            - has: {field: condition, has: {matches: fault-test}}
            - has: {field: consequence, matches: propagating-block}
            - not: {has: {field: alternative, kind: else_clause}}
            - any:
                - precedes: {matches: single-return}
                - all:
                    - precedes: {stopBy: end, matches: ok-tail}
                    - not: {precedes: {stopBy: end, has: {stopBy: {matches: typescript-function-boundary}, kind: await_expression}}}
                    - not: {precedes: {stopBy: end, has: {stopBy: end, matches: foreign-use}}}
        - kind: if_statement
          all:
            - matches: tail-statement
            - has: {field: condition, has: {matches: ok-test}}
            - not: {has: {field: alternative, kind: else_clause}}
            - precedes: {matches: propagating-return, not: {precedes: {pattern: $_}}}
            - has:
                field: consequence
                kind: statement_block
                any:
                    - has: {nthChild: 1, matches: single-return}
                    - all:
                        - has: {kind: return_statement, nthChild: {position: 1, reverse: true}}
                        - matches: statement-continuation
                        - matches: map-tail
        - kind: switch_statement
          all:
            - matches: tail-statement
            - not: {precedes: {pattern: $_}}
            - has: {field: value, has: {pattern: $R.outcome.kind}}
            - has:
                field: body
                all:
                    - has: {kind: switch_case, all: [{has: {field: value, regex: "^'fault'$"}}, {has: {field: body, matches: propagating-return}}, {not: {has: {nthChild: 3}}}]}
                    - has:
                        any: [{kind: switch_case, has: {field: value, regex: "^'ok'$"}}, {kind: switch_default}]
                        all:
                            - any:
                                - all: [{has: {field: body, matches: single-return}}, {not: {has: {field: body, not: {kind: return_statement}}}}]
                                - has: {field: body, kind: statement_block, has: {nthChild: 1, matches: single-return}, not: {has: {nthChild: 2}}}
                                - all:
                                    - matches: statement-continuation
                                    - matches: map-tail
                    - not: {has: {nthChild: 3}}
constraints:
    R:
        kind: identifier
        inside:
            kind: statement_block, program
            stopBy: {kind: 'statement_block, program'}
            has:
                kind: lexical_declaration
                all:
                    - has: {field: kind, regex: '^const$'}
                    - has: {kind: variable_declarator, all: [{has: {field: name, pattern: $R}}, {has: {field: value, matches: constructed-result}}]}
message: '`$R.outcome.kind` test propagates the fault and continues with `$R.outcome.value` by hand'
note: 'Call `<result>.map(<f>)` to compute the value returned through `Result.ok`'
