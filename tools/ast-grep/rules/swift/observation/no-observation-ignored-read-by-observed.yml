# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-observation-ignored-read-by-observed
language: swift
severity: error
utils:
    ignored: {kind: modifiers, has: {kind: attribute, regex: '^@ObservationIgnored$'}}
rule:
    kind: simple_identifier
    pattern: $NAME
    all:
        - not:
            inside:
                kind: navigation_suffix
                inside: {kind: navigation_expression, not: {has: {field: target, kind: self_expression}}}
        - inside:
            kind: computed_property
            stopBy: end
            inside:
                kind: property_declaration
                all:
                    - has: {field: name, pattern: $OWNER}
                    - not: {has: {matches: ignored}}
                    - not: {has: {stopBy: end, pattern: 'access(keyPath: $_)'}}
                inside:
                    kind: class_body
                    has:
                        kind: property_declaration
                        all:
                            - has: {matches: ignored}
                            - has: {kind: value_binding_pattern, regex: '^var$'}
                            - has: {field: name, pattern: $NAME}
message: '`$OWNER` reads `$NAME`, an `@ObservationIgnored` property with no published mutation'
note: 'Drop `@ObservationIgnored` from `$NAME`'
