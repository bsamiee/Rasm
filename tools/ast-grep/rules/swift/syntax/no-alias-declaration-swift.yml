# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swiftlang
severity: error
utils:
    read:
        kind: type_identifier
        pattern: $ALIAS
        not: {inside: {kind: typealias_declaration, field: name}}
    holding-read: {any: [{matches: read}, {has: {stopBy: end, matches: read}}]}
    shared:
        inside:
            stopBy: end
            kind: source_file
            has: {stopBy: end, all: [{matches: read}, {any: [{precedes: &later {stopBy: end, matches: holding-read}}, {inside: {stopBy: end, not: {kind: source_file}, precedes: *later}}]}]}
    exported:
        has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|package|open)$'}}
rule:
    kind: typealias_declaration
    all:
        - has: {field: name, kind: type_identifier, pattern: $ALIAS}
        - not: {matches: swift-conformance-member}
        - not: {inside: {kind: protocol_body, inside: {kind: protocol_declaration, has: {kind: inheritance_specifier}}}}
        - not: {all: [{has: {kind: 'tuple_type, function_type'}}, {any: [{matches: exported}, {matches: shared}]}]}
message: '`$ALIAS` is another name for its type'
note: 'Spell the type at each use or declare a type holding its fields, and delete its alias, a tuple or function type alias declared `public` or `package` or read twice in its file stays'
