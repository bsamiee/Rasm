# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-malformed-divider-csharp
language: csharp
severity: error
utils:
    misparsed:
        any:
            - inside: {kind: compilation_unit, stopBy: end, has: {kind: ERROR, stopBy: end}}
            - inside: {kind: ERROR, stopBy: end}
rule:
    matches: csharp-divider-comment
    pattern: $DIVIDER
    not: {matches: misparsed}
    any:
        - not: {matches: csharp-labeled-divider}
        - matches: csharp-labeled-divider
          not: {any: [{matches: text-section-divider}, {matches: csharp-owner-level}]}
        - matches: text-section-divider
          not: {any: [{matches: csharp-file-level}, {matches: csharp-owner-level}]}
        - matches: csharp-section-divider
          not: {regex: '^.{90}$'}
message: Divider `$DIVIDER` departs from both divider forms
note: Use `// --- [<SECTION>] ` with dashes to column 90 at file level, or `// --- [<FAMILY>]` inside an owner
