# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-fourth-nesting-level-sql
language: sql
severity: error
utils:
    nested: {kind: 'subquery, cte'}
    fourth-level:
        matches: nested
        inside:
            matches: nested
            stopBy: end
            inside:
                matches: nested
                stopBy: end
                inside: {matches: nested, stopBy: end}
rule:
    pattern: _QUERY
    matches: fourth-level
    not: {inside: {matches: fourth-level, stopBy: end}}
message: '`$QUERY` sits at the fourth nesting level of its statement'
note: Name each inner query as a common table expression beside the others, or read a correlated one as a window function over the same rows
