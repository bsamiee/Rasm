# --- [PROJECT] --------------------------------------------------------------------------

[project]
name = "rasm-contracts"
version = "0.1.0"
description = "Rasm wire contracts: generated protobuf-py bindings, Connect service surfaces, and the admission and artifact custody runtime."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anyio",        # artifact custody offloads filesystem and digest work through to_thread
    "connectrpc",   # generated Connect service ABCs, clients, and the admission RequestContext seam
    "expression",   # Result/Option rails the admission and artifact surfaces return
    "protobuf-py",  # Buf protobuf runtime under the generated _pb.py bindings
    "protovalidate", # descriptor-rule evaluation at the admission boundary
]

# --- [BUILD] ----------------------------------------------------------------------------

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]  # Flat layout, no src/: the package sits at the project root, and scoped sys.path entries keep the editable install unshadowed.
module-root = ""
module-name = "rasm.contracts"
namespace = true
