# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-event-add-remove-pair
language: csharplang
severity: error
files: ['**/rhino/**']
utils:
    event:
        any:
            - kind: identifier
              pattern: $EVENT
            - kind: member_access_expression
              has: {field: name, pattern: $EVENT}
    handler-lambda:
        kind: lambda_expression
        has: {field: parameters, any: [{kind: implicit_parameter, pattern: $P}, {kind: parameter_list, has: {kind: parameter, has: {field: name, pattern: $P}}}]}
    action:
        all:
            - has: {field: right, pattern: $P}
            - inside: {stopBy: end, matches: handler-lambda}
rule:
    kind: assignment_expression
    all:
        - has: {field: operator, regex: '^\+=$'}
        - has: {field: left, matches: event}
        - not: {matches: action}
        - not:
            inside:
                stopBy: end
                kind: argument
                inside:
                    kind: 'argument_list, tuple_expression'
                    has: {kind: argument, has: {stopBy: end, kind: assignment_expression, all: [{has: {field: operator, regex: '^-=$'}}, {has: {field: left, matches: event}}]}}
        - not:
            has:
                field: right
                kind: lambda_expression
                has:
                    field: body
                    not:
                        any:
                            - kind: block
                            - kind: invocation_expression
                            - kind: assignment_expression
                            - kind: await_expression
                            - kind: object_creation_expression
                            - kind: conditional_access_expression
                            - kind: prefix_unary_expression
                            - kind: postfix_unary_expression
        - inside:
            stopBy: end
            kind: compilation_unit
            has:
                stopBy: end
                kind: assignment_expression
                all:
                    - has: {field: operator, regex: '^-=$'}
                    - has: {field: left, matches: event}
                    - not: {matches: action}
message: '`+=` attaches a handler to `$EVENT` and a separate `-=` detaches it'
note: 'Pair `() => <source>.<event> += <handler>` with `() => <source>.<event> -= <handler>` in one row, through `Subscriptions.On<TArgs>` where the project references Rasm.Rhino'
