id: csharp-variable
language: csharplang
role: item
symbolType: variable
rule:
    kind: local_declaration_statement
    inside: {kind: 'global_statement, compilation_unit', stopBy: {not: {kind: 'preproc_if, preproc_elif, preproc_else'}}}
    pattern: $DECLARATION
    has: {kind: variable_declaration, pattern: $VARIABLES}
rewriters:
    - id: name
      rule:
        kind: variable_declarator
        has: {kind: 'identifier, tuple_pattern', pattern: $DECLARED}
      transform:
        CLEAN: rewrite($DECLARED, rewriters=[trivia])
      fix: $CLEAN
    - id: initializer
      rule:
        kind: variable_declarator
        inside: {kind: variable_declaration, inside: {kind: local_declaration_statement, not: {has: {kind: modifier, regex: '^const$'}}}}
        has: {kind: 'identifier, tuple_pattern', pattern: $DECLARED}
      transform:
        CLEAN: rewrite($DECLARED, rewriters=[trivia])
      fix: $CLEAN
    - id: trivia
      rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}
      fix: "\n"
transform:
    JOINED: {rewrite: {source: $VARIABLES, rewriters: [name], joinBy: ', '}}
    NAMES: {replace: {source: $JOINED, replace: '[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: ' '}}
    HEADER: rewrite($DECLARATION, rewriters=[initializer, trivia])
    NEWLINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*', by: "\n"}}
    TRIMMED: {replace: {source: $NEWLINES, replace: '([(\[<.])\n|\n([)\]>.,;])|\n$', by: '$1$2'}}
    SIGNATURE: {replace: {source: $TRIMMED, replace: '\n', by: ' '}}
name: $NAMES
signature: $SIGNATURE
isExported: false
