# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-custom-validation-error
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    validation-code:
        kind: member_access_expression
        matches: {csharp-owner-member: {type: {regex: '^ErrorCodes$'}, member: {regex: '^ValidationFailed$'}}}
rule:
    any:
        - kind: generic_name
          pattern: $TEST
          regex: '^IsType\s*<\s*((global::)?Thinktecture\.)?ValidationError\s*>$'
          inside: {kind: member_access_expression, field: name}
        - kind: record_declaration
          all:
            - has: {field: name, pattern: $RECORD}
            - matches: languageext-error-record
            - has: {kind: base_list, has: {stopBy: end, kind: argument, has: {matches: validation-code}}}
transform:
    TESTS: {replace: {source: $TEST, replace: '(?s)^(.+)$', by: '`$1` tests the error type in place of its code'}}
    DECLARES: {replace: {source: $RECORD, replace: '(?s)^(.+)$', by: '`$1` declares a custom error coded `ValidationFailed`'}}
message: $TESTS$DECLARES
note: 'Assign `validationError = new ValidationError(<rule>)` in the hook, convert via `<type>.Validated`, and test `HasCode(ErrorCodes.ValidationFailed)`'
