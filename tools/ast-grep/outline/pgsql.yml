gacy, TruncateStmt, UnlistenStmt, UpdateStmt, VacuumStmt, VariableResetStmt, VariableSetStmt, VariableShowStmt, ViewStmt, WaitStmt, select_no_parens, select_with_parens, columnDef, ColConstraint, TableConstraint, common_table_expr, window_definition, alter_table_cmd, alter_ts_configuration_cmd'}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: pgsql-enum-value
language: pgsql
role: member
symbolType: enumMember
parentRuleIds: [pgsql-enum]
rule:
    kind: string_literal, escape_string_literal, dollar_quoted_string, substitution
    pattern: $NAME
    inside: {kind: enum_val_list}
name: $NAME
---
id: pgsql-table
language: pgsql
role: item
symbolType: struct
isExported: false
rule:
    pattern: $DECLARATION
    any:
        - {kind: 'CreateStmt, CreateForeignTableStmt, ViewStmt', has: {kind: 'qualified_name, substitution', pattern: $NAME}}
        - {kind: 'CreateAsStmt, CreateMatViewStmt, ExecuteStmt', has: {kind: 'create_as_target, create_mv_target', has: {kind: qualified_name, pattern: $NAME}}}
        - {kind: CreateDomainStmt, has: {kind: any_name, pattern: $NAME}}
        - kind: DefineStmt
          all: [{has: {regex: '(?i-u)^type$'}}, {has: {kind: any_name, pattern: $NAME}}]
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: body
      rule:
          any:
              - kind: TableElementList, OptTypedTableElementList, TableFuncElementList, select_no_parens, select_with_parens, columnList
              - {kind: b_expr, inside: {kind: ColConstraintElem}}
              - {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly, reserved_keyword', inside: {kind: 'generic_option_elem, def_arg'}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-column
language: pgsql
role: item
symbolType: field
isExported: false
rule:
    kind: columnDef
    pattern: $DECLARATION
    inside: {kind: 'source_file, ERROR', stopBy: {not: {kind: TableElementList}}}
    all:
        - has: {kind: 'ColId, substitution', pattern: $NAME}
        - has: {kind: Typename}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: value
      rule:
          any:
              - {kind: b_expr, inside: {kind: ColConstraintElem}}
              - {kind: a_expr, inside: {kind: ColConstraintElem, has: {kind: generated_when}}}
              - {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly', inside: {kind: 'generic_option_elem, SeqOptElem'}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-member-column
language: pgsql
role: member
symbolType: field
parentRuleIds: [pgsql-table, pgsql-index, pgsql-statement]
rule:
    all:
        - any:
              - {kind: 'columnDef, columnOptions, TableFuncElement', has: {kind: 'ColId, substitution', pattern: $NAME}}
              - {kind: TableLikeClause, has: {kind: qualified_name, pattern: $NAME}}
              - kind: ColId
                inside: {kind: columnList, stopBy: {not: {kind: columnList}}, inside: {kind: 'create_as_target, ViewStmt, create_mv_target'}}
                pattern: $NAME
              - kind: target_el
                inside:
                    kind: target_list
                    stopBy: {not: {kind: target_list}}
                    inside: {kind: simple_select, inside: {kind: select_no_parens, inside: {kind: 'CreateAsStmt, ViewStmt, CreateMatViewStmt', not: {any: [{has: {kind: columnList, stopBy: {kind: select_no_parens}}}, {inside: {kind: ExplainStmt}}]}}}}
                any: [{has: {kind: 'ColLabel, BareColLabel', pattern: $NAME}}, {pattern: $NAME}]
              - kind: index_elem
                inside: {kind: index_params, stopBy: {not: {kind: index_params}}, inside: {kind: IndexStmt}}
                has: {kind: 'ColId, func_application, func_expr_common_subexpr, json_aggregate_func, a_expr', pattern: $NAME}
        - pattern: $DECLARATION
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: value
      rule:
          any:
              - {kind: b_expr, inside: {kind: ColConstraintElem}}
              - {kind: a_expr, inside: {kind: ColConstraintElem, has: {kind: generated_when}}}
              - {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly', inside: {kind: 'generic_option_elem, SeqOptElem'}}
              - {kind: a_expr, all: [{inside: {kind: target_el, has: {kind: 'ColLabel, BareColLabel'}}}, {not: {has: {kind: c_expr, has: {kind: columnref}}}}]}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
    NAME_LINE: {replace: {source: $NAME, replace: '[\t\n\v\f\r ]+', by: ' '}}
    LABEL: {replace: {source: $NAME_LINE, replace: '(\() | (\))', by: '$1$2'}}
name: $LABEL
signature: $SIGNATURE
---
id: pgsql-member-constraint
language: pgsql
role: member
symbolType: key
parentRuleIds: [pgsql-table, pgsql-statement]
rule:
    all:
        - kind: TableConstraint
          pattern: $DECLARATION
          any:
              - has: {kind: 'ColId, substitution', pattern: $NAME}
              - pattern: $UNNAMED
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
    LABEL: {replace: {source: $UNNAMED, replace: '[\t\n\v\f\r ]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
name: $NAME$LABEL
signature: $SIGNATURE
---
id: pgsql-function
language: pgsql
role: item
symbolType: function
isExported: false
rule:
    pattern: $DECLARATION
    any:
        - {kind: CreateFunctionStmt, has: {kind: func_name, pattern: $NAME}}
        - kind: DefineStmt
          all: [{has: {regex: '(?i-u)^aggregate$'}}, {has: {kind: func_name, pattern: $NAME}}]
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: body
      rule:
          any:
              - kind: func_as, routine_body_stmt_list, ReturnStmt, definition, old_aggr_definition
              - {kind: a_expr, inside: {kind: func_arg_with_default}}
              - {kind: NumericOnly, inside: {kind: common_func_opt_item}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-function-parameter
language: pgsql
role: member
symbolType: variable
parentRuleIds: [pgsql-function]
rule:
    all:
        - any:
              - {kind: func_arg_with_default, has: {kind: func_arg, has: {kind: type_function_name, pattern: $NAME}}}
              - {kind: 'func_arg, table_func_column', not: {inside: {kind: func_arg_with_default}}, has: {kind: type_function_name, pattern: $NAME}}
        - pattern: $DECLARATION
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - {id: value, rule: {kind: a_expr, inside: {kind: func_arg_with_default}}, fix: …}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-sequence
language: pgsql
role: item
symbolType: variable
isExported: false
rule:
    all:
        - any:
              - {kind: CreateSeqStmt, has: {kind: qualified_name, pattern: $NAME}}
              - {kind: 'common_table_expr, window_definition', inside: {kind: 'source_file, ERROR'}, has: {kind: ColId, pattern: $NAME}}
        - pattern: $DECLARATION
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: body
      rule:
          any:
              - kind: select_no_parens, InsertStmt, UpdateStmt, DeleteStmt, MergeStmt
              - {kind: NumericOnly, inside: {kind: SeqOptElem}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-index
language: pgsql
role: item
symbolType: key
isExported: false
rule:
    pattern: $DECLARATION
    any:
        - {kind: IndexStmt, has: {kind: 'ColId, qualified_name', pattern: $NAME}}
        - {kind: ColConstraint, inside: {kind: 'source_file, ERROR'}, has: {kind: ColId, pattern: $NAME}}
        - kind: TableConstraint
          inside: {kind: 'source_file, ERROR'}
          any: [{has: {kind: 'ColId, substitution', pattern: $NAME}}, {pattern: $UNNAMED}]
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - {id: value, rule: {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly, reserved_keyword', inside: {kind: def_arg}}, fix: …}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
    LABEL: {replace: {source: $UNNAMED, replace: '[\t\n\v\f\r ]+', by: ' '}}
name: $NAME$LABEL
signature: $SIGNATURE
---
id: pgsql-trigger
language: pgsql
role: item
symbolType: event
isExported: false
rule:
    kind: CreateTrigStmt, CreateEventTrigStmt, CreatePolicyStmt, RuleStmt
    pattern: $DECLARATION
    has: {kind: ColId, pattern: $NAME}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: body
      rule:
          any:
              - kind: RuleActionList, TriggerFuncArgs
              - {kind: a_expr, inside: {kind: 'RowSecurityOptionalExpr, RowSecurityOptionalWithCheck'}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-object
language: pgsql
role: item
symbolType: object
isExported: false
rule:
    all:
        - kind: CreateAmStmt, CreateAssertionStmt, CreateCastStmt, CreateConversionStmt, CreateFdwStmt, CreateForeignServerStmt, CreateGroupStmt, CreateOpClassStmt, CreateOpFamilyStmt, CreatePLangStmt, CreatePublicationStmt, CreateRoleStmt, CreateStatsStmt, CreateSubscriptionStmt, CreateTableSpaceStmt, CreateTransformStmt, CreateUserMappingStmt, CreateUserStmt, CreatedbStmt, DefineStmt
          pattern: $DECLARATION
          has: {kind: 'any_name, ColId, RoleSpec, auth_ident, NonReservedWord, Typename, from_list, substitution', pattern: $NAME}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: value
      rule: {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly, reserved_keyword, SignedIconst', inside: {kind: 'generic_option_elem, AlterOptRoleElem, CreateSubscriptionStmt, def_arg, createdb_opt_item, CreateTableSpaceStmt, CreateForeignServerStmt, foreign_server_version'}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-statement
language: pgsql
role: item
symbolType: operator
isExported: false
rule:
    pattern: $DECLARATION
    all:
        - any:
              - kind: AlterCollationStmt, AlterCompositeTypeStmt, AlterDatabaseSetStmt, AlterDatabaseStmt, AlterDefaultPrivilegesStmt, AlterDomainStmt, AlterEnumStmt, AlterEventTrigStmt, AlterExtensionContentsStmt, AlterExtensionStmt, AlterFdwStmt, AlterForeignServerStmt, AlterFunctionStmt, AlterGroupStmt, AlterObjectDependsStmt, AlterObjectSchemaStmt, AlterOpFamilyStmt, AlterOperatorStmt, AlterOwnerStmt, AlterPolicyStmt, AlterPublicationStmt, AlterRoleSetStmt, AlterRoleStmt, AlterSeqStmt, AlterStatsStmt, AlterSubscriptionStmt, AlterSystemStmt, AlterTSConfigurationStmt, AlterTSDictionaryStmt, AlterTableStmt, AlterTblSpcStmt, AlterTypeStmt, AlterUserMappingStmt, AnalyzeStmt, CallStmt, CheckPointStmt, ClosePortalStmt, CommentStmt, ConstraintsSetStmt, CopyStmt, DeallocateStmt, DeclareCursorStmt, DefineStmt, DeleteStmt, DiscardStmt, DoStmt, DropCastStmt, DropOpClassStmt, DropOpFamilyStmt, DropOwnedStmt, DropRoleStmt, DropStmt, DropSubscriptionStmt, DropTableSpaceStmt, DropTransformStmt, DropUserMappingStmt, DropdbStmt, ExecuteStmt, ExplainStmt, FetchStmt, GrantRoleStmt, GrantStmt, InsertStmt, ListenStmt, LockStmt, MergeStmt, NotifyStmt, PrepareStmt, ReassignOwnedStmt, RefreshMatViewStmt, ReindexStmt, RemoveAggrStmt, RemoveFuncStmt, RemoveOperStmt, RenameStmt, RepackStmt, RevokeRoleStmt, RevokeStmt, SecLabelStmt, TransactionStmt, TransactionStmtLegacy, TruncateStmt, UnlistenStmt, UpdateStmt, VacuumStmt, VariableResetStmt, VariableSetStmt, VariableShowStmt, WaitStmt
              - {kind: 'select_no_parens, select_with_parens, alter_table_cmd, alter_ts_configuration_cmd', inside: {kind: 'source_file, ERROR'}}
        - any:
              - has: {kind: 'comment_target, privilege_target', has: {kind: 'any_name, function_with_argtypes, aggregate_with_argtypes, operator_with_argtypes, Typename, ColId, NumericOnly, any_name_list, function_with_argtypes_list, name_list, parameter_name_list, qualified_name_list, NumericOnly_list, substitution', pattern: $SUBJECT}}
              - has: {kind: 'insert_target, relation_expr_opt_alias, extended_relation_expr', has: {kind: 'qualified_name, substitution', pattern: $SUBJECT, stopBy: end}}
              - has: {kind: privilege_list, pattern: $SUBJECT}
              - has: {kind: 'qualified_name, any_name, any_name_list, any_operator, func_name, ColId, RoleSpec, relation_expr_list, function_with_argtypes, function_with_argtypes_list, aggregate_with_argtypes, aggregate_with_argtypes_list, operator_with_argtypes, operator_with_argtypes_list, role_list, type_name_list, name_list, Typename, auth_ident, vacuum_relation_list, var_name, constraints_set_list, reset_rest, generic_reset, substitution', pattern: $SUBJECT}
              - has: {kind: from_clause, stopBy: {kind: 'target_list, with_clause, from_clause'}, has: {kind: 'qualified_name, substitution, func_table', pattern: $SUBJECT, stopBy: {kind: 'select_no_parens, select_with_parens'}}}
              - has: {kind: from_clause, stopBy: {kind: 'target_list, with_clause, from_clause'}, has: {kind: alias_clause, has: {kind: ColId, pattern: $SUBJECT}, stopBy: {kind: 'select_no_parens, select_with_parens'}}}
              - has: {kind: simple_select, has: {kind: 'qualified_name, substitution', pattern: $SUBJECT}}
              - has: {kind: 'set_rest, generic_set, fetch_args, func_application', has: {kind: 'var_name, ColId, func_name', pattern: $SUBJECT, stopBy: {kind: 'var_name, ColId, func_name'}}}
              - has: {kind: DefACLAction, has: {kind: defacl_privilege_target, pattern: $SUBJECT}}
              - has: {kind: set_rest, pattern: $SETTING}
              - {kind: 'VariableShowStmt, DiscardStmt, ClosePortalStmt, DeallocateStmt, UnlistenStmt', pattern: $SETTING}
              - has: {regex: '(?i-u)^all$', pattern: $$SUBJECT}
              - has: {stopBy: {kind: with_clause}, pattern: $$SUBJECT, regex: '(?-u)^[A-Za-z]+$', not: {pattern: $_}}
rewriters:
    - id: clause
      rule:
          kind: where_clause, where_or_current_clause, sort_clause, select_limit, for_locking_clause, returning_clause, opt_on_conflict, with_clause, group_clause, having_clause, window_clause, comment
          not: {inside: {kind: 'func_application, window_specification'}}
      fix: ' '
    - id: body
      rule:
          any:
              - kind: set_clause_list, dostmt_opt_list, alter_table_cmds, alter_type_cmds, partition_cmd, index_partition_cmd, var_list, zone_value
              - {kind: 'target_list, func_arg_list, expr_list, insert_column_list, columnList', regex: "\n"}
              - {kind: 'select_no_parens, select_with_parens, values_clause, substitution', inside: {kind: insert_rest}}
              - {kind: b_expr, inside: {kind: ColConstraintElem}}
              - {kind: a_expr, inside: {kind: ColConstraintElem, has: {kind: generated_when}}}
              - {kind: a_expr, inside: {kind: 'alter_column_default, alter_table_cmd, alter_using'}}
              - {kind: a_expr, all: [{inside: {kind: target_el}}, {not: {has: {kind: c_expr, has: {kind: columnref}}}}]}
              - {kind: expr_list, inside: {kind: 'execute_param_clause, values_clause, merge_values_clause'}}
              - {kind: func_arg_list, inside: {kind: func_application, inside: {kind: CallStmt}}}
              - {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly, reserved_keyword, SignedIconst', inside: {kind: 'generic_option_elem, AlterOptRoleElem, AlterSubscriptionStmt, comment_text, security_label, notify_payload, WaitStmt, def_arg, SeqOptElem, createdb_opt_item, common_func_opt_item, copy_generic_opt_arg, copy_opt_item, copy_delimiter, alter_extension_opt_item, foreign_server_version, set_rest_more'}}
              - {kind: 'NonReservedWord, document_or_content', inside: {kind: 'set_rest_more, alter_extension_opt_item'}}
              - {kind: transaction_mode_list, inside: {kind: set_rest}}
      fix: …
    - id: setting
      rule:
          any:
              - {kind: 'zone_value, string_literal, escape_string_literal, dollar_quoted_string, substitution, NonReservedWord, document_or_content', inside: {kind: set_rest_more}}
              - {kind: transaction_mode_list, inside: {kind: set_rest}}
              - {regex: '(?i-u)^(?:default|none)$', inside: {kind: set_rest_more}}
              - {regex: '(?i-u)^(?:show|discard|close|deallocate|prepare|unlisten)$', inside: {kind: 'VariableShowStmt, DiscardStmt, ClosePortalStmt, DeallocateStmt, UnlistenStmt'}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [clause, body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
    SUBJECT_LINE: {replace: {source: $SUBJECT, replace: '[\t\n\v\f\r ]+', by: ' '}}
    LABEL: {replace: {source: $SUBJECT_LINE, replace: '(\() | (\))', by: '$1$2'}}
    SETTING_TEXT: {rewrite: {source: $SETTING, rewriters: [setting]}}
    SETTING_LINE: {replace: {source: $SETTING_TEXT, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SETTING_LABEL: {replace: {source: $SETTING_LINE, replace: '^ | $', by: ''}}
name: $LABEL$SETTING_LABEL
signature: $SIGNATURE
---
id: pgsql-member-command
language: pgsql
role: member
symbolType: operator
parentRuleIds: [pgsql-statement]
rule:
    all:
        - kind: alter_table_cmd, alter_type_cmd, partition_cmd, index_partition_cmd
          pattern: $COMMAND
          not: {has: {kind: 'columnDef, TableConstraint'}}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - id: value
      rule:
          any:
              - {kind: a_expr, inside: {kind: 'alter_column_default, alter_table_cmd, alter_using'}}
              - {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution, NumericOnly, reserved_keyword, SignedIconst', inside: {kind: 'generic_option_elem, def_arg, SeqOptElem, alter_identity_column_option, set_statistics_value'}}
      fix: …
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    HEADER: {rewrite: {source: $COMMAND, rewriters: [value, trivia]}}
    NAME: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $NAME
---
id: pgsql-member-statement
language: pgsql
role: member
symbolType: operator
isPublic: false
parentRuleIds: [pgsql-trigger, pgsql-function]
rule:
    all:
        - kind: select_no_parens, InsertStmt, UpdateStmt, DeleteStmt, NotifyStmt
          pattern: $DECLARATION
          inside: {kind: 'routine_body_stmt_list, RuleActionMulti, RuleActionList'}
          any:
              - has: {kind: 'qualified_name, ColId, insert_target, relation_expr_opt_alias', pattern: $SUBJECT}
              - has: {kind: simple_select, has: {kind: from_clause, has: {kind: table_ref, pattern: $SUBJECT, stopBy: {kind: 'select_no_parens, select_with_parens'}}}}
              - has: {regex: '(?i-u)^(select|values)$', pattern: $$SUBJECT, stopBy: end}
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - id: clause
      rule:
          kind: where_clause, sort_clause, select_limit, for_locking_clause, returning_clause, opt_on_conflict, with_clause, group_clause, having_clause, window_clause, comment
          not: {inside: {kind: 'func_application, window_specification'}}
      fix: ' '
    - id: body
      rule:
          any:
              - kind: set_clause_list
              - {kind: 'target_list, func_arg_list, expr_list, insert_column_list', regex: "\n"}
              - {kind: a_expr, all: [{inside: {kind: target_el}}, {not: {has: {kind: c_expr, has: {kind: columnref}}}}]}
              - {kind: expr_list, inside: {kind: values_clause}}
              - {kind: 'string_literal, escape_string_literal, dollar_quoted_string, substitution', inside: {kind: notify_payload}}
              - {kind: 'select_no_parens, select_with_parens, values_clause, substitution', inside: {kind: insert_rest}}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [clause, body]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $SUBJECT
signature: $SIGNATURE
---
id: pgsql-member-query
language: pgsql
role: member
symbolType: variable
isPublic: false
parentRuleIds: [pgsql-table, pgsql-statement]
rule:
    all:
        - any:
              - {kind: common_table_expr, has: {field: name, pattern: $NAME}}
              - {kind: window_definition, has: {kind: ColId, pattern: $NAME}}
              - kind: table_ref
                all: [{has: {kind: select_with_parens}}, {has: {kind: alias_clause, has: {kind: ColId, pattern: $NAME}}}]
        - pattern: $DECLARATION
        - not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}]}}
rewriters:
    - {id: trivia, rule: {kind: comment}, fix: ' '}
    - {id: body, rule: {kind: 'select_no_parens, InsertStmt, UpdateStmt, DeleteStmt, MergeStmt'}, fix: …}
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\v\f\r ]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))', by: '$1$2'}}
name: $NAME
signature: $SIGNATURE
---
id: pgsql-member-error
language: pgsql
role: member
parentRuleIds: [pgsql-enum, pgsql-table, pgsql-index, pgsql-statement, pgsql-function, pgsql-trigger]
symbolType: 'null'
rule:
    any:
        - kind: ERROR
          not: {has: {stopBy: end, kind: 'columnDef, columnOptions, TableFuncElement, TableLikeClause, TableConstraint, func_arg_with_default, func_arg, table_func_column, alter_table_cmd, alter_type_cmd, partition_cmd, index_partition_cmd, common_table_expr, window_definition, table_ref'}}
        - {kind: ERROR, not: {has: {pattern: $_, not: {kind: 'columnDef, columnOptions, TableFuncElement, TableLikeClause, TableConstraint, func_arg_with_default, func_arg, table_func_column, alter_table_cmd, alter_type_cmd, partition_cmd, index_partition_cmd, common_table_expr, window_definition, table_ref'}}}}
        - all:
              - any: [{kind: 'identifier, comment'}, {pattern: ')'}, {pattern: ']'}]
              - inside: {kind: ERROR, stopBy: {kind: 'ERROR, source_file'}}
              - not: {follows: {stopBy: end, pattern: $_, not: {matches: row}}}
              - not: {inside: {stopBy: {kind: ERROR}, not: {kind: ERROR}, follows: {stopBy: end, pattern: $_, not: {matches: row}}}}
        - {regex: '^$', any: [{kind: 'identifier, operator'}, {pattern: ')'}, {pattern: ']'}, {pattern: '='}]}
utils:
    row: {kind: 'ERROR, columnDef, columnOptions, TableFuncElement, TableLikeClause, TableConstraint, func_arg_with_default, func_arg, table_func_column, alter_table_cmd, alter_type_cmd, partition_cmd, index_partition_cmd, common_table_expr, window_definition, table_ref'}
name: ERROR
signature: ''
isPublic: false
