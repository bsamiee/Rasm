# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-main-screen-layout
language: swift
severity: error
rule:
    pattern: NSScreen.main
message: '`NSScreen.main` sizes a window under layout by the key window''s screen'
note: 'Read `screen` of the window under layout, or size the content and let the window clamp it to its screen'
