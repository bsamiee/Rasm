id: no-call-target
valid:
    # The dependency named on the consuming target
    - |
      <Target Name="Report" DependsOnTargets="Compute"><Message Text="$(Computed)" /></Target>
invalid:
    # A CallTarget before the task that reads its property, $(Computed) is empty in the Message
    - |
      <Target Name="Report"><CallTarget Targets="Compute" /><Message Text="$(Computed)" /></Target>
