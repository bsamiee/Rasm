# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-typeset"
edition.workspace = true
publish           = false

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [TEST]
[[test]]
name = "export"
path = "../../../../tests/rust/documents/typeset/export.rs"

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
rayon                              = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
indexmap                           = { workspace = true }
cap-std                            = { workspace = true }
rmp-serde                          = { workspace = true }
serde                              = { workspace = true }
serde_path_to_error                = { workspace = true }
toml                               = { workspace = true }
jiff                               = { workspace = true }
reqwest                            = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
png                                = { workspace = true }
ttf-parser                         = { workspace = true }
merman                             = { workspace = true }
typst                              = { workspace = true }
typst-bundle                       = { workspace = true }
typst-html                         = { workspace = true }
typst-kit                          = { workspace = true }
typst-layout                       = { workspace = true }
typst-pdf                          = { workspace = true }
typst-render                       = { workspace = true }
typst-svg                          = { workspace = true }

# --- [TESTING]
[dev-dependencies]
nonempty-collections = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
