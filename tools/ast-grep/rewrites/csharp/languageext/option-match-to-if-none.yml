# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: option-match-to-if-none
language: csharp
severity: off
rule:
    any:
        - pattern: {context: "class C { object F() => $OPTION.Match(Some: $IDENTITY, None: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $OPTION.Match(None: $FALLBACK, Some: $IDENTITY); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $OPTION.Match($IDENTITY, None: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $OPTION.Match(Some: $IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - all:
            - pattern: {context: "class C { object F() => $OPTION.Match($IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
            - not:
                has:
                    field: arguments
                    kind: argument_list
                    has:
                        kind: argument
                        has: {field: name, kind: identifier}
        - pattern: {context: "class C { object F() => $CALLEE($INPUT, Some: $IDENTITY, None: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $CALLEE($INPUT, None: $FALLBACK, Some: $IDENTITY); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $CALLEE($INPUT, $IDENTITY, None: $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - pattern: {context: "class C { object F() => $CALLEE($INPUT, Some: $IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
        - all:
            - pattern: {context: "class C { object F() => $CALLEE($INPUT, $IDENTITY, $FALLBACK); }", selector: invocation_expression, strictness: cst}
            - not:
                has:
                    field: arguments
                    kind: argument_list
                    has:
                        kind: argument
                        has: {field: name, kind: identifier}
constraints:
    CALLEE: {regex: '^((global::)?(LanguageExt\.)?Prelude\.)?match$'}
    IDENTITY: {matches: csharp-identity-callback}
transform:
    HEAD: {replace: {source: $OPTION, replace: '(?s)^(.*)$', by: '${1}.IfNone'}}
    CALL: {replace: {source: $CALLEE, replace: 'match$', by: 'ifNone'}}
    FIRST: {replace: {source: $INPUT, replace: '(?s)^(.*)$', by: '${1}, '}}
fix: "$HEAD$CALL($FIRST$FALLBACK)"
message: Use `IfNone` for an unchanged Some value and a fallback
note: Write IfNone with the fallback on an Option<A> Match that Roslyn resolves to result A, and keep Match for a wider result or an Action fallback
