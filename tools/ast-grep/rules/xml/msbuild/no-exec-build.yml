# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exec-build
language: xml
severity: error
files: ['**/*.{csproj,props,targets}']
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^Exec$'}}}
        - matches:
            msbuild-metadata:
                name: {regex: '^Command$'}
                value:
                    regex: '(?i)^["'']\s*(?:&quot;)?(?:[^\s"''&]*[\\/])?(?:dotnet(?:\.exe)?(?:&quot;)?\s+(?:build|msbuild|pack|publish|restore|test|run)\b|msbuild(?:\.exe)?(?:&quot;)?(?:\s|["'']$))'
                    not: {regex: '^["'']\s*(?:dotnet \s*(?:build|msbuild|pack|publish|restore|test|run)|msbuild)'}
                    pattern: _COMMAND
transform:
    COMMAND_TEXT: {replace: {source: $COMMAND, replace: '^["'']|["'']$', by: ''}}
message: '`Exec` starts `$COMMAND_TEXT` as a build the engine neither schedules nor logs'
note: 'Build the project through `ProjectReference` with `ReferenceOutputAssembly="false"` or the `MSBuild` task'
