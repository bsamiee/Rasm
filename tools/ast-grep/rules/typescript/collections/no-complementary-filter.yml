# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-complementary-filter
language: tsx
severity: error
rule:
    kind: call_expression
    all:
        - has: {field: function, kind: member_expression, has: {field: property, regex: '^filter$'}}
        - any:
            - pattern: '$R.filter(($P) => !($B))'
            - pattern: '$R.filter(($P) => !$B)'
            - pattern: '$R.filter($P => !($B))'
            - pattern: '$R.filter($P => !$B)'
            - pattern: '$MODULE.filter($R, ($P) => !($B))'
            - pattern: '$MODULE.filter($R, ($P) => !$B)'
            - pattern: '$MODULE.filter($R, $P => !($B))'
            - pattern: '$MODULE.filter($R, $P => !$B)'
        - inside:
            kind: 'statement_block, arrow_function, program'
            stopBy: &unconditional
                not:
                    kind: 'call_expression, member_expression, arguments, lexical_declaration, variable_declarator, expression_statement, return_statement, array, object, pair, spread_element, parenthesized_expression, await_expression, assignment_expression, as_expression, satisfies_expression, non_null_expression'
            has:
                stopBy: *unconditional
                kind: call_expression
                any:
                    - pattern: '$R.filter(($P) => $B)'
                    - pattern: '$R.filter($P => $B)'
                    - pattern: '$MODULE.filter($R, ($P) => $B)'
                    - pattern: '$MODULE.filter($R, $P => $B)'
message: 'Two `filter` calls test `$R` with one predicate, once negated'
note: 'Call `effect` `Array.partition(<source>, Filter.fromPredicate(<predicate>))` once for `[passes, fails]` in one pass'
