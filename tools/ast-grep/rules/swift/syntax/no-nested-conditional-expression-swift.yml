# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-conditional-expression-swift
language: swiftlang
severity: error
utils:
    nested-body:
        matches: {swift-single-statement: {first: {kind: 'if_statement, switch_statement'}}}
    nesting-branch:
        any:
            - kind: if_statement
              any:
                - has: {kind: statements, matches: nested-body}
                - has: {kind: if_statement, matches: nesting-branch}
            - kind: switch_statement
              has: {kind: switch_entry, has: {kind: statements, matches: {swift-single-statement: {first: {kind: if_statement}}}}}
rule:
    pattern: $VALUE
    any:
        - kind: ternary_expression
          not: {inside: {kind: ternary_expression, stopBy: {not: {kind: 'tuple_expression, prefix_expression'}}}}
          any:
            - has: {kind: ternary_expression, stopBy: {not: {kind: 'tuple_expression, prefix_expression'}}}
            - inside:
                matches: {swift-single-statement: {first: {kind: ternary_expression}}}
                inside: {kind: 'if_statement, switch_entry'}
        - kind: 'if_statement, switch_statement'
          matches: nesting-branch
          any:
            - inside: {kind: property_declaration, field: value}
            - inside: {kind: 'assignment, control_transfer_statement', field: result}
transform:
    HEAD: {replace: {source: $VALUE, replace: '(?s)\n.*$', by: ''}}
message: '`$HEAD` selects a value through a nested conditional'
note: 'Select with one `if` expression per test, a `switch` over the combined subjects (`switch (<a>, <b>)`), or a `where` clause on the case'
