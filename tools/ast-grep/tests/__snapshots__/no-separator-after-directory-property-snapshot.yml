id: no-separator-after-directory-property
snapshots:
  ? |
    <Compile Include="$(MSBuildThisFileDirectory)//generated/*.cs" />
  : fixed: |
      <Compile Include="$(MSBuildThisFileDirectory)generated/*.cs" />
    labels:
    - source: '"$(MSBuildThisFileDirectory)//generated/*.cs"'
      style: primary
      start: 17
      end: 62
  ? |
    <Compile Include="$(MSBuildThisFileDirectoryNoRoot)/*.cs" />
  : fixed: |
      <Compile Include="$(MSBuildThisFileDirectoryNoRoot)*.cs" />
    labels:
    - source: '"$(MSBuildThisFileDirectoryNoRoot)/*.cs"'
      style: primary
      start: 17
      end: 57
  ? |
    <Import Project="$(MSBuildThisFileDirectory)\common.props" />
  : fixed: |
      <Import Project="$(MSBuildThisFileDirectory)common.props" />
    labels:
    - source: '"$(MSBuildThisFileDirectory)\common.props"'
      style: primary
      start: 16
      end: 58
  ? |
    <Import Project='$(MSBuildThisFileDirectory)/common.props' />
  : fixed: |
      <Import Project='$(MSBuildThisFileDirectory)common.props' />
    labels:
    - source: '''$(MSBuildThisFileDirectory)/common.props'''
      style: primary
      start: 16
      end: 58
  ? |
    <PropertyGroup><RepoRoot>$(MSBuildThisFileDirectory)/</RepoRoot></PropertyGroup>
  : fixed: |
      <PropertyGroup><RepoRoot>$(MSBuildThisFileDirectory)</RepoRoot></PropertyGroup>
    labels:
    - source: $(MSBuildThisFileDirectory)/
      style: primary
      start: 25
      end: 53
