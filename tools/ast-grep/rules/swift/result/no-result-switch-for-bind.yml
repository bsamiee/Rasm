# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-result-switch-for-bind
language: swift
severity: error
utils:
    failure-value:
        any:
            - pattern: {context: 'func f() { return .failure($$$_) }', selector: control_transfer_statement}
            - {kind: call_expression, regex: '^\.failure\('}
    failure-return:
        matches: {swift-single-statement: {first: {matches: failure-value}}}
    failure-entry:
        kind: switch_entry
        all:
            - has: {kind: switch_pattern, regex: '^(let\s+)?\.failure\b'}
            - has: {matches: failure-return}
    success-entry:
        kind: switch_entry
        all:
            - has: {kind: switch_pattern, regex: '^(let\s+)?\.success\b'}
            - not: {has: {kind: switch_pattern, nthChild: {position: 2, ofRule: {kind: switch_pattern}}}}
            - not: {has: {kind: statements, has: {nthChild: 1, matches: failure-value}}}
rule:
    any:
        - kind: switch_statement
          all:
            - not: {has: {field: expr, kind: self_expression}}
            - has: {matches: success-entry}
            - has: {matches: failure-entry}
            - not: {has: {kind: switch_entry, nthChild: {position: 3, ofRule: {kind: switch_entry}}}}
        - kind: if_statement
          regex: '^if\s+case\s+(let\s+)?\.failure\b'
          has: {matches: failure-return}
        - kind: guard_statement
          regex: '^guard\s+case\s+(let\s+)?\.success\b'
          not: {regex: '(?s)^guard\s+case\s+(let\s+)?\.success\b[^,]*,.*\b(case|let|var)\b'}
          has: {matches: failure-return}
message: 'Statement unpacks a Result to return its failure and bind its value'
note: 'Use `<result>.flatMap { value in <continuation> }` with `mapError` first where the failure arm replaces the error and an async flatMap where the continuation awaits, one call skips the continuation on a failure'
