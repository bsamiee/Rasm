# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-impl-trait-param
language: rust
severity: error
rule:
    kind: abstract_type
    pattern: $PARAM
    all:
        - not: {inside: {kind: abstract_type, stopBy: {kind: parameter}}}
        - inside:
            kind: parameter
            stopBy: end
            inside:
                kind: parameters
                inside:
                    kind: 'function_item, function_signature_item'
                    field: parameters
                    all:
                        - any: [{not: {has: {kind: visibility_modifier, regex: '^pub$'}}}, {matches: rust-test-scope}]
                        - not: {inside: {kind: declaration_list, inside: {kind: impl_item, has: {field: trait, regex: '\S'}}}}
                        - not: {inside: {kind: declaration_list, inside: {kind: trait_item, has: {kind: visibility_modifier}}}}
message: '`$PARAM` declares an anonymous type parameter'
note: 'Name the type as a generic parameter bounded in the `where` clause (`fn f<I>(items: I) where I: Iterator<Item = u8>`)'
