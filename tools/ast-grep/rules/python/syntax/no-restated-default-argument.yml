# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
id: no-restated-default-argument
language: python
severity: error
rule:
    pattern: $ARG
    matches: python-restated-default-argument
message: '`$ARG` restates the documented default of its callee'
note: >-
    Delete the argument, the callee holds the value, and `nx run rasm:rewrite --id=restated-default-argument-to-omitted` drops
    every one that no comment sits beside and no positional argument follows
