id: no-duplicate-project-instance
snapshots:
  ? |
    <MSBuild Projects="$(MSBuildProjectFullPath)" Targets="Publish" Properties="_IsPublishing=true" />
  : labels:
    - source: <MSBuild Projects="$(MSBuildProjectFullPath)" Targets="Publish" Properties="_IsPublishing=true" />
      style: primary
      start: 0
      end: 98
  ? |
    <MSBuild Projects="$(MSBuildProjectFullPath)" Targets="Publish" Properties='_IsPublishing=true' />
  : labels:
    - source: <MSBuild Projects="$(MSBuildProjectFullPath)" Targets="Publish" Properties='_IsPublishing=true' />
      style: primary
      start: 0
      end: 98
