# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-implicit-modeling"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["implicit", "sdf", "lattice", "solids"]
categories           = ["graphics", "mathematics"]
description          = "Implicit field solids: field trees, lattices, shell walls, and octree meshing"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon        = { workspace = true }
thiserror    = { workspace = true }
derive-where = { workspace = true }
itertools    = { workspace = true }
nalgebra     = { workspace = true }
statrs       = { workspace = true }
fidget       = { workspace = true }
parry3d-f64  = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
