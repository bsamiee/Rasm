# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-prefix-by-substr
language: sql
severity: error
utils:
    leading-slice:
        kind: function_call
        any:
            - all:
                - has: {field: name, regex: '(?i)^substr(ing)?$'}
                - has:
                    field: arguments
                    kind: normal_function_arguments
                    all:
                        - has: {nthChild: 1, pattern: _SUBJECT}
                        - has: {nthChild: 2, kind: numeric_literal, regex: '^1$'}
                        - has: {nthChild: 3, pattern: _LENGTH}
                        - not: {has: {nthChild: 4}}
            - all:
                - has: {field: name, regex: '(?i)^left$'}
                - has:
                    field: arguments
                    kind: normal_function_arguments
                    all:
                        - has: {nthChild: 1, pattern: _SUBJECT}
                        - has: {nthChild: 2, pattern: _LENGTH}
                        - not: {has: {nthChild: 3}}
    prefix-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^(==?|<>|!=)$', pattern: __OPERATOR}
            - any:
                - all: [{has: {field: left, matches: leading-slice}}, {has: {field: right, pattern: _PREFIX}}]
                - all: [{has: {field: right, matches: leading-slice}}, {has: {field: left, pattern: _PREFIX}}]
    prefix-length:
        kind: function_call
        all:
            - has: {field: name, regex: '(?i)^length$'}
            - has: {field: arguments, has: {nthChild: 1, pattern: _PREFIX}}
    base-length:
        kind: function_call
        all:
            - has: {field: name, regex: '(?i)^length$'}
            - has: {field: arguments, has: {nthChild: 1, pattern: _BASE}}
    separated-length:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\+$'}
            - any:
                - all: [{has: {field: left, matches: base-length}}, {has: {field: right, kind: numeric_literal, regex: '^1$'}}]
                - all: [{has: {field: right, matches: base-length}}, {has: {field: left, kind: numeric_literal, regex: '^1$'}}]
    separated-prefix:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^\|\|$'}
            - has: {field: left, pattern: _BASE}
            - has: {field: right, kind: string_literal, regex: "^'([^']|'')'$"}
rule:
    matches: prefix-test
    pattern: _TEST
    any:
        - pattern: _FIXABLE
          any:
            - has: {matches: leading-slice, has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, matches: prefix-length}}}
            - all:
                - has: {matches: leading-slice, has: {field: arguments, has: {nthChild: {position: 1, reverse: true}, matches: separated-length}}}
                - has: {matches: separated-prefix}
        - pattern: _KEPT
rewriters:
    - id: position
      rule: {matches: prefix-test}
      transform:
        EQUAL: {replace: {source: $OPERATOR, replace: '^==?$', by: '='}}
        RELATION: {replace: {source: $EQUAL, replace: '^!=$', by: '<>'}}
      fix: instr($SUBJECT, $PREFIX) $RELATION 1
transform:
    FIXED: {rewrite: {source: $FIXABLE, rewriters: [position]}}
fix: $FIXED$KEPT
message: '`$TEST` tests a prefix through a slice as long as the prefix'
note: 'Use `instr(<subject>, <prefix>) = 1`, a test SQLite and DuckDB both read with the prefix stated once'
