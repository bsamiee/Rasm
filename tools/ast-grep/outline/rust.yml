transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [enum-body]}}
    FOLDED: {replace: {source: $HEADER, replace: '\p{White_Space}+;?$|\p{White_Space}*\n\p{White_Space}*', by: ' '}}
