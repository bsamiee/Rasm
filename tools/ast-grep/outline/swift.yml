        any:
            - inside: {kind: 'class_body, enum_class_body, protocol_body', inside: {kind: 'class_declaration, protocol_declaration', any: [{inside: {kind: source_file}}, {has: {field: name, pattern: $OWNER}}]}}
            - inside: {kind: statements}
rewriters:
    - id: body
      rule: {kind: enum_class_body, inside: {kind: class_declaration, field: body}}
