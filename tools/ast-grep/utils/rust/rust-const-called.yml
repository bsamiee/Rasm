# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-const-called
language: rust
rule:
    kind: function_item
    all:
        - has: {kind: function_modifiers, regex: '\bconst\b'}
        - has: {field: name, pattern: $NAME}
        - inside:
            kind: source_file
            stopBy: end
            has:
                stopBy: end
                kind: call_expression
                has:
                    field: function
                    any:
                        - pattern: $NAME
                        - {kind: scoped_identifier, has: {field: name, pattern: $NAME}}
                        - {kind: field_expression, has: {field: field, pattern: $NAME}}
                inside: {stopBy: {kind: 'function_item, closure_expression, const_item, static_item, const_block'}, kind: 'const_item, static_item, const_block'}
