# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    break-binding:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Break$'}
            - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $VALUE}
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
    continue-binding:
        kind: tuple_struct_pattern
        all:
            - has: {field: type, regex: '^((::)?(std|core)::ops::)?(ControlFlow::)?Continue$'}
            - has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $VALUE}
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
    returning-arm:
        kind: match_arm
        all:
            - has: {field: pattern, kind: match_pattern, all: [{not: {has: {field: condition, pattern: $_}}}, {has: {any: [{matches: break-binding}, {matches: continue-binding}]}}]}
            - has: {field: value, kind: identifier, pattern: $VALUE}
    other-arm:
        kind: match_arm
        all:
            - has:
                field: pattern
                kind: match_pattern
                all:
                    - not: {has: {field: condition, pattern: $_}}
                    - has: {kind: tuple_struct_pattern, all: [{has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $OTHER}}, {not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}
            - has:
                field: value
                any:
                    - {kind: identifier, pattern: $OTHER}
                    - kind: call_expression
                      all:
                        - has: {field: function, kind: 'identifier, scoped_identifier'}
                        - has: {field: arguments, all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, kind: identifier, pattern: $OTHER}}, {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}}]}
rule:
    any:
        - kind: or_pattern
          all:
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
            - any:
                - all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: break-binding}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: continue-binding}}]
                - all: [{has: {nthChild: {position: 1, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: continue-binding}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'line_comment, block_comment'}}}, matches: break-binding}}]
        - kind: match_block
          all:
            - not: {has: {nthChild: {position: 3, ofRule: {not: {kind: 'line_comment, block_comment'}}}}}
            - has:
                matches: returning-arm
                any:
                    - precedes: {stopBy: end, matches: other-arm}
                    - follows: {stopBy: end, matches: other-arm}
message: '`Break` and `Continue` arms return the value each `ControlFlow` variant holds'
note: 'Call `into_value()`, aligning variant types through `map_break` or `map_continue`, and mapping outer `Result` or `Option`'
