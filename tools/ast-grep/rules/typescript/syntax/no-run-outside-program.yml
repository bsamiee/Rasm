# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
ignores: ['**/main.ts', '**/main.tsx', 'plugins/function-hooks/server.ts', 'plugins/function-hooks/codex.ts']
rule:
    any:
        - {kind: identifier, regex: '^runMain$', not: {inside: {kind: import_specifier}}}
        - {kind: property_identifier, regex: '^runMain$', inside: {kind: member_expression, field: property}}
message: '`runMain` runs a program outside its `main.ts`'
note: 'Return the effect with its requirements unprovided, and provide platform layers and call `runMain` in program `main.ts`'
