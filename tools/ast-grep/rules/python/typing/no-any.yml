# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-any
language: python
severity: error
rule:
    matches: {python-module-member: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^Any$', pattern: $NAME}}}
message: '`$NAME` disables the type checker at every use'
note: Name the type, a type parameter `[T]`, or `object` at a validated boundary
