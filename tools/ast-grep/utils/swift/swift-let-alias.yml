# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: swift-let-alias
language: swiftlang
utils:
    bound-pattern:
        kind: 'pattern, switch_pattern'
        any:
            - has: {field: bound_identifier, pattern: $NAME}
            - has: {kind: pattern, matches: bound-pattern}
            - all:
                - not: {has: {kind: 'pattern, user_type'}}
                - has: {kind: simple_identifier, pattern: $NAME}
                - any:
                    - has: {kind: value_binding_pattern}
                    - inside:
                        stopBy: {not: {kind: 'pattern, switch_pattern'}}
                        kind: 'pattern, switch_pattern'
                        has: {kind: value_binding_pattern}
                    - inside:
                        stopBy: {not: {kind: pattern}}
                        kind: 'property_declaration, for_statement'
                    - inside: {kind: 'if_statement, while_statement, guard_statement'}
                      follows: {kind: value_binding_pattern, stopBy: {regex: '^case$'}}
                    - inside:
                        stopBy: {not: {kind: 'pattern, switch_pattern'}}
                        kind: pattern
                        follows: {kind: value_binding_pattern, stopBy: {regex: '^case$'}}
                        inside: {kind: 'if_statement, while_statement, guard_statement'}
    binding:
        any:
            - kind: property_declaration
              has: {kind: pattern, matches: bound-pattern}
            - kind: 'parameter, lambda_parameter'
              has: {field: name, kind: simple_identifier, pattern: $NAME}
            - kind: capture_list_item
              all:
                - has: {field: name, kind: simple_identifier, pattern: $NAME}
                - has: {field: value, pattern: $_}
                - not: {has: {field: value, pattern: $NAME}}
            - kind: for_statement
              has: {field: item, matches: bound-pattern}
            - kind: 'if_statement, while_statement, guard_statement'
              any:
                - has: {kind: simple_identifier, pattern: $NAME, follows: {stopBy: {not: {kind: 'comment, multiline_comment'}}, kind: value_binding_pattern}}
                - has: {kind: pattern, matches: bound-pattern}
            - kind: catch_block
              has: {kind: pattern, matches: bound-pattern}
            - kind: switch_entry
              has: {kind: switch_pattern, matches: bound-pattern}
    shadowing-body:
        kind: statements
        any:
            - inside:
                kind: function_body
                inside: {kind: 'function_declaration, init_declaration, subscript_declaration', has: {kind: parameter, matches: binding}}
            - inside:
                kind: lambda_literal
                any:
                    - has: {field: type, has: {stopBy: end, kind: lambda_parameter, matches: binding}}
                    - has: {field: captures, has: {kind: capture_list_item, matches: binding}}
            - inside: {kind: 'for_statement, while_statement, catch_block, switch_entry', matches: binding}
            - nthChild: {position: 1, ofRule: {kind: statements}}
              inside: {kind: if_statement, matches: binding}
    shadowing-context:
        any:
            - kind: property_declaration
              has: {field: computed_value, kind: computed_property}
              matches: binding
            - kind: where_clause
              inside: {kind: 'for_statement, catch_block', matches: binding}
            - not: {kind: 'switch_pattern, statements'}
              follows: {stopBy: end, kind: where_keyword}
              inside: {kind: switch_entry, matches: binding}
            - all:
                - not: {any: [{kind: 'statements, else'}, {follows: {kind: else, stopBy: {not: {kind: 'comment, multiline_comment'}}}}]}
                - inside: {kind: 'if_statement, while_statement, guard_statement'}
                - follows:
                    stopBy: end
                    regex: '^,$'
                    follows:
                        stopBy: end
                        any:
                            - kind: simple_identifier
                              pattern: $NAME
                              follows: {kind: value_binding_pattern, stopBy: {not: {kind: 'comment, multiline_comment'}}}
                            - kind: pattern
                              matches: bound-pattern
    shadowed:
        any:
            - inside:
                stopBy: end
                follows: {stopBy: end, kind: property_declaration, matches: binding}
                inside: {stopBy: end, pattern: $ALIAS_OWNER}
            - inside:
                stopBy: end
                matches: shadowing-body
                inside: {stopBy: end, pattern: $ALIAS_OWNER}
            - inside:
                stopBy: end
                follows: {stopBy: end, kind: guard_statement, matches: binding}
                any:
                    - pattern: $ALIAS_OWNER
                    - inside: {stopBy: end, pattern: $ALIAS_OWNER}
            - inside:
                stopBy: end
                matches: shadowing-context
                any:
                    - pattern: $ALIAS_OWNER
                    - inside: {stopBy: end, pattern: $ALIAS_OWNER}
            - all:
                - regex: '^error$'
                - inside:
                    stopBy: end
                    kind: catch_block
                    not: {has: {kind: pattern}}
                    any:
                        - pattern: $ALIAS_OWNER
                        - inside: {stopBy: end, pattern: $ALIAS_OWNER}
rule:
    kind: simple_identifier
    pattern: $NAME
    all:
        - inside:
            stopBy: end
            pattern: $ALIAS_OWNER
            follows:
                stopBy: end
                kind: property_declaration
                all:
                    - has: {kind: value_binding_pattern, regex: '^let$'}
                    - has: {kind: pattern, has: {field: bound_identifier, pattern: $NAME}}
        - not: {matches: shadowed}
