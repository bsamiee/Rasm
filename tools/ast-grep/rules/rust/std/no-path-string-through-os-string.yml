# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-path-string-through-os-string
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $P.into_os_string().into_string()
fix: $P.into_string()
message: '`$P` converts to `String` through an intermediate `OsString`'
note: 'Call `<path>.into_string()` and handle its `Err(PathBuf)` in place of `Err(OsString)`'
