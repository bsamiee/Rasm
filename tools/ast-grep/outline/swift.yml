id: swift-member-struct
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object]
symbolType: struct
rule:
    kind: &declaration class_declaration
    pattern: $DECLARATION
    inside: &scope {kind: 'source_file > :is(class_declaration, protocol_declaration) > :is(class_body, enum_class_body, protocol_body)'}
    all:
        - has: {field: declaration_kind, regex: '^struct$'}
        - has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: class_body, inside: {kind: *declaration, inside: *scope}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
        - not:
              any:
                  - has: &private {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}
                  - inside:
                        kind: class_body
                        inside:
                            kind: class_declaration
                            has:
                                field: declaration_kind
                                regex: '^extension$'
                                follows: {all: [*private], stopBy: {pattern: $_, not: {kind: 'comment, multiline_comment'}}}

