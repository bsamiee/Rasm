# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-hex-pair-parse
language: rust
utils:
    pair-step:
        regex: '\.(step_by|chunks|chunks_exact)\(\s*2\s*\)'
    iteration:
        any:
            - kind: for_expression
            - kind: closure_expression
              inside: {kind: arguments, inside: {kind: call_expression}}
rule:
    kind: call_expression
    all:
        - has: {field: function, regex: '^((::)?(std|core)::)?u8::from_str_radix$'}
        - has: {field: arguments, all: [{has: {nthChild: 2, regex: '^16$'}}, {not: {has: {nthChild: 3}}}]}
        - any:
            - all:
                - has: {field: arguments, has: {nthChild: 1, has: {stopBy: end, kind: range_expression, regex: '\+\s*2$'}}}
                - inside: {stopBy: {kind: 'function_item, closure_expression, for_expression'}, matches: iteration}
            - inside:
                stopBy: {kind: 'function_item, closure_expression, for_expression'}
                any:
                    - kind: for_expression
                      has: {field: value, matches: pair-step}
                    - kind: closure_expression
                      inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, kind: field_expression, has: {field: value, matches: pair-step}}}}
