# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/python_rule.json
# Docstring statement, the string as the first named child of a def or class body, a later string is a value
id: python-docstring
language: python
rule:
    kind: expression_statement
    all:
        - has: {kind: string}
        - nthChild: 1
        - inside: {kind: block, inside: {any: [{kind: function_definition}, {kind: class_definition}]}}
