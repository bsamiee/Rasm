# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-member-name-reflection-python
language: python
severity: error
utils:
    member-name:
        any:
            - matches: python-identifier-string
            - matches: python-relayed-identifier-string
    reader:
        kind: 'identifier, attribute'
        matches: {builtins-attribute-function: {name: {regex: '^getattr(_static)?$'}}}
    writer:
        kind: 'identifier, attribute'
        matches: {builtins-attribute-function: {name: {regex: '^(setattr|delattr)$'}}}
    object-dunder:
        kind: attribute
        regex: '^object\.__(getattribute|setattr|delattr)__$'
    getter:
        kind: 'identifier, attribute'
        matches: {python-member-use: {module: {regex: '^operator$'}, name: {regex: '^(attrgetter|methodcaller)$'}}}
    reached:
        kind: call
        any:
            - all:
                - has: {field: arguments, has: {nthChild: 2, matches: python-relayed-identifier-string}}
                - any:
                    - all: [{has: {field: function, matches: reader}}, {not: {has: {field: arguments, has: {nthChild: 3}}}}]
                    - has: {field: function, matches: writer}
                    - has: {field: function, matches: object-dunder}
            - all:
                - has: {field: arguments, has: {nthChild: 2, matches: python-identifier-string}}
                - any:
                    - all:
                        - has: {field: function, matches: reader, not: {regex: '^(builtins\.)?getattr$'}}
                        - not: {has: {field: arguments, has: {nthChild: 3}}}
                    - all:
                        - has: {field: function, matches: writer}
                        - not: {all: [{inside: {kind: expression_statement}}, {has: {field: function, regex: '^(builtins\.)?(setattr|delattr)$'}}]}
                    - has: {field: function, matches: object-dunder}
            - all:
                - has: {field: function, matches: functools-partial-callee}
                - has: {field: arguments, has: {nthChild: 1, any: [{matches: reader}, {matches: writer}, {matches: object-dunder}]}}
                - has: {field: arguments, has: {nthChild: 3, matches: member-name}}
            - all:
                - has: {field: function, matches: getter}
                - has:
                    field: arguments
                    has:
                        nthChild: 1
                        any:
                            - {kind: string, regex: '^[rRuU]?("|'')[A-Za-z_]\w*(\.[A-Za-z_]\w*)*("|'')$'}
                            - matches: python-relayed-identifier-string
    indexed:
        kind: subscript
        all:
            - has: {field: value, matches: inspect-member-mapping}
            - has: {field: subscript, matches: member-name}
            - not: {matches: python-key-catch}
rule:
    kind: 'call, subscript'
    pattern: $ACCESS
    all:
        - any:
            - matches: reached
            - matches: indexed
        - any:
            - all:
                - has: {field: function, regex: '^(operator\.)?attrgetter$'}
                - has: {field: arguments, kind: argument_list, has: {nthChild: 1, kind: string, pattern: $READ}, not: {has: {any: [{nthChild: 2}, {kind: comment}]}}}
            - all:
                - has: {field: function, regex: '^(operator\.)?methodcaller$'}
                - has: {field: arguments, kind: argument_list, has: {nthChild: 1, matches: python-identifier-string, pattern: $INVOKED}, not: {has: {any: [{nthChild: 2}, {kind: comment}]}}}
            - pattern: $KEPT
transform:
    READ_LAMBDA: {replace: {source: $READ, replace: '^[rRuU]?["'']([\w.]+)["'']$', by: 'lambda owner: owner.$1'}}
    INVOKED_LAMBDA: {replace: {source: $INVOKED, replace: '^[rRuU]?["''](\w+)["'']$', by: 'lambda owner: owner.$1()'}}
fix: $READ_LAMBDA$INVOKED_LAMBDA$KEPT
message: '`$ACCESS` reaches a member by a name string'
note: 'Use the member on its owner, a lambda for a deferred read or call, or a nested `def` for a deferred assignment, type checkers read a member reached by name as `Any` while a `vars` or `__dict__` read returns the stored descriptor of one namespace and stays'
