# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-global-handler-state
language: rust
severity: error
rule:
    pattern: $LOCATOR
    any:
        - kind: static_item
          all:
            - has: {field: type, regex: '^(\w+::)*(LazyLock|LazyCell|Lazy)\b'}
            - has: {field: value, regex: '\b(fs(_err)?::(tokio::)?(read|read_to_string|File::open)|File::open)\b'}
        - kind: generic_type
          all:
            - has: {field: type, regex: '^((std::)?collections::)?(HashMap|BTreeMap|IndexMap)$'}
            - has: {field: type_arguments, has: {nthChild: 1, regex: '^((std::)?any::)?TypeId$'}}
            - has: {field: type_arguments, has: {nthChild: 2, has: {stopBy: end, kind: dynamic_type, regex: '\bAny\b'}}}
message: '`$LOCATOR` supplies a dependency through a lazy global or a type-keyed lookup'
note: 'Build the value once in `main` and pass it through `Router::with_state` and the `State` extractor or a handler field the `StreamableHttpService` factory closure fills. A lazy global reading a file hides the dependency from every signature. A type-keyed registry turns a missing dependency into a run-time `None`. The `interior_mutable_static` dylint owns statics that mutate through a shared reference, and clippy `disallowed_methods` owns an environment read'
