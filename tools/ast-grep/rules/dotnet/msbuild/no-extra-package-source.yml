# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-extra-package-source
language: xml
severity: error
files: ["NuGet.config"]
utils:
    nuget-org-source:
        all:
            - matches: {msbuild-element: {name: {regex: "^packageSource$"}}}
            - matches: {msbuild-metadata: {name: {regex: "^key$"}, value: {regex: '^["'']nuget\.org["'']$'}}}
    local-feed-source:
        all:
            - matches: {msbuild-element: {name: {regex: "^packageSource$"}}}
            - matches: {msbuild-metadata: {name: {regex: "^key$"}, value: {regex: '^["'']local["'']$'}}}
rule:
    pattern: _ENTRY
    any:
        - matches: {msbuild-element: {name: {regex: "^add$"}}}
          inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: "^packageSources$"}}}}}
          not:
            any:
                - all:
                    - matches: {msbuild-metadata: {name: {regex: "^key$"}, value: {regex: '^["'']nuget\.org["'']$'}}}
                    - matches: {msbuild-metadata: {name: {regex: "^value$"}, value: {regex: '^["'']https://api\.nuget\.org/v3/index\.json["'']$'}}}
                - all:
                    - matches: {msbuild-metadata: {name: {regex: "^key$"}, value: {regex: '^["'']local["'']$'}}}
                    - matches: {msbuild-metadata: {name: {regex: "^value$"}, value: {regex: '^["'']\.artifacts/nuget["'']$'}}}
        - matches: {msbuild-element: {name: {regex: "^packageSource$"}}}
          inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: "^packageSourceMapping$"}}}}}
          not: {any: [{matches: nuget-org-source}, {matches: local-feed-source}]}
        - matches: {msbuild-element: {name: {regex: "^package$"}}}
          inside: {kind: content, inside: {any: [{matches: nuget-org-source}, {matches: local-feed-source}]}}
          not:
            any:
                - all:
                    - inside: {kind: content, inside: {matches: nuget-org-source}}
                    - matches: {msbuild-metadata: {name: {regex: "^pattern$"}, value: {regex: '^["'']\*["'']$'}}}
                - all:
                    - inside: {kind: content, inside: {matches: local-feed-source}}
                    - matches: {msbuild-metadata: {name: {regex: "^pattern$"}, value: {regex: '^["'']Rasm\.\*["'']$'}}}
transform:
    CORRECTED: rewrite($ENTRY, rewriters=[nuget-source, local-source, nuget-package, local-package, drop])
fix: $CORRECTED
rewriters:
    # A source row naming nuget.org by key or by address takes the pair, one naming the local feed takes its pair, the entry decides the element
    - id: nuget-source
      rule:
        pattern: _ENTRY
        any:
            - matches: {msbuild-metadata: {name: {regex: "^key$"}, value: {regex: '^["'']nuget\.org["'']$'}}}
            - matches: {msbuild-metadata: {name: {regex: "^value$"}, value: {regex: '^["'']https://api\.nuget\.org/v3/index\.json["'']$'}}}
      fix: <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
    - id: local-source
      rule:
        pattern: _ENTRY
        any:
            - matches: {msbuild-metadata: {name: {regex: "^key$"}, value: {regex: '^["'']local["'']$'}}}
            - matches: {msbuild-metadata: {name: {regex: "^value$"}, value: {regex: '^["'']\.artifacts/nuget["'']$'}}}
      fix: <add key="local" value=".artifacts/nuget" />
    # A package row under a source of the pair takes the source's pattern while the source lacks it
    - id: nuget-package
      rule:
        pattern: _ENTRY
        inside:
            kind: content
            inside: {matches: nuget-org-source}
            not: {has: {matches: {msbuild-metadata: {name: {regex: "^pattern$"}, value: {regex: '^["'']\*["'']$'}}}}}
      fix: <package pattern="*" />
    - id: local-package
      rule:
        pattern: _ENTRY
        inside:
            kind: content
            inside: {matches: local-feed-source}
            not: {has: {matches: {msbuild-metadata: {name: {regex: "^pattern$"}, value: {regex: '^["'']Rasm\.\*["'']$'}}}}}
      fix: <package pattern="Rasm.*" />
    # Every other source, mapping, or package row leaves
    - id: drop
      rule: {pattern: _ENTRY}
      fix: ''
message: The NuGet source or mapping differs from the repository's source pairs
note: Keep nuget.org at https://api.nuget.org/v3/index.json mapped to * and local at .artifacts/nuget mapped to Rasm.*
