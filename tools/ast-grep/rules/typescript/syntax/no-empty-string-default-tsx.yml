# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-empty-string-default-tsx
language: tsx
severity: error
utils:
    indexed-element:
        kind: subscript_expression
        pattern: $ELEMENT
        has: {field: index, kind: number}
    concatenation:
        any:
            - kind: binary_expression
              has: {field: operator, regex: '^\+$'}
            - kind: template_substitution
rule:
    kind: binary_expression
    all:
        - has: {field: left, matches: indexed-element}
        - has: {field: operator, regex: '^(\?\?|\|\|)$'}
        - has: {field: right, matches: syntax-empty-string}
        - not: {inside: {matches: concatenation, stopBy: {not: {kind: parenthesized_expression}}}}
message: '`$ELEMENT` defaults to an empty string standing for an absent element'
note: 'Bind `const [head] = <list>` and test `head === undefined`, the empty string stays a value'
