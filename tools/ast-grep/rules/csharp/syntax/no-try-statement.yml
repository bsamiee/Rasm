# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-statement
language: csharp
severity: error
ignores: ['tools/roslyn/**']
utils:
    release-boundary:
        kind: method_declaration
        any:
            - all: [{has: {field: name, regex: '^Dispose$'}}, {has: {field: returns, regex: '^void$'}}]
            - all: [{has: {field: name, regex: '^DisposeAsync$'}}, {has: {field: returns, regex: '^((global::)?System\.Threading\.Tasks\.)?ValueTask$'}}]
rule:
    kind: try_statement
    any:
        - has: {field: body, has: {nthChild: 1, pattern: $FIRST}}
        - has: {field: body, not: {has: {nthChild: 1}}}
    not:
        all:
            - has: {kind: finally_clause}
            - not: {has: {kind: catch_clause}}
            - inside: {stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, anonymous_method_expression'}, matches: release-boundary}
transform:
    LEAD: {replace: {source: $FIRST, replace: '(?s)\s*\n.*$', by: ''}}
message: '`try` around `$LEAD` handles exceptions inline'
note: 'Capture throws with `Try.lift` or `IO.lift` and release resources through `use` or `Bracket`'
