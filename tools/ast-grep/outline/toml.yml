        - kind: pair
          inside: {kind: 'table, table_array_element, inline_table'}
          all: [{has: {kind: inline_table, not: {has: {kind: 'pair, ERROR'}}, pattern: $EMPTY}}, {any: [{inside: {kind: 'table, table_array_element'}, has: {kind: 'bare_key, dotted_key', regex: '^[0-9A-Za-z_.-]+$', pattern: $BARE}}, {has: {kind: 'bare_key, quoted_key, dotted_key', pattern: $KEY}}]}]
        - kind: 'bare_key, quoted_key, dotted_key'
          any: [{regex: '^[0-9A-Za-z_.-]+$', inside: {kind: pair, inside: {kind: 'table, table_array_element'}}, pattern: $BARE}, {pattern: $KEY}]
          inside: {kind: pair, inside: {kind: 'table, table_array_element, inline_table'}, has: {kind: inline_table, has: {kind: 'pair, ERROR'}}}
rewriters:
    - {id: bare, rule: {kind: quoted_key, regex: '^["''][A-Za-z0-9_-]+["'']$', has: {kind: string_content, pattern: $PART}}, fix: $PART.}
    - {id: part, rule: {kind: 'bare_key, quoted_key', pattern: $PART}, fix: $PART.}
    - id: lineage
      rule:
        kind: 'bare_key, quoted_key, dotted_key'
