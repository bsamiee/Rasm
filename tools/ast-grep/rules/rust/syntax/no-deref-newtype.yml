# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-deref-newtype
language: rust
severity: error
utils:
    comment:
        kind: 'line_comment, block_comment'
    self-field:
        kind: field_expression
        all:
            - has: {field: value, kind: self}
            - has: {field: field, pattern: $F}
    field-forward:
        any:
            - matches: self-field
            - kind: 'reference_expression, parenthesized_expression'
              has: {nthChild: 1, matches: field-forward}
            - kind: unary_expression
              regex: '^\*'
              has: {matches: field-forward}
            - kind: call_expression
              all:
                - has: {field: function, kind: field_expression, has: {field: value, matches: self-field}}
                - has: {field: arguments, not: {has: {pattern: $_}}}
            - kind: 'return_expression, expression_statement'
              has: {matches: field-forward}
    forwarding-body:
        kind: block
        all:
            - has: {nthChild: {position: 1, ofRule: {not: {matches: comment}}}, matches: field-forward}
            - not: {has: {nthChild: {position: 2, ofRule: {not: {matches: comment}}}}}
    own-type:
        has: {field: type, any: [{kind: type_identifier, pattern: $NAME}, {kind: generic_type, has: {field: type, pattern: $NAME}}]}
    pointer-type:
        kind: generic_type
        has: {field: type, regex: '^((std|alloc|core)::(rc|sync|boxed|pin|ptr|mem)::)?(Rc|Arc|Box|Weak|Pin|NonNull|ManuallyDrop)$'}
    pointer-field:
        any:
            - kind: field_declaration_list
              has: {kind: field_declaration, all: [{has: {field: name, pattern: $F}}, {has: {field: type, matches: pointer-type}}]}
            - kind: ordered_field_declaration_list
              has: {field: type, matches: pointer-type}
    plain-struct:
        kind: struct_item
        all:
            - has: {field: name, pattern: $NAME}
            - not: {has: {field: type_parameters, has: {kind: lifetime_parameter}}}
            - not: {has: {field: body, matches: pointer-field}}
            - not: {follows: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, kind: attribute_item, regex: '^#\[\s*repr\s*\(.*\balign\s*\('}}
    undropped:
        inside: {kind: source_file, stopBy: end, not: {has: {stopBy: end, kind: impl_item, has: {field: trait, regex: '^((std|core)::)?(ops::)?Drop$'}, matches: own-type}}}
rule:
    any:
        - kind: impl_item
          all:
            - has: {field: trait, regex: '^((std|core)::)?(ops::)?(Deref|DerefMut)$', pattern: $TRAIT}
            - matches: own-type
            - has: {field: body, has: {kind: function_item, all: [{has: {field: name, regex: '^(deref|deref_mut)$'}}, {has: {field: body, matches: forwarding-body}}]}}
            - inside: {kind: source_file, stopBy: end, has: {stopBy: end, matches: plain-struct}}
            - matches: undropped
        - kind: attribute_item
          all:
            - has: {kind: attribute, all: [{has: {nthChild: 1, kind: identifier, regex: '^derive$'}}, {has: {field: arguments, has: {kind: identifier, regex: '^(Deref|DerefMut)$', pattern: $TRAIT}}}]}
            - precedes: {stopBy: {not: {kind: 'attribute_item, line_comment, block_comment'}}, matches: plain-struct}
            - matches: undropped
message: '`$TRAIT` for `$NAME` converts it implicitly into its inner value'
note: 'Expose the inner value through named methods of the newtype stating its domain operations, `Deref` belongs to smart pointers, guards, views, and alignment wrappers, and an implicit conversion exposes every method of the wrapped type past the newtype''s invariant. A newtype whose every member forwards goes, the `redundant_indirection` dylint owns it'
