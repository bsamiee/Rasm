# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-findall-single-match
language: python
severity: error
utils:
    first-element:
        kind: subscript
        has: {field: subscript, regex: '^0$'}
    compile-call:
        kind: call
        has: {field: function, matches: {python-member-use: {module: {regex: '^(re|regex)$'}, name: {regex: '^compile$'}}}}
    typed-pattern:
        matches: {python-typed-parameter: {type: {regex: '^((re|regex)\.)?Pattern(\[.*\])?$'}}}
    compiled-name:
        matches: {python-assigned-name: {value: {matches: compile-call}}}
    compiled-pattern:
        any:
            - kind: identifier
              any: [{matches: compiled-name}, {matches: typed-pattern}]
            - kind: attribute
              pattern: $RX
              has: {field: object, regex: '^self$'}
              inside: {kind: class_definition, stopBy: end, has: {stopBy: end, kind: assignment, all: [{has: {field: left, pattern: $RX}}, {has: {field: right, matches: compile-call}}]}}
    regex-callee:
        any:
            - matches: {python-member-use: {module: {regex: '^(re|regex)$'}, name: {regex: '^(findall|finditer)$'}}}
            - kind: attribute
              all:
                - has: {field: attribute, regex: '^(findall|finditer)$'}
                - has: {field: object, matches: compiled-pattern}
    match-list:
        kind: call
        any:
            - has: {field: function, regex: '(^|\.)findall$', matches: regex-callee}
            - all:
                - has: {field: function, regex: '^(list|tuple)$'}
                - has: {field: arguments, has: {nthChild: 1, kind: call, has: {field: function, regex: '(^|\.)finditer$', matches: regex-callee}}, not: {has: {nthChild: 2}}}
    first-read:
        kind: identifier
        any:
            - inside: {kind: subscript, field: value, matches: first-element}
            - inside: {kind: not_operator}
            - inside: {kind: 'if_statement, elif_clause, while_statement', field: condition}
    bound-list:
        kind: assignment
        all:
            - has: {field: left, kind: identifier, pattern: $MATCHES}
            - inside:
                kind: expression_statement
                inside:
                    kind: block, module
                    all:
                        - has: {stopBy: end, kind: identifier, pattern: $MATCHES, inside: {kind: subscript, field: value, matches: first-element}}
                        - not: {has: {stopBy: end, kind: identifier, pattern: $MATCHES, not: {any: [{matches: first-read}, {inside: {kind: assignment, field: left}}]}}}
rule:
    kind: call
    pattern: $CALL
    any:
        - pattern: next(iter($FINDALL($$$)))
        - pattern: next($FINDITER($$$))
        - pattern: next($FINDITER($$$), $$$)
        - matches: match-list
          any:
            - inside: {matches: first-element, field: value}
            - inside: {kind: match_statement, field: subject}
            - inside: {matches: bound-list, field: right}
constraints:
    FINDITER: {regex: '(^|\.)finditer$', matches: regex-callee}
    FINDALL: {regex: '(^|\.)findall$', matches: regex-callee}
message: '`$CALL` reads one match through the iterator or list of every match'
note: 'Use `match`, `search`, or `fullmatch` and select on `None`'
