# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: bashlang
severity: error
utils:
    shell: {regex: '(?:^|/)(?:bash|sh|dash|ksh|zsh)$'}
    reader: {any: [{matches: shell}, {regex: '^(source|\.)$'}]}
    first-operand: {follows: {kind: command_name}}
    operand: {kind: 'word, string, raw_string, ansi_c_string, concatenation, simple_expansion, expansion, command_substitution, arithmetic_expansion, process_substitution, number'}
    script: {matches: operand, not: {regex: '^(-[a-zA-Z]+|/dev/stdin)$'}}
    feed:
        any:
            - {kind: herestring_redirect, has: {matches: bash-expanding-word, not: {follows: {stopBy: end, matches: operand}}}}
            - {kind: file_redirect, all: [{has: {regex: '^<$'}}, {has: {field: destination, kind: process_substitution}}]}
rule:
    kind: command
    any:
        - has: {field: name, pattern: $NAME, regex: '^eval$'}
        - all:
            - has: {field: name, pattern: $NAME, regex: '^(builtin|command)$'}
            - has: {pattern: eval, matches: first-operand}
        - all:
            - has: {field: name, pattern: $NAME, regex: '(?:^|/)(?:bash|sh|dash|ksh|zsh|env|exec|sudo|nohup|nice|timeout|xargs)$'}
            - has: {matches: bash-expanding-word, follows: {kind: word, regex: '^-[a-zA-Z]*c[a-zA-Z]*$', follows: {stopBy: end, kind: 'command_name, word', matches: shell}}}
        - all:
            - has: {field: name, pattern: $NAME, matches: reader}
            - has: {kind: process_substitution, matches: first-operand}
        - all:
            - has: {field: name, pattern: $NAME, matches: reader}
            - not: {has: {matches: script}}
            - any:
                - has: {matches: feed}
                - inside: {kind: redirected_statement, field: body, has: {matches: feed}, not: {has: {has: {matches: script, follows: {stopBy: end, matches: operand}}}}}
        - all:
            - has: {field: name, pattern: $NAME, regex: '^trap$'}
            - has: {all: [{matches: first-operand}, {not: {kind: string}}, {matches: bash-expanding-word}]}
message: '`$NAME` parses text as shell code'
note: Pass data through arguments or stdin and keep evaluated shell text constant
