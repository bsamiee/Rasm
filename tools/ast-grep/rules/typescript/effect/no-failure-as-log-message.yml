# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-failure-as-log-message
language: tsx
severity: error
utils:
    log-member:
        matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(log|logTrace|logDebug|logInfo|logWarning|logError|logFatal)$'}}}
    failure-handler:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(tapError|tapErrorTag|catch|catchEager|catchTag|catchTags|catchIf|catchFilter|catchReason|catchReasons|matchEffect)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Layer)$'}}}}
    cause-handler:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            all:
                - has: {field: property, regex: '^(catchCause|catchDefect)$'}
                - has: {field: object, matches: {effect-module: {name: {regex: '\b(Effect|Stream|Channel|Layer)$'}}}}
    handler-argument:
        any:
            - inside: {kind: arguments, inside: {matches: failure-handler}}
            - inside: {kind: pair, field: value, not: {has: {field: key, regex: '^onSuccess$'}}, inside: {kind: object, inside: {kind: arguments, inside: {matches: failure-handler}}}}
    cause-argument:
        inside: {kind: arguments, inside: {matches: cause-handler}}
    handler-parameter:
        any:
            - has: {field: parameter, kind: identifier, pattern: $ERROR}
            - has: {field: parameters, has: {nthChild: 1, kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $ERROR}}}
    failure-callback:
        kind: arrow_function, function_expression
        all: [{matches: handler-argument}, {matches: handler-parameter}]
    cause-callback:
        kind: arrow_function, function_expression
        all: [{matches: cause-argument}, {matches: handler-parameter}]
rule:
    any:
        - pattern: $LOG
          all: [{matches: log-member}, {any: [{matches: handler-argument}, {matches: cause-argument}]}]
        - kind: call_expression
          all:
            - has: {field: function, pattern: $LOG, matches: log-member}
            - any:
                - inside: {matches: failure-callback, stopBy: end}
                - inside: {matches: cause-callback, stopBy: end}
            - has: {field: arguments, has: {kind: identifier, pattern: $ERROR}}
message: '`$LOG` logs a failure inside a recovery handler'
note: 'Log through `Effect.tapCause(Effect.logError)` before recovery, discard through `Effect.ignore({ log })` or `Effect.ignoreCause({ log })`'
