# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-test-scope
language: rust
utils:
    marked:
        matches: {rust-attributed: {attribute: {matches: rust-test-attribute}}}
rule:
    inside:
        stopBy: end
        kind: 'mod_item, function_item, impl_item, const_item, static_item'
        matches: marked
