syntax = "proto3";

package rasm.contracts.clock.v1;

import "buf/validate/validate.proto";

// `physical` is the Unix-epoch tick count at one tick per hundred nanoseconds, a signed 63-bit value; `logical`
// is the monotone 64-bit half that resets to zero on every physical advance. Ordering compares physical first,
// then logical.
message Hlc {
  sfixed64 physical = 1 [(buf.validate.field).sfixed64.gte = 0];
  uint64 logical = 2;
}
