# --- [UV] -------------------------------------------------------------------------------

[tool.uv.sources]
beartype = { git = "https://github.com/beartype/beartype.git", rev = "f927b66f79dfb7f595457a85c82398601c17b2f1" }          # 0.22.9 imports typing.no_type_check_decorator (removed in 3.15); the pinned rev is current main past the fix, unreleased as of 0.22.9
connectrpc = { url = "https://github.com/connectrpc/connect-py/archive/be6c9335e7dbcd1ccdda66e4d19d33a87210dd0d.tar.gz" }  # Published Connect pins protobuf-py 0.1.1; this immutable upstream source carries the runtime and generator pair on protobuf-py 0.3
protoc-gen-connectrpc = { url = "https://github.com/connectrpc/connect-py/archive/be6c9335e7dbcd1ccdda66e4d19d33a87210dd0d.tar.gz", subdirectory = "protoc-gen-connectrpc" }

[tool.uv]
default-groups = ["workspace", "dev"]

# TOML 1.0 confines an inline table to one line, per-package build settings need this dedicated table
[tool.uv.config-settings-package]
scipy = { setup-args = "-Duse-pythran=false" }

# opencolorio reads CMAKE_ARGS from the environment; OCIO_BUILD_APPS=OFF skips app helpers broken under the macOS 26 SDK
[tool.uv.extra-build-variables]
opencolorio = { CMAKE_ARGS = "-DOCIO_BUILD_APPS=OFF" }

# colour-cxf 0.1.1 declares an incorrect Requires-Python <3.14 upper bound; corrected metadata removes it while preserving the runtime dependencies
[[tool.uv.dependency-metadata]]
name = "colour-cxf"
version = "0.1.1"
requires-python = ">=3.10"
requires-dist = ["typing-extensions<5,>=4", "xsdata>25.4"]

# colour-science 0.4.7 declares Requires-Python <3.15; corrected metadata removes the bound and preserves the declared dependency set
[[tool.uv.dependency-metadata]]
name = "colour-science"
version = "0.4.7"
requires-python = ">=3.11"
requires-dist = [
    "numpy<3,>=2.0.0",
    "biblib-simple; extra == 'docs'",
    "pydata-sphinx-theme; extra == 'docs'",
    "restructuredtext-lint; extra == 'docs'",
    "sphinx; extra == 'docs'",
    "sphinxcontrib-bibtex; extra == 'docs'",
    "trimesh<5,>=4; extra == 'meshing'",
    "imageio<3,>=2; extra == 'optional'",
    "matplotlib>=3.9; extra == 'optional'",
    "networkx<4,>=3.3; extra == 'optional'",
    "opencolorio<3,>=2; python_version < '3.14' and extra == 'optional'",
    "openimageio<4,>=3; extra == 'optional'",
    "pandas<3,>=2.2; extra == 'optional'",
    "pydot<4,>=3; extra == 'optional'",
    "scipy<2,>=1.13.0; extra == 'optional'",
    "tqdm<5,>=4; extra == 'optional'",
    "xxhash<4,>=3; extra == 'optional'",
]
provides-extras = ["docs", "meshing", "optional"]

# pytensor 2.35.1 predates the numba requirement (no cp315 numba wheel); corrected metadata removes its Requires-Python <3.14 bound
[[tool.uv.dependency-metadata]]
name = "pytensor"
version = "2.35.1"
requires-python = ">=3.11"
requires-dist = [
    "setuptools>=59.0.0",
    "scipy<2,>=1",
    "numpy>=2.0",
    "filelock>=3.15",
    "etuples",
    "logical-unification",
    "miniKanren",
    "cons",
    "jax; extra == 'jax'",
    "jaxlib; extra == 'jax'",
    "numba>=0.57; extra == 'numba'",
    "llvmlite; extra == 'numba'",
]
provides-extras = ["jax", "numba"]

# Substrait 0.30.0 declares an incorrect Requires-Python <3.15 bound on a pure-Python wheel; corrected metadata removes it
[[tool.uv.dependency-metadata]]
name = "substrait"
version = "0.30.0"
requires-python = ">=3.10"
requires-dist = [
    "protobuf<7,>=5",
    "substrait-protobuf==0.99.0",
    "substrait-antlr==0.99.0; extra == 'extensions'",
    "pyyaml; extra == 'extensions'",
    "sqloxide; extra == 'sql'",
    "deepdiff; extra == 'sql'",
]
provides-extras = ["extensions", "sql"]

# --- [TY] -------------------------------------------------------------------------------

[tool.ty.environment]
python-platform = "all"
python-version = "3.15"
root = ["."]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.src]
exclude = [
    ".archive",
    ".artifacts",
    ".cache",
    ".claude/worktrees",
    ".history",
    ".nx",
    ".scratch",
    ".tmp",
    ".venv",
    "_archive",
    "_tmp",
    "coverage",
    "dist",
    "node_modules",
    "scratch",
    "test-results",
    "tmp",
]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

# --- [MYPY] -----------------------------------------------------------------------------

# Mypy-only divergences stay in overrides because `ty` rejects inline type-ignore comments
[tool.mypy]
files = ["tests"]
python_version = "3.15"
cache_dir = ".cache/mypy"
strict = true
pretty = true
warn_unreachable = true
explicit_package_bases = true
warn_unused_configs = true
disallow_any_explicit = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
disable_error_code = ["prop-decorator"]  # mypy cannot model pydantic computed_field over @property; ty checks the same construct
exclude = [
    "(^|/)(\\.archive|_archive|scratch|\\.scratch|_tmp|\\.tmp|\\.cache|\\.history)/",
    "^\\.artifacts/",
    "^\\.claude/worktrees/",
    "^\\.git/",
    "^\\.nx/",
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^coverage/",
    "^test-results/",
    "^node_modules/",
    "^tmp/",
]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# `tests/**` remains clean under ty; these overrides isolate mypy limitations around TypeForm, sentinels, Callable, match, and constructor narrowing
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_explicit = false
disallow_any_unimported = false
warn_unreachable = false
disable_error_code = ["func-returns-value", "attr-defined", "type-arg", "override", "arg-type"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "fsspec", "fsspec.*", "jsonschema", "jsonschema.*", "s3fs"]  # Backend and validator imports lack py.typed coverage
ignore_missing_imports = true

# --- [PYTEST] ---------------------------------------------------------------------------

# `pytest-benchmark` and `pytest-xdist` conflict under `filterwarnings = ["error"]`. Do not add `-n` to default `addopts`
[tool.pytest]
minversion = "9.0"
strict = true
cache_dir = ".cache/pytest"
testpaths = ["tests"]
pythonpath = ["."]  # Repository modules resolve from root; workspace packages resolve through their installed editable distributions
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
python_functions = ["test_*", "bench_*"]
collect_imported_tests = false
empty_parameter_set_mark = "fail_at_collect"
addopts = [
    "-p",
    "tests.python.support.runtime",                            # Test-support plugin registering Hypothesis profiles, OpenTelemetry fixtures, and automatic markers
    "-x",
    "--tb=short",
    "--import-mode=importlib",
    "-m",
    "not benchmark",
    "--disable-socket",
    "--allow-unix-socket",
    "--benchmark-storage=file://.artifacts/python/benchmarks",
    "--benchmark-autosave",                                     # Saves benchmark history only when benchmarks run
    "--hypothesis-profile=rasm",
]
filterwarnings = [
    "error",
    "ignore:Not saving anything:pytest_benchmark.logger.PytestBenchmarkWarning",  # Autosave no-op in sessions whose benchmarks are deselected
]
timeout = "30"  # pytest-timeout registers this option as a string; pytest 9 TOML mode rejects a native int
required_plugins = [
    "anyio",
    "hypothesis",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-timeout",
    "pytest-xdist",
]
markers = [
    "benchmark: benchmark measurement tests",
    "network: tests that require real INET sockets to be enabled (loopback servers or egress)",
    "property: property-based tests",
    "subprocess: tests that spawn the real CLI in a child interpreter",
]

# --- [COVERAGE] -------------------------------------------------------------------------

[tool.coverage.run]
branch = true
relative_files = true  # Subprocess coverage combines through relative repo paths
data_file = ".cache/coverage/.coverage"
core = "sysmon"        # CPython 3.15 beta lacks coverage's compiled C tracer
patch = [
    "subprocess",
]  # COVERAGE_PROCESS_CONFIG and the installed .pth file measure child processes; reporting combines their parallel data files

[tool.coverage.report]
fail_under = 90   # Sysmon records fewer arcs than the unavailable C tracer, coverage uses a 90 percent threshold
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "assert_never\\(", "\\.\\.\\.$", "if __name__ == .__main__.:"]

[tool.coverage.json]
output = ".artifacts/python/coverage/coverage.json"
pretty_print = true

[tool.coverage.html]
directory = ".artifacts/python/coverage/html"

[tool.coverage.xml]
output = ".artifacts/python/coverage/coverage.xml"

[tool.coverage.lcov]
output = ".artifacts/python/coverage/coverage.lcov"

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
cache-dir = ".cache/ruff"
preview = true
line-length = 300
required-version = ">=0.16.2"
target-version = "py315"
extend-exclude = [
    "**/.archive/**",
    "**/.artifacts/**",
    "**/.cache/**",
    "**/.claude/worktrees/**",
    "**/.history/**",
    "**/.scratch/**",
    "**/.tmp/**",
    "**/_archive/**",
    "**/_tmp/**",
    "**/coverage/**",
    "**/scratch/**",
    "**/test-results/**",
]

[tool.ruff.format]
exclude = ["*.md"]  # Ruff already skips Markdown linting; preserve documentation code-block formatting as well
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- [FORMATTER]
    "missing-trailing-comma",                     # ruff format owns trailing commas
    "single-line-implicit-string-concatenation",  # ruff format owns implicit string concatenation
    # --- [MATCH_DISPATCH]
    "unnecessary-assign",                         # Named intermediates keep flow pipelines readable
    "superfluous-else-return",                    # Explicit match statements keep exhaustive cases visible
    "superfluous-else-raise",                     # Explicit error cases keep Result handling visible
    "if-else-block-instead-of-if-exp",            # Match/case owns dispatch, not ternaries
    "if-with-same-arms",                          # Use match/case for explicit dispatch
    # --- [DENSITY]
    "too-many-return-statements",                 # Exhaustive matches over closed tagged unions may return from each case
    "too-many-branches",                          # Exhaustive dispatch may require one branch per case
    "too-many-locals",                            # Cohesive dispatch functions may require several local values
    "too-many-statements",                        # Statement count alone does not justify splitting exhaustive dispatch
    "too-many-boolean-expressions",               # Cohesive dispatch predicates may exceed the generic expression limit
    # --- [ERROR_RAISING]
    "raw-string-in-exception",                    # Exception constructors receive literal messages directly
    "f-string-in-exception",                      # Exception constructors receive formatted context directly
    "raise-vanilla-args",                         # Exception constructors include descriptive messages
    "raise-within-try",                           # `@safe` boundary adapters may raise inside the guarded call
    "error-instead-of-exception",                 # Structlog `.error()` is valid outside exception handlers
    # --- [TYPE_RESOLUTION]
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    # --- [DOCSTRINGS]
    "docstring-extraneous-exception",             # Raises sections may document propagated helper exceptions; DOC501 still requires direct raises
    "docstring-missing-returns",                  # A one-line summary names the value; a Returns block restating the signature is noise
    # --- [SEMANTIC_ORDER]
    "unsorted-dunder-all",                        # Public API order follows domain semantics instead of alphabetical `__all__`
    "unsorted-dunder-slots",                      # Semantic slot order beats alphabetical `__slots__`
    # --- [WORKFLOW]
    "missing-todo-link",                          # TODO links are not required for local maintenance notes
    "line-contains-todo",                         # TODO comments are accepted source markers
    "implicit-namespace-package",                 # Monorepo packages may be implicit namespaces
    "missing-copyright-notice",                   # Top-level LICENSE owns copyright notice
    # --- [SECTION_DIVIDERS]
    "commented-out-code",                         # Compact `# --- [LABEL]` subsection dividers define source sections
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"**/.claude/**" = [
    "banned-api",
    "boolean-type-hint-positional-argument",
    "complex-structure",
    "hardcoded-password-string",
    "literal-membership",
    "os-getcwd",
    "shebang-not-executable",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/**" = [
    "assert",
    "pytest-composite-assertion",
    "magic-value-comparison",
    "too-many-arguments",
    "unused-function-argument",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "private-member-access",
    "import-private-name",
] # PLC2701: tests import the intentionally private test-support package
"**/conftest.py" = ["module-import-not-at-top-of-file"]
"tests/python/support/runtime.py" = ["module-import-not-at-top-of-file"]  # Hypothesis environment configuration must precede imports

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "beartype.BeartypeConf",
    "msgspec.Meta",
    "msgspec.field",
    "pydantic.ConfigDict",
    "pydantic.Field",
    "pydantic.PrivateAttr",
    "stamina.retry",
]

[tool.ruff.lint.flake8-builtins]
ignorelist = [
    "format",
    "hash",
    "id",
    "input",
    "list",
    "quit",
    "type",
]  # CLI verb vocabulary: a verb handler's own name is the verb the registry dispatches on

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"dask.array" = "da"
"dask.dataframe" = "dd"
"scipy" = "sp"
"sympy" = "sym"
"xarray" = "xr"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"
raises-extend-require-match-for = ["AttributeError", "KeyError", "RuntimeError", "TypeError", "msgspec.ValidationError", "pydantic.ValidationError"]

[tool.ruff.lint.flake8-self]
extend-ignore-names = ["_validate", "_disc", "_check", "_value_"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
# These modules load through lazy-import proxies; TID254 rejects their eager imports, and license-isolation bans stay in banned-api
require-lazy = [
    "adbc_driver_flightsql",
    "adbc_driver_snowflake",
    "daft",
    "dataframely",
    "datafusion",
    "fastexcel",
    "geoarrow.rust.compute",
    "h3ronpy",
    "igraph",
    "laszip",
    "lazrs",
    "odc.stac",
    "planetary_computer",
    "pointblank",
    "polars_st",
    "pystac",
    "pystac_client",
    "stac_geoparquet",
    "tensorstore",
    "xarray",
    "xrspatial",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"concurrent.futures.ProcessPoolExecutor".msg = "Use anyio.to_process.run_sync() — structured concurrency with cancellation support."
"concurrent.futures.ThreadPoolExecutor".msg = "Use anyio.to_thread.run_sync() with CapacityLimiter — structured concurrency."
