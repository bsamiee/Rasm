# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: csharp-check-call
language: csharp
utils:
    unique-check:
        matches: {csharp-owner-member: {type: {regex: '^Callbacks$'}, member: {regex: '^Unique$'}}}
    conversion-check:
        matches: {csharp-owner-member: {type: {regex: '^Conversions$'}, member: {regex: '^(NonEmpty|FromResult)$'}}}
    guard-name:
        matches: {csharp-type-name: {name: {regex: '^guard$'}}}
    io-lift:
        matches: {csharp-owner-member: {type: {regex: '^IO$'}, member: {regex: '^lift$'}}}
    plain-arguments:
        kind: argument_list
        not: {has: {stopBy: end, matches: csharp-mutation-call}}
    lone-argument:
        kind: argument_list
        not: {has: {kind: argument, nthChild: 2}}
    check-callback:
        kind: argument_list
        all:
            - matches: lone-argument
            - has: {kind: argument, has: {kind: lambda_expression, has: {field: body, matches: csharp-check-call}}}
rule:
    kind: invocation_expression
    any:
        - all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Unless\w*|InRange|Validated)(\s*<.+>)?$'}}
            - has: {field: arguments, matches: plain-arguments}
        - all:
            - has:
                field: function
                kind: member_access_expression
                any:
                    - matches: unique-check
                    - matches: conversion-check
            - has: {field: arguments, matches: plain-arguments}
        - all:
            - has: {field: function, matches: guard-name}
            - has: {field: arguments, matches: plain-arguments}
        - all:
            - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Bind|Traverse|TraverseM)(\s*<.+>)?$'}}
            - has: {field: arguments, matches: check-callback}
        - all:
            - has: {field: function, matches: io-lift}
            - has: {field: arguments, any: [{matches: check-callback}, {all: [{matches: lone-argument}, {has: {kind: argument, has: {matches: csharp-check-call}}}]}]}
        - all:
            - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^(As|ToFin|ToValidation|ToEither)$'}}, {has: {field: expression, matches: csharp-check-call}}]}
            - has: {field: arguments, not: {has: {kind: argument}}}
