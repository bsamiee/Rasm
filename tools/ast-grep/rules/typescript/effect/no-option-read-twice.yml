# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
rule:
    kind: ternary_expression
    all:
        - has:
            field: condition
            kind: call_expression
            pattern: $TEST
            all:
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, pattern: $OPTION}}
                - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^exists$'}}}}
        - has:
            stopBy: end
            kind: call_expression
            all:
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: 'comment, html_comment'}}}, pattern: $OPTION}}
                - has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Option$'}, member: {regex: '^(getOrElse|getOrThrow|getOrThrowWith|getOrNull|getOrUndefined)$'}}}}
message: '`$TEST` tests `$OPTION` and a branch reads it again'
note: 'Fold `<option>` once with `Option.match({ onNone, onSome })`, with the test inside `onSome` return value'
