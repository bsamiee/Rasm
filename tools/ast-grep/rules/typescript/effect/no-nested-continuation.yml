# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    step:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '(?-u:\b)Effect$'}, member: {regex: '^(andThen|catch|catchCause|catchCauseFilter|catchCauseIf|catchDefect|catchEager|catchFilter|catchIf|catchReason|catchReasons|catchTag|catchTags|flatMap|flatMapEager|map|mapEager|matchCauseEffect|matchCauseEffectEager|matchEffect|tap|tapCause|tapCauseFilter|tapCauseIf|tapDefect|tapError|tapErrorTag)$'}}}}
    callback:
        kind: arrow_function, function_expression
    continuation:
        kind: call_expression
        all:
            - has: {field: arguments, has: {matches: callback}}
            - matches: step
    inner:
        kind: call_expression
        all:
            - has: {field: arguments, any: [{has: {matches: callback}}, {has: {nthChild: {position: 2, ofRule: {not: {kind: 'comment, html_comment'}}}}}]}
            - matches: step
rule:
    pattern: $CALL
    matches: continuation
    has:
        field: arguments
        has:
            matches: callback
            has:
                field: body
                any:
                    - {matches: inner, pattern: $INNER}
                    - not: {matches: typescript-function-boundary}
                      has: {stopBy: {matches: typescript-function-boundary}, matches: inner, pattern: $INNER}
message: 'Continuation callback starts another continuation at `$INNER`'
note: 'Yield dependent steps in one `Effect.gen` or `Effect.fn` body, and chain recovery nested in a recovery callback as one flat pipe'
labels:
    CALL: {style: primary}
    INNER: {style: secondary}
