# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nonzero-alias
language: rust
severity: error
utils:
    alias:
        regex: '^NonZero(U(8|16|32|64|128)|I(8|16|32|64|128)|Usize|Isize)$'
    alias-import:
        kind: use_declaration
        all:
            - has: {stopBy: end, kind: identifier, pattern: $ALIAS, not: {inside: {kind: use_as_clause, stopBy: end}}}
            - not: {has: {stopBy: end, kind: identifier, regex: '^NonZero', not: {pattern: $ALIAS}}}
    generic-import:
        kind: use_declaration
        has: {stopBy: end, kind: identifier, regex: '^NonZero$', not: {inside: {kind: use_as_clause, stopBy: end}}}
    in-scope:
        inside:
            kind: 'source_file, declaration_list, block'
            stopBy: {kind: mod_item}
            has: {kind: use_declaration, any: [{matches: alias-import}, {matches: generic-import}]}
    qualified-path:
        kind: scoped_identifier
        regex: '^(::)?(std|core)::num::'
    qualified-type:
        kind: scoped_type_identifier
        regex: '^(::)?(std|core)::num::'
rule:
    pattern: $ALIAS
    matches: alias
    any:
        - kind: identifier
          pattern: $LEAF
          inside: {kind: use_declaration, stopBy: end, matches: alias-import}
        - kind: type_identifier
          pattern: $TYPE
          any:
            - inside: {kind: scoped_type_identifier, field: name, matches: qualified-type}
            - all: [{not: {inside: {kind: scoped_type_identifier, field: name}}}, {matches: in-scope}]
        - kind: identifier
          pattern: $PATH
          all:
            - not: {inside: {kind: use_declaration, stopBy: end}}
            - any:
                - inside: {kind: scoped_identifier, field: name, matches: qualified-path, inside: {kind: scoped_identifier, field: path}}
                - all: [{inside: {kind: scoped_identifier, field: path}}, {matches: in-scope}]
transform:
    LEAF_OUT: {replace: {source: $LEAF, replace: '^.+$', by: 'NonZero'}}
    TYPE_SUFFIX: {replace: {source: $TYPE, replace: '^NonZero(\w+)$', by: '$1'}}
    TYPE_PRIMITIVE: {convert: {source: $TYPE_SUFFIX, toCase: lowerCase}}
    TYPE_OUT: {replace: {source: $TYPE_PRIMITIVE, replace: '^(.+)$', by: 'NonZero<$1>'}}
    PATH_SUFFIX: {replace: {source: $PATH, replace: '^NonZero(\w+)$', by: '$1'}}
    PATH_PRIMITIVE: {convert: {source: $PATH_SUFFIX, toCase: lowerCase}}
    PATH_OUT: {replace: {source: $PATH_PRIMITIVE, replace: '^(.+)$', by: 'NonZero::<$1>'}}
fix: $LEAF_OUT$TYPE_OUT$PATH_OUT
message: '`$ALIAS` names a `NonZero` integer through a type alias'
note: 'Write `NonZero<<primitive>>` (Rust 1.79) in types, `NonZero::<<primitive>>` in paths, and `NonZero` in the import, an import renaming the alias or listing two aliases stays as written with every use that reads it'
