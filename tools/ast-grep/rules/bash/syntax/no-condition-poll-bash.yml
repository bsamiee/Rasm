# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-condition-poll-bash
language: bash
severity: error
utils:
    bounded:
        has:
            stopBy: {kind: do_group}
            any:
                - {kind: variable_name, regex: '^SECONDS$'}
                - {kind: command, has: {field: name, regex: '^read$'}}
rule:
    kind: command
    pattern: $SLEEP
    has: {field: name, regex: '^sleep$'}
    any:
        - not: {inside: {stopBy: end, kind: &loop 'for_statement, c_style_for_statement, while_statement'}}
        - inside:
            stopBy: {kind: *loop}
            kind: while_statement
            not: {matches: bounded}
message: '`$SLEEP` waits on no bounded check, poll in `for _ in {1..N}`'
note: 'Poll the awaited result in `for _ in {1..<attempts>}; do <check> && break; sleep <interval>; done`, or bound the `while` on `SECONDS`'
