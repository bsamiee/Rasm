# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-article-summary-python
language: python
severity: error
utils:
    docstring:
        kind: expression_statement
        nthChild: {position: 1, ofRule: {not: {kind: comment}}}
        any:
            - inside: {kind: module}
            - inside: {kind: block, inside: {kind: 'function_definition, class_definition', field: body}}
rule:
    kind: string
    regex: '^(?i:[ru])?("""|''''''|"|'')\s*(The|A|An)\s+\S'
    inside: {matches: docstring}
message: 'Docstring summary opens with an article'
note: 'Use subject noun or verb as the summary''s first word, an article adds a word and states no fact'
