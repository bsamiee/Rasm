# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-color-env-read
language: rust
severity: error
rule:
    kind: 'string_literal, raw_string_literal'
    pattern: $NAME
    regex: '^r?#*"(NO_COLOR|CLICOLOR|CLICOLOR_FORCE|COLORTERM|TERM)"#*$'
    any:
        - inside: {kind: token_tree, stopBy: {kind: attribute}, inside: {kind: attribute}}
          follows: {regex: '^=$', follows: {regex: '^env$'}}
        - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '^((::)?(std::)?env::)?var(_os)?$'}}}
message: '`$NAME` reads a color variable `anstream` reads itself'
note: 'Delete the read, flatten `colorchoice_clap::Color` into the command for an explicit choice and call its `write_global`, and write through `anstream::stdout()` or `stderr()`'
