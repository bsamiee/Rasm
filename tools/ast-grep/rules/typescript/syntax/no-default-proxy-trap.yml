# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-proxy-trap
language: tsx
severity: error
rule:
    kind: arrow_function
    all:
        - matches: typescript-default-proxy-trap
        - inside: {kind: pair, field: value, has: {field: key, pattern: $TRAP}}
message: '`$TRAP` trap forwards its arguments to `Reflect.$TRAP` unchanged'
note: 'Delete the trap, the default trap performs it'
