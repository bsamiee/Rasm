syntax = "proto3";

package rasm.contracts.element;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/datetime.proto";
import "google/type/timeofday.proto";

// --- [VOCABULARIES] -----------------------------------------------------------------------

// `exact` and `normal` carry first-order Gaussian evidence; every other kind is bounds-only.
enum UncertaintyKind {
  UNCERTAINTY_KIND_UNSPECIFIED = 0;
  UNCERTAINTY_KIND_EXACT = 1;
  UNCERTAINTY_KIND_ABSOLUTE = 2;
  UNCERTAINTY_KIND_RELATIVE = 3;
  UNCERTAINTY_KIND_INTERVAL = 4;
  UNCERTAINTY_KIND_NORMAL = 5;
}

enum Interpolation {
  INTERPOLATION_UNSPECIFIED = 0;
  INTERPOLATION_NOT_DEFINED = 1;
  INTERPOLATION_LINEAR = 2;
  INTERPOLATION_LOG_LINEAR = 3;
  INTERPOLATION_LOG_LOG = 4;
}

enum InheritanceMode {
  INHERITANCE_MODE_UNSPECIFIED = 0;
  INHERITANCE_MODE_OCCURRENCE_WINS = 1;
  INHERITANCE_MODE_TYPE_DRIVEN_OVERRIDE = 2;
  INHERITANCE_MODE_TYPE_DRIVEN_ONLY = 3;
}

// Values are the evidence rank; a higher rank outranks a lower one at resolution.
enum EvidenceGrade {
  EVIDENCE_GRADE_UNSPECIFIED = 0;
  EVIDENCE_GRADE_CATALOGUE = 10;
  EVIDENCE_GRADE_DEFINED = 15;
  EVIDENCE_GRADE_IMPORT = 20;
  EVIDENCE_GRADE_MEASURED = 25;
  EVIDENCE_GRADE_DERIVED = 30;
  EVIDENCE_GRADE_USER = 40;
}

// --- [GEOMETRY] ---------------------------------------------------------------------------

message VectorWire {
  double x = 1 [(buf.validate.field).double.finite = true];
  double y = 2 [(buf.validate.field).double.finite = true];
  double z = 3 [(buf.validate.field).double.finite = true];
}

// --- [MEASURE] ----------------------------------------------------------------------------

// `quantity_type` is the registry family name, or a dimension-anonymous spelling for a value admitted by
// dimension alone; the seven exponents are the SI base-dimension signature.
message DimensionWire {
  string quantity_type = 1 [(buf.validate.field).string.min_len = 1];
  sint32 length = 2;
  sint32 mass = 3;
  sint32 time = 4;
  sint32 current = 5;
  sint32 temperature = 6;
  sint32 amount = 7;
  sint32 luminous_intensity = 8;
}

// Gaussian kinds carry `standard_deviation_si`; bounds-only kinds carry the interval alone.
message MeasureBandWire {
  UncertaintyKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  double lower_si = 2 [(buf.validate.field).double.finite = true];
  double upper_si = 3 [(buf.validate.field).double.finite = true];
  optional double standard_deviation_si = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
  optional double coverage_factor = 5 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

// SI-coerced identity columns alone; the consumer re-mints its unit from the dimension signature.
message MeasureValueWire {
  DimensionWire dimension = 1 [(buf.validate.field).required = true];
  double si = 2 [(buf.validate.field).double.finite = true];
  MeasureBandWire uncertainty = 3;
}

message NamedMeasureWire {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  MeasureValueWire value = 2 [(buf.validate.field).required = true];
}

// `at` ascends strictly; a curve carries at least one point.
message CurvePointWire {
  double at = 1 [(buf.validate.field).double.finite = true];
  double value = 2 [(buf.validate.field).double.finite = true];
}

message SampledCurveWire {
  repeated CurvePointWire points = 1 [(buf.validate.field).repeated.min_items = 1];
}

// --- [VALUE] ------------------------------------------------------------------------------

// The recursive property value. `integer` is a two's-complement big-endian integer of minimal width; nesting is
// bounded by every decoder's recursion budget of one hundred wire levels.
message PropertyValueWire {
  oneof value {
    option (buf.validate.oneof).required = true;

    string text = 1;
    MeasureValueWire measure = 2;
    bool boolean = 3;
    LogicalWire logical = 4;
    EnumeratedWire enumerated = 5;
    ReferenceWire reference = 6;
    BoundedWire bounded = 7;
    ListWire list = 8;
    TableWire table = 9;
    ComplexWire complex = 10;
    TemporalWire temporal = 11;
    bytes integer = 12 [(buf.validate.field).bytes.min_len = 1];
    double number = 13 [(buf.validate.field).double.finite = true];
    bytes binary = 14;
  }
}

// Absence is the third state.
message LogicalWire {
  optional bool value = 1;
}

message EnumeratedWire {
  repeated PropertyValueWire selected = 1;
  repeated PropertyValueWire allowed = 2;
}

// `span` spells NodaTime `PeriodPattern.Roundtrip`, not ISO 8601: components are integers in fixed unit order,
// each sign rides its own component, and `s`, `t`, `n` are milliseconds, ticks, and nanoseconds. Zero is `P0D`
// alone. Calendar years, months, and weeks are why the arm is text and not `google.protobuf.Duration`.
message TemporalWire {
  option (buf.validate.message).cel = {
    id: "temporal.local_moment"
    message: "moment must be a local date-time without a UTC offset or time zone"
    expression: "!has(this.moment) || (!has(this.moment.utc_offset) && !has(this.moment.time_zone))"
  };

  oneof value {
    option (buf.validate.oneof).required = true;

    google.type.Date date = 1;
    google.type.DateTime moment = 2;
    google.type.TimeOfDay time = 3;
    string span = 4 [(buf.validate.field).string = {
      min_len: 3
      max_len: 240
      pattern:
        "^P(?:0D|"
        "(?:-?[1-9][0-9]*Y)?(?:-?[1-9][0-9]*M)?(?:-?[1-9][0-9]*W)?(?:-?[1-9][0-9]*D)?"
        "(?:T(?:"
        "(?:-?[1-9][0-9]*H)(?:-?[1-9][0-9]*M)?(?:-?[1-9][0-9]*S)?(?:-?[1-9][0-9]*s)?(?:-?[1-9][0-9]*t)?(?:-?[1-9][0-9]*n)?|"
        "(?:-?[1-9][0-9]*M)(?:-?[1-9][0-9]*S)?(?:-?[1-9][0-9]*s)?(?:-?[1-9][0-9]*t)?(?:-?[1-9][0-9]*n)?|"
        "(?:-?[1-9][0-9]*S)(?:-?[1-9][0-9]*s)?(?:-?[1-9][0-9]*t)?(?:-?[1-9][0-9]*n)?|"
        "(?:-?[1-9][0-9]*s)(?:-?[1-9][0-9]*t)?(?:-?[1-9][0-9]*n)?|"
        "(?:-?[1-9][0-9]*t)(?:-?[1-9][0-9]*n)?|"
        "(?:-?[1-9][0-9]*n)"
        "))?)$"
    }];
    google.protobuf.Timestamp stamp = 5;
  }
}

message ReferenceWire {
  bytes target = 1 [(buf.validate.field).bytes.len = 16];
  optional string usage_name = 2;
}

message BoundedWire {
  MeasureValueWire lower = 1;
  MeasureValueWire upper = 2;
  MeasureValueWire set_point = 3;
}

message ListWire {
  repeated PropertyValueWire values = 1;
}

message TableRowWire {
  PropertyValueWire defining = 1 [(buf.validate.field).required = true];
  PropertyValueWire defined = 2 [(buf.validate.field).required = true];
}

message TableWire {
  repeated TableRowWire rows = 1;
  Interpolation interpolation = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Rows sort ascending by name under ordinal byte order, so one bag has one byte form.
message NamedValueWire {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  PropertyValueWire value = 2 [(buf.validate.field).required = true];
}

message ComplexWire {
  string usage_name = 1;
  repeated NamedValueWire properties = 2;
}
