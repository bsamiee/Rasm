id: csharp-import
language: csharplang
role: item
symbolType: module
rule:
    any:
        - kind: using_directive
          has: {pattern: $NAME, nthChild: {position: 1, reverse: true}}
        - kind: extern_alias_directive
          has: {field: name, pattern: $NAME}
        - kind: file_based_directive
          has: {field: kind, regex: '^(sdk|package|project|ref)$'}
          all: [{has: {field: name, pattern: $NAME}}]
name: $NAME
isImport: true
isExported: false
---
id: csharp-file-property
language: csharplang
role: item
symbolType: property
rule:
    kind: file_based_directive
    has: {field: kind, regex: '^property$'}
    all: [{has: {field: name, pattern: $NAME}}]
name: $NAME
isExported: false
---
id: csharp-file-selection
language: csharplang
role: item
symbolType: file
rule:
    kind: file_based_directive
    has: {field: kind, regex: '^(include|exclude)$'}
    all: [{has: {field: name, pattern: $NAME}}]
name: $NAME
isImport: {has: {field: kind, regex: '^include$'}}
isExported: false
---
id: csharp-namespace
language: csharplang
role: item
symbolType: namespace
rule:
    kind: alias_qualified_name, generic_name, identifier, qualified_name
    pattern: $NAME
    inside: {kind: 'namespace_declaration, file_scoped_namespace_declaration', field: name}
name: $NAME
signature: namespace $NAME
isExported: false
---
id: csharp-interface
language: csharplang
role: item
symbolType: interface
utils:
    public:
        any:
            - has: {kind: modifier, regex: '^(public|protected)$'}
              not: {has: {kind: modifier, regex: '^private$'}}
            - inside: {kind: declaration_list, inside: {kind: interface_declaration}}
              not: {has: {kind: modifier, regex: '^(private|internal)$'}}
rule:
    kind: interface_declaration
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: declaration_list, inside: {kind: interface_declaration, field: body}}
      fix: {template: ';', expandEnd: {regex: '^;$'}}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[body])
    SIGNATURE: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}])+$|[\t-\r \x{85}\x{A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}]+(;)', by: '$1'}}
name: $NAME
signature: $SIGNATURE
isExported:
    all:
        - matches: public
        - not: {inside: {stopBy: end, kind: 'class_declaration, record_declaration, struct_declaration, interface_declaration, union_declaration', not: {matches: public}}}
---
id: csharp-class
language: csharplang
role: item
symbolType: class
utils:
    public:
        any:
            - has: {kind: modifier, regex: '^(public|protected)$'}
              not: {has: {kind: modifier, regex: '^private$'}}
            - inside: {kind: declaration_list, inside: {kind: interface_declaration}}
              not: {has: {kind: modifier, regex: '^(private|internal)$'}}
rule:
