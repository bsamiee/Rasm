name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            uncached:
                description: Jobs running every task of their nx affected step past the Nx cache, to time them
                type: choice
                default: none
                options: [none, linux and browser, all]

concurrency:
    group: ${{ github.event_name == 'push' && 'main' || format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && github.ref || github.run_id) }}
    queue: max

permissions:
    contents: read
    actions: read

env:
    HK_PROFILE: ci
    NX_PARALLEL: 100%
    GH_TOKEN: ${{ github.token }}
    NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
    NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ case(github.event_name == 'pull_request', secrets.NX_SELF_HOSTED_REMOTE_CACHE_READ_TOKEN, secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN) }}

defaults:
    run:
        shell: bash

jobs:
    shas:
        name: Base commit
        runs-on: [self-hosted, graph]
        timeout-minutes: 30
        outputs:
            base: ${{ steps.shas.outputs.base || steps.root.outputs.sha }}
            head: ${{ steps.shas.outputs.head || github.sha }}
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  clean: false
            - id: root
              run: |-
                  root="$(git rev-list --max-parents=0 HEAD)"
                  printf "sha=%s\n" "${root}" >> "${GITHUB_OUTPUT}"
            - id: shas
              if: ${{ github.event_name != 'workflow_dispatch' }}
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
              with:
                  fallback-sha: ${{ steps.root.outputs.sha }}
                  workflow-id: ci.yml
                  lookup-strategy: per-commit
                  max-commits: 150

    affected:
        name: Affected projects
        needs: shas
        runs-on: [self-hosted, graph]
        timeout-minutes: 30
        outputs:
            engines: ${{ steps.images.outputs.engines }}
            unreal: ${{ steps.listed.outputs.unreal }}
            browser: ${{ steps.listed.outputs.browser }}
            windows: ${{ steps.listed.outputs.windows }}
            rhino: ${{ steps.listed.outputs.rhino }}
            image: ${{ steps.images.outputs.playwright }}
            infra: ${{ steps.listed.outputs.infra }}
        env: &shas
            NX_BASE: ${{ needs.shas.outputs.base }}
            NX_HEAD: ${{ needs.shas.outputs.head }}
        steps:
            - *checkout
            - &tools
              id: tools
              uses: $/.github/actions/tools
            - id: images
              uses: $/.github/actions/images
            - id: listed
              env:
                  BROWSER: &browser '*,!tag:host:browser'
                  RHINO: &excluded '*,!tag:host:rhino'
              run: |-
                  listed() {
                      projects="$(nx show projects --affected --withTarget="$2" --exclude="$3" --json)"
                      printf "%s=%s\n" "$1" "${projects}"
                  }
                  {
                      listed unreal check,test,build '*,!tag:host:unreal'
                      listed browser check,test,build,pack "${BROWSER}"
                      listed windows test,build '*,!tag:os:win32,!tag:host:rhino'
                      listed rhino test,build "${RHINO}"
                      listed infra deploy--pulumi '*,!@rasm/infra'
                  } >> "${GITHUB_OUTPUT}"

    linux:
        name: Linux
        needs: shas
        runs-on: [self-hosted, host]
        timeout-minutes: 120
        env: *shas
        steps:
            - &stale
              run: rm -rf .artifacts/cmake/*/*.log .artifacts/dotnet/test .artifacts/playwright .artifacts/vitest
            - *checkout
            - *tools
            - parallel:
                  - run: nx sync:check
                  - run: nx conformance:check
            - id: codegen
              run: nx run-many --targets=codegen
            - id: hk
              background: true
              run: hk check --from-ref "${NX_BASE}" --to-ref "${NX_HEAD}"
            - if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
              run: nx affected --targets=check,test,build --configuration=ci --exclude='tag:os:*,!tag:os:linux,tag:host:rhino,tag:host:browser,tag:host:unreal,tag:host:claude-code'
              env:
                  NX_SKIP_NX_CACHE: ${{ contains(inputs.uncached, 'linux') || inputs.uncached == 'all' }}
            - wait: hk
            - &reports
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.job }}-reports
                  if-no-files-found: ignore
                  path: |-
                      .artifacts/cmake/*/*.log
                      .artifacts/dotnet/test
                      .artifacts/playwright
                      .artifacts/vitest
                      .artifacts/apple/**/*.xcresult
                      .cache/nx/workspace-data/project-graph.json
                      .cache/nx/workspace-data/*.db*

    browser:
        name: Browser
        needs: [shas, affected]
        if: ${{ needs.affected.outputs.browser != '[]' }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        permissions:
            contents: read
            packages: read
        container:
            image: ${{ needs.affected.outputs.image }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ github.token }}
            options: --init --ipc=host
        env: *shas
        steps:
            - *stale
            - *checkout
            - *tools
            - run: nx affected --targets=check,test,build,pack --exclude="${EXCLUDE}"
              env:
                  EXCLUDE: *browser
                  NX_BATCH_MODE: 'false'
                  NX_SKIP_NX_CACHE: ${{ contains(inputs.uncached, 'linux') || inputs.uncached == 'all' }}
            - *reports

    windows:
        name: Windows
        needs: [shas, affected]
        if: ${{ needs.affected.outputs.windows != '[]' }}
        runs-on: windows-2025
        timeout-minutes: 120
        env: *shas
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
            - id: graph
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: &graph |-
                      .cache/nx/workspace-data/*
                      !.cache/nx/workspace-data/cache
                      !.cache/nx/workspace-data/*.db*
                      !.cache/nx/workspace-data/xcode-packages
                  key: nx-${{ runner.os }}-
            - *tools
            - id: rhino
              if: &rhino ${{ needs.affected.outputs.rhino != '[]' }}
              run: |-
                  major="$(yq -p xml -oy '.Project.PropertyGroup[] | select(.+@Label == "Rhino") | .RhinoVersion | split(".") | .[0]' Directory.Build.props)"
                  installer="$(curl -fsS -o /dev/null -w '%{redirect_url}' --get --data-urlencode "slug=rhino-for-windows/${major}/latest" --data-urlencode "email=${RHINO_EMAIL}" https://www.rhino3d.com/www-api/download/direct)"
                  printf "RHINO_INSTALLER=%s\n" "${installer}" >> "${GITHUB_ENV}"
              env:
                  RHINO_EMAIL: ${{ secrets.RHINO_EMAIL }}
            - if: ${{ needs.affected.outputs.windows != needs.affected.outputs.rhino }}
              run: nx affected --targets=test --configuration=headless --exclude='*,!tag:os:win32,tag:host:rhino,tag:host:claude-code'
            - id: cached
              if: *rhino
              run: nx affected --targets=test --configuration=headless --exclude="${EXCLUDE}" || printf "missed=true\n" >> "${GITHUB_OUTPUT}"
              env:
                  EXCLUDE: *excluded
            - if: ${{ steps.cached.outputs.missed == 'true' }}
              uses: mcneel/setup-rhino3d@095a5ff63cdb7dc8383e229fc40ffa779915b0af # v4.0.0
              with:
                  email-address: ${{ secrets.RHINO_EMAIL }}
                  download-url: ${{ env.RHINO_INSTALLER }}
            - if: ${{ steps.cached.outputs.missed == 'true' }}
              run: nx affected --targets=test --configuration=headless --exclude="${EXCLUDE}"
              env:
                  EXCLUDE: *excluded
                  RHINO_TOKEN: ${{ secrets.RHINO_TOKEN }}
            - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !endsWith(steps.graph.outputs.cache-matched-key, hashFiles('.cache/nx/workspace-data/*.hash')) }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: *graph
                  key: nx-${{ runner.os }}-${{ hashFiles('.cache/nx/workspace-data/*.hash') }}
            - *reports

    unreal:
        name: Unreal Engine ${{ matrix.engine }}
        needs: affected
        if: ${{ needs.affected.outputs.unreal != '[]' && needs.affected.outputs.engines != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                engine: ${{ fromJSON(needs.affected.outputs.engines) }}
        runs-on: [self-hosted, container]
        timeout-minutes: 120
        container:
            image: ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.engine }}
            credentials:
                username: ${{ github.repository_owner }}
                password: ${{ secrets.EPIC_GHCR_TOKEN }}
            options: --memory=10g
        env:
            HOME: /home/ue4
            UnrealBuildTool_UnrealBuildAccelerator__AllowDetour: 'false'
        steps:
            - *checkout
            - *tools
            - run: nx run-many --targets=check,test,build --projects="${PROJECTS}"
              env:
                  PROJECTS: ${{ join(fromJSON(needs.affected.outputs.unreal), ',') }}

    deploy:
        name: Deploy
        needs: [affected, linux, browser, unreal]
        if: ${{ !cancelled() && github.event_name == 'push' && needs.affected.result == 'success' && needs.affected.outputs.infra != '[]' }}
        permissions:
            contents: read
            id-token: write
        uses: $/.github/workflows/deploy.yml
        secrets: inherit
