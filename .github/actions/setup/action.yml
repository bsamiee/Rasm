name: Setup
description: Installs the toolchain through mise, restores the package stores keyed on their manifests, and installs the workspace dependencies

inputs:
  python:
    description: Python dependency groups to sync, the scripts' group alone by default and every group for the Python job
    required: false
    default: --only-group eng

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        cache: false
    - uses: actions/cache@v6
      with:
        path: .cache/nuget/packages
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'NuGet.config', '**/*.csproj') }}
    - uses: actions/cache@v6
      with:
        path: .cache/uv
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
    - uses: actions/cache@v6
      with:
        path: |
          .cache/pnpm/store
          .cache/pnpm/cache
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    - run: pnpm install
      shell: bash
    - run: uv sync --locked ${{ inputs.python }}
      shell: bash
    - run: uv cache prune --ci
      shell: bash
