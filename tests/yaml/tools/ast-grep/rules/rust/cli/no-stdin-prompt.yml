id: no-stdin-prompt
valid:
    - |
      fn read() -> String {
          let mut line = String::new();
          std::io::stdin().read_line(&mut line).unwrap();
          line
      }
    - |
      fn read() -> String {
          let mut line = String::new();
          std::io::stdin().read_line(&mut line).unwrap();
          print!("read {line}");
          line
      }
invalid:
    - |
      fn ask() -> String {
          print!("Name: ");
          let mut line = String::new();
          std::io::stdin().read_line(&mut line).unwrap();
          line
      }
    - |
      use std::io::{self, BufRead};

      fn ask() -> Option<String> {
          let input = io::stdin();
          eprint!("Continue? ");
          input.lock().lines().next()?.ok()
      }
    - |
      use std::io::Write;

      fn ask() -> std::io::Result<String> {
          let mut out = std::io::stdout();
          write!(out, "Name: ")?;
          out.flush()?;
          let mut line = String::new();
          std::io::stdin().read_line(&mut line)?;
          Ok(line)
      }
