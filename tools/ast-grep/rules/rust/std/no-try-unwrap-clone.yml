# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-unwrap-clone
language: rust
severity: error
rule:
    kind: call_expression
    all:
        - any:
            - pattern: '$P::try_unwrap($X).unwrap_or_else(|$Y| (*$Y).clone())'
            - pattern: '$P::try_unwrap($X).unwrap_or_else(|$Y| $Y.as_ref().clone())'
            - pattern: '$P::try_unwrap($X).unwrap_or_else(|$Y| $T::clone(&*$Y))'
            - pattern: '$P::try_unwrap($X).unwrap_or_else(|$Y| $T::clone($Y.as_ref()))'
constraints:
    P: {regex: '^((::)?(std|alloc)::(rc|sync)::)?(Rc|Arc)$'}
fix: $P::unwrap_or_clone($X)
message: '`$P::try_unwrap($X)` falls back to a clone of the shared value by hand'
note: 'Call `Rc::unwrap_or_clone(<rc>)` or `Arc::unwrap_or_clone(<arc>)`'
