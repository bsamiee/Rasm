id: no-property-default-in-targets
valid:
    - |
      <PropertyGroup Label="Release Version"><MinVerTagPrefix>$(ReleaseGroup)@</MinVerTagPrefix></PropertyGroup>
    - |
      <PropertyGroup><Version Condition="'$(_ManifestVersion)' != ''">$(_ManifestVersion)</Version></PropertyGroup>
    - |
      <Target Name="Pick"><PropertyGroup><RuntimeIdentifier>osx-arm64</RuntimeIdentifier></PropertyGroup></Target>
    - |
      <PropertyGroup><TargetFrameworkVersion>v4.8</TargetFrameworkVersion></PropertyGroup>
    - |
      <ItemGroup><ProjectReference Include="Item.csproj"><SetTargetFramework>TargetFramework=net10.0</SetTargetFramework></ProjectReference></ItemGroup>
invalid:
    - |
      <PropertyGroup Label="Framework Default">
        <TargetFramework Condition="'$(TargetFramework)' == '' and '$(TargetFrameworks)' == ''">net10.0</TargetFramework></PropertyGroup>
    - |
      <PropertyGroup><RuntimeIdentifier Condition="'$(HostPlatform)' == 'true'">osx-arm64</RuntimeIdentifier></PropertyGroup>
    - |
      <PropertyGroup><ArtifactsPath>$(MSBuildThisFileDirectory).artifacts</ArtifactsPath></PropertyGroup>
    - |
      <PropertyGroup><TargetFrameworks Condition="'$(TargetFrameworks)' == ''">net10.0;netstandard2.0</TargetFrameworks></PropertyGroup>
    - |
      <PropertyGroup><UseArtifactsOutput>true</UseArtifactsOutput></PropertyGroup>
    - |
      <PropertyGroup><ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally></PropertyGroup>
    - |
      <Choose><When Condition="'$(Host)' == ''"><PropertyGroup><RuntimeIdentifiers>osx-arm64;linux-x64</RuntimeIdentifiers></PropertyGroup></When></Choose>
