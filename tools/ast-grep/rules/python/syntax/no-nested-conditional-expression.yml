# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-conditional-expression
language: python
severity: error
rule:
    kind: conditional_expression
    all:
        - has: {kind: conditional_expression, stopBy: {not: {kind: parenthesized_expression}}}
        - not: {inside: {kind: conditional_expression, stopBy: {not: {kind: parenthesized_expression}}}}
message: 'Conditional expression nests a conditional'
note: 'Select with `match`, one `case` per branch'
