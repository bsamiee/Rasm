# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    from-option:
        matches: {effect-module-member: {module: {regex: '(?-u:\b)Result$'}, member: {regex: '^fromOption$'}}}
    lookup:
        kind: call_expression
        any:
            - pattern: $FROM($LOOKUP, () => $X)
              has: {field: function, matches: from-option}
            - pattern: $LOOKUP.pipe($FROM(() => $X))
              has: {field: arguments, has: {kind: call_expression, has: {field: function, matches: from-option}}}
            - pattern: $PIPE($LOOKUP, $FROM(() => $X))
              all:
                - has: {field: arguments, has: {kind: call_expression, has: {field: function, matches: from-option}}}
                - has: {field: function, matches: {effect-function: {name: {regex: '^pipe$'}}}}
rule:
    kind: arrow_function
    all:
        - has: {field: parameters, all: [{has: {nthChild: {position: 1, ofRule: &code {not: {kind: 'comment, html_comment'}}}, kind: required_parameter, has: {field: pattern, kind: identifier, pattern: $X}}}, {not: {has: {nthChild: {position: 2, ofRule: *code}}}}]}
        - has:
            field: body
            any:
                - matches: lookup
                - kind: statement_block
                  has: {kind: return_statement, nthChild: {position: 1, reverse: true, ofRule: *code}, has: {matches: lookup}}
message: '`$FROM` fails with the element `$X` itself to build a filter by hand'
note: 'Pass `Filter.fromPredicateOption((<element>) => <lookup>)`'
