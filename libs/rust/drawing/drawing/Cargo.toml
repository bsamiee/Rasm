# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-drawing"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["drawing", "vector", "cad"]
categories           = ["graphics", "data-structures"]
description          = "Vector drawing model: colors, pens, linetypes, hatches, regions, text, glyph runs, elements, and pages in a stated unit"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                      = { workspace = true }
stacksafe                  = { workspace = true }
nonempty-collections       = { workspace = true }
thiserror                  = { workspace = true }
validated                  = { workspace = true }
derive_more                = { workspace = true }
enum-map                   = { workspace = true }
itertools                  = { workspace = true }
nutype                     = { workspace = true }
nalgebra                   = { workspace = true }
geo                        = { workspace = true }
geo-types                  = { workspace = true }
color                      = { workspace = true }
linebender_resource_handle = { workspace = true }
parlance                   = { workspace = true }
uom                        = { workspace = true }
kurbo                      = { workspace = true }
linesweeper                = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
