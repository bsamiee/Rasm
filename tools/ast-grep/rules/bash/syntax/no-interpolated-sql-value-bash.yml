# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-interpolated-sql-value-bash
language: bash
severity: error
utils:
    sql-cli:
        kind: command
        has: {field: name, pattern: $CLI, regex: '^(?:\S+/)?(sqlite3|duckdb|psql)$'}
rule:
    has: {kind: 'simple_expansion, expansion, command_substitution'}
    any:
        - kind: string
          all:
            - regex: '^"(?:[^'']*''[^'']*'')*[^'']*''[^'']*\$(\{|\(|[A-Za-z_])'
            - not: {regex: '^"\s*(\.param\s|(?i:set\s+variable\s))'}
            - inside:
                stopBy: {kind: command}
                any:
                    - matches: sql-cli
                    - kind: command
                      inside: {kind: pipeline, has: {matches: sql-cli, nthChild: {position: 1, reverse: true}}}
        - kind: heredoc_body
          all:
            - regex: '^(?:[^'']*''[^'']*'')*[^'']*''[^'']*\$(\{|\(|[A-Za-z_])'
            - not: {regex: '^\s*(\.param\s|(?i:set\s+variable\s))'}
            - inside: {kind: heredoc_redirect, inside: {kind: redirected_statement, has: {field: body, matches: sql-cli}}}
message: '`$CLI` splices a shell expansion into a quoted SQL literal, a bound parameter holds it'
note: 'Keep the statement constant and bind each value as a CLI parameter (`.param set`, `SET VARIABLE`, `psql -v`), the database then reads each value typed and unquoted'
