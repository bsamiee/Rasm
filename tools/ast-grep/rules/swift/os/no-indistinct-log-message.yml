# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-indistinct-log-message
language: swift
severity: error
utils:
    log-call:
        kind: call_expression
        has: {nthChild: 1, kind: navigation_expression, has: {field: suffix, regex: '^\.(trace|debug|info|notice|log|warning|error|critical|fault)$'}}
        any:
            - pattern: $_L.$_V($MSG)
            - pattern: '$_L.log(level: $_E, $MSG)'
    nameless-literal:
        any: [{kind: line_string_literal}, {kind: multi_line_string_literal}, {kind: raw_string_literal}]
        not:
            has:
                any: [{kind: line_str_text}, {kind: multi_line_str_text}, {kind: raw_str_part}, {kind: raw_str_end_part}]
                not: {regex: '(?i)^[^a-z]*((trace|debug|info|notice|warning|error|critical|fault|failed|failure|exception)s?\b[^a-z]*)*$'}
    earlier-site:
        any:
            - matches: log-call
            - has: {stopBy: end, matches: log-call}
rule:
    kind: call_expression
    all:
        - matches: log-call
        - has: {nthChild: 1, pattern: $LOGGER}
        - any:
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: value, matches: nameless-literal}}}}
            - follows: {stopBy: end, matches: earlier-site}
            - inside: {stopBy: end, follows: {stopBy: end, matches: earlier-site}}
message: '`$LOGGER` logs literal text that names no operation or repeats an earlier call''s message, and log readers cannot tell the sites apart'
note: 'Name the operation and its subject in each message''s literal text beyond the level words, and log a failure several paths share once after they join'
