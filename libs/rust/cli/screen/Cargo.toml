# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-screen"
version.workspace    = true
edition.workspace    = true
description          = "Screen mode over rasm-command: terminal session with suspend, keymap rows, log pane and default view"
repository.workspace = true
license.workspace    = true
keywords             = ["cli", "tui", "terminal", "keymap", "logs"]
categories           = ["command-line-interface"]

# --- [TARGETS] --------------------------------------------------------------------------

# --- [LIB]
[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

# --- [RUNTIME]
[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-stream                       = { workspace = true }
nonempty-collections               = { workspace = true }
validated                          = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
serde                              = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
tracing-log                        = { workspace = true }
tracing-subscriber                 = { workspace = true }
anstream                           = { workspace = true }
anstyle                            = { workspace = true }
clap                               = { workspace = true }
crossterm                          = { workspace = true }
ratatui                            = { workspace = true }
ratatui-core                       = { workspace = true }
tui-logger                         = { workspace = true }
rasm-telemetry                     = { workspace = true }
rasm-command                       = { workspace = true }

[target."cfg(unix)".dependencies]
rustix = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
