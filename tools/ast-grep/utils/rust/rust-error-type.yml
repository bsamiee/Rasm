# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-error-type
language: rust
arguments: [name]
rule:
    any:
        - kind: impl_item
          all: [{has: {field: trait, regex: '(^|::)Error$'}}, {has: {field: type, matches: name}}]
        - kind: 'struct_item, enum_item'
          all:
            - has: {field: name, matches: name}
            - matches: {rust-attributed: {attribute: {matches: {rust-derive: {trait: {regex: '^Error$'}}}}}}
