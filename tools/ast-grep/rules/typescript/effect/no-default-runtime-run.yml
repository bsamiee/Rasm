# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-default-runtime-run
language: tsx
severity: error
# A config root is the host's composition root and runs there, a spec runs under the test framework's callback
ignores: ['**/*.config.ts', '**/*.spec.ts', '**/*.test.ts', '**/*.bench.ts']
rule:
    # The run members of the module itself run on the default runtime, a ManagedRuntime or Runtime.runPromise(runtime) carries the layer
    pattern: $M.$RUN($$$)
constraints:
    M: {regex: '^(Effect|Micro)$'}
    RUN: {regex: '^(runSync|runSyncExit|runPromise|runPromiseExit|runFork|runCallback)$'}
message: '`$M.$RUN` runs the effect on the default runtime inside library code'
note: >-
    Return the effect or a Layer, and run once at the composition root, `NodeRuntime.runMain(program)` for the entry point
    or `ManagedRuntime.make(layer)` whose `runPromise` a host callback calls
