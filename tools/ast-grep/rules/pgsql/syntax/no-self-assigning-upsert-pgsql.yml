# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pgsql
severity: error
utils:
    assignment:
        kind: set_clause
        inside: {kind: set_clause_list, stopBy: {not: {kind: set_clause_list}}}
    self-assignment:
        kind: set_clause
        all:
            - has: {kind: set_target, not: {has: {kind: opt_indirection}}, has: {kind: ColId, has: {pattern: $COLUMN}}}
            - has:
                kind: a_expr
                matches: pgsql-wrapper
                has:
                    stopBy: {not: {matches: pgsql-wrapper}}
                    kind: columnref
                    any:
                        - all: [{not: {has: {kind: indirection}}}, {has: {kind: ColId, has: {pattern: $COLUMN}}}]
                        - all:
                            - has: {kind: ColId, has: {pattern: $TABLE}}
                            - has: {kind: indirection, not: {has: {kind: indirection}}, has: {kind: indirection_el, has: {kind: ColLabel, has: {pattern: $COLUMN}}}}
rule:
    kind: opt_on_conflict
    all:
        - has: {kind: set_clause_list}
        - inside:
            kind: InsertStmt
            has:
                kind: insert_target
                any:
                    - has: {kind: ColId, has: {pattern: $TABLE}}
                    - all:
                        - not: {has: {kind: ColId}}
                        - has:
                            kind: qualified_name
                            any:
                                - all: [{not: {has: {kind: indirection}}}, {has: {kind: ColId, has: {pattern: $TABLE}}}]
                                - has: {kind: indirection, has: {kind: indirection_el, has: {kind: ColLabel, has: {pattern: $TABLE}}}}
        - not: {has: {stopBy: {not: {kind: set_clause_list}}, matches: assignment, not: {matches: self-assignment}}}
message: 'Upsert rewrites each conflicting row with current values'
note: 'Use `on conflict (<key>) do nothing returning <columns>` and select existing rows in one transaction'
