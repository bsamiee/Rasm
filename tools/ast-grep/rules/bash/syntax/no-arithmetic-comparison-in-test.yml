# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-arithmetic-comparison-in-test
language: bash
severity: error
ignores: ["**/*.json"]
rule:
    kind: test_command
    regex: '^\[\['
    has:
        stopBy: {kind: command_substitution}
        kind: binary_expression
        has: {field: operator, regex: "^-(eq|ne|lt|le|gt|ge)$"}
message: The test command compares numbers through a -eq family operator
note: Express the numeric condition as an arithmetic command, `(( left == right ))`, and keep operand grouping and empty-value handling
