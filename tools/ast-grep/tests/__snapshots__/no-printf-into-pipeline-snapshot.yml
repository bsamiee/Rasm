id: no-printf-into-pipeline
snapshots:
  ? |
    echo "$out" | jq -r .a
  : fixed: |
      jq -r .a <<<"$out"
    labels:
    - source: echo "$out" | jq -r .a
      style: primary
      start: 0
      end: 22
    - source: echo "$out"
      style: secondary
      start: 0
      end: 11
    - source: jq -r .a
      style: secondary
      start: 14
      end: 22
  ? |
    first=$(printf '%s\n' "$out" | head -1)
  : fixed: |
      first=$(head -1 <<<"$out")
