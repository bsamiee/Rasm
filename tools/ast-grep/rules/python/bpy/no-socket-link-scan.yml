# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-socket-link-scan
language: python
severity: error
files:
    - libs/python/blender/**
    - apps/blender/**
utils:
    link-loop:
        matches: {python-attribute-iteration: {target: {pattern: $LINK}, attribute: {regex: '^links$'}}}
rule:
    kind: comparison_operator
    any:
        - pattern: $LINK.$END == $SOCKET
        - pattern: $SOCKET == $LINK.$END
    inside:
        stopBy: end
        any:
            - kind: generator_expression, list_comprehension, set_comprehension, dictionary_comprehension
              has: {kind: for_in_clause, matches: link-loop}
            - kind: for_statement
              matches: link-loop
constraints:
    END: {regex: '^(from_socket|to_socket)$'}
message: '`$LINK.$END == $SOCKET` scans every tree link for links of `$SOCKET`'
note: 'Iterate `<socket>.links`'
