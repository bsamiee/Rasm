id: sql-import
language: sql
role: item
symbolType: module
isImport: true
isExported: false
rule:
    pattern: $DECLARATION
    not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}
    any:
        - kind: attach_statement
          has: {field: source, pattern: $SOURCE}
        - kind: dot_command
          all:
              - has: {field: name, regex: '^\.(?:import|load|open|read)$'}
              - has: {field: arguments, pattern: $ARGUMENTS}
        - kind: dot_command
          all:
              - has: {field: name, regex: '^\.restore$'}
              - has: {field: arguments, pattern: $RESTORED}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
    - id: key
      rule:
          pattern: $_
          inside: {kind: attach_statement, field: key}
      fix: …
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    ATTACHED: {replace: {source: $SOURCE, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    PATH: {replace: {source: $ARGUMENTS, replace: '^(?:[\t\f\r \x{FEFF}]+-[^\t\f\r \x{FEFF}]*)*[\t\f\r \x{FEFF}]*(''[^'']*''|"[^"]*"|[^\t\f\r \x{FEFF}]+).*$', by: '$1'}}
    BACKUP: {replace: {source: $RESTORED, replace: '^.*[\t\f\r \x{FEFF}]([^\t\f\r \x{FEFF}]+)[\t\f\r \x{FEFF}]*$', by: '$1'}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [key, trivia]}}
name: $ATTACHED$PATH$BACKUP
signature: $SIGNATURE
---
id: sql-table
language: sql
role: item
symbolType: struct
isExported: false
rule:
    kind: create_table_statement, create_virtual_table_statement, create_view_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule:
          any:
              - {kind: 'column_definition, table_constraint, vtab_module_arg', inside: {kind: 'create_table_statement, create_virtual_table_statement'}}
              - {kind: 'select_clause, substitution', inside: {kind: create_table_statement}, not: {inside: {kind: create_table_statement, field: temporary}}}
              - {kind: 'select_clause, substitution', inside: {kind: create_view_statement, field: body}}
              - kind: line_comment, block_comment
      fix: {template: ' ', expandStart: {regex: '(?i-u)^([(,]|as)$'}, expandEnd: {regex: '^\)$'}}
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
name: $KEY
signature: $SIGNATURE
---
id: sql-error
language: sql
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, kind: 'attach_statement, dot_command, create_table_statement, create_virtual_table_statement, create_view_statement, create_index_statement, create_trigger_statement, select_statement, insert_statement, update_statement, delete_statement, pragma_statement, alter_table_statement, drop_table_statement, drop_view_statement, drop_index_statement, drop_trigger_statement, analyze_statement, reindex_statement, vacuum_statement, detach_statement, begin_statement, commit_statement, rollback_statement, savepoint_statement, release_statement, explain_statement'}}}
        - {kind: 'identifier, line_comment, block_comment', all: [{inside: {kind: ERROR}}, {nthChild: {position: 1, ofRule: {kind: 'identifier, line_comment, block_comment'}}}]}
        - {pattern: ';', inside: {kind: ERROR, not: {has: {kind: 'identifier, line_comment, block_comment'}}}, not: {follows: {pattern: ';', stopBy: end}}}
        - {kind: 'malformed_blob_literal, malformed_number_id', not: {inside: {kind: ERROR, stopBy: end}}}
        - {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: sql-member-expression
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table, sql-index]
rule:
    kind: indexed_column, expression_result_column
    pattern: $DECLARATION
    all:
        - not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}
        - has: {field: expression, pattern: $EXPRESSION, not: {kind: column_reference}}
        - any:
              - {kind: indexed_column, inside: {kind: create_index_statement}, not: {has: {field: expression, kind: collate_expression, has: {field: operand, kind: column_reference}}}}
              - kind: expression_result_column
                not: {has: {field: alias, pattern: $_}}
                inside:
                    kind: result_column_list
                    inside:
                        kind: select_clause
                        field: columns
                        inside: {kind: 'create_table_statement, create_view_statement', not: {has: {kind: 'identifier, quoted_identifier, string_literal, substitution', inside: {kind: create_view_statement}, not: {any: [{inside: {kind: create_view_statement, field: body}}, {inside: {kind: create_view_statement, field: temporary}}]}}}}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    BARE: {rewrite: {source: $EXPRESSION, rewriters: [trivia]}}
    FORM: {replace: {source: $BARE, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    KEY: {replace: {source: $FORM, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
name: $KEY
signature: $SIGNATURE
---
id: sql-member-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table, sql-index]
utils:
    declared: {pattern: $DECLARATION, not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}}
    listed:
        kind: identifier, quoted_identifier, string_literal, substitution
        inside: {kind: create_view_statement}
        not: {any: [{inside: {kind: create_view_statement, field: body}}, {inside: {kind: create_view_statement, field: temporary}}]}
rule:
    matches: declared
    any:
        - kind: column_definition
          has: {field: name, pattern: $NAME}
        - kind: indexed_column
          inside: {kind: create_index_statement}
          has: {field: expression, any: [{kind: column_reference, has: {field: name, pattern: $NAME}}, {kind: collate_expression, has: {field: operand, kind: column_reference, has: {field: name, pattern: $NAME}}}]}
        - {kind: 'identifier, quoted_identifier, string_literal, substitution', pattern: $NAME, matches: listed}
        - kind: star_result_column, qualified_star_result_column, expression_result_column
          any:
              - has: {field: alias, pattern: $NAME}
              - has: {field: expression, kind: column_reference, has: {field: name, pattern: $NAME}}
              - pattern: $NAME
          inside:
              kind: result_column_list
              inside:
                  kind: select_clause
                  field: columns
                  inside: {kind: 'create_table_statement, create_view_statement', not: {has: {matches: listed}}}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
    - id: value
      rule:
          pattern: $_
          inside: {kind: column_constraint, has: {regex: '(?i-u)^(?:default|as)$'}}
          not: {inside: {kind: column_constraint, field: name}}
      fix: {template: …, expandStart: {regex: '^[+-]$'}}
    - id: elided
      rule: {kind: expression_result_column, all: [{has: {field: expression, regex: "\n"}}, {has: {field: alias, pattern: $ALIAS}}]}
      fix: … AS $ALIAS
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [elided, value, trivia]}}
name: $KEY
signature: $SIGNATURE
---
id: sql-member-argument
language: sql
role: member
symbolType: field
parentRuleIds: [sql-table]
rule: {kind: vtab_module_arg, pattern: $ARGUMENT, not: {any: [{regex: '^[\t\n\f\r \x{FEFF}]*[$0-9A-Z_a-z\x80-\x{10FFFF}]+[\t\n\f\r \x{FEFF}]*='}, {has: {kind: 'malformed_blob_literal, malformed_number_id'}}]}}
transform:
    FOLDED: {replace: {source: $ARGUMENT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
    KEY: {replace: {source: $SIGNATURE, replace: '^\+?(\$?\{[^}]*\}[^ =(]*|"[^"]*"|\[[^\]]*\]|`[^`]*`|''[^'']*''|[^ =(]+).*$', by: '$1'}}
name: $KEY
signature: $SIGNATURE
---
id: sql-member-option
language: sql
role: member
symbolType: property
parentRuleIds: [sql-table]
rule: {kind: vtab_module_arg, regex: '^[\t\n\f\r \x{FEFF}]*[$0-9A-Z_a-z\x80-\x{10FFFF}]+[\t\n\f\r \x{FEFF}]*=', pattern: $ARGUMENT, not: {has: {kind: 'malformed_blob_literal, malformed_number_id'}}}
transform:
    FOLDED: {replace: {source: $ARGUMENT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $', by: ''}}
    KEY: {replace: {source: $SIGNATURE, replace: '^([$0-9A-Z_a-z\x80-\x{10FFFF}]+).*$', by: '$1'}}
name: $KEY
signature: $SIGNATURE
---
id: sql-table-constraint
language: sql
role: member
symbolType: key
parentRuleIds: [sql-table, sql-statement]
rule:
    kind: table_constraint
    pattern: $DECLARATION
    not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}
    any:
        - has: {field: name, pattern: $NAME}
        - kind: table_constraint
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    LABEL: {replace: {source: $SIGNATURE, replace: '^(?i-u:constraint) .*$|^((?i-u:foreign key) ?\([^)]*\)) .*$| (?i-u:on conflict) [^ ]+$', by: '$1'}}
name: $KEY$LABEL
signature: $SIGNATURE
---
id: sql-index
language: sql
role: item
symbolType: key
isExported: false
rule:
    kind: create_index_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [trivia]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $KEY
signature: $SIGNATURE
---
id: sql-trigger
language: sql
role: item
symbolType: event
isExported: false
rule:
    kind: create_trigger_statement
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
    - id: body
      rule: {kind: 'select_statement, insert_statement, update_statement, delete_statement, substitution, line_comment, block_comment', inside: {kind: create_trigger_statement}, follows: {regex: '(?i-u)^begin$', stopBy: end}}
      fix: {template: ' ', expandStart: {regex: '(?i-u)^begin$', stopBy: end}, expandEnd: {regex: '(?i-u)^end$', stopBy: end}}
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body, trivia]}}
name: $KEY
signature: $SIGNATURE
---
id: sql-trigger-statement
language: sql
role: member
symbolType: operator
isPublic: false
parentRuleIds: [sql-trigger]
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement
    pattern: $DECLARATION
    inside: {kind: create_trigger_statement}
    not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}
    any:
        - has: {field: target, pattern: $SUBJECT}
        - has: {kind: from_clause, stopBy: {kind: 'result_column_list, with_clause, from_clause'}, has: {kind: 'qualified_table_name, substitution', pattern: $SUBJECT, stopBy: {kind: select_clause}}}
        - has: {kind: substitution, pattern: $SUBJECT}
        - has: {stopBy: end, pattern: $$SUBJECT, regex: '(?i-u)^(select|values)$'}
rewriters:
    - id: clause
      rule:
          any:
              - kind: where_clause, having_clause, order_by_clause, limit_clause, upsert_clause, with_clause, window_clause, group_by_clause
                inside: {kind: 'select_statement, insert_statement, update_statement, delete_statement, select_statement > select_clause'}
              - kind: line_comment, block_comment
              - {kind: 'select_clause, values_clause, default_values_clause, substitution', inside: {kind: insert_statement, field: source}}
      fix: ' '
    - id: assignment
      rule: {kind: 'set_assignment, line_comment, block_comment', inside: {kind: update_statement}}
      fix: {template: ' ', expandStart: {regex: '(?i-u)^(set|,)$'}}
    - id: enclosed
      rule: {kind: 'normal_function_arguments, select_clause, column_name_list', regex: "\n"}
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [assignment, clause, enclosed]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $SUBJECT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $KEY
signature: $SIGNATURE
---
id: sql-statement
language: sql
role: item
symbolType: operator
isExported: false
utils:
    subject:
        any:
            - has: {field: name, pattern: $SUBJECT}
            - has: {kind: 'qualified_table_name, identifier, quoted_identifier, string_literal', pattern: $SUBJECT}
            - has: {field: schema, pattern: $SUBJECT}
            - has: {kind: from_clause, stopBy: {kind: 'result_column_list, with_clause, from_clause'}, has: {kind: qualified_table_name, pattern: $SUBJECT, stopBy: {kind: select_clause}}}
            - has: {kind: from_clause, stopBy: {kind: 'result_column_list, with_clause, from_clause'}, has: {kind: table_or_subquery, has: {field: alias, pattern: $SUBJECT}, stopBy: {kind: select_clause}}}
            - has: {kind: substitution, pattern: $SUBJECT}
            - has: {stopBy: end, pattern: $$SUBJECT, regex: '(?i-u)^(select|values|begin|commit|end|rollback|analyze|reindex|vacuum|explain)$'}
rule:
    kind: select_statement, insert_statement, update_statement, delete_statement, pragma_statement, alter_table_statement, drop_table_statement, drop_view_statement, drop_index_statement, drop_trigger_statement, analyze_statement, reindex_statement, vacuum_statement, detach_statement, begin_statement, commit_statement, rollback_statement, savepoint_statement, release_statement, explain_statement, dot_command
    pattern: $DECLARATION
    any:
        - {kind: dot_command, has: {field: name, pattern: $$SUBJECT}}
        - {kind: explain_statement, has: {field: statement, matches: subject}}
        - matches: subject
rewriters:
    - id: clause
      rule:
          any:
              - kind: where_clause, having_clause, order_by_clause, limit_clause, upsert_clause, with_clause, window_clause, group_by_clause
                inside: {kind: 'select_statement, insert_statement, update_statement, delete_statement, select_statement > select_clause'}
              - kind: line_comment, block_comment
              - {kind: 'select_clause, values_clause, default_values_clause, substitution', inside: {kind: insert_statement, field: source}}
      fix: ' '
    - id: assignment
      rule: {kind: 'set_assignment, line_comment, block_comment', inside: {kind: update_statement}}
      fix: {template: ' ', expandStart: {regex: '(?i-u)^(set|,)$'}}
    - id: enclosed
      rule:
          any:
              - {kind: 'normal_function_arguments, select_clause, column_name_list', regex: "\n"}
              - kind: column_definition, table_constraint
      fix: …
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [assignment, clause, enclosed]}}
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $SUBJECT, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
name: $KEY
signature: $SIGNATURE
---
id: sql-member-added-column
language: sql
role: member
symbolType: field
parentRuleIds: [sql-statement]
rule:
    kind: column_definition
    pattern: $DECLARATION
    not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}
    has: {field: name, pattern: $NAME}
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
    - id: value
      rule:
          pattern: $_
          inside: {kind: column_constraint, has: {regex: '(?i-u)^(?:default|as)$'}}
          not: {inside: {kind: column_constraint, field: name}}
      fix: {template: …, expandStart: {regex: '^[+-]$'}}
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [value, trivia]}}
name: $KEY
signature: $SIGNATURE
---
id: sql-member-query
language: sql
role: member
symbolType: variable
isPublic: false
parentRuleIds: [sql-table, sql-statement]
rule:
    pattern: $DECLARATION
    not: {has: {stopBy: end, any: [{kind: 'ERROR, malformed_blob_literal, malformed_number_id'}, {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}]}}
    any:
        - kind: cte_definition, named_window
          has: {field: name, pattern: $NAME}
        - kind: table_or_subquery
          all: [{has: {kind: select_clause}}, {has: {field: alias, pattern: $NAME}}]
rewriters:
    - id: trivia
      rule: {kind: 'line_comment, block_comment'}
      fix: ' '
    - id: query
      rule: {kind: select_clause, inside: {kind: 'cte_definition, table_or_subquery'}}
      fix: …
transform:
    FOLDED: {replace: {source: $HEADER, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    SIGNATURE: {replace: {source: $FOLDED, replace: '^ | $|(\() | (\))| (,)', by: '$1$2$3'}}
    KEY: {replace: {source: $NAME, replace: '[\t\n\f\r \x{FEFF}]+', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [query, trivia]}}
name: $KEY
signature: $SIGNATURE
---
id: sql-member-error
language: sql
role: member
parentRuleIds: [sql-table, sql-index, sql-trigger, sql-statement]
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, any: [{kind: 'column_definition, vtab_module_arg, table_constraint, cte_definition, named_window'}, {kind: table_or_subquery, has: {kind: select_clause}}]}}}
        - {kind: 'malformed_blob_literal, malformed_number_id', not: {inside: {kind: ERROR, stopBy: end}}}
        - {regex: '^$', any: [{kind: identifier}, {pattern: ')'}, {pattern: ';'}, {pattern: END}]}
        - {kind: ERROR, not: {has: {pattern: $_, not: {kind: 'column_definition, vtab_module_arg, table_constraint, cte_definition, named_window, table_or_subquery'}}}}
name: ERROR
signature: ''
isPublic: false
