# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-sentinel-object
language: python
severity: error
utils:
    empty-class:
        kind: class_definition
        all:
            - has: {field: name, pattern: $CLASS}
            - not: {has: {field: superclasses, kind: argument_list}}
            - has:
                field: body
                kind: block
                all:
                    - has: {any: [{kind: pass_statement}, {kind: expression_statement, has: {kind: "string, ellipsis"}}]}
                    - not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}
rule:
    kind: assignment
    all:
        - has: {field: left, kind: identifier, pattern: $NAME}
        - has:
            field: right
            any:
                - pattern: object()
                - pattern: sentinel($$$)
                - pattern: $CLASS()
                  has: {field: function, kind: identifier}
                  inside: {kind: module, stopBy: end, has: {matches: empty-class}}
        - inside:
            kind: expression_statement
            inside: {kind: 'module, class_definition', stopBy: {matches: python-function-boundary}}
message: '`$NAME` is a sentinel object standing for absence by identity, the form of `hasattr`, `in`, or `T | None` at the boundary'
