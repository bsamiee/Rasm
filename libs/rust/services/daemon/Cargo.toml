# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-daemon"
edition.workspace = true
description       = "Served HTTP process every Rasm daemon runs: listeners, h2c serving, and two-stage drain"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
futures                            = { workspace = true }
tokio                              = { workspace = true }
tokio-util                         = { workspace = true }
socket2                            = { workspace = true }
nonempty-collections               = { workspace = true }
sysexits                           = { workspace = true }
thiserror                          = { workspace = true }
validated                          = { workspace = true }
derive_more                        = { workspace = true }
itertools                          = { workspace = true }
jiff                               = { workspace = true }
axum                               = { workspace = true }
http                               = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing                            = { workspace = true }
clap                               = { workspace = true }
rasm-command                       = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
