# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-caret-underline
language: rust
severity: error
utils:
    space-literal:
        kind: 'string_literal, char_literal'
        regex: '^(" +"|'' '')$'
    caret-literal:
        kind: 'string_literal, char_literal'
        regex: '^("\^+"|"~+"|''[\^~]'')$'
    caret-text:
        kind: string_literal
        regex: '^"([^"{}\\]|\\.|\{\{|\}\}|\{[^{}]*\})*?\^'
    padded-placeholder:
        kind: string_literal
        regex: '\{[^{}]*:[^{}]?>[^{}]*\}'
    caret-repeat:
        kind: call_expression
        has: {field: function, kind: field_expression, all: [{has: {field: value, matches: caret-literal}}, {has: {field: field, regex: '^repeat$'}}]}
    caret-iterator:
        kind: call_expression
        any:
            - all:
                - has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?repeat_n$'}
                - has: {field: arguments, has: {nthChild: 1, matches: caret-literal}}
            - all:
                - has: {field: function, kind: field_expression, all: [{has: {field: field, regex: '^take$'}}, {has: {field: value, kind: call_expression, all: [{has: {field: function, regex: '^((::)?(std|core)::)?(iter::)?repeat$'}}, {has: {field: arguments, has: {nthChild: 1, matches: caret-literal}}}]}}]}
    space-repeat:
        kind: call_expression
        has: {field: function, kind: field_expression, all: [{has: {field: value, matches: space-literal}}, {has: {field: field, regex: '^repeat$'}}]}
    caret-push:
        kind: expression_statement
        has:
            kind: call_expression
            all:
                - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $BUFFER}}, {has: {field: field, regex: '^(push|push_str)$'}}]}
                - has: {field: arguments, has: {nthChild: 1, any: [{matches: caret-literal}, {matches: caret-text}]}}
rule:
    pattern: $SITE
    any:
        - matches: caret-repeat
        - matches: caret-iterator
        - kind: tuple_expression
          any:
            - all: [{has: {matches: caret-text}}, {has: {matches: space-repeat}}]
            - all: [{has: {matches: padded-placeholder}}, {has: {matches: caret-literal}}]
        - kind: call_expression
          all:
            - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $BUFFER}}, {has: {field: field, regex: '^push_str$'}}]}
            - has: {field: arguments, has: {nthChild: 1, kind: reference_expression, has: {matches: space-repeat}}}
            - inside: {kind: expression_statement, precedes: {stopBy: end, matches: caret-push}}
message: '`$SITE` underlines source text by hand'
note: 'Render the span through `annotate_snippets::Renderer` (`Renderer::styled().render(&[Level::ERROR.primary_title(<message>).element(Snippet::source(<source>).annotation(AnnotationKind::Primary.span(<range>)))])`)'
