# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name              = "rasm-process"
edition.workspace = true
description       = "Child processes in groups and job objects that end with their owner, crashes included, and run to completion under a deadline"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
tokio                = { workspace = true }
tokio-util           = { workspace = true }
process-wrap         = { workspace = true, features = ["std"] }
nonempty-collections = { workspace = true }
thiserror            = { workspace = true }
derive_more          = { workspace = true }
itertools            = { workspace = true }

[target."cfg(unix)".dependencies]
rustix = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
