# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-unchecked-split-at
language: rust
severity: error
rule:
    kind: call_expression
    pattern: $CALL
    all:
        - has: {field: function, kind: field_expression, all: [{has: {field: value, pattern: $R}}, {has: {field: field, regex: '^split_at(_mut)?$'}}]}
        - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $_, not: {kind: integer_literal, regex: '^0(_?usize)?$'}}}, {not: {has: {nthChild: 2}}}]}
        - not: {has: {field: arguments, has: {stopBy: end, pattern: $R.len()}}}
message: '`$CALL` panics for an index past the end or off a char boundary'
note: 'Call `split_at_checked` or `split_at_mut_checked` (Rust 1.80), which return `None` where `split_at` panics, and match the absence, an index derived from the receiver''s own `len()` or the literal `0` stays in bounds, no template applies since every consumer of the pair changes to read the `Option`'
