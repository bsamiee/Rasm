# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-cfg-attribute
language: rustlang
rule:
    kind: attribute_item
    regex: cfg
    has:
        kind: attribute
        all:
            - has: {field: path, pattern: cfg}
            - has: {field: arguments, has: {stopBy: end, kind: identifier, not: {regex: '^(all|any|not)$'}}}
