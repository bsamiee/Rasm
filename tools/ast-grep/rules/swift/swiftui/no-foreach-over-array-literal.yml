# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-foreach-over-array-literal
language: swift
severity: error
utils:
    literal-array:
        any:
            - kind: array_literal
            - kind: call_expression
              has: {nthChild: 1, kind: navigation_expression, has: {field: target, matches: literal-array}}
            - kind: nil_coalescing_expression
              all:
                - has: {field: if_nil, kind: array_literal, regex: '^\[\s*\]$'}
                - has: {field: value, kind: call_expression, has: {stopBy: end, kind: lambda_literal, has: {kind: statements, has: {nthChild: 1, kind: array_literal}}}}
rule:
    kind: call_expression
    all:
        - has: {nthChild: 1, kind: simple_identifier, regex: '^(ForEach|List|Table|OutlineGroup)$'}
        - has:
            kind: call_suffix
            has:
                kind: value_arguments
                has:
                    kind: value_argument
                    nthChild: 1
                    not: {has: {field: name, kind: value_argument_label}}
                    has: {field: value, pattern: $ITEMS, matches: literal-array}
message: '`$ITEMS` builds the collection the view iterates from elements the call site already names'
note: 'Write one view per element in place, `if let <element> { <view> }` for an optional one, or iterate the owning collection'
