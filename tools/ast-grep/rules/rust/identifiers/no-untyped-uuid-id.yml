# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-untyped-uuid-id
language: rust
severity: error
utils:
    uuid-type:
        any:
            - kind: 'type_identifier, scoped_type_identifier'
              regex: '^((::)?uuid::)?Uuid$'
            - kind: generic_type
              all:
                - has: {field: type, regex: '^(Option|Vec|BTreeSet|IndexSet|NEVec)$'}
                - has: {field: type_arguments, has: {nthChild: 1, matches: uuid-type}, not: {has: {nthChild: 2}}}
    id-name:
        regex: '^(r#)?(id|\w+_id)$'
rule:
    pattern: $SITE
    any:
        - kind: 'field_declaration, parameter, let_declaration'
          all:
            - any: [{has: {field: name, matches: id-name}}, {has: {field: pattern, kind: identifier, matches: id-name}}]
            - has: {field: type, matches: uuid-type}
            - not: {inside: {kind: parameters, inside: {matches: rust-fixed-signature}}}
        - kind: 'string_literal, raw_string_literal'
          regex: '\{\w*:08x\}-\{\w*:04x\}-\{\w*:04x\}-'
          inside: {kind: token_tree, inside: {kind: macro_invocation}}
message: '`$SITE` holds or spells an identifier as an untyped UUID'
note: 'Type each identifier `newtype_uuid::TypedUuid<<Kind>>` with one `TypedUuidKind` per entity, the typed id serializes as the same UUID string and stops one entity''s id from reaching another''s parameter. A token a protocol carries as an opaque string and its peer echoes back names no entity, it keeps the protocol''s string type from generation to lookup. Print a UUID through `uuid::Uuid`''s `Display`'
