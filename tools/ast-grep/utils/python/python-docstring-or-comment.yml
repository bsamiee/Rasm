# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: python-docstring-or-comment
language: pythonlang
rule:
    any:
        - kind: comment
        - kind: expression_statement
          has:
            any:
                - {kind: string, matches: python-text-string}
                - {kind: concatenated_string, not: {has: {kind: string, not: {matches: python-text-string}}}}
