# --- [PROJECT] --------------------------------------------------------------------------

[project]
name              = "rasm-records"
version           = "0.1.0"
description       = "Record model every Rasm Python package builds on: fault results, field domains, record files and stores, and keyed record trees"
readme            = "README.md"
license           = "MIT"
license-files     = ["LICENSE"]
authors           = [{ name = "Bardia Samiee", email = "b.samiee93@gmail.com" }]
classifiers       = ["Intended Audience :: Developers", "Operating System :: OS Independent", "Private :: Do Not Upload", "Topic :: Software Development :: Libraries"]
requires-python   = ">=3.13"
import-names      = ["rasm.records"]
import-namespaces = ["rasm"]

dependencies = [
    "cbor2>=6.3.0",          # Canonical binary content hashing through `dumps(encoders=)`
    "expression>=6.0.1",     # Results, options, and collections over records
    "msgspec[toml]>=0.22.0", # Records, tagged unions, field bounds, and JSON, TOML, and MessagePack codecs
    "numpy>=2.3.4",          # Content hashes of array buffers, 2.3.4 the release Blender bundles
]

[project.urls]
Homepage = "https://github.com/bsamiee/Rasm/tree/main/libs/python/data/records"
Source   = "https://github.com/bsamiee/Rasm"
Issues   = "https://github.com/bsamiee/Rasm/issues"

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rasm.records"
module-root = ""

# --- [RUFF] -----------------------------------------------------------------------------

[tool.ruff]
extend = "../../../../pyproject.toml" # Ruff reads this manifest's `requires-python` through its own table
