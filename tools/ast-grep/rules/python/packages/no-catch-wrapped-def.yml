# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-catch-wrapped-def
language: python
severity: error
utils:
    catch-callee:
        matches: {python-member-use: {module: {regex: '^expression\.extra\.result(\.catch)?$'}, name: {regex: '^catch$'}}}
rule:
    kind: call
    pattern: $CALL
    all:
        - has: {field: arguments, kind: argument_list, not: {has: {nthChild: 1}}}
        - has:
            field: function
            kind: call
            all:
                - has: {field: function, matches: catch-callee}
                - has: {field: arguments, has: {nthChild: 1, kind: identifier, pattern: $FUNCTION}}
        - inside:
            kind: block
            stopBy: {kind: 'function_definition, lambda, class_definition'}
            has: {kind: function_definition, has: {field: name, pattern: $FUNCTION}}
        - not:
            inside:
                kind: block
                stopBy: {kind: 'function_definition, lambda, class_definition'}
                has:
                    stopBy: end
                    kind: identifier
                    pattern: $FUNCTION
                    not:
                        any:
                            - inside: {kind: function_definition, field: name}
                            - nthChild: 1
                              inside: {kind: argument_list, inside: {kind: call, has: {field: function, matches: catch-callee}}}
message: '`$CALL` wraps `$FUNCTION` in `catch` at the call'
note: 'Decorate `def <function>` with `@catch(exception=<error>)` and call `<function>()`'
