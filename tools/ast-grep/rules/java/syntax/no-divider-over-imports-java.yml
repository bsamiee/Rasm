# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-divider-over-imports-java
language: java
severity: error
rule:
    matches: java-divider-comment
    pattern: $DIVIDER
    inside: {kind: program}
    precedes: {stopBy: {not: {kind: 'line_comment, block_comment'}}, kind: 'package_declaration, import_declaration'}
    not: {any: [{matches: java-empty-divider}, {matches: java-parse-error-file}]}
transform:
    LABEL: {replace: {source: $DIVIDER, replace: '^//\s*-*\s*(\[[^\]]*\])[\s\S]*$', by: '$1'}}
message: Divider `$LABEL` sits above the package and import declarations
note: Move the divider below the package and import declarations
