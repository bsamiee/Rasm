id: no-escape-character-by-code-point
valid:
    - 'var reset = "\e[0m";'
    - 'var c = (char)28;'
    - 'var text = "\u001c";'
    - 'var s = char.ConvertFromUtf32(28);'
invalid:
    - 'var reset = "\u001b[0m";'
    - 'var reset = "\x1b[0m";'
    - 'var c = (char)27;'
    - 'var s = char.ConvertFromUtf32(27);'
    - 'var c = Convert.ToChar(0x1B);'
