id: no-export-list-in-entry-module
valid:
    - |
      class Test(Posted, frozen=True):
          kind: str


      __all__ = ["Test"]
    - |
      def read() -> int: ...


      __all__ = ["read"]
invalid:
    - |
      def test_read() -> None:
          assert read() == 1


      __all__ = []
    - |
      class TestRead:
          def test_read(self) -> None: ...


      __all__ = ["TestRead"]
    - |
      import pytest


      @pytest.fixture
      def sample() -> int:
          return 1


      __all__ = ["sample"]
    - |
      def main() -> None: ...


      if __name__ == "__main__":
          main()


      __all__ = ["main"]
