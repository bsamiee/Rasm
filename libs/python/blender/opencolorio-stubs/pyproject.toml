# --- [PROJECT] --------------------------------------------------------------------------

[project]
name            = "rasm-opencolorio-stubs"
version         = "0.0.0"
description     = "PyOpenColorIO stubs pybind11-stubgen generates at build time from the OpenColorIO release Blender bundles"
classifiers     = ["Private :: Do Not Upload", "Typing :: Stubs Only"]
requires-python = ">=3.13"
dependencies    = []

# --- [DEPENDENCY_GROUPS] ----------------------------------------------------------------

[dependency-groups]
dev = ["hatchling"] # Build hook interface `hatch_build.py` implements

# --- [BUILD_SYSTEM] ---------------------------------------------------------------------

[build-system]
requires      = ["hatchling", "opencolorio", "pybind11-stubgen"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true # The build hook supplies every file the wheel holds

[tool.hatch.build.targets.wheel.hooks.custom]
