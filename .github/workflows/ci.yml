name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - id: shas
        uses: nrwl/nx-set-shas@v5
      - run: pnpm exec nx graph --file=.artifacts/nx/graph.json
      - uses: actions/upload-artifact@v7
        with:
          name: nx-graph
          path: .artifacts/nx/graph.json

  python:
    needs: graph
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_BASE: ${{ needs.graph.outputs.base }}
      NX_HEAD: ${{ needs.graph.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - run: pnpm exec nx affected -t lint format typecheck test --exclude='*,!tag:language:python'

  typescript:
    needs: graph
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_BASE: ${{ needs.graph.outputs.base }}
      NX_HEAD: ${{ needs.graph.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - run: pnpm exec nx affected -t lint format typecheck test --exclude='*,!tag:language:typescript'

  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/native-cache
        with:
          rid: ${{ matrix.rid }}
      - run: pnpm exec nx run-many -t stage
      - run: tar -czf "$RUNNER_TEMP/native-stage-${{ matrix.rid }}.tar.gz" native/*/stage
        working-directory: .artifacts
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/native-stage-${{ matrix.rid }}.tar.gz
          archive: false

  pack:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: native-stage-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-stage
      - run: mkdir -p .artifacts && for archive in "$RUNNER_TEMP"/native-stage/*.tar.gz; do tar -xzf "$archive" -C .artifacts; done
      - run: pnpm exec nx run-many -t pack --excludeTaskDependencies
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-local
          path: .artifacts/nuget

  dotnet:
    needs: [graph, pack]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      NX_BASE: ${{ needs.graph.outputs.base }}
      NX_HEAD: ${{ needs.graph.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: nuget-local
          path: .artifacts/nuget
      - run: pnpm exec nx affected -t build test --exclude='*,!tag:language:dotnet' -- -bl:"$GITHUB_WORKSPACE/.artifacts/dotnet/binlog/build-{}.binlog"
      - run: pnpm exec nx affected -t format --exclude='*,!tag:language:dotnet'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-binlogs
          path: .artifacts/dotnet/binlog

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: ./.github/actions/setup
      - run: pnpm exec nx run rasm-workspace:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            .artifacts/python/coverage
            .artifacts/typescript/coverage
