id: no-parent-segment-concatenation
valid:
    # The normalized repository root of eng/native/Directory.Build.props
    - |
      <PropertyGroup><RepositoryRoot>$([MSBuild]::NormalizeDirectory('$(MSBuildThisFileDirectory)', '..', '..'))</RepositoryRoot></PropertyGroup>
    # A relative project reference resolves against the project directory
    - |
      <ProjectReference Include="../../../../libs/dotnet/interop/Rasm.Interop.Hdf5/Rasm.Interop.Hdf5.csproj" />
    # The file-above lookup takes the parent form and returns a normalized path
    - |
      <PropertyGroup><_OuterDirectoryBuildProps>$([MSBuild]::GetPathOfFileAbove('Directory.Build.props', '$(MSBuildThisFileDirectory)../'))</_OuterDirectoryBuildProps></PropertyGroup>
invalid:
    # The staging root a packaging project once composed by hand
    - |
      <PropertyGroup><StageRoot>$(MSBuildThisFileDirectory)../../../.artifacts/native/lcms2/stage/</StageRoot></PropertyGroup>
    # The artifacts root before the normalized RepositoryRoot existed
    - |
      <PropertyGroup><ArtifactsPath>$(MSBuildThisFileDirectory)../../.artifacts/native/msbuild</ArtifactsPath></PropertyGroup>
    # A manifest path appended to the project directory
    - |
      <PropertyGroup><VcpkgManifest>$(MSBuildProjectDirectory)/../duckdbextensions/extensions.json</VcpkgManifest></PropertyGroup>
