# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-combinator-calls
language: tsx
severity: error
utils:
    module-call:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has: {field: object, matches: {syntax-import-reference: {source: {regex: '^effect(/\w+)?$'}, exported: {kind: identifier}}}}
    pipe-step:
        kind: call_expression
        has:
            field: function
            kind: member_expression
            has:
                field: property
                regex: |-
                    (?x)^(map|flatMap|andThen|tap|tapError|tapErrorTag|tapCause|tapBoth|filter|filterMap|filterOrFail|filterOrElse|forEach
                    |reduce|getOrElse|orElse|orElseSucceed|catch|catchCause|catchIf|catchFilter|catchTag|catchTags|catchReason|catchDefect
                    |mapError|mapBoth|match|matchEffect|zip|zipWith|zipLeft|zipRight|as|ensuring|provide|provideService|provideContext
                    |mapInput|partition|partitionMap|take|takeWhile|takeRight|drop|dropWhile|dropRight|append|appendAll|prepend|prependAll
                    |retry|repeat|timeout|delay|when|race|merge|scan|split|replace|bind|bindTo|some|every|contains|findFirst|findLast
                    |chunksOf|intersperse|union|intersection|difference|mapAccum|mapEffect|onError|onExit|withSpan|annotateLogs|sortBy
                    |groupBy|flatten|fromIterable|orDie|scoped|asVoid|flip|result|option|exit|cached|forever|forkChild|forkScoped
                    |forkDetach|interruptible|uninterruptible|ignore|compact|reverse|dedupe|sandbox)$
    step:
        all:
            - matches: module-call
            - matches: pipe-step
            - not: {has: {field: function, has: {field: object, matches: {syntax-import-reference: {source: {regex: "^effect(/Schema)?$"}, exported: {regex: "^Schema$"}}}}}}
    unary-step:
        matches: step
        has:
            field: function
            has:
                field: property
                regex: |-
                    (?x)^(flatten|fromIterable|orDie|scoped|asVoid|flip|result|option|exit|cached|forever|forkChild|forkScoped
                    |forkDetach|interruptible|uninterruptible|ignore|compact|reverse|dedupe|sandbox)$
    data-first-step:
        matches: step
        has:
            field: arguments
            has: {nthChild: 1, matches: module-call}
        any:
            - matches: unary-step
            - has: {field: arguments, has: {nthChild: 2}}
rule:
    pattern: $CALL
    all:
        - matches: data-first-step
        - has:
            field: arguments
            has:
                nthChild: 1
                matches: data-first-step
                has: {field: arguments, has: {nthChild: 1, matches: data-first-step}}
        - not:
            all:
                - nthChild: 1
                - inside: {kind: arguments, inside: {matches: data-first-step}}
        - not: {has: {kind: comment, stopBy: end}}
        - not: {has: {kind: type_arguments, stopBy: end}}
        - any:
            - pattern: $FIXABLE
              inside:
                kind: program
                stopBy: end
                has:
                    kind: import_statement
                    all:
                        - has: {field: source, has: {kind: string_fragment, regex: '^effect(/Function)?$'}}
                        - has: {stopBy: end, kind: import_specifier, has: {field: name, regex: '^pipe$'}, not: {has: {field: alias, kind: identifier}}}
            - pattern: $KEPT
rewriters:
    - id: unary
      rule:
        matches: unary-step
        pattern: $M.$OP($FIRST)
      transform:
        INNER: rewrite($FIRST, rewriters=[unary, steps, unary-head, head])
      fix: $INNER, $M.$OP
    - id: steps
      rule:
        matches: data-first-step
        pattern: '$M.$OP($FIRST, $$$REST)'
      transform:
        INNER: rewrite($FIRST, rewriters=[unary, steps, unary-head, head])
      fix: $INNER, $M.$OP($$$REST)
    - id: unary-head
      rule:
        matches: unary-step
        pattern: $M.$OP($FIRST)
      fix: $FIRST, $M.$OP
    - id: head
      rule:
        matches: step
        pattern: '$M.$OP($FIRST, $$$REST)'
      fix: $FIRST, $M.$OP($$$REST)
transform:
    STEPS: rewrite($FIXABLE, rewriters=[unary, steps, unary-head, head])
    PIPED: {replace: {source: $STEPS, replace: '(?s)^(.+)$', by: 'pipe($1)'}}
fix: $PIPED$KEPT
message: 'Data-first module calls nest four deep and read from the inside out'
note: '`pipe(value, step, step, step)` lists the steps in evaluation order'
labels:
    CALL: {style: primary}
