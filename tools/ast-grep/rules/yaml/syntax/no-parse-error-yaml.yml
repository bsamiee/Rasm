# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: yamllang
severity: error
rule:
    kind: ERROR
    all:
        - not: {inside: {kind: ERROR, stopBy: end}}
        - any:
            - has: {stopBy: end, all: [{not: {has: {pattern: $$_}}}, {not: {regex: '^$'}}, {pattern: $$TOKEN}]}
            - pattern: $$TOKEN
labels:
    TOKEN: {style: primary, message: Opens the span}
message: '`$TOKEN` opens a span the grammar failed to parse'
note: Write a form tree-sitter-yaml parses
