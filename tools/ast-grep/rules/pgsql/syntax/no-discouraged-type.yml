# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: pgsql
severity: error
utils:
    stored:
        inside:
            kind: SimpleTypename
            inside:
                kind: Typename
                inside: {kind: 'columnDef, alter_table_cmd, CreateDomainStmt, TableFuncElement'}
    name:
        any:
            - kind: type_function_name
              not: {precedes: {kind: attrs}}
            - kind: ColLabel
              inside: {kind: attrs, not: {has: {kind: attrs}}, follows: {kind: type_function_name, regex: '^(?i-u:pg_catalog)$|^"pg_catalog"$'}}
rule:
    all:
        - any:
            - matches: stored
              kind: GenericType
              any:
                - has: {stopBy: &modifiers {kind: expr_list}, matches: name, regex: '(?i-u)^"?(?:(?:small|big)?serial[248]?|money|timetz|timestamp|bpchar|char)"?$'}
                - all:
                    - has: {stopBy: *modifiers, matches: name, regex: '(?i-u)^"?varchar"?$'}
                    - has: {kind: expr_list}
                - all:
                    - has: {stopBy: *modifiers, matches: name, regex: '(?i-u)^"?timestamptz"?$'}
                    - has: {kind: expr_list, regex: '^0$'}
            - {matches: stored, kind: CharacterWithLength}
            - {matches: stored, kind: character, regex: '(?i-u)^(?:n(?:ational[\t\n\v\f\r ]+)?)?char(?:acter)?$'}
            - {matches: stored, kind: ConstDatetime, regex: '(?i-u)^timestamp', not: {regex: '(?i-u)(?-u:\b)with[\t\n\v\f\r ]'}}
            - {matches: stored, kind: ConstDatetime, regex: '(?i-u)^time(?-u:\b)[\t\n\v\f\r (0-9)]*with[\t\n\v\f\r ]'}
            - {matches: stored, kind: ConstDatetime, has: {pattern: '0'}}
            - {kind: func_expr_common_subexpr, regex: '(?i-u)^current_time(?-u:\b)'}
        - pattern: $TYPE
message: '`$TYPE` stores a value PostgreSQL documents as a trap'
note: 'Use `timestamptz` at a nonzero or default precision, `text` with a `check` constraint for a length, `numeric` for money, and `generated always as identity` for a key'
