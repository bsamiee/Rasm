id: rust-use
language: rustlang
role: item
symbolType: module
rule:
    kind: 'use_declaration, extern_crate_declaration'
    pattern: $DECLARATION
    any:
        - has: {field: argument, pattern: $NAME}
        - has: {field: name, pattern: $NAME}
transform:
    SIGNATURE: {replace: {source: $DECLARATION, replace: '\s*;$', by: ''}}
name: $NAME
signature: $SIGNATURE
isImport: true
isExported: {has: {kind: visibility_modifier}}

---
id: rust-mod
language: rustlang
role: item
symbolType: module
rule:
    kind: mod_item
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
rewriters:
    - id: body
      rule: {kind: declaration_list, inside: {pattern: $DECLARATION}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s*;?\s*$', by: ''}}
name: $NAME
signature: $SIGNATURE
isExported: {has: {kind: visibility_modifier}}

---
id: rust-function
