id: conditional-statement-to-if
valid:
    # The if statement the rewrite writes
    - |
      if memory.exists(scoped):
          memory.rm(scoped, recursive=True)
    # Multi-line statement in parentheses, its arm keeps a column the template cannot lower
    - |
      (
          pytest.fail("regression", pytrace=False)
          if regressions
          else None
      )
    # Conditional bound to a name
    - |
      value = load(path) if path else None
    # Semicolon before the expression cannot precede a compound statement
    - |
      before(); start(item) if ready else None
    # Semicolon after the expression belongs to the original suite
    - |
      start(item) if ready else None; after()
    # One-line suite cannot contain a compound statement
    - |
      if outer: start(item) if ready else None
    # Inline else suite must not inherit the earlier multiline branch
    - |
      if outer:
          before()
      else: start(item) if ready else None
