# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lint-suppression-rust
language: rust
severity: error
utils:
    suppression:
        kind: identifier
        regex: '^(allow|expect)$'
rule:
    kind: 'attribute_item, inner_attribute_item'
    has:
        kind: attribute
        any:
            - has: {nthChild: 1, matches: suppression}
            - all:
                - has: {nthChild: 1, kind: identifier, regex: '^cfg_attr$'}
                - has: {field: arguments, has: {matches: suppression, follows: {regex: '^,$'}}}
message: 'Attribute silences lints in place of fixing the code they report'
note: 'Fix the reported code, delete the item a dead-code or unused lint reports, and fix a lint that misreports in the lint. `[workspace.lints]` holds every level, an `allow` row only for a finding no code change clears'
