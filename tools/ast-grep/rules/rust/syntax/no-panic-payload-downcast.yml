# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-panic-payload-downcast
language: rust
severity: error
utils:
    literal-side:
        kind: call_expression
        any:
            - pattern: $I.payload().downcast_ref::<&str>().$COPY()
            - pattern: $I.payload().downcast_ref::<&'static str>().$COPY()
            - pattern: $I.payload().downcast_ref::<&str>().map($_)
            - pattern: $I.payload().downcast_ref::<&'static str>().map($_)
    owned-side:
        kind: call_expression
        pattern: $I.payload().downcast_ref::<String>().map($_)
    literal-fallback:
        any:
            - matches: literal-side
            - kind: closure_expression
              has: {field: body, matches: literal-side}
    owned-fallback:
        any:
            - matches: owned-side
            - kind: closure_expression
              has: {field: body, matches: owned-side}
rule:
    kind: call_expression
    all:
        - not: {has: {stopBy: end, kind: 'line_comment, block_comment'}}
        - has: {field: function, kind: field_expression, has: {field: field, regex: '^(or|or_else)$'}}
        - any:
            - all:
                - has: {field: function, has: {field: value, matches: literal-side}}
                - has: {field: arguments, has: {nthChild: 1, matches: owned-fallback}}
            - all:
                - has: {field: function, has: {field: value, matches: owned-side}}
                - has: {field: arguments, has: {nthChild: 1, matches: literal-fallback}}
constraints:
    COPY: {regex: '^(copied|cloned)$'}
fix: $I.payload_as_str()
message: '`$I` downcasts its panic payload to `&str` and `String` by hand'
note: 'Call `<panic hook info>.payload_as_str()` on a `PanicHookInfo`, `payload_as_str` returns the message for both payload types and `None` for any other'
