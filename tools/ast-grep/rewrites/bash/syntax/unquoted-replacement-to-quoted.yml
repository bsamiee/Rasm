# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: unquoted-replacement-to-quoted
language: bash
severity: off
ignores: ["**/*.json"]
rule:
    kind: simple_expansion, expansion, command_substitution
    pattern: $VALUE
    matches: bash-data-word
    any:
        - follows: {regex: "^/$"}
          inside: {kind: expansion}
        - inside:
            kind: concatenation
            follows: {regex: "^/$"}
            inside: {kind: expansion}
labels: {VALUE: {style: primary}}
fix: '"$VALUE"'
message: The replacement `$VALUE` expands unquoted and an ampersand in it inserts the matched text under patsub_replacement
note: Quote a replacement that inserts data, `${value//pattern/"$replacement"}`, and keep one that supplies replacement syntax unquoted
