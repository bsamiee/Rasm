# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-blocking-sleep
language: python
severity: error
rule:
    pattern: $USE
    matches: {python-module-member: {module: {regex: '^time$'}, name: {regex: '^sleep$'}}}
message: '`$USE` blocks the thread while waiting, the form of `await anyio.sleep(<delay>)` or an await on the condition that completes the work'
