# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: swift
severity: error
utils:
    subject-path:
        any:
            - pattern: $SUBJECT.path
            - pattern: $SUBJECT.path()
            - pattern: '$SUBJECT.path(percentEncoded: $_)'
            - pattern: $SUBJECT
    existence-member:
        kind: navigation_expression
        has: { field: suffix, has: { field: suffix, regex: '^(fileExists|isExecutableFile)$' } }
    existence:
        kind: call_expression
        all:
            - has:
                  nthChild: 1
                  any:
                      - matches: existence-member
                      - kind: prefix_expression
                        all: [{ has: { field: operation, regex: '^!$' } }, { has: { field: target, matches: existence-member } }]
            - has:
                  kind: call_suffix
                  has:
                      kind: value_arguments
                      has: { kind: value_argument, nthChild: { position: 1, ofRule: { kind: value_argument } }, has: { field: value, matches: subject-path } }
    exists-check:
        any:
            - matches: existence
              pattern: $CHECK
              not: { regex: '^!' }
            - kind: equality_expression
              pattern: $CHECK
              all:
                  - has: { kind: tuple_expression, has: { kind: try_expression, has: { pattern: $SUBJECT.checkResourceIsReachable() } } }
                  - has: { regex: '^true$' }
    file-operation:
        kind: call_expression
        all:
            - has:
                  nthChild: 1
                  any:
                      - kind: navigation_expression
                        has: { field: suffix, has: { field: suffix, regex: '^(removeItem|trashItem|moveItem|copyItem|contentsOfDirectory|attributesOfItem|destinationOfSymbolicLink|contents)$' } }
                      - regex: '^((Foundation(\.|::))?(Data|String|FileHandle)(\.init)?|\.init)$'
            - has:
                  kind: call_suffix
                  has:
                      kind: value_arguments
                      has:
                          kind: value_argument
                          nthChild: 1
                          all:
                              - has: { field: name, regex: '^(at|atPath|contentsOf|contentsOfFile|forReadingFrom|forReadingAtPath)$' }
                              - has: { field: value, matches: subject-path }
    executable-path:
        all:
            - has: { kind: 'navigation_expression, prefix_expression', regex: '^((Subprocess(\.|::))?Executable)?\.path$' }
            - has: { stopBy: end, kind: value_argument, has: { field: value, matches: subject-path } }
    operation:
        any:
            - matches: file-operation
            - kind: call_expression
              has:
                  kind: call_suffix
                  has:
                      kind: value_arguments
                      any:
                          - has: { kind: value_argument, all: [{ has: { field: name, regex: '^executable$' } }, { has: { field: value, matches: executable-path } }] }
                          - all:
                                - inside: { kind: call_suffix, inside: { kind: call_expression, has: { nthChild: 1, regex: '^((Subprocess(\.|::))?run|(Subprocess(\.|::))?Configuration(\.init)?)$' } } }
                                - has: { kind: value_argument, nthChild: { position: 1, ofRule: { kind: value_argument } }, has: { field: value, matches: executable-path } }
    performs:
        any:
            - matches: operation
            - has: { matches: operation, stopBy: end }
rule:
    any:
        - kind: ternary_expression
          all:
              - has: { field: condition, matches: exists-check }
              - has: { field: if_true, matches: performs }
        - kind: guard_statement
          all:
              - has: { matches: exists-check }
              - precedes: { matches: performs, stopBy: end }
        - kind: if_statement
          all:
              - has: { matches: exists-check }
              - has: { kind: statements, matches: performs }
        - kind: if_statement
          all:
              - has: { matches: existence, pattern: $CHECK, regex: '^!' }
              - not: { has: { regex: '^else$' } }
              - has:
                    kind: statements
                    all:
                        - has: { kind: control_transfer_statement }
                        - not: { has: { nthChild: { position: 2, ofRule: { not: { kind: 'comment, multiline_comment' } } } } }
              - precedes: { matches: performs, stopBy: end }
        - kind: for_statement
          all:
              - has: { kind: where_clause, has: { matches: exists-check } }
              - has: { kind: statements, matches: performs }
message: '`$CHECK` tests that a file exists or is executable before an operation that reports it missing'
note: 'Run the operation and match `CocoaError.fileReadNoSuchFile` for a read, `CocoaError.fileNoSuchFile` for a removal, move, or copy, or `Errno.noSuchFileOrDirectory`, `executableNotFound` for a spawn'
