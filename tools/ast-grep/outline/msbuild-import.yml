id: msbuild-import
language: xml
role: item
symbolType: module
utils:
    project-content:
        kind: content
        inside:
            kind: element
            inside: {kind: document}
            has: {kind: STag, has: {kind: Name, regex: '^Project$'}}
rule:
    kind: element
    has:
        all:
            - kind: STag, EmptyElemTag
            - pattern: _TAG
            - has: {kind: Name, regex: "^Import$"}
            - has:
                kind: Attribute
                all:
                    - has: {kind: Name, regex: "^Project$"}
                    - has: {kind: AttValue, pattern: _VALUE}
    inside:
        any:
            - matches: project-content
            - kind: content
              inside:
                kind: element
                has: {kind: STag, has: {kind: Name, regex: '^ImportGroup$'}}
                inside: {matches: project-content}
transform:
    NAME: substring($VALUE, startChar=1, endChar=-1)
name: $NAME
signature: $TAG
isImport: true
isExported: false
