# Load through customLanguages.<name>.outlineRules or a repeated --outline-rules flag
id: <item-extractor-id>
language: <language>
role: item
symbolType: <lsp-symbol-kind>
rule:
    kind: <item-kind>
    pattern: $DECLARATION
    has: {field: name, pattern: $NAME}
    any:
        - inside: {kind: <module-kind>}
        - inside: {kind: <export-kind>, inside: {kind: <module-kind>}}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[omit-body])
    SIGNATURE: replace($HEADER, replace='\s+$', by='')
rewriters:
    - id: omit-body
      rule: {kind: <body-kind>, inside: {pattern: $DECLARATION}}
      fix: '' # Keep bodies nested inside header expressions
name: $NAME
signature: $SIGNATURE
isExported: {inside: {kind: <export-kind>}} # Use the language's written export form
