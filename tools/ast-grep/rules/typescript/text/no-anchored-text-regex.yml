# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: tsxlang
severity: error
utils:
    affix:
        kind: regex
        all:
            - has:
                field: pattern
                regex: '^(?:\^(?:[^\^$\\.*+?()\[\]{}|/]|\\[\^$\\.*+?()\[\]{}|/nrtvf]|\\x[0-9A-Fa-f]{2}|\\u(?:[0-9A-CEFa-cef][0-9A-Fa-f]{3}|[Dd][0-7][0-9A-Fa-f]{2}))+|(?:[^\^$\\.*+?()\[\]{}|/]|\\[\^$\\.*+?()\[\]{}|/nrtvf]|\\x[0-9A-Fa-f]{2}|\\u(?:[0-9A-CEFa-cef][0-9A-Fa-f]{3}|[Dd][0-7][0-9A-Fa-f]{2}))+\$)$'
            - not: {has: {field: flags, regex: '[gimy]'}}
    prefix:
        kind: regex
        has: {field: pattern, regex: '^\^'}
    source:
        any:
            - matches: affix
            - kind: identifier
              pattern: $PATTERN
              matches: {typescript-constant-value: {value: {matches: affix}}}
              not: {inside: {kind: program, stopBy: end, has: {stopBy: end, kind: identifier, pattern: $PATTERN, inside: {kind: arguments, not: {inside: {kind: call_expression, has: {field: function, has: {field: property, regex: '^(match|search)$'}}}}}}}}
    access:
        pattern: $$_ACCESS
        regex: '^\??\.$'
    condition:
        any:
            - inside: {field: condition, kind: 'if_statement, while_statement, do_statement, for_statement, ternary_expression'}
            - inside: {kind: unary_expression, has: {field: operator, regex: '^!$'}}
            - inside: {kind: binary_expression, has: {field: operator, regex: '^(&&|\|\|)$'}, matches: condition}
            - inside: {kind: parenthesized_expression, matches: condition}
            - inside: {kind: arguments, inside: {kind: call_expression, has: {field: function, regex: '(^|\.)Boolean$', matches: typescript-global-member}}}
    regex-call:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(test|exec)$'}}
            - has:
                field: arguments
                not: {has: {nthChild: {position: 2, ofRule: &code {not: {kind: 'comment, html_comment'}}}}}
                any:
                    - has: {nthChild: {position: 1, ofRule: *code}, pattern: $RECEIVER, kind: &member 'identifier, this, member_expression, subscript_expression, call_expression, parenthesized_expression, non_null_expression, string, template_string'}
                    - pattern: $RECEIVER
                      all: [{has: {nthChild: {position: 1, ofRule: *code}, not: {kind: *member}}}, {not: {has: {kind: spread_element}}}, {not: {has: {regex: '^,$'}}}]
            - has: {field: function, all: [{has: {matches: access}}, {has: {field: object, matches: source}}]}
    text-call:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, has: {field: property, regex: '^(match|search)$'}}
            - has: {field: arguments, not: {has: {nthChild: {position: 2, ofRule: *code}}}}
            - has: {field: function, all: [{has: {field: object, pattern: $RECEIVER}}, {has: {matches: access}}]}
            - has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, matches: source}}
rule:
    all:
        - any:
            - kind: call_expression
              all:
                - matches: regex-call
                - any: [{has: {field: function, has: {field: property, regex: '^test$'}}}, {matches: condition}]
            - kind: call_expression
              all:
                - has: {field: function, has: {field: property, regex: '^match$'}}
                - matches: text-call
                - matches: condition
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^[!=]==?$'}
                - has: {field: right, kind: 'null'}
                - has:
                    field: left
                    any:
                        - all: [{has: {field: function, has: {field: property, regex: '^exec$'}}}, {matches: regex-call}]
                        - all: [{has: {field: function, has: {field: property, regex: '^match$'}}}, {matches: text-call}]
            - kind: binary_expression
              all:
                - has: {field: left, kind: call_expression, has: {field: function, has: {field: property, regex: '^search$'}}}
                - has: {field: left, matches: text-call}
                - any:
                    - all: [{has: {field: operator, regex: '^(!==?|===?|>)$'}}, {has: {field: right, regex: '^-[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*1$'}}]
                    - all: [{has: {field: operator, regex: '^(>=|<)$'}}, {has: {field: right, regex: '^0$'}}]
                    - all:
                        - has: {field: operator, regex: '^(!==?|===?)$'}
                        - has: {field: right, regex: '^0$'}
                        - has: {field: left, has: {field: arguments, has: {nthChild: {position: 1, ofRule: *code}, any: [{matches: prefix}, {matches: {typescript-constant-value: {value: {matches: prefix}}}}]}}}
        - not: {inside: {kind: program, stopBy: end, matches: extendscript-file}}
        - pattern: $NODE
message: '`$NODE` tests a fixed prefix or suffix through a regular expression'
note: 'Call `<text>.startsWith(<string>)` or `<text>.endsWith(<string>)`'
