# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-stale-guard-in-await-loop
language: swift
severity: error
utils:
    loop-state:
        kind: simple_identifier
        all:
            - pattern: $STATE
            - not: {follows: {regex: '^\.$'}}
            - inside:
                kind: 'for_statement, while_statement'
                stopBy: end
                has:
                    kind: statements
                    has:
                        kind: assignment
                        stopBy: end
                        has: {field: target, has: {kind: simple_identifier, pattern: $STATE, stopBy: end}}
    await-loop:
        any:
            - kind: for_statement
              regex: '^for\s+(try\s+)?await\b'
              has: {field: item, has: {field: bound_identifier, pattern: $L}}
            - kind: while_statement
              all:
                - has: {field: bound_identifier, pattern: $L}
                - has: {kind: await_expression, has: {field: expr, pattern: $_.next()}}
rule:
    kind: 'for_statement, while_statement'
    all:
        - matches: await-loop
        - any:
            - has:
                kind: where_clause
                pattern: $GUARD
                all:
                    - has: {matches: loop-state, stopBy: end}
                    - not: {has: {pattern: $L, stopBy: end}}
            - has:
                kind: statements
                has:
                    kind: 'guard_statement, if_statement'
                    nthChild: 1
                    pattern: $GUARD
                    all:
                        - has: {kind: statements, has: {kind: control_transfer_statement, regex: '^(break|return)\b'}}
                        - has: {matches: loop-state, stopBy: end, inside: {kind: 'guard_statement, if_statement', stopBy: {kind: statements}}}
                        - not: {has: {pattern: $L, stopBy: end}}
        - not:
            has:
                kind: statements
                has:
                    kind: if_statement
                    not: {nthChild: 1}
                    has: {kind: statements, has: {kind: control_transfer_statement, regex: '^break$'}}
message: '`$GUARD` reads `$STATE` from the previous iteration and awaits one more `$L` before exiting'
note: 'End the loop body with `if <finished> { break }` after setting `<state>`, or finish its input sequence'
