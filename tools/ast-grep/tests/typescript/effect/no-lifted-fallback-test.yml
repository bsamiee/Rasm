id: no-lifted-fallback
valid:
    - |-
      import { Effect } from "effect";
      Effect.catchAll(work, (error) => Effect.succeed(error.message))
    - import { Micro } from "effect"; Micro.catchAll(work, () => Micro.fail(error))
    - import { Layer } from "effect"; Layer.catchAll(layer, () => Layer.fail(error))
    - import { Channel } from "effect"; Channel.catchAll(channel, () => Channel.succeed(1))
    - |-
      import { Effect } from "effect";
      Effect.orElse(work, (_first, _second) => Effect.succeed(_second))
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, /* keep handler explanation */ () => Effect.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (_error) => Effect.succeed(/* keep reason */ 1));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.fail(error /* keep cause */));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, function handler() { return Effect.succeed({ handler }); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, function (): Effect.Effect<boolean> { return Effect.succeed(false); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, function handler(_error) { return Effect.succeed(handler.length); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, function handler() { return Effect.succeed(handler); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Other.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Other.fail(error));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (): Effect.Effect<boolean> => Effect.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (_error) => Effect.succeed(_error));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, _error => Effect.succeed({ _error }));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (_error = fallback()) => Effect.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, function () { return Effect.succeed(arguments[0]); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElseSucceed(work, () => false);
    - |-
      import { Effect } from "effect";
      const held = Effect.catchTag(work, 'LoadError', () => Effect.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (error) => Effect.succeed(error.message));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => reload(path));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.void);
    - |-
      import { Effect } from "effect";
      const held = Effect.catchAllCause(work, () => Effect.succeed(false));
    - |-
      import { Layer } from "effect";
      const held = Layer.catchAll(layer, () => Layer.succeed(Service, fallback));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => { report(); return Effect.succeed(false); });
    - |-
      const held = Item.orElse(item, () => Item.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (error) => Effect.fail(new OtherError({ cause: error })));
    - |-
      import { Option } from "effect";
      const held = Option.orElse(found, () => Option.some(1));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.succeed({ value: /* keep reason */ 1 }));
    - |-
      import { Effect } from "effect";
      Effect.orElse<string>(work, () => Effect.succeed(false))
    - |-
      import { Effect } from "effect";
      Effect./* preserve callee comment */orElse(work, () => Effect.succeed(false))
    - |-
      import { Effect } from "effect";
      Effect.orElse(work, () => Effect.succeed(...values))
    - |-
      import { Effect } from "effect";
      Effect.orElse(work, () => Effect.fail(...errors))
    - import { Effect } from "other"; Effect.orElse(work, () => Effect.succeed(false))
    - import { Option as Effect } from "effect"; Effect.orElse(work, () => Effect.succeed(false))
    - import { Effect } from "effect"; Effect.orElse(work, async () => Effect.succeed(false))
    - 'import { Effect } from "effect"; Effect.orElse(work, ({ message }) => Effect.succeed(false))'
    - import { Micro } from "effect"; Micro.orElse(work, () => Micro.succeed(false))
invalid:
    - 'import { Effect } from "effect"; Effect.orElse(work, (_error: Error) => Effect.succeed(false))'
    - import { Effect } from "effect"; Effect.orElse(work, () => Effect.succeed(`${prefix}-fallback`))
    - |-
      import { Effect } from "effect";
      Effect.orElse(work, (error) => Effect.succeed(fallback))
    - |-
      import { Effect } from "effect";
      Effect.orElse(work, error => Effect.succeed(fallback))
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.fail({ recover: () => Effect.succeed(false) }));
    - |-
      import { Effect } from "effect";
      const held = work.pipe(Effect.orElse(() => Effect.fail({ recover: () => Effect.succeed(false) })));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = work.pipe(Effect.orElse(() => Effect.succeed(false)));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => { return Effect.succeed(false); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, function () { return Effect.succeed(false); });
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, (_) => Effect.succeed(false));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, _error => Effect.succeed(false));
    - |-
      import { STM } from "effect";
      const held = STM.orElse(transaction, () => STM.succeed(false));
    - |-
      import { Stream } from "effect";
      const held = stream.pipe(Stream.orElse(() => Stream.succeed(false)));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.succeed({ rows: [] }));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => Effect.fail(new OtherError({ path })));
    - |-
      import { STM } from "effect";
      const held = transaction.pipe(STM.orElse(() => STM.fail(error)));
    - |-
      import { Effect } from "effect";
      const held = Effect.orElse(work, () => { return Effect.fail(error); });
    - |-
      import { Effect } from "effect";
      const held = work.pipe(Effect.orElse(() => { return Effect.succeed(false); }));
    - import * as E from "effect/Effect"; E.orElse(work, () => E.succeed(false))
    - |-
      import { Effect } from "effect";
      Effect.catchAll(work, () => Effect.succeed(false))
    - |-
      import { Effect } from "effect";
      Effect.catchAll(work, () => Effect.fail(error))
    - import { Effect } from "effect"; work.pipe(Effect.catchAll((_error) => Effect.succeed(fallback)))
    - import { Micro } from "effect"; Micro.catchAll(work, () => Micro.succeed(false))
    - import { Stream } from "effect"; Stream.catchAll(stream, () => Stream.fail(error))
    - |-
      import { Effect } from "effect";
      Effect.orElse(work, () => Effect.succeed<boolean | number>(false))
    - import { Effect } from "effect"; Effect.orElse(work, () => Effect.fail<LoadError>(error))
    - 'import { Effect } from "effect"; Effect.orElse(work, () => Effect.succeed<Row>({ rows: [] }))'
    - import { Effect } from "effect"; work.pipe(Effect.catchAll(() => Effect.fail<LoadError>(error)))
