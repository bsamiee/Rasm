id: no-promise-outside-boundary
valid:
    - 'import Base from "@nx/js/src/release/version-actions"; let Resolved: typeof Base = normalize(Base); class Actions extends Resolved { override async updateProjectVersion(): Promise<string[]> { return await load(); } }'
    - 'import { Effect } from "effect"; const loaded = Effect.tryPromise({ try: () => load(path), catch: (cause) => new LoadError({ cause }) });'
    - import { Effect } from "effect"; const loaded = Effect.promise(async () => { const raw = await load(path); return decode(raw); });
    - import { Effect } from "effect"; const loaded = Effect.promise(() => load(path).then(decode));
    - 'import { Effect } from "effect"; const loaded = Effect.tryMapPromise(work, { try: async (item) => await load(item), catch: (cause) => new LoadError({ cause }) });'
    - 'import { Micro } from "effect"; const loaded = Micro.tryPromise({ try: async () => await load(path), catch: (cause) => new LoadError({ cause }) });'
    - import { Stream } from "effect"; const rows = Stream.fromAsyncIterable((async function* () { for await (const row of source) { yield row; } })(), (cause) => new LoadError({ cause }));
    - for (const row of rows) { use(row); }
    - const rows = Array.map(items, decode).filter(present);
