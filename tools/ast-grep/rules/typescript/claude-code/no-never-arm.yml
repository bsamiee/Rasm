# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
# Optional and defaulted never parameters remain callable without an argument, and the fix leaves the absurd import to the checker.
id: no-never-arm
language: tsx
severity: error
files:
    - '**/.claude/plugins/function-hooks/hooks/**'
utils:
    never-parameter:
        has:
            field: parameters
            has:
                kind: required_parameter
                has: {field: type, has: {kind: predefined_type, regex: ^never$}}
                not: {has: {field: value, pattern: $_}}
rule:
    any:
        - kind: pair
          all:
            - {has: {field: key, pattern: $KEY}}
            - has:
                field: value
                any: [{kind: arrow_function}, {kind: function_expression}, {kind: generator_function}]
                matches: never-parameter
        - kind: method_definition
          inside: {kind: object}
          all:
            - {has: {field: name, pattern: $KEY}}
            - {matches: never-parameter}
    pattern: $MATCH
fix: '$KEY: absurd'
message: The arm over `never` is written inline, and `absurd` is the one arm a type rules out
note: 'Name `absurd` from composition/decision.ts as the arm, `{ deny: absurd, answer: absurd }`'
labels: {MATCH: {style: primary}}
