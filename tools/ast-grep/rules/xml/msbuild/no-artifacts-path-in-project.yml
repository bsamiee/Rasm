# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-artifacts-path-in-project
language: xml
severity: error
files: ['**/*.csproj']
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^(ArtifactsPath|UseArtifactsOutput|ArtifactsProjectName|BaseIntermediateOutputPath|MSBuildProjectExtensionsPath)$', pattern: _PROPERTY}}}
        - inside: {kind: content, inside: {matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}}}
message: '`$PROPERTY` in a project file sets a value the SDK read before the project body'
note: Set the property in `Directory.Build.props`
