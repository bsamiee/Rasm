# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: typescript-local-binding
language: tsxlang
arguments: [owner]
utils:
    binding:
        any:
            - kind: identifier, undefined, shorthand_property_identifier_pattern
              pattern: $NAME
            - kind: object_pattern, array_pattern, rest_pattern
              has: {matches: binding}
            - kind: assignment_pattern, object_assignment_pattern
              has: {field: left, matches: binding}
            - kind: pair_pattern
              has: {field: value, matches: binding}
    declaration:
        any:
            - kind: lexical_declaration, using_declaration
              has: {kind: variable_declarator, has: {field: name, matches: binding}}
            - kind: function_declaration, generator_function_declaration, class_declaration, abstract_class_declaration, enum_declaration, internal_module
              has: {field: name, pattern: $NAME}
            - kind: expression_statement
              has: {kind: internal_module, has: {field: name, pattern: $NAME}}
            - kind: import_alias
              has: {kind: 'identifier, undefined', nthChild: {position: 1, ofRule: {kind: 'identifier, undefined'}}, pattern: $NAME}
            - kind: import_statement
              has: {kind: import_require_clause, has: {pattern: $NAME, matches: typescript-import-binding}}
            - kind: export_statement
              has: {matches: declaration}
    value-import:
        kind: import_statement
        all:
            - not: {has: {regex: '^type$', not: {pattern: $_}}}
            - has:
                stopBy: end
                pattern: $NAME
                matches: typescript-import-binding
                not: {inside: {any: [{kind: import_require_clause}, {kind: import_specifier, has: {regex: '^type$', not: {pattern: $_}}}]}}
rule:
    kind: identifier, undefined, shorthand_property_identifier
    pattern: $NAME
    inside:
        stopBy: end
        pattern: $SCOPE
        any:
            - kind: function_declaration, generator_function_declaration, function_expression, generator_function, class
              has: {field: name, pattern: $NAME}
            - matches: typescript-function-boundary
              any:
                - has: {field: parameter, kind: 'identifier, undefined', pattern: $NAME}
                - has: {field: parameters, has: {has: {field: pattern, matches: binding}}}
            - kind: for_in_statement
              all:
                - has: {field: kind, pattern: $$_, not: {regex: '^var$'}}
                - has: {field: left, matches: binding}
            - kind: for_statement
              has:
                field: initializer
                kind: lexical_declaration, using_declaration
                has:
                    kind: variable_declarator
                    has: {field: name, matches: binding}
            - kind: catch_clause
              has: {field: parameter, matches: binding}
            - kind: statement_block
              has: {matches: declaration}
            - kind: program
              not: {has: {matches: value-import}}
              has: {matches: declaration}
            - kind: switch_body
              has: {kind: 'switch_case, switch_default', has: {matches: declaration}}
            - all:
                - any: [{kind: 'program, class_static_block, internal_module'}, {matches: typescript-function-boundary}]
                - regex: '(?-u:\b)var(?-u:\b)'
                - has:
                    stopBy: {kind: 'function_declaration, generator_function_declaration, method_definition, arrow_function, function_expression, generator_function, class, class_declaration, abstract_class_declaration, class_static_block, internal_module'}
                    any:
                        - kind: variable_declaration
                          has: {kind: variable_declarator, has: {field: name, matches: binding}}
                        - kind: for_in_statement
                          all: [{has: {field: kind, regex: '^var$'}}, {has: {field: left, matches: binding}}]
constraints:
    SCOPE: {matches: owner}
