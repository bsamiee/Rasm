          has: {kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}}
        - kind: variable_declarator
          has: {field: name, pattern: {context: 'class $NAME {}', selector: identifier}}
          inside: {kind: 'field_declaration, constant_declaration', matches: constant}
name: $NAME
signature: $SIGNATURE
isExported: {any: [{matches: public}, {inside: {kind: 'field_declaration, constant_declaration', matches: public}}]}
