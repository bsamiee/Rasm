# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-concurrent-module
language: python
severity: error
rule:
    pattern: $USE
    any:
        - matches: {python-module-use: {module: {regex: '^concurrent\.(futures|interpreters)(\.[\w.]+)?$'}}}
        - kind: dotted_name
          matches: {python-module-member: {module: {regex: '^concurrent$'}, name: {regex: "^(futures|interpreters)$"}}}
message: '`$USE` runs work outside structured concurrency'
note: 'Use `anyio.to_<worker>.run_sync` with `thread`, `process`, or `interpreter` as the worker'
