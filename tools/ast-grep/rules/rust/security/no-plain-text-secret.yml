# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
utils:
    secret-name:
        regex: '(?i)^(\p{XID_Continue}+_)?(password|passphrase|passcode|secret|secret_key|api_?key|credentials?|bearer|authorization|private_key|(access|refresh|auth|bearer|session|id|api|oauth|jwt)_token)(_(bytes|text|str|string|value|raw|plain))?$'
    owned-text-type:
        regex: '^(Option<\p{Pattern_White_Space}*)?((::)?(std::)?(string::)?String|((::)?(std::)?(boxed::|sync::|rc::)?)?(Box|Arc|Rc)<\p{Pattern_White_Space}*str\p{Pattern_White_Space}*>|((::)?(std::)?borrow::)?Cow<\p{Pattern_White_Space}*''\p{XID_Continue}+\p{Pattern_White_Space}*,\p{Pattern_White_Space}*str\p{Pattern_White_Space}*>)(\p{Pattern_White_Space}*>)?$'
    text-type:
        any:
            - matches: owned-text-type
            - regex: '^(Option<\p{Pattern_White_Space}*)?(&\p{Pattern_White_Space}*(''\p{XID_Continue}+\p{Pattern_White_Space}+)?(mut\p{Pattern_White_Space}+)?(str|String|\[\p{Pattern_White_Space}*u8\p{Pattern_White_Space}*\])|((::)?(std::)?(vec::)?)?Vec<\p{Pattern_White_Space}*u8\p{Pattern_White_Space}*>|\[\p{Pattern_White_Space}*u8\p{Pattern_White_Space}*;[^\]]+\]|(Box|Arc|Rc)<\p{Pattern_White_Space}*\[\p{Pattern_White_Space}*u8\p{Pattern_White_Space}*\]\p{Pattern_White_Space}*>|((::)?bytes::)?Bytes)(\p{Pattern_White_Space}*>)?$'
    token-name:
        regex: '^token$'
rule:
    kind: 'field_declaration, parameter, let_declaration, const_item, static_item'
    all:
        - any:
            - all:
                - any: [{has: {field: name, matches: secret-name}}, {has: {field: pattern, kind: identifier, matches: secret-name}}]
                - has: {field: type, matches: text-type}
            - all:
                - any: [{has: {field: name, matches: token-name}}, {has: {field: pattern, kind: identifier, matches: token-name}}]
                - has: {field: type, matches: owned-text-type}
        - not: {inside: {kind: parameters, inside: {matches: rust-trait-impl-or-extern-function}}}
        - pattern: $DECLARATION
message: '`$DECLARATION` holds a secret as plain text'
note: 'Type the value `secrecy::SecretString` or `SecretSlice<u8>` and read it through `expose_secret()` at each use'
