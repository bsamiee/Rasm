id: no-backslash-path
valid:
    # Regex escapes in an attribute path function are not path separators
    - |
      <Import Project="$([System.Text.RegularExpressions.Regex]::Replace('x1', 'x\d', 'file.props'))" />
    # Display text and shell arguments can quote a path without declaring one
    - '<Message Text="$(MSBuildThisFileDirectory)/../path" />'
    - '<Exec Command="echo $(MSBuildThisFileDirectory)/../path" />'
    - '<PropertyGroup Label="$(MSBuildThisFileDirectory)/../path"><Description>$(MSBuildThisFileDirectory)/../path</Description></PropertyGroup>'
    # Forward slashes throughout
    - |
      <PropertyGroup><StageRoot>$([MSBuild]::NormalizeDirectory('$(RepositoryRoot)', '.artifacts', 'native'))</StageRoot></PropertyGroup>
    # Regex escape after an entity reference inside a property function, the reference splits the text into nodes
    - |
      <PropertyGroup>
        <_PackagePath>$([System.Text.RegularExpressions.Regex]::Match('$(Manifest)', '(?&lt;=Version=")\s*[^"]+').Value)</_PackagePath>
      </PropertyGroup>
    # Regex escape between two path characters inside a property function, no separator
    - |
      <PropertyGroup><MajorPath>$([System.Text.RegularExpressions.Regex]::Replace('$(Version)', '(\d+)\.(\d+).*', '$1'))</MajorPath></PropertyGroup>
    # Exec command with forward slashes
    - |
      <Exec Command="cat data/file.txt" />
    # Message text holding no path
    - |
      <Message Text="built $(TargetPath)" />
    # Regex escape in a condition attribute, no path
    - |
      <PropertyGroup Condition="$([System.Text.RegularExpressions.Regex]::IsMatch('$(Version)', 'v\d+'))">
        <IsPrerelease>true</IsPrerelease>
      </PropertyGroup>
    # Shell quoting and escapes belong to the command interpreter
    - |
      <Exec Command="printf 'a\nb'" />
    # Arbitrary property content is not a path
    - |
      <Project><PropertyGroup><Greeting>line\nbreak</Greeting></PropertyGroup></Project>
invalid:
    # Import path with backslashes
    - |
      <Import Project="$(MSBuildThisFileDirectory)..\..\build\common.props" />
    # Property composing a path with backslashes
    - |
      <PropertyGroup><ToolPath>$(MSBuildThisFileDirectory)tools\mytool\mytool.exe</ToolPath></PropertyGroup>
    # Item glob with backslashes
    - |
      <Compile Include="Generated\**\*.cs" />
    # The child-element form of a hint path
    - |
      <Reference Include="Tool"><HintPath>..\packages\tool\lib\tool.dll</HintPath><Private>false</Private></Reference>
    # Solution project path written by a Windows tool
    - |
      <Project Path="libs\dotnet\interop\Rasm.Interop\Rasm.Interop.csproj" />
    # One-character segments, the second stage converts the separator the first stage skipped
    - |
      <Compile Include="a\b\c.cs" />
