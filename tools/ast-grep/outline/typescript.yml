    LINE: {replace: {source: $TYPED, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    TYPED: {rewrite: {source: $TYPE, rewriters: [comment]}}
    PREFIX: {replace: {source: $KIND, replace: $, by: ' '}}
    SHAPE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    ASSIGNED: {replace: {source: $ASSIGN, replace: '^', by: ' '}}
    VALUED: {rewrite: {source: $VALUE, rewriters: [arguments, object, array, template]}}
    VALUELINE: {replace: {source: $VALUED, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ''}}
    INIT: {replace: {source: $VALUELINE, replace: '.+', by: ' $0'}}
    OMITTED: {replace: {source: $ELIDED, replace: '(?s).+', by: ' = …'}}
name: $QUALIFIER$NAME
signature: $PREFIX$NAME$SHAPE$ASSIGNED$INIT$OMITTED
isExported: {matches: exported}
---
id: typescript-assignment
language: tsxlang
role: item
symbolType: property
utils:
    module: {pattern: module}
    exports: {regex: '^exports$'}
    built: {any: [{kind: call_expression, not: {has: {field: function, kind: parenthesized_expression}}}, {kind: 'new_expression, member_expression, object, array, arrow_function, function_expression, generator_function, class'}, {kind: identifier, not: {regex: '^undefined$'}}, {kind: 'as_expression, satisfies_expression, non_null_expression, parenthesized_expression, await_expression, type_assertion', has: {matches: built}}]}
rule:
    any:
        - kind: assignment_expression, augmented_assignment_expression
          has: {field: left, pattern: $NAME}
          inside: {kind: expression_statement, stopBy: {not: {kind: parenthesized_expression}}, inside: {kind: 'program, ERROR'}}
          any:
            - all: [{has: {field: right, matches: built, pattern: $VALUE}}, {any: [{has: {field: operator, pattern: $$ASSIGN}}, {has: {regex: '^=$', pattern: $$ASSIGN}}]}]
            - kind: assignment_expression, augmented_assignment_expression
        - kind: ':is(program, ERROR) > ambient_declaration'
          pattern: $DECLARATION
          all:
            - has: {regex: '^module$', pattern: $$MODULE}
            - has: {kind: property_identifier, pattern: $PROPERTY}
rewriters:
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: object, rule: {kind: object, has: {pattern: $_}}, fix: '{…}'}
    - {id: shape, rule: {kind: object_type, regex: "\n"}, fix: '{…}'}
    - id: initializer
      rule: {kind: 'required_parameter, optional_parameter', all: [{has: {field: value, regex: ''}}, {has: {field: pattern, pattern: $BOUND}}, {any: [{has: {kind: accessibility_modifier, pattern: $PACCESS}}, {regex: ''}]}, {any: [{has: {kind: override_modifier, pattern: $POVERRIDE}}, {regex: ''}]}, {any: [{has: {regex: '^readonly$', pattern: $$PREADONLY}}, {regex: ''}]}, {any: [{has: {field: type, pattern: $PTYPE}}, {regex: ''}]}]}
      transform:
        PACCESSED: {replace: {source: $PACCESS, replace: $, by: ' '}}
        POVERRIDDEN: {replace: {source: $POVERRIDE, replace: $, by: ' '}}
        PREAD: {replace: {source: $PREADONLY, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $BOUND, rewriters: [nested, comment]}}
      fix: $PACCESSED$POVERRIDDEN$PREAD$SHAPED$PTYPE = …
    - {id: nested, rule: {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, pattern: $LEFT}}, transform: {LEFTED: {rewrite: {source: $LEFT, rewriters: [nested]}}}, fix: '$LEFTED = …'}
    - {id: arguments, rule: {kind: arguments, has: {pattern: $_}}, fix: (…)}
    - {id: array, rule: {kind: array, has: {pattern: $_}}, fix: '[…]'}
    - {id: template, rule: {kind: template_string}, fix: '`…`'}
    - id: arrow
      rule:
        kind: arrow_function
        all:
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {kind: arrow_function}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {kind: arrow_function}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {kind: arrow_function}]
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIER$GENERICS$SHAPED$RESULT => …
    - {id: body, rule: {kind: 'statement_block, class_body', inside: {kind: 'function_expression, generator_function, class', field: body}}, fix: '{…}'}
transform:
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    ASSIGNED: {replace: {source: $ASSIGN, replace: '^', by: ' '}}
    VALUELINE: {replace: {source: $VALUED, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ''}}
    INIT: {replace: {source: $VALUELINE, replace: '.+', by: ' $0'}}
    OWNER: {replace: {source: $MODULE, replace: $, by: .}}
    LABEL: {replace: {source: $NAME, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [shape, comment]}}
    VALUED: {rewrite: {source: $VALUE, rewriters: [arrow, body, arguments, object, array, template]}}
name: $LABEL$OWNER$PROPERTY
signature: $LABEL$SIGNATURE$ASSIGNED$INIT
isExported:
    any:
        - kind: ambient_declaration
        - has:
            field: left
            any:
                - all: [{has: {field: object, matches: module}}, {has: {field: property, matches: exports}}]
                - has: {field: object, kind: identifier, matches: exports}
                - has: {field: object, kind: member_expression, all: [{has: {field: object, matches: module}}, {has: {field: property, matches: exports}}]}
---
id: typescript-entry
language: tsxlang
role: item
symbolType: event
utils:
    run: {regex: '^run(?:Main|Fork(?:With)?|Callback(?:With)?|Promise(?:Exit)?(?:With)?|Sync(?:Exit)?(?:With)?)$'}
    runner:
        any:
            - {kind: identifier, matches: run, pattern: $CALLEE}
            - {kind: member_expression, not: {regex: "\n"}, pattern: $CALLEE, has: {field: property, matches: run}}
            - {kind: member_expression, has: {field: property, matches: run, pattern: $CALLEE}}
rule:
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
    kind: ':is(program, ERROR) > expression_statement'
    has:
        stopBy: {not: {kind: 'await_expression, unary_expression, parenthesized_expression, call_expression, member_expression, arguments'}}
        matches: runner
name: $CALLEE
signature: $CALLEE(…)
isExported: false
---
id: typescript-suite
language: tsxlang
role: item
symbolType: function
utils:
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    suite: {any: [{kind: identifier, regex: '^(?:describe|describeWrapped|suite|test|it|layer)$'}, {kind: 'member_expression', has: {field: object, matches: suite}}, {kind: call_expression, has: {field: function, matches: suite}}]}
rule:
    kind: ':is(program, ERROR) > expression_statement > call_expression'
    all:
        - has: {field: function, matches: suite, pattern: $ANCHOR}
        - has: {field: arguments, has: {matches: first, pattern: $FIRST}}
rewriters:
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: arguments, rule: {kind: arguments, inside: {kind: call_expression, field: arguments}, has: {pattern: $_}}, fix: (…)}
    - id: suited
      rule: {kind: 'identifier, member_expression, call_expression', pattern: $SELF, inside: {kind: call_expression, field: function, has: {field: arguments, has: {matches: first, pattern: $TITLED}}}}
      transform: {CALLED: {rewrite: {source: $SELF, rewriters: [arguments, comment]}}}
      fix: $CALLED($TITLED)
transform:
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    LABEL: {replace: {source: $TITLE, replace: '^[''"`](.*)[''"`]$', by: $1}}
    TITLE: {replace: {source: $FIRST, replace: '\n(?s:.*)', by: …}}
    HEADER: {rewrite: {source: $ANCHOR, rewriters: [suited]}}
name: $LABEL
signature: $SIGNATURE
isExported: false
---
id: typescript-section
language: tsxlang
role: item
symbolType: namespace
rule: {kind: comment, regex: '^// --- \[[0-9A-Z_]+\](?: -+)?$', pattern: $DIVIDER, not: {inside: {kind: ERROR}}}
transform:
    LABEL: {replace: {source: $DIVIDER, replace: '^// --- \[([0-9A-Z_]+)\].*', by: '${1}'}}
    SIGNATURE: {replace: {source: $DIVIDER, replace: ' -+$', by: ' ---'}}
name: $LABEL
signature: $SIGNATURE
isExported: false
---
id: typescript-error
language: tsxlang
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, any: [{not: {has: {kind: 'identifier, comment'}}}, {not: {has: {stopBy: end, kind: 'import_statement, import_alias, export_statement, expression_statement, internal_module, module, ambient_declaration, class_declaration, abstract_class_declaration, lexical_declaration, variable_declaration, using_declaration, variable_declarator, function_declaration, generator_function_declaration, function_signature, interface_declaration, type_alias_declaration, enum_declaration'}}}]}
        - {kind: 'identifier, comment', all: [{inside: {kind: ERROR}}, {not: {follows: {kind: 'identifier, comment', stopBy: end}}}, {nthChild: {position: 1, ofRule: {kind: 'identifier, comment'}}}]}
        - {regex: '^$', any: [{kind: 'identifier, property_identifier, type_identifier'}, {pattern: ')'}, {pattern: '}'}, {pattern: ']'}, {pattern: '>'}, {pattern: '!'}, {pattern: '/'}, {pattern: ';'}, {pattern: ':'}, {pattern: '=>'}, {pattern: '('}, {pattern: '{'}, {pattern: '='}], not: {inside: {kind: ERROR, stopBy: end}}}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: typescript-member-function
language: tsxlang
role: member
parentRuleIds: [typescript-function-owner, typescript-suite]
symbolType: function
utils:
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    parts:
        all:
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {regex: ''}]
            - any: [{has: {regex: '^\*$', pattern: $$STAR}}, {regex: ''}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {regex: ''}]
    suite-owner: {inside: {kind: expression_statement, inside: {kind: statement_block, inside: {kind: 'arrow_function, function_expression', inside: {kind: arguments, inside: {kind: call_expression, all: [{inside: {kind: expression_statement, inside: {kind: statement_block}}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, not: {regex: "\n"}, pattern: $SUITE}}}]}}}}}}
    suite: {any: [{kind: identifier, regex: '^(?:describe|describeWrapped|suite|layer)$'}, {kind: member_expression, has: {field: object, matches: suite}}, {kind: call_expression, has: {field: function, matches: suite}}]}
    up: {inside: {kind: expression_statement, inside: {kind: statement_block, inside: {kind: 'arrow_function, function_expression', inside: {kind: arguments, inside: {kind: call_expression, all: [{inside: {kind: expression_statement, inside: {kind: statement_block}}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, not: {regex: "\n"}, pattern: $UP}}}]}}}}}}
rule:
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
    any:
        - kind: function_declaration, generator_function_declaration, function_signature
          has: {field: name, pattern: $NAME, all: [{pattern: $ANCHOR}]}
          inside:
            kind: statement_block
            inside:
                kind: function_declaration, generator_function_declaration, arrow_function, function_expression, generator_function
                not: {inside: {kind: statement_block, stopBy: end, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}
        - kind: identifier, member_expression, call_expression
          matches: suite
          pattern: $ANCHOR
          inside:
            kind: 'arguments > :is(arrow_function, function_expression) > statement_block > expression_statement > call_expression'
            field: function
            has: {field: arguments, has: {matches: first, pattern: $FIRST}}
            any: [{matches: suite-owner}, {kind: call_expression}]
rewriters:
    - {id: comment, rule: {kind: comment}, fix: ''}
    - id: declared
      rule: {kind: identifier, inside: {kind: 'function_declaration, generator_function_declaration, function_signature', field: name, matches: parts}}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIERfunction$STAR $NAME$GENERICS$ARGUMENTS$RESULT
    - id: initializer
      rule: {kind: 'required_parameter, optional_parameter', all: [{has: {field: value, regex: ''}}, {has: {field: pattern, pattern: $BOUND}}, {any: [{has: {kind: accessibility_modifier, pattern: $PACCESS}}, {regex: ''}]}, {any: [{has: {kind: override_modifier, pattern: $POVERRIDE}}, {regex: ''}]}, {any: [{has: {regex: '^readonly$', pattern: $$PREADONLY}}, {regex: ''}]}, {any: [{has: {field: type, pattern: $PTYPE}}, {regex: ''}]}]}
      transform:
        PACCESSED: {replace: {source: $PACCESS, replace: $, by: ' '}}
        POVERRIDDEN: {replace: {source: $POVERRIDE, replace: $, by: ' '}}
        PREAD: {replace: {source: $PREADONLY, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $BOUND, rewriters: [nested, comment]}}
      fix: $PACCESSED$POVERRIDDEN$PREAD$SHAPED$PTYPE = …
    - {id: nested, rule: {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, pattern: $LEFT}}, transform: {LEFTED: {rewrite: {source: $LEFT, rewriters: [nested]}}}, fix: '$LEFTED = …'}
    - {id: arguments, rule: {kind: arguments, inside: {kind: call_expression, field: arguments}, has: {pattern: $_}}, fix: (…)}
    - id: suited
      rule: {kind: 'identifier, member_expression, call_expression', pattern: $SELF, inside: {kind: call_expression, field: function, has: {field: arguments, has: {matches: first, pattern: $TITLED}}}}
      transform: {CALLED: {rewrite: {source: $SELF, rewriters: [arguments, comment]}}}
      fix: $CALLED($TITLED)
    - id: lineage
      rule:
        kind: string, template_string, identifier, member_expression
        matches: first
        pattern: $LEVEL
        inside: {kind: arguments, any: [{inside: {kind: call_expression, matches: up}}, {kind: arguments}]}
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
        STEP: {replace: {source: $LEVEL, replace: '^[''"`]?(.*?)[''"`]?$', by: $1.}}
      fix: $ABOVE$STEP
transform:
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    LABEL: {replace: {source: $TITLE, replace: '^[''"`](.*)[''"`]$', by: $1}}
    TITLE: {replace: {source: $FIRST, replace: '\n(?s:.*)', by: …}}
    CONTEXT: {rewrite: {source: $SUITE, rewriters: [lineage]}}
    HEADER: {rewrite: {source: $ANCHOR, rewriters: [declared, suited]}}
name: $CONTEXT$NAME$LABEL
signature: $SIGNATURE
---
id: typescript-member-class
language: tsxlang
role: member
parentRuleIds: [typescript-function-owner, typescript-suite]
symbolType: class
utils:
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    form:
        all:
            - any: [{has: {field: decorator, matches: first, pattern: $FIRSTDECORATOR}}, {inside: {kind: export_statement, has: {field: decorator, matches: first, pattern: $FIRSTDECORATOR}}}, {regex: ''}]
            - any: [{has: {regex: '^abstract$', pattern: $$ABSTRACT}}, {regex: ''}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]
            - any: [{has: {kind: class_heritage, pattern: $HERITAGE}}, {regex: ''}]
rule:
    kind: type_identifier
    pattern: $NAME
    inside: {kind: 'class_declaration, abstract_class_declaration', field: name}
rewriters:
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: call, rule: {kind: arguments, regex: "\n", not: {has: {kind: object}}}, fix: (…)}
    - {id: object, rule: {kind: object, has: {kind: 'pair, spread_element, method_definition, shorthand_property_identifier'}}, fix: '{…}'}
    - {id: shape, rule: {kind: object_type, regex: "\n"}, fix: '{…}'}
    - id: decorators
      rule: {kind: decorator, pattern: $DECORATOR, any: [{precedes: {kind: decorator, pattern: $NEXT}}, {regex: ''}]}
      transform:
        ONE: {rewrite: {source: $DECORATOR, rewriters: [call, comment]}}
        REST: {rewrite: {source: $NEXT, rewriters: [decorators]}}
      fix: $ONE $REST
    - id: declared
      rule: {kind: type_identifier, inside: {kind: 'class_declaration, abstract_class_declaration', field: name, matches: form}}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        EXTENDED: {rewrite: {source: $HERITAGE, rewriters: [object, shape, call, comment]}}
      fix: $DECORATED$ABSTRACTEDclass $NAME$GENERICS $EXTENDED
transform:
    HEADER: {rewrite: {source: $NAME, rewriters: [declared]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
name: $NAME
signature: $SIGNATURE
---
id: typescript-member-method
language: tsxlang
role: member
parentRuleIds: [typescript-class, typescript-interface, typescript-type, typescript-constant, typescript-variable, typescript-assignment, typescript-export, typescript-function-owner, typescript-suite]
symbolType: method
utils:
    first: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
    typed: {any: [{has: {field: type, pattern: $TYPE}}, {regex: ''}]}
    fn: {regex: '^fn(?:Untraced(?:Eager)?)?$'}
    effect-function: {any: [{kind: identifier, matches: fn}, {kind: member_expression, has: {field: property, matches: fn}}]}
    parts:
        all:
            - any: [{has: {regex: '^async$', pattern: $$ASYNC}}, {regex: ''}]
            - any: [{has: {regex: '^\*$', pattern: $$STAR}}, {regex: ''}]
            - any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]
            - any: [{has: {field: parameters, pattern: $PARAMETERS}}, {has: {field: parameter, pattern: $PARAMETERS}}]
            - any: [{has: {field: return_type, pattern: $RETURN}}, {regex: ''}]
    after: {any: [{has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}, pattern: $SECOND}}, {regex: ''}]}
    later: {all: [{any: [{has: {nthChild: {position: 3, ofRule: {not: {kind: comment}}}, pattern: $THIRD}}, {regex: ''}]}, {any: [{has: {nthChild: {position: 4, ofRule: {not: {kind: comment}}}, pattern: $FOURTH}}, {regex: ''}]}, {any: [{has: {nthChild: {position: 5, ofRule: {not: {kind: comment}}}, pattern: $FIFTH}}, {regex: ''}]}]}
    called: {kind: call_expression, all: [{has: {field: function, pattern: $CALLEE}}, {has: {field: arguments, all: [{matches: after}, {matches: later}]}}]}
    owned-value: {any: [{inside: {kind: 'variable_declarator, export_statement, extends_clause, public_field_definition, pair', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}, {inside: {kind: assignment_expression, field: right, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}, {inside: {kind: export_statement, has: {regex: '^=$'}, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}}}]}
    chained: {kind: call_expression, any: [{matches: owned-value}, {inside: {kind: member_expression, field: object, inside: {kind: call_expression, field: function, matches: chained}}}]}
    chain-root: {kind: call_expression, not: {has: {field: function, kind: member_expression, any: [{has: {field: object, kind: call_expression}}, {has: {field: property, regex: '^(?:annotate|annotateKey|check|pipe|rebuild)$'}}]}}, matches: chained}
    owned-object: {kind: object, any: [{matches: owned-value}, {inside: {kind: arguments, inside: {matches: chain-root}}}], not: {inside: {kind: statement_block, stopBy: end, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}}
    suite-owner: {inside: {kind: expression_statement, inside: {kind: statement_block, inside: {kind: 'arrow_function, function_expression', inside: {kind: arguments, inside: {kind: call_expression, all: [{inside: {kind: expression_statement, inside: {kind: statement_block}}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, not: {regex: "\n"}, pattern: $SUITE}}}]}}}}}}
    up: {any: [{kind: object_type, inside: {kind: union_type}, has: {kind: property_signature, has: {field: type, has: {kind: literal_type, pattern: $UP}}}}, {kind: object, inside: {kind: arguments, has: {kind: string, matches: first, pattern: $UP}, inside: {kind: call_expression, inside: {kind: arguments}}}}, {inside: {kind: arguments, inside: {kind: call_expression, all: [{matches: chain-root}, {matches: up-chain}]}}}, {inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $UP}}, {has: {field: name, pattern: $UP}}]}}, {inside: {kind: type_annotation, inside: {kind: property_signature, has: {field: name, pattern: $UP}}}}, {kind: class_body, inside: {any: [{kind: class, matches: up}, {kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $UP}, inside: {kind: statement_block, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}]}}]}
    role: {any: [{kind: member_expression, has: {field: object, regex: '^(?:Context|Data)$'}}, {kind: call_expression, has: {field: function, matches: role}}]}
    type-body: {any: [{kind: interface_body}, {kind: object_type, any: [{inside: {kind: type_alias_declaration, field: value, stopBy: {not: {kind: 'union_type, intersection_type, parenthesized_type'}}}}, {inside: {kind: ambient_declaration}}, {inside: {kind: type_annotation, inside: {kind: property_signature, inside: {matches: type-body}}}}, {inside: {kind: type_arguments, any: [{inside: {kind: extends_clause, field: type_arguments, has: {field: value, matches: role}}}, {inside: {kind: call_expression, field: type_arguments, has: {field: function, matches: role}, inside: {kind: extends_clause, stopBy: {not: {kind: call_expression}}}}}]}}]}]}
    nested-chain: {any: [{inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $OWNER}}, {has: {field: name, pattern: $OWNER}}]}}, {inside: {kind: member_expression, field: object, inside: {kind: call_expression, field: function, matches: nested-chain}}}]}
    nested: {any: [{kind: object_type, inside: {kind: union_type}, has: {kind: property_signature, has: {field: type, has: {kind: literal_type, pattern: $OWNER}}}}, {kind: object, inside: {kind: arguments, has: {kind: string, matches: first, pattern: $OWNER}, inside: {kind: call_expression, inside: {kind: arguments}}}}, {inside: {kind: arguments, inside: {kind: call_expression, all: [{matches: chain-root}, {matches: nested-chain}]}}}, {inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $OWNER}}, {has: {field: name, pattern: $OWNER}}]}}, {inside: {kind: type_annotation, inside: {kind: property_signature, has: {field: name, pattern: $OWNER}}}}, {kind: class_body, inside: {any: [{kind: class, matches: nested}, {kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $OWNER}, inside: {kind: statement_block, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}]}}]}
    up-chain: {any: [{inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $UP}}, {has: {field: name, pattern: $UP}}]}}, {inside: {kind: member_expression, field: object, inside: {kind: call_expression, field: function, matches: up-chain}}}]}
    modifiers:
        all:
            - any: [{has: {field: decorator, matches: first, pattern: $FIRSTDECORATOR}}, {regex: ''}]
            - any: [{has: {kind: accessibility_modifier, pattern: $ACCESS}}, {regex: ''}]
            - any: [{has: {regex: '^static$', pattern: $$STATIC}}, {regex: ''}]
            - any: [{has: {regex: '^abstract$', pattern: $$ABSTRACT}}, {regex: ''}]
            - any: [{has: {kind: override_modifier, pattern: $OVERRIDE}}, {regex: ''}]
            - any: [{has: {regex: '^readonly$', pattern: $$READONLY}}, {regex: ''}]
            - any: [{has: {regex: '^declare$', pattern: $$DECLARE}}, {regex: ''}]
            - any: [{has: {regex: '^accessor$', pattern: $$ACCESSOR}}, {regex: ''}]
            - any: [{has: {regex: '^[?!]$', pattern: $$MARK}}, {regex: ''}]
    scope: {all: [{any: [{kind: class_body}, {matches: type-body}, {matches: owned-object}]}, {any: [{matches: nested}, {kind: 'class_body, interface_body, object_type, object'}]}]}
    value:
        any:
            - kind: arrow_function, function_expression, generator_function
            - kind: call_expression
              all:
                - has: {field: function, any: [{matches: effect-function}, {kind: call_expression, has: {field: function, matches: effect-function}}]}
                - has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, kind: 'arrow_function, function_expression, generator_function, identifier, member_expression, call_expression'}}
            - {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion', has: {matches: value}}
    case: {any: [{kind: identifier, regex: '^(?:test|it)$'}, {kind: identifier, pattern: $RUNNER, inside: {kind: 'arrow_function, function_expression', stopBy: end, any: [{has: {field: parameter, pattern: $RUNNER}}, {has: {field: parameters, has: {kind: required_parameter, nthChild: {position: 1, ofRule: {not: {kind: comment}}}, has: {field: pattern, pattern: $RUNNER}}}}]}}, {kind: member_expression, has: {field: object, matches: case}}, {kind: call_expression, has: {field: function, matches: case}}]}
    suite-up: {inside: {kind: expression_statement, inside: {kind: statement_block, inside: {kind: 'arrow_function, function_expression', inside: {kind: arguments, inside: {kind: call_expression, all: [{inside: {kind: expression_statement, inside: {kind: statement_block}}}, {has: {field: arguments, has: {nthChild: {position: 1, ofRule: {not: {kind: comment}}}, not: {regex: "\n"}, pattern: $ABOVE_SUITE}}}]}}}}}}
    holder: {all: [{matches: modifiers}, {matches: typed}, {has: {regex: '^[:=]$', pattern: $$SEPARATOR}}]}
    held: {any: [{inside: {kind: pair, field: key, matches: holder}}, {inside: {kind: public_field_definition, field: name, matches: holder}}]}
rule:
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
    any:
        - kind: method_definition, method_signature, abstract_method_signature
          inside: {matches: scope}
          has: {field: name, pattern: $NAME, all: [{pattern: $ANCHOR}], not: {follows: {regex: '^(?:get|set)$'}}}
          not: {all: [{inside: {kind: class_body}}, {has: {field: name, regex: '^constructor$'}}, {not: {has: {regex: '^static$'}}}]}
        - {kind: call_signature, pattern: $ANCHOR, inside: {matches: scope}, has: {field: parameters, pattern: $CALL}}
        - {kind: public_field_definition, inside: {matches: scope}, all: [{has: {field: name, pattern: $NAME, all: [{pattern: $ANCHOR}]}}, {has: {field: value, matches: value}}]}
        - {kind: pair, inside: {matches: scope}, all: [{has: {field: key, pattern: $NAME, all: [{pattern: $ANCHOR}]}}, {has: {field: value, matches: value}}]}
        - kind: 'arguments > :is(arrow_function, function_expression) > statement_block > expression_statement > call_expression'
          all:
            - has: {field: function, matches: case, pattern: $ANCHOR}
            - has: {field: arguments, has: {matches: first, pattern: $FIRST}}
            - any: [{matches: suite-owner}, {kind: call_expression}]
rewriters:
    - id: lineage
      rule:
        kind: property_identifier, private_property_identifier, string, number, computed_property_name, type_identifier
        pattern: $LEVEL
        any:
            - inside: {kind: pair, field: key, inside: {matches: up}}
            - inside: {kind: 'public_field_definition, property_signature, class_declaration, abstract_class_declaration', field: name, inside: {matches: up}}
            - kind: property_identifier, private_property_identifier, string, number, computed_property_name, type_identifier
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [keyed, lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
    - {id: call, rule: {kind: arguments, regex: "\n"}, fix: (…)}
    - id: decorators
      rule: {kind: decorator, pattern: $DECORATOR, any: [{precedes: {kind: decorator, pattern: $NEXT}}, {regex: ''}]}
      transform:
        ONE: {rewrite: {source: $DECORATOR, rewriters: [call, comment]}}
        REST: {rewrite: {source: $NEXT, rewriters: [decorators]}}
      fix: $ONE $REST
    - id: initializer
      rule: {kind: 'required_parameter, optional_parameter', all: [{has: {field: value, regex: ''}}, {has: {field: pattern, pattern: $BOUND}}, {any: [{has: {kind: accessibility_modifier, pattern: $PACCESS}}, {regex: ''}]}, {any: [{has: {kind: override_modifier, pattern: $POVERRIDE}}, {regex: ''}]}, {any: [{has: {regex: '^readonly$', pattern: $$PREADONLY}}, {regex: ''}]}, {any: [{has: {field: type, pattern: $PTYPE}}, {regex: ''}]}]}
      transform:
        PACCESSED: {replace: {source: $PACCESS, replace: $, by: ' '}}
        POVERRIDDEN: {replace: {source: $POVERRIDE, replace: $, by: ' '}}
        PREAD: {replace: {source: $PREADONLY, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $BOUND, rewriters: [nested, comment]}}
      fix: $PACCESSED$POVERRIDDEN$PREAD$SHAPED$PTYPE = …
    - {id: nested, rule: {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, pattern: $LEFT}}, transform: {LEFTED: {rewrite: {source: $LEFT, rewriters: [nested]}}}, fix: '$LEFTED = …'}
    - id: step
      rule: {kind: arrow_function, matches: parts}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - {id: opened, rule: {kind: statement_block, inside: {kind: 'function_expression, generator_function', field: body}}, fix: '{…}'}
    - {id: arguments, rule: {kind: arguments, inside: {kind: call_expression, field: arguments}, has: {pattern: $_}}, fix: (…)}
    - id: suited
      rule: {kind: 'identifier, member_expression, call_expression', pattern: $SELF, inside: {kind: call_expression, field: function, has: {field: arguments, has: {matches: first, pattern: $TITLED}}}}
      transform: {CALLED: {rewrite: {source: $SELF, rewriters: [arguments, comment]}}}
      fix: $CALLED($TITLED)
    - id: keyed
      rule:
        kind: literal_type, string
        pattern: $LEVEL
        any:
            - {kind: literal_type, inside: {kind: type_annotation, inside: {kind: property_signature, inside: {kind: object_type, inside: {kind: union_type, any: [{inside: {kind: type_annotation, inside: {kind: property_signature, has: {field: name, pattern: $UP}}}}, {regex: ''}]}}}}}
            - {kind: string, inside: {kind: arguments, inside: {kind: call_expression, any: [{matches: up-chain}, {regex: ''}]}}}
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [keyed, lineage]}}
        STEP: {replace: {source: $LEVEL, replace: '^[''"`](.*)[''"`]$', by: $1}}
      fix: $ABOVE$STEP.
    - id: suite-lineage
      rule:
        kind: string, template_string, identifier, member_expression
        matches: first
        pattern: $LEVEL
        inside: {kind: arguments, any: [{inside: {kind: call_expression, matches: suite-up}}, {kind: arguments}]}
      transform:
        ABOVE: {rewrite: {source: $ABOVE_SUITE, rewriters: [suite-lineage]}}
        STEP: {replace: {source: $LEVEL, replace: '^[''"`]?(.*?)[''"`]?$', by: $1.}}
      fix: $ABOVE$STEP
    - id: method
      rule: {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', inside: {kind: 'method_definition, method_signature, abstract_method_signature', field: name, all: [{matches: modifiers}, {matches: parts}]}}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        STATICED: {replace: {source: $STATIC, replace: $, by: ' '}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        OVERRIDDEN: {replace: {source: $OVERRIDE, replace: $, by: ' '}}
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $DECORATED$ACCESSED$STATICED$ABSTRACTED$OVERRIDDEN$MODIFIER$STAR$NAME$MARK$GENERICS$ARGUMENTS$RESULT
    - id: lambda
      rule: {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', all: [{matches: held}, {inside: {kind: 'pair, public_field_definition', has: {field: value, kind: arrow_function, matches: parts}}}]}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        STATICED: {replace: {source: $STATIC, replace: $, by: ' '}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        OVERRIDDEN: {replace: {source: $OVERRIDE, replace: $, by: ' '}}
        READ: {replace: {source: $READONLY, replace: $, by: ' '}}
        DECLARED: {replace: {source: $DECLARE, replace: $, by: ' '}}
        ACCESSORED: {replace: {source: $ACCESSOR, replace: $, by: ' '}}
        GAPPED: {replace: {source: $SEPARATOR, replace: '^=$', by: ' ='}}
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $DECORATED$DECLARED$ACCESSED$STATICED$ABSTRACTED$OVERRIDDEN$READ$ACCESSORED$NAME$MARK$TYPE$GAPPED $MODIFIER$GENERICS$ARGUMENTS$RESULT => …
    - id: expressed
      rule: {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', all: [{matches: held}, {inside: {kind: 'pair, public_field_definition', has: {field: value, kind: 'function_expression, generator_function', matches: parts}}}]}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        STATICED: {replace: {source: $STATIC, replace: $, by: ' '}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        OVERRIDDEN: {replace: {source: $OVERRIDE, replace: $, by: ' '}}
        READ: {replace: {source: $READONLY, replace: $, by: ' '}}
        DECLARED: {replace: {source: $DECLARE, replace: $, by: ' '}}
        ACCESSORED: {replace: {source: $ACCESSOR, replace: $, by: ' '}}
        GAPPED: {replace: {source: $SEPARATOR, replace: '^=$', by: ' ='}}
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $DECORATED$DECLARED$ACCESSED$STATICED$ABSTRACTED$OVERRIDDEN$READ$ACCESSORED$NAME$MARK$TYPE$GAPPED $MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT {…}
    - id: called-function
      rule: {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', all: [{matches: held}, {inside: {kind: 'pair, public_field_definition', has: {field: value, matches: called, has: {field: arguments, has: {kind: 'function_expression, generator_function', all: [{matches: first}, {matches: parts}]}}}}}]}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        STATICED: {replace: {source: $STATIC, replace: $, by: ' '}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        OVERRIDDEN: {replace: {source: $OVERRIDE, replace: $, by: ' '}}
        READ: {replace: {source: $READONLY, replace: $, by: ' '}}
        DECLARED: {replace: {source: $DECLARE, replace: $, by: ' '}}
        ACCESSORED: {replace: {source: $ACCESSOR, replace: $, by: ' '}}
        GAPPED: {replace: {source: $SEPARATOR, replace: '^=$', by: ' ='}}
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
        CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}
        STEP2: {rewrite: {source: $SECOND, rewriters: [step, call, comment]}}
        STEP3: {rewrite: {source: $THIRD, rewriters: [step, call, comment]}}
        STEP4: {rewrite: {source: $FOURTH, rewriters: [step, call, comment]}}
        TRAIL2: {replace: {source: $STEP2, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL3: {replace: {source: $STEP3, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL4: {replace: {source: $STEP4, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL5: {replace: {source: $FIFTH, replace: '(?s).+', by: ', …'}}
      fix: $DECORATED$DECLARED$ACCESSED$STATICED$ABSTRACTED$OVERRIDDEN$READ$ACCESSORED$NAME$MARK$TYPE$GAPPED $CALLED($MODIFIERfunction$STAR $GENERICS$ARGUMENTS$RESULT {…}$TRAIL2$TRAIL3$TRAIL4$TRAIL5)
    - id: called-arrow
      rule: {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', all: [{matches: held}, {inside: {kind: 'pair, public_field_definition', has: {field: value, matches: called, has: {field: arguments, has: {kind: arrow_function, all: [{matches: first}, {matches: parts}]}}}}}]}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        STATICED: {replace: {source: $STATIC, replace: $, by: ' '}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        OVERRIDDEN: {replace: {source: $OVERRIDE, replace: $, by: ' '}}
        READ: {replace: {source: $READONLY, replace: $, by: ' '}}
        DECLARED: {replace: {source: $DECLARE, replace: $, by: ' '}}
        ACCESSORED: {replace: {source: $ACCESSOR, replace: $, by: ' '}}
        GAPPED: {replace: {source: $SEPARATOR, replace: '^=$', by: ' ='}}
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
        CALLED: {rewrite: {source: $CALLEE, rewriters: [call, comment]}}
        STEP2: {rewrite: {source: $SECOND, rewriters: [step, call, comment]}}
        STEP3: {rewrite: {source: $THIRD, rewriters: [step, call, comment]}}
        STEP4: {rewrite: {source: $FOURTH, rewriters: [step, call, comment]}}
        TRAIL2: {replace: {source: $STEP2, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL3: {replace: {source: $STEP3, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL4: {replace: {source: $STEP4, replace: '(?s)^(.+)$', by: ', $1'}}
        TRAIL5: {replace: {source: $FIFTH, replace: '(?s).+', by: ', …'}}
      fix: $DECORATED$DECLARED$ACCESSED$STATICED$ABSTRACTED$OVERRIDDEN$READ$ACCESSORED$NAME$MARK$TYPE$GAPPED $CALLED($MODIFIER$GENERICS$ARGUMENTS$RESULT => …$TRAIL2$TRAIL3$TRAIL4$TRAIL5)
    - id: wrapped
      rule: {kind: 'property_identifier, private_property_identifier, string, number, computed_property_name', all: [{matches: held}, {inside: {kind: 'pair, public_field_definition', has: {field: value, pattern: $VALUE}}}]}
      transform:
        DECORATED: {rewrite: {source: $FIRSTDECORATOR, rewriters: [decorators]}}
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        STATICED: {replace: {source: $STATIC, replace: $, by: ' '}}
        ABSTRACTED: {replace: {source: $ABSTRACT, replace: $, by: ' '}}
        OVERRIDDEN: {replace: {source: $OVERRIDE, replace: $, by: ' '}}
        READ: {replace: {source: $READONLY, replace: $, by: ' '}}
        DECLARED: {replace: {source: $DECLARE, replace: $, by: ' '}}
        ACCESSORED: {replace: {source: $ACCESSOR, replace: $, by: ' '}}
        GAPPED: {replace: {source: $SEPARATOR, replace: '^=$', by: ' ='}}
        SHOWN: {rewrite: {source: $VALUE, rewriters: [step, opened, call, comment]}}
      fix: $DECORATED$DECLARED$ACCESSED$STATICED$ABSTRACTED$OVERRIDDEN$READ$ACCESSORED$NAME$MARK$TYPE$GAPPED $SHOWN
    - id: signature
      rule: {kind: call_signature, matches: parts}
      transform:
        MODIFIER: {replace: {source: $ASYNC, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $RETURN, rewriters: [comment]}}
      fix: $GENERICS$ARGUMENTS$RESULT
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [keyed, lineage]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    LABEL: {replace: {source: $TITLE, replace: '^[''"`](.*)[''"`]$', by: $1}}
    TITLE: {replace: {source: $FIRST, replace: '\n(?s:.*)', by: …}}
    CONTEXT: {rewrite: {source: $SUITE, rewriters: [suite-lineage]}}
    INVOKE: {replace: {source: $CALL, replace: '(?s).+', by: ()}}
    HEADER: {rewrite: {source: $ANCHOR, rewriters: [method, lambda, expressed, called-function, called-arrow, wrapped, signature, suited]}}
name: $QUALIFIER$CONTEXT$NAME$INVOKE$LABEL
signature: $SIGNATURE$LAMBDASIGNATURE
isPublic: {not: {any: [{has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}}, {has: {field: name, kind: private_property_identifier}}]}}
---
id: typescript-member-constructor
language: tsxlang
role: member
parentRuleIds: [typescript-class, typescript-interface, typescript-type, typescript-constant, typescript-variable, typescript-assignment, typescript-export, typescript-function-owner, typescript-suite]
symbolType: constructor
utils:
    up: {any: [{inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $UP}}, {has: {field: name, pattern: $UP}}]}}, {inside: {kind: type_annotation, inside: {kind: property_signature, has: {field: name, pattern: $UP}}}}, {kind: class_body, inside: {any: [{kind: class, matches: up}, {kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $UP}, inside: {kind: statement_block, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}]}}]}
    role: {any: [{kind: member_expression, has: {field: object, regex: '^(?:Context|Data)$'}}, {kind: call_expression, has: {field: function, matches: role}}]}
    type-body: {any: [{kind: interface_body}, {kind: object_type, any: [{inside: {kind: type_alias_declaration, field: value, stopBy: {not: {kind: 'union_type, intersection_type, parenthesized_type'}}}}, {inside: {kind: ambient_declaration}}, {inside: {kind: type_annotation, inside: {kind: property_signature, inside: {matches: type-body}}}}, {inside: {kind: type_arguments, any: [{inside: {kind: extends_clause, field: type_arguments, has: {field: value, matches: role}}}, {inside: {kind: call_expression, field: type_arguments, has: {field: function, matches: role}, inside: {kind: extends_clause, stopBy: {not: {kind: call_expression}}}}}]}}]}]}
    nested: {any: [{inside: {kind: 'pair, public_field_definition', field: value, stopBy: {not: {kind: 'as_expression, satisfies_expression, parenthesized_expression, non_null_expression, type_assertion'}}, any: [{has: {field: key, pattern: $OWNER}}, {has: {field: name, pattern: $OWNER}}]}}, {inside: {kind: type_annotation, inside: {kind: property_signature, has: {field: name, pattern: $OWNER}}}}, {kind: class_body, inside: {any: [{kind: class, matches: nested}, {kind: 'class_declaration, abstract_class_declaration', has: {field: name, pattern: $OWNER}, inside: {kind: statement_block, not: {inside: {kind: 'internal_module, module, ambient_declaration'}}}}]}}]}
    scope: {all: [{any: [{kind: class_body}, {matches: type-body}]}, {any: [{matches: nested}, {kind: 'class_body, interface_body, object_type'}]}]}
    constructor: {kind: 'method_definition, method_signature, abstract_method_signature', not: {has: {regex: '^static$'}}, inside: {kind: class_body, matches: scope}}
rule:
    not: {has: {stopBy: end, any: [{kind: ERROR}, {regex: '^$'}]}}
    any:
        - kind: method_definition, method_signature, abstract_method_signature
          has: {field: name, regex: '^constructor$', pattern: $NAME, all: [{pattern: $ANCHOR}]}
          matches: constructor
          not: {has: {field: parameters, has: {any: [{has: {kind: accessibility_modifier}}, {has: {regex: '^readonly$'}}]}}}
        - {kind: property_identifier, regex: '^constructor$', pattern: $NAME, all: [{pattern: $ANCHOR}], inside: {field: name, matches: constructor}}
        - {kind: construct_signature, pattern: $ANCHOR, has: {regex: '^new$', pattern: $$NAME}, inside: {matches: scope}}
        - {kind: class_static_block, pattern: $ANCHOR, has: {regex: '^static$', pattern: $$NAME}, inside: {matches: scope}}
rewriters:
    - id: lineage
      rule:
        kind: property_identifier, private_property_identifier, string, number, computed_property_name, type_identifier
        pattern: $LEVEL
        any:
            - inside: {kind: pair, field: key, inside: {matches: up}}
            - inside: {kind: 'public_field_definition, property_signature, class_declaration, abstract_class_declaration', field: name, inside: {matches: up}}
            - kind: property_identifier, private_property_identifier, string, number, computed_property_name, type_identifier
      transform:
        ABOVE: {rewrite: {source: $UP, rewriters: [lineage]}}
      fix: $ABOVE$LEVEL.
    - {id: comment, rule: {kind: comment}, fix: ''}
    - id: initializer
      rule: {kind: 'required_parameter, optional_parameter', all: [{has: {field: value, regex: ''}}, {has: {field: pattern, pattern: $BOUND}}, {any: [{has: {kind: accessibility_modifier, pattern: $PACCESS}}, {regex: ''}]}, {any: [{has: {kind: override_modifier, pattern: $POVERRIDE}}, {regex: ''}]}, {any: [{has: {regex: '^readonly$', pattern: $$PREADONLY}}, {regex: ''}]}, {any: [{has: {field: type, pattern: $PTYPE}}, {regex: ''}]}]}
      transform:
        PACCESSED: {replace: {source: $PACCESS, replace: $, by: ' '}}
        POVERRIDDEN: {replace: {source: $POVERRIDE, replace: $, by: ' '}}
        PREAD: {replace: {source: $PREADONLY, replace: $, by: ' '}}
        SHAPED: {rewrite: {source: $BOUND, rewriters: [nested, comment]}}
      fix: $PACCESSED$POVERRIDDEN$PREAD$SHAPED$PTYPE = …
    - {id: nested, rule: {kind: 'assignment_pattern, object_assignment_pattern', has: {field: left, pattern: $LEFT}}, transform: {LEFTED: {rewrite: {source: $LEFT, rewriters: [nested]}}}, fix: '$LEFTED = …'}
    - id: built
      rule: {kind: property_identifier, inside: {kind: 'method_definition, method_signature, abstract_method_signature', field: name, all: [{any: [{has: {kind: accessibility_modifier, pattern: $ACCESS}}, {regex: ''}]}, {has: {field: parameters, pattern: $PARAMETERS}}]}}
      transform:
        ACCESSED: {replace: {source: $ACCESS, replace: $, by: ' '}}
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
      fix: $ACCESSED$NAME$ARGUMENTS
    - id: construct
      rule: {kind: construct_signature, all: [{any: [{has: {field: type_parameters, pattern: $GENERICS}}, {regex: ''}]}, {has: {field: parameters, pattern: $PARAMETERS}}, {any: [{has: {field: type, pattern: $CTYPE}}, {regex: ''}]}]}
      transform:
        ARGUMENTS: {rewrite: {source: $PARAMETERS, rewriters: [initializer, nested, comment]}}
        RESULT: {rewrite: {source: $CTYPE, rewriters: [comment]}}
      fix: new$GENERICS$ARGUMENTS$RESULT
    - {id: static, rule: {kind: class_static_block}, fix: static}
transform:
    QUALIFIER: {rewrite: {source: $OWNER, rewriters: [lineage]}}
    LINE: {replace: {source: $HEADER, replace: '[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{2060}\x{3000}\x{FEFF}]*', by: ' '}}
    SIGNATURE: {replace: {source: $LINE, replace: '[,;] *( \})|,? ([)\]])|, (>)|([(\[<]) |[ ;]+$|( ) +', by: $1$2$3$4$5}}
    HEADER: {rewrite: {source: $ANCHOR, rewriters: [built, construct, static]}}
name: $QUALIFIER$NAME
signature: $SIGNATURE
isPublic: {not: {any: [{kind: class_static_block}, {has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}}, {inside: {kind: 'method_definition, method_signature, abstract_method_signature', has: {kind: accessibility_modifier, regex: '^(?:private|protected)$'}}}]}}
