# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-strict-zip
language: python
severity: error
rule:
    kind: keyword_argument
    all:
        - has: {field: name, regex: '^strict$'}
        - has: {field: value, kind: 'true, false', pattern: $VALUE}
        - inside:
            kind: argument_list
            inside:
                kind: call
                has:
                    field: function
                    pattern: $CALLEE
                    any:
                        - matches: {python-builtin-name: {name: {regex: '^(zip|map)$'}}}
                        - matches: {python-member-use: {module: {regex: '^itertools$'}, name: {regex: '^batched$'}}}
message: '`$CALLEE` receives `strict=$VALUE` in place of inputs validated to one length'
note: 'Delete `strict=<value>` and validate input lengths at the boundary into a type that fixes them'
