# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exists-before-read
language: python
severity: error
utils:
    existence:
        any:
            - kind: call
              has: {field: function, kind: attribute, all: [{has: {field: object, pattern: $PATH}}, {has: {field: attribute, regex: '^(exists|is_file)$'}}]}
            - kind: call
              all: [{has: {field: function, regex: '(^|\.)path\.(exists|isfile)$'}}, {has: {field: arguments, has: {nthChild: 1, pattern: $PATH}}}]
            - kind: 'await, parenthesized_expression'
              has: {matches: existence}
    read:
        kind: call
        any:
            - has: {field: function, kind: attribute, all: [{has: {field: object, pattern: $PATH}}, {has: {field: attribute, regex: '^(read_bytes|read_text|open|readlink|iterdir)$'}}]}
            - has: {field: arguments, has: {nthChild: 1, pattern: $PATH}}
    guard:
        any:
            - matches: existence
            - kind: boolean_operator
              has: {field: operator, regex: '^and$'}
              any: [{has: {field: left, matches: guard}}, {has: {field: right, matches: guard}}]
            - kind: parenthesized_expression
              has: {matches: guard}
    reads:
        any: [{matches: read}, {has: {stopBy: end, matches: read}}]
rule:
    pattern: $SITE
    any:
        - kind: conditional_expression
          all:
            - has: {nthChild: 2, matches: guard}
            - has: {nthChild: 1, matches: reads}
        - kind: if_statement, elif_clause
          all:
            - has: {field: condition, matches: guard}
            - has: {field: consequence, matches: reads}
message: '`$SITE` tests `$PATH` for existence before a read that raises on its absence'
note: 'Use one `try` that reads the file and maps `FileNotFoundError` to the absent value at the boundary, an existence test races the read and repeats its check'
