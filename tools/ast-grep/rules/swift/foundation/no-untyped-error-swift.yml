# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-untyped-error-swift
language: swift
severity: error
utils:
    text-entry:
        kind: dictionary_literal
        has:
            kind: simple_identifier
            regex: '^NSLocalized(Description|FailureReason(Error)?|RecoverySuggestion(Error)?)Key$'
            precedes: {kind: line_string_literal, stopBy: {pattern: $_}}
rule:
    kind: call_expression
    any:
        - all:
            - has: {nthChild: 1, pattern: $CALLEE, regex: '^(Foundation\.)?NSError(\.init)?$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, has: {field: name, regex: '^domain$'}}}}
        - all:
            - has: {nthChild: 1, pattern: $CALLEE, regex: '^(Foundation\.)?(CocoaError|URLError|POSIXError|MachError)(\.init)?$'}
            - has: {kind: call_suffix, has: {kind: value_arguments, has: {kind: value_argument, all: [{has: {field: name, regex: '^userInfo$'}}, {has: {field: value, matches: text-entry}}]}}}
message: '`$CALLEE` builds an error from a domain, code, or text no Swift case names and no consumer can match'
note: 'Construct `CocoaError(.<code>)`, `POSIXError(.<code>)`, `URLError(.<code>)`, or `MachError(.<code>)` for a system domain and otherwise a case of an `enum` conforming to `CustomNSError` for its domain and code or `LocalizedError` for its text'
