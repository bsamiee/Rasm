# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-nested-continuation
language: tsx
severity: error
utils:
    step:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(andThen|catch|catchCause|catchCauseIf|catchCauseFilter|catchDefect|catchFilter|catchIf|catchReason|catchReasons|catchTag|catchTags|flatMap|map|matchCauseEffect|matchEffect|tap|tapCause|tapCauseIf|tapDefect|tapError|tapErrorTag)$'}}}}
    callback:
        kind: arrow_function, function_expression
    continuation:
        kind: call_expression
        all:
            - matches: step
            - has: {field: arguments, has: {matches: callback}}
    inner:
        kind: call_expression
        all:
            - matches: step
            - has: {field: arguments, any: [{has: {matches: callback}}, {has: {nthChild: 2}}]}
rule:
    pattern: $CALL
    matches: continuation
    has:
        field: arguments
        has:
            matches: callback
            has:
                field: body
                any:
                    - {matches: inner, pattern: $INNER}
                    - not: {matches: typescript-function-boundary}
                      has: {stopBy: {matches: typescript-function-boundary}, matches: inner, pattern: $INNER}
message: 'Continuation callback starts another continuation at `$INNER`'
note: 'Yield dependent steps in one `Effect.gen` or `Effect.fn` body, and chain recovery nested in a recovery callback as one flat pipe'
labels:
    CALL: {style: primary}
    INNER: {style: secondary}
