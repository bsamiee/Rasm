# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-exec-build
language: xml
severity: error
rule:
    all:
        - matches: {msbuild-element: {name: {regex: '^Exec$'}}}
        # Every dotnet verb that evaluates a project, and the msbuild executable
        - matches: {msbuild-metadata: {name: {regex: '^Command$'}, value: {regex: '(?i)\bdotnet\s+(build|pack|publish|test|run|clean|restore|msbuild)\b|(^"|[\s/\;&])msbuild(\.exe)?\s'}}}
message: Exec starts a separate build process the engine cannot schedule or log and BuildCheck reports BC0302, order a project through ProjectReference with ReferenceOutputAssembly="false" or call a target through the MSBuild task
