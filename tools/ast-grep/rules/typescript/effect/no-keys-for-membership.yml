# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-keys-for-membership
language: tsx
severity: error
utils:
    key-list:
        any:
            - pattern: Record.keys($RECORD)
            - pattern: Object.keys($RECORD)
rule:
    any:
        # The key list is searched
        - pattern: $LIST.includes($KEY)
          has: {field: function, has: {field: object, matches: key-list}}
        - pattern: Array.contains($LIST, $KEY)
          has: {field: arguments, has: {nthChild: 1, matches: key-list}}
        # The key list is converted to a set
        - pattern: HashSet.fromIterable($LIST)
          has: {field: arguments, has: {matches: key-list}}
        - pattern: new Set($LIST)
          has: {field: arguments, has: {matches: key-list}}
message: The keys of $RECORD are listed to test membership
note: Test the record itself with `Record.has(record, key)`, the key list and the set exist only to answer that question
labels:
    RECORD: {style: primary, message: The record whose keys are listed}
