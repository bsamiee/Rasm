# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: require-private-normalized-property
language: xml
severity: error
rule:
    matches:
        msbuild-property-value:
            name: {regex: '^[A-Za-z]'}
            # The whole value is one normalizing function over one property, the form a global property from -p: silently skips
            text:
                regex: "^\\s*\\$\\((\\[MSBuild\\]::(NormalizeDirectory|NormalizePath|EnsureTrailingSlash)|\
                    \\[System\\.IO\\.Path\\]::(GetFullPath|TrimEndingDirectorySeparator))\\('\\$\\([A-Za-z_][A-Za-z0-9_]*\\)'\\)\\)\\s*$"
message: >-
    The public property re-assigns the normalized form of one property, a -p switch or an MSBuild task then supplies the name as a global
    property and skips the assignment
note: Derive the normalized value into a _ prefixed private property and read that
