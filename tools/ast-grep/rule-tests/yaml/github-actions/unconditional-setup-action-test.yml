id: unconditional-setup-action
valid:
    - |
        on:
            pull_request:
        jobs:
            changes:
                runs-on: ubuntu-latest
                outputs:
                    native: ${{ steps.filter.outputs.native }}
                steps:
                    - id: filter
                      run: echo native=true >> "$GITHUB_OUTPUT"
            blender:
                needs: changes
                if: needs.changes.outputs.native == 'true'
                runs-on: ubuntu-latest
                steps:
                    - uses: BradyAJohnston/setup-blender@1006ec809db1af1422bd1197e107e2c4d368d81e
    - |
        on: [pull_request]
        jobs:
            test:
                runs-on: macos-latest
                steps:
                    - id: affected
                      run: echo "rhino=$(nx show projects --affected)" >> "$GITHUB_OUTPUT"
                    - if: steps.affected.outputs.rhino != ''
                      uses: mcneel/setup-rhino3d@b3faf87453962c0742ab2a5e72d3494505f660df
    - |
        on:
            workflow_dispatch:
            push:
                tags: ['v*']
        jobs:
            build:
                runs-on: [self-hosted, macOS]
                steps:
                    - uses: BradyAJohnston/setup-blender@1006ec809db1af1422bd1197e107e2c4d368d81e
    - |
        on:
            pull_request:
        jobs:
            test:
                runs-on: ubuntu-latest
                steps:
                    - uses: ./.github/actions/setup-tools
                    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
invalid:
    - |
        on:
            pull_request:
        jobs:
            test:
                runs-on: ubuntu-latest
                steps:
                    - uses: BradyAJohnston/setup-blender@1006ec809db1af1422bd1197e107e2c4d368d81e
                    - run: blender --version
    - |
        on: [pull_request, push]
        jobs:
            test:
                runs-on: macos-latest
                steps:
                    - uses: mcneel/setup-rhino3d@b3faf87453962c0742ab2a5e72d3494505f660df
    - |
        on:
            pull_request_target:
        jobs:
            test:
                runs-on: ubuntu-latest
                steps:
                    - uses: BradyAJohnston/setup-blender@1006ec809db1af1422bd1197e107e2c4d368d81e
