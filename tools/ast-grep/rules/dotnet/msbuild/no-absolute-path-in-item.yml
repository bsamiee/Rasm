# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-absolute-path-in-item
language: xml
severity: error
rule:
    matches:
        msbuild-metadata:
            name: {regex: "^(Include|Exclude|Update|Remove|Project|Path|HintPath|SourceFiles|DestinationFiles|DestinationFolder|Directories|Files|File|Inputs|Outputs|WorkingDirectory)$"}
            value: {regex: '^["'']?([A-Za-z]:[\\/]|~[\\/]|/[A-Za-z0-9_.-])'}
    not: {matches: {msbuild-element: {name: {regex: '^PropertyGroup$'}}}}
message: The path exists on the machine that wrote it, and the build fails elsewhere with MSB4019 or MSB3245
note: Compose the path from $(MSBuildThisFileDirectory) with NormalizePath, or read an installation root from an overridable property
