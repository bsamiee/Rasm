# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-separator-after-directory-property
language: xml
severity: error
utils:
    # Names outside the MSBuild prefix end with a separator by convention, MSBuildThisFileDirectory alone among the reserved names does
    doubled:
        matches: msbuild-value
        regex: "\\$\\((MSBuildThisFileDirectory(NoRoot)?|([A-LN-Za-z_]|M[A-RT-Za-z0-9_]|MS[AC-Za-z0-9_])[A-Za-z0-9_]*(Dir|Directory|Root)|\
            (Base|BaseIntermediate|Intermediate|PackageOutput)?OutputPath|MSBuildProjectExtensionsPath|NuGetPackageRoot)\\)[\\\\/]"
rule:
    pattern: _VALUE
    matches: doubled
transform:
    # The directory reference without the separator run after it, the same name set the util spells
    JOINED:
        replace:
            source: $VALUE
            replace: "(\\$\\((?:MSBuildThisFileDirectory(?:NoRoot)?|(?:[A-LN-Za-z_]|M[A-RT-Za-z0-9_]|MS[AC-Za-z0-9_])[A-Za-z0-9_]*\
                (?:Dir|Directory|Root)|(?:Base|BaseIntermediate|Intermediate|PackageOutput)?OutputPath|MSBuildProjectExtensionsPath|\
                NuGetPackageRoot)\\))[\\\\/]+"
            by: '$1'
fix: $JOINED
message: The separator follows a directory property that ends with one, the path holds a doubled separator
note: Concatenate the segment directly after the property
