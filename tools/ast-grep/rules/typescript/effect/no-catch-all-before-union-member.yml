# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-catch-all-before-union-member
language: tsxlang
severity: error
utils:
    union:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^Union$'}}}}
    tagged:
        kind: call_expression
        any:
            - has: {field: function, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^TaggedStruct$'}}}}
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(annotate|pipe|check)$'}}, {has: {field: object, matches: tagged}}]}
    open-record:
        kind: call_expression
        any:
            - all:
                - has: {field: function, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^Record$'}}}}
                - has: {field: arguments, has: {nthChild: 1, matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^String$'}}}}}
            - has: {field: function, kind: member_expression, all: [{has: {field: property, regex: '^(annotate|pipe|check)$'}}, {has: {field: object, matches: open-record}}]}
rule:
    pattern: $MEMBER
    any:
        - matches: {effect-module-member: {module: {regex: '\bSchema$'}, member: {regex: '^(Any|Unknown|Void)$'}}}
          not: {nthChild: {position: 1, reverse: true, ofRule: {not: {kind: comment}}}}
          inside: {kind: array, inside: {kind: arguments, inside: {matches: union}}}
        - matches: open-record
          inside: {kind: array, has: {matches: tagged}, inside: {kind: arguments, inside: {matches: union}}}
message: '`$MEMBER` accepts values meant for another union member'
note: 'Place catch-all schemas last; exclude `_tag` with `Schema.StructWithRest` and `Schema.optionalKey(Schema.Never)` in open records'
