# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-error-message-match-csharp
language: csharplang
severity: error
ignores: ['tools/roslyn/**']
utils:
    error-type:
        matches: {csharp-type-name: {name: {regex: '^(Error|\w*Exception)$'}}}
    typed:
        any:
            - matches: error-type
            - kind: nullable_type
              has: {field: type, matches: error-type}
    element-typed:
        any:
            - kind: generic_name
              has: {kind: type_argument_list, has: {matches: typed}, not: {has: {nthChild: 2}}}
            - kind: array_type
              has: {field: type, matches: typed}
            - kind: nullable_type
              has: {field: type, matches: element-typed}
    single-parameter:
        has:
            field: parameters
            any:
                - kind: implicit_parameter
                  pattern: $ERROR
                - kind: parameter_list
                  has: {kind: parameter, has: {field: name, pattern: $ERROR}, not: {has: {field: type, pattern: $_}}}
                  not: {has: {kind: parameter, nthChild: 2}}
    element-source:
        any:
            - kind: method_declaration, local_function_statement, lambda_expression, anonymous_method_expression, constructor_declaration, operator_declaration
              has:
                field: parameters
                has:
                    kind: parameter
                    all:
                        - has: {field: name, pattern: $ELEMENT_SOURCE}
                        - has: {field: type, matches: element-typed}
            - kind: block
              has:
                kind: local_declaration_statement
                has:
                    kind: variable_declaration
                    all:
                        - has: {field: type, matches: element-typed}
                        - has: {kind: variable_declarator, has: {field: name, pattern: $ELEMENT_SOURCE}}
    error-binding:
        any:
            - kind: lambda_expression, anonymous_method_expression
              all:
                - matches: single-parameter
                - inside:
                    kind: argument
                    any:
                        - has: {field: name, regex: '^Fail$'}
                        - inside:
                            kind: argument_list
                            inside:
                                kind: invocation_expression
                                has:
                                    field: function
                                    regex: '(^|\.)(Catch|CatchIO|@catch|IfFail|MapFail|BindFail|Retry(While|Until)(IO)?|retry(While|Until))(\s*<.+>)?$'
            - kind: lambda_expression, anonymous_method_expression
              all:
                - matches: single-parameter
                - inside:
                    kind: argument
                    inside:
                        kind: argument_list
                        inside:
                            kind: invocation_expression
                            all:
                                - has: {field: function, kind: member_access_expression, has: {field: expression, kind: identifier, pattern: $ELEMENT_SOURCE}}
                                - inside: {stopBy: end, matches: element-source}
            - kind: lambda_expression, anonymous_method_expression
              all:
                - matches: single-parameter
                - inside:
                    kind: argument
                    inside:
                        kind: argument_list
                        inside:
                            kind: invocation_expression
                            has: {field: function, kind: member_access_expression, has: {field: expression, kind: member_access_expression, has: {field: name, regex: '^Inner$'}}}
            - kind: method_declaration, local_function_statement, lambda_expression, anonymous_method_expression, constructor_declaration, operator_declaration
              has:
                field: parameters
                has:
                    kind: parameter
                    all:
                        - has: {field: name, pattern: $ERROR}
                        - has: {field: type, matches: typed}
            - kind: block
              has:
                kind: local_declaration_statement
                has:
                    kind: variable_declaration
                    all:
                        - has: {field: type, matches: typed}
                        - has: {kind: variable_declarator, has: {field: name, pattern: $ERROR}}
            - kind: foreach_statement
              all:
                - has: {field: type, matches: typed}
                - has: {field: left, pattern: $ERROR}
            - kind: binary_expression, conditional_expression, if_statement, while_statement, switch_expression_arm, switch_section, arrow_expression_clause, return_statement, expression_statement
              has:
                stopBy: end
                kind: declaration_pattern
                all:
                    - has: {field: type, matches: error-type}
                    - has: {field: name, pattern: $ERROR}
    error-value:
        any:
            - kind: identifier
              pattern: $ERROR
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^InnerException$'}
                - has: {field: expression, matches: error-value}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^GetBaseException$'}}, {has: {field: expression, matches: error-value}}]}
                - matches: csharp-argumentless-call
    message-text:
        any:
            - kind: member_access_expression
              all:
                - has: {field: name, regex: '^Message$'}
                - has: {field: expression, matches: error-value}
            - kind: conditional_access_expression
              all:
                - has: {field: condition, matches: error-value}
                - has: {kind: member_binding_expression, has: {field: name, regex: '^Message$'}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, all: [{has: {field: name, regex: '^ToString$'}}, {has: {field: expression, matches: error-value}}]}
                - matches: csharp-argumentless-call
            - kind: invocation_expression
              all:
                - has:
                    field: function
                    kind: member_access_expression
                    all:
                        - has: {field: name, regex: '^(Trim|TrimStart|TrimEnd|ToLower|ToLowerInvariant|ToUpper|ToUpperInvariant|Normalize|AsSpan|AsMemory|Substring)$'}
                        - has: {field: expression, matches: message-text}
            - kind: parenthesized_expression
              has: {matches: message-text}
            - kind: interpolated_string_expression
              has: {kind: interpolation, has: {any: [{matches: error-value}, {matches: message-text}]}}
            - kind: identifier
              pattern: $TEXT
              inside:
                stopBy:
                    kind: 'block, arrow_expression_clause'
                    inside: {kind: 'method_declaration, constructor_declaration, destructor_declaration, operator_declaration, conversion_operator_declaration, accessor_declaration, property_declaration, indexer_declaration'}
                follows:
                    stopBy: end
                    any:
                        - kind: local_declaration_statement
                          has:
                            kind: variable_declaration
                            has:
                                kind: variable_declarator
                                all:
                                    - has: {field: name, pattern: $TEXT}
                                    - has: {nthChild: 2, matches: message-text}
                        - matches: bound-message
                        - has: {stopBy: end, kind: is_pattern_expression, matches: bound-message}
    bound-message:
        kind: is_pattern_expression
        all:
            - has: {field: pattern, kind: declaration_pattern, has: {field: name, pattern: $TEXT}}
            - has: {field: expression, matches: message-text}
    exception-element:
        kind: lambda_expression, anonymous_method_expression
        all:
            - has:
                field: parameters
                any:
                    - kind: implicit_parameter
                      pattern: $ERROR
                    - kind: parameter_list
                      has: {kind: parameter, has: {field: name, pattern: $ERROR}}
                      not: {has: {kind: parameter, nthChild: 2}}
            - inside:
                kind: argument
                inside:
                    kind: argument_list
                    inside:
                        kind: invocation_expression
                        has: {field: function, kind: member_access_expression, has: {field: expression, kind: member_access_expression, has: {field: name, regex: '^Exception$'}}}
    text-pattern:
        any:
            - kind: constant_pattern
              has: {kind: 'string_literal, verbatim_string_literal, raw_string_literal, interpolated_string_expression'}
            - kind: 'or_pattern, and_pattern, negated_pattern, parenthesized_pattern'
              has: {matches: text-pattern}
    catch-variable:
        kind: catch_clause
        has: {kind: catch_declaration, has: {field: name, pattern: $ERROR}}
    text-comparison:
        any:
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(==|!=)$'}
                - not: {has: {kind: null_literal}}
            - kind: invocation_expression
              has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Contains|StartsWith|EndsWith|Equals|IndexOf|LastIndexOf|IndexOfAny|CompareTo)$'}}
            - kind: invocation_expression
              has: {field: function, any: [{matches: {csharp-owner-member: {type: {regex: '^(string|String)$'}, member: {regex: '^(Equals|Compare|CompareOrdinal)$'}}}}, {matches: {csharp-owner-member: {type: {regex: '^Regex$'}, member: {regex: '^(IsMatch|Match|Matches)$'}}}}]}
            - kind: is_pattern_expression
              has: {field: pattern, matches: text-pattern}
            - kind: switch_expression
              has: {kind: switch_expression_arm, has: {matches: text-pattern}}
rule:
    all:
        - any:
            - kind: invocation_expression
              all:
                - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^(Contains|StartsWith|EndsWith|Equals|IndexOf|LastIndexOf|CompareTo)$'}}
                - has: {field: function, has: {field: expression, kind: 'string_literal, verbatim_string_literal, raw_string_literal'}}
                - has: {field: arguments, has: {kind: argument, has: {matches: message-text}}}
            - kind: invocation_expression
              all:
                - has: {field: function, kind: identifier, pattern: $RELAY}
                - has: {field: arguments, has: {kind: argument, has: {matches: message-text}}}
                - inside:
                    stopBy: end
                    kind: compilation_unit
                    has:
                        stopBy: end
                        kind: method_declaration, local_function_statement
                        all:
                            - has: {field: name, pattern: $RELAY}
                            - has: {field: parameters, has: {kind: parameter, has: {field: type, matches: {csharp-type-name: {name: {regex: '^(string|String)$'}}}}}}
                            - has: {field: body, has: {stopBy: end, matches: text-comparison}}
            - kind: binary_expression
              all:
                - has: {field: operator, regex: '^(==|!=)$'}
                - has: {matches: message-text}
                - not: {has: {kind: null_literal}}
            - kind: invocation_expression
              has:
                field: function
                kind: member_access_expression
                all:
                    - has: {field: name, regex: '^(Contains|StartsWith|EndsWith|Equals|IndexOf|LastIndexOf|IndexOfAny|CompareTo)$'}
                    - has: {field: expression, matches: message-text}
            - kind: invocation_expression
              all:
                - has: {field: function, any: [{matches: {csharp-owner-member: {type: {regex: '^(string|String)$'}, member: {regex: '^(Equals|Compare|CompareOrdinal)$'}}}}, {matches: {csharp-owner-member: {type: {regex: '^Regex$'}, member: {regex: '^(IsMatch|Match|Matches)$'}}}}]}
                - has: {field: arguments, has: {kind: argument, has: {matches: message-text}}}
            - kind: is_pattern_expression
              all:
                - has: {field: expression, matches: message-text}
                - has: {field: pattern, matches: text-pattern}
            - kind: switch_expression
              all:
                - has: {nthChild: 1, matches: message-text}
                - has: {kind: switch_expression_arm, has: {matches: text-pattern}}
            - kind: switch_statement
              all:
                - has: {field: value, matches: message-text}
                - has: {kind: switch_body, has: {kind: switch_section, has: {matches: text-pattern}}}
        - inside:
            stopBy: end
            any:
                - matches: catch-variable
                - matches: exception-element
                - matches: error-binding
message: '`$ERROR` is classified by its message text'
note: 'Classify the error through `IsType<E>()`, `HasException<E>()`, or an `is` pattern, `HasCode(ErrorCodes.<code>)` for a LanguageExt failure'
