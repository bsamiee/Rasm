# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-keychain-add-without-update
language: swift
severity: error
rule:
    pattern: $ARGS
    matches: {swift-security-argument: {subcommand: {regex: '^"add-generic-password"$'}}}
    not: {has: {kind: line_string_literal, regex: '^"-U"$'}}
transform:
    UPDATED: {replace: {source: $ARGS, replace: '"add-generic-password"', by: '"add-generic-password", "-U"'}}
fix: $UPDATED
message: '`add-generic-password` without `-U` adds a second item beside the existing one'
note: 'Pass `-U`, it updates the item in place and keeps its ACL and partition list'
