# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-map-over-string-literals
language: tsx
severity: error
utils:
    literal-list: {matches: {syntax-homogeneous-container: {item: {matches: syntax-string-literal}}}}
    # The list as written, under as const or a readonly cast, or in the parentheses a method call needs around the cast
    literal-list-value:
        any:
            - matches: literal-list
            - kind: as_expression
              has: {matches: literal-list-value}
            - kind: parenthesized_expression
              has: {matches: literal-list-value}
    # Template or concatenation as the body or in a return, a comparison against a string builds nothing
    string-value:
        any:
            - kind: template_string
            - kind: binary_expression
              all: [{has: {field: operator, regex: '^\+$'}}, {has: {kind: string}}]
        # Calls inside the value produce their text at run time
        not: {has: {kind: call_expression, stopBy: end}}
    string-builder:
        any: [{kind: arrow_function}, {kind: function_expression}]
        has:
            field: body
            any:
                - matches: string-value
                - kind: statement_block
                  has: {kind: return_statement, has: {matches: string-value}}
rule:
    any:
        - pattern: $LIST.map($BUILDER)
        - pattern: Array.map($LIST, $BUILDER)
        - pattern: Array.map($BUILDER)($LIST)
        # Trailing $$$ after the comma needs the comma, the one-step pipe takes its own pattern
        - pattern: pipe($LIST, Array.map($BUILDER))
        - pattern: pipe($LIST, Array.map($BUILDER), $$$)
constraints:
    LIST:
        any:
            - matches: literal-list-value
            # Name bound in the file to the literal list, as written or under as const
            - kind: identifier
              inside:
                  kind: program
                  stopBy: end
                  has:
                      stopBy: end
                      kind: variable_declarator
                      all:
                          - has: {field: name, pattern: $LIST}
                          - has: {field: value, matches: literal-list-value}
    BUILDER: {matches: string-builder}
message: The strings the map produces are known when the list is written
note: Write the produced strings as the list, or one brace glob `prefix/{a,b,c}` when the consumer expands globs
labels:
    LIST: {style: primary, message: The literal list}
