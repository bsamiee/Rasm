# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-pair-vec-upsert
language: rust
severity: error
utils:
    lookup:
        kind: call_expression
        any:
            - pattern: $V.iter_mut().find($F)
            - pattern: $V.iter().position($F)
            - pattern: $V.iter_mut().position($F)
    append:
        kind: call_expression
        all:
            - pattern: $V.push($PAIR)
            - has: {field: arguments, has: {nthChild: 1, kind: tuple_expression}}
rule:
    any:
        - kind: if_expression
          all:
            - has: {field: condition, kind: let_condition, has: {field: value, matches: lookup}}
            - has: {field: alternative, kind: else_clause, has: {kind: block, has: {stopBy: end, matches: append}}}
        - kind: match_expression
          all:
            - has: {field: value, matches: lookup}
            - has: {field: body, has: {kind: match_arm, all: [{has: {field: pattern, regex: '^None$'}}, {has: {field: value, any: [{matches: append}, {has: {stopBy: end, matches: append}}]}}]}}
message: '`$V` finds a pair by key and pushes a new pair when absent'
note: 'Hold `indexmap::IndexMap<K, V>` and call `insert(<key>, <value>)`, or `entry(<key>)` to update a present value, the map keeps one entry per key in insertion order and looks keys up by hash'
