# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-bool-result-branch
language: rust
severity: error
utils:
    comment:
        kind: 'line_comment, block_comment'
    primary:
        kind: 'identifier, self, field_expression, call_expression, macro_invocation, parenthesized_expression, index_expression, boolean_literal, scoped_identifier, try_expression, await_expression'
    compound:
        not: {any: [{matches: primary}, {kind: 'let_condition, let_chain'}]}
    unit-ok:
        matches: {rust-single-statement: {first: {pattern: Ok(())}}}
    error-arm:
        matches: {rust-single-statement: {first: {pattern: Err($E)}}}
    ok-first:
        all:
            - has: {field: consequence, matches: unit-ok}
            - has: {field: alternative, kind: else_clause, has: {kind: block, matches: error-arm}}
    error-first:
        all:
            - has: {field: consequence, matches: error-arm}
            - has: {field: alternative, kind: else_clause, has: {kind: block, matches: unit-ok}}
    negation:
        kind: unary_expression
        regex: '^!'
rule:
    kind: if_expression
    all:
        - not: {has: {stopBy: end, matches: comment}}
        - not: {inside: {kind: else_clause}}
        - not: {matches: rust-const-context}
        - any:
            - all: [{matches: ok-first}, {has: {field: condition, matches: primary, pattern: $P}}]
            - all: [{matches: ok-first}, {has: {field: condition, matches: compound, pattern: $Q}}]
            - all: [{matches: error-first}, {has: {field: condition, matches: negation, has: {nthChild: 1, matches: primary, pattern: $P}}}]
            - all: [{matches: error-first}, {has: {field: condition, matches: negation, has: {nthChild: 1, matches: compound, pattern: $Q}}}]
            - all: [{matches: error-first}, {has: {field: condition, not: {matches: negation}, matches: primary, pattern: $NP}}]
            - all: [{matches: error-first}, {has: {field: condition, not: {matches: negation}, matches: compound, pattern: $NQ}}]
transform:
    QW: {replace: {source: $Q, replace: '^([\s\S]+)$', by: '($1)'}}
    NPW: {replace: {source: $NP, replace: '^([\s\S]+)$', by: '(!$1)'}}
    NQW: {replace: {source: $NQ, replace: '^([\s\S]+)$', by: '(!($1))'}}
fix: '$P$QW$NPW$NQW.ok_or_else(|| $E)'
message: '`if` chooses between `Ok(())` and `Err($E)` by hand'
note: 'Write `<condition>.ok_or_else(|| <error>)` (`bool::ok_or_else`, Rust 1.98), clippy `unnecessary_lazy_evaluations` then reduces an eager-safe error to `ok_or(<error>)`, a `const fn`, an `else if` arm, and an `if` holding a comment stay as written'
