# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-forwarding-shell-function
language: bash
severity: error
ignores: ["**/*.json"]
rule:
    kind: function_definition
    not: {has: {field: redirect, pattern: $$_REDIRECT}}
    all:
        - has: {field: name, pattern: $NAME}
        - has:
            field: body
            kind: compound_statement
            matches: bash-single-command-body
            has:
                kind: command
                pattern: $CALL
                has:
                    kind: string
                    regex: '^"\$(\{@\}|@)"$'
                    nthChild: {position: 1, reverse: true}
                    follows: {matches: {bash-invoked-name: {name: {regex: '^[A-Za-z0-9_./-]+$'}, runner: {regex: '^(builtin|command)$'}}}}
message: 'The function `$NAME` forwards every argument unchanged to `$CALL`'
note: Call the owning command directly, and keep adapters that select, join, reorder, default, or add arguments
