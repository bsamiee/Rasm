# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-preview-provider
language: swiftlang
severity: error
rule:
    kind: inheritance_specifier
    regex: '^(SwiftUI\.)?PreviewProvider$'
message: '`PreviewProvider` conformance declares a type to hold a preview in its `previews` property'
note: 'Write `#Preview("<name>") { <view> }` at file scope, one macro per preview'
