id: require-private-false-on-host-reference
valid:
    - |
      <Reference Include="@(_RhinoHostAssembly)" HintPath="$(RhinoAssemblyDirectory)%(Identity).dll" Private="false" />
    - |
      <Reference Include="Eto"><HintPath>$(EtoReferencePath)</HintPath><Private>false</Private></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)"><Private>false</Private></Reference>
    - |
      <Reference Include="System.Windows.Forms" />
    - |
      <ItemGroup><_HostAssembly Include="RhinoCommon" HintPath="$(RhinoAssemblyDirectory)RhinoCommon.dll" /></ItemGroup>
    - |
      <Reference Include='Eto' HintPath='$(EtoReferencePath)' Private='false' />
    - |
      <Reference Include="Newtonsoft.Json" HintPath="../packages/Newtonsoft.Json.13.0.3/lib/netstandard2.0/Newtonsoft.Json.dll" />
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)"><Private>build</Private><Private>false</Private></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)" Private="false"><Other>other</Other></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)" Private="false"><Private Condition="false">false</Private></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)"><Private>false</Private><Other>other</Other></Reference>
    - |
      <Reference Other="Eto" HintPath="$(EtoReferencePath)" />
    - |
      <Reference Include="Eto" />
    - |
      <Reference Include="RhinoCommon, Version=8.0.0.0, Culture=neutral" HintPath="$(RhinoAssemblyDirectory)RhinoCommon.dll" Private="false" />
    - |
      <Reference Include="RhinoCommon"><HintPath>$(RhinoAssemblyDirectory)RhinoCommon.dll</HintPath><Private>False</Private></Reference>
    - |
      <Reference Include="RhinoCommon"><HintPath></HintPath></Reference>
    - |
      <Reference Include="Grasshopper2;GrasshopperIO" HintPath="$(Grasshopper2PluginPath)%(Identity).dll" Private="false" />
    - |
      <Reference Include="EtoForms" HintPath="$(LibraryPath)EtoForms.dll" />
    - |
      <Reference Include="Grasshopper2X" HintPath="$(LibraryPath)Grasshopper2X.dll" />
invalid:
    - |
      <Reference Include='RhinoCommon' HintPath='$(RhinoAssemblyDirectory)RhinoCommon.dll' />
    - |
      <Reference Include="RhinoCommon" HintPath="$(RhinoAssemblyDirectory)RhinoCommon.dll" />
    - |
      <Reference Include="Eto"><HintPath>$(EtoReferencePath)</HintPath><Private>true</Private></Reference>
    - |
      <Reference Include="RhinoCommon"><HintPath>$(RhinoCommonReferencePath)</HintPath><Private>$(HostReferencePrivate)</Private></Reference>
    - |
      <Reference Include="RhinoCommon" HintPath="$(RhinoAssemblyDirectory)RhinoCommon.dll" SpecificVersion="false" />
    - |
      <Reference Include="Eto"><HintPath>$(EtoReferencePath)</HintPath></Reference>
    - |
      <Reference Include="Eto"><HintPath>$(EtoReferencePath)</HintPath><Private Condition="'$(CopyHost)' == 'true'">true</Private></Reference>
    - |
      <Reference Include = "Eto" HintPath = "$(EtoReferencePath)" Note=' Private="kept" >' Private = "true" />
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)"><Private Condition="'$(Pin)' == 'true'">false</Private></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)"><Private>false</Private><Private>other</Private></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)"><Other>false</Other></Reference>
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)" Private="false"><Private>other</Private></Reference>
    - |
      <Reference Include="RhinoCommon, Version=8.0.0.0, Culture=neutral" HintPath="$(RhinoAssemblyDirectory)RhinoCommon.dll" />
    - |
      <Reference Include="Eto" HintPath="$(EtoReferencePath)" Private="true" />
    - |
      <Reference Include="Eto"><HintPath>$(EtoReferencePath)</HintPath><Private>false</Private><Private Condition="'$(Copy)' == 'true'">true</Private></Reference>
    - |
      <Reference Include="Rhino.UI" HintPath="$(RhinoAssemblyDirectory)Rhino.UI.dll" />
    - |
      <Reference Include="Eto.macOS"><HintPath>$(RhinoAssemblyDirectory)Eto.macOS.dll</HintPath></Reference>
    - |
      <Reference Include="Grasshopper2;GrasshopperIO" HintPath="$(Grasshopper2PluginPath)%(Identity).dll" />
    - |
      <Reference Include="Grasshopper;GH_IO" HintPath="$(GrasshopperPluginPath)%(Identity).dll" />
