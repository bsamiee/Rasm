    - {id: after, rule: {kind: variable_declarator, follows: {stopBy: end, kind: variable_declarator, has: {field: name, pattern: {context: 'class $NAME;', selector: identifier}}}}, fix: {template: "\n", expandStart: {regex: '^,$'}}}
    - {id: value, rule: {kind: variable_declarator, not: {has: {kind: bracketed_argument_list}}, has: {field: name, pattern: {context: 'class $DECLARED;', selector: identifier}}}, fix: $DECLARED}
    - {id: trivia, rule: {kind: 'comment, preproc_region, preproc_endregion, preproc_line, preproc_pragma, preproc_nullable, preproc_error, preproc_warning, preproc_define, preproc_undef'}, fix: "\n"}
transform:
    HEADER: rewrite($DECLARATION, rewriters=[before, after, value, trivia])
    LINES: {replace: {source: $HEADER, replace: '(?:;|[\t-\r \x{A0}\x{3000}\x{FEFF}])+$|[\t-\r \x{A0}\x{3000}\x{FEFF}]*\n[\t-\r \x{A0}\x{3000}\x{FEFF}]*|#(?:if|endif)[^\n]*|#el(?:if|se)(?s:.)*?#endif', by: "\n "}}
    SIGNATURE: {replace: {source: $LINES, replace: '([(\[<.])(?:\n )+|(?:\n )+([)\]>.,;])|^(?:\n )+|(?:\n )+$|(?:\n )*\n( )', by: '$1$2$3'}}
name: $NAME
signature: $SIGNATURE
isExported: false
---
id: csharp-error
language: csharplang
role: item
symbolType: 'null'
rule:
    any:
        - {kind: ERROR, not: {has: {stopBy: end, kind: 'using_directive, extern_alias_directive, file_based_directive, namespace_declaration, file_scoped_namespace_declaration, interface_declaration, class_declaration, record_declaration, struct_declaration, enum_declaration, union_declaration, delegate_declaration, local_function_statement, local_declaration_statement'}}}
        - {kind: 'identifier, comment', all: [{inside: {kind: ERROR}}, {nthChild: {position: 1, ofRule: {kind: 'identifier, comment'}}}]}
name: ERROR
signature: ''
isImport: false
isExported: false
---
id: csharp-member-constructor
language: csharplang
role: member
symbolType: constructor
parentRuleIds: [csharp-class, csharp-struct, csharp-interface, csharp-enum, csharp-function]
utils:
