# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-validated-to-option
language: csharp
severity: error
ignores: ['tools/roslyn/**']
rule:
    kind: invocation_expression
    all:
        - has: {field: function, kind: member_access_expression, has: {field: name, regex: '^ToOption$'}}
        - has:
            field: function
            has:
                field: expression
                kind: invocation_expression
                pattern: $VALIDATION
                has:
                    field: function
                    any:
                        - kind: member_access_expression
                          has: {field: name, regex: '^Validated$'}
                        - matches: {csharp-owner-member: {type: {regex: '^ValidationResults$'}, member: {regex: '^ToFin$'}}}
message: '`$VALIDATION.ToOption()` spells validated-or-absent through a result'
note: 'Call `<type>.TryCreate(<value>, out <type>? <item>)` and lift `<item>` through `Optional`'
