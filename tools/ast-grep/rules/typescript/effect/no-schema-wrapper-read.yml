# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-schema-wrapper-read
language: tsx
severity: error
rule:
    kind: member_expression
    pattern: $READ
    all:
        - has: {field: property, regex: '^(schema|to|from)$'}
        - has:
            field: object
            kind: member_expression
            all:
                - has: {field: object, kind: member_expression, has: {field: property, regex: '^fields$'}}
                - has: {field: property, pattern: $FIELD}
message: '`$READ` reads a schema through the wrappers its `$FIELD` field adds'
note: 'Declare the inner schema as a named module value that the field and every reader share'
