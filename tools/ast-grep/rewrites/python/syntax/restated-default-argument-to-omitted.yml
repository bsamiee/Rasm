# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: restated-default-argument-to-omitted
language: python
severity: off
rule:
    kind: call
    pattern: $FN($$$ARGS)
    has: {field: arguments, has: {matches: python-restated-default-argument}}
    not:
        has:
            field: arguments
            any:
                - has: {kind: comment}
                - has:
                    kind: string
                    matches: python-restated-default-argument
                    precedes: {pattern: $_, not: {kind: keyword_argument}, stopBy: end}
rewriters:
    - id: kept
      rule: {pattern: $ARG, inside: {kind: argument_list}, not: {matches: python-restated-default-argument}}
      fix: $ARG
transform:
    KEPT: {rewrite: {source: $$$ARGS, rewriters: [kept], joinBy: ', '}}
fix: $FN($KEPT)
message: '`$FN` is called with an argument its documented default holds'
note: The call keeps every other argument in order and drops the restated default, a list with a comment or a positional argument after the dropped one is edited by hand
