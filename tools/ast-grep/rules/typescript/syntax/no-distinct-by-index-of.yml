# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-distinct-by-index-of
language: tsx
severity: error
utils:
    same-list:
        kind: call_expression
        all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $L}}, {has: {field: property, regex: '^indexOf$'}}]}
            - has: {field: arguments, has: {pattern: $X, nthChild: 1}}
    first-index-test:
        kind: binary_expression
        all:
            - has: {field: operator, regex: '^===?$'}
            - any:
                - all: [{has: {field: left, matches: same-list}}, {has: {field: right, pattern: $I}}]
                - all: [{has: {field: left, pattern: $I}}, {has: {field: right, matches: same-list}}]
    native-set:
        kind: new_expression
        all:
            - has: {field: constructor, regex: '^(globalThis\.)?Set$', matches: syntax-global-reference}
            - has: {field: arguments, all: [{has: {nthChild: 1, pattern: $L}}, {not: {has: {nthChild: 2}}}]}
rule:
    any:
        - kind: call_expression
          all:
            - has: {field: function, kind: member_expression, all: [{has: {field: object, pattern: $L}}, {has: {field: property, regex: '^filter$'}}]}
            - has:
                field: arguments
                has:
                    kind: arrow_function
                    all:
                        - has: {field: parameters, all: [{has: {nthChild: 1, has: {kind: identifier, pattern: $X}}}, {has: {nthChild: 2, has: {kind: identifier, pattern: $I}}}]}
                        - has: {field: body, matches: first-index-test}
        - kind: array
          all:
            - has: {nthChild: 1, kind: spread_element, has: {matches: native-set}}
            - not: {has: {nthChild: 2}}
        - kind: call_expression
          all:
            - has: {field: function, regex: '^(globalThis\.)?Array\.from$', matches: syntax-global-reference}
            - has: {field: arguments, all: [{has: {nthChild: 1, matches: native-set}}, {not: {has: {nthChild: 2}}}]}
message: '`$L` is deduplicated by hand'
note: '`Array.dedupe(<list>)` keeps the first of each value by structural `Equal`, a `Set` by identity, and `indexOf` drops every `NaN`'
