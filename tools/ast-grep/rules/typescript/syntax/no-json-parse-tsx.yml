# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-json-parse-tsx
language: tsx
severity: error
ignores: ['plugins/function-hooks/**']
utils:
    thunk-call:
        kind: call_expression
        has: {field: function, matches: {effect-module-member: {module: {regex: '\bEffect$'}, member: {regex: '^(sync|promise|callback|suspend|try|tryPromise)$'}}}}
    effect-context:
        any:
            - matches: effect-generator-function
            - kind: arrow_function, function_expression
              nthChild: 1
              inside: {kind: arguments, inside: {matches: thunk-call}}
            - kind: arrow_function, function_expression
              inside:
                kind: pair
                field: value
                has: {field: key, regex: '^try$'}
                inside: {kind: object, nthChild: 1, inside: {kind: arguments, inside: {matches: thunk-call, has: {field: function, has: {field: property, regex: '^try(Promise)?$'}}}}}
rule:
    kind: call_expression
    any:
        - has: {field: function, pattern: $PARSE, regex: '^((globalThis|window|self)\.)?JSON\.parse$', matches: typescript-global-reference}
          not:
            all:
                - has: {field: function, regex: '^JSON\.parse$'}
                - inside: {matches: effect-context, stopBy: {matches: typescript-function-boundary}}
        - all:
            - has: {field: function, pattern: $PARSE, kind: member_expression, has: {field: property, regex: '^json$'}}
            - not: {has: {field: arguments, has: {pattern: $_, not: {kind: comment}}}}
message: '`$PARSE` parses JSON into an unvalidated `any`'
note: '`Schema.decodeUnknownEffect(Schema.fromJsonString(<schema>))` over the body text parses and validates in one step into the typed value or a `SchemaError`'
