# --- [PACKAGE] --------------------------------------------------------------------------

[package]
name                 = "rasm-regression"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
keywords             = ["regression", "least-squares", "fitting"]
categories           = ["mathematics", "science"]
description          = "Regression over weighted observations: polynomial, nonlinear, and separable fits with estimators, uncertainty, influence, and prediction bands"

# --- [TARGETS] --------------------------------------------------------------------------

[lib]
path    = "lib.rs"
test    = false
doctest = false
bench   = false

# --- [DEPENDENCIES] ---------------------------------------------------------------------

[dependencies]
rayon                   = { workspace = true }
nonempty-collections    = { workspace = true }
thiserror               = { workspace = true }
validated               = { workspace = true }
itertools               = { workspace = true }
serde                   = { workspace = true }
almost                  = { workspace = true }
faer                    = { workspace = true }
nalgebra                = { workspace = true }
num-dual                = { workspace = true }
statrs                  = { workspace = true }
basin                   = { workspace = true, features = ["nalgebra"] }
rasm-stats              = { workspace = true }
rasm-numerical-analysis = { workspace = true }

# --- [LINTS] ----------------------------------------------------------------------------

[lints]
workspace = true
