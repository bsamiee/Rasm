name: CI

on:
    pull_request: {}
    push:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

env:
    UV_LOCKED: "true"
    NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

jobs:
    linux:
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0
            - &shas
              uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
            - &setup
              id: setup
              uses: ./.github/actions/setup
              with:
                  cache-server: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
            - run: nx sync:check
            - run: playwright install --with-deps --only-shell chromium
            - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
            - run: nx affected --targets=check,test,build
              env:
                  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: &server ${{ steps.setup.outputs.cache == 'true' && secrets.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}

    macos:
        runs-on: xcode-27
        timeout-minutes: 60
        steps:
            - *checkout
            - *shas
            - *setup
            - run: nx affected --targets=check,test,build --exclude='*,!tag:os:darwin'
              env:
                  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: *server
                  APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
                  APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
