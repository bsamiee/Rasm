language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol]
symbolType: method
rule:
    kind: &declaration 'function_declaration, protocol_function_declaration'
    pattern: $DECLARATION
    inside: &scope {kind: 'source_file > :is(class_declaration, protocol_declaration) > :is(class_body, enum_class_body, protocol_body)'}
    has: {field: name, pattern: $$NAME}
rewriters:
    - id: body
      rule: {kind: function_body, inside: {kind: *declaration, inside: *scope}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
name: $NAME
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
        - not:
              any:
                  - has: &private {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}
                  - inside:
                        kind: class_body
                        inside:
                            kind: class_declaration
                            has:
                                field: declaration_kind
                                regex: '^extension$'
                                follows: {all: [*private], stopBy: {pattern: $_, not: {kind: 'comment, multiline_comment'}}}

---
id: swift-member-initializer
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol]
symbolType: constructor
rule:
    kind: &declaration init_declaration
    pattern: $DECLARATION
    inside: &scope {kind: 'source_file > :is(class_declaration, protocol_declaration) > :is(class_body, enum_class_body, protocol_body)'}
rewriters:
    - id: body
      rule: {kind: function_body, inside: {kind: *declaration, inside: *scope}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
name: init
signature: $SIGNATURE
isPublic:
    any:
        - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
        - not:
              any:
                  - has: &private {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}
                  - inside:
                        kind: class_body
                        inside:
                            kind: class_declaration
                            has:
                                field: declaration_kind
                                regex: '^extension$'
                                follows: {all: [*private], stopBy: {pattern: $_, not: {kind: 'comment, multiline_comment'}}}

---
id: swift-member-deinitializer
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object]
symbolType: constructor
rule:
    kind: &declaration deinit_declaration
    pattern: $DECLARATION
    inside: &scope {kind: 'source_file > :is(class_declaration, protocol_declaration) > :is(class_body, enum_class_body, protocol_body)'}
    not: {inside: {kind: class_body, inside: {kind: class_declaration, has: {field: declaration_kind, regex: '^extension$'}}}}
rewriters:
    - id: body
      rule: {kind: function_body, inside: {kind: *declaration, inside: *scope}}
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
name: deinit
signature: $SIGNATURE

---
id: swift-member-subscript
language: swiftlang
role: member
parentRuleIds: [swift-class, swift-struct, swift-enum, swift-object, swift-protocol]
symbolType: method
rule:
    kind: &declaration subscript_declaration
    pattern: $DECLARATION
    inside: &scope {kind: 'source_file > :is(class_declaration, protocol_declaration) > :is(class_body, enum_class_body, protocol_body)'}
    any:
        - has: {kind: computed_property, pattern: $ACCESSOR_BODY, has: {kind: 'computed_getter, computed_setter, computed_modify, computed_init'}}
        - has: {kind: computed_property, has: {pattern: $$IMPLICIT_TOKEN, regex: '^\{$'}, not: {has: {kind: 'computed_getter, computed_setter, computed_modify, computed_init'}}}
rewriters:
    - id: body
      rule: {kind: computed_property, inside: {kind: *declaration, inside: *scope}}
      fix: ''
    - id: accessor
      rule:
          kind: &accessor 'computed_getter, computed_setter, computed_modify, computed_init'
          pattern: $ACCESSOR_DECLARATION
          inside: {kind: computed_property, inside: {kind: *declaration, inside: *scope}}
      transform:
          ACCESSOR_HEADER: {rewrite: {source: $ACCESSOR_DECLARATION, rewriters: [accessor-body]}}
          ACCESSOR_SIGNATURE: {replace: {source: $ACCESSOR_HEADER, replace: '\s+$', by: ''}}
      fix: $ACCESSOR_SIGNATURE
    - id: accessor-body
      rule:
          all:
              - inside:
                    kind: *accessor
                    inside: {kind: computed_property, inside: {kind: *declaration, inside: *scope}}
              - any:
                  - kind: statements
                  - regex: '^[{}]$'
      fix: ''
transform:
    HEADER: {rewrite: {source: $DECLARATION, rewriters: [body]}}
    SIGNATURE: {replace: {source: $HEADER, replace: '\s+$', by: ''}}
    ACCESSORS: {rewrite: {source: $ACCESSOR_BODY, rewriters: [accessor], joinBy: ' '}}
    COMPUTED: {replace: {source: $ACCESSORS, replace: '(?s)^(.+)$', by: ' { $1 }'}}
    IMPLICIT: {replace: {source: $IMPLICIT_TOKEN, replace: '^\{$', by: ' { get }'}}
name: subscript
signature: $SIGNATURE$COMPUTED$IMPLICIT
isPublic:
    any:
        - has: {kind: modifiers, has: {kind: visibility_modifier, regex: '^(public|open|package|internal)$'}}
        - not:
              any:
                  - has: &private {kind: modifiers, has: {kind: visibility_modifier, regex: '^(private|fileprivate)$'}}
                  - inside:
                        kind: class_body
                        inside:
                            kind: class_declaration
                            has:
                                field: declaration_kind
                                regex: '^extension$'
                                follows: {all: [*private], stopBy: {pattern: $_, not: {kind: 'comment, multiline_comment'}}}
