# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-article-summary-tsx
language: tsx
severity: error
rule:
    kind: comment
    pattern: $SUMMARY
    regex: '^/\*\*[\s*]*(?i:The|A|An)\s+\S'
    not: {inside: {kind: ambient_declaration, stopBy: end}}
transform:
    OPENING: {replace: {source: $SUMMARY, replace: '^(/\*\*[\s*]*?)(?i:The|A|An)\s+[\s\S]*$', by: '$1'}}
    REST: {replace: {source: $SUMMARY, replace: '^/\*\*[\s*]*?(?i:The|A|An)\s+', by: ''}}
    NOUN: {convert: {source: $REST, toCase: capitalize}}
    LINE: {replace: {source: $SUMMARY, replace: '^/\*\*[\s*]*([^\n]*?)\s*(?:\*/)?\s*(?:\n[\s\S]*)?$', by: '$1'}}
message: 'Doc comment summary `$LINE` opens with an article'
note: 'Open the summary with the noun it names or the verb it performs'
fix: $OPENING$NOUN
