# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: rust-geometry-format-text
language: rustlang
utils:
    parsed:
        any:
            - inside: {field: value, kind: field_expression, has: {field: field, regex: '^parse$'}}
            - inside:
                kind: arguments
                inside: {kind: call_expression, has: {field: function, regex: '(^|::|\.)(from_str|from_slice|from_reader|from_wkt|try_from_wkt_str|parse)$'}}
    geojson-type:
        kind: string_literal
        regex: '^"(Feature|FeatureCollection|GeometryCollection|Point|MultiPoint|LineString|MultiLineString|Polygon|MultiPolygon)"$'
    geojson:
        any:
            - matches: geojson-type
              follows: {regex: '^:$', follows: {kind: string_literal, regex: '^"type"$'}}
            - matches: geojson-type
              inside: {kind: arguments, all: [{has: {nthChild: 1, kind: string_literal, regex: '^"type"$'}}, {not: {has: {nthChild: 3}}}]}
            - regex: '\\?"type\\?"\p{Pattern_White_Space}*:\p{Pattern_White_Space}*\\?"(Feature|FeatureCollection|GeometryCollection|Point|MultiPoint|LineString|MultiLineString|Polygon|MultiPolygon)\\?"'
    wkt:
        regex: '^r?#*"(SRID=[^;"]*;)?(POINT|LINESTRING|POLYGON|MULTIPOINT|MULTILINESTRING|MULTIPOLYGON|GEOMETRYCOLLECTION|TRIANGLE|TIN|POLYHEDRALSURFACE)( ?(Z|M|ZM))? ?(\(|EMPTY(?-u:\b))'
    svg-move:
        kind: string_literal
        regex: '^"(\p{Pattern_White_Space}*|.*(?-u:\b)d=\\")[Mm] ?\{[^{}]*\}[ ,]\p{Pattern_White_Space}*\{[^{}]*\}'
    svg:
        any:
            - matches: svg-move
            - regex: '^"\p{Pattern_White_Space}*[LlCcQqSsTt] ?\{[^{}]*\}[ ,]\p{Pattern_White_Space}*\{[^{}]*\}'
              inside: {kind: function_item, stopBy: {kind: function_item}, has: {stopBy: end, matches: svg-move}}
    stl:
        regex: '^b?"\p{Pattern_White_Space}*(facet normal|outer loop|endfacet|endloop|endsolid)(?-u:\b)'
    obj:
        any:
            - regex: '^"f "$'
              inside: {kind: function_item, stopBy: {kind: function_item}, has: {stopBy: end, kind: string_literal, regex: '^"v "$'}}
            - regex: '^"f"$'
              inside: {kind: function_item, stopBy: {kind: function_item}, has: {stopBy: end, kind: string_literal, regex: '^"v[nt]"$'}}
    ply:
        regex: '^b?"\p{Pattern_White_Space}*(ply(\\r)?\\n|end_header|element vertex(?-u:\b)|format (ascii|binary_little_endian|binary_big_endian) 1\.0)'
rule:
    kind: 'string_literal, raw_string_literal'
    all:
        - any:
            - matches: geojson
            - matches: wkt
            - matches: svg
            - matches: stl
            - matches: obj
            - matches: ply
        - not: {matches: parsed}
        - not: {matches: rust-test-scope}
