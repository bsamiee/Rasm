# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/project.json
# Structural rules per language under tools/ast-grep, the root lint target runs the rule tests and every project lint target scans its root
ruleDirs:
    - tools/ast-grep/rules
    - tools/ast-grep/rewrites # severity: off, loaded by --error=<id> on demand and by ast-grep test --include-off
utilDirs:
    - tools/ast-grep/utils
testConfigs:
    - testDir: tools/ast-grep/tests
languageGlobs:
    tsx: ['*.ts', '*.mts', '*.cts'] # tsx grammar parses every TypeScript file, so one rule under language tsx covers .ts and .tsx sources
    xml: ['NuGet.config']           # Root MSBuild and NuGet file the extension list cannot reach
customLanguages:
    xml:
        libraryPath: .cache/ast-grep/xml.so # Written by the root grammar target, every ast-grep run aborts until it exists
        extensions: [csproj, props, targets, slnx, nuspec, pubxml, proj]
        expandoChar: _ # XML names reject $, and _ is the one name character a metavariable in tag and attribute position parses as
languageInjections: # The bash rules read every shell string a host file holds, scan -U writes one injected region per pass
    - hostLanguage: yaml # Workflow and composite action run steps
      rule:
          kind: block_mapping_pair
          all:
              - has: {field: key, regex: '^run$'}
              - has: {field: value, pattern: $CONTENT} # A block scalar keeps its | indicator, the parser reads past it
      injected: bash
    - hostLanguage: json # Hook commands in .claude/settings.json and the command strings of nx.json and package.json targets
      rule:
          kind: pair
          all:
              - has: {field: key, regex: '^"command"$'}
              - has: {field: value, kind: string, has: {kind: string_content, pattern: $CONTENT}} # The content alone, the quotes stay JSON
      injected: bash
