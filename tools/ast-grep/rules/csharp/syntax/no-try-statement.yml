# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-try-statement
language: csharp
severity: error
rule:
    kind: try_statement
    not:
        all:
            - has: {kind: finally_clause}
            - not: {has: {kind: catch_clause}}
            - inside: {stopBy: {kind: 'method_declaration, local_function_statement, lambda_expression, anonymous_method_expression'}, matches: csharp-disposal-boundary}
message: '`try` statement handles an exception inline'
note: Capture the throwing call with `Try.lift` or `IO.lift` at its boundary and release through `use` or `Bracket`. A native `Dispose` boundary uses `try`/`finally` to release its owned fields and base even when release throws
