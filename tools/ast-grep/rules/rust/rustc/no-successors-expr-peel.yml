# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
language: rustlang
severity: error
files: [tools/dylint/**]
rule:
    kind: call_expression
    any:
        - pattern: iter::successors(Some($E), $STEP).last()
        - pattern: core::iter::successors(Some($E), $STEP).last()
        - pattern: std::iter::successors(Some($E), $STEP).last()
constraints:
    STEP: {kind: closure_expression, regex: '(?-u:\b)ExprKind::'}
message: '`successors(..).last()` peels `$E` to its innermost expression by hand'
note: 'Call `clippy_utils::peel_hir_expr_while(<expr>, <step>)` and delete the `Option` unwrap after `last()`'
