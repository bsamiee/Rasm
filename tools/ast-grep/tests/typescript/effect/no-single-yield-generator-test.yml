id: no-single-yield-generator
valid:
    # The effect itself
    - 'const loaded = load(path);'
    # Two dependent yields
    - 'const loaded = Effect.gen(function* () { const config = yield* load(path); return yield* decode(config); });'
    # One yield and a computed return, a map
    - 'const loaded = Effect.gen(function* () { const config = yield* load(path); return config.name; });'
    # One yield returned after a statement
    - 'const loaded = Effect.gen(function* () { report(); return yield* load(path); });'
    # Comment beside the one yield, the fix drops it
    - 'const loaded = Effect.gen(function* () { /* the load */ return yield* load(path); });'
    # Generator with a parameter under Effect.fn, the span names the function
    - 'const load = Effect.fn("load")(function* (path) { return yield* read(path); });'
    # Gen on a module outside the carrier set
    - 'const item = Item.gen(function* () { return yield* load(path); });'
    # No yield, a pure return
    - 'const held = Effect.gen(function* () { return 1; });'
    # Discarded yield on Either, no asVoid member and the generator stays
    - 'const held = Either.gen(function* () { yield* decoded; });'
    # Bound yield returned under another name
    - 'const loaded = Effect.gen(function* () { const config = yield* load(path); return other; });'
    # Two discarded yields
    - 'const done = Effect.gen(function* () { yield* load(path); yield* save(path); });'
    # Bound yield with a statement between the binding and the return
    - 'const loaded = Effect.gen(function* () { const config = yield* load(path); report(config); return config; });'
    # The overload binding this, the body reads the receiver and the yielded effect outside it reads another this
    - 'const loaded = Effect.gen(this, function* () { return yield* this.load(path); });'
invalid:
    # The instance, one yield returned
    - 'const loaded = Effect.gen(function* () { return yield* load(path); });'
    # One yield discarded, the answer is void
    - 'const done = Effect.gen(function* () { yield* load(path); });'
    # One yield bound and returned
    - 'const loaded = Effect.gen(function* () { const config = yield* load(path); return config; });'
    # Micro sibling
    - 'const loaded = Micro.gen(function* () { return yield* load(path); });'
    # STM sibling
    - 'const loaded = STM.gen(function* () { return yield* load(path); });'
    # Option sibling
    - 'const found = Option.gen(function* () { return yield* head(rows); });'
    # Either sibling
    - 'const decoded = Either.gen(function* () { return yield* parse(raw); });'
    # Option discarded yield, Option.asVoid
    - 'const done = Option.gen(function* () { yield* found; });'
    # Micro discarded yield
    - 'const done = Micro.gen(function* () { yield* load(path); });'
