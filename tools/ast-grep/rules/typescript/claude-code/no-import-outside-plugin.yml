# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-import-outside-plugin
language: tsx
severity: error
files:
    - '**/.claude/plugins/**/hooks/**'
ignores:
    - '**/*.spec.ts'
rule:
    kind: string
    pattern: $MATCH
    any:
        - {inside: {kind: import_statement, field: source}}
        - {inside: {kind: export_statement, field: source}}
        - {inside: {kind: import_require_clause, field: source}}
        - nthChild: 1
          inside:
            kind: arguments
            inside: {kind: call_expression, has: {field: function, regex: ^(require|import)$}}
    not: {regex: '^[''"](claude-code|\.\.?/.*\.ts)[''"]$'}
message: The module imports `$MATCH` and the loader accepts `claude-code` and relative `.ts` paths alone
note: Import the plugin API from `claude-code` and every other module by its relative `.ts` path, `import { fold } from './decision.ts'`
labels: {MATCH: {style: primary}}
