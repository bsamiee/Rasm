# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-parse-error-java
language: java
severity: error
utils:
    unreported:
        any:
            - inside: {kind: ERROR, stopBy: end}
            - matches: java-multi-pattern-case-label
rule:
    any:
        - kind: ERROR
          not: {matches: unreported}
        - kind: program
          has: {stopBy: end, pattern: $$MISSING, regex: '^$', not: {matches: unreported}}
labels:
    MISSING: {style: primary, message: Token the grammar inserted to recover}
message: Grammar failed to parse the span
note: >-
    Use a form the grammar parses, every other rule skips constructs inside a parse error. Unreported tree-sitter-java grammar gaps are `case` labels with more than one pattern (`case A _, B _ ->`)
