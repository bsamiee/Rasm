# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-lint-suppression
language: rust
severity: error
utils:
    suppression:
        kind: identifier
        regex: '^(allow|expect|automatically_derived)$'
rule:
    pattern: $ATTRIBUTE
    any:
        - kind: 'attribute_item, inner_attribute_item'
          not: {inside: {kind: source_file, stopBy: end, regex: '^[(\[]'}}
          has:
            kind: attribute
            any:
                - has: {nthChild: 1, matches: suppression}
                - all:
                    - has: {nthChild: 1, kind: identifier, regex: '^cfg_attr$'}
                    - has: {field: arguments, has: {stopBy: end, matches: suppression, follows: {regex: '^,$'}}}
        - kind: token_tree
          regex: '^\[\s*((allow|expect)\s*\(|automatically_derived\s*\]|cfg_attr\s*\([\s\S]*,\s*(allow|expect|automatically_derived)\b)'
          follows: {regex: '^(#|!)$'}
message: '`$ATTRIBUTE` silences lints in place of fixing the code they report'
note: 'Fix the reported code, delete the item a dead-code or unused lint reports, write the impl a derive generates as the derive, and set a level in `[workspace.lints]` only for a finding no code change clears'
