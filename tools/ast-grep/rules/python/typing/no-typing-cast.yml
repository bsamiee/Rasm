# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-typing-cast
language: python
severity: error
utils:
    cast-function:
        matches: {python-member-use: {module: {regex: '^(typing|typing_extensions)$'}, name: {regex: '^cast$'}}}
rule:
    kind: call
    pattern: $CALL
    all:
        - has:
            field: function
            any:
                - matches: cast-function
                - kind: identifier
                  matches: {python-assigned-name: {value: {matches: cast-function}}}
        - has: {field: arguments, has: {nthChild: 2, pattern: $VALUE}, not: {has: {nthChild: 3}}}
fix: $VALUE
message: '`$CALL` asserts a type the checker cannot infer'
note: 'Pass the value typed where it is produced, a cast overrides the checker with no runtime check'
